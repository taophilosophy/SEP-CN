      Among those versions of strict nominalism that do not posit entities that serve as the extension of “property” and similar predicates are austere, predicate, concept, and metalinguistic nominalisms.
    step1: |-
      在那些不设定充当"属性"之类谓词外延的实体的严格唯名论版本中，有朴素、谓词、概念与元语言唯名论。
    step2: |-
      在那些不设定实体的严格唯名论版本中——即不设定充当"属性"之类谓词外延的实体——有朴素唯名论、谓词唯名论、概念唯名论与元语言唯名论。
  - id: 88
    kind: body
    source: |-
      The key idea behind *austere nominalism*—sometimes called ‘ostrich’ nominalism (originally a pejorative jab by Armstrong 1978)[^armstrong-1978]—is that no underlying metaphysical structure is needed in order to explain that individuals are qualitatively classifiable, for example, that a stop sign or an apple is red, or that both are (equally) red (see Quine 1948, Devitt 1980, Van Cleve 1994, Parsons 1999, Imaguire 2014)[^devitt-1980][^imaguire-2014][^parsons-1999][^quine-1948][^van-1994]. In the standard austere case, this is in part because no metaphysical explanation whatsoever of qualitative classification is thought to be needed.
    step1: |-
      *朴素唯名论*（有时称"鸵鸟式"唯名论，原为阿姆斯特朗 1978 的贬语）[^armstrong-1978] 的核心想法是：要说明个体在质性上可分类——例如停车标志或苹果是红的，或二者（同等程度地）是红的——并不需要什么底层的形而上学结构（见 Quine 1948、Devitt 1980、Van Cleve 1994、Parsons 1999、Imaguire 2014）[^devitt-1980][^imaguire-2014][^parsons-1999][^quine-1948][^van-1994]。在标准的朴素情形中，这在一定程度上是因为人们认为，质性分类根本不需要任何形而上学解释。
    step2: |-
      *朴素唯名论*（有时称"鸵鸟式"唯名论，原是阿姆斯特朗 1978 的贬语）[^armstrong-1978] 的核心想法是：要说明个体在质性上可分类——比如停车标志或苹果是红的，或二者（同等程度地）都是红的——并不需要什么底层的形而上学结构（见 Quine 1948、Devitt 1980、Van Cleve 1994、Parsons 1999、Imaguire 2014）[^devitt-1980][^imaguire-2014][^parsons-1999][^quine-1948][^van-1994]。在标准的朴素情形里，部分原因在于：人们认为质性分类根本不需要任何形而上学解释。
  - id: 89
    kind: body
    source: |-
      *Predicate* and *concept nominalism* assert that objects warrant qualitative classification just in case—and *because*—certain predicates or concepts, respectively, apply to them, where the relevant application conditions do not invoke any mind-independent entities that might play the role of a “property” (Searle 1969)[^searle-1969]. The chief difference between these two versions of nominalism is that predicates are linguistic while concepts are mental. But both versions are typically taken to treat the metaphysics of properties as a mind-dependent issue, since predicates and concepts are both mind-dependent. (Note: Searle (1969) says that there *are* properties; however, he treats this as equivalent to holding that predicates have meanings.)
    step1: |-
      *谓词*与*概念唯名论*分别断言：对象之所以在质性上可分类，当且仅当——且*因为*——某些谓词或概念适用于它们；而相关适用条件并不援引任何可能充当"属性"角色的心灵独立实体（Searle 1969）[^searle-1969]。这两种唯名论的主要差别在于：谓词是语言的，概念是心理的。但两种版本通常都被视为把属性的形而上学当作一个依赖心灵的问题，因为谓词与概念都依赖心灵。（注：Searle（1969）说*有*属性；不过他视此等同于主张谓词有意义。）
    step2: |-
      *谓词唯名论*与*概念唯名论*分别主张：对象之所以在质性上可分类，当且仅当——且*因为*——某些谓词或概念适用于它们，而相关适用条件不援引任何可能充当"属性"角色的心灵独立实体（Searle 1969）[^searle-1969]。二者要别在于：谓词是语言的，概念是心理的。不过两者通常都被视为把属性形而上学当作依赖心灵之事，因为谓词与概念都依赖心灵。（注：Searle（1969）说*有*属性，但他把这句话等同于"谓词有意义"。）
  - id: 90
    kind: body
    source: |-
      *Metalinguistic nominalism* (here following the terminology of Loux 2002)[^loux-2002] says that discourse seeming to refer to properties is best construed metalinguistically, as being about language itself (Carnap 1934, Sellars 1963)[^carnap-1934][^sellars-1963]. Roughly, an utterance of ‘the apple is red’ says not that the apple has some non-linguistic qualitative status, but rather that it (or perhaps the description ‘the apple’) is related in a certain way to the predicate ‘red.’ One useful upshot is an interesting paraphrase scheme for higher-order talk of properties, whereby, for example, ‘red is a color’ becomes a claim about ‘red’ being a color predicate. Predicate nominalism and metalinguistic nominalism overlap in certain ways, and the former can potentially be construed as a species of the latter although versions of these views (e.g. Searle 1969 and Sellars 1963)[^searle-1969][^sellars-1963] differ in significant details.
    step1: |-
      *元语言唯名论*（此处沿用 Loux 2002 的术语）[^loux-2002] 主张，看似指称属性的话语最好作元语言理解，即理解为关于语言本身的谈论（Carnap 1934、Sellars 1963）[^carnap-1934][^sellars-1963]。大致说，说出"苹果是红的"，并非说苹果具有某种非语言的质性地位，而是说它（或也许说"苹果"这一描述）与"红"这一谓词以某种方式相联系。一个有用的后果是：关于属性的高阶谈论获得了一种有趣的改述方案——例如"红是一种颜色"变成关于"红"是颜色谓词的主张。谓词唯名论与元语言唯名论在某些方面重叠，前者可能被解释为后者的一支，尽管这些观点（例如 Searle 1969 与 Sellars 1963）[^searle-1969][^sellars-1963] 在重要细节上不同。
    step2: |-
      *元语言唯名论*（此处沿用 Loux 2002 的术语）[^loux-2002] 主张：看似指称属性的话语，最好作元语言理解，即理解为关于语言本身的谈论（Carnap 1934、Sellars 1963）[^carnap-1934][^sellars-1963]。大致说，说出"苹果是红的"，并非说苹果具有某种非语言的质性地位，而是说它（或"苹果"这一描述）与谓词"红"以某种方式相联。由此得到一个有用的结果：关于属性的高阶谈论有了一种巧妙的改述方案——"红是一种颜色"变成关于"红"是颜色谓词的主张。谓词唯名论与元语言唯名论在某些方面重叠，前者可能被解为后者的一支；不过这些观点（例如 Searle 1969、Sellars 1963）[^searle-1969][^sellars-1963] 在重要细节上并不相同。
  - id: 91
    kind: body
