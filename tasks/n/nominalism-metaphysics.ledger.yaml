      Resemblance and second-order nominalism are more complicated with respect to whether they provide entities as semantic values of “property.” Resemblance nominalism says that qualitative classification is governed by primitive resemblance facts (even if there is, strictly speaking, no resemblance relation), rather than resemblance being explanatorily dependent on qualitative natures (Rodriguez-Pereyra 2002)[^rodriguez-pereyra-2002]. Thus the view can be developed to allow for entities that fall under the extension of “property”, namely, classes of concrete particular objects that satisfy the relevant resemblance conditions. Alternatively, since the view makes no special theoretical appeal to such classes, it can also be developed to eschew properties and “property” talk entirely.
    step1: |-
      相似唯名论与二阶唯名论，就它们是否提供实体充当"属性"的语义值而言，情况较为复杂。相似唯名论主张，质性分类由原始的相似事实支配（即便严格说来并无相似关系），而非相似在解释上依赖于质性本性（Rodriguez-Pereyra 2002）[^rodriguez-pereyra-2002]。因此，这一观点可以被发展成容许有实体落入"属性"的外延，即满足相关相似条件的诸具体殊相对象的类。另一方面，由于该观点并未专门在理论上诉诸这类类，它也可以被发展成完全弃绝属性与"属性"谈论。
    step2: |-
      相似唯名论与二阶唯名论的情况较复杂，要看它们是否提供实体充当"属性"的语义值。相似唯名论主张：质性分类由原始的相似事实支配（即便严格说来并无相似关系），而不是相似在解释上依赖质性本性（Rodriguez-Pereyra 2002）[^rodriguez-pereyra-2002]。因此，该观点可以发展成容许有实体落入"属性"的外延——即满足相关相似条件的诸具体殊相对象的类；另一方面，由于它在理论上并不专门诉诸这类类，也可以发展成完全弃绝属性及"属性"谈论。
