      Why accept nominalism and thereby reject the existence of universals or abstract entities? In this section, we consider the case for each version of nominalism, beginning with the case of nominalism about abstract entities. According to Goodman and Quine (1943: 105), their commitment to this form of nominalism “is based on a philosophical intuition that cannot be justified by appeal to anything more ultimate.” Few philosophers have been content to accept this foundationalist rationale for nominalism about abstract entities. (Quine and Goodman subsequently revised their increasingly divergent views on nominalism. See Goodman 1956 and Quine 2008.)[^goodman-1956][^quine-2008] In place of a dogmatic insistence on the truth of nominalism, a range of arguments have been mounted that either identify significant problems with anti-nominalism or purport to show that nominalist alternatives are ultimately preferable.
    step1: |-
