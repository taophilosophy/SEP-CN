      在发展反唯名论论证时，蒯因的本体论承诺判准被广泛采用；然而蒯因在运用该判准时，还配上对本体论自然主义论旨的更一般承诺：我们最好的成熟科学理论，才是判定我们应当接受哪些句子的恰当裁决者；而这些理论反过来又是关于何物存在的最佳向导。蒯因判准、本体论自然主义，加上数学实体对于我们最好的物理理论似乎不可或缺，三者合起来，便构成通常所谓支持数学实在论的蒯因—普特南不可或缺性论证的基础。这一论证一直是数学哲学中热烈关注的题目（见 Quine 1970、Putnam 1971、Colyvan 2001 与"数学哲学中的不可或缺性论证"词条）[^colyvan-2001][^putnam-1971][^quine-1970]。许多拒斥本体论自然主义的人，仍依靠蒯因判准来判定真句子的本体论承诺可能是什么。因此，蒯因判准成为支持各类抽象实体的种种论证的前提。例如，蒯因判准似乎会提示：尽管 (3) 并不属于任何科学理论，但只要你接受 (3) 应当按需要对*是超人*或*是李斯特的 b 小调钢琴奏鸣曲*这类属性的实体作量化的方式来整编，那么 (3) 之为真便要求虚构人物与音乐作品存在。
