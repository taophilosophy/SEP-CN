      蒯因式进路用一条本体论承诺判准来补充 (1)–(3) 之类主张之为真；这条判准提供了判定如下问题的方法：若这些主张为真，则必须存在哪些实体。大致说，蒯因式判准把句子的本体论承诺视为：当该句子作为某一理论的一部分译为一级逻辑时，落入其量词辖域内的变元所取的值。真值制造者式论证依赖背景的真值制造理论，而这类论证则系于量词与变元在辨别理论承诺方面的独特作用（见 Quine 1948 与"本体论承诺"词条相关各节）[^quine-1948]。例如，"苏格拉底是人"会被译为"∃x Socratizes(x) & Is-Human(x)"；于是，任何含有"苏格拉底是人"的理论，都因存在量词所约束的变元取值于包含苏格拉底这一实体的论域，而在本体论上承诺了苏格拉底。蒯因式判准对句子本体论承诺问题给出高度具体的答案；但它并不裁决接受哪些理论，也不裁决理论与构成句子的恰当整编方式。如下文将见，一些唯名论者对蒯因式论证的回应，就是否认 (1)–(3) 之类主张应当以需要对被认为抽象实体作量化的方式来整编。
