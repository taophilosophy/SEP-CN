      It also remains contentious how to distinguish Meinongian approaches from other views that reject the Quinean criterion of ontological commitment. (For discussion, see Lewis 1990.)[^lewis-1990] For example, Azzouni (2004, 2010) defends a non-Meinongian version of nominalism premised upon the rejection of Quinean views regarding ontological commitment. On the resulting view, only concrete objects *really* exist despite the apparent truth of claims within mathematics and fiction and the apparent reference to and quantification over numbers and fictional characters. In developing this view, Azzouni defends a distinction between the “quantifier commitments” and “existential commitments” of a theory. While claims like (1)–(3) are true and have numbers, theorems, and characters among their quantifier commitments, it is a further question whether such entities exist and what, if any, existential commitments and hence ontological consequences such claims have.
    step1: |-
      如何把迈农主义进路与拒斥蒯因本体论承诺判准的其他观点区分开来，同样有争议。（讨论见 Lewis 1990。）[^lewis-1990] 例如，Azzouni（2004、2010）辩护一种非迈农主义的唯名论，其前提是拒斥关于本体论承诺的蒯因式观点。按由此得出的观点，尽管数学与虚构中的主张表面上为真、表面上指称并对数及虚构人物作量化，*真正*存在的却只有具体对象。在阐发这一观点时，Azzouni 辩护一种区分：理论的"量词承诺"与"存在承诺"。 (1)–(3) 之类主张为真，且其量词承诺中包括数、定理与人物；但这类实体是否存在、这类主张有何存在承诺并因而有何本体论后果，则是另一个问题。
    step2: |-
      如何把迈农主义进路与拒斥蒯因本体论承诺判准的其他观点区分开，同样有争议。（讨论见 Lewis 1990。）[^lewis-1990] 例如 Azzouni（2004、2010）辩护一种非迈农主义唯名论，前提正是拒斥蒯因式本体论承诺观。按由此得出的观点，尽管数学与虚构中的主张表面上为真、表面上指称并对数及虚构人物作量化，*真正*存在的却只有具体对象。阐发此说时，Azzouni 区分理论的"量词承诺"与"存在承诺"：(1)–(3) 之类主张为真，其量词承诺中包括数、定理与人物；但这些实体是否存在、这类主张有何存在承诺及本体论后果，另当别论。
