      As Quine and Goodman’s remark above makes clear, the truth of nominalism about abstract entities promises to have a significant impact on a wide range of metaphysical projects. For instance, if there are no such things as linguistic types and there are only specific concrete inscriptions, how can we provide general theories of semantics or syntax? After all, our talk about the word “moose” and its meaning appear to be about the type “moose”, not any specific token. This worry points toward difficult questions about what exactly types are and whether they are abstract rather than concrete. (On types, see Wetzel 2009, Dodd 2000, and entry on types and tokens.)[^dodd-2000][^wetzel-2009] If nominalism about abstract entities does require that we do without types, how can we truthfully speak of the common housecat, the Nanaimo Bar, or the foxtrot? Similar issues have been raised regarding a broad variety of entities, each of which have been alleged to be abstract rather than concrete: numbers, sets, functions, directions, propositions, meanings, properties, kinds, possibilities, possible worlds, fictional works, fictional characters, musical works, events, states of affairs, and many more besides.
    step1: |-
      正如蒯因与古德曼上引之言所表明的，关于抽象实体之唯名论若为真，可望对广泛的形而上学方案产生显著影响。例如，若不存在语言类型这类东西，而只有特定的具体书写痕迹，我们如何能提供一般的语义学或句法学理论？毕竟，我们关于"moose"一词及其意义的谈论，似乎关乎"moose"这个类型，而非任何特定个例。这一忧虑指向一些难题：类型究竟是什么，它们是抽象的而非具体的吗？（关于类型，见 Wetzel 2009、Dodd 2000 与"类型与个例"词条。）[^dodd-2000][^wetzel-2009] 若关于抽象实体的唯名论确要求我们弃用类型，我们又怎能如实地谈论一般的家猫、纳奈莫条或狐步舞？类似问题就一大批实体被提出，它们都被认为抽象而非具体：数、集合、函数、方向、命题、意义、属性、种类、可能性、可能世界、虚构作品、虚构人物、音乐作品、事件、事态，以及其他许多。
    step2: |-
      正如蒯因与古德曼上引之言所表明的，关于抽象实体之唯名论若为真，可望对广泛的形而上学方案产生显著影响。例如，若不存在语言类型，只有特定的具体书写痕迹，我们如何能提供一般的语义学或句法学理论？毕竟，我们谈论"moose"一词及其意义时，说的似乎是"moose"这个类型，而非任何特定个例。这一忧虑牵出难题：类型究竟是什么？它是抽象的还是具体的？（关于类型，见 Wetzel 2009、Dodd 2000、"类型与个例"词条。）[^dodd-2000][^wetzel-2009] 若关于抽象实体的唯名论确要求我们弃用类型，我们又怎能如实谈论一般的家猫、纳奈莫条或狐步舞？类似问题针对一大批实体提出，它们都被视为抽象而非具体：数、集合、函数、方向、命题、意义、属性、种类、可能性、可能世界、虚构作品、虚构人物、音乐作品、事件、事态，如此等等。
