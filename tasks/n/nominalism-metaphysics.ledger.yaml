      This final question is helpful for understanding the debate over universals: can a single qualitative nature be in more than one location (or inhere in more than one object or enjoy more than one instance) at the same time? If one answers affirmatively, then one likely accepts universals. If one answers negatively, then the resulting view will likely fall into one of two further camps. First, if one accepts the presupposition that there *are* qualitative natures but denies that they can be in more than one location or object or instance at a time, one likely rejects universals while accepting what are usually called *tropes*. A trope is a particular (i.e., non-universal) qualitative nature. That is, the whole qualitative nature is not in multiple places or shared by multiple disjoint individuals at the same time. For most theorists, tropes are specific to their location, or even to their bearer (Williams 1953, Campbell 1990, Maurin 2002, and Fisher 2020; see the entry on tropes)[^campbell-1990][^fisher-2020][^maurin-2002][^williams-1953]. Others allow wholly multi-located tropes (Ehring 2011)[^ehring-2011], or shared tropes, so long as one of the sharing bearers is a part of the other, as when an apple and its skin share a redness trope (Giberman 2022b)[^giberman-2022b]. Alternatively, if one denies the presupposition that there are any qualitative natures, one likely rejects both universals and tropes and instead accepts what we will call *strict nominalism* about properties. Strict nominalists deny that any kind of special metaphysical posits are needed to explain the world’s qualitative variety. Instead, strict nominalism holds that the phenomenon of qualitative variety is reducible to facts about entities other than qualitative natures, for example, to material objects, sets of material objects, mereological sums of material objects, or linguistic-cognitive facts (see Quine 1948, Sellars 1963, Lewis 1983, Effingham 2020)[^effingham-2020][^lewis-1983][^quine-1948][^sellars-1963].
    step1: |-
      这最后一个问题有助于理解共相之争：单一质性本性能否同时处于多处（或内居于多个对象、拥有多个实例）？若答"能"，则多半接受共相。若答"不能"，则所得观点很可能落入另两个阵营之一。第一，若接受"确*有*质性本性"这一预设，却否认它们能同时处于多处、多个对象或多个实例，则多半拒斥共相而接受通常所称的*特普*。特普是殊相的（即非共相的）质性本性：整个质性本性并不同时在多个地方，也不被多个彼此分离的个体共享。对多数理论家而言，特普系于其位置，甚至系于其承载者（Williams 1953、Campbell 1990、Maurin 2002、Fisher 2020；参"特普"词条）[^campbell-1990][^fisher-2020][^maurin-2002][^williams-1953]。另一些人容许完全多处的特普（Ehring 2011）[^ehring-2011]，或容许被共享的特普，只要共享者之一是另一者的部分，如苹果与果皮共享一个红性特普（Giberman 2022b）[^giberman-2022b]。第二，若否认"有质性本性"这一预设，则多半既拒斥共相也拒斥特普，转而接受我们所谓的关于属性的*严格唯名论*。严格唯名论者否认需要任何特殊的形而上学设定来解释世界的质性多样；他们主张，质性多样现象可还原为关于质性本性之外实体的种种事实，例如物质对象、物质对象的集合、物质对象的分体论总和，或语言—认知事实（见 Quine 1948、Sellars 1963、Lewis 1983、Effingham 2020）[^effingham-2020][^lewis-1983][^quine-1948][^sellars-1963]。
    step2: |-
      最后这个问题，正是理解共相之争的钥匙：单一质性本性能否同时处于多处，或内居于多个对象、拥有多个实例？答"能"者，多半接受共相；答"不能"者，所得观点多半落入另两个阵营之一。其一，若接受"确*有*质性本性"这一预设，却否认它们能同时处于多处、多个对象或多个实例，则多半拒斥共相而接受通常所谓*特普*。特普是殊相的（即非共相的）质性本性：整个质性本性并不同时在多个地方，也不被多个彼此分离的个体共享。多数理论家认为特普系于其位置，甚至系于其承载者（Williams 1953、Campbell 1990、Maurin 2002、Fisher 2020；参"特普"词条）[^campbell-1990][^fisher-2020][^maurin-2002][^williams-1953]；也有人容许完全多处的特普（Ehring 2011）[^ehring-2011]，或容许被共享的特普——只要共享者之一是另一者的部分，如苹果与果皮共享一个红性特普（Giberman 2022b）[^giberman-2022b]。其二，若否认"有质性本性"这一预设，则多半既拒斥共相也拒斥特普，转而接受我们所谓关于属性的*严格唯名论*。严格唯名论者否认需要什么特殊的形而上学设定来解释世界的质性多样；他们认为，质性多样这一现象可还原为关于质性本性之外实体的种种事实，比如物质对象、物质对象的集合、物质对象的分体论总和，或语言与认知方面的事实（见 Quine 1948、Sellars 1963、Lewis 1983、Effingham 2020）[^effingham-2020][^lewis-1983][^quine-1948][^sellars-1963]。
