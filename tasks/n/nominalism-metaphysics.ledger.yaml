      Despite the fact that some philosophers hold our thought and talk about possibilities to require a commitment to possibilities as abstract entities, modal considerations have also been used to support the case for nominalism. For example, Humeans about modality reject necessary connections between distinct entities, and, for most anti-nominalists, commitment to properties, propositions, or mathematical entities specifically require such connections. (On Humeanism, see Lewis 1986, Wilson 2015, Nolan 1996.)[^lewis-1986][^nolan-1996][^wilson-2015] For instance, on a standard anti-nominalist view, the truth of certain claims about individuals and properties is analyzed in terms of the instantiation of properties. For instance, if May is human, then, according to the proposed anti-nominalist analysis, May must instantiate *being human.* Such an analysis, in turn, entails additional claims about properties—e.g., that, if May is human, then May instantiates the property *having some property or other* and that *being human* instantiates the property *being a property*. Anti-nominalist analyses of this sort often connect properties with propositions. So, in our present example, if May is human, then the proposition *that May is human* must exist and instantiate the property *being true*. Necessary connections among properties and propositions are standard features of these kinds of metaphysical analyses and, for this reason, a commitment to Humeanism is in tension with those theories committed to abstract entities that stand in such metaphysically necessary relationships.
    step1: |-
      尽管一些哲学家认为，我们关于可能性的思想与谈论要求承诺可能性为抽象实体，模态方面的考虑也被用来支持唯名论。例如，关于模态的休谟主义者拒斥不同实体之间的必然联系，而对多数反唯名论者来说，对属性、命题或数学实体的承诺恰恰需要这样的联系。（关于休谟主义，见 Lewis 1986、Wilson 2015、Nolan 1996。）[^lewis-1986][^nolan-1996][^wilson-2015] 例如，按一种标准的反唯名论观点，关于个体与属性的某些主张之真，要就属性的实例化来分析。例如，若梅是人，则按所提议的反唯名论分析，梅必定实例化*为人*。这样的分析又蕴涵关于属性的进一步主张——例如，若梅是人，则梅实例化*具有某种属性*这一属性，且*为人*实例化*是一种属性*这一属性。这类反唯名论分析往往把属性与命题联系起来。于是在本例中，若梅是人，则*梅是人*这一命题必定存在，并实例化*为真*这一属性。属性与命题之间的必然联系是这类形而上学分析的标准特征；因此，承诺休谟主义便与那些承诺处于此类形而上学必然关系中的抽象实体的理论相紧张。
