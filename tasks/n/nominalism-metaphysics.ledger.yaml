      Despite the unwelcome complexity, understanding the debate over nominalism and universals requires carefully distinguishing universals from non-universals (or ‘particulars’), without identifying the concept of a universal with the concept of a qualitative nature. This leaves open the difficult question of what features distinguish universals from non-universals. Various proposals have been advanced. Universals have been claimed to be distinctive insofar as they are *predicable* (i.e., they can be true or false of something: Carmichael 2010)[^carmichael-2010], *multiply located* (i.e., they can be wholly located in distinct regions of space at the same time: Armstrong 1978, Lewis 1986: 83, Giberman 2022a)[^armstrong-1978][^giberman-2022a][^lewis-1986], *multiply instantiable* (i.e., they can be had by distinct entities: Hoffman and Rosenkrantz 2003)[^hoffman-2003], *subject to the principle of the identity of indiscernibles* (Wisdom 1934, Williams 1986, Ehring 2004, 2011)[^ehring-2004][^williams-1986][^wisdom-1934], *being the fundamental explanans of qualitative similarity* (Armstrong 1978)[^armstrong-1978] or *serving as the semantic value of qualitative predication* (van Inwagen 2004)[^inwagen-2004]. Despite these theoretical options for distinguishing universals from particulars, there is no consensus as to which, if any, of the suggested distinguishing criteria of universality listed above is the correct one. For instance, while some posit universals and assert that they are multiply located, rival theories of universals hold that they are *ante rem* entities that lack any spatiotemporal location whatsoever. This has led some philosophers to doubt that there is any such criterion (Ramsey 1925, MacBride 2005)[^macbride-2005][^ramsey-1925].
    step1: |-
      尽管有这种不受欢迎的复杂性，理解唯名论与共相之争，仍须仔细区分共相与非共相（即"殊相"），而不把共相概念与质性本性概念等同。这便留下一个难题：究竟哪些特征把共相与非共相区别开来？对此已有种种提议。有人主张共相之独特在于它们是*可谓述的*（即可以就某物为真或为假：Carmichael 2010）[^carmichael-2010]，*多处所在*（即可以同时完全处于空间的不同区域：Armstrong 1978、Lewis 1986: 83、Giberman 2022a）[^armstrong-1978][^giberman-2022a][^lewis-1986]，*可多实例化*（即可以被不同实体具有：Hoffman and Rosenkrantz 2003）[^hoffman-2003]，*服从不可分辨者的同一原则*（Wisdom 1934、Williams 1986、Ehring 2004, 2011）[^ehring-2004][^williams-1986][^wisdom-1934]，*作为质性相似之基础解释项*（Armstrong 1978）[^armstrong-1978]，或*充当质性谓述的语义值*（van Inwagen 2004）[^inwagen-2004]。尽管有这些理论选项，对于上列诸种区分共相与殊相的判准中哪一个（若有）正确，仍无共识。例如，一些观点设定共相并主张其多处所在，与之竞争的理论则认为共相是 *ante rem* 实体，全然没有时空位置。这使一些哲学家怀疑根本不存在这样的判准（Ramsey 1925、MacBride 2005）[^macbride-2005][^ramsey-1925]。
    step2: |-
      尽管这层复杂性并不讨喜，要理解唯名论与共相之争，仍须仔细区分共相与非共相（即"殊相"），而不把共相概念与质性本性概念混为一谈。这就留下一个难题：究竟哪些特征把二者区别开来？对此已有种种提议。有人说，共相之独特在于*可谓述*（可就某物为真或为假：Carmichael 2010）[^carmichael-2010]，在于*多处所在*（可同时完全处于空间的不同区域：Armstrong 1978、Lewis 1986: 83、Giberman 2022a）[^armstrong-1978][^giberman-2022a][^lewis-1986]，在于*可多实例化*（可为不同实体所具有：Hoffman and Rosenkrantz 2003）[^hoffman-2003]，在于*服从不可分辨者的同一原则*（Wisdom 1934、Williams 1986、Ehring 2004, 2011）[^ehring-2004][^williams-1986][^wisdom-1934]，在于*作为质性相似的基础解释项*（Armstrong 1978）[^armstrong-1978]，或在于*充当质性谓述的语义值*（van Inwagen 2004）[^inwagen-2004]。可是，在这些理论选项之间，究竟哪一个判准（若有）正确，学界并无共识。例如，有人设定共相并主张其多处所在，与之竞争的理论却认为共相是 *ante rem* 实体，全然没有时空位置。于是一些哲学家怀疑根本没有这样的判准（Ramsey 1925、MacBride 2005）[^macbride-2005][^ramsey-1925]。
