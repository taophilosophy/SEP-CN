      When nominalism is understood as the rejection of universals, it is regularly assumed that trope theory (and, of course, strict nominalism) qualify as nominalist views. Since universals are wholly shareable entities (the whole universal may be shared by disjoint bearers), the case for nominalism about universals is often premised upon this controversial feature. Arguments against nominalism about universals frequently concern distinctive properties relevant to their putative shareability that are ascribed to them by competing accounts of universals—e.g., their alleged lack of spatiotemporal location or the alleged possibility of being wholly located in multiple places at the same time. Nominalists about universals often seek to avoid these commitments when assigning entities the general theoretical role of “property.” Nominalism-friendly candidates for that role include tropes; sets, pluralities, or fusions of tropes; and sets, pluralities, or fusions of material objects. Such entities are compatible with nominalism about universals, since they avoid commitment to the existence of wholly multiply located or non-spatial qualitative natures. They are, however, potentially incompatible with nominalism about abstract entities depending upon the assumed understanding of “abstract entity.” For example, theories that accept nominalism regarding universals in part by identifying properties with sets of tropes risk violating nominalism about abstract entities by virtue of accepting the existence of sets, which are standardly categorized as abstract entities (see, e.g., Ehring 2011)[^ehring-2011].
    step1: |-
      当唯名论被理解为对共相的拒斥时，人们通常假定特普理论（当然还有严格唯名论）算作唯名论观点。由于共相是完全可共享的实体（整个共相可被彼此分离的承载者共享），关于共相之唯名论的论据往往以此争议性特征为前提。反对关于共相之唯名论的论证，常涉及竞争性共相理论归于共相的、与其所谓可共享性相关的独特属性——例如共相据称缺乏时空位置，或据称可能同时完全处于多处。关于共相的唯名论者，在把"属性"这一一般理论角色指派给实体时，往往设法避开这些承诺。适合该角色的亲唯名论候选者包括：特普；特普的集合、复数或融合体；以及物质对象的集合、复数或融合体。这类实体与关于共相的唯名论相容，因为它们避免承诺完全多处或非空间的质性本性存在。然而，视对"抽象实体"的假定理解而定，它们可能与关于抽象实体的唯名论不相容。例如，那些部分通过把属性等同于特普之集合而接受关于共相之唯名论的理论，可能会因接受集合的存在而违反关于抽象实体的唯名论，因为集合通常被归为抽象实体（例如见 Ehring 2011）[^ehring-2011]。
    step2: |-
      把唯名论理解为对共相的拒斥时，人们通常假定特普理论（当然还有严格唯名论）也算唯名论。由于共相是完全可共享的实体（整个共相可为彼此分离的承载者所共享），关于共相之唯名论的论据往往以这一争议性特征为前提；反对它的论证，则常诉诸竞争性共相理论归于共相的、与可共享性相关的独特属性——比如共相据称没有时空位置，或据称可能同时完全处于多处。要把"属性"这一一般理论角色指派给实体，关于共相的唯名论者往往设法避开这些承诺，可用的亲唯名论候选者有：特普；特普的集合、复数或融合体；物质对象的集合、复数或融合体。这类实体与关于共相的唯名论相容，因为它们不承诺完全多处或非空间的质性本性。但视对"抽象实体"的理解而定，它们可能与关于抽象实体的唯名论不相容：例如，某些理论部分地通过把属性等同于特普之集合来接受关于共相的唯名论，却因接受集合的存在而违反关于抽象实体的唯名论，因为集合通常归为抽象实体（例如见 Ehring 2011）[^ehring-2011]。
