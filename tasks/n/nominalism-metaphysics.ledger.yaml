      Perhaps the most radical nominalist view of abstract discourse is *non-cognitivism*, according to which claims like (1)–(3) are without ordinary semantic content. Such a view enjoys little plausibility if we focus solely on the commonalities between abstract discourse and ordinary discourse. This is because (1)–(3) seem unexceptional when compared with parallel claims about concrete entities. There are, however, a range of instrumentalist views regarding our discourse about unobservable entities within scientific theories that, if otherwise defensible, would provide a precedent for accommodating abstract discourse. On these views, claims such as (1)–(3) have no descriptive semantic function and serve instead as “instruments” for systematizing our descriptive claims about concrete entities. Instrumentalist views of this kind have been specifically developed with regard to mathematical discourse and the avoidance of ontological commitment to mathematical entities (see Burgess 1983 and Leng 2010)[^burgess-1983][^leng-2010].
    step1: |-
      关于抽象话语最激进的唯名论观点或许是*非认知主义*：按此说，(1)–(3) 之类主张没有通常的语义内容。若只着眼于抽象话语与日常话语的共通处，这种观点似乎不太可信，因为与关于具体实体的平行主张相比，(1)–(3) 显得并无可异。然而，关于科学理论中不可观察实体话语，已有一系列工具主义观点；这些观点若在其他方面站得住，便为安置抽象话语提供了先例。按这些观点，(1)–(3) 之类主张没有描述性的语义功能，而是充当"工具"，用来系统化我们关于具体实体的描述性主张。这类工具主义观点曾专门就数学话语、以及回避对数学实体的本体论承诺而发展出来（见 Burgess 1983 与 Leng 2010）[^burgess-1983][^leng-2010]。
    step2: |-
      最激进的唯名论主张，或属*非认知主义*：(1)–(3) 之类主张并无通常的语义内容。若只看抽象话语与日常话语的共通处，这种观点似乎不太可信，因为与关于具体实体的平行主张相比，(1)–(3) 并无异样。但围绕科学理论中的不可观察实体话语，已有一系列工具主义观点；它们若在其他方面站得住，便为安置抽象话语提供了先例。照这些观点，(1)–(3) 没有描述性的语义功能，只是充当"工具"，用来系统化我们关于具体实体的描述。这类工具主义曾专门针对数学话语、以及回避对数学实体的本体论承诺而发展（见 Burgess 1983、Leng 2010）[^burgess-1983][^leng-2010]。
