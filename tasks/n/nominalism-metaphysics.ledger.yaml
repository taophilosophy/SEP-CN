      There is a solar gas giant *x* and a solar gas giant *y* and *x* is distinct from *y* and every solar gas giant is either identical to *x* or identical to *y*.
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      The final component of this paraphrase strategy holds that our ontological commitments are determined by nominalist-friendly sentences like (5) that serve as “replacements” of claims like (4). Importantly, if (4) and its replacement (5) are supposed to be synonymous, it is unclear how only one could be true or why the nominalist is obliged to accept only the ontological commitments of (5) rather than (4). If, however, the proffered replacement for (4) need not be synonymous, the nominalist who pursues this strategy must explain precisely why it is a satisfactory replacement that obviates the ontological commitments of (4). For these and other reasons, the role of paraphrase in ontological debates, especially those regarding abstract entities, remains a controversial topic in nominalist metaphysics (see Alston 1958, Keller 2015, von Solodkoff 2014, Melia 2000)[^alston-1958][^keller-2015][^melia-2000][^solodkoff-2014].
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      Burgess and Rosen (1997, 2005) draw an influential distinction among nominalist strategies which is useful for understanding the structure and aims of various approaches. They divide *hermeneutic nominalists* who hold that “nominalist disbelief in numbers and their ilk is in the fullest sense compatible with belief in current mathematics and science” (p. 7) from *revolutionary nominalists* who take as their goal “reconstruction or revision: the production of novel mathematical and scientific theories to replace current theories” (p. 6). (On this distinction, see Hellman 2001.)[^hellman-2001] This distinction draws out a key question for would-be nominalists: how can we reconcile the nominalist rejection of abstract entities with the role abstract discourse plays in our best scientific theories? Broadly speaking, Burgess and Rosen’s revolutionary nominalist approaches seek to produce “novel theories by assigning novel meanings to the words of current theories” in order to “permit the nominalist to speak and write just like everyone else while doing mathematics or science” while, at the same time, providing a nominalistic reinterpretation of such claims “while doing philosophy” (p. 6). In contrast, their hermeneutic nominalist does not aim to produce anything novel by way of reconstrual or reinterpretation. Instead, the hermeneutic nominalist claims that nominalist theories are ultimately “an analysis of what really ‘deep down’ words of current theories have meant all along, despite appearances ‘on the surface’.” Producing comprehensive and satisfactory nominalist paraphrases is therefore a way to demonstrate that the apparent commitment of mathematics and science to abstract entities is *merely* apparent. Each stance takes the production of nominalist theories that avoid ontological commitment to abstract entities as significant; however, they differ over what the aim of these “nominalistic construals” ought to be (Burgess 1998, Leng 2010, Colyvan 2006)[^burgess-1998][^colyvan-2006][^leng-2010].
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      Nominalists who accept what is often called Meinongianism aim to preserve abstract discourse and its truth but reject certain theses regarding language and ontology (see Routley 1980 [2018]: 14; and Priest 2005: vii, 134–155)[^priest-2005][^routley-1980]. For those who accept the Quinean view of ontological commitment, the domains of what there is and of what exists are coextensive, so, of necessity, there are no objects that do not exist (see the entry on ontological commitment). In opposition, Meinongians assert that there are objects that do not exist (see Meinong 1904 and Parsons 1980, and the entry on nonexistent objects)[^meinong-1904][^parsons-1980]. When implemented by nominalists, the Meinongian approach permits the positing of nonexistent entities as referents of singular terms and the values of variables and, in turn, upholds the truth of claims like (1)–(3) even while denying that abstract entities actually exist. The Meinongian tradition has received comparatively limited discussion as a specific tool for would-be nominalists. This is perhaps because nonexistent objects are subject to some of the same metaphysical objections as abstract entities.
    step1: TBD
    step2: TBD
  - id: 73
    kind: body
    source: |-
      It also remains contentious how to distinguish Meinongian approaches from other views that reject the Quinean criterion of ontological commitment. (For discussion, see Lewis 1990.)[^lewis-1990] For example, Azzouni (2004, 2010) defends a non-Meinongian version of nominalism premised upon the rejection of Quinean views regarding ontological commitment. On the resulting view, only concrete objects *really* exist despite the apparent truth of claims within mathematics and fiction and the apparent reference to and quantification over numbers and fictional characters. In developing this view, Azzouni defends a distinction between the “quantifier commitments” and “existential commitments” of a theory. While claims like (1)–(3) are true and have numbers, theorems, and characters among their quantifier commitments, it is a further question whether such entities exist and what, if any, existential commitments and hence ontological consequences such claims have.
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      Related approaches posit distinct meanings of quantifiers and cognate expressions, only some of which are privileged for the purposes of ontology. So, if our concerns are metaphysical in kind (e.g., when we debate the existence of abstract entities), nominalists hold that claims like (1)–(3) prove false on this privileged interpretation. However, in ordinary contexts, claims like (1)–(3) are true and this is because of a non-ontologically-committing meaning associated with the relevant quantifiers and cognate expressions. Roughly speaking, when (1)–(3) are ordinarily used they incur no metaphysical consequences and are therefore consistent with the truth of nominalism. But, if asserted in metaphysical contexts and thus expressing their privileged, ontologically committal meanings, they are incompatible with nominalism and entail the truth of anti-nominalism (Hofweber 2005, Sider 2011, Dorr 2008, Korman 2015)[^dorr-2008][^hofweber-2005][^korman-2015][^sider-2011].
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      Our final general nominalist strategy requires no distinctive semantic machinery and seeks to uphold abstract discourse as meaningful, true, intended literally, and committed to no abstract entities. It is, however, the least specific in content and is closer to a promissory note in theory development or a disposition towards certain metaphysical options. According to what we will call *concretism*, the nominalist simply holds that, on the final analysis, any of the putatively abstract entities relevant to claims like (1)–(3) will turn out to be a concrete entity. Concretism obviously requires plausibly developing the relevant theories of numbers, properties, musical works, and so on. Generally speaking, however, the prospects for these views are likely to depend upon having a sufficiently expansive ontology of concrete entities or a sufficiently rich ideology of theoretical concepts. For example, modal realists like Lewis (1986) have sought to analyze discourse about possibilities via concrete entities in the form of a vast ontology of concrete, merely possible worlds. Subsequent efforts have sought to show that this ontology of concrete entities is sufficient for also providing a nominalist theory of some mathematical entities in terms of sums and pluralities of concrete entities and, potentially in turn, providing an account of properties and propositions (see Nolan 2002: 151–174)[^nolan-2002]. How concretism, when paired with realism about merely possible entities, ultimately compares to anti-nominalism is an open question.
    step1: TBD
    step2: TBD
