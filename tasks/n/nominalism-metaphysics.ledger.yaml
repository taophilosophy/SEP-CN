  - id: 1
    kind: body
    source: |-
      Nominalism is an exclusionary thesis in ontology. It asserts that there are no entities of certain sorts. Precisely which entities it excludes depends on the relevant variety of nominalism, but nominalist theses typically deny the existence of universals or abstract entities. For those who accept nominalism, a central challenge in metaphysics is to make sense of phenomena that anti-nominalist theories explain via universals or abstract entities. For instance, anti-nominalists often rely upon universals to explain similarity, propositions to explain linguistic meaning, and numbers to explain mathematical truth. Nominalists who reject the existence of such entities must therefore find a credible way to explain how things can be similar without sharing universals, have linguistic meaning without expressing propositions, or be truths of mathematics without the existence of any mathematical entities.
    step1: |-
      唯名论是本体论中的一种排他性论旨。它断言不存在某几类实体。它究竟排除哪些实体，取决于相关的唯名论变体，但唯名论论旨通常否认共相或抽象实体的存在。对接受唯名论的人来说，形而上学的一项核心挑战在于：反唯名论理论借共相或抽象实体来解释的那些现象，该如何理解。例如，反唯名论者常用共相解释相似性，用命题解释语言意义，用数解释数学真理。既然拒斥这类实体的存在，唯名论者就必须找到一种可信的方式，来说明事物如何能相似而不共享共相、如何能有语言意义而不表达命题、数学如何能为真而无需任何数学实体存在。
    step2: |-
      唯名论是本体论中的一种排他性论旨：它断言某几类实体并不存在。它究竟排除哪些实体，取决于唯名论的具体形态，但唯名论的论旨通常是否认共相或抽象实体的存在。对接受唯名论的人来说，形而上学的一项核心挑战是：反唯名论理论借共相或抽象实体来解释的那些现象，该如何理解？例如，反唯名论者常用共相解释相似性，用命题解释语言意义，用数解释数学真理。既然如此，唯名论者就必须找到可信的路子，说明事物如何能在不共享共相的情况下彼此相似、语言如何能在不表达命题的情况下有意义、数学如何能在没有任何数学实体存在的情况下成其为真。
  - id: 2
    kind: body
    source: |-
      Since nominalists seek to provide metaphysical theories without positing universals or abstract entities, the resulting nominalist theories often require distinctive resources and face significant competition in the form of rival anti-nominalist theories. It is also controversial whether the nominalist prohibitions against universals or abstract entities are justifiable. This entry surveys arguments for nominalism, opposing anti-nominalist arguments for the existence of universals or abstract entities, and a variety of nominalist theories that eschew commitment to such entities.
    step1: |-
      由于唯名论者力图提供不设定共相或抽象实体的形而上学理论，所产生的唯名论理论往往需要独特的资源，并面临作为对手的反唯名论理论的激烈竞争。唯名论针对共相或抽象实体的禁令是否正当，同样有争议。本词条考察支持唯名论的论证、反对反唯名论关于共相或抽象实体存在之论证的论证，以及种种回避对这类实体作出承诺的唯名论理论。
    step2: |-
      唯名论者要提供不设定共相或抽象实体的形而上学理论，由此产生的理论往往需要独特的资源，还要面对作为对手的反唯名论理论的激烈竞争。唯名论对共相或抽象实体的禁令是否站得住脚，同样有争议。本词条考察三件事：支持唯名论的论证；针对"共相或抽象实体存在"之反唯名论论证的反驳；以及各种回避承诺这类实体的唯名论理论。
  - id: 3
    kind: body
    source: |-
      Before proceeding, a note on terminology and scope is needed. Throughout this entry, we use “anti-nominalism” and its cognates to denote theories that accept the existence of universals or abstract entities. The term “anti-nominalism” avoids the historical connotations of the commonly used term “platonism.” The history of nominalism in metaphysics is extensive and resists concise summary except to say that the reality of universals, numbers, propositions, and related entities has long been controversial. This entry sets aside this lengthy history to focus on the contemporary metaphysical debates regarding nominalism. (See the entry on the medieval problem of universals.) Finally, “nominalism about *F*s” is typically understood as the thesis that *F*s do not exist, and to deny the existence of a category of entities is to adopt a metaphysical position regarding such entities. ‘Nominalism in metaphysics’ might therefore seem a redundant title for this entry since any version of nominalism must be within the realm of metaphysics. Our focus in what follows is, however, with nominalism as a view that informs metaphysical debates regarding universals as well as putative abstracta such as properties, propositions, and types. While we will touch upon certain arguments from the philosophy of mathematics that have been influential in shaping the metaphysical debate over nominalism, and while there is no clear-cut divide between metaphysics and the philosophy of mathematics, our focus is on the status of nominalism in the former rather than the latter.
    step1: |-
      开始之前，须就术语与范围作一说明。本词条通篇用"反唯名论"及其同源词指称接受共相或抽象实体存在的理论。"反唯名论"一词避开了常用词"柏拉图主义"的历史意涵。形而上学中唯名论的历史源远流长，难以简明概括，只能说共相、数、命题及相关实体的实在性历来争议不断。本词条搁置这段漫长的历史，专注于当代关于唯名论的形而上学论战。（参"中世纪的共相问题"词条。）最后，"关于 *F* 的唯名论"通常被理解为 *F* 不存在的论旨；否认某类实体的存在，就是就这类实体采取一种形而上学立场。因此，"形而上学中的唯名论"作为本词条标题似乎有些冗余，因为任何版本的唯名论都必在形而上学范围之内。然而下文关注的是唯名论作为一种影响形而上学论战的观点——这些论战涉及共相以及属性、命题、类型之类被认为的抽象物。我们会触及数学哲学中一些塑造了唯名论形而上学论战的有影响的论证，而形而上学与数学哲学之间也并无清楚分界；但我们的焦点是唯名论在前者中的地位，而非后者。
    step2: |-
      开始之前，须就术语与范围作一说明。本词条通篇用"反唯名论"及其同源词指称接受共相或抽象实体存在的理论。用"反唯名论"而不用"柏拉图主义"，是为了避开后者的历史意涵。形而上学中唯名论的历史源远流长，难以简明概括，只能说共相、数、命题及相关实体的实在性历来争议不断。本词条搁置这段漫长的历史，专注于当代关于唯名论的形而上学论战（参"中世纪的共相问题"词条）。最后，"关于 *F* 的唯名论"通常被理解为"*F* 不存在"的论旨；而否认某类实体的存在，本身就是就这类实体采取一种形而上学立场。如此看来，"形而上学中的唯名论"这个标题似乎有些冗余——任何版本的唯名论都必在形而上学范围之内。不过，下文关注的是唯名论作为一种塑造形而上学论战的观点，这些论战涉及共相，也涉及属性、命题、类型之类被认为的抽象物。我们会触及数学哲学中若干塑造了唯名论论战的有影响的论证，而形而上学与数学哲学之间本无清楚分界；但我们的焦点是唯名论在形而上学中的地位，而非在数学哲学中的地位。
