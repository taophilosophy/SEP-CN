      Causal-epistemic arguments hinge upon whether anti-nominalists can account for our knowledge of abstract entities if such entities are indeed non-causal and therefore not epistemically accessible through ordinary means. Subsequent discussions of anti-nominalist epistemology have sought to provide a credible account of our awareness of abstract entities and our justified beliefs regarding them (see Chudnoff 2012, Bengson 2015, Lewis 1986: 108–115, and Clarke-Doane 2017)[^bengson-2015][^chudnoff-2012][^clarke-doane-2017][^lewis-1986]. As some have noted, a parallel issue arises if we assume causal interaction is necessary for *semantic relations* like reference between speakers and abstract entities like numbers. This parallel causal-semantic version of the above argument against abstract entities is more usually mentioned than defended, however (see Jubien 1977, Lear 1977, and Davies 2019)[^davies-2019][^jubien-1977][^lear-1977].
    step1: |-
      因果—认识论论证的关键在于：若抽象实体确为非因果的、因而不能通过寻常手段在认识上通达，反唯名论者能否说明我们对抽象实体的知识。后续关于反唯名论认识论的讨论，力求对我们对抽象实体的觉察以及关于它们的有辩护信念给出可信说明（见 Chudnoff 2012、Bengson 2015、Lewis 1986: 108–115 与 Clarke-Doane 2017）[^bengson-2015][^chudnoff-2012][^clarke-doane-2017][^lewis-1986]。正如一些人所指出的，若我们假定因果相互作用是说话者与数之类抽象实体之间指称之类*语义关系*的必要条件，也会出现一个平行问题。不过，上述反对抽象实体之论证的这一平行的因果—语义版本，通常是提及者多、辩护者少（见 Jubien 1977、Lear 1977 与 Davies 2019）[^davies-2019][^jubien-1977][^lear-1977]。
    step2: |-
