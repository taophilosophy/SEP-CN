      上述论证从表面上表达或指称抽象实体的主张之为真出发。其他反唯名论论证则聚焦于抽象实体或共相作为理论设定的解释作用。支持反唯名论的*解释性*或溯因论证意在表明：承诺抽象实体存在的理论，为某些现象提供了最佳、或许唯一可行的解释。一般说来，反唯名论理论在表述的简单性上占有优势，即便它们需要抽象实体存在。相反，唯名论理论往往设法把 (1)–(3) 之类主张替换或翻译为不指称（因而不需要对之作量化）抽象实体的主张。本体论中对解释性考虑的重视，把理论德性及其正确运用的问题推到形而上学论战的前台，同时引出更广泛的关切：属性、命题之类形而上学设定与电子、基因之类科学设定之间，究竟有何相似与不相似。（关于理论德性，见 Schindler 2018 与 Nolan 1999。）[^nolan-1999][^schindler-2018]
