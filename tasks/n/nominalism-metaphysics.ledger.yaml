      Burgess and Rosen (1997, 2005) draw an influential distinction among nominalist strategies which is useful for understanding the structure and aims of various approaches. They divide *hermeneutic nominalists* who hold that “nominalist disbelief in numbers and their ilk is in the fullest sense compatible with belief in current mathematics and science” (p. 7) from *revolutionary nominalists* who take as their goal “reconstruction or revision: the production of novel mathematical and scientific theories to replace current theories” (p. 6). (On this distinction, see Hellman 2001.)[^hellman-2001] This distinction draws out a key question for would-be nominalists: how can we reconcile the nominalist rejection of abstract entities with the role abstract discourse plays in our best scientific theories? Broadly speaking, Burgess and Rosen’s revolutionary nominalist approaches seek to produce “novel theories by assigning novel meanings to the words of current theories” in order to “permit the nominalist to speak and write just like everyone else while doing mathematics or science” while, at the same time, providing a nominalistic reinterpretation of such claims “while doing philosophy” (p. 6). In contrast, their hermeneutic nominalist does not aim to produce anything novel by way of reconstrual or reinterpretation. Instead, the hermeneutic nominalist claims that nominalist theories are ultimately “an analysis of what really ‘deep down’ words of current theories have meant all along, despite appearances ‘on the surface’.” Producing comprehensive and satisfactory nominalist paraphrases is therefore a way to demonstrate that the apparent commitment of mathematics and science to abstract entities is *merely* apparent. Each stance takes the production of nominalist theories that avoid ontological commitment to abstract entities as significant; however, they differ over what the aim of these “nominalistic construals” ought to be (Burgess 1998, Leng 2010, Colyvan 2006)[^burgess-1998][^colyvan-2006][^leng-2010].
    step1: |-
      Burgess 与 Rosen（1997、2005）在唯名论策略间作了一个有影响的区分，有助于理解各种进路的结构与目标。他们把*解释学唯名论者*与*革命性唯名论者*分开：前者主张"唯名论者对数及其同类的不信，在最充分的意义上与对当前数学与科学的信念相容"（第 7 页）；后者以"重构或修订：生产新的数学与科学理论以取代当前理论"为目标（第 6 页）。（关于这一区分，见 Hellman 2001。）[^hellman-2001] 这一区分引出准唯名论者的一个关键问题：我们如何把唯名论者对抽象实体的拒斥，与抽象话语在我们最好的科学理论中所起的作用协调起来？大致说，Burgess 与 Rosen 的革命性唯名论进路，力求"通过给当前理论的词语指派新意义来生产新理论"，以便"让唯名论者在做数学或科学时能像别人一样说和写"，同时"在做哲学时"对这类主张给出唯名论式的重新解释（第 6 页）。相反，他们的解释学唯名论者并不意在通过重构或重新解释生产任何新东西；解释学唯名论者主张，唯名论理论终究是"对当前理论的词语'深层'一直意谓着什么的分析，尽管'表面上'另有样子"。因此，生产全面而令人满意的唯名论改述，就是表明数学与科学对抽象实体的表面承诺*仅仅是*表面的。两种立场都看重生产回避对抽象实体本体论承诺的唯名论理论；分歧在于这些"唯名论式解释"的目标应当是什么（Burgess 1998、Leng 2010、Colyvan 2006）[^burgess-1998][^colyvan-2006][^leng-2010]。
    step2: |-
      Burgess 与 Rosen（1997、2005）在唯名论策略间作了一个有影响的区分，有助于理解各路进路的结构与目标。他们分出*解释学唯名论者*与*革命性唯名论者*：前者主张"唯名论者对数及其同类的不信，在最充分的意义上与对当前数学和科学的信念相容"（第 7 页）；后者则以"重构或修订：造出新的数学与科学理论，取代当前理论"为目标（第 6 页）。（关于这一区分，见 Hellman 2001。）[^hellman-2001] 这一区分逼出准唯名论者的一个关键问题：唯名论者对抽象实体的拒斥，如何与抽象话语在我们最好的科学理论中的作用相协调？大体说，革命性进路力求"通过给当前理论的词语指派新意义来造出新理论"，以便"让唯名论者做数学或科学时能像旁人一样说和写"，同时"做哲学时"给这类主张一套唯名论式的重新解释（第 6 页）。解释学唯名论者则不同：他们不靠重构或重释去造什么新东西，而主张唯名论理论终究是"对当前理论的词语'深层'一直意谓着什么的分析，尽管'表面上'另有样子"。于是，生产全面而令人满意的唯名论改述，便是要表明：数学与科学对抽象实体的承诺*仅仅是*表面的。两种立场都看重造出回避抽象实体承诺的唯名论理论；分歧在于这些"唯名论式解释"该以什么为目标（Burgess 1998、Leng 2010、Colyvan 2006）[^burgess-1998][^colyvan-2006][^leng-2010]。
