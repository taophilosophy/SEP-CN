      The final component of this paraphrase strategy holds that our ontological commitments are determined by nominalist-friendly sentences like (5) that serve as “replacements” of claims like (4). Importantly, if (4) and its replacement (5) are supposed to be synonymous, it is unclear how only one could be true or why the nominalist is obliged to accept only the ontological commitments of (5) rather than (4). If, however, the proffered replacement for (4) need not be synonymous, the nominalist who pursues this strategy must explain precisely why it is a satisfactory replacement that obviates the ontological commitments of (4). For these and other reasons, the role of paraphrase in ontological debates, especially those regarding abstract entities, remains a controversial topic in nominalist metaphysics (see Alston 1958, Keller 2015, von Solodkoff 2014, Melia 2000)[^alston-1958][^keller-2015][^melia-2000][^solodkoff-2014].
    step1: |-
      这一改述策略的最后一环是：我们的本体论承诺由 (5) 之类亲唯名论的句子决定，这些句子充当 (4) 之类主张的"替代者"。重要的是，若 (4) 及其替代者 (5) 意在同义，便不清楚何以只有一个能为真，也不清楚唯名论者何以有义务只接受 (5) 而非 (4) 的本体论承诺。然而，若为 (4) 提供的替代者不必同义，则采取此策略的唯名论者就必须准确说明：它为何是一个令人满意的替代者、从而免除了 (4) 的本体论承诺。由于这些及其他理由，改述在本体论论战——尤其关于抽象实体的论战——中的作用，仍是唯名论形而上学中有争议的题目（见 Alston 1958、Keller 2015、von Solodkoff 2014、Melia 2000）[^alston-1958][^keller-2015][^melia-2000][^solodkoff-2014]。
    step2: |-
      这一改述策略的最后一环是：我们的本体论承诺，由 (5) 之类亲唯名论的句子决定——它们充当 (4) 之类主张的"替代者"。要紧的是，若 (4) 与其替代者 (5) 意在同义，便说不清何以只有一方为真，也说不清唯名论者何以只该接受 (5) 而非 (4) 的本体论承诺。可若替代者不必同义，采取此策略的唯名论者就须准确说明：它何以是令人满意的替代者，从而免除了 (4) 的本体论承诺。由于这些及其他理由，改述在本体论论战——尤其在抽象实体论战——中的作用，至今仍是唯名论形而上学中有争议的题目（见 Alston 1958、Keller 2015、von Solodkoff 2014、Melia 2000）[^alston-1958][^keller-2015][^melia-2000][^solodkoff-2014]。
