  - id: 5
    kind: body
    source: |-
      Contemporary debates regarding nominalism are troubled by terminological obstacles. Typically, nominalism is understood as one of two theses: (1) *nominalism about universals*, which denies that such entities exist and holds instead that all entities are particulars or individuals; (2) *nominalism about abstract entities*, which denies that such entities exist and holds instead that there are only concrete entities. On some views, (2) entails (1) since universals are properly categorized as abstract rather than concrete. For example, some views take universals to be eternal, non-spatiotemporal, necessarily existing entities and therefore categorize universals as abstract rather than concrete (see Bealer 1993 and Jubien 2001)[^bealer-1993][^jubien-2001]. Others reject this view about the location and necessity of universals and instead hold universals to be concrete entities. In light of the resulting complexity, we will, at key points in what follows, separately examine nominalism about universals and nominalism about abstract entities since the debate over these nominalist theses can differ significantly. For instance, a familiar motivation for nominalism about universals is a metaphysical concern about the possibility of entities being wholly shareable by distinct material objects. In contrast, objections against abstract entities like sets or propositions are unlikely to concern shareability. Instead, arguments for nominalism about abstract entities are often motivated by the fact that such entities are alleged to exist outside space or time and are therefore mysterious or unknowable. Despite these differences, nominalist opposition to universals or abstract entities often significantly overlaps.
    step1: |-
      当代关于唯名论的论战受到术语障碍的困扰。通常，唯名论被理解为两种论旨之一：（1）*关于共相的唯名论*，它否认这类实体存在，主张一切实体都是殊相或个体；（2）*关于抽象实体的唯名论*，它否认这类实体存在，主张只有具体实体。在某些观点看来，（2）蕴涵（1），因为共相应被恰当地归为抽象而非具体。例如，一些观点把共相视为永恒、非时空、必然存在的实体，因而把共相归为抽象而非具体（见 Bealer 1993 与 Jubien 2001）[^bealer-1993][^jubien-2001]。另一些观点拒斥这种关于共相位置与必然性的看法，转而主张共相是具体实体。鉴于由此产生的复杂性，下文将在关键处分别考察关于共相的唯名论与关于抽象实体的唯名论，因为围绕这两种唯名论论旨的论战可能差别很大。例如，关于共相的唯名论的一个常见动机，是对实体能否被不同物质对象完全共享这一可能性的形而上学关切。相反，针对集合或命题之类抽象实体的反对意见，则不太可能涉及可共享性。支持关于抽象实体之唯名论的论证，往往出于如下事实：这类实体据称存在于空间或时间之外，因而神秘或不可知。尽管有这些差异，唯名论对共相或抽象实体的反对往往显著重叠。
    step2: |-
      当代关于唯名论的论战，常为术语上的障碍所困。唯名论通常被理解为两种论旨之一：（1）*关于共相的唯名论*，否认这类实体存在，主张一切实体都是殊相或个体；（2）*关于抽象实体的唯名论*，否认这类实体存在，主张只有具体实体。在若干观点看来，（2）蕴涵（1），因为共相应归入抽象而非具体。例如，有些观点把共相视为永恒、非时空、必然存在的实体，因而归为抽象（见 Bealer 1993、Jubien 2001）[^bealer-1993][^jubien-2001]；另一些观点则否认这种关于共相位置与必然性的说法，主张共相是具体的。鉴于由此产生的复杂局面，下文将在关键处把关于共相的唯名论与关于抽象实体的唯名论分开考察，因为围绕这两种论旨的论战可能相去甚远。举例来说，主张关于共相之唯名论的常见动机，是担心实体能否被不同的物质对象完全共享；而针对集合、命题之类抽象实体的反对，多半与可共享性无关——支持关于抽象实体之唯名论的论证，常常依赖这类实体据称存在于时空之外、因而神秘不可知这一点。尽管有这些差异，唯名论对共相与对抽象实体的反对，往往显著重叠。
  - id: 6
    kind: body
    source: |-
      Since the rejection of abstract entities and the rejection of universals are related but separable concerns, we begin by discussing each of these two strands of nominalism. In each case, we assume that nominalism is a thesis regarding the *existence* of entities. An alternative approach to understanding nominalism holds it to concern *fundamentality* rather than existence. On this alternative way of understanding nominalism, it is the denial that universals or abstract entities are fundamental entities. Conversely, anti-nominalism, when so understood, is the thesis that such entities are fundamental. Although matters of fundamentality and metaphysical dependence are highly relevant to the debate over nominalism, we assume here that nominalism is specifically a thesis regarding existence rather than fundamentality. (On fundamentality and ontological disagreement, see Cameron 2008, Schaffer 2009, Imaguire 2018, Schulte 2019, and Declos 2021.)[^cameron-2008][^declos-2021][^imaguire-2018][^schaffer-2009][^schulte-2019]
    step1: |-
      既然拒斥抽象实体与拒斥共相是相关而可分的关切，我们先分别讨论唯名论的这两条线索。两种情形下，我们都假定唯名论是关于实体*存在*的论旨。另一种理解唯名论的进路认为，它关涉的是*基础性*而非存在。按这种替代理解，唯名论否认共相或抽象实体是基础实体；反过来说，如此理解的反唯名论则是主张这类实体是基础的。尽管基础性与形而上学依赖问题与唯名论论战高度相关，我们在此假定唯名论具体地是关于存在而非关于基础性的论旨。（关于基础性与本体论分歧，见 Cameron 2008、Schaffer 2009、Imaguire 2018、Schulte 2019 与 Declos 2021。）[^cameron-2008][^declos-2021][^imaguire-2018][^schaffer-2009][^schulte-2019]
    step2: |-
      拒斥抽象实体与拒斥共相，是相关却可分的两回事，故我们先分别讨论唯名论的这两条线索。两种情形下，我们都把唯名论当作关于实体*存在*的论旨。另有一种理解方式，认为唯名论关涉的是*基础性*而非存在：照此理解，唯名论否认共相或抽象实体是基础实体，反唯名论则主张它们是。基础性与形而上学依赖问题固然与唯名论论战高度相关，但此处仍假定唯名论具体地是关于存在的论旨，而非关于基础性的。（关于基础性与本体论分歧，见 Cameron 2008、Schaffer 2009、Imaguire 2018、Schulte 2019、Declos 2021。）[^cameron-2008][^declos-2021][^imaguire-2018][^schaffer-2009][^schulte-2019]
  - id: 7
    kind: body
    source: |-
      Alongside the above nominalist theses regarding universals and abstract entities, an influential thesis labelled as “nominalism” is defended by Nelson Goodman and draws upon preceding work in Leonard and Goodman 1940. Goodman’s version of nominalism asserts that all entities are “individuals” in the specific sense of being mereological atoms or constructed via mereology. As Goodman (1956: 25) notes, this version of nominalism is potentially compatible with the existence of certain sets or classes, but rejects any ontology of sets or classes which admits “the composition of more than one entity out of exactly the same entities by membership.” For this reason, Goodman’s nominalism is incompatible with standard versions of set theory which accept the construction or generation of sets in violation of classical extensional mereology (e.g., a hierarchy of pure sets constructed from a single empty or null set). (On this version of nominalism, see Cohnitz and Rossberg 2006, Oliver 1993, Eberle 1970, and Dummett 1956.)[^cohnitz-2006][^dummett-1956][^eberle-1970][^oliver-1993] Despite receiving less attention than nominalism regarding universals or abstract entities, Goodman’s nominalism is comprehensive in its development and historically influential, receiving attention in Lewis 1991 (38–41).
    step1: |-
      除上述关于共相与抽象实体的唯名论论旨外，还有一种被标为"唯名论"的有影响论旨，由纳尔逊·古德曼辩护，取资于 Leonard 与 Goodman 1940 的先行工作。古德曼版的唯名论断言，一切实体都是"个体"，此"个体"特指分体论原子，或经由分体论构造而成。正如古德曼（1956: 25）所指出的，这一版唯名论可能与某些集合或类共存，但拒斥任何容许"以同一批成员构成多于一个实体"的集合或类本体论。因此，古德曼的唯名论与标准集合论不相容——后者容许违背经典外延分体论地构造或生成集合（例如由单一空集构造出的纯集合层级）。（关于这一版唯名论，见 Cohnitz and Rossberg 2006、Oliver 1993、Eberle 1970 与 Dummett 1956。）[^cohnitz-2006][^dummett-1956][^eberle-1970][^oliver-1993] 尽管受到的关注不及关于共相或抽象实体的唯名论，古德曼的唯名论在发展上颇为完整，历史上亦有影响，Lewis 1991（38–41）即曾论及。
    step2: |-
      除上述关于共相与抽象实体的论旨外，还有一种有影响的论旨也标为"唯名论"，由纳尔逊·古德曼提出，取资于 Leonard 与 Goodman 1940 的先行工作。古德曼版唯名论断言：一切实体都是"个体"——此处的"个体"专指分体论原子，或经分体论构造而成者。如古德曼（1956: 25）所言，这一版唯名论可能与某些集合或类相容，但拒斥任何容许"以同一批成员构成多于一个实体"的集合或类本体论。因此，它与标准集合论不相容——后者容许违背经典外延分体论地构造或生成集合（例如由单一空集层层构造的纯集合层级）。（关于这一版唯名论，见 Cohnitz and Rossberg 2006、Oliver 1993、Eberle 1970、Dummett 1956。）[^cohnitz-2006][^dummett-1956][^eberle-1970][^oliver-1993] 这一版唯名论虽不及关于共相或抽象实体者受关注，其发展却相当完整，历史上亦有影响，Lewis 1991（38–41）即曾论及。
