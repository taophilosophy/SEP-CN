      This realist stance is stated in the context of examining al-Bitruji’s astronomical proposals. Gersonides’ contention is that “no argument can nullify the reality that is perceived by the senses, for true opinion must follow reality but reality need not conform to opinion” (Goldstein 1974, p. 24)[^goldstein-1974]. That Gersonides clearly considered his own observations to be the ultimate test of his system is explicit from his attitude towards Ptolemy. The importance of empirical observation cannot be underestimated, he claims, and he values his own observations over those of others. “We did not find among our predecessors from Ptolemy to the present day observations that are helpful for this investigation except our own” (*Wars*, V.1.3, p. 27), he says in describing his method of collecting astronomical data. Often his observations do not agree with those of Ptolemy, and in those cases he tells us explicitly that he prefers his own. Gersonides lists the many inaccuracies he has found trying to follow Ptolemy’s calculations. Having investigated the positions of the planets, for example, Gersonides encountered “confusion and disorder” which led him to deny several of Ptolemy’s planetary principles (Goldstein 1988, p. 386). He does warn his colleagues, however, to dissent from Ptolemy only after great diligence and scrutiny. Both John Buridan and Gersonides took the first steps in the 14th century toward a principle of inertia; in the words of Touati, Gersonides was the first to “have a presentiment of the principle of inertia” (see Touati 1973, pp. 103, 311)[^touati-1973]. Glasner supports Touati’s contention, claiming that “Gersonides had a rudimentary, not yet correct, but insightful understanding of the concept of inertial motion.” Gersonides was aware of its significance and used it in order to lay the basis for a new physics, an alternative to that of Aristotle. (see Glasner 2015, p 36)[^glasner-2015] He did not rely on a theory of impetus [as did Buridan], which turned out to be an advantage.
    step1: |-
      这种实在论立场是在考察 al-Bitruji 的天文学主张时陈述的。吉尔松尼德的论点是：“任何论证都不能取消感官所感知的实在，因为真意见必须追随实在，而实在无须迁就意见”（Goldstein 1974, p. 24）[^goldstein-1974]。吉尔松尼德显然把自己所作的观察视为对其体系的最终检验，这一点从他对托勒密（Ptolemy）的态度中可以看得很清楚。他断言，经验观察的重要性不可低估，并且他重视自己的观察甚于他人的观察。“从托勒密到今天的先辈中，我们没有找到对我们这项研究有用的观察，唯有我们自己的观察除外”（*Wars*, V.1.3, p. 27），他在描述自己收集天文数据的方法时这样说。他的观察常常与托勒密的观察不一致，在那些情形下，他明确告诉我们他更信自己的观察。吉尔松尼德列举了他在试图遵循托勒密计算时所发现的许多不准确之处。例如，在考察各行星的位置之后，吉尔松尼德遇到“混乱与失序”，这使他否定了托勒密的若干行星原则（Goldstein 1988, p. 386）。不过他确实告诫同行：只有在极为勤勉、反复审视之后，才可以背离托勒密。布里丹（John Buridan）与吉尔松尼德都在十四世纪迈出了通向惯性原理的最初步伐；用 Touati 的话说，吉尔松尼德是第一个“预感到惯性原理”的人（see Touati 1973, pp. 103, 311）[^touati-1973]。Glasner 支持 Touati 的说法，她认为“吉尔松尼德对惯性运动这一概念的理解虽属初步、尚不正确，却颇具洞见”。吉尔松尼德意识到其意义，并用它为一个新的物理学——亚里士多德物理学的替代方案——奠定基础（see Glasner 2015, p 36）[^glasner-2015]。他不像布里丹那样依赖冲力说，而事实证明这是一项优势。
    step2: |-
