      然而吉尔松尼德否弃这种结合观念，代之以另一种不朽模型：要紧的是获得理智的知识内容。当获得理智的内容映照出能动理智的理性秩序时，不朽便达到了。这种知识的内容是什么？能动理智必定拥有关于月下世界的完整知识；也就是说，它“含有一种关于在一切个体中存在的理性秩序的概念”（*Wars*, I.4, p. 136）。当吉尔松尼德更详细地描述能动理智所知为何时，这一立场的反柏拉图色彩便得到强调。因为按吉尔松尼德，能动理智的知识必须以个别事物领域为根基。这样，吉尔松尼德的立场便避开了实在论本体论中显然可见的认识论困难。既然质料理智反映能动理智所固有的知识，又既然这种知识以个别事物为根基，那么人就能拥有关于个别事物的知识；在这知识的获得之中，便有不朽。
