      在《上帝之战》V.2.8 中，吉尔松尼德列出六条影响其总体宇宙论方案的占星原则。可概括如下。第一，每个星辰天体都施予一种为它所特有的不同影响。第二，星辰影响取决于它在黄道（*galgal hamazalot*）中的位置。第三，一颗星在黄道某一位置停留得越久，因其发光性的强度，其效果越大。第四，星辰影响取决于它向北或向南的倾斜；当它位于中间时效果最强，太阳可以为证：它在北回归线时比在南回归线时更热。第五，一颗星的辐射或发光性越大，其影响越强。最后，一颗星离地球越近，其影响越强（*Wars*, V.2.8, p. 207–8）。这些原则也构成他总体天文学的支柱。
