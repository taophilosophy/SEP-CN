      吉尔松尼德的宇宙论构成《上帝之战》其余各卷的背景。他的前辈迈蒙尼德曾主张，从月下天球的性质不能有效地推论月上世界的性质。然而吉尔松尼德拒斥这一区分的形而上学锋芒，并论证说：既然两个天球都含有物质元素，我们关于创世的知识就以天文学为基础，而天文学作为一门人类科学，与物理学在根本上并无不同。天文学只有由“既通数学又是自然哲学家的人”才能作为一门科学来研究，“因为这两门科学都能帮助他，他可从中取得完善其工作所需的一切”（*Wars*, V.1.1, p. 23）。吉尔松尼德认为天文学的最终功能是理解上帝。他告诉我们，天文学之所以有教益，不仅因为其题材崇高，也因为它对其它科学有用。研究诸天球与星辰，会不可抗拒地把我们引向对上帝更充分的认识与领会。天文学由此成为全书其余部分的支撑。
