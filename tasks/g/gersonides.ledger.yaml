      当然，众所周知，占星家在预测中常常出错。占星术的错误可以归因于若干因素。吉尔松尼德断言，总的说来，我们对诸天体的秩序所知甚少。“一般说来，人不可能知道月下世界秩序的［完整］真相。这在占星术中表现得很清楚：那里常有虚假的预测。人更不可能借其原因去认识月下世界的一般秩序，从而使自己的知识达到完善”（*Wars*, I.12, p. 219）。在某些情形下，信息没有被清晰地传达。为什么某些传达比另一些更清晰？体质上完善的想象官能既从强旺的天体、也从微弱的天体接受信息。所谓“微弱”，吉尔松尼德指的是某些天体既太弱，不足以在地上造成事件，也不足以传达关于这些事件的信息。于是他断定，关于未来的信息发出“自它所支配的那个特定正位（*panim*）中的主导天体，而非来自任何随从行星（*ha-meshartim*）”（*Wars*, II.7, pp. 69–70）。但对体质上不完善的想象官能来说，所接受的信息只来自主导天体。因此两种情形下所接受信息的总体质量不同。更具体地说，由于难以通过观察获得这些天体的必要位置，占星家常常无法核实自己的数据。再者，一个天体在任一给定时刻的黄道位置，要过数千年才重复一次，占星家便无从获得核实其知识所需的事件可重复性。再者，人类对诸天体根本没有充分的知识。
