      Gersonides’ attitude toward previous astronomers, coupled with his faith in human reason, are reflected in his discussion of creation. Maimonides went to great lengths to maintain that the topic of creation is beyond rational demonstration. Gersonides, on the other hand, devotes many chapters in *Milhamot* VI to proving that the Platonic theory of creation out of an eternal formless matter is rationally demonstrable. The question of whether the universe was created or had existed from eternity had been treated by Maimonides in an ambiguous manner; scholars still disagree over whether Maimonides ultimately upheld an Aristotelian, Platonic, or scriptural doctrine of creation. Gersonides’ position is unambiguously Platonic. Gersonides argues that the world was created outside of time by a freely willing agent. He must then decide whether the world was engendered *ex nihilo* or out of a preexistent matter. Arguing that *ex nihilo* creation is incompatible with physical reality, he adopts a model drawn from Plato’s *Timaeus*. Gersonides interprets the opening of Genesis to refer to two types of matter. *Geshem* is the primordial matter out of which the universe was created; not capable of motion or rest, it was characterized by negation and was inert and chaotic. This matter is identified with the primeval waters described in Genesis. *Homer* is prime matter, in the Aristotelian sense of a substratum always aligned with form. It contains within itself the potentiality to receive forms but is not an ontologically independent entity. Gersonides compares this matter to darkness: just as darkness is the absence of light, this matter represents the absence of form or shape. As noted by Glasner (2015) and Freudenthal (1987), this notion of a body that does not preserve its shape offered several important advantages. First, the space between the spheres, which is subject to continuous change, is filled by the body that does not preserve its shape, and so transmission can be explained by contact. Second, in the context of his theory of creation, this amorphous body is a remnant of the pre-existent entity (thou va-vohu) from which God shaped the world. On this basis Gersonides argues that the world was created out of an eternally preexistent matter.
    step1: |-
      吉尔松尼德对先前天文学家的态度，连同他对人类理性的信心，都反映在他的创世讨论中。迈蒙尼德费尽力气坚持创世问题超出理性论证的范围。吉尔松尼德则相反，在《上帝之战》第 6 卷中用许多章来证明：从永恒的无形质料中创世这一柏拉图式理论，是可由理性证明的。宇宙是被造的，还是自永恒便已存在，这个问题在迈蒙尼德那里处理得含混；学者们至今仍在争论，迈蒙尼德最终主张的是亚里士多德式、柏拉图式还是经文式的创世说。吉尔松尼德的立场明确是柏拉图式的。吉尔松尼德论证说，世界是由一位自由意愿的行动者在时间之外创造的。于是他必须判定：世界是无中生有（*ex nihilo*）产生的，还是出自先在的质料。他论证无中生有的创造与物理实在不相容，因而采用了一个取自柏拉图《蒂迈欧篇》的模型。吉尔松尼德把《创世记》的开篇解释为指两类质料。*Geshem* 是宇宙由之被造的原初质料；它既不能运动也不能静止，以否定为特征，惰性而无序。这种质料被等同于《创世记》所述的洪荒之水。*Homer* 是第一质料，取亚里士多德意义上的、始终与形式相配的基底之义。它自身含有接受形式的潜能，但并非在本体论上独立的实体。吉尔松尼德把这种质料比作黑暗：正如黑暗是光的缺失，这种质料代表形式或形状的缺失。正如 Glasner（2015）与 Freudenthal（1987）所指出的，这种“不保持自身形状的物体”的观念有几项重要优点。第一，天球之间不断变化的空间由这种不保持形状的物体填充，因而传递可以用接触来解释。第二，在他的创世理论中，这种无定形的物体是先在实体（thou va-vohu）的残余，上帝由之塑造世界。据此，吉尔松尼德论证世界是从永恒先在的质料中被造的。
    step2: |-
