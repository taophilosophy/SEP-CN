      错误的最后一个原因与人的自由意志有关：如上文所见，我们的理智与选择“有力量推动我们，背离诸天体所决定的东西”（*Wars*, II.2, p. 34）。尽管他承认人的选择有时能够违逆诸天体，但这种干预是罕见的，而在吉尔松尼德的本体论中，真正的偶然性确实是一种罕见的事态。吉尔松尼德提出一个论证，表明受理性引导的人的选择能够颠覆诸天体，尽管它们总体上安排着我们的生活。诸天体安排人事，或者凭借它们在诸天中位置的不同，或者凭借天体彼此之间的差异。然而星辰天体对不同个体的影响方式不同；它们也可以在不同时间以不同方式影响同一个人；最后，两个或更多的天体可以共同影响一个人，产生多种彼此相反的影响——这正呼应经院哲学的成语“*sapiens dominabitur astris*［智者将受星辰支配］”。吉尔松尼德指出，人能够违逆这些效果：上帝赋予人“一种理智能力（*sekhel ba’al takhlit*），使我们既能逆诸天体所安排而行，也能尽可能矫正降临于我们的［星辰所定的］厄运”（*Wars*, II.2, p. 35）。不过他向我们保证：凡出于偶然发生的事，都“按这类确定性与秩序被决定、被安排”（*Wars*, II.2, p. 34）。吉尔松尼德甚至超越了柏拉图在《理想国》第 4 卷中的等级结构安排，论证社会的终极完善与秩序要归因于占星术的影响。
