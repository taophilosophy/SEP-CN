      In her recent study of Gersonides’ science, Glasner notes that Gersonides “stands out as one of the more creative and daring figures in the medieval west” (Glasner 2015, p. 13)[^glasner-2015]. What distinguished Gersonides from his predecessors was his reliance upon and consummate knowledge of mathematics, coupled with his belief in the accuracy of observations achieved by the use of good instruments. Because of this rootedness in empirical observation bolstered by mathematics, Gersonides believed that he had the tools to succeed where others had failed. Only when he has resolved the problems in astronomy does Gersonides apply their findings to theological cosmology. As we shall see, Gersonides’ theology and astronomy are deeply involved with each other.
    step1: |-
      在最近关于吉尔松尼德科学的研究中，Glasner 指出，吉尔松尼德“是中世纪西方较有创造力和胆识的人物之一”（Glasner 2015, p. 13）[^glasner-2015]。使吉尔松尼德区别于前辈的，是他对数学的依赖与精通，加上他相信借助良好仪器所作的观察是准确的。正因为这种扎根于经验观察、又受数学支撑的取向，吉尔松尼德相信自己拥有在他人失败之处取得成功的工具。只有在解决了天文学中的问题之后，吉尔松尼德才把其发现应用于神学宇宙论。我们将会看到，吉尔松尼德的神学与天文学深深纠缠在一起。
    step2: |-
      Glasner 在晚近一部研究吉尔松尼德科学的著作中指出，吉尔松尼德“是中世纪西方最具创造力、最富胆识的人物之一”（Glasner 2015, p. 13）[^glasner-2015]。他与前辈的不同之处，在于他既倚重数学、又精通数学，并且相信只要仪器精良，观察就能准确。正因如此——经验观察为根，数学为辅——他相信自己握有工具，能在别人失败的地方成功。他总是在解决了天文学难题之后，才把结论用于神学宇宙论。下文将会说明，他的神学与天文学彼此缠绕极深。
