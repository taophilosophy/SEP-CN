      Gersonides is not known for his ethical views; as we have seen, most of his philosophical writings engage matters in the natural sciences. In his biblical commentaries, however, Gersonides focuses on a number of ethical issues. To take one example, Gersonides’ commentary on *Songs of Songs* is imbued with an extended discussion of human felicity. In this work, he claims that because of their inherent weakness and epistemological imperfections, most human beings are incapable of achieving felicity: “only very few individuals can acquire even a large measure of it.” (Gersonides, *Songs of Songs*, 6) For these masses, the Torah and its commandments function as the best guide to moral perfection. But if immortality is predicated on intellectual knowledge, and if philosophers such as Maimonides and Gersonides have argued that many individuals are psycho-physically incapable of embarking on such a rigorous and philosophical course of study, does it follow that not all humans can achieve intellectual perfection: is the road the same, and open, to all? And is there only one road to ultimate felicity, or are there many routes?
    step1: |-
      吉尔松尼德并不以伦理观点知名；如我们所见，他的哲学著作大多涉及自然科学方面的问题。然而在他的圣经注释中，吉尔松尼德关注若干伦理问题。举一个例子：吉尔松尼德对《雅歌》的注释中贯穿着关于人类幸福的长时间讨论。在这部作品中，他断言，由于人固有的弱点与认识论上的不完善，大多数人都无法达到幸福：“只有极少数人能够获得其中哪怕很大的一份。”（Gersonides, *Songs of Songs*, 6）对这些人众来说，托拉及其诫命充当通向道德完善的最佳指南。但如果不朽以理智知识为前提，而像迈蒙尼德与吉尔松尼德这样的哲学家又论证说，许多人在心理-生理上无法走上如此严格、如此哲学化的研习之路，那么是否可以说并非所有人都能达到理智完善？这条路是否对所有人相同并且开放？通往终极幸福的路只有一条，还是有多条？
    step2: |-
      吉尔松尼德并不以伦理学知名。如我们所见，他的哲学著作大多处理自然科学的问题；不过在圣经注释里，他关注了不少伦理问题。例如《雅歌》注释中就有关于人类幸福的长篇讨论。他在书中说，由于人固有的弱点和认识论上的缺陷，大多数人达不到幸福：“只有极少数人能得到其中一大份。”（Gersonides, *Songs of Songs*, 6）对这批大众而言，托拉及其诫命就是通向道德完善的最好指引。可是，若不朽以理智知识为前提，而迈蒙尼德、吉尔松尼德这样的哲学家又说许多人在身心上根本无力踏上如此严格、如此哲学化的研习之路，那是否意味着并非人人皆可达到理智完善？这条路对所有人是否相同、是否敞开？通向终极幸福的路只有一条，还是有许多条？
