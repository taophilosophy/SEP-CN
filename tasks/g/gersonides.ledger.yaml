      另一个两难围绕神意学说。如果上帝没有关于未来偶然后件的知识，怎么能说他向受造物施予神意？吉尔松尼德在《约伯记》注释与《上帝之战》第 4 卷中都讨论过这个问题。在两处他都论证：神意在本性上是一般的；它主要关乎种，只偶然地关乎种中的个别事物。例如，上帝并不知道列维·本·格尔松这个个别人，也不向他施予个别的神意。相反，正因列维·本·格尔松是人之种与哲学家之种的成员，他才处于能够接受给予这些群体的神意眷顾的地位。
