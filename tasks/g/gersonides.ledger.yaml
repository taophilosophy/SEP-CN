      Gersonides then unpacks the various levels of enlightenment that he finds in *Song of Songs*, moving from mathematics, to physics, astronomy and finally metaphysics. In this way, Gersonides emphasizes the natural sciences, in particular physics, as a propadeutic to metaphysics. Gersonides is clear that the science of physics builds upon moral knowledge derived from Scripture: “this science is impossible for one who is not strongly settled on the true views from the perspective of Torah and speculation.” (Gersonides *Song of Songs*, 11). Gersonides then unpacks the various allegories and symbolic representations in the work, all of which point to the goal of ultimate felicity as the union with God via the Active Intellect.
    step1: |-
      吉尔松尼德随后展开他在《雅歌》中找到的各个层次的启蒙，从数学到物理学、天文学，最后到形而上学。这样，吉尔松尼德强调自然科学，尤其是物理学，是形而上学的预备学科。吉尔松尼德明确指出，物理学这门科学建立在源自经文的道德知识之上：“凡未在托拉与思辨的视角下坚定确立真正观点的人，都不可能从事这门科学。”（Gersonides *Song of Songs*, 11）吉尔松尼德随后展开了作品中的各种寓意与象征表现，它们全都指向终极幸福这一目标，即经由能动理智与上帝结合。
    step2: |-
      接着，吉尔松尼德把《雅歌》中的启蒙层次层层展开：数学、物理学、天文学，最后到形而上学。他由此强调自然科学、尤其是物理学，是形而上学的预备。他也说得很清楚：物理学建立在由经文而来的道德知识之上，“凡未在托拉与思辨的视角下牢牢确立正确观点的人，都做不了这门学问”（Gersonides *Song of Songs*, 11）。随后他逐一展开书中的寓意与象征，而这些全都指向同一个目标：经由能动理智与上帝结合，达于终极幸福。
