      他的主要哲学著作《上帝之战》完成于 1329 年，前后写了十二年。1317 年，他为创世问题动笔。这个问题自亚历山大的斐洛以来一直困扰犹太哲学家，迈蒙尼德新近又作了细致的处理。吉尔松尼德不满意迈蒙尼德的讨论，打算重开此案。但计划很快搁下：他觉得若不先在时间、运动、无限这些问题上打好根基，创世问题就谈不充分。到 1325 年，手稿已不只讨论创世，还涉及不朽、占卜与预言；到 1328 年，又添了论神意的一章。按他自己的纪年，第 5、6 卷在 1329 年完成。
