      Horwitz claims that this theme is apparent in Gersonides’ biblical commentaries: “a central role of Ralbag’s biblical commentaries is the desire to help his readers attain eternal intellectual felicity through knowledge of the truth.” (Horwitz 2006, p. 124)[^horwitz-2006] Nowhere is this emphasis seen more clearly than in Gersonides’ commentary to *Song of Songs*. Ostensibly the *Song of Songs* describes the love affair and desires of a shepherd for a maiden. Generations of commentators saw in the work an allegory of the relation between God and the people Israel. Gersonides, however, provides a philosophical reading of the work that incorporates two sets of subsidiary dialogues, first between the human material intellect and the Active Intellect, and second between the faculties of the soul and the material intellect. Gersonides spells out the import of these discussions in his introduction to the work. He first lays down the premise that “man’s ultimate felicity resides in cognizing and knowing God to the extent that is possible for him.” (*Song of Songs*, 5) Such knowledge is achieved through observation of the state of existing things in the natural universe, that is, through the beings that God has created and caused. Knowledge of God, therefore, is predicated on knowledge of the natural order.
    step1: |-
      Horwitz 断言，这一主题在吉尔松尼德的圣经注释中显而易见：“拉尔巴格圣经注释的一个核心作用，是希望帮助读者通过对真理的认识而达到永恒的理智幸福。”（Horwitz 2006, p. 124）[^horwitz-2006] 这一强调在吉尔松尼德对《雅歌》的注释中表现得最为清楚。表面上看，《雅歌》描写的是一位牧人对一位少女的爱恋与渴望。历代注释者在这部作品中看到的，是上帝与以色列民族之间关系的寓意。然而吉尔松尼德提供了一种哲学读法，其中纳入两组附属对话：第一组在人的质料理智与能动理智之间，第二组在灵魂的诸能力与质料理智之间。吉尔松尼德在该书导言中阐明了这些讨论的意义。他先立下一个前提：“人的终极幸福在于尽其所能地认知并认识上帝。”（*Song of Songs*, 5）这种知识通过对自然宇宙中现存事物状态的观察而获得，也就是通过上帝所创造、所造成的存在者而获得。因此，对上帝的知识以对自然秩序的知识为前提。
    step2: |-
      Horwitz 认为，这一主题在吉尔松尼德的圣经注释里随处可见：“拉尔巴格圣经注释的核心用意之一，是帮助读者通过对真理的认识获得永恒的理智幸福。”（Horwitz 2006, p. 124）[^horwitz-2006] 这一点在《雅歌》注释中最为明显。《雅歌》表面上写一位牧人对少女的爱慕与渴求；历代注释者则从中读出上帝与以色列民族关系的寓意。吉尔松尼德给出的却是哲学读法，其中安排了两组附属对话：一是人的质料理智与能动理智之间，二是灵魂诸能力与质料理智之间。他在该书导言里点明这些讨论的用意，先立前提：“人的终极幸福，在于尽其所能地认知并认识上帝。”（*Song of Songs*, 5）这样的知识来自对自然宇宙中现存事物的观察，也就是对上帝所造、所因之物的观察。所以，认识上帝以认识自然秩序为前提。
