      Gersonides’ philosophical ideas went against the grain of traditional Jewish thought; he also challenged scholastic thought. Glasner suggests that unlike his Christian peers who studied and taught at a university, Gersonides’ academic profile as rooted in applied mathematics and astronomy allowed him to leave metaphysics behind. He offered a serious critique of Aristotle’s theory of motion, thus freeing himself as well from “the grip of Aristotelian physics, and even laid down a basis for an alternative understanding of motion” (Glasner 2015, p. 106)[^glasner-2015]. Gersonides reflects the following characteristics: first, his writings demonstrate a fundamental interplay and harmony between astrological and theological beliefs. It is clear that the appeal of astrology lay in the fact that it offered useful information, while it looked and operated like a science. Even the critics of astrology had to agree that the heavens exerted a real influence upon terrestrial events. The complexity of the rules of astrology and internal disagreement among its followers served to increase the respect accorded to the science. Failures did not cause the astrologer to lose faith, just as failures among modern physicists do not lead to loss of faith in science. Gersonides believed that life on earth had a meaning, and that terrestrial events had an order. Astrology was a means of ascertaining that meaning. Gersonides’ views on prophecy, providence, free-will and evil reflected ingredients of this philosophical determinism. Whereas his commentaries occupied a central place in Jewish theology, his philosophical work was rejected. Jewish philosophers such as Hasdai Crescas and Isaac Abrabanel felt obliged to subject his works to lengthy criticism. Only in recent years has Gersonides received his rightful place in the history of philosophy. As scholars have rediscovered his thought and have made his corpus available to a modern audience, Gersonides is once again appreciated as an insightful, ruthlessly consistent philosopher.
    step1: |-
      吉尔松尼德的哲学观念与传统的犹太思想格格不入；他也挑战了经院思想。Glasner 提出，与那些在大学里研习和授课的基督教同行不同，吉尔松尼德以应用数学与天文学为根基的学术面貌，使他得以把形而上学抛在身后。他对亚里士多德的运动理论提出了严肃的批评，从而也使自己摆脱了“亚里士多德物理学的掌控，甚至为另一种关于运动的理解奠定了基础”（Glasner 2015, p. 106）[^glasner-2015]。吉尔松尼德体现出以下特征：第一，他的著作展示了占星术信念与神学信念之间根本性的相互作用与和谐。显然，占星术的吸引力在于它提供有用的信息，而它的样子与运作方式又像一门科学。甚至占星术的批评者也必须承认，诸天对地上事件施加了真实的影响。占星术规则的复杂性以及其追随者之间的内部分歧，反而增加了这门科学所受到的尊重。失败并没有让占星家失去信心，正如现代物理学家的失败不会导致人们失去对科学的信心。吉尔松尼德相信，地上生命有其意义，地上事件有其秩序。占星术是确定这一意义的手段。吉尔松尼德关于预言、神意、自由意志与恶的观点，反映了这种哲学决定论的成分。他的注释在犹太神学中占据中心地位，他的哲学著作却遭到拒斥。哈斯代·克雷斯卡斯、以撒·阿布拉瓦内尔等犹太哲学家觉得有义务对他的著作进行冗长的批评。直到近年，吉尔松尼德才在哲学史上获得他应有的位置。随着学者们重新发现他的思想、使他的著作集能为现代读者所用，吉尔松尼德再次被赏识为一位富有洞见、极其彻底一贯的哲学家。
    step2: |-
      吉尔松尼德的哲学观念违背传统犹太思想的路数，也挑战了经院思想。Glasner 认为，基督教同行大多在大学里研习、授课，吉尔松尼德则不同：他的学术根基在应用数学与天文学，这使他得以把形而上学搁在一边。他严肃批评亚里士多德的运动理论，从而也摆脱了“亚里士多德物理学的束缚，甚至为另一种运动理解奠定了基础”（Glasner 2015, p. 106）[^glasner-2015]。吉尔松尼德有几个特点。其一，他的著作显示出占星术信念与神学信念之间根本的相互作用与和谐。占星术之所以有吸引力，显然在于它提供有用的信息，而模样与运作又都像一门科学；连它的批评者也不得不承认，诸天对地上事件确有真实影响。占星术规则繁复，追随者内部又分歧不断，这反倒抬高了这门科学所受的尊重。失败不曾让占星家失去信心，正如现代物理学家的失败不会让人失去对科学的信心。吉尔松尼德相信，地上生命自有意义，地上事件自有秩序，而占星术正是确定这意义的手段。他关于预言、神意、自由意志与恶的观点，都映出这种哲学决定论的成分。他的注释在犹太神学中居于中心，哲学著作却遭拒斥；哈斯代·克雷斯卡斯、以撒·阿布拉瓦内尔等犹太哲学家觉得有义务长篇批驳他的著作。直到近年，吉尔松尼德才在哲学史上得到应有的位置。学者们重新发现他的思想，把他的著作集送到现代读者面前，他才再度被推许为一位富有洞见、彻底一贯的哲学家。
