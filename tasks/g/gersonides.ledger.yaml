      For Gersonides, the issues of prophecy, omniscience and providence are developed against the backdrop of astrological determinism. Like many thinkers of the late Middle Ages, Gersonides had to confront two opposing sets of traditions: on the one hand, attacks by religious authorities (e.g. Augustine’s attack in *City of God*; Maimonides’ letters) on the grounds that astrology compromised human free will; on the other hand, the wide scale acceptance of astrology from the 12th century on. In the 12ᵗʰ and 13ᵗʰ centuries, most Jewish and Christian philosophers supported natural astrology, the view that the celestial bodies affect sublunar life and existence to some extent at least. That the sun and moon both affect natural cycles and events on earth is unequivocal and represents a classic paradigm of natural astrology. The calculations of natural astrology overlapped those of astronomy, and could be utilized for practical purposes such as fixing the calendar. According to astrologers, each planet and sign of the zodiac has its own character, power and attributes. Inasmuch as the characters of the planets and the signs of the zodiac are opposed to each other, they are engaged in a perpetual power struggle. Thus the position of the planets and their interrelation with the signs of the zodiac, regulate the fate of both individuals and nations. Astrological predictions could apply, then to both individuals as well as to the history of Israel and its place in universal history.
    step1: |-
      对吉尔松尼德来说，预言、全知与神意这些问题都是在占星决定论的背景下展开的。像许多中世纪晚期的思想家一样，吉尔松尼德必须面对两套相互对立的传统：一方面是宗教权威的攻击（例如奥古斯丁在《上帝之城》中的攻击；迈蒙尼德的信札），理由是占星术损害人的自由意志；另一方面是自十二世纪起对占星术的广泛接受。在十二与十三世纪，大多数犹太与基督教哲学家都支持自然占星术，即认为天体至少在某些程度上影响月下生命与存在的观点。太阳与月亮都影响自然循环与地上的事件，这一点确凿无疑，构成自然占星术的经典范式。自然占星术的计算与天文学的计算重叠，可用于确定历法等实际目的。按占星家的说法，每颗行星与每个黄道宫各有其性、其力与其属性。行星之性与黄道宫之性彼此相克，它们便处于永不停歇的力量争斗之中。因此，行星的位置以及它们与黄道宫的相互关系，支配着个人与国家的命运。于是占星预测既可施于个人，也可施于以色列的历史及其在普世史中的位置。
