      These reasons from authoritative religious texts may not be taken to be conclusive, however. One may take these sorts of texts seriously as an adherent to faiths they define and still hold that God doesn’t have creative control over necessarily existing abstract objects. For instance, Peter van Inwagen (2009) argues that the universal quantifier in claims like that of the Nicene Creed “maker of all things visible and invisible” is implicitly restricted to include only those things that are capable of being created. Necessarily existing abstract objects cannot enter into causal relations and thus can’t be created. But it is worth noting that philosophers who think that if there are necessarily existing abstract objects, God must have some sort of control over them (e.g., Craig 2016)[^craig-2016] point to texts like those cited above for justification for this view.
    step1: |-
      不过，来自权威宗教文本的这些理由未必会被当作决定性的。一个人可以严肃对待自己所信奉的宗教所界定的这类文本，同时仍然坚持上帝对必然存在的抽象对象没有创造性的控制力。例如，Peter van Inwagen（2009）主张，《尼西亚信经》中“创造有形无形万物的主”这类说法里的全称量词，暗含限制，只包括那些能够被创造的东西。必然存在的抽象对象无法进入因果关系，因而不能被创造。但值得注意的是，那些认为只要存在必然存在的抽象对象上帝就必定对之拥有某种控制力的哲学家（如 Craig 2016）[^craig-2016]，正是援引上文所引的那类文本，为这一观点提供依据。
