      Even if the emanationist successfully replies to this first problem for the view, there is a second, and perhaps more serious objection to the view. We will call this objection “the bootstrapping objection” (see Leftow 1990, Davidson 1999, Bergmann and Brower 2006, and Gould 2014b for discussion of this sort of objection)[^bergmann-2006][^davidson-1999][^gould-2014b][^leftow-1990]. We can put the concern this way (following Davidson 1999)[^davidson-1999]. To cause something to exist is to cause its essence (or, in the terminology of Plantinga 1980, its *nature*)[^plantinga-1980] to be exemplified. Suppose God creates a certain table which has as a part of its essence *being red*. Then God causes the property *being red* to be exemplified by the table when he creates it. Consider the property *being omnipotent*. The property *being exemplified by God* is contained in its essence. So, God causes the property *being exemplified by God* to be exemplified by *being omnipotent* in causing *being omnipotent* to exist. Similar to the manner with which God causes *being red* to be exemplified by the table in exemplifying the table’s essence, God causes *being omnipotent* to be exemplified by himself. But, surely God can’t cause the property *being omnipotent* to be exemplified by himself: How can God make himself omnipotent? Furthermore, one might think that God’s omnipotence should be causally prior to his causing properties to exist. However, on this occasion it is not. Then, if one does think that God’s omnipotence should be causally prior to his causing properties to exist, this would be an instance of causal circularity. This sort of argument will work for other properties like *being omniscient* or *having divine cognitive activity* (although the causal circle may be more difficult to establish with the former, and the implausibility of self-exemplification may be more difficult to establish with the latter).
    step1: |-
      即便流溢论者成功回应了这一观点的第一个问题，该观点还有第二个、或许更严重的反驳。我们称之为“自我拔擢反驳”（关于这类反驳的讨论，见 Leftow 1990, Davidson 1999, Bergmann and Brower 2006, and Gould 2014b）[^bergmann-2006][^davidson-1999][^gould-2014b][^leftow-1990]。我们可以这样表述这一顾虑（依 Davidson 1999）[^davidson-1999]：致使某物存在，就是致使其本质（或按 Plantinga 1980 的术语，其*本性*）得到例示[^plantinga-1980]。假设上帝创造了某张桌子，该桌子的本质有一部分是*是红的*。那么上帝在创造这张桌子时，便致使属性*是红的*被该桌子例示。再考虑属性*全能*。属性*被上帝例示*包含在它的本质之中。于是，上帝在致使*全能*存在时，便致使属性*被上帝例示*被*全能*例示。与上帝在例示桌子本质时致使*是红的*被桌子例示的方式相似，上帝致使*全能*被他自己例示。但上帝显然不可能致使属性*全能*被他自己例示：上帝如何能让自己全能？再者，人们可能认为，上帝的全能应当因果地先于他致使属性存在。然而在此情形中并非如此。那么，如果确实认为上帝的全能应当因果地先于他致使属性存在，这里便是一例因果循环。这类论证对*全知*或*具有神圣认知活动*等其他属性同样适用（尽管就前者而言因果循环较难成立，就后者而言自我例示的不可信较难成立）。
