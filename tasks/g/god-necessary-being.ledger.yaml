      There likely would be little objection to reasoning to divine grounding of necessarily existing abstracta in the above way, *if it were thought that God could have control over these sorts of abstracta*. However, someone might concur with van Inwagen that abstracta can’t enter into causal relations, and say that the only way that abstracta might be grounded in God is via causation. Or someone might think that the idea of a necessarily existing object depending on *anything* is incoherent.[^note-6] If one took either of these positions, one would deny that the being who grounds necessarily existing abstract objects was greater than the one who didn’t. (Just as she would deny that a being who can make a square circle is greater than one who can’t—there can’t be a being who can make a square circle.)
    step1: |-
      假如*认为上帝能够对这类抽象物拥有控制力*，那么以上述方式推出上帝为必然存在的抽象物奠基，大概不会有多少人反对。然而，有人可能赞同 van Inwagen，认为抽象物无法进入因果关系，并说抽象物奠基于上帝的唯一途径只能是因果作用。也有人可能认为，一个必然存在的对象竟然依赖*任何东西*，这种想法本身就不融贯。[^note-6] 采取其中任一立场的人，都会否认那个为必然存在的抽象对象奠基的存在者比不为其奠基者更伟大。（正如她也会否认能造出方的圆的存在者比不能者更伟大——不可能有能造出方的圆的存在者。）
    step2: |-
      倘若*人们认为上帝能对这类抽象物拥有控制力*，那么用上面的方式推出上帝为必然存在的抽象物奠基，大概不会遇到多少反对。可是，有人可能赞同 van Inwagen，认为抽象物进不了因果关系，因而抽象物奠基于上帝的唯一可能途径就是因果作用；也有人可能认为，一个必然存在的对象竟然依赖*任何东西*，这想法本身就不融贯。[^note-6] 谁采取这两种立场之一，谁就会否认：为必然存在的抽象对象奠基的存在者比不为其奠基者更伟大。（同样，她也会否认能造出方的圆的存在者比不能者更伟大——毕竟不可能有能造出方的圆的存在者。）
