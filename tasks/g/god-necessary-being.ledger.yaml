      Theistic emanationism allows the theist to take seriously the claims of religious documents that God creates everything (indeed, the name of Morris/Menzel’s paper is “Absolute Creation”), and it avoids the problems that beset theistic voluntarism. It has virtues. But it has problems of its own. First, some philosophers claim that God *already* has to have critical properties in order to be able to cause abstracta to exist. The theistic emanationist claims that God causes properties such as *being omniscient*, *being omnipotent*, *existing necessarily*, *being able to cause abstracta to exist*, and *having cognitive activity* to exist. She also claims that God causes his own haecceity, *being God*, to exist. However, to claim this is to get the dependence relationship backwards, one might charge. Surely, God’s being able to cause abstract objects to exist must be posterior to his having properties like the ones mentioned above. And if God has these properties, they must exist. But, the proponent of this theory is committed to the existence of properties being posterior to God’s causing them to exist. Thus, the objection concludes, theistic emanationism is false (see Leftow 1990, Davison 1991, Davidson 1999, Bergmann and Brower 2006 for discussion of this sort of objection)[^bergmann-2006][^davidson-1999][^davison-1991][^leftow-1990].
    step1: |-
      有神论流溢论使有神论者得以认真对待宗教文献中上帝创造一切的断言（Morris/Menzel 那篇论文的题目正是“绝对创造”），也避开了困扰有神论意志主义的那些问题。它有其优点。但它也有自身的问题。首先，一些哲学家主张，上帝*已然*必须具有某些关键属性，才能致使抽象物存在。有神论流溢论者主张，上帝致使诸如*全知*、*全能*、*必然存在*、*能够致使抽象物存在*以及*具有认知活动*这样的属性存在。她还主张，上帝致使他自己的此性，即*是上帝*，存在。然而，有人可能指责说，这样主张就把依赖关系弄反了。上帝能够致使抽象对象存在，无疑必定后于他具有上述那些属性。而如果上帝具有这些属性，它们必定存在。但这一理论的支持者却承诺：属性的存在后于上帝致使它们存在。于是该反驳得出结论：有神论流溢论为假（关于这类反驳的讨论，见 Leftow 1990, Davison 1991, Davidson 1999, Bergmann and Brower 2006）[^bergmann-2006][^davidson-1999][^davison-1991][^leftow-1990]。
    step2: |-
