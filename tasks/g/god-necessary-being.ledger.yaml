      There is a second sort of reasoning that may lead someone to think that God grounds the existence of necessarily existing abstract objects. That is by way of *perfect being theology* (see Morris 1987a, 1987b and Nagasawa 2017 for discussion)[^morris-1987a][^nagasawa-2017]. Perfect being theology is a way of theorizing *a priori* about God that goes back at least to Anselm of Canterbury. One begins with the claim that God is the greatest possible being, and from there one can derive attributes that God must have. This method is one way of arriving at God’s being omnipotent, omniscient, and perfectly good. Anselm himself famously thought that via perfect being theology he could conclude that God existed. For our purposes here, we are to imagine two conceptually possible beings: One being has grounds or explains the existence of necessarily existing abstract objects, and the other doesn’t. We are to see that the being that grounds these abstracta is greater than one who doesn’t, and thus we are to conclude that God (the greatest possible being) has control over necessarily existing abstract objects. Sometimes the intuition that the former being is greater than the latter is put in terms of God’s *aseity*, or independence from all other entities. A being with maximal aseity is greater than one without it (other things being equal); and if necessarily existing abstract objects don’t depend on God, God lacks maximal aseity.
    step1: |-
      还有第二类推理，可能使人认为上帝为必然存在的抽象对象的存在奠基。这条路借助的是*完满存在者神学*（讨论见 Morris 1987a, 1987b and Nagasawa 2017）[^morris-1987a][^nagasawa-2017]。完满存在者神学是一种关于上帝的*先天*理论化方式，至少可以追溯到坎特伯雷的安瑟伦。它从“上帝是最伟大的可能存在者”这一主张出发，由此推出上帝必定具有的种种属性。这也是得出上帝全能、全知、至善的一条途径。安瑟伦本人就以借助完满存在者神学推出上帝存在而闻名。就本文的目的而言，我们要设想两个概念上可能的存在者：一个为必然存在的抽象对象的存在提供根据或解释，另一个则不提供。我们要看到，为这些抽象物奠基的存在者比不为其奠基者更伟大，由此便可断定：上帝（最伟大的可能存在者）对必然存在的抽象对象拥有控制力。有时，人们用上帝的*自存性*，即对一切其他实体的独立性，来表达“前者比后者更伟大”这一直觉。具有最大自存性的存在者比不具备者更伟大（其他条件相同）；而如果必然存在的抽象对象不依赖上帝，上帝便缺乏最大的自存性。
    step2: |-
      还有第二条推理路子，也会让人认为上帝为必然存在的抽象对象的存在奠基，那就是*完满存在者神学*（讨论见 Morris 1987a, 1987b and Nagasawa 2017）[^morris-1987a][^nagasawa-2017]。完满存在者神学是一种*先天*地谈论上帝的方式，至少可以追溯到坎特伯雷的安瑟伦：先从“上帝是最伟大的可能存在者”出发，再推出上帝必定具有的属性。上帝之所以全能、全知、至善，这也是一个由来。安瑟伦本人就以凭此推出上帝存在而著称。就本文而言，我们要设想两个概念上可能的存在者：一个为必然存在的抽象对象的存在提供根据或解释，另一个不然。既然后者不如前者伟大，便可断定：上帝（最伟大的可能存在者）对必然存在的抽象对象拥有控制力。有时人们用上帝的*自存性*，即对一切其他实体的独立性，来表述这一直觉：前者比后者更伟大。自存性最大的存在者比自存性不足者更伟大（其他条件相同）；而必然存在的抽象对象若不依赖上帝，上帝便没有最大的自存性。
