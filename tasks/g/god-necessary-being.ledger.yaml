      ### 4.2 Theistic Nominalism
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      The theistic nominalist doesn’t think there are necessarily existing abstract objects. She may or may not think if there were necessarily existing abstract objects, they would be grounded in God. For instance, William Lane Craig (2016) who is a theistic nominalist; thinks that were there necessarily existing abstracta, they would have to be grounded in God. (We presumably should count Craig as someone who thinks there are true counterpossibles.) But one can imagine someone who thinks that if things like numbers and properties did exist, theistic Platonism would be a plausible view to adopt. It is worth noting that very few—if any—of the realists about necessarily existing abstracta who are theists are themselves realists *because* they are theists. Rather, they are realists about necessarily existing abstracta for other sorts of reasons (e.g., indispensability arguments, arguments that we quantify over them with true sentences, or arguments that true sentences (e.g., that 2+3=5) require them as truthmakers (see Rodriguez-Pereyra (2005) for a defense of truthmakers). Van Inwagen himself believes in necessarily existing abstract objects because he thinks that we are committed to true existential quantifications over them (e.g., van Inwagen 2014: ch. 8)[^inwagen-2014]. There is nothing in particular the theistic nominalist needs to say *qua* theist about the existence of necessarily existing abstracta that any other nominalist doesn’t need to say. One advantage of theistic nominalism is that it allows one to avoid some of the sorts of difficult maneuvers that those who believe God grounds the existence of necessarily existing abstract objects wind up performing. Another advantage of theistic nominalism is that it allows one, if she wishes, to avoid debates about the semantics of universal quantifiers in ancient religious texts. Of course, theistic nominalism is open only to those who find plausible nominalistic replies to standard arguments for realism about necessarily existing abstracta. Craig himself thinks that he can give replies to these standard arguments for realism (2016: ch. 3, 6, 7).[^note-12]
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      We turn now to two “mixed views”, views on which different types of abstracta stand in different grounding relations to God. Both of them try to bracket abstracta having to do with God (e.g., God’s own attributes), and to say that God doesn’t ground those. But God grounds all the other necessarily existing abstracta.
    step1: TBD
