  - id: 4
    kind: body
    source: |-
      The main question we will address in this article is: Does God *ground* the existence of necessarily existing abstract objects? It is perhaps a more general question than a question one might at first ask: Did God create necessarily existing abstracta? But it is the main question that philosophers who have written about the relation between God and abstract objects have sought to answer.
    step1: |-
      本文要处理的主要问题是：上帝是否为必然存在的抽象对象的存在*奠基*？这个问题或许比人们起初可能问的问题更一般：上帝是否创造了必然存在的抽象物？但它正是那些论述上帝与抽象对象之关系的哲学家力图回答的主要问题。
    step2: |-
      本文集中处理的问题是：必然存在的抽象对象，其存在是否由上帝*奠基*？这也许比人们一开始会问的更一般：上帝是否创造了必然存在的抽象物？不过，凡论述上帝与抽象对象之关系的哲学家，力图回答的主要都是这一问题。
  - id: 5
    kind: body
    source: |-
      Over the last two decades, philosophers have done a great deal of work on the notion of grounding (see, e.g., Fine 2001, Rosen 2010, Audi 2012, Schaffer 2009 Koslicki 2012 and the Stanford Encyclopedia entry on grounding)[^audi-2012][^fine-2001][^koslicki-2012][^rosen-2010][^schaffer-2009]. It is thought by many currently working on issues in the metaphysics of grounding that grounding is a primitive, *sui generis* relation. In particular, it is not to be understood as a supervenience or causal relation. How are we then to understand what it is? Philosophers point to particular cases where it is instanced: Dispositional properties are grounded in categorical properties, the mental is grounded in the physical, the semantic is grounded in the non-semantic, features like smiles or surfaces are grounded in facts about bodies, and so on. To this point, one might think that grounding talk can be captured by our ordinary notion of supervenience.[^note-3] But Fine (2001) claims that Socrates’ singleton set is grounded in Socrates; yet, necessarily one exists just if the other does. Thus our ordinary modal notion of supervenience won’t capture this case of grounding. If we assume (as many in the grounding literature do) that the other cases of grounding are of the same sort as the Socrates-singleton case is, then our ordinary notion of supervenience won’t capture them either.
    step1: |-
      过去二十年里，哲学家围绕奠基这一概念做了大量工作（see, e.g., Fine 2001, Rosen 2010, Audi 2012, Schaffer 2009 Koslicki 2012 and the Stanford Encyclopedia entry on grounding）[^audi-2012][^fine-2001][^koslicki-2012][^rosen-2010][^schaffer-2009]。现在研究奠基形而上学问题的许多人认为，奠基是一种原始的、*自成一类*的关系。尤其不能把它理解为随附关系或因果关系。那么我们该如何理解它到底是什么？哲学家举出了它得以实例化的若干具体情形：倾向属性奠基于范畴属性，心理之物奠基于物理之物，语义之物奠基于非语义之物，微笑、表面之类的特征奠基于关于物体的事实，如此等等。说到这里，人们或许会以为，关于奠基的说法可以用我们通常的随附性概念来把握。[^note-3] 但 Fine（2001）主张，苏格拉底的单元素集奠基于苏格拉底；然而，二者必然同存同灭。于是，我们通常的模态随附性概念捕捉不到这一奠基情形。如果我们假定（奠基文献中许多人都这样假定）其他奠基情形与苏格拉底—单元素集的情形同类，那么通常的随附性概念也同样捕捉不到它们。
    step2: |-
      近二十年来，哲学家在奠基这一概念上下了很大功夫（see, e.g., Fine 2001, Rosen 2010, Audi 2012, Schaffer 2009 Koslicki 2012 and the Stanford Encyclopedia entry on grounding）[^audi-2012][^fine-2001][^koslicki-2012][^rosen-2010][^schaffer-2009]。如今研究奠基形而上学的许多人相信，奠基是一种原始的、*自成一类*的关系，尤其不能当作随附关系或因果关系来理解。那么，它究竟是什么？哲学家举出一些实例：倾向属性奠基于范畴属性，心理之物奠基于物理之物，语义之物奠基于非语义之物，微笑、表面这类特征奠基于关于物体的事实，如此等等。说到这里，人们或许会想，谈奠基无非是用我们熟悉的随附性概念来说事。[^note-3] 可是 Fine（2001）主张，苏格拉底的单元素集奠基于苏格拉底，而二者在必然性上同存同灭。可见通常的模态随附性概念刻画不了这一奠基情形；倘若（如奠基文献中许多人所假定的）其他奠基情形与苏格拉底—单元素集同类，那么它们同样逃不出随附性的把握。
  - id: 6
    kind: body
    source: |-
      Our discussion of the question of God’s grounding the existence of necessarily existing abstracta bears on the general conversation about the nature of grounding. *First*, we can note that our divine grounding case stands alongside the Socrates-singleton case in showing that ordinary supervenience won’t capture the grounding relationship properly. For instance, suppose we say that God grounds the existence of the number 2. We then can note that, necessarily God exists just if 2 does (that is, each exist in every possible world). According to ordinary notions of supervenience, the number 2 supervenes on God, and conversely. But we are to think that God grounds the existence of 2, and not vice versa. *Second*, we have here in the case of divine grounding of abstracta a case where the grounding relationship *is* typically spelled out in other, familiar terms (and thus isn’t *sui generis*). As we will see, a number of different philosophers who think that God grounds the existence of necessarily existing abstract objects think that God does so in a *causal* manner. Others think that the grounding takes place in that necessarily existing abstracta are *identical with* divine mental states.
    step1: |-
      我们关于上帝是否为必然存在的抽象物的存在奠基这一问题的讨论，关系到关于奠基本性的总体讨论。*第一*，我们可以指出，上帝奠基这一情形与苏格拉底—单元素集的情形并立，同样表明通常的随附性无法恰当刻画奠基关系。例如，假设我们说上帝为数字 2 的存在奠基。那么我们便可指出：必然地，上帝存在当且仅当 2 存在（也就是说，二者在每一个可能世界中都存在）。按照通常的随附性概念，数字 2 随附于上帝，反之亦然。但我们要主张的是，上帝为 2 的存在奠基，而不是相反。*第二*，在上帝为抽象物奠基这一情形中，奠基关系*恰恰*通常是用别的、为人熟知的术语来阐明的（因而并非*自成一类*）。我们将会看到，不少认为上帝为必然存在的抽象对象的存在奠基的哲学家，认为上帝是以*因果*方式做到这一点的。另一些人则认为，此种奠基在于必然存在的抽象物*等同于*神圣心灵状态。
    step2: |-
      我们以上帝是否为必然存在的抽象物的存在奠基为题所做的讨论，也牵连到关于奠基本性的总体讨论。*第一*，上帝奠基这一情形与苏格拉底—单元素集的情形一样，都能说明通常的随附性不足以恰当刻画奠基关系。试假设上帝为数字 2 的存在奠基。那么必然地，上帝存在当且仅当 2 存在（即二者在每一个可能世界都存在）。按通常的随附性概念，数字 2 随附于上帝，反过来也一样。可我们想说的是上帝为 2 的存在奠基，而非相反。*第二*，上帝为抽象物奠基这一情形，其奠基关系*恰恰*通常是用别的、为人熟知的术语来交代的（因此并不*自成一类*）。下文将看到，不少认为上帝为必然存在的抽象对象的存在奠基的哲学家，主张上帝是以*因果*方式做到这一点的；另一些人则认为，此种奠基于必然存在的抽象物*等同于*神圣心灵状态。
  - id: 7
    kind: body
    source: |-
      One might look at those who claim that God causes necessarily existing abstract objects or that they are identical with divine mental states as not asserting that God grounds the existence of necessarily existing abstracta. But as we will see, each of these sorts of theorists really *is* saying that God grounds the existence of necessarily existing abstract objects. Thus, it might be better to cast our lot with those who are skeptical that there is a *sui generis* grounding relationship that metaphysicians investigate. Or, if there is such a relationship in some cases of grounding, it isn’t present in all cases of grounding (it isn’t “univocal”—see Hofweber 2009 and Daly 2012 for discussion)[^daly-2012][^hofweber-2009]. After all, it is perfectly sensible to recast “Do necessarily existing abstract objects depend on God?” as “Are necessarily existing abstract objects grounded in God?”
    step1: |-
      人们或许会认为，那些主张上帝使必然存在的抽象对象产生、或主张这类对象等同于神圣心灵状态的人，并没有断言上帝为必然存在的抽象物的存在奠基。但我们将会看到，这两类理论家实际上*都*在说：上帝为必然存在的抽象对象的存在奠基。因此，更好的做法或许是与那些怀疑形而上学家所探究的*自成一类*奠基关系的人站在一起。或者，即便在有些奠基情形中存在这种关系，它也并非出现在所有奠基情形中（它并非“单义的”——讨论见 Hofweber 2009 与 Daly 2012）[^daly-2012][^hofweber-2009]。毕竟，把“必然存在的抽象对象是否依赖上帝？”改述为“必然存在的抽象对象是否奠基于上帝？”，完全说得通。
    step2: |-
      有人可能会想，说上帝使必然存在的抽象对象产生，或者说这类对象等同于神圣心灵状态，都不算断言上帝为必然存在的抽象物的存在奠基。可下文将表明，这两类理论家实际上*都*在说：上帝为必然存在的抽象对象的存在奠基。既然如此，我们不如与那些怀疑形而上学家所探究的*自成一类*奠基关系的人为伍。要么，即便某些奠基情形中确有此关系，它也并非见于一切奠基情形（它并不“单义”——讨论见 Hofweber 2009 与 Daly 2012）[^daly-2012][^hofweber-2009]。归根到底，把“必然存在的抽象对象是否依赖上帝？”改写为“必然存在的抽象对象是否奠基于上帝？”，再顺理成章不过。
  - id: 8
    kind: body
    source: |-
      However we think of the dependence relationship between God and necessarily existing abstract objects, we will want to insist that on it God is somehow more fundamental than necessarily existing abstract objects. Fundamentality (Stanford Encyclopedia entry) is an asymmetric relationship. Thus we will construe those who think that God grounds the existence of necessarily existing abstracta as claiming that God is more fundamental than necessarily existing abstracta, and not conversely.
    step1: |-
      无论我们如何看待上帝与必然存在的抽象对象之间的依赖关系，我们都会坚持：在这一关系中，上帝在某种意义上比必然存在的抽象对象更为基本。基本性（《斯坦福哲学百科全书》有专条）是一种不对称的关系。因此，我们将把那些认为上帝为必然存在的抽象物的存在奠基的人，理解为在主张上帝比必然存在的抽象物更为基本，而不是相反。
    step2: |-
      不管怎样理解上帝与必然存在的抽象对象之间的依赖关系，我们都想强调：在这一关系中，上帝在某种意义上比必然存在的抽象对象更基本。基本性（《斯坦福哲学百科全书》有专条）是一种不对称的关系。所以，说上帝为必然存在的抽象物的存在奠基，就等于说上帝比必然存在的抽象物更基本，反之则不成立。这就是我们对这类主张的解读。
