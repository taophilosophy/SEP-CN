      There are at least two sorts of reasons why someone might be inclined to think that God grounds the existence of necessarily existing abstract objects. The first sort of reason involves central religious texts in monotheistic faiths like Judaism, Christianity, and Islam. Roughly, this sort of reason consists in these texts’ assertions or suggestions that God has created everything. If God created everything, it must be that God has created necessarily existing abstract objects, as well. Thus, God grounds the existence of these abstract objects. For instance, there are statements in the Hebrew Bible such as Psalm 89:11: “The heavens are yours, the earth also is yours; the world and all that is in it—you have founded them”.[^note-4] Also in the Hebrew Bible is Nehemiah 9:6:
    step1: |-
      人们之所以倾向于认为上帝为必然存在的抽象对象的存在奠基，至少有两大类理由。第一类理由涉及犹太教、基督教、伊斯兰教等一神信仰的核心宗教文本。粗略地说，这类理由在于这些文本断言或暗示上帝创造了一切。如果上帝创造了一切，那么上帝必定也创造了必然存在的抽象对象。因此，上帝为这些抽象对象的存在奠基。例如，《希伯来圣经》中有这样的话，《诗篇》89:11：“天是你的，地也是你的；世界和其中所充满的，都是你所建立的。”[^note-4] 《希伯来圣经》中还有《尼希米记》9:6：
