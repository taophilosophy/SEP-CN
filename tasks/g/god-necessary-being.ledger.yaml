      > You ask me by what kind of causality God established the eternal truths. I reply: by the same kind of causality as he created all things, that is to say, as their efficient and total cause. For it is certain that he is the author of the essence of created things no less than of their existence; and this essence is nothing other than the eternal truths. I do not conceive them as emanating from God like rays from the sun; but I know that God is the author of everything and that these truths are something and consequently that he is their author. (Descartes 1991: 25)[^descartes-1991]
    step1: |-
      > 你问我，上帝是以何种因果性确立永恒真理的。我回答：是以他创造万物的同一种因果性，也就是说，作为万物的动力因与总因。因为可以肯定，他既是受造物存在的作者，也同样其本质的作者；而这本质不是别的，正是永恒真理。我并不设想它们像阳光从太阳射出那样从上帝流溢出来；但我知道上帝是一切事物的作者，而这些真理是某种东西，因而上帝是它们的作者。（Descartes 1991: 25）[^descartes-1991]
    step2: |-
      > 你问我，上帝是以何种因果性确立永恒真理的。我的回答是：以他创造万物的同一种因果性，即作为万物的动力因与总因。因为可以肯定，他既是受造物存在的作者，也同样其本质的作者；而这本质不是别的，正是永恒真理。我并不设想这些真理像阳光从太阳射出那样从上帝流溢出来；但我知道上帝是一切事物的作者，而这些真理是某种东西，所以上帝是它们的作者。（Descartes 1991: 25）[^descartes-1991]
