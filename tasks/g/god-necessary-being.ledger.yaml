      It is commonly accepted that there are two sorts of existent entities: those that exist but could have failed to exist, and those that could not have failed to exist. Entities of the first sort are *contingent beings*; entities of the second sort are *necessary beings*.[^note-1] We will be concerned with the latter sort of entity in this article.
    step1: |-
      人们普遍接受，存在物有两类：一类存在，但本可以不存在的；一类存在，而且不可能不存在的。第一类存在物是*偶然存在者*，第二类存在物是*必然存在者*。[^note-1] 本文关心的是后一类存在物。
    step2: |-
      人们通常承认，存在物分两类：一类存在，却本可以不存在；另一类则不可能不存在。前者是*偶然存在者*，后者是*必然存在者*。[^note-1] 本文讨论后一类存在物。
  - id: 2
    kind: body
    source: |-
      There are various entities which, if they exist, would be candidates for necessary beings: God, propositions, relations, properties, states of affairs, possible worlds, and numbers, among others. Note that the first entity in this list is a concrete entity, while the rest are abstract entities.[^note-2] Many interesting philosophical questions arise when one inquires about necessary beings: What makes it the case that they exist necessarily? Is there a grounding for their necessary existence? Do some of them depend on others? If so, how might one understand the dependence relation?
    step1: |-
      有各种各样的实体，如果它们存在，就有资格成为必然存在者：上帝、命题、关系、属性、事态、可能世界、数，等等。要注意，这个清单的第一项是具体实体，其余都是抽象实体。[^note-2] 一追问必然存在者，许多有趣的哲学问题便会出现：是什么使它们必然存在？它们的必然存在有没有奠基？其中是否有一些依赖另一些？如果有，这种依赖关系该如何理解？
    step2: |-
      有些实体如果存在，便有资格算作必然存在者：上帝、命题、关系、属性、事态、可能世界以及数，等等。要注意，清单第一项是具体实体，其余都是抽象实体。[^note-2] 一旦追问必然存在者，许多有意思的哲学问题便随之而来：它们凭什么必然存在？其必然存在有没有奠基？其中一些是否依赖另一些？若有依赖，这种依赖关系又该如何理解？
