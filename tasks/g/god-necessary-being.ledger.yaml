      Of course, the seriousness with which the theistic voluntarist takes divine aseity and sovereignty is also the source of problems for the view. If God could have failed to make the number 2, in what sense is 2 a necessary being? One might try to weaken the voluntarist view, by claiming that 2 is only weakly necessary: God had to create it, but it is possibly…possible that it not exist. All worlds that are accessible to the actual world have 2 existing in them. But some of these worlds have a somewhat-different divine will relative to the existence of 2 (maybe God somewhat-reluctantly wills the existence of 2 in them). And possible relative to those sorts of worlds (or relative to worlds possible to those worlds, etc.) are worlds in which God doesn’t will that 2 exist. The key here is that the claim: *Necessarily, 2 exists* comes out true on this picture; 2 exists in every possible world relative to the world of evaluation (the actual world). But there are possibly…possible worlds in which God doesn’t will the existence of 2. The voluntarist can say that abstracta depend on the will of God, and yet really do exist necessarily (just don’t say in every possible world, *full stop* (see Plantinga 1980: 95 ff. for further discussion)[^plantinga-1980]).
    step1: |-
      当然，有神论意志主义者对神圣自存性与主权的认真态度，也正是这一观点出问题的地方。如果上帝本可以不造数字 2，那么 2 在什么意义上还是必然存在者？人们或许可以弱化意志主义的观点，主张 2 只是弱必然的：上帝不得不创造它，但它可能……可能不存在。凡从现实世界可达的世界都有 2 存在。但其中有些世界相对于 2 的存在具有略为不同的神圣意志（也许在其中上帝带着几分不情愿意愿 2 存在）。而相对于那类世界（或相对于那些世界的可能世界，等等）而可能的世界中，有些是上帝不意愿 2 存在的世界。关键在于：在这幅图景下，*必然地，2 存在*这一主张为真；2 相对于评价世界（现实世界）的每一个可能世界都存在。但存在一些可能……可能的世界，在其中上帝不意愿 2 存在。意志主义者可以说，抽象物依赖上帝的意志，然而确实必然存在（只是别说在每一个可能世界都存在，*毫无例外*（进一步讨论见 Plantinga 1980: 95 ff.）[^plantinga-1980]）。
    step2: |-
      当然，有神论意志主义者对神圣自存性与主权的认真劲儿，也正是这一观点的麻烦所在。假如上帝本可以不造数字 2，那 2 还算什么必然存在者？人们或许会弱化意志主义的立场，说 2 只是弱必然的：上帝不得不创造它，但它可能……可能不存在。凡自现实世界可达的世界都有 2，可其中有些世界在 2 的存在上有着略为不同的神圣意志（也许那里上帝是带着几分不情愿意愿 2 存在的）。而相对于这类世界（或相对于这些世界的可能世界，如此递推）而可能的世界里，有些是上帝并不意愿 2 存在的。要害在于：在这幅图景下，*必然地，2 存在*为真——相对于评价世界（现实世界）而言的每一个可能世界都有 2。但仍有一些可能……可能的世界，上帝在其中不意愿 2 存在。意志主义者于是可以说：抽象物依赖上帝的意志，却又确实必然存在——只是别再说“在每一个可能世界都存在，*毫无例外*”（进一步讨论见 Plantinga 1980: 95 ff.）[^plantinga-1980]。
