      Cosmopolitan democracy is perhaps the most well-known model of global democracy. The core idea is to lift statist institutions to the global level in an on-going effort for democratization. David Held, Daniele Archibugi, and Simon Caney have all been prominent advocates. Normatively, the model rests on a foundation of autonomy: creating global political conditions that allow individuals to shape and direct their own lives. This requires, at the least, a system which protects human rights and provides democratic mechanisms for citizen input (Goodhart 2005)[^goodhart-2005]. This model is also explicitly cosmopolitan as it is supposed to apply to all individuals across the globe.
    step1: |-
      世界主义民主也许是全球民主中最为人熟知的模式。其核心想法是把国家主义的制度提升到全球层面，作为民主化的持续努力。戴维·赫尔德、达尼埃莱·阿尔基布吉与西蒙·卡尼都是著名的倡导者。在规范上，这一模式以自主为基础：创造全球政治条件，使个人能够塑造并引导自己的生活。这至少要求一套保护人权、并为公民输入提供民主机制的制度（Goodhart 2005）[^goodhart-2005]。这一模式也明确是世界主义的，因为它被设想为适用于全球一切个人。
    step2: |-
      世界主义民主大概是全球民主里最出名的模式。核心想法是把国家主义那套制度提到全球层面，作为民主化的长久努力。戴维·赫尔德、达尼埃莱·阿尔基布吉、西蒙·卡尼都是著名的倡导者。规范上，这模式立于自主：造出全球政治条件，让个人能塑造并引导自己的生活。至少得有一套制度，保护人权，并为公民的输入备好民主机制（Goodhart 2005）[^goodhart-2005]。这模式也明明白白是世界主义的：它设想适用于全球一切个人。
  - id: 29
    kind: body
    source: |-
      Institutionally, cosmopolitan democracy stops short of a fully-fledged world government. As David Held (2003, 478) notes, “a cosmopolitan polity does not call for a diminution per se of state power and capacity across the globe. Rather it seeks to entrench and develop political institutions at regional and global level as necessary complements to those at the level of the state.” This occurs by replicating national democratic institutions at the transnational and global levels, such as the creation of a global parliamentary assembly, international courts, and a constitutional rule of law (Falk and Strauss 2001; Goodin 2010)[^falk-2001][^goodin-2010]. These institutions provide a framework to shield human rights and exercise individual autonomy by voting in global elections. Moreover, these institutions are charged with effectively regulating transnational problems that national institutions cannot tackle alone: climate change, the diffusion of nuclear weapons, and financial markets. This particular model has given rise to a long-running campaign for the creation of a United Nations Parliamentary Assembly (see Other Internet Resources section).
    step1: |-
      在制度上，世界主义民主止步于一个完全成熟的世界政府之前。如戴维·赫尔德（2003, 478）所说：“世界主义的政体并不要求在全球范围内削减国家权力与能力本身。它毋宁是要在区域与全球层面确立并发展政治制度，作为国家层面制度的必要补充。”这靠的是在跨国与全球层面复制民族民主制度，例如创设全球议会大会、国际法院与宪制法治（Falk and Strauss 2001; Goodin 2010）[^falk-2001][^goodin-2010]。这些制度提供一个框架，通过在全球选举中投票来保障人权、行使个人自主。再者，这些制度负有有效监管民族制度无力单独应对的跨国问题的责任：气候变化、核武器的扩散与金融市场。这一模式还催生了一场争取建立联合国议会大会的长期运动（见“其他网络资源”一节）。
    step2: |-
      制度上，世界主义民主不到一个完全成熟的世界政府那一步。戴维·赫尔德（2003, 478）说：“世界主义的政体并不要求在全球范围内削减国家权力与能力本身。它毋宁要在区域与全球层面确立并发展政治制度，作为国家层面制度的必要补充。”办法是在跨国与全球层面复制民族民主制度：设全球议会大会、国际法院、宪制法治（Falk and Strauss 2001; Goodin 2010）[^falk-2001][^goodin-2010]。这些制度搭起框架，人靠全球选举投票，保障人权、行使自主。它们还担着监管之责，管那些民族制度单独对付不了的跨国难题：气候变化、核武器扩散、金融市场。这一模式还催出一场长期运动，要建联合国议会大会（见“其他网络资源”一节）。
