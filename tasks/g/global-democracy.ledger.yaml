      Koenig-Archibugi (2011) , in a foundational piece on the empirical potential of global democracy, separates between necessary and favourable conditions for democracy. He canvasses literature on domestic democratization for said necessary conditions and examines stateness, cultural homogeneity, economic prosperity, economic inequality, and size. Using India as a case-study, Koenig-Archibugi shows that none of these factors would theoretically preclude a global democracy (of some sort or another).
    step1: |-
      柯尼希-阿希布吉（2011）在一篇论全球民主经验潜力的奠基性文章中，区分了民主的必要条件与有利条件。他梳理关于国内民主化的文献以确定上述必要条件，并考察国家性、文化同质性、经济繁荣、经济不平等与规模。以印度为个案，柯尼希-阿希布吉表明，这些因素在理论上都不会排除某种全球民主。
    step2: |-
      柯尼希-阿希布吉（2011）有一篇奠基性的文章，论全球民主的经验潜力，把民主的必要条件与有利条件分开。他梳理国内民主化的文献来定那些必要条件，再考察国家性、文化同质性、经济繁荣、经济不平等与规模。拿印度作个案，他表明：这些因素在理论上都不排除某种全球民主。
