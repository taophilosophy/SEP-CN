      前面五种模式简略勾出全球民主方案在学术文献中通常是怎样构造的。然而在这一步之后，全球民主的争论已从“模式”转向“民主化的价值”。本节概述这一转向背后的核心动力及其方法论基础，然后讨论文献中若干重要例子。
