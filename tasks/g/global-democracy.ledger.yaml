      Global democracy, as should be clear, requires the equal inclusion of individuals in transnational decision-making processes. For most IR theorists, this is simply impossible. States are the key players in world politics, and individuals have standing only through their national political system. Although Pareto optimal (i.e. mutually-beneficial) forms of international cooperation can occur in world politics, states will always strive for more power and exploit relative differentials in material capabilities to fulfil national preferences. The drive and desire of each national government to maximize their absolute and relative power vis-à-vis other states directly undercuts the cosmopolitan ideal upon which global democracy is (typically) predicated.
    step1: |-
      应当清楚，全球民主要求个人平等地被纳入跨国决策过程。对多数国际关系理论家来说，这简直不可能。国家是世界政治中的关键角色，个人只通过本国政治体系才有地位。虽然世界政治中可以出现帕累托最优（即互利）形式的国际合作，国家却总要追逐更多权力，利用物质能力上的相对差异来满足本国偏好。每个国家政府追求相对他国最大化自身绝对与相对权力的冲动与欲望，直接削弱了全球民主（通常）所依据的世界主义理想。
