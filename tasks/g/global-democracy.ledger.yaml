      This model seeks the deliberative democratization of informal and formal sites of existing governance arrangements from the local to the global level. As such, the institutional design task is usually about recalibrating current institutions and organizations to reflect non-coercive argumentation rather than creating new bodies. At the informal level, some deliberative democrats point to transnational public spheres as appropriate sites for democratic agency (Steffek 2010)[^steffek-2010]. Indeed, some claim that a global civil society has emerged which provides a space—separate from the state and the market—for individuals to deliberate, shape preferences, and create shared goals (Dryzek 2000)[^dryzek-2000]. The model also calls for the deliberation democratization of formal sites, such as WTO negotiations, IMF loan deals, and regional treaty agreements (Bäckstrand 2006). By making negotiations more deliberative—responsive to the reasoned arguments of affected individuals—world politics becomes more democratic. At the intersection of formal and informal proposals, deliberative democrats often point to the increasing inclusion of non-state actors in formal organizations as a step toward global democracy (Dryzek 2012)[^dryzek-2012]. As NGOs, youth groups, epistemic communities, and business organizations gain access to sites of international decision-making, this helps increase the diversity of viewpoints and provides non-state groups with a way to contest traditional IGO negotiations (Tallberg et al. 2013)[^tallberg-2013]. Many actors in global civil society have accused IOs of suffering from a democratic deficit as a strategy to gain inclusion. This highlights the interconnections between academia and policy practice in terms of global democracy.
    step1: |-
      这一模式追求既有的、从地方到全球各层治理安排在非正式与正式场所中的审议民主化。因此，制度设计的任务通常不是创设新机构，而是重新校准当前的机构与组织，使其体现非强制的论证。在非正式层面，一些审议民主派指认跨国公共领域是民主能动性的合适场所（Steffek 2010）[^steffek-2010]。确实，有人主张一个全球公民社会已经出现，它提供了一个与国家、市场分开的空间，供个人审议、塑造偏好、创造共同目标（Dryzek 2000）[^dryzek-2000]。这一模式还要求正式场所的审议民主化，例如世贸组织的谈判、国际货币基金组织的贷款协议与区域条约协定（Bäckstrand 2006）。使谈判更具审议性，即对受影响个人的讲理论证作出回应，世界政治便更民主。在正式与非正式方案的交汇处，审议民主派常指出非国家行为者日益被纳入正式组织，这是走向全球民主的一步（Dryzek 2012）[^dryzek-2012]。随着非政府组织、青年团体、认知共同体与商业组织进入国际决策的场所，观点的多样性得以增加，非国家团体也获得了争夺传统政府间组织谈判的途径（Tallberg et al. 2013）[^tallberg-2013]。全球公民社会中的许多行为者指责国际组织患有民主赤字，以此作为争取被纳入的策略。这凸显了全球民主方面学界与政策实践之间的相互联系。
    step2: |-
      这模式要在既有治理安排里推审议民主化，从地方到全球，正式场所与非正式场所都要。所以制度设计的活儿，通常不是新设机构，而是重新校准现有机构与组织，让非强制论证占上风。非正式层面，一些审议民主派把跨国公共领域看作民主能动性的合适场所（Steffek 2010）[^steffek-2010]。有人甚至说，全球公民社会已经出现，它给个人留出一块与国家、与市场分开的地方，供人审议、塑造偏好、造出共同目标（Dryzek 2000）[^dryzek-2000]。这模式也要求正式场所审议民主化：世贸谈判、国际货币基金组织的贷款协议、区域条约协定，都算（Bäckstrand 2006）。谈判一有审议性，肯回应受影响者的讲理论证，世界政治就民主些。正式与非正式两条线交会之处，审议民主派常指出：非国家行为者越来越被纳入正式组织，这是往全球民主走的一步（Dryzek 2012）[^dryzek-2012]。非政府组织、青年团体、认知共同体、商业组织进了国际决策的场所，观点就更杂，非国家团体也有了同传统政府间组织谈判争一争的路子（Tallberg et al. 2013）[^tallberg-2013]。全球公民社会里许多行为者指责国际组织患民主赤字，把这当作争取被纳入的策略。学界与政策实践在全球民主上的相互勾连，于此可见。
