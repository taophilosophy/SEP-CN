    kind: body
    source: |-
      National democracy is typically institutionalized as a representative system that involves competitive elections and a publicly determined rule of law. Although there are many different national voting systems (plurality, proportional representation, preferential, etc.), the basic idea is that each enfranchised citizen of the state has one vote at the ballot box and can thus freely choose their preferred representative, leader, or party. Through the American and French Revolutions, and the ‘Third Wave of Democratization’ (where representative democracy spread to Latin America, the Asia-Pacific, and the Eastern bloc), the notion that the nation-state is the natural container for democracy became dominant (Huntington 1991)[^huntington-1991]. Over time, then, ‘the people’ in democracy has been assumed to correspond neatly with the citizenry of each particular nation-state.
    step1: |-
      民族民主通常被制度化为一套代议制，包含竞争性选举与公开确定的法治。尽管各国的投票制度有许多不同（多数制、比例代表制、偏好投票制等等），基本想法是：国家的每个有选举权的公民在票箱前有一票，因而能自由选择自己中意的代表、领导人或政党。经过美国革命与法国革命，以及“民主化第三波”（代议民主由此扩展到拉丁美洲、亚太与东欧集团），民族国家是民主之自然容器的观念占了主导（Huntington 1991）[^huntington-1991]。久而久之，民主中的“人民”便被假定为恰好对应各个民族国家的公民。
    step2: |-
      民族民主通常制度化为代议制，其中有竞争性选举，也有公开确立的法治。各国投票制度差别不小（多数制、比例代表制、偏好投票等等），可基本想法一致：国家里每个有选举权的公民，在票箱前有一票，能自由挑选中意的代表、领袖或政党。经过美国革命与法国革命，又经过“民主化第三波”（代议民主由此扩及拉丁美洲、亚太与东欧集团），民族国家乃民主之天然容器的观念便占了上风（Huntington 1991）[^huntington-1991]。日子一久，民主里的“人民”就被认定恰好等于各民族国家的公民。
  - id: 8
    kind: body
    source: |-
      In recent years, however, the supposed alliance between democracy and the nation-state has come unstuck. This is due predominantly to globalization: the increased extent, velocity, and scope of cross-border interactions, transactions, and relations (Scholte 2000)[^scholte-2000]. Globalization intensifies social, political, and economic relations through technological changes and the flow of people, resources and ideas across state lines. The expansion of global connections has gone hand-in-glove with increased efforts to govern global affairs. Countless formal measures, informal norms and overarching discourses for regulating global affairs are now formulated and implemented through complex transnational networks that combine substate agencies, nation-states, regional bodies, global institutions, and non-state actors (Scholte 2014, 4)[^scholte-2014]. Although the state is often an active participant in globalization, many scholars have argued that increased transnational activity undermines national democracy (Sassen 2003)[^sassen-2003]. Globalization pierces the sovereignty of nation-states by subjecting domestic affairs to transnational decision-making. Moreover, citizens of each state are often said to be problematically excluded from global activities in ways that lead to a democratic deficit (expanded upon below).
    step1: |-
      然而近些年来，民主与民族国家之间那道假定的同盟已经松动。这主要归因于全球化：跨境互动、交易与关系在程度、速度与范围上的增长（Scholte 2000）[^scholte-2000]。全球化通过技术变化以及人、资源与观念跨越国界的流动，加强了社会、政治与经济关系。全球联系的扩张，与治理全球事务的努力携手并进。无数正式措施、非正式规范与统摄性的论述，如今都通过复杂的跨国网络来制定与实施，这些网络结合了下级国家机构、民族国家、区域组织、全球机构与非国家行为者（Scholte 2014, 4）[^scholte-2014]。国家虽常是全球化的积极参与者，许多学者却论证说，跨国活动的增加正在侵蚀民族民主（Sassen 2003）[^sassen-2003]。全球化把国内事务交给跨国决策，从而刺穿了民族国家的主权。再者，人们常说各国公民被以有问题的方式排除在全球活动之外，由此造成民主赤字（下文详述）。
    step2: |-
      可近些年，民主与民族国家之间那道假定的同盟松了。主因是全球化：跨境互动、交易与关系在程度、速度与范围上的增长（Scholte 2000）[^scholte-2000]。全球化凭技术变化、凭人、资源与观念跨越国界的流动，把社会、政治、经济关系都加紧了。全球联系一扩张，治理全球事务的努力就跟着上。如今，无数正式措施、非正式规范与统摄性论述，都通过复杂的跨国网络来制定、来实施；这些网络把下级国家机构、民族国家、区域组织、全球机构与非国家行为者混在一起（Scholte 2014, 4）[^scholte-2014]。国家常是全球化的积极参与者，可许多学者说，跨国活动一多，民族民主就被侵蚀（Sassen 2003）[^sassen-2003]。全球化把国内事务交给跨国决策，等于刺穿了民族国家的主权。还有一层：各国公民常被以有问题的办法挡在全球活动之外，民主赤字由此而生（详见下文）。
