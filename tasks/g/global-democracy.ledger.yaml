      It is not just IR scholars who have accused global democrats of failing to deal adequately with issues of power. Increasingly within the broader field of normative international political theory, there is recognition that questions of power and conflict have been relegated in favor of global justice (Beitz 1979)[^beitz-1979]. Of course, global democrats are fundamentally interested in how transnational decision-making is exercised and who has a democratic say in the formulation of rules and norms. But these issues are often eclipsed by issues of poverty, resource distribution, and inequality (Pogge 1992)[^pogge-1992].
