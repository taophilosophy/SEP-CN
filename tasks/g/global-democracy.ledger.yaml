      Although this model has been prominent in the global democracy field, it has several problems. First, only around 50 per cent of nation-states today are democratic. As such, much of the world’s population is without democratic representation at either the national or transnational level. Second, nation-states do not have complete control over international institutions. IR scholars increasingly note that IOs, which are delegated authority from nation-states, suffer from ‘agency slack’. This means that actors within IOs (diplomats, bureaucrats, and so on) are able to carve out their own space for action. This power cannot easily be controlled or recaptured by member-states.
    step1: |-
      这一模式在全球民主领域虽曾显要，却有几个问题。第一，今天只有约百分之五十的民族国家是民主的。因此世界上很大一部分人口，无论在国家层面还是在跨国层面，都没有民主代表。第二，民族国家并不完全控制国际机构。国际关系学者越来越指出，国际组织从民族国家获得授权的权威，却受“代理松弛”之苦。这意味着国际组织内部的行为者（外交官、官僚等等）能为自己开辟行动空间。这种权力不易由成员国控制或收回。
    step2: |-
      这模式在全球民主领域虽曾显赫，毛病却有几点。第一，今天只有约五成民族国家是民主的。世界人口里很大一块，于是在国家层面、跨国层面都没有民主代表。第二，民族国家管不住国际机构。国际关系学者越说越明白：国际组织的权威是从民族国家授权来的，可它们有“代理松弛”的毛病，组织里的行为者（外交官、官僚之类）能给自己开出行动空间来。这种权力，成员国既不易控制，也不易收回。
