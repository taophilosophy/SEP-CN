      Finally, striving for values of democratization helps gain traction on the non-ideal conditions of world politics. Models are, by definition, idealizations and thinking about the transformative process toward any ideal is fraught with difficulties about the nature of the future. In this vein, Amartya Sen (2006) has recently argued that we should not aim for the full realization of any specified model, but rather we should seek to rank alternative values and arrangements derived from the normative concept in question.. Erman (2012) has objected to the notion that democracy can be treated as an aggregate concept composed of different democratic values because it fails to recognize that the different values are inter-related. While this is true, other scholars have claimed that separating democracy into core values helps to “identify more clearly how different democratic values relate to each other, to what extent they are in conflict and how such conflicts should be resolved in particular circumstances” (Dingwerth 2014, 18)[^dingwerth-2014]. As an aside, there remains a large dearth in the global democracy literature surrounding the nature of methodological theorizing. Global justice has focused intensely on the notions of ideal and non-ideal theory and fleshing out how these different modes incorporate feasibility and the pursuit of ends. Global democrats would be well-served to address this literature head on (see, for instance, Erman and Kuyper 2020)[^erman-2020].
    step1: |-
      最后，追求民主化的价值有助于在世界政治的非理想条件下取得抓手。模式按定义就是理想化，而思考朝向任何理想的转化过程，总缠着关于未来本性的种种困难。在这一脉络中，阿马蒂亚·森（2006）近来论证说，我们不应当以任何特定模式的完全实现为目标，而应设法对由所论规范概念引申出的备选价值与安排作出排序。埃尔曼（2012）反对把民主当作由不同民主价值聚合而成的概念，因为这样认不出这些价值彼此相关。此话虽真，其他学者却主张，把民主拆成核心价值，有助于“更清楚地辨认不同民主价值彼此如何关联、在多大程度上相互冲突，以及在具体情形中这类冲突应如何解决”（Dingwerth 2014, 18）[^dingwerth-2014]。附带说一句，全球民主文献中关于方法论理论化之本性的研究仍然严重匮乏。全球正义已集中探讨理想理论与非理想理论，并阐明这些不同模式如何纳入可行性与对目标的追求。全球民主派若能正面处理这批文献，会大有好处（例如见 Erman and Kuyper 2020）[^erman-2020]。
    step2: |-
      最后，追求民主化的价值，能在世界政治的非理想条件下找到着力点。模式按定义是理想化；而想朝向任何理想的转化过程，总要碰上关于未来本性的难处。阿马蒂亚·森（2006）近来就说，我们不该以某个模式的完全实现为目标，而该设法给由所论规范概念引申出的备选价值与安排排出先后。埃尔曼（2012）反对把民主当作由诸民主价值拼成的聚合概念，因为这样看不出这些价值彼此相关。话虽如此，别的学者仍说，把民主拆成核心价值有助于“更清楚地看出不同民主价值彼此怎样关联、冲突到什么程度，以及在具体情形中这类冲突该怎样解决”（Dingwerth 2014, 18）[^dingwerth-2014]。附带一句：全球民主文献里，关于方法论理论化本性的研究仍然很缺。全球正义已把理想理论与非理想理论谈得很透，也讲清这些不同模式怎样纳入可行性与对目标的追求。全球民主派若能正面接下这批文献，会受益不小（例如见 Erman and Kuyper 2020）[^erman-2020]。
