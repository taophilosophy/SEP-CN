      The array of transnational institutions that govern social, political, and economic processes is bewildering. Formal institutions include international organizations (IO), intergovernmental organizations (IGO), non-governmental organizations (NGO), and private bodies (Tallberg et al. 2013)[^tallberg-2013]. Informal institutions include epistemic communities, transnational networks, and the basic structure of transnational norms that make the world ‘hang together’ (Ruggie 1998)[^ruggie-1998].
    step1: |-
      治理社会、政治与经济过程的跨国机构，其名目繁多功能各异。正式机构包括国际组织（IO）、政府间组织（IGO）、非政府组织（NGO）与私人机构（Tallberg et al. 2013）[^tallberg-2013]。非正式机构包括认知共同体、跨国网络，以及使世界“连成一体”的跨国规范的基本结构（Ruggie 1998）[^ruggie-1998]。
    step2: |-
      治理社会、政治与经济过程的跨国机构，名目繁杂得叫人眼花。正式机构有国际组织（IO）、政府间组织（IGO）、非政府组织（NGO）与私人团体（Tallberg et al. 2013）[^tallberg-2013]。非正式机构有认知共同体、跨国网络，以及让世界“连成一体”的跨国规范的基本结构（Ruggie 1998）[^ruggie-1998]。
  - id: 11
    kind: body
    source: |-
      As the number of these transnational institutions has increased with globalization, so too has their capacity to exercise authority (Zürn et al. 2012)[^zürn-2012]. Many scholars have noted that this authority often enables international institutions to wield pervasive forms of *public power* that impact (and potentially constrain) the lives of individuals (Macdonald 2008)[^macdonald-2008]. This occurs through international law-making, regulatory standard-setting, and the promotion of new norms. As decisions are taken beyond the state, national leaders are often unable to control the forces which impact domestic institutions and citizens. Correspondingly, and as a result, individuals within each state have neither a direct nor (in many instance) indirect say in how global rules are forged as their national representatives are removed from sites of public power. This undermines the notion that individuals can collectively and equally govern their joint affairs. This gap – between transnational rule-makers and individual rule-takers– is referred to as the global democratic deficit. Global democracy, broadly conceived, is a project seeking to remedy these deficits by granting individuals a say in transnational rule-making by identifying sites of transnational rule-making, rethinking who constitutes the demos, and constructing mechanism for democratic inclusion.
    step1: |-
      随着全球化使这类跨国机构数量增加，它们行使权威的能力也在增强（Zürn et al. 2012）[^zürn-2012]。许多学者指出，这种权威常使国际机构得以行使种种弥漫性的 *公共权力*，影响（并可能约束）个人生活（Macdonald 2008）[^macdonald-2008]。这通过国际立法、监管标准设定与新规范的推广而发生。决策既在国家之外作出，国家领导人便常常无法控制影响国内机构与公民的力量。相应地，也正因如此，各国国内的个人对全球规则如何锻造，既无直接发言权，（在许多情形下）也无间接发言权，因为他们的本国代表被移出了公共权力的场所。这就削弱了“个人能够集体而平等地治理其共同事务”这一观念。跨国制规者与作为规则承受者的个人之间的这道鸿沟，被称为全球民主赤字。宽泛地看，全球民主是一项力图弥补这些赤字的工程：办法是找出跨国制规的场所，重新思考谁构成民群，并搭建民主包容的机制，从而使个人在跨国制规中有发言权。
    step2: |-
      全球化使这类跨国机构越增越多，它们行使权威的能力也跟着涨（Zürn et al. 2012）[^zürn-2012]。许多学者指出，这种权威常让国际机构得以行使形形色色的 *公共权力*，影响、甚至约束个人的生活（Macdonald 2008）[^macdonald-2008]。途径有三：国际立法、监管标准的设定、新规范的推广。决策在国家之外作出，国家领导人往往就管不住那些冲击国内制度与公民的力量。相应而来的是：各国国内的个人，对全球规则怎样锻造，既没有直接发言权，在许多情形下也没有间接发言权，因为他们的本国代表已被挪出公共权力的现场。个人能否集体而平等地治理共同事务，这个观念由此被削弱。跨国制规者同作为规则承受者的个人之间，这道沟就叫全球民主赤字。全球民主若宽泛地说，是一项弥补赤字的工程：找出跨国制规的场所，重新想谁构成民群，搭起民主包容的机制，好让个人在跨国制规里有话说。
  - id: 12
    kind: body
    source: |-
      Global democratic deficits are compounded by at least three additional factors. The first is an issue of procedure: international bodies often operate with unaccountable and non-transparent processes. This makes it difficult to identify the steps in a causal chain which link transnational rule-makers with rule-takers. The second factor is scope: current arrangements of transnational institutions seem incapable of tackling the most pressing issues of a globalizing world —climate change, spread of infectious diseases, volatile financial markets, enormous poverty rates, unjust supply chains, just to name a few. This is compounded by the fact that nation-states are often unable to deal with transnational issues since capital flight, a lack of international tax regulations, and brain drain systematically undermine domestic capacity. This results in a lack of domestic decision-making capacity which correspondingly makes it difficult for individuals to shape their world (either through their nation-state or otherwise). Third is an issue of constituency: globalization is reshaping who constitutes ‘the people’ due democratic standing in decision-making processes. As Andrew Linklater (1998) notes, globalization generates postnational communities of fate not based on national boundaries but upon shared problems and mutual allegiances. Global sites of public power therefore may need to have, or even warrant, forms of democratic legitimacy not tied to the nation-state system.
    step1: |-
      全球民主赤字至少还由另外三个因素加重。第一个是程序问题：国际机构往往以不受问责、不透明的程序运作。这使人难以找出因果链条中连接跨国制规者与规则承受者的那些环节。第二个因素的范围：当前的跨国机构安排似乎无力应对全球化世界最迫切的问题，如气候变化、传染病扩散、动荡的金融市场、巨大的贫困率、不公正的供应链，仅举几例。这一点又因民族国家常常无力处理跨国问题而加重，因为资本外逃、国际税收规则的缺乏与人才外流系统性地削弱了国内能力。这造成国内决策能力的匮乏，相应地使个人难以塑造自己的世界（无论通过其民族国家还是其他途径）。第三个是构成问题：全球化正在重塑谁构成在决策过程中享有民主地位的“人民”。如安德鲁·林克莱特（1998）所指出的，全球化产生出后民族的命运共同体，其基础不是民族边界，而是共同的问题与相互的忠诚。因此，全球性的公共权力场所可能需要、甚至理应拥有不系于民族国家体系的民主合法性形式。
    step2: |-
      至少还有三个因素在加重全球民主赤字。一是程序：国际机构运作时往往不受问责，也不透明，使人难以在因果链条上找出跨国制规者与规则承受者之间的那些环节。二是范围：眼下的跨国机构安排，似乎对付不了全球化世界最迫切的问题，气候变化、传染病扩散、金融市场动荡、极高的贫困率、不公正的供应链，都算在内。这一点又因民族国家常无力处理跨国问题而加剧：资本外逃、国际税收规则缺位、人才外流，都在系统性地削国内之力。国内决策能力一弱，个人要塑造自己的世界（无论借民族国家还是别的途径）就难。三是构成：全球化正在改写谁算在决策过程中享有民主地位的“人民”。安德鲁·林克莱特（1998）已指出：全球化造出后民族的命运共同体，其纽带不是国界，而是共同的问题与彼此的忠诚。所以，全球层面的公共权力场所，可能需要、甚至理应具备不系于民族国家体系的民主合法性形式。
