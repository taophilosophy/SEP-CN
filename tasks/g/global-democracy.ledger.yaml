      Next, sophisticated recent work on international authority separates between ‘delegation’ – whereby authority can potentially be maintained through a veto right – and pooling – in which sovereignty can be overridden by different voting procedures (super-majorities, generally) (Hooghe and Marks 2015)[^hooghe-2015]. Global democrats would do well to flesh out the theoretical implications of this difference. While exit remains a theoretical possibility for states from IOs under both pooling and delegation as a way to recapture authority and shift it to the domestic level, this is not always viable in the short- or long-term. Moreover, it is not clear that a ‘potential’ for exit would eradicate a democratic deficit any more than a citizen’s right to exit a nation-state. Finally, transnational networks and private forms of governance have proliferated beyond the state. These agents often have the capacity to create global regulations which impact on domestic citizens. Nation-states typically have no direct say in these bodies. As such, the intergovernmental model provides many interesting insights, but has failed to keep pace with empirical developments.
    step1: |-
      其次，近来关于国际权威的精细研究区分了“授权”与“汇集”：前者指权威可能通过否决权得以保留，后者指主权可以被不同的表决程序（一般为超级多数）所覆盖（Hooghe and Marks 2015）[^hooghe-2015]。全球民主派若能把这一差别的理论含义说清，会大有裨益。虽然无论按汇集还是按授权，退出对加入国际组织的国家在理论上仍是重新取得权威、并将其移回国内层面的可能途径，但在短期或长期内并不总是可行。再者，退出的“可能”能否清除民主赤字，并不比公民退出民族国家的权利更清楚。最后，跨国网络与私人形式的治理已在国家之外大量滋生。这些行为者往往有能力制定影响国内公民的全球规章。民族国家在这些机构中通常没有直接发言权。因此，政府间模式提供了许多有意思的洞见，却未能跟上经验的发展。
    step2: |-
      其次，近来关于国际权威的细致研究分开了“授权”与“汇集”：前者指权威或许能靠否决权保住，后者指主权可被不同的表决程序（一般是超级多数）盖过（Hooghe and Marks 2015）[^hooghe-2015]。全球民主派该把这差别的理论含义说明白。退出，无论对授权还是对汇集，理论上都是国家重新取得权威、把它移回国内的一条路，可短期、长期未必都走得通。而且，“可能”退出能否消掉民主赤字，并不比公民退出民族国家的权利更说得清。最后，跨国网络与私人治理已在国家之外大量滋生。这些行为者常能定出全球规章，而规章要落到国内公民头上。民族国家在这些机构里照例没有直接发言权。所以政府间模式洞见不少，却跟不上经验的步子。
