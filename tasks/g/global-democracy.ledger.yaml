      Although a full survey is neither possible nor necessary here, two prominent responses have been advocated in the literature for reconfiguring the demos in light of globalization (Goodin 2007)[^goodin-2007]. First, all individuals subjected to rules, laws, and regulations should take part in writing those rules. Second, all individuals significantly affected by a decision-making process should have an equal say in how that power is exercised. While these two positions provide a basis for delineating the people in a globalizing world, there are clear differences between them. The former is relatively narrow: only individuals to whom rules actually apply should be part of the decision-making. By contrast, the latter is much broader: global decisions often have wide-reaching and indirect consequences beyond those subjected. To take a simple example: individuals in a country not a member of the WTO are not subjected to WTO rules, but they are affected by the general system of international tariffs that the WTO regulates. Should these individuals be entitled to a democratic right of participation in WTO decisions? From this, we can see that whether we chose subjectedness or affectedness matters because each criterion entails a significantly different domain of democratic inclusion. As such, further research is required to shed light on how, or even if, the boundary problem can be resolved, and its implications for global democracy (for an effort in this vein, see Koenig-Archibugi 2017)[^koenig-archibugi-2017].
    step1: |-
      全面的梳理既不可能也无必要，但文献中就如何在全球化之下重构民群提出了两种重要回应（Goodin 2007）[^goodin-2007]。第一，凡受规则、法律与规章约束的个人，都应当参与那些规则的写作。第二，凡受某一决策过程显著影响的个人，都应当在权力如何行使上有平等的发言权。这两种立场为在全球化世界中划定人民提供了基础，但彼此之间有清楚的差别。前者相对狭窄：只有规则实际适用的个人，才应成为决策的一部分。后者则宽得多：全球决策往往有超出受治者的广泛而间接的后果。举个简单的例子：一个非世贸组织成员国的个人，不受世贸规则的约束，却受世贸组织所规范的国际贸易关税体系的影响。这些个人是否应当有权民主地参与世贸组织的决策？由此可见，我们选择“受治”还是“受影响”是要紧的，因为两个判准蕴含的民主包容范围大不相同。因此，还需要进一步研究，以阐明边界问题能否、乃至如何得到解决，以及这对全球民主的含义（这一方向上的努力，见 Koenig-Archibugi 2017）[^koenig-archibugi-2017]。
