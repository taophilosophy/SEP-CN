      A related avenue for research is also available for global democrats. The normative project of global democratization – especially those seeking to replicate liberal democratic institutions above the state (i.e., world parliaments) – is rightly critiqued on neo-colonial or imperialist grounds for taking Western institutions as the benchmark for legitimate global authority (Held and Patomäki 2006; Cabrera 2015)[^cabrera-2015][^held-2006]. However, much work in IR now points to the fact that anarchy is the wrong starting point for theorizing world politics. Instead, we should begin with the concept of hierarchy. Mattern and Zarakol (2016) have persuasively demonstrated that international authority generates hierarchies. This form of authority, as explicated by Zürn et al. (2012), is likely best legitimated through taking public preferences into account and providing justification for policies. More foundationally, though, Mattern and Zarakol point to economic, social (status), and political sources of hierarchy. This analysis opens up for studying a wider variety of actors as well as their motivations. To the extent that hierarchies could be uncovered and equalized, emergent forms of democracy could be pinpointed. This broader literature persuasively shows that hierarchies are intersubjective constructions. As far as this is true, there is no a priori reason why their form could not be democratized. This stands as a direction for future research.
    step1: |-
      对全球民主派来说，还有一条相关的研究路径。全球民主化的规范工程，尤其是那些力求在国家之上复制自由民主制度（即世界议会）的方案，被以新殖民或帝国主义的理由恰当地批评，因为它们把西方制度当作合法全球权威的基准（Held and Patomäki 2006; Cabrera 2015）[^cabrera-2015][^held-2006]。然而国际关系中许多工作现在指出，无政府状态是为世界政治作理论化的错误起点。我们毋宁应当从等级制的概念开始。马特恩与扎拉科尔（2016）有说服力地表明，国际权威产生等级制。照聚恩等人（2012）的阐明，这种形式的权威，最好通过把公众偏好纳入考量、并为政策提供证成而获得合法性。不过更根本的是，马特恩与扎拉科尔指出等级制的经济、社会（地位）与政治来源。这一分析为研究更广泛的行为者及其动机打开了空间。等级制若能被揭示并被平等化，新兴的民主形式就能被指认出来。这批更广的文献有说服力地表明，等级制是主体间的构造。只要这一点成立，就没有先天的理由说其形态不能被民主化。这为未来研究提供了一个方向。
