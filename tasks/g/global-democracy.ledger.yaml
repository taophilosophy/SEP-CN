      In a follow-up piece, Thomas Hale and Koenig-Archibugi (2019) assess whether citizens across the globe are too heterogeneously spaced (i.e., diverse) or polarized on policy issues to form a coherent democracy. Statistically analysing opinion polls covering a representative sample of 86% of the world population, these scholars demonstrate that global policy preferences are within the same range as the diversity found within nation-states. This suggests that global democracy is possible to the same extent it is within the national container, at least on the variables analyzed in their study.
    step1: |-
      在一篇后续文章中，托马斯·黑尔与柯尼希-阿希布吉（2019）评估全球公民在政策议题上是否分布得过于异质（即过于多样），或过于两极化，以致无法形成融贯的民主。他们对覆盖世界人口百分之八十六的代表性样本的民意调查作统计分析，表明全球政策偏好的差异幅度与民族国家内部的多样性处在同一区间。这表明，至少就其研究分析的变量而言，全球民主在民族容器内的同等程度上是可能的。
    step2: |-
      托马斯·黑尔与柯尼希-阿希布吉（2019）有一篇后续文章，评估全球公民在政策议题上是不是分布得太异质（太杂），或者太两极化，以致凑不成一个融贯的民主。他们对覆盖世界人口八成六的代表性样本作民意统计分析，结果表明：全球政策偏好的差异幅度，同民族国家内部的多样性落在同一区间。至少在他们分析的变量上，全球民主在民族容器内有多大可能，在全球层面也就有多大可能。
