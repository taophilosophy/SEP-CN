      This model is also not without complication. First, the proposals are often thought to be infeasible. By this, critics usually mean that there is a lack of political will to establish organizations such as a global parliament which would remove some sovereign powers from nation-states. Although Held (1995) and Archibugi (2008) often claim that cosmopolitan democracy should be separated into short-term targets and longer-term ideals, it is not always clear which agents would pursue the model nor how current institutional arrangements could be overcome (though see Archibugi and Held (2011) for some suggestions). Would the IMF, the World Bank, or the International Accounting Standards Board, for example, readily give up their control over global financial governance? And even if they did, the billions of individuals living in non-democratic states would remain excluded from shaping collective rules. Second, some critics also charge the cosmopolitan model with being undesirable. Although the project is designed to reduce the global democratic deficit, it does so by reproducing liberal democratic institutions beyond the state. Postcolonial arguments have been made against this reliance on liberal institutions which represent a specific form of (Western) democracy that emerged from Europe and the United State (Scholte 2014)[^scholte-2014].
    step1: |-
      这一模式也并非没有麻烦。第一，这些方案常被认为不可行。批评者这么说，通常是指缺乏政治意愿去建立全球议会这类会从民族国家夺走部分主权权力的组织。赫尔德（1995）与阿尔基布吉（2008）常说，世界主义民主应分为短期目标与长期理想，但究竟哪些行为者会去推进这一模式、当前的制度安排又如何能被克服，并不总是清楚（不过可参 Archibugi and Held (2011) 的一些建议）。举例来说，国际货币基金组织、世界银行或国际会计准则理事会，会甘愿放弃它们对全球金融治理的控制吗？即便它们甘愿，生活在非民主国家里的数十亿个人仍会被排除在塑造集体规则之外。第二，一些批评者还指责世界主义模式不可欲。这一工程本为减少全球民主赤字，办法却是在国家之外复制自由民主制度。后殖民的论证已针对这种对自由制度的依赖提出批评：那些制度代表一种从欧洲与美国兴起的（西方）民主的特殊形式（Scholte 2014）[^scholte-2014]。
    step2: |-
      这模式也麻烦不少。第一，方案常被认为不可行。批评者的意思多是：没人有那份政治意愿，去建一个会把部分主权权力从民族国家手里拿走的全球议会。赫尔德（1995）与阿尔基布吉（2008）常说，世界主义民主该分作短期目标与长期理想；可到底哪些行为者会来推进这模式，眼下的制度安排又怎么破，并不总说得清（不过可参 Archibugi and Held (2011) 的一些建议）。举例：国际货币基金组织、世界银行、国际会计准则理事会，肯不肯放弃它们对全球金融治理的掌控？就算肯，住在非民主国家里的几十亿人，照样进不了塑造集体规则的圈子。第二，有人指这模式不可欲。工程本为削减全球民主赤字，手段却是在国家之外复制自由民主制度。后殖民论证就来攻这一点：那些制度所代表的，是一种从欧洲与美国长出来的（西方）民主的特殊形态（Scholte 2014）[^scholte-2014]。
