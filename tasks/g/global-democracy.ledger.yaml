      Although realist theories have much explanatory power, neo-liberal and constructivist scholars increasingly point to the constraining nature of law and ideas in world politics. Constructivists, in particular, have forcefully noted that ‘anarchy is what states make of it’ (Wendt 2003, 491)[^wendt-2003]. In other words, the realist interpretation of world politics is precisely that: a cultural and historical interpretation. The fundamental nature of international society can and does change over time, and therefore new forms of social and political interactions are always possible. This suggests that power politics is not some immutable condition of international affairs, but rather a situation that can be overcome through new forms of cognition, cooperation, and contestation. As such, cosmopolitan notions of global democracy are certainly conceivable. As Linklater (1998) argues, emerging dialogical communities of affected peoples are creating transnational social relations that are more universalistic, less unequal, and have greater sensitivity to cultural differences.
    step1: |-
      现实主义理论虽有很强的解释力，新自由主义与建构主义学者却越来越指出法律与观念在世界政治中的约束作用。建构主义者尤其有力地指出，“无政府状态是国家造就出来的”（Wendt 2003, 491）[^wendt-2003]。换句话说，现实主义对世界政治的解读恰恰就是一种文化与历史的解读。国际社会的根本性质可以、也确实随时间变化，因此新的社会与政治互动形式总是可能的。这表明权力政治并非国际事务某种不可更易的状况，而是一种可以通过新的认知、合作与争议形式加以克服的局面。因此，世界主义的全球民主观念当然是可设想的。如林克莱特（1998）所论，受影响的各民族之间正在兴起的对话共同体，正造出更具普遍性、更少不平等、对文化差异更敏感的新型跨国社会关系。
