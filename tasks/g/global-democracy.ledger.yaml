      This final point bears emphasis because it has (re-)ignited debates in democratic theory over the so-called ‘boundary problem’: who is entitled to take part in democratic decision-making processes (Agné 2006)[^agné-2006]? This question is often thought to be paradoxical because democratic theory offers no internal solution for delineating ‘the people’: unless we already know who is eligible to participate in democratic procedures, we do not know who to include in the initial decision-making process. As globalization erodes the idea that the citizenry represents a natural embodiment of ‘the people’, we need to search for alternate ways to justify democratic inclusion. This also makes global democratic deficits distinct from national ones, as the latter presupposes a rough ‘demos’, while the former (re-)opens the normative question of inclusion.
