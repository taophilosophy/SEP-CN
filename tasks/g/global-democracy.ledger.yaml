      As a result, there remains much work to be done, scrutinizing existing studies on global democracy’s preconditions from both proponents and critics. Further studies should engage with a wider representative sample of citizens from across the globe, different international organizations, and test the quality of different normative models/values on citizen preferences for global democracy. This empirical knowledge should then be rolled back in to ongoing and incipient normative research moving forward.
    step1: |-
      因此，还有很多工作要做：既要细察拥护者与批评者关于全球民主前提的既有研究，也要接着研究。未来的研究应当接触更广泛的全球公民代表性样本、不同的国际组织，并就公民对全球民主的偏好检验不同规范模式与价值的品质。这些经验知识随后应当回灌到正在进行与刚刚起步的规范研究里去。
