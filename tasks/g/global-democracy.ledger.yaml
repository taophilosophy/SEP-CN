      激进民主的制度设计，几乎按其定义就是不清楚的。拥护者反对既有的全球体系：在其中，主权已被帝国遮蔽，即政治屈从于资本主义。因此，改造当前安排、建立新的治理形式，要由集体来做；而新形式的设计只能从重建的过程中产生。尚塔尔·墨菲（2009）与扬·阿尔特·肖尔特（2014）都明确表示，激进民主意味着拒斥西方的自由民主制度（如议会与宪法），也拒斥它们对个人主义与资本主义的依赖。肖尔特（2014）毋宁说，我们应当打开关于全球民主应当是什么样的观念，充分考虑跨尺度性、多元团结、跨文化性、平等分配与生态，这些构成社会与物质生活。
