    source: |-
      Global democracy is a field of academic study and political activism concerned with making the global political system more democratic. This topic has become a central area of inquiry for established literatures including political philosophy, international relations (IR), international law, and sociology. Along with global justice (and, in some ways, scholarship in the just war tradition), global democracy has also been critical to the emergence of international political theory as a discrete literature in recent decades. Whereas global justice scholars tend to focus on how burdens and benefits should be distributed by international institutions, global democrats probe how political power can be legitimated beyond the nation-state. Global democracy is therefore concerned with how transnational decision-making can be justified and who should be entitled to participate in the formation of global rules, laws, and regulations.
    step1: |-
      全球民主是一个学术研究与政治行动领域，关注如何使全球政治体系更为民主。这个题目已成为若干既有文献的核心探究领域，包括政治哲学、国际关系（IR）、国际法与社会学。连同全球正义（在某些方面还有正义战争传统的研究），全球民主对近几十年来国际政治理论成为一门独立文献也至关重要。全球正义学者往往聚焦于国际机构应当如何分配负担与利益，全球民主派则探究政治权力如何在民族国家之外获得合法性。因此全球民主关心的是：跨国决策如何得到证成，谁有权参与全球规则、法律与规章的形成。
    step2: |-
      全球民主是一个学术研究领域，也是政治行动的一个方向，关切的都是怎样让全球政治体系更民主。这个题目如今已是若干成熟文献的核心探究领域，包括政治哲学、国际关系（IR）、国际法与社会学。全球民主同全球正义一道（在某些方面还有正义战争传统的研究），对国际政治理论近几十年成为一门独立文献起了关键作用。全球正义学者多半盯住国际机构应当怎样分配负担与利益；全球民主派要追问的，是政治权力如何在民族国家之外获得合法性。所以全球民主关心两件事：跨国决策怎样得到证成，谁有资格参与全球规则、法律与规章的制定。
