      When global democrats tackle the notion of power, they do so through a specific lens: they are interested, predominantly, in how ‘the people’ can collectively rule themselves and potentially check the exercise of arbitrary power (Bohman 2007)[^bohman-2007]. Recently, several scholars have complained that this focus is too narrow to take proper consideration of how power can be legitimated within the global system. Macdonald and Ronzoni (2012), following in the footsteps of Bernard Williams, suggest that legitimacy may be a value separable from—and not reducible to—democracy or justice. As such, we need to think about different ways of legitimating global power that take seriously the unique context of world politics. This might entail looking at values such as stability, sociological acceptance, juridification, or arbitration. Analyzing how these standards foster legitimacy in transnational institutions may actually help shed light on the fundamental constitutive features of the global political order (Macdonald and Ronzoni 2012, 525)[^macdonald-2012] and the limits of global democratization.
    step1: |-
      全球民主派处理权力观念时，是通过一个特定镜头：他们主要关心“人民”如何能集体治理自己、并能约束任意权力的行使（Bohman 2007）[^bohman-2007]。近来几位学者抱怨说，这一聚焦太窄，无法恰当考虑权力如何能在全球体系内被合法化。麦克唐纳与龙佐尼（2012）追随伯纳德·威廉斯的脚步，提出合法性可能是一种可与民主或正义分开、也不可化约为它们的价值。因此，我们需要思考以不同方式合法化全球权力，并认真对待世界政治的独特语境。这可能意味着考察稳定、社会学接受、司法化或仲裁这类价值。分析这些标准如何培育跨国机构的合法性，实际上可能有助于阐明全球政治秩序的根本构成特征（Macdonald and Ronzoni 2012, 525）[^macdonald-2012]，以及全球民主化的限度。
    step2: |-
      全球民主派碰权力这观念，用的是个特定镜头：他们主要关心“人民”怎样集体治理自己，又怎样约束任意权力的行使（Bohman 2007）[^bohman-2007]。近来几位学者抱怨：这镜头太窄，装不下权力如何在全球体系里被合法化的问题。麦克唐纳与龙佐尼（2012）跟着伯纳德·威廉斯的脚步，说合法性也许是一种同民主、同正义都可分开、也不能化约为它们的价值。所以我们得想别的合法化全球权力的法子，并认真对待世界政治的独特语境。这可能意味着去看稳定、社会学上的接受、司法化、仲裁这类价值。分析这些标准怎样养出跨国机构的合法性，其实有助于讲清全球政治秩序的根本构成特征（Macdonald and Ronzoni 2012, 525）[^macdonald-2012]，也有助于看清全球民主化的限度。
