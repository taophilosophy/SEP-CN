      Several other intrinsic arguments, though, have been made in literature. These claims all suggest that global democracy is morally desirable irrespective of the benefits generated. For instance, many scholars have suggested that global democracy embodies equality, autonomy, non-domination, and human rights (see respectively: Erman 2012; Held 1995; Bohman 2007; Goodhart 2008)[^bohman-2007][^erman-2012][^goodhart-2008][^held-1995]. These fundamental rights should be valued for their own sake and therefore provide an additional moral foundation—related to, but sometimes distinct from, cosmopolitanism—for pursuing democracy beyond borders. These arguments are most common amongst liberal democrats and neo-Roman republicans (Pettit 1997)[^pettit-1997].
