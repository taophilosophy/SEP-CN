      World government proponents seek a centralized global system, with some federal powers devolved to lower levels (insufficient work in this space has focused on how to determine boundaries of subsidiarity). As Cabrera (2004, 71) notes, a world government would require a “restructuring of the global system to bring states under the authority of just supranational institutions.” A central government would sit at the core with autonomous and coercive decision-making potential. As with cosmopolitan democracy, a world government would also entail a directly-elected global parliament, empowered courts, and a singular global constitution which explicates basic rights and duties for all. In many cases, proponents stipulate that a world government could come about through a major recalibration of the United Nations General Assembly. Famously, Habermas has also argued for a three-tiered hierarchical global system in which supranational, transnational, and national institutions are implemented to secure rights, peace, and global democracy. Although Habermas might deny advocating a world government, William Scheuerman (2008, 148) argues that Habermas’s attempt to pursue stronger supranational governance combined with a global constitution would have that result.
    step1: |-
      世界政府的拥护者寻求一个集中化的全球体系，其中一些联邦权力下放到较低层级（这一领域里，关于如何确定辅助原则之边界的研究做得不够）。如卡布雷拉（2004, 71）所说，世界政府将要求“对全球体系进行重构，使各国服从正当的超国家机构的权威”。一个中央政府将居于核心，握有自主而带强制性的决策潜力。与世界主义民主一样，世界政府也将包含一个直接选举的全球议会、被赋权的法院，以及一部单一的全球宪法，为所有人阐明基本权利与义务。在许多情形中，拥护者规定世界政府可以通过对联合国大会的重大重新校准而产生。哈贝马斯还著名地主张一种三层级的全球体系，其中超国家、跨国与国家制度各得其位，以保障权利、和平与全球民主。虽然哈贝马斯可能否认自己在倡导世界政府，威廉·朔伊尔曼（2008, 148）却论证说，哈贝马斯追求更强超国家治理并辅以全球宪法的努力，结果正是如此。
