      Michael Zürn (2016) has reconstructed four models of democracy beyond the state - intergovernmental democratic states, cosmopolitan pluralism, minimal world state, and cosmopolitan democracy – and analyses their empirical suppositions. He assesses each model in light of the global institutional context necessary for their realization, potentialities for will formation, and individual attitudes for democracy. He finds strongest support for cosmopolitan pluralism. A model of intergovernmental democratic states struggles given that individuals, according to most survey data, still prioritize national issues over transnational ones, thus failing to promote global public goods. A minimal world state would require transnational solidarity which remains absent. Cosmopolitan democracy, which he treats as a more fully-fledged world state, lacks public support for international authority. Cosmopolitan pluralism, which seeks a diffusion of multi-level power held to account by different democratic mechanisms (i.e. civil society participation, human rights treaties, etc.) thus seems most plausible.
    step1: |-
      米夏埃尔·聚恩（2016）重构了四种国家之外的民主模式：政府间民主国家、世界主义多元主义、最低限度的世界国家、世界主义民主；并分析其经验预设。他依据各模式实现所需的全球制度语境、意志形成的潜力、以及个人对民主的态度，逐一评估。他发现世界主义多元主义得到的支持最强。政府间民主国家模式处境艰难，因为按多数调查数据，个人仍把本国议题置于跨国议题之前，因而未能促进全球公共善。最低限度的世界国家将要求仍然缺席的跨国团结。世界主义民主被他当作一个更完全成熟的世界国家，缺乏公众对国际权威的支持。世界主义多元主义力求让多层级权力分散，并由不同的民主机制（如公民社会参与、人权条约等等）加以问责，因而似乎最为可信。
    step2: |-
      米夏埃尔·聚恩（2016）重构了四种国家之外的民主模式：政府间民主国家、世界主义多元主义、最低限度的世界国家、世界主义民主；再析其经验预设。他按各模式实现所需的全球制度语境、意志形成的潜力、个人对民主的态度，逐一评估。结果世界主义多元主义得的支持最强。政府间民主国家模式处境不好：多数调查数据说，个人仍把本国议题放在跨国议题前头，全球公共善因此推不动。最低限度的世界国家要求跨国团结，而那团结仍然缺席。世界主义民主被他看作更完全成熟的世界国家，却缺公众对国际权威的支持。世界主义多元主义要把多层级权力分散开，由不同民主机制（公民社会参与、人权条约之类）来问责，看来最可信。
