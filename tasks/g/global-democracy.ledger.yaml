      汉斯·阿涅在一部雄心格外大的专著中，力求把国家之外的民主操作化，部分以国际组织的代表性、社会权力的平等来衡量，从而发展出（用他的话）“民主制主义”，作为解释国际与国内结果的自变量。这一进路把某种形式的全球民主当作已经存在，并作因果使用；据作者所知，这是第一项把全球民主当作自变量、以重定向既有国际关系争论的研究。
