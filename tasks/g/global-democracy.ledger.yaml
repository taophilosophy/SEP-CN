      The most common intrinsic claim relates to cosmopolitanism, which many proponents of global democracy have drawn upon as a moral foundation motivating the project (Kant 1991[1795])[^kant-1991]. Thomas Pogge (1992: 48–9) has argued that cosmopolitans share at least this set of beliefs: 1) that human beings are the ultimate units of moral concern; 2) this status applies to all humans equally; 3) everyone should be treated as ultimate units of concern by all others. Global democracy helps realize this cosmopolitan ideal by treating all individuals as moral beings capable of exercising equal control over shared destinies. It is important to note, however, that differences between global democrats exist in terms of the scope of their cosmopolitan commitment. While almost all global democrats see individuals as the fundamental object of concern, many proponents argue that relational qualities still matter in generating normative prescriptions (Miller 1995)[^miller-1995]. As such, ‘national communities’ or ‘humanity’ may well be important groups that deserve standing in global democratic politics for moral or pragmatic reasons.
    step1: |-
      最常见的内在主张与世界主义相关，许多全球民主的拥护者都把它当作推动这项工程的道德基础（Kant 1991[1795]）[^kant-1991]。托马斯·博格（1992: 48–9）论证说，世界主义者在至少这一组信念上是共同的：1）人是道德关怀的终极单位；2）这一身份平等地适用于所有人；3）每个人都应被所有其他人当作终极的关怀单位。全球民主把一切个人都当作有能力对共同命运行使平等控制的道德存在者，从而帮助实现这一世界主义理想。然而要注意，全球民主派在世界主义承诺的范围上彼此不同。几乎所有全球民主派都把个人看作关怀的根本对象，但许多拥护者论证说，关系性品质在产生规范规定时仍然要紧（Miller 1995）[^miller-1995]。因此，“民族共同体”或“人类”都可能是应在全球民主政治中享有地位的重要群体，无论出于道德理由还是实用理由。
