      Although democracy is widely regarded as an ideal worth attaining, critics of global democracy have been numerous and persistent (Miller 1995; Dahl 1999; Moravcsik 2004)[^dahl-1999][^miller-1995][^moravcsik-2004]. A variety of strong objections have been raised to the fundamental project of global democracy, as well as specific criticisms about institutional proposals and methodology. It is not possible to undertake a survey of all criticisms in the literature (and several core issues have already been discussed in the previous sections). This section, however, will outline three core issues that global democrats need to grapple with in current and future research.
    step1: |-
      虽然民主被广泛看作值得追求的理想，全球民主的批评者一向众多而顽强（Miller 1995; Dahl 1999; Moravcsik 2004）[^dahl-1999][^miller-1995][^moravcsik-2004]。针对全球民主这一根本工程，人们提出了各种各样的强烈反对，也有关于制度方案与方法论的具体批评。要在此梳理文献中全部批评既不可能（若干核心问题也已在前文各节讨论过）。不过本节将勾出三项核心问题，全球民主派在当前与未来的研究中都必须应付。
