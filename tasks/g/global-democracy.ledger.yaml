      ### 1.1 民主、全球化与民族国家
  - id: 5
    kind: body
    source: |-
      A review of global democracy must begin with how globalization has impacted the nation-state and the consequences for national democracy (Bray and Slaughter 2014)[^bray-2014]. Although volumes have been written about the theory and practice of democracy, the concept remains difficult to define. Etymologically the term is simple enough: democracy means rule by the people (*demos* meaning ‘people’ and *kratos* meaning ‘rule’ or ‘power’). This basic definition can be extrapolated in different ways. At its core, however, most scholars agree that democracy refers to a political practice in which individuals govern themselves through some form of equitable decision-making process. This leaves open two fundamental issues: who constitutes ‘the people’ and how ‘rule-making’ should occur.
    step1: |-
      对全球民主的回顾，必须从全球化如何影响民族国家、又如何影响民族民主开始（Bray and Slaughter 2014）[^bray-2014]。关于民主的理论与实践，已经写了不知多少卷，这个概念仍然难以定义。从词源上说，这个词倒简单：民主意味着由人民统治（*demos* 意为“人民”，*kratos* 意为“统治”或“权力”）。这一基本定义可以从不同方向引申。然而就其核心而言，大多数学者同意，民主指的是一种政治实践：个人通过某种公平的决策程序自己治理自己。这里留下两个根本问题：“人民”由谁构成，“规则制定”应当怎样进行。
    step2: |-
      回顾全球民主，得从两件事开始：全球化怎样冲击民族国家，又给民族民主带来什么后果（Bray and Slaughter 2014）[^bray-2014]。民主的理论与实践，不知被人写了多少卷，概念却仍然难下定义。从词源看倒简单：民主就是人民统治（*demos* 是“人民”，*kratos* 是“统治”或“权力”）。这条基本定义可以往不同方向引申。可论到核心，多数学者都同意：民主是一种政治实践，个人借某种公平的决策程序治理自己。于是留下两个根本问题：“人民”由谁构成，“制规”又该怎样进行。
