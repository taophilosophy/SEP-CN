      More recent work has sought to test empirically whether preconditions for democracy exist beyond the state. While limited work has used empirical preconditions to establish conceptual possibilities for global democracy, this research centres on the concrete (i.e., existing) conditions of world politics and their relationship to global democratization.
    step1: |-
