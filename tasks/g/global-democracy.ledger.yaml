      Global democracy scholarship has also been infused by myriad deliberative democratic proposals. This model suggests that global politics can be democratized by pursuing deliberation—the give and take of non-coercive and reasoned arguments—in various formal and informal sites. A vast number of authors have promoted this model, including John Dryzek, Seyla Benhabib, and James Bohman. The fundamental normative ideal is that non-coercive, reciprocal, and generalizable deliberation should guide action, and that decision-making be justified to those affected (Forst 2011)[^forst-2011]. Individuals should be free to put their ideas forward under egalitarian conditions, take on-board the ideas of others, and recalibrate preferences in line with ‘better arguments’. This helps to respect the autonomy of different agents while also enhancing the epistemic quality of decision-making. This model has clear connections with a ‘stakeholder model’ of global democracy, in which those individuals significantly affected by a global decision should be able to deliberate over how public power is exercised and how power wielders are held to account (Macdonald 2008)[^macdonald-2008].
    step1: |-
      全球民主的研究还受到无数审议民主方案的影响。这一模式提出，全球政治可以通过在各种正式与非正式场所追求审议而民主化：审议即非强制性的、讲理的论辩之往来。大量作者推动了这一模式，包括约翰·德雷泽克、塞拉·本哈比卜与詹姆斯·博曼。其根本规范理想是：非强制性、相互的、可普遍化的审议应当指导行动，决策应当向受影响者作出证成（Forst 2011）[^forst-2011]。个人应当能在平等条件下提出自己的想法，吸纳他人的想法，并依“更好的论证”重新校准偏好。这既有助于尊重不同行为者的自主，也提高决策的认识品质。这一模式与全球民主的“利益相关方模式”有清楚的联系：按后者，受某一全球决策显著影响的个人，应当能就该公共权力如何行使、权力持有者如何被问责进行审议（Macdonald 2008）[^macdonald-2008]。
    step2: |-
      全球民主的研究还灌进了无数审议民主的方案。这模式说，全球政治可以靠审议而民主化：审议就是非强制的、讲理的论辩往来，在各式正式、非正式的场所里进行。推这模式的作者很多，约翰·德雷泽克、塞拉·本哈比卜、詹姆斯·博曼都在内。根本的规范理想是：非强制、相互、可普遍化的审议该指导行动；决策该向受影响者给出证成（Forst 2011）[^forst-2011]。个人该能在平等条件下提出己见，吸纳人见，并依“更好的论证”重校偏好。这既尊重各行为者的自主，也提高决策的认识品质。这模式同全球民主的“利益相关方模式”接得很紧：受某一全球决策显著影响的人，该能就公共权力如何行使、掌权者如何被问责进行审议（Macdonald 2008）[^macdonald-2008]。
