      To begin, several scholars have developed more robust positions relating global democracy in theory to its empirical preconditions. Koenig-Archibugi, with Christian List, put forward an agency-based account of the demos. Their central claim is that “to function as a demos, a collection of individuals must have the capacity to be organized democratically in such a way as to function as a state-like group agent (List and Koenig-Archibugi 2010, 110)[^list-2010]. This body must be externally cohesive (identifiable as a collective) and internally consistent (have the capacity to exercise collective decision-making). Using the International Criminal Court as a case, they suggest that a global demos is theoretically possible and empirically tractable through transnational deliberation (though their argument is more concerned with establishing the conceptual possibility of a global demos rather than demonstrating its empirical existence).
    step1: |-
      先看一些学者在把理论上的全球民主同其经验前提联系起来方面，提出了更扎实的立场。柯尼希-阿希布吉与克里斯蒂安·利斯特提出一种以能动性为基础的民群说明。其核心主张是：“要作为民群发挥功能，一群个人必须有能力被民主地组织起来，从而作为一个类似国家的群体行动者发挥作用”（List and Koenig-Archibugi 2010, 110）[^list-2010]。这一体必须对外有凝聚力（可作为集体辨识），对内有融贯性（有能力行使集体决策）。他们以国际刑事法院为个案，提出全球民群在理论上是可能的，也可通过跨国审议在经验上操作（不过他们的论证更关心确立全球民群的概念可能性，而非证明其经验存在）。
    step2: |-
      先在概念上，一些学者把理论上的全球民主同其经验前提挂得更牢。柯尼希-阿希布吉与克里斯蒂安·利斯特提出一种以能动性为基础的民群说明。核心主张是：“要作为民群发挥功能，一群个人必须有能力被民主地组织起来，从而作为一个类似国家的群体行动者发挥作用”（List and Koenig-Archibugi 2010, 110）[^list-2010]。这个体对外要有凝聚力（能被辨识为一个集体），对内要融贯（有能力行使集体决策）。他们拿国际刑事法院作个案，说全球民群理论上可能，经验上也操作得来，靠的是跨国审议（不过他们更在意立起全球民群的概念可能性，不是证明它实际存在）。
