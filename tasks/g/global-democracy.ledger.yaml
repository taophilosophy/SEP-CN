      There are many different proposals for global democracy and, correspondingly, many different taxonomical divisions have been developed. For instance, Scholte (2014) divides the literature into ‘statist’ and ‘modern cosmopolitan’ approaches. The former refers to efforts to secure individual participation by strengthening multilateral institutions and shoring up the link between citizens and their representative, while the latter seeks to make international institutions open for individual participation. Archibugi et al. (2012, 7) suggest a tripartite (ideal-typical) break between federalist (world state), confederalist (intergovernmental democratic states), and polycentric (pluralist) prescriptions for global democracy. And Gráinne de Búrca (2007, 117) identifies three strands in the current literature to which she affixes the nomenclature of a ‘denial approach’, a ‘wishful thinking approach’, and a ‘compensatory approach’. The denial approach suggests that there is no “democracy problem” in transnational governance to be fixed, the wishful-thinking approach presumes that transnational governance can be easily democratized, the compensatory approach looks for other, non-democratic sources of legitimacy for global rule-making. This entry takes a different tack by presenting five different ‘models’ of global democracy. Models represent idealized theoretical constructions designed to express the normative qualities of a democratic system as well as its constitutive institutions. Models tend to fit together as whole pieces and are thus relatively discrete and well-developed proposals. The following subsections outline five prominent models. Specific attention is paid to the normative underpinnings, institutional design, and problems of feasibility and desirability associated with each model.
    step1: |-
      关于全球民主有许多不同的方案，相应地也发展出许多不同的分类划分。例如，肖尔特（2014）把文献分为“国家主义”与“现代世界主义”两类进路。前者指通过加强多边机构、巩固公民与其代表之间的联系来确保个人参与的努力；后者则力求使国际机构对个人参与开放。阿尔基布吉等人（2012, 7）提出一种三分（理想类型式）的划分：联邦主义（世界国家）、邦联主义（政府间民主国家）与多中心（多元主义）的全球民主方案。而格龙内·德布尔卡（2007, 117）辨认出当前文献中的三条脉络，分别冠以“否认进路”“一厢情愿进路”与“补偿进路”之名。否认进路认为跨国治理中并无需要修补的“民主问题”；一厢情愿进路假定跨国治理可以轻易民主化；补偿进路则为全球制规另寻非民主的合法性来源。本词条另取一途，呈现五种不同的全球民主“模式”。模式是理想化的理论构造，用以表达一个民主体系的规范品质及其构成性制度。模式往往作为整块拼合在一起，因而相对独立、发育成熟。以下各小节概述五种重要模式，特别关注每种模式的规范基础、制度设计，以及与可行性、可欲性相关的问题。
    step2: |-
      关于全球民主的方案很多，分类划法也就很多。肖尔特（2014）把文献分成“国家主义”与“现代世界主义”两路：前者靠加强多边机构、巩固公民同其代表的联系来确保个人参与；后者要使国际机构对个人参与开放。阿尔基布吉等人（2012, 7）提出三分（理想类型式）：联邦主义（世界国家）、邦联主义（政府间民主国家）、多中心（多元主义）。格龙内·德布尔卡（2007, 117）则辨出三条脉络，分别叫“否认进路”“一厢情愿进路”“补偿进路”。否认进路说，跨国治理里没有什么待修的“民主问题”；一厢情愿进路假定跨国治理可以轻易民主化；补偿进路替全球制规另找非民主的合法性来源。本词条另取一途，摆出五种全球民主“模式”。模式是理想化的理论构造，用来表达一个民主体系的规范品质与其构成制度。模式常是整块拼合的，因而相对独立、也较成熟。下面各小节概述五种重要模式，着重其规范基础、制度设计，以及可行性与可欲性方面的难题。
