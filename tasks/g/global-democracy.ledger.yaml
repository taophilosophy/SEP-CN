      As noted above, Wendt (2003) – a key figure in the IR constructivist movement – has argued that a world state is actually inevitable. While this argument stands in contradistinction to his constructivist disposition, his teleological argument is worth grappling with. In his understanding, a world state with coercive (military) will emerge through mutual recognition, equality, and a constitutional order. It is hard to see, given human experience under a social contract, that many (most?) individuals would not demand some form of democracy to undergird and legitimate this authority. Luke Ulaş (2016), in a somewhat connected claim, suggests that any form of global democracy necessitates a world state. He bases this supposition on the idea that economic self-interest, prudent self-interest and democratic self-interest – put to cosmopolitan ends – will require global political integration akin to a world state.
