      现实主义理论解释力很强，可新自由主义与建构主义学者越来越指出法律与观念在世界政治里的约束力。建构主义者说得尤其有力：“无政府状态是国家造就出来的”（Wendt 2003, 491）[^wendt-2003]。换句话说，现实主义对世界政治的解读，本身正是一种文化的历史的解读。国际社会的根本性质会变、也确实在变，所以新的社会与政治互动形式总有可能。这就说明，权力政治并非国际事务里不可更易的状况，而是一种可以靠新的认知、合作与争议形式破掉的局面。如此，世界主义的全球民主观念自然设想得来。林克莱特（1998）说，受影响的各民族之间正兴起对话共同体，造出更具普遍性、更少不平等、对文化差异更敏感的跨国社会关系。
