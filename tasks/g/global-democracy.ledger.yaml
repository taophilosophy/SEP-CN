      现在有理由说，关于全球民主的研究在过去十年左右经历了一场经验转向。这批工作背后，是对全球民主核心特征在概念与理论上更细的辨析。历史上从康德以来，许多人都想过全球民主与／或世界国家的可行性，而晚近的工作则力求拆解它可能在何种确切条件下成立。为此，学者动用了越来越精细的方法论。本节记录在概念上朝着全球民主之可能性取得的若干进展，并阐明一些重要的经验发现。
