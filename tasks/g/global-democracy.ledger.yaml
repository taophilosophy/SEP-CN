      Other work has focused more on assessing citizen views towards IOs legitimacy and, inversely, efforts by IOs to dampen their own democratic deficit(s). Matthias Ecker-Ehrhardt (2018) has employed event history analysis to show that—from 1950 to 2015—48 IOs have sought to follow an emerging democratic norm of transparency in response to scandals and public contestation This goes a long way to establishing Zürn et al.’s (2012) hypothesis on why IOs—which become politicized—will require stocks of legitimacy to dampen contestation. Ecker-Ehrhardt (2012) has, through a representative sample of German citizens, eliminated cognitive mobilization as a necessary condition of global democratization by establishing that citizens put moral and political faith in IOs to solve problems that their own government cannot. The generalizability of this finding remains up for debate.
    step1: |-
      另一些工作更侧重评估公民对国际组织合法性的看法，以及反过来说明国际组织为压减自身民主赤字所作的努力。马蒂亚斯·埃克-埃尔哈特（2018）运用事件史分析表明，1950年至2015年间，48个国际组织在遭遇丑闻与公众争议之后，曾设法遵循一种正在兴起的透明民主规范。这对确立聚恩等人（2012）的假设大有帮助：国际组织一旦被政治化，就需要合法性储备来压减争议。埃克-埃尔哈特（2012）通过德国公民的代表性样本，排除了认知动员作为全球民主化必要条件的可能，因为他确立了一点：公民在道德与政治上信任国际组织，指望它们解决本国政府解决不了的问题。这一发现的普适性仍有争论。
    step2: |-
      另一些工作更看重公民怎么看国际组织的合法性，反过来也看国际组织怎样压减自己的民主赤字。马蒂亚斯·埃克-埃尔哈特（2018）用事件史分析表明，1950 年到 2015 年间，48 个国际组织遇上丑闻与公众争议之后，都设法遵循一种正在兴起的透明民主规范。这对聚恩等人（2012）的假设很有帮助：国际组织一旦被政治化，就需要合法性储备来压争议。埃克-埃尔哈特（2012）用德国公民的代表性样本，把认知动员从全球民主化的必要条件里划掉了：他证明公民在道德上、政治上都信任国际组织，指望它们解决本国政府解决不了的问题。这发现能推广多远，还有争论。
