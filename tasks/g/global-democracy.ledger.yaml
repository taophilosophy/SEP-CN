      There are many ways to think about pursuing values of democratization in world politics. One prominent example comes from recent international political theory and the work of Adrian Little and Kate Macdonald (2013). These authors argue that the notion of ‘democratic practice’ should guide global reform. This approach frees itself from ‘institutionally-specific’ goals and rather seeks “a progressive process of democratization” (Little and Macdonald 2013, 749)[^little-2013]. These authors identify political control and popular equality as requisite values that should be employed to guide social critique and transformation. To the extent that individuals have more equitable control over how transnational political power is exercised, global democratization is enhanced. A similar approach is employed by Terry Macdonald and Kate Macdonald (2006) in their work on democratizing supply chain governance. These authors argue that global politics can be democratized through a series of decentralized, non-electoral mechanisms that help reassert public control over decision-making.
    step1: |-
      在世界政治中追求民主化价值，可以有许多想法。一个重要的例子来自近来的国际政治理论，即阿德里安·利特尔与凯特·麦克唐纳（2013）的工作。这两位作者论证说，“民主实践”这一观念应当指导全球改革。这一进路摆脱“制度特定”的目标，转而寻求“一个渐进的民主化过程”（Little and Macdonald 2013, 749）[^little-2013]。他们指出政治控制与人民平等是应当用来指导社会批评与变革的必需价值。个人对跨国政治权力如何行使拥有更公平的控制到什么程度，全球民主化便推进到什么程度。特里·麦克唐纳与凯特·麦克唐纳（2006）在关于供应链治理民主化的研究中用了类似的进路。他们论证说，全球政治可以通过一系列分散的、非选举的机制而民主化，这些机制有助于重新确立公众对决策的控制。
