      Historically, democracy first took hold in the ancient city states of Mesopotamia and Greece through direct mechanisms such as sortition (Keane 2009)[^keane-2009]. Since the 18th Century, though, the ideal of democracy has become wedded to rise of the nation-state. The modern state is a distinctive form of political organization based on sovereign autonomy over a delimited territory and population. Through a centrally organized government, the state wields a monopoly over the legitimate use of violence as well as the right to taxation (Giddens 1985)[^giddens-1985]. In exchange for these coercive powers, the state generates its legitimacy through democratic mechanisms: giving its citizenry equal say in how national laws and public policy are formed.
    step1: |-
      在历史上，民主最早在美索不达米亚与希腊的古代城邦立足，靠的是抽签这类直接机制（Keane 2009）[^keane-2009]。然而自十八世纪以来，民主的理想便与民族国家的兴起结了姻亲。现代国家是一种独特的政治组织形式，以对限定领土与人口的自主统治权为基础。国家通过一个集中组织的政府，垄断暴力的正当使用，也垄断征税的权利（Giddens 1985）[^giddens-1985]。作为这些强制权力的交换，国家通过民主机制产生其合法性：让公民在国家法律与公共政策如何形成上有平等的发言权。
    step2: |-
      历史上，民主最早立住脚的地方是美索不达米亚与希腊的古代城邦，靠的是抽签一类直接机制（Keane 2009）[^keane-2009]。可自十八世纪起，民主的理想就同民族国家的兴起绑在了一起。现代国家是一种独特的政治组织：它对一片限定的领土与人口拥有自主统治权。国家借一个集中组织的政府，独占暴力的正当使用，也独占征税之权（Giddens 1985）[^giddens-1985]。作为这些强制权力的交换，国家用民主机制生出自己的合法性：让公民对国家法律与公共政策如何形成，有平等的发言权。
