      A final point concerns the relationship between global democracy and national democratic backsliding. This latter phenomenon is being driven, largely, by populists of different varieties: authoritarian, technocratic, and so on. According to Nord et al. 2025 (see the Other Internet Resources), the number of individual citizens living in a democracy has declined over the last few years. Populists and straightforward autocrats have been able to reverse democratic norms, stall majoritarian institutions, and erode constitutions/human rights across many corners of the globe.
    step1: |-
      最后一点关乎全球民主与国内民主倒退的关系。后一现象大体上由各类民粹主义者驱动：威权的、技术官僚的等等。据 Nord 等人 2025（见“其他网络资源”），生活在民主中的个人公民数量在过去几年有所下降。民粹主义者与直白的独裁者在全球许多角落扭转民主规范、阻滞多数决制度、侵蚀宪法与人权。
    step2: |-
      最后一点，关乎全球民主与国内民主倒退的关系。后一现象大体由各类民粹主义者推动：威权的、技术官僚的，等等。据 Nord 等人 2025（见“其他网络资源”），生活在民主里的公民人数近些年少了。民粹主义者与干脆的独裁者，在世界许多角落翻掉民主规范、卡住多数决制度、啃蚀宪法与人权。
