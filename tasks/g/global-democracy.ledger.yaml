      Ghassim, Koenig-Archibugi, and Cabrera (2022), in one of the most direct tests of global democratic reforms, employ a population-based conjoint survey experiment conducted in Argentina, China, India, Russia, Spain, and the United States. They find strong support for the UNSC maintaining authority over nation-states, but also support for diversifying authority to other UN organs in which citizen input would be more pronounced. The most elaborate study of empirical support for global democracy comes from Ghassim and Pauli (2024) in which they argue that a majority of citizens support some form of democracy (drawn from Brazil, Germany, Japan, the United Kingdom, and the United States). This is conditioned by individual perceptions surrounding the necessity of IOs to solve collective action problems and party cues (though mostly in single-member district systems, not proportional systems).
    step1: |-
      加西姆、柯尼希-阿希布吉与卡布雷拉（2022）作了全球民主改革最直接的检验之一，在阿根廷、中国、印度、俄罗斯、西班牙与美国进行了一项基于人口的联合调查实验。他们发现，人们强烈支持联合国安全理事会对民族国家保有权威，但也支持把权威分散给其他联合国机构，因为公民输入在其中会更显著。关于全球民主之经验支持的最精细研究出自加西姆与保利（2024），他们论证说多数公民支持某种形式的民主（样本取自巴西、德国、日本、英国与美国）。这以个人对国际组织解决集体行动问题之必要性的感知、以及政党线索为条件（不过主要是在单议席选区制，而非比例制）。
    step2: |-
      加西姆、柯尼希-阿希布吉与卡布雷拉（2022）做了一项全球民主改革的最直接检验之一：在阿根廷、中国、印度、俄罗斯、西班牙、美国做基于人口的联合调查实验。他们发现，人们很支持联合国安全理事会对民族国家保有权威，同时也支持把权威分散给别的联合国机构，因为在那些机构里公民输入会更显眼。全球民主之经验支持方面最精细的研究出自加西姆与保利（2024）：他们论证多数公民支持某种形式的民主（样本取自巴西、德国、日本、英国、美国）。这以两件事为条件：个人对国际组织解决集体行动问题之必要性的感知，以及政党线索（不过主要见于单议席选区制，比例制里少见）。
