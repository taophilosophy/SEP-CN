      This advent has relied, very frequently, upon attacking ‘the elite’ in defence of ‘the people’. Though not always, often the targeted ‘elite’ are leaders of IOs from the EU to the WTO and beyond (Inglehart and Norris 2017)[^inglehart-2017]. This phenomenon is evident from multiple national (populist) leaders from Hungary, Turkey, the Philippines, to the US. Empirically, to give one example, Erik Voeten (2020) has shown that national politicians are able to effectively target the authority of international courts to prime domestic audience to their populist views with much success (though following through on attacks and having too thin an ideology mediates this effect). At any rate, populist leaders and authoritarians are seeking to recapture political power from the international realm and install it at the domestic level under the guise of sovereignty ‘for the people’.
    step1: |-
      这一局面的到来，非常频繁地依赖攻击“精英”以捍卫“人民”。虽然并非总是如此，被攻击的“精英”常常是国际组织的领导人，从欧盟到世贸组织及更远处（Inglehart and Norris 2017）[^inglehart-2017]。这一现象从匈牙利、土耳其、菲律宾直到美国的许多（民粹）国家领导人身上都看得出来。举个例子，埃里克·福滕（2020）以经验方式表明，本国政客能有效地针对国际法院的权威，使国内受众对其民粹看法作出准备，而且很成功（不过是否落实攻击、以及意识形态是否过于单薄，会调节这一效应）。无论如何，民粹领导人与威权者都在力求从国际领域夺回政治权力，并以“为人民”的主权为幌子把它安置在国内层面。
    step2: |-
      这局面的到来，往往靠攻击“精英”来护“人民”。被攻的“精英”，常常是国际组织的领导人，从欧盟到世贸组织，再远也有（Inglehart and Norris 2017）[^inglehart-2017]。这现象从匈牙利、土耳其、菲律宾直到美国的许多（民粹）国家领导人身上都看得见。举个例：埃里克·福滕（2020）拿经验材料表明，本国政客能有效地对着国际法院的权威下手，把国内受众预备到接受其民粹看法，而且很成功（不过攻完是否跟进、意识形态是否太薄，都会调节这效应）。无论如何，民粹领袖与威权者都在从国际领域夺政治权力，借“为人民”的主权之名，把它安回国内。
