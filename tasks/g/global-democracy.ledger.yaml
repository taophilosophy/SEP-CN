      Congruent work has focused on the theoretical relationship between a demos and the possibility of global democracy. Valentini (2014) has argued against the ‘no global demos, no global democracy’ thesis. Her detailed article notes that mutual trust, ideological cohesion and a convergence of interests between individuals is necessary for democracy. Valentini demonstrates that while no current global demos exists – thus precluding global democracy – a global demos is neither infeasible or morally costly. The question then becomes one of establishing the right preconditions and transformative pathways. Lafont (2010), in a different but related take, rightly criticizes Bohman for confusing democratic preconditions with sufficient criteria for a well-functioning transnational democracy. She argues that a vibrant global public sphere and minimum set of rights are likely necessary for a functioning global democracy, though leaves analysis of this potential to future work. Jonathan White (2014) has suggested that transnational partisanship is both empirically possible and conceptually part of movements toward global democratization, though remains sceptical about the normative desirability of parties in global democratic structures.
    step1: |-
      与之相合的工作，聚焦于民群与全球民主之可能性之间的理论关系。瓦伦蒂尼（2014）反对“没有全球民群，就没有全球民主”这一命题。她那篇细致的文章指出，相互信任、意识形态上的凝聚与个人之间利益的趋同，是民主所必需的。瓦伦蒂尼表明，虽然当前不存在全球民群（因而排除了全球民主），全球民群却既非不可行，也非道德上代价高昂。问题于是变成：如何确立正确的前提与转化路径。拉丰（2010）在一种不同而相关的取径中，正确地批评博曼把民主的前提条件同跨国民主良好运转的充分判准混为一谈。她论证说，一个活跃的全球公共领域与一套最低限度的权利，很可能是运转良好的全球民主所必需的，不过把对这一潜力的分析留给未来研究。乔纳森·怀特（2014）提出，跨国的党派性是经验上可能的，在概念上也是走向全球民主化运动的一部分，不过他对政党在全球民主结构中的规范可欲性仍持怀疑。
    step2: |-
      与这相合的工作，盯住民群与全球民主之可能性之间的理论关系。瓦伦蒂尼（2014）反对“没有全球民群，就没有全球民主”这个命题。她那篇细致的文章说，相互信任、意识形态上的凝聚、个人之间利益的趋同，都是民主所必需。她表明：当前虽无全球民群（全球民主因此被排除），可全球民群既非不可行，道德上也不昂贵。问题于是变成：怎样立起对的前提与转化路径。拉丰（2010）走一条不同而相关的路，正确地批评博曼把民主的前提条件同跨国民主良好运转的充分判准混作一谈。她说，一个活跃的全球公共领域、一套最低限度的权利，很可能是运转良好的全球民主所必需；至于这份潜力如何，她留给后人来析。乔纳森·怀特（2014）说，跨国的党派性经验上可能，在概念上也属于走向全球民主化的运动；不过他仍怀疑政党在全球民主结构里是否规范上可欲。
