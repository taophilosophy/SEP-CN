      Though only tangentially related to democratic legitimacy, Jonas Tallberg and his co-authors have undertaken exemplary research studying citizen and elite views of the legitimacy of IOs (Dellmuth et al. 2022)[^dellmuth-2022]. They find that both groups vary in their assessment of ‘how appropriate’ actors find a variety of international organizations. This variation is driven by socioeconomic status, political values, geographical identification, and domestic institutional trust. In general, elites find IOs more legitimate than their counterpart citizens along the aforementioned criteria. This, however, only measures sociological legitimacy (a belief in the appropriateness of an institution), not normative (or, more narrowly) democratic legitimacy. The former may be a precondition of the latter, but only through a more robust conception of democratic legitimacy could we gain traction on the implications for global democracy. In an alternate study, but tapping into some similar issues, Parizek and Stephen (2021) use panel regression to assess the secretariats of thirty-five United Nations system bodies from 1997 to 2015. They show that normative pressure for equal representation is pronounced, especially for visible (i.e., politicized) IOs.
    step1: |-
      虽然与民主合法性只算间接相关，约纳斯·塔尔贝里与他的合作者对公民与精英关于国际组织合法性的看法作了堪称典范的研究（Dellmuth et al. 2022）[^dellmuth-2022]。他们发现，两个群体在评判各类国际组织“有多适当”上都有差异。这一差异由社会经济地位、政治价值、地理认同与国内制度信任驱动。总体上说，按上述判准，精英比对应的公民更觉得国际组织有合法性。然而这只测量社会学合法性（对某一制度适当性的信念），不测量规范（或更狭窄地说）民主的合法性。前者可能是后者的前提，可只有凭更扎实的民主合法性概念，我们才能在它对全球民主的含义上取得进展。帕里泽克与斯蒂芬（2021）另作一项研究，触及一些相似问题：他们用面板回归评估1997至2015年间联合国系统三十五个机构的秘书处，表明要求平等代表的规范压力很显著，对可见（即被政治化）的国际组织尤其如此。
    step2: |-
      约纳斯·塔尔贝里与他的合作者做过一项堪称典范的研究，虽只算间接涉及民主合法性，却考察了公民与精英怎样看国际组织的合法性（Dellmuth et al. 2022）[^dellmuth-2022]。他们发现，两个群体评判各类国际组织“有多适当”时都有差异。这差异由社会经济地位、政治价值、地理认同、国内制度信任驱动。总的看，按这些判准，精英比对应的公民更觉得国际组织有合法性。不过这量的是社会学合法性（相信某一制度适当），不是规范合法性，也不是更窄意义上的民主合法性。前者也许是后者的前提；可只有把民主合法性这个概念做得更扎实，才能看清它对全球民主的含义。帕里泽克与斯蒂芬（2021）另做一项研究，碰了些相近问题：他们用面板回归评估 1997 至 2015 年间联合国系统三十五个机构的秘书处，表明要求平等代表的规范压力很显著，在对可见（也就是被政治化）的国际组织尤其如此。
