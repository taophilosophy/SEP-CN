      At any rate, much work remains to think about how justice, democracy, and legitimacy intersect and diverge in both theoretical and empirical terms (Dingwerth 2014)[^dingwerth-2014]. This will entail looking at whether the current arrangements of international institutions are sufficiently strong to trigger demands of justice, democracy, or both (Nagel 2005; Sangiovanni 2007)[^nagel-2005][^sangiovanni-2007]. It will also require analysis of legitimacy as a separable virtue of global political institutions with its own character and composition that may only tangentially relate to democracy. Different issue-areas of might require their own form of ‘practice-dependent’ democratization (Sangiovanni, 2016). Work on practice-dependence – the notion that existing institutional forms might not just condition feasibility but also the justifiability of normative demands – is prevalent in the global justice literature but remains absent from work on global democracy. These future directions for research—as well as many of the other issues addressed in this review – should ensure that global democracy remains an active, vibrant, and important field of practice and study in years to come.
    step1: |-
      无论如何，还有许多工作要想清楚：正义、民主与合法性在理论上与经验上如何交叠、又如何分岔（Dingwerth 2014）[^dingwerth-2014]。这将要求考察国际制度的当前安排是否强到足以触发对正义、对民主、或对两者的要求（Nagel 2005; Sangiovanni 2007）[^nagel-2005][^sangiovanni-2007]。这还将要求把合法性分析为全球政治制度一种可分离的德性，它有其自身的性格与构成，或许只与民主间接相关。不同议题领域可能需要各自形式的“依赖实践的”民主化（Sangiovanni, 2016）。关于实践依赖的研究，即认为既有制度形态不仅制约可行性、也制约规范要求的可证成性，在全球正义文献中很流行，在全球民主的研究中却仍缺席。这些未来的研究方向，连同本综述谈到的许多其他问题，应当能保证全球民主在今后若干年里仍是一个活跃、有生气而重要的实践与研究领域。
    step2: |-
      无论如何，还剩许多活要想明白：正义、民主、合法性在理论上与经验上怎样交叠、又怎样分岔（Dingwerth 2014）[^dingwerth-2014]。这要考察：国际制度眼下的安排，够不够强到触发对正义、对民主、或对两者的要求（Nagel 2005; Sangiovanni 2007）[^nagel-2005][^sangiovanni-2007]。这也要求把合法性当作全球政治制度一种可分开的德性来析：它有自身的性格与构成，也许只同民主间接相关。不同议题领域，可能各需一种“依赖实践”的民主化（Sangiovanni, 2016）。实践依赖这说法认为，既有的制度形态不只制约可行性，也制约规范要求能否证成；它在全球正义文献里很流行，在全球民主的研究里却还缺席。这些未来的方向，连同本综述谈到的许多别的问题，应当能让全球民主在往后若干年里仍是一个活跃、有生气、也重要的实践与研究领域。
