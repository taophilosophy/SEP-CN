      In a particularly ambitious book-length treatise, Hans Agné has sought to operationalize democracy beyond the state – measured in part by the representativeness of IOs and equality of social power – to develop (in his words) democratism as an explanatory variable of international and domestic outcomes. This approach takes some form of global democracy as already existing and puts it to causal use and is the first study (known to the author) treating global democracy as an independent variable to reorient existing IR debates.
