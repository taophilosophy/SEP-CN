      Another strand of research has empirically documented that IOs are becoming more democratic in their rhetoric. One subset of this work has shown that national parliaments in the EU are increasingly likely to contain Member of Parliament speeches which make representative claims of citizens in other, interdependent states during times of crisis (Kinski 2018)[^kinski-2018]. She demonstrates this phenomenon across Austria, Germany, and Ireland, especially from left-wing Eurosceptic parties. Dingwerth et al. (2019) undertake a regression analysis of 20 cross-regional IOs, over the time period 1980–2011, increasingly justify their authority by reference to democratic standards instead of functional (problem-solving) grounds. Like Zürn et al. (2012) and Ecker-Ehrhardt (2018), this dependent variable is driven by public visibility and protests compounded by path-depended feedback effects locking in democratic legitimation language. On this same point, Tobias Lenz and Henning Schmidtke (2023) draw on a novel dataset of 32000 paragraphs of text published by 28 regional IOs between 1980 and 2019 to establish statistically that IOs seek discursive legitimation to target diverse audiences, seek to cohere audience beliefs about the rightfulness of their own rule, and match peer IO behaviour.
    step1: |-
      另一路研究以经验方式记录：国际组织在修辞上正变得更民主。其中一个分支表明，欧盟各国议会在危机时期越来越可能出现这样的议员演讲：它们对其他相互依存国家的公民提出代表主张（Kinski 2018）[^kinski-2018]。她在奥地利、德国与爱尔兰记录了这一现象，尤以左翼疑欧政党为多。丁韦特等人（2019）对20个跨区域国际组织在1980至2011年间作回归分析，发现它们越来越多地参照民主标准、而非功能（解决问题）理由来证成自身权威。与聚恩等人（2012）和埃克-埃尔哈特（2018）一样，这一因变量由公众可见度与抗议推动，又因路径依赖的反馈效应而锁定民主合法化的语言。就同一点，托比亚斯·伦茨与亨宁·施密特克（2023）利用一份新数据集，即28个区域国际组织在1980至2019年间发布的32000段文本，以统计方式确立：国际组织寻求话语上的合法化，以针对多样受众、求得受众对其统治正当性的信念之融贯、并比照同类国际组织的行为。
    step2: |-
      另一路研究拿经验材料记录：国际组织在说法上越来越民主。一个分支表明，欧盟各国议会在危机时期越来越常出现这样的议员演讲：替其他相互依存国家的公民提出代表主张（Kinski 2018）[^kinski-2018]。她在奥地利、德国、爱尔兰都记下这现象，左翼疑欧政党尤其多。丁韦特等人（2019）对 20 个跨区域国际组织在 1980 至 2011 年间作回归分析，发现它们证成自身权威时越来越多援引民主标准，少援引功能（解决问题）理由。与聚恩等人（2012）、埃克-埃尔哈特（2018）一样，这个因变量由公众可见度与抗议推动，再被路径依赖的反馈效应锁进民主合法化的话语。托比亚斯·伦茨与亨宁·施密特克（2023）就同一点，用一份新数据集——28 个区域国际组织 1980 至 2019 年间发布的 32000 段文本——作统计，确立了三件事：国际组织求话语上的合法化，以对应多样受众；求受众对其统治正当性的信念趋于一致；也比照同类国际组织的行为。
