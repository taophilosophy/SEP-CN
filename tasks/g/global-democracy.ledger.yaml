      Values of democratization have also been promoted by international lawyers (Cohen and Sabel 2006)[^cohen-2006]. Gráinne de Búrca, in a 2008 article, advocates a ‘democracy striving approach’ which highlights the dynamic and inchoateness of democracy. The basic idea is to identify the core principles (or ‘building blocks’) of democracy and strive for those values beyond the state. De Búrca (2008, 129–36) identifies political equality, participation, and representation as key values. Nico Krisch, in a book from 2010, has argued that international law can be democratized by seeking accountability, deliberation, and contestation in different issue spaces. Krisch suggests that the uneven and fragmented terrain of global legal orders actually allow these values to come to the fore, and underscores this argument through case study analysis of the European Human Rights regime, UN Security Council rulings on terrorism, and genetically modified food governance.
    step1: |-
      民主化的价值也由国际法学者推动（Cohen and Sabel 2006）[^cohen-2006]。格龙内·德布尔卡在2008年一篇文章中提倡一种“向民主努力”的进路，突出民主的动态性与未完成性。基本想法是找出民主的核心原则（或“积木”），并在国家之外为这些价值努力。德布尔卡（2008, 129–36）指出政治平等、参与与代表是关键价值。尼科·克里施在2010年的一本书中论证说，国际法可以通过在不同议题空间中寻求问责、审议与争议而民主化。克里施提出，全球法律秩序那片不均而碎片化的地形，其实让这些价值得以凸显；他并以欧洲人权体制、联合国安全理事会关于恐怖主义的裁决、转基因食品治理的个案研究来支撑这一论证。
