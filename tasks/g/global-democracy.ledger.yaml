      尽管亚历山大·温特（2003）作出目的论式的断言，说世界政府“不可避免”，许多人仍嘲笑这一概念不可行。若没有又一场重大危机（例如世界大战）来促成国际行动，便难以设想各国为何会甘愿把主权权力交给一个全球国家，又究竟有谁会在这过程中领头。联合国改革常被举为前进的一条路，可美国、中国、俄罗斯、法国与英国在安全理事会中握有的否决权，使那一选项大打折扣。再从可欲性看，反对者还论证说，世界政府实际上会加剧全球民主赤字。例如康德论证说，世界政府会变成“没有灵魂的专制”，因为全球领导人会在缺乏适当制衡的情况下滥用权力。其他学者也提出，一个由七十亿人选区中每人一票的世界政府，实质上会毫无意义，并不能使个人有意义地参与其集体治理。
