      Finally, several IR scholars have also contended that global affairs can be democratized by pursuing democratic values in different ways. Karin Bäckstrand (2006), for instance, suggests that global climate governance could be democratized through a stakeholder model which blends deliberation, participation, and accountability. Jonathan Kuyper (2014) argues that different issue areas of world politics can likewise be democratized by pursuing values of equal participation, accountability, and revisability. This argument is tested and developed in the issue space of intellectual property rights governance. Magdalena Bexell and her co-authors (2010) focus on the values of participation and accountability in global governance and document how non-state actors help induce (or undercut) these desiderata. Kuyper and Squatrito (2017) have taken the ‘values of democratization’ approach and shown that international courts can empirically substantiate several values (participation, accountability, and justification) as well as documenting variation across courts.
    step1: |-
      最后，几位国际关系学者也主张，全球事务可以通过以不同方式追求民主价值而民主化。例如卡琳·贝克斯特兰（2006）提出，全球气候治理可以通过一种混合了审议、参与与问责的利益相关方模式而民主化。乔纳森·凯珀（2014）论证说，世界政治的不同议题领域同样可以通过追求平等参与、问责与可修正性这些价值而民主化。这一论证在知识产权治理的议题空间中得到检验与展开。玛格达莱娜·贝克塞尔及其合作者（2010）关注全球治理中的参与与问责价值，并记录非国家行为者如何帮助促成（或削弱）这些目标。凯珀与斯夸特里托（2017）采取“民主化的价值”进路，表明国际法院可以在经验上证实若干价值（参与、问责与证成），并记录了各法院之间的差异。
