      The preceding five models provide a brief schematic of how global democracy proposals have typically been crafted in the academic literature. Subsequent to this move, however, global democratic debates have taken a turn away from ‘models’ toward ‘values of democratization’. This section outlines the core impetus behind this turn and its methodological foundation, and then discusses several prominent examples in the literature.
