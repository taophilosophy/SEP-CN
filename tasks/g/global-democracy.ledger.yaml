      In general, this literature is responding to a long-standing critique. Many prominent scholars have suggested that empirical realities make global democracy a non-starter. Joseph Nye (2002: 17), in an early piece, claimed that “treating the world as one global constituency implies the existence of a political community in which citizens of around 200 states would be willing to be continually outvoted by more than a billion Chinese and a billion Indians”. Robert Dahl (1999) remarked that global institutions are simply too remote from individual citizens to enable meaningful participation. David Miller (2010) averred that public appetite for global democracy is absent, making the ‘idea itself’ problematic. Yunker (2011) has explicitly argued that the notion of a world government is rejected by majority of the world’s population.
    step1: |-
      总体上说，这批文献是在回应一项由来已久的批评。许多著名学者提出，经验现实使全球民主根本无从起步。约瑟夫·奈（2002: 17）在早期一篇文章中声称，“把世界当作一个全球选区，意味着存在一个政治共同体，其中约两百个国家的公民愿意不断被十多亿中国人和十亿印度人票决击败”。罗伯特·达尔（1999）评论说，全球机构离个人公民太远，无法促成有意义的参与。戴维·米勒（2010）断言，公众对全球民主的胃口并不存在，这使“观念本身”成了问题。云克（2011）明确论证说，世界政府的观念为世界人口的大多数所拒斥。
    step2: |-
      总的来说，这批文献在回应一项老批评。许多有名学者说，经验现实叫全球民主根本起不了步。约瑟夫·奈（2002: 17）早年就说，“把世界当作一个全球选区，意味着存在一个政治共同体，其中约两百个国家的公民愿意不断被十多亿中国人和十亿印度人票决击败”。罗伯特·达尔（1999）说，全球机构离个人公民太远，办不出有意义的参与。戴维·米勒（2010）断言，公众对全球民主没有胃口，这么一来“观念本身”就成了问题。云克（2011）明说，世界政府的观念被世界人口的大多数拒斥。
