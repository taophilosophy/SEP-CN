      It is now reasonable to argue that scholarship on global democracy has undergone an empirical turn over the last decade (roughly). This work has been backed-up by more conceptual and theoretic nuance regarding global democracy’s core features. While many throughout history from Kant onwards have thought about the feasibility of global democracy and/or a world state, recent work has sought to unpick the precise conditions under which this might be possible. In doing so, scholars invoke increasingly sophisticated methodological approaches. This section documents some conceptual advancements made to the possibility of global democracy as well as fleshing out some notable empirical findings.
