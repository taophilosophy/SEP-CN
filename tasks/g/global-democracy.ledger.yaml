      如上所述，温特（2003）这位国际关系建构主义运动的关键人物，论证世界国家其实不可避免。这一论证虽与他的建构主义气质相悖，其目的论论证却值得应对。照他的理解，一个带有强制（军事）力量的世界国家将通过相互承认、平等与宪法秩序而出现。鉴于人类在社会契约下的经验，很难看出许多人（多数人？）会不要求某种形式的民主来支撑并合法化这一权威。吕克·乌拉什（2016）在一个略有关联的主张中提出，任何形式的全球民主都需要一个世界国家。他把这一设定基于这样的想法：经济上的自利、审慎的自利与民主的自利，一旦指向世界主义目标，将要求类似于世界国家的全球政治整合。
