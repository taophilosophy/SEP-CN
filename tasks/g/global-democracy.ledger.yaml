      Overall, the notion that world politics can be democratized by myriad agents pursuing different democratic values in diverse fora has emerged as a nascent way to think about reducing the global democratic deficit. While this approach has clear benefits, it also comes with complications. First, the lack of an institutional blueprint makes the design process much more opaque than several of the models offered previously. Second, it is not immediately clear why we should seek some values over others and what we should do when values conflict with one another. Finally, this approach might unnecessarily reify the status quo. Without systematic and comparative analysis, proponents risk ‘cherry picking’ good examples that highlight how democratic values can be attained while failing to elaborate how really difficult situations can be transformed. This all indicates that this turn in the literature requires further research.
    step1: |-
      总体而言，世界政治可以由众多行为者在不同论坛追求不同民主价值而民主化，这一观念已成为思考如何减少全球民主赤字的新兴途径。这一进路有明显好处，也带来麻烦。第一，缺乏制度蓝图，使设计过程比前面几种模式晦暗得多。第二，我们为什么应当追求某些价值而非另一些，价值彼此冲突时又该怎样办，并不立即清楚。最后，这一进路可能不必要地把现状实在化。没有系统的比较分析，拥护者便有“挑樱桃”的风险：挑出好例子，显示民主价值如何得以实现，却未阐明真正困难的情形如何能被转化。这一切表明，文献中的这一转向需要进一步研究。
    step2: |-
      总的看，世界政治可以由众多行为者在不同场合追求不同民主价值而民主化，这已成为思考削减全球民主赤字的一条新路。这条路好处明显，麻烦也不少。第一，没有制度蓝图，设计过程就比前面几种模式晦暗得多。第二，为什么该取某些价值而不取另一些，价值彼此打架时又怎么办，并不一眼就清。最后，这条路可能把现状不必要地坐实。没有系统的比较分析，拥护者就有“挑樱桃”的风险：拣出好例子，显摆民主价值如何实现得了，却讲不清真正难办的局面怎么转。这些都说明，文献里这一转向还要接着研究。
