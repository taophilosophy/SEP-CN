      Befitting a model that has a long history in democratic thought, different institutional designs have been offered. In Perpetual Peace, for instance, Kant (1991 [1795]) argued for a global federation of peoples composed of republican (i.e. democratic) states. In this federation, states would observe a cosmopolitan right to hospitality, aid, and territory. John Rawls (1999) similarly advocated an international ‘law of peoples’ in which liberal democratic states (and decent states) establish international laws that generate a peaceful and tolerant international order. Some scholars in this line, such as Robert Keohane, Andrew Moravcsik, and Stephen Macedo (2009), have gone even further and suggested that IOs can help keep peace between states (a core Kantian claim), and safeguard democracy, deliberation, and human rights. Transnational activities are democratically legitimate from the perspective of citizens so long as each nation-state maintains autonomy and sovereignty in global affairs. This allows supranational competences to be controlled and even revoked by member-states and their leaders (Zürn 2000)[^zürn-2000].
    step1: |-
      既然这一模式在民主思想中有长久历史，人们便提出了不同的制度设计。例如在《永久和平论》中，康德（1991 [1795]）主张建立一个由共和制（即民主制）国家组成的人民的全球联邦。在这一联邦中，各国将遵守一种世界主义的待客权、援助权与领土权。约翰·罗尔斯（1999）同样倡导一种国际的“万民法”，由自由民主国家（以及体面国家）确立国际法，产生和平而宽容的国际秩序。这一脉络中的一些学者，如罗伯特·基欧汉、安德鲁·莫拉夫奇克与斯蒂芬·马塞多（2009），走得更远，提出国际组织可以帮助维持国家间和平（这是康德式的核心主张），并保障民主、审议与人权。只要每个民族国家在全球事务中保持自主与主权，跨国活动从公民的角度看就是民主合法的。这使超国家权限可以由成员国及其领导人控制乃至撤回（Zürn 2000）[^zürn-2000]。
    step2: |-
      这一模式在民主思想里历史长久，制度设计也就有好几种。康德在《永久和平论》里主张，建立一个由共和制（也就是民主制）国家组成的人民的全球联邦。在这联邦中，各国遵守一种世界主义的待客权、援助权与领土权。约翰·罗尔斯（1999）同样倡导国际的“万民法”：由自由民主国家（以及体面国家）确立国际法，造出和平而宽容的国际秩序。这条脉络里的一些学者走得更远，如罗伯特·基欧汉、安德鲁·莫拉夫奇克、斯蒂芬·马塞多（2009），他们说国际组织能帮国家间维持和平（这是康德的核心主张），还能保障民主、审议与人权。只要每个民族国家在全球事务里保住自主与主权，跨国活动从公民眼里看就是民主合法的。超国家权限因此可以由成员国及其领导人控制，乃至撤回（Zürn 2000）[^zürn-2000]。
