      Overall, this empirical turn is burgeoning (see Afran 2025 for an overview of recent monograph treatments). We have substantial data showing that many preconditions of democracy are met at the global level (and that some previously-thought preconditions may be unnecessary), that IOs seek to legitimate themselves in terms of democratic reform/language, and that this is in line with—and response to—citizen preferences. We also have good evidence that citizen demand for legitimacy can trigger democratization efforts, and that democracy beyond the state may take different shapes. While studies in this space are almost uniformly positive in their view that global democracy is empirically possible, some works have criticized the empirical possibilities of global democracy exist. Gaspardo and Carvalho (2025), examining democratization efforts in global financial governance, show that the BRICS states make democratic efforts less likely. Zürn, as discussed above, looks at data from Eurobarometer and other sources to show that individuals are still more nationally-oriented and are wary of international authority, and applies this as a constructive critique of different global democracy models.
    step1: |-
      总体而言，这场经验转向正在蓬勃生长（关于晚近专著处理的概述，见 Afran 2025）。我们有大量数据表明：民主的许多前提在全球层面已得到满足（并且一些过去被认为的前提或许并不必要）；国际组织力求以民主改革与民主语言为自己取得合法性；这与公民偏好一致，也是对公民偏好的回应。我们也有很好的证据表明，公民对合法性的需求可以触发民主化的努力，而国家之外的民主可能采取不同形态。这一领域的研究几乎一致认为全球民主在经验上是可能的，不过也有一些著作批评全球民主的经验可能性。加斯帕多与卡瓦略（2025）考察全球金融治理中的民主化努力，表明金砖国家使民主化努力更难发生。上文讨论过的聚恩，则察看欧洲晴雨表等来源的数据，表明个人仍更以本国为取向，对国际权威存有戒心，并把这一点用作对不同全球民主模式的建设性批评。
    step2: |-
      总的看，这场经验转向正长得旺（综述晚近专著，见 Afran 2025）。我们有大量数据：民主的许多前提在全球层面已经凑齐（有些过去以为必要的前提，或许并不必要）；国际组织在说法上力求得个民主的合法化，这是对公民偏好的回应，也与之一致。我们也有不错的证据：公民对合法性有需求，能触发民主化的努力；国家之外的民主可能取不同形态。这一领域的研究几乎都说全球民主在经验上可能；可也有著作批评这份可能性。加斯帕多与卡瓦略（2025）考察全球金融治理里的民主化努力，表明金砖国家让民主化更难发生。聚恩上文已谈，他察看欧洲晴雨表等来源的数据，表明个人仍更以本国为取向，对国际权威存着戒心，并以此对不同全球民主模式作建设性的批评。
