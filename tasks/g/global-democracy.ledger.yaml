      Other scholars put instrumental considerations at the fore. For instance, proponents have maintained that global democracy is required for epistemic, problem-solving, justice, and legitimacy-based reasons. John Dryzek (2000) has noted that democracy enables a wide-variety of perspectives to shape policy and thus increases the chances of making the ‘correct’ decision (see also Landemore 2013)[^landemore-2013]. Similarly, scholars in the pragmatist tradition of John Dewey have suggested that global democracy is required to generate compliance with international rules and thus solve collective action problems such as climate change (Bray 2013)[^bray-2013]. By participating in the formation of law-making, individuals are more likely to comply with the agreement. Laura Valentini (2012) has claimed that global democracy is required for global justice. Democratic mechanisms need to be in place to sort out reasonable disagreements as to how resources should be allocated. Finally, Michael Zürn and his co-authors (2012) suggest that global democratic procedures can help provide IOs with important stocks of sociological legitimacy and hence avoid complications of politicization (see also Buchanan and Keohane 2006)[^buchanan-2006].
    step1: |-
      另一些学者把工具性考量置于首位。例如，拥护者主张，全球民主出于认识、解决问题、正义与合法性方面的理由而为必需。约翰·德雷泽克（2000）指出，民主使各种各样的视角得以塑造政策，从而提高作出“正确”决定的机会（另见 Landemore 2013）[^landemore-2013]。类似地，约翰·杜威实用主义传统中的学者提出，全球民主为产生对国际规则的遵守所必需，从而解决气候变化这类集体行动问题（Bray 2013）[^bray-2013]。个人既参与立法的形成，就更可能遵守所达成的协议。劳拉·瓦伦蒂尼（2012）主张，全球民主为全球正义所必需。需要有民主机制来清理关于资源应如何分配的合理分歧。最后，米夏埃尔·聚恩同他的合作者（2012）提出，全球民主程序可以帮助国际组织获得重要的社会学合法性储备，从而避免政治化的麻烦（另见 Buchanan and Keohane 2006）[^buchanan-2006]。
    step2: |-
      另一些学者把工具性考量摆在前头。他们说，全球民主是必需的，理由关乎认识、解题、正义与合法性。约翰·德雷泽克（2000）指出，民主要让各式各样的视角都能塑造政策，作出“正确”决定的机会因此变大（另见 Landemore 2013）[^landemore-2013]。杜威实用主义一路的学者则说，全球民主是产生守规所必需：国际规则要有人遵守，气候变化这类集体行动难题才好解（Bray 2013）[^bray-2013]。个人既参与立法，就更肯遵守所议定的东西。劳拉·瓦伦蒂尼（2012）主张，全球民主为全球正义所必需：资源该怎样分配，人总有合理分歧，得有民主机制来料理。最后，米夏埃尔·聚恩与他的合作者（2012）提出，全球民主程序能替国际组织积起重要的社会学合法性储备，从而避开政治化带来的麻烦（另见 Buchanan and Keohane 2006）[^buchanan-2006]。
