      First, democracy is often understood as an essentially contested concept (Gallie 1956)[^gallie-1956]. Essential contestation does not just mean that different models have different strengths and weaknesses that require attention. Rather, it means that contestation over the meaning of democracy is inherent to the concept itself. Because models provide a holistic bundle of normative commitments and institutions, this is often thought to undercut the dynamic nature of democracy-building (Dryzek 2008)[^dryzek-2008]. Moreover, because the international system is pluralistic and complex, absolute agreement on any one model to pursue seems unlikely. Focusing on how different democratic values arise in different contexts helps to allay this concern.
    step1: |-
      第一，民主常被理解为一种本质上可争议的概念（Gallie 1956）[^gallie-1956]。本质可争议并不只是说不同模式各有长短、需要留意。它毋宁是说，关于民主含义的争议内在于这个概念本身。由于模式提供的是规范承诺与制度的一整套，人们常认为这会削弱民主建设的过程性（Dryzek 2008）[^dryzek-2008]。再者，国际体系是多元而复杂的，就追求某一模式达成绝对一致似乎不大可能。把注意力放在不同民主价值如何在不同语境中兴起，有助于缓解这一担忧。
