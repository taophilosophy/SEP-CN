      This presents two intertwined challenges and opportunities for global democrats of all stripes. On one hand, a world of globalization will cause contestation. The task here is to show that some of the contestation of globalization can trigger the democratization of IOs and limit the power of elites (as discussed above). Therein lies an opportunity to deepen democracy beyond the state. On the other, populists will likely continue presenting sovereignty and IO authority as mutually-exclusive, drumming up nationalistic support for ‘the people’ at the expense of interdependence (Moffitt 2016)[^moffitt-2016]. It is the task of normative international political theory to counteract this position as well. By showing that IOs can reinforce the ‘will of the people’ – and therefore sovereignty – an offensive position can be retained (Lafont 2016)[^lafont-2016]. It is then key to establish that global democracy is possible, the likelihood of different models/values, and reassert the desirability of democracy beyond the state both intrinsically – modelling rule of the people – and instrumentally – in securing efficient outcomes, solving collective action problems, and quelling populist attacks on democracy itself.
    step1: |-
      这对形形色色的全球民主派构成两项相互缠绕的挑战与机会。一方面，一个全球化的世界会引起争议。此处的任务是表明：对全球化的一部分争议可以触发国际组织的民主化、限制精英的权力（如上文所论）。机会就在于此，可以加深国家之外的民主。另一方面，民粹主义者很可能继续把主权与国际组织权威描绘成互不相容，以相互依存为代价煽起对“人民”的民族主义支持（Moffitt 2016）[^moffitt-2016]。规范国际政治理论的任务也在于反制这一立场。通过表明国际组织能够加固“人民意志”（因而加固主权），一种攻势立场可以保住（Lafont 2016）[^lafont-2016]。于是关键在于确立三点：全球民主是可能的；不同模式与价值的可能性如何；以及国家之外的民主在内在方面（示范人民统治）与工具方面（取得有效结果、解决集体行动问题、平息民粹对民主本身的攻击）都值得追求。
    step2: |-
      这对形形色色的全球民主派构成两项缠在一起的挑战与机会。一方面，全球化的世界免不了有争议。此处的任务是表明：对全球化的一部分争议，能触发国际组织的民主化，也能限制精英的权力（如上文所论）。机会就在这儿：可以加深国家之外的民主。另一方面，民粹主义者多半还会把主权同国际组织权威说成水火不容，拿相互依存当代价，煽起对“人民”的民族主义拥护（Moffitt 2016）[^moffitt-2016]。规范国际政治理论的任务，也在于反制这一立场。只要表明国际组织能加固“人民意志”（因而加固主权），攻势就保得住（Lafont 2016）[^lafont-2016]。于是关键在于立起三点：全球民主是可能的；不同模式与价值各有几分可能；国家之外的民主在内在方面（示范人民统治）与工具方面（取得有效结果、解决集体行动难题、平息民粹对民主自身的攻击）都值得追求。
