      Scholarship on global democracy is often charged with failing to deal with issues of power. This is particularly problematic because IR theorists have, for many years, highlighted the anarchical and power-laden nature of international politics (Morgenthau 1954)[^morgenthau-1954]. This view is especially prominent among realists and neo-realists who claim that states are the fundamental units of world politics, and that power—understood as material capabilities—is the main currency of transnational interaction. Drawing parallels with Hobbes’s state of nature, realists argue that anarchy forces each state into a situation of self-help which, in turn, creates security dilemmas as states seek to defend their sovereign borders. International institutions, when they do exist, reflect the prevailing distribution of power and the interests of dominant states. Although neo-liberal theorists (such as Robert Keohane) and constructivists (such as Alexander Wendt) have argued that cooperation between states can be attained under anarchy, these camps still agree that power politics dominates transnational affairs.
    step1: |-
      关于全球民主的研究常被指责未能处理权力问题。这尤其成问题，因为国际关系理论家多年来一直在强调国际政治的无政府性与充满权力的性质（Morgenthau 1954）[^morgenthau-1954]。这一看法在现实主义者与新现实主义者中尤为突出：他们声称国家是世界政治的基本单位，而权力——被理解为物质能力——是跨国互动的主要通货。现实主义者比照霍布斯的自然状态，论证说无政府状态迫使每个国家陷入自助处境，这又产生安全困境，因为各国力求保卫其主权边界。国际制度即便存在，也反映通行的权力分配与主导国家的利益。虽然新自由主义理论家（如罗伯特·基欧汉）与建构主义者（如亚历山大·温特）论证说，国家间合作可以在无政府状态下达成，这些阵营仍然同意，权力政治支配着跨国事务。
    step2: |-
      关于全球民主的研究常被指责不处理权力问题。这尤其扎手，因为国际关系理论家多年来一直在讲国际政治的无政府性与权力密度（Morgenthau 1954）[^morgenthau-1954]。现实主义者与新现实主义者把这说得最重：国家是世界政治的基本单位，权力（被理解为物质能力）是跨国互动的主要通货。他们比照霍布斯的自然状态，说无政府状态把每个国家推进自助处境，安全困境随之而生，因为各国都要守住主权边界。国际制度即便有，也照出通行的权力分配与主导国家的利益。新自由主义理论家（如罗伯特·基欧汉）与建构主义者（如亚历山大·温特）说国家间合作在无政府状态下也成得了；可这些阵营仍一致承认，权力政治支配着跨国事务。
