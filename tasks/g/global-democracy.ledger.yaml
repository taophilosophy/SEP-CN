    source: |-
      This entry contains five sections which elaborate upon the possibility and problems for global democracy. The first discusses how globalization impacts upon the nation-state and what this means for traditional conceptions of democracy. The notion of a global democratic deficit—in which individuals are removed from transnational decision-making in problematic ways—is introduced, and reasons to pursue global democracy are fleshed out. The second section outlines some prominent normative proposals for global democracy. Specifically, five ‘models of global democracy’ are presented, and some general criticisms are formulated. The third section then highlights a turn toward pursuing ‘values of democratization’. This direction for the literature has both methodological and substantive implications. The fourth section canvasses the emergent literature dedicated to assessing the plausibility of global democracy as an empirical project. The final section highlights persistent criticisms that should be addressed in future research on global democracy.
    step1: |-
      本词条包含五个部分，展开全球民主的可能性与问题。第一部分讨论全球化如何影响民族国家，以及这对传统民主观念意味着什么。文中引入“全球民主赤字”这一概念，指个人以有问题的方式被排除在跨国决策之外，并阐明追求全球民主的种种理由。第二部分概述一些重要的规范性方案，具体呈现五种“全球民主模式”，并提出若干一般性批评。第三部分转向“民主化的价值”这一方向，这一文献走向既有方法论含义，也有实质含义。第四部分梳理评估全球民主作为经验项目之可信度的新兴文献。最后一部分指出未来全球民主研究中应当处理的持久批评。
    step2: |-
      本词条分五部分，展开全球民主的可能与难题。第一部分谈全球化怎样冲击民族国家，这对传统民主观又意味着什么。这里引出“全球民主赤字”这个概念：个人被以有问题的办法挡在跨国决策之外；也把追求全球民主的理由讲清楚。第二部分概述若干重要的规范性方案，具体摆出五种“全球民主模式”，并给出一些一般性的批评。第三部分指出文献转向“民主化的价值”，这一转向既有方法论上的含义，也有实质含义。第四部分梳理一批新兴文献，它们评估全球民主作为经验项目的可信程度。最后一部分点出未来研究必须处理的持久批评。
