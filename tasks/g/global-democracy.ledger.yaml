      A world government has also been seen as a potential response to the global democratic deficit. Scholarship on world government has a long history in academia and social commentary: Hugo Grotius, Jeremy Bentham and Abbé de Saint-Pierre in the former camp; Albert Einstein, HG Wells, and Martin Luther King in the latter. Recently, the concept has seen a revival in the work of Luis Cabrera (2004), Andrew Kuper (2004), and Jürgen Habermas (2006). World government proposals are justified in terms of both intrinsic and instrumental concerns. On the intrinsic side, world government advocates take a cosmopolitan stance and demand equal respect for all individuals. As such, individuals should have equal say in how transnational rules are formed to reduce the global democratic deficit. This intrinsic claim is often coupled with justice-based arguments concerning a fairer distribution of resources (Marchetti 2008)[^marchetti-2008]. On the instrumental side, those such as Tännsjö (2008) contend that a world government is necessary to overcome global problems such as war and ecological disaster.
    step1: |-
      世界政府也被看作应对全球民主赤字的一种可能回应。关于世界政府的学术研究在学界与社会评论中有长久历史：前者一脉有胡果·格劳秀斯、杰里米·边沁与圣皮埃尔修道院长；后者一脉有阿尔伯特·爱因斯坦、H. G. 威尔斯与马丁·路德·金。近来，这一概念在路易斯·卡布雷拉（2004）、安德鲁·库珀（2004）与于尔根·哈贝马斯（2006）的著作中复兴。世界政府的方案既以内在关切、也以工具关切来证成。在内在方面，世界政府的倡导者取世界主义立场，要求对一切个人给予平等尊重。因此，个人在跨国规则如何形成上应有平等发言权，以减少全球民主赤字。这一内在主张常与关于资源更公平分配的正义论证相伴（Marchetti 2008）[^marchetti-2008]。在工具方面，滕舍（2008）等人主张，世界政府为克服战争与生态灾难这类全球问题所必需。
