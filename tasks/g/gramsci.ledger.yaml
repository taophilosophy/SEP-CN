    source: |-
      Turin contrasted radically with Gramsci’s southern upbringing: it was an advanced industrial city, dominated by the FIAT car factories and connected to wider European cultures. For some years, Gramsci endured the precarious existence of an impoverished student; his education was frequently interrupted by poverty, nervous exhaustion, and ill-health. At university he studied philology, or linguistics, and worked under the guidance of the socio-linguist Professor Matteo Bartoli, who was drawn to Gramsci’s native familiarity with Sardinian dialect (see Ives 2004)[^ives-2004]. Bartoli envisaged Gramsci becoming a linguist. Studying in the Humanities, Gramsci’s own ambitions were, originally, to train as a teacher. At university, he contributed to reviews with articles on Futurism (SCW: 46–49).
    step1: |-
      都灵与葛兰西南方成长的环境形成鲜明对照：这是一座先进的工业城市，为 FIAT 汽车工厂所主导，与更广大的欧洲文化相连。有好几年，葛兰西忍受着穷学生的朝不保夕的生活；他的学业经常因贫穷、神经衰弱和疾病而中断。在大学里他学习语文学（或语言学），在社会语言学家马泰奥·巴尔托利教授的指导下工作，后者为葛兰西对撒丁方言的本土熟悉所吸引（见 Ives 2004）[^ives-2004]。巴尔托利设想葛兰西成为语言学家。就读人文学科，葛兰西本人的志向，起初是做一名教师。在大学里，他为一些评论刊物撰稿，写过关于未来主义的文章（SCW: 46–49）。
    step2: |-
      都灵与葛兰西的南方成长背景判然有别：这是一座先进工业城市，FIAT 汽车工厂雄踞其间，又与更广的欧洲文化相连。有好几年，葛兰西过的是穷学生的朝不保夕的日子；贫病交加、神经衰弱，学业屡屡中断。大学里他攻读语文学（即语言学），师从社会语言学家马泰奥·巴尔托利教授；巴尔托利正是看中他对撒丁方言的乡土熟稔（见 Ives 2004）[^ives-2004]。巴尔托利指望葛兰西成为语言学家；而就读人文学科的葛兰西，最初的志向不过是做一名教师。大学期间，他为若干评论刊物撰稿，写过论未来主义的文章（SCW: 46–49）。
  - id: 10
    kind: body
