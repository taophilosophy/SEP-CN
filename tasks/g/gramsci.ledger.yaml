      ### 2.1 Cultural Socialism
    step1: TBD
    step2: TBD
  - id: 39
    kind: body
    source: |-
      Gramsci’s early writing was informed by the influential critical framework of the neo-Hegelian philosopher Benedetto Croce. Croce had denounced scientific positivism—prevalent among social scientists and European Marxists—for its abstract, ahistorical reasoning and emphasis on material “causes” in social change. Positivism neglected the historically particular and practically creative dimension of “spirit” (or consciousness) which, beyond any political program, motivated all social and cultural transformation. Croce invited a view of Italy’s political failings as the absence of a robust, unifying culture—a secular civic faith—rather than economic underdevelopment as such (see Croce 1914)[^croce-1914]. He inspired numerous “aesthetic” critics of the liberal state to understand socio-political improvement as inseparable from free artistic self-creation, the assertion of moral will, and the cultivation of a shared “inner” sensibility.
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      Gramsci admitted later to having been “tendentially somewhat Crocean” in his early writing (FSPN: 355). For example, he endorsed the acquisition by workers of a “faith” based on intellectual self-discipline and independence of thought, severely castigating any tendency to passive “indifference” (SPWI: 17–18). Echoing Sorel, whose writings Croce had championed, he presented socialism not as the outcome of historical “laws” but as “an integral vision of life”, the adoption of an invigorating, moral consciousness to supplant the failed bourgeois order (SCW: 22). In 1917 he welcomed the Russian Revolution as the “revolution against Capital”, viewing it not as proof of Marx’s economic theories but as evidence of the practical force of a collective will (SPWI: 34–7). Later, in 1918, Gramsci offered his own idealist version of Marx, imagined as “a master of moral and spiritual life” teaching the proletariat to become consciously aware of “its power and mission” in history (PPW: 57, 56).
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      This somewhat ascetic, pedagogic humanism distinguished the young Gramsci from other socialists who appealed to historical progress or invested in the slow, practical advance of trade unionism and application of scientific reason. Gramsci regarded such appeals as rooted in an elitist attitude aimed at bringing reform to the masses from on-high. Instead, he endorsed a grass-roots self-organization that underscored the integrity and moral autonomy of a uniquely proletarian worldview. This placed him closer to other radical critics of the PSI, such as anarchists and syndicalists who also looked to a libertarian politics “from below” (see Levy 1999)[^levy-1999].
    step1: TBD
    step2: TBD
