      然而，他声称，克罗齐在其历史写作中也抹去了阶级冲突，只强调自由主义霸权的时期——历史的同意性、伦理面，而不提迎来资产阶级社会的暴力或政治斗争，例如法国大革命（SPN: 119；另见 GPL: 213–14, 215–16）。相比之下，实践哲学将建立在克罗齐洞见的基础上，转而聚焦于“伦理—政治”历史——辩证地把一种新文化带入存在的社会经济分化——而不带他那偏颇的自由主义粉饰。它将有力地批判既有的常识信念、哲学与等级制，因为这些阻碍了普通人的前进（SPN: 330–31）。葛兰西把实践哲学描述为“绝对的历史主义，思想之绝对的世俗化与尘世化”（SPN: 465）。
