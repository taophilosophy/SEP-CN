      After the war Gramsci joined with university and socialist friends to found and edit a new review, *L’Ordine Nuovo* (“The New Order”). Intended, initially, as a journal of “socialist culture” it became a medium to discuss the industrial factory struggles then underway in Turin. In *Ordine Nuovo*, Gramsci presented a theory of a workers’ state inspired by the efforts at self-management by skilled workers (see SPWI: 65–124). Spurred on by the workers’ disputes and factory occupations across the years 1919 and 1920, he published writings by syndicalist thinkers, participated in debates, and set out his own views on the potential for the factories to become the locus of proletarian state institutions (see Clark 1977)[^clark-1977].
    step1: |-
      战后，葛兰西与大学和社会党的朋友一道创办并主编了一份新评论《新秩序》（“The New Order”）。起初它定位为“社会主义文化”刊物，后来成为讨论都灵当时进行中的工厂斗争的媒介。在《新秩序》上，葛兰西提出了一种工人国家理论，其灵感来自熟练工人自我管理的努力（见 SPWI: 65–124）。在 1919 与 1920 两年的工人争议与工厂占领的推动下，他刊发工团主义思想家的文字，参与论战，并阐述自己的看法：工厂有可能成为无产阶级国家制度的所在地（见 Clark 1977）[^clark-1977]。
    step2: |-
