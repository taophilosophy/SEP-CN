      This hybrid of classically “Leninist” and mass-based models of the party reflected Gramsci’s concern to steer a course between sectarian closure and reformist, representational politics. Gramsci was not optimistic that ordinary members could participate effectively without strong direction from a disciplined cadre, however much he thought revolution would eventually overcome the separation of leaders and led (SPN: 144). Hegemonic strategy inevitably meant creating a new leading elite (SPN: 340) whose superior philosophy would “in the masses as such, […] only be experienced as a faith” (SPN: 339). Although some see in Gramsci’s politics the basis of a radically democratic politics (Sassoon 1987), his was not a particularly liberal conception (see Femia 1981: 172–85)[^femia-1981].
    step1: |-
      这种经典“列宁主义”政党模式与群众性政党模式的混合，反映了葛兰西的关切：在宗派封闭与改良主义的代议政治之间把稳航向。然而，葛兰西并不乐观地认为，普通党员若非有纪律干部的有力指引，也能有效参与；尽管他相信革命终将克服领导者与被领导者之间的分离（SPN: 144）。霸权战略不可避免地意味着创造一个新的领导精英（SPN: 340），其优越的哲学“在群众本身那里〔……〕只能作为信仰被经验到”（SPN: 339）。尽管有人从葛兰西的政治中看到一种激进民主政治的基础（Sassoon 1987），他的构想却并不特别自由主义（见 Femia 1981: 172–85）[^femia-1981]。
    step2: |-
      这种把经典“列宁主义”与群众性政党两套模式糅合起来的做法，正显出葛兰西的用心：在宗派自闭与改良主义的代议政治之间把稳航向。他并不乐观地以为，没有纪律严明的干部强力引导，普通党员也能有效参与；尽管他相信革命终将消弭领导者与被领导者之分（SPN: 144）。霸权战略注定要造就一个新的领导精英（SPN: 340），其优越哲学“在群众本身那里〔……〕只能被体验为一种信仰”（SPN: 339）。有人从葛兰西的政治中看出激进民主政治的根基（Sassoon 1987），但他的构想并不特别自由主义（见 Femia 1981: 172–85）[^femia-1981]。
