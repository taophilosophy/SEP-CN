      因此，国家是一种既含强力又含同意的复杂结构：它既是统治阶级维持其对社会之支配的工具，**又是** 它借以进行“文明化活动”的媒介，作为一个“伦理国家”或“教育者”为其公民提倡“某种生活方式”而发挥作用（SPN: 247；另见 SPN: 12）。葛兰西一度将其表述为“国家 = 政治社会 + 市民社会（换言之，以强制之甲胄保护的霸权）”，或者他所称的国家之“整体”观念。
