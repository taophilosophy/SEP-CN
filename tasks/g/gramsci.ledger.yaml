      The prospect of world war deeply split the Italian public and political parties into “interventionists” and “neutralists”. The firebrand revolutionary socialist, Benito Mussolini, came out for intervention against the PSI’s official neutrality. Entering the war, he hoped, would initiate a wider collapse of the liberal order and ignite social revolution. Mussolini was eventually forced out of the party. The young Gramsci was also tempted by that stance and declared his preference not for intervention but for an “active neutrality” that took the war as a moment to prepare for radical transformation (SPWI: 6–9). For this milder resistance to the party’s formal position, he was thereafter treated with some suspicion by fellow socialists.
    step1: |-
      世界大战的前景使意大利公众与各政党深刻分裂为“干预派”与“中立派”。狂热的革命社会主义者贝尼托·墨索里尼主张干预，反对意大利社会党的官方中立立场。他期望参战能引发自由主义秩序的更大崩溃并点燃社会革命。墨索里尼最终被逐出该党。年轻的葛兰西也曾被这一立场吸引，并宣称自己不主张干预，而主张一种“积极中立”：把战争当作准备激进变革的时机（SPWI: 6–9）。由于这种对党的正式立场较为温和的抵制，他此后受到同志们的某些猜疑。
    step2: |-
      世界大战的前景把意大利公众与各政党深刻分裂为“干预派”与“中立派”。激进革命社会主义者贝尼托·墨索里尼主张干预，反对意大利社会党的官方中立。他指望参战引发自由主义秩序的更大崩溃、点燃社会革命；墨索里尼最终被逐出党。年轻的葛兰西也曾被这一立场吸引，但宣称自己不主张干预，而主张一种“积极中立”：把战争当作准备激进变革的时机（SPWI: 6–9）。由于这种较温和的异议，他此后受到同志们的猜疑。
  - id: 12
    kind: body
    source: |-
      Inspired by the Russian Revolutions of February and October 1917, Gramsci aligned himself with the “intransigent revolutionary” faction in the PSI, urging it to pursue its “maximalist” program of radical transformation. He became secretary of the executive committee of the Turin socialists and, in the same year, took up the role of editor of *Il Grido del Popolo*. In December 1917 he published “The Revolution Against *Capital*” in *Avanti!*, and used *Il Grido* to publicize news and commentary on events in Russia, including texts by Lenin and Trotsky (SPWI: 34–7). He made various efforts to organize a local proletarian cultural association to galvanize political and economic struggles into a general revolutionary project, although they did not take off.
    step1: |-
      受 1917 年二月与十月俄国革命的鼓舞，葛兰西站到意大利社会党内“不妥协革命派”一边，敦促该派推行其激进变革的“最大限度纲领”。他成为都灵社会党人执行委员会的书记，同年出任《人民之声》主编。1917 年 12 月，他在《前进报！》发表《反对〈资本论〉的革命》，并用《人民之声》宣传俄国事件的消息与评论，包括列宁与托洛茨基的文本（SPWI: 34–7）。他多次尝试组织一个地方无产阶级文化协会，以把政治与经济斗争凝聚为一场总体革命工程，但都没有成功。
    step2: |-
      受 1917 年二月革命与十月革命的鼓舞，葛兰西站到意大利社会党“不妥协革命派”一边，敦促推行其激进变革的“最大限度纲领”。他出任都灵社会党人执行委员会书记，同年接掌《人民之声》主编。1917 年 12 月，他在《前进报！》发表《反对〈资本论〉的革命》，并借《人民之声》报道与评论俄国时局，包括列宁与托洛茨基的文本（SPWI: 34–7）。他多次尝试组织地方无产阶级文化协会，想把政治与经济斗争凝成一场总体革命工程，但都未能成事。
  - id: 13
    kind: body
    source: |-
      After the war Gramsci joined with university and socialist friends to found and edit a new review, *L’Ordine Nuovo* (“The New Order”). Intended, initially, as a journal of “socialist culture” it became a medium to discuss the industrial factory struggles then underway in Turin. In *Ordine Nuovo*, Gramsci presented a theory of a workers’ state inspired by the efforts at self-management by skilled workers (see SPWI: 65–124). Spurred on by the workers’ disputes and factory occupations across the years 1919 and 1920, he published writings by syndicalist thinkers, participated in debates, and set out his own views on the potential for the factories to become the locus of proletarian state institutions (see Clark 1977)[^clark-1977].
    step1: |-
