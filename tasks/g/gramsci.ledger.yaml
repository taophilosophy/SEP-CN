    source: |-
      The concept often regarded as the locus of innovation in the *Notebooks*—and hence their philosophical linchpin—is “hegemony” (*egemonia*), signifying both leadership and domination.
    step1: |-
      《札记》中常被视为创新所在的观念——因而也是其哲学枢纽——是“霸权”（*egemonia*），兼指领导权与统治。
    step2: |-
      《札记》中被视作创新枢纽、因而是其哲学关捩的概念，是“霸权”（*egemonia*）——它兼含领导与统治两义。
  - id: 63
    kind: body
    source: |-
      Hegemony had been a common term in debates among Russian Marxists and usually described the leading (or “hegemonic”) role of the working class over its allies in a political coalition. But it had also been employed by Italian political thinkers in the nineteenth century to imagine gradually building consent across the nation for the new state—“making Italians”—rather than relying exclusively on the exercise of force. Gramsci fused these meanings to present hegemony as the general hypothesis that a social class aims to achieve consensual domination for its rule by progressively expanding its leadership across society (see Femia 1981)[^femia-1981].
    step1: |-
      霸权在俄国马克思主义者的论争中曾是一个常用术语，通常描述工人阶级在政治联盟中对盟友的领导（或“霸权”）角色。但它也曾被 19 世纪意大利政治思想家使用，以设想逐步为新的国家在全国范围内建立同意——“造就意大利人”——而不是仅仅依赖强制。葛兰西融合了这些含义，把霸权呈现为这样的普遍假设：一个社会阶级旨在通过逐步扩展其在整个社会中的领导权，为其统治赢得基于同意的支配（见 Femia 1981）[^femia-1981]。
    step2: |-
      霸权一词，俄国马克思主义者在论辩中常用，通常指工人阶级在政治联盟中对盟友的领导（“霸权”）角色。但 19 世纪意大利政治思想家也用过它，设想逐步在全国为新国家赢得同意——“造就意大利人”——而不单靠强制。葛兰西把这两层意思熔于一炉，把霸权提为一条普遍假设：某一社会阶级力求逐步把领导权扩展到全社会，从而为其统治取得基于同意的支配（见 Femia 1981）[^femia-1981]。
  - id: 64
    kind: body
    source: |-
      This idea—with its potential for variation in empirical focus and application—was developed across different notes and topics, sometimes as a methodological device to analyze historical situations, at other times alongside different concepts to make strategic observations. But it also functioned more broadly as a philosophical horizon highlighting the inseparability of thought and action, signaling that all intellectual enquiries were unavoidably implicated in the formation of an integral “way of life”. Focusing on hegemony permits us to appreciate the *Notebooks* as a unified intellectual project, despite their disparate themes and contrasting accents.
    step1: |-
      这一观念——其经验焦点与应用可以有所变化——在不同的笔记与主题中得到发展，有时作为分析历史情境的方法论工具，有时与其他概念并列以作战略观察。但它还在更广的意义上充当一种哲学视野，凸显思想与行动不可分离，表明一切智识探究都不可避免地卷入一种完整的“生活方式”的形成。聚焦于霸权，使我们能够把《札记》理解为一个统一的智识事业，尽管其主题分散、侧重各异。
    step2: |-
      这一观念在经验焦点与应用上容许变化，散布于不同笔记与题目中：有时充当分析历史情境的方法论工具，有时与别的概念并用，以作战略判断。但它更在宽泛意义上起着哲学视野的作用，凸显思想与行动不可分，昭示一切智识探究都不可避免地牵涉一种整全“生活方式”的塑造。唯其着眼于霸权，我们才能把《札记》读成一个统一的智识工程，尽管它题目杂陈、侧重不一。
