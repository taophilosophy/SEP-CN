      Common sense—popular attitudes and beliefs, frequently accepted as “eternal” truths by ordinary people—denoted, for Gramsci, a largely uncritical and “fragmentary” mode of consciousness (SPN: 419). Consisting of superstitions and forms of “folklore” concerning the nature of reality and ethical conduct, common sense was a “philosophy of the popular masses”, often born from religion, that differentiated “simple” folk from educated intellectuals. Its danger was that it tended to invite resignation and passivity rather than collective action. That was a problem for what Gramsci referred to as “subaltern” groups—marginalized and subordinate classes such as the peasantry and the proletariat—who, despite periodic rebellions, never adequately challenge dominant classes (see Green 2002)[^green-2002]. Yet, common sense thinking often had a “healthy nucleus” in “good sense”, that is, in the practical and realistic attitudes that could be made “more coherent and unitary” (SPN: 328) if joined to a systematic and critical conception of the world. It was necessary not to dismiss common sense thinking (nor the struggles of subaltern groups) but to critically engage the “contradictory consciousness” of ordinary people (SPN: 326)—that is, the tendency to hold beliefs contradicted by actual conduct—and educate it.
    step1: |-
      常识——常被普通人当作“永恒”真理接受的流行态度与信念——对葛兰西而言指一种大体上不加批判的、“断片式的”意识方式（SPN: 419）。常识由关于实在之本性与伦理行为的迷信与“民俗”形式构成，是一种“民众大众的哲学”，常生于宗教，把“淳朴”民众与受过教育的知识分子区分开来。其危险在于，它往往招致顺从与消极，而非集体行动。这对葛兰西所谓“从属”群体——如农民与无产阶级这样的边缘化、被支配阶级——是一个问题：它们虽有周期性反抗，却从未充分挑战统治阶级（见 Green 2002）[^green-2002]。然而，常识思维往往在“健全理智”中有一个“健康的核”，即那些实际的、现实的态度；若与一种系统的、批判的世界观相结合，它们就可以被“变得更为连贯和统一”（SPN: 328）。必须不轻视常识思维（也不轻视从属群体的斗争），而是批判地介入普通人“矛盾的意识”（SPN: 326）——即持有与实际行为相矛盾的信念的倾向——并教育它。
    step2: |-
      常识——普通人常当作“永恒”真理接受的流行态度与信念——在葛兰西这里指一种大体不加批判的、“断片式”的意识方式（SPN: 419）。它由关于实在本性与伦理行为的迷信与“民俗”构成，是一种“民众大众的哲学”，常生于宗教，把“淳朴”百姓与受过教育的知识分子区分开来。其危险在于：它往往招致顺从与消极，而非集体行动。这对葛兰西所谓“从属”群体——农民、无产阶级等边缘化、受支配的阶级——是个问题：它们虽有周期性反抗，却从未充分挑战统治阶级（见 Green 2002）[^green-2002]。不过，常识思维往往在“健全理智”中有一个“健康的核”——那些实际、现实的态度；若与系统的、批判的世界观结合，就能被“变得更为连贯和统一”（SPN: 328）。因此不可轻视常识思维（也不可轻视从属群体的斗争），而应批判地介入普通人“矛盾的意识”（SPN: 326）——即信念与实际行为相抵触的倾向——并加以教育。
