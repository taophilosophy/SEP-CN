      ### 2.2 The Factory State
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      The first original initiative for which Gramsci became known was his theory of factory-based democracy, which he promoted during the so-called *biennio rosso*—or “two red years”—of 1919–1920.
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      Inspired by the industrial unrest and factory occupations in Turin and beyond, as well as by the new “soviets” in Russia, Gramsci published in *Ordine Nuovo* various opinions and resources on the topic of a nascent workers’ state (see SPWI: 65–124). His contributions took his earlier humanism in a more concrete, practical direction. Efforts by workers to wrest the management of production from industrialists—in part via “factory councils”, formerly grievance committees—instantiated, for him, an initiative rooted in actual history, where a new moral community was “spontaneously” expressing its own independent identity beyond the limits of trade unionism. Focused on the practical planning and control of material production, he claimed, the occupying workers were not responding passively to abstract historical laws or to the directions of their leaders but, rather, acting as agents of their own self-creation.
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      Gramsci sketched a model of industrial democracy in which a new type of state, based inside the factories, would replace the discredited parliamentary regime. Free trade capitalism was exhausted, and trade union organization had now reached its limit, he argued. Emerging organically inside the factories were
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      > institutions which will replace the person of the capitalist in his administrative functions and his industrial power, and so achieve the autonomy of the producer in the factory. (SPWI: 77)
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      Rather than administer over isolated citizens by separating public authority from everyday life—as under liberalism—the factory instantiated a new type of polity formed around the collective material needs of production (see Schecter 1991)[^schecter-1991]. Gramsci envisaged a participatory system of factory councils functioning in a hierarchical democratic system through which workers would relay and manage the practical needs of national life. Authority would be reconciled to liberty, not opposed to it, as under liberalism. The atomistic individual would give way to the “producer”, an individual already psychologically and organizationally oriented to the collective through its role in the labor process (SPWI: 110–11).
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      Gramsci envisaged a system in which a communal identity had priority over individual initiative. His was an “organic” model of state in which all parts related to the primary needs of the whole. This was a potentially illiberal system that assumed substantive moral agreement among workers (see Sbarberi 1986)[^sbarberi-1986]. Some see here the influence of the neo-idealist (and soon fascist) philosopher, Giovanni Gentile. His radical philosophy of “actualism”—in which the subject’s inner conscience creates its own unified world and community—supported the idea of the “ethical state” (*stato etico*) in which public authority and individual freedom, coercion and consent, were essentially indistinguishable (Gentile 1919; see also Schecter 1990)[^gentile-1919][^schecter-1990]. Such anti-liberal sentiments were common in the wake of the war and chimed with widespread public disenchantment with elite-led parliamentary politics.
    step1: TBD
    step2: TBD
