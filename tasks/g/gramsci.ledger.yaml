      Life in prison was not easy. Gramsci’s health continued to deteriorate—he was badly neglected by the prison authorities—and he suffered psychologically from his isolation. Yet was he not entirely cut off from events outside. He received visits from Tatiana and from his brothers, who (in addition to servicing his study needs and advocating on his behalf for medical treatment) passed on news concerning the PCd’I and the Russian leadership. So, at least initially, he was not wholly unaware of changing policies and strategic decisions. The Comintern’s switch in policy from 1928—the so-called “Third Period”: abandoning the united front tactic in favor of class insurrection, on the assumption that a crisis in capitalism was imminent, denouncing potential socialist and social democratic parties as “social fascists”—contrasted with Gramsci’s position supporting alliances. Gramsci’s criticism of this new policy brought ostracism from other communist prisoners (Spriano 1977 [1979: 70–1])[^spriano-1977].
    step1: |-
      狱中生活并不容易。葛兰西健康持续恶化——他受到监狱当局的严重忽视——并因隔离而在心理上备受折磨。然而他并未与外界完全隔绝。塔季扬娜与他的兄弟们前来探视；他们（除满足其学习需要并为其争取治疗外）还传递有关意大利共产党与俄国领导层的消息。所以至少在最初，他对变化中的政策与战略决定并非一无所知。共产国际 1928 年起的政策转向——所谓“第三时期”：放弃统一战线策略而转向阶级起义，认定资本主义危机迫在眉睫，并把潜在的社会主义与社会民主党斥为“社会法西斯主义者”——与葛兰西支持联盟的立场形成对照。葛兰西对新政策的批评使他遭到其他共产主义囚徒的排斥（Spriano 1977 [1979: 70–1]）[^spriano-1977]。
    step2: |-
      狱中生活并不轻松。葛兰西的健康持续恶化——监狱当局对他疏于照料——隔离也在心理上折磨他。但他并未与外界完全隔绝：塔季扬娜与他的兄弟们前来探视，他们（除满足其学习需要、为其争取医疗外）还传递意大利共产党与俄国领导层的消息。所以至少在起初，他对政策与战略的变动并非一无所知。共产国际自 1928 年起的政策转向——所谓“第三时期”：认定资本主义危机迫近，弃统一战线而取阶级起义，并把潜在的社会主义党与社会民主党斥为“社会法西斯”——与葛兰西支持联盟的立场相悖。他对新政策的批评招致其他共产主义囚徒的排斥（Spriano 1977 [1979: 70–1]）[^spriano-1977]。
