      The concept often regarded as the locus of innovation in the *Notebooks*—and hence their philosophical linchpin—is “hegemony” (*egemonia*), signifying both leadership and domination.
    step1: |-
      《札记》中常被视为创新所在——因而也是其哲学枢纽——的概念是“霸权”（*egemonia*），它既指领导，也指支配。
    step2: |-
      《札记》中常被视为创新所在、因而也是其哲学枢纽的概念是“霸权”（*egemonia*），兼指领导与支配。
  - id: 63
    kind: body
    source: |-
      Hegemony had been a common term in debates among Russian Marxists and usually described the leading (or “hegemonic”) role of the working class over its allies in a political coalition. But it had also been employed by Italian political thinkers in the nineteenth century to imagine gradually building consent across the nation for the new state—“making Italians”—rather than relying exclusively on the exercise of force. Gramsci fused these meanings to present hegemony as the general hypothesis that a social class aims to achieve consensual domination for its rule by progressively expanding its leadership across society (see Femia 1981)[^femia-1981].
    step1: |-
      霸权在俄国马克思主义者的辩论中曾是一个常用词，通常描述工人阶级在政治联盟中对其盟友的领导（或“霸权”）角色。但十九世纪意大利政治思想家也曾用它来设想在全国逐步为新国家建立同意——“造就意大利人”——而不是单纯依靠强制的行使。葛兰西融合了这两种含义，把霸权呈现为如下一般假设：一个社会阶级通过逐步扩展其在社会中的领导，力求为其统治赢得共识性支配（见 Femia 1981）[^femia-1981]。
    step2: |-
      “霸权”在俄国马克思主义者的论辩中曾是常用词，通常指工人阶级在政治联盟中对其盟友的领导（“霸权”）角色。但十九世纪意大利政治思想家也曾用它设想在全国逐步为新国家积累同意——“造就意大利人”——而非单纯依靠强制。葛兰西把两种含义熔为一炉，把霸权呈现为如下一般假设：一个社会阶级通过逐步扩展其社会领导，力求为自己的统治赢得共识性支配（见 Femia 1981）[^femia-1981]。
  - id: 64
