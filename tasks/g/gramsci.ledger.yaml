      Rather than administer over isolated citizens by separating public authority from everyday life—as under liberalism—the factory instantiated a new type of polity formed around the collective material needs of production (see Schecter 1991)[^schecter-1991]. Gramsci envisaged a participatory system of factory councils functioning in a hierarchical democratic system through which workers would relay and manage the practical needs of national life. Authority would be reconciled to liberty, not opposed to it, as under liberalism. The atomistic individual would give way to the “producer”, an individual already psychologically and organizationally oriented to the collective through its role in the labor process (SPWI: 110–11).
    step1: |-
