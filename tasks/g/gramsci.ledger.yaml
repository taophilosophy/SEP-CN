      1922 年 6 月，葛兰西作为意大利共产党驻共产国际执行委员会（即“共产国际”）代表被派往俄国，出席其莫斯科会议。近几年的狂热活动令他精疲力竭，不久他便住进疗养院恢复健康。在此期间，他遇到了尤利娅·舒赫特；次年她成为他的妻子，后来又成为他两个儿子的母亲。
