      Understanding variations in the exercise of hegemony required a political analysis attuned to the “equilibrium” of force and consent at any conjuncture. In place of the common Marxist division of economic “structure” and “superstructure”, Gramsci proposed the concept of a “historical bloc” (*blocco storico*). This was a composite of distinct class and social forces joined politically and culturally under a specific form of hegemony (SPN: 137). Additionally, it was possible to gauge the extent to which a class had sacrificed its “economic corporate” interests in expanding its leadership across civil society (SPN: 161). Empirical analysis of hegemony would assess the “relations of forces” that combined structures and superstructures in a historical situation (SPN: 181–85; for a discussion, see Bellamy & Schecter 1993: ch. 6)[^bellamy-1993].
    step1: |-
      要理解霸权行使的种种变化，需要一种对任何时点强制与同意之“均势”保持敏感的政治分析。葛兰西以“历史集团”（*blocco storico*）概念取代马克思主义常见的经济“结构”与“上层建筑”二分。历史集团是在特定霸权形式下于政治上、文化上结合起来的各种阶级与社会力量的复合体（SPN: 137）。此外，还可以衡量一个阶级在扩展其在市民社会中的领导时牺牲了多少“经济-社团”利益（SPN: 161）。对霸权的经验分析将评估在某一历史情境中把结构与上层建筑结合起来“力量关系”（SPN: 181–85；讨论见 Bellamy & Schecter 1993: ch. 6）[^bellamy-1993]。
