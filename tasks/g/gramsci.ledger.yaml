      Turin contrasted radically with Gramsci’s southern upbringing: it was an advanced industrial city, dominated by the FIAT car factories and connected to wider European cultures. For some years, Gramsci endured the precarious existence of an impoverished student; his education was frequently interrupted by poverty, nervous exhaustion, and ill-health. At university he studied philology, or linguistics, and worked under the guidance of the socio-linguist Professor Matteo Bartoli, who was drawn to Gramsci’s native familiarity with Sardinian dialect (see Ives 2004)[^ives-2004]. Bartoli envisaged Gramsci becoming a linguist. Studying in the Humanities, Gramsci’s own ambitions were, originally, to train as a teacher. At university, he contributed to reviews with articles on Futurism (SCW: 46–49).
    step1: |-
      都灵与葛兰西南方成长的环境形成鲜明对照：这是一座先进的工业城市，为 FIAT 汽车工厂所主导，与更广大的欧洲文化相连。有好几年，葛兰西忍受着穷学生的朝不保夕的生活；他的学业经常因贫穷、神经衰弱和疾病而中断。在大学里他学习语文学（或语言学），在社会语言学家马泰奥·巴尔托利教授的指导下工作，后者为葛兰西对撒丁方言的本土熟悉所吸引（见 Ives 2004）[^ives-2004]。巴尔托利设想葛兰西成为语言学家。就读人文学科，葛兰西本人的志向，起初是做一名教师。在大学里，他为一些评论刊物撰稿，写过关于未来主义的文章（SCW: 46–49）。
    step2: |-
      都灵与葛兰西的南方成长背景判然有别：这是一座先进工业城市，FIAT 汽车工厂雄踞其间，又与更广的欧洲文化相连。有好几年，葛兰西都过着穷学生朝不保夕的日子；贫病交加、神经衰弱，学业屡屡中断。大学里他攻读语文学（即语言学），师从社会语言学家马泰奥·巴尔托利教授；巴尔托利正是看中他对撒丁方言的乡土熟稔（见 Ives 2004）[^ives-2004]。巴尔托利指望葛兰西成为语言学家；而就读人文学科的葛兰西，最初的志向不过是做一名教师。大学期间，他为若干评论刊物撰稿，写过论未来主义的文章（SCW: 46–49）。
  - id: 10
    kind: body
    source: |-
      Gramsci did not formally complete his university studies. He abandoned education in 1915 and became a full-time journalist and socialist activist. Joining the Italian Socialist Party (*Partito socialista italiano*, or PSI) in 1913, he became involved in worker’s education. Two years later, he was offered a position as a journalist for the Turin edition of the PSI daily newspaper, *Avanti!* Already a contributor to the weekly *Il Grido del Popolo* (“The People’s Cry”), he accepted the offer and began writing political commentaries and theatre reviews under a regular column, titled “Sotto la Mole” (“In the shadow of the Mole Antoniella”, a landmark in Turin, designed originally as a synagogue, near to where Gramsci lodged). In 1917, he co-published a single issue socialist cultural review, aimed at young socialists, entitled *La Città futura* (“City of the Future”).
    step1: |-
      葛兰西没有正式完成大学学业。1915 年他弃学成为全职新闻记者和社会主义活动家。他于 1913 年加入意大利社会党（*Partito socialista italiano*，简称 PSI），参与工人教育工作。两年后，他获聘为社会党机关报《前进报》都灵版的记者。此前他已为周刊《人民的呼声》撰稿，此时他接受了聘请，开始以固定专栏“Sotto la Mole”（“在莫莱·安东内利纳塔的阴影下”——都灵的一处地标，原设计为犹太会堂，距葛兰西的住处不远）撰写政治评论和戏剧评论。1917 年，他与人合办了一份面向青年社会主义者的社会主义文化评论，单出一期，题为《未来之城》（“City of the Future”）。
    step2: |-
      葛兰西最终没有正式读完大学。1915 年他弃学而去，做了全职新闻记者和社会主义活动家。1913 年他加入意大利社会党（*Partito socialista italiano*，简称 PSI），投身工人教育。两年后，《前进报》都灵版聘他为记者。他此前已为周刊《人民的呼声》供稿，此刻应聘上任，在固定专栏“Sotto la Mole”下写政治评论与剧评。“Sotto la Mole”意谓“在莫莱·安东内利纳塔的阴影下”——那座塔是都灵地标，原设计作犹太会堂，离葛兰西住处不远。1917 年，他与人合办一份面向青年社会主义者的社会主义文化评论，单出一期，题为《未来之城》。
