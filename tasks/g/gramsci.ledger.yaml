      为候审，葛兰西从罗马经那不勒斯与西西里被转到乌斯蒂卡岛，与包括博尔迪加在内的其他共产主义者一同关在一所私宅。1927 年 1 月他被押往米兰，遭隔离监禁并受审讯。他获准收书、每周写两封信，在给妻妹塔季扬娜·舒赫特的信中列出了若干写作构想；塔季扬娜在葛兰西服刑期间留守意大利，成为其重要支持来源。他说想写一些“从‘无利害’立场出发、*für ewig*（‘为永恒’——借歌德之语）”的东西（GPL: 45）。都灵老友皮耶罗·斯拉法（后为剑桥名经济学家）前来探视，帮助提供阅读材料，并充当与陶里亚蒂之间的对话者。
