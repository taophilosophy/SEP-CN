      ### 1.1 撒丁岛（1891–1911）
  - id: 5
    kind: body
    source: |-
      Antonio Francesco Gramsci was born on 22 January 1891 in Ales, Sardinia to a middle-class family of Albanian descent. Located in Italy’s southern *Mezzogiorno*, the island of Sardinia shared the region’s arid landscape, widespread poverty, and fragile social hierarchies. Gramsci was the fifth of seven children born to Giuseppina (née Marcia) and Francesco Gramsci and spent his early childhood near Cagliari, where his family had moved in 1897. In infancy he developed Pott’s Disease, a spinal form of tuberculosis that was not properly treated and, as a result, he grew up with a “hunched” back. He suffered frequent health problems throughout the rest of his life (Davidson 1977: 22–23)[^davidson-1977].
    step1: |-
      安东尼奥·弗朗切斯科·葛兰西 1891 年 1 月 22 日生于撒丁岛的阿莱斯，出身一个阿尔巴尼亚血统的中产家庭。撒丁岛位于意大利南部的 **梅佐焦尔诺**地区，与该地区共享干旱的地貌、普遍的贫困与脆弱的社会等级。葛兰西是朱塞平娜（原姓马西亚）与弗朗切斯科·葛兰西七个孩子中的第五个，童年在卡利亚里附近度过，全家于 1897 年迁往该地。婴儿时期他患上了波特氏病——一种脊柱结核，未得到妥善治疗，结果他背着“驼背”长大。此后一生他饱受健康问题之苦（Davidson 1977: 22–23）[^davidson-1977]。
    step2: |-
      安东尼奥·弗朗切斯科·葛兰西 1891 年 1 月 22 日生于撒丁岛的阿莱斯，家中属中产阶级，有阿尔巴尼亚血统。撒丁岛地处意大利南部的 **梅佐焦尔诺**，与该地区共享干旱的地貌、普遍的贫穷与脆弱的社会等级。葛兰西是朱塞平娜（原姓马西亚）与弗朗切斯科·葛兰西七个子女中的第五个；1897 年全家迁往卡利亚里近郊，他的幼年在那里度过。襁褓中他染上波特氏病——一种脊柱型结核——未能妥善医治，遂落得“驼背”度日。此后一生，病痛缠身（Davidson 1977: 22–23）[^davidson-1977]。
  - id: 6
    kind: body
    source: |-
      His father, a local civil servant, was suspended from his job in 1898 on politically motivated charges of corruption (he had supported an opposition candidate in local elections) and subsequently sentenced to five years in prison (Davidson 1977: 23–25)[^davidson-1977]. This brought years of terrible hardship for the family, who relocated to the town of Ghilarza. In 1903 the young Antonio—known as “Nino”—even suspended his schooling to support his family by working in a Land Registry office. On his return to education two years later, following his father’s release, he progressed well. A reserved character but an avid reader with a strong will, he entered high school in Cagliari, where he lived with his elder brother, Gennaro. Gennaro introduced him to socialist literature, and he began to read Italian critics such as Gaetano Salvemini, Giuseppe Prezzolini, and Benedetto Croce, as well as Karl Marx. Gramsci shared many Sardinians’ deep resentment at the shortcomings of the “liberal” state since its unification in the nineteenth century, especially its protectionist policies, which contributed to the South’s cultural and economic underdevelopment.
    step1: |-
      他的父亲是一名地方公务员，1898 年因政治动机的腐败指控被停职（他曾在地方选举中支持一名反对派候选人），随后被判五年监禁（Davidson 1977: 23–25）[^davidson-1977]。这给全家带来了多年可怕的困苦，他们迁居吉拉尔扎镇。1903 年，小安东尼奥——人称“尼诺”——甚至一度辍学，到一家土地登记处做工以养家。父亲获释后，两年后他重返教育，进展良好。他性格内向，却酷爱读书、意志坚强，进入卡利亚里的中学就读，与兄长真纳罗同住。真纳罗把他引向社会主义文献，他开始阅读萨尔维米尼、普雷佐利尼和贝内德托·克罗齐等意大利批评家的著作，也读卡尔·马克思。葛兰西与许多撒丁岛人一样，对 19 世纪统一以来“自由主义”国家的种种弊病——尤其是其保护主义政策——积怨至深，这些政策加剧了南方的文化与经济落后。
    step2: |-
      父亲是地方公务员，1898 年因带有政治动机的贪腐指控被停职（他在地方选举中支持过一名反对派候选人），随后被判刑五年（Davidson 1977: 23–25）[^davidson-1977]。全家自此多年困顿，迁居吉拉尔扎镇。1903 年，少年安东尼奥——小名“尼诺”——甚至一度辍学，在一家土地登记处做工养家。父亲获释后，他两年后复学，学业进展顺利。他性格沉静内向，却嗜书如命、意志顽强；进入卡利亚里的中学后与兄长真纳罗同住。真纳罗引他读社会主义文献，他开始阅读萨尔维米尼、普雷佐利尼、贝内德托·克罗齐等意大利批评家，也读卡尔·马克思。与许多撒丁岛人一样，葛兰西对这个 19 世纪统一以来就弊病丛生的“自由主义”国家积怨极深——尤其是它的保护主义政策，后者加剧了南方的文化经济落后。
