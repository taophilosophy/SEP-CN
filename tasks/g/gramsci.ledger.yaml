      These comments are consistent with Gramsci’s general line of argument in the *Notebooks* on the strategic importance of building consent prior to revolution. They indicate that such a strategy was not a momentary, tactical initiative. It aligned with his aspiration for a cultural transformation over the longer term. His focus on the subjective, “superstructural” element of class politics certainly put Gramsci at odds with more objectivist accounts of Marxism, but it was far from an aversion to the reality of “structural” and empirical constraints (see Morera 1990)[^morera-1990]. Whatever its shortcomings as a generalizable Marxist theory, Gramsci’s philosophy of praxis was in keeping with his attempt to conceive revolutionary politics as the preparation of a “total, integral civilisation” (SPN: 462; see Thomas 2009)[^thomas-2009].
    step1: |-
      这些评论与葛兰西在《札记》中关于革命前建构同意之战略重要性的一般论证路线相一致。它们表明，这种战略不是一时的战术举措。它契合他对较长期文化转变的渴望。他对阶级政治中主观的、“上层建筑”要素的关注，固然使葛兰西与更客观主义的马克思主义解释相左，但远非厌弃“结构性”与经验性约束的现实（见 Morera 1990）[^morera-1990]。无论作为一种可普遍化的马克思主义理论有何缺陷，葛兰西的实践哲学与他试图把革命政治设想为一种“总体、完整的文明”之准备的意图是相合的（SPN: 462；见 Thomas 2009）[^thomas-2009]。
    step2: |-
      这些议论，与葛兰西在《札记》中关于革命前建构同意之战略意义的总论证一脉相承。它们表明，此种战略并非一时的战术动作，而与他期求长程文化转变的抱负相合。他瞩目于阶级政治中主观的、“上层建筑”的一面，自然使他有别于更客观主义的马克思主义阐释；但这远非厌弃“结构性”与经验性约束（见 Morera 1990）[^morera-1990]。无论作为可普遍化的马克思主义理论尚有多少欠缺，葛兰西的实践哲学仍与他那番意图相合：把革命政治设想为“总体而完整的文明”之准备（SPN: 462；见 Thomas 2009）[^thomas-2009]。
