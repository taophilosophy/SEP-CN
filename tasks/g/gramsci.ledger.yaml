      The initial reception of Gramsci’s writings was shaped by the Italian Communist Party (*Partito comunista italiano*, or PCI), particularly by its leader since the mid-1920s, Palmiro Togliatti, who emphasized their significance for a renewed communist strategy. To demonstrate allegiance to Stalin and the USSR, Togliatti presented an “acceptable” version of Gramsci that suited the PCI’s cautious post-war politics. Selective editing of the *Notebooks* downplayed overt conflict with Stalin, emphasizing Gramsci’s continuity with the Soviet philosophical orthodoxy of “dialectical materialism” and a Leninist model of revolution. However, following Stalin’s death in 1953 Togliatti underscored Gramsci’s unique formulation of Marxism and his continuity with native Italian currents of philosophy. This endorsed Togliatti’s own view of the PCI as a pragmatic, mass-based party pursuing its own “Italian road to socialism”; operating as a “collective intellectual” to mobilize the proletariat and its allies in a uniquely national and democratic project (see Togliatti 1979)[^togliatti-1979].
    step1: |-
      葛兰西著作的最初接受，受到意大利共产党（*Partito comunista italiano*，简称 PCI）的塑造，尤其是其自 1920 年代中期以来的领导人帕尔米罗·陶里亚蒂，他强调这些著作对一种更新的共产主义战略的意义。为表明对斯大林和苏联的忠诚，陶里亚蒂呈献了一个“可接受的”葛兰西版本，以迎合意共战后谨慎的政治。对《札记》的选择性编辑淡化了与斯大林的公开冲突，强调葛兰西与“辩证唯物主义”的苏联哲学正统以及列宁主义革命模式的连续性。然而，斯大林 1953 年去世后，陶里亚蒂转而强调葛兰西对马克思主义的独特表述及其与意大利本土哲学思潮的连续性。这支持了陶里亚蒂自己对意共的看法：一个务实的、群众性的党，追求自己的“意大利社会主义道路”；作为一个“集体知识分子”运作，在一个独特的民族民主事业中动员无产阶级及其盟友（见 Togliatti 1979）[^togliatti-1979]。
    step2: |-
      葛兰西著作最初的接受，受到意大利共产党（*Partito comunista italiano*，简称 PCI）的塑造，尤其是 1920 年代中期以来的党魁帕尔米罗·陶里亚蒂：他突出这些著作对更新共产主义战略的意义。为表忠于斯大林与苏联，陶里亚蒂端出一个“可接受的”葛兰西，以迁就意共战后谨小慎微的政治。对《札记》的选择性编辑，淡化了同斯大林的公开冲突，强调葛兰西与“辩证唯物主义”的苏联哲学正统、以及列宁主义革命模式的一脉相承。斯大林 1953 年去世后，陶里亚蒂转而强调葛兰西对马克思主义的独特表述，及其与意大利本土哲学思潮的连续性。这正印证了他本人对意共的定位。这一方略是：一个务实、群众性的政党，走自己的“意大利社会主义道路”。它充当“集体知识分子”，在独具民族与民主色彩的事业中动员无产阶级及其盟友（见 Togliatti 1979）[^togliatti-1979]。
