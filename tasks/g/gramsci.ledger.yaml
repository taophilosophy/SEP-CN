      ## 4. Reception of the Prison Writings
    step1: TBD
    step2: TBD
  - id: 103
    kind: body
    source: |-
      Gramsci’s prison writings were first published in Italy after the Second World War: his letters from prison in 1947 (see GLP), winning the Viareggio literary prize that year; and his *Notebooks* in six, thematic volumes of selections between 1948 and 1951. A complete, “critical” edition of the *Notebooks* (in four volumes) was published in 1975 (see QC).
    step1: TBD
    step2: TBD
  - id: 104
    kind: body
    source: |-
      The distance in time since their drafting, and the fragmented nature of the texts themselves, meant that the prison writings did not directly address the new environment into which they emerged. The meaning and implications of his thinking were therefore heavily mediated by national and geopolitical concerns through which, inevitably, the *Notebooks* were read. Over time—as his writings became available and scholarship on his thought improved—recognition of his distinctiveness as a thinker has grown around the world. Gramsci’s account of hegemony, especially, has been a highly effective resource for cultural and political analysis (see Martin 2022)[^martin-2022].
    step1: TBD
    step2: TBD
  - id: 105
    kind: body
    source: |-
      Where precisely did Gramsci’s philosophical innovations lie for his later readers? Over the years, different, interpretations of Gramsci have tended to emphasize competing aspects of his thought as its philosophical “core” (see Liguori 2012 [2022])[^liguori-2012].
    step1: TBD
    step2: TBD
  - id: 106
    kind: body
    source: |-
      The initial reception of Gramsci’s writings was shaped by the Italian Communist Party (*Partito comunista italiano*, or PCI), particularly by its leader since the mid-1920s, Palmiro Togliatti, who emphasized their significance for a renewed communist strategy. To demonstrate allegiance to Stalin and the USSR, Togliatti presented an “acceptable” version of Gramsci that suited the PCI’s cautious post-war politics. Selective editing of the *Notebooks* downplayed overt conflict with Stalin, emphasizing Gramsci’s continuity with the Soviet philosophical orthodoxy of “dialectical materialism” and a Leninist model of revolution. However, following Stalin’s death in 1953 Togliatti underscored Gramsci’s unique formulation of Marxism and his continuity with native Italian currents of philosophy. This endorsed Togliatti’s own view of the PCI as a pragmatic, mass-based party pursuing its own “Italian road to socialism”; operating as a “collective intellectual” to mobilize the proletariat and its allies in a uniquely national and democratic project (see Togliatti 1979)[^togliatti-1979].
    step1: TBD
    step2: TBD
  - id: 107
    kind: body
    source: |-
      Now a canonical figure in Italian Marxism, Gramsci’s reading of history—particularly his view of the Risorgimento as a failed bourgeois revolution—was called into question in the late 1950s. In one notable debate, liberal historian Rosario Romeo disputed that economic conditions could have permitted the nineteenth-century bourgeoisie to act as a “Jacobin” force by mobilizing the peasantry and other subaltern classes. Gramsci’s reasoning (and, by extension, the PCI’s sense of its distinctive national strategy) was premised on a moral and political, rather than genuinely objective, interpretation of history (Liguori 2012 [2022: 121–23]; Davis 1979)[^davis-1979][^liguori-2012].
    step1: TBD
    step2: TBD
  - id: 108
    kind: body
    source: |-
      Although Romeo’s critique was disputed by Gramscian historians, from the 1960s, as more of his writings were published and translations became available, Gramsci was increasingly read independently of (and in opposition to) the PCI’s strategic concerns (see Mouffe 1979)[^mouffe-1979]. His seemingly “heretical” formulation of Marxist theory came to occupy his readers, especially as regards his debt to Crocean historicism, his ambiguous relation to materialism and to Leninism (see Bobbio 1979)[^bobbio-1979]. More widely, Gramsci’s exploration of cultural and political superstructures resulted in a tendency to categorize him as a “western” Marxist, concerned less with economic conditions or coercion and more with ideological barriers to class consciousness (see Anderson 1976, 1976–77)[^anderson-1976][^anderson-1976-2]. Hegemony was associated with a general theory of cultural and ideological domination relevant to the critique of consumer capitalism.
    step1: TBD
    step2: TBD
  - id: 109
    kind: body
    source: |-
      Through the late 1960s and 70s, as western states experienced economic and ideological crises, Gramsci’s analyses were applied separately from communist strategy or philosophical idealism. Marxist sociologists such as Nicos Poulantzas (1968 [1973]) and, later, Bob Jessop (1990) found in hegemony a resource to explore the permutations of the capitalist state and its shifting class coalitions. British Cultural Studies—especially the work of Raymond Williams and Stuart Hall—saw in Gramsci an inventive, “cultural Marxist” framework for examining popular lived experience of class domination. Debates over the functions of mass media and populist ideology, particularly with the emergence of “Thatcherism” in the 1980s, were uniquely attuned to the dynamics of hegemonic politics suggested in Gramsci’s writings (see Hall 1988; Jessop et al. 1988)[^hall-1988][^jessop-1988].
    step1: TBD
    step2: TBD
  - id: 110
    kind: body
    source: |-
      “Post-Marxist” approaches to hegemony from the 1980s built on the established popularity of Gramsci’s thought, particularly its application in the field of ideology studies. Ernesto Laclau and Chantal Mouffe’s *Hegemony and Socialist Strategy* (1985) recast hegemony as the theoretical basis to a strategy of “radical democracy”, aimed at unifying multiple and diverse social struggles. Drawing on “poststructuralist” philosophies, hegemony was conceived as a general principle of “discursive articulation”—the contingent formation of a collective identity—with no “necessary” foundation in economic class. For them, Gramsci’s core philosophical insight lay in demonstrating hegemony’s political “logic”, rather than any sociological concerns. They sought to discard the residual economism in his thinking and thus the automatic privilege granted by Marxism to class agency in hegemonic politics. In their view, various hegemonic formations co-exist, and a radical democratic politics does not require working class leadership.
    step1: TBD
    step2: TBD
  - id: 111
    kind: body
    source: |-
      Gramsci’s *Notebooks* continued to attract scholarly interest after the demise of the Soviet Union and the dissolution of the PCI. Recent approaches have been drawn, increasingly, to the nuances and inflections in his analyses, often neglected in the tendency to focus on “hegemony” and its relation to Marxist theory. While the concept remains important, there is growing appreciation of other themes in Gramsci’s philosophy of politics and their relevance to a variety of fields. His ideas remain a source of insight for non-orthodox Marxisms (see Thomas 2009)[^thomas-2009], and his concepts have been extended to academic fields such as International Relations and Global Political Economy (see Gill 1993)[^gill-1993] and to socio-political contexts beyond Europe and the “West” (see Morton 2007; Fonseca 2016)[^fonseca-2016][^morton-2007]. Gramsci’s own experience as an internal migrant who “looked at modernity from the bottom of its peripheries” (Urbinati 1998: 371)[^urbinati-1998], and his particular attention to the struggles of “subaltern” classes in the formation of national cultures, have inspired forms of postcolonial literary criticism and politics quite at odds with the communist frame in which his ideas originated (see Srivastava & Bhattacharya 2012)[^srivastava-2012].
    step1: TBD
    step2: TBD
