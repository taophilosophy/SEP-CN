      The distance in time since their drafting, and the fragmented nature of the texts themselves, meant that the prison writings did not directly address the new environment into which they emerged. The meaning and implications of his thinking were therefore heavily mediated by national and geopolitical concerns through which, inevitably, the *Notebooks* were read. Over time—as his writings became available and scholarship on his thought improved—recognition of his distinctiveness as a thinker has grown around the world. Gramsci’s account of hegemony, especially, has been a highly effective resource for cultural and political analysis (see Martin 2022)[^martin-2022].
    step1: |-
      从写作到出版的时间距离，以及文本本身的碎片性质，意味着狱中著作并未直接回应它们问世时所面对的新环境。因此，他的思想之意义与蕴含，在很大程度上经由民族与地缘政治的关切而被中介；《札记》不可避免地是在这些关切中被阅读的。随着时间推移——随着他的著作日益可得、关于其思想的研究日益改进——世界各地对他作为思想家的独特性的认识不断增长。尤其是葛兰西的霸权论述，一直是文化分析与政治分析的极为有效的资源（见 Martin 2022）[^martin-2022]。
    step2: |-
      写作与出版之间隔着一段岁月，文本本身又支离破碎，狱中著作便没能直接回应它问世时置身的新环境。于是，他的思想有何意义、有何蕴含，很大程度上要经由民族与地缘政治的关切来中介；《札记》之被阅读，不可避免地带上了这些关切的滤镜。久而久之——随着著作渐次可得、研究日渐精进——世界各地对他作为思想家的独特性的认识也日益增长。尤其是他的霸权论述，一直是文化政治分析极为得力的资源（见 Martin 2022）[^martin-2022]。
