      Gramsci’s overt “philosophical” references in his writings prior to the *Notebooks* are sporadic and bound closely to his responses to wider events. He wrote as a committed socialist and revolutionary critic, albeit as an intellectual skeptical of prevailing orthodoxies (influenced, arguably, by his southern upbringing which made him something of an “outsider” to mainstream progressive opinion). Like many Italian commentators, he shared the view that the liberal state’s fundamental shortcoming consisted in a failure to build popular and inclusive governing institutions. The task remained, therefore, “to make Italians” (*fare gli italiani*) as one critic put it, that is, to find a model of association to culturally integrate citizens (see Bellamy 1987)[^bellamy-1987]. This general problem informs Gramsci’s pre-prison writings as well as his later account of hegemony (see Bellamy & Schecter 1993)[^bellamy-1993].
    step1: |-
      在《札记》之前，葛兰西著作中公开的“哲学”指涉是零星的，并与其对更广泛事件的回应紧密相连。他以一个坚定的社会主义者与革命批评家的身份写作，同时也是一名对流行正统持怀疑态度的知识分子（可以说，他受南方成长经历的影响，这使他在某种程度上成为主流进步舆论的“局外人”）。与许多意大利评论者一样，他同样认为自由主义国家的根本缺陷在于未能建立民众的、包容的治理制度。因此，任务仍然是“造就意大利人”（*fare gli italiani*）——如一位批评者所说——即找到一种在文化上整合公民的结社模式（见 Bellamy 1987）[^bellamy-1987]。这一总体问题既贯穿葛兰西的狱前著作，也贯穿他后来关于霸权的论述（见 Bellamy & Schecter 1993）[^bellamy-1993]。
    step2: |-
      在《札记》之前，葛兰西著作中显白的“哲学”指涉是零星的，且紧密依附于他对更广泛事件的回应。他以坚定的社会主义者与革命批评家身份写作，同时又是对流行正统持怀疑的知识分子；可以说，其南方成长经历使他多少成为主流进步舆论的“局外人”。与许多意大利评论者一样，他认为自由主义国家的根本缺陷在于未能建立民众的、包容的治理制度。因此任务仍是“造就意大利人”（*fare gli italiani*）——如一位批评者所说——即找到一种在文化上整合公民的结社模式（见 Bellamy 1987）[^bellamy-1987]。这一总体问题既贯穿其狱前著作，也贯穿他后来关于霸权的论述（见 Bellamy & Schecter 1993）[^bellamy-1993]。
