    source: |-
      Gramsci’s *Prison Notebooks* (or *Quaderni del carcere*) comprise around three thousand pages of thematically organized essays, observations and comments, written between 1929 and 1935 (see QC). A number of his notes were revised over time, which indicates they were not written randomly but conformed, in part, to a plan. Recent research offers some clue as to the logic and chronology of their drafting (see Francioni 1984)[^francioni-1984]. Nonetheless, the *Notebooks* were not written for publication and, as a whole, they remain fragmentary with no explicit guide as to how, or in even what order, the contents might be read.
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      In his earliest letters from detention, Gramsci indicated various themes that he hoped to explore, including Italian intellectuals, comparative linguistics, the plays of Pirandello, newspapers and other forms of “popular literature” (GPL: 45–6). Later he listed more topics—including historiography, the development of the Italian bourgeoisie, the southern question, common sense, and folklore.
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      These cultural and historical headings may appear uncontroversial. But they permitted Gramsci to develop his wider thoughts on the practical and intellectual problems that had preoccupied him prior to his arrest. That included: historical features of the Italian state; theoretical concepts for analyzing the cultural and political conditions of class domination; and the organizing principles and character of a revolutionary strategy. Freed from the immediate constraints of tactical decisions and their repercussions, Gramsci drew on his humanistic training to extend and deepen his understanding of these problems (see Schwarzmantel 2015)[^schwarzmantel-2015].
