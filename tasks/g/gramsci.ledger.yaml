    source: |-
      Gramsci’s *Notebooks* continued to attract scholarly interest after the demise of the Soviet Union and the dissolution of the PCI. Recent approaches have been drawn, increasingly, to the nuances and inflections in his analyses, often neglected in the tendency to focus on “hegemony” and its relation to Marxist theory. While the concept remains important, there is growing appreciation of other themes in Gramsci’s philosophy of politics and their relevance to a variety of fields. His ideas remain a source of insight for non-orthodox Marxisms (see Thomas 2009)[^thomas-2009], and his concepts have been extended to academic fields such as International Relations and Global Political Economy (see Gill 1993)[^gill-1993] and to socio-political contexts beyond Europe and the “West” (see Morton 2007; Fonseca 2016)[^fonseca-2016][^morton-2007]. Gramsci’s own experience as an internal migrant who “looked at modernity from the bottom of its peripheries” (Urbinati 1998: 371)[^urbinati-1998], and his particular attention to the struggles of “subaltern” classes in the formation of national cultures, have inspired forms of postcolonial literary criticism and politics quite at odds with the communist frame in which his ideas originated (see Srivastava & Bhattacharya 2012)[^srivastava-2012].
    step1: |-
      苏联解体、意共解散之后，葛兰西的《札记》仍持续吸引学术兴趣。晚近的进路越来越被其分析中的细微与曲折所吸引，而这些在倾向于聚焦“霸权”及其与马克思主义理论之关系的做法中常被忽视。这一概念固然依旧重要，但人们越来越欣赏葛兰西政治哲学中的其他主题及其对各领域的相关性。他的思想仍是非正统马克思主义的洞见来源（见 Thomas 2009）[^thomas-2009]，其概念已被扩展到国际关系与全球政治经济学等学术领域（见 Gill 1993）[^gill-1993]，也扩展到欧洲与“西方”之外的社会政治语境（见 Morton 2007; Fonseca 2016）[^fonseca-2016][^morton-2007]。葛兰西本人作为国内移民“从边缘的底层打量现代性”（Urbinati 1998: 371）[^urbinati-1998]的经验，以及他对民族文化建设中“属下”阶级斗争的特别关注，启发了与他的思想原初所处的共产主义框架颇相抵牾的后殖民文学批评与政治（见 Srivastava & Bhattacharya 2012）[^srivastava-2012]。
    step2: |-
      苏联解体、意共解散之后，葛兰西的《札记》依然引人研治。晚近研究越来越着迷于其分析中的细微处与曲折处；在偏重“霸权”及其与马克思主义理论之关系的旧例里，这些常被忽视。霸权概念固然仍旧要紧，但人们也日渐赏识葛兰西政治哲学中的其他题目及其在各领域的相关性。他的思想仍是非正统马克思主义的灵感之源（见 Thomas 2009）[^thomas-2009]；其概念已进入国际关系、全球政治经济学等学科（见 Gill 1993）[^gill-1993]，也进入欧洲与“西方”之外的社会政治语境（见 Morton 2007; Fonseca 2016）[^fonseca-2016][^morton-2007]。葛兰西本人作为国内移民“从边缘的底层打量现代性”（Urbinati 1998: 371）[^urbinati-1998]。他特别关注“属下”阶级在民族文化形成中的斗争，这启发了后殖民文学批评与政治——尽管其取向与他思想原初所处的共产主义框架颇相枘凿（见 Srivastava & Bhattacharya 2012）[^srivastava-2012]。
