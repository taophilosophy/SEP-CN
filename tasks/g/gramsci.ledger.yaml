      Gramsci’s early writing was informed by the influential critical framework of the neo-Hegelian philosopher Benedetto Croce. Croce had denounced scientific positivism—prevalent among social scientists and European Marxists—for its abstract, ahistorical reasoning and emphasis on material “causes” in social change. Positivism neglected the historically particular and practically creative dimension of “spirit” (or consciousness) which, beyond any political program, motivated all social and cultural transformation. Croce invited a view of Italy’s political failings as the absence of a robust, unifying culture—a secular civic faith—rather than economic underdevelopment as such (see Croce 1914)[^croce-1914]. He inspired numerous “aesthetic” critics of the liberal state to understand socio-political improvement as inseparable from free artistic self-creation, the assertion of moral will, and the cultivation of a shared “inner” sensibility.
    step1: |-
      葛兰西的早期写作受到新黑格尔主义哲学家贝内德托·克罗齐颇具影响力的批评框架的启发。克罗齐谴责科学实证主义——它盛行于社会科学家与欧洲马克思主义者之间——因其抽象、非历史的推理方式以及对社会中物质“原因”的强调。实证主义忽视了“精神”（或意识）的历史特殊性与实践创造性维度，而这种维度超越任何政治纲领，推动着一切社会与文化转变。克罗齐提示人们把意大利的政治失败理解为缺乏一种强健、统一的文化——一种世俗的公民信仰——而非经济欠发达本身（见 Croce 1914）[^croce-1914]。他启发了众多对自由主义国家持“审美”批评的论者，把社会政治改善理解为与自由的艺术自我创造、道德意志的伸张以及共同“内在”感受力的培养不可分割。
