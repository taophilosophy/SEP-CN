      认识论是格里高利思想受到大量关注的另一个领域（例如 Elie 1937; Dal Pra 1956; Gál 1977; Eckermann 1978; Oberman 1981 中 V. Wendland 所撰章节，242–300; Tachau 1988, 358–71; Bermon 2007; Mandrella 2016; Girard 2017）[^bermon-2007][^dal-1956][^eckermann-1978][^gál-1977][^girard-2017][^mandrella-2016][^oberman-1981][^tachau-1988]。格里高利持非实在论立场：共相由灵魂形成，且只有在心灵先对个别事物有所把握之后才形成。因此感官经验在理智认知中起重要作用。就简单认知而言，格里高利采用直观认知与抽象认知二分这一通行术语，尽管二者的区别基于对象而非认知方式。对格里高利来说，直观认知直接终止于心灵之外的对象，而抽象认知则终止于灵魂中对象的种相。格里高利在其认知理论中为这类种相留出位置，这一点并未被忽视（Corvino 1978; Spruit 2013, 309–313; Mandrella 2016, 220–223）[^corvino-1978][^mandrella-2016]。这被描述为奥卡姆与里米尼在简单认知认识论上的唯一差别（Mandrella 2016, 223）[^mandrella-2016]。尽管如此，格里高利对种相的使用在很大程度上决定了他对普遍概念的看法，以至于他接受了一种奥卡姆明确斥为特别不合理的观点：普遍概念是与心灵活动真正有别的性质，并且无论心灵活动是否指向它们，它们都留在灵魂中（Girard 2017, 263）[^girard-2017]。
