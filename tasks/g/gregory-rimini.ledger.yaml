      More clear is Gregory’s importance in the late Middle Ages and Reformation, even if much of this period has received relatively little attention. Gregory’s impact is obvious, because many scholastics after 1350 copied large passages from his works, including such prominent figures as the Cistercian James of Eltville, Pierre d’Ailly, and Henry of Langenstein. Other important thinkers, such as Hugolino of Orvieto OESA, the Cistercian Pierre Ceffons, Marsilius of Inghen, and Peter of Candia OFM (Pope Alexander V) knew Gregory’s ideas well and cited them often. Few if any philosophers in the later fourteenth century can have been unaffected by his ideas, and for many he was their main inspiration. Gregory’s impact both inside and outside the Augustinian Order continued into the fifteenth century. The common *Sentences* commentary (the so-called *Quaestiones communes*) of the University of Vienna in the first half of the century was largely based directly or indirectly on Gregory’s thought, often duplicating his words (see recently, Schabel 2020)[^schabel-2020]. In the celebrated quarrel over future contingents at the University of Louvain (1465–1474), several of the participants cited Gregory’s position or even adopted it without attribution. Of course, the fact that only books I and II of Gregory’s commentary circulated means that Gregory’s direct impact is to be found in topics discussed in those books rather than in issues covered in books III and IV, such as the Immaculate Conception and the Eucharist, which had their own philosophical sub-issues.
    step1: |-
      更清楚的是格里高利在晚期中世纪与宗教改革时期的重要性，即便这一时期的很大部分受到的关注相对较少。格里高利的影响显而易见，因为 1350 年之后许多经院学者从他的著作中抄录大段文字，包括西多会士埃尔茨维尔的雅各、皮埃尔·戴利与朗根施泰因的亨利等显赫人物。其他重要思想家，如奥古斯丁会的奥尔维耶托的乌戈利诺、西多会士皮埃尔·塞丰、因根的马西利乌斯，以及方济各会的坎迪亚的彼得（即教宗亚历山大五世），都熟知格里高利的思想并经常引用。十四世纪后期的哲学家恐怕很少有人能不受其思想影响，对许多人来说他就是主要灵感来源。格里高利在奥古斯丁会内外的影响持续到十五世纪。本世纪上半叶维也纳大学的通行《箴言四书》注疏（所谓《共通问题集》，*Quaestiones communes*）在很大程度上直接或间接地基于格里高利的思想，常常重复他的文字（近期研究见 Schabel 2020）[^schabel-2020]。在鲁汶大学关于未来偶然事件的著名论争（1465–1474）中，若干参与者引用了格里高利的立场，甚至不加归属地采纳了它。当然，格里高利注疏只有第一、二卷流传这一事实意味着，他的直接影响见于这两卷所讨论的题目，而不是第三、四卷所涵盖的问题，如圣母无染原罪与圣体圣事——这些问题各有其哲学子问题。
