      Although his commentary on books I and II of the *Sentences* is by far Gregory’s largest and most important work, historians of medieval philosophy have recently devoted some attention to his sole writing on economic thought, which was printed in Reggio Emilia in 1508 as the *Tractatus de imprestantiis Venetorum et de usura* and reprinted in Rimini itself over a century later in 1622 (Rimini 1508; Lambertini 2003, 2009; Kirshner 2015)[^kirshner-2015][^lambertini-2003]. The only known manuscript witness is in a codex containing various political and economic tracts: Florence, Biblioteca Nazionale Centrale, Conv. Soppr. J. X. 51, ff. 201r-212r. The manuscript carries a different redaction of the text, but it can be used to correct the printed editions and should form the basis of a future critical edition. The title and explicit in the manuscript further identify the work as a *quaestio disputata* on the forced loans of the Venetian commune according to the determination of Gregory of Rimini, Master of Theology and prior general of the Augustinians. Terminology in the text itself confirms that rather than a purely written work, the piece derives from an oral disputation, although the internal structure and the existence of two redactions indicate that it was much revised afterwards. Since we know that theologians’ administrative responsibilities did not preclude their participation in such events as quodlibetal disputations, it is possible that the debate took place while Gregory was his order’s prior general as the incipit says, i.e., in the latter half of 1357 or in 1358, which would make it his last word on intellectual matters.
    step1: |-
      尽管格里高利对《箴言四书》第一、二卷的注疏是他远为最大也最重要的著作，中世纪哲学史家近来对他唯一的经济思想作品给予了一些关注，该作 1508 年在雷焦艾米利亚印行，题为《论威尼斯人的强制借款与高利贷》（*Tractatus de imprestantiis Venetorum et de usura*），一个多世纪后又于 1622 年在里米尼本地重印（Rimini 1508; Lambertini 2003, 2009; Kirshner 2015）[^kirshner-2015][^lambertini-2003]。已知唯一的抄本见证是一部收录多种政治与经济论著的抄本：佛罗伦萨国家中央图书馆，Conv. Soppr. J. X. 51，ff. 201r-212r。该抄本所载是文本的另一种修订本，但可用以校正印本，并应成为未来校勘版的基础。抄本中的标题与结束语进一步表明，该作是一篇关于威尼斯公社强制借款的论辩问题（*quaestio disputata*），依据的是神学硕士、奥古斯丁会总会长里米尼的格里高利的裁定。文本本身的术语确认，这篇作品并非纯粹的书面著作，而是源自一场口头辩论，不过其内部结构与两种修订本的存在表明，它后来经过大幅修订。既然我们知道神学家的行政职责并不妨碍他们参加自由论题辩论之类的活动，那么这场辩论有可能发生在格里高利担任其修会总会长期间——如开篇语所说——即 1357 年下半年或 1358 年，果如此，这便将是他关于理智事务的最后之言。
