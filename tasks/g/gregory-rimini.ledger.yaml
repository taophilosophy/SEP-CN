      One final element of Gregory’s stance on modal matters that deserves our attention is the contingency or necessity of the past. The *opinio communis* maintained that the past is somehow necessary in a strong sense, even though it is not absolutely necessary. It seems that Gregory did not go so far as to say that the past is necessary (beyond the normal necessity *ex suppositione*), but he does make some sort of modal distinction between the past and the future. Thus we can say that Gregory did not think God can change the past, although there has been some disagreement on this issue (Courtenay 1972–73; Schabel 2000, 271–2)[^courtenay-1972][^schabel-2000]. Suffice it to say that the time has come for a long and careful treatment of the modal status of the past in medieval thought, to determine whether any thinker ever really thought the past could be changed. The probable answer is negative.
    step1: |-
      格里高利在模态问题上的立场还有最后一个值得注意的要素：过去的偶然性或必然性。*opinio communis*主张过去以某种强意义上是必然的，尽管并非绝对必然。看来格里高利并未走得那么远、以至说过去是必然的（超出通常的*ex suppositione*必然性之外），但他确实对过去与未来作了某种模态区分。因此我们可以说，格里高利不认为神能改变过去，尽管在这个问题上存在一些分歧（Courtenay 1972–73; Schabel 2000, 271–2）[^courtenay-1972][^schabel-2000]。只需说：现在该对中世纪思想中过去的模态地位作一番长期而细致的处理了，以确定是否真有思想家认为过去可以被改变。大概的答案是否定的。
