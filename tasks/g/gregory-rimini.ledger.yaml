    source: |-
      Biographical information for much of the life of Gregory of Rimini (a.k.a. de Arimino, Ariminensis, the “Torturer of Infants,” the *Lucerna splendens*, and the *Doctor* *acutus* or *authenticus*) derives from a letter of Pope Clement VI, dated 12 January 1345, requesting Gregory’s promotion to Master of Theology at the University of Paris:
    step1: |-
      关于里米尼的格里高利（又名 de Arimino、Ariminensis，“婴儿折磨者”，*Lucerna splendens*，以及 *Doctor* *acutus* 或 *authenticus*）生平的大部分传记信息，来自教宗克雷芒六世写于 1345 年 1 月 12 日的一封信，该信请求将格里高利提升为巴黎大学的神学硕士：
    step2: |-
      里米尼的格里高利（又名 de Arimino、Ariminensis，绰号“婴儿折磨者”，又称“闪耀之灯”*Lucerna splendens*，以及“敏锐博士”*Doctor acutus*或“权威博士”*authenticus*）生平的许多传记信息，来自教宗克雷芒六世 1345 年 1 月 12 日的一封信；这封信请求将格里高利晋升为巴黎大学的神学硕士：
  - id: 4
    kind: body
    source: |-
      > Gregory of Rimini, of the Order of the Friars Hermits of Saint Augustine, Parisian bachelor of theology, has now studied for twenty-two years, namely six straight years at Paris, and afterwards, returning to his native soil, he held the main chair at Bologna, Padua, and Perugia, and it has now been four years since he returned to Paris to lecture on the *Sentences*, lectures he has completed there commendably (Delucca 2003, 50)[^delucca-2003].
    step1: |-
      > 里米尼的格里高利，圣奥古斯丁隐修会会士，巴黎的神学学士，如今已学习二十二年，即在巴黎连续六年，此后返回其故土，在博洛尼亚、帕多瓦和佩鲁贾担任主要教席，而如今他返回巴黎讲授《箴言四书》已有四年，他在那里令人称许地完成了这些讲授（Delucca 2003, 50）[^delucca-2003]。
    step2: |-
      > 里米尼的格里高利，圣奥古斯丁隐修会会士，巴黎的神学学士，迄今已研习二十二年：其中在巴黎连续六年，其后返回故乡，先后在博洛尼亚、帕多瓦与佩鲁贾执掌主要教席；如今他重返巴黎讲授《箴言四书》已满四年，并在那里令人称许地完成了这些讲授（Delucca 2003, 50）[^delucca-2003]。
  - id: 5
    kind: body
    source: |-
      According to the letter, then, Gregory first studied theology at Paris from 1322 or 1323 until 1328 or 1329. Working backwards, we can estimate that Gregory was born in Rimini around 1300, joined the mendicant order of the Hermits of Saint Augustine (OESA), and received his basic education before going to Paris. There he was exposed to the latest developments in philosophical theology, especially the ideas of the Franciscan Peter Auriol, who had died in early 1322. Assuming that the sequence in the papal letter is strictly chronological, Gregory then taught theology at various Augustinian *studia* in Italy, first at Bologna, where he is attested as *lector* in documents of late 1332, 1333, and early 1337. Perhaps he was transferred to Padua at the Augustinians’ General Chapter meeting in Siena in 1338, and then he was shifted to Perugia. Almost certainly while he was in Italy, Gregory came into contact with the works of Oxford scholars from the 1320s and 1330s, most notably William of Ockham, Adam Wodeham, Richard Fitzralph, and Walter Chatton. Pope Clement’s letter suggests that Gregory returned to Paris in late 1340 or in 1341 in order to lecture on the *Sentences*, but perhaps the “four years” refers to the date of his order’s General Chapter of Montpellier, 1341, which may have been the occasion when Gregory was assigned to return to Paris. The prevailing view is that Gregory went to Paris in 1342 for a year of preparation for his lectures on the *Sentences*, which were given in 1343–44, but given that our records of these lectures were subject to revision, there is a degree of uncertainty. With help from the pope’s letter, Gregory probably became Master of Theology in 1345, holding at least one quodlibetal disputation at Paris, but he continued to revise his written *Sentences* commentary until 1346, removing certain passages that were formerly considered later *additiones*. In late 1346 Master Gregory was in Rimini and the following year we find him teaching again in Padua, where he stayed until 1351 when the General Chapter at Basel sent him to teach at the recently established *studium* in Rimini. He remained there at least until late 1356, but on 20 May 1357, at the General Chapter in Montpellier, he was elected the Augustinians’ prior general, succeeding the late Thomas of Strasbourg. Gregory died in Vienna toward the end of 1358 (see V. Marcolino’s chapter in Oberman 1981, 127–94; Lambertini et al. 2002; Delucca 2003)[^delucca-2003][^oberman-1981].
    step1: |-
      这样，按照这封信，格里高利最初是在 1322 或 1323 年至 1328 或 1329 年间在巴黎研习神学。由此倒推，我们可以估计格里高利大约 1300 年出生于里米尼，加入了托钵修会圣奥古斯丁隐修会（OESA），并在去巴黎之前接受了基础教育。在那里他接触到哲学神学的最新发展，尤其是方济各会士彼得·奥雷奥利的思想，后者已于 1322 年初去世。假定教宗信中的次序严格按时间先后，格里高利随后在意大利的各奥古斯丁会学馆（*studia*）讲授神学，先是博洛尼亚，1332 年末、1333 年及 1337 年初的文献证明他在那里任讲师（*lector*）。也许他在 1338 年于锡耶纳举行的奥古斯丁会全体大会上被调往帕多瓦，随后又被调往佩鲁贾。几乎可以肯定，格里高利在意大利期间接触到了 1320 与 1330 年代牛津学者的著作，最著名的是奥卡姆的威廉、亚当·德·沃德汉姆、理查德·菲茨拉尔夫与沃尔特·查顿。克雷芒教宗的信暗示格里高利在 1340 年末或 1341 年返回巴黎，以便讲授《箴言四书》，但也许“四年”指的是其修会 1341 年蒙彼利埃全体大会的日期，那次大会可能正是指派格里高利返回巴黎的场合。通行的看法是格里高利 1342 年前往巴黎，用一年时间为《箴言四书》讲授作准备，这些讲授在 1343–44 年进行，但鉴于我们对这些讲授的记录经过修订，其中存在一定程度的不确定性。借助教宗的信，格里高利大概在 1345 年成为神学硕士，在巴黎至少进行过一次自由论题辩论，但他直到 1346 年仍在修订其《箴言四书注》的写定本，删去了某些原先被认为是后来增补（*additiones*）的段落。1346 年末，格里高利硕士在里米尼，次年我们又见他在帕多瓦授课，他在那里待到 1351 年，随后巴塞尔全体大会派他前往里米尼新近设立的学馆（*studium*）任教。他至少在那里待到 1356 年末，但在 1357 年 5 月 20 日于蒙彼利埃举行的全体大会上，他继已故的斯特拉斯堡的托马斯之后当选为奥古斯丁会的总会长。格里高利 1358 年末在维也纳去世（参见 Oberman 1981 中 V. Marcolino 所撰章节，127–94；Lambertini et al. 2002；Delucca 2003）[^delucca-2003][^oberman-1981]。
    step2: |-
      由此可见，按这封信的说法，格里高利最初于 1322 或 1323 年至 1328 或 1329 年在巴黎研习神学。由此向前推算，我们可以估计格里高利约在 1300 年出生于里米尼，加入圣奥古斯丁隐修会（OESA）这一托钵修会，并在前往巴黎之前接受了基础教育。在巴黎，他接触到哲学神学的最新进展，尤其是方济各会士彼得·奥雷奥利的思想——后者已于 1322 年初去世。若假定教宗信中的次序严格按时间排列，格里高利随后在意大利各奥古斯丁会学馆（*studia*）讲授神学，最先在博洛尼亚；1332 年末、1333 年以及 1337 年初的文献都证明他当时在那里任讲师（*lector*）。他或许是在 1338 年于锡耶纳举行的奥古斯丁会全体大会上被调往帕多瓦，随后又被调往佩鲁贾。几乎可以肯定，格里高利在意大利期间接触到了 1320 年代与 1330 年代牛津学者的著作，其中最著名的是奥卡姆的威廉、亚当·德·沃德汉姆、理查德·菲茨拉尔夫与沃尔特·查顿。克雷芒教宗的信暗示格里高利在 1340 年末或 1341 年返回巴黎，以便讲授《箴言四书》；但“四年”或许指的是其修会 1341 年蒙彼利埃全体大会的日期，而那次大会可能正是指派格里高利返回巴黎的场合。通行的看法是，格里高利 1342 年前往巴黎，用一年时间为《箴言四书》讲授作准备，这些讲授于 1343–44 年进行；不过，鉴于我们对这些讲授的记录曾经过修订，其中仍有一定的不确定性。借助教宗的信，格里高利大概在 1345 年成为神学硕士，在巴黎至少进行过一次自由论题辩论，但他直到 1346 年仍在修订其《箴言四书注》的写定本，删去某些原先被视为后来增补（*additiones*）的段落。1346 年末，格里高利硕士身在里米尼；次年我们又在帕多瓦见到他授课，他在那里一直待到 1351 年，随后巴塞尔全体大会派他前往里米尼新近设立的学馆（*studium*）任教。他至少在那里待到 1356 年末；但在 1357 年 5 月 20 日于蒙彼利埃举行的全体大会上，他接替已故的斯特拉斯堡的托马斯，当选为奥古斯丁会的总会长。格里高利 1358 年末在维也纳去世（参见 Oberman 1981 中 V. Marcolino 所撰章节，127–94；Lambertini et al. 2002；Delucca 2003）[^delucca-2003][^oberman-1981]。
  - id: 6
    kind: body
    source: |-
      Gregory’s most important writing by far is his commentary on the first two books of the *Sentences*. Book I survives in some twenty complete manuscripts, while there are about a dozen for book II. The work was printed several times from 1482 to 1532, reprinted in 1955, and finally received a modern critical edition in six volumes in 1979–84 (Rimini 1979–84; Bermon 2002)[^bermon-2002]. Parts have been or are being translated into French, German, and English. The status of Books III and IV is unclear. It has been argued that they never existed and that Gregory chose not to comment on them (Bermon 2002, 274; Mandarella 2016, 198)[^bermon-2002]. However, Gregory explicitly says that he will defer the treatment of certain questions to Book III (Girard 2017, 241)[^girard-2017]. In addition to scriptural commentaries, smaller writings have been ascribed to Gregory, including a work usually known as *De usura*, printed in 1508 and again in 1622 (see below, section 6), and some *tabulae* of Augustine’s works (see Bermon 2007, 24–25 and Bermon forthcoming)[^bermon-2007]. His tract on the intension and remission of forms, *De intensione et remissione formarum corporalium*, carries the incipit “Circa secundum partem huius distinctionis” and is, therefore, just an excerpt of the *Sentences* commentary, book I, distinction 17, part 2 (see Loewe 2014, 274)[^loewe-2014]. Finally, from his brief term as his order’s prior general we have his correspondence, which has been published (Rimini 1976).
    step1: |-
      格里高利远为最重要的著作是对《箴言四书》前两卷的注疏。第一卷存世约有二十部完整抄本，第二卷约有十几部。此书在 1482 至 1532 年间数次印行，1955 年重印，最终在 1979–84 年获得了六卷本的现代校勘版（Rimini 1979–84；Bermon 2002）[^bermon-2002]。部分内容已经或正在译为法文、德文与英文。第三、四卷的情况不清楚。有人主张它们从未存在，是格里高利选择不加评注（Bermon 2002, 274; Mandarella 2016, 198）[^bermon-2002]。然而格里高利明确说，他将把某些问题的处理推迟到第三卷（Girard 2017, 241）[^girard-2017]。除圣经注疏外，还有一些较小的著作被归于格里高利，包括通常称为《论高利贷》（*De usura*）的作品，1508 年印行，1622 年又印行（见下文第 6 节），以及奥古斯丁著作的一些摘要表（*tabulae*）（见 Bermon 2007, 24–25 与 Bermon forthcoming）[^bermon-2007]。他论形式的增强与减弱的小册子《论形体形式的增强与减弱》（*De intensione et remissione formarum corporalium*）以“Circa secundum partem huius distinctionis”开篇，因而只是《箴言四书注》第一卷区分 17 第 2 部分的节录（见 Loewe 2014, 274）[^loewe-2014]。最后，从他短暂担任修会总会长一职，我们还有他的书信，已经出版（Rimini 1976）。
    step2: |-
      格里高利最重要的著作无疑是其对《箴言四书》前两卷的注疏。第一卷现存约二十部完整抄本，第二卷约有十二部。此书自 1482 年至 1532 年间数次印行，1955 年重印，最终于 1979–84 年出版了六卷本的现代校勘版（Rimini 1979–84；Bermon 2002）[^bermon-2002]。部分内容已经或正在被译为法文、德文与英文。第三、四卷的情况尚不清楚。有论者主张这两卷从未存在，是格里高利选择不加评注（Bermon 2002, 274; Mandarella 2016, 198）[^bermon-2002]。然而，格里高利明确说过，某些问题将留待第三卷处理（Girard 2017, 241）[^girard-2017]。除圣经注疏之外，还有一些较小的著作被归于格里高利名下，包括通常称为《论高利贷》（*De usura*）的一部作品——1508 年印行，1622 年再度印行（见下文第 6 节）——以及奥古斯丁著作的一些索引表（*tabulae*）（见 Bermon 2007, 24–25 及 Bermon forthcoming）[^bermon-2007]。他论形式的增强与减弱的小册子《论形体形式的增强与减弱》（*De intensione et remissione formarum corporalium*）以“Circa secundum partem huius distinctionis”开篇，因此只是《箴言四书注》第一卷区分 17 第二部分的节录（见 Loewe 2014, 274）[^loewe-2014]。最后，从他短暂担任修会总会长任内，我们还有他的书信集，现已出版（Rimini 1976）。
