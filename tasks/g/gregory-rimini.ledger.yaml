      Gregory’s treatment of divine foreknowledge and future contingents is aimed primarily at Peter Auriol and secondarily at Oxford theologians (Vignaux 1934, ch. 4; Hoenen 1993, 196–214; Schabel 2000, 264–274; Fiorentino 2004; Ciammetti 2011)[^ciammetti-2011][^fiorentino-2004][^hoenen-1993][^schabel-2000][^vignaux-1934]. In order to preserve the contingency of events stemming from human free will, Auriol claimed that propositions about future contingents are neither true nor false, but rather neutral, and so God does not know that the Antichrist will exist, since “the Antichrist will exist” is neither true nor false. Although like Ockham and Rimini later, Auriol maintained that exactly how God knows the future is incomprehensible to us, he did give a sophisticated explanation and defense of God’s knowledge of our future. Gregory, however, chose to focus on the above-mentioned elements in Auriol’s position. Gregory recognized that Auriol’s theory of future-contingent propositions relies on Aristotle’s stance in chapter 9 of *On Interpretation*. Interestingly, although Gregory denied the truth of the position itself, he nevertheless held that it was in fact Aristotle’s. Indeed he rejected any attempt to interpret Aristotle differently, in the way that many medieval and modern philosophers have tried to do:
    step1: |-
      格里高利对神的预知与未来偶然事件的处理，主要针对彼得·奥雷奥利，其次针对牛津神学家（Vignaux 1934, ch. 4; Hoenen 1993, 196–214; Schabel 2000, 264–274; Fiorentino 2004; Ciammetti 2011）[^ciammetti-2011][^fiorentino-2004][^hoenen-1993][^schabel-2000][^vignaux-1934]。为了保全源自人类自由意志的事件的偶然性，奥雷奥利主张关于未来偶然事件的命题既不真也不假，而是中性的，因此神并不知道敌基督将会存在，因为“敌基督将会存在”既不真也不假。尽管与奥卡姆和后来的里米尼一样，奥雷奥利坚持神究竟如何知道未来对我们来说不可理解，他确实给出了关于神如何知道我们未来的精巧解释与辩护。然而格里高利选择聚焦于奥雷奥利立场中的上述要素。格里高利认识到，奥雷奥利的未来偶然命题理论依赖于亚里士多德在《解释篇》第 9 章中的立场。有趣的是，尽管格里高利否认这一立场本身的真理性，他仍然认为它事实上是亚里士多德的立场。他甚至拒斥任何对亚里士多德作别样解读的尝试，而许多中世纪与现代哲学家曾试图那样做：
