      Gregory adopted Wodeham’s theory and tailored it where necessary to his own thought. The *complexe significabile*, once thought to be Gregory’s invention, is neither the proposition itself, nor individual things in the world, nor the arrangement of things in the world. The exact status of Gregory’s *complexe significabile* has been much discussed. In a nutshell, there are three main interpretations. The first one builds on Gregory’s claim that the *complexe significabile* is nothing (*nihil*), and thus holds that Gregory does not defend logical realism (Biard 1989, 183, Libera 2002, 217; Bermon 2007, 166–167)[^bermon-2007][^biard-1989][^libera-2002]. The second interpretation builds on Gregory’s claim that there are senses of “something” (*aliquid*), “thing” (*res*) and “being” (*ens*) that can apply to the *complexe significabile*, and insists that the *complexe significabile* must be something mind-independent because of this, although it is not an entity (Elie 1936, 28, 174; Nuchelmans 1973, 73)[^elie-1936][^nuchelmans-1973]. The third interpretation concludes from the fact that the *complexe significabile* is said to be something but not an entity to the fact that the *complexe significabile* must be mind-dependent or in the mind (Trapp 1977, 58; Mandrella 2016, 208, as a legitimate hypothesis)[^mandrella-2016][^trapp-1977]. Another point of debate concerns how one should evaluate Gregory’s take on Wodeham’s ideas. That debate opposes those who consider Gregory’s developments as a clearer elaboration of the concept (Bermon 2007, 169, 173)[^bermon-2007], and those who believe Gregory blurred the clear picture Wodeham had given, thus making the doctrine of the *complexe significabile* an easy target (Gàl 1977, 70; Nuchelmans 1980, 185–186; Zupko 1994–1997, 218)[^nuchelmans-1980][^zupko-1994].
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      Gregory famously listed three ways in which some *complexe significabile* could be said to be true: first, because a proposition signifying it would be true; second, with reference to the uncreated truth; third, because it is the case (i.e. it obtains). These descriptions have sometimes been read as competing ones (Elie 1936, 175)[^elie-1936]. If there is a general agreement that the first way must be left aside as too weak, since it makes the truth of the *complexe significabilia* depend on enunciations, it has been claimed that the second and third ways are compatible with each other (Libera 2002, 253; Conti 2004, 482–483)[^conti-2004][^libera-2002] and even complementary (Bermon 2007, 161–162)[^bermon-2007].
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      It is also known that Gregory differed from Wodeham in the way he thought about “assenting to” and “dissenting from” such *complexe significabilia*, an issue which had occupied Chatton at length. Wodeham thought of assent pretty much as an act of the will (Bermon 2007, 319)[^bermon-2007], that can contingently be added over and above a formed proposition. Gregory distinguishes two kinds of mental propositions: mental propositions that are not expressed in a given language, and mental propositions that are expressed in a given language and that derive from the first kind. For Gregory, Wodeham’s claim is true only of linguistic mental propositions (Bermon 2007, 343–344)[^bermon-2007]. For non-linguistic mental propositions, it is impossible to dissociate the formation and the acts of assent or dissent. Formation and assent are associated in such a way that Gregory can claim that assent is a mental utterance (Bermon 2007, 331)[^bermon-2007].
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      Gregory applied the notion to a host of philosophical problems, such as future contingents, and through him the *complexe significabile* became the common intellectual property of continental thinkers, and parallel notions are found in many important later intellectuals. More particularly, recent studies have focused on the reception of Gregory’s doctrine in Pierre Ceffons (Nannini 2015; Corbini 2020)[^corbini-2020].
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      Apart from *complexe significabilia*, another point of contact between Wodeham and Gregory in connection with complex cognition is the debate on the capacity that non-human animals have to make a judgement (i.e. Reina 1986; Perler 2006, 89–94; Oelze 2018, 123–129)[^oelze-2018][^reina-1986]. Gregory claims that we need to ascribe sensory judgments to non-human animals in order to account for their behaviour, especially for the different responses a same individual can exhibit to a same stimulus (Oelze 2018, 126–127)[^oelze-2018].
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      With regard to the mental proposition, although Gregory defends that the intellect can indeed have simultaneous acts (Friedman 2009, 114; Dubouclez 2014, 342–347)[^dubouclez-2014], nevertheless he holds, as Durand of Saint-Pourçain did, that the mental proposition must consist of a single act (Friedman 2009, 115).
