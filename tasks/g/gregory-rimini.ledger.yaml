      开列格里高利的哲学立场清单也许并不困难，描述他在各种题目上与奥卡姆的关系也不难（例如 Smith 1999, Mandrella 2016）[^mandrella-2016][^smith-1999]。例如在自然哲学中，格里高利与奥卡姆一致，是唯名论者，并运用“奥卡姆的”剃刀否认突变、运动与时间是独立实体（Brown 1998b）[^brown-1998b]。格里高利还主张世界本可以是永恒的。但在这种情况下，人们希望更好地了解格里高利直接前辈的立场，尤其是马尔基亚的弗朗西斯这样的巴黎人，以确定格里高利思想的可能来源与原创程度。例如关于世界的永恒性，格里高利的观点在他那个时代并不很奇怪。否则，格里高利的思想清单就只是清单而已。因此，这里的焦点将放在少数几个问题，即格里高利及其前辈的理论已被较深入探讨的问题。
