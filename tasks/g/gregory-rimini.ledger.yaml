      Coming to natural philosophy, Gregory of Rimini’s conception of the continuum has been the object of several studies (i.e., Maier 1949, 172–173, 176–177; Cross 1998; Sylla 2005, 260–268)[^cross-1998][^maier-1949][^sylla-2005]. According to Gregory, following Adam Wodeham, the continuum is not composed of point-like entities, but parts of the continuum are themselves magnitudes (Cross 1998, 96)[^cross-1998]. Gregory also claims, this time against Wodeham, that the division of the continuum can actually be completed, so that it is composed of an actual infinity of potential extended parts (Cross 1998, 97–98)[^cross-1998]. It is understood that each of these parts itself includes an infinity of parts (Cross 1998, 102)[^cross-1998]. That said, a problem is to see how exactly the division of the continuum can be completed if any part of the continuum must be said to contain an infinity of parts. It has been argued that it is in connection with this issue that several scholars (following Maier 1949, 172–173)[^maier-1949] read Gregory as holding that there are infinitesimal parts in the continuum (Cross 1998, 103–104)[^cross-1998]. Yet, in fact, the process is completed, not because one reaches something that cannot be divided, but because every part has been actually set apart from the others, including the ones it contains (Cross 1998, 103)[^cross-1998]. It is in connection with its conception of a continuum composed of an actual infinity of parts, each themselves composed of an actual infinity of parts, that Gregory explains how an infinite can be greater than another by including it (Cross 1998, 105–106; Thakkar 2009, 631–632)[^cross-1998][^thakkar-2009], thus answering Bradwardine’s objection on infinite parts and wholes (Thakkar 2009, 628–629)[^thakkar-2009].
    step1: |-
      转入自然哲学，里米尼的格里高利关于连续体的构想已成为若干研究的对象（例如 Maier 1949, 172–173, 176–177; Cross 1998; Sylla 2005, 260–268）[^cross-1998][^maier-1949][^sylla-2005]。格里高利追随亚当·德·沃德汉姆，认为连续体不由点状实体构成，而是连续体的各部分本身就是量（Cross 1998, 96）[^cross-1998]。格里高利还主张，这一次是反对沃德汉姆，连续体的分割实际上可以被完成，因此它由潜在延展部分的一个现实无限构成（Cross 1998, 97–98）[^cross-1998]。可以理解，这些部分中的每一个本身又包含无限多的部分（Cross 1998, 102）[^cross-1998]。话虽如此，问题在于：如果连续体的任何部分都必须被说成包含无限多的部分，那么连续体的分割究竟如何完成。有论者主张，正是在这个问题上，若干学者（追随 Maier 1949, 172–173）[^maier-1949]把格里高利读作主张连续体中有无穷小的部分（Cross 1998, 103–104）[^cross-1998]。然而事实上，这一过程之所以完成，并不是因为达到了某个不可再分的东西，而是因为每一部分——包括它所包含的那些部分——都已被现实地与其他部分分离开来（Cross 1998, 103）[^cross-1998]。正是在其关于连续体由现实无限的诸部分构成、而每一部分本身又由现实无限的诸部分构成的构想中，格里高利解释了无限如何通过包含另一个无限而大于它（Cross 1998, 105–106; Thakkar 2009, 631–632）[^cross-1998][^thakkar-2009]，从而回应了布拉德沃丁关于无限部分与整体的反驳（Thakkar 2009, 628–629）[^thakkar-2009]。
