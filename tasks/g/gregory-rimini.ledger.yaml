      Predestination was the traditional subject of distinctions 40–41 of commentaries on book I of the *Sentences*. This was a more purely “theological” subset of the more “philosophical” topic of foreknowledge and future contingents treated in distinctions 38–39. As in the case of foreknowledge, Gregory proceeded slowly and carefully, defining his terms and outlining the possible positions. Gregory’s Augustinian bent shows through more clearly in predestination than in foreknowledge. Gregory quoted Augustine’s words no less than 43 times in this context, and cited him still more often. Frequent scriptural quotations, carefully chosen, provide the ultimate basis for his theory. From Romans 9.13, where Paul comments on Malachi 1.2, “Jacob I have loved, but Esau I have hated,” Gregory took his position that from eternity, God actively elects to damn some and to save others, a theory called Double Predestination or Double Particular Election (Vignaux 1934, ch. 4; Schüler 1934; Halverson 1998, 143–157; Schabel 2002)[^halverson-1998][^schabel-2002][^schüler-1934][^vignaux-1934].
    step1: |-
      预定是《箴言四书》第一卷注疏中区分 40–41 的传统主题。它是区分 38–39 所处理的较为“哲学”的题目——预知与未来偶然事件——中更为纯粹“神学”的子集。与预知的情形一样，格里高利推进得缓慢而审慎，界定术语并勾勒各种可能立场。格里高利的奥古斯丁倾向在预定问题上比在预知问题上表现得更清楚。在此语境中，他引用奥古斯丁的原话不下 43 次，提及他的次数还要更多。频繁而精心择取的经文引文为他的理论提供了最终依据。他从《罗马书》9:13（保罗在此注释《玛拉基书》1:2“雅各是我所爱的，以扫是我所恶的”）出发，得出自己的立场：神自永恒就主动拣选一些人加以定罪，另一些人则得救；这一理论被称为双重预定或双重个别拣选（Vignaux 1934, ch. 4; Schüler 1934; Halverson 1998, 143–157; Schabel 2002）[^halverson-1998][^schabel-2002][^schüler-1934][^vignaux-1934]。
