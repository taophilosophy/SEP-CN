      Gregory adopted Wodeham’s theory and tailored it where necessary to his own thought. The *complexe significabile*, once thought to be Gregory’s invention, is neither the proposition itself, nor individual things in the world, nor the arrangement of things in the world. The exact status of Gregory’s *complexe significabile* has been much discussed. In a nutshell, there are three main interpretations. The first one builds on Gregory’s claim that the *complexe significabile* is nothing (*nihil*), and thus holds that Gregory does not defend logical realism (Biard 1989, 183, Libera 2002, 217; Bermon 2007, 166–167)[^bermon-2007][^biard-1989][^libera-2002]. The second interpretation builds on Gregory’s claim that there are senses of “something” (*aliquid*), “thing” (*res*) and “being” (*ens*) that can apply to the *complexe significabile*, and insists that the *complexe significabile* must be something mind-independent because of this, although it is not an entity (Elie 1936, 28, 174; Nuchelmans 1973, 73)[^elie-1936][^nuchelmans-1973]. The third interpretation concludes from the fact that the *complexe significabile* is said to be something but not an entity to the fact that the *complexe significabile* must be mind-dependent or in the mind (Trapp 1977, 58; Mandrella 2016, 208, as a legitimate hypothesis)[^mandrella-2016][^trapp-1977]. Another point of debate concerns how one should evaluate Gregory’s take on Wodeham’s ideas. That debate opposes those who consider Gregory’s developments as a clearer elaboration of the concept (Bermon 2007, 169, 173)[^bermon-2007], and those who believe Gregory blurred the clear picture Wodeham had given, thus making the doctrine of the *complexe significabile* an easy target (Gàl 1977, 70; Nuchelmans 1980, 185–186; Zupko 1994–1997, 218)[^nuchelmans-1980][^zupko-1994].
    step1: |-
      格里高利采纳了沃德汉姆的理论，并在必要处按自己的思想加以剪裁。*complexe significabile*曾被认作格里高利的发明，它既不是命题本身，也不是世界中的个别事物，也不是世界中事物的排列。格里高利之*complexe significabile*的确切地位曾引起大量讨论。简言之，主要有三种解释。第一种依据格里高利关于*complexe significabile*是虚无（*nihil*）的主张，因而认为格里高利并不捍卫逻辑实在论（Biard 1989, 183, Libera 2002, 217; Bermon 2007, 166–167）[^bermon-2007][^biard-1989][^libera-2002]。第二种解释依据格里高利关于“某物”（*aliquid*）、“事物”（*res*）与“存在者”（*ens*）都有些含义可适用于*complexe significabile*的主张，并据此坚持*complexe significabile*必定是某种心灵独立的东西，尽管它不是实体（Elie 1936, 28, 174; Nuchelmans 1973, 73）[^elie-1936][^nuchelmans-1973]。第三种解释从*complexe significabile*被说成是某物而非实体这一事实，推出它必定依赖心灵或存在于心灵之中（Trapp 1977, 58; Mandrella 2016, 208，作为一项合理假设）[^mandrella-2016][^trapp-1977]。另一争论之点是如何评价格里高利对沃德汉姆思想的处理。这场争论的一方认为格里高利的发展是对该概念的更清晰阐发（Bermon 2007, 169, 173）[^bermon-2007]，另一方则认为格里高利模糊了沃德汉姆给出的清晰图景，从而使*complexe significabile*学说易于成为攻击靶子（Gàl 1977, 70; Nuchelmans 1980, 185–186; Zupko 1994–1997, 218）[^nuchelmans-1980][^zupko-1994]。
