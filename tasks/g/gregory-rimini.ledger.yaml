      In many ways Gregory was a philosopher’s theologian, because he began with propositions from Scripture as premises for his arguments and proceeded deductively (Brown 1998b, 200–201)[^brown-1998b]. In his deductive theology, Gregory devoted much time and space to defining his terms and exploring exhaustively the implications of possible solutions, a practice that makes his *Sentences* commentary a joy to read and a philosophical classic.
