      Inspired by some of Ockham’s successors, Gregory argues against the Venerable Inceptor’s claim that via intuitive cognition one could determine whether a thing does exist or not (Tachau 1988, 363)[^tachau-1988]. In agreement with Auriol against most contemporaries, however, Gregory also holds that one can have an intuitive cognition of an object that does not exist, as for example when we see a “broken” pencil in a glass of water, when there is only an unbroken pencil in reality. But Auriol is wrong in claiming that this is an instance of an intuitive cognition of something absent (Tachau 1988, 361)[^tachau-1988], because for Gregory the cognition is really caused by the species of some present object, although perhaps not the object that the mind thinks it is. Therefore Gregory does not adopt Auriol’s definition of intuitive cognition as the cognition when the soul merely thinks that the object is present. In any case the dichotomy is different for Gregory because he maintains that abstractive cognition is also somewhat intuitive, since the species of the object is known immediately and therefore intuitively.
