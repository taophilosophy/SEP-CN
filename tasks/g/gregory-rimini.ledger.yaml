      ## 2 在哲学史上的位置
  - id: 8
    kind: body
    source: |-
      Although Gregory of Rimini has received considerable attention from historians of medieval thought, understanding his position in the history of philosophy has been made difficult by several problems that have plagued the historiography of fourteenth-century scholasticism. He flourished at a time that has been judged by historians as on the whole decadent, fideistic, and radically skeptical, in contrast to the period in which, for example, Thomas Aquinas worked (d. 1274); this historical viewpoint already made difficult an objective evaluation of Rimini. Historians also labeled Gregory a “nominalist,” a term so broad and vague when applied to fourteenth-century thinkers that, when it was used without qualification, it tended to mislead and to obscure the differences among them, as for example between Ockham and Gregory. Finally, unlike Aquinas, Henry of Ghent, and John Duns Scotus, Gregory was active in a relatively understudied period, so that placing Gregory in his context is difficult and statements about Gregory’s originality are precarious. The history of Gregory’s own University of Paris in the quarter century before his *Sentences* lectures, in contrast to that of Oxford in the same years, is particularly unclear. Few scholars realize, moreover, that from the 1330s until the onset of the Great Schism in 1378, decades when the traditional leaders of European thought, the Franciscans and Dominicans, were in decline, Gregory was the leading light in an era in which his own Augustinian Order dominated, with such towering figures as Thomas of Strasbourg, Alphonsus Vargas of Toledo, and Hugolino of Orvieto, and a number of other important authors. Only careful diachronic studies of specific philosophical problems can provide a precise picture of Gregory’s role in the history of philosophy, and few such studies have been accomplished thus far. There are some, however, and natural philosophy, epistemology, foreknowledge, and predestination are examples of topics about which we know quite a bit (see below).
    step1: |-
      尽管里米尼的格里高利从中世纪思想史家那里获得了相当多的关注，理解他在哲学史上的位置却因若干长期困扰十四世纪经院哲学史编纂的问题而变得困难。他活跃于一个被史家整体判为衰颓、信仰主义与激进怀疑的时代，这与例如托马斯·阿奎那（卒于 1274 年）工作的时期形成对照；这种历史观点本身就使对里米尼的客观评价变得困难。史家还把格里高利标为“唯名论者”，这一术语用于十四世纪思想家时极为宽泛模糊，不加限定地使用往往会误导并遮蔽他们之间的差异，例如奥卡姆与格里高利之间的差异。最后，与阿奎那、根特的亨利和约翰·邓·司各脱不同，格里高利活动的时期研究得相对不足，因此把他置于其语境中颇为困难，关于格里高利原创性的论断也就难以成立。格里高利自己所属的巴黎大学在他《箴言四书》讲授之前四分之一世纪的历史，与同期牛津大学的历史相比，尤其不清楚。此外，很少有学者意识到，从 1330 年代直到 1378 年大分裂开始，在这几十年间，欧洲思想的传统领袖方济各会与多明我会衰落，而格里高利是其自身奥古斯丁会主导时代中的领衔人物，与他并世的还有斯特拉斯堡的托马斯、托莱多的阿方索·巴尔加斯、奥尔维耶托的乌戈利诺等巨擘以及若干其他重要作者。只有对具体哲学问题作细致的历时研究，才能精确描绘格里高利在哲学史上的角色，而迄今完成的研究寥寥无几。不过确实有一些这样的研究，自然哲学、认识论、预知与预定就是我们知道得相当多的题目（见下文）。
    step2: |-
      尽管里米尼的格里高利受到了中世纪思想史家的相当关注，但要理解他在哲学史上的位置却颇为不易，因为研究十四世纪经院哲学的历史编纂本身存在若干难题。他活跃的时代被史家判定为整体上衰颓、信仰主义且激进怀疑的时代——与托马斯·阿奎那（卒于 1274 年）等人所处的时期形成对照；这一历史观点本身已使对里米尼的客观评价变得困难。史家还给格里高利贴上“唯名论者”的标签；这个术语用于十四世纪思想家时含义既宽泛又模糊，一旦不加限定地使用，往往会造成误解，并掩盖他们之间的差异，例如奥卡姆与格里高利之间的差异。最后，与阿奎那、根特的亨利和约翰·邓·司各脱不同，格里高利活动的时期相对缺乏研究，因此要把他放回其语境中颇为困难，而关于其原创性的论断也就难有把握。格里高利自己所属的巴黎大学在其《箴言四书》讲授之前四分之一世纪的历史，与同期的牛津大学相比尤其不清楚。此外，很少有学者意识到：从 1330 年代直到 1378 年大分裂开始，在这几十年间，欧洲思想的传统领袖方济各会与多明我会正走向衰落，而格里高利却是他所属奥古斯丁会主导时代中最耀眼的明星，与他并世的还有斯特拉斯堡的托马斯、托莱多的阿方索·巴尔加斯、奥尔维耶托的乌戈利诺等巨擘以及若干其他重要作者。只有对具体哲学问题作细致的历时研究，才能精确描绘格里高利在哲学史上的角色，而迄今完成的研究寥寥无几。不过确实有一些，自然哲学、认识论、预知与预定就是我们知道得相当多的题目（见下文）。
