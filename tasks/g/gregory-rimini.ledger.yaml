      Gregory’s approach to trinitarian questions has been described as one of “radical minimalism” (Friedman 2013, 847)[^friedman-2013]. Like Walter Chatton, Robert Holkot and William of Rubio before him, Gregory adopts Praepositinianism: the divine persons are distinct by themselves, they are not constituted, and there are no properties distinct from the persons. As a result, divine simplicity is preserved, at the expense of explanation (Friedman 2013, 853–854)[^friedman-2013]. In this context, Gregory ’s trinitarian theology is radically minimalist because he went further than other defenders of Praepositinianism (Friedman 2013, 867)[^friedman-2013] in thoroughly rejecting any principle of divine operations, therefore clearly dismissing what Friedman calls the “psychological model,” according to which the intellect and the will, as divine attributes, would play the part of such principles.
    step1: |-
