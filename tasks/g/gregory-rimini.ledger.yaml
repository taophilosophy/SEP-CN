      In general, Gregory’s answer to the problem of the intension and remission of forms (i.e. how to account for increases or decreases of a given quality) had a life of its own, since it circulated as a separate treatise, the *Tractatus de intensione et remissione formarum corporalium* (Loewe 2014, 274)[^loewe-2014]. Gregory argued that when intension occurs, a form of the same species is added to the subject, so that this new form and the preceding form now constitute a total form that has per se unity (Loewe 2014, 286, 316)[^loewe-2014].
    step1: |-
      总体上，格里高利对形式的增强与减弱问题（即如何解释某一给定性质的增减）的回答有其自身的生命力，因为它作为独立论著《论形体形式的增强与减弱》（*Tractatus de intensione et remissione formarum corporalium*）流传（Loewe 2014, 274）[^loewe-2014]。格里高利主张，当增强发生时，一个同种的形式被添加到主体上，于是这一新形式与先前的形式现在构成一个具有自在本体统一性（per se unity）的总形式（Loewe 2014, 286, 316）[^loewe-2014]。
