      Not surprisingly, Gregory’s ideas are often Augustinian. Gregory’s brand of doctrinal Augustinianism, influenced rather by the Franciscan and Oxonian tradition than the more Dominican (and Parisian) variety of Giles of Rome, soon dominated the Augustinian Hermits’ philosophy and theology. Thus by the early 16th century *Aegidistae* and *Gregoriistae* schools of thought existed, and a recognized *via Gregorii* was present in many universities such as Wittenberg, the university of Gregory’s fellow Augustinian Hermit Martin Luther (McGrath 1987)[^mcgrath-1987]. The fact that Gregory’s extreme Augustinian views on predestination became virtually official doctrine at the University of Vienna, and each book of his *Sentences* commentary was printed six times between 1482 and 1532, further helps explain why some of Gregory’s ideas often resemble those of Luther and Jean Calvin. Gregory’s thought had a life after the reformation, perhaps influencing Francisco Suarez, but certainly having an impact on seventeenth-century debates over such topics as predestination.
    step1: |-
      并不奇怪，格里高利的思想常常是奥古斯丁式的。格里高利那种教义上的奥古斯丁主义，受方济各会与牛津传统的影响多于受罗马的吉莱斯那种更偏多明我会（也更巴黎）的变体的影响，很快就主导了奥古斯丁隐修会的哲学与神学。因此到十六世纪初，出现了埃吉迪派（*Aegidistae*）与格里高利派（*Gregoriistae*）的思想流派，而一条公认的*via Gregorii*（格里高利之道）出现在维滕贝格等许多大学，那里是格里高利的同会会士马丁·路德的大学（McGrath 1987）[^mcgrath-1987]。格里高利关于预定的极端奥古斯丁主义观点在维也纳大学几乎成为官方学说，他的《箴言四书注》每一卷在 1482 至 1532 年间印行六次，这些事实进一步有助于解释为什么格里高利的某些思想常常类似于路德和让·加尔文的思想。格里高利的思想在宗教改革之后仍有生命，也许影响了弗朗西斯科·苏亚雷斯，但肯定影响了十七世纪关于预定等题目的论争。
    step2: |-
      毫不奇怪，格里高利的思想往往带有奥古斯丁色彩。格里高利那种教义上的奥古斯丁主义，受方济各会与牛津传统的影响多于受罗马的吉莱斯那种更偏多明我会（也更巴黎）的变体的影响，很快主导了奥古斯丁隐修会的哲学与神学。于是到十六世纪初，出现了埃吉迪派（*Aegidistae*）与格里高利派（*Gregoriistae*）两个思想流派，而一条公认的“格里高利之道”（*via Gregorii*）见于维滕贝格等许多大学——维滕贝格正是格里高利的同会会士马丁·路德所属的大学（McGrath 1987）[^mcgrath-1987]。格里高利关于预定的极端奥古斯丁主义观点在维也纳大学几乎成为官方学说，其《箴言四书注》每一卷都在 1482 至 1532 年间印行六次；这些事实进一步说明，为什么格里高利的某些思想常常与路德和让·加尔文相似。格里高利的思想在宗教改革之后仍有其生命，或许影响了弗朗西斯科·苏亚雷斯，但肯定影响了十七世纪关于预定等题目的论争。
