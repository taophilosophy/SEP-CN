      Perhaps the most central element of Gregory of Rimini’s thought and influence is his adherence to Augustine and the nature of that adherence. For one thing, Gregory simply read Augustine more carefully and extensively than most previous thinkers, and so, for example, Gregory was able to attack Peter Auriol for his faulty citations and quotations of Augustine. Gregory’s interest in the works of Augustine has been seen as central to the development of a “historico-critical” method in philosophical theology, especially in the Augustinian Order, partly foreshadowing modern scholarly methods. In connection with this historico-critical method, Gregory was part of a general attempt to establish reliable texts of Augustine and to separate authentic works from the pseudo-Augustinian corpus. Quotations from Augustine, moreover, were cited with great accuracy and detail in Gregory’s writings, and so his *Sentences* commentary, when not plagiarized for his own ideas, was often used as a source for Augustinian quotations (Trapp 1956)[^trapp-1956].
    step1: |-
      也许里米尼的格里高利思想与影响最核心的要素，是他对奥古斯丁的依循以及这种依循的性质。一方面，格里高利读奥古斯丁就是比先前多数思想家更仔细、更广泛，因此例如他能够攻击彼得·奥雷奥利对奥古斯丁的错误引用与征引。格里高利对奥古斯丁著作的兴趣被视为哲学神学中“历史-批判”方法发展的核心，尤其在奥古斯丁会内，部分地预示了现代学术方法。与这种历史-批判方法相联系，格里高利参与了一项普遍的努力：确立奥古斯丁的可靠文本，并把真作与伪奥古斯丁文集区分开来。此外，格里高利著作中引用奥古斯丁时极为准确详尽，因此他的《箴言四书注》在未被剽窃其自身观点时，常被用作奥古斯丁引文的来源（Trapp 1956）[^trapp-1956]。
