      In distinctions 38–41 of book I, Gregory tackled the general problem of divine foreknowledge and future contingents and the specific dilemma of predestination and free will. Gregory’s positions on these questions have already been the subject of study for many decades, and recently historians have attempted to put Gregory into his immediate Parisian and Oxonian context. Moreover, Gregory’s nickname, “the Torturer of Infants,” stems in part from his stance on predestination. A discussion of Gregory’s thought on these issues, therefore, provides a convenient introduction both to his noetic and to his position in history.
