      A list of Gregory’s philosophical positions would perhaps not be difficult to make, and neither would it be hard to describe his relation to Ockham on various topics (e.g. Smith 1999, Mandrella 2016)[^mandrella-2016][^smith-1999]. In natural philosophy, for example, in agreement with Ockham, Gregory was a nominalist and employed “Ockham’s” razor in denying that sudden change, motion, and time are independent entities (Brown 1998b)[^brown-1998b]. Gregory also claims that the world could have been eternal. But in this case one would like to know better the stances of Gregory’s immediate predecessors, especially Parisians like Francis of Marchia, in order to determine the possible sources and degree of originality of Gregory’s ideas. On the eternity of the world, for example, Gregory’s view was not very strange in his day. Otherwise, a list of Gregory’s ideas is just that, a mere list. Consequently the focus here shall be on a few of the issues on which the theories of Gregory and his predecessors have been investigated in some depth.
