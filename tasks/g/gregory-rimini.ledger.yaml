      一般地说，迄今所知的是，格里高利实际上是第一个把奥卡姆的威廉（约 1319 年）与托马斯·布拉德沃丁（约 1344 年）之间在英国各学派发展起来的激动人心的思想引入巴黎大学的人。自格里高利开始，亚当·德·沃德汉姆、理查德·菲茨拉尔夫、沃尔特·查顿、威廉·海特斯伯里、托马斯·白金汉、理查德·基尔文顿、罗伯特·哈利法克斯等人的名字才成为巴黎学者的常识。格里高利还深受他自己大学晚近思想家的深刻影响，既有反面也有正面。彼得·奥雷奥利影响之大久已被承认，但晚近研究已清楚表明，其他人物如马尔基亚的弗朗西斯、斯特拉斯堡的托马斯、杰拉德·奥多尼斯与马萨的米凯莱，也对格里高利有影响。格里高利与其巴黎前辈的关系问题需要更充分的研究。
