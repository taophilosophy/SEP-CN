      In 2008, Romana Martorelli Vico published the first critical edition of Giles’ *De formatione corporis humani in utero*. With this work, completed between 1285 and 1295, Giles took a stance in the much debated question of the respective roles of male and female parents in conception. The Galenist view, going back to Hippocrates, was that both male and female contributed sperm, so that the offspring could have characteristics from both parents. On the contrary, Aristotle had held that only the male alone contributed sperm containing an active and formal principle to conception, while the female provided only the matter of the fetus. Giles was well acquainted with these different positions and with the efforts to reconcile the diverging approaches of *medici* and *philosophi*, which could be traced back to Avicenna. Leaning on Averroes’ *Colliget*, however, Giles rejected any attempt to attribute a formal role to the female sperm, even if it is conceived as subordinate to the male one. On the contrary he maintained that it can contribute only in a passive way to conception, while what was called “female sperm”, i.e., the vaginal secretion, has a subservient, helpful but by no means necessary function. It helps the male sperm to inseminate female matter, but does not add anything essential to the new being. In this way, Giles intended to stress the superiority of the philosophical, theoretical approach to such problems with respect to the traditions of medical learning, even when the latter seemed to be supported by empirical evidence (Hewson 1975; Martorelli Vico 1988)[^hewson-1975][^martorelli-1988]. Empirical evidence such as the resemblance of the offspring to the mother was e.g., explained away as an example of stronger resistance of female matter to the action of form (Martorelli Vico 2002)[^martorelli-2002]. After conception the human embryo begins a development which goes through different stages. Comparing these stages to the embryos of various animals Giles, like Thomas Aquinas, supported an interpretation of the fetal development which would be exploited many centuries later by the so-called “recapitulation theory” (Hewson 1975, 99)[^hewson-1975]. Giles maintained, however, that “the organic fetal body is not to be called a pig, a bear, or a monkey, but something immediately disposed to becoming man” (Hewson 1975, 100)[^hewson-1975]. This position apparently implies that human life does not fully begin at the moment of conception. Although such a thesis can be brought to bear on the moral judgment concerning abortion, Giles does not seem interested in tackling from this point of view an issue which would become central for what nowadays is called bioethics.
    step1: |-
      2008 年，Romana Martorelli Vico 出版了吉尔斯《论人体在子宫中的形成》的第一个校勘本。在这部完成于 1285 至 1295 年间的著作里，吉尔斯就当时争论甚烈的父母双方在受孕中的各自作用问题表明了立场。盖伦派的看法可追溯到希波克拉底：男女双方都贡献精液，所以后代可以带有双亲的特征。亚里士多德则相反，认为只有男方贡献含有主动、形式性原理的精液；女方只提供胎儿的质料。吉尔斯熟悉这些不同立场，也熟悉调和 *medici*（医学家）与 *philosophi*（哲学家）分歧的种种努力——这些努力可追溯到阿维森纳。然而，倚重阿威罗伊的《医典总汇》，吉尔斯拒斥任何赋予女方精液以形式作用的尝试，即便设想它从属于男方精液。他相反地主张，女方精液只能被动地参与受孕；所谓“女方精液”，即阴道分泌物，只有辅助、助益的作用，绝非必要。它帮助男方精液使女方质料受孕，却不给新存在者增添任何本质之物。吉尔斯以此强调，在这类问题上，哲学的理论取径优于医学传统，即便后者似乎得到经验证据的支持（Hewson 1975; Martorelli Vico 1988）[^hewson-1975][^martorelli-1988]。比方说，后代肖似母亲这类经验证据，便被解释为女方质料较强地抵抗形式作用的例子（Martorelli Vico 2002）[^martorelli-2002]。受孕之后，人的胚胎开始经历不同阶段的发展。吉尔斯把这些阶段与各种动物的胚胎相比，同托马斯·阿奎那一样，支持一种对胎儿发育的解释——许多世纪之后，这种解释被所谓“重演论”所利用（Hewson 1975, 99）[^hewson-1975]。然而吉尔斯主张，“有机的胎儿身体不应被称为猪、熊或猴，而应立即趋向成为人的东西”（Hewson 1975, 100）[^hewson-1975]。这一立场显然意味着：人的生命并不在受孕时刻完全开始。这一论点固然可用于关于堕胎的道德判断，但吉尔斯似乎无意从这个角度处理这一后来成为所谓生命伦理学核心的问题。
    step2: |-
      2008 年，Romana Martorelli Vico 出版了吉尔斯《论人体在子宫中的形成》（*De formatione corporis humani in utero*）的第一个校勘本。这部著作完成于 1285 至 1295 年间，吉尔斯在其中就当时争论甚烈的问题表明了立场：受孕中父母双方各起什么作用。盖伦派的看法可追溯到希波克拉底：男女双方都贡献精液，故后代可兼具双亲特征。亚里士多德相反，认为只有男方贡献含主动、形式性原理的精液，女方只提供胎儿的质料。吉尔斯熟悉这些立场，也熟悉调和 *medici*（医学家）与 *philosophi*（哲学家）分歧的种种努力——那些努力可追溯到阿维森纳。但他倚重阿威罗伊的《医典总汇》，拒斥任何赋予女方精液以形式作用的尝试，即便设想它从属于男方精液。他主张，女方精液只被动参与受孕：所谓“女方精液”即阴道分泌物，只有辅助、助益之效，绝非必要。它帮男方精液使女方质料受孕，却不给新存在者增添任何本质之物。吉尔斯以此强调，在这类问题上，哲学的理论取径优于医学传统，即便后者似乎有经验证据撑腰（Hewson 1975; Martorelli Vico 1988）[^hewson-1975][^martorelli-1988]。比如后代肖似母亲这类证据，就被解释为女方质料对形式作用较强抵抗之例（Martorelli Vico 2002）[^martorelli-2002]。受孕之后，人的胚胎开始经历不同阶段。吉尔斯把这些阶段与各种动物的胚胎相比，同托马斯·阿奎那一样支持一种胎儿发育解释——许多世纪之后，所谓“重演论”正是借用了这种解释（Hewson 1975, 99）[^hewson-1975]。不过吉尔斯主张，“有机的胎儿身体不应称为猪、熊或猴，而应立即趋向成为人”（Hewson 1975, 100）[^hewson-1975]。这一立场显然意味着：人的生命并不在受孕一刻完全开始。这一论点固然可用于堕胎的道德判断，但吉尔斯似乎无意从这个角度处理这一后来成为所谓生命伦理学核心的问题。
