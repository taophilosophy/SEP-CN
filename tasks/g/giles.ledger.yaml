    source: |-
      Giles’ prestige decreased after Boniface’ death, and even more with the rise of Clement V to the papal throne. Before being elected pope, Betrand de Got, as archbishop of Bourdeaux, had had serious conflicts with Giles. This unfavorable change, however, did not prevent Giles from playing a significant role in the debates of his time. Around 1305–6 he took part in a commission which examined and condemned the eucharistic doctrine of John of Paris, a former adversary of Giles’ during the conflict between Philip the Fair and Boniface. In the discussions concerning the Templars which eventually led to the suppression of the Order, Giles sided with Philip the Fair, attacking the Templars and devoting a whole tract, *Contra exemptos*, to the thesis that their exemption from episcopal jurisdiction was the cause of their abuses (Jordan 2005)[^jordan-2005]. During the Council of Vienne Giles was asked to draw a list of errors extracted from the works of Peter John Olivi: three of them were officially condemned by the Council. On December 22, 1316 he died at the papal Curia at Avignon (For further details see Del Punta-Donati-Luna 1993, Briggs 2016)[^briggs-2016][^del-1993].
    step1: |-
      卜尼法斯去世后，吉尔斯的声望下降；克莱门特五世登上教宗宝座后更是如此。当选教宗之前，贝特朗·德戈作为波尔多大主教曾与吉尔斯有过严重冲突。然而这一不利变化并未妨碍吉尔斯在当时的辩论中起显著作用。约 1305–6 年，他参加了一个委员会，审查并谴责巴黎的约翰的圣体学说；此人在美男子腓力与卜尼法斯的冲突中是吉尔斯的旧对手。在关于圣殿骑士团的讨论中（这些讨论最终导致该修会被取缔），吉尔斯站在美男子腓力一边，攻击圣殿骑士团，并写了一整篇论文《驳豁免》，论证他们免受主教管辖正是其弊端之因（Jordan 2005）[^jordan-2005]。维耶纳会议期间，吉尔斯受命从彼得·约翰·奥利维的著作中摘出一份错误清单：其中三条被会议正式谴责。1316 年 12 月 22 日，他死于阿维尼翁教廷（详见 Del Punta-Donati-Luna 1993, Briggs 2016）[^briggs-2016][^del-1993]。
    step2: |-
      卜尼法斯去世后，吉尔斯的声望下降；克莱门特五世登上教宗宝座后更是如此。贝特朗·德戈在当选教宗之前，曾以波尔多大主教的身份与吉尔斯严重冲突。但这一不利变化并未妨碍吉尔斯在当时的辩论中发挥显著作用。约 1305–6 年，他参加一个委员会，审查并谴责巴黎的约翰的圣体学说——此人正是美男子腓力与卜尼法斯冲突期间吉尔斯的旧对手。在围绕圣殿骑士团的讨论中（这些讨论最终导致该修会被取缔），吉尔斯站在美男子腓力一边，攻击圣殿骑士团，还写了整篇论文《驳豁免》（*Contra exemptos*），论证他们免受主教管辖正是弊端之源（Jordan 2005）[^jordan-2005]。维耶纳会议期间，吉尔斯受命从彼得·约翰·奥利维的著作中摘出一份错误清单：其中三条被会议正式谴责。1316 年 12 月 22 日，他死于阿维尼翁教廷（详见 Del Punta-Donati-Luna 1993, Briggs 2016）[^briggs-2016][^del-1993]。
