    source: |-
      Giles of Rome (who died in 1316 as archbishop of Bourges) was one of the most productive and influential thinkers active at the end of the 13th century, who played a major role also in the political events of his time. Giles of Rome was an extremely prolific author and left a very large corpus of writings, encompassing commentaries on Aristotle, theological treatises, questions, and sermons. In the last couple of decades, a research group originally led by the late Francesco Del Punta (Scuola Normale Superiore, Pisa, Italy; died in 2013) has been devoting a lot of energy to the project of publishing his *Opera Omnia* and deepening our knowledge of his thought. Although this group has produced extremely significant results, enriched by the contributions of other scholars, an assessment of Giles’ whole work is still in progress. For this reason, the present entry only aims at providing insight into an ongoing process of research.
    step1: |-
      罗马的吉尔斯（Giles of Rome，1316 年以布尔日大主教身份去世）是十三世纪末最富成果、最具影响的思想家之一，也曾在当时的政治事件中扮演重要角色。吉尔斯是极多产的作者，留下庞大的著作群，包括对亚里士多德的评注、神学论著、问题集与布道文。近二十年来，一个最初由已故的 Francesco Del Punta（意大利比萨高等师范学校；2013 年去世）领导的研究小组投入大量精力，从事出版其《全集》并加深对其思想认识的工作。该小组虽已取得极其重要的成果，又有其他学者补充，但对吉尔斯整个著作的评估仍在进行中。因此，本文只求提供对一项仍在进行的研究过程的了解。
    step2: |-
      罗马的吉尔斯（Giles of Rome，1316 年以布尔日大主教的身份去世）是十三世纪末最富成果、最具影响的思想家之一，也在当时的政治事件中扮演过重要角色。他极多产，留下庞大的著作群，包括亚里士多德评注、神学论著、问题集与布道文。近二十年来，一个最初由已故的 Francesco Del Punta（意大利比萨高等师范学校，2013 年去世）领导的研究小组投入大量精力，出版其《全集》，并加深对其思想的认识。小组已取得极其重要的成果，其他学者也有补充，但评估吉尔斯的全部著作仍是一项进行中的工作。因此，本文只想让读者了解一项仍在推进的研究。
