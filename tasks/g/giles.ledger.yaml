    source: |-
      In 1285, Giles’ doctrine was examined again; after recanting only a part of what had been previously condemned in 1277, he was allowed to teach again; by 1287 he is referred to as a master of theology. His university quodlibeta go back to this period, from the academic year 1285/86 to 1292/93 (Pini 2006, Wielockx 2014)[^pini-2006][^wielockx-2014]. This success enhanced Giles of Rome’s authority even more in his Order, whose general chapter of Florence decreed that Giles’ works (even future ones) should be considered as the official doctrine of the Order, to be defended by all Augustinian bachelors and masters. In 1292, at the General Chapter of Rome he was elected prior general of his Order.
    step1: |-
      1285 年，吉尔斯的学说再度受到审查；他只否弃了 1277 年被谴责内容的一部分，便获准重执教鞭；至 1287 年，他已被称作神学教师。他的大学自由论题辩论即属这一时期，从 1285/86 学年到 1292/93 学年（Pini 2006, Wielockx 2014）[^pini-2006][^wielockx-2014]。这一成功使罗马的吉尔斯在修会中的威望更增；佛罗伦萨总会规定，吉尔斯的著作（连尚未问世的也包括在内）应视为修会的官方学说，全体奥古斯丁派学士与教师都须为之辩护。1292 年，他在罗马总会上当选本会总会长。
    step2: |-
      1285 年，吉尔斯的学说再受审查。他只否弃了 1277 年被谴责内容的一部分，便获准重新执教；到 1287 年，他已被称为神学教师。他的大学自由论题辩论就从这时开始，自 1285/86 学年延续到 1292/93 学年（Pini 2006, Wielockx 2014）[^pini-2006][^wielockx-2014]。这番成功使罗马的吉尔斯在会内威望更盛：佛罗伦萨总会决议，吉尔斯的著作——连尚未写出的也算——即本会官方学说，全体奥古斯丁派学士与教师都须为它辩护。1292 年，他在罗马总会上当选本会总会长。
