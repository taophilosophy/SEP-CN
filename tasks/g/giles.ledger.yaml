      While in the *De regimine* Giles carefully avoids any reference to the thorny problem of the relationship between secular and ecclesiastical power, his later writings which are relevant for political theory deal first and foremost with ecclesiological problems (Lambertini 2016)[^lambertini-2016]. This holds true for his treatise *De renuntiatione papae* (1297–1298) where Giles defends the lawfulness of Celestine’s abdication against the arguments put forward by the Colonna cardinals in their first appeal against Boniface VIII. From the point of view of the history of political thought it is relevant that Giles argues that papal power, although of divine origin, is conferred on a particular individual by a human act, namely, by the election of the cardinals. Here Giles is countering the Colonna arguments that papal dignity cannot cease to reside in a pope until he dies, because the pontificate depends on God’s will, and stresses the fact that divine intention in this case becomes effective through the mediation of human agents, that is, through the consent of the electors and of the elected. A jurisdiction which is given by the consent of men, however, can also be removed by their consent through a reverse procedure. This does not amount to saying that the pope can be deposed (except in case of heresy), because, according to Giles, the pope is above the law and has no earthly authority above him. He can however, depose himself, that is, abdicate. Just as for his election the consent of his electors and of the elected was necessary, so also for the removal of the pope from office his consent is decisive (Eastman 1989, 1990, 1992)[^eastman-1989]. In this way Giles could dismiss arguments against the validity of Celestine’s abdication without admitting the possibility that the pope can be deposed, e. g., by the Council, as Boniface’s adversaries maintained.
    step1: |-
      在《论君主统治》中，吉尔斯小心避开世俗权力与教会权力关系这一棘手问题；而他后期与政治理论相关的著作，首先处理的是教会学问题（Lambertini 2016）[^lambertini-2016]。其《论教宗辞职》（1297–1298）即是如此：吉尔斯在此反驳科隆纳一系枢机在首次上诉卜尼法斯八世时提出的论证，为塞莱斯廷退位的合法性辩护。从政治思想史的角度看，要点在于：吉尔斯论证教宗权力虽源于神，却是通过人的行为、即枢机的选举，授予某一个别个人的。吉尔斯在此反驳科隆纳方面的论点，即教宗尊位在教宗去世之前不能停止属于他，因为教宗职位取决于上帝的意志；他并强调：在此情形下，神的意图正是通过人的代理、即选举者与被选举者的同意，才发生效力。然而，由人的同意授予的管辖权，也可经相反的程序由人的同意撤除。这并不等于说教宗可以被废黜（除异端情形外），因为按吉尔斯，教宗在法律之上，其头上没有属世的权威。但他可以自废，即辞职。正如其当选需要选举者与被选举者的同意，教宗去职时，他的同意也是决定性的（Eastman 1989, 1990, 1992）[^eastman-1989]。吉尔斯就这样排除了反对塞莱斯廷退位合法性的论证，而不承认教宗可被废黜（例如被会议废黜，如卜尼法斯的对手所主张）。
    step2: |-
      在《论君主统治》中，吉尔斯小心避开了世俗权力与教会权力关系这一棘手问题；他后期与政治理论相关的著作，首先处理的则是教会学问题（Lambertini 2016）[^lambertini-2016]。其《论教宗辞职》（1297–1298）即是如此：吉尔斯反驳科隆纳一系枢机初次上诉卜尼法斯八世时提出的论证，为塞莱斯廷退位的合法性辩护。从政治思想史看，要点在于：吉尔斯论证教宗权力虽源于神，却要通过人的行为——枢机的选举——授予某一个别个人。他在这里反驳科隆纳方面的论点，即教宗尊位在教宗死前不能停止属于他，因为教宗职位取决于上帝的意志；他并强调，在此情形下神的意图正是经由人的代理，即选举者与被选举者的同意，才发生效力。然而，由人的同意授予的管辖权，也能经相反的程序由人的同意撤除。这并不等于说教宗可被废黜（异端情形除外），因为按吉尔斯，教宗在法律之上，头上没有属世权威。但他可以自废，即辞职。正如当选需要选举者与被选举者的同意，教宗去职时，他的同意也是决定性的（Eastman 1989, 1990, 1992）[^eastman-1989]。吉尔斯就这样排除了反对塞莱斯廷退位合法性的论证，同时不承认教宗可被废黜（例如被会议废黜，如卜尼法斯的对手所主张）。
