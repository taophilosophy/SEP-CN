      Traditionally, Giles was described as a “faithful” disciple of Aquinas’. Nowadays such a judgment is not accepted by scholars. After Concetta Luna argued persuasively in favor of the authenticity of the *Reportatio*, it became clear that Giles, already in the first stages of his career, develops his positions taking Aquinas’ teaching as a starting point for his own reflection, but criticizes and corrects the doctrines of the Dominican master in many aspects. Luna could also establish that Giles reworked his *Lectura* on the Sentences (handed down to us as a *reportatio*) into an *ordinatio* only for the first two books. However, while the first book was completed shortly after the *Lectura*, that is, during the years 1271–1273, the second book had to wait for completion until 1309. Luna gathered impressive evidence suggesting that the *Ordinatio* of the third book that goes under the name of Giles is, in fact, spurious. Broadly speaking, Giles’ “philosophical project” tends to discuss critically Aquinas’ position in order to improve the solutions he offered, without, however, trying to discard them radically. Recently, Katherine König-Pralong showed that this is the case for the debate about the natural desire for knowledge: although defended in in the context of a discussion with Henry of Ghent, Giles’ position does not coincide with that of Aquinas. According to him, in fact, human beings possess a natural desire for knowledge that is satisfied by a limited understanding of separate substances (König-Pralong 2014). The same holds true also for one of the most famous topics of his discussion with Henry of Ghent, the distinction between “essence” and “existence”. In this case, Giles radicalizes Aquinas’ doctrine of the real distinction, asserting that existence must be conceived as a “*res addita*” [thing added] to essence (Pickavé 2016)[^pickavé-2016]. Although the final result of his theory was considered closer to Avicenna’s solution than to that of Aquinas, Giles nevertheless develops it starting from Aquinas’ own position (Wippel 1981)[^wippel-1981], as emerges already from his Questions on the Metaphysics (Conti 2014)[^conti-2014]. The connection of this issue with the discussion with Henry of Ghent about the concept of “creation” was investigated in depth by Giorgio Pini (1992), who could show how Giles, while defending Aquinas and thereby the possibility of using some Aristotelian principles in an orthodox account of creation, goes beyond the positions of the Dominican master, e. g. asserting the identity of “*esse*” and “*creatio*”(see also Porro 2014, Cross 2016)[^cross-2016][^porro-2014]. Giles advocated the compatibility of Aristotelian doctrine with Christian faith also in his commentary on the short treatise *De bona fortuna* attributed to Aristotle, but in reality consisting in a compilation of passages taken from the *Ethica eudemia* and the *Magna moralia*. The interpretation of the concept of “bona fortuna” in those texts implied problemas connected with contingency, necessity and the interplay between divine causality and natural events. As Valérie Cordonnier (2014) showed, Giles’ solution was attacked by Henry of Ghent as leading to necessitarism.
    step1: |-
      传统上，吉尔斯被描述为阿奎那的“忠实”弟子。如今学界已不接受这一判断。Concetta Luna 令人信服地论证了《报告本》的真实性之后，事情就清楚了：吉尔斯早在生涯初期，便以阿奎那的教导为自身反思的出发点来发展立场，但在许多方面批评并修正这位多明我会大师的学说。Luna 还确认，吉尔斯只把其《箴言四书读本》（传给我们的是《报告本》）的前两卷改写成《订定本》。不过，第一卷在《读本》之后不久即完成，即 1271–1273 年间；第二卷却要等到 1309 年才补成。Luna 汇集了可观的证据，表明归于吉尔斯名下的第三卷《订定本》实为伪作。大体而言，吉尔斯的“哲学规划”倾向于批判地讨论阿奎那的立场，以改进其解答，却不曾试图彻底抛弃它们。晚近 Katherine König-Pralong 表明，关于求知之自然欲的争论即是如此：吉尔斯的立场虽在对根特的亨利的讨论脉络中得到辩护，却与阿奎那不同。在他看来，人拥有求知之自然欲，而这一欲望由对分离实体的有限理解所满足（König-Pralong 2014）。他与根特的亨利争论中最著名的话题之一“本质”与“存在”之别，亦然。在此，吉尔斯把阿奎那的实在区分学说推向极端，主张必须把存在设想为加在本质之上的“*res addita*”（附加之物）（Pickavé 2016）[^pickavé-2016]。尽管其理论的最终结果被认为更近于阿维森纳而非阿奎那，吉尔斯毕竟是从阿奎那自身立场出发加以发展的（Wippel 1981）[^wippel-1981]，这一点已见于其《形而上学问题集》（Conti 2014）[^conti-2014]。Giorgio Pini（1992）深入考察了此问题与他和根特的亨利关于“创造”概念之争的关联，表明吉尔斯在捍卫阿奎那、从而捍卫在正统创造论中使用某些亚里士多德原理之可能的同时，又越出了这位多明我会大师的立场，例如断言“*esse*”（存在）与“*creatio*”（创造）同一（另见 Porro 2014, Cross 2016）[^cross-2016][^porro-2014]。吉尔斯在其对短论《论好运》的评注中同样主张亚里士多德学说与基督教信仰相容；该文虽归于亚里士多德，实为摘自《欧德米亚伦理学》与《大伦理学》诸段的汇编。那些文本中“好运”概念的解释，牵涉偶然性、必然性以及神性因果与自然事件相互作用的问题。如 Valérie Cordonnier（2014）所表明，吉尔斯的解答被根特的亨利攻击为导致必然论。
