      Relying on manuscript evidence and other sources, Giorgio Pini (2005) could identify which kind of theological and philosophical works Giles read, studied and had copied for himself during his long intellectual career. Pini distinguishes three main periods. In the first one, before 1277, quite unsurprisingly, he reads Aquinas (not only the Commentary on the Sentences of the Dominican master, but also his later works), Aristotle (e. g. in these years Giles owns and annotates a copy of the *Nicomachean Ethics*), Avicenna and Averroes. He is also very well acquainted with the works of Ps. Denis the Aeropagite. In the second period (1277–1285), when forced to leave the academic milieu, Giles widens his interests. He studies many works of Anselm’s (while most theologians of his time were very selective in their knowledge of this author), and makes acquaintance with works by Augustine, such as Confessions and *Soliloquia*, that were quite unusual readings for an academic theologian. In the this period (from his return to the Parisian Faculty of Theology [1285] to his death) Giles studies almost entirely the available works by Augustine and acquires also rare treatises by Proclus. Giles’ increasing attention for Augustine is mirrored in his mature works and will influence also the theological orientation of his own Order in the following decades (Pini 2012)[^pini-2012].
    step1: |-
      Giorgio Pini（2005）依据抄本证据与其他材料，辨认出吉尔斯在其漫长的学术生涯中读过、研究过并命人抄录给自己的是哪一类神学与哲学著作。Pini 区分出三个主要时期。第一期在 1277 年之前，他读阿奎那（不仅是这位多明我会大师的《箴言四书注》，还有其后期著作）、亚里士多德（例如这些年里吉尔斯拥有一部《尼各马可伦理学》并加批注）、阿维森纳与阿威罗伊，这毫不奇怪。他还十分熟悉伪亚略巴古的狄奥尼修斯的著作。第二期（1277–1285），被迫离开学术圈之际，吉尔斯的兴趣扩展：他研读安瑟伦的许多著作（当时多数神学家对这位作者所知甚为挑选），并接触到奥古斯丁的《忏悔录》《独语录》之类对学院神学家而言相当罕见的读物。在此期（从他 1285 年重返巴黎神学院到去世），吉尔斯几乎通读当时可见的奥古斯丁全部著作，还获得普罗克洛斯一些稀见的论著。吉尔斯对奥古斯丁日益增长的关注见于其成熟著作，也将影响此后数十年本会的神学取向（Pini 2012）[^pini-2012]。
    step2: |-
      Giorgio Pini（2005）依据抄本与其他证据，辨清了吉尔斯在漫长学术生涯中读过、研究过、并命人抄给自己的是哪些神学与哲学著作。他划出三个主要时期。第一期在 1277 年之前：毫不奇怪，吉尔斯读阿奎那（不止这位多明我会大师的《箴言四书注》，还有其后期著作）、亚里士多德（这些年他拥有一部《尼各马可伦理学》并加批注）、阿维森纳与阿威罗伊，还十分熟悉伪亚略巴古的狄奥尼修斯。第二期（1277–1285），被迫离开学术圈，他的兴趣反而扩展：他研读安瑟伦的许多著作（当时多数神学家对这位作者只择要了解），并接触到奥古斯丁的《忏悔录》《独语录》——对学院神学家来说相当罕见的读物。第三期从 1285 年重返巴黎神学院直到去世：他几乎通读了当时可见的奥古斯丁全部著作，还得到普罗克洛斯一些稀见的论著。吉尔斯对奥古斯丁日益增长的关注，见于其成熟著作，也影响了此后数十年本会的神学取向（Pini 2012）[^pini-2012]。
