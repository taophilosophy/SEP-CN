      After René Antoine Gauthier identified in the master Guillaume Arnauld the real author of the *Lectura supra logicam veterem* attributed to Giles of Rome (Tabarroni 1988)[^tabarroni-1988], interest in logical works focused mainly on his Commentaries on the *Sophistici Elenchi* and on *Posterior Analytics*. In his treatment of the *fallacia figurae dictionis* Giles proves to be a brilliant and original representative of “modistic logic”, who bases his solutions mainly on the semantics of *intentiones* (Tabarroni 1991)[^tabarroni-1991]. This does not imply, however, that he always agrees with the Modists. One of the most relevant disagreements regards signification. He doesn’t think that signification is the essential form of the linguistic sign. On the contrary, sharing a much more widespread view in his times, to him, the signification of *e.g.* a name is a concept (or more precisely a definition), which in turn signifies the thing. This signification is not natural, but conventional. The linguistic sign signifies in a natural way only its mental image, which is essential to human acts of speech (Marmo 2016, 2020)[^marmo-2016]. Giles’s philosophy of language is developed in his discussions regarding the nature of communication among angels (Suarez-Nani 2002, Rosier-Catach 2020)[^rosier-catach-2020][^suarez-nani-2002]. Alessandro Conti (1992) investigated Giles’ Commentary on *Posterior Analytics* as an example of his theory of truth, which brings to completion Aquinas’ shift from Augustine’s influence to the Aristotelian approach. Bertagna (2002–2004) investigated the structure of this commentary, while Longeway (2002) and Corbini (2002) drew scholars’ attention to Giles’ epistemic logic. Giles of Rome also authored the most important Commentary on the Rhetoric of the Latin medieval tradition, which earned him the honorific title of *expositor* of this book and influenced all later medieval commentaries. Costantino Marmo studied Giles’ approach to the different translations to which he had access and showed how he developed Aquinas’ theory of passions in commenting on the relevant portions of Aristotle’s text (Marmo 1991)[^marmo-1991], trying to solve some problems left open by Aquinas. It has been suggested that Giles considers rhetoric to be a sort of “logic” of ethics and politics: this brilliant interpretation needs, however, further development and articulation (Staico 1992)[^staico-1992]. Janet Coleman (2000) also maintained that Aristotle’s rhetorical method determines the substance of Giles’ *De regimine principum*, but one should also take into account also Lidia Lanza’s (2001) remarks. Marmo (2016) pointed out that if rhetoric is the *modus sciendi* more apt to moral sciences, this does not imply that it contributes to moral or political knowledge, since this is derived from the principles proper of ethics or politics.
    step1: |-
      René Antoine Gauthier 认定《旧逻辑读本》的真正作者是教师 Guillaume Arnauld 而非罗马的吉尔斯（Tabarroni 1988）[^tabarroni-1988] 之后，对吉尔斯逻辑著作的兴趣主要集中在其《辩谬篇》评注与《后分析篇》评注上。在处理 *fallacia figurae dictionis*（辞格谬误）时，吉尔斯证明自己是“摩迪斯泰逻辑”出色而独创的代表，其解答主要建立在 *intentiones*（意向）的语义学之上（Tabarroni 1991）[^tabarroni-1991]。但这并不意味着他总与摩迪斯泰派一致。最相关的分歧之一涉及指号（signification）：他不认为指号是语言符号的本质形式。相反，他持当时远为普遍的观点：例如一个名称的指号是一个概念（更确切说是一个定义），概念再指号事物。这种指号不是自然的，而是约定的。语言符号只以自然方式指号其心灵影像，而这对人类言语行为是本质性的（Marmo 2016, 2020）[^marmo-2016]。吉尔斯的语言哲学展开于他关于天使之间交流之性质的讨论（Suarez-Nani 2002, Rosier-Catach 2020）[^rosier-catach-2020][^suarez-nani-2002]。Alessandro Conti（1992）把吉尔斯的《后分析篇》评注作为其真理理论的一个例证来研究——该理论完成了阿奎那从奥古斯丁影响向亚里士多德取径的转向。Bertagna（2002–2004）研究这部评注的结构，Longeway（2002）与 Corbini（2002）则提请学界注意吉尔斯的认知逻辑。罗马的吉尔斯还著有拉丁中世纪传统中最重要的《修辞学》评注，由此赢得该书 *expositor*（诠释者）的荣衔，并影响了此后所有中世纪评注。Costantino Marmo 研究了吉尔斯对他所能见到的各种译本的取径，并表明他如何在评注亚里士多德文本相关部分时发展阿奎那的情感理论（Marmo 1991）[^marmo-1991]，试图解决阿奎那遗留的一些问题。有人提出，吉尔斯把修辞学视为伦理与政治的某种“逻辑”：这一精彩解释仍需进一步展开与阐明（Staico 1992）[^staico-1992]。Janet Coleman（2000）也主张，亚里士多德的修辞方法决定了吉尔斯《论君主统治》的实质，但也应顾及 Lidia Lanza（2001）的意见。Marmo（2016）指出：即便修辞学是更适合道德科学的 *modus sciendi*（认知方式），这也不意味着它有助于道德或政治知识，因为后者源出于伦理或政治自身的原理。
