      Giles’ account of knowledge is indebted to Aquinas, but, again, reveals many original features. In the first place, he insists on a strictly causal interpretation — be it direct or via a medium — of the cognitive process, both at the level of sensory and intellectual acts (Trifogli 2020)[^trifogli-2020]. Secondly, the Augustinian master doesn’t conceive of the role of “intelligible species” or *formales expressiones* as he often writes, as essential to the process of cognition in itself. As Giorgio Pini (2016) has shown, the intelligible species is necessary only when the object cannot be present in the intellect directly. Admittedly, this direct presence is possible only in the beatific vision (after death) and most probably in the cognition angels have of themselves. For human knowledge in this life, on the contrary, intelligible species fulfill a necessary function, as causal proxies, as Pini (2016) writes, mediating between the object and the cognitive power. Difficulties for Giles’ account emerge especially when it comes to defining the ontological status of the species. The interpretation of cognition in terms of causation seems in fact to imply, according to Giles’ own presuppositions, that the species belongs to the same kind of the thing it represents. On the other hand, the intelligible species is in the intellect, and this presence is explained in terms of inherence of an accident (the species) in a substance. Giles himself is aware of this difficulty, since in one passage he claims that such species are in themselves neither substances nor accidents. They can, however, be “reduced” to the kind to which the represented thing belongs. Pini (2016) is right in pointing out that Giles’ answer seems to raise more problems than it can solve.
    step1: |-
      吉尔斯的知识论受惠于阿奎那，但同样显出许多原创特征。首先，他坚持对认知过程作严格因果的解释——无论直接还是经由中介——感官行为与理智行为皆然（Trifogli 2020）[^trifogli-2020]。其次，这位奥古斯丁派大师不把“可理解种相”或他常写的 *formales expressiones*（形式表达）视为认知过程本身所必需。如 Giorgio Pini（2016）所表明，只有当对象不能直接呈现在理智中时，可理解种相才属必要。诚然，这种直接呈现只可能见于荣福直观（死后），且极可能见于天使对自身的认识。反之，对于此生的人类知识，可理解种相起着必要作用：按 Pini（2016）的说法，它们作为因果替代物，在对象与认知能力之间起中介作用。吉尔斯说明的困难，尤其在界定种相的本体论地位时浮现。依吉尔斯自己的前提，用因果来解释认知，似乎就意味着种相与它所代表之物属于同一类。另一方面，可理解种相在理智之中，而这种在场被解释为一个偶性（种相）内在于一个实体。吉尔斯本人也意识到这一困难，因为他在一处声称这类种相本身既非实体也非偶性；不过它们可以“归入”其所代表之物所属的类。Pini（2016）说得对：吉尔斯的回答似乎引出的问题比它能解决的还多。
    step2: |-
      吉尔斯的知识论受惠于阿奎那，却也显出许多原创特征。第一，他坚持对认知过程作严格因果的解释，无论直接还是经由中介，感官行为与理智行为皆然（Trifogli 2020）[^trifogli-2020]。第二，这位奥古斯丁派大师不把“可理解种相”——他常写作 *formales expressiones*（形式表达）——视为认知过程本身所必需。如 Giorgio Pini（2016）所表明，只有当对象不能直接呈现在理智中时，可理解种相才属必要。这种直接呈现只可能见于荣福直观（死后），且极可能见于天使对自身的认识。反之，对此生的人类知识，可理解种相确有必要：按 Pini（2016）的说法，它们作为因果替代物，在对象与认知能力之间起中介作用。吉尔斯的说明在界定种相的本体论地位时尤其棘手。依他自己的前提，用因果解释认知，似乎就意味着种相与它所代表之物同类。另一方面，可理解种相在理智之中，而这种在场被解释为一个偶性（种相）内在于一个实体。吉尔斯本人也意识到这一困难：他在一处说这类种相本身既非实体也非偶性，但可“归入”其所代表之物所属的类。Pini（2016）说得对：吉尔斯的回答似乎引出的问题比它能解决的还多。
