      The most famous example of this selective attitude towards Aristotle’s works, however, belongs rather to the field of political theory. In the third book of *De regimine* Giles wants to prove that monarchy is the absolutely best form of government. The first arguments he puts forward in favor of monarchy are not taken from Aristotle’s *Politics*, but from Aquinas’ *De regno*. Then some arguments against monarchy which could be read in the *Politics* are presented as objections that Aristotle puts forth for subsequent refutation. At the end, Giles states squarely that Aristotle supports monarchy as the absolutely best form of monarchy and corroborates his assertion with an argument, which, in the *Politics*, actually goes in the opposite direction (Lambertini 1990)[^lambertini-1990]. One could provide several other examples to show that the *De regimine* succeeded in presenting itself as a simplified exposition and explanation of Aristotle’s thought in practical philosophy, but at the same time transmitted to Giles’ readers a strongly biased interpretation of the Stagirite. The fact that the *De regimine* was often used as a tool to have easier access to Aristotle’s political theory deeply influenced, therefore, the way the Latin West read and understood Aristotle’s *Politics* in the Late Middle Ages (e.g. Lambertini 2017)[^lambertini-2017]. Recent codicological studies on the diffusion of *De regimine’* manuscripts do in fact show that many possessors of the manuscripts most probably used them for study (See *Opera Omnia* I.1/11, *Catalogo dei manoscritti, De regimine*; Briggs 1999)[^briggs-1999]. Giles’ *De regimine* was also translated into different vernaculars (Perret 2011, Papi 2016, Calvaresi 2021)[^calvaresi-2021][^papi-2016][^perret-2011]. Graham McAleer (1999) pointed to the fact that Giles’ Commentary on the Sentences has been almost neglected as a source for Giles’ political philosophy. Studying distinction 22 and 44 of the II book, he found that in these texts Giles’ account of the origin of political authority among human beings after the Fall diverges from what one can read in *De regimine principum* and reveals a profound influence by Augustine, while Aristotle does not play the important role he had in Giles’ mirror for princes. One should also take into consideration that Giles’ *Ordinatio* of the second book was completed in 1309, that is at least 25 years after *De regimine* and could witness to an evolution in Giles’ thought. As a matter of fact, the much earlier *reportatio* does not tackle such issues at all (Lambertini 2014)[^lambertini-2014].
    step1: |-
      然而，这种有选择地对待亚里士多德著作最著名的例子，属于政治理论领域。《论君主统治》第三卷中，吉尔斯要证明君主制是绝对最好的政体。他为君主制提出的头一批论证，不取自亚里士多德《政治学》，而取自阿奎那《论王权》。接着，《政治学》中可读到的一些反对君主制的论证，被当作亚里士多德提出、留待后文反驳的疑难来呈现。最后，吉尔斯直截了当地宣称亚里士多德支持君主制为绝对最好的政体，并用一个在《政治学》中实际指向相反方向的论证来佐证（Lambertini 1990）[^lambertini-1990]。人们还可以举出其他若干例子，说明《论君主统治》成功地把自身呈现为对亚里士多德实践哲学思想的简化阐述与解释，同时又向吉尔斯的读者传递了一种对那位斯塔基拉人严重偏斜的解读。因此，《论君主统治》常被当作较易接近亚里士多德政治理论的工具，这深深影响了拉丁西方在晚期中世纪阅读与理解亚里士多德《政治学》的方式（例如 Lambertini 2017）[^lambertini-2017]。晚近关于《论君主统治》抄本流传的写本研究确实表明，许多抄本拥有者很可能把它们用于研读（见《全集》I.1/11《抄本目录·论君主统治》；Briggs 1999）[^briggs-1999]。吉尔斯的《论君主统治》还被译成多种俗语（Perret 2011, Papi 2016, Calvaresi 2021）[^calvaresi-2021][^papi-2016][^perret-2011]。Graham McAleer（1999）指出，吉尔斯的《箴言四书注》作为其政治哲学的来源几乎被忽视了。他研究第二卷的第 22 与第 44 个区分，发现：在这些文本中，吉尔斯关于堕落之后人类间政治权威起源的说明，与《论君主统治》中所读到的不同，显出奥古斯丁的深刻影响，而亚里士多德并未扮演他在君主宝鉴中的那个重要角色。还应考虑到，吉尔斯第二卷的《订定本》完成于 1309 年，即《论君主统治》之后至少 25 年，可能见证其思想的演变。事实上，早得多的《报告本》完全未处理这类问题（Lambertini 2014）[^lambertini-2014]。
    step2: |-
      然而，有选择地对待亚里士多德著作，最著名的例子还在政治理论领域。《论君主统治》第三卷中，吉尔斯要证明君主制是绝对最好的政体。他为君主制提出的头一批论证，不取自亚里士多德《政治学》，而取自阿奎那《论王权》。接着，《政治学》中可读到的一些反对君主制的论证，被当作亚里士多德提出、留待后文反驳的疑难。最后，吉尔斯直截了当地宣称亚里士多德支持君主制为绝对最好的政体，还用了一个在《政治学》中实际指向相反方向的论证来佐证（Lambertini 1990）[^lambertini-1990]。这样的例子还能举出若干：可见《论君主统治》成功地把自身呈现为对亚里士多德实践哲学思想的简化阐述与解释，同时又向吉尔斯的读者传递了一种对斯塔基拉人严重偏斜的解读。《论君主统治》常被当作较易接近亚里士多德政治理论的工具，这就深深影响了拉丁西方在晚期中世纪阅读、理解亚里士多德《政治学》的方式（例如 Lambertini 2017）[^lambertini-2017]。晚近关于该书抄本流传的写本研究确实表明，许多抄本拥有者很可能把它们用于研读（见《全集》I.1/11《抄本目录·论君主统治》；Briggs 1999）[^briggs-1999]。吉尔斯的《论君主统治》还被译成多种俗语（Perret 2011, Papi 2016, Calvaresi 2021）[^calvaresi-2021][^papi-2016][^perret-2011]。Graham McAleer（1999）指出，吉尔斯的《箴言四书注》作为其政治哲学的来源，几乎被忽视了。他研究第二卷的第 22 与第 44 个区分，发现这些文本中关于堕落之后人类间政治权威起源的说明，与《论君主统治》所载不同，显出奥古斯丁的深刻影响，而亚里士多德并未扮演他在君主宝鉴中的那个重要角色。还应想到，吉尔斯第二卷的《订定本》完成于 1309 年，即《论君主统治》之后至少 25 年，可能见证其思想演变。事实上，早得多的《报告本》完全未处理这类问题（Lambertini 2014）[^lambertini-2014]。
