      As to the debate about the unicity of substantial form, Giles’ position evolves over time. If we leave aside the *Errores philosophorum*, since the authenticity of this work has been contested with serious arguments (Bruni 1935, Koch 1944, Donati 1990b, Luna 1990)[^bruni-1935][^donati-1990b][^koch-1944][^luna-1990], we can notice that Giles changes his position from the *Contra gradus et pluralitatem formarum* (between the end of 1277 and the beginning of 1278), where he, against Henry of Ghent denies plurality of forms for every compound (Wilson 2014)[^wilson-2014], to later works, where he takes a more cautious stance in particular concerning man. The principle of individuation is identified, as in Aquinas, with “materia signata quantitate”, that is, matter designated by its dimensions. According to Giles, who criticizes also Richard of Mediavilla on this point, matter is pure potentiality and therefore cannot be distinguished into different kinds. For this reason, he cannot accept Aquinas’ doctrine that the incorruptibility of celestial bodies derives from the peculiar nature of their matter (Donati 1986)[^donati-1986]. In Giles’ opinion celestial bodies are not incorruptible because their matter is different from the matter of sublunar bodies, but rather because their *quantitas materiae* cannot change its determinate dimensions. This is but one application of Giles’ famous doctrine of “indeterminate dimensions”. Modifying Averroes’ doctrine in this respect, Giles argues that a portion of matter, in order to be able to receive a form, needs to possess already a sort of quantity. Such quantity, however, should not be identified with the determinate dimensions a body possesses, but is rather a *quantitas* which remains the same during processes such as rarefaction and condensation. Giles’ notion of *quantitas materiae*, which is not only generically extension or three-dimensionality, but seems to represent an unchangeable given “amount” of matter pertaining to a body, has been considered comparable, some differences notwithstanding, to the modern notion of mass (Donati 1988, Donati-Trifogli 2016)[^donati-1988][^donati-2016].
    step1: |-
      至于关于实体形式单一性的争论，吉尔斯的立场随时间而演变。若把《哲学家的错误》搁在一边——该著是否真出吉尔斯之手，已有人提出有力质疑（Bruni 1935, Koch 1944, Donati 1990b, Luna 1990）[^bruni-1935][^donati-1990b][^koch-1944][^luna-1990]——便可见吉尔斯立场的变化：从《驳层级与形式复多》（1277 年末至 1278 年初），他在此反对根特的亨利、否认任何复合物的形式复多（Wilson 2014）[^wilson-2014]，到后期著作，他态度转趋谨慎，尤其在人这一问题上。个体化原理如阿奎那一样，被认定为“materia signata quantitate”，即由其量度所标记的质料。依吉尔斯之见（他在这一点上也批评米德尔维拉的理查德），质料是纯潜能，因而不能区分为不同的种类。因此他无法接受阿奎那的学说：天体的不可朽坏源自其质料的特殊本性（Donati 1986）[^donati-1986]。在吉尔斯看来，天体不可朽坏，不是因为其质料与月下物体不同，而是因为它们的 *quantitas materiae*（质料之量）不能改变其确定的量度。这只是吉尔斯著名的“不确定量度”学说的一项应用。吉尔斯在此修改阿威罗伊的学说，主张一部分质料要能接受形式，就须已经具有某种量；但这种量不应等同于物体所具有的确定量度，而是一种在稀薄化与凝聚等过程中保持不变的 *quantitas*（量）。吉尔斯 *quantitas materiae*（质料之量）的概念，不只笼统指延展或三维性，而似代表物体所属的不可改变的一定量，虽有些差异，仍被认为可与近代的质量概念相比（Donati 1988, Donati-Trifogli 2016）[^donati-1988][^donati-2016]。
    step2: |-
      至于实体形式单一性的争论，吉尔斯的立场则随岁月而变。先把《哲学家的错误》搁在一旁——该著是否真出吉尔斯之手，已遭有力质疑（Bruni 1935, Koch 1944, Donati 1990b, Luna 1990）[^bruni-1935][^donati-1990b][^koch-1944][^luna-1990]。可以看见，吉尔斯的立场在变化：从《驳层级与形式复多》（1277 年末至 1278 年初）到后期著作。前书反对根特的亨利，否认任何复合物有形式复多（Wilson 2014）[^wilson-2014]；后期著作则态度转谨，尤其在人这一问题上。个体化原理如阿奎那那样，定为“materia signata quantitate”，即由其量度标记的质料。吉尔斯在这一点上也批评米德尔维拉的理查德；他认为质料是纯潜能，故不能分为不同种类。因此他不能接受阿奎那的学说，即天体的不可朽坏源于其质料的特殊本性（Donati 1986）[^donati-1986]。在吉尔斯看来，天体不可朽坏，靠的不是其质料与月下物体有别，而是它们的 *quantitas materiae*（质料之量）不能改变其确定量度。这只是吉尔斯著名的“不确定量度”学说的一项应用。他在此处修改阿威罗伊的学说，主张一部分质料要能接受形式，必须先有某种量。但这种量不该等同于物体现有的确定量度；它是在稀薄化、凝聚等过程中保持不变的一种 *quantitas*（量）。吉尔斯 *quantitas materiae*（质料之量）的概念，不只笼统指延展或三维性，而似代表物体所属、不可改变的一定量的质料，虽有些差异，仍被认为可比于近代的质量概念（Donati 1988, Donati-Trifogli 2016）[^donati-1988][^donati-2016]。
