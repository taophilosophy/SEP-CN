      关于理智与意志在决定人的行动中各自作用的争论，吉尔斯的立场经历了一番演变；他似乎一直在寻找中间立场，一种介于根特的亨利与方丹的戈弗雷之说间的折中。事实上，吉尔斯主张意志是被动潜能，不能“推动”自身，而总需要一个对象，一个“bonum apprehensum”（被领会之善）。然而这一出发点并不排除意志的自由：意志即便受其对象“推动”，仍能就行动自我决定，并决定其他潜能。吉尔斯这一看法与他成熟时期对罪人身上知识与意志关系的解释相一致。犯罪意味着对真正善的无知，但这种无知不是错误行为的首要原因，因为它是意志的结果：意志受 *malicia*（恶意）影响，败坏了理性的判断（Macken 1977, Eardley 2003, Pini 2006, Eardley 2016，另见 Cross 2016）[^cross-2016][^eardley-2003][^eardley-2016][^macken-1977][^pini-2006]。Marialucrezia Leone 认为，吉尔斯虽有些微移易，在其漫长的学术生涯中始终一贯（Leone 2022）。罗马的吉尔斯在伦理学的其他领域（如德性理论）也有可观影响。其立场最充分的表现不在亚里士多德评注中，而在《论君主统治》里——那是中世纪政治思想中最成功的“君主宝鉴”，其拉丁原文至今仍存于 200 多种抄本，此外还须加上许多欧洲俗语译本。此书最可能写于 1277 至 1280 年间，被认为是把亚里士多德的实践哲学、尤其是其“伦理与政治语言”传译给拉丁西方最成功的尝试之一。吉尔斯第一个按 *ethica-oeconomica-politica*（伦理—家政—政治）的格式，把君主宝鉴分为三卷；这一格式在中世纪接受亚里士多德道德与政治哲学的过程中起过重要作用（Lambertini 1988）[^lambertini-1988]。作者极力给人印象：他主要依据亚里士多德文本，书中大量引用《尼各马可伦理学》《政治学》与《修辞学》。然而学者不应忽视：他对亚里士多德的接受并不像表面那样直接，吉尔斯深受亚里士多德实践哲学解释传统的影响。在这一传统中，阿奎那对吉尔斯极为重要：亚里士多德是几乎处处被引用的权威，而真正对《论君主统治》起决定影响的，却是未具名的阿奎那及其《政治学注》《论王权》《神学大全》。讨论具体论题时，吉尔斯巧妙地让亚里士多德迁就自己的目的。这在第一卷（论伦理学）中清晰可见：吉尔斯对德性的分类严重依赖《神学大全》，因而依赖阿奎那对亚里士多德遗产的重新解释。例如，吉尔斯在此把 *prudentia*（明智）界定为 *virtus media*（居中之德），兼具道德德性与理智德性的性质——这一学说绝无法追溯到那位斯塔基拉人（Lambertini 1991, 1992, 1995, 2000，见 Caragnano 2024）[^caragnano-2024][^lambertini-1991]。第二卷论作为一家之长的伦理，涵盖从子女养育与教育到治理仆役的诸多题目。为此他动用了广泛的材料，也包括医学作者（Lambertini 1988, Martorelli Vico 2008）[^lambertini-1988][^martorelli-2008]。吉尔斯写《论君主统治》时，伪亚里士多德《家政学》尚未译成拉丁文供西方使用；但他仍设法讨论了经济题目——只要它们与王室家庭或一般上层家庭的家政相关。在此他谴责高利贷，批评其他不适合君主的经济做法，并坚持农业应起的首要作用（Lambertini 2015）[^lambertini-2015]。
