      Benedict Caetani’s election to the papal see marked a further radical change in his career, as Boniface VIII appointed him archbishop of Bourges in 1295. As a matter of fact, Giles was very often absent from his see, spending extended periods of time at the papal curia. In his *De renuntiatione*, he defended the legitimacy of Celestine’s abdication, and, consequently, of Boniface’ s election. When the contrast between Boniface VIII and Philip IV reached its most critical point, he continued to side staunchly with the pope. An important sermon defending the papal position has been discovered by Concetta Luna, and Giles’ *De ecclesiastica potestate* undoubtedly ranks among the sources of *Unam Sanctam*.
    step1: |-
      本笃·卡埃塔尼当选教宗，使他的生涯再度剧变：卜尼法斯八世于 1295 年任命他为布尔日大主教。事实上，吉尔斯常常不在自己的教区，而长住教廷。他在《论教宗辞职》中为塞莱斯廷退位的合法性、并因此为卜尼法斯当选的合法性辩护。当卜尼法斯八世与腓力四世的冲突到了最危急的关头，他仍坚定站在教宗一边。Concetta Luna 发现了一篇捍卫教宗立场的重要布道文；而吉尔斯的《论教会权力》无疑属于《一圣》诏书的来源之列。
    step2: |-
      本笃·卡埃塔尼登上教宗宝座，使吉尔斯的生涯再度剧变：1295 年，卜尼法斯八世任命他为布尔日大主教。事实上，吉尔斯常不在教区，而在教廷长住。他在《论教宗辞职》（*De renuntiatione papae*）中为塞莱斯廷退位、并为卜尼法斯当选的合法性辩护。卜尼法斯八世与腓力四世的冲突到了最危急的关头，他仍坚定站在教宗一边。Concetta Luna 发现过一篇捍卫教宗立场的重要布道文；吉尔斯的《论教会权力》（*De ecclesiastica potestate*）则无疑属于《一圣》（*Unam Sanctam*）诏书的来源之列。
