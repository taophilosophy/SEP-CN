      Studies concerning Giles’ natural philosophy focused mainly on his treatment of some pivotal concepts of Aristotle’s Physics. Cecilia Trifogli opened new perspectives in this field, devoting her attention to the notions of place and motion (especially in the void, see Trifogli 1992)[^trifogli-1992], underlining that “Giles’ emphasis on the role of place in the description of motion seems to lead to a quantitative and relational notion of place. Giles, however, does not completely substitute the Aristotelian notion of place for that of place as distance. Place as distance is only one of the two notions of place which appear in his commentary. The other, which is related to material place, assumes an intrinsic connection between place and the located body that cannot be founded on distance alone” (Trifogli 1990a, 350)[^trifogli-1990a]. Giles’ distinction was referred to as an opposition between material place (the limit of the containing body) and formal place (distance from the fixed points of the universe) (Donati-Trifogli 2016)[^donati-2016]. Trifogli also investigated Giles’ notions of time and infinity, emphasizing that his whole approach to natural philosophy is distinguished by a tendency towards a metaphysical interpretation of Aristotelian concepts, as opposed to a physical and quantitative one (Trifogli 1990b, 1991)[^trifogli-1990b]. For example, Giles conceives of time not as a quantity pertaining to every kind of motion, but rather as the same thing as motion, seen under a different aspect. His concept of time rests in fact essentially on a broad notion of succession, which allows him on one hand to retain the unity of the concept of time, but, on the other hand, to acknowledge the existence of different times (Trifogli 1990b, Donati-Trifogli 2016)[^donati-2016][^trifogli-1990b] Giles distinguishes between two kinds of duration: extrinsic duration is the time of celestial motion, and is obviously one in number. Intrinsic duration depends on the different motions taking place in the sublunary world and is therefore plural (Donati-Trifogli 2016)[^donati-2016]. A similar attitude emerges also from the analysis of Giles’ controversy on angelic time with Henry of Ghent (Porro 1988, Porro 1991, but see also Faes de Mottoni 1983)[^faes-1983][^porro-1988][^porro-1991]. Both authors thought that the time in which angels exist, unlike sublunar time, is a discrete succession of instants. Giles and Henry disagreed, however, on the relationship existing between angelic and sublunar time. In particular, Henry rejected Giles’ thesis that more instants of angelic time can correspond to one and the same instant of sublunar time. This difference of opinion rested in part on diverging concepts of angelic motion, which can be istantaneous according to Henry, but not according to Giles.
    step1: |-
      关于吉尔斯自然哲学的研究，主要集中在他对亚里士多德《物理学》若干枢要概念的处理上。Cecilia Trifogli 在这一领域开辟了新视野，关注位置与运动（尤在虚空中，见 Trifogli 1992）[^trifogli-1992] 诸概念，并强调“吉尔斯对位置在运动描述中之作用的强调，似乎导向一种定量、关系性的位置概念。然而吉尔斯并未用位置作为距离的概念完全取代亚里士多德的位置概念。位置作为距离，只是其评注中出现的两种位置概念之一。另一种与物质性位置相关，它假定位置与所置物体之间有内在关联，而这种关联不能只建立在距离之上”（Trifogli 1990a, 350）[^trifogli-1990a]。吉尔斯的区分被称作物质性位置（包容物体的界限）与形式性位置（距宇宙固定点的距离）之间的对立（Donati-Trifogli 2016）[^donati-2016]。Trifogli 还研究了吉尔斯的时间与无限概念，强调他整个自然哲学取径的特征在于倾向对亚里士多德概念作形而上学的解释，而非物理、定量的解释（Trifogli 1990b, 1991）[^trifogli-1990b]。例如，吉尔斯不把时间设想为属于每一种运动的量，而设想为与运动同一之物从另一角度所见。他的时间概念实际上本质上基于一种宽泛的相继概念：这一方面使他保持时间概念的单一性，另一方面又承认存在不同的时间（Trifogli 1990b, Donati-Trifogli 2016）[^donati-2016][^trifogli-1990b]。吉尔斯区分两类持续：外在持续是天体运动的时间，在数目上显然是一；内在持续取决于月下世界发生的不同运动，因而是复多的（Donati-Trifogli 2016）[^donati-2016]。分析吉尔斯与根特的亨利关于天使时间的争论，也可看到类似态度（Porro 1988, Porro 1991，另见 Faes de Mottoni 1983）[^faes-1983][^porro-1988][^porro-1991]。两位作者都认为天使所存身的时间不同于月下时间，是瞬间的离散相继。然而吉尔斯与亨利在天使时间与月下时间的关系上意见相左。尤其，亨利拒斥吉尔斯的论点：多个天使时间的瞬间可以对应同一个（同一个）月下时间瞬间。这一分歧部分基于对天使运动的不同概念：按亨利，天使运动可以是瞬间的；按吉尔斯则不然。
    step2: |-
      吉尔斯自然哲学的研究，主要集中在他对亚里士多德《物理学》若干枢要概念的处理。Cecilia Trifogli 在此领域开辟了新视野，着力于位置与运动（尤其是虚空中的运动，见 Trifogli 1992）[^trifogli-1992] 诸概念。她指出：“吉尔斯强调位置在运动描述中的作用，似导向一种定量、关系性的位置概念。但他并未用位置即距离的概念完全取代亚里士多德的位置概念。位置作为距离，只是其评注中的两种位置概念之一。另一种与物质性位置相关，它假定位置与所置物体之间有内在关联，而这种关联不能仅建立在距离之上”（Trifogli 1990a, 350）[^trifogli-1990a]。吉尔斯的区分被称作物质性位置（包容物体的界限）与形式性位置（距宇宙固定点的距离）的对立（Donati-Trifogli 2016）[^donati-2016]。Trifogli 还研究吉尔斯的时间与无限概念，强调他整个自然哲学取径的特点，是倾向对亚里士多德概念作形而上学解释，而非物理、定量解释（Trifogli 1990b, 1991）[^trifogli-1990b]。例如，吉尔斯不把时间看作属于每种运动的量，而看作与运动同一之物从另一角度所见。他的时间概念在本质上基于一种宽泛的相继概念：这使他一方面保持时间概念的单一，另一方面又承认存在不同的时间（Trifogli 1990b, Donati-Trifogli 2016）[^donati-2016][^trifogli-1990b]。吉尔斯区分两类持续：外在持续是天体运动的时间，在数目上显然为一；内在持续取决于月下世界发生的不同运动，因而是复多的（Donati-Trifogli 2016）[^donati-2016]。分析吉尔斯与根特的亨利关于天使时间的争论，也能看到类似态度（Porro 1988, Porro 1991，另见 Faes de Mottoni 1983）[^faes-1983][^porro-1988][^porro-1991]。两人都认为，天使所存身的时间不同于月下时间，是瞬间的离散相继。但吉尔斯与亨利在天使时间与月下时间的关系上意见相左：亨利尤其拒斥吉尔斯的一个论点，即多个天使时间的瞬间可以对应同一个（同一个）月下时间瞬间。这一分歧部分基于对天使运动的不同概念——按亨利，天使运动可以是瞬间的；按吉尔斯则不然。
