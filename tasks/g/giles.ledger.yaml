      After the condemnation of 1277, a significant change can be noticed in Giles’ position also in his solution of the problem of the eternity of the world. At the beginning of his career he admitted the theoretical possibility of the eternity of the world, although rejecting Aristotle’s arguments proving the actual eternity of the world. Later he shifted to a more “Augustinian” stance, rejecting the hypothesis of a creation “*ab aeterno*” and admitting that it is possible to prove the temporality of creation, although he finds that no conclusive argument has been advanced so far (but see also Cross 2016 and Brochier 2020)[^cross-2016]. Giles was much more steadfast in his opposition to another major tenet of “Averroistic” doctrine, that is the unicity of the possible intellect. He maintained that the possibility of actual knowledge on the part of the individual depends necessarily on the fact that each body is informed by its own intellective soul, which is its form. For the same reasons Giles also rejected the unicity of the agent intellect, a doctrine he attributed to Avicenna (Del Punta-Donati-Luna 1993, Conolly 2007)[^conolly-2007][^del-1993].
    step1: |-
      1277 年谴责之后，吉尔斯在关于世界永恒性问题的解答上也显出显著变化。生涯初期，他承认世界永恒在理论上的可能，尽管拒绝亚里士多德证明世界现实永恒的那些论证。后来他转向更为“奥古斯丁式”的立场，拒绝“*ab aeterno*”（自永恒）创造的假设，并承认可以证明创造在时间上有开端，尽管他认为迄今尚未有人提出决定性的论证（另见 Cross 2016 与 Brochier 2020）[^cross-2016]。吉尔斯更为坚定地反对“阿威罗伊式”学说的另一大要义，即可能理智的单一性。他主张：个体之能有现实知识，必然取决于每一物体都为其自身理智灵魂（即其形式）所赋形。出于同样的理由，吉尔斯也拒绝能动理智的单一性——他把这一学说归给阿维森纳（Del Punta-Donati-Luna 1993, Conolly 2007）[^conolly-2007][^del-1993]。
    step2: |-
      1277 年谴责之后，吉尔斯在“世界是否永恒”这一问题的解答上也有显著变化。生涯初期，他承认世界永恒在理论上可能，尽管拒绝亚里士多德用以证明世界现实永恒的论证。后来他转向更“奥古斯丁式”的立场：拒绝“*ab aeterno*”（自永恒）创造的假设，并承认可以证明创造在时间上有开端——尽管他认为迄今尚无决定性论证（另见 Cross 2016 与 Brochier 2020）[^cross-2016]。在反对“阿威罗伊式”学说的另一大要义即可能理智单一性上，吉尔斯更为坚定。他主张：个体要获得现实知识，必然取决于每一物体都为其自身的理智灵魂即其形式所赋形。出于同样理由，吉尔斯也拒绝能动理智的单一性，并把这一学说归给阿维森纳（Del Punta-Donati-Luna 1993, Conolly 2007）[^conolly-2007][^del-1993]。
