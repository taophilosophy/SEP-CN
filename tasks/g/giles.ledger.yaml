    source: |-
      Born in Rome most probably in the fifth decade of the thirteenth century, Giles was the first outstanding theologian of the relatively recently founded Order of the Augustinian Hermits. Nothing more is known about his origins: the statement that he belonged to the famous Roman family of the Colonna seems to go back to Jordan of Saxony’s *Liber Vitasfratrum* (second half of the 14th century), but is completely missing from contemporary, 13th-century sources. From Giles’ will we know that he was sent to Paris to study in the convent of his Order. At the beginning he must have followed the courses either of a secular master or of a theologian belonging to a different Order, as the Augustinian friars did not have a regent master at the time. Probably he was a pupil of Aquinas’ in the years 1269–1272. He commented on the Sentences at the beginning of the 1270s. In following years he most probably wrote also a large number of his commentaries on Aristotle.
    step1: |-
      吉尔斯生于罗马，最可能在十三世纪中叶的第五个十年。他是成立不久的奥古斯丁隐修会第一位杰出的神学家。关于他的出身，此外一无所知：说他属于罗马著名的科隆纳家族，这一说法似乎可追溯到萨克森的乔丹《弟兄生活录》（十四世纪后半叶），但完全不见于同时代的十三世纪原始材料。从吉尔斯的遗嘱可知，他被送往巴黎在本会修院学习。起初他所从学的，想必或是一位世俗教师，或是属于别的修会的神学家，因为奥古斯丁派修士当时还没有正式教师。他大概在 1269–1272 年间师从阿奎那。1270 年代初，他评注了《箴言四书》。此后数年，他多半还写下了大量亚里士多德评注。
    step2: |-
      吉尔斯生于罗马，最可能在十三世纪五十年代。新成立不久的奥古斯丁隐修会，其第一位杰出神学家就是他。关于他的出身，此外一无所知：说他出身罗马著名的科隆纳家族，此说似乎源自萨克森的乔丹《弟兄生活录》（十四世纪后半叶），却完全不见于十三世纪的同时代材料。据吉尔斯的遗嘱，他被送往巴黎，在本会修院学习。起初他大概随一位世俗教师，或随别派修会的神学家听课，因为奥古斯丁派当时还没有正式教师。1269 至 1272 年间，他多半是阿奎那的学生。1270 年代初，他评注《箴言四书》；此后几年，大概还写下了大量亚里士多德评注。
  - id: 4
    kind: body
    source: |-
      The year 1277 marked a turning-point in his career: Giles was involved in the condemnation of the heterodox Aristotelianism issued by the Parisian bishop Etienne Tempier, although the process against him must be distinguished from the famous decree of the 7 of March 1277, as Robert Wielockx has shown. After 1277 Giles must have abandoned Paris, but his presence is attested in Italy not earlier than 1281. Before leaving Paris he completed his De regimine principum, which is dedicated to the young Philip, the future Philip the Fair.
    step1: |-
      1277 年是他生涯的转折点：吉尔斯卷入了巴黎主教艾蒂安·唐皮耶发动的对异端亚里士多德主义的谴责，尽管如 Robert Wielockx 所表明，对他的审理过程必须与 1277 年 3 月 7 日那道著名法令区分开来。1277 年之后，吉尔斯想必已离开巴黎，但他的行踪在意大利得到确证，最早不过 1281 年。离开巴黎之前，他写成了《论君主统治》，献给年轻的腓力，即后来的美男子腓力。
    step2: |-
      1277 年是吉尔斯生涯的转折点：巴黎主教艾蒂安·唐皮耶谴责异端亚里士多德主义，他卷入其中。不过如 Robert Wielockx 所表明，针对他的审理过程与 1277 年 3 月 7 日那道著名法令，须分开来看。1277 年之后，吉尔斯想必已离开巴黎；而他在意大利现身的确证，最早不过 1281 年。离开巴黎前，他写成了《论君主统治》（*De regimine principum*），献给年轻的腓力，即后来的美男子腓力。
