      Much better known than the *De renuntiatione* is Giles’ *De ecclesiastica potestate*, a treatise also composed in defense of Boniface VIII. Most probably in 1302, Giles systematically expounded in this work the views on the relationship between *regnum* and *sacerdotium* he had already put forward in a re-discovered sermon held at the papal curia (Luna 1992, Lambertini 2006)[^lambertini-2006][^luna-1992]. The main tenet of his fully fledged argumentation is that the pope, supreme authority of the Church but also of the whole of mankind, is the only legitimate origin of every power on earth, be it exercised — as jurisdiction — on persons, or — as property — on things. In his plenitude of power, the pope possesses an absolute supremacy both in the ecclesiastical and in the temporal sphere, and delegates the exercise of the temporal “sword” to lay sovereigns only in order to fulfill most properly his higher religious duties. Any authority that does not recognize its dependence on the papal power is but usurpation. In Giles’ view, there is no space even for a partially autonomous temporal order. Coherently, Giles maintains that no property rights are valid if they are not legitimated by papal authority. Interestingly enough, such a claim is also supported by his account of the origin of property, according to which property is not a natural institution, but only the consequence of human agreements, which lack any legitimacy unless they are recognized by the supreme religious power (Miethke 2000, Homann 2004, Krüger 2007)[^homann-2004][^miethke-2000]. Scholarly discussion about the *De ecclesiastica potestate* is still open. Karl Ubl (2004) argues with strong arguments against previous assumptions, that Giles wrote in reaction to John of Paris’ *De regia potestate et papali*. While previous scholarship stressed the affinity in form and content between *De ecclesiastica potestate* and the famous Bull *Unam sanctam*, Francisco Bertelloni (2004) holds that one should not overlook profound differences between the concepts of papal power that inspire the two texts.
    step1: |-
      比《论教宗辞职》有名得多的是吉尔斯的《论教会权力》，这也是一部为卜尼法斯八世辩护的论著。最可能在 1302 年，吉尔斯在此书中系统阐述了他在一篇重新发现的、在教廷所作布道中已提出的关于 *regnum*（王权）与 *sacerdotium*（司祭权）关系的看法（Luna 1992, Lambertini 2006）[^lambertini-2006][^luna-1992]。其完全展开的论证的主旨是：教宗既是教会的最高权威，也是全人类的最高权威，是地上一切权力的唯一合法根源——无论这权力是作为管辖权施于人身，还是作为财产权施于物。在其权力的丰满中，教宗在教会领域与世俗领域都拥有绝对至上权，只把世俗“剑”的行使委托给世俗君主，以便最恰当地履行其更高的宗教职责。任何不承认自己依赖于教宗权力的权威，都只是篡夺。在吉尔斯看来，连一个部分自主的世俗秩序也没有余地。前后一贯地，吉尔斯主张：财产权若未经教宗权威认可，便不生效。颇有意思的是，这一主张还得到他关于财产起源之说明的支持：按此说明，财产不是自然制度，而只是人类协议的结果，这些协议若不被最高宗教权力认可，便无任何合法性（Miethke 2000, Homann 2004, Krüger 2007）[^homann-2004][^miethke-2000]。关于《论教会权力》的学术讨论仍未定谳。Karl Ubl（2004）以有力论证反对先前的假设，认为吉尔斯是回应巴黎的约翰《论王权与教权》而写作的。先前研究强调《论教会权力》与著名诏书《一圣》在形式与内容上的亲缘；Francisco Bertelloni（2004）则主张，不应忽视激发这两份文本的教宗权力概念之间的深刻差异。
    step2: |-
      比《论教宗辞职》有名得多的是吉尔斯的《论教会权力》，同样是一部为卜尼法斯八世辩护的论著。最可能在 1302 年，吉尔斯在此书中系统阐述了他在一篇重新发现的、于教廷所作布道中已提出的看法：*regnum*（王权）与 *sacerdotium*（司祭权）是什么关系（Luna 1992, Lambertini 2006）[^lambertini-2006][^luna-1992]。其完全展开的论证主旨是：教宗既是教会的最高权威，也是全人类的最高权威，是地上一切权力的唯一合法根源——无论这权力作为管辖权施于人身，还是作为财产权施于物。在其权力的丰满之中，教宗在教会领域与世俗领域都拥有绝对至上权，只把世俗“剑”的行使委托给世俗君主，以便最恰当地履行更高的宗教职责。任何不承认自己依赖于教宗权力的权威，都只是篡夺。在吉尔斯看来，连一个部分自主的世俗秩序也无处安放。前后一贯地，他主张：财产权若未经教宗权威认可，便不生效。颇有意思的是，这一主张还得到他关于财产起源之说明的支持：按此说明，财产不是自然制度，只是人类协议的结果，而协议若不被最高宗教权力认可，便无任何合法性（Miethke 2000, Homann 2004, Krüger 2007）[^homann-2004][^miethke-2000]。关于《论教会权力》的学术讨论仍未定谳。Karl Ubl（2004）以有力论证反对先前假设，认为吉尔斯是回应巴黎的约翰《论王权与教权》而写作的。先前研究强调《论教会权力》与著名诏书《一圣》在形式与内容上的亲缘；Francisco Bertelloni（2004）则主张，不应忽视激发这两份文本的教宗权力概念之间的深刻差异。
