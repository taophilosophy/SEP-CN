      传统上，吉尔斯被说成阿奎那的“忠实”弟子，如今学界已不接受这一判断。Concetta Luna 令人信服地论证了《报告本》确为真作，事情随之清楚：吉尔斯早在生涯初期就以阿奎那的教导为自身反思的出发点，却在许多方面批评、修正这位多明我会大师的学说。Luna 还确认，吉尔斯只把《箴言四书读本》（传世者为《报告本》）的前两卷改写成了《订定本》：第一卷在《读本》之后不久即告完成，即 1271–1273 年间；第二卷却拖到 1309 年才补成。Luna 汇集可观的证据，表明归于吉尔斯名下的第三卷《订定本》实为伪作。大体而言，吉尔斯的“哲学规划”是批判地讨论阿奎那的立场，以改进其解答，却不曾试图彻底抛弃它们。晚近 Katherine König-Pralong 表明，关于求知之自然欲的争论正是如此：吉尔斯的立场虽在与根特的亨利的讨论中提出，却与阿奎那不同——在他看来，人有一种求知之自然欲，而这一欲望由对分离实体的有限理解所满足（König-Pralong 2014）。他与根特的亨利争论的另一著名话题“本质”与“存在”之别，也同样如此。在此，吉尔斯把阿奎那的实在区分学说推向极端，主张存在须设想为加在本质之上的“*res addita*”（附加之物）（Pickavé 2016）[^pickavé-2016]。他理论的最终结果虽被认为更近阿维森纳而非阿奎那，吉尔斯毕竟是从阿奎那自身立场出发加以发展的（Wippel 1981）[^wippel-1981]，其《形而上学问题集》已见端倪（Conti 2014）[^conti-2014]。Giorgio Pini（1992）深入考察了此问题与他和根特的亨利关于“创造”概念之争的关联，表明吉尔斯在捍卫阿奎那——从而捍卫在正统创造论中使用某些亚里士多德原理的可能——的同时，又越出这位多明我会大师的立场，例如断言“*esse*”（存在）与“*creatio*”（创造）同一（另见 Porro 2014, Cross 2016）[^cross-2016][^porro-2014]。在评注短论《论好运》时，吉尔斯同样主张亚里士多德学说与基督教信仰相容；该文虽归在亚里士多德名下，实为摘自《欧德米亚伦理学》与《大伦理学》的段落汇编。其中“好运”概念的解释，牵涉偶然性、必然性以及神性因果与自然事件的相互作用。如 Valérie Cordonnier（2014）所表明，吉尔斯的解答被根特的亨利攻击为导致必然论。
