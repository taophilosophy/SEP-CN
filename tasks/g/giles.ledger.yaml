      Most likely in 1311, Giles wrote a treatise, *Contra Exemptos*, attacking the Templars, who were on trial at the time. From the point of view of political theory, it is interesting that Giles proposes to interpret the structure of the Church and the temporal kingdoms according to the model of the angelic hierarchies of Pseudo-Dionysius (Lambertini 2023)[^lambertini-2023].
    step1: |-
      最可能在 1311 年，吉尔斯写了一篇论著《驳豁免》，攻击当时正受审的圣殿骑士团。从政治理论的角度看，有意思的是吉尔斯提出按伪狄奥尼修斯的等级序列模式，来解释教会与世俗王国的结构（Lambertini 2023）[^lambertini-2023]。
