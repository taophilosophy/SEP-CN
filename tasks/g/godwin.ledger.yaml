      Godwin’s philosophical importance rests principally on his *Political Justice*. He wrote other philosophical works, *The Enquirer* (1798) and *Thoughts on Man* (1831), but he has become perhaps better known for his novels, the most famous of which is *Things as They are, or The Adventures of Caleb Williams* (1794), and for the part he played in literary London from 1783–1836—from his heyday in the 1790s as the radical philosopher who married Mary Wollstonecraft, through the next forty years in which he was variously the butt of attacks by Thomas Malthus, Samuel Parr and a host of anti-jacobin scribes, friend of the romantic poets, publisher and author of children’s books, father-in-law and sponger off Percy Bysshe Shelley, and historian of the Civil War, to his final anomalous position as a government pensioner supported by a Tory administration. His papers and especially his diary, which sparsely records what he read and wrote and whom he met, provide an immense resource for scholars of the romantic period.
    step1: |-
      戈德温的哲学重要性主要系于《政治正义论》。他还写有其他哲学著作——《探索者》（*The Enquirer*，1798）与《论人》（*Thoughts on Man*，1831）——但使他更为人知的，也许是他的小说，其中最著名的是《事物如其所是，或凯莱布·威廉斯历险记》（*Things as They are, or The Adventures of Caleb Williams*，1794）；还有他在 1783–1836 年间于伦敦文坛所扮演的角色：从 1790 年代的全盛时期，作为娶了玛丽·沃斯通克拉夫特的激进哲学家，到此后四十年间，他先后成为 Thomas Malthus、Samuel Parr 以及一众反雅各宾文人的攻击靶子，浪漫派诗人的朋友，儿童书籍的出版者与作者，Percy Bysshe Shelley 的岳父兼依附者，内战史家，最后落到一种反常的境地：靠托利党政府领取养老金。他的文稿，尤其是那部日记——简略记下他读了什么、写了什么、见了谁——为浪漫主义时期的研究者提供了巨大的资源。
    step2: |-
      戈德温的哲学重要性主要系于《政治正义论》。他另有两部哲学著作——《探索者》（*The Enquirer*，1798）与《论人》（*Thoughts on Man*，1831）——但更让他为人所知的也许是小说，其中最著名的是《事物如其所是，或凯莱布·威廉斯历险记》（*Things as They are, or The Adventures of Caleb Williams*，1794）。此外还有他在 1783–1836 年间于伦敦文坛的角色：1790 年代正当全盛，他是娶了玛丽·沃斯通克拉夫特的激进哲学家；此后四十年，他时而是 Thomas Malthus、Samuel Parr 和一众反雅各宾文人的靶子，时而是浪漫派诗人的朋友、儿童书的出版者与作者、Percy Bysshe Shelley 的岳父兼吃白食的依附者、内战史家，最后落到一个反常的位子：领托利党政府养老金的在册人员。他的文稿，尤其是那部日记——简略记下他读了什么、写了什么、见过谁——为浪漫主义时期的研究者留下了一份丰厚资源。
