      《政治正义论》第二版于 1795 年底出版，其中第一版一些较为理性主义与乌托邦式的说法作了修改。此后不久，他与玛丽·沃斯通克拉夫特重新结识——他第一次见她是在 1791 年一次向潘恩致敬的宴会上，两人对彼此都没什么好感。沃斯通克拉夫特后来住在革命的法国，与美国商人 Gilbert Imlay 上尉有过一段充满波折的关系，并生下一个孩子。他们的第二次相识较为成功。青年戈德温十足是个哲学家——衣着朴素，身形瘦削，神情专注，目光锐利。他虽平易近人，却不善社交：既容易见怪，也因热衷朋友间坦诚之德而得罪人。随着事业日进，他才结识了一批聪慧的女性，她们对政治、文学与哲学都有兴趣——如 Helen Maria Williams、Elizabeth Inchbald、Amelia Alderson、Maria Reveley、Mary Hays 与 Mary Robinson。这些交往起了作用。1791 年他把头发剪短，衣着也不再像牧师；社交生活日益广泛（尽管看不出有自我放纵的迹象）；1796 年他甚至试着办了一次晚宴（客人中有 Parr 的女儿们、沃斯通克拉夫特与 Inchbald）。他还练出了一点调情的基本功。1795 年最后几个月与 1796 年上半年，Reveley、Samuel Parr 的女儿 Sarah、Alderson 与 Inchbald 都曾是他留意的对象。1796 年 1 月重新结识后，沃斯通克拉夫特于 1796 年 4 月一反常规地拜访了戈德温；此后两人经常见面通信，到 7 月已十分亲近，8 月成为情人。他们的书信与便笺留下了一份动人的记录：一段哲学性的关系如何逐渐被感情所颠覆，而这感情戈德温在理智上难以安顿，沃斯通克拉夫特也难以信任。沃斯通克拉夫特 12 月怀孕，经过反复斟酌如何使行动与原则相符，两人于 1797 年 3 月结婚。沃斯通克拉夫特 1797 年 9 月产后去世，戈德温悲痛欲绝，还要抚养婴儿玛丽（即后来的 Mary Shelley）与 Fanny Imlay（沃斯通克拉夫特的私生女），并背负日益沉重的债务。他埋头工作：第三次、也是最后一次修订《政治正义论》，赶写一部沃斯通克拉夫特回忆录，编了一部她的文集，并动手写第二部重要小说《圣列昂》（*St Leon*，1799）。批评者已在戈德温的文集《探索者》（*The Enquirer*，1798）以及 1797 年底出版的《政治正义论》第三版修订中，看出沃斯通克拉夫特对他思想的影响。而他本人在《为女权辩护一书作者回忆录》（*Memoirs of the Author of the Vindication of the Rights of Women*，1798）以及《圣列昂》（1799）对婚姻的描写中，记录下的却是另一种关系感受。这部《回忆录》因披露沃斯通克拉夫特不合常规的性道德，激起一场轩然大波。戈德温昔日的若干相识与他断绝往来，他越来越成为效忠派报纸攻击的对象，其哲学见解在小说、评论与小册子里遭到戏仿与嘲弄。戈德温的应对颇有尊严。他的《读 Parr 博士〈医院布道〉有感》（*Thoughts Occasioned by the Perusal of Dr. Parr’s Spital Sermon*，1801）力求冷静地回答批评者，并承认他如今认识到的错误——这些错误在此前《探究》诸版的修订以及《圣列昂》的议论中已有所承认。但这番答复没能把他从当时压倒性的反动浪潮中救出；他在讨论马尔萨斯《人口原理》（*Essay on the Principle of Population*，1798）时关于弃婴与堕胎的失慎言论，被评论者如获至宝地抓住。戈德温的《政治正义论》是法国大革命所激起的热忱的产物，可到那十年之末，作者与其著作已被效忠主义以及日益支配英国政治与文坛的反动势力大肆声讨。此后他余生大半，Godwinism（戈德温主义）成了一个贬称。在不容异见的新政治气候里，戈德温转向文学与历史。他试写了两部剧作《安东尼奥》（*Antonio*，1800）与《福克纳》（*Faulkener*，1807），均未成功；1803 年写了两卷本《乔叟传》；两年后又出了一部小说《弗利特伍德，或情感新人》（*Fleetwood: or The New Man of Feeling*，1805）。为应付家务，他想另娶：他去找 Harriet Lee，对方觉得他太急；去找 Maria Reveley，她丈夫刚去世不久；又去找与丈夫分居、无法再婚的 Sarah Elwes。1801 年，带着两个孩子的寡妇 Mary Jane Clairmont 从阳台上探身问道：“我莫非真的见到了不朽的戈德温？”他的命运就此注定。
