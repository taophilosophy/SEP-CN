      William Godwin (1756–1836) was the founder of philosophical anarchism. In his *An Enquiry Concerning Political Justice* (1793) he argued that government is a corrupting force in society, perpetuating dependence and ignorance, but that it will be rendered increasingly unnecessary and powerless by the gradual spread of knowledge and the expansion of the human understanding. Politics will be displaced by an enlarged personal morality as truth conquers error and mind subordinates matter. In this development the rigorous exercise of private judgment, and its candid expression in public discussion, plays a central role, motivating his rejection of a wide range of co-operative and rule-governed practices which he regards as tending to mental enslavement, such as law, private property, marriage and concerts. Epitomising the optimism of events in France at the time he began writing, Godwin looked forward to a period in which the dominance of mind over matter would be so complete that mental perfectibility would take a physical form, allowing us to control illness and ageing and become immortal.
    step1: |-
      威廉·戈德温（1756–1836）是哲学无政府主义的奠基人。在《政治正义论》（*An Enquiry Concerning Political Justice*，1793）中，他主张政府是社会中的腐败力量，使依赖与无知长期延续；但知识的逐渐传播与人类理解力的扩展，将使政府越来越不必要、越来越无力。政治将被扩展了的个人道德所取代，真理战胜谬误，心灵使物质臣服。在这一发展中，私人判断的严格运用以及它在公共讨论中的坦诚表达起着核心作用。正因如此，他拒斥一系列合作性与规则支配的实践——诸如法律、私有财产、婚姻与音乐会——他认为这些实践趋向于精神上的奴役。戈德温概括了他动笔之时法国局势带来的乐观精神，展望这样一个时期：心灵对物质的支配将如此彻底，以致精神的可完善性会采取物质形态，使我们得以控制疾病与衰老，并变得不死。
    step2: |-
      威廉·戈德温（1756–1836）是哲学无政府主义的奠基人。他在《政治正义论》（*An Enquiry Concerning Political Justice*，1793）中提出：政府是社会中的腐败力量，使依赖与无知长期延续；但随着知识渐渐传播、人类理解力不断扩展，政府会越来越不必要，也越来越无力。政治终将被扩展了的个人道德取代，真理战胜谬误，心灵使物质臣服。这一进程的核心，是私人判断的严格运用，以及它在公共讨论中的坦诚表达。正因如此，戈德温拒斥法律、私有财产、婚姻、音乐会等一整套合作性与规则支配的实践，认为它们趋向精神上的奴役。他概括了动笔时法国局势带来的乐观精神，期待有朝一日心灵对物质的支配彻底到这种地步：精神的可完善性直接采取物质形态，人因而能控制疾病与衰老，乃至不死。
