      被弃置的初稿以孟德斯鸠与雷纳尔的著作为中心，而出版成书的那部作品放弃了阐述式的写法，发展出自己独立的论证路线。戈德温先为政治探究的重要性辩护，并驳斥道德与政治现象取决于气候、民族性格或奢侈之说。他主张性格是经验的函数，而人们所处的政府类型对其经验有压倒性的影响——坏的政府造出悲惨的男男女女。他起初愿意赞同*philosophe* 与共和派的看法，即政府能对德性的发展产生积极作用，但这一看法很快被搁置，转而主张：道德与政治的进步源自我们对道德与政治真理之理解的进展——这一过程没有止境。
