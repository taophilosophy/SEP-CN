      这类解释问题在戈德温研究中至今聚讼（比较 Clarke 1977 与 Philp 1986、Lamb 2009a）[^clark-1977][^lamb-2009a][^philp-1986]，《政治正义论》各版与后期著作何者更当倚重，又使争论更复杂。然而即便接受功利主义解读，这一学说严格说来仍只是个人道德判断的规诫。由于他对政府腐蚀性影响有更宽广的看法，这条原则无法延伸到政治。人人须尽力判断如何增进全体之善，但每个人的私人判断都应受到尊重，这使我们不得对他们行使权威。借这一约束，戈德温使功利主义摆脱了边沁及后世功利主义者较为国家主义的取向，也确保该学说保持根本上的平等主义形式。这一约束还支持另一种看法：戈德温之所以形成其哲学立场，与其说经由*philosophes*，不如说是把不从国教派关于私人判断神圣性的论证世俗化，并把它们的应用推及人类活动的一切方式。由此也支持这样一种解读：戈德温关切的乃是个人道德的完善，只是借用了效用的语言，而非严格意义上的功利主义。
