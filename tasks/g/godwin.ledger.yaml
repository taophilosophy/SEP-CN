      Philosophically Godwin’s greatest supporters were his contemporaries, such as Thomas Holcroft and John Thelwall, and a younger generation of men (and some literary women) who were attracted to Godwin’s intellectual rigour and his radical critique of the social and political order. Many later abandoned him, Coleridge, Wordsworth and Southey as part of a rising tide of loyalist reaction, Shelley and Byron, for more personal and domestic reasons. However, his philosophical anarchism had a profound influence on Robert Owen, William Thompson and other utopians in the nineteenth century, and there is also evidence of influence on the Chartist movement and on popular labour movements for political reform in the 1840s (see Marshall 1984: 390)[^marshall-1984]. His impact in literary circles was long lasting, both through his political writings, and through his novels. *Political Justice* was read and translated by Benjamin Constant in France, and an abridged edition was translated into German in 1803, along with the first three of Godwin’s mature novels. Marx and Engels knew of his work and cited him as having contributed to a theory of exploitation, and as being widely read by the proletariat. Later in the nineteenth century Anton Menger and Paul Eltzbacher introduced Godwin’s work to German audiences, leading to further translation. Caleb Williams appeared in Russian in 1838, and Chernyshevski, Kroptkin and Tolstoy all read and referred to him. In the late nineteenth century the last book of *Political Justice*, formally titled “Of Property”, but dealing with the prospects for progress in the human race and including his attacks on marriage and co-operation, was reprinted as a socialist tract, and the whole work was reprinted again in the 1920s. A critical edition of the third edition with variants appeared in 1946, and an edition of the 1793 text with both later variants and material from the original manuscripts appeared in 1993. Biographies of Godwin have also appeared regularly since the first by C. Kegan-Paul in 1876, which drew heavily on the extensive manuscript sources. Philosophical interest has been less pronounced, although since the 1940s a slow trickle of books has emerged which have sought to do justice to Godwin’s essentially liberal political principles and to his moral philosophy. That work has recognised the importance of thinkers of the French Enlightenment, and more recently the Dissenting inheritance which his education and early career provided. As a result, the traditional view of Godwin as a strict utilitarian has been increasingly challenged. Recent work in political philosophy on the appropriate form and scope of impartiality has looked to Godwin, most commonly to define a position to resist, but not exclusively so. There has also been an upsurge of interest in Godwin amongst literary scholars and historians studying the romantic period, producing a range of work examining a much wider span of Godwin’s corpus than has hitherto been the case and especially exploring the contribution that his Diary can make to understanding the political culture of London in the period.
    step1: |-
      在哲学上，戈德温最大的支持者是他的同时代人，如 Thomas Holcroft 与 John Thelwall，以及更年轻的一代人（还有一些爱好文学的女士），他们被戈德温的智识严谨与对社会政治秩序的根本批判所吸引。后来许多人弃他而去：Coleridge、Wordsworth 与 Southey 是随着效忠派反动的浪潮，Shelley 与 Byron 则出于更私人的家庭缘故。不过，他的哲学无政府主义对十九世纪的 Robert Owen、William Thompson 等乌托邦主义者有深远影响；也有证据表明，它影响了宪章运动以及 1840 年代争取政治改革的民众劳工运动（见 Marshall 1984: 390）[^marshall-1984]。他在文学圈的影响持久不衰，既通过政治著作，也通过小说。《政治正义论》在法国由 Benjamin Constant 阅读并翻译，1803 年有一个节译本连同戈德温最初三部成熟小说译成了德文。马克思与恩格斯知道他的著作，称他对剥削理论有所贡献，并说他拥有广大的无产阶级读者。十九世纪后期，Anton Menger 与 Paul Eltzbacher 把戈德温的著作介绍给德语读者，带来了更多译本。《凯莱布·威廉斯》1838 年有了俄文本，车尔尼雪夫斯基、克鲁泡特金与托尔斯泰都读过并提到他。十九世纪末，《政治正义论》的最后一卷——正式标题为“论财产”，但讨论的是人类进步的前景，也包含他对婚姻与合作的攻击——作为社会主义小册子重印；全书则于 1920 年代再次重印。1946 年出现了附有异文的第三版校勘本；1993 年出现了 1793 年正文本，附后来各版异文与原始手稿材料。自 1876 年 C. Kegan-Paul 的第一部传记以来，戈德温传记也陆续不断；那第一部大量利用了丰富的手稿材料。哲学上的兴趣则不那么显著，不过自 1940 年代以来，慢慢有一些著作出现，力图公正对待戈德温本质上是自由主义的政治原则与他的道德哲学。这些研究承认了法国启蒙思想家的分量，晚近更承认了他所受教育与早期生涯带来的不从国教传统。于是，把戈德温视为严格功利主义者的传统看法，日益受到挑战。近年政治哲学中关于不偏不倚的恰当形式与范围的研究，也把目光投向戈德温，最常见的是要界定一个可以拒斥的立场，但并不限于此。研究浪漫主义时期的文学学者与历史学者中，对戈德温的兴趣同样高涨，产生了一批成果，所考察的戈德温著述范围比以往宽广得多，尤其探究他的《日记》能为理解当时伦敦的政治文化作出什么贡献。
