      The Geluk tradition also sees the Consequence School as offering an unapologetic affirmation of conventional reality, including the reality of the person. The Geluk tradition holds that transformation and liberation do not require us to deny the reality of the world, but rather to cease the superimposition of essences onto the entities we encounter and onto ourselves as subjects. This is another way of saying that emptiness—the absence of essence—is a negation not of existence *per se*, but rather of *intrinsic* existence, or *essence*. That is, this analysis in terms of emptiness in a significant way leaves conventional phenomena intact, and merely refutes the claim that they exist ultimately. Significantly, the denial of self, too, does not mean the denial of the “mere I” (*bdag tsam*), or the conventionally existent person (Jinpa 2002, 71)[^jinpa-2002]. The mere I or the conventional person is also accepted as conventional existent in the Geluk tradition. Only its reification or true existence is denied.
    step1: |-
      格鲁派传统还认为，应成派对世俗实在——包括人的实在——作出了无所歉意的肯定。格鲁派传统主张，转化与解脱并不要求我们否认世界的实在，而是要求我们停止把本质增益到所遇的实体上，也停止增益到作为主体的我们自身之上。这换一种说法就是：空性——本质的缺席——所否定的不是存在*本身*，而是*自性的*存在，或曰*本质*。也就是说，这种以空性为核心的分析在很大程度上保全了世俗现象，仅仅驳斥了它们究竟存在的说法。同样重要的是，否定自我也不意味着否定“仅仅的我”（*bdag tsam*），即世俗存在的人（Jinpa 2002, 71）[^jinpa-2002]。“仅仅的我”或世俗的人，在格鲁派传统中也被承认为世俗存在者。被否定的只是它的实体化或真实存在。
    step2: |-
      格鲁派传统还认为，应成派理直气壮地肯定了世俗实在，包括人的实在。在他们看来，转化与解脱无需否认世界的实在，需要停止的只是把本质增益到所遇实体上，也增益到作为主体的自身之上。换个说法：空性是本质的缺席，它否定的不是存在*本身*，而是*自性的*存在，亦即*本质*。这一以空性为线索的分析，在很大程度上保全了世俗现象，只驳斥“它们究竟存在”的主张。同样值得注意的是，否定自我并不等于否定“仅仅的我”（*bdag tsam*），也就是世俗存在的人（Jinpa 2002, 71）[^jinpa-2002]。在格鲁派传统中，“仅仅的我”或世俗的人同样算作世俗存在者。它被否定的只是实体化，或者说真实存在。
