    kind: body
    source: |-
      Straddling the delicate line between a realist view that affirms the independent reality of universals and an antirealist one that denies the reality of concepts, a Geluk account of epistemology holds that universals are real, but that they do not exists separately from their particular instances. For instance, the universal “cow” and the particular instances of cow are held to be not utterly distinct, as antirealists would have it, nor are they held to be the same, as a strict realist would claim, but are rather said to be “extensionally identical but intensionally distinct” (Dreyfus 1997, 174–78)[^dreyfus-1997]. In the epistemological context, articulating this relationship is an attempt to account for the efficacy of concepts without giving universals an autonomous existence apart from their instances. Given that the Geluk tradition claims that Dharmakīrti’s epistemological project represents an inferior philosophical position, it is arguably studied for didactic purposes, whereas the nominalism of what Geluk thinkers consider their own tradition—the view of the Consequence School of the Middle Way—is the hallmark of their philosophy.
    step1: |-
      格鲁派的认识论说明游走于一条微妙的分界线两端：一端是肯定共相独立实在的实在论观点，另一端是否认概念实在的反实在论观点；它主张共相是实在的，但它们并不离开各自的个别实例而存在。例如，共相“牛”与牛的个别实例，既不像反实在论者所主张的那样截然不同，也不像严格实在论者所宣称的那样完全相同，而是被称为“外延相同而内涵有别”（Dreyfus 1997, 174–78）[^dreyfus-1997]。在认识论语境中，阐明这一关系，是试图说明概念的效力，同时又不让共相离开实例而独立存在。既然格鲁派传统主张法称的认识论方案代表一种较低的哲学立场，它之被研习可以说出于教学目的；而格鲁派思想家视为自家传统的唯名论——中观应成派的观点——才是其哲学的标记。
    step2: |-
      实在论肯定共相独立实在，反实在论否认概念实在，格鲁派的说法恰在这条微妙的分界线上。它主张共相是实在的，但不离开各自的个别实例而存在。以共相“牛”与牛的个别实例为例：反实在论者说两者截然不同，严格实在论者说两者完全相同，格鲁派都不取，而说它们“外延相同而内涵有别”（Dreyfus 1997, 174–78）[^dreyfus-1997]。在认识论的语境中，澄清这一关系，为的是说明概念何以有效，同时又不给共相一种脱离实例的独立存在。格鲁派传统承认，法称的认识论方案代表一种较低的哲学立场。因此研习它可以说出于教学目的；真正标志格鲁派哲学的，是格鲁派思想家视为自家传统的唯名论，也就是中观应成派的观点。
