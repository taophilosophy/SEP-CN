      Künzang Sönam (1823–1905) explains Tsongkhapa’s position as the thesis that minds and external objects are equally conventionally existent and equally ultimately nonexistent, and so of exactly the same ontological and epistemological status. He goes on to show how external objects are accepted conventionally in the Consequence School because the coextensive presence and absence of objects and cognitions undermines the claim that even conventionally there are no external objects. That is, when there are external objects, there are internal cognitions, and when there are internal cognitions, there are external objects; cognitions and objects are paired and thus rise and fall together. He reiterates this point by saying that not only does no conventional analysis negate external objects, but that conventional analysis undermines the absence of externality (Künzang 2007, 706–707). One might think that since Geluk philosophers take the existence of the external world to be affirmed in the Consequence School, that they are committed to external realism, and indeed some of their critics have accused them of this (The Yakherds 2021)[^yakherds-2021]. But the affirmation of the existence of the external world is simply an affirmation of its conventional reality, and of its knowability using conventional epistemic instruments. So, while Geluk philosophers are not idealists, they are certainly not external realists, either.
    step1: |-
      Künzang Sönam（1823–1905）把宗喀巴的立场解释为这样一个论题：心与外境同样世俗地存在，也同样胜义地不存在，因而在本体论与认识论上地位完全相同。他进而说明，应成派为何在世俗层面接受外境：因为对象与认知同延地共存共缺，这瓦解了“即便在世俗层面也没有外境”的主张。也就是说，有外境时就有内识，有内识时就有外境；认知与对象成对，因而同起同灭。他重申这一点说：不仅没有任何世俗分析否定外境，而且世俗分析恰恰瓦解了“无外境”之说（Künzang 2007, 706–707）。有人也许认为，既然格鲁派哲学家主张应成派肯定外部世界的存在，他们便承诺了外在实在论；的确，他们的一些批评者正是这样指责的（The Yakherds 2021）[^yakherds-2021]。但是，肯定外部世界的存在，不过是肯定它的世俗实在，肯定它可以借世俗量而被认知。所以，格鲁派哲学家不是唯心论者，但也绝非外在实在论者。
    step2: |-
