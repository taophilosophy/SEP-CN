      Tsongkhapa outlined three types of “intrinsic characteristic” (*rang mtshan*) that convey important features of the different metaphysical systems of the Abhidharma, Dharmakīrtian epistemology, and the Consequence School, respectively. Through this threefold distinction he sets up his presentation of what uniquely defines the ultimate truth, and by implication, the conventional truth, in the Consequence School, while incorporating a range of metaphysical systems into his comprehensive interpretative scheme. Firstly, Tsongkhapa says that an “intrinsic characteristic” is distinguished from a “general characteristic” in the Abhidharma context of metaphysics, where an intrinsic characteristic distinguishes a particular trope from a general type. That is to say, an intrinsic characteristic marks a contrast that delineates, for instance, the heat of fire (intrinsic characteristic) from its being a member of the larger class of material form (general characteristic). Tsongkhapa conveys another meaning of “intrinsic characteristic” found in Dharmakīrtian epistemology that distinguishes the “intrinsic characteristic” that is the unique particular from that which is a universal. In contrast to the second meaning of “intrinsic characteristic”—which marks a contrast of a more real kind of entity (a particular) from another, less substantially real counterpart (a universal)—the third meaning of “intrinsic characteristic” represents a subtle kind of reification that is a problem. This third type of intrinsic characteristic is presupposed by distorted cognitions that impute things to have independent existence. This kind of intrinsic characteristic, as the imputation of things existing on their own, even conventionally, is what Tsongkhapa describes as the subtle reification that is uniquely eliminated in the philosophical system of the Consequence School (Tsongkhapa 2008, 425–426)[^tsongkhapa-2008].
    step1: |-
      宗喀巴勾画出三种“自相”（*rang mtshan*），它们分别传达阿毗达磨、法称认识论与应成派不同形而上学体系的重要特征。通过这三重区分，他建立起自己对何者独特性地界定应成派胜义谛（并由此界定世俗谛）的表述，同时把一系列形而上学体系纳入其综合性的解释框架。第一，宗喀巴说，在阿毗达磨的形而上学语境中，“自相”与“共相”相对：自相把某一个别（trope）与一个一般类型区别开来。也就是说，自相标示一种对比，例如把火的热性（自相）与火之属于色法这一更大类别（共相）区别开来。宗喀巴还传达了法称认识论中“自相”的另一种含义，即把作为独特个别的“自相”与作为共相者区别开来。与“自相”的第二种含义——它标示较真实的一类实体（个别）与实体性较弱的对应物（共相）之间的对比——不同，“自相”的第三种含义代表一种成问题的微妙实体化。这第三类自相，是那些把事物增益为独立存在的颠倒认知所预设的。这种自相，即把事物增益为自方存在（即便在世俗层面）的做法，就是宗喀巴所说的微妙实体化；唯有在应成派的哲学体系中，它才被独特地消除（Tsongkhapa 2008, 425–426）[^tsongkhapa-2008]。
