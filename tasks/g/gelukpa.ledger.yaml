      Tsongkhapa argues that another distinctive feature of the Consequence school is its recognition of the existence of “disintegration as an entity” (*zhig pa’i dngos po*) to account for causality (Hopkins 2003, 934–35)[^hopkins-2003]. The impetus for the theory that disintegration is a distinct entity is to provide an account for causality in the absence of substance. Tsongkhapa argues that an entity’s disintegration—which many other Buddhist philosophical systems take to be a non-entity—is just as real as any positive entity, and so itself is as causally efficacious as any other entity or event. While attributing causal power to disintegration is an attempt to preserve a non-substantialist theory of causality, this theory invites other problems, such as the reification of absence (i.e., treating emptiness as a “thing”), which has been a frequent target for critics of the Geluk tradition.
    step1: |-
      宗喀巴论证说，应成派的另一个独特之处是：它承认“坏灭作为实体”（*zhig pa’i dngos po*）的存在，以此说明因果（Hopkins 2003, 934–35）[^hopkins-2003]。主张坏灭是一个独立实体的动因，是要在无实体的情况下说明因果。宗喀巴论证说，实体的坏灭——许多其他佛教哲学体系视为非实体——与任何肯定性的实体同样真实，因而其本身也与任何其他实体或事件一样具有因果效力。尽管赋予坏灭以因果力是为保住一种非实体主义的因果理论，这一理论却招来别的问题，例如把无实体化（即把空性当作一个“东西”），而这正是格鲁派批评者屡屡攻击的靶子。
    step2: |-
      应成派还有一处独特：它承认“坏灭作为实体”（*zhig pa’i dngos po*）的存在，以之说明因果（Hopkins 2003, 934–35）[^hopkins-2003]。宗喀巴就是这样论证的。提出“坏灭是独立实体”一说，用意是在没有实体的前提下说明因果。许多其他佛教哲学体系把实体的坏灭看作非实体，宗喀巴却主张，坏灭与任何肯定性的实体同样真实，本身也和别的实体或事件一样具有因果效力。赋予坏灭以因果力，本是想保住非实体主义的因果理论，却招来别的麻烦。例如把“无”实体化，也就是把空性当成一个“东西”，这恰恰是格鲁派批评者屡屡攻击的靶子。
