      ## 2 世俗谛与应成派
  - id: 6
    kind: body
    source: |-
      Geluk philosophers take the radically anti-foundationalist, antirealist Consequence School (Prāsaṅgika Madhyamaka), grounded in the texts of the Indian Buddhist philosophers Buddhapālita and Candrakīrti, to be the most sophisticated school of Buddhist philosophy. The Consequence School gets its name from the fact that it relies on *reductio* argument to demonstrate emptiness, in contrast to independent formal arguments. According to Tsongkhapa, no independent formal argument can prove the emptiness of phenomena to those not already convinced of that fact because these arguments presuppose a common understanding of the terms used. That is, this kind of formal argument presumes that a subject matter is objective or given and is understood in the same way by all parties to the debate, and he follows Candrakīrti in arguing that this cannot be the case when an antirealist (who understands emptiness) and a realist (who lacks an understanding of emptiness) engage in dialogue (Changkya in Cozort 1998, 451)[^cozort-1998]. This is because a proponent of the Consequence School consents to no such given, objective facts.
    step1: |-
      格鲁派哲学家认为，彻底反基础主义、反实在论的应成派（Prāsaṅgika Madhyamaka）以印度佛教哲学家佛护（Buddhapālita）与月称（Candrakīrti）的论典为依据，是佛教哲学中最精微的学派。应成派得名于它依靠*归谬*论证证明空性，而不用独立自成的正式论证。按宗喀巴的说法，对那些尚未信受这一事实的人，任何独立自成的正式论证都无法证明现象的空性，因为这类论证预设了所用术语有共同的理解。也就是说，这类正式论证假定论题客观给定，辩论各方对它的理解相同；宗喀巴追随月称主张，当一位反实在论者（理解空性的人）与一位实在论者（缺乏空性理解的人）对话时，情况不可能如此（Changkya in Cozort 1998, 451）[^cozort-1998]。这是因为应成派的拥护者不承认任何此类给定的、客观的事实。
    step2: |-
      应成派（Prāsaṅgika Madhyamaka）以印度佛教哲学家佛护（Buddhapālita）与月称（Candrakīrti）的论典为依据，立场彻底反基础主义、反实在论。格鲁派哲学家视之为佛教哲学中最精微的学派。应成派之名，来自它专靠*归谬*论证证明空性，不用独立自成的正式论证。宗喀巴指出，任何独立自成的正式论证都证明不了现象为空，对尚未信解空性的人尤其如此。原因在于，这类论证预设了双方对所用术语有共同理解。换句话说，它假定论题客观给定，辩论各方对它的理解一模一样。宗喀巴随月称而主张：一旦对话一方是理解空性的反实在论者，另一方是不解空性的实在论者，这种预设便站不住（Changkya in Cozort 1998, 451）[^cozort-1998]。应成派的拥护者根本不承认有这类给定的客观事实。
  - id: 7
    kind: body
    source: |-
      By invoking consensus as the mark of (conventional) reality, the Geluk school’s coherence theory of truth anticipates some of the insights of the later Wittgenstein (see Thurman 1980)[^thurman-1980]. There are no foundations in the Geluk tradition, neither ultimate nor conventional; there is only transactional usage—“what is renowned in the world.” Thus, unlike some other Middle Way philosophies, like the Autonomy School (*svātantrika*), the distinction between “correct” or “incorrect” relative truth itself depends upon our epistemic conventions and practices, not on a world of independent truthmakers. “What works” is the criterion; that is, what conforms to the ways of the world is a conventional truth in the way that a game works when you subscribe to its rules. Any further notion of a “correct” relative implicates a foundation, an essentialist presumption about the way things are (Changkya 1998, 321; Bötrül 2011, 141). Therefore, the measure of what is correct is simply what conforms to the world rather than based on any other warrant that would serve as a deeper structure or more fundamental layer of reality beyond what is simply conventional (Cozort 1998, 52)[^cozort-1998].
    step1: |-
      格鲁派以共识作为（世俗）实在的标志，其真理融贯论预示了后期维特根斯坦的某些洞见（see Thurman 1980）[^thurman-1980]。在格鲁派传统中没有基础，无论胜义的基础还是世俗的基础；有的只是事务性的用法——“世间所共许者”。因此，与自续派（*svātantrika*）等其他一些中观哲学不同，“正确”或“不正确”的相对真理之分，本身取决于我们的认识论惯例与实践，而不取决于一个由独立真值制造者构成的世界。“管用”就是标准；也就是说，凡与世间的方式相合者即是世俗真理，正如你接受一场游戏的规则，游戏便能进行。任何更进一步关于“正确”相对物的观念，都牵连着一个基础，一种关于事物本来面目的本质主义预设（Changkya 1998, 321; Bötrül 2011, 141）。所以，衡量何为正确的尺度，就只是与世间相合，而不是基于任何别的凭据——那种凭据会被当作比单纯世俗之物更深的结构或更根本的实在层次（Cozort 1998, 52）[^cozort-1998]。
    step2: |-
      格鲁派拿共识当作（世俗）实在的标志，其真理融贯论与后期维特根斯坦的某些洞见不谋而合（see Thurman 1980）[^thurman-1980]。在格鲁派传统里，胜义也好，世俗也好，都没有基础可言；剩下的只有事务性的用法，即“世间所共许者”。自续派（*svātantrika*）等其他中观哲学另有说法，格鲁派则不然。“正确”的相对真理与“不正确”的相对真理如何区分，在格鲁派看来取决于我们的认识惯例与实践，而不取决于一个由独立真值制造者构成的世界。标准是“管不管用”。凡合乎世间方式者即为世俗真理，就像你认下一场游戏的规则，游戏便玩得下去。若再追问什么才叫“正确”的相对物，那就已经牵连到一个基础，一种关于事物本来面目的本质主义预设（Changkya 1998, 321; Bötrül 2011, 141）。因此，衡量正确与否的尺度只是与世间相合，而不靠别的凭据；那类凭据会被当成比单纯世俗之物更深的结构、更根本的实在层次（Cozort 1998, 52）[^cozort-1998]。
