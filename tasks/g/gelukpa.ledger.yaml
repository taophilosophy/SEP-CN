      ## 1. Ultimate Truth and the Middle Way
    step1: |-
      ## 1. 胜义谛与中观
    step2: |-
      ## 1 胜义谛与中观
  - id: 3
    kind: body
    source: |-
      The Geluk interpretation of the Middle Way offers a unique presentation of the Buddhist doctrine of two truths: the ultimate truth and conventional (or relative) truth. Geluk philosophers are concerned to avoid the reification of the ultimate truth and the deprecation of conventional truth, arguing that conventional existence and ultimate nonexistence are mutually implicative. In this tradition, the two truths are said to be “extensionally identical but intensionally distinct” (*ngo bo gcig la ldog pa tha dad*). That is, the two truths are not different entities, but are conceptually distinct aspects of all entities. Thus Geluk philosophers argue that (1) to exist is to be empty and (2) to exist is to exist conventionally (see Changkya in Cozort 1998, 429)[^cozort-1998].
    step1: |-
      格鲁派对中观的解释，为佛教二谛学说——胜义谛与世俗（或相对）谛——提供了一种独特表述。格鲁派哲学家所关心的，是避免把胜义谛实体化，也避免贬低世俗谛；他们主张，世俗的存在与胜义的不存在相互蕴含。在这一传统中，二谛被说成“外延相同而内涵有别”（*ngo bo gcig la ldog pa tha dad*）。也就是说，二谛并非不同的实体，而是同一批实体在概念上可分的两面。因此格鲁派哲学家主张：（1）存在即空；（2）存在即世俗存在（see Changkya in Cozort 1998, 429）[^cozort-1998]。
    step2: |-
      格鲁派对中观的理解，为佛教二谛学说提供了一种独特表述。二谛即胜义谛与世俗谛，或称相对谛。格鲁派哲学家力求两头兼顾：既不把胜义谛实体化，也不贬低世俗谛。在他们看来，世俗的存在与胜义的不存在互相蕴含。这一传统称二谛“外延相同而内涵有别”（*ngo bo gcig la ldog pa tha dad*）。可见二谛并不是两种不同的实体，而是同一批实体在概念上可分的两面。由此，格鲁派哲学家主张两点：其一，存在即空；其二，存在即世俗存在（see Changkya in Cozort 1998, 429）[^cozort-1998]。
  - id: 4
    kind: body
    source: |-
      The ultimate truth is said to be emptiness because things are not found to exist separate from their parts, causes, or designations; this non-finding itself is the meaning of emptiness. Emptiness, too, is not “found” when sought (emptiness is empty, too). To be found (when an ultimate essence is sought) is to be intrinsically or ultimately real, and nothing has this status for the Geluk tradition, not even emptiness. Emptiness is interpreted in the Geluk tradition as a non-implicative negation (*med dgag*). As opposed to a negation that implies something else, a non-implicative negation is simply an absence, such as a lack of true existence. This mere lack or absence, as a negation of essence that does not implicate any other essence, is the meaning of the ultimate truth in the Geluk tradition. Nevertheless, the claim that there is nothing ultimately real—or that the ultimate truth is emptiness—is itself a (conventional) truth (Jinpa 2002, 46–48)[^jinpa-2002]. It is expressed like this: “The ultimate truth is posited as solely the negation of truth [that is, inherent existence] upon a subject that is a basis of negation…” (Tsongkhapa 1979, 396)[^tsongkhapa-1979]. Thus, on this view, nothing exists ultimately. This lack of essence in phenomena, or “emptiness,” does not annul their appearance or conventional reality. Rather, emptiness is held to be the condition for the possibility for any appearance. To be empty means to arise dependently—to lack independent, real existence. Since nothing can be found to be independent, everything is said to be empty. Thus, in the Geluk tradition, emptiness is the nature of all phenomena (or their *lack* of independent nature), and all phenomena are necessarily empty.
    step1: |-
      胜义谛之所以被称为空性，是因为事物无法被找到为离其支分、其因或其假名而存在；这一“找不到”本身就是空性的含义。空性在被寻求时也“找不到”（空性也是空的）。所谓“被找到”（在寻求究竟本质之时），是指自性地或究竟地真实，而格鲁派传统认为没有任何东西具有这种地位，连空性也没有。在格鲁派传统中，空性被解释为无遮（*med dgag*）。与蕴含他者的否定不同，无遮只是一种单纯的缺席，例如真实存在的缺乏。这种单纯的缺乏，作为对本质的否定而不蕴含任何其他本质，就是格鲁派传统中胜义谛的含义。然而，“没有任何东西究竟真实”这一主张——或者说“胜义谛即是空性”——本身就是一个（世俗的）真理（Jinpa 2002, 46–48）[^jinpa-2002]。它被表述如下：“胜义谛，唯是于作为所遮基础的有法之上，遮破真实［即自性存在］而安立……”（Tsongkhapa 1979, 396）[^tsongkhapa-1979]。所以，按此观点，没有任何东西究竟存在。现象中这种本质的缺乏，或曰“空性”，并不取消它们的显现或世俗实在。相反，空性被视为任何显现之所以可能的前提条件。空即是缘起——即缺乏独立的、真实的存在。既然找不到任何独立者，一切便都被说为空。因此，在格鲁派传统中，空性是一切现象的本性（或说它们*缺乏*独立的本性），而一切现象必然为空。
    step2: |-
      胜义谛之所以叫空性，是因为事物离开自己的支分、因与假名便无从寻得；这种“寻而不得”本身就是空性的含义。空性自己也是寻而不得的（空性亦空）。所谓“寻得”，指在追问究竟本质时找到某种自性成立或究竟真实的东西。格鲁派传统认为，没有任何事物具备这种地位，空性也不例外。空性在格鲁派传统中被解释为无遮（*med dgag*）。有些否定会连带肯定另一物，无遮则不同，它只是单纯的缺席，比如真实存在的阙如。这种纯粹的阙如，作为对本质的否定而不肯定任何其他本质，正是格鲁派眼中胜义谛的含义。话虽如此，“没有任何东西究竟真实”或“胜义谛即空性”这一主张，本身仍是一条（世俗的）真理（Jinpa 2002, 46–48）[^jinpa-2002]。宗喀巴的表述是：“胜义谛，只是就作为所遮基础的有法，遮破真实［即自性存在］而安立……”（Tsongkhapa 1979, 396）[^tsongkhapa-1979]。照此看法，没有任何事物究竟存在。现象没有本质，或者说现象“空”，并不取消它的显现，也不取消它的世俗实在。恰恰相反，空性被视为一切显现之所以可能的前提。空，就是缘起而有，就是没有独立而真实的存在。既然找不到任何独立之物，一切便都说是空。于是在格鲁派传统中，空性是一切现象的本性（更确切地说，是它们*缺乏*独立本性），而一切现象无不是空。
