      Tsongkhapa’s third criterion for conventional truth, that a conventional truth is not undermined (*gnod*) by ultimate analysis, should be understood to mean that a thing’s being empty does not undermine or annul its (conventional) existence. It does *not* mean that the conventional world is insulated from the force of an ultimate analysis or is immune to conventional revision, which the second criterion explicitly confirms. In other words, that something is not undermined by ultimate analysis does not mean that it is immune and unaffected by this analysis. Rather, it means that the object *qua* object does not change in the wake of ultimate analysis, *mere* appearances remain, but are seen as illusion-like—*mere* objects without intrinsic existence. This is because emptiness does not eliminate the world of appearances but enables it; and a correct understanding of the way things are empty (that they are relationally constituted without intrinsic existence) impinges on how they are understood and related to subjectively; otherwise, a correct understanding emptiness would not carry liberative force. Nevertheless, Tsongkhapa’s first criterion of conventional truth sets up consensus as a fundamental feature of the conventional world, which is in tension with a revisionary metaphysics that goes hand-in-hand with the emancipatory power of emptiness. Yet a unified vision of ultimate and conventional truth is precisely what enables his metaphysical basis of ethics, which affirms an ethical dimension built into the constitution of the world, rather than an ethics relegated to a separate domain and treated as merely an instrument, appendage, or afterthought.
    step1: |-
      宗喀巴关于世俗谛的第三条标准——一条世俗真理不被胜义分析所损害（*gnod*）——应理解为：某物之空并不损害或取消它的（世俗）存在。这*并不*意味着世俗世界被隔离于胜义分析的力量之外，或对世俗层面的修正具有免疫力；第二条标准已明确肯定了后者。换言之，某物不被胜义分析损害，并不意味着它对这种分析免疫、不受其影响。它的意思是：对象*作为*对象并不因胜义分析而改变，*单纯的*显现依然留存，但被看作如幻——没有自性存在的*单纯*对象。这是因为空性并不消除显现的世界，而是使之成为可能；而对事物如何为空（即它们由关系构成、没有自性存在）的正确理解，会影响它们如何被主观地理解与关联；否则，对空性的正确理解就不会具有解脱的力量。然而，宗喀巴的第一条世俗谛标准把共识确立为世俗世界的一个根本特征，这与一种修正性的形而上学处于张力之中，而后者与空性的解放力量携手而行。不过，正是胜义谛与世俗谛的统一视野，才使他的伦理学形而上学基础成为可能：这一基础肯定一种内建于世界构造之中的伦理维度，而不是把伦理贬置到一个分离的领域，当作单纯的工具、附属品或事后之想。
    step2: |-
      第三条标准说的是：世俗真理不被胜义分析损害（*gnod*）。这里的意思是，某物为空，并不损害、也不取消它的（世俗）存在。它*并不*意味着世俗世界被隔离在胜义分析的作用之外，或者说世俗层面不可修正；第二条标准已经明确承认世俗层面可以修正。换句话说，某物不受胜义分析损害，不等于它对这种分析免疫、毫无触动。真正的意思是：对象*作为*对象，并不因胜义分析而改变；*单纯的*显现仍然留存，只是被看作如幻，即没有自性存在的*单纯*对象。原因在于，空性不消灭显现的世界，反而让它成为可能。对事物如何为空获得正确理解，即理解它们由关系构成、没有自性存在，会改变我们主观上如何理解它们、如何与之相处；否则，正确的空性理解便不会有解脱的力量。不过，宗喀巴的第一条标准把共识立为世俗世界的根本特征，这与一种修正性的形而上学存在张力，而后者恰与空性的解放力量相辅相成。尽管如此，正是胜义谛与世俗谛相统一的视野，成就了他伦理学的形而上学基础。这一基础肯定伦理维度本就内建于世界的构造之中，而不是把伦理贬到另一个领域，当作工具、附属品或事后补记。
