      Therefore, rather than overcoming mistaken concepts by circumventing them in a mystical flash of insight or an ecstatic experience of union, the Geluk tradition offers a more sober way to overcome misconceptions, one based on clear, rational analysis and a direct appeal to this world. That is, this tradition holds reasoned analysis to be necessary to understand the nature of phenomena (or rather, their *lack* of nature). This is because an ascertainment of the lack of true existence is held to be necessary to counteract the directly opposed notion—the apprehension of true existence—which is the misinterpretation of reality (as more than simply conventionally existing) that binds one to suffering. To do this, it is not sufficient to simply “let be,” stare into space, or ignore the cause of misinterpretation in some tranquil “nonconceptual” meditation; rather, one must have insight induced by reason that counteracts the habit of holding onto true existence (Tsongkhapa 2000, 788)[^tsongkhapa-2000].
    step1: |-
      因此，格鲁派传统并不靠神秘顿悟的一闪或狂喜合一的体验来绕过错误概念，而是提供一条更清醒的克服误解之路：基于清晰的理性分析，并直接诉诸此世。也就是说，这一传统认为，要理解现象的本性（更确切地说，是它们*缺乏*本性），推理分析必不可少。这是因为，要对抗与之直接相反的念头——执取真实存在——就必须确定真实存在的缺乏；这一执取是对实在的误解（把实在误解为多于单纯世俗存在），正是它把人束缚于苦难。要做到这一点，仅仅“随它去”、呆望虚空，或在某种宁静的“无概念”禅修中无视误解的成因，是不够的；人必须获得由推理引生的洞见，以对抗执持真实存在的习惯（Tsongkhapa 2000, 788）[^tsongkhapa-2000]。
    step2: |-
      所以，格鲁派不靠神秘顿悟的一闪，也不靠狂喜合一的体验来绕过错误概念。它提供的路更为清醒：凭借清晰的理性分析，直接诉诸此世。这一传统认为，要理解现象的本性（更确切地说，是它们*缺乏*本性），推理分析必不可少。道理在于：要对抗与空性直接相反的念头，即执取真实存在，就必须先确定真实存在并不存在。这种执取正是对实在的误解，把实在看成多于单纯的世俗存在，而它把人束缚在苦难之中。要做到这一点，光“随它去”、呆望虚空，或在某种宁静的“无概念”禅修里无视误解的成因，都不够。人必须获得由推理引生的洞见，以此对抗执持真实存在的习惯（Tsongkhapa 2000, 788）[^tsongkhapa-2000]。
