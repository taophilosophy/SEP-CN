      In contrast to the conventional reality that exists, ultimate or intrinsic reality does not exist. What exists necessarily does so conventionally, relationally. To the extent that we can understand and talk about how the world *really* is, it is so only as a *conventional* (relational) world, without intrinsic existence or ultimate reality. In Tsongkhapa’s articulation, when we superimpose an intrinsic, ultimate reality to things, we impute an excess, a false imputation that is a source of confusion and suffering. An important feature of Tsongkhapa’s system is that when the two truths are related to in an asymmetrical way—as a hierarchical division between appearance and reality—one is implicitly committed to a reified conception of the world even while this reification may be explicitly denied. This happens when ultimate reality is understood to be sanctioned off from the conventional world, while the conventional world is treated as a separate plane or level of reality—rendered utterly unaffected by an ultimate analysis of its nature. That is, when the two truths are compartmentalized and held to be rigidly separate, not only does one fall to the extreme of nihilism in denying the conventional world, but one falls to the extreme of realism by reifying the ultimate world.
    step1: |-
      与存在的世俗实在相对，胜义的或自性的实在并不存在。凡存在者，必然以世俗的、关系的方式存在。我们能够理解并谈论世界*真正*如何，其限度仅在于：它只是一个*世俗的*（关系的）世界，没有自性存在，也没有胜义实在。在宗喀巴的阐述中，当我们给事物增益一种自性的、胜义的实在时，我们便添附了多余之物，这是一种虚假的增益，是迷惑与痛苦的根源。宗喀巴体系的一个重要特征是：当我们以不对称的方式处理二谛——把它当作显现与实在之间的层级划分——即便可能明确否认实体化，我们已在暗中承诺了一种实体化的世界观念。这种情况发生在：胜义实在被理解为与世俗世界隔离开来，而世俗世界被当作一个分离的实在层面或层级——据说它完全不受对其本性的胜义分析影响。也就是说，当二谛被分格安置并被视为僵硬分离时，人不仅由于否认世俗世界而堕入虚无主义的极端，还由于把胜义世界实体化而堕入实在论的极端。
