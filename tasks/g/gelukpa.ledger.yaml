    kind: body
    source: |-
      Geluk monks who train in philosophy study epistemology early in their careers, and debate is a primary means by which this tradition is internalized and enacted. Buddhist epistemology, as codified in Dharmakīrti’s *Commentary on Epistemology* (*Pramāṇavārttika*), lays out a systematic presentation of the means of knowledge and the rules for valid inference. Dharmakīrti’s epistemology can be said to be antirealist or conceptualist, in that he denies that language directly relates to the contents of perception, which are ineffable particulars. Yet to account for the relationship between real particulars and unreal universals, the Geluk tradition develops what has been dubbed a “moderate realist” position, whereby it asserts that there are universals that are real entities in contrast to the antirealism that denies that universals are entities (Dreyfus 1997, 173)[^dreyfus-1997]. Here again we see a collapse of duality; this time, the concept-percept duality that underwrites Dharmakīrtian epistemology.
    step1: |-
      在哲学上受训的格鲁派僧人在其学涯早期就学习认识论，而辩论是这一传统得以内化并付诸实践的主要手段。佛教认识论在法称的《释量论》（*Pramāṇavārttika*）中得到编纂，系统阐述了知识的手段与有效推理的规则。法称的认识论可以说是反实在论的或概念论的，因为他否认语言直接关联知觉的内容，而知觉内容是难以言表的个别。然而，为了说明真实个别与不真实共相之间的关系，格鲁派传统发展出一种被称为“温和实在论”的立场：它主张存在一些作为真实实体的共相，与否认共相是实体的反实在论相对（Dreyfus 1997, 173）[^dreyfus-1997]。这里我们又一次看到二元的坍缩，这一次是支撑法称认识论的概念—知觉二元。
    step2: |-
      格鲁派僧人学哲学，早早就学认识论。辩论则是内化并实践这一传统的主要手段。法称的《释量论》（*Pramāṇavārttika*）系统阐述了知识的手段与有效推理的规则，佛教认识论由此定型。法称认识论可说是反实在论的，也可说是概念论的：他否认语言直接关联知觉内容，而知觉内容是不可言说的个别。然而，真实个别与不真实共相之间的关系仍待说明。为此，格鲁派传统发展出一种被称为“温和实在论”的立场。它主张有些共相是真实实体，以此与否认共相为实体的反实在论相对（Dreyfus 1997, 173）[^dreyfus-1997]。这里又一次看到二元对立坍缩，这回坍缩的是支撑法称认识论的概念—知觉二元。
