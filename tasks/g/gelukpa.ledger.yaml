      Tsongkhapa and his Geluk followers insist that nothing exists on its own even conventionally, and that interdependence is universal (Tsongkhapa 1988, 585). Therefore, we cannot ground conventions in any deeper foundation. The fact that there is nothing but groundless conventions—all the way up and all the way down—is another way of seeing why the ultimate and the conventional are not distinct from one another; the two truths are none other than two aspects of the same thing. Geluk philosophers argue that this explains the crucial distinction between the Middle Way (Madhyamaka) and the Mind-Only (Cittamātra or Yogācāra) schools of Buddhist philosophy which, on their reading, assigns the mind a privileged ontological status as the truly existent ground of an illusory external world. Rather than claim that the mind is independently real in contrast to unreal external objects, like a subjective idealist, Geluk theorists argue that a proponent of the Middle Way explicitly affirms the interdependency of minds and objects.
    step1: |-
      宗喀巴及其格鲁派追随者坚持：没有任何事物即便在世俗层面也自方存在，而且相互依存是普遍的（Tsongkhapa 1988, 585）。因此，我们无法把惯例安立于任何更深的根据之上。除了无根据的惯例以外别无他物——向上如此，向下亦然——这是看清胜义与世俗为何彼此不分的另一种方式；二谛不外是同一事物的两个方面。格鲁派哲学家主张，这解释了佛教哲学中中观（Madhyamaka）与唯识（Cittamātra 或 Yogācāra）两派之间的关键区别：按他们的解读，唯识派赋予心一种本体论上的特权地位，把它当作虚幻外境的真实存在根据。格鲁派理论家并不像主观唯心论者那样宣称心独立实在、与外境之非实在相对；他们主张，中观的拥护者明确肯定心与境的相互依存。
    step2: |-
      宗喀巴与格鲁派追随者坚持两点：没有任何事物即便在世俗层面也自方存在；相互依存无处不在（Tsongkhapa 1988, 585）。既然如此，惯例便无法安立在更深的根据之上。世上除了无根据的惯例别无他物，往上如此，往下也如此；换个角度看，这正是胜义与世俗何以彼此不分的原因。二谛不过是同一事物的两面。格鲁派哲学家认为，这正好说明了佛教哲学里中观（Madhyamaka）与唯识（Cittamātra，或瑜伽行派 Yogācāra）两派的关键分歧。按他们的解读，唯识派给心安排了本体论上的特权地位，把心当作虚幻外境的真实存在根据。主观唯心论者主张心独立实在、外境虚妄；格鲁派理论家不然。他们主张，中观的拥护者明确肯定心与境的相互依存。
