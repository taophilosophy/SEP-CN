      The equal deconstruction of all grounds is a unique feature of the Consequence School that, which at first blush might seem counter-intuitive, is in fact what enables Tsongkhapa to construct a robust ethic that centers the human world. This is because human beings are not reducible to something more real—neither to mental and material components nor to a single cosmic mind. Persons, as relationally-constituted entities of the conventional world, are not reducible to something more fundamental than what they are—conceptual-constructions of the conventional world—as this is the only “real” world that can be said to exist since nothing exists ultimately. Thus, the world composed of humans, beings, humanity—the conventional, appearing world—remains in the wake of ultimate analysis that undermines intrinsic existence. Yet this world is reconstituted as interdependent under a gaze integrated with wisdom whereby it appears as like an illusion, without intrinsic existence. This pairing of deconstruction and ethics constitutes a metaphysical ground of ethics in the work of Tsongkhapa.
    step1: |-
      对一切根据作平等的解构，是应成派的一个独特之处；初看之下这似乎反直觉，实际上正是它使宗喀巴得以建构一种以人类世界为中心的强健伦理。这是因为，人无法被还原为某种更真实的东西——既不能还原为心理与物质成分，也不能还原为一个单一的宇宙心。人作为世俗世界中由关系构成的实体，无法被还原为比其本身更根本的东西——即世俗世界的概念构造——因为既然没有任何东西究竟存在，这就是唯一可以说存在的“真实”世界。因此，由人、众生、人类组成的世界——那个世俗的、显现的世界——在瓦解自性存在的胜义分析之后依然留存。不过，这个世界在与智慧相融合的目光下被重构为相互依存的，从而显得如幻，没有自性存在。解构与伦理的这种配对，在宗喀巴的著作中构成了伦理的形而上学根据。
    step2: |-
      应成派有一个独特之处：它对一切根据一视同仁地解构。乍看之下，这似乎有悖直觉；实际上，正是这一点让宗喀巴得以建构一种以人类世界为中心的坚实伦理。理由在于，人不能被还原为某种更真实的东西，无论心理与物质成分，还是一个唯一的宇宙心。人是世俗世界中由关系构成的实体，不能被还原为比自身更根本之物，也就是世俗世界的概念构造。既然没有任何东西究竟存在，这个世俗世界便是唯一可以说存在的“真实”世界。因此，由人、众生、人类组成的世界，那个世俗而显现的世界，在瓦解自性存在的胜义分析之后依然留存。只是在与智慧相融的目光下，它被重构为相互依存的，显得如幻，没有自性存在。解构与伦理这样配对，在宗喀巴的著作中为伦理奠定了形而上学根据。
