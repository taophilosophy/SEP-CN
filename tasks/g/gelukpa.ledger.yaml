    source: |-
      Thus, in Geluk philosophy, we can say that insight into reality is not held to be beyond thought, or attributed to some third category beyond the world that is neither existent nor nonexistent, but is simply insight into a world that is neither (ultimately) existent nor (conventionally) nonexistent. Even though Geluk scholars consent to the fact that emptiness can be perceived nonconceptually—in the rarified case of a highly developed meditation—they maintain that the emptiness that is known nonconceptually is no different from the emptiness that is conceptually known. The sharp distinction between the conceptual and perceptual arguably falls away when there is nothing beyond conceptual designation. It is not a surprise then that it is the *conceptual* ascertainment of emptiness that is a principal element of the Geluk school’s philosophy. Moreover, their emphasis on the practice of insight is not based on an appeal to a direct, unmediated access to what is beyond concepts, but to reason. Reason is also given priority over scriptural authority, which is subjected to the scrutiny of analysis and is adjudicated by reason (Tsongkhapa in Hopkins 1999, 71)[^hopkins-1999].
    step1: |-
      因此，在格鲁派哲学中可以说，对实在的洞见并不被认为超出思想，也不被归给世界之外某种既非存在也非不存在的第三范畴；它只是对一个既非（胜义）存在也非（世俗）不存在的世界的洞见。尽管格鲁派学者承认，空性可以在高度发展的禅修这一稀有条件中被非概念地感知，他们仍坚持：被非概念地认知的空性，与被概念地认知的空性并无不同。当概念施设之外别无他物时，概念与感知之间的鲜明区分可以说就消解了。因此，格鲁派哲学的一个主要要素是对空性的*概念*确定，这并不奇怪。此外，他们对观修实践的强调，并非诉诸对超概念之物的直接的、无中介的通达，而是诉诸推理。推理也被置于经教权威之上，经教要经受分析的审视，由推理来裁定（Tsongkhapa in Hopkins 1999, 71）[^hopkins-1999]。
    step2: |-
      因此在格鲁派哲学中，对实在的洞见并不超出思想，也不被归给世界之外某个既非存在又非不存在的第三范畴。它就是对这样一个世界的洞见：这个世界既非（胜义）存在，也非（世俗）不存在。格鲁派学者也承认，在禅修高度纯熟的稀有情形下，空性可以被非概念地感知。但他们坚持，非概念地认知的空性，与概念地认知的空性并无二致。既然概念施设之外别无他物，概念与感知之间那道鲜明界线也就随之消解。难怪在格鲁派哲学中，对空性的*概念*确定会成为主要环节。此外，他们看重观修，诉诸的不是对超概念之物的直接无中介通达，而是推理。推理还优先于经教权威：经教须经分析审视，由推理来裁定（Tsongkhapa in Hopkins 1999, 71）[^hopkins-1999]。
