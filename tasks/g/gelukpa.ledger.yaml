      Tsongkhapa identifies three criteria for conventional truth. A conventional truth is what (1) is acknowledged by a conventional epistemic instrument, (2) is not undermined by another conventional epistemic instrument, and (3) is not undermined by an analysis of its ultimate nature (Tsongkhapa 2000, 627)[^tsongkhapa-2000]. The third criterion underscores an important point in Gelukpa philosophy: that an object’s emptiness of intrinsic existence (its ultimate status) does not undermine its status as a conventional truth. Whether or not this is successful, or if this is even possible, is a strongly debated philosophical question. The first two criteria reflect the commitment that what counts as true or real depends upon our epistemic resources, which themselves are mutually supportive, and which both support and are supported by the entities they reveal, as well as the fact that there is a difference between being correct and incorrect regarding conventional truth. Because of this commitment to a robust sense of conventional truth, their rivals in Tibet have charged the Geluk interpretation of the Middle Way with being realist (about the conventional truth) and nihilist (about the ultimate truth), or even an incoherent mixture—full of contradictions—of Dharmakīrti’s foundationalist epistemology with Candrakīrti’s antirealist ontology. The Geluk philosophy continues to be engaged in the debate about the unique role that epistemology plays within the antifoundationalist Consequence School (The Yakherds, 2021).
    step1: |-
      宗喀巴为世俗谛列出三条标准。一条世俗真理是：（1）由世俗量所认可；（2）不被另一种世俗量所损害；（3）不被对其胜义本性的分析所损害（Tsongkhapa 2000, 627）[^tsongkhapa-2000]。第三条标准凸显了格鲁派哲学中的一个要点：一个对象自性存在的空（其胜义地位）并不损害它作为世俗真理的地位。这种做法是否成功，甚至是否可能，是一个争论激烈的哲学问题。前两条标准反映出这样一种承诺：何者算作真实或实在，取决于我们的认识资源；这些资源本身相互支持，并且既支持它们所揭示的实体，又受这些实体支持。它们还反映出：在世俗真理上，正确与不正确之间有区别。由于这种对强势世俗谛的承诺，西藏的论敌指责格鲁派对中观的解释既是实在论的（就世俗谛而言），又是虚无主义的（就胜义谛而言），甚至是法称的基础主义认识论与月称的反实在论本体论之间一种不融贯的混合——充满矛盾。格鲁派哲学至今仍在参与这场争论：认识论在反基础主义的应成派中扮演何种独特角色（The Yakherds, 2021）。
    step2: |-
      宗喀巴为世俗谛立了三条标准。（1）由世俗量认可；（2）不被其他世俗量损害；（3）不被对其胜义本性的分析损害（Tsongkhapa 2000, 627）[^tsongkhapa-2000]。第三条标准点出格鲁派哲学的要旨：对象在自性上为空，这是它的胜义地位，而这种空并不动摇它作为世俗真理的地位。这套说法能否成立，甚至是否可能，至今仍是争论激烈的哲学问题。前两条标准体现了一项承诺：什么算真、什么算实，取决于我们的认识资源。这些资源彼此支撑，既支撑它们所揭示的实体，也反过来得到这些实体的支撑。它们还表明，世俗真理确有正确与错误之别。格鲁派把世俗谛看得如此坚实，于是西藏的论敌指责它的中观解释：在世俗谛上是实在论，在胜义谛上是虚无主义。在他们看来，这不过是法称的基础主义认识论与月称的反实在论本体论杂凑而成，矛盾百出。认识论在反基础主义的应成派中究竟扮演什么独特角色，这场争论至今仍有格鲁派哲学参与（The Yakherds, 2021）。
