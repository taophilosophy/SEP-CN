      The Mind-Only school is committed to the reality of a special kind of reflexive awareness (*rang rig*), by means of which the mind knows itself, a way that is different from the way a mind knows any other object. Geluk scholars deny that there is any such distinctive mode of reflexive awareness; the mind is simply a dependently arisen phenomenon, just like any other, and is known in just the way that other phenomena are known. Moreover, nothing appears the way it really is to an ordinary being (Jamyang Zhepa in Hopkins 2003, 930)[^hopkins-2003]. For this reason, this philosophy does not partake in ordinary phenomenology. Instead, it is primarily concerned with critical ontology, or what we could call a form of “ontological deflationism,” in that it aims to undermine the foundations of the entire ontological project (MacKenzie 2008, 197)[^mackenzie-2008]. Philosophers in the Geluk tradition also point out that the posit of reflexive awareness attributes to the mind a special status as an independently existent, self-knowing entity. Yet a unique, first-personal access to self-awareness, being simply given in experience, presumes immediate access to truth. Tsongkhapa and his followers take this as a further reason to reject this view, since according to those in the Geluk tradition, conventional truths are interdependent, and knowledge is always mediated and contingent. Moreover, they argue, reflexive awareness offers no explanatory power in the realms of either the conventional or ultimate truth. Indeed, Tsongkhapa argues that in the Consequence School, neither this kind of foundational consciousness nor reflexive awareness are taken to exist even conventionally—they are simply philosophical errors.
    step1: |-
      唯识派承诺有一种特殊的自证（*rang rig*）为实在，心借它以某种方式认识自身，这种方式不同于心认识其他任何对象的方式。格鲁派学者否认存在任何此类独特的自证方式；心只是依缘而生的现象，与其他现象无异，其被认识的方式也与其他现象被认识的方式相同。而且，对凡夫而言，没有任何事物如其本来面目那样显现（Jamyang Zhepa in Hopkins 2003, 930）[^hopkins-2003]。由于这个缘故，这一哲学不参与通常的现象学。相反，它主要关注批判性的本体论，或可称为一种“本体论紧缩主义”，因为它旨在瓦解整个本体论事业的基础（MacKenzie 2008, 197）[^mackenzie-2008]。格鲁派传统的哲学家还指出，自证的设定赋予心一种特殊地位，使它成为独立存在、自知自明的实体。然而，对自我意识的一种独特的第一人称通达，既然只是在经验中被给予，就预设了对真理的直接通达。宗喀巴及其追随者以此为拒绝此说的又一个理由：按格鲁派的看法，世俗真理相互依存，知识总是经由中介而且是偶然的。他们还论证说，自证在世俗谛与胜义谛两个领域中都不提供任何解释力。确实，宗喀巴论证说，在应成派中，这种基识与自证即便在世俗层面也不被认为存在——它们只是哲学错误。
