      ## 8. Geluk Education
    step1: |-
      ## 8. 格鲁派的教育
    step2: |-
      ## 8 格鲁派的教育
  - id: 31
    kind: body
    source: |-
      Following Tsongkhapa’s lead, the Geluk tradition came to establish large monastic institutions that set the standard for scholastic education in Tibet. The curriculum at Geluk monastic institutions involves five primary topics: metaphysics (*abhidharma*), epistemology (*pramāṇa*), negative dialectics (*madhyamaka*), path structure (*Abhisamayālaṃkāra*), and ethics (*vinaya*). Buddhist metaphysics instills the contours of a Buddhist view, including causality, impermanence, and an event-metaphysics that ties these two together. The path structure also plays a central role in traditional Buddhist philosophy: it provides the philosophy with a *telos*, a narrative arc toward liberation and complete enlightenment. Ethics, too, is integral to this path and to Buddhist philosophy in general, yet some of the most distinctive and interesting features of Geluk philosophy are found in its epistemology, and in particular, negative dialectics.
    step1: |-
      追随宗喀巴的指引，格鲁派传统建立起大型的寺院机构，为西藏的经院教育树立了标准。格鲁派寺院的课程包含五个主要科目：形而上学（*abhidharma*）、认识论（*pramāṇa*）、否定辩证法（*madhyamaka*）、道之结构（*Abhisamayālaṃkāra*）与戒律（*vinaya*）。佛教的形而上学灌输一种佛教见解的轮廓，包括因果、无常，以及把二者联结起来的事件形而上学。道之结构在传统佛教哲学中也扮演中心角色：它为哲学提供了一个*telos*（目的），一条通向解脱与圆满觉悟的叙事弧线。伦理同样是这条道以及整个佛教哲学的组成部分，不过格鲁派哲学中最独特、最有趣的若干特征，见于其认识论，尤其是否定辩证法。
    step2: |-
      格鲁派追随宗喀巴，建起一批大型寺院，为西藏的经院教育立下标准。寺院课程有五门主科：形而上学（*abhidharma*）、认识论（*pramāṇa*）、否定辩证法（*madhyamaka*）、道之结构（*Abhisamayālaṃkāra*）、戒律（*vinaya*）。佛教形而上学勾出一种佛教见解的轮廓，涉及因果、无常，以及把二者联结起来的事件形而上学。道之结构在传统佛教哲学中也居中心地位：它给哲学一个*telos*（目的），一条通向解脱与圆满觉悟的叙事弧线。伦理同样内在于这条道，也内在于整个佛教哲学。不过，格鲁派哲学最独特、最有趣的若干特征，却见于它的认识论，尤其是否定辩证法。
