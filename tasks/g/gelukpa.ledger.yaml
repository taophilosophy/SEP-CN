  - id: 9
    kind: body
    source: |-
      While all Buddhist traditions in one way or another claim to represent “the middle way” between two extremes, they do so in quite different ways. In general presentations of the Middle Way, emptiness is commonly said to undermine the extreme of existence, while appearance is said to undermine the extreme of nonexistence. Yet in Tsongkhapa’s unique articulation, he says just the opposite. In his *Three Principal Aspects of the Path*, he says: “Appearance eliminates the extreme of existence and emptiness eliminates the extreme of nonexistence.” (Tsongkhapa 2001, 7)[^tsongkhapa-2001] In doing so, he conveys that appearance simply means *conventional* appearances (without intrinsic nature) and that emptiness means simply *the lack of intrinsic existence* (not indiscriminate absence). So, appearance eliminates (reified) existence while emptiness—since it does not mean anything like the total denial of appearance—eliminates the extreme of nonexistence. Thereby, the extreme of nonexistence is eliminated by this kind of emptiness—not by an emptiness taken to be nonexistence, as a mere, unqualified void, or by an emptiness that is simply a lack of conceptual engagement. Rather, the extreme of nonexistence is undermined by emptiness understood as just the lack of intrinsic existence in conventionally existent things (Tsongkhapa 2000, 654–7)[^tsongkhapa-2000].
    step1: |-
      一切佛教传统都以某种方式自称代表两个极端之间的“中道”，但各自的方式颇为不同。在中观的一般表述中，通常说空性破除存在的极端，而显现破除不存在的极端。然而在宗喀巴的独特阐述中，他说的恰恰相反。他在《三主要道》中说：“显现排除存在的极端，空性排除不存在的极端。”（Tsongkhapa 2001, 7）[^tsongkhapa-2001] 这样一来，他传达出：显现只是指*世俗的*显现（无自性），而空性只是指*自性存在的缺乏*（并非不加拣择的虚无）。所以，显现排除（被实体化的）存在，而空性——既然它并不意味着全盘否定显现——则排除不存在的极端。由此，不存在的极端是由这种空性排除的，而不是由被当作不存在的空性、由一种单纯的无限定虚空、也不是由仅仅缺乏概念涉入的空性所排除。相反，破除不存在极端的，是把空性理解为世俗存在的事物缺乏自性（Tsongkhapa 2000, 654–7）[^tsongkhapa-2000]。
    step2: |-
      佛教各传统都自称代表两个极端之间的“中道”，只是说法各不相同。讲中观时，通行说法是：空性破斥存在的极端，显现破斥不存在的极端。宗喀巴的阐述却恰恰相反。他在《三主要道》中写道：“显现排除存在的极端，空性排除不存在的极端。”（Tsongkhapa 2001, 7）[^tsongkhapa-2001] 这句话的意思是：显现只是指*世俗*显现，即没有自性的显现；空性也只是指*自性存在的缺乏*，并非不分青红皂白地抹去一切。于是，显现排除了（被实体化的）存在；空性则排除了不存在的极端，因为它并不主张全盘否定显现。据此，排除不存在极端的是这样一种空性：它不等于不存在，不是单纯的、无限定的虚空，也不是仅仅停止概念活动。真正破除不存在极端的空性，其含义是：世俗存在的事物缺乏自性（Tsongkhapa 2000, 654–7）[^tsongkhapa-2000]。
  - id: 10
    kind: body
    source: |-
      To undermine mistaken views of the Middle Way that embed a subtle kind of realism, Tsongkhapa depicts the two truths as not really separate, but as a unity. He does not invert the hierarchy of the ultimate and conventional world, but rather *implodes* it to represent this unity, saying that appearance undermines the realist extreme of existence and that emptiness undermines the nihilist extreme of nonexistence, rather than *vice versa*. That is, because things merely appear—in an illusion-like way without intrinsic nature—these appearances are not nothing. Even while they may appear in a deceptive way that conflicts with the way they are, this does not mean that deceptively appearing phenomena do not exist. Rather, a conventional world of appearances along with ethics remain in a world that is illusion-like. In this way, this view is held simultaneously to overcome essentialism and nihilism regarding the nature of things.
    step1: |-
      为了破除那些内含某种微妙实在论的中观错误见解，宗喀巴把二谛描述为并非真正分离，而是一个统一体。他并未颠倒胜义世界与世俗世界的层级，而是把这一层级*内爆*，以表示这种统一：他说显现破除实在论式存在的极端，空性破除虚无主义式不存在的极端，而不是*反过来*。也就是说，因为事物只是显现——以无自性的、如幻的方式显现——这些显现并非虚无。即使它们可能以与其本来面目相违的欺诳方式显现，这也不意味着欺诳显现的现象不存在。相反，一个显现的世俗世界连同伦理，仍留在一个如幻的世界中。这样，这一观点被认为同时克服了关于事物本性的本质主义与虚无主义。
    step2: |-
