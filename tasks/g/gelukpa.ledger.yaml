    source: |-
      It is important to recognize how Geluk philosophy is embedded within a distinctively Buddhist soteriology. That is, the truth of no-self is liberating because understanding this is held to free one from the mistaken idea of a self that binds one to suffering. Knowledge of emptiness is key to this emancipatory process, as Tsongkhapa claims, for one must realize emptiness as it is articulated in the Consequence School, the lack of true essence, to be free from the subtle sense of self and achieve nirvāṇa (Cozort 1998, 316)[^cozort-1998]. This view is also maintained to be a prerequisite for the esoteric practices of tantra. Tantra is an important part of the path to liberation in the Geluk tradition. It is a path to liberation that is held to involve distinct, esoteric methods, but without diverging from the philosophical view of emptiness, which is indispensable. For this reason, Geluk philosophy is located squarely within the immanent world and the exoteric domain of discourse: the intersubjective spaces of dialogue and debate.
    step1: |-
      重要的是要认识到，格鲁派哲学如何嵌入一种独特的佛教救度论。也就是说，无我的真理具有解脱力，因为据说理解这一点能使人摆脱一种束缚人于苦难的、错误的自我的观念。如宗喀巴所主张，空性的知识是这一解放过程的关键：人必须如应成派所阐述的那样证悟空性，即真实本质的缺乏，才能摆脱微细的自我感并成就涅槃（Cozort 1998, 316）[^cozort-1998]。这一见解也被视为密续（tantra）秘密修法的前提。在格鲁派的解脱道上，密续是重要的一环。这条解脱之道被认为包含独特的秘密方法，但不得偏离空性的哲学见解，后者不可或缺。由于这个缘故，格鲁派哲学稳稳地坐落于内在世界与显教的言说领域之中：即对话与辩论的主体间空间。
    step2: |-
      有一点值得注意：格鲁派哲学深深嵌入一种特有的佛教救度论。无我的真理之所以能带来解脱，是因为据说懂得无我，人便可摆脱那个把自己束缚于苦难的错误自我观念。空性的知识是这一解放过程的关键。宗喀巴主张，人必须按应成派的阐述证悟空性，即证悟真实本质的缺乏，才能摆脱微细的自我感而成就涅槃（Cozort 1998, 316）[^cozort-1998]。这一见解还被当作密续（tantra）秘法修持的前提。在格鲁派的解脱道上，密续占重要一席。这条道包含独特的秘密方法，但不得偏离空性的哲学见解，因为后者不可或缺。也正因为如此，格鲁派哲学稳稳立足于内在世界与显教的言说领域，即对话与辩论的主体间空间。
