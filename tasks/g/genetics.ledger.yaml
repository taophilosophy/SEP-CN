      In the 1960s, philosophers of science started turning their attention to biology in order to see how the philosophical insights applied there. The earliest, influential example of this was Kenneth Schaffner’s proposal for classical, Mendelian genetics reducing to molecular genetics (Schaffner 1969)[^schaffner-1969]. The great successes of molecular biology following Watson and Crick’s discovery of the double-helical structure of DNA can be best understood, Schaffner argued, by recognizing how classical genetics was in the process of being reduced to the biochemical processes investigated by molecular biologists. On this reading, the “gene” from classical genetics was reduced to a sequence of amino acids in DNA, and other concepts from classical genetics like “dominance” were likewise being reconfigured in the language of biochemistry (entry: reductionism in biology).
    step1: |-
      20 世纪 60 年代，科学哲学家开始把注意力转向生物学，看看那些哲学洞见在那里如何应用。最早而有影响的例子，是肯尼斯·沙夫纳关于经典孟德尔遗传学还原为分子遗传学的提议（Schaffner 1969）[^schaffner-1969]。沙夫纳论证说，沃森与克里克发现 DNA 双螺旋结构之后分子生物学的巨大成功，最好通过承认经典遗传学正被还原为分子生物学家所研究的生化过程来理解。按照这种读法，经典遗传学的“基因”被还原为 DNA 中的氨基酸序列，而经典遗传学的其他概念如“显性”也同样正以生物化学语言被重新配置（见“生物学中的还原论”词条）。
    step2: |-
      60 年代，科学哲学家把目光移向生物学，看那些哲学洞见能否落地。开其先河、影响最大的，是肯尼斯·沙夫纳的主张：经典孟德尔遗传学可还原为分子遗传学（Schaffner 1969）[^schaffner-1969]。沙夫纳论证说，沃森、克里克发现 DNA 双螺旋之后分子生物学的赫赫战功，最好的理解方式就是承认经典遗传学正被还原为分子生物学家所探究的生化过程。照此读法，经典遗传学的“基因”被还原为 DNA 中的氨基酸序列，经典遗传学的其他概念如“显性”，也正被译写成生物化学的语言（见“生物学中的还原论”词条）。
