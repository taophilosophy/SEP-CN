      Evolutionary biology also followed this reductionistic trend down to molecules. Molecular evolution emerged as a field of study where evolutionary changes were tracked at the level of DNA sequences, and DNA became thought of as a ledger of evolutionary history. Most genetic mutations, it became clear, had little to no impact on an organism’s fitness—either because the mutation occurred in such a way that the same amino acid was produced anyway (a product of redundancy in the genetic code) or because the mutation occurred in a region of the genome where no proteins were coded; this, in turn, forced biologists to rethink the extent to which DNA sequences could be understood as the product of natural selection alone (Kimura 1968; Dietrich 1994)[^dietrich-1994][^kimura-1968]. Mutation rates in homologous DNA sequences shared by different species (say, humans and chimpanzees) also allowed for inferring how far back those two species diverged from a common ancestor (entries: ecological genetics; genetic drift).
    step1: |-
      演化生物学也沿着这条还原论趋势一路走到分子层面。分子演化成为一门研究领域，演化变化在 DNA 序列层面被追踪，DNA 被看作演化史的账本。人们逐渐清楚，大多数遗传突变对生物体适应度几乎没有影响——或者因为突变的产生方式使同样的氨基酸仍被产出（遗传密码冗余的产物），或者因为突变发生在基因组中不编码蛋白质的区域；这反过来迫使生物学家重新思考，DNA 序列在多大程度上可以理解为仅由自然选择塑造的产物（Kimura 1968; Dietrich 1994）[^dietrich-1994][^kimura-1968]。不同物种（比如人类与黑猩猩）共有的同源 DNA 序列中的突变率，也使人们得以推断这两个物种多久以前从共同祖先分化（见“生态遗传学”“遗传漂变”词条）。
    step2: |-
      演化生物学也顺着还原论一路下探到分子。分子演化学科应运而生：演化变化在 DNA 序列层面被追踪，DNA 被读作一部演化史账簿。人们渐渐明白，大多数遗传突变对生物体适应度影响甚微，或无影响——或因遗传密码的冗余，突变后仍转出同一种氨基酸，或因突变落在基因组不编码蛋白质的地带。这反过来迫使生物学家重估：DNA 序列究竟能在多大程度上被视为自然选择单独塑造的产物（Kimura 1968; Dietrich 1994）[^dietrich-1994][^kimura-1968]。不同物种（如人与黑猩猩）共有的同源 DNA 序列中的突变率，还可据以推断两者多久前自共同祖先分道（见“生态遗传学”“遗传漂变”词条）。
