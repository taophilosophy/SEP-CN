      We live now in the postgenomic era. Just what “postgenomic” means, though, is a point of contention. On the one hand, many life sciences have embraced genomics, bringing DNA sequencing methods and an attention to genes into their domain—conservation genomics, cancer genomics, behavioral genomics, immunological genomics, bacterial genomics, and marine genomics, to name just a few (entries: biodiversity; philosophy of immunology; conservation biology, cancer). On the other hand, it’s become abundantly clear that there is a great deal of complexity between a sequence of DNA and a trait, and that there are far more variables affecting that trait than just the order of As, Cs, Ts, and Gs. This has spawned the proliferation of other “omic” disciplines that attempt to catalogue and functionally understand the great variety of molecular and cellular entities and processes that contribute to the structure and function of organisms—proteomics, transcriptomics, metabolomics, lipidomics, and glycomics, to name just a few (entry: scientific research and big data). What’s more, genome-wide association studies, which scour entire genomes for regions that are associated with traits, have revealed that in most case, tens, hundreds, or thousands of genomic regions are implicated in even fairly simple human traits like height. This tension—between an urge to trace things down to genes and a realization once you get there that there is far more to the story than genes—is at the heart of many philosophical reflections on genetics (Richardson and Stevens 2015; Reardon 2017; entries: genomics and postgenomics; philosophy of systems and synthetic biology; heritability)[^reardon-2017][^richardson-2015].
    step1: |-
      我们如今生活在后基因组时代。不过，“后基因组”究竟意味着什么，仍有争议。一方面，许多生命科学已拥抱基因组学，把 DNA 测序方法与对基因的关注带入各自领域——保护基因组学、癌症基因组学、行为基因组学、免疫基因组学、细菌基因组学、海洋基因组学，不过略举数例（见“生物多样性”“免疫学哲学”“保护生物学”“癌症”词条）。另一方面，人们已经充分明白，一段 DNA 序列与一个性状之间存在大量复杂性，影响该性状的变量远不止 As、Cs、Ts、Gs 的排列次序。这催生了其他“组学”学科的增殖，它们试图编目并在功能上理解构成生物体结构与功能的种类繁多的分子与细胞实体及过程——蛋白质组学、转录组学、代谢组学、脂质组学、糖组学，不过略举数例（见“科学研究与大数据”词条）。更有甚者，全基因组关联研究——搜寻整个基因组中与性状相关的区域——已经揭示，在多数情况下，即便是身高这样相当简单的人类性状，也牵涉数十、数百或数千个基因组区域。这种张力——一方面要把事情追溯到基因，另一方面到了基因层面却发现故事远不止基因——正是许多关于遗传学的哲学反思的核心（Richardson and Stevens 2015; Reardon 2017；见“基因组学与后基因组学”“系统与合成生物学哲学”“遗传力”词条）[^reardon-2017][^richardson-2015]。
    step2: |-
      我们如今身处后基因组时代。然而“后基因组”到底何所指，仍是聚讼之地。一方面，许多生命科学已把基因组学纳入自家门庭，将 DNA 测序方法与对基因的关注一并引入——保护基因组学、癌症基因组学、行为基因组学、免疫基因组学、细菌基因组学、海洋基因组学，略举数例（见“生物多样性”“免疫学哲学”“保护生物学”“癌症”词条）。另一方面，人们已看得分明：一段 DNA 与一个性状之间横亘着重重复杂性，影响该性状的变量远不止 A、C、T、G 的排列。于是各种“组学”学科蓬勃而起，试图编目并从功能上理解构成生物体结构与功能的形形色色分子、细胞实体与过程——蛋白质组学、转录组学、代谢组学、脂质组学、糖组学，亦举数例（见“科学研究与大数据”词条）。更有甚者，全基因组关联研究遍搜全基因组中与性状相关的区域，结果表明：多数情况下，就连身高这般相当简单的人类性状，也牵连数十、数百乃至数千个基因组区域。这股张力——一边急于把一切追到基因头上，一边到了基因层面却发现故事远不止于基因——正是许多遗传学哲学反思的枢纽（Richardson and Stevens 2015; Reardon 2017；见“基因组学与后基因组学”“系统与合成生物学哲学”“遗传力”词条）[^reardon-2017][^richardson-2015]。
