    source: |-
      As more and more diseases were being linked up to locations in the human genome throughout the 1990s, geneticists shifted their attention to the grand prize—sequencing the entire human genome (Cook-Deegan 1994)[^cook-deegan-1994]. Ever since the discovery of the double-helical structure of DNA, geneticists knew what genes were made of and what structure they took. But they did not know how many genes there were. And with the exception of the handful of genes that had already been discovered, they did not know where the vast majority of genes were located. The challenge was to spell out the ordered sequence of the human genome in its entirety—no small task when you consider that all three billion base pairs of the human genome reside in cells no bigger than the period at the end of this sentence. The Human Genome Project met the challenge with the largest and most expensive biological collaboration in history. An international consortium of scientists at twenty different sequencing centers spread out across the United States, the United Kingdom, France, Germany, Japan, and China took charge of different portions, breaking up the entire genome into smaller and smaller overlapping segments until stretches several thousand base pairs at a time could be sequenced. Then the whole thing was pasted back together using the areas of overlap as guides. The Human Genome Project was officially completed in 2003 (entry: the Human Genome Project).
    step1: |-
      整个 20 世纪 90 年代，随着越来越多的疾病被联系到人类基因组中的位置，遗传学家把注意力转向大奖——对人类基因组进行全测序（Cook-Deegan 1994）[^cook-deegan-1994]。自 DNA 双螺旋结构发现以来，遗传学家就知道基因由什么构成、采取什么结构。但他们不知道基因有多少。而且，除了已经发现的那少数几个基因，他们不知道绝大多数基因位于何处。挑战在于把人类基因组的完整有序序列拼写出来——想想人类基因组全部三十亿碱基对都存放在不比本句末尾句号更大的细胞里，这可不是小事。人类基因组计划以历史上规模最大、最昂贵的生物学合作迎接了这一挑战。一个国际科学家联盟在分布于美国、英国、法国、德国、日本和中国的二十个测序中心分头负责不同部分，把整个基因组切成越来越小的重叠片段，直到每次能测序几千个碱基对。然后以重叠区域为向导，把整件事情粘贴回去。人类基因组计划于 2003 年正式完成（见“人类基因组计划”词条）。
    step2: |-
      整个 90 年代，越来越多的疾病被定位到人类基因组的某个角落，遗传学家的目光遂投向头号大奖——人类基因组全测序（Cook-Deegan 1994）[^cook-deegan-1994]。自发现 DNA 双螺旋以来，遗传学家早知基因由什么构成、呈何结构，却不知基因共有多少，也不知除已发现的少数几个外，其余绝大多数藏身何处。难关在于把人类基因组的有序序列完整拼出——想想看，三十亿个碱基对全挤在不比本句句号更大的细胞里，谈何容易。人类基因组计划以史上规模最大、耗资最巨的生物学协作应战：美国、英国、法国、德国、日本、中国的二十个测序中心组成国际联盟，分片包干，把整个基因组切成越来越小的重叠片段，直到每次可测几千个碱基对，再以重叠区为向导拼回全图。该计划于 2003 年正式完成（见“人类基因组计划”词条）。
