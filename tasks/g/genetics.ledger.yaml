      The proliferation of genetic technologies in the mid-twentieth century brought with it a demand for healthcare workers who could process that information and help patients understand it. The result was genetic counseling programs. The professional emergence of genetic counseling occurred at the very same time that abortion was decriminalized in a number of countries, the disability rights movement and second-wave feminism gained momentum, and bioethical attention to patient autonomy became a serious consideration in clinical care. This created a profound tension for the young community of genetic counselors. On the one hand, genetic counseling had a disciplinary ancestry that ran directly through heredity clinics and straightforward eugenics before that; many of the genetic counselor’s tools (e.g., constructing a family pedigree) and many of the traits that received genetic counseling attention (e.g., Down syndrome) were the very same tools and traits at the center of the earlier practices. On the other hand, the genetic counselors—mostly women—were much more attuned than the heredity clinic and medical genetics pioneers—mostly men—to the moral and social problems with paternalistic medicine and eugenics highlighted by the critics from feminism, disability rights, and bioethics. The genetic counselors navigated this tension by embracing a principle of nondirectiveness; rather than telling patients how to act on the genetic information they received, genetic counselors aspired to simply convey that genetic information in a non-biased way and help the patients decide for themselves how to act on that information (Stern 2012)[^stern-2012].
    step1: |-
      20 世纪中叶遗传技术的扩散，带来了对能够处理这些信息并帮助患者理解信息的医护人员的需求。其结果就是遗传咨询项目。遗传咨询的职业化，恰逢堕胎在若干国家非罪化、残障权利运动与第二波女性主义获得势头、对患者自主的生物伦理关注成为临床护理中的严肃考量。这在年轻的遗传咨询师群体中造成了深刻的张力。一方面，遗传咨询有一条直接贯穿遗传诊所、再往前直到赤裸裸优生学的学科谱系；遗传咨询师的许多工具（如构建家族系谱）和许多受到遗传咨询关注的性状（如唐氏综合征），正是先前实践的核心工具与性状。另一方面，遗传咨询师——多为女性——远比遗传诊所与医学遗传学的先驱——多为男性——更能体察女性主义、残障权利与生物伦理学批评者所指出的家长式医学与优生学的道德社会问题。遗传咨询师通过采纳非指导性原则来应对这一张力；他们不去告诉患者该如何根据所获遗传信息行动，而是力求以不带偏见的方式简单传达遗传信息，帮助患者自行决定如何行动（Stern 2012）[^stern-2012]。
    step2: |-
      20 世纪中叶遗传技术的增殖，催生了对能处理并帮助患者理解这些信息的医护人员的需求，遗传咨询项目应运而生。遗传咨询的职业化，恰与几股潮流同时：堕胎在若干国家除罪化，残障权利运动与第二波女性主义势头渐起，患者自主权成为临床照护中严肃的生物伦理议题。这给年轻的遗传咨询师群体带来深刻张力。一方面，遗传咨询的学科血脉径直穿过遗传诊所，再往前便是毫不掩饰的优生学；咨询师的许多工具（如绘制家族系谱）与许多受关注的性状（如唐氏综合征），正是旧日实践的核心。另一方面，咨询师多半是女性，比起多为男性的遗传诊所与医学遗传学先驱，她们更能体察女性主义、残障权利与生物伦理批评者对家长式医学与优生学的道德社会指责。她们的应对之道，是秉持非指导性原则：不告诉患者该怎样依据所获遗传信息行事，而是力求以不偏不倚的方式传达信息，帮助患者自行决定（Stern 2012）[^stern-2012]。
