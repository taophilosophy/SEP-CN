    kind: body
    source: |-
      Philosophical critics of enhancement offer a number of cautions against the practice. Michael Sandel famously associated desires for enhancement with hubris, where contentment with what nature (and chance) present was the more virtuous attitude (Sandel 2002)[^sandel-2002]. Parental attempts to genetically enhance a child were also criticized on the grounds that they violated the autonomy of the child because parents were seeking too much control over the child’s future (Habermas 2003)[^habermas-2003]. Philosophers also warned of an unjust future made up of genetic “haves” (those who have benefited from enhancement) and “have nots” (those who remained unenhanced)—a scenario popularized in the film GATTACA (entry: theory and bioethics).
    step1: |-

    step2: |-

  - id: 61
    kind: body
    source: |-
      Defenders of enhancement were quick to point out that many of the arguments against enhancing were not reasonably confined to just genetic technologies. Parents control their child’s future when they send her to space camp rather than soccer camp; likewise, wealthy parents are able to enhance their children with all sorts of educational resources, like tutors, that poor parents cannot provide, and these surely contribute to disparities. But parents are given wide latitude to decide what camp their child will attend and how much they will (or won’t) invest in their child’s educational development. Julian Savulescu (2001) even argued that parents are obligated to take advantage of genetic technologies if they offer opportunities to increase the chances of a child living the best life. Of course, just what counts as the “best life” is an inherently value-laden judgment, and critics pointed out that Savulescu’s characterization of it looked frighteningly similar to the vision promoted by eugenicists a century ago (entries: parenthood and procreation; eugenics).
    step1: |-

    step2: |-

  - id: 62
    kind: body
    source: |-
      ### 2.7 Is Race “in the Genes”?
    step1: |-

    step2: |-

  - id: 63
    kind: body
    source: |-
      Eugenicists understood races to be biologically distinct human populations with rank-able physical and behavioral profiles (see section 1.2 above). Black people were more prone to criminality and lower intelligence than White people, they believed; and a child who was born of mixed-race parents was likely to fall somewhere in between. The anti-miscegenation laws promoted by eugenicists were explicitly designed to prevent White people from breeding with Black people. Black people were not the only targets though. Eugenicists also spoke of the “Irish race”, the “Italian race”, and the “Slavic race”. These racial categories were just as real for the eugenicists as the categories of Black, White, and Asian, and anti-immigration laws were passed to keep undesirable races away (entry: race).
    step1: |-

    step2: |-

  - id: 64
    kind: body
    source: |-
      The simplistic ideas about race held by eugenicists did not hold up to scientific scrutiny. Twentieth century developments in fields like human evolution, anthropology, and sociology proved that races were not so cleanly distinguishable—that there were no racial atomic numbers that carved up Black and White in the same way that proton number neatly distinguished gold from mercury. Still, interest in race and genetics persisted. Insights from the study of human evolution revealed how the earliest humans moved out of Africa roughly 70,000 years ago in a series of migrations, some moving east across the Asian continent, some moving north up into what is now Europe, some eventually crossing the Bering Strait and entering the Americas. As these human populations moved about, they encountered very different environments with unique selection pressures (Herrera and Garcia-Bertrand 2018)[^herrera-2018]. What counted as adaptive in the fjords of Northern Europe looked quite different from what was adaptive in the deserts of Northern Africa, and so the human populations over time adapted to the distinct environments—some developing darker skin while others grew lighter, some developing a resistance to cholera while others developed a resistance to malaria.
    step1: |-

    step2: |-

  - id: 65
    kind: body
    source: |-
      The revised conceptions of race and genetics worked off this evolutionary story, where the idea was that racial categories represented human groups with unique genetic profiles tied to those different selection histories (Hardimon 2017)[^hardimon-2017]. A Black person, the thought went, came from African ancestry, while a White person came from European ancestry. In turn, the Black person was likely to have a different genetic profile when it came to melanin production (which controls skin shade) than the White person, and the Black person was more likely to be a carrier for sickle-cell anemia (a blood disorder that also offers some resistance to malaria) while the White person was more likely to be a carrier for cystic fibrosis (a respiratory disorder that also offers some resistance to cholera) (Spencer 2018)[^spencer-2018]. Proponents of these newer ideas about race and genetics were eager to say that they were not in the business of ranking races; they were just tracing different racial histories and the modern phenotypic results of them (entry: the social dimensions of scientific knowledge).
    step1: |-

    step2: |-

  - id: 66
    kind: body
    source: |-
      Even the revised understanding of race and genetics, however, faced challenges. First, the groupings from human evolution did not map neatly onto the traditional folk concepts of race; for example, if “White” applied to people descended from the migration that ultimately wound up in Northern Europe, then that would mean children born today in Bangalore, Oslo, and Damascus all count as “White”—a counterintuitive grouping of “White” people (Smith 2011)[^smith-2011]. Critics also pointed out that the folk concepts of race evolved over time, largely in response to political and economic pressures (like census counting and justifying slavery), not biological insights (like paleogenetic discoveries) (Roberts 2011)[^roberts-2011]. Some critics have encouraged distinguishing “race” from “ancestry”, confining talk of genetics (e.g., genetic ancestral testing, genetic medicine) to the ancestry side of that distinction and keeping it out of discussions of race (Yudell et al. 2016; entries: identity politics; philosophy of biology in Latin America)[^yudell-2016].
    step1: |-

    step2: |-

  - id: 67
    kind: body
    source: |-
      ## 3. Conclusion
    step1: |-

    step2: |-

  - id: 68
    kind: body
    source: |-
      As the second century of genetics unfolds, there is little reason to think the influential science will slow down. In New Zealand, government leaders proposed using gene-editing technologies to eradicate invasive species from the island nation (Yong 2017)[^yong-2017]. In the United States, the All of Us Research Program rolled out, with the aim being to collect DNA from 1,000,000 Americans and link that information up with medical records so as to usher in a new genomic paradigm of precision medicine (Pear 2016)[^pear-2016]. In China, scientists inserted a human gene involved in brain development into monkeys in order to see how the addition of that human gene altered the monkey’s own development (CBC Radio in Other Internet Resources). These programs, practices, and proposals raised profound questions about the dangers of intervening on complex ecosystems, the politics of distributing scarce biomedical resources, and the ethics of non-human animal research. As genetics progresses, so too will the philosophical questions about it.
    step1: |-

    step2: |-

