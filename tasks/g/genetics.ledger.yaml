      W. D. Hamilton proposed kin selection as a resolution to the altruism puzzle (Hamilton 1964)[^hamilton-1964]. If the population of ground squirrels above were related, then the genes associated with alarm calling could propagate in the group even if the altruistic ground squirrels were killed more often because their kin who shared the genes survived. G. C. Williams and Richard Dawkins subsequently generalized Hamilton’s observation, arguing that all of natural selection could be understood as operating at the genetic level (Williams 1966; Dawkins 1976)[^dawkins-1976][^williams-1966]. On this “gene’s-eye view of evolution”, natural selection targets genes (the “replicators” in Dawkins’ language), while organisms are the “vehicles” (or “interactors”) that carry around the genes and interact with the environment (entry: replication and reproduction).
    step1: |-
      W. D. 汉密尔顿提出亲缘选择，作为对利他谜题的解决（Hamilton 1964）[^hamilton-1964]。如果上述地松鼠种群彼此有亲缘关系，那么与警报呼叫相关的基因就可以在群体中传播，即便利他的地松鼠更常被杀，因为与其共享基因的亲属存活了下来。G. C. 威廉斯与理查德·道金斯随后推广了汉密尔顿的观察，论证全部自然选择都可以理解为在基因层面运作（Williams 1966; Dawkins 1976）[^dawkins-1976][^williams-1966]。在这种“基因之眼的演化观”中，自然选择以基因为目标（道金斯语言中的“复制者”），而生物体是携带基因并与环境交互的“载体”（或“交互者”）（见“复制与繁殖”词条）。
    step2: |-
      W. D. 汉密尔顿提出亲缘选择，以解利他之谜（Hamilton 1964）[^hamilton-1964]。倘若上述地松鼠种群彼此沾亲，那么与警报呼叫相关的基因仍能在群体中传开——利他的地松鼠虽更常殒命，携有同一基因的亲属却活了下来。G. C. 威廉斯与理查德·道金斯随后把汉密尔顿的观察推而广之，主张全部自然选择都可在基因层面来理解（Williams 1966; Dawkins 1976）[^dawkins-1976][^williams-1966]。在这幅“基因之眼”的演化图景里，自然选择以基因为靶（道金斯所谓“复制者”），生物体则是携带基因、与环境打交道的“载体”（或“交互者”）（见“复制与繁殖”词条）。
