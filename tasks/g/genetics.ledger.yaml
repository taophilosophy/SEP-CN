      At a celebration of the Human Genome Project completion in 2003 (see section 1.5 above), genome enthusiasts promised that the major genes for heart disease, mental health disorders, and diabetes would all be discovered shortly, that treatments would soon follow, and that genetic cures would be available by 2020. To call those claims “hype” would be an understatement. Genome-wide association studies following the Human Genome Project revealed that the most common human diseases were impacted by many, many places in the genome, each of which made a very small contribution to the risk of having or not having the ailment. That, in turn, meant that there were no simple targets for genetic interventions because there were simply too many genetic points and pathways from those points. Most strikingly, even the traits for which single genes were discovered—cystic fibrosis for example—remained stubbornly resilient to cures, even though those genes were identified 30 years prior. Philosophical critics of genetics pointed to this mismatch between genetic promises and genetic deliveries to argue against misleading and harmful notions of genetic essentialism (Nelkin an Lindee 2004)[^nelkin-2004]. “Misleading” because studies about complex relationships between some portion of DNA and some human trait often were simplified down to claims about discoveries of “the gene for” that trait. And “harmful” because the language encouraged continued investment of public resources in gene-hunting research, when it was possible that society would gain more from focusing biomedical research agendas elsewhere (entries: feminist philosophy of biology; the human genome project; theories of biological development; philosophy of medicine; sociobiology; philosophy of science in Latin America; philosophy of biomedicine).
    step1: |-
      在 2003 年人类基因组计划完成的庆祝会上（见上文 §1.5），基因组拥趸许诺：心脏病、精神健康障碍与糖尿病的主要基因都将很快被发现，治疗将随后跟进，到 2020 年将有遗传治愈方法可用。把那些说法称为“炒作”都算轻描淡写。人类基因组计划之后的全基因组关联研究表明，最常见的人类疾病受到基因组中许多许多位置的影响，其中每个位置对患病或不患病风险的贡献都很小。这反过来意味着，遗传干预没有简单的靶点，因为遗传位点以及从这些位点出发的通路实在太多。最引人注目的是，即便是已经发现单基因的性状——例如囊性纤维化——也依然顽固地难以治愈，尽管那些基因早在 30 年前就已鉴定。遗传学的哲学批评者指出遗传承诺与遗传交付之间的这种失配，以反驳误导且有害的遗传本质主义观念（Nelkin an Lindee 2004）[^nelkin-2004]。“误导”是因为关于某段 DNA 与某个 人类性状之间复杂关系的研究，常被简化为关于发现了该性状“的基因”的说法。“有害”是因为这种语言鼓励持续把公共资源投入基因搜寻研究，而社会把生物医学研究议程转向别处可能收益更多（见“女性主义生物学哲学”“人类基因组计划”“生物学发展理论”“医学哲学”“社会生物学”“拉丁美洲科学哲学”“生物医学哲学”词条）。
    step2: |-
      2003 年人类基因组计划庆功会上（见上文 §1.5），基因组拥趸夸下海口：心脏病、精神障碍、糖尿病的主效基因即将悉数发现，疗法随后就到，到 2020 年基因治愈可期。说这些是“炒作”，都算轻了。人类基因组计划之后的全基因组关联研究显示，最常见的人类疾病受基因组中极多位置影响，而每个位置的贡献都微乎其微。这就意味着，遗传干预没有简便靶点——位点太多，从位点伸出的通路也太多。最扎眼的是，就连已经找到单基因的性状（如囊性纤维化），也依然坚不可摧、难以治愈，尽管那些基因早在 30 年前就已锁定。遗传学的哲学批评者便抓住承诺与交付之间的落差，反驳误导而有害的遗传本质主义（Nelkin an Lindee 2004）[^nelkin-2004]。“误导”者，因关于某段 DNA 与某种人类性状之复杂关系的研究，常被化简为“发现了该性状的基因”一类说法；“有害”者，因此类言辞鼓励把公共资源持续砸向猎基因研究，而把生物医学研究议程挪向别处，社会或许收获更多（见“女性主义生物学哲学”“人类基因组计划”“生物学发展理论”“医学哲学”“社会生物学”“拉丁美洲科学哲学”“生物医学哲学”词条）。
