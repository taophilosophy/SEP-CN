      Evelyn Fox Keller dubbed the 1900s the “century of the gene”, and for good reason (Fox Keller 2002)[^fox-2002]. During a 100-year span that opened with excitement about the research Mendel conducted decades earlier and closed with the Human Genome Project, disciplines ranging from comparative anatomy to oncology were infused with genetic concepts, genetic principles, and genetic methodologies. The first two decades of the twenty-first century have seen this trend only expand.
    step1: |-
      伊芙琳·福克斯·凯勒把 20 世纪称为“基因的世纪”，这自有其道理（Fox Keller 2002）[^fox-2002]。这一百年以人们对孟德尔数十年前所作研究的兴奋开场，以人类基因组计划收官；在此期间，从比较解剖学到肿瘤学的各个学科，都注入了遗传学的概念、原则与方法。21 世纪的头二十年，这一趋势只增不减。
    step2: |-
      伊芙琳·福克斯·凯勒把 20 世纪唤作“基因的世纪”，此说自有道理（Fox Keller 2002）[^fox-2002]。这一百年以人们对孟德尔数十年前所作研究的兴奋开场，以人类基因组计划收官；其间，从比较解剖学到肿瘤学，各门学科纷纷注入遗传学的概念、原则与方法。进入 21 世纪头二十年，这一趋势只增不减。
