      By the 1940s and 1950s, a number of social and scientific trends emerged that undermined the eugenicists’ agenda. At the conclusion of World War II, it became clear that Nazi atrocities targeting certain populations for eradication were inspired by eugenic ideas cultivated in the very countries that fought against Germany. Social commentators pointed out that “fit humans” and “unfit humans” were not scientific terms; rather, they were racist, sexist, classist, and nativist concepts designed to privilege wealthy, educated White people and devalue socioeconomically disadvantaged minority populations. On the scientific side, social sciences like anthropology and sociology drew increasing attention to the social and economic forces at work in populations that contributed to criminality, destitution, and mental illness. And genetics too—the eugenicists’ chosen science—ultimately invalidated eugenics. Complex human traits like intelligence and antisocial behavior were not the result of any single gene; they were the result of many genetic and environmental factors all working in complicated and generally unpredictable ways over the course of human development (Tabery 2014)[^tabery-2014]. That insight, alongside the social science observations, ensured that no amount of sterilization or immigration restriction would eliminate the traits eugenicists found undesirable (Kevles 1985)[^kevles-1985].
    step1: |-
      到 20 世纪 40 与 50 年代，出现了若干削弱优生学家议程的社会与科学趋势。第二次世界大战结束时，人们清楚地看到，纳粹针对某些人口群体的灭绝暴行，其灵感来自优生观念，而这些观念恰恰培育于那些与德国作战的国家。社会评论家指出，“适应的人”与“不适应的人”并非科学术语；它们分别是种族主义、性别主义、阶级主义与本土主义的观念，旨在优待富裕、受过教育的白人，贬低社会经济上处于不利地位的少数群体。在科学方面，人类学与社会学等社会科学日益把注意力引向种群中起作用的社会经济力量，这些力量促成了犯罪、贫困与精神疾病。遗传学本身——优生学家选中的科学——最终也使优生学失效。智力与反社会行为等复杂人类性状不是任何单个基因的结果；它们是许多遗传与环境因素在人类发展过程中以复杂且通常不可预测的方式共同作用的结果（Tabery 2014）[^tabery-2014]。这一洞见连同社会科学观察，确保了无论多少绝育或移民限制，都无法消除优生学家认为不可取的性状（Kevles 1985）[^kevles-1985]。
    step2: |-
      到 1940、50 年代，若干社会与科学趋势开始瓦解优生学的议程。二战结束之际，人们看清：纳粹对某些人群的灭绝暴行，其灵感正来自优生观念，而那些观念恰恰滋生在对抗德国的国家自身。社会评论家指出，“适应的人”“不适应的人”根本不是什么科学术语，而是种族主义、性别主义、阶级主义与本土主义的概念，意在抬高富裕、受过教育的白人，贬低社会经济上处于弱势的少数群体。科学方面，人类学、社会学等社会科学日益揭示出种群中促成犯罪、贫困与精神疾病的社会经济力量。遗传学本身——优生学家选中的那门科学——最终也拆了优生学的台：智力、反社会行为之类复杂人类性状，绝非单个基因的产物，而是众多遗传与环境因素在人类发展历程中以复杂且多半不可预测的方式交互作用的结果（Tabery 2014）[^tabery-2014]。这一洞见，加上社会科学的观察，注定了无论怎样绝育、怎样限制移民，都无法根除优生学家眼中的不良性状（Kevles 1985）[^kevles-1985]。
