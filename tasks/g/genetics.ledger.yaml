      With the onset of the molecular revolution in biology in the 1950s and 1960s, the suite of services that medical geneticists could offer patients expanded. Carrier screening became available, which allowed for informing a patient that they carried a recessive allele of a disease-causing gene and so may pass that trait onto a child even if they did not show symptoms of the disease themselves. Amniocentesis was also developed, which allowed for extracting fetal cells from the amniotic sac, culturing those cells, and then testing for a range of medical conditions in the fetus (Harper 2008)[^harper-2008].
    step1: |-
      随着 1950 与 60 年代生物学分子革命兴起，医学遗传学家能向患者提供的服务范围扩大了。携带者筛查变得可行，使患者得以知晓自己携带某种致病基因的隐性等位基因，因而即使本人没有症状，也可能把该性状传给孩子。羊膜穿刺术也被开发出来，可以从羊膜囊中提取胎儿细胞，培养这些细胞，然后检测胎儿的一系列医学状况（Harper 2008）[^harper-2008]。
    step2: |-
      1950、60 年代分子革命兴起，医学遗传学家能提供的服务也随之扩展。携带者筛查问世，可告知患者：他携带某致病基因的隐性等位基因，即便本人并无症状，也可能把该性状传给子女。羊膜穿刺术亦告发明：从羊膜囊中抽取胎儿细胞，加以培养，再检测胎儿有无种种医学状况（Harper 2008）[^harper-2008]。
  - id: 24
