      No concept is more central to genetics than the “gene”. And yet, the earliest philosophical examinations of genetics quickly uncovered the fact that it was by no means clear that the gene from classical genetics was the same thing as the gene from molecular genetics. Subsequent attention to genetics only compounded the puzzle. In the late 1970s, a series of discoveries complicated the simple relationship between a single, uninterrupted sequence of DNA and its polypeptide, protein product. Overlapping genes were discovered (Barrell et al. 1976)[^barrell-1976]; such genes were considered overlapping because two different amino acid chains might be read from the same stretch of nucleic acids by starting from different points on the DNA sequence. And split genes were found (Berget et al. 1977; Chow et al. 1977)[^berget-1977][^chow-1977]. In contrast to the hypothesis that a continuous nucleic acid sequence generated an amino acid chain, it became apparent that stretches of DNA were often split between coding regions (exons) and non-coding regions (introns). The distinction between exons and introns became even more complicated when alternative splicing was discovered the following year (Berk and Sharp 1978)[^berk-1978]. A series of exons could be spliced together in a variety of ways, thus generating a variety of molecular products. Discoveries such as overlapping genes, split genes, and alternative splicing made it clear that what counted as a gene was by no means straightforward even if focus was confined to molecular genetics (Griffiths and Stotz 2013; Rheinberger and Müller-Wille 2017; entry: molecular biology)[^griffiths-2013][^rheinberger-2017].
    step1: |-
      没有哪个概念比“基因”更处于遗传学的中心。然而，最早的遗传学哲学考察很快就发现一个事实：经典遗传学的基因与分子遗传学的基因是同一个东西，这一点远非清楚。随后对遗传学的关注只是让谜题更加复杂。20 世纪 70 年代后期，一系列发现使单一、不间断 DNA 序列与其多肽、蛋白质产物之间的简单关系复杂化。重叠基因被发现（Barrell et al. 1976）[^barrell-1976]；这种基因被称为重叠，是因为从 DNA 序列的不同起点出发，可能从同一段核酸中读出两种不同的氨基酸链。断裂基因也被发现（Berget et al. 1977; Chow et al. 1977）[^berget-1977][^chow-1977]。与“连续核酸序列生成氨基酸链”的假说相反，人们逐渐清楚，DNA 片段常常在编码区（外显子）与非编码区（内含子）之间被切断。次年可变剪接被发现后，外显子与内含子的区分变得更加复杂（Berk and Sharp 1978）[^berk-1978]。一系列外显子可以以多种方式剪接在一起，从而产生多种分子产物。重叠基因、断裂基因与可变剪接等发现清楚地表明，即便把焦点限于分子遗传学，什么才算一个基因也远非直截了当（Griffiths and Stotz 2013; Rheinberger and Müller-Wille 2017；见“分子生物学”词条）[^griffiths-2013][^rheinberger-2017]。
    step2: |-
      没有哪个概念比“基因”更居于遗传学的核心。然而，最早的遗传学哲学考察就揭出一个事实：经典遗传学的基因与分子遗传学的基因是否同一回事，远非不言自明。此后的研究只让谜团越滚越大。1970 年代后期，一连串发现搅乱了“一段单一不间断的 DNA 序列对应其多肽、蛋白质产物”的简单图景。人们发现了重叠基因（Barrell et al. 1976）[^barrell-1976]：从 DNA 序列的不同起点读起，同一段核酸可以读出两条不同的氨基酸链，故称重叠。又发现了断裂基因（Berget et al. 1977; Chow et al. 1977）[^berget-1977][^chow-1977]：与“连续核酸序列生成氨基酸链”的假说相反，DNA 片段常在编码区（外显子）与非编码区（内含子）之间断开。次年可变剪接的发现，更使外显子与内含子之分趋于复杂（Berk and Sharp 1978）[^berk-1978]：一组外显子能以多种方式拼接，从而产生多种分子产物。重叠基因、断裂基因、可变剪接这些发现清楚表明：即便只盯着分子遗传学，什么算一个基因也绝非一目了然（Griffiths and Stotz 2013; Rheinberger and Müller-Wille 2017；见“分子生物学”词条）[^griffiths-2013][^rheinberger-2017]。
