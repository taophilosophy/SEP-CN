      A second philosophical approach for conceptualizing the gene involved rethinking a single, unified gene concept that captured the molecular complexities. For example, Eva Neumann-Held claimed that a “process molecular gene concept” embraced the complications; on her unified view, the term “gene” referred to “the recurring process that leads to the temporally and spatially regulated expression of a particular polypeptide product” (Neumann-Held 1999)[^neumann-held-1999]. Returning to the case of cystic fibrosis, a process molecular gene for an individual without the disease referred to one of a variety of transmembrane ion-channel templates along with all the non-genetic influences on gene expression, involved in the generation of the normal polypeptide product. And so cystic fibrosis arose when a particular stretch of the DNA sequence was missing from this process (entry: molecular genetics). (For additional examples of gene-concept unification, see Falk 2001; Portin and Wilkins 2017.)[^falk-2001][^portin-2017]
    step1: |-
      第二种概念化基因的哲学进路，是重新思考一个能捕捉分子复杂性的单一、统一基因概念。例如，伊娃·诺伊曼-黑尔德声称，“过程分子基因概念”包含了这些复杂性；在她的统一观点中，“基因”一词指“导致特定多肽产物在时间与空间上受调控地表达的那种反复出现的过程”（Neumann-Held 1999）[^neumann-held-1999]。回到囊性纤维化的例子，对一个没有该病的个体而言，过程分子基因指的是多种跨膜离子通道模板之一，连同所有对基因表达的非遗传影响，它们共同参与正常多肽产物的生成。于是，当这段特定的 DNA 序列从这个过程中缺失时，囊性纤维化就发生了（见“分子遗传学”词条）。（关于基因概念统一的其他例子，见 Falk 2001; Portin and Wilkins 2017。）[^falk-2001][^portin-2017]
    step2: |-
      第二条哲学进路，是重新构想一个足以包纳分子复杂性的统一基因概念。伊娃·诺伊曼-黑尔德便主张，“过程分子基因概念”能够收纳这些复杂性；在她那里，“基因”指“导致特定多肽产物在时间与空间上受调控地表达的那种反复进行的过程”（Neumann-Held 1999）[^neumann-held-1999]。仍以囊性纤维化为例：对一个不患此病的个体来说，其过程分子基因指众多跨膜离子通道模板中的一种，连同一切非遗传的基因表达影响因素，二者共同参与正常多肽产物的生成；一旦这段特定 DNA 序列从过程中缺失，囊性纤维化便随之而起（见“分子遗传学”词条）。（基因概念统一的其他例子，见 Falk 2001; Portin and Wilkins 2017。）[^falk-2001][^portin-2017]
