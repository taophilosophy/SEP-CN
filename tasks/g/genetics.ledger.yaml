      Medical genetics faced other criticisms as well. The standardization of genetic technologies contributed to the medicalization of conception, pregnancy, and birth; this altered the relationship between expecting parents and fetuses because a pregnancy became thought of as “tentative” until screening was complete, and it also impacted the way expecting parents prepared for and communicated about a pregnancy (Duden 1993)[^duden-1993]. Racial health disparity scholars also criticized biomedical research investment in medical genetics because it pulled resources away from known causes of health disparities in the environment that had a bigger impact on the problem (Roberts 2011)[^roberts-2011]. In some cases, the concerns about medicalization and the concerns about racial health disparities converged; for example, Dorothy Roberts warned that it takes social and economic resources to access the sorts of genetic technologies that hospitals offer (at least in the United States), and so medical genetics only exacerbated health disparities (Roberts 2009; entries: feminist bioethics; the human genome project)[^roberts-2009]. Concerns about privacy have also expanded rapidly as genomic information about people is increasingly in the hands of hospitals and private companies (entries: privacy and medicine; privacy and information technology).
    step1: |-
      医学遗传学还面临其他批评。遗传技术的标准化促成了受孕、妊娠与生育的医疗化；这改变了准父母与胎儿的关系，因为妊娠在筛查完成之前被视为“暂定的”，也影响了准父母准备和谈论妊娠的方式（Duden 1993）[^duden-1993]。种族健康差异学者也批评生物医学研究对医学遗传学的投入，因为它把资源从已知的、对该问题影响更大的环境性健康差异成因处抽走（Roberts 2011）[^roberts-2011]。在某些情况下，对医疗化的关切与对种族健康差异的关切汇合；例如，多萝西·罗伯茨警告说，获取医院提供的那些遗传技术需要社会与经济资源（至少在美国如此），因此医学遗传学只会加剧健康差异（Roberts 2009；见“女性主义生物伦理”“人类基因组计划”词条）[^roberts-2009]。随着关于人们的基因组信息日益掌握在医院和私人公司手中，对隐私的关切也迅速扩展（见“隐私与医学”“隐私与信息技术”词条）。
    step2: |-
      医学遗传学还招来别的批评。遗传技术的标准化，把受孕、妊娠与生育一步步医疗化；妊娠在筛查完成前被当作“暂定”状态，准父母准备、谈论妊娠的方式也随之改变（Duden 1993）[^duden-1993]。种族健康差异研究者也批评向医学遗传学投入生物医学资源，因为这会抽走资源，使已知的环境性、影响更大的健康差异成因得不到关注（Roberts 2011）[^roberts-2011]。有时两种关切合流：多萝西·罗伯茨警告说，要用上医院提供的那些遗传技术，得有社会与经济资源（至少在美国如此），于是医学遗传学反倒加剧健康差异（Roberts 2009；见“女性主义生物伦理”“人类基因组计划”词条）[^roberts-2009]。随着个人的基因组信息日益落入医院与私企手中，隐私之忧也迅速蔓延（见“隐私与医学”“隐私与信息技术”词条）。
