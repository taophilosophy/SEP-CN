      Critics from disability studies, however, argued that medical genetics’ break from eugenics was not so clean-cut (Barnes 2016; Parens and Asch 1999; Silvers 2016)[^barnes-2016][^parens-1999][^silvers-2016]. When hospitals offered pregnant women the opportunity to screen for traits like Down syndrome and cystic fibrosis but not other traits like sex or eye-color, it sent a message to prospective parents that some traits—like Down syndrome and cystic fibrosis—should be considered for termination while other traits—like sex and eye-color—should not (Parens and Asch 2000)[^parens-2000]. Genetic counselors aspired to offer genetic information in a non-directive fashion, but disability-oriented critics argued that information shared with prospective parents about living with a disability was often skewed against disability (Asch 1989)[^asch-1989]. The general message disability studies scholars highlighted was that medical genetics reinforced the idea that disability was something to be avoided, not accommodated (Scully 2008)[^scully-2008]. This was seen as just the modern instantiation of the straightforwardly eugenic idea that some lives are not worth living (Saxton 1997; Wendell 1996)[^saxton-1997][^wendell-1996]. What’s more, the critics pointed out that standardizing these genetic technologies in the healthcare system actually put pressure on prospective parents to use them, which meant the reproductive decisions were not as autonomous as genetic defenders proclaimed (see entry on feminist perspectives on disability).
    step1: |-
      然而，残障研究界的批评者论证说，医学遗传学与优生学的决裂并不那么干净利落（Barnes 2016; Parens and Asch 1999; Silvers 2016）[^barnes-2016][^parens-1999][^silvers-2016]。当医院向孕妇提供筛查唐氏综合征、囊性纤维化等性状的机会，却不提供筛查性别、眼色等性状时，这就向准父母传递了一个信息：某些性状——如唐氏综合征与囊性纤维化——应当考虑终止，而其他性状——如性别与眼色——则不应当（Parens and Asch 2000）[^parens-2000]。遗传咨询师立志以非指导性方式提供遗传信息，但以残障为导向的批评者论证说，与准父母分享的关于残障生活的信息往往带有对残障的偏见（Asch 1989）[^asch-1989]。残障研究学者强调的总体信息是：医学遗传学强化了“残障是应当避免而非应当接纳之物”的观念（Scully 2008）[^scully-2008]。这被视为“某些生命不值得过”这一赤裸裸优生观念的现代翻版（Saxton 1997; Wendell 1996）[^saxton-1997][^wendell-1996]。更有甚者，批评者指出，把这些遗传技术在医疗系统中标准化，实际上给准父母施加了使用它们的压力，这意味着生殖决策并不像遗传学辩护者宣称的那样自主（见“残障的女性主义视角”词条）。
    step2: |-
      然而残障研究界的批评者认为，医学遗传学与优生学的决裂远不干净（Barnes 2016; Parens and Asch 1999; Silvers 2016）[^barnes-2016][^parens-1999][^silvers-2016]。医院让孕妇筛查唐氏综合征、囊性纤维化，却不让人筛查性别、眼色；这等于向准父母放话：有些性状（唐氏综合征、囊性纤维化）该考虑终止妊娠，有些性状（性别、眼色）则不该（Parens and Asch 2000）[^parens-2000]。遗传咨询师口口声声要非指导性地提供信息，残障导向的批评者却指出：与准父母分享的残障生活信息，往往带着贬抑残障的偏向（Asch 1989）[^asch-1989]。残障研究学者点破的总信息是：医学遗传学加固了一种成见——残障是须加回避之物，而非须加接纳之事（Scully 2008）[^scully-2008]。这被看作“有些命不值得活”那套赤裸裸优生观念的现代翻版（Saxton 1997; Wendell 1996）[^saxton-1997][^wendell-1996]。更何况，批评者指出，把这些遗传技术标准化进医疗系统，实际上给准父母施压，逼他们使用；所谓生殖决策，并不像遗传学辩护者吹嘘的那般自主（见“残障的女性主义视角”词条）。
