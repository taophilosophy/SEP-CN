      In the 1940s and 1950s, as the science of genetics was just beginning to go molecular, a new batch of programs started showing up at medical schools with names like “heredity clinic” and “medical genetics”. The faculty and staff at these units eschewed direct reference to eugenics, but their methods and clinical advice were quite similar. They advertised reproductive counseling in local newspapers. When couples showed up at the clinics, the geneticists asked questions about what medical conditions ran in their family, and then the scientists constructed pedigrees to track the conditions. This facilitated hereditary risk assessments of what could be transmitted to children born from that genetic union, and couples at risk of bearing a child with some disability were advised not to procreate (Comfort 2012)[^comfort-2012].
    step1: |-
      20 世纪 40 与 50 年代，遗传学这门科学刚开始走向分子，一批新项目就开始出现在医学院里，名为“遗传诊所”和“医学遗传学”之类。这些单位的教职员工回避直接提及优生学，但其方法与临床建议颇为相似。他们在地方报纸上刊登生殖咨询广告。当夫妇来到诊所时，遗传学家询问其家族中有哪些疾病，然后构建系谱来追踪这些疾病。这便利了对那次遗传结合所生子女可能遗传什么的遗传风险评估，而有生育残障孩子风险的夫妇则被建议不要生育（Comfort 2012）[^comfort-2012]。
    step2: |-
      20 世纪 40、50 年代，遗传学刚刚走向分子，医学院里便冒出一批新机构，名为“遗传诊所”“医学遗传学”之类。这些单位的人员避而不谈优生学，其方法与临床建议却颇为相像。他们在地方报纸上登广告，招揽生殖咨询。夫妇上门，遗传学家便询问家族中流传哪些疾病，再绘制系谱加以追踪，以评估这次结合所生子女的遗传风险；有生育残障子女之虞的夫妇，则被劝以不要生育（Comfort 2012）[^comfort-2012]。
