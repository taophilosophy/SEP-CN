      The debate over the relationship between classical genetics and molecular genetics didn’t so much resolve itself as it did evolve into a series of new philosophical questions. That is, as philosophers were working through the details of genetics to assess the relationship between the older version and the newer one, they encountered a series of questions that demanded consideration: What exactly is a “gene”? And what do genes actually do? Philosophers continued to consider the reduction question (for examples of subsequent defenders of reduction, see Waters 1990; Schaffner 1993)[^schaffner-1993][^waters-1990]. But these other questions took on a life of their own and became legitimate targets of inquiry independent of the reduction debate. Philosophy of biology professionally emerged as a unique sub-discipline of philosophy of science in the 1970s and 1980s as this unfolded (entry: philosophy of biology).
    step1: |-
      关于经典遗传学与分子遗传学关系的争论，与其说是自行解决，不如说是演化成一系列新的哲学问题。也就是说，当哲学家为评估新旧版本之间的关系而梳理遗传学细节时，他们遭遇了一系列需要思考的问题：“基因”究竟是什么？基因实际上做什么？哲学家继续思考还原问题（关于后来为还原辩护的例子，见 Waters 1990; Schaffner 1993）[^schaffner-1993][^waters-1990]。但这些其他问题获得了自己的生命，成为独立于还原争论的正当探究目标。随着这一切展开，生物学哲学在 20 世纪 70 与 80 年代作为科学哲学的一个独特分支在职业上兴起（见“生物学哲学”词条）。
    step2: |-
      这场争论并未真正了结，而是化生出一连串新的哲学问题。哲学家在梳理遗传学细节、评估新旧两版关系的同时，撞上了一堆不得不思的问题：“基因”究竟是什么？基因实际做什么？还原问题仍有人继续琢磨（后来为还原辩护者，见 Waters 1990; Schaffner 1993）[^schaffner-1993][^waters-1990]。但那些新问题各自成形，成为独立于还原之争的正当探究对象。生物学哲学也就在这一过程中于 70、80 年代作为科学哲学的独立分支职业化地兴起（见“生物学哲学”词条）。
