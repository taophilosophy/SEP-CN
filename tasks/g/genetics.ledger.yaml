      Even Darwin recognized, however, that nature presented some cases that did not fit this picture. In particular, seemingly altruistic behaviors in the animal kingdom posed a puzzle (Wilson 2015)[^wilson-2015]. Take social mammals like ground squirrels that whistle alarm calls to notify other members of the group of a nearby threat. On the original Darwinian formulation of natural selection, alarm calling should not arise because it is not beneficial to the ground squirrels that display the behavior. A ground squirrel that is more prone to notifying its counterparts of a looming threat is presumably also more likely to get killed by that threat, and so the proneness to warn shouldn’t get propagated in the population if all the altruistic ground squirrels are dying by very virtue of their altruistic behavior (entry: biological altruism).
    step1: |-
      然而，即便达尔文也承认，自然界呈现了一些不符合这幅图景的情形。尤其是动物界表面上的利他行为构成了一个谜题（Wilson 2015）[^wilson-2015]。以地松鼠这类社会性哺乳动物为例：它们会发出警报叫声，通知群体中其他成员附近有威胁。按照达尔文最初的表述，警报呼叫本不应出现，因为它对发出该行为的地松鼠并无好处。一只更倾向于向同伴示警的地松鼠，想必也更可能被那个威胁杀死；因此，如果所有利他的地松鼠都恰恰因其利他行为而丧命，那么示警的倾向就不应在种群中传播（见“生物利他主义”词条）。
    step2: |-
      然而，就连达尔文也承认，自然界有些情形不合此图。尤其动物界中看似利他的行为，颇费周章（Wilson 2015）[^wilson-2015]。以地松鼠一类社会性哺乳动物为例：遇到近处威胁，它们会发出警报叫声，提醒群体同伴。按达尔文的原初表述，警报呼叫本不该出现，因为它对发出者并无益处。一只动辄示警的地松鼠，多半也更容易被威胁捕杀；若利他的地松鼠恰恰因利他而纷纷送命，示警倾向便无从在种群中传开（见“生物利他主义”词条）。
