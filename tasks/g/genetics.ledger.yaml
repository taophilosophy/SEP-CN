      Philosophers responded to these genetic discoveries in different ways—by proposing multiple gene concepts, or by trying to unify the disparate phenomena under a single gene concept. Lenny Moss’s distinction between Gene-P and Gene-D is a classic example of the multiple gene concepts approach (Moss 2002)[^moss-2002]. Gene-P embraced an instrumental preformationism; it was defined by its relationship to a phenotype. In contrast, Gene-D referred to a developmental resource; it was defined by its molecular sequence. An example will help to distinguish the two: When one talked about “the gene for cystic fibrosis”, the Gene-P concept was being utilized; the concept referred to the ability to track the transmission of this gene from generation to generation as an instrumental predictor of cystic fibrosis, without being contingent on knowing the causal pathway between the particular sequence of DNA and the ultimate phenotypic disease. The Gene-D concept, in contrast, referred instead to just one developmental resource (i.e., the molecular sequence) involved in the complex development of the disease, which interacted with a host of other such resources (proteins, RNA, a variety of enzymes, etc.) (entry: gene). (For other examples of multiple gene concepts, see Fox Keller 2002; Baetu 2011; Griffiths and Stotz 2013)[^baetu-2011][^fox-2002][^griffiths-2013].
    step1: |-
      哲学家对这些遗传学发现的回应方式各不相同——有人提出多种基因概念，有人试图把不同现象统一到单一基因概念之下。莱尼·莫斯对 Gene-P 与 Gene-D 的区分，是多种基因概念进路的经典例子（Moss 2002）[^moss-2002]。Gene-P 包含一种工具性的先成论；它由与表型的关系来定义。相比之下，Gene-D 指一种发展资源；它由分子序列来定义。一个例子有助于区分二者：当人们谈论“囊性纤维化的基因”时，使用的是 Gene-P 概念；该概念指追踪这个基因代代传递、作为囊性纤维化工具性预测因子的能力，而不以知晓特定 DNA 序列与最终表型疾病之间的因果通路为条件。相形之下，Gene-D 概念指的是疾病复杂发展中所涉及的一种发展资源（即分子序列），它与许多其他此类资源（蛋白质、RNA、各种酶等）交互作用（见“基因”词条）。（关于多种基因概念的其他例子，见 Fox Keller 2002; Baetu 2011; Griffiths and Stotz 2013）[^baetu-2011][^fox-2002][^griffiths-2013]。
    step2: |-
      哲学家对这些发现的回应不一而足：或提出多种基因概念，或设法把纷繁现象收拢到一个统一的基因概念之下。莱尼·莫斯区分 Gene-P 与 Gene-D，是多种概念进路的经典范例（Moss 2002）[^moss-2002]。Gene-P 带有工具性的先成论色彩，由它与表型的关系来界定；Gene-D 则指一种发展资源，由它的分子序列来界定。举个例子便可分辨：人们说“囊性纤维化的基因”时，用的是 Gene-P 概念——它指追踪该基因代代传递、以之作为囊性纤维化的工具性预测手段，而不必知道这段 DNA 与最终表型疾病之间的因果路径。Gene-D 概念则指该病复杂发展所涉的一种发展资源（即分子序列），它与蛋白质、RNA、各种酶等一大批同类资源交互作用（见“基因”词条）。（多种基因概念的其他例子，见 Fox Keller 2002; Baetu 2011; Griffiths and Stotz 2013）[^baetu-2011][^fox-2002][^griffiths-2013]。
