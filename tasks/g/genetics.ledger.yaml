      A number of geneticists, structural chemists, and physicists descended on the structure of DNA in the 1950s (Olby 1994)[^olby-1994]. It was James Watson and Francis Crick at the University of Cambridge who first determined that DNA was a double-helix (Watson and Crick 1953)[^watson-1953]. Utilizing Watson’s genetic expertise, Crick’s work in theoretical physics, and Rosalind Franklin’s x-ray crystallographic images of DNA (appallingly, without her consent or even knowledge), Watson and Crick built a model of DNA showing two polynucleotide strands spiraling around one another (de Chadarevian 2002; Maddox 2002)[^chadarevian-2002][^maddox-2002]. The strands were made up of a sequence of nucleic acids—combinations of adenine (A), thymine (T), cytosine (C), and guanine (G), such that an adenine on one strand hydrogen-bonded with a thymine on the other and a cytosine on one strand hydrogen-bonded with a guanine on the other (entry: models in science).
    step1: |-
      20 世纪 50 年代，一批遗传学家、结构化学家和物理学家扑向 DNA 结构问题（Olby 1994）[^olby-1994]。是剑桥大学的詹姆斯·沃森与弗朗西斯·克里克最先确定 DNA 是双螺旋（Watson and Crick 1953）[^watson-1953]。利用沃森的遗传学专长、克里克的理论物理学工作，以及罗莎琳德·富兰克林的 DNA X 射线晶体学图像（令人愤慨的是，未经她同意，甚至未让她知情），沃森与克里克构建了一个 DNA 模型，显示两条多核苷酸链相互缠绕（de Chadarevian 2002; Maddox 2002）[^chadarevian-2002][^maddox-2002]。这些链由一系列核酸构成——腺嘌呤（A）、胸腺嘧啶（T）、胞嘧啶（C）与鸟嘌呤（G）的组合，使得一条链上的腺嘌呤与另一条链上的胸腺嘧啶形成氢键，一条链上的胞嘧啶与另一条链上的鸟嘌呤形成氢键（见“科学中的模型”词条）。
    step2: |-
      20 世纪 50 年代，遗传学家、结构化学家、物理学家纷纷扑向 DNA 结构（Olby 1994）[^olby-1994]。剑桥大学的詹姆斯·沃森与弗朗西斯·克里克率先断定 DNA 为双螺旋（Watson and Crick 1953）[^watson-1953]。他们借沃森的遗传学专长、克里克的理论物理功底，以及罗莎琳德·富兰克林的 DNA X 射线晶体衍射图像（令人愤慨的是，未经其同意，甚至未让她知情），搭出一个 DNA 模型：两条多核苷酸链相互缠绕（de Chadarevian 2002; Maddox 2002）[^chadarevian-2002][^maddox-2002]。链由一系列核酸组成——腺嘌呤（A）、胸腺嘧啶（T）、胞嘧啶（C）、鸟嘌呤（G）的搭配，使一条链上的腺嘌呤与另一条链上的胸腺嘧啶以氢键相连，一条链上的胞嘧啶与另一条链上的鸟嘌呤以氢键相连（见“科学中的模型”词条）。
