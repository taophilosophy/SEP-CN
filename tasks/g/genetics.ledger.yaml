      Morgan’s fruit fly research proved that genes were on chromosomes. But by the 1950s it was still unclear what genes were made up of, what their molecular structure was, and how that structure produced the observable hereditary patterns found in nature. Biologists at the time debated whether the genetic material was deoxyribonucleic acid (DNA) or proteins; Oswald Avery, Colin MacLeod, and Maclyn McCarty had previously indicated in research on mice that it was DNA, but this conclusion was by no means universally accepted (Avery, MacLeod, and McCarty 1944). Alfred Hershey and Martha Chase at Cold Spring Harbor Laboratory ingeniously used viruses—made up of a protein body (or “coat”) and DNA inside—that infected bacteria to settle the matter (Hershey and Chase 1952)[^hershey-1952]. They first radioactively labeled the viruses’ protein coat and allowed them to infect the bacteria, and then they radioactively labeled the viruses’ DNA and allowed them to infect the bacteria. The question was: When the viruses replicated in the bacteria, would the radioactive marker show up in the bacteria infected by viruses with radioactively-labeled proteins or in the bacteria infected by viruses with radioactively-labeled DNA? It was the latter, and that convinced molecular biologists that deciphering the molecular structure of DNA was the next major challenge (entry: molecular biology).
    step1: |-
      摩根的果蝇研究证明基因在染色体上。但到 1950 年代，人们仍不清楚基因由什么构成、其分子结构如何，以及那种结构如何产生自然界中可观察到的遗传模式。当时的生物学家争论遗传物质是脱氧核糖核酸（DNA）还是蛋白质；奥斯瓦尔德·埃弗里、科林·麦克劳德与麦克林·麦卡蒂此前在小鼠研究中表明是 DNA，但这一结论远未被普遍接受（Avery, MacLeod, and McCarty 1944）。冷泉港实验室的阿尔弗雷德·赫尔希与玛莎·蔡斯巧妙地利用由蛋白质外壳（“壳体”）与内部 DNA 构成的病毒感染细菌，解决了这一问题（Hershey and Chase 1952）[^hershey-1952]。他们先对病毒的蛋白质外壳作放射性标记，让它们感染细菌；然后对病毒的 DNA 作放射性标记，再让它们感染细菌。问题在于：当病毒在细菌体内复制时，放射性标记会出现在被蛋白质标记病毒感染过的细菌中，还是出现在被 DNA 标记病毒感染过的细菌中？答案是后者，这使分子生物学家确信，破译 DNA 的分子结构是下一个重大挑战（见“分子生物学”词条）。
    step2: |-
      摩根的果蝇研究证明基因在染色体上。但到 1950 年代，基因由什么构成、分子结构如何、这种结构又怎样造出自然界可见的遗传模式，仍是一团迷雾。当时生物学家争论遗传物质究竟是脱氧核糖核酸（DNA）还是蛋白质；奥斯瓦尔德·埃弗里、科林·麦克劳德与麦克林·麦卡蒂曾在小鼠研究中显示是 DNA，但这一结论远非人人认可（Avery, MacLeod, and McCarty 1944）。冷泉港实验室的阿尔弗雷德·赫尔希与玛莎·蔡斯用了个巧办法：拿由蛋白质外壳（“壳体”）包裹内部 DNA 的病毒感染细菌，以定此案（Hershey and Chase 1952）[^hershey-1952]。他们先给病毒蛋白质外壳打上放射性标记，让它感染细菌；再给病毒 DNA 打上放射性标记，另做一次感染。问题在于：病毒在细菌体内复制时，放射性标记会出现在前一组细菌还是后一组细菌？答案落在后一组，分子生物学家由此确信：破译 DNA 的分子结构，是下一个大关（见“分子生物学”词条）。
