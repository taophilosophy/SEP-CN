      An alternative way of making sense of what genes do without the baggage of metaphors is to characterize it in causal language. C. Kenneth Waters drew on a manipulationist theory of causation that treated causes as manipulable difference-makers, where Waters’ insight was to add a distinction between “potential difference-makers” and “actual difference-makers” (Waters 2007)[^waters-2007]. In carefully controlled genetic experiments such as Morgan’s classic work on fruit flies (see section 1.1 above), Waters pointed out that there were many potential difference-makers for a trait under investigation like eye color, but it was the actual genetic difference that was responsible for the actual difference in eye color. Waters claimed further that the spread of genetics throughout the life sciences was partly attributable to this feature of scientists being able to manipulate phenotypes by manipulating genes (entries: molecular genetics; causation and manipulability). As with the information metaphor, though, philosophical critics have been willing to accept Waters’ distinction between potential and actual difference-makers, but then challenged the idea that only genes acted as actual difference-makers (Griffiths and Stotz 2013; entry: developmental biology)[^griffiths-2013].
    step1: |-
      另一种不必背负隐喻包袱就能理解基因做什么的方式，是用因果语言来刻画它。C. 肯尼斯·沃特斯借用一种操控主义的因果理论，把原因看作可操控的差异制造者；沃特斯的洞见在于补充了“潜在差异制造者”与“实际差异制造者”的区分（Waters 2007）[^waters-2007]。在像摩根果蝇经典工作那样精心控制的遗传实验中（见上文 §1.1），沃特斯指出，对所研究的性状（如眼色）而言，有许多潜在的差异制造者，但正是实际的遗传差异造成了眼色的实际差异。沃特斯还声称，遗传学在生命科学中的扩散，部分可归因于科学家能够通过操控基因来操控表型这一特征（见“分子遗传学”“因果与可操控性”词条）。然而，与信息隐喻一样，哲学批评者愿意接受沃特斯关于潜在与实际差异制造者的区分，但随后质疑只有基因才充当实际差异制造者的观点（Griffiths and Stotz 2013；见“发展生物学”词条）[^griffiths-2013]。
    step2: |-
      另一条避开隐喻包袱的思路，是用因果语言刻画基因之所为。C. 肯尼斯·沃特斯取一种操控主义的因果理论，视原因为可操控的差异制造者；他的创见是添上“潜在差异制造者”与“实际差异制造者”之别（Waters 2007）[^waters-2007]。在摩根果蝇经典工作那样严格受控的遗传实验中（见上文 §1.1），沃特斯指出：对所受研究的性状（如眼色）来说，潜在的差异制造者多得很，但真正造成眼色实际差异的，是那个实际的遗传差异。他还主张，遗传学之所以扩散到整个生命科学，部分归功于科学家能借操控基因来操控表型（见“分子遗传学”“因果与可操控性”词条）。不过，与信息隐喻的遭遇一样，哲学批评者愿意接受潜在/实际差异制造者之分，却质疑“唯有基因才是实际差异制造者”之说（Griffiths and Stotz 2013；见“发展生物学”词条）[^griffiths-2013]。
