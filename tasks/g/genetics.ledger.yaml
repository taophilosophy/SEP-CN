      Molecular biologists spent the remainder of the 1950s and 1960s determining how the double-helical structure of DNA helped to elucidate the mechanisms of genetic replication and function. This research was guided by the notion that the gene was an informational molecule (Kay 2000)[^kay-2000]. The nucleic acid bases were “letters” which, in sets of three, made up “words” that “coded” for one amino acid. Each chromosome was a “chapter” in an organism’s entire genome—the “book of life”. These weren’t just catchy phrases for newspaper headlines. The technical language of molecular biology employed the information metaphor. DNA was “transcribed” into RNA, which was then “translated” into proteins—the central dogma of molecular biology (entry: biological information).
    step1: |-
      分子生物学家在 1950 年代余下时间和 1960 年代，致力于弄清 DNA 的双螺旋结构如何帮助阐明遗传复制与功能的机制。这项研究受一个观念的引导：基因是一种信息分子（Kay 2000）[^kay-2000]。核酸碱基是“字母”，三个一组构成“词”，“编码”一种氨基酸。每条染色体都是生物体整个基因组——那本“生命之书”——中的“一章”。这些并不只是报纸标题的俏皮话。分子生物学的技术语言使用了信息隐喻。DNA 被“转录”为 RNA，RNA 再被“翻译”为蛋白质——分子生物学的中心法则（见“生物信息”词条）。
    step2: |-
      1950 年代后半叶与 60 年代，分子生物学家埋头弄清：DNA 的双螺旋结构如何有助于阐明遗传复制与功能的机制。这项研究由一条观念引路——基因是一种信息分子（Kay 2000）[^kay-2000]。核酸碱基是“字母”，三个一组拼成“词”，为一个氨基酸“编码”。每条染色体，都是生物体整个基因组那部“生命之书”的“一章”。这些可不只是报纸标题的花哨说法：分子生物学的行话本身就在使用信息隐喻。DNA 被“转录”成 RNA，RNA 再被“翻译”成蛋白质——此即分子生物学的中心法则（见“生物信息”词条）。
