      Francis Galton, the younger cousin of Darwin, coined the term “eugenics” in 1883, meaning “good birth” (Galton 1883)[^galton-1883]. In nature, Darwin’s theory of evolution by natural selection suggested that the fit members of a population would outbreed the unfit members; Galton and other eugenicists, however, worried that this natural process was not playing out in human populations—that, in humans, the unfit were outbreeding the fit. A variety of social, economic, and political forces, the eugenicists warned, inclined people with undesirable traits (like criminality and “feeblemindedness”—a catchall term for intellectual disability) to have more children, while people with desirable traits (like high intelligence and creativity) were incentivized to have fewer children (Paul 1995)[^paul-1995].
    step1: |-
      弗朗西斯·高尔顿是达尔文的表弟，他在 1883 年创造了“优生学”一词，意为“良种出生”（Galton 1883）[^galton-1883]。在自然界中，达尔文的自然选择演化理论暗示，种群中适应良好的成员会比不适应者繁殖更多；然而高尔顿和其他优生学家担心，这一自然过程并未在人类种群中展开——在人类中，不适应者反而比适应者繁殖得更多。优生学家警告说，各种社会、经济和政治力量促使具有不良性状的人（如犯罪性和“低能”——智力障碍的笼统说法）生育更多子女，而具有优良性状的人（如高智力和创造力）却被激励少生育（Paul 1995）[^paul-1995]。
    step2: |-
      弗朗西斯·高尔顿是达尔文的表弟，1883 年造出“优生学”一词，意为“良种出生”（Galton 1883）[^galton-1883]。按达尔文的自然选择理论，种群中适应良好的成员本应比不适应者繁殖得更多；可高尔顿等优生学家担心，这一自然过程在人类种群中并未兑现——在人类里，反倒是弱者比强者生得多。他们警告说，种种社会、经济、政治力量驱使带有不良性状者（如犯罪性与“低能”——对智力障碍的笼统称呼）多生子女，而具有优良性状者（如高智力与创造力）却被鼓励少生（Paul 1995）[^paul-1995]。
