  - id: 6
    kind: body
    source: |-
      Gregor Mendel, the Austrian monk now commonly referred to as the “father of genetics”, never uttered the terms “gene” or “genetics” because those terms weren’t introduced until decades after his death. In 1865, he reported on the results of breeding experiments he performed hybridizing pea plants during which he tracked how a series of traits (e.g., round vs. wrinkled peas, white vs. purple flowers) passed down through generations. Mendel noted certain patterns of inheritance; for example, traits seemed to be transmitted independently of one another (Mendel 1866)[^mendel-1866]. Mendel died in 1884, at which point there was little indication that he would end up in biology textbooks (Olby 1985)[^olby-1985].
    step1: |-
      格雷戈尔·孟德尔是奥地利修士，如今常被称为“遗传学之父”；他从未使用过“基因”或“遗传学”这两个词，因为它们是在他去世数十年后才被引入的。1865 年，他报告了自己用豌豆植株杂交所做的育种实验结果，其间追踪了一系列性状（如圆粒与皱粒豌豆、白花与紫花）如何代代相传。孟德尔注意到某些遗传模式；例如，性状似乎彼此独立地传递（Mendel 1866）[^mendel-1866]。孟德尔于 1884 年去世，当时几乎没有迹象表明他最终会进入生物学教科书（Olby 1985）[^olby-1985]。
    step2: |-
      格雷戈尔·孟德尔是奥地利修士，如今常被尊为“遗传学之父”；他生前从未用过“基因”“遗传学”二词——它们要到其身后数十年才被造出。1865 年，他报告了以豌豆杂交所做的育种实验：他追踪一系列性状（圆粒与皱粒、白花与紫花等）如何代代相传，并从中看出某些遗传模式，例如性状似乎彼此独立地传递（Mendel 1866）[^mendel-1866]。孟德尔 1884 年去世时，几乎看不出他日后会跻身生物学教科书（Olby 1985）[^olby-1985]。
  - id: 7
    kind: body
    source: |-
      It wasn’t until 1900 that the full force of Mendel’s observations became absorbed by the scientific community. That year, three different European botanists reported on the results of their own breeding experiments and linked their results back to Mendel’s work decades earlier. Mendel’s research, at this time, was characterized as revealing heredity to involve the transmission of discrete hereditary factors that obeyed fundamental principles—that organisms get one copy of each factor from each parent and, in turn, pass one copy on to their own offspring (the law of segregation), that the factors segregate independently of one another (the law of independent assortment), and that certain factors dominate other factors when it comes to expressing the trait associated with that factor (the law of dominance) (entry: gene). William Bateson, a biologist at the University of Cambridge at the time, was excited about the implications of Mendel’s work for theories of evolution; he recruited a number of young scientists—women in particular—to Cambridge to perform experiments showing that Mendel’s principles extended across the plant and animal kingdoms (Richmond 2001)[^richmond-2001]. He called this new discipline “genetics”, and “gene” became the term for the factor that was inherited (entry: the genotype/phenotype distinction).
    step1: |-
      直到 1900 年，孟德尔观察的全部力量才被科学界吸收。那一年，三位不同的欧洲植物学家报告了他们自己的育种实验结果，并把结果与孟德尔数十年前的工作联系起来。此时，孟德尔的研究被描述为揭示了遗传涉及离散遗传因子的传递，这些因子服从一些基本原理——生物体从每个亲本各获得每个因子的一份拷贝，反过来又把一份拷贝传给自己的后代（分离定律）；因子彼此独立分离（自由组合定律）；以及某些因子在表达与该因子相关的性状时压过其他因子（显性定律）（见“基因”词条）。当时在剑桥大学的生物学家威廉·贝特森对孟德尔工作对演化理论的意义感到兴奋；他招募了一批年轻科学家——尤其是女性——到剑桥做实验，表明孟德尔的原则遍及植物界与动物界（Richmond 2001）[^richmond-2001]。他把这门新学科称为“遗传学”，而“基因”成了那个被遗传的因子的名称（见“基因型/表型区分”词条）。
    step2: |-
      直到 1900 年，孟德尔观察的全部威力才被科学界消化。那年，三位欧洲植物学家各自报告自己的育种实验，并把结果与孟德尔数十年前的工作接上。此时人们这样概括孟德尔的研究：遗传涉及离散遗传因子的传递，而这些因子服从若干基本原理——生物体从双亲各得每个因子的一份，又各传一份给自己的子代（分离定律）；因子彼此独立分离（自由组合定律）；在表现相关性状时，某些因子压过另一些因子（显性定律）（见“基因”词条）。时任剑桥大学生物学家的威廉·贝特森为孟德尔工作对演化理论的意义而振奋，招募一批年轻科学家——尤多女性——到剑桥做实验，证明孟德尔原则横贯动植物两界（Richmond 2001）[^richmond-2001]。他给这门新学科取名“遗传学”，而“基因”则成为那个被遗传的因子的名称（见“基因型/表型区分”词条）。
  - id: 8
    kind: body
    source: |-
      With genetics carved out as a unique field of study, two threads of genetic research ensued. One thread focused on identifying the physical unit of heredity that was passed from generation to generation—to figure out what genes were, where they were located, how they operated, and how that operation produced the hereditary patterns consistent with Mendel’s principles (entry: theories of biological development). Thomas Hunt Morgan’s research at Columbia University most contributed to this work. Morgan studied fruit flies, in part because they bred quickly and were easy to maintain. With a team of young scientists, he crossed thousands upon thousands of fruit flies, tracking how traits like eye color and wing shape transmitted across generations. They also induced mutations using a variety of chemical and radiation interventions (see the entry on experiment in biology). This research proved that genes were located on chromosomes, and it showed how the physics of chromosomal action during meiosis impacted the hereditary process; for example, genes closer together on chromosomes were more often inherited together, while genes that were further apart more often separated from one another during chromosomal recombination. This realization allowed Morgan and his students to produce the first gene maps—charts of genes’ relative locations to one another—and also determine that certain traits were sex-linked due to their location on sex chromosomes (Darden 1991; Kohler 1994)[^darden-1991][^kohler-1994].
    step1: |-
      遗传学被划出为一门独特的研究领域后，随之出现了两条遗传研究线索。一条线索致力于识别代代相传的遗传物质单位——弄清基因是什么、位于何处、如何运作，以及那种运作如何产生与孟德尔原则相符的遗传模式（见“生物学发展理论”词条）。托马斯·亨特·摩根在哥伦比亚大学的研究对此贡献最大。摩根研究果蝇，部分因为果蝇繁殖快、易于饲养。他带着一群年轻科学家，杂交了成千上万只果蝇，追踪眼色、翅形等性状如何代代相传。他们还用各种化学与辐射干预诱导突变（见“生物学中的实验”词条）。这项研究证明基因位于染色体上，并表明减数分裂期间染色体作用的物理机制如何影响遗传过程；例如，染色体上靠得较近的基因更常一起被遗传，而相距较远的基因在染色体重组时更常彼此分开。这一认识使摩根及其学生得以绘制出最早的基因图谱——标明基因彼此相对位置的图表——并确定某些性状因其位于性染色体上而属于伴性性状（Darden 1991; Kohler 1994）[^darden-1991][^kohler-1994]。
    step2: |-
      遗传学既已划为独立学科，遗传研究便分两路推进。一路要找出代代相传的遗传物质单位——弄明白基因是什么、在哪里、怎样起作用，以及这种作用如何造出合乎孟德尔原则的遗传模式（见“生物学发展理论”词条）。托马斯·亨特·摩根在哥伦比亚大学的工作贡献最大。摩根研究果蝇，部分因其繁殖快、好养活；他率一群年轻科学家杂交了成千上万只果蝇，追踪眼色、翅形等性状的代际传递，又用种种化学与辐射手段诱发突变（见“生物学中的实验”词条）。研究证明基因位于染色体上，并揭示了减数分裂时染色体行为的物理机制如何影响遗传；例如，染色体上挨得近的基因更常一同遗传，离得远的基因在重组时更常分开。由此，摩根及其学生绘出了最早的基因图谱——标明基因相对位置的图表——并认定某些性状因位于性染色体上而属伴性性状（Darden 1991; Kohler 1994）[^darden-1991][^kohler-1994]。
  - id: 9
    kind: body
    source: |-
      The other thread of genetic research that emerged attended to the evolutionary implications of Mendelian inheritance. Charles Darwin published *On the Origin of Species* in 1859, and the fact of evolution was widely recognized by 1900; however, the nature of the evolutionary process remained contested (Darwin 1859)[^darwin-1859]. According to Darwin, evolution was a very slow and gradual process, with natural selection favoring subtle differences between organisms (slightly longer legs, for example) that inclined one to be more successful at reproduction in some particular environment (entry: Darwinism). Mendel’s principles of inheritance, when they were hailed at the turn of the twentieth century, were thought by many geneticists to be incompatible with Darwinian evolution because Mendelian inheritance seemed more discrete (e.g., round *or* wrinkled peas, purple *or* white flowers), and so it was favored by scientists who advocated for a faster and more discontinuous process of evolution. Indeed, one of the reasons that Bateson so eagerly championed Mendel’s work was because he was a proponent of this less gradual interpretation (entries: evolution; fitness).
    step1: |-
      另一条遗传研究线索关注孟德尔式遗传的演化含义。查尔斯·达尔文 1859 年出版《物种起源》，到 1900 年演化的事实已被广泛承认；然而演化过程的性质仍有争议（Darwin 1859）[^darwin-1859]。按照达尔文，演化是非常缓慢渐进的过程，自然选择偏爱生物体之间的细微差异（例如腿稍长），这些差异使某生物在特定环境中更易繁殖成功（见“达尔文主义”词条）。孟德尔的遗传原则在 20 世纪之交受到欢呼时，许多遗传学家认为它们与达尔文演化不相容，因为孟德尔式遗传似乎更为离散（例如圆粒 **或** 皱粒、紫花 **或** 白花），因此受到主张更快、更不连续的演化过程的科学家青睐。的确，贝特森如此热切地拥护孟德尔工作的原因之一，就是他支持这种不那么渐进的解释（见“演化”“适应度”词条）。
    step2: |-
      另一路研究则着眼于孟德尔式遗传的演化意涵。查尔斯·达尔文 1859 年刊行《物种起源》，至 1900 年演化之事实已广获承认，但演化过程的性质仍聚讼纷纭（Darwin 1859）[^darwin-1859]。照达尔文之说，演化极其缓慢渐进，自然选择偏爱生物体间的细微差异（譬如腿稍长些），这些差异使它在特定环境中更易繁殖成功（见“达尔文主义”词条）。20 世纪之交孟德尔原则备受推崇时，许多遗传学家却视其与达尔文演化不相容：孟德尔式遗传显得过于离散（圆粒 **或** 皱粒、紫花 **或** 白花），于是反受主张更快、更不连续演化过程的科学家欢迎。贝特森之所以热切鼓吹孟德尔，原因之一正是他服膺这种不那么渐进的解释（见“演化”“适应度”词条）。
  - id: 10
    kind: body
    source: |-
      The apparent incompatibility between Darwinian evolution and Mendelian inheritance persisted until 1918 when British biologist R.A. Fisher first indicated how the two sciences could be related; if traits were assumed to be the product of many Mendelian factors, then Darwinian natural selection could favor subtle variations in the traits, and the populations undergoing that selection pressure would gradually evolve all while the organisms in that population obeyed the Mendelian principles of inheritance (Fisher 1918)[^fisher-1918]. Fisher’s contribution was the first in a series of works—most notably by he, J.B.S. Haldane, and Sewall Wright—to reconceive of evolution as changes in population gene frequencies. The union of Mendel and Darwin came to be called “the modern synthesis”, and the mathematical models that Fisher, Haldane, and Wright developed launched the field of population genetics (Provine 1971; entry: population genetics)[^provine-1971]. Evolutionary biology, which had long been made up of qualitative arguments about, for example, the similarity between selection on domesticated crops/livestock and selection in nature, suddenly became concerned with mathematical arguments about the quantifiable influences of migration, genetic drift, mutation, and natural selection on populations (entries: ecological genetics; heritability; genetic drift).
    step1: |-
      达尔文演化与孟德尔遗传之间表面上的不相容一直持续到 1918 年，英国生物学家 R. A. 费希尔首次指出这两门科学可以如何相关联；如果假定性状是许多孟德尔因子的产物，那么达尔文自然选择就可以偏爱性状中的细微变异，而承受那种选择压力的种群会逐渐演化，同时该种群中的生物体仍服从孟德尔遗传原则（Fisher 1918）[^fisher-1918]。费希尔的贡献是一系列著作中的第一部——其中最著名的是他本人、J. B. S. 霍尔丹与休厄尔·赖特——这些著作把演化重新构想为种群基因频率的变化。孟德尔与达尔文的联合被称为“现代综合”，而费希尔、霍尔丹与赖特所发展的数学模型开创了群体遗传学领域（Provine 1971；见“群体遗传学”词条）[^provine-1971]。演化生物学长期以来由关于例如对栽培作物/家畜的选择与自然选择之间相似性的定性论证构成，如今突然转向关于迁徙、遗传漂变、突变与自然选择对种群的量化影响的数学论证（见“生态遗传学”“遗传力”“遗传漂变”词条）。
    step2: |-
      达尔文演化与孟德尔遗传表面上的龃龉，直到 1918 年才由英国生物学家 R. A. 费希尔化解：他指出，若假定性状是众多孟德尔因子的产物，达尔文自然选择便可偏爱性状中的细微变异，承受该选择压力的种群会逐渐演化，而种群中的个体仍遵循孟德尔遗传原则（Fisher 1918）[^fisher-1918]。费希尔此举开一系列著作之先——其中最著者为费希尔本人、J. B. S. 霍尔丹与休厄尔·赖特——它们把演化重新理解为种群基因频率的变动。孟德尔与达尔文的联姻被称为“现代综合”，费希尔、霍尔丹、赖特所发展的数学模型则开创了群体遗传学（Provine 1971；见“群体遗传学”词条）[^provine-1971]。演化生物学原先多靠定性论证——比如栽培作物、家畜的人工选择与自然选择如何相似——如今骤然转向数学论证：迁徙、遗传漂变、突变与自然选择对种群各有多少可量化的影响（见“生态遗传学”“遗传力”“遗传漂变”词条）。
