      The gene’s-eye formulation of natural selection sparked an explosion of philosophical attention to evolutionary biology (which happened to roughly coincide with the attention to the relationship between classic and molecular genetics discussed in section 2.1). This “levels” or “units of selection” debate revolved around a number of questions (Keller 1999; Okasha 2006; entry: units and levels of selection)[^keller-1999][^okasha-2006]. For example, at what level does natural selection act? Genes, individuals, groups, entire species (entry: biological notion of individual)? Group selectionists argued altruistic behavior could arise if one group was fitter than another group because it had more altruistic members in that group (Sober and Wilson 1998)[^sober-1998]. Stephen Jay Gould made the case for selection acting on entire species when, for example, ecological specialists were more common than generalists (Gould 2002)[^gould-2002]. Other philosophers questioned the entire replicator/interactor distinction; Developmental Systems Theorists advocated instead for seeing the developmental system as a whole (genes and the environment) as the evolving unit (Oyama, Griffiths, and Gray eds. 2001; see the entries on developmental biology; evolution and development; phylogenetic inference).
    step1: |-
      自然选择的基因之眼表述，引发了哲学界对演化生物学的关注爆炸（这恰与 §2.1 所论对经典遗传学与分子遗传学关系的关注大致同时发生）。这场“层次”或“选择单位”之争围绕若干问题展开（Keller 1999; Okasha 2006；见“选择单位与层次”词条）[^keller-1999][^okasha-2006]。例如，自然选择在哪个层次上运作？基因、个体、群体、整个物种（见“生物学个体概念”词条）？群体选择论者论证说，如果一个群体比另一个群体更适应，因为它拥有更多利他成员，那么利他行为就可能出现（Sober and Wilson 1998）[^sober-1998]。斯蒂芬·杰伊·古尔德提出选择作用于整个物种的情形，例如生态专化者比泛化者更常见时（Gould 2002）[^gould-2002]。其他哲学家质疑整个复制者/交互者区分；发展系统理论家转而主张把发展系统作为一个整体（基因与环境）看作演化单位（Oyama, Griffiths, and Gray eds. 2001；见“发展生物学”“演化与发育”“系统发育推断”词条）。
    step2: |-
      基因之眼的表述一出，哲学界对演化生物学的兴趣顿时井喷（时点恰与 §2.1 所论经典/分子遗传学关系之争相仿）。这场“层次”或“选择单位”之争，围绕一串问题打转（Keller 1999; Okasha 2006；见“选择单位与层次”词条）[^keller-1999][^okasha-2006]：自然选择究竟在哪个层次上运作？基因、个体、群体，还是整个物种（见“生物学个体概念”词条）？群体选择论者主张，若一个群体因利他成员较多而比另一群体更适应，利他行为便可出现（Sober and Wilson 1998）[^sober-1998]。斯蒂芬·杰伊·古尔德则论证，当生态专化者比泛化者更常见时，选择可作用于整个物种（Gould 2002）[^gould-2002]。另一些哲学家干脆质疑复制者/交互者之分；发展系统理论家主张把发展系统整体（基因加环境）视为演化单位（Oyama, Griffiths, and Gray eds. 2001；见“发展生物学”“演化与发育”“系统发育推断”词条）。
