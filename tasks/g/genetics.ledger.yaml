      When genetics came on the scientific scene in 1900, many eugenicists embraced the new theory of inheritance, believing that it offered a scientific foundation for their social vision. The eugenicists assumed that human traits like criminality and intelligence played by the same hereditary rules as the traits that Mendel and Morgan made famous, where single genes were associated with single traits. The eugenic task, then, was to decrease the transmission of undesirable genes to the next generation, and increase the transmission of desirable genes. Eugenicists advocated for a variety of social and political interventions to produce more fit and less unfit humans—sterilization of the unfit, immigration restriction acts that prohibited the influx of people from entire nations deemed unfit, anti-miscegenation laws that restricted “race mixing”; as well as “fitter family contests” that praised the fecundity of fit couples, eugenic sermon contests that encouraged clergy to preach the religious justifications for eugenics, and eugenic guidance to couples considering reproduction (Rosen 2004; Lombardo 2008)[^lombardo-2008][^rosen-2004].
    step1: |-
      1900 年遗传学登上科学舞台时，许多优生学家欣然接受这一新的遗传理论，相信它为其社会愿景提供了科学基础。优生学家假定，犯罪性和智力等人类性状遵循与孟德尔和摩根使之闻名的性状相同的遗传规则，即单个基因与单个性状相关联。于是，优生任务就是减少不良基因向下一代的传递，增加优良基因的传递。优生学家倡导各种社会与政治干预，以产生更多适应、更少不适应的个体——对不适应者施行绝育、禁止被视为不适应的整个民族入境移民的限制法案、限制“种族混合”的反异族通婚法；以及赞美适应夫妇多产的“适应家庭竞赛”、鼓励神职人员宣讲优生宗教依据的优生布道竞赛，还有为考虑生育的夫妇提供优生指导（Rosen 2004; Lombardo 2008）[^lombardo-2008][^rosen-2004]。
    step2: |-
      1900 年遗传学登场，许多优生学家立刻拥抱这套新的遗传理论，以为它为自己的社会愿景备好了科学地基。他们假定，犯罪性、智力之类的人类性状遵循与孟德尔、摩根所研究性状相同的遗传规则：一个基因对一个性状。于是优生学的任务，就是减少不良基因传给下一代，增多优良基因的传递。为此他们鼓吹各式社会政治干预，以求多生适应者、少生不适应者：对不适应者施以绝育；颁行移民限制法，把整个被视为不适应的民族拒之门外；制定反异族通婚法，限制“种族混合”；还举办“适应家庭竞赛”以表彰强健夫妇的多产，举办优生布道竞赛以鼓励教士宣讲优生学的宗教理由，并为考虑生育的夫妇提供优生指导（Rosen 2004; Lombardo 2008）[^lombardo-2008][^rosen-2004]。
