      One source of confusion, according to the critics, were the metaphors that got embedded in molecular genetics in the mid-twentieth century. Computing and architectural metaphors suggesting that the genome was a “program” or “blueprint” for development conveyed misleading ideas about how cells operated (Kay 2000)[^kay-2000]. Informational metaphors may capture some features of biology, but the error was in thinking that only DNA carried that biological information (Griffiths 2001; Jablonka 2002; entries: biological information; innateness and language; the distinction between innate and acquired characteristics; the historical controversies surrounding innateness)[^griffiths-2001][^jablonka-2002].
    step1: |-
      批评者认为，混乱的一个来源是 20 世纪中叶嵌入分子遗传学的隐喻。计算机与建筑隐喻暗示基因组是发展的“程序”或“蓝图”，传达了对细胞如何运作的误导观念（Kay 2000）[^kay-2000]。信息隐喻或许捕捉了生物学的某些特征，但错误在于认为只有 DNA 携带那种生物信息（Griffiths 2001; Jablonka 2002；见“生物信息”“先天与语言”“先天与后天特征的区分”“围绕先天的历史争论”词条）[^griffiths-2001][^jablonka-2002]。
    step2: |-
      批评者认为，混乱的一个源头，是 20 世纪中叶渗入分子遗传学的那些隐喻。计算机与建筑学的比喻把基因组说成发展的“程序”或“蓝图”，传达出关于细胞如何运作的误导性观念（Kay 2000）[^kay-2000]。信息隐喻或能抓住生物学的某些特征，但错在以为只有 DNA 携带着那种生物信息（Griffiths 2001; Jablonka 2002；见“生物信息”“先天与语言”“先天与后天特征的区分”“围绕先天的历史争论”词条）[^griffiths-2001][^jablonka-2002]。
