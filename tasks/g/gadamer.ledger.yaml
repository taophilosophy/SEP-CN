      伽达默尔结过两次婚：1923 年与弗里达·克拉茨结婚（后离婚），与她育有一女（生于 1926 年）；1950 年与克特·莱克布施结婚。伽达默尔获得众多奖项与荣誉，包括 1971 年的“功勋勋章”骑士衔——德国授予的最高学术荣誉。伽达默尔直到生命最后仍保持思想活跃（九十多岁仍定期安排办公时间），2002 年 3 月 13 日在海德堡去世，享年 102 岁（更详细的传记见 Grondin 2003；亦见 Dostal 2021）[^grondin-2003]。
