      汉斯-格奥尔格·伽达默尔是二十世纪诠释学发展中的决定性人物，就影响与声望而言，他几乎肯定盖过了其他领军人物，包括保罗·利科，也包括詹尼·瓦蒂莫（瓦蒂莫本人就是伽达默尔的学生之一）。伽达默尔深受马丁·海德格尔哲学的影响（海德格尔对哲学诠释学的影响无处不在，尽管他在后期思想中放弃了这一术语），他受过的训练既有新康德主义的学术研究，也有古典语文学。伽达默尔成熟哲学的核心是一种独特而彻底的对话式进路，它以柏拉图-亚里士多德的思想以及海德格尔的思想为基础，拒斥主体主义与相对主义，放弃任何简单的诠释方法观念，并把理解建立在由语言中介的传统发生之中。伽达默尔采用的文风比海德格尔本人更正统、更谦抑，也更易读，其工作可以说集中在四个主要领域：第一，也是显然最具影响力的，是哲学诠释学的建立与阐发；第二，是哲学内部以及哲学史内部关于柏拉图与亚里士多德的对话，尤其是关于这两位，但也涉及黑格尔与海德格尔；第三，是与文学尤其是诗歌、以及与艺术的交涉；第四，是伽达默尔自己所谓的“实践哲学”（Gadamer 2001, 78–85），涵盖当代政治与伦理问题。伽达默尔进路的对话品格显而易见，不仅在于他赋予对话概念以枢纽性的理论地位，也在于其写作的论辩性与对话性、甚至“交谈式”的品格，还在于他本人对思想交流与交锋的亲身投入（伽达默尔使用德语词 *Gespräch*，它既可译为对话，也可译为交谈）。事实上，伽达默尔是少数把“访谈”变成一种重要哲学产出类别的哲学家之一（见 Hahn 1997, 588–599；亦见 Gadamer 2001, 2003）[^hahn-1997]。尽管他指出了自己的工作与英语世界“分析”思想之间的联系（主要经由后期维特根斯坦，也经由唐纳德·戴维森——见 Keane 2021）[^keane-2021]，并且其观念有时也被阿拉斯代尔·麦金太尔（见 MacIntyre 2002）、罗纳德·德沃金（见 Dworkin 1986）[^dworkin-1986]、罗伯特·布兰登（见 Brandom 2002）[^brandom-2002]、约翰·麦克道尔（见 McDowell 1996, 2002）[^mcdowell-1996]，尤其是理查德·罗蒂（Rorty 1979；亦见 Keane 2021）[^keane-2021][^rorty-1979] 这样的思想家所采纳，但在英语哲学圈中，伽达默尔或许不如他的一些同时代人那样为人熟知，也肯定不如他们那样受到充分赏识。然而，他无疑是二十世纪最重要的思想家之一：其影响遍及从美学到法理学的广泛领域，并在德国以及欧洲其他地方赢得了远远超出学术界通常范围的尊敬与声望。
