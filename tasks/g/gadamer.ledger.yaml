      与传统诠释学说明相反，伽达默尔提出的理解观拒斥“理解即通过进入某种内在主观意义领域而达成”的观念。而且，既然理解是持续进行的过程，而非任何已完成之物，他也就拒斥理解有任何最终确定性的观念。正是在这一基础上，伽达默尔反对存在任何达成理解或抵达真理的方法或技术。为精神科学寻求一种方法论、使之与“自然科学”（*Naturwissenschaften*）并立而有牢固基础——这种寻求曾构成先前许多诠释学探究的特征——由此被表明从根本上走错了路。不仅没有一种方法论能描述达成对人或历史之理解的手段，也没有任何这类方法论足以理解非人或自然。伽达默尔把理解构想为不可化约为方法或技术，并坚持理解是永无最终完成的持续过程；这不仅引人将其与后期维特根斯坦著作中的观念相比较，也可以看作与后库恩科学哲学的发展相平行。
