  - id: 9
    kind: body
    source: |-
      1. *Distinguishing the View* (*lta ba’i shan ‘byed*), a polemical text distinguishing Gorampa’s own view from those of Tsongkhapa (Tsong kha pa bLo bzang Grags pa, 1357–1419) and Dolpopa (Dol po pa Shes rab rGyal mtshan, 1292–1361);
      2. *Elucidating the View* *(lta ba ngan sel*), a commentary on the Indian scholar Candrakīrti’s *Madhyamakāvatāra;*
      3. *Synopsis of Madhyamaka* (*dbu ma’i spyi don*), an encyclopedic text outlining Gorampa’s views on the major points of Madhyamaka, as well as the views of a number of Indian and Tibetan scholars with whom he both agrees and disagrees.
    step1: |-
      1. 《辨见》（*Distinguishing the View*，藏文 *lta ba’i shan ‘byed*），一部论辩性文本，分辨果让巴自己的见解与宗喀巴（Tsong kha pa bLo bzang Grags pa，1357–1419）及朵波巴（Dol po pa Shes rab rGyal mtshan，1292–1361）的见解；
      2. 《除邪见》（*Elucidating the View*，藏文 *lta ba ngan sel*），对印度学者月称（Candrakīrti）《入中论》（*Madhyamakāvatāra*）的注释；
      3. 《中观总义》（*Synopsis of Madhyamaka*，藏文 *dbu ma’i spyi don*），一部百科全书式的文本，概述果让巴对中观诸要点的看法，以及他所赞同与不赞同的若干印度与西藏学者的看法。
    step2: |-
      1. 《辨见》（*Distinguishing the View*，藏文 *lta ba’i shan ‘byed*）：论辩之作，分辨果让巴自宗之见与宗喀巴（Tsong kha pa bLo bzang Grags pa，1357–1419）、朵波巴（Dol po pa Shes rab rGyal mtshan，1292–1361）之见的差别；
      2. 《除邪见》（*Elucidating the View*，藏文 *lta ba ngan sel*）：对印度学者月称（Candrakīrti）《入中论》（*Madhyamakāvatāra*）的注释；
      3. 《中观总义》（*Synopsis of Madhyamaka*，藏文 *dbu ma’i spyi don*）：百科全书式的著作，通述果让巴对中观诸要点的主张，并评述若干印度与西藏学者的异同。
  - id: 10
    kind: body
    source: |-
      The main difference in these texts concerns the ways in which Gorampa presents his philosophical view. *Distinguishing the View* is a polemical text in which Gorampa focuses on the metaphysics of Madhyamaka, positioning his own interpretation as a sort of middle way between other interpretations that cast Madhyamaka in terms of nihilism or eternalism. *Elucidating the View* focuses on the process through which a follower of Madhyamaka transforms her mind as she progresses toward complete awakening. *Synopsis of Madhyamaka* presents Gorampa’s interpretation of Madhyamaka in three ways: ontologically, in terms of its grounding (*bzhi*) in the two truths; ethically, in terms of the path (*lam*) that a Buddhist must follow; and epistemologically, in terms of the mental content that a Buddha experiences as a result (*‘bras bu*) of complete awakening.
    step1: |-
      这三部文本的主要差别，在于果让巴呈现其哲学见解的方式。《辨见》是一部论辩性文本，果让巴在其中聚焦于中观的形而上学，把自己的解释定位为一种中道，介于把中观解释为虚无主义或永恒主义的其他解释之间。《除邪见》聚焦于中观追随者在走向圆满觉悟的过程中转变自心的过程。《中观总义》以三种方式呈现果让巴对中观的理解：本体论上，就其以二谛为基（*bzhi*）而言；伦理上，就佛教徒必须遵循的道（*lam*）而言；认识论上，就佛陀因圆满觉悟而经验到的心理内容（*‘bras bu*，果）而言。
    step2: |-
      三部文本的差别，主要在于果让巴呈现见解的方式。《辨见》是论辩之作，集中于中观的形而上学，把自己的解释安立于一种中道，既不同于以虚无主义解中观者，也不同于以永恒主义解中观者。《除邪见》则集中于中观行者趋向圆满觉悟时转变自心的历程。《中观总义》以三个层面呈现果让巴的中观理解：本体论层面，就其以二谛为基（*bzhi*）而言；伦理层面，就佛教徒所须遵循的道（*lam*）而言；认识论层面，就佛陀由圆满觉悟而经验到的心理内容（*‘bras bu*，果）而言。
  - id: 11
    kind: body
    source: |-
      Despite the different emphases of these three texts, Gorampa’s general presentation of Madhyamaka remains consistent throughout his writings. This is especially striking when compared to Gorampa’s rough contemporaries, including Tsongkhapa and Śākya Chokden, whose views evolved over the course of their careers. The relative stability of Gorampa’s views over his lifetime is one reason why he is held in such high regard among proponents of the Sakya tradition.
    step1: |-
      尽管这三部文本的侧重不同，果让巴对中观的一般呈现，在其全部著作中仍保持一致。把他的看法与果让巴大致同时代的人相比，这一点尤其引人注目，那些人包括宗喀巴与释迦秋登，其见解在各自学术生涯中不断演变。果让巴的见解终生相对稳定，这正是他在萨迦传统拥护者中备受推崇的原因之一。
    step2: |-
      三部文本侧重虽异，果让巴对中观的总体呈现却在其全部著作中始终一贯。与同时代人大体相比，这一点尤其醒目：宗喀巴、释迦秋登等人，见解都随年岁而变。果让巴一生之见相对稳定，这正是他在萨迦传统拥护者中备受尊崇的一个缘由。
