      2. Diamond splinters (*rdo rje'i gzegs ma*), which analyzes causes.
      3. Refuting the arising of something existent or nonexistent (*yod med skye ‘gog*), which analyzes effects.
      4. Refuting the four possibilities of arising (*mu bzhi skye ‘gog*), which analyzes causes and effects together.
      5. Dependent arising (*rten ‘brel*), which shows that phenomena cannot exist independently.
