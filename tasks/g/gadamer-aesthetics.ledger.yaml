      Gadamer’s account of the symbol establishes that artworks are presentational rather than representational. Presentations occasion the meanings they invoke and do not represent a meaning independent of themselves. The argument effects a profound and significant change in the meaning of aesthetic appearance. The representational view of art relegates art to a secondary status: the artwork brings to mind something other than the artwork, an original state of affairs, a specific meaning or reality. Art’s objective co-relative is, accordingly, positioned outside the work so that the work becomes the mere appearance of something else. The presentational account of art is consistent with Gadamer’s phenomenological orientation. If the meaning invoked by a work is not independent of the work that summons it, the work is the occasion of the coming-into-appearance of that meaning. Appearing becomes synonymous with original creation. Aesthetic appearance is not secondary to reality or truth but is the medium through which the work’s truth shows/presents itself. Even as presentation, appearance does retain a certain negativity, though in Gadamer’s hands it has a positive quality. Appearance always hints at a semblance of something incomplete or not yet fully realized. Gadamer’s ontology openly reinforces if not requires such negativity. The claim that each artwork has its own temporality implies that each will never reveal itself completely. The claim that the reception of all art is contemporaneous dictates that what appears to us as meaningful is not necessarily what appeared to a previous generation as meaningful. Like the symbol, appearance is always partial. However, appearance, when considered aesthetically, has the cadence of the symbolic: it alludes to something beyond itself but which nevertheless inheres within it as the yet-to-be-revealed.
    step1: |-
      伽达默尔关于象征的说明确立了：艺术作品是表现性的，而非再现性的。表现促成它所唤起的意义，而不再现一个独立于自身的意义。这一论证使审美显现的含义发生了深刻而重大的变化。再现论的艺术观把艺术贬到次要地位：艺术作品使人想起作品之外的某种东西，某个原初的事态、某个特定的意义或实在。因此，艺术的客观相关项被置于作品之外，作品于是成了他物的单纯显现。表现论的艺术说明与伽达默尔的现象学取向一致。如果作品所唤起的意义并不独立于唤起它的作品，那么作品就是该意义进入显现的时机。显现于是成为原初创造的同义词。审美显现不是实在或真理的附属，而是作品真理借以显示／呈现自身的媒介。即使作为表现，显现确实保留某种否定性，不过在伽达默尔手里它有一种积极的品质。显现总是暗示某种未完成或尚未完全实现之物的相似。伽达默尔的本体论公开强化、甚至要求这种否定性。每件作品各有其时间性，这一主张意味着每件作品都永远不会完全揭示自身。一切艺术的接受都是同时的，这一主张规定：对我们显得有意义的东西，未必对前一代人显得有意义。与象征一样，显现总是部分的。然而，从审美上考虑，显现具有象征的节奏：它暗示自身之外的某种东西，而后者作为尚待揭示者仍内在于其中。
