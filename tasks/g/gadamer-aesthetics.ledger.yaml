      It is not suggested that we see repeatedly the *same essence* in a work of art. Were this to be suggested, works would become dull and uninformative and make no new contribution to a genre. Gadamer’s insistence is that works should speak directly to and, indeed, transform our self-understanding. Such transformative power implies recognising in a work what was previously understood of a subject-matter, but transformed, as if seen for the first time. The life of a subject-matter is one of change and development. Gadamer’s *mimesis* argument claims that through repeated re-working and re-interpretation a subject-matter not only accrues more aspects, but also, in so doing, they allow that subject-matter to become more fully what it is. “A work of art belongs so closely to what it is related to that it enriches the being of that as if through a new event of being” (TM 147). The “joy of recognition is rather the joy of knowing more than is already familiar.” Artworks allow subject-matters to become more what they are. In conclusion, Gadamer’s phenomenological aesthetics effectively destroys the Platonic separation of art and reality. Artworks are the sites in which the trans-individual both present and transform themselves. Whereas, as we have seen, for Kant the destruction of an artwork has absolutely no bearing upon the objectivities it represents, we can now understand why Gadamer is committed to the opposing view that the destruction of an artwork diminishes the reality of the subject-matters that come forth through it.
    step1: |-
      这并非主张我们在艺术作品中反复看到*同一个本质*。若作此主张，作品就会变得沉闷而无新意，对体裁没有任何新贡献。伽达默尔坚持的是：作品应当直接对我们的自我理解说话，并且确实转化它。这样一种转化力量意味着：在作品中认出先前对某一题材的理解，但那理解已被转化，仿佛初次见到。题材的生命是变化与发展的生命。伽达默尔的 *mimesis* 论证主张：通过反复的再加工与再解释，题材不仅积累更多方面，而且在这样做时，这些方面使该题材更充分地成为其所是。“艺术作品与其所关联者如此紧密地相连，以致它仿佛通过一次新的存在事件而增益了该关联者的存在”（TM 147）。“认出的喜悦，毋宁是知道多于业已熟悉之物的喜悦。”艺术作品使题材更充分地成为其所是。总之，伽达默尔的现象学美学实际上摧毁了柏拉图对艺术与实在的分离。艺术作品是超个体者既呈现自身又转化自身的场所。如我们所见，对康德而言，作品的毁损对其所表现的客观性毫无影响；而我们现在可以理解，伽达默尔为何坚持相反的观点：作品的毁损会削弱借它而出的题材的实在。
