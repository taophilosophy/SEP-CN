      Gadamer’s aesthetics involve a variety of interlocking arguments, one of the most significant of which concerns *die* *Sache selbst*. The term is difficult to translate, but it refers, loosely speaking, to a work’s subject-matter, to what it addresses or to what issue has been placed in question. Philosophical usage of the word evokes phenomenological notions of intentionality: what a work is directed at or points toward. The *Sache* is not a determinate concept but an area of significant meaningfulness, a constellation of concerns which orbit the affective, conative, and cognitive complexities of subject-matters such as grief or love. The *Sache* underpins Gadamer’s claim that aesthetic experience has a significant cognitive content. Subject-matters may transcend an individual work in that no one work can exhaust their significance, but as ideas, *Sachen* are not independent of the body of works that exemplify them. If they were ontologically distinct, the idealism Gadamer rejects would be forced on him, and he would be compelled to argue that art is representational, refers to a concept beyond itself and, indeed, disappears into that concept once evoked. Hence, art, in this way of understanding, becomes philosophy once more. If, however, art is presentation, as Gadamer insists, a work’s meaning is not independent of it. Art does not, therefore, copy and thereby represent a subject-matter, but configures a visual or literary space in which a subject-matter can be summoned. Gadamer counters an ancient line of argument that regards art as secondary to, inferior to, and a corrupter of, the real. Contrary to the Platonic tradition, his argument implies that art *adds* to the reality of its subject-matters. Gadamer’s evaluation of the aesthetic contrasts vividly with Kant’s in this respect. Kant considers aesthetic experience to be indifferent to whether or not its object is real (cf. TM 89). A work’s credibility does not depend on its relationship to an original object or co-relative. Whether what is represented exists or not is inconsequential. What matters is the aesthetic merit of the work, not the strength of its likeness. Should the artwork be harmed, the being of the correlative is unaffected. Gadamer’s presentational aesthetics is, by contrast, in this regard profoundly anti-Platonic and anti-Kantian: for Gadamer a work’s disappearance diminishes the reality of that which presents itself through it.
    step1: |-
      伽达默尔的美学包含各种相互扣合的论证，其中最重要的之一关乎 *die Sache selbst*（事情本身）。这个术语难以翻译；宽泛地说，它指作品的题材，指作品所探讨者，或指被置于疑问之中的问题。该词的哲学用法唤起关于意向性的现象学观念：作品所指向、所朝向的东西。*Sache*（事情）不是一个确定的概念，而是一个有意义性的领域，一组关切的星座，环绕着诸如悲伤或爱这类题材的情感、意动与认知复杂性。*Sache* 支撑着伽达默尔的主张：审美经验具有重要的认知内容。题材可能超越单件作品，因为没有任何一件作品能穷尽其意义；但作为观念，*Sachen*（诸事情）并不独立于体现它们的作品整体。若它们在存在论上彼此分离，伽达默尔所拒斥的观念论就会强加于他，他将被迫论证艺术是再现性的，指向自身之外的概念，并且一旦唤起该概念便消融于其中。如此理解，艺术于是又成了哲学。然而，如果如伽达默尔所坚持的那样，艺术是表现，那么作品的意义就不独立于作品。因此，艺术不是复制并因而再现某一题材，而是配置出一个视觉或文学的空间，在其中某一题材得以被召唤。伽达默尔反驳了一条古老的论证路线：这条路线认为艺术是实在的附属、劣等物与败坏者。与柏拉图传统相反，他的论证意味着艺术*增益*了其题材的实在。在这方面，伽达默尔对审美的评价与康德形成鲜明对照。康德认为审美经验对其对象是否实在漠不关心（参 TM 89）。作品的可信性不取决于它与某个原初对象或相关项的关系。所表现者是否存在，无关紧要。要紧的是作品的审美价值，而不是其相似性的强度。即使作品受损，相关项的存在也不受影响。相比之下，伽达默尔的表现论美学在这方面是深刻反柏拉图、反康德的：在伽达默尔看来，作品的消失会削弱借它而呈现自身者的实在。
