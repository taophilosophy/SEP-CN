      > Work is something that separates and divides us. For all the cooperation necessitated by joint enterprise and the division of labor in our productive activity, we are still divided as individuals as far as our day to day purposes are concerned. Festive celebration, on the other hand, is clearly distinguished by the fact that here we are not primarily separated but rather gathered together. (RB 40)
    step1: |-
      > 工作是使我们彼此分开、彼此隔裂的东西。无论共同事业与生产活动中的分工需要多少合作，就日常目的而言，我们作为个体仍然是分隔的。节庆则显然不同：在这里，我们首先不是被分开，而是被聚集在一起。（RB 40）
