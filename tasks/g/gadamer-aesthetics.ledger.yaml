      Perhaps the most important difference between Kant’s aesthetics and Gadamer’s hermeneutical aesthetics is the latter’s claim that art communicates truth. In the *Critique of Judgment*, Kant argues that aesthetic ideas elude conceptual determination and linguistic capture. Such claims resonate with Gadamer’s view of art, as he contends that an artwork’s meaning cannot be conceptually exhaused. In other words, the artwork always has an excess of meaning. However, unlike Kant, Gadamer affirms that in our expeience of art, we are confronted with truths that have the potential to foster greater self- and world-understanding. In short, Gadamer maintains precisely what Kant denies – namely, Gadamer claims that art is *not separated* from truth and knowledge but rather our experience of art as event discloses truth. As Daniel L. Tate observes, Gadamer parts ways with Kant by insisting that “the experience of art attests to a *truth* that cannot be exhaustively presented in terms of definitive knowledge” (Tate 2009, 292)[^tate-2009]. Another key difference between Gadamer’s and Kant’s accounts is Gadamer’s thematization of the spectator’s *active* role. Gadamer stresses the active role of the spectator in his 1980 essay “Intuition and Vividness” (in RB, GW8) which can be understood as a further development of his reflections on spectatorial engagement in *Truth and Method*. In “Intuition and Vividness,” written twenty years after the publication of *Truth and Method*, Gadamer reworks Kantian insights regarding the formative or productive role of the imagination into his own account of the spectator’s *creative* and *active* participation in the artwork’s coming to presence. For instance, he claims that when the spectator lingers with an artwork, her imagination synthesizes the intuitions in which the presentation of a meaningful whole emerges as a formed image. While this formed image is brought into relation with the understanding and incites thought, neither it nor the entire formative process is determined by given concepts; rather, as Tate points out, the formed image that comes to stand is *originally* constructed by the imagination (Tate 2009, 292)[^tate-2009]. The formed image enables engaged spectators to make connections and draw conclusions that exceed their present experience. As a result, art has the ability to present us with future, unrealized possibilities. Gadamer’s creative reworking of Kantian imagination and aesthetic ideas underscores both the creative and formative abilities of the imagination vis-a-vis our experience of art and, importantly, the power of art’s truths – “truths that disclose the finitude of our being and our need for others. In the dynamic, participatory event that art is, we are invited – even provoked – to imagine ourselves, others, and our present world otherwise, which is to imagine (and perhaps even hope for) a different (and better) future” (Nielsen 2023, 38)[^nielsen-2023].
