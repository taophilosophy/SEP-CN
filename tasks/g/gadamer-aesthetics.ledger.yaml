    kind: body
    source: |-
      Gadamer insists that a picture or image that is worthy of being called a work of art, has the power to affect us immediately. (GW 8, 374). Art addresses us. The claim that a work of art “says something to someone” (Palmer 2001, 70)[^palmer-2001] alludes to the surprise, shock and, sometimes, dismay at being directly affected by what is in a work and of being forced to reflect on its claim so that it becomes more understandable to both oneself and others. Gadamer argues that “the experience of art is an experience of meaning, and as such this experience is something that is brought about by understanding” (Palmer 2001, 70)[^palmer-2001]. To this extent, then, “aesthetics is absorbed into hermeneutics” (Palmer 2001, 76)[^palmer-2001]. This distances Gadamer from more conventional justifications of the aesthetic as offering a special kind of pleasure. The essay “The Play of Art” suggests that “the mere onlooker who indulges in aesthetic or cultural enjoyment from a safe distance, whether in the theatre, the concert hall, or the seclusion of solitary reading, simply does not exist” (RB 129–130). A person who takes himself to be such an onlooker, misunderstands himself. “Aesthetic self-understanding is indulging in escapism if it regards the encounter with the work of art as nothing but enchantment in the sense of liberation from the pressures of reality through the enjoyment of a spurious freedom” (RB 130). These remarks divorce Gadamer’s thinking from Dilthey’s *Erlebnis-Ästhetik* in which artworks are proclaimed the site of intense but momentary experience enjoyed for their own sake independent of their cognitive content. The hedonistic personalisation of aesthetic response has two alienating consequences. On the one hand, the judgement that aesthetic experience is purely subjective severs the individual from communal networks of meaning capable of illuminating personal experience from the perspective of what is socially shared. On the other, attempts to render subjective experience academically legitimate by presenting it as a social product further estrange the individual from his experience, by translating it into third-person terms he or she may not endorse or recognise: individual experiences of beauty can suddenly become embodiments of class prejudice. In contrast to Dilthey (1833–1911), Gadamer defends an *Erfahrung-Ästhetik,* which claims that like significant life-experiences, our relationships with artworks are deep and ongoing: we revisit them, and, in doing so, understanding is continually renegotiated. Gadamer speaks of the “interminability” of such experience (*die Unabschliessbarkeit aller Erfahrung*, Palmer 2001, 66)[^palmer-2001]. It is forever open because of its cognitive movement. The cumulative nature of such experience is an instance of *Bildung* (formation and learning through experience) and is, as such, a living process of becoming (*Werden*).
    step1: |-
      伽达默尔坚持认为，一幅配得上称为艺术作品的图像，具有直接打动我们的力量（GW 8, 374）。艺术向我们说话。说一件艺术作品“向某人言说某事”（Palmer 2001, 70）[^palmer-2001]，指的是：我们被作品中的东西直接打动，感到惊讶、震动，有时甚至沮丧，并被迫反思它的主张，使它对自我与他人变得更为可理解。伽达默尔论证说，“艺术经验是一种意义的经验，因而这种经验是由理解带来的”（Palmer 2001, 70）[^palmer-2001]。就此而言，“美学被吸收进诠释学”（Palmer 2001, 76）[^palmer-2001]。这使伽达默尔远离那种把审美当作提供特殊愉悦的较为传统的辩护。《艺术的游戏》一文提出，“那种从安全距离外沉溺于审美或文化享受的单纯旁观者，无论身处剧场、音乐厅，还是独处阅读的幽静之中，根本就不存在”（RB 129–130）。一个自认为是这种旁观者的人，误解了自己。“审美自我理解若把与艺术作品的相遇仅仅看作一种魅惑，即通过享受虚假的自由而从现实的压力中解脱，那它就是沉溺于逃避主义”（RB 130）。这些论述使伽达默尔的思想与狄尔泰的 *Erlebnis-Ästhetik*（体验美学）分道扬镳；后者宣称艺术作品是强烈而暂时之体验的场所，这种体验为其自身而被享受，独立于其认知内容。对审美反应的享乐主义个人化有两重疏离的后果。一方面，判定审美经验纯属主观，就把个人与共同体意义网络割裂开来，而这一网络能够从社会共享的角度照亮个人经验。另一方面，试图把主观经验呈现为社会产物以使其在学术上合法化，会进一步使个人与其经验相疏离，因为它把经验译成个人也许并不认可或辨认的第三人称措辞：个人的美感经验会突然变成阶级偏见的体现。与狄尔泰（1833–1911）相反，伽达默尔捍卫一种 *Erfahrung-Ästhetik*（经验美学），它主张：与重大的生活经验一样，我们与艺术作品的关系是深长而持续的：我们反复重访作品，理解在此过程中不断被重新协商。伽达默尔谈到这种经验的“不可终结性”（*die Unabschliessbarkeit aller Erfahrung*，Palmer 2001, 66）[^palmer-2001]。由于它具有认知性的运动，它永远开放。这种经验的积累性属于 *Bildung*（通过经验而形塑与学习）之例，本身是一个活的生成（*Werden*）过程。
    step2: |-
      伽达默尔坚称，一幅配得上“艺术作品”之名的图像，有直接打动我们的力量（GW 8, 374）。艺术向我们说话。说一件作品“向某人言说某事”（Palmer 2001, 70）[^palmer-2001]，说的正是这种经验：我们被作品中的东西直接击中，惊讶、震撼，有时甚至惶然，于是不得不思量它的主张，好让它对自己、对别人都更可理解。伽达默尔论证说，“艺术经验是一种意义的经验，因而这种经验由理解带来”（Palmer 2001, 70）[^palmer-2001]。就此而言，“美学被吸收进诠释学”（Palmer 2001, 76）[^palmer-2001]。这就使伽达默尔远离那种把审美说成提供特殊愉悦的常规辩护。《艺术的游戏》一文说，“那种从安全距离外沉溺于审美或文化享受的单纯旁观者，无论在剧场、音乐厅，还是在一人独处的阅读中，根本就不存在”（RB 129–130）。自以为是这种旁观者的人，恰恰误解了自己。“审美自我理解若把与作品的相遇只看作一种魅惑，即借享受虚假的自由来摆脱现实的压力，那它就是沉溺于逃避主义”（RB 130）。这些话使伽达默尔与狄尔泰的 *Erlebnis-Ästhetik*（体验美学）分道扬镳：后者宣称艺术作品是强烈而短暂之体验的场所，此类体验为其自身而被享受，与其认知内容无关。把审美反应享乐主义地个人化，会带来两重疏离。其一，判定审美经验纯属主观，就把个人从共同体的意义网络中割出，而这一网络本可从社会共享处照亮个人经验。其二，为让主观经验在学术上合法而把它说成社会产物，又会进一步把人与其经验隔开：经验被译成个人也许并不认可、也不认识的第三人称措辞，个人的美感经验会忽然变成阶级偏见的化身。与狄尔泰（1833–1911）相反，伽达默尔捍卫一种 *Erfahrung-Ästhetik*（经验美学）：与重大的生活经验一样，我们与作品的关系深长而持续，我们反复重访作品，理解也在此间不断重新协商。伽达默尔谈到这种经验的“不可终结性”（*die Unabschliessbarkeit aller Erfahrung*，Palmer 2001, 66）[^palmer-2001]：因其认知性的运动，它永远敞开。这种经验层层积累，正是 *Bildung*（借经验而形塑、学习）的一例，本身是一个活的生成（*Werden*）过程。
