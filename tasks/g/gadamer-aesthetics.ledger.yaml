      Instrumentalist conceptions of language persuade us that the spoken and written word are but communicative tools, but for Gadamer participation in language acknowledges that an individual is located within a substantive horizon of meanings which transcends subjective consciousness. Pragmatic concerns encourage the forgetting of such interconnectedness but when such individualism is suspended by the festival or, indeed, by the adoption of a hermeneutically-attuned aesthetic attitude, the re-discovery of oneself as belonging to an extensive community of shared meanings and involvements becomes possible. The artwork’s communicative capacity awakens the realization that in as much as I understand myself as being addressed, I must acknowledge that I already belong to something larger than myself. The artwork *festivises*: it reveals our personal indebtedness to past and future communities of meaning. The thesis that we belong to a hermeneutic collective which is the effective underpinning of art’s ability to communicate is further elaborated in Gadamer’s discussion of the symbol.
    step1: |-
      工具主义的语言观使我们相信，口头与书面的词不过是交流工具；但在伽达默尔看来，参与语言意味着承认个人位于一个超越主观意识的实体性意义视域之中。实用关切促使人们遗忘这种相互关联；然而当这种个人主义被节庆悬置，或被一种诠释学上调校过的审美态度悬置时，重新发现自己属于一个由共享意义与共同投入构成的广延共同体，就成为可能。作品的交流能力唤醒这样一种认识：既然我把自己理解为被言说者，我就必须承认自己已经属于某种比我更大的东西。艺术作品*使之节庆化*：它揭示我们对过去与未来意义共同体的个人亏欠。我们属于一个诠释学集体，而这个集体是艺术交流能力的有效支撑；这一论题在伽达默尔关于象征的讨论中得到进一步展开。
    step2: |-
      工具主义语言观要我们相信，口头与书面的词不过是交流工具；但在伽达默尔看来，参与语言就是承认：个人处于一个超越主观意识的实体性意义视域之中。实用关切促人忘掉这层关联；可当这种个人主义被节庆悬置，或被一种经诠释学校准的审美态度悬置时，人便可能重新发现：自己属于一个由共享意义与共同投入构成的广延共同体。作品的交流能力唤醒一种认识：我既把自己理解为被言说者，就得承认自己已属于某种比我更大的东西。作品*使之节庆化*：它揭示我们对过去与未来意义共同体的亏欠。我们属于一个诠释学集体，而这集体正是艺术交流能力的有效支撑；此论题在伽达默尔论象征时进一步展开。
