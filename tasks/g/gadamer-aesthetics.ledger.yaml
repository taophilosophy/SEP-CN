      Gadamer’s thinking here betrays a further Kantian inflection. The Kantian conception of aesthetic pleasure, as a variety of experience which arises only where the egotistical interests that constitute the commerce of everyday life are not in play, suggests the possibility of a community forming around shared non-hostile pleasures. Gadamer’s account of aesthetic experience is not concerned with a putative kingdom-to-come but with rediscovering and forging the communality that we are. Despite this difference, aesthetic experience establishes for both thinkers a meditative space in and through which something can be occasioned. The underlying point remains. Whereas for Kant it is a change in the disposition of *subjective* consciousness (i.e., its adoption of an aesthetic attitude) that initiates a better disposition towards the community, for Gadamer it is the participation in a *trans-subjective event* that effects a change in subjective dispositions towards the community.
    step1: |-
      伽达默尔此处的思考透露出又一层康德式的转调。康德式的审美愉悦构想——即审美愉悦是只有在构成日常生活交易的自利关切不起作用之处才产生的一种经验——暗示了一种围绕共享的非敌对愉悦而形成共同体的可能。伽达默尔对审美经验的说明，关心的不是一个臆想中的将至王国，而是重新发现并锻造我们本就所是的共同性。尽管有这一差别，审美经验对两位思想家来说都建立了一个沉思的空间，在其中并通过它，某种东西得以被促成。底下的要点仍然成立。对康德而言，是*主观*意识状态的改变（即采取审美态度）启动了朝向共同体更好的状态；对伽达默尔而言，则是参与一个*超主体的事件*带来了主观状态朝向共同体的改变。
    step2: |-
      伽达默尔此处的思考，又透出一层康德式的转调。康德的审美愉悦构想是：这种愉悦只在构成日常生活交易的自利关切不起作用之处才出现——这就暗示了一种可能：共同体可以围绕共享的非敌对愉悦而形成。伽达默尔论审美经验，却不关心某个臆想中的将至王国，他要重新发现并锻造我们本就所是的共同性。尽管有这差别，审美经验对两人来说都辟出一个沉思的空间，在其中并通过它，某种东西得以被促成。底下的要点仍成立：对康德来说，启动朝向共同体之更好状态的是*主观*意识状态的改变，即采取审美态度；对伽达默尔来说，则是参与一个*超主体的事件*，由此改变主观状态与共同体的关系。
