      The overall argument is not that a game or an artwork cannot be reduced to intention, material, or convention but rather that each of these elements comes into their own when taken up within the *playing* of the game or in the *practice* which is art. It is the playing that draws spectator, player, intention, equipment, and convention into the one event. This promotes an interactive view of art as a communicative event. It lends a dialogical dimension to art. An artwork involves more than one voice as, indeed, the word *inter-*pretation implies. Furthermore, the conception of art as an event requires a different ontological structure to those standard accounts of aesthetic experience grounded in subjectivity alone. An artwork is not an object completely independent of the spectator yet somehow given over to the spectator for his or her personal enjoyment. To the contrary, the game analogy suggests that the act of spectatorship contributes to enhancing the being of the artwork by bringing what is at play within it to fuller realization. The spectator just as much as the artist plays a crucial role in developing the subject-matters that art activates. The aesthetic spectator is swept up by her experience of art, absorbed in its play, and potentially transformed by that which spectatorship helps constitute. Though Gadamer’s argument distances itself from traditional subject-object paradigms, it does retain certain features of Kant’s aesthetics. In other words, Gadamer’s engagement with Kantian aesthetics is a complicated matter. In *Truth and Method*, Gadamer’s tone vis-a-vis Kant’s claims in the *Critique of Judgment* is at times polemical; however, his reading of Kant is not simply dismissive and critical but also involves creatively reworking many of Kant’s insights. For example, whereas Kant attributes a non-purposive rationality to the aesthetic attitude, Gadamer attributes it to the playful process of art practice itself. Both art and the game share a to-and-fro movement not tied to any specific goal other than to fulfil themselves for their own sake (TM 103): no one knows how a game will end and no one knows to what end an artwork works (Lawn 2006, 91)[^lawn-2006]. However, what is clear is that it is what occurs when the artwork or the game is in-play that matters. Often contrary to their own willing and doing, the spectator is taken over by a substantial and consequential event that transcends the boundaries of everyday consciousness and which has no purpose other than to bring something forth.
    step1: |-
      总体论证并不是说游戏或艺术作品不能被化约为意向、材料或惯例，而是说这些要素各自只有在被纳入游戏的*游戏*之中、或被纳入作为艺术的*实践*之中时，才回到本位。正是游戏把观者、游戏者、意向、装备与惯例带入同一个事件。这促进了一种把艺术视为交流事件的互动观点。它给艺术增添了对话维度。艺术作品涉及不止一个声音，正如 *inter-*pretation（诠释）一词所暗示的那样。此外，把艺术视为事件，要求一种不同于那些仅以主体性为根据的标准审美经验说明的本体论结构。艺术作品不是一个完全独立于观者、却又以某种方式交给观者供其个人享受的客体。相反，游戏类比表明：观看的行为通过把作品中处于游戏状态的东西带入更充分的实现，而有助于增进作品的存在。观者与艺术家一样，在发展艺术所激活的题材方面起关键作用。审美观者被其艺术经验卷走，沉浸于作品的游戏之中，并可能被观看所帮助构成的东西转化。伽达默尔的论证虽与传统的主客体范式保持距离，却确实保留了康德美学的某些特征。换言之，伽达默尔与康德美学的交涉是件复杂的事。在《真理与方法》中，伽达默尔对康德《判断力批判》诸主张的语调有时是论战性的；然而他对康德的读解并非简单的轻蔑与批评，而是创造性地改造了康德的许多洞见。例如，康德把非目的性的理性归于审美态度，伽达默尔则把它归于艺术实践本身的游戏过程。艺术与游戏共有一种来回往复的运动，除为自身缘故而自我完成之外，不系于任何特定目标（TM 103）：没有人知道游戏将如何结束，也没有人知道作品为何目的而运作（Lawn 2006, 91）[^lawn-2006]。然而清楚的是，要紧的是作品或游戏在游戏进行中发生的事。观者往往违背自己的意愿与作为，被一个实体性的、有后果的事件接管，这事件超越日常意识的边界，除把某种东西带出来之外别无目的。
    step2: |-
      总体的论证并不是说游戏或作品不能被化约为意向、材料或惯例，而是说这些要素只有被纳入游戏的*游戏*、或艺术的*实践*，才各得其所。正是游戏把观者、游戏者、意向、装备与惯例收进同一个事件。这带来一种互动式的艺术观：艺术是交流事件。艺术由此获得对话的维度。作品里不止一个声音——*inter-*pretation（诠释）一词所暗示的，正是这一点。再者，把艺术视为事件，需要一种不同于“只以主体性为依据”的标准审美经验说的本体论结构。作品不是完全独立于观者、却又交给观者供其私人享受的客体。相反，游戏类比表明：观看行为把作品中处于游戏的东西带向更充分的实现，从而增益作品的存在。观者与艺术家一样，在发展中艺术所激活的题材上作用关键。审美观者被自己的艺术经验卷走，沉入作品的游戏，并可能被“观看所参与构成”的东西所转化。这一论证虽与传统的主客体范式保持距离，却仍保留了康德美学的若干特征。也就是说，伽达默尔与康德美学的交涉颇为复杂。《真理与方法》谈到康德《判断力批判》的主张时，语调时而论战；但他对康德的读解并非一味轻蔑批评，而是创造性地改造了康德的许多洞见。举例说，康德把非目的性的理性归给审美态度，伽达默尔则把它归给艺术实践自身的游戏过程。艺术与游戏都有一种来回往复的运动，除自我完成之外不系于任何特定目标（TM 103）：无人知道游戏会怎样收场，也无人知道作品为何而作（Lawn 2006, 91）[^lawn-2006]。但清楚的是，要紧的是作品或游戏在游戏之际发生的事。观者常常违背自己的意愿与作为，被一个实体性的、有后果的事件接管；这事件越出日常意识的边界，除了把某种东西带出来，别无目的。
