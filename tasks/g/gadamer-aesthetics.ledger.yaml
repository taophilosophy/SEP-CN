      Conventional accounts of aesthetic experience stress its intense and individuating nature (*Erlebnis*). Yet despite its intimacy, Gadamer emphasizes that within experience (*Erfahrung*) one is always participating, perhaps unwittingly, in something beyond oneself. Aesthetic involvement is in some respects, therefore, a communal activity. The analogy between aesthetic experience and the festival or festive celebration is telling.
    step1: |-
      关于审美经验的常规说明强调其强烈而个体化的性质（*Erlebnis*，体验）。然而尽管它如此私密，伽达默尔仍强调：在经验（*Erfahrung*）之中，人总是在参与某种超出自身的东西，也许并非有意。因此，审美投入在某些方面是一种共同体的活动。审美经验与节日或节庆之间的类比很能说明问题。
    step2: |-
      关于审美经验的常规说法，强调它强烈而个体化的性质（*Erlebnis*，体验）。然而尽管它如此私密，伽达默尔仍强调：在经验（*Erfahrung*）之中，人总在参与某种超出自身的东西，哪怕自己并未察觉。所以审美投入在某些方面是一种共同体活动。审美经验与节日、节庆之间的类比，很能说明问题。
