      康德美学与伽达默尔诠释学美学之间，最重要的差别也许是后者主张艺术传达真理。康德在《判断力批判》中说，审美观念逃避概念规定与语言把握。这与伽达默尔的艺术观相合：他也主张作品的意义不能被概念穷尽，作品总有意义的盈余。然而与康德不同，伽达默尔肯定：在艺术经验中，我们面对的真理有可能促进更深的自我理解与世界理解。简言之，伽达默尔所坚持的，恰是康德所否认的：艺术*并未*与真理和知识相隔绝，我们对作为事件的艺术的经验开显真理。如丹尼尔·L. 泰特所见，伽达默尔与康德分手之处在于，他坚称“艺术经验见证一种*真理*，此真理无法以确定知识的方式被穷尽呈现”（Tate 2009, 292）[^tate-2009]。另一关键差别，是伽达默尔把观者的*主动*角色置于主题中心。他在 1980 年的《直观与生动性》（收入 RB、GW8）中强调观者的主动角色，此文可看作《真理与方法》中观看参与之反思的进一步发展。写作此文时，距《真理与方法》问世已二十年；伽达默尔把康德关于想象力之构形、生产作用的洞见，改造成自己关于观者*创造性地*、*主动地*参与作品进入在场的说明。譬如他说，观者流连于作品时，想象力综合诸直观，一个有意义整体的呈现就在其中作为已成形图像涌现。这图像被带入与知性的关系并激起思考，但图像本身与整个构形过程都不由既定概念决定；毋宁说，如泰特所指，站立起来的已成形图像是由想象力*原初地*构造的（Tate 2009, 292）[^tate-2009]。已成形的图像使投入的观者建立联系、引出超出当下经验的结论。因此，艺术能向我们呈现未来尚未实现的可能性。伽达默尔对康德式想象力与审美观念的创造性改造，既显出想象力在我们艺术经验中的创造与构形之力，也显出（要紧的是）艺术真理的力量——“这些真理揭示我们存在的有限，揭示我们需要他人。在艺术这一动态的、参与性的事件中，我们被邀请，甚至被激将，去以别样方式想象自己、他人与当下的世界，也就是去想象（甚至希望）一个不同（且更好）的未来”（Nielsen 2023, 38）[^nielsen-2023]。
