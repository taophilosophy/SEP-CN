      When Gadamer argues that “the mystery of festive celebration lies in this suspension of time,” he refers to how festivity suspends work-time (RB 59). This initiates that festival or “fullfilled” time in which another order of events emerges (RB 42). It is in such time that an artwork “comes to stand” irrespective of whether it is a painting, drama, or symphony. The festive “represents a genuine creation: something drawn from within ourselves takes shape before our eyes in a form that we recognise and experience as a more profound presentation of our own reality” (RB 60). This distances Gadamer from the view that aesthetic experience is a solitary subject’s personal response to an artwork. In the festive—an analogy for the communal dimensions of aesthetic experience—the individual subject comes to stand differently in its relationship to others. Just as the artwork comes to stand in the festival, so too does the artwork bring its spectators to stand as a community: “in the festive the communal spirit that supports us all and transcends each of us individually” discloses the real power of both the festive and the work of art (RB 63). The festival occasions individuals surpassing their everyday view of themselves as potentially hostile competitors and coming to see themselves as a community formed around a shared interest in what the artwork brings forth. This is an analogy for something more fundamental.
    step1: |-
      当伽达默尔论证“节庆的秘密在于这种时间的悬置”时，他指的是节庆如何悬置工作时间（RB 59）。这启动了节日或“充实的”时间，在其中另一种事件秩序浮现出来（RB 42）。正是在这样的时间里，无论是一幅画、一出戏剧还是一部交响曲，艺术作品“站立起来”。节庆“代表一种真正的创造：从我们自身之内引出的某种东西，在我们眼前成形，其形式我们认作并经验为对我们自身实在更为深刻的表现”（RB 60）。这使伽达默尔远离那种认为审美经验是孤独主体对作品个人反应的观点。在节庆中——它是审美经验之共同体维度的类比——个体主体在与他人关系中的站立方式发生了变化。正如作品在节庆中站立起来，作品也把它的观者带成一个共同体而站立：“在节庆中，那支撑我们全体、超越我们每一个人的共同体精神”揭示了节庆与艺术作品双方的真正力量（RB 63）。节庆促成个人超越其日常的自我观（把自己看作潜在敌对的竞争者），转而把自己看作一个围绕对作品所带出之物的共享兴趣而形成的共同体。这是对某种更为根本之物的类比。
    step2: |-
      伽达默尔说“节庆的秘密在于这种时间的悬置”，指的是节庆把工作时间悬置起来（RB 59）。由此开启节日或“充实的”时间，另一种事件秩序在其中浮现（RB 42）。正是在这样的时间里，无论绘画、戏剧还是交响曲，作品“站立起来”。节庆“代表一种真正的创造：从我们自身之内引出的东西在眼前成形，其形式我们认作、经验为对我们自身实在更深刻的呈现”（RB 60）。这就使伽达默尔远离“审美经验是孤独主体对作品的私人反应”之说。节庆是审美经验之共同体维度的类比；在节庆中，个体主体与他人关系中的站立方式变了。作品在节庆中站立起来，也把观者带成一个共同体而站立：“在节庆中，那支撑我们全体、超越我们每一个人的共同体精神”，揭示了节庆与作品双方的真正力量（RB 63）。节庆促成个人越出日常的自我观——不再把自己看成潜在敌对的竞争者，而把自己看成围绕作品所带出之物的共享兴趣结成的共同体。这是对某种更根本之物的类比。
