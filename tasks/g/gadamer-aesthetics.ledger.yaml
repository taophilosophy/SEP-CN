      Gadamer’s discussion of the relation between art and play should not be equated with any argument that art is a trivial game or pastime. He follows the precedent of Schiller’s *Letters on Aesthetic Education*, which contend that artworks are dramatic in that *they put something into play*. The underlying motif is that aesthetic consciousness is far from self-contained but is rather drawn into the play of something much larger than what is evident to subjective consciousness. The analogy with drama and, indeed, sporting events, implies that art is eventual, an occasion that consciousness surrenders to and participates in. Spectatorial participation (like much art research) demands immersion in that which cannot be fully anticipated or controlled by individual consciousness. The game and the artwork are both forms of self-movement which require that the spectator play along with what they bring into being (RB 23). Gadamer asserts the “primacy of the play” over consciousness: “the players are merely the way the play comes into presentation” (TM 92, 98). Participation takes the individual players out of themselves. The individual subject is that upon which success, satisfaction, or loss is imposed from within the game. By analogy, the work of art is also “the playing of it.” An autonomous event comes into being, something comes to stand in its own right which “changes all that stand before it” (RB 25). Like the ancient *theoros*, the spectator not only participates in the event which is the artwork but is potentially transformed by it (RB 24).
    step1: |-
      伽达默尔关于艺术与游戏之关系的讨论，不应等同于任何主张艺术是琐碎游戏或消遣的论证。他遵循席勒《审美教育书简》的先例，后者主张艺术作品具有戏剧性，因为它们*把某种东西投入游戏*。其底层主旨是：审美意识远非自足的，而是被卷入比主观意识所见的更大之物的游戏之中。与戏剧、乃至体育赛事的类比意味着：艺术是事件性的，是一个意识所委身并参与其中的时机。观者的参与（如许多艺术研究）要求沉浸于无法被个体意识完全预期或控制的东西之中。游戏与艺术作品都是自我运动的形式，它们要求观者随着它们所带入存在的东西一起游戏（RB 23）。伽达默尔主张“游戏的优先性”高于意识：“游戏者不过是游戏进入表现的方式”（TM 92, 98）。参与把各个游戏者带出自身。个体主体是从游戏内部被施加成功、满足或损失的东西。类推而言，艺术作品也是“对它的游戏”。一个自主的事件产生出来，某种东西自行站立起来，它“改变一切立于其前者”（RB 25）。如同古代的 *theoros*（观礼者），观者不仅参与作为艺术作品的事件，而且可能被它转化（RB 24）。
    step2: |-
      伽达默尔论艺术与游戏的关系，不应混同于“艺术只是无聊的游戏或消遣”这类主张。他循席勒《审美教育书简》的先例：作品之所以有戏剧性，是因为*它们把某种东西投入游戏*。其底下的主旨是：审美意识远不自足，它被卷进一场比主观意识所见更大的游戏。与戏剧乃至体育比赛的类比意味着，艺术是事件性的，是一个意识委身其中、参与其中的时机。观看者的参与（如同许多艺术研究）要求沉浸于个体意识无法完全预期、也无法控制的东西。游戏与作品都是自我运动的形式，要求观者随着它们带入存在的东西一同游戏（RB 23）。伽达默尔主张“游戏的优先性”先于意识：“游戏者不过是游戏进入表现的方式”（TM 92, 98）。参与把游戏者带出自身；成功、满足或损失，都是在游戏内部加于个体主体的。以此类推，作品也是“对它的游戏”。一个自主的事件生成出来，某种东西自行站立，它“改变一切立于其前者”（RB 25）。如古代的 *theoros*（观礼者），观者不只参与作为艺术作品的事件，还可能被它转化（RB 24）。
