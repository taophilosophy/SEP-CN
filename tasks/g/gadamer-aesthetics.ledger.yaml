      An important consequence arises from this, namely, Gadamer conceives art as presentational (*darstellen*) rather than representational (*vorstellen*). In the essay “Word and Picture” (1992), he claims that he tries “to undermine the idea that the picture is a mere copy” (GW 8, 374). As a work does not represent anything other than itself, the meanings it carries can only come to the fore in its self-presentation. Yet the emergent meaning is never given in its entirety nor obviated by any realization. This is consistent with the *eventual* nature of art. “When a work of art truly takes hold of us, it is not an object that stands opposite us which we look at in hope of seeing through it to an intended conceptual meaning … The work is an *Ereigniss*—an event that ‘appropriates us’ to itself. It jolts us, it knocks us over and sets up a world of its own, into which we are drawn” (Palmer 2001, 71)[^palmer-2001]. What is revealed, however, remains but an aspect of the work, which when it appears, drives others into the background. Disclosure and hiddenness are not contraries in Gadamer’s aesthetics, but mutually dependent: the disclosed reveals the presence of the undisclosed in the disclosed. “It is in the sheer being there (*Da-sein*) of the work of art that our understanding experiences the depths and the unfathomability of its meaning” (Palmer 2001, 72)[^palmer-2001]. The claim that a work’s meaning can never be completely fulfilled is supported by a linguistic analogy concerning the speculative. Art has a language in that its signs and symbols function like semantic units. Gadamer comments on the living virtuality of meaning contained in each word, as an inner dimension of multiplication. Accordingly, language is not the representation (*mimesis*) of a set of pre-given meanings but a “coming to language” of a constant reserve of meanings (Palmer 2001, 67)[^palmer-2001]. The finitude of linguistic expression is such that no utterance can be complete. Nothing comes forth in one meaning that is simply offered us (PH 103). “The only thing that constitutes language … is that one word leads to another, each word is, so to speak, summoned, and on its side holds open the further progress of speaking” (Palmer 2001, 67)[^palmer-2001]. No meaning can be completely revealed. Because we can re-visit artworks repeatedly, the meaning disclosed initially can be expanded or changed. The partial nature of any given meaning-disclosure *enhances* rather than diminishes the possibility of meaning within a work. “The work of art consists in its being open in a limitless way to ever new integrations of meaning” (PH 98) and furthermore, “the inexhaustibility that distinguishes the language of art from all translation into concepts rests on an excess of meaning” (PH 102).
    step1: |-
      由此产生一个重要后果：伽达默尔把艺术理解为表现（*darstellen*）而非再现（*vorstellen*）。在《语词与图像》（1992）一文中，他说自己力图“拆解‘图像只是摹本’这一观念”（GW 8, 374）。由于作品除自身之外不再现任何东西，它所承载的意义只能在其自我表现中显露出来。然而，涌现出来的意义从未被完整给出，也不会被任何一次实现所取消。这与艺术的 *eventual*（事件性）本性一致。“当一件艺术作品真正抓住我们时，它并不是一个立在我们对面、我们指望透过它看到某个预定概念意义的客体……作品是一个 *Ereigniss*——一个把我们‘据为己有’的事件。它猛推我们，击倒我们，建立起一个自己的世界，把我们拽进去”（Palmer 2001, 71）[^palmer-2001]。然而，所揭示的始终只是作品的一个侧面；这个侧面一出现，就把别的侧面逼入背景。在伽达默尔的美学中，显露与隐匿并非对立，而是相互依存：所显露者在显露之中带出未显露者的在场。“正是在艺术作品那纯粹的在此存在（*Da-sein*）中，我们的理解体验到其意义的深度与不可测度”（Palmer 2001, 72）[^palmer-2001]。作品的意义永远不能被完全实现，这一主张得到一种关于思辨的语言类比的支撑。艺术有一种语言，因为它的符号与象征起着语义单位的作用。伽达默尔谈到每个词中所含意义的活的潜在性，那是增殖的内在维度。因此，语言不是对一组预先给定意义的再现（*mimesis*），而是一个恒定意义储备的“进入语言”（Palmer 2001, 67）[^palmer-2001]。语言表达的有限性在于：没有任何言说能够完整。没有任何意义会一次性地呈交给我们（PH 103）。“构成语言的……只有这一点：一个词引出一个词，每个词可以说都被召唤而来，又在其一侧为言说的继续进行留出余地”（Palmer 2001, 67）[^palmer-2001]。没有一种意义能被完全揭示。由于我们可以反复重访作品，最初开显的意义可以扩展或改变。任何特定意义开显的部分性，*增强*而非削弱作品中意义的可能性。“艺术作品的存在，在于它以无限制的方式向越来越新的意义整合敞开”（PH 98）；而且，“使艺术的语言区别于一切概念翻译的不可穷尽性，建立在意义的盈余之上”（PH 102）。
