      The game analogy also serves to undermine approaches to art which are exclusively intentional, material, and conventional. First: the subjectivity of an artist cannot be an appropriate interpretive starting point. Grasping what transpires in a player’s consciousness does not reveal the nature of the game being played. Reconstructing the conscious life of an artist, *pace* Dilthey’s hermeneutics of *nacherleben* (re-living), may reveal interesting aspects of an artist’s intentions, but it does not uncover what informs that subjectivity. Second: as with the game, art is not to be understood by reference to its tools and equipment alone. Art, no doubt, requires materials and an appreciation of how a specific tool might be used. Yet neither game nor art is constituted by its equipment. Third: comprehending a game or an artwork requires an appreciation of the appropriate rules or conventions. What constitutes fair or foul play depends upon a set of pre-understood principles just as what is esteemed excellent in art requires normative expectancies of appraisal. Yet art’s vitality clearly does not reside merely in the following of conventions.
    step1: |-
      游戏的类比也有助于拆解那些纯以意向、材料与惯例来接近艺术的做法。第一：艺术家的主体性不能成为合适的解释起点。把握一个游戏者意识中发生的事，并不能揭示正在进行的游戏的本性。重构艺术家的意识生活——这是狄尔泰 *nacherleben*（再体验）诠释学的路数——也许能揭示艺术家意向的有趣侧面，却不能揭示是什么滋养了那种主体性。第二：与游戏一样，艺术不能仅凭其工具与装备来理解。艺术无疑需要材料，也需要懂得某种特定工具可以如何使用。然而游戏与艺术都不是由其装备构成的。第三：理解一个游戏或一件艺术作品，需要领会适当的规则或惯例。什么算公平竞赛、什么算犯规，取决于一组预先理解的原则；同样，艺术中什么被推许为卓越，也需要评价的规范性期待。然而艺术的活力显然不只在于遵循惯例。
