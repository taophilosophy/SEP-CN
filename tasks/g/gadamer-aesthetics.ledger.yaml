      康德美学与伽达默尔诠释学美学之间也许最重要的差别，是后者主张艺术传达真理。在《判断力批判》中，康德论证说审美观念逃避概念规定与语言把握。这些主张与伽达默尔的艺术观相呼应，因为他主张作品的意义不能被概念穷尽。换言之，作品总有意义的盈余。然而与康德不同，伽达默尔肯定：在我们的艺术经验中，我们面对的是有可能促进更深入的自我理解与世界理解的真理。简言之，伽达默尔维护的恰是康德所否认的东西：他主张艺术*并非与*真理和知识相隔绝，我们对作为事件的艺术的经验开显真理。正如丹尼尔·L. 泰特所观察到的，伽达默尔与康德分道扬镳之处在于，他坚持“艺术经验见证了一种*真理*，这种真理无法以确定知识的方式被穷尽呈现”（Tate 2009, 292）[^tate-2009]。伽达默尔与康德说明之间的另一个关键差别，是伽达默尔对观者*主动*角色的主题化。伽达默尔在 1980 年的论文《直观与生动性》（收入 RB、GW8）中强调观者的主动角色，该文可视为他对《真理与方法》中观看参与之反思的进一步发展。在《真理与方法》出版二十年后写成的《直观与生动性》中，伽达默尔把康德关于想象力之构形或生产性作用的洞见，改造为自己关于观者*创造性*与*主动性*参与作品进入在场的说明。例如，他主张当观者流连于作品时，其想象力把诸直观综合起来，一个有意义整体的呈现作为已构形的图像在其中涌现。这个已构形的图像虽被带入与知性的关系并激起思考，它本身以及整个构形过程都不由既定概念决定；毋宁说，如泰特所指出的，站立起来的已构形图像是由想象力*原初地*构造的（Tate 2009, 292）[^tate-2009]。已构形的图像使投入的观者建立联系、引出结论，而这些超出其当下经验。因此，艺术有能力向我们呈现未来尚未实现的可能性。伽达默尔对康德式想象力与审美观念的创造性改造，既突显了想象力在我们艺术经验方面的创造与构形能力，也（重要的是）突显了艺术真理的力量——“这些真理揭示我们存在的有限性以及我们对他人之需要。在艺术这一动态的、参与性的事件中，我们被邀请、甚至被激将去以别样方式想象自己、他人与我们当下的世界，也就是去想象（甚至希望）一个不同（且更好）的未来”（Nielsen 2023, 38）[^nielsen-2023]。
