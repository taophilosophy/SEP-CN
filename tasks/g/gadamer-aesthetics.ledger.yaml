      如果符号的正当功能是指向其指称物，那它就是自我取消的。一块路标若美得过分，以致分散了人们对它所指向之危险的注意，并促使司机停车观赏而另生危险，那它就没有正常发挥作用。然而象征并不指向自身之外的东西。它呈现自身的意义。物质的象征确实就是该意义变得在场的场所。然而象征所传达的意义从未被完整给出。它的意义是不确定的。把象征称为碎片性的，却又预期着整体的可能。这种推理的思辨维度，在于这样一个前提：每一被陈述的意义都带出多于实际所说出的东西。共鸣与深度，取决于激活陈述的诠释学 *Hintergrund*（背景），照亮未说出的意义或揭示被预期的意义。图像或词语的“思辨”能力，关乎它能否探出或暗示那支撑某一表达、却未在其中直接给出的未言明意义网络。图像或短语的思辨力量与崇高有某种共同之处：它在口头或视觉图像中照亮一层未言明意义的半影，这些意义的存在可被感觉到，却永远不能被完全把握或概念化。因此，艺术作品总能意味着更多，也就是说，暗示一个超越性的意义维度；这个维度虽永不被承载它的象征所穷尽，却并不离开支撑它的象征而存在。象征之所以回响着意义的暗示，是因为它不断唤起并非当下给出的东西。这一未被给出者并不离开被给出者而存在，而是内在于其中。因此，诠释学的崇高、意义的盈余、由象征而显现的“意味着更多”与“意味着不同的东西”的许诺，都被保持在内部，内在于被给出者之中。
