      Such arguments support Gadamer’s conception of the artwork as that which stands-in-itself. That which comes to stand is intelligible as the presentation of a certain meaning, but because of the indeterminacy of that meaning it retains something of the enigmatic. This eminent quality—a genuine work can never be measured against the original way it was shown (RB 146)—Gadamer also refers to as its hermeneutic identity. The truth of an artwork is not its simple manifestation of meaning but rather the unfathomableness and depth of its meaning (PH 226). Its truth embraces a tension between revelation (what appears) and what is concealed (what has yet to be shown). The artwork does not simply offer “a recognizable surface contour” but has an inner depth of self-sufficiency which Gadamer calls after Heidegger a “standing-in-itself.” In short, the mark of a substantial work is that it veils possibilities of meaning. Such resistance is a stimulus to further interpretation. Substantive works, like significant symbols, have an opaque aspect.
    step1: |-
      这些论证支持伽达默尔关于艺术作品是自身站立之物的构想。站立起来的东西，作为某一意义的呈现而是可理解的；但由于该意义的不确定性，它保留着某种谜一般的东西。这种卓越的品质——真正的作品永远不能以它最初被展示的原初方式来衡量（RB 146）——伽达默尔也称之为作品的诠释学同一性。作品的真理不是它对意义的简单显露，而是其意义的深不可测与深度（PH 226）。作品的真理包含揭示（所显现者）与被遮蔽者（尚待显示者）之间的张力。作品并不只提供“可辨认的表面轮廓”，而具有一种自足的内在深度；伽达默尔循海德格尔称之为“自身站立”。简言之，实质作品的标志在于它遮蔽意义的可能性。这种抵抗是进一步解释的刺激。实质作品与有意义的象征一样，都有一层不透明的方面。
