      Gadamer’s aesthetics is, in many respects, strictly anti-Kantian and yet is influenced by Kant’s insights. Regarding its anti-Kantian aspects, it abjures phenomenalist disinterestedness for the sake of phenomenological involvement. It is also anti-idealist. It refuses the idea that in aesthetic experience we perceive “a pure integration of meaning.” His aesthetics is consequently anti-representationalist. There is in the artwork something which Gadamer describes as its resistance to integration, to being reduced to a concept (Palmer 2001, 25)[^palmer-2001]. He contends that Hegel’s definition of the beautiful as the “sensuous appearing of the Idea” presumes that aesthetic experience is able to reach beyond the specific type of appearance to its underlying idea. In this model, aesthetic experience becomes the expectation of a semantic fulfilment. Once the idea behind the appearance is grasped, “the whole of its meaning would have been understood once and for all and thus ‘brought in to our possession so to speak’” (Palmer 2001, 71)[^palmer-2001]. The work of art becomes a carrier of meaning to be abandoned once the lead story has been grasped. But, Gadamer argues, “our understanding of artworks is manifestly not of this type. Everyone knows this from his or her own encounters with art, from concerts, visits to museums, and from his or her reading” (Palmer 2001, 71)[^palmer-2001]. This denial of idealist aesthetics is at the basis of his claim that an artwork is essentially enigmatic.
    step1: |-
      伽达默尔的美学在许多方面严格反康德，却又受康德洞见的影响。就其反康德的方面而言，它放弃现象主义的无利害性，以换取现象学的投入。它也反观念论。它拒绝这样的想法：在审美经验中我们知觉到“意义的纯粹整合”。因此他的美学是反再现论的。艺术作品中存在着伽达默尔所称的对整合、对被化约为概念的抵抗（Palmer 2001, 25）[^palmer-2001]。他主张，黑格尔把美定义为“理念的感性显现”，这预设审美经验能够越过特定类型的显现而达到其背后的理念。在这一模型中，审美经验成了对语义满足的期待。一旦把握了显现背后的理念，“其意义的整体就一劳永逸地被理解了，可以说‘被带入我们的占有之中’”（Palmer 2001, 71）[^palmer-2001]。艺术作品于是成了意义的载体，一旦抓住了主要故事，就可以弃之不顾。但伽达默尔论证说，“我们对艺术作品的理解显然不是这种类型。每个人从自己与艺术的相遇中，从音乐会、参观博物馆和自己的阅读中，都知道这一点”（Palmer 2001, 71）[^palmer-2001]。对观念论美学的这一否认，正是他主张艺术作品本质上是谜一般的基础。
