      Of all things that speak to us, it is the artwork that does so most directly (PH 95). The phenomenological immediacy of art which initiates Gadamer’s hermeneutic inquiry into aesthetic experience may not seem a promising starting point from a hermeneutic perspective. It declares an unconventional hermeneutical approach to art: “if we define the task of hermeneutics as the bridging of personal or historical distance between minds, then the experience of art would seem to fall entirely outside its [hermeneutics’] provenance” (PH 95/97). However, Gadamer does not define hermeneutics this way. It is not the reconstruction of artistic intention which forms the object of his inquiry but the question of what informs the immediacy of an artwork’s claim. The artwork is an object of hermeneutical investigation not because of any provenance in psychological events but because of the fact that it *says* something to us (PH 98). Hermeneutic involvement is required because the meaning transmitted can never be fully complete and unambiguous. It demands interpretive involvement. Hermeneutics is required wherever there is a restricted transposition of thought. The historical finitude of meaning and the fact that no meaning can be given completely necessitates hermeneutical involvement in our experience of an artwork. The task of interpretation is to probe the possible meanings held within the experience of a work, and by drawing on them, to bring that experience to greater completeness.
    step1: |-
      在一切向我们言说的事物中，最直接地向我们言说的是艺术作品（PH 95）。艺术的现象学直接性启动了伽达默尔对审美经验的诠释学探究，而从诠释学的立场看，这一起点未必显得有希望。它宣告了一种非传统的诠释学进路：“如果我们把诠释学的任务界定为沟通心灵之间个人的或历史的距离，那么艺术经验似乎完全落在它［诠释学］的领域之外”（PH 95/97）。然而，伽达默尔并不这样界定诠释学。构成他探究对象的，不是对艺术意向的重构，而是什么滋养着艺术作品主张的直接性这一问题。艺术作品成为诠释学探究的对象，不是因为它在心理事件中有任何来源，而是因为它*向我们言说*某事（PH 98）。之所以需要诠释学的投入，是因为所传达的意义永远不能完全而毫无歧义。它要求解释性的投入。凡有思想的受限移置之处，就需要诠释学。意义的历史有限性以及没有任何意义能被完整给出这一事实，使我们对艺术作品的经验必然包含诠释学的投入。解释的任务是探究一部作品的经验中所含的可能意义，并借取这些意义，使该经验达到更大的完满。
