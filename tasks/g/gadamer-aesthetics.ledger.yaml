      应当注意，伽达默尔关于把异己者整合进被理解为有意义者的说法，不应理解为在同一者之内的归摄。同化并不等于把异己者翻译成一组固定不变的意义——不会因为这种归摄而改变。整合意味着一种*相互性*：被整合者改变其性格，整合发生于其中的整体也改变其性格。此外，在主观意识中作为同时性被给出的东西，具有超越该意识最初所把握者的意义维度。伽达默尔要探究审美经验的存在论维度。关于艺术的同时性经验使我们卷入多于当下所意识到的东西（即作为基础并持续进行的超个体语言与文化实践的“实体”）这一论题，得到三个类比论证的支持：关于游戏、节庆与象征之性格的论证。
