    source: |-
      Hans-Georg Gadamer (1900–2002) does not provide an account of the aesthetic in any customary sense. His approach to art runs, in many ways, against conventional philosophical expectations. Aesthetic qualities are not debated in the manner of the analytic tradition of modern philosophy, nor does he concern himself overtly with the problems of aesthetic pleasure. Gadamer’s approach to aesthetic experience stands squarely in the phenomenological tradition. He is primarily concerned with the place of art in our experience of the world. Furthermore, his approach to aesthetic theory is one of those rare intellectual achievements which is simultaneously deconstructive and constructive. He dismantles elements of the grand tradition of Platonic, Kantian, and Hegelian aesthetics and yet offers a hermeneutical and phenomenological reconstruction of many of the central insights of that tradition to demonstrate its continuing relevance to our contemporary experience of art. Gadamer is primarily concerned with the cognitive dimension of such experience, with what artworks address and what they put at issue. This makes for a flexible philosophical approach capable of ranging freely over a number of art forms and styles, discussing both the singularity of works and their broader significance. The approach is clearly hermeneutical in that it endeavors to reacquaint us with those received meanings and preoccupations which underlie our experience of art. Openly influenced by Martin Heidegger, the later essays on language and poetry in particular, Gadamer’s aesthetics is far from traditional. His key claims are:
    step1: |-
      汉斯-格奥尔格·伽达默尔（1900–2002）并未提供任何通常意义上的审美理论。他接近艺术的方式，在许多方面违背了常规的哲学期待。审美性质不是以现代哲学分析传统的方式被讨论的，他也不公开关心审美愉悦的问题。伽达默尔接近审美经验的方式，稳稳地立足现象学传统。他主要关心艺术在我们的世界经验中的位置。此外，他的审美理论进路属于那种罕见的智识成就：同时是解构性的与建构性的。他拆解柏拉图、康德与黑格尔美学伟大传统的要素，却又对该传统的许多核心洞见给出诠释学与现象学的重构，以表明它们与我们当代的艺术经验持续相关。伽达默尔主要关心此种经验的认知维度，关心艺术作品言说了什么、把什么置于疑问之中。这使他的哲学进路具有弹性，能够自由地跨越多种艺术形式与风格，既讨论作品的独异性，也讨论其更宽广的意义。这一进路显然是诠释学的，因为它努力让我们重新熟悉那些支撑我们艺术经验的既有意义与关切。伽达默尔公开受益于马丁·海德格尔，尤其是后期论语言与诗的论文，他的美学绝非传统的。其核心主张如下：
    step2: |-
      汉斯-格奥尔格·伽达默尔（1900–2002）并没有给出通常意义上的审美理论。他接近艺术的路数，在许多方面与常规的哲学期待相左。审美性质不是按现代分析哲学的方式被讨论的，他对审美愉悦问题也不曾明言关切。伽达默尔接近审美经验的方式，稳稳站在现象学传统之内。他主要在意的是艺术在我们的世界经验中占什么位置。而且，他的审美理论属于那种少见的智识成就：解构与建构兼而有之。他拆解柏拉图、康德与黑格尔美学这一伟大传统的若干要素，却又以诠释学与现象学的方式重构其中的许多核心洞见，以显明它们与我们当下的艺术经验依然相干。伽达默尔主要关注这类经验的认知维度：艺术作品言说了什么，又把什么置于疑问。正因如此，他的进路灵活，能自由跨越多种艺术形式与风格，既谈作品的独异性，也谈其更宽的意义。这一进路显然是诠释学的：它力图让我们重新熟悉那些支撑我们艺术经验的既有意义与关切。伽达默尔公开受惠于马丁·海德格尔，尤其是后期论语言与诗的文章；他的美学绝不是传统的。其核心主张如下：
  - id: 2
