      What binds us to a tradition, according to Gadamer, is not a misplaced conservatism but the questions a canon or body of work asks of us. However, the question of tradition is one of the most controversial within Gadamer’s philosophy. It arises because of the way Gadamer establishes individual and collective learning on the acquisition of accrued experiences (*Bildung*) and practices, rather than upon any methodological norm. His argument exposes the Enlightenment prejudice against prejudice. The liberating and universalizing aspects of reason tend to marginalize and chastise both the culturally different and the historically particular as divisive and irrational. Gadamer contends, however, that such an unqualified hypostasization of reason and its methods has the unfortunate consequence of condemning as methodologically groundless the very valuations that ordinary linguistic and experiential practices are based on. Gadamer is not unsympathetic to Nietzsche, who rejects the claim that humanity is shaped by external necessity. Our existence within the world and our place within it is, metaphysically speaking, utterly contingent. If there is no metaphysical necessity that governs human practices, why should we even ask for a methodological grounding, when language has neither required nor functioned with such a license? Like Wilhelm Dilthey before him, Gadamer insists that nothing justifies and gives meaning to life other than life itself. This is not the invocation of nihilism, for life does not occur in a vacuum. Creatures such as humans, which have no pre-determined essence, only survive by both remembering what has worked well within a practice and by constantly testing it against contemporary needs and circumstances. There is a constant tension between acquired experience and the need to stabilize its lessons and the need to question and thereby destabilize the tried and the tested. All expressive practices depend upon an inheritance of insight and valuation. They are dependent upon accrued learning and experience. Such observations agitate Gadamer’s critics, who see in the unreflective acceptance of the given an irresponsibly conservative privileging of the received, and a wilful blindness to possible repressive or exclusionary practices within inherited modes of operation. In response to such scepticism, it must be acknowledged that inherited practices can, logically speaking, have negative entailments. However, a commitment to tradition, is neither a commitment to remaining the same, nor is it indicative of a willful refusal to confront the negative entailments within what is transmitted historically. Traditions which are incapable of changing risk becoming outmoded. Traditions are not founded upon core and fixed identities. As vibrant religious and artistic traditions demonstrate, those which are in constant debate over aim and direction often prove engaging and influential. Traditions capable of subjecting their self-understanding to critique constitute continuities of conflict. The importance of received understanding for Gadamer is not its historical provenance but how it opens us towards and engages us with issues in a community of debate. The Cartesian project of subjecting all beliefs to sceptical examination until they can be methodologically affirmed is, in Gadamer’s view, nihilistic. The project is implausible since the range and depth of pre-understanding is so extensive as to be untheorisable. To condemn pre-understanding as unjustifiable because it cannot be methodologically grounded is highly dangerous as it devalues those very insights upon which our initial world-orientation depends. It is not that these insights are instrinsically valuable but that they are essential staging posts in the journeys of understanding they enable. It is the continuous debate and dialogue over practice that enables participants to move on, widen, and transform acquired experience. Movement and development is intrinsic to the German word for tradition: *Überlieferung* has the active connotation of both transmitting and handing something on. What a tradition transmits from age to age are questions, problems, and issues. The importance of canonic works is not that they are peerless exemplars of an idiom or style but rather that they raise issues and difficulties in an exemplary way. Traditions can check their self-understanding against their own historical projections. A commitment to tradition is not a commitment to an academic antiquarianism. It is, essentially, a commitment to a field of debate. Tradition is presented as a resource and a provocation for thinking and creativity: whereas sameness is the currency of a conservative conception of tradition, instability, questions, and the challenge of otherness are the drivers of Gadamer’s more dialogical concept of tradition.
