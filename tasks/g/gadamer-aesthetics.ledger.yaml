      在一切向我们言说者中，最直接地言说的是艺术作品（PH 95）。艺术的现象学直接性启动了伽达默尔对审美经验的诠释学探究，可这个起点从诠释学立场看未必有希望。它宣告的是一种非传统的诠释学进路：“若把诠释学的任务界定为沟通心灵之间个人的或历史的距离，那么艺术经验似乎整个落在它［诠释学］的领域之外”（PH 95/97）。但伽达默尔并不这样界定诠释学。他要探究的不是艺术意向的重构，而是什么滋养了艺术作品主张的那种直接性。作品成为诠释学探究的对象，并不因为它在心理事件中有何来源，而因为它*向我们言说*某事（PH 98）。所以需要诠释学的投入：所传达的意义永远不会完全、也不会毫无歧义。它要求解释性的参与。凡是思想发生受限移置之处，都需要诠释学。意义有历史的有限性，且没有一种意义能被完整给出，这就使我们对作品的经验非有诠释学的投入不可。解释的任务，是探明一部作品的经验中蕴含的各种可能意义，并借这些意义把该经验推向更大的完满。
