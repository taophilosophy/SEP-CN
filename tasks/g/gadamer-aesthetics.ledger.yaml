    source: |-
      Gadamer’s aesthetics fosters an attentiveness towards the mystery of the given and its unexpected folds of meaningfulness. Gadamer’s arguments are varied, ushering the reader towards an aesthetic attentiveness rather than making iconoclastic declarations about what the aesthetic is. They embrace close readings of the poets Rilke and Celan as well as broad strategic manoeuvres which defend the cognitive status of aesthetic and hermeneutical judgements. Hermeneutics (the art and discipline of interpretation), of which Gadamer is one of the twentieth century’s most formidable exponents, is deeply involved in philosophical disputes over the legitimacy of claims to understanding in the visual and literary arts. It does not oppose “scientific” modes of knowledge but resists their cultural privileging. For Gadamer aesthetics stands on experientially accumulative modes of learning (*Bildung*) which orientate and ground sound judgement in the arts. Conversation and its unpredictable turns is, appropriately, a central thread within hermeneutical aesthetics. A late exchange between Carsten Dutt and Gadamer (Dutt 1993, 61–67)[^dutt-1993] offers a gentle point of entry into how philosophical hermeneutics approaches art and aesthetic experience.
    step1: |-
      伽达默尔的美学培养一种注意，朝向既与之物的神秘及其意义出乎意料的褶皱。伽达默尔的论证多种多样，把读者引向审美的注意，而不是对审美究竟是什么作出破除偶像式的宣告。这些论证既包括对诗人里尔克与策兰的细读，也包括为审美判断与诠释学判断的认知地位辩护的宏观策略。诠释学（解释的技艺与学科）深深卷入关于视觉艺术与文学艺术中理解之主张是否正当的哲学争论，而伽达默尔是二十世纪这一学科最强有力的代表人物之一。它不反对“科学的”认识方式，但抗拒给予它们的文化特权。在伽达默尔看来，美学立足于经验积累式的学习（*Bildung*，教化），这种学习为艺术中的健全判断定向并奠定基础。会话及其不可预测的转折，恰如其分地构成诠释学美学的一条中心线索。卡斯滕·杜特与伽达默尔晚近的一次对谈（Dutt 1993, 61–67）[^dutt-1993]，为哲学诠释学如何接近艺术与审美经验提供了一个温和的入口。
    step2: |-
      伽达默尔的美学教人留意既与之物的神秘，留意意义出人意表的褶皱。他的论证路数不一，用意不在对“审美是什么”作破除偶像的宣告，而在把读者引向审美的留意。这些论证中，既有对诗人里尔克与策兰的细读，也有为审美判断与诠释学判断的认知地位作辩护的宏观布局。诠释学这门解释的技艺与学科，深深卷入视觉与文学艺术中理解之主张是否正当的哲学争论；伽达默尔则是二十世纪诠释学最强有力的代表之一。诠释学并不反对“科学的”认识方式，只是不肯给它文化上的特权。在伽达默尔看来，美学立足于经验积累式的学习（*Bildung*，教化），正是这种学习为艺术中的健全判断定向、奠基。会话及其不可预料的转折，理所当然地成为诠释学美学的一条主线。卡斯滕·杜特与伽达默尔晚近的一次对谈（Dutt 1993, 61–67）[^dutt-1993]，正好提供一个平易的入口，让人看到哲学诠释学如何接近艺术与审美经验。
