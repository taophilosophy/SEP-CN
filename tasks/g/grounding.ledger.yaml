      The *unity argument* says that grounding is a justified posit because of its unifying role (Audi 2012a; Rosen 2010; Schaffer 2009)[^audi-2012a][^rosen-2010][^schaffer-2009]. On one way of casting the argument, it has three premises. First, there is substantial unity among the metaphysical relations (relations familiar from metaphysics such as functional realization and set formation that resist analysis in purely modal terms). Second, where there is substantial unity, plausibly there is a unifier, something that explains why the relations in question resemble one another in the manner they do. Third, if there is a unifier for the metaphysical relations, the best candidate is grounding.
    step1: |-
      *统一论证*说，奠基因其统一作用而是一个有理由的设定（Audi 2012a; Rosen 2010; Schaffer 2009）[^audi-2012a][^rosen-2010][^schaffer-2009]。按一种表述，该论证有三个前提。第一，诸形而上学关系之间存在实质的统一性（这些关系是形而上学中熟悉的，如功能实现与集合形成，它们抗拒纯模态术语的分析）。第二，凡有实质统一性之处，多半有一个统一者，即说明那些关系为何以其实际方式彼此相似的东西。第三，如果诸形而上学关系有一个统一者，最佳候选就是奠基。
    step2: |-
      *统一论证*主张：奠基因其统一的角色而是有理由的设定（Audi 2012a; Rosen 2010; Schaffer 2009）[^audi-2012a][^rosen-2010][^schaffer-2009]。一种铺陈方式下设三个前提：其一，形而上学诸关系之间存在实质性统一——这些关系是形而上学里的熟面孔，如功能实现、集合形成，它们无法用纯模态词汇来分析；其二，凡有实质统一之处，多半有一个统一者，即说明所论诸关系为何以那种方式彼此相似的东西；其三，若形而上学诸关系确有统一者，最佳候选者就是奠基。
