      Before proceeding, we should note that some formulate grounding claims in such a way that all manner of things potentially ground one another, not just facts (Cameron 2008; Schaffer 2009; Wilhelm 2020)[^cameron-2008][^schaffer-2009][^wilhelm-2020]. The theses of separatism and unionism are relevant here (see §1.1). Given unionism (grounding is explanation_{*G*}), the restriction to facts seems quite reasonable. While it makes sense to say, for example, that [The truck exists] explains something, it’s unclear what it might mean to say that the truck itself does so (Raven 2015; Trogdon 2013a)[^raven-2015][^trogdon-2013a]. But, given separatism (grounding is determination_{*G*}), the alternative view is a genuine option. We can coherently maintain that the truck determines its particular redness (a mode), and this, in turn, backs an explanation of the existence of the mode in terms of the existence of the truck.
    step1: |-
      在往下走之前应当注意，有些人表述奠基主张的方式，使得各式各样的东西都可能互相奠基，而不只是事实（Cameron 2008; Schaffer 2009; Wilhelm 2020）[^cameron-2008][^schaffer-2009][^wilhelm-2020]。分离论与联合论两种论点在此相关（见 §1.1）。给定联合论（奠基即说明_{*G*}），限定于事实似乎相当合理。例如，说 [The truck exists] 说明了某事，这讲得通；可要说卡车本身说明了某事，就不清楚是什么意思（Raven 2015; Trogdon 2013a）[^raven-2015][^trogdon-2013a]。但给定分离论（奠基即决定_{*G*}），另一种看法就是真正的选项。我们可以融贯地主张，卡车决定了它特定的红色（一种样态），而这又支撑了以卡车的存在来解释该样态之存在的说明。
    step2: |-
      往下走之前应当注意：有人表述奠基主张时，让各式各样的东西都可能互相奠基，不只事实（Cameron 2008; Schaffer 2009; Wilhelm 2020）[^cameron-2008][^schaffer-2009][^wilhelm-2020]。分离论与联合论在这里有份（见 §1.1）。若取联合论（奠基即说明_{*G*}），把范围限定在事实就相当合理：说 [The truck exists] 说明了某事，讲得通；要说卡车本身说明了什么，就不清楚指什么（Raven 2015; Trogdon 2013a）[^raven-2015][^trogdon-2013a]。可若取分离论（奠基即决定_{*G*}），另一种看法就是真选项了。我们可以融贯地主张：卡车决定了它特定的红色（一个样态），而这又支撑起一层说明，用卡车的存在来说明该样态的存在。
