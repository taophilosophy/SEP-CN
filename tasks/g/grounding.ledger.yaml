      As for the explanation argument, Kovacs (2017) objects to both the separatist and unionist versions set out above. For example, Kovacs argues that, with respect to the former version of the argument, worldly relations such as necessitation taken together with facts about their relata, rather than determination_{*G*}, back ontic explanations. Relatedly, Miller and Norton (2017) propose an explanation of why you might judge, say, that {Beijing} exists because Beijing exists that doesn’t appeal to grounding. And Norton and Miller (2019) propose an account of the truth conditions for statements of such explanations that doesn’t appeal to grounding.
