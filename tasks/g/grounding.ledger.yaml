      With respect to the unity argument, Koslicki (2015) and J. Wilson (2016a) challenge the second premise, arguing that, even if the metaphysical relations (or some sub-collection thereof) are substantially unified, this on its own wouldn’t give us a good reason to posit a generic relation of grounding as a unifier. J. Wilson (2014) challenges the first premise as well, arguing that there is a class of metaphysical relations, what she calls the *small-g* grounding relations, that are neither terminologically, formally, nor metaphysically unified. Relatedly, Turner (2016) describes various differences in the way certain kinds of grounding claims behave, ultimately distinguishing between two forms of grounding, *dependence-grounding* and *realization-grounding.* (For non-skeptical rejoinders to these challenges, see Raven 2017, and Schaffer 2016b.)[^raven-2017][^schaffer-2016b]
    step1: |-
      关于统一论证，Koslicki（2015）与 J. Wilson（2016a）挑战第二个前提，论证说，即便形而上学关系（或其某个子集）实质上统一，仅凭这一点也不足以给我们好理由去设定一个作为统一者的奠基这类一般关系。J. Wilson（2014）还挑战第一个前提，论证存在一类形而上学关系，她所谓*小写 g* 的奠基关系，在术语上、形式上、形而上学上都不统一。相关地，Turner（2016）描述了某些种类的奠基主张在行为方式上的种种差异，最终区分了两种奠基形式：*依赖奠基*（dependence-grounding）与*实现奠基*（realization-grounding）。（对这些挑战的非怀疑论回应，见 Raven 2017 与 Schaffer 2016b。）[^raven-2017][^schaffer-2016b]
