      Some claim that grounding is a strict order—it’s transitive, irreflexive, and asymmetric (Correia 2010; Fine 2012a; Raven 2013)[^correia-2010][^fine-2012a][^raven-2013]. One way to argue that grounding has some or all of these features is to embrace separatism (grounding is determination_{*G*}) and argue that determination_{*G*} or determination in general has some or all of them (Audi 2012a)[^audi-2012a]. Another option is to embrace unionism (grounding is explanation_{*G*}), focusing on the features of explanation_{*G*} or explanation in general (Raven 2015)[^raven-2015]. Another way, still, is to argue that, given either separatism or unionism, grounding plays the theoretical roles normally assigned to it only if it has some or all of these features (Kovacs 2018)[^kovacs-2018]. These strategies can be used to argue that grounding has further properties as well. For example, Litland (2013) and Raven (2015) claim that explanation in general is non-monotonic, so, given unionism, grounding is as well; and Audi (2012a) claims that determination in general is non-monotonic, so, given separatism, grounding is as well.
    step1: |-
      有人主张奠基是一种严格序——它是传递的、非自反的、非对称的（Correia 2010; Fine 2012a; Raven 2013）[^correia-2010][^fine-2012a][^raven-2013]。论证奠基具有其中某些或全部特征的一种办法，是接受分离论（奠基是决定_{*G*}），进而论证决定_{*G*}或一般而言的决定具有其中某些或全部特征（Audi 2012a）[^audi-2012a]。另一种办法是接受联合论（奠基是说明_{*G*}），着眼于说明_{*G*}或一般而言的说明的特征（Raven 2015）[^raven-2015]。还有一种办法是论证：无论接受分离论还是联合论，奠基唯有具备其中某些或全部特征，才能扮演通常分配给它的那些理论角色（Kovacs 2018）[^kovacs-2018]。这些策略也可用来论证奠基具有进一步的性质。例如，Litland（2013）与 Raven（2015）主张一般而言的说明是非单调的，因此给定联合论，奠基亦然；Audi（2012a）主张一般而言的决定是非单调的，因此给定分离论，奠基亦然。
    step2: |-
      有人主张奠基是一种严格序——即它传递、非自反且非对称（Correia 2010; Fine 2012a; Raven 2013）[^correia-2010][^fine-2012a][^raven-2013]。要论证奠基具备其中某些或全部特征，一条路是接受分离论（奠基即决定_{*G*}），再论证决定_{*G*}乃至一般决定本身具备这些特征（Audi 2012a）[^audi-2012a]；另一条路是接受联合论（奠基即说明_{*G*}），转而考察说明_{*G*}乃至一般说明本身的特征（Raven 2015）[^raven-2015]；还有一条路是论证：无论持分离论还是联合论，奠基若不具备其中某些或全部特征，便承担不起通常归于它的那些理论角色（Kovacs 2018）[^kovacs-2018]。这些策略同样可以论证奠基还有别的性质。例如，Litland（2013）和 Raven（2015）主张一般说明非单调，故给定联合论，奠基也非单调；Audi（2012a）主张一般决定非单调，故给定分离论，奠基也非单调。
