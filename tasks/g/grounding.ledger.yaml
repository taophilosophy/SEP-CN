      According to the standard definition of partial grounding, $[P],$ $[P'],$ … partially grounds $[Q]$ just in case $[P],$ $[P'],$ … either on its own or together with other facts fully grounds $[Q]$ (Audi 2012a; Litland 2015; Loss 2017; Raven 2013; Rosen 2010; Skiles 2015)[^audi-2012a][^litland-2015][^loss-2017][^raven-2013][^rosen-2010][^skiles-2015]. You might initially view this definition as being a purely stipulative matter. But it’s actually substantive in nature, as we have a pre-theoretic grip on both partial and full grounding. In fact, Leuenberger (2020) and Trogdon & Witmer (2021) argue that the standard definition is false, proposing cases in which mere partial grounds can’t be supplemented with further facts to yield full grounds. The latter recommend reversing the direction of the standard definition, proposing a definition of full grounding in terms of partial grounding together with other notions.
    step1: |-
      按照部分奠基的标准定义，$[P],$ $[P'],$ … 部分地奠基 $[Q]$ 当且仅当 $[P],$ $[P'],$ … 单独或与其他事实一起完全地奠基 $[Q]$（Audi 2012a; Litland 2015; Loss 2017; Raven 2013; Rosen 2010; Skiles 2015）[^audi-2012a][^litland-2015][^loss-2017][^raven-2013][^rosen-2010][^skiles-2015]。起初你也许认为这个定义纯属规定。但它其实是实质性的，因为我们对部分奠基与完全奠基都有前理论的把握。事实上，Leuenberger（2020）与 Trogdon & Witmer（2021）论证说标准定义是假的，并提出一些情形：在其中，仅属部分奠基者无法补上更多事实以得出完全奠基者。后者建议把标准定义的方向颠倒过来，用部分奠基加上其他概念来定义完全奠基。
    step2: |-
      按部分奠基的标准定义：$[P],$ $[P'],$ … 部分地奠基 $[Q]$，当且仅当 $[P],$ $[P'],$ … 单独或同其他事实一道完全地奠基 $[Q]$（Audi 2012a; Litland 2015; Loss 2017; Raven 2013; Rosen 2010; Skiles 2015）[^audi-2012a][^litland-2015][^loss-2017][^raven-2013][^rosen-2010][^skiles-2015]。乍看这定义像是纯然约定的。其实它是实质性的，因为我们对部分奠基与完全奠基都有前理论的把握。Leuenberger（2020）与 Trogdon & Witmer（2021）就说标准定义是假的，并举出一些情形：其中仅仅部分奠基者无论怎样补事实，都补不出完全奠基者。后两位建议把标准定义的方向倒过来，用部分奠基加别的概念去定义完全奠基。
