      Others claim that grounding is well-founded in the sense that any grounded fact is ultimately grounded by ungrounded facts (Dixon 2016; Rabin & Rabern 2016)[^dixon-2016][^rabin-2016]. Note that this conception of the well-foundedness of grounding, in contrast to the one above, allows for infinitely descending grounding chains. How so? Following Bliss (2013) and Rabin and Rabern (2016), consider Euclidean space, which is comprised of points and regions that include those points. Suppose that regions are gunky in that every region has a region as a proper part. And suppose that the existence facts concerning regions are grounded by the existence facts concerning their sub-regions, the existence facts concerning sub-regions are grounded by the existence facts concerning their sub-sub-regions, and so on, *ad infinitum*. Hence, the fact that region *R* exists is a member of an infinitely descending grounding chain. But suppose that the existence facts concerning regions are also grounded by the existence facts concerning points. Suppose, moreover, that the existence facts concerning points lack grounds. Hence, while the fact that *R* exists is a member of an infinitely descending grounding chain, this fact nonetheless is grounded in facts that themselves lack grounds. The same applies to all the other facts that are links in the grounding chain in question.
    step1: |-
      另有人主张奠基良基是指任何被奠基的事实最终由不被奠基的事实奠基（Dixon 2016; Rabin & Rabern 2016）[^dixon-2016][^rabin-2016]。注意，与上面那种理解不同，这种奠基良基观允许无穷下降的奠基链条。何以如此？循 Bliss（2013）与 Rabin 和 Rabern（2016），考虑欧几里得空间，它由点与包含这些点的区域构成。设区域是黏糊的（gunky），即每个区域都有一个区域作为真部分。又设关于区域的存在事实由关于其子区域的存在事实奠基，关于子区域的存在事实由关于其子子区域的存在事实奠基，如此*以至无穷*。于是，区域 *R* 存在这一事实便是一条无穷下降奠基链中的一员。但再设关于区域的存在事实也由关于点的存在事实奠基；进而设关于点的存在事实没有奠基者。于是，虽然 *R* 存在这一事实属于一条无穷下降的奠基链，这个事实仍由自身没有奠基者的事实奠基。这条奠基链中其余作为环节的所有其他事实，情况亦然。
    step2: |-
      另一种主张是：奠基良基，意谓任何被奠基的事实最终都由不被奠基的事实奠基（Dixon 2016; Rabin & Rabern 2016）[^dixon-2016][^rabin-2016]。注意：与上一种理解不同，这种良基观容许无穷下降的奠基链。何以容许？跟随 Bliss（2013）与 Rabin、Rabern（2016），考虑欧几里得空间——它由点与包含这些点的区域组成。设区域是黏糊的（gunky）：每个区域都以某个区域为真部分。再设区域的存在事实由其子区域的存在事实奠基，子区域的存在事实由子子区域的存在事实奠基，如此*以至无穷*。于是“区域 *R* 存在”这个事实就成了某条无穷下降奠基链上的一环。但又设区域的存在事实同样由点的存在事实奠基，并且点的存在事实没有奠基者。这样一来，尽管“*R* 存在”属于无穷下降的奠基链，这个事实仍然奠基于自身没有奠基者的事实。所论奠基链上其余作为环节的事实，无不如此。
