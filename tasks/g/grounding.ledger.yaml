      ### 4.1 Necessity
    step1: |-

    step2: |-

  - id: 117
    kind: body
    source: |-
      How do grounding and necessity interact? Let $[P],$ $[P'],$ … (metaphysically) necessitate $[Q]$ just in case any (metaphysically) possible world in which the former obtains is a world in which the latter obtains. The broad consensus is that necessity isn’t sufficient for grounding—it’s not the case that if $[P],$ $[P'],$ … necessitate $[Q]$, then the former ground the latter. (B. McDaniel 2019, however, argues that a restricted form of necessitation is sufficient—as well as necessary—for grounding.)[^mcdaniel-2019][^mcdaniel-2019-2] Consider a necessary fact such as [$2+3=5$]. While this fact might have grounds, facts about, say, German Expressivist art aren’t among them; yet the latter necessitate the former. Also, there are cases in which the direction of necessitation and grounding come apart. Plausibly, [{Beijing} exists] necessitates [Beijing exists], yet presumably the later grounds the former rather than the other way around.
    step1: |-

    step2: |-

  - id: 118
    kind: body
    source: |-
      There are, however, two other issues about the relationship between grounding and necessity that are less of a settled matter. The first is whether it’s necessary that (full) grounds necessitate what they ground—according to *necessitarianism*, necessitation is necessary for grounding. The second is whether grounding is an internal relation in the following sense: it’s necessary that if $[P],$ $[P'],$ … (fully) grounds $[Q]$, then any metaphysically possible world in which $[P],$ $[P'],$ … and $[Q]$ obtain is a world in which the former (fully) grounds the latter. According to *internalism*, grounding is internal in this sense. Internalism entails necessarianism but not vice versa. Due to limitations of space, we focus on necessitarianism in what follows. (See Bennett 2011, Litland 2015, Carnino 2017, and Lovett 2019 for discussion of internalism.)[^bennett-2011][^carnino-2017][^litland-2015][^lovett-2019]
    step1: |-

    step2: |-

  - id: 119
    kind: body
    source: |-
      Following Skiles 2020, there are at least three ways to go about motivating necessitarianism. One appeals to essences: every instance of grounding is mediated by essential truths that characterize the grounds and what they ground or entities these facts concern (see §4.2); these essential truths are themselves necessary; and grounds together with these essential truths suffice for what they ground (Audi 2012a; O’Conaill 2017; Trogdon 2013b)[^audi-2012a][^trogdon-2013b]. Another appeals to explanation: it’s necessary that grounds explain what they ground in a distinctive way; and, for any explanation of this type, its explanans suffices for its explanandum (deRosset 2010)[^rosset-2010]. And another appeals to laws: every instance of grounding is subsumed by a metaphysical law; the metaphysical laws are themselves necessary; and grounds together with the relevant metaphysical laws suffice for what they ground (Wilsch 2015)[^wilsch-2015].
    step1: |-

    step2: |-

