      Roughly speaking, *monists* claim that there is ultimately just one core type of grounding, while *pluralists* claim that there are different types and no core type. It’s important to note that being a pluralist about grounding doesn’t necessarily make you a grounding skeptic, at least given how we understand the usage of the terms. It’s true that some pluralists, as we’ve just seen, are skeptics. But not all of them are. For example, Fine (2012a), a proponent of grounding if anyone is, stresses the differences between various forms of grounding, rejecting the idea that they are unified in a way that might motivate positing a genetic form of grounding. Just what might make it fitting to call one pluralist view a version of skepticism about grounding and another pluralist view non-skeptical instead is perhaps worth further thought. (For further discussion of monism and pluralism about grounding, see Berker 2018, Cohen 2020, Griffith 2014, Litland 2018b, Rettler 2017, and Richardson 2020 and 2021.)[^berker-2018][^cohen-2020][^griffith-2014][^litland-2018b][^rettler-2017][^richardson-2020][^richardson-2021]
