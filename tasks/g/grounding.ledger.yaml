      Moreover, some treat grounding as a quaternary rather than binary relation. One such view is that the grounding relation includes two slots for facts and two slots for modes of presentation of those facts (Jenkins 2011)[^jenkins-2011]. Another such view is that grounding is contrastive in nature, so it includes two slots for facts and two slots for contrasts of those facts (Schaffer 2012)[^schaffer-2012]. Consider, again, the claim that [The truckers are picketing] grounds [The truckers are striking]. Depending on the context, we might read the claim as follows: [The truckers are picketing] rather than [They’re working as normal] grounds [The truckers are striking] rather than [It’s not the case that they’re striking]. Schaffer argues that his version of the quaternary view is preferable to the binary view insofar as we can reasonably maintain that grounding is transitive given the former but not the latter (see §2.3 for further discussion of transitivity). Schaffer also suggests that the contrastive treatment of grounding is plausible insofar as it casts grounding in an apt form to back explanation, which is itself contrastive in nature.
    step1: |-
      再者，有些人把奠基当作四项关系而非二项关系。一种这样的看法是，奠基关系包含两个位置给事实，另两个位置给这些事实的呈现方式（Jenkins 2011）[^jenkins-2011]。另一种看法是，奠基在性质上是对照式的，因而包含两个位置给事实，另两个位置给这些事实的对照项（Schaffer 2012）[^schaffer-2012]。再考虑 [The truckers are picketing] 为 [The truckers are striking] 奠基这一主张。依语境，我们可能这样读它：[The truckers are picketing] 而非 [They’re working as normal] 为 [The truckers are striking] 而非 [It’s not the case that they’re striking] 奠基。舍弗论证说，他那版四项看法优于二项看法，因为在前者之下我们可以合理地主张奠基是传递的，在后者之下则不能（关于传递性的进一步讨论见 §2.3）。舍弗还提出，对奠基的对照式处理是可信的，因为它把奠基铸成适合支撑说明的形式，而说明本身在性质上是对照式的。
    step2: |-
      还有人把奠基当四项关系而非二项关系。一种看法是：奠基关系留两个位置给事实，两个位置给这些事实的呈现方式（Jenkins 2011）[^jenkins-2011]。另一种看法是：奠基在性质上是对照式的，于是留两个位置给事实，两个位置给它们的对照项（Schaffer 2012）[^schaffer-2012]。再看 [The truckers are picketing] 为 [The truckers are striking] 奠基这句。看语境，我们也许读成：[The truckers are picketing] 而非 [They’re working as normal]，为 [The truckers are striking] 而非 [It’s not the case that they’re striking] 奠基。舍弗说，他那版四项看法胜过二项看法：在四项之下，我们还能合理地主张奠基是传递的；二项之下就不成（传递性的进一步讨论见 §2.3）。他还说，对照式处理可信，因为它把奠基铸成适合支撑说明的模样，而说明本身就是对照式的。
