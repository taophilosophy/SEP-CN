      The *explanation argument* says that grounding is a justified posit because of its explanatory role (Audi 2012a; Dasgupta 2014a; Fine 2012a; Litland 2017; Schaffer 2016a)[^audi-2012a][^dasgupta-2014a][^fine-2012a][^litland-2017][^schaffer-2016a]. Recalling the distinction between unionism and separatism (see §1.1), the argument proceeds differently depending on which view is in play (Kovacs 2017)[^kovacs-2017]. Given separatism (grounding is determination_{*G*}), one way to cast the explanation argument is as follows: there is a form of explanation—what we can call *ontic* explanation—such that explanations of this form are backed by worldly relations; and, among the ontic explanations are ones such that the best candidate for the relation that plays the backing role is determination_{*G*}. Given unionism (grounding is explanation_{*G*}), one way to cast the argument is as follows: there is a form of explanation, what we can call *metaphysical explanation*, such that the connections in metaphysical explanations are best expressed in terms of explanation_{*G*}.
    step1: |-
      *说明论证*说，奠基因其说明作用而是一个有理由的设定（Audi 2012a; Dasgupta 2014a; Fine 2012a; Litland 2017; Schaffer 2016a）[^audi-2012a][^dasgupta-2014a][^fine-2012a][^litland-2017][^schaffer-2016a]。回想联合论与分离论之分（见 §1.1），该论证依所持观点不同而走法不同（Kovacs 2017）[^kovacs-2017]。给定分离论（奠基是决定_{*G*}），说明论证可以这样铺陈：存在一种说明形式——我们可称之为*本体性*说明——这种形式的说明由世界性关系支撑；而在诸本体性说明中，有些说明的最优候选支撑关系是决定_{*G*}。给定联合论（奠基是说明_{*G*}），论证可以这样铺陈：存在一种说明形式，我们可称之为*形而上学说明*，形而上学说明中的连接用说明_{*G*}来表达最佳。
    step2: |-
      *说明论证*主张：奠基因其说明的角色而是有理由的设定（Audi 2012a; Dasgupta 2014a; Fine 2012a; Litland 2017; Schaffer 2016a）[^audi-2012a][^dasgupta-2014a][^fine-2012a][^litland-2017][^schaffer-2016a]。由于有联合论与分离论之分（见 §1.1），这个论证随所持观点不同而路径不同（Kovacs 2017）[^kovacs-2017]。持分离论（奠基即决定_{*G*}）时，可以这样铺陈：存在一种说明形式——不妨称为*本体性*说明——此类说明由世界性的关系作支撑；而诸本体性说明中，有一些的最佳候选支撑关系正是决定_{*G*}。持联合论（奠基即说明_{*G*}）时，可以这样铺陈：存在一种说明形式，不妨称为*形而上学说明*，这种说明中的连接用说明_{*G*}来刻划最好。
