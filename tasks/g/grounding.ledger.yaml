      That grounding figures in ordinary and philosophical thinking (and perhaps other domains as well) and that many grounding claims are fairly easy to evaluate (e.g., [*Beijing exists*] grounds [{*Beijing*} *exists*]) gives us defeasible reason to think that there is grounding (deRosset 2020)[^rosset-2020]. What else can be said on behalf of grounding? Proponents of grounding tend to think that it’s a justified posit on the basis of its theoretical utility. In this section we set out three theoretical utility arguments for grounding that involve unity, explanation, and the direction of priority.
    step1: |-
      奠基既出现在日常与哲学思考中（或许还出现在其他领域），许多奠基主张又相当容易评估（例如 [*Beijing exists*] 奠基 [{*Beijing*} *exists*]），这给了我们可废止的理由去认为存在奠基（deRosset 2020）[^rosset-2020]。还能为奠基说什么？奠基的支持者倾向于认为，奠基凭借其理论效用而成为一个有理由的设定。本节给出三个奠基的理论效用论证，分别涉及统一性、说明与优先性方向。
    step2: |-
      奠基见于日常与哲学思考（或许也见于其他领域），且许多奠基主张相当容易评估（例如 [*Beijing exists*] 奠基 [{*Beijing*} *exists*]）——这给我们提供了可废止的理由，让我们认为存在奠基（deRosset 2020）[^rosset-2020]。此外还能为奠基说些什么？奠基的支持者倾向于主张：凭其理论效用，奠基是一个有正当理由的设定（posit）。本节铺陈三个诉诸理论效用的奠基论证，分别关涉统一、说明与优先性的方向。
