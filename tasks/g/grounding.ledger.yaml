      While we will introduce some symbols for expressing facts below, we won’t adopt any particular formal language for expressing grounding relationships, so we needn’t adopt either predicationism or connectivism. For ease of presentation, however, we will formulate grounding claims with the predicate *grounds* and speak as if this predicate expresses a relation—the grounding relation—such that collections of one or more facts ground particular facts. (See, however, Dasgupta 2014b and Litland 2018a for bicollective conceptions of grounding according to which collections of facts can be non-distributivity grounded.)[^dasgupta-2014b][^litland-2018a] Where *P* is an English sentence, let $[P]$ be a function from *P* to the fact it corresponds to. So [Gomer is a good dog] is the fact that Gomer is a good dog. (We will also indicate propositions in the same manner using angle rather than square brackets.) We assume that grounding is factive in the following sense: $[P],$ $[P'],$ … grounds $[Q]$ only if $[P],$ $[P'],$ … and $[Q]$ obtain. Much of what we go on to say can be captured without recourse to relations and facts, but we won’t attempt to provide such translations.
    step1: |-
      下文我们会引入一些符号来表达事实，但不会采用任何特定的形式语言来表达奠基关系，因此不必在谓述论与联结词论之间选边。不过为便于呈现，我们还是用谓词 *grounds* 表述奠基主张，并且说话时仿佛这个谓词表达一种关系，即奠基关系，使得由一个或多个事实构成的集合为特定事实证明。不过，关于双集体式的奠基概念，参 Dasgupta 2014b 与 Litland 2018a；按那种概念，事实的集合可以非分配地奠基。[^dasgupta-2014b][^litland-2018a] 设 *P* 是一个英语句子，令 $[P]$ 为从 *P* 到其所对应事实的一个函数。于是 [Gomer is a good dog] 就是戈默是条好狗这个事实。（我们也会用尖括号而不方括号，以同样方式标示命题。）我们假定奠基在以下意义上是事实性的：$[P],$ $[P'],$ … 奠基 $[Q]$ 仅当 $[P],$ $[P'],$ … 与 $[Q]$ 皆成立。下文所说的大部分内容，都可以不借关系与事实来表达，但我们不会尝试提供这类翻译。
