      ### 3.2 怀疑论回应
  - id: 106
    kind: body
    source: |-
      Some are skeptical of grounding. A distinction can be drawn between what we might call *first-wave* and *second-wave* grounding skepticism (see Koslicki 2020, though she uses different terminology)[^koslicki-2020]. First-wave skepticism is characterized by a general concern about the intelligibility of the notion. Daly (2012) argues that the notion of grounding doesn’t really make sense. In a similar spirit, Hofweber (2009) states that grounding theorists are guilty of engaging in a problematic form of metaphysics—while they make use of perfectly ordinary terms such as *priority*, *fundamental* and *ultimately*, they use them in a distinctively non-ordinary, metaphysical way. (For non-skeptical rejoinders to first-wave skepticism, see Audi 2012b and Raven 2012.)[^audi-2012b][^raven-2012] Second-wave skeptics, by contrast, generally grant that the notion of grounding is coherent, but they think that it doesn’t belong in our theoretical toolkit in any case, as the arguments in favor of positing grounding aren’t persuasive. What unites second-wave skeptics is a shared sense that grounding theorizing is simultaneously undermotivated and overreaching.
    step1: |-
      有人对奠基持怀疑态度。可以区分我们所谓的*第一波*与*第二波*奠基怀疑主义（见 Koslicki 2020，尽管她用的是不同的术语）[^koslicki-2020]。第一波怀疑主义的特征是担忧这个概念的可理解性。Daly（2012）论证奠基概念其实讲不通。Hofweber（2009）持类似的调子，说奠基理论家犯了一种有问题的形而上学之过——他们虽然使用*优先*、*根本*与*归根结底*这样完全日常的词，却以一种独特的非日常的、形而上学的方式使用它们。（对第一波怀疑主义的非怀疑论回应，见 Audi 2012b 与 Raven 2012。）[^audi-2012b][^raven-2012] 第二波怀疑论者则一般承认奠基概念是融贯的，但他们认为它无论如何都不属于我们的理论工具箱，因为支持设定奠基的论证并不令人信服。把第二波怀疑论者联合起来的，是一种共同的感受：奠基理论化既动力不足，又用力过猛。
    step2: |-
      有人怀疑奠基。我们可以区分所谓*第一波*与*第二波*的奠基怀疑论（见 Koslicki 2020；不过她用的术语不同）[^koslicki-2020]。第一波怀疑论的特点是对奠基概念可理解性的普遍担忧。Daly（2012）主张奠基概念其实没有意义。Hofweber（2009）以类似的口吻断言：奠基理论家搞的是一种有毛病的形而上学——他们用的*优先*、*根本*、*归根结底*这些词本来完全日常，却被他们以独特的非日常的、形而上学的方式使用。（对第一波怀疑论的非怀疑论反驳见 Audi 2012b、Raven 2012。）[^audi-2012b][^raven-2012] 相比之下，第二波怀疑论者一般承认奠基概念融贯无碍，但他们认为这个概念无论如何都不该进我们的理论工具箱，因为支持设定奠基的那些论证没有说服力。第二波怀疑论者的共同点是一种共同感受：奠基理论化同时患了动机不足与胃口过大的毛病。
