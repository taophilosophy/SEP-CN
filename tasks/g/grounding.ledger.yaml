      ## 2. The Nature of Grounding
    step1: |-

    step2: |-

  - id: 47
    kind: body
    source: |-
      There are a variety of issues to address related to the nature of grounding. In this section we focus on objectivity, representation, hyperintensionality, non-monotonicity, whether grounding is a strict order, and whether grounding is well-founded. There are other interesting issues concerning the nature of grounding that we don’t have the space to discuss here. One such issue is that of *meta-ground*, viz. what if anything grounds the facts about what grounds what (see Litland 2020 for an overview)[^litland-2020].
    step1: |-

    step2: |-

  - id: 48
    kind: body
    source: |-
      ### 2.1 Objectivity and representation
    step1: |-

    step2: |-

  - id: 49
    kind: body
    source: |-
      What are the central features of grounding? Grounding theorists routinely claim that grounding is fully objective. But, given that objectivity and related notions are used in a variety of ways in philosophy, it comes as no surprise that there are different ways of understanding precisely what is being claimed here. On one approach, the issue chiefly concerns the regimentation of grounding discourse. If grounding claims are to be formulated with a parameter for facts concerning human mental activity, then grounding isn’t fully objective (Dasgupta 2017)[^dasgupta-2017]. On a more “metaphysical” approach, the issue instead chiefly concerns the essence or nature of grounding, specifically whether grounding is essentially connected to subjects. Suppose, for example, that part of what it is to be grounding is that $[P],$ $[P'],$ … grounds $[Q]$ only if certain epistemic conditions obtain (e.g., actual subjects are in a position to understand certain propositions concerning $[P],$ $[P'],$ … and $[Q]$). In this case, grounding isn’t objective.
    step1: |-

    step2: |-

  - id: 50
    kind: body
    source: |-
      What might speak in favor of objectivism about grounding? Perhaps our considered views about causation should guide our theorizing about grounding (cf. Bernstein 2015). Schaffer (2016a) conceives of grounding as being broadly analogous to causation and proposes to extend the familiar structural equation models for causation to grounding. And A. Wilson (2018) argues that grounding is indeed a type of causation, proposing an interventionist account of grounding. So, provided that it’s a bad idea to outfit causal claims with a parameter for facts concerning human mental activity, this is probably a bad idea for grounding claims as well (cf. Bernstein 2018)[^bernstein-2018]. Subjectivism (the claim that, while some facts ground other facts, grounding isn’t fully objective), however, isn’t beyond the pale. One potential route to subjectivism is this: endorse unionism (grounding is explanation_{*G*}) and argue that explanation_{*G*} is by its nature subject involving (Maurin 2019; Thompson 2018)[^maurin-2019][^thompson-2018].
    step1: |-

    step2: |-

  - id: 51
    kind: body
    source: |-
      Roughly speaking, the *representational* approach to grounding has it that grounding is intimately tied to representation (Fine 2012a; Rosen 2010)[^fine-2012a][^rosen-2010], while the *worldly* approach denies this (Audi 2012b; Schaffer 2012)[^audi-2012b][^schaffer-2012]. While the representational/worldly distinction is somewhat hazy, we understand it to be orthogonal to the objective/subjective distinction. One way to sharpen the distinction between the representational and worldly approaches is as follows: on the former, the relata of grounding have concepts among their constituents; on the latter, this isn’t the case (Krämer & Roski 2015; Correia 2017)[^correia-2017][^krämer-2015]. So understood, the representational approach comes in two varieties: either facts are composed entirely of concepts or they’re a mixture of concepts and non-representational items like objects and properties. On the former view, facts are akin to Fregean propositions; on the latter view, they’re instead akin to ordered sets of concepts and non-representational items. (See Correia 2010 for a discussion of the distinction between the representational and worldly approaches where it isn’t assumed that grounding is a relation.)[^correia-2010]
    step1: |-

    step2: |-

  - id: 52
    kind: body
    source: |-
      What hinges on whether grounding is representational or worldly? This isn’t entirely clear. You might think that grounding being worldly ensures that the relata of grounding are relatively coarse-grained, and grounding being representational ensures that the relata of grounding are relatively fine-grained. Consider the following two facts: [The liquid is H₂O] and [The liquid is water]. Representationalists, so the thinking goes, might claim that we have distinct facts here, as they have different concepts as constituents. And proponents of the worldly approach might claim that we have only one fact here, as there is no difference in constituents or manner of combination. And this, of course, is potentially relevant to theorizing about grounding—if [The liquid is H₂O] and [The liquid is water] are the same fact, then the claim that the former grounds the latter or vice versa is false provided that grounding is irreflexive (see §2.3). Note, however, that representationalists can coherently maintain that facts are relatively coarse-grained—perhaps they think that, while facts are Fregean propositions, concepts are relatively coarse-grained (Correia 2020)[^correia-2020]. And proponents of the worldly approach can coherently maintain that facts are relatively fine-grained—perhaps they think that, while facts are true Russellian propositions (ordered sets of non-representational items including properties), properties are relatively fine-grained (Dorsey 2015)[^dorsey-2015].
    step1: |-

    step2: |-

  - id: 53
    kind: body
    source: |-
      You might also think that if grounding is worldly then unionism is false. The idea is that, if grounding is worldly, then grounding can’t be a type of explanation, as explanation itself is representational. There are, however, conceptions of explanation relative to which explanation is non-representational, and a worldly unionist is free to appeal to explanation so conceived (Skiles and Trogdon 2021)[^skiles-2021][^trogdon-2021].
    step1: |-

    step2: |-

