      Some claim that a potentially relevant consideration here concerns ontological commitment (Correia 2010)[^correia-2010]. All other things being equal, if one way of formulating grounding claims has fewer ontological commitments than another, then the former is preferable to the latter. Suppose that the connectivist’s connective is understood to be non-committal, so as not to commit us to a grounding operation. And suppose that the predicationist’s predicate is understood to commit us to a grounding relation between facts. In this case, it may be that connectivism has an advantage over predicationism—this depends on whether there are countervailing considerations (e.g., the connective treatment may be relatively cumbersome to work with). But note that the predicationist, of course, might claim that their predicate is non-committal (nominalists, for example, dispute that relational terms commit us to properties and relations), and perhaps there are reasons to think that the connectivist’s connective commits us to a grounding operation. The moral is that we need to establish which terms are committal before any claims of minimizing commitment can be made. (Also, note that, with respect to the potential commitments of predicationism, we may have different attitudes about relations and facts—you might be happy to countenance facts but not relations or vice versa.)
    step1: |-
      有人提出，此处一个可能相关的考虑关乎本体论承诺（Correia 2010）[^correia-2010]。在其他条件相同的情况下，如果一种表述奠基主张的方式比另一种本体论承诺更少，前者就优于后者。假定联结词论者的联结词被理解为不作承诺，因而不把我们承诺给某种奠基运作。再假定谓述论者的谓词被理解为把我们承诺给事实之间的奠基关系。这时，联结词论或许比谓述论占优；这要看是否存在抵消性的考虑（例如，联结词的处理用起来可能比较笨重）。但要注意，谓述论者当然可能声称自己的谓词不作承诺（例如唯名论者就争论说，关系词项并不把我们承诺给性质与关系），而且也许有理由认为联结词论者的联结词把我们承诺给某种奠基运作。教训是：在作出任何“承诺最少”的主张之前，我们得先确定哪些词项是带承诺的。（另外注意，就谓述论可能的承诺而言，我们对关系与事实可以持不同态度：你可能乐意承认事实而不承认关系，或反过来。）
