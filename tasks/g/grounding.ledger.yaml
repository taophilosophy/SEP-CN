      Turning to asymmetry, Bliss (2014) and Thompson (2016, 2018) critically assess the general theoretical motivations for thinking that grounding is asymmetric and propose potential counterexamples. Thompson suggests that, given the functional relationship between mass, volume, and density (the density of a substance is its mass divided its volume), we should accept that, say, [*g* has 3cm³ volume] grounds [*g* has 2g/cm³ density] and vice versa. It’s worth noting, however, that many reciprocal functional relationships don’t involve symmetric grounding. As Alexander Skiles has suggested to us in conversation, there is, for example, a reciprocal functional relationship between how many things are Socrates and how many members Socrates’ singleton has, but it’s clear in which direction the grounding runs in this case.
    step1: |-
      转到非对称性。Bliss（2014）与 Thompson（2016, 2018）批判性地评估了认为奠基非对称的一般理论动机，并提出了潜在的反例。Thompson 提出，鉴于质量、体积与密度之间的函数关系（一物质的密度是其质量除以其体积），我们应当接受诸如 [*g* has 3cm³ volume] 奠基 [*g* has 2g/cm³ density]，且反之亦然。但值得注意，许多互反的函数关系并不涉及对称的奠基。正如 Alexander Skiles 在交谈中向我们指出的，例如，有几个东西是苏格拉底，与苏格拉底的单元集合有多少个元素，这两者之间存在互反的函数关系，但在这个案例中奠基的方向是清楚的。
    step2: |-
      再看非对称性。Bliss（2014）和 Thompson（2016、2018）对“奠基非对称”的一般理论动机作了批判性考察，并给出潜在反例。Thompson 建议：既然质量、体积、密度三者有函数关系（物质的密度等于其质量除以体积），我们就应当接受 [*g* has 3cm³ volume] 奠基 [*g* has 2g/cm³ density]，并且反之亦然。然而要注意，许多互反的函数关系并不牵涉对称奠基。Alexander Skiles 曾在私下交谈中向我们指出：例如，“有几个东西是苏格拉底”与“苏格拉底的单元集有几个元素”之间存在互反的函数关系，但奠基朝哪个方向走，在这个案例里是明明白白的。
