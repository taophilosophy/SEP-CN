      Another issue is whether grounding is *well-founded*. Different authors mean different things in claiming that grounding is well-founded. According to Schaffer, grounding is well-founded in the sense that downwardly non-terminating chains of grounds are impossible. In conceiving of grounding as a relation between entities in general and not just facts, Schaffer’s rationale concerns the notion of *reality inheritance*. Schaffer claims that, were there downwardly non-terminating grounding chains, the being of any object in such a chain would be “infinitely deferred, never achieved” (2010: 62). Something “…cannot be real merely by having a limitless sequence of ancestors, each claiming reality from its parents”; instead, “There must actually be a source of reality somewhere” (2016a: 95). This echoes Leibniz, who claims that in the event that every object is a being of aggregation, “one never arrives at any real being” (Adams 1994: 333)[^adams-1994].
    step1: |-
      另一个问题是奠基是否*良基*。主张奠基良基的不同作者，其含义各不相同。按舍弗的说法，奠基良基是指向下不终止的奠基链条是不可能的。舍弗把奠基构想为一般实体之间而不只是事实之间的关系，他的理据关乎*实在继承*这一概念。舍弗主张，倘若存在向下不终止的奠基链条，链条中任一对象的存在都会“被无限推迟，永未达成”（2010: 62）。某物“……不能仅凭拥有一列无穷的祖先而实在，其中的每一个都从其父母那里领来实在”；相反，“某处必须实际存在一个实在之源”（2016a: 95）。这与莱布尼茨相呼应，后者主张，若每个对象都是聚合的存在者，“就永远到不了任何实在的存在者”（Adams 1994: 333）[^adams-1994]。
    step2: |-
      另一个问题：奠基是否*良基*？主张奠基良基的作者们，各自所意并不相同。在舍弗那里，奠基良基意味着向下不终止的奠基链不可能存在。舍弗把奠基看作一般实体之间（而不只事实之间）的关系，其理据牵涉*实在继承*（reality inheritance）观念。舍弗主张：一旦存在向下不终止的奠基链，链中任一对象的存在便会“被无限推迟，永未达成”（2010: 62）：“……不能仅仅因为有一串无穷无尽的祖先、个个都从其父母处领取实在，便是实在的”；毋宁说，“必须在某处真有一个实在之源”（2016a: 95）。此说与莱布尼茨相呼应——后者主张，若每个对象都是聚合的存在者，“那就永远抵达不了任何实在的存在”（Adams 1994: 333）[^adams-1994]。
