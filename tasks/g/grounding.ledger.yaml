      ### 1.1 Determination and explanation
    step1: |-
      ### 1.1 Determination and explanation
    step2: |-
      ### 1.1 决定与说明
  - id: 7
    kind: body
    source: |-
      An important initial choice point in theorizing about grounding concerns the theses of *unionism* and *separatism* (Raven 2015: 326)[^raven-2015]. Proponents of unionism work with an explanation-based conception of grounding, stipulating that grounding is a form of explanation, what we will call explanation_{*G*} (Dasgupta 2017; Fine 2012a; Litland 2015; Rosen 2010)[^dasgupta-2017][^fine-2012a][^litland-2015][^rosen-2010]. For unionists, to say that the bowl’s brittleness is grounded in the ionic bonds of its constituent atoms is, in the first instance, to say that the bowl is brittle because these bonds are ionic, that it’s brittle in virtue of the ionic bonding, or that the brittleness is accounted for by the bonding.
    step1: |-
      关于奠基作理论化时，一个重要的初始岔路口关乎 *联合论* 与 *分离论* 两种论点（Raven 2015: 326）[^raven-2015]。联合论的拥护者采用的是一种以说明为基础的奠基概念，规定奠基是一种说明，我们称之为说明_{*G*}（Dasgupta 2017; Fine 2012a; Litland 2015; Rosen 2010）[^dasgupta-2017][^fine-2012a][^litland-2015][^rosen-2010]。对联合论者来说，说碗的易碎性奠基于其构成原子的离子键，首先就是说，碗之所以易碎是因为这些键是离子键，或说它凭这些离子键而变脆，或说易碎性由这些键得到说明。
    step2: |-
      为奠基作理论化，头一个岔路口关乎 *联合论* 与 *分离论*（Raven 2015: 326）[^raven-2015]。联合论者用一套以说明为基础的奠基概念，规定奠基就是一种说明，我们叫它说明_{*G*}（Dasgupta 2017; Fine 2012a; Litland 2015; Rosen 2010）[^dasgupta-2017][^fine-2012a][^litland-2015][^rosen-2010]。在他们看来，说碗的易碎性奠基于其构成原子的离子键，首先就是说：碗之所以易碎，是因为这些键是离子键；或说它凭离子键而变脆；或说易碎性由这键合得到了说明。
  - id: 8
    kind: body
    source: |-
      Separatists, on the other hand, work with a determination-based conception of grounding. The guiding idea here is an analogy between causation and grounding. Causation, while itself a form of determination rather than explanation, nevertheless backs explanations. So too separatists claim with grounding: grounding, rather than being a form of explanation, is a form of determination—what we will call determination_{*G*}—that backs explanations (Audi 2012a; Schaffer 2009, 2012, 2016a; Trogdon 2013a)[^audi-2012a][^schaffer-2009][^trogdon-2013a]. For separatists, to say that the bowl’s brittleness is grounded in the ionic bonds of its constituent atoms is, in the first instance, to say that these bonds non-causally generate, produce, or bring about the bowl’s brittleness. Just what the intuitive notion of backing ultimately comes to in the context of causation and grounding isn’t an entirely settled matter—some understand backing in terms of representation (Trogdon 2018a)[^trogdon-2018a], while others suggest that backing itself is to be given a grounding-theoretic treatment (Kovacs 2020; Wirling 2020)[^kovacs-2020][^wirling-2020]. (The “explanation_{*G*}” and “determination_{*G*}” terminology is borrowed from Skiles and Trogdon (2021)).
    step1: |-
      另一方面，分离论者采用的是一种以决定为基础的奠基概念。这里的指导想法，是因果与奠基之间的类比。因果本身虽是决定而非说明的一种形式，却仍为说明提供支撑。分离论者对奠基也如此主张：奠基不是说明的一种形式，而是决定的一种形式，我们称之为决定_{*G*}，它为说明提供支撑（Audi 2012a; Schaffer 2009, 2012, 2016a; Trogdon 2013a）[^audi-2012a][^schaffer-2009][^trogdon-2013a]。对分离论者来说，说碗的易碎性奠基于其构成原子的离子键，首先就是说，这些键以非因果的方式生成、产生或带来碗的易碎性。至于“支撑”这个直观概念在因果与奠基的语境中最终到底是什么，尚无定论：有人把支撑理解为表征（Trogdon 2018a）[^trogdon-2018a]，另有人提出支撑本身应得到一种奠基论的处理（Kovacs 2020; Wirling 2020）[^kovacs-2020][^wirling-2020]。（“说明_{*G*}”与“决定_{*G*}”这两个用语借自 Skiles and Trogdon (2021)。）
    step2: |-
      分离论者则用一套以决定为基础的奠基概念。指导想法是拿因果同奠基作类比：因果本身是决定而非说明，却仍替说明撑腰。分离论者说奠基也一样：奠基不是说明的一种形式，而是决定的一种形式，我们叫它决定_{*G*}，它替说明撑腰（Audi 2012a; Schaffer 2009, 2012, 2016a; Trogdon 2013a）[^audi-2012a][^schaffer-2009][^trogdon-2013a]。在他们看来，说碗的易碎性奠基于构成原子的离子键，首先就是说：这些键以非因果的方式生成、产生、带来碗的易碎性。至于“撑腰”这个直观说法在因果与奠基的语境里究竟落在何处，并无定论：有人把它读作表征（Trogdon 2018a）[^trogdon-2018a]，有人说它本身就该得到奠基论的处理（Kovacs 2020; Wirling 2020）[^kovacs-2020][^wirling-2020]。（“说明_{*G*}”“决定_{*G*}”这两个说法借自 Skiles and Trogdon (2021)。）
  - id: 9
    kind: body
    source: |-
      Unionists, as we understand them, are committed to there being instances of a certain form of explanation and to providing an account of what it’s like; they don’t have a corresponding commitment regarding any form of determination. For separatists, the reverse is the case. Hence, unionism and separatism are importantly different theses (cf. Dasgupta 2017: fn. 8; Kovacs 2020)[^dasgupta-2017][^kovacs-2020]. And note that, even if we agree that there is both explanation_{*G*} and determination_{*G*}, there still may be substantive reasons to go with one view rather than the other. For example, if, say, explanation_{*G*} is conceptually prior to determination_{*G*}, then perhaps we should, all other things being equal, interpret grounding claims as targeting in the first instance the former rather than the latter. Compare: Strevens (2008: Ch. 6) claims that we ought to interpret causal claims (e.g., “The stone striking the glass caused the window to shatter”) as targeting in the first instance causal explanation rather than causation understood as a form of determination, as the former is conceptually prior to the latter.
    step1: |-
      按我们的理解，联合论者承诺存在某一种形式的说明的实例，并要给出一个说明它是什么样的说明；他们对任何形式的具体决定没有相应承诺。分离论者恰好相反。因此，联合论与分离论是两种重要的不同论点（参 Dasgupta 2017: fn. 8; Kovacs 2020）[^dasgupta-2017][^kovacs-2020]。还要注意，即便我们同意说明_{*G*}与决定_{*G*}都存在，仍可能有实质理由选取一种看法而不取另一种。例如，假如说明_{*G*}在概念上先于决定_{*G*}，那么在其他条件相同的情况下，我们或许应当把奠基主张首先读作指向前者而非后者。可比照：Strevens（2008: Ch. 6）主张，我们应当把因果主张（如“石头击中玻璃，使窗子碎了”）首先读作指向因果说明，而不是读作作为决定之一种的因果作用，因为前者在概念上先于后者。
    step2: |-
      按我们此处的理解，联合论者承诺确有一种形式的说明的实例，并要交代它是什么样的说明；对任何具体决定，他们不作相应承诺。分离论者反过来。所以联合论与分离论是两种要紧的不同论点（参 Dasgupta 2017: fn. 8; Kovacs 2020）[^dasgupta-2017][^kovacs-2020]。还要注意：就算承认说明_{*G*}与决定_{*G*}都存在，仍可能有实质理由取一派而不取另一派。比如，假若说明_{*G*}在概念上先于决定_{*G*}，那么在其他条件相同的情形下，我们该把奠基主张首先读作瞄着前者，而非后者。可比照的是：Strevens（2008: Ch. 6）主张，因果主张（如“石头击中玻璃，窗子于是碎了”）应当首先读作瞄着因果说明，而不是读作作为决定之一种的因果作用，因为前者在概念上先于后者。
