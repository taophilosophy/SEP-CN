      ### 1.2 规范化
  - id: 11
    kind: body
    source: |-
      To regiment grounding discourse is to adopt a formal language in which we can precisely formulate grounding claims. A regimentation includes various linguistic policies, including ones specifying which syntactic forms we should use to express grounding relationships. There are two general approaches to regimentation. On the first approach, regimentation is chiefly pragmatic in nature. In this case, we might regiment in one way rather than another merely because doing so will, say, make a certain complicated argument or idea easier to follow or understand. On the second approach, our choices concerning regimentation are guided by the goal of accurately describing the structure of reality.
    step1: |-
      规范化奠基话语，就是采用一种形式语言，在其中可以精确表述奠基主张。一套规范化包含各种语言政策，其中包括规定我们应当用哪些句法形式来表达奠基关系。规范化有两条一般进路。按第一条，规范化主要是实用性质的。这时，我们或许只是出于实用而取一种规范化而不取另一种，比方说因为它使某个复杂论证或想法更容易跟上、更容易懂。按第二条，我们在规范化上的选择由准确描述实在结构这一目标来引导。
    step2: |-
      规范化奠基话语，就是采用一种形式语言，在其中精确表述奠基主张。一套规范化含各种语言政策，其中要规定用哪些句法形式表达奠基关系。规范化有两条大路。第一条主要看实用：取一种规范化而不取另一种，也许只因它让某个复杂论证或想法更好跟、更好懂。第二条则由一个目标牵引：准确描述实在的结构。
  - id: 12
    kind: body
    source: |-
      As for the regimentations themselves, two general frameworks have emerged: *predicationists* formulate grounding claims with a relational predicate, one corresponding to the English predicate *grounds* (Audi 2012a; Schaffer 2009; Rosen 2010)[^audi-2012a][^rosen-2010][^schaffer-2009]. *Connectivists* use a non-truth-functional sentential connective instead, one corresponding to the English operator *because* (Fine 2012a; Correia 2010; Schneider 2011)[^correia-2010][^fine-2012a]. Full blown connective regimentations will include a logic of grounding, which on Fine’s (2012a, 2012b) development includes structural rules and properties (e.g., transitivity) and logical rules including introduction and elimination rules. (See Poggiolesi 2020 for a general discussion of the logic of grounding.)[^poggiolesi-2020] Note that each of these approaches to regimentation is compatible with both separatism and unionism (Kovacs 2018: note 28)[^kovacs-2018]. For further context, note that there is corresponding discussion regarding the proper formulation of truthmaking claims (Melia 2005)[^melia-2005].
    step1: |-
      至于规范化本身，已出现两大框架：*谓述论者* 用一个关系谓词来表述奠基主张，该谓词对应英语谓词 *grounds*（Audi 2012a; Schaffer 2009; Rosen 2010）[^audi-2012a][^rosen-2010][^schaffer-2009]。*联结词论者* 则用一个非真值函项的句子联结词，对应英语算子 *because*（Fine 2012a; Correia 2010; Schneider 2011）[^correia-2010][^fine-2012a]。充分展开的联结词规范化会包含一套奠基逻辑，按 Fine（2012a, 2012b）的展开，其中有结构规则与结构性质（如传递性），也有包含引入规则与消去规则的逻辑规则。（关于奠基逻辑的一般讨论，见 Poggiolesi 2020。）[^poggiolesi-2020] 要注意，这两种规范化进路各自都同分离论与联合论相容（Kovacs 2018: note 28）[^kovacs-2018]。再提供一点背景：关于使真主张的恰当表述，也有相应的讨论（Melia 2005）[^melia-2005]。
    step2: |-
      规范化本身有两大框架。*谓述论者* 用一个关系谓词表述奠基主张，该谓词对应英语的 *grounds*（Audi 2012a; Schaffer 2009; Rosen 2010）[^audi-2012a][^rosen-2010][^schaffer-2009]。*联结词论者* 换用一个非真值函项的句子联结词，对应英语算子 *because*（Fine 2012a; Correia 2010; Schneider 2011）[^correia-2010][^fine-2012a]。充分展开的联结词规范化会带一套奠基逻辑；按 Fine（2012a, 2012b）的展开，其中有结构规则与结构性质（比如传递性），也有包含引入规则与消去规则的逻辑规则。（奠基逻辑的一般讨论，见 Poggiolesi 2020。）[^poggiolesi-2020] 注意：这两条规范化进路，各自都能同分离论、也能同联合论相容（Kovacs 2018: note 28）[^kovacs-2018]。再给一点背景：关于使真主张该怎样表述，也有相应的讨论（Melia 2005）[^melia-2005]。
