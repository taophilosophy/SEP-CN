      ### 4.2 Essence
    step1: |-

    step2: |-

  - id: 141
    kind: body
    source: |-
      How do grounding and essence interact? On the relevant notion of essence, essence isn’t a purely modal matter—while all essential truths about some item (truths that characterize what it is to be that item) are necessary, not all necessary truths about some item are essential truths about it (Fine 1994)[^fine-1994]. For example, anything that is identical to Beijing is a city, and this is a candidate essential truth about Beijing. But, while it’s necessary that Beijing exists only if {Beijing} exists, this isn’t a candidate essential truth about the city (though it’s a candidate essential truth about {Beijing}). Intuitively, you can know everything there is to know about what it is to be Beijing and not thereby know anything about sets.
    step1: |-

    step2: |-

  - id: 142
    kind: body
    source: |-
      We begin with an essence-to-grounding principle, one specifying a potential entailment from truths about essence to truths about what grounds what. According to Rosen (2010), for any *x*, if it’s essential to *x* that *P*, then [It’s essential to *x* that *P*] grounds $[P]$ (see also Dasgupta 2016 and Kment 2014: Ch. 6)[^dasgupta-2016][^kment-2014]. Rosen points out that this principle, if true, may clarify the grounding profile of certain universal facts. For example, perhaps [It’s essential to triangularity that all triangles have three sides] grounds [All triangles have three sides]. (See Glazier 2017 and Zylstra 2019b for critical discussion.)[^glazier-2017][^zylstra-2019b]
    step1: |-

    step2: |-

  - id: 143
    kind: body
    source: |-
      Turning to grounding-to-essence principles, some, such as Correia (2013), O’Conaill (2018), and Trogdon (2013b), focus in this context on putative essential truths that themselves don’t directly concern grounding (e.g., part of what it is to be the property of being maroon is that, for any *x*, if *x* is maroon, then *x* is red). Others, such as Audi (2012a), focus on corresponding essential truths that encode information about what grounds what (e.g., part of what it is to be the property of being maroon is that, for any *x*, if *x* is maroon, then [*x* is maroon] grounds [*x* is red]). Let’s focus on putative essential truths of the former, grounding-free variety, where these truths are understood to characterize facts rather than entities they concern.
    step1: |-

    step2: |-

  - id: 144
    kind: body
    source: |-
      You might think that, if $[P]$, $[P'],$ … grounds $[Q],$ then part of what it is to $[Q]$ is that if $[P],$ $[P'],$ … obtains then $[Q]$ obtains. As Fine (2012a) notes, however, there are potential counterexamples. While [Socrates is a philosopher] grounds [Someone is a philosopher], on the face of it no essential truth about the latter encodes information about Socrates in particular. One possibility is to weaken the proposal so that the essential truths may characterize either $[P],$ $[P'],$ … or $[Q]$. (A further consideration is whether we should understand this principle as allowing for the relevant essential truths to be irreducibly collective.) Fine (2012a) takes a different route, claiming that, whenever some facts ground another fact, there will be some true generalization of this grounding connection that
    step1: |-

    step2: |-

  - id: 145
    kind: body
    source: |-
      1. doesn’t mention the grounds;
      2. suffices, together with the grounds, for the grounded; and
      3. is an essential truth about the grounded.
    step1: |-

    step2: |-

  - id: 146
    kind: body
    source: |-
      With respect to the case just mentioned, Fine proposes that this is the relevant generalization: for any *x*, if *x* is a philosopher, then [*x* is a philosopher] grounds [Someone is a philosopher]. Fine notes that this principle, if true, suggests a top-down approach to establishing what grounds what, one where we begin with those facts we take to be grounded and then work our way down to their grounds.
    step1: |-

    step2: |-

  - id: 147
    kind: body
    source: |-
      As Rosen notes (2010), however, these principles rule out so-called Moorean connections, grounding connections that aren’t mediated by essential truths. If, say, non-reductive physicalism about the mental is best formulated in terms of Moorean connections as Rosen suggests, then the above grounding-to-essence principle has the undesirable result of ruling out what is arguably the dominant view concerning the metaphysics of mind.
    step1: |-

    step2: |-

  - id: 148
    kind: body
    source: |-
      While we don’t have the space to explore these proposals here, some have proposed not just essence-to-grounding or grounding-to-essence principles but full-blown accounts of essence in terms of grounding or vice versa. deRosset (2013) and Gorman (2014) propose accounts of essence in terms of grounding. (See Zylstra 2018 for critical discussion.)[^zylstra-2018] Correia (2013) and Zylstra (2019a) instead propose accounts of grounding in terms of essence. Finally, some have proposed accounts of both essence and grounding in terms of some third item—Fine (2015) does so in terms of constitutively necessary and sufficient conditions, and Correia and Skiles (2019) in terms of generalized identity. (See Zylstra 2020 for critical discussion of each of the above accounts.)[^zylstra-2020]
    step1: |-

    step2: |-

  - id: 149
    kind: body
    source: |-
      ### 4.3 Fundamentality
    step1: |-

    step2: |-

  - id: 150
    kind: body
    source: |-
      How are grounding and fundamentality related? Here we focus on fundamentality with respect to facts, as opposed to, say, entity or theory fundamentality. There are two general types of fundamentality, relative and absolute. As for relative fundamentality, the general idea is that some facts are more fundamental than others. A simple grounding-theoretic account of relative fundamentality is this: for each fact among $[P],$ $[P'],$ … to be more fundamental than $[Q]$ is for $[P],$ $[P'],$ … to ground $[Q]$. Turning to absolute fundamentality, the idea is that some facts are fundamental *full stop*. On one familiar conception of absolute fundamentality, to be absolutely fundamental is to enjoy a distinctive form of *independence* (Bennett 2017: Ch. 5)[^bennett-2017]. One way for a fact to be independent is for it not to be grounded by other facts. This suggests a simple grounding-theoretic account of absolute fundamentality: to be absolutely fundamental it to be ungrounded (Schaffer 2009)[^schaffer-2009].
    step1: |-

    step2: |-

  - id: 151
    kind: body
    source: |-
      You might think that the above account of relative fundamentality fails to identify a necessary condition, especially if you assume that, for any two facts, one of them is more fundamental than the other or they’re equally fundamental. For example, perhaps [There are hydrogen atoms in Phoenix] is more fundamental than [There are H₂O molecules in Ithaca] even though the former doesn’t ground the latter (Bennett 2017: Ch. 6)[^bennett-2017]. (For more sophisticated characterizations of relative fundamentality that appeal to grounding, see Bennett 2017: Ch. 6 and Werner 2021.)[^bennett-2017][^werner-2021]
    step1: |-

    step2: |-

  - id: 152
    kind: body
    source: |-
      Returning to absolute fundamentality, you might worry that the above account leaves out an important dimension, specifically the fact that the absolutely fundamental facts are *complete* in the sense that, since they are the basic building blocks of reality, to describe them is in some sense to provide a description of everything (Tahko 2018)[^tahko-2018]. Note that absolute fundamentality conceived of as involving both independence and completeness seems to capture the notion of an unexplained explainer—the absolutely fundamental facts are independent and therefore unexplained, and these facts are complete and therefore explain (Bennett 2017: Ch. 5)[^bennett-2017]. Looking to the history of philosophy, we see that fundamental entities are regularly invoked as a means of meeting certain kinds of explanatory demands, demands that perhaps only independent entities could meet. This is typically evidenced by the arguments from vicious infinite regress that are commonly wielded in defense of them. It’s because we need to explain, for example, why there are any contingent things whatsoever that God must exist and, importantly, if God weren’t the terminus point of our regress—because independent—then the problem that God was invoked to solve wouldn’t be solved after all.
    step1: |-

    step2: |-

  - id: 153
    kind: body
    source: |-
      With this in mind, we might revise the simple account of absolute fundamentality above as follows: to be fundamental is to be a member of some collection of facts, *F*, such that
    step1: |-

    step2: |-

  - id: 154
    kind: body
    source: |-
      1. each fact among *F* is both ungrounded and grounds some fact; and
      2. facts among *F* ground all the grounded facts.
    step1: |-

    step2: |-

  - id: 155
    kind: body
    source: |-
      We might wish to add further conditions ensuring that *F* is *minimal* (there is no proper sub-collection of *F* that grounds all the grounded facts) and *F* is *unique*—*F* is the only collection that satisfies these conditions. Another option is to interpret completeness (or unique minimal completeness) as being characteristic but not definitional of absolute fundamentality (Bennett 2017: Ch. 5)[^bennett-2017]. (Whether definitional or not, the grounding role that absolutely fundamental facts play potentially makes the cost of positing such facts worth paying—see Bliss 2019 for discussion.)[^bliss-2019] Still another option for the grounding theorist is to be a pluralist about notions of absolute fundamentality, characterizing independence, completeness, and perhaps further notions as well such as *ineliminability*, granting that they might (in special cases) pull apart. (See Raven 2016 for discussion of ineliminability in this context.)[^raven-2016]
    step1: |-

    step2: |-

