      ### 1.5 Historical connections
    step1: |-

    step2: |-

  - id: 42
    kind: body
    source: |-
      There are interesting and difficult questions about grounding, its history, and what its relationship to the history of philosophy is. On one view, the notion of grounding is old, perhaps as old as philosophy itself, with many of its most important thinkers engaging with questions related to grounding. On another view, the notion of grounding is decidedly new—it’s a recent development in contemporary analytic metaphysics.
    step1: |-

    step2: |-

  - id: 43
    kind: body
    source: |-
      Can we reconcile the grounding-is-old and grounding-is-new views? The distinction between questions *of* grounding and questions *about* grounding is helpful here (Raven 2019)[^raven-2019]. To take but one well-worn example, when Socrates asks in the *Euthyphro* if someone is pious because they are loved by the gods, or if they are loved by the gods because they are pious, perhaps Plato is directing our attention to a question of grounding. When in the contemporary literature, philosophers are debating about whether grounding is, say, a strict order (see §2.3), this is the result of their asking questions about grounding. Historically, so the thinking goes, philosophers have been interested in questions of grounding, whereas the contemporary literature has been primarily focused on questions about grounding. There is a sense, then, in which the notion of grounding is as old as the hills, with the more recent focus in the literature being directed at the notion itself.
    step1: |-

    step2: |-

  - id: 44
    kind: body
    source: |-
      Although this characterization is appealing, it has its limitations. Clearly, contemporary philosophers are interested in questions of grounding in addition to questions about grounding. What might be less clear, however, is that, on the face it, the historical literature is by no means short of attempts at engaging with questions about grounding in addition to questions of grounding. Consider, for example, cosmological arguments. In broad strokes, the thought is that the totality of contingent entities, the cosmos, stands in need of explanation, and only considerations involving God understood as a necessary existent are up to the task. Central to such arguments is an assumption according to which we can’t explain why there are contingent entities by appealing to the existence of a contingent entity. Debate has raged for centuries over how exactly we ought to understand this assumption and whether or not we ought to believe it. Importantly, this assumption is generally understood as a kind of no circularity assumption. In debating whether the assumption is correct, historical figures are, albeit indirectly, debating whether or not the relation at issue can have reflexive instances. The same goes for discussions around God’s nature as a self-causer. If the relation at issue is that of grounding, then the history of philosophy is rich in discussions about grounding.
    step1: |-

    step2: |-

  - id: 45
    kind: body
    source: |-
      Ultimately, however, it seems that the “Is grounding old or new?” question should give way to nuanced and text-based discussions of structural similarities and causal continuities between specific thinkers. As this entry will make clear, contemporary figures don’t fully agree on the concept of grounding. Hence, it seems that there is little to be gained by asking whether thus-and-so historical figures used the same notion as the contemporary figures, as the contemporary figures aren’t using the same notion themselves! Beyond tracing out similarities and differences in content of various notions employed by historical figures and paths of historical development, the question of whether grounding is old or new will apparently always be a crude generalization over these similarities and continuities. And note that there is nothing special about grounding in this regard—the same could be said for virtually any philosophically interesting concept, such as causation or necessity. (For discussions of historical connections to the ancient period, see, e.g., Corkum 2016 and 2020, Evans 2012, and Malink 2020; for the early and late modern periods, see, e.g., Amijee 2020, Bliss 2019, Casati 2018, Mulligan 2020, Pearce 2017, Roski 2017, 2020, and Stang 2019.)[^amijee-2020][^bliss-2019][^casati-2018][^corkum-2016][^corkum-2020][^evans-2012][^malink-2020][^mulligan-2020][^pearce-2017][^roski-2017][^stang-2019]
    step1: |-

    step2: |-

