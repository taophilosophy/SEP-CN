      We can cast arguments for grounding in terms of theoretical roles in addition to those specified by the unity, explanation, and priority arguments as well. Some, for example, claim that the thesis of *physicalism* (roughly, the view that the world is ultimately physical in nature) is usefully formulated in terms of grounding (Block 2015; Dasgupta 2014a; Schaffer 2017b)[^block-2015][^dasgupta-2014a][^schaffer-2017b]. With respect to physicalism *about the mental*in particular (roughly, the view that mental phenomena are nothing over and above physical phenomena), a simple grounding-theoretic formulation of the view is this: the mental facts are grounded by (non-mental) physical facts (perhaps together with other non-mental facts such as indexical and totality facts). It’s by now a familiar idea that purely modal formulations of physicalism are inadequate, as there are coherent versions of dualism that such formulations don’t rule out (Horgan 1993, 2006)[^horgan-1993]. Hence, one point in favor of appealing to grounding in this context is that grounding isn’t a purely modal notion. And Block (2015) argues that even physicalism formulated in terms of a priori entailment faces the same problem, pointing to a particular grounding formulation of physicalism as the way to resolve the issue.
    step1: |-
      除统一、说明与优先性论证所刻画的那些理论角色外，我们还可以用别的理论角色来铺陈奠基论证。例如有人主张，*物理主义*论题（大致即认为世界归根结底在本性上是物理的观点）用奠基来表述颇为有用（Block 2015; Dasgupta 2014a; Schaffer 2017b）[^block-2015][^dasgupta-2014a][^schaffer-2017b]。就*关于心灵的*物理主义而言（大致即认为心灵现象不外于物理现象的观点），一个简单的奠基论表述是：心灵事实由（非心灵的）物理事实奠基（或许连同其他非心灵事实，如索引性事实与总体性事实）。纯粹模态表述的物理主义不充分，这已是人们熟悉的想法，因为存在这类表述排除不了的融贯二元论版本（Horgan 1993, 2006）[^horgan-1993]。因此，在这个语境中诉诸奠基的一点好处是：奠基不是纯模态概念。Block（2015）则论证，即使用先天衍推表述的物理主义也面临同样问题，并指向物理主义的一种特定的奠基表述，以此作为解决之道。
    step2: |-
      除了统一、说明、优先性三个论证所刻划的理论角色，奠基论证还可以用别的理论角色来铺陈。例如，有人主张*物理主义*论题（粗略地说，世界归根结底是物理的本性）宜用奠基来表述（Block 2015; Dasgupta 2014a; Schaffer 2017b）[^block-2015][^dasgupta-2014a][^schaffer-2017b]。就*关于心灵的*物理主义来说（粗略地说，心灵现象并不超出物理现象之外），这一观点的一种简单奠基论表述是：心灵事实由（非心灵的）物理事实奠基（或许再加上其他非心灵事实，如索引性事实、总体性事实）。纯模态表述的物理主义不充分——这已是熟知的想法，因为有融贯的二元论版本是这类表述排除不掉的（Horgan 1993, 2006）[^horgan-1993]。于是，在这个语境中诉诸奠基的好处之一是：奠基并非纯模态概念。Block（2015）进而论证，连用先天衍推表述的物理主义也逃不掉同一个问题，并指认物理主义的一种特定奠基表述为解决之道。
