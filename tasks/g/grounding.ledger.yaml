      就统一论证而言，Koslicki（2015）和 J. Wilson（2016a）攻击其第二个前提：即便形而上学诸关系（或其中某子集）实质上统一，单凭这一点也给不出好理由，让我们设定一个作为统一者的奠基这种一般关系。J. Wilson（2014）连第一个前提也攻击：有一类形而上学关系——她所谓的*小写 g* 奠基关系——无论术语、形式还是形而上学上都谈不上统一。与此相关，Turner（2016）描述了某些奠基主张在行为上的种种差异，最终区分出两种奠基形式：*依赖奠基*（dependence-grounding）与*实现奠基*（realization-grounding）。（对这些挑战的非怀疑论回应见 Raven 2017、Schaffer 2016b。）[^raven-2017][^schaffer-2016b]
