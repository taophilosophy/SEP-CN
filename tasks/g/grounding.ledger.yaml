      Returning to the priority argument, there are two types of priority cases to consider: cases in which the prior fact is fundamental, and cases in which neither the prior nor posterior facts are fundamental. J. Wilson (2014, 2016a) develops a proposal according to which a primitive notion of fundamentality plays the direction-fixing role in priority cases of the first type. And this primitive notion and other grounding-free considerations (e.g., modal considerations) play the direction-fixing role in cases of the second type. (For non-skeptical rejoinders, see Cameron 2016 and Raven 2017.)[^cameron-2016][^raven-2017]
    step1: |-

    step2: |-

  - id: 111
    kind: body
    source: |-
      What about additional theoretical applications of grounding? Returning to the application to physicalism discussed above, J. Wilson (2014) points out that, as there are importantly different approaches to grounding (ones disagreeing about, e.g., how grounding interacts with reduction, necessitation, and real definition—see §4), the bald grounding claim that the physical grounds the mental doesn’t on its own speak to even very basic characteristics of the mental-physical interface. A natural response, however, is to simply work in this context with an approach to grounding that is fleshed out to a degree that such issues aren’t left open (deRosset 2020; cf. J. Wilson 2016a)[^rosset-2020][^wilson-2016a]. Still, questions about the theoretical utility of grounding-theoretic formulations of physicalism remain, including whether the nothing-over-and-above notion central to initial characterizations of physicalism is best captured in terms of grounding (Melnyk 2016; J. Wilson 2016b)[^melnyk-2016].
    step1: |-

    step2: |-

  - id: 112
    kind: body
    source: |-
      To take another example, Sider (2011: Ch. 8; 2020) questions whether grounding is apt to play the role of a level connector. Intuitively, the world has an overarching structure where entities occupy different levels of reality. One way to formulate the view that grounding is a level connector is this: different levels of reality are connected to one another by virtue of grounding relations between facts characterizing occupants of these levels. With this in mind, consider the fundamental physical level and a higher level, one occupied by cities. The grounding theorist might claim that these levels are connected partly in virtue of the fact that some quantum-mechanical fact, *Q*, grounds the fact, *N*, that New York is a city. But Sider asks: what is the grounding profile of this grounding fact? On the face of it, [*Q* grounds *N*] itself is ungrounded. Roughly speaking, the worry is this: provided that any entity that an ungrounded fact concerns is fundamental in nature, it follows that New York is a fundamental entity. Hence, it may be that in using grounding to explain how different levels of reality are connected, we get unacceptable results about which entities are fundamental. (See §4.3 for more on fundamentality; for an overview of views according to which facts like [*Q* grounds *N*] are grounded, see Litland 2020.)[^litland-2020]
    step1: |-

    step2: |-

  - id: 113
    kind: body
    source: |-
      For a different skeptical take on grounding related to its theoretical applications, Della Rocca (2014) and Tallant (2018: Ch. 5) argue, very roughly, that various metaphysical claims (e.g., material objects persist over time and truths have truthmakers) are false, as these claims are ultimately about what grounds what but there is no grounding.
    step1: |-

    step2: |-

