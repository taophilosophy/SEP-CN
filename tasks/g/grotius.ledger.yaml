      Moving on, we come to the last of our four issues—i.e., scope. In Grotius’ day, this issue was made urgent by European encounters with indigenous peoples in the Americas and elsewhere (for discussion, see Tierney 1997: Chapter XI)[^tierney-1997]. Some theorists tried to place epistemic or doxastic restrictions on the scope of the laws, arguing that they enjoined and protected only those who held certain beliefs. Since the beliefs which determined the applicability of the laws were usually religious in nature, it was commonly argued that natural laws were pertinent only to Christians and did not cover non-Christians. Given that natural laws form the basis for morality, then since they do not cover non-Christians, it follows that Christians were under no obligations to treat non-Christians morally. Like many others, Grotius strongly disagreed with such arguments. For him, natural laws apply to all rational and social beings as such. It doesn’t matter what they think or believe; if they are rational and social, they are bound by the law of nature (see, e.g., *DIB* II.20.44).
    step1: |-
      接下来看四个问题中的最后一个，即范围。在格劳秀斯时代，欧洲人在美洲及别处与土著民族的相遇，使这一问题变得紧迫（讨论见 Tierney 1997: Chapter XI）[^tierney-1997]。有些理论家试图对法的范围施加认识论或信念上的限制，主张法只约束并保护持某些信念的人。由于决定法之适用性的信念通常具有宗教性质，人们常主张自然法只与基督徒有关，不覆盖非基督徒。既然自然法是道德的基础，而它不覆盖非基督徒，那么基督徒就没有义务在道德上对待非基督徒。与许多人一样，格劳秀斯强烈反对这类论证。在他看来，自然法适用于一切理性而合群的存在者本身。他们想什么、信什么，都无关紧要；只要他们是理性而合群的，就受自然法约束（例如见 *DIB* II.20.44）。
    step2: |-
      最后是四个问题中的第四个：范围。在格劳秀斯时代，欧洲人在美洲等地与土著民族的遭遇，使这一问题变得紧迫（讨论见 Tierney 1997: Chapter XI）[^tierney-1997]。有些理论家想给法的范围加上认识或信念方面的限制，主张法只约束、只保护持某种信念的人。决定法是否适用的是信念，而信念通常又有宗教性质，于是常见的主张便是：自然法只关基督徒，不及于非基督徒。自然法是道德的根基，既然不及于非基督徒，基督徒对非基督徒也就不负道德义务。格劳秀斯与许多人一样，坚决反对这类论证。他认为自然法适用于一切理性而合群的存在者，无分彼此；他们持何种想法、信何种教义，都不相干，只要是理性而合群的，就受自然法约束（例如见 *DIB* II.20.44）。
