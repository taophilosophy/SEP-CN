      这样一项研究究竟揭示了那些根本规范原则的哪些内容？*DIP* 与 *DIB* 的推理可重构如下。人性由两种本质属性构成：自我保存的欲望，以及对社会结合的需要（见 *DIP* 第二章、*DIB* 序言 §§6–7）。两者互相节制、互相塑造：自我保存的欲望受社会冲动的约束，人因此不会天然地不惜一切代价维持并增进自身存在；反过来，对同伴的需要也受自我保存驱动的约束，个体总得设法取得自身福祉所需的手段。自我保存的驱动与合群的冲动又都兼有情感与认知两面：它们既非理性又理性，既有无思的本能之力，也有深思熟虑的谋划。人在本质上既是社会的存在者，又是自我保存的存在者，因此，要使存在得以顺遂，有两件事势在必行：不取他人所有，以及合理追求真正对己有利之事。格劳秀斯遂将这两条立为 *DIB* 中自然法的头两个要素（见序言 §§8、10），它们也是 *DIP* 前四条“法”的核心（见第二章）。这两条原则在自然规范的层级中享有次序上的优先，但并非全部。研究自然还教人懂得“恶行必须纠正”“善行必须报偿”（*DIP* 第五、六条法）。事实上，格劳秀斯在 *DIP* 中列出了约 22 条根本自然教义，*DIB* 中也有一组数量相当（只是编号方式不同）。阐述格劳秀斯的自然法理论，理应首先举出这些一阶教义或原则，其理论的实质正在于此。晚近研究多从斯多亚主义（古代与近代早期）对格劳秀斯的启发入手，来解释上述问题，尤见 Brooke (2012: Chapter 2) 与 Straumann (2015)。
