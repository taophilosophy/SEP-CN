      The import of Grotius’ theory of rights can be clarified contrasting it with the dominant medieval conception of *iura*. This conception stems primarily from Aquinas, who held that “the word *ius* was first of all used to denote the just thing itself” (*Summa Theologica* II.ii.q57.art1). In its original usage, *ius* was applied to things—actions, entities, situations—and not persons. As Aquinas and his followers conceived of it, things earn the appellation “right” when they align fully with the natural law. For two reasons, then, the medieval conception of rights can be thought of as “objective”: first, because the things which are right are *objects* (and not subjects); second, because things become worthy of the label “right” when they satisfy an *objective*, agent-independent set of necessity and sufficient conditions, viz., those conditions required for conformity to the natural law. Now, it is true that this medieval view had begun to be displaced by Grotius’ time; for example, Suarez says that a “strict acceptation of *ius*” bestows it
    step1: |-
      要弄清格劳秀斯权利理论的意义，可以把它与中世纪占主导的 *iura* 观念对照。这一观念主要来自阿奎那，他认为“*ius* 一词最初用来指正当的事情本身”（*Summa Theologica* II.ii.q57.art1）。在其原初用法中，*ius* 用于事物（行为、实体、情境），而不用于人。按阿奎那及其追随者的构想，事物在完全合于自然法时，才获得“权利/正当”之名。因此，中世纪的权利观念可以从两方面看作“客观的”：第一，因为正当的事物是**客体**（而非主体）；第二，因为事物之所以配得上“正当”之名，是因为它们满足了一组**客观的**、不依赖行为者的必要且充分条件，即合于自然法所需的条件。诚然，到格劳秀斯时代，这一中世纪观点已开始被取代；例如苏亚雷斯说，“对 *ius* 的严格理解”把它赋予
    step2: |-
      格劳秀斯权利理论的分量，对照中世纪占主导的 *iura* 观念便看得清楚。那套观念主要出自阿奎那，他说“*ius* 一词最初用来指正当的事情本身”（*Summa Theologica* II.ii.q57.art1）。在最初的用法里，*ius* 施用于事物（行为、实体、情境），而不施于人。按阿奎那及其后学的理解，事物完全合于自然法，便赢得“正当”之名。因此，中世纪的权利观念有两重理由可以称为“客观的”：其一，正当的东西是**客体**，不是主体；其二，事物之所以当得起“正当”之名，是因为满足了一组**客观的**、不系于行为者的必要而充分条件，即合于自然法所需的条件。这一中世纪见解到格劳秀斯时代确已开始退场：苏亚雷斯就说，“对 *ius* 的严格理解”把它赋予
