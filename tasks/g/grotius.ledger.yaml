      Even supposing that a war has been undertaken rightly, it must also be fought rightly for it to be just. And here we come to *ius in bello*, a topic treated in *DIB* III. Grotius begins by setting three rules governing the conduct of war (*DIB* III.1.2–4), the first and most basic of which is that “In war things which are necessary to attain the end in view are permissible” (III.1.2). This obviously places wide limits on permissible conduct, though it isn’t as chilling as a first reading might suggest, for the necessity requirement can be hard to meet. After advancing these rules, Grotius considers the permissibility of a large number of actions. The variety and amount of detail in this discussion is fascinating. Typical is his analysis of ruses, deceit and falsehood. Not only does he distinguish between those three ways of conveying false impressions but also he distinguishes variations within each of them (see III.1.6–20). For example, if deceit is a genus, then deceit in a negative action is one species (III.1.7) and deceit in a positive action is another (III.1.8). And deceit in a positive action can in turn be divided into two sub-species (ibid.). The practical aims of *DIB* come through plainly here and throughout Book III, where the priority seems to be clarifying what exactly is and is not permissible in war by considering a large number of actions which could belligerents could undertake and determining their moral and legal standing. In general, Grotius held that war is justifiable when, and only when, it serves right. Since the conditions for service to right are numerous and non-obvious, he must expend considerable effort identifying and explicating them (for more, see Draper 1990: 191–207)[^draper-1990].
    step1: |-
      即使假定开战正当，要使战争正义，作战也必须正当。这就到了 *ius in bello*，其主题在 *DIB* 第三卷处理。格劳秀斯先立三条支配战争行为的规则（*DIB* III.1.2–4），其中第一条也最基本：“在战争中，为达到目标所必需的事情是可允许的”（III.1.2）。这显然为可允许的行为划出了很宽的范围，不过它并不像初读给人的感觉那样令人胆寒，因为“必需”这一要求可能很难满足。提出这些规则之后，格劳秀斯考察大量行为的可允许性。这一讨论的多样与细密令人叹服。典型的是他对计谋、欺诈与谎言的分析。他不仅区分这三种传达假象的方式，还分辨每种方式内部的变体（见 III.1.6–20）。例如，如果欺诈是一个属，那么消极行为中的欺诈是一个种（III.1.7），积极行为中的欺诈是另一个种（III.1.8）；积极行为中的欺诈又可再分为两个亚种（同上）。*DIB* 的实践用意在此处以及整个第三卷表露得明白：其要务似乎是考虑交战者可能从事的大量行为，并确定其道德与法律地位，以澄清战争中什么恰好是可允许的、什么不是。大体而言，格劳秀斯认为，战争只有在服务于正义时，才是正当的。由于服务正义的条件众多而不显然，他必须花费大量气力去确认并阐明这些条件（详见 Draper 1990: 191–207）[^draper-1990]。
