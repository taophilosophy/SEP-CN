      And what, exactly, does such a study reveal about those fundamental normative principles? The reasoning in both the *DIP* and *DIB* may be reconstructed as follows. Human nature is constituted by two essential properties: the desire for self-preservation and the need for society (see *DIP*, Chap. 2, and *DIB*, Prol. §§6–7). These two properties temper and inform each other: the desire for self-preservation is limited by the social impulse, so that humans do not naturally seek to maintain and enhance their being at all costs; conversely, the need for the company of other humans is limited by the self-preservation drive, for individuals must naturally strive to secure the means for their well-being. Moreover, the self-preservation drive and the sociability impulse are both emotive and cognitive; they are both non-rational and rational, having the force of unreflective instinct as well as well-thought-out plans. Because we are essentially both social and self-preserving beings, it follows that two things are imperative for our successful existence. We ought to abstain from what belongs to other persons, and we ought to engage in the reasonable pursuit of what genuinely serves our interest. Accordingly, Grotius makes these the first two elements of natural law in the *DIB* (see Prol. §§8, 10); they form the core of the first four “laws” in the *DIP* (see Chap. II). While these principles enjoy lexical priority in the hierarchy of natural norms, they do not exhaust the list. A study of nature also teaches us that “Evil deeds must be corrected” and “Good deeds must be recompensed” (Laws V–VI of the *DIP*). In fact, Grotius derives a list of some 22 fundamental natural tenets in the *DIP* and a similarly large group (though not numbered in the same way) in the *DIB*. Any explanation of Grotius’ natural law theory should begin by citing these first-order tenets or principles, for they are what constitute its substance. Recent scholarship has sought to shed light on the foregoing issues by examining how Grotius may have been inspired by Stoicism, both ancient and early modern. See in particular Brooke (2012: Chapter 2) and Straumann (2015).
    step1: |-
      这样一项研究究竟揭示了那些根本规范性原则的什么内容？*DIP* 与 *DIB* 中的推理可以重构如下。人性由两个本质属性构成：自我保存的欲望与对社会结合的需要（见 *DIP* 第二章，*DIB* 序言 §§6–7）。这两种属性相互节制、相互塑造：自我保存的欲望受社会冲动的限制，因此人并不会自然而然地不惜一切代价维持和增强自身的存在；反过来，对他人的陪伴的需要也受自我保存驱动的限制，因为个体必须自然地设法获取自身福祉所需的手段。此外，自我保存的驱动与合群的冲动都既是情感的又是认知的；它们既非理性的又是理性的，既有无反思的本能之力，也有深思熟虑的计划。既然我们在本质上既是社会的存在者又是自我保存的存在者，那么要使存在获得成功，有两件事便势在必行：我们应当不取他人所有，也应当合理地追求真正有益于自身利益的东西。因此，格劳秀斯把这两条立为 *DIB* 中自然法的头两个要素（见序言 §§8、10）；它们构成 *DIP* 前四条“法”的核心（见第二章）。这些原则在自然规范的层级中具有次序上的优先性，但并不穷尽全部清单。研究自然还告诉我们，“恶行必须纠正”与“善行必须报偿”（*DIP* 第五、六条法）。事实上，格劳秀斯在 *DIP* 中推出了一张约 22 条根本自然教义的清单，在 *DIB* 中也有数量相当大的一组（尽管编号方式不同）。任何对格劳秀斯自然法理论的阐释，都应当首先举出这些第一阶的教义或原则，因为正是它们构成了该理论的实质。晚近的研究试图考察格劳秀斯如何可能受古代与近代早期斯多亚主义的启发，以阐明上述问题。尤其见 Brooke (2012: Chapter 2) 与 Straumann (2015)。
