      However, Grotius is usually given the credit for shifting the paradigm fundamentally (see, e.g., Haakonssen 1985: 240 and Schneewind 1998: 78; for an opposing view, see Irwin 2008: 98)[^haakonssen-1985][^haakonssen-1998][^irwin-2008][^schneewind-1998]. While it took time for his paradigm to become hegemonic, it did eventually prevail. When we say that so-and-so has the *right* to such-and-such, we usually mean that he has the *means* or *power* to do such-and-such: for example, the assertion that someone has the right to freedom of thought means that he has the ability to think as he pleases and no one or no thing can force him to do otherwise. This was Grotius’ view; though subsequently mediated by many others, his contribution was essential.
    step1: |-
      不过，通常认为范式发生根本转变的功劳属于格劳秀斯（例如见 Haakonssen 1985: 240 与 Schneewind 1998: 78；相反意见见 Irwin 2008: 98）[^haakonssen-1985][^haakonssen-1998][^irwin-2008][^schneewind-1998]。他的范式虽需时间才取得支配地位，最终确实胜出。当我们说某人拥有做某事的**权利**时，通常意思是此人拥有做此事的**手段**或**力量**：例如，断言某人有思想自由的权利，意思是他有能力随意思考，任何人或任何事物都不能强迫他别样思考。这正是格劳秀斯的观点；尽管后来经过许多人的中介，他的贡献仍是根本性的。
    step2: |-
      不过，范式得以根本转变，功劳通常记在格劳秀斯名下（例如见 Haakonssen 1985: 240 与 Schneewind 1998: 78；相反意见见 Irwin 2008: 98）[^haakonssen-1985][^haakonssen-1998][^irwin-2008][^schneewind-1998]。他的范式虽费了些时日才取得支配地位，最终毕竟胜出。我们说某人有做某事的**权利**，通常意思是此人有做此事的**手段**或**力量**：比如，说某人有思想自由的权利，就是说他有能力随意思想，任何人或任何物都不能强迫他另作他想。格劳秀斯正持此说；他的贡献虽经后人辗转中介，仍是根本性的。
