      In addition to its intrinsic interest, Grotius’ innovative conception of rights had numerous important consequences. Two examples may serve as illustrations. First, whereas medieval theorists tended to speak of “the right”, Grotius and his successors stressed the powers and entitlements of the person who has rights. By associating rights with the powers of a person, moderns were able to distinguish sharply between rights on the one hand versus duties on the other (cf. Finnis 1980: 209)[^finnis-1980]. Second, because Grotius made rights into powers or faculties which humans *possessed*, he played a crucial part in the commoditization of rights. Once rights became possessions, they can be traded away just like all other possessions. The means of transfer might not be identical to other exchanges of goods but the essential idea of giving away something in one’s possession for something which isn’t is there. As commentators have argued, the commoditization of rights was one of the most important political developments of the seventeenth century (for more, see especially Macpherson 1962: 3f)[^macpherson-1962].
    step1: |-
      格劳秀斯创新性的权利观念，除了本身有意思之外，还产生了许多重要后果。可以举两个例子说明。第一，中世纪理论家倾向于谈论“正当”，格劳秀斯及其后继者则强调拥有权利者所具有的力量与资格。把权利与人的力量联系起来之后，近代人得以把权利与义务截然区分开来（参 Finnis 1980: 209）[^finnis-1980]。第二，由于格劳秀斯把权利变成人所**拥有**的力量或官能，他在权利的商品化中扮演了关键角色。权利一旦成为占有物，就可以像其他一切占有物一样被交易出去。转让的方式也许与交换其他货物不尽相同，但把手中的某物让渡出去以换取手中所无之物的基本想法，就在这里。正如评论者所论，权利的商品化是十七世纪最重要的政治发展之一（详见 Macpherson 1962: 3f）[^macpherson-1962]。
    step2: |-
      格劳秀斯这一创新的权利观念，除了本身有趣，还引出许多重要后果。且举两例。第一，中世纪理论家习于谈“正当”，格劳秀斯及其后学却强调拥有权利者本人的力量与资格；把权利系于人的力量之后，近代人才能把权利与义务截然分开（参 Finnis 1980: 209）[^finnis-1980]。第二，格劳秀斯把权利变成人**拥有**的力量或官能，因而在权利的商品化中起了关键作用。权利一旦成为占有物，便可像其他一切占有物一样让渡出去；转让的方式未必同于寻常货物交换，但“以手中之物换取手中所无”这一要义，已经具在。论者指出，权利的商品化是十七世纪最重要的政治进展之一（详见 Macpherson 1962: 3f）[^macpherson-1962]。
