      凡此种种，都突显了格劳秀斯对其时代正在成形的政治自由主义学说所作的实际而不均衡的贡献。他为正在兴起的自由主义理论提供了这样的观念：个体（既包括单个的人，也包括单个的人群）是权利的承担者。他还提出了上文所述的那种极具说服力的关于权利性质的二阶说明。而且他为归属几种具体的一阶权利作了有力辩护：例如，除了已经提到的那些（如自卫权）之外，他还极力捍卫财产权。然而，这些以及其他对自由主义的贡献无论多么重要，都必须与格劳秀斯的另一些观点相权衡。例如，他固然认为个体拥有权利，但他也认为在不少情形下这些权利可以被放弃，甚至被直接压倒。因此，按格劳秀斯的理论，我们理应拥有的权利并非完全有保障。更令人不安的是他对奴隶制的看法：奴隶制是，或至少可以是，一个完全正义的制度。他在 *DIP* 中写道，亚里士多德说“某些人天性为奴”并非“错误”（第六章，问题五，第一条）。尽管格劳秀斯在 *DIB* 中可能放弃了这一想法（见 III.7.1，但也见 I.3.8.4），一个简单的论证仍持续使格劳秀斯相信奴隶制与正义社会相容：如果个人可以出卖其劳动，那么他们也应当能够出卖其自由；如果他们出卖全部自由，那他们当然就是奴隶（I.3.8.1）。最后，衡量格劳秀斯自由主义的又一砝码，是他关于统治者或主权者地位的看法。主权是“其行为不受他人法律控制”的力量（*DIB* I.3.7.1），因此，主权者必然高于所有其他人，这是必然真理。既然主权者必然高于其余的人，格劳秀斯便认为“主权者须对其臣民负责”这一主张令人生厌。主权者可以愿意顾及臣民的需要（III.15），但这只是“值得称许”，并非必需。总之，格劳秀斯对政治自由主义的贡献，与霍布斯、斯宾诺莎、洛克及其他十七世纪名人相当。这些贡献真实而重要，但其中混有绝非自由主义的主题。
