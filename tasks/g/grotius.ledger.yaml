      After several years as Attorney General, Grotius was appointed Pensionary (roughly equivalent to Governor of an American state) of Rotterdam in 1613. That same year, he was called to put theory into practice when a dispute arose between the English and the Dutch over the freedom of the seas. The details are interesting but complicated: in essence, on the basis of the claim that two Dutch vessels were trespassing on seas owned by England near Greenland, a small British fleet seized the contents of the Dutch ships. Grotius led a delegation to England in protest of the English actions. While history may have favored Grotius—his view that the seas are open to all would eventually come to be international law—real politick made victory impossible for him at the time. The English were more powerful than the Dutch, and they neither returned the cargo nor conceded the legal point.
    step1: |-
      任检察总长数年后，格劳秀斯于 1613 年被任命为鹿特丹议政官（大致相当于美国一个州的州长）。同年，英荷两国因海洋自由发生争端，他由此奉命把理论付诸实践。细节有趣而曲折：简言之，英方声称两艘荷兰船只在格陵兰附近侵入了英国的海域，一支英国小舰队遂扣押了荷兰船上的货物。格劳秀斯率团赴英，抗议英方的行动。历史也许站在格劳秀斯一边，他关于海洋向所有人开放的主张终将成为国际法；但现实政治使他当时不可能获胜。英国比荷兰强大，既不归还货物，也不在法律争点上让步。
    step2: |-
      做了几年检察总长，格劳秀斯于 1613 年出任鹿特丹议政官（大致相当于美国一个州的州长）。同年英荷两国为海洋自由起了争执，他由此奉命把理论付诸实践。事情的经过有趣却也曲折，简言之：英方称两艘荷兰船只侵入格陵兰附近的英国海域，一支英国小舰队于是扣押了船上的货物。格劳秀斯率代表团赴英抗议。历史也许站在他这一边，他主张海洋向所有人开放，日后终于成为国际法；可当时的现实政治不容他取胜：英国强于荷兰，既不肯归还货物，也不肯在法律争点上松口。
