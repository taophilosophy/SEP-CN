    source: |-
      1613 may have carried some excitement but the end of the decade was one of the true zeniths (or nadirs, depending on one’s perspective) of Grotius’ life. A dispute between orthodox Calvinists and reformers over arcane theological matters which no longer seem important to us quickly assumed enormous political significance. Grotius, Oldenbarnevelt and other supporters of religious tolerance were aligned on the side with the reformers or “Remonstrants”; Maurice, the Calvinist establishment and other so-called “Contra-Remonstrants” were on the other. On 29 August 1618, Maurice and his allies staged a coup, overthrowing the States General (of which Grotius was a member by virtue of his position as Pensionary of Rotterdam) and imprisoning him along with Oldenbarnevelt and Rombout Hoogerbeets, the Pensionary of Leiden. Consolidating his grip on power, Maurice soon moved to eliminate the Remonstrants and their supporters in government; as part of this putsch, Oldenbarnevelt was executed and Grotius and Hoogerbeets were sentenced to life imprisonment. It would be overly dramatic to say Grotius languished there: he was allowed to correspond with outsiders; moreover, he had books and writing materials, and indeed he composed much important work during this time. But the cold and damp cell was far from pleasant and there was the looming danger that the authorities would revisit his case and impose an even harsher punishment. So in March 1621, Grotius and his wife Maria decided enough was enough. Placing himself in a large trunk that Maria had shipped to him, Grotius escaped prison by having the trunk carried out on the pretense that it contained a number of books. He fled to Antwerp and thence to Paris, where his family eventually joined him.
    step1: |-
      1613 年也许有些刺激，但那个十年之末才是格劳秀斯一生真正的顶点（或者说最低点，视立场而定）之一。正统加尔文派与改革派之间就如今看来已无关紧要的晦涩神学问题发生争执，很快获得了巨大的政治意义。格劳秀斯、奥尔登巴内费尔特等宗教宽容的支持者站在改革派即“抗辩派”一边；毛里茨、加尔文派当权集团以及其他所谓的“反抗辩派”则在另一边。1618 年 8 月 29 日，毛里茨及其盟友发动政变，推翻三级会议（格劳秀斯因任鹿特丹议政官而是其成员），将他与奥尔登巴内费尔特、莱顿议政官隆布特·霍赫贝茨一并监禁。毛里茨随即着手清除抗辩派及其在政府中的支持者，以巩固权位；作为这场政变的一部分，奥尔登巴内费尔特被处死，格劳秀斯与霍赫贝茨被判终身监禁。说格劳秀斯在狱中憔悴不堪，未免过于戏剧化：他获准与外界通信，还有书籍和写作用具，事实上他在此期间写成了许多重要作品。但那间牢房阴冷潮湿，实在谈不上舒适，而且始终有一种逼近的危险：当局可能重审他的案子，加重刑罚。于是 1621 年 3 月，格劳秀斯与妻子玛丽亚决定不能再忍。他把自己装进玛丽亚为他运来的大木箱，让人把箱子抬出监狱，假称里面装的是一批书，就这样越狱。他先逃到安特卫普，再转往巴黎，家人最终也来与他团聚。
    step2: |-
      1613 年或许颇有几分激荡，但那个十年之末才真正是格劳秀斯一生的顶点之一，或者说是谷底，全看从哪一面看。正统加尔文派与改革派为一些晦涩的神学问题起了争执，那些问题在今天看来已无关紧要，当时却很快闹出巨大的政治分量。格劳秀斯、奥尔登巴内费尔特等主张宗教宽容的人站在改革派即“抗辩派”一边；毛里茨、加尔文派当权集团以及其他所谓“反抗辩派”则在另一边。1618 年 8 月 29 日，毛里茨与党羽发动政变，推翻三级会议（格劳秀斯以鹿特丹议政官的身分列名其中），把他连同奥尔登巴内费尔特、莱顿议政官隆布特·霍赫贝茨一起下狱。毛里茨随即铲除抗辩派及其在政府中的党羽，以固权位：奥尔登巴内费尔特被处死，格劳秀斯与霍赫贝茨被判终身监禁。若说格劳秀斯在狱中形销骨立，那是渲染过甚：他获准与狱外通信，还有书和纸笔，不少重要著作正是此期写成的。但那间牢房阴冷潮湿，实在不好过，何况始终悬着一重危险：当局随时可能重审他的案子，加重刑罚。1621 年 3 月，格劳秀斯与妻子玛丽亚觉得再不能忍。他钻进玛丽亚为他运进监狱的一只大木箱，托言箱中装的是书，让人把箱子抬出牢门，就此脱身。他先逃往安特卫普，再转赴巴黎，家人后来也前来相聚。
