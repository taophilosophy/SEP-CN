      Let’s start with one closely connected to the problem of obligation. Just now, it was said that the ground of obligation lay in our natures as rational, social, self-preserving beings. This is correct but it needs amplification. Grotius did not conceive of our essences as static; instead, they are dynamic, expressive of our abilities and activities. This is emphatically reflected in his conception of rights (*ius*, or *iura* in the plural). He distinguishes between several meanings of *iura*, the most important of which conceives of a *ius* as “a moral quality of a person, making it possible to have or to do something correctly” (*DIB* I.1.4). For Grotius, a *ius* or right is a capacity or power possessed by the agent; it is a “faculty” or an “aptitude” of the person (ibid.). To have a *ius* is to have the ability to engage in certain specified actions without moral or legal sanction. So, for example, when he endows humans with the right to self-preservation, he grants us the power to pursue our own interests without needing the permission or assistance of the state or any other authority. Because rights are centered on the individual subject, one will often read that Grotius propounded a theory of “subjective right” (see, e.g., Kingsbury & Roberts 1990: 31 and references there)[^kingsbury-1990].
    step1: |-
      先从与义务问题紧密相关的一个观念说起。刚才说过，义务的根据在于我们作为理性、合群、自我保存的存在者的本性。这不错，但需要展开。格劳秀斯并不把我们的本质设想为静态的；它们是动态的，体现着我们的能力与活动。这一点在他关于权利（*ius*，复数为 *iura*）的构想中有鲜明反映。他区分了 *iura* 的几种含义，其中最重要的一种把 *ius* 理解为“一个人的道德品质，它使人能够正当地拥有某物或做某事”（*DIB* I.1.4）。在格劳秀斯看来，*ius* 即权利，是行为者所具有的一种能力或力量；它是人的一种“官能”或“资质”（同上）。拥有 *ius*，就是有能力从事某些特定的行为而不受道德或法律制裁。因此，举例来说，当他赋予人以自我保存的权利时，他就是授予我们追求自身利益的力量，而无须国家或任何其他权威的许可或协助。由于权利以个体主体为中心，人们常会读到格劳秀斯提出了一种“主观权利”理论（例如见 Kingsbury & Roberts 1990: 31 及其所引文献）[^kingsbury-1990]。
    step2: |-
      先从一个与义务问题紧相关联的观念说起。前面说过，义务的根据在于我们作为理性、合群、自我保存的存在者所具有的本性。这话不错，但还需要申说。格劳秀斯所设想的人之本质不是静止的，而是动态的，表现为人的种种能力与活动。他关于权利（*ius*，复数 *iura*）的构想，正突出地体现了这一点。他分辨了 *iura* 的几重含义，其中最重要的一重把 *ius* 解作“人的一种道德品质，使人得以正当地拥有某物或做某事”（*DIB* I.1.4）。在格劳秀斯看来，*ius* 即权利，是行为者具有的一种能力或力量，是人的一种“官能”或“资质”（同上）。有 *ius*，就是有能力做某些特定的事而不受道德或法律的制裁。举例说，他赋予人自我保存的权利，就是赋予我们追求自身利益的力量，无须国家或任何其他权威的许可或帮助。权利既以个体主体为中心，论者便常说格劳秀斯提出的是一种“主观权利”理论（例如见 Kingsbury & Roberts 1990: 31 及其所引文献）[^kingsbury-1990]。
