      To philosophers and the philosophically-minded, two of these stand out: *De iure praedae commentarius* (*Commentary on the law of prize and booty*, henceforth referred to as “*DIP*”) and *De iure belli ac pacis* (“*DIB*”). The former was almost lost. Placed in a trunk sometime during or after his life, the sole manuscript copy was uncovered when some of his descendants sold a collection of his papers in 1864 (for an account of these events, see Knight 1925: Chap. 5 and van Ittersum 2006)[^knight-1925][^ittersum-2006]. It was apparently commissioned by the V.O.C. around 1603. In it, Grotius was to defend the capture of a large Portuguese merchant ship by a V.O.C. fleet in the area around modern-day Singapore. The key legal and conceptual question was whether any private agent (such as the V.O.C.) could legitimately employ force against another private agent which was impeding its actions (see Tuck 1993: 170)[^tuck-1993]. But it also had an important propagandistic objective, which was to defame the Portuguese (and Spanish) while extolling the V.O.C. and Dutch (for more on the general historical context of the *DIP*, see van Ittersum 2002)[^ittersum-2002]. Modern philosophical readers will find the “Prolegomena” of Chapter Two especially interesting, since that is where Grotius lays out his views on the nature and bases of rights. While Grotius chose not to publish this or most of the manuscript, he did see Chapter Twelve into press. Given the title *Mare Liberum* (*On the freedom of the seas*), it was both influential and controversial: among others, the Englishman John Selden published a critical reply.
    step1: |-
      对哲学家和爱好哲学的人来说，其中两部格外重要：*De iure praedae commentarius*（《捕获法评注》，下文简称“*DIP*”）和 *De iure belli ac pacis*（“*DIB*”）。前者几乎失传。它在他生前或身后的某个时候被放进一只箱子，唯一的手稿本直到 1864 年他的后人出售一批文稿时才被发现（关于这段经过，见 Knight 1925: Chap. 5 与 van Ittersum 2006）[^knight-1925][^ittersum-2006]。此书显然是荷兰东印度公司约在 1603 年委托撰写的。格劳秀斯要在书中为东印度公司舰队在今日新加坡一带俘获一艘葡萄牙大商船作辩护。关键的法律与概念问题是：任何私人主体（如东印度公司）是否可以合法地对另一个妨碍其行动的私人主体使用武力（见 Tuck 1993: 170）[^tuck-1993]。但此书还有一个重要的宣传目标，即诋毁葡萄牙人（以及西班牙人），同时颂扬东印度公司与荷兰人（关于 *DIP* 的一般历史背景，详见 van Ittersum 2002）[^ittersum-2002]。现代哲学读者会觉得第二章的“序言”特别有意思，因为格劳秀斯正是在那里阐述了他关于权利之性质与根据的看法。格劳秀斯决定不发表此书或书稿的大部分，但他确实让第十二章付梓。该章题为 *Mare Liberum*（《海洋自由论》），既有影响又引起争议：英格兰人约翰·塞尔登等人就出版了批驳文字。
