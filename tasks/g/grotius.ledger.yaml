      Whatever the merits of the *DIP*, it is on the *DIB* that the bulk of Grotius’ reputation rests. It consists of an introduction and three books, totaling more than 900 pages in translation. As with *DIP*, the introduction or “Prolegomena” holds the greatest interest for philosophers, for it is here that Grotius articulates and defends the philosophical foundations of the *DIB*. While philosophers are naturally attracted to the “Prolegomena”, the body of the *DIB* is also redolent with themes of philosophical interest. Book One defines the concept of war, argues for the legitimacy of war, and identifies who may legitimately wage war. Book Two deals with the causes of war, the origins of property, the transfer of rights and more, while Book Three is dedicated primarily to the rightful conduct of belligerents in war. After the initial publication in 1625, Grotius ushered several more editions to press during his life, each time adding more references without substantially changing the arguments. (A word of explanation about citations to the *DIB* they commonly take the form of book, chapter, section and—where applicable—paragraph; so, “I.1.10.1” means “Book One, Chapter One, Section Ten, Paragraph One”.)
    step1: |-
      无论 *DIP* 有何价值，格劳秀斯的名声大半系于 *DIB*。该书包括一篇导论与三卷正文，译本篇幅超过九百页。与 *DIP* 一样，导论即“序言”最能引起哲学家的兴趣，因为格劳秀斯在此阐明并捍卫 *DIB* 的哲学基础。哲学家自然偏爱“序言”，但 *DIB* 正文也处处可见哲学意味的论题。第一卷界定战争的概念，论证战争的正当性，并指明谁可以合法地发动战争。第二卷讨论战争的原因、所有权的起源、权利的转让等，第三卷则主要论交战方在战争中的正当行为。1625 年初版之后，格劳秀斯生前又推出数版，每次都增添引证，而未实质改动论证。（关于 *DIB* 的引证体例略作说明：通常依次标卷、章、节，必要时加段；因此“I.1.10.1”意为“第一卷第一章第十节第一段”。）
    step2: |-
      无论 *DIP* 价值如何，格劳秀斯的名声大半系于 *DIB*。此书由一篇导论与三卷正文构成，译本逾九百页。与 *DIP* 一样，最引哲学家注目的是导论即“序言”，格劳秀斯在此陈明并捍卫 *DIB* 的哲学基础。哲学家固然偏爱“序言”，*DIB* 正文也满是哲学意味的题目：第一卷界定战争的概念，论证战争可以正当，并指明谁有资格合法开战；第二卷论战争的原因、所有权的起源、权利的转让等；第三卷则专论交战方在战争中的正当行为。1625 年初版之后，格劳秀斯生前又陆续推出数版，每次都增补引证，论证则无实质改动。（*DIB* 的引证体例需略作说明：通常依卷、章、节标注，必要时再加段；故“I.1.10.1”意即“第一卷第一章第十节第一段”。）
