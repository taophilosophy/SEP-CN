      我们为什么要遵守自然法，或者说为什么要遵守任何一套规范，这是哲学里最经久的问题之一；以为在格劳秀斯那里就能找到答案，不免轻率。他这套论述有一处短处，其灵感恰来自黎塞留：格劳秀斯想把理性、社会与自利三类行动动机分开，并让它们并驾齐驱，但这些动机实际上是否彼此有别、是否势均力敌，大可存疑。倘若能证明其中一类比其他几类更为根本，比如说自利才是我们行动的头等理由，那么我们遵守自然法、做有德者的理由，便会与格劳秀斯的论证大相径庭。（进一步讨论见 Korsgaard 1996: 7, 21–22 与 28–30。）[^korsgaard-1996]
