      格劳秀斯公务繁忙，又要养育一大家人，其著作数量之多着实惊人。他早年出使法国那段时间就很典型。出使的同年，他出版了 *Pontifex Romanus*，收录六篇论近期政治事件的随笔。写作此书的同时，他还校订了两部作品，实质上等于做出了校勘本：一部是公元前三世纪索利的阿拉图斯的天文著作 *Phaenomena*，一部是马蒂亚努斯·卡佩拉的七艺手册。他还着手研究尼德兰史，这项研究很久以后成了 *Annales et Historiae de Rebus Belgicis*。这一切都是在他不到二十岁时做的。纵观一生，格劳秀斯撰写或编订了约六十部书稿，另有无数短篇。
