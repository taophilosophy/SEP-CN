      Here we find a very different account of the basis of obligation: we are obliged to perform or avoid certain actions which are incompatible with our consciences, because we will be guilty of inconsistency if we don’t. To put it in slightly different terms, we are obliged to perform or avoid certain actions which are compatible or incompatible with our natures as rational beings, because we will be less than human if we don’t. Grotius adopts this idea for himself, modifying it in keeping with his rich conception of human nature: for him, natural law obliges us to perform actions which conduce to our rationality, sociability and need for self-preservation. This thought underlies several of his specific laws of nature—such as, for instance, the law that evil deeds must be corrected. Grotius places this obligation under the heading of compensatory justice (*DIP*, Chap. Two). The “task of compensatory justice” is “restitution”: using the example of theft, Grotius explains that “such justice requires that the thing taken shall be returned” (ibid.). Evil deeds have disturbed the moral and legal equilibrium of society; they have unjustly benefited some while unjustly harming others. Since it is imperative to maintain healthy social relations, it is imperative that evil deeds be punished.
    step1: |-
      这里我们看到一种极为不同的义务根据说：我们有义务做或不做某些与良知相容或不相容的行为，因为若不如此，我们便犯有不一致的过失。换一种稍有不同的说法：我们有义务做或不做某些与我们作为理性存在者的本性相容或不相容的行为，因为若不如此，我们便不成其为人。格劳秀斯采纳了这一想法，并依其丰富的人性观加以修正：在他看来，自然法要求我们从事有助于理性、合群性与自我保存之需的行为。这一想法支撑着他的若干具体自然法，例如恶行必须纠正这条法。格劳秀斯把这项义务归入补偿正义（*DIP* 第二章）。“补偿正义的任务”是“返还”：格劳秀斯以盗窃为例解释说，“这种正义要求把取走的东西归还”（同上）。恶行扰乱了社会的道德与法律平衡；它们不正当地使一些人获益，同时不正当地损害另一些人。既然维持健康的社会关系势在必行，惩罚恶行也就势在必行。
