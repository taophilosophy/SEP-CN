      The problem of explaining why we should obey the laws of nature—or indeed, why we should obey any set of norms—is one of the most enduring in philosophy; it would be rash to suppose that a solution can be found in Grotius. One inadequacy of his account is inspired by Richelieu: while Grotius tries to separate and equalize our rational, social and self-interested motives for action, one may question whether they are in fact distinct and equal. If it can be shown that one is more fundamental than the others—that, say, self-interest is our first and most basic reason for action—then our reason for obeying the laws of nature and being moral will be very different from what Grotius argued. (For additional discussion, see Korsgaard 1996: 7, 21–22 and 28–30.)[^korsgaard-1996]
    step1: |-
      解释我们为什么应当遵守自然法（乃至为什么应当遵守任何一套规范）的问题，是哲学中最经久的问题之一；若以为在格劳秀斯那里能找到答案，未免轻率。他的论述有一处不足，其灵感正来自黎塞留：格劳秀斯试图把我们的理性动机、社会动机与自利动机区分开来并等量齐观，但人们可以质疑它们事实上是否彼此不同、是否分量相当。如果能表明其中一种比其他几种更为根本（比如说，自利是我们行动的首要而基本的理由），那么我们遵守自然法、做有德之人的理由，就会与格劳秀斯的论证大不相同。（进一步讨论见 Korsgaard 1996: 7, 21–22 与 28–30。）[^korsgaard-1996]
