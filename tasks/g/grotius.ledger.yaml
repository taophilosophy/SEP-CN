      Far from believing that war is a condition outside the realm of morality and law, Grotius took it to be an instrument of right (cf. Dumbauld 1969: 73)[^dumbauld-1969]. As he wrote, “where judicial settlement fails, war begins” (*DIB* II.1.2.1). Wars may be justly undertaken in response either to “wrongs not yet committed, or to wrongs already done” (ibid.). The list of wrongs which justify war is long, including the inflicting of punishment (ibid.), self-defense (II.1.3), the defense of chastity (II.1.7), etc. At the same time as he countenances war, Grotius does set limits, some of them controversial. For example, he argues that one doesn’t have the right to defend oneself against an assailant who is “useful to many” (II.1.9.1). This principle applies to both individuals and states. So it follows that both individuals and states may be obliged to acquiesce when attacked by someone important to society—whether the society of a single nation or the society of nations. Overall, it has been argued, what sets Grotius’ analysis of *ius ad bellum* apart from his predecessors is “in his detailed and systematic elaboration of the ‘just causes’ of war’” (Draper 1990: 194)[^draper-1990].
    step1: |-
      格劳秀斯绝不认为战争处于道德与法律的领域之外，而把它看作正义的工具（参 Dumbauld 1969: 73）[^dumbauld-1969]。他写道：“司法解决失败之处，战争便开始”（*DIB* II.1.2.1）。针对“尚未犯下的恶，或已经犯下的恶”，都可以正义地开战（同上）。使开战成为正当的恶行清单很长，包括施加惩罚（同上）、自卫（II.1.3）、保卫贞洁（II.1.7）等等。格劳秀斯一面容许战争，一面也设定界限，其中一些有争议。例如，他主张对“对许多人有用”的攻击者，人没有自卫的权利（II.1.9.1）。这一原则既适用于个人，也适用于国家。因此，无论个人还是国家，当被一个对社会重要的人攻击时，也许都得默然忍受；这里的“社会”，既可以是单一国家的社会，也可以是各国构成的社会。总的说来，如论者所言，格劳秀斯对 *ius ad bellum* 的分析区别于前人之处，在于“他对战争的‘正义理由’作了详细而系统的阐发”（Draper 1990: 194）[^draper-1990]。
    step2: |-
      格劳秀斯全然不认为战争在道德与法律的领域之外，而把它看作正义的工具（参 Dumbauld 1969: 73）[^dumbauld-1969]。他写道：“司法解决失败之处，战争便开始”（*DIB* II.1.2.1）。无论是“尚未犯下的恶”，还是“已经犯下的恶”，都可以正义地开战回应（同上）。使开战正当的恶行清单很长：施加惩罚（同上）、自卫（II.1.3）、保卫贞洁（II.1.7）等等。他一面容许战争，一面也设限，其中一些颇具争议。例如他主张，对“对许多人有用”的攻击者，人无自卫之权（II.1.9.1）。这条原则对个人与国家一视同仁：无论个人还是国家，遭到对社会重要者攻击时，也许都只得默然忍受；这里的“社会”，可以是单一国家的社会，也可以是各国共同的社会。总的说来，如论者所言，格劳秀斯的 *ius ad bellum* 分析之所以区别于前人，在于“他对战争的‘正义理由’作了详细而系统的阐发”（Draper 1990: 194）[^draper-1990]。
