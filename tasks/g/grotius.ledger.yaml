      So Grotius’ influence was felt on some of the major actors of his day. Naturally, though, his main impact was on other scholars. Bayle called him “one of the greatest men in Europe” (1720 [1740: 2.614]). Leibniz hailed “the incomparable Hugo Grotius” (see Leibniz 1710 [1985], 77)[^leibniz-1710]. Thomas Reid spoke of “the immortal Hugo Grotius” (see Reid 1788 [1815], 331)[^reid-1788], Hutcheson drew on him extensively, and Hume approvingly cited an argument of his about the origins of property in the third appendix of his second *Enquiry* (see Hume 1748 [1975], 307)[^hume-1748]. To be sure, not all were so impressed. Rousseau’s opinion has already been cited; the natural law theorist Samuel Pufendorf was also sceptical. And Voltaire found Grotius to be simply boring. Still, whether for good or for ill, Grotius was at the center of letters for an enviably long time. For a brief synopsis of Grotius’ influence, focusing on the *DIB* , see Tuck (2005: ix–xii).
    step1: |-
      可见格劳秀斯的影响及于他那个时代的一些重要人物。不过，他的主要影响自然还是在其他学者身上。培尔称他为“欧洲最伟大的人物之一”（1720 [1740: 2.614]）。莱布尼茨盛赞“无与伦比的胡果·格劳秀斯”（见 Leibniz 1710 [1985], 77）[^leibniz-1710]。托马斯·里德谈到“不朽的胡果·格劳秀斯”（见 Reid 1788 [1815], 331）[^reid-1788]；哈奇森大量取资于他；休谟在其第二部《研究》的第三篇附录中赞许地引用了格劳秀斯关于财产起源的一个论证（见 Hume 1748 [1975], 307）[^hume-1748]。当然，并非人人都如此看重他。卢梭的意见前已引及；自然法理论家萨穆埃尔·普芬道夫也持怀疑态度。伏尔泰则觉得格劳秀斯简直乏味。尽管如此，无论出于好意还是恶意，格劳秀斯在很长一段时期里居于文坛的中心，其久长令人艳羡。关于格劳秀斯影响（尤以 *DIB* 为线索）的简要概述，见 Tuck (2005: ix–xii)。
