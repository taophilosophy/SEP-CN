      Prison escapee, high-stakes politician, shipwreck survivor, Grotius was a remarkable man who led a remarkable life. Born on 10 April 1583 in Delft, Holland—Easter Sunday, as his biographers invariably note—his family was moderately prosperous, well-educated and ambitious. From these nourishing if not particularly distinguished origins, Grotius soon proved himself exceptional. When he was eight, he began writing skillful elegies in Latin; by eleven, he was a student in the Faculty of Letters at the University of Leiden. In 1598, at the tender age of fifteen, he accompanied the leading Dutch politician of the day, Johan van Oldenbarnevelt, on an embassy to the royal court of France. There King Henry IV, impressed by his extraordinary learnedness, hailed him as “the miracle of Holland”. And three years later, when the United Provinces decided to reinforce their autonomy from Spain by retaining an official Latin historiographer to chronicle their history, they chose Grotius over Dominicus Baudius, a full professor of rhetoric at Leiden, for the position.
    step1: |-
      越狱者、高风险的政治家、海难幸存者，格劳秀斯是个非凡的人，度过了非凡的一生。1583 年 4 月 10 日他生于荷兰代尔夫特，那天是复活节星期日，他的传记作者们总要提到这一点。他的家庭小康、受过良好教育且雄心勃勃。出身于这样虽不显赫却足以滋养人的环境，格劳秀斯很快就显得出类拔萃。八岁时，他已能用拉丁文写出漂亮的哀歌；十一岁时，他已是莱顿大学文学院的学生。1598 年，年方十五的他随当时荷兰政坛的领袖约翰·范·奥尔登巴内费尔特出使法国宫廷。法国国王亨利四世惊叹于他的博学，称他为“荷兰的奇迹”。三年后，联合省决定设置一名官方拉丁文编年史家来记述本邦历史，以加强其相对于西班牙的自主地位；结果他们选中格劳秀斯，而未取莱顿大学修辞学正教授多米尼库斯·鲍杜斯。
    step2: |-
      他是越狱的囚徒、押上重注的政治家、海难的幸存者；格劳秀斯一生跌宕，其人非同寻常。1583 年 4 月 10 日，他生于荷兰代尔夫特，恰逢复活节星期日——这一点他的传记作者从不肯略过。他家境小康，家学良好，又志在进取。这样虽不显赫却足以涵养人的出身，很快就衬出格劳秀斯的卓异：八岁能作漂亮的拉丁文哀歌，十一岁已入莱顿大学文学院读书。1598 年，十五岁的他随当时荷兰政坛领袖约翰·范·奥尔登巴内费尔特出使法国宫廷。亨利四世叹服于他的博学，称他是“荷兰的奇迹”。三年后，联合省为彰显其对西班牙的自主，决定设一名官方拉丁文编年史家撰述本邦史事；人选落在格劳秀斯身上，压过了莱顿大学修辞学正教授多米尼库斯·鲍杜斯。
