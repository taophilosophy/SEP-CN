      There is a different gauge of Grotius’ originality in the domain of politics. Through his writings, he gave rise to a theory of statehood and the relations among states which has come to be known as, simply, “Grotian” (the labels are used by Wight (1991), among others). This theory is an account of the origins and identity conditions of states. It conceives of states as existing not in a pre- or anti-social condition but rather in an international society governed by a system of norms. Those norms hold apart from a positive action by a legislature or legislator. At the same time as it insists on the existence and relevance of these norms (which are, of course, the laws of nature), it is also cognizant of the force of real politick. Individual states will engage in the pursuit of their own perceived interests, regardless of whether such pursuits place them in conflict with the natural law. By doing all of this, the Grotian school is supposed to negotiate a middle way between bare-knuckled “Machiavellianism” and excessively idealistic “Kantianism” (for more, see Wight together with the criticisms in Bull 1976)[^bull-1976]. Depending on the fortunes of these schools at any particular moment in history, Grotius’ influence on international relations will be waxing or waning.
    step1: |-
      格劳秀斯的原创性在政治领域还有一个不同的衡量尺度。他的著作催生了一种关于国家性以及国家间关系的理论，人们径称之为“格劳秀斯式”（Wight (1991) 等人使用这一标签）。这一理论说明国家的起源与身份条件。它把国家设想为并非存在于前社会或反社会状态中，而是存在于一个由规范体系支配的国际社会之中。这些规范不依赖立法机关或立法者的实定行为而成立。该理论一面坚持这些规范（当然就是自然法）的存在与相关性，一面也认识到现实政治的力量。个别国家会追求自己所认定的利益，而不论这种追求是否使它们与自然法相冲突。凡此种种，使格劳秀斯学派得以在赤裸裸的“马基雅维利主义”与过于理想化的“康德主义”之间开辟一条中间道路（详见 Wight，以及 Bull 1976 的批评）[^bull-1976]。格劳秀斯对国际关系的影响是盈是亏，取决于这些学派在历史某一时刻的运势。
    step2: |-
      衡量格劳秀斯在政治领域的原创性，还有一个尺度。他的著作催生了一套关于国家之为国家、国家之间关系的理论，人们径称之为“格劳秀斯式”（Wight (1991) 等即用此名）。这套理论解说国家的起源与身份条件：它设想国家不在前社会状态或反社会状态之中，而在一个由规范体系支配的国际社会之中；这些规范无须立法机关或立法者的实定行为即告成立。理论一面坚持这些规范（自然法，当然）的存在与相关性，一面也识得现实政治的力量：个别国家总会追求自己所认定的利益，哪怕与自然法相扞格。如此，格劳秀斯学派便被认为在赤裸裸的“马基雅维利主义”与过分理想化的“康德主义”之间取了一条中道（详见 Wight，以及 Bull 1976 的批评）[^bull-1976]。至于格劳秀斯对国际关系的影响是盛是衰，则取决于这些学派在历史某一时刻的运势。
