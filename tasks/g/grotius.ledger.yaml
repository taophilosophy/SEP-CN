      Grotius extends the case elsewhere, insisting that a people may give their rights to a ruler, receiving a peaceful and stable society in return (*DIB* I.4.2.1). But what are the limits placed on the ruler who has taken possession of these rights? To some readers, Grotius’ willingness to allow agents to transfer their rights leaves him open to charges of befriending despots. Provided that the initial transfer of rights was legitimate, then once the ruler is in possession of rights, those living under him or her have no right to complain that certain forms of behavior are unjust, for they have no relevant rights at all. As Rousseau put it, Grotius “spares no pains to rob the people of all their rights and invest kings with them” (*Social Contract*, Book II, Chapter Two). To be sure, other readers denied that Grotius’ theory allowed agents a total transfer of their rights; in particular, they contended that agents will always retain their fundamental rights, such as the right of self-defense (see Locke as interpreted by Tuck 1979: 172–3)[^tuck-1979]. Nevertheless, whatever the theory itself actually implies, it remains that Grotius himself seems to have believed that agents may surrender all liberties in certain circumstances (for more, see *DIB* I.3.9–16).
    step1: |-
      格劳秀斯在别处进一步申说此意，坚称人民可以把权利交给统治者，换得一个和平安稳的社会（*DIB* I.4.2.1）。可是，握有这些权利的统治者又受什么限制？在一些读者看来，格劳秀斯容许主体转让其权利，就难免有袒护暴君之嫌。只要最初的权利转让是合法的，那么一旦统治者握有权利，生活在其治下的人便无权抱怨某些行为不义，因为他们根本没有相关的权利。正如卢梭所说，格劳秀斯“不遗余力地剥夺人民的一切权利，把它们交给国王”（《社会契约论》第二卷第二章）。诚然，也有别的读者否认格劳秀斯的理论容许主体把权利完全转让；他们特别主张，主体永远保有根本权利，例如自卫权（见 Tuck 1979: 172–3 对洛克的解读）[^tuck-1979]。然而，无论理论本身实际蕴含什么，格劳秀斯本人似乎相信，主体在某些情况下可以放弃全部自由，这一点仍然成立（详见 *DIB* I.3.9–16）。
