      This time, he went to Hamburg, Germany. Nearby Sweden (one of the superpowers of the day) had numerous connections to the city, which made it quite natural for Swedish authorities to notice the presence and availability for hire of such a luminary. Moving to take advantage of the situation, they made him their Ambassador to France in 1634. Grotius began his diplomatic duties in Paris the following year. It is hard to gauge his success as ambassador: while he did help to negotiate a treaty which led to the end of the Thirty Years’ War, he could also be outmaneuvered in the diplomatic game—at one point, his bumbling forced the Swedish Chancellor Axel Oxenstierna to come to Paris and sort things out. Still, such stories notwithstanding, it is true that he lasted ten years in one of the highest and most demanding diplomatic postings of his day.
    step1: |-
      这一次他去了德意志的汉堡。近旁的瑞典（当时的超级大国之一）与这座城市联系众多，瑞典当局自然不难注意到这样一位人物就在此地、可以聘用。他们抓住机会，于 1634 年任命他为驻法国大使。格劳秀斯次年在巴黎开始履行外交职务。他做大使是否成功，很难衡量：他确实参与谈判了一项条约，促成了三十年战争的结束；但他在外交博弈中也常被人算计，有一次他的笨拙迫使瑞典首相阿克塞尔·奥克森谢尔纳亲赴巴黎收拾局面。尽管如此，尽管有这类传闻，他在当时最高、最艰巨的外交职位之一上确实干了十年。
    step2: |-
      这次他去了德意志的汉堡。近处的瑞典是当时的超级大国之一，与汉堡往来密切，瑞典当局自然不难听说这样一位人物就在近旁，可以礼聘。他们抓住时机，1634 年任命他为驻法国大使。次年，格劳秀斯在巴黎开始履职。他当大使是否成功，实在难以评说：他确实参与谈判了一项促成三十年战争终结的条约；可他在外交场上也屡屡受制于人，有一次还因行事笨拙，逼得瑞典首相阿克塞尔·奥克森谢尔纳亲赴巴黎收拾残局。尽管有这类故事，他在当时最高、最艰巨的外交职位之一上毕竟撑持了十年。
