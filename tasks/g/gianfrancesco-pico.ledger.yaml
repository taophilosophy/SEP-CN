      There has long been a debate about the extent of Gianfrancesco’s intervention in his uncle’s works. The doubt has particularly concerned the *Disputationes adversus astrologiam divinatricem*, in which Giovanni attacked the claims of validity of judicial astrology, denying that the stars influence human and earthly life and determine its fate. This text was of great interest to Gianfrancesco, who shared his uncle’s position (Akopyan 2019)[^akopyan-2019], but also to Savonarola, who composed a compendium in the vernacular of the *Disputationes*, entitled *Trattato contra gli astrologi* (“Treatise against the Astrologers”). It has been supposed that Savonarola’s *Treatise* was composed a year before the publication of the *Disputationes*, which would testify to his early acquaintance with Giovanni and Gianfrancesco Pico (Farmer 1998: 174–176; Bacchelli 2008: 143–144)[^bacchelli-2008][^farmer-1998]. Farmer (1998: 151–179) has been the most open supporter of the thesis that Gianfrancesco intervened heavily in the corpus of Giovanni’s works, suppressing portions of the *Commentaries on the Psalms* and the 900 *Conclusiones*, which Giovanni intended to discuss publicly in Rome in 1487. Others (Bacchelli 2008: 147)[^bacchelli-2008] take a more doubtful position regarding Gianfrancesco’s alleged emendation of Giovanni’s corpus. More recently (Pappalardo 2018)[^pappalardo-2018], it has been argued that Gianfrancesco did not, in fact, intervene in his uncle’s works.
    step1: |-
      关于詹弗朗切斯科对叔父著作干预到什么程度，历来有争论。疑议尤其集中在《驳占星术的论辩》，乔瓦尼在其中攻击判命占星术的有效性主张，否认星辰影响人与地上的生活并决定其命运。此文对詹弗朗切斯科大有吸引力，因为他赞同叔父的立场（Akopyan 2019）[^akopyan-2019]；对萨伏那洛拉亦然，后者用俗语为此书编了一部提要，题为《驳占星家论》（*Trattato contra gli astrologi*）。有人推测，萨伏那洛拉的《论》成书于《论辩》出版前一年，果真如此，便可证明他早就结识皮科叔侄（Farmer 1998: 174–176; Bacchelli 2008: 143–144）[^bacchelli-2008][^farmer-1998]。Farmer（1998: 151–179）是最公开支持下述论点的学者：詹弗朗切斯科大量干预了乔瓦尼的著作全集，删削了《诗篇注释》与 900 条《结论》的若干部分，而后者是乔瓦尼打算 1487 年在罗马公开讨论的。另一些学者（Bacchelli 2008: 147）[^bacchelli-2008] 对詹弗朗切斯科曾否校改叔父全集持更为怀疑的态度。更晚近的研究（Pappalardo 2018）[^pappalardo-2018] 则主张，詹弗朗切斯科其实并未干预叔父的著作。
    step2: |-
      詹弗朗切斯科究竟在多大程度上插手了叔父的著作，历来聚讼。疑点尤其集中在《驳占星术的论辩》：乔瓦尼在那里攻击判命占星术的有效性，否认星辰能影响人间与地上的生活、决定人的命运。此书詹弗朗切斯科很感兴趣，因为他与叔父立场相同（Akopyan 2019）[^akopyan-2019]；萨伏那洛拉亦然，他用俗语为此书编了一部提要，题为《驳占星家论》（*Trattato contra gli astrologi*）。有人推测，萨伏那洛拉这部《论》成于《论辩》刊行前一年；若果然如此，便可见他早已结识皮科叔侄（Farmer 1998: 174–176; Bacchelli 2008: 143–144）[^bacchelli-2008][^farmer-1998]。Farmer（1998: 151–179）最鲜明地主张：詹弗朗切斯科曾大肆改动乔瓦尼的全集，删去《诗篇注释》与 900 条《结论》的若干段落——后者本是乔瓦尼打算 1487 年在罗马公开讨论的。另有学者（Bacchelli 2008: 147）[^bacchelli-2008] 对他是否校改过叔父全集持怀疑态度。晚近的研究（Pappalardo 2018）[^pappalardo-2018] 则认为，詹弗朗切斯科其实并未动过叔父的著作。
