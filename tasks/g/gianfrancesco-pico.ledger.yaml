      The distinction between true and false prophecy is at the heart of *De rerum praenotione* (Vasoli 2006: 524–538)[^vasoli-2006]. In this work, Gianfrancesco argues that the noblest prophecy is that which does not require any corporeal support; at the same time, however, he maintains the possibility that images of future things are formed in the organ of imagination and that some kind of knowledge of the future can be obtained through natural means (II, 1). In several of his works, he thus tempers instances offered by the philosophical tradition and concepts considered more suitable to Christian doctrine. The first book of *De rerum praenotione* is concerned with the definition of prenotion or foreknowledge, that is, the ability to predict the future. He insists that prophecy must be clearly distinguished from superstition and that prediction can also be abused, especially when it is practiced by false prophets. The second book is dedicated to contesting medieval philosophical theories. Gianfrancesco focuses above all on important exponents of Arab philosophy: Avicenna, who spoke of prophecy and the receptive role of the imagination; al-Ghazali, who proposed a theological reading of philosophical issues related to prediction of the future; and Averroes, who discussed the premonitory function of the soul based on Aristotelian texts. Gianfrancesco’s intent is, in any case, to demonstrate that there are different ways to predict the future. The third book of *De rerum praenotione* deals with prediction carried out by natural means. Among the species of premonition of this type, Gianfrancesco lists the ability of farmers, sailors, and doctors to predict the effects starting from the causes or from certain significant signs. In this case, the prediction is the result of the possession of a specific art, and this does not make it invalid. Gianfrancesco’s polemical target is instead mendacious prophecy, which seeks to replace divinely inspired prophecy and is produced by demons. The fourth book consequently focuses on idolatry and superstition. The fifth book contains a powerful criticism of astrology, based in part on arguments already elaborated by Giovanni Pico in his *Disputationes*. Gianfrancesco wrote a short compendium of this book in 1510, known as *Quaestio de falsitate astrologiae* (“Question on the Falsity of Astrology”) (Cavini 1973)[^cavini-1973]. This *Quaestio* is relevant to the general assessment of the progress of Gianfrancesco’s thought, as it contains the first explicit attestation of his interest in Sextus Empiricus, which would later be put fully into practice in the *Examen vanitatis*. The sixth book examines chiromancy, geomancy, haruspicy, and everything that Gianfrancesco, by his own definition, calls “superstitious”. Dreams considered premonitory also fall into this category. In the seventh book, Gianfrancesco devotes considerable attention to contesting magical practice. Here he takes a historical perspective, putting forward significant criticisms of Proclus’ Neoplatonism and of al-Kindī’s theory of the rays emanating from the body of the sorcerer. Al-Kindī’s theory of rays, which was influential up to the Renaissance, was adapted by Marsilio Ficino, based on the productive function of the inner faculties of the soul (especially, the imagination), combining it with Avicennian doctrines within a Neoplatonic theoretical framework. Fighting against such theorizations, Gianfrancesco attempted to demonstrate that magic was demonic and, hence, despicable. Ficino is, in fact, a polemical target of Gianfrancesco in several of his works (Granada 1997; Walker 1958 [2000: 146–150]; Molinarolo 2022: 133–152)[^granada-1997][^molinarolo-2022][^walker-1958], also and above all for his conception of natural religion, proposed in *De Christiana religione* (“On the Christian Religion”) and already contested by Gianfrancesco in *De imaginatione*. Other polemical targets of his are Pietro d’Abano, certain exponents of the medieval Jewish philosophical tradition, including Maimonides (Bacchelli 2001: 22–24)[^bacchelli-2001], and several Eastern ethical-religious traditions (Hindus, Brahmins, and Gymnosophists). The eighth and ninth books contain a confirmation of the argument conducted throughout the work: the preeminence, rectitude and purity of divine prophecy.
    step1: |-
      真预言与假预言之别，是《论事物的预知》的核心（Vasoli 2006: 524–538）[^vasoli-2006]。在这部作品中，詹弗朗切斯科主张最高贵的预言无须任何形体上的凭借；但同时又坚持，未来之物的影像可以在想象器官中形成，且可借自然手段获得某种关于未来的知识（II, 1）。他在好几部著作中都如此调和哲学传统所提供的要素与他认为更合于基督教教义的概念。《论事物的预知》第 1 卷讨论预知或先见的定义，即预测未来的能力。他坚持预言必须与迷信清楚区分，并指出预测也可能被滥用，尤其当它出自假先知之时。第 2 卷专门驳斥中世纪哲学理论。詹弗朗切斯科尤其着力于阿拉伯哲学的重要代表：伊本·西那（阿维森纳）论述过预言与想象官能的接受作用；安萨里提出对与预测未来相关的哲学问题作神学解读；阿威罗伊则依据亚里士多德文本讨论灵魂的预兆功能。无论如何，詹弗朗切斯科的意图在于证明预测未来有种种不同的方式。《论事物的预知》第 3 卷讨论借自然手段所作的预测。在此类预感的诸多种类中，詹弗朗切斯科举出农人、水手与医生从原因或某些有意义征兆出发预测结果的能力。在这种情况下，预测是掌握某门专门技艺的结果，这并不使它失效。詹弗朗切斯科的论战靶子反倒是虚妄的预言，那种预言企图取代受神启发的预言，由恶魔所产生。第 4 卷因此集中于偶像崇拜与迷信。第 5 卷包含对占星术的有力批评，部分依据乔瓦尼·皮科在《论辩》中已提出的论证。詹弗朗切斯科 1510 年为此卷写了一部简短的提要，即《论占星术之虚妄》（*Quaestio de falsitate astrologiae*）（Cavini 1973）[^cavini-1973]。这部《论》对总体评估詹弗朗切斯科思想的进展颇有意义，因为它包含他对塞克斯都·恩披里柯感兴趣的最早明确证据，而这一兴趣后来在《虚妄之检验》中得到充分实践。第 6 卷考察手相术、土占术、肠卜术，以及一切被詹弗朗切斯科自己称为“迷信”的东西。被视为预兆的梦也归入此类。第 7 卷中，詹弗朗切斯科用了相当篇幅驳斥魔法实践。他在这里采取历史视角，对普罗克洛斯的新柏拉图主义以及肯迪关于术士体内发出光线的理论提出重要批评。肯迪的光线说影响及于文艺复兴，马尔西利奥·费奇诺曾依据灵魂内部诸能力（尤其是想象）的生产性功能对它加以改造，并在新柏拉图主义的理论框架内把它与伊本·西那的学说结合起来。针对这类理论建构，詹弗朗切斯科力图证明魔法是恶魔性的，因而可鄙。事实上，费奇诺正是詹弗朗切斯科好几部著作的论战靶子（Granada 1997; Walker 1958 [2000: 146–150]; Molinarolo 2022: 133–152）[^granada-1997][^molinarolo-2022][^walker-1958]，尤其且首要的是因为费奇诺在《论基督教》（*De Christiana religione*）中提出的自然宗教构想——詹弗朗切斯科在《论想象》中已对此作过驳难。他的其他论战对象还有彼得罗·达巴诺、中世纪犹太哲学传统的一些代表人物（包括迈蒙尼德）（Bacchelli 2001: 22–24）[^bacchelli-2001]，以及若干东方伦理宗教传统（印度人、婆罗门与裸形智者）。第 8、9 两卷则确认了贯穿全书的论点：神圣预言的优越、正直与纯洁。
