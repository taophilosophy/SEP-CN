      In his endeavor to promote the prosperity of Christianity and the Roman Church, Gianfrancesco strove to influence the pope, expressing his opinions on ecclesiastical politics. The content of the *Oratio de reformandis moribus* is consistent with the ethical dimension emphasized by Gianfrancesco in his earlier works. In the *Oratio*, he addresses Pope Leo X, encouraging him to reform the Church. According to Gianfrancesco, the Church of his time is prey to every kind of evil, willed by God, who communicates his will through signs, warnings and natural disasters. This thread also runs through *De veris causis calamitatum nostrorum temporum* (Schmitt 1970)[^schmitt-1970]. According to both of these short works, the path to salvation consists in embracing virtue. Gianfrancesco’s criticism of the clergy as no longer an example of sanctity and moral rectitude ensured that his *Oratio* would exert an influence in the Protestant world of the early modern age.
