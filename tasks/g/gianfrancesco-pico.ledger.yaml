      真预言与假预言之别，是《论事物的预知》的核心（Vasoli 2006: 524–538）[^vasoli-2006]。詹弗朗切斯科主张，最高贵的预言无须任何形体凭借；同时又坚持，未来之物的影像可在想象器官中形成，人也能借自然手段获得某种关于未来的知识（II, 1）。他在多部著作里都这样调和：一边是哲学传统提供的要素，一边是他认为更合基督教教义的概念。《论事物的预知》第 1 卷界定预知或先见，即预测未来的能力。他坚持预言须与迷信判然相别，并指出预测也会被滥用，出自假先知时尤其如此。第 2 卷专驳中世纪哲学理论，着力于阿拉伯哲学的要角：伊本·西那（阿维森纳）论预言与想象官能的接受作用；安萨里对预测未来所涉哲学问题作神学解读；阿威罗伊依亚里士多德文本讨论灵魂的预兆功能。无论如何，他要证明的是：预测未来方式不一而足。第 3 卷讨论借自然手段所作的预测。这类预感中，他举出农人、水手、医生从原因或某些有意义的征兆推知结果的能力；此时预测出于专门技艺，并不因此失效。他真正的靶子是虚妄的预言——那种想取代受神启发之预言、由恶魔生出的东西。第 4 卷因此集中于偶像崇拜与迷信。第 5 卷对占星术大加批评，部分依据乔瓦尼·皮科在《论辩》中已提的论证。詹弗朗切斯科 1510 年为此卷作了一部简短提要，即《论占星术之虚妄》（*Quaestio de falsitate astrologiae*）（Cavini 1973）[^cavini-1973]。这部《论》对评估其思想进程颇为要紧：其中最早明确显示他对塞克斯都·恩披里柯的兴趣，而这兴趣后来在《虚妄之检验》中充分施展。第 6 卷考察手相术、土占术、肠卜术，以及一切他自称为“迷信”的东西，被视为预兆的梦也在其内。第 7 卷用相当篇幅驳斥魔法实践。他从历史着眼，批评普罗克洛斯的新柏拉图主义，也批评肯迪关于术士体内发出光线的理论。肯迪的光线说影响及于文艺复兴：马尔西利奥·费奇诺依灵魂内部诸能力（尤其是想象）的生产性功能加以改造，并在新柏拉图主义框架内与伊本·西那的学说相合。针对这类建构，詹弗朗切斯科力证魔法属恶魔之事，因而可鄙。费奇诺正是他多部著作的靶子（Granada 1997; Walker 1958 [2000: 146–150]; Molinarolo 2022: 133–152）[^granada-1997][^molinarolo-2022][^walker-1958]，尤其因为费奇诺在《论基督教》（*De Christiana religione*）中提出的自然宗教构想——詹弗朗切斯科在《论想象》里已驳难过。其他靶子还有彼得罗·达巴诺、中世纪犹太哲学传统的一些代表（包括迈蒙尼德）（Bacchelli 2001: 22–24）[^bacchelli-2001]，以及若干东方伦理宗教传统（印度人、婆罗门与裸形智者）。第 8、9 两卷确认贯穿全书的论点：神圣预言的优越、正直与纯洁。
