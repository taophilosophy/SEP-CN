      *De imaginatione* (“On the Imagination”), published in Venice by Aldus Manutius in 1501, belongs to the period of tension over the claims to the dominions of Mirandola. Gianfrancesco’s dedication to the Habsburg Emperor Maximilian I contains, in addition to praise and an attestation of submission, a request for support and assistance against the enemies of the faith and traitors. After being expelled from Mirandola, Gianfrancesco traveled to Germany, where he came into contact with figures such as Willibald Pirckheimer, Johann Reuchlin and Conrad Peutinger. As his letters testify (Schmitt 1967: 23; see also Cao 2004)[^cao-2004][^schmitt-1967], it was on account of these acquaintances that his works were published in Germany. In 1506–1507 a collection of Gianfrancesco’s texts was printed in Strasbourg; it contained, in addition to already published works, the first edition of *De rerum praenotione* (“On the Foreknowledge of Things”), the *Theoremata de fide et ordine credendi* (“Theorems on Faith and the Order of Believing”), the *Staurostichon*, a poem on the mysteries of the cross, along with a collection of letters, translations and exegeses of works by Justin Martyr and Hilary of Poitier. Other works published during his years of exile are the *Hymni heroici tres* (“Three Heroic Hymns”) and two other poems, which came out in Milan in 1507. In 1508 he published in Novi *De providentia Dei contra philosophastros* (“On God’s Providence against the Sham Philosophers”).
    step1: |-
      《论想象》（*De imaginatione*）1501 年由阿尔杜斯·马努提乌斯在威尼斯出版，属于米兰多拉领地之争的紧张时期。詹弗朗切斯科献给哈布斯堡皇帝马克西米利安一世的题献，除了颂扬与效忠的表白之外，还请求给予支持与援助，以对抗信仰的敌人与叛徒。被逐出米兰多拉之后，詹弗朗切斯科前往德意志，在那里结识了维利巴尔德·皮尔克海默、约翰·罗伊希林与康拉德·波伊廷格等人。正如他的书信所证（Schmitt 1967: 23; see also Cao 2004）[^cao-2004][^schmitt-1967]，正是由于这些交谊，他的著作才在德意志出版。1506–1507 年，一部詹弗朗切斯科文集在斯特拉斯堡印行；除已刊著作之外，其中还收有《论事物的预知》（*De rerum praenotione*）的初版、《论信仰与信从次序的定理》（*Theoremata de fide et ordine credendi*）、长诗《十字架诗》（*Staurostichon*，咏十字架奥迹），以及一批书信、译作和对殉道者查士丁与普瓦捷的希拉里著作的注释。流亡年间刊行的其他著作，还有《英雄颂歌三首》（*Hymni heroici tres*）与另外两首诗，1507 年在米兰问世。1508 年，他在诺维刊行《论上帝的神意：驳伪哲学家》（*De providentia Dei contra philosophastros*）。
