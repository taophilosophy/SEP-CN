      Linked to Savonarola’s preaching activity are Gianfrancesco’s *De morte Christi et propria cogitanda* (“On Reflecting on the Death of Christ and One’s Own Death”), written in 1496, and *De studio divinae et humanae philosophiae* (“On the Study of Divine and Human Philosophy”), both published in Bologna in 1497 (the latter is dedicated to Savonarola). In these works, Gianfrancesco makes explicit his distrust of philosophy, which he considers uncertain. At the same time, he regards the figure of Christ as the incarnation of divine wisdom and revelation as the best instrument to access the truth, unattainable by human thought. These works, which anticipate the most radical results of Gianfrancesco’s masterpiece, the *Examen vanitatis doctrinae gentium et veritatis Christianae disciplinae* (“Examination of the Vanity of Pagan Doctrine and the Truth of the Christian Discipline”), published in 1520, were influenced by Savonarola’s own skeptical attitude (Popkin 2003: 6–7)[^popkin-2003]. Savonarola was burned at the stake in 1498; but even before his death Gianfrancesco had worked to defend the friar’s reputation, publishing several texts against the attacks on him and against his excommunication: *Defensio Hieronymi Savonarolae adversus Samuelem Cassinensem* (“Defense of Girolamo Savonarola against Samuel of Cassino”, 1497); *Opusculum de sententia excommunications iniusta pro Hieronymi Savonarolae innocentia* (“Brief Work on the Unjust Sentence of Excommunication and in Support of the Innocence of Girolamo Savonarola”, 1498); *Epistola in favore de fra Hieronymo da Ferrara dappoi la sua captura* (“Letter in Favor of Brother Girolamo of Ferrara after His Capture”, 1498). Gianfrancesco also wrote a famous biography of Savonarola, which was revised over the years up to 1530, but which remained in manuscript until it appeared in print for the first time in Paris in 1674.
    step1: |-
      与萨伏那洛拉的布道活动相关的，是詹弗朗切斯科的《论思考基督之死与自身之死》（*De morte Christi et propria cogitanda*，作于 1496 年）与《论神圣哲学与人间哲学的研究》（*De studio divinae et humanae philosophiae*），两书均于 1497 年在博洛尼亚出版（后者献给萨伏那洛拉）。在这些著作中，詹弗朗切斯科明言他对哲学的不信任，认为哲学不可靠。同时，他把基督其人视为神圣智慧的化身，把启示视为通达真理的最佳工具，而真理是人的思想无法达到的。这些著作预示了詹弗朗切斯科代表作《检查异教教义之虚妄与基督教教义之真理》（*Examen vanitatis doctrinae gentium et veritatis Christianae disciplinae*，1520 年出版）最激进的结果，并受到萨伏那洛拉本人怀疑态度的启发（Popkin 2003: 6–7）[^popkin-2003]。萨伏那洛拉于 1498 年被火刑处死；但早在他死前，詹弗朗切斯科就已着手维护这位修士的名誉，刊行若干文字，反击对他的攻击与对他的绝罚：《为吉罗拉莫·萨伏那洛拉驳卡西诺的撒母耳》（*Defensio Hieronymi Savonarolae adversus Samuelem Cassinensem*，1497）；《论不公正的绝罚判决兼为吉罗拉莫·萨伏那洛拉的无辜辩护小作》（*Opusculum de sententia excommunications iniusta pro Hieronymi Savonarolae innocentia*，1498）；《为费拉拉的吉罗拉莫修士被捕事致书》（*Epistola in favore de fra Hieronymo da Ferrara dappoi la sua captura*，1498）。詹弗朗切斯科还写了一部著名的萨伏那洛拉传记，此后逐年修订，至 1530 年，但一直以手稿形式留存，直到 1674 年才首次在巴黎印行。
    step2: |-
      与萨伏那洛拉的布道活动相联的，是詹弗朗切斯科的两部书：《论思考基督之死与自身之死》（*De morte Christi et propria cogitanda*，1496 年作）与《论神圣哲学与人间哲学的研究》（*De studio divinae et humanae philosophiae*），皆于 1497 年在博洛尼亚刊行，后者献给萨伏那洛拉。书中他明言不信任哲学，认为哲学靠不住；同时把基督视为神圣智慧的化身，把启示视为通达真理的最佳工具——那真理是人的思想所达不到的。这两部书预示了其代表作《检查异教教义之虚妄与基督教教义之真理》（*Examen vanitatis doctrinae gentium et veritatis Christianae disciplinae*，1520 年刊）最激进的结论，也受萨伏那洛拉怀疑态度的启发（Popkin 2003: 6–7）[^popkin-2003]。萨伏那洛拉 1498 年被火刑处死；但在他死前，詹弗朗切斯科已在维护这位修士的名誉，刊行多种文字反击对他的攻击与绝罚：《为吉罗拉莫·萨伏那洛拉驳卡西诺的撒母耳》（*Defensio Hieronymi Savonarolae adversus Samuelem Cassinensem*，1497）；《论不公正的绝罚判决兼为吉罗拉莫·萨伏那洛拉的无辜辩护小作》（*Opusculum de sententia excommunications iniusta pro Hieronymi Savonarolae innocentia*，1498）；《为费拉拉的吉罗拉莫修士被捕事致书》（*Epistola in favore de fra Hieronymo da Ferrara dappoi la sua captura*，1498）。他还写了一部萨伏那洛拉传，颇有名，此后逐年修订至 1530 年，却始终以手稿留存，直到 1674 年才在巴黎首次付印。
