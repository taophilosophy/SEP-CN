      As a ruler-philosopher and apologist for Christianity, Gianfrancesco was above all a moralizer. His concern for the moralization of human life is apparent in *De imaginatione* (1501). Although the work is presented as a philosophical investigation into the definition and functions of the imaginative faculty of the soul, Gianfrancesco’s ultimate intent is to propose an almost mystical theory of the spiritual elevation of the soul. He maintains that the imagination has great power: as a faculty that mediates between sensation and intellection, depending on the way it is conducted, the imagination can make men similar to beasts or elevate them to the intellectual dimension. He gives a definition of the imagination that implicitly takes into account the long tradition of the theory of the soul: from Plato and Aristotle, to Avicenna and Latin scholasticism (chapters 1–4; see Pappalardo 2019a and Molinarolo 2022)[^molinarolo-2022][^pappalardo-2019a]. Gianfrancesco particularly emphasizes the important role that the imagination plays in the genesis of opinion (Pappalardo 2012)[^pappalardo-2012], relying on Alexander of Aphrodisias’ *De anima* (“On the Soul”), in the Latin translation of Girolamo Donato and on Epictetus’ *Enchiridion*, in the Latin translation of Angelo Poliziano. Finally, Gianfrancesco underlines the strong influence that the imagination exerts on the body and emotions. Although he stresses its great power, he also explains that the imagination can fall into error; for this reason, it needs watchful guidance and treatment, as one would care for a sick person. *De imaginatione* takes up issues already dealt with in *De morte Christi*: correcting the imagination and presenting it with accurate and adequate images enables Christians to moderate their own lives.
    step1: |-
      作为哲人统治者与基督教护教者，詹弗朗切斯科首先是一位道德化者。他对人生道德化的关切，在《论想象》（1501）中显而易见。此书虽以对灵魂想象官能的定义与功能作哲学探究的面目出现，詹弗朗切斯科的最终意图却是提出一种近乎神秘主义的灵魂灵性提升之说。他主张想象具有巨大的力量：作为一种在感觉与理智活动之间居间起作用的官能，想象视其被引导的方式，可以使人近于禽兽，也可以把人提升到理智的维度。他给想象下了一个定义，其中隐含地顾及灵魂理论的长久传统：从柏拉图与亚里士多德，到伊本·西那与拉丁经院哲学（第 1–4 章；see Pappalardo 2019a and Molinarolo 2022）[^molinarolo-2022][^pappalardo-2019a]。詹弗朗切斯科尤其强调想象在意见之生成中所起的重要作用（Pappalardo 2012）[^pappalardo-2012]，所依据的是阿弗罗狄西亚的亚历山大《论灵魂》吉罗拉莫·多纳托的拉丁译本，以及爱比克泰德《手册》安杰洛·波利齐亚诺的拉丁译本。最后，詹弗朗切斯科强调想象对身体与情感的强烈影响。尽管他强调其巨大力量，却也说明想象会陷入错误；因此它需要警醒的引导与调治，如同照料病人一般。《论想象》承接了《论基督之死》已处理过的问题：矫正想象，给它提供准确而适当的影像，能使基督徒节制自己的生活。
    step2: |-
      身为哲人统治者兼基督教护教者，詹弗朗切斯科首先是个道德化者。他对人生道德化的关切，在《论想象》（1501）里一目了然。此书表面上是对灵魂想象官能的定义与功能作哲学探究，最终意图却是提出一种近乎神秘主义的灵魂提升之说。他主张想象之力极大：它居间于感觉与理智活动之间，视引导方式之不同，可使人近于禽兽，也可把人抬升到理智的层面。他为想象所下的定义，暗合灵魂理论的悠久传统——从柏拉图、亚里士多德，到伊本·西那与拉丁经院哲学（第 1–4 章；see Pappalardo 2019a and Molinarolo 2022）[^molinarolo-2022][^pappalardo-2019a]。他尤其强调想象在意见生成中的重要作用（Pappalardo 2012）[^pappalardo-2012]，所据为阿弗罗狄西亚的亚历山大《论灵魂》的吉罗拉莫·多纳托拉丁译本，以及爱比克泰德《手册》的安杰洛·波利齐亚诺拉丁译本。最后，他强调想象对身体与情感的强烈影响。他一边强调其力量之大，一边说明想象会出错；因此它须有警醒的引导与调治，如同照料病人。《论想象》接续《论基督之死》的题目：矫正想象，给它准确适当的影像，基督徒便能节制自己的生活。
