      Starting from the fourth book, a new section of the *Examen vanitatis* begins, mainly directed against Aristotle (Schmitt 1967: 55–159; Vasoli 2001)[^schmitt-1967][^vasoli-2001]. Gianfrancesco was aware that Aristotle had been the philosophical authority of reference for centuries, whether he was attacked or followed. This awareness is manifested in some argumentative passages, in which he rhetorically apologizes for the attacks he directs at Aristotle (IV, prooemium). His criticisms, nevertheless, are radical. In the fourth book, Gianfrancesco attempts to demonstrate that Aristotle’s philosophy is not compatible with the message conveyed by the Sacred Scriptures and attacks the long ancient and late antique Aristotelian tradition. Furthermore, Gianfrancesco examines Aristotle’s expository style, which he maintains is intrinsically obscure and contradictory. The fifth book is dedicated to the Aristotelian art of demonstration, presented in the *Organon* and, more specifically, in the *Analytics*. It is in this context that one of the most decisive attacks on the Aristotelian system of knowledge emerges, based on considerations of a gnoseological and epistemological nature. If it is true that knowledge, according to Aristotle, originates in the activity of the senses, since the intellect can only base its activity on what has been presented to it by the senses, then knowledge is structurally and inevitably unreliable. Gianfrancesco argues that not only the five external senses, but also the internal senses (especially the imagination), are unreliable—an argument that he had already advanced in *De studio* and *De imaginatione*. The sixth and final book of the *Examen* is dedicated to a thorough examination of several Aristotelian physical theories, including the theory of motion, of the void and of natural generation. In this context, Gianfrancesco also challenges the Aristotelian doctrine regarding a question of great theological consequence: the theme of divine intensity.
    step1: |-
      自第 4 卷起，《虚妄之检验》开始一个新部分，主要针对亚里士多德（Schmitt 1967: 55–159; Vasoli 2001）[^schmitt-1967][^vasoli-2001]。詹弗朗切斯科清楚知道，数百年间亚里士多德一直是供人遵奉或攻击的哲学权威。这种意识表现在若干论证段落中：他以修辞性的方式为自己针对亚里士多德的攻击致歉（IV, 序言）。然而他的批评是彻底的。第 4 卷中，詹弗朗切斯科试图证明亚里士多德的哲学与圣经所传达的信息并不相容，并攻击古代与古典晚期漫长的亚里士多德传统。此外，他还考察亚里士多德的表述风格，主张这种风格本身晦涩而自相矛盾。第 5 卷专门讨论亚里士多德的证明之术，即《工具论》中、更具体地说《分析篇》中所呈现者。正是在这里，出现了对亚里士多德知识体系最具决定性的一次攻击，其依据是知识论与认识论性质的考虑。如果按亚里士多德，知识起源于感官活动（因为理智只能把它自己的活动建立在感官所呈现给它的东西之上），那么知识在结构上便不可避免地不可靠。詹弗朗切斯科论证说，不仅五种外部感官，连内部感官（尤其是想象）也不可靠——这一论证他在《论研究》与《论想象》中已提出过。《检验》的第 6 卷亦即末卷，专门细察亚里士多德的若干物理学理论，包括运动说、虚空说与自然生成说。在此语境中，詹弗朗切斯科还挑战了亚里士多德关于一个具有重大神学后果的问题的学说，即神的强度这一主题。
