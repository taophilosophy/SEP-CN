      《论想象》（*De imaginatione*）1501 年由阿尔杜斯·马努提乌斯在威尼斯刊行，正当米兰多拉领地之争吃紧之时。詹弗朗切斯科把它献给哈布斯堡皇帝马克西米利安一世，题献中除了颂扬与效忠，还请求支援，以对抗信仰的敌人与叛徒。被逐出米兰多拉后，他去了德意志，在那里结识维利巴尔德·皮尔克海默、约翰·罗伊希林、康拉德·波伊廷格等人。他的书信可以为证（Schmitt 1967: 23; see also Cao 2004）[^cao-2004][^schmitt-1967]：正因这些交谊，他的书才在德意志出版。1506–1507 年，一部詹弗朗切斯科文集在斯特拉斯堡印行，其中除已刊之作，还收有《论事物的预知》（*De rerum praenotione*）初版、《论信仰与信从次序的定理》（*Theoremata de fide et ordine credendi*）、咏十字架奥迹的长诗《十字架诗》（*Staurostichon*），以及一批书信、译文和对殉道者查士丁、普瓦捷的希拉里著作的疏解。流亡年间印行的还有《英雄颂歌三首》（*Hymni heroici tres*）与另外两首诗，1507 年在米兰问世。1508 年，他在诺维刊行《论上帝的神意：驳伪哲学家》（*De providentia Dei contra philosophastros*）。
