    source: |-
      Gianfrancesco Pico della Mirandola was born in 1469 (the exact date is unknown). He was the son of Galeotto I Pico and Bianca Maria d’Este, and the nephew of the famous Giovanni Pico della Mirandola. Very little is known about his childhood and education; however, biographies and archival documents contain detailed information about Gianfrancesco’s mature life, his intellectual exchanges and his political and diplomatic activity (Schmitt 1967: 11–30)[^schmitt-1967]. In March 1491 Pico married Giovanna Carafa. Thanks to the dowry that he received from the marriage, he was able to buy the rights to the domains of Mirandola (near Modena, in northern Italy) from his uncle Giovanni. After the death of his father Galeotto in 1499, Gianfrancesco, who until then had devoted himself to intellectual work, was recalled to his duties as ruler; but his exercise of power was complicated by the claims of his two brothers, Ludovico and Federico. In 1491, the two brothers had formally renounced their claims to the domains. In addition, in the same year Gianfrancesco’s father had obtained the investiture from Emperor Maximilian I of Habsburg, who had also rejected the claims of Galeotto’s brother, Antonmaria. The imperial investiture was confirmed to Gianfrancesco on May 16, 1499, after his father’s death; but Ludovico and Federico denied the validity of the renunciation that they had made in 1491; and, supported by their uncle Antonmaria and their mother Bianca Maria Pico, they attempted to conquer Mirandola militarily. Between 1499 and 1502, a series of attempted sieges followed, none of which was successful. After Antonmaria’s death in 1501, Ludovico and Federico gained support from Gian Giacomo Trivulzio, a Milanese warlord and father of Federico’s wife. Due to Trivulzio’s support, Mirandola surrendered to the siege on August 6, 1502. Gianfrancesco was therefore forced into exile, which lasted until 1511.
    step1: |-
      詹弗朗切斯科·皮科·德拉·米兰多拉生于 1469 年（确切日期不详）。他是加莱奥托一世·皮科与比安卡·玛丽亚·德斯特之子，也是著名的乔瓦尼·皮科·德拉·米兰多拉之侄。关于他的童年与教育，所知甚少；不过传记与档案文献中，关于詹弗朗切斯科成年后的生活、他的思想交流以及政治与外交活动，却有详细的材料（Schmitt 1967: 11–30）[^schmitt-1967]。1491 年 3 月，皮科与焦万娜·卡拉法结婚。靠这门婚事所得的嫁妆，他得以从叔父乔瓦尼手中买下米兰多拉（位于意大利北部摩德纳附近）领地的权利。1499 年父亲加莱奥托去世后，此前一直专心于学术工作的詹弗朗切斯科被召回，重拾统治者的职责；但他的执政因两个弟弟卢多维科与费德里科的权利主张而变得复杂。1491 年，两兄弟已正式放弃对领地的权利主张。此外，同年詹弗朗切斯科的父亲还从哈布斯堡的马克西米利安一世皇帝那里取得了授职，皇帝同时也驳回了加莱奥托之弟安东玛丽亚的权利主张。父亲去世后，这项皇帝授职于 1499 年 5 月 16 日确认给詹弗朗切斯科；但卢多维科与费德里科否认他们 1491 年所作放弃的有效性，并在叔父安东玛丽亚与母亲比安卡·玛丽亚·皮科的支持下，试图以武力攻取米兰多拉。1499 年至 1502 年间，围攻一再尝试，均未成功。1501 年安东玛丽亚死后，卢多维科与费德里科得到米兰军阀詹贾科莫·特里武尔齐奥的支持，此人即费德里科之妻的父亲。由于特里武尔齐奥的支持，米兰多拉于 1502 年 8 月 6 日向围攻者投降。詹弗朗切斯科因此被迫流亡，直到 1511 年。
    step2: |-
      詹弗朗切斯科·皮科·德拉·米兰多拉生于 1469 年，确切日期不详。他是加莱奥托一世·皮科与比安卡·玛丽亚·德斯特之子，也是著名的乔瓦尼·皮科·德拉·米兰多拉之侄。他的童年与教育留下的材料很少；但传记和档案文献对他成年后的生活、思想交流以及政治外交活动记载颇详（Schmitt 1967: 11–30）[^schmitt-1967]。1491 年 3 月，皮科娶焦万娜·卡拉法为妻。凭这门婚事带来的嫁妆，他从叔父乔瓦尼手里买下了米兰多拉领地的权利——米兰多拉在意大利北部，靠近摩德纳。1499 年父亲加莱奥托去世，一向专心学问的詹弗朗切斯科被召回，重拾统治之责；但两个弟弟卢多维科与费德里科对领地提出主张，使他的执政颇为棘手。1491 年，两兄弟已正式声明放弃领地权利；同年，父亲又从哈布斯堡的马克西米利安一世皇帝处取得授职，皇帝同时驳回了加莱奥托之弟安东玛丽亚的主张。父亲死后，这项皇帝授职于 1499 年 5 月 16 日确认给詹弗朗切斯科。但卢多维科与费德里科不认自己 1491 年的放弃，在叔父安东玛丽亚与母亲比安卡·玛丽亚·皮科的支持下，试图以武力夺取米兰多拉。1499 至 1502 年间，围攻接二连三，无一得手。1501 年安东玛丽亚死后，两兄弟转而得到米兰军阀詹贾科莫·特里武尔齐奥的支持——此人正是费德里科妻子的父亲。靠他的援手，米兰多拉于 1502 年 8 月 6 日在围攻下投降。詹弗朗切斯科因此被迫流亡，直至 1511 年。
