      In the body of Gianfrancesco’s theoretical writings, witchcraft played a crucial role (Zambelli 1991: 177–210)[^zambelli-1991]. Moreover, he put his own beliefs into practice in the inquisitions that he implemented when he regained control of Mirandola. Everything that Gianfrancesco had elaborated since the 1490s, under the influence of Savonarola, in defense of the validity and uniqueness of Christian truth and contesting human philosophies, found an outlet in his support for witchcraft trials. Gianfrancesco refers to this issue in *De imaginatione* (chapter 8). He explains that demons can distort the senses and the imagination of witches. This perspective, only hinted at here, was later explored in the *Strix*. In this work, Gianfrancesco addresses the problem of whether the witch’s deception by superior demonic entities absolves her of responsibility. Gianfrancesco also warns of another risk: that witchcraft phenomena could be regarded as purely mental. In this case, a fundamental element of support for the Christian religion would be missing: the existence of the devil and his ability to act on the natural world. It is consequently essential for Gianfrancesco to demonstrate that believing in witches means believing in God (Pappalardo 2017a)[^pappalardo-2017a]. It has even been argued that the *Strix* should be conceived as his attempt to convince himself, before trying to persuade others (Stephens 2003)[^stephens-2003]. The *Strix* therefore tempers the radical skepticism theorized in the *Examen*, counterbalancing its possible destructive effects on the Christian religion. There is, in fact, tension between the two works, as the *Strix* is based on demonstrations founded on sense-based knowledge that the *Examen* had attempted to invalidate (Stephens 2016 and 2019)[^stephens-2016][^stephens-2019]. Gianfrancesco clearly distinguishes between popular credulity and what instead should be believed on solid grounds and incontrovertible evidence. The *Strix* is in continuity with a long medieval and Renaissance debate regarding witchcraft, culminating in the publication of the *Malleus maleficarum* (“The Hammer of Witches”), a work of 1487 by Heinrich Kramer and Jacob Sprenger in which the types of witchcraft were defined and, above all, instructions were given for persecuting witches and convincing them to confess (Pappalardo 2017b)[^pappalardo-2017b]. The *Strix* thus became a sort of manifesto and theoretical explanation of the moralizing, but in fact persecutory, campaign that Gianfrancesco, in support of the inquisitor Girolamo Armellini, had conducted against his own subjects. Like other works by Gianfrancesco, the *Strix* had success in Protestant circles: it was republished in Strasbourg in 1612, with a preface by the demonologist Martin Weinrich.
    step1: |-
      在詹弗朗切斯科的理论著作中，巫术起了关键作用（Zambelli 1991: 177–210）[^zambelli-1991]。此外，他还把自己所信付诸实践，落实于重掌米兰多拉之后所推行的宗教裁判。自 1490 年代起，詹弗朗切斯科在萨伏那洛拉影响下所建构的一切——维护基督教真理的有效性与唯一性、驳斥人间诸哲学——都在他支持巫师审判一事中找到了出口。詹弗朗切斯科在《论想象》中提及此问题（第 8 章）。他说明恶魔能扭曲女巫的感官与想象。这一视角在此仅略一提及，后来在《女巫》中得到深入探讨。在此书中，詹弗朗切斯科处理这样一个问题：女巫受上位恶魔实体的欺罔，是否可免其责任。他还警告另一种风险：巫术现象可能被视为纯属心灵之事。若如此，则支持基督教的一项根本要素便会缺失，即魔鬼的存在及其作用于自然世界的能力。因此，詹弗朗切斯科必须证明：相信女巫即相信上帝（Pappalardo 2017a）[^pappalardo-2017a]。甚至有人主张，《女巫》应当被理解为他试图先说服自己、再去说服他人（Stephens 2003）[^stephens-2003]。所以《女巫》缓和了《检验》所理论化的激进怀疑论，抵消了它对基督教可能造成的破坏性后果。事实上，两部作品之间确有张力：《女巫》所依据的论证建立在感官知识之上，而《检验》恰恰试图使这种知识失效（Stephens 2016 and 2019）[^stephens-2016][^stephens-2019]。詹弗朗切斯科清楚区分民众的轻信与真正应当凭坚实根据、凭不可争辩的证据去相信的东西。《女巫》与中世纪及文艺复兴关于巫术的漫长争论一脉相承；那场争论的高峰是《女巫之锤》（*Malleus maleficarum*）的出版——这是海因里希·克雷默与雅各布·施普伦格 1487 年的一部著作，其中界定了巫术的种类，尤其给出了迫害女巫、说服她们认罪的指南（Pappalardo 2017b）[^pappalardo-2017b]。《女巫》因此成了某种宣言，也成了理论上的说明，为詹弗朗切斯科支持宗教裁判官吉罗拉莫·阿尔梅利尼、对自己治下臣民所推行的那场道德化而实为迫害的运动作注。与詹弗朗切斯科的其他著作一样，《女巫》在新教圈子里也很受欢迎：1612 年它在斯特拉斯堡重印，冠以恶魔学家马丁·魏因里希的序言。
    step2: |-
      在詹弗朗切斯科的理论著作里，巫术占着关键位置（Zambelli 1991: 177–210）[^zambelli-1991]。他还不止于理论：重掌米兰多拉后推行宗教裁判，把自己的信念付诸实行。1490 年代起，他在萨伏那洛拉影响下所建构的一切——维护基督教真理的有效与唯一、驳斥人间诸哲学——都在他支持审判巫师一事上有了出口。他在《论想象》中已提及此事（第 8 章），说明恶魔能扭曲女巫的感官与想象。这一视角当时只是点了一下，后来在《女巫》里深入展开。书中他追问：女巫受上位恶魔欺罔，是否可免其责？他又警告另一种风险：巫术现象或被看作纯属心灵之事；果真如此，支持基督教的一项根本要素就缺了——魔鬼的存在，及其作用于自然世界的能力。所以他必须证明：相信女巫即相信上帝（Pappalardo 2017a）[^pappalardo-2017a]。甚至有人说，《女巫》该理解为他自己先说服自己、再去说服别人（Stephens 2003）[^stephens-2003]。可见《女巫》缓和了《检验》理论化的激进怀疑论，抵消了它对基督教可能的破坏。《检验》想叫感官知识失效，《女巫》却立在感官知识之上，两书确有张力（Stephens 2016 and 2019）[^stephens-2016][^stephens-2019]。詹弗朗切斯科把民众的轻信，与真正该凭坚实根据、凭不可争辩的证据去相信者，分得很清。《女巫》承接着中世纪与文艺复兴关于巫术的漫长争论，那争论以《女巫之锤》（*Malleus maleficarum*）的出版为高峰——海因里希·克雷默与雅各布·施普伦格 1487 年之作，其中界定巫术种类，尤其给出迫害女巫、说服她们认罪的指南（Pappalardo 2017b）[^pappalardo-2017b]。《女巫》于是成了宣言，也成了理论说明，为詹弗朗切斯科支持宗教裁判官吉罗拉莫·阿尔梅利尼、对自己臣民推行的那场名为道德化、实为迫害的运动作注。与他的其他著作一样，《女巫》在新教圈子里也受欢迎：1612 年在斯特拉斯堡重印，冠有恶魔学家马丁·魏因里希的序。
