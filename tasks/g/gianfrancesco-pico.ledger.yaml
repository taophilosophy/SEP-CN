      From the beginning of his intellectual activity, Gianfrancesco’s primary aim was to defend the validity of the Catholic religion, to proclaim its spiritual nature and to limit the field of enquiry of rational philosophy (Moreschini 1998 and 2017)[^moreschini-1998][^moreschini-2017]. In this sense, his relationship with his uncle Giovanni Pico was characterized by personal and intellectual closeness, but also by important theoretical differences. While Giovanni had attempted to offer a method of conciliation not only between the different philosophical currents, but also between philosophy and religion, Gianfrancesco preferred to emphasize those aspects of his uncle’s thought that were most favorable to Christianity (Schmitt 1965; Pappalardo 2014: 25–38)[^pappalardo-2014][^schmitt-1965]. His intellectual proximity to Savonarola undoubtedly played a role in directing Gianfrancesco’s thought. Giovanni also had relations with Savonarola, who allegedly wanted to enlist him in the ranks of his movement, the “piagnoni” (Garfagnini 1997)[^garfagnini-1997]. In a famous letter addressed to Gianfrancesco and sent from Ferrara on May 15, 1492, Giovanni made clear that, at a relatively late stage of his life, he had partly abandoned his previous concordist intentions and invited his nephew to embrace spirituality, prayer and meditation (Giovanni Pico 2018: 81–85)[^pico-2018].
    step1: |-
      自学术活动之始，詹弗朗切斯科的首要目标便是维护天主教的真理性，宣示其精神本性，并限制理性哲学的探究范围（Moreschini 1998 and 2017）[^moreschini-1998][^moreschini-2017]。就此而言，他与叔父乔瓦尼·皮科的关系，既有个人与思想上的亲近，也有重要的理论分歧。乔瓦尼曾试图提供一种调和的方法，不仅调和各种哲学流派，也调和哲学与宗教；詹弗朗切斯科却宁愿强调叔父思想中对基督教最为有利的那些方面（Schmitt 1965; Pappalardo 2014: 25–38）[^pappalardo-2014][^schmitt-1965]。他与萨伏那洛拉思想上的接近，无疑起了引导其思路的作用。乔瓦尼也与萨伏那洛拉有过往来，据说后者有意把他招入自己那个运动“piagnoni”（痛哭者）的行列（Garfagnini 1997）[^garfagnini-1997]。在一封 1492 年 5 月 15 日自费拉拉寄给詹弗朗切斯科的著名书信中，乔瓦尼表明：在生命的较晚阶段，他已部分放弃了先前那种调和意图，并劝侄儿投身灵修、祈祷与默想（Giovanni Pico 2018: 81–85）[^pico-2018]。
    step2: |-
      从学术活动之初起，詹弗朗切斯科的首要目标就是维护天主教的真理性，宣示它的精神本性，并给理性哲学划定探究的边界（Moreschini 1998 and 2017）[^moreschini-1998][^moreschini-2017]。因此他与叔父乔瓦尼·皮科的关系，既有个人与思想上的亲近，也有重大的理论分歧。乔瓦尼想提供一种调和之法：既调和各派哲学，也调和哲学与宗教。詹弗朗切斯科却宁愿强调叔父思想中对基督教最有利的那些方面（Schmitt 1965; Pappalardo 2014: 25–38）[^pappalardo-2014][^schmitt-1965]。他与萨伏那洛拉在思想上的接近，无疑给他指引了方向。乔瓦尼也与萨伏那洛拉有过来往，据说后者曾想把他招进自己的运动“piagnoni”（痛哭者）（Garfagnini 1997）[^garfagnini-1997]。1492 年 5 月 15 日，乔瓦尼自费拉拉给侄儿写了一封著名的信，明言自己到了晚年已部分放弃先前的调和意图，并劝詹弗朗切斯科投身灵修、祈祷与默想（Giovanni Pico 2018: 81–85）[^pico-2018]。
