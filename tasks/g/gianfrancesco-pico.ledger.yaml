      During his second exile, Gianfrancesco was most likely too busy to devote himself as much as he would have liked to intellectual and literary activity. It was only in 1513 that Pico was able to publish two more poems, dedicated to Conrad Peutinger. The *Oratio de reformandis moribus* (“Oration on the Reform of Morals”), dedicated to Pope Leo X, probably dates back to the same year (Schmitt 1967: 26)[^schmitt-1967]. This work encouraged the pontiff and the Fifth Lateran Council, then in progress, to undertake a moral reform of the Catholic Church. Gianfrancesco was probably not present in person at the council (Vasoli 1998)[^vasoli-1998], and the work was printed only in 1520.
    step1: |-
      第二次流亡期间，詹弗朗切斯科多半忙得无暇像自己期望的那样投身学术与文学。直到 1513 年，皮科才又刊出两首诗，献给康拉德·波伊廷格。献给教皇利奥十世的《论改革风俗的演说》（*Oratio de reformandis moribus*），大概也成于同年（Schmitt 1967: 26）[^schmitt-1967]。这部作品鼓励教皇与当时正在举行的第五届拉特兰会议着手对天主教会进行道德改革。詹弗朗切斯科很可能并未亲临会议（Vasoli 1998）[^vasoli-1998]，而此书直到 1520 年才印行。
    step2: |-
      第二次流亡期间，詹弗朗切斯科多半事务缠身，无暇如其所愿地治学写作。直到 1513 年，他才又刊出两首诗，献给康拉德·波伊廷格。献给教皇利奥十世的《论改革风俗的演说》（*Oratio de reformandis moribus*）大概也成于同年（Schmitt 1967: 26）[^schmitt-1967]。此书促动教皇与正在举行的第五届拉特兰会议对天主教会作道德改革。詹弗朗切斯科本人很可能并未到会（Vasoli 1998）[^vasoli-1998]，书也直到 1520 年才印行。
