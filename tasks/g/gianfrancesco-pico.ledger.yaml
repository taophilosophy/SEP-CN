      In *De rerum praenotione*, many issues that Gianfrancesco had partly examined in his previous works are more clearly thematized and analyzed. It should especially be noted that his theorizing is always accompanied by a careful consideration of the existence and impact of the events he describes. Thus, the miraculous practices described in *De morte Christi* and *De rerum praenotione* are identified in people close to Gianfrancesco and esteemed by him, such as Savonarola and Caterina da Racconigi (Pagnotta 2010: V–LXVIII; Zarri 2019)[^pagnotta-2010][^zarri-2019]. Theoretical study and hagiography are therefore complementary: he carries out both with a precise apologetic, persuasive and prescriptive intent.
    step1: |-
      在《论事物的预知》中，詹弗朗切斯科先前著作已部分考察过的许多问题得到更清晰的主题化与分析。尤须指出：他的理论建构总伴随着对所描述事件之存在与影响的审慎考量。因此，《论基督之死》与《论事物的预知》中所描述的奇迹实践，都被指认在与他亲近、为他所敬重的人身上，如萨伏那洛拉与拉科尼吉的卡泰里娜（Pagnotta 2010: V–LXVIII; Zarri 2019）[^pagnotta-2010][^zarri-2019]。可见理论研究与圣徒传记是互补的：他从事两者，都带着明确的护教、劝服与规训意图。
    step2: |-
      《论事物的预知》把詹弗朗切斯科先前著作中部分触及的许多问题，处理得更清楚、更成系统。尤须留意：他的理论建构总伴着对所描述事件之实存与影响的审慎考量。所以《论基督之死》《论事物的预知》里写的奇迹实践，他都指认在亲近而敬重的人身上，如萨伏那洛拉与拉科尼吉的卡泰里娜（Pagnotta 2010: V–LXVIII; Zarri 2019）[^pagnotta-2010][^zarri-2019]。理论研究与圣徒传记由此互补：两者他都做，且都抱着明确的护教、劝服与规训意图。
