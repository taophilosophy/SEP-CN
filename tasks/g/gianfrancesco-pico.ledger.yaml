      A further example of Gianfrancesco entering into philosophical debates, always to defend Christianity, is found in his *Digressio de animae immortalitate* (1523). This work proves that he had undertaken to write a commentary on Aristotle’s *De anima*. Although his commentary is lost, he published an extract in which he attempted to demonstrate that the immortality of the soul is effectively demonstrable through philosophy. The aim of this work was presumably to intervene in the debate opened by the mortalist positions of Pietro Pomponazzi, whose *Tractatus de immortalitate animae* (“Treatise on the Immortality of the Soul”) of 1516 had stirred heated reactions (Molinarolo 2024)[^molinarolo-2024]. The method adopted by Gianfrancesco consists in recovering the readings of important exponents of the late antique commentary tradition on Aristotle (especially John Philoponus). Referring to a composite tradition of Aristotelianism and Neoplatonism, he discusses the epistemological problem at the basis of the mortalist theory (the dependence of the intellect on the imagination and the separability of the intellect from the body at the moment of death) by demonstrating that the intellect also has an operation that is entirely its own and that it will be able to continue to exercise for eternity even without being tied to materiality.
    step1: |-
      詹弗朗切斯科介入哲学论争、且始终为维护基督教而来的又一例证，见于他的《论灵魂不朽的离题论述》（1523）。此书证明他曾着手为亚里士多德的《论灵魂》作注释。注释虽已佚失，他却刊行了其中一节，试图证明灵魂不朽确实可以借哲学来证明。此书的目的，大概是要介入由皮耶特罗·彭波那齐的灵魂有死论立场引发的争论——彭波那齐 1516 年的《论灵魂不朽》（*Tractatus de immortalitate animae*）曾激起激烈反应（Molinarolo 2024）[^molinarolo-2024]。詹弗朗切斯科采用的方法，是重新拾取古典晚期亚里士多德注释传统中重要代表（尤其是约翰·菲洛波努斯）的读解。他诉诸一种亚里士多德主义与新柏拉图主义混合的传统，讨论灵魂有死论所依据的认识论问题（理智对想象的依赖，以及死亡之际理智能否脱离身体），并证明理智还有一种完全属于它自己的运作，即便不与物质性相系，也能永恒地继续施展下去。
    step2: |-
