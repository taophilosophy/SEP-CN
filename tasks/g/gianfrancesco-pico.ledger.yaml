      From reading the *Examen*, one can easily deduce Gianfrancesco’s deep distrust of Aristotle. Nevertheless, by scrolling through his writings, it is possible to see that he does not always maintain the same level of opposition towards Aristotle. In *De providentia Dei contra philosophastros* (1508), Gianfrancesco effectively opposes the tradition of those whom he calls “sham philosophers”. In this work, written prior to the *Examen*, his aim is still to determine the correct way in which philosophy can be used in favor of Christianity. Hence, he is open to the possibility of including Aristotle within this framework (Ramberti 2012)[^ramberti-2012]. He portrays Aristotle not only as the provider of a pre-Christian theory of providence, but also as a competitor to the doctrine of *pia philosophia* proposed by the Florentine humanists, especially Ficino. Gianfrancesco is completely opposed to the idea of a centuries-long continuity between pre-Platonic and Platonic philosophy and Christian doctrine. Consequently, he does not hide his doubts regarding the claims of philosophy. At the same time, in the seventh chapter of *De providentia Dei*, Gianfrancesco defends Aristotle from those who have interpreted him incorrectly, arguing that he did indeed acknowledge the gods and religious piety.
    step1: |-
      读《检验》一书，很容易推出詹弗朗切斯科对亚里士多德的深刻不信任。然而翻阅他的著作，又能看出他对亚里士多德的反对并不总是维持在同一程度。在《论上帝的神意：驳伪哲学家》（1508）中，詹弗朗切斯科实际上是在反对他所谓“伪哲学家”的传统。此书作于《检验》之前，其目标仍在于确定哲学可用于拥护基督教的正确方式。因此，他对把亚里士多德纳入这一框架抱有开放态度（Ramberti 2012）[^ramberti-2012]。他把亚里士多德描绘成不仅提供了一种前基督教的护佑理论，而且是与佛罗伦萨人文主义者、尤其是费奇诺所提出的 *pia philosophia*（虔敬哲学）学说相竞争者。詹弗朗切斯科完全反对这样一种观念：前柏拉图哲学与柏拉图哲学同基督教教义之间存在着数百年的连续性。因此，他并不隐瞒自己对哲学之主张的怀疑。同时，在《论上帝的神意》第 7 章中，他又为亚里士多德辩护，反驳那些误解了他的人，论证亚里士多德确实承认诸神与宗教虔敬。
    step2: |-
      读《检验》，很容易推出他对亚里士多德的深刻不信任。但翻检其著作，又可见他反对亚里士多德的力度并不总是一样。在《论上帝的神意：驳伪哲学家》（1508）中，他实际上是在反对他所谓“伪哲学家”的传统。此书作于《检验》之前，目标仍是确定哲学可用于拥护基督教的正当方式，因此他不排除把亚里士多德纳入这一框架（Ramberti 2012）[^ramberti-2012]。他笔下的亚里士多德，不只提供了一种前基督教的护佑理论，还是佛罗伦萨人文主义者、尤其费奇诺所倡 *pia philosophia*（虔敬哲学）的对手。他全然反对一种观念：前柏拉图哲学、柏拉图哲学与基督教教义之间存在着数百年的连续性。因此他不掩饰对哲学主张的怀疑。同时，在《论上帝的神意》第 7 章，他又替亚里士多德辩护，驳那些误解他的人，论证亚里士多德确实承认诸神与宗教虔敬。
