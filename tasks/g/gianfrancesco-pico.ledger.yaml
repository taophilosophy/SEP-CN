      After regaining possession of his dominions, Gianfrancesco devoted himself to intellectual activity more consistently than during his years of exile. In addition to composing several philosophical and apologetic works and maintaining a correspondence with European intellectuals, he obtained permission in 1519 from Pope Leo X to set up a printing press in his castle. From a political point of view, the years from 1520 to Gianfrancesco’s death were relatively uneventful, with only marginal involvement in the Italian wars near Mirandola. Once his control over Mirandola was established, Gianfrancesco sponsored a vast operation to combat witchcraft and superstitious practices, supporting the activity of the inquisitor of Parma and Reggio Girolamo Armellini; this campaign was not without implications for territorial politics, since it also allowed Gianfrancesco to intervene in the domains of Concordia, which were under the control of his sister-in-law (Pappalardo 2017b: 85–86)[^pappalardo-2017b].
    step1: |-
      重获领地之后，詹弗朗切斯科比流亡年间更为一贯地投身学术活动。除了撰写若干哲学与护教著作、与欧洲各地学人通信之外，他还在 1519 年从教皇利奥十世处获得许可，在自己的城堡里设立印刷所。从政治上看，1520 年至詹弗朗切斯科去世的这些年相对平静，只是在米兰多拉附近略微卷入了意大利战争。对米兰多拉的掌控一经确立，詹弗朗切斯科便发起一场大规模的运动，打击巫术与迷信行为，支持帕尔马与雷焦的宗教裁判官吉罗拉莫·阿尔梅利尼的活动；这场运动并非与领土政治无关，因为它也使詹弗朗切斯科得以插手康科迪亚的领地，而那处领地正由他的嫂嫂掌管（Pappalardo 2017b: 85–86）[^pappalardo-2017b]。
    step2: |-
      重掌领地之后，詹弗朗切斯科治学比流亡年间更为连贯。他写了几部哲学与护教著作，与欧洲各地学人通信，1519 年还从教皇利奥十世处取得许可，在自家城堡里开设印刷所。政治上，1520 年直至他去世，岁月相对平静，只在米兰多拉附近略受意大利战争波及。米兰多拉的统治一旦稳固，他便大张旗鼓地打击巫术与迷信，支持帕尔马与雷焦的宗教裁判官吉罗拉莫·阿尔梅利尼；这场运动也牵动领土政治，因为它让詹弗朗切斯科得以插手康科迪亚领地，而那里正由他嫂嫂掌控（Pappalardo 2017b: 85–86）[^pappalardo-2017b]。
