      An example of the analysis of a miraculous and supernatural sign and the political meaning that Gianfrancesco attributes to such phenomena is found in the poem *Staurostichon*. In 1501, an unusual rainstorm in Germany was said to have marked the clothes and bodies of people with red crosses. This event was soon interpreted as a rain of divine blood, and Gianfrancesco, in the poem, presents it to Emperor Maximilian I as a divine miracle and a demonstration of the truth of biblical prophecy. In this way, on the basis of doctrines expressed by Savonarola (Lucioli 2012; Piana 2019)[^lucioli-2012][^piana-2019], Gianfrancesco also provides a justification for Maximilian’s imperial power. The *Staurostichon*, like the rest of Gianfrancesco’s poetic works, testifies to his conviction that a Christian and inspired poetry is possible—a belief that had been challenged by one of his main sources, Savonarola. According to Gianfrancesco, writing poetry can have an important didactic function, as it enables the foundational elements of the Christian doctrinal tradition to be conveyed in an accessible form (Moreschini 2017: 167–171)[^moreschini-2017].
