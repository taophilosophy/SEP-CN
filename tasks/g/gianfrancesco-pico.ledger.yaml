  - id: 10
    kind: body
    source: |-
      Gianfrancesco’s life was deeply marked by his commitment to consolidating his status as a ruler. Equally present and fundamental was his intellectual effort, which materialized in numerous works on various subjects, unified by a common underlying and long-lasting intent: to scale down the claims of human reason and to emphasize the incontrovertible truth of Christian doctrine and Sacred Scripture. In parallel, Gianfrancesco cultivated contacts with important European intellectuals and printers. There are, however, some early influences, which marked Gianfrancesco’s intellectual itinerary throughout his entire life. The two most significant influences on him were his uncle Giovanni Pico and the Dominican friar Girolamo Savonarola (Pappalardo 2014: 25–38)[^pappalardo-2014].
    step1: |-
      詹弗朗切斯科的一生，深深烙着巩固统治者身份的用心。同样始终在场而根本的，是他的学术努力：它落实为题材各异的众多著作，而这些著作由一以贯之的持久意图统摄起来，即压低人类理性的主张，彰显基督教教义与圣经不可争辩的真理。与此同时，詹弗朗切斯科还与欧洲重要的学人和印刷商保持联系。不过，也有一些早期影响，终生贯穿于他的思想历程。对他影响最大的两者，是他的叔父乔瓦尼·皮科与多明我会修士吉罗拉莫·萨伏那洛拉（Pappalardo 2014: 25–38）[^pappalardo-2014]。
    step2: |-
      詹弗朗切斯科一生用心，一半在巩固自己的统治者身份，一半在学术；后者同样根本，且始终在场。他的学术努力结出题材各异的众多著作，统摄它们的是一贯而长久的意图：压低人类理性的主张，彰显基督教教义与圣经不可争辩的真理。同时，他与欧洲重要学人、印刷商往还不绝。不过也有若干早期影响，终生贯穿着他的思想历程，其中最重要的两个，是叔父乔瓦尼·皮科与多明我会修士吉罗拉莫·萨伏那洛拉（Pappalardo 2014: 25–38）[^pappalardo-2014]。
