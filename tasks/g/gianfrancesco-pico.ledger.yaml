      In the course of his intellectual activity, Gianfrancesco formulated a specific and fundamental argument that explained why it is neither appropriate nor wise to rely on human philosophy. This argument consists in the identification of *varietas* (variety) with *falsitas* (falsehood). Humans do not agree on the answers to philosophical questions, regardless of their importance or impact, and elaborate multiple currents of thought, conveyed by competing schools and often in opposition to one another. In the face of this multiplicity, we cannot fail to recognize the substantial falsity of the various philosophical currents, incapable of providing a single and univocal truth. Truth does not manifest itself in uncertainty. This position, which is already found in Gianfrancesco’s works prior to the *Examen vanitatis*, implies a series of argumentative choices. First, in *De imaginatione* he implicitly equates the multiplication of philosophical currents with the proliferation of heretical sects. Second, he structurally attacks ancient philosophical currents (chapter 7). Gianfrancesco’s proto-historiographical perspective (Robichaud 2019)[^robichaud-2019] has an important methodological and informative value; above all, however, it responds to his need to demonstrate the inconsistency of philosophical schools by retracing their history and demonstrating that the reference to them, as bearers of ancient authority, masks the impossibility of developing an autonomous path to truth. From the time of *De studio*, therefore, Gianfrancesco was well aware of the need to establish a sound criterion: for him, this criterion was purely fideistic.
    step1: |-
      在其学术活动的进程中，詹弗朗切斯科提出过一个具体而根本的论证，说明为何依赖人间哲学既不合适也不明智。这一论证在于把 *varietas*（多样性）等同于 *falsitas*（虚假性）。人对哲学问题的答案并不一致，无论这些问题重要与否、影响如何，并且发展出多种思想潮流，由相互竞争的学派传播，彼此常常对立。面对这种杂多，我们不能不承认各派哲学思潮实质上是虚假的，因为它们无法提供单一而唯一的真理。真理不会在不确定中显现自身。这一立场在《虚妄之检验》之前的著作中已可见到，它蕴含一系列论证上的选择。第一，在《论想象》中，他隐含地把哲学思潮的增殖等同于异端教派的孳生。第二，他从结构上攻击古代各派哲学（第 7 章）。詹弗朗切斯科那种近乎史学史的眼光（Robichaud 2019）[^robichaud-2019] 有重要的方法论与知识价值；但首先，它回应了他的需要：通过追溯各哲学学派的历史，证明它们前后不一，并表明援引它们、把它们当作古代权威的承载者，恰恰掩盖了无法开辟一条自主通达真理之路这一事实。因此，自《论研究》之时起，詹弗朗切斯科就清楚意识到必须确立一个可靠的判准：在他看来，这个判准纯粹是信仰主义的。
    step2: |-
      在治学过程中，詹弗朗切斯科提出过一个具体而根本的论证，说明为何倚赖人间哲学既不合适也不明智：这一论证把 *varietas*（多样性）等同于 *falsitas*（虚假性）。人对哲学问题的答案从不一致，无论问题轻重、影响大小；由此生出多种思想潮流，由互相竞争的学派传播，往往彼此对立。面对这种杂多，人不得不承认各派哲学实质皆虚——它们给不出单一而唯一的真理。真理不会在不确定中现身。这一立场在《虚妄之检验》之前的著作里已见端倪，并带来一连串论证上的取舍。其一，他在《论想象》中暗把哲学思潮的增殖比作异端教派的孳生。其二，他从结构上批驳古代各派哲学（第 7 章）。他那近乎史学史的眼光（Robichaud 2019）[^robichaud-2019] 有相当的方法论与知识价值；但首要的是，它应其所需：追溯各派历史，证明它们自相抵牾，并表明援引它们、奉之为古代权威，不过是掩盖了一件事——通往真理的自主之路无从开辟。所以，早在《论研究》时，他就清楚必须立一个可靠判准；而在他那里，这判准纯然是信仰主义的。
