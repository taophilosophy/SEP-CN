      The *Examen vanitatis* thus summarizes and expands the arguments of Gianfrancesco’s previous works, showing the continuity of his thought. The major novelty of this work is his extensive use of the writings of Sextus Empiricus. Gianfrancesco reports numerous and extensive passages from Sextus (Cao 2007)[^cao-2007] and, for this reason, the *Examen vanitatis* also played an important role in the dissemination of his writings. Sextus Empiricus was relatively little known until then (Cao 2001; Floridi 2002)[^cao-2001][^floridi-2002], and the *Examen vanitatis* served as an important vehicle at the dawn of the rebirth of skepticism in the early modern age (Popkin 2003: 19–27)[^popkin-2003]. Gianfrancesco’s skepticism certainly does not deny the existence of truth, nor does he accept all the doctrines of the skeptical school. Among the traditional elements of this philosophical tradition rejected by him is, for example, the *epochē*, that is, the suspension of judgment while waiting for the determination of a reliable and certain criterion to reach the truth. For Gianfrancesco, a criterion already exists: revealed divine truth. Consequently, that characteristic feature of skeptical reflection in general, and of Sextus Empiricus in particular, is regarded as useless and meaningless (Cao 2007: 278–280 and 286)[^cao-2007].
    step1: |-
      《虚妄之检验》就这样总结并扩展了詹弗朗切斯科先前著作的论证，显出他思想的一贯。此书最大的新意，在于大量使用塞克斯都·恩披里柯的著作。詹弗朗切斯科转述了塞克斯都许多长篇段落（Cao 2007）[^cao-2007]，正因如此，《虚妄之检验》也在传播塞克斯都著作方面起了重要作用。塞克斯都·恩披里柯此前相对少为人知（Cao 2001; Floridi 2002）[^cao-2001][^floridi-2002]，而《虚妄之检验》在近代早期怀疑论复兴之初，充当了重要的传播工具（Popkin 2003: 19–27）[^popkin-2003]。詹弗朗切斯科的怀疑论当然不否认真理的存在，他也不接受怀疑派的一切学说。他所拒绝的该哲学传统的传统要素之一，例如 *epochē*，即在等待确定可靠判准以达真理之际对判断的悬置。对詹弗朗切斯科而言，判准已经存在：那就是被启示的神圣真理。因此，那种为怀疑论反思一般所特有、也为塞克斯都·恩披里柯所特有的做法，被他视为无用且无意义（Cao 2007: 278–280 and 286）[^cao-2007]。
