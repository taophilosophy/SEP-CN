      In the general framework of his apologetics of Christianity, Gianfrancesco developed an attitude towards rational philosophy that was always present in his writings, but which was not always expressed in the same way. His distrust of the claim of philosophers to guarantee access to truth by relying on human sources and long-established authorities became apparent relatively early. Yet Gianfrancesco himself made use of philosophical theses, concepts, terms and demonstrations. In *De studio divinae et humanae philosophiae*, he clearly distinguishes between a human and a divine philosophy (Schmitt 1967: 37–43)[^schmitt-1967]. Human philosophy includes everything that can be learned from books and the arts. Scholasticism and secular philosophy fall into this category. The notion of “divine philosophy” includes Christian revelation and the wisdom that derives from it, transmitted by the Sacred Scriptures. For this reason, as in *De morte Christi*, Gianfrancesco identifies Christianity as the only true philosophy. The function of human sciences, arts and philosophies is therefore to assist divine philosophy, but they cannot be considered sufficient to obtain the truth (Prooemium). Furthermore, not all sciences are equally useful: the best, serving as a support to Sacred Scripture, are physics, logic and metaphysics (I, 6). Arts such as history and dialectics can be useful to refute heresy (I, 7). The example of illustrious men such as St. Francis and Savonarola, however, demonstrates the self-sufficiency of the study of Scripture for the salvation of the Christian (II, 8).
    step1: |-
      在其基督教护教学的总体框架中，詹弗朗切斯科发展出一种对理性哲学的态度；这种态度始终见于他的著作，但表达方式并不总是一样。他不信任哲学家们的主张——即依靠人间渊源与久已确立的权威便能保证通达真理——这一点显露得相对较早。然而詹弗朗切斯科自己也使用哲学的论题、概念、术语与论证。在《论神圣哲学与人间哲学的研究》中，他明确区分人间哲学与神圣哲学（Schmitt 1967: 37–43）[^schmitt-1967]。人间哲学包括一切可从书本与技艺中学得的东西。经院哲学与世俗哲学都属此类。“神圣哲学”这一概念则包括基督教启示以及由之而来、经由圣经传达的智慧。因此，正如在《论基督之死》中一样，詹弗朗切斯科把基督教认作唯一真正的哲学。人间诸科学、技艺与哲学的功能因此是辅助神圣哲学，但不能被认为足以获得真理（序言）。此外，并非所有科学都同样有用：最好的、可作圣经之支撑的，是物理学、逻辑学与形而上学（I, 6）。历史与辩证法之类的技艺则可用于驳斥异端（I, 7）。然而，圣方济各与萨伏那洛拉这类卓异人物的榜样表明：对基督徒的得救而言，研读圣经本身即已足够（II, 8）。
    step2: |-
      在其护教学的总体框架里，詹弗朗切斯科对理性哲学形成了一种态度：它始终见于其著作，只是表达方式时有不同。他较早便显出不信任：哲学家们声称靠人间渊源与久立之权威即可保证通达真理。然而他自己也用哲学的论题、概念、术语与论证。在《论神圣哲学与人间哲学的研究》中，他把人间哲学与神圣哲学清楚分开（Schmitt 1967: 37–43）[^schmitt-1967]。人间哲学涵盖一切可从书本与技艺习得者，经院哲学与世俗哲学都在其内。“神圣哲学”则包括基督教启示，以及由之而来、经圣经传下的智慧。所以，正如《论基督之死》所示，他把基督教认作唯一真正的哲学。人间诸科学、技艺与哲学，其职分是辅助神圣哲学，却不足以获得真理（序言）。况且诸科学用处不等：最有用、可支撑圣经的是物理学、逻辑学与形而上学（I, 6）；历史、辩证法一类技艺则可用于驳斥异端（I, 7）。而圣方济各、萨伏那洛拉这类卓异人物的榜样表明：就基督徒得救而言，研读圣经本身已经足够（II, 8）。
