    source: |-
      ## A Modern Formulation of Riemann's Theory
    step1: |-
      ## 黎曼理论的现代表述
    step2: |-
      ## 黎曼理论的现代表述
  - id: 2
    kind: body
    source: |-
      The multidimensional continua that Riemann was concerned with are essentially instances of what is now known as a real *n-dimensional smooth manifold*. For brevity, call them ‘*n-manifolds*’. (For example, a sphere, a Möbius strip and the surface of a Henry Moore sculpture may be regarded as 2-manifolds; the spacetimes models of current cosmology are 4-manifolds.) Conditions (a) – (c) provide a full characterization of *n*-manifolds.
    step1: |-
      黎曼所关注的多维连续统，本质上是如今所谓实 *n* 维光滑流形的实例。为简便起见，不妨称之为“*n* 流形”。（例如，球面、莫比乌斯带以及亨利·摩尔雕塑的表面，都可以看作 2 流形；当代宇宙学的时空模型则是 4 流形。）条件 (a) – (c) 完整刻画了 *n* 流形。
    step2: |-
      黎曼所关注的多维连续统，本质上就是如今所谓的实 **n 维光滑流形**。为简便计，称之为“**n 流形**”。（例如，球面、莫比乌斯带以及亨利·摩尔雕塑的表面，都可视为 2 流形；当代宇宙学的时空模型则是 4 流形。）条件 (a) – (c) 完整刻画了 *n* 流形。
  - id: 3
    kind: body
    source: |-
      > (a) An *n*-manifold **M** is a set of points that can be pieced together from partially overlapping patches, such that every point of **M** lies in at least one patch.
      >
      > (b) **M** is endowed with a neighborhood structure (a topology) such that, if *U* is a patch of **M**, there is a continuous one-one mapping *f* of *U* onto some region of **R**^{*n*}, with continuous inverse *f* ^{−1}. (**R**^{*n*} denotes here the collection of all real number *n*-tuples, with the standard topology generated by the open balls.) *f* is a coordinate system or *chart* of **M**; the *k*-th number in the *n*-tuple assigned by a chart *f* to a point *P* in *f*'s patch is called the *k*-th coordinate of *P* by *f*; the *k*-th coordinate function of chart *f* is the real-valued function that assigns to each point of the patch its *k*-th coordinate by *f*.
      >
      > (c) There is a collection **A** of charts of **M**, which contains at least one chart defined on each patch of **M** and is such that, if *g* and *h* belong to **A**, the composite mappings *h* ○ *g*^{−1} and *g* ○ *h*^{−1} — known as *coordinate transformations* — are differentiable to every order wherever they are well defined. (Denote the real number *n*-tuple <*a*₁, … , *a*_{*n*}> by **a**. The mapping *h* ○ *g*^{−1} is well defined at **a** if **a** is the valued assigned by *g* to some point *P* of **M** to which *h* also assigns a value. Suppose that the latter value *h*(*P*) = <*b*₁, … ,*b*_{*n*}> = **b**; then, **b** = *h* ○ *g*^{−1}(**a**). Since *h* ○ *g*^{−1} maps a region of **R**^{*n*} into **R**^{*n*}, it makes sense to say that *h* ○ *g*^{−1} is differentiable.) Such a collection **A** is called an *atlas*.[^note-sup1]
    step1: |-
      > (a) 一个 *n* 流形 **M** 是可由若干部分重叠的坐标片拼合起来的点集，使得 **M** 的每一点都至少落在一个坐标片内。
      >
      > (b) **M** 被赋予一种邻域结构（一种拓扑），使得：若 *U* 是 **M** 的一个坐标片，则存在 *U* 到 **R**^{*n*} 某区域上的连续一一映射 *f*，其逆 *f* ^{−1} 也连续。（**R**^{*n*} 在此指一切实数 *n* 元组的集合，配以由开球生成的标准拓扑。）*f* 是 **M** 的一个坐标系或**坐标卡**；坐标卡 *f* 赋予其坐标片内一点 *P* 的 *n* 元组中第 *k* 个数，称为 *P* 在 *f* 下的第 *k* 个坐标；坐标卡 *f* 的第 *k* 个坐标函数，是把坐标片内每一点对应到其在 *f* 下第 *k* 个坐标的实值函数。
      >
      > (c) 存在 **M** 的一个坐标卡集合 **A**，它在 **M** 的每个坐标片上都至少包含一个定义于其上的坐标卡，并且：若 *g* 与 *h* 属于 **A**，则复合映射 *h* ○ *g*^{−1} 与 *g* ○ *h*^{−1}——称为**坐标变换**——在其有定义之处任意阶可微。（用 **a** 表示实数 *n* 元组 <*a*₁, … , *a*_{*n*}>。若 **a** 是 *g* 赋予 **M** 中某点 *P* 的值，而 *h* 也赋予 *P* 一个值，则映射 *h* ○ *g*^{−1} 在 **a** 处有定义。设后一值为 *h*(*P*) = <*b*₁, … ,*b*_{*n*}> = **b**；那么 **b** = *h* ○ *g*^{−1}(**a**)。既然 *h* ○ *g*^{−1} 把 **R**^{*n*} 的一个区域映入 **R**^{*n*}，说 *h* ○ *g*^{−1} 可微便有意义。）这样的集合 **A** 称为 **M** 的一个**图册**。[^note-sup1]
    step2: |-
      > (a) 一个 *n* 流形 $\mathbf{M}$ 是可由若干部分重叠的坐标片拼合而成的点集，且 $\mathbf{M}$ 的每一点都至少落在一个坐标片之内。
      >
      > (b) $\mathbf{M}$ 被赋予一种邻域结构（一种拓扑），使得：若 *U* 是 $\mathbf{M}$ 的一个坐标片，则存在 *U* 到 $\mathbf{R}^{n}$ 某区域上的连续一一映射 *f*，其逆 *f* ^{−1} 亦连续。（$\mathbf{R}^{n}$ 在此指一切实数 *n* 元组的集合，配以由开球生成的标准拓扑。）*f* 是 $\mathbf{M}$ 的一个坐标系或 **坐标卡**；坐标卡 *f* 赋予其坐标片内一点 *P* 的 *n* 元组中第 *k* 个数，称为 *P* 在 *f* 下的第 *k* 个坐标；坐标卡 *f* 的第 *k* 个坐标函数，是把坐标片内每一点对应到其在 *f* 下第 *k* 个坐标的实值函数。
      >
      > (c) 存在 $\mathbf{M}$ 的一个坐标卡集合 $\mathbf{A}$，它在 $\mathbf{M}$ 的每个坐标片上都至少含有一个定义于其上的坐标卡，并且：若 *g* 与 *h* 属于 $\mathbf{A}$，则复合映射 *h* ○ *g*^{−1} 与 *g* ○ *h*^{−1}——称为 **坐标变换**——在其有定义之处任意阶可微。（用 $\mathbf{a}$ 表示实数 *n* 元组 <*a*₁, … , *a*_{*n*}>。若 $\mathbf{a}$ 是 *g* 赋予 $\mathbf{M}$ 中某点 *P* 的值，而 *h* 也赋予 *P* 一个值，则映射 *h* ○ *g*^{−1} 在 $\mathbf{a}$ 处有定义。设后一值为 *h*(*P*) = <*b*₁, … ,*b*_{*n*}> = $\mathbf{b}$；那么 $\mathbf{b}$ = *h* ○ *g*^{−1}($\mathbf{a}$)。既然 *h* ○ *g*^{−1} 把 $\mathbf{R}^{n}$ 的一个区域映入 $\mathbf{R}^{n}$，说 *h* ○ *g*^{−1} 可微便有意义。）这样的集合 $\mathbf{A}$ 称为 $\mathbf{M}$ 的一个 **图册**。[^note-sup1]
  - id: 4
    kind: body
    source: |-
      It is the pair <**M**, **A**> that, strictly speaking, is an *n*-manifold, in the sense defined above. If <**M**₁,**A**₁> and <**M**₂,**A**₂> are an *n*-manifold and an *m*-manifold, respectively, it makes good sense to say that a mapping *f* of **M**₁ into **M**₂ is differentiable at a point *P* of **M**₁ if, for a chart *h* defined at *P* and a chart *g* defined at *f*(*P*), the composite mapping *g* ○ *f* ○ *h*^{−1} is differentiable at *h*(*P*). (Condition (c) implies that the fulfillment of this requirement does not depend on the choice of *h* and *g*.) *f* is differentiable if it is differentiable at every point of **M**₁.
    step1: |-
      严格说来，正是有序对 <**M**, **A**> 才是上述意义上的 *n* 流形。若 <**M**₁,**A**₁> 与 <**M**₂,**A**₂> 分别是一个 *n* 流形与一个 *m* 流形，那么完全可以说：映射 *f* 在 **M**₁ 的点 *P* 处可微，是指对于定义于 *P* 的坐标卡 *h* 与定义于 *f*(*P*) 的坐标卡 *g*，复合映射 *g* ○ *f* ○ *h*^{−1} 在 *h*(*P*) 处可微。（条件 (c) 蕴含这一要求的满足不依赖于 *h* 与 *g* 的选择。）*f* 若在 **M**₁ 的每一点处都可微，便是可微的。
    step2: |-
      严格说来，正是有序对 <$\mathbf{M}$, $\mathbf{A}$> 才是上述意义上的 *n* 流形。若 <$\mathbf{M}_1$,$\mathbf{A}_1$> 与 <$\mathbf{M}_2$,$\mathbf{A}_2$> 分别是一个 *n* 流形与一个 *m* 流形，那么完全可以说：映射 *f* 在 $\mathbf{M}_1$ 的点 *P* 处可微，意为对于定义于 *P* 的坐标卡 *h* 与定义于 *f*(*P*) 的坐标卡 *g*，复合映射 *g* ○ *f* ○ *h*^{−1} 在 *h*(*P*) 处可微。（条件 (c) 表明，此要求能否满足并不取决于 *h* 与 *g* 的选取。）*f* 若在 $\mathbf{M}_1$ 的每一点处皆可微，便是可微的。
  - id: 5
    kind: body
    source: |-
      Let <**M**,**A**> be an *n*-manifold. To each point *P* of **M** one associates a vector space, which is known as the *tangent space at P* and is denoted by *T*_{*P*}**M**. The idea is based on the intuitive notion of a plane tangent to a surface at a given point. It can be constructed as follows. Let γ be a one-one differentiable mapping of a real open interval **I** into **M**. We can think of the successive values of γ as forming the path of a point that moves through **M** during a time interval represented by **I**. We call γ a *curve* in **M** (parametrized by *u* ∈ **I**). Put γ(*t*_{0}) = *P* for a fixed number *t*_{0} in **I**. Consider the collection **F**(*P*) of all differentiable real-valued functions defined on some neighborhood of *P*. With the ordinary operations of function addition and multiplication by a constant, **F**(*P*) has the structure of a vector space. Each function *f* in **F**(*P*) varies smoothly with *u*, along the path of γ, in some neighborhood of *P*. Its rate of variation at *P* = γ(*t*_{0}) is properly expressed by the derivative *d*(*f* ○γ)/*d**u* at *u* = *t*_{0}. As *f* ranges over **F**(*P*), the value of *d*(*f* ○γ)/*d**u* at *u* = *t*_{0} is apt to vary in **R**. So we have here a mapping of **F**(*P*) into **R**, which we denote by γ·(*u*). It is in fact a linear function and therefore a vector in the dual space F*(*P*) of real-valued linear functions on **F**(*P*). Call it the *tangent* to γ at *P*. The tangents at *P* to all the curves whose paths go through *P* span an *n*-dimensional subspace of F*(*P*). This subspace is, by definition, the tangent space *T*_{*P*}**M**. The tangent spaces at all points of an *n*-manifold **M** can be bundled together in a natural way into a 2*n*-manifold *T***M**. The projection mapping π of *T***M** onto **M** assigns to each tangent vector **v** in *T*_{*P*}**M** the point π(**v**) at which **v** is tangent to **M**. The structure <*T***M**,**M**,π> is the tangent bundle over **M**. A vector field on **M** is a section of *T***M**, i.e., a differentiable mapping *f* of **M** into *T***M** such that π ○ *f* sends each point *P* of **M** to itself; such a mapping obviously assigns to *P* a vector in *T*_{*P*}**M**.
    step1: |-
      设 <**M**,**A**> 是一个 *n* 流形。对 **M** 的每一点 *P*，都配上一个向量空间，称为 *P* 处的*切空间*，记作 *T*_{*P*}**M**。这一想法基于曲面在给定点处的切平面这一直觉观念。它可以这样构造：设 γ 是实数开区间 **I** 到 **M** 的一一可微映射。我们可以把 γ 的相继取值，看作一个点在 **I** 所代表的时间区间内穿行 **M** 的路径。称 γ 为 **M** 中的一条*曲线*（以 *u* ∈ **I** 为参数）。取 *I* 中固定数 *t*_{0}，令 γ(*t*_{0}) = *P*。考虑定义在 *P* 的某邻域上的一切可微实值函数所成的集合 **F**(*P*)。在通常的函数加法与数乘运算下，**F**(*P*) 具有向量空间的结构。**F**(*P*) 中每个函数 *f*，沿 γ 的路径在 *P* 的某邻域内随 *u* 光滑变化。它在 *P* = γ(*t*_{0}) 处的变率，恰由导数 *d*(*f* ○γ)/*d**u* 在 *u* = *t*_{0} 处的值表达。当 *f* 遍历 **F**(*P*) 时，*d*(*f* ○γ)/*d**u* 在 *u* = *t*_{0} 处的值会在 **R** 中变动。于是我们得到 **F**(*P*) 到 **R** 的一个映射，记作 γ·(*u*)。它实际上是线性函数，因而是 **F**(*P*) 上实值线性函数所成对偶空间 F*(*P*) 中的一个向量。称之为 γ 在 *P* 处的*切向量*。所有经过 *P* 的曲线在 *P* 处的切向量，张成 F*(*P*) 的一个 *n* 维子空间。这个子空间按定义就是切空间 *T*_{*P*}**M**。*n* 流形 **M** 各点处的切空间可以自然地汇拢成一个 2*n* 流形 *T***M**。投影映射 π 把 *T***M** 映到 **M** 上，对 *T*_{*P*}**M** 中每个切向量 **v** 指派它在 **M** 上的切点 π(**v**)。结构 <*T***M**,**M**,π> 就是 **M** 上的*切丛*。**M** 上的向量场是 *T***M** 的一个截面，即 **M** 到 *T***M** 的可微映射 *f*，使得 π ○ *f* 把 **M** 的每一点 *P* 送到自身；这样的映射显然为 *P* 指派了 *T*_{*P*}**M** 中的一个向量。
    step2: |-
      设 <$\mathbf{M}$,$\mathbf{A}$> 是一个 *n* 流形。对 $\mathbf{M}$ 的每一点 *P*，都配上一个向量空间，称为 *P* 处的 **切空间**，记作 $T_{P}\mathbf{M}$。此念基于曲面在给定点处切平面这一直觉。构造如下：设 γ 是实数开区间 **I** 到 $\mathbf{M}$ 的一一可微映射。可把 γ 的相继取值，看作一点在 **I** 所代表的时间区间内穿行 $\mathbf{M}$ 的路径。称 γ 为 $\mathbf{M}$ 中的一条 **曲线**（以 *u* ∈ **I** 为参数）。取 *I* 中固定数 *t*_{0}，令 γ(*t*_{0}) = *P*。考虑定义于 *P* 某邻域上的一切可微实值函数所成之集 $\mathbf{F}(P)$。在通常的函数加法与数乘之下，$\mathbf{F}(P)$ 具有向量空间结构。$\mathbf{F}(P)$ 中每个函数 *f*，沿 γ 的路径在 *P* 的某邻域内随 *u* 光滑变化；它在 *P* = γ(*t*_{0}) 处的变率，恰由导数 *d*(*f* ○γ)/*d**u* 在 *u* = *t*_{0} 处的值表出。当 *f* 遍历 $\mathbf{F}(P)$ 时，*d*(*f* ○γ)/*d**u* 在 *u* = *t*_{0} 处的值在 **R** 中变动。于是得到 $\mathbf{F}(P)$ 到 **R** 的一个映射，记作 γ·(*u*)。它实际上是线性函数，因而是 $\mathbf{F}(P)$ 上实值线性函数所成对偶空间 F*(*P*) 中的一向量。称之为 γ 在 *P* 处的 **切向量**。过 *P* 的一切曲线在 *P* 处的切向量，张成 F*(*P*) 的一个 *n* 维子空间；此子空间按定义即切空间 $T_{P}\mathbf{M}$。*n* 流形 $\mathbf{M}$ 各点处的切空间可自然地汇拢成一个 2*n* 流形 $T\mathbf{M}$。投影映射 π 把 $T\mathbf{M}$ 映到 $\mathbf{M}$ 上，对 $T_{P}\mathbf{M}$ 中每个切向量 $\mathbf{v}$ 指派它在 $\mathbf{M}$ 上的切点 π($\mathbf{v}$)。结构 <$T\mathbf{M}$,$\mathbf{M}$,π> 即 $\mathbf{M}$ 上的 **切丛**。$\mathbf{M}$ 上的向量场是 $T\mathbf{M}$ 的一个截面，即 $\mathbf{M}$ 到 $T\mathbf{M}$ 的可微映射 *f*，使 π ○ *f* 把 $\mathbf{M}$ 的每一点 *P* 送到自身；这样的映射显然为 *P* 指派了 $T_{P}\mathbf{M}$ 中的一个向量。
  - id: 6
    kind: body
    source: |-
      Any vector space **V** is automatically associated with other vector spaces, such as the dual space V* of linear functions on **V**, and the diverse spaces of multilinear functions on **V**, on V*, and on any possible combination of **V** and V*. This holds, of course, for each tangent space of an *n*-manifold **M**. The dual of *T*_{*P*}**M** is known as the cotangent space at *P*. There is a natural way of bundling together the cotangent spaces of **M** into a 2*n*-manifold, the cotangent bundle. Generally speaking, all the vector spaces of a definite type associated with the tangent and cotangent spaces of **M** can be naturally bundled together into a *k*-manifold (for suitable integers *k*, depending on the nature of the bundled items). A section of any of these bundles is a *tensor field* on **M** (of rank *r*, if the bundled objects are *r*-linear functions).
    step1: |-
      任何向量空间 **V** 都自动与其他向量空间相联系，例如 **V** 上线性函数所成的对偶空间 V*，以及 **V** 上、V* 上、以及 **V** 与 V* 的各种可能组合上的多重线性函数空间。这当然对 *n* 流形 **M** 的每个切空间都成立。*T*_{*P*}**M** 的对偶称为 *P* 处的*余切空间*。有一种自然的方式把 **M** 的各余切空间汇拢成一个 2*n* 流形，即*余切丛*。一般说来，与 **M** 的切空间和余切空间相联系的一切确定类型的向量空间，都可以自然地汇拢成一个 *k* 流形（*k* 为适当整数，视所汇拢对象的性质而定）。这类丛的任一截面，都是 **M** 上的一个*张量场*（若所汇拢对象为 *r* 重线性函数，则秩为 *r*）。
    step2: |-
      任何向量空间 **V** 都自动与其他向量空间相联系，例如 **V** 上线性函数所成的对偶空间 V*，以及 **V** 上、V* 上、**V** 与 V* 各种可能组合上的多重线性函数空间。这对 *n* 流形 $\mathbf{M}$ 的每个切空间当然都成立。$T_{P}\mathbf{M}$ 的对偶称为 *P* 处的 **余切空间**。有一种自然的方式把 $\mathbf{M}$ 的各余切空间汇拢成一个 2*n* 流形，即 **余切丛**。一般说来，与 $\mathbf{M}$ 的切空间、余切空间相联系的一切确定类型的向量空间，都可自然地汇拢成一个 *k* 流形（*k* 为适当整数，视所汇拢对象的性质而定）。这类丛的任一截面，都是 $\mathbf{M}$ 上的一个 **张量场**（若所汇拢者为 *r* 重线性函数，则秩为 *r*）。
  - id: 7
    kind: body
    source: |-
      A *Riemannian metric* **g** on the *n*-manifold <**M**,**A**> is a tensor field of rank 2 on **M**. Thus, **g** assigns to each *P* in **M** a bilinear function **g**_{*P*} on *T*_{*P*}**M**. For any *P* in **M** and any vectors **v**, **w**, in *T*_{*P*}**M**, **g**_{*P*} must meet these requirements:
    step1: |-
      *n* 流形 <**M**,**A**> 上的一个*黎曼度量* **g**，是 **M** 上的二阶张量场。于是 **g** 给 **M** 中每个 *P* 指派 *T*_{*P*}**M** 上的一个双线性函数 **g**_{*P*}。对 **M** 中任一 *P* 以及 *T*_{*P*}**M** 中任二向量 **v**、**w**，**g**_{*P*} 必须满足下列要求：
    step2: |-
      *n* 流形 <$\mathbf{M}$,$\mathbf{A}$> 上的一个 **黎曼度量** $\mathbf{g}$，是 $\mathbf{M}$ 上的二阶张量场。于是 $\mathbf{g}$ 为 $\mathbf{M}$ 中每个 *P* 指派 $T_{P}\mathbf{M}$ 上的一个双线性函数 $\mathbf{g}_{P}$。对 $\mathbf{M}$ 中任一 *P*，以及 $T_{P}\mathbf{M}$ 中任二向量 $\mathbf{v}$、$\mathbf{w}$，$\mathbf{g}_{P}$ 必须满足下列要求：
  - id: 8
    kind: body
    source: |-
      1. **g**_{*P*}(**v**,**w**) = **g**_{*P*}(**w**,**v**)       (symmetry)
      2. **g**_{*P*}(**v**,**w**) = 0 for all vectors **w** in *T*_{*P*}**M** if and only if **v** is the 0-vector       (non-degeneracy)
      3. **g**_{*P*}(**v**,**v**) > 0 unless **v** is the 0-vector       (positive definiteness).
    step1: |-
      1. **g**_{*P*}(**v**,**w**) = **g**_{*P*}(**w**,**v**)       (symmetry)
      2. **g**_{*P*}(**v**,**w**) = 0 for all vectors **w** in *T*_{*P*}**M** if and only if **v** is the 0-vector       (non-degeneracy)
      3. **g**_{*P*}(**v**,**v**) > 0 unless **v** is the 0-vector       (positive definiteness).
    step2: |-
      1. $\mathbf{g}_{P}$($\mathbf{v}$,$\mathbf{w}$) = $\mathbf{g}_{P}$($\mathbf{w}$,$\mathbf{v}$)　　（对称性）
