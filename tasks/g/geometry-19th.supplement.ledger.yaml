  - id: 12
    kind: body
    source: |-
      Thus, in Riemannian geometry, the length of the tangent vector γ·(*u*) bears witness to the advance of curve *g* as it passes through the point γ(*u*). The definition of the length of a curve leads at once to the notion of a geodesic (or straightest) curve, which is characterized by the fact that its length is extremal; in other words, a geodesic is either the greatest or the shortest among all the curves that trace out neighboring paths between the same two points.
    step1: |-
      可见，在黎曼几何中，切向量 γ·(*u*) 的长度见证了曲线 *g* 经过点 γ(*u*) 时的推进。曲线长度的定义立刻引出*测地线*（或最直曲线）的概念：其特征是长度取极值；换言之，测地线或是在同样两点之间描出邻近路径的一切曲线中最长的，或是最短的。
    step2: |-
      可见，在黎曼几何中，切向量 γ·(*u*) 的长度见证了曲线 *g* 经过点 γ(*u*) 时的推进。曲线长度的定义随即引出 **测地线**（或最直曲线）的概念：其特征为长度取极值；换言之，测地线在同样两点之间描出邻近路径的一切曲线中，或最长，或最短。
  - id: 13
    kind: body
    source: |-
      In his study of curved surfaces, Gauss introduced a real-valued function, the *Gaussian curvature*, which measures a surface's local deviation from flatness in terms of the surface's intrinsic geometry. Riemann extended this concept of curvature to Riemannian *n*-manifolds. He observed that each geodesic through a point in such a manifold is fully determined by its tangent vector at that point. Consider a point *P* in a Riemannian *n*-manifold <**M**,**A**,**g**> and two linearly independent vectors **v** and **w** in *T*_{*P*}**M**. The geodesics determined by all linear combinations of **v** and **w** form a 2-manifold about *P*, with a definite Gaussian curvature *K*_{*P*}(**v**,**w**) at *P*. The real number *K*_{*P*}(**v**,**w**) measures the curvature of **M** at *P* in the “surface direction” (Riemann 1854, p. 145) fixed by **v** and **w**. In particular, if *n* = 3 and *K*_{*P*}(**v**,**w**) takes the same constant value *k* for every choice of the point *P* and of the vectors **v** and **w**, then the manifold <**M**,**A**,**g**> is a realization of Euclidian space if *k* = 0, of Lobachevskian space if *k* < 0, and of either spherical or elliptic space if *k* > 0. Riemann (1861) thought up a global mapping, depending on the metric **g**, that yields the appropriate values of *K*_{*P*}(**v**,**w**) on appropriate arguments *P*, **v** and **w**. Nowadays this object is conceived as a tensor field of rank 4, which assigns to each point *P* in a Riemannian *n*-manifold <**M**,**A**,**g**> a 4-linear function on the tangent space *T*_{*P*}**M**. It is therefore known as the *Riemann tensor*. Given the above definition of *K*_{*P*}(**v**,**w**) it is clear that, if *n* = 2, the Riemann tensor reduces to the Gaussian curvature function.
    step1: |-
      高斯在研究曲面时引入过一个实值函数，即*高斯曲率*，它以曲面的内蕴几何度量曲面局部偏离平坦的程度。黎曼把这一曲率概念推广到黎曼 *n* 流形。他注意到，这种流形中经过一点的每条测地线，完全由它在该点处的切向量决定。考虑黎曼 *n* 流形 <**M**,**A**,**g**> 中的一点 *P*，以及 *T*_{*P*}**M** 中两个线性无关的向量 **v** 与 **w**。由 **v** 与 **w** 的一切线性组合所确定的测地线，在 *P* 周围构成一个 2 流形，并在 *P* 处具有确定的高斯曲率 *K*_{*P*}(**v**,**w**)。实数 *K*_{*P*}(**v**,**w**) 度量 **M** 在 *P* 处沿由 **v** 与 **w** 所确定的“曲面方向”（Riemann 1854, p. 145）的曲率。特别地，若 *n* = 3，且对点 *P* 与向量 **v**、**w** 的每一种选择，*K*_{*P*}(**v**,**w**) 都取同一常数值 *k*，则流形 <**M**,**A**,**g**> 在 *k* = 0 时是欧几里得空间的实现，在 *k* < 0 时是罗巴切夫斯基空间的实现，在 *k* > 0 时是球面空间或椭圆空间的实现。黎曼（1861）构想出一个全局映射，它依赖于度量 **g**，在适当的自变量 *P*、**v**、**w** 上给出 *K*_{*P*}(**v**,**w**) 的适当值。如今这个对象被设想为一个四阶张量场，它给黎曼 *n* 流形 <**M**,**A**,**g**> 中每一点 *P* 指派切空间 *T*_{*P*}**M** 上的一个四重线性函数，因此被称为*黎曼张量*。由上述 *K*_{*P*}(**v**,**w**) 的定义显然可见，若 *n* = 2，黎曼张量就归结为高斯曲率函数。
    step2: |-
      高斯研究曲面时引入过一个实值函数——**高斯曲率**，它依曲面的内蕴几何度量曲面局部偏离平坦的程度。黎曼把这一曲率概念推广到黎曼 *n* 流形。他注意到，这种流形中经过一点的每条测地线，完全由它在该点处的切向量决定。考虑黎曼 *n* 流形 <$\mathbf{M}$,$\mathbf{A}$,$\mathbf{g}$> 中的一点 *P*，以及 $T_{P}\mathbf{M}$ 中两个线性无关的向量 $\mathbf{v}$ 与 $\mathbf{w}$。由 $\mathbf{v}$ 与 $\mathbf{w}$ 的一切线性组合所确定的测地线，在 *P* 周围构成一个 2 流形，并在 *P* 处具有确定的高斯曲率 *K*_{*P*}($\mathbf{v}$,$\mathbf{w}$)。实数 *K*_{*P*}($\mathbf{v}$,$\mathbf{w}$) 度量 $\mathbf{M}$ 在 *P* 处沿 $\mathbf{v}$ 与 $\mathbf{w}$ 所确定的“曲面方向”（Riemann 1854, p. 145）的曲率。特别地，若 *n* = 3，且对点 *P* 与向量 $\mathbf{v}$、$\mathbf{w}$ 的每一种选择，*K*_{*P*}($\mathbf{v}$,$\mathbf{w}$) 都取同一常数值 *k*，则流形 <$\mathbf{M}$,$\mathbf{A}$,$\mathbf{g}$> 在 *k* = 0 时实现欧几里得空间，*k* < 0 时实现罗巴切夫斯基空间，*k* > 0 时实现球面空间或椭圆空间。黎曼（1861）构想出一个全局映射，它依赖度量 $\mathbf{g}$，在适当的自变量 *P*、$\mathbf{v}$、$\mathbf{w}$ 上给出 *K*_{*P*}($\mathbf{v}$,$\mathbf{w}$) 的适当值。如今此对象被设想为一个四阶张量场，它给黎曼 *n* 流形 <$\mathbf{M}$,$\mathbf{A}$,$\mathbf{g}$> 中每一点 *P* 指派切空间 $T_{P}\mathbf{M}$ 上的一个四重线性函数，故称 **黎曼张量**。由上述 *K*_{*P*}($\mathbf{v}$,$\mathbf{w}$) 的定义显然可见，若 *n* = 2，黎曼张量便归结为高斯曲率函数。
