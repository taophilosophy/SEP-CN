    source: |-
      1 The informal characterization of *n*-manifolds in the supplement is not altogether accurate and may cover some far-fetched monsters that we do not wish to cover with this concept. For readers who have a smattering of topology the following characterization is preferable.

      > (a) Let **M** be a set of points. Pick a collection of partially overlapping subsets of **M**, or *patches,* such that every point of **M** lies in at least one patch.
      >
      > (b) If *U* is a patch of *M*, there is a one-one mapping *f* of *U* onto an open space of **R**^{*n*}, whose inverse we denote by *f*^{−1}. (**R**^{*n*} denotes here the collection of all real number *n*-tuples, with the standard topology generated by the open balls.) *f* is a coordinate system or *chart* of **M**; the *k*-th number in the *n*-tuple assigned by a chart *f* to a point *P* in *f*'s domain is called the *k*-th coordinate of *P* by *f*; the *k*-th coordinate function of chart *f* is the real-valued function that assigns to each point of the patch its *k*-th coordinate by *f*.
      >
      > (c) There is a collection **A** of charts of **M** which contains at least one chart defined on each patch of **M** and is such that, if *g* and *h* belong to **A**, the composite mappings *h*○*g*^{−1} and *g*○*h*^{−1} — known as *coordinate transformations* — are differentiable to every order wherever they are well defined. (Denote the real number *n*-tuple (*a*₁, ... , *a*_{*n*}) by **a**. *h*○*g*^{−1} is well defined at **a** if **a** is the valued assigned by *g* to some point *P* of **M** to which *h* also assigns a value. Suppose that the latter value *h*(*P*) = (*b*₁,...., *b*_{*n*}) = **b**; then, **b** = *h*○*g*^{−1}(**a**). Since *h*○*g*^{−1} maps a region of **R**^{*n*} into **R**^{*n*}, it makes sense to say that *h*○*g*^{−1} is differentiable.) Such a collection **A** is called an *atlas* for **M**.
      >
      > (d) A given atlas **A** for **M** can be extended in one and only one way to a maximal atlas **A**ₘₐₓ as follows: add to **A** every one-one mapping *g* of a subset of **M** onto an open set of **R**^{*n*} which, combined with any chart *h* of **A**, satisfies the condition of differentiability stated under (c).
      >
      > (e) **M** is given the weakest Hausdorff topology that makes every chart *g* in **A**ₘₐₓ into a homeomorphism. (A topological space is said to be Hausdorff if any two points in it have open neighborhoods that do not overlap.)

      The pair (**M**,**A**) is an *n*-manifold.
    step1: |-
      [^note-sup1]: 补充材料中对 *n* 流形的非形式刻画并不完全准确，可能会涵盖我们不愿用这一概念涵盖的某些离奇怪物。对略知拓扑的读者，下述刻画更为可取。

      > (a) 设 **M** 是一个点集。选取 **M** 的一族部分重叠子集，或*坐标片*，使得 **M** 的每一点都至少落在一个坐标片内。
      >
      > (b) 若 *U* 是 *M* 的一个坐标片，则存在 *U* 到 **R**^{*n*} 某开集上的一一映射 *f*，其逆记作 *f*^{−1}。（**R**^{*n*} 在此指一切实数 *n* 元组的集合，配以由开球生成的标准拓扑。）*f* 是 **M** 的一个坐标系或*坐标卡*；坐标卡 *f* 赋予其定义域内一点 *P* 的 *n* 元组中第 *k* 个数，称为 *P* 在 *f* 下的第 *k* 个坐标；坐标卡 *f* 的第 *k* 个坐标函数，是把坐标片内每一点对应到其在 *f* 下第 *k* 个坐标的实值函数。
      >
      > (c) 存在 **M** 的一个坐标卡集合 **A**，它在 **M** 的每个坐标片上都至少包含一个定义于其上的坐标卡，并且：若 *g* 与 *h* 属于 **A**，则复合映射 *h*○*g*^{−1} 与 *g*○*h*^{−1}——称为*坐标变换*——在其有定义之处任意阶可微。（用 **a** 表示实数 *n* 元组 (*a*₁, ... , *a*_{*n*})。若 **a** 是 *g* 赋予 **M** 中某点 *P* 的值，而 *h* 也赋予 *P* 一个值，则 *h*○*g*^{−1} 在 **a** 处有定义。设后一值为 *h*(*P*) = (*b*₁,...., *b*_{*n*}) = **b**；那么 **b** = *h*○*g*^{−1}(**a**)。既然 *h*○*g*^{−1} 把 **R**^{*n*} 的一个区域映入 **R**^{*n*}，说 *h*○*g*^{−1} 可微便有意义。）这样的集合 **A** 称为 **M** 的一个*图册*。
      >
      > (d) 给定 **M** 的一个图册 **A**，可以唯一地把它扩张为一个极大图册 **A**ₘₐₓ，办法如下：向 **A** 添加每一个把 **M** 的某个子集一一映射到 **R**^{*n*} 某开集上的映射 *g*，只要它与 **A** 中任一坐标卡 *h* 复合时满足 (c) 所陈述的可微性条件。
      >
      > (e) **M** 被赋予使 **A**ₘₐₓ 中每个坐标卡 *g* 都成为同胚的最弱豪斯多夫拓扑。（拓扑空间称为豪斯多夫空间，若其中任两点都有互不重叠的开邻域。）

      有序对 (**M**,**A**) 是一个 *n* 流形。
