      During the 1850s and 60s Eliot and Lewes travelled quite frequently to the European continent, especially the major cities of Germany and Italy. The couple did not have children, though Eliot was stepmother to Lewes’s three sons. Lewes died in 1878, and in the spring of 1880 Eliot married her old friend John Cross, a wealthy banker. She died in London on December 22, 1880. She was buried under the names “Mary Ann Cross” and “George Eliot” in North London’s Highgate Cemetery, next to Lewes’s grave. Her wish to be buried in Poet’s Corner in Westminster Abbey was denied by church leaders due to her “notorious antagonism to Christian practice in regard to marriage” (Carlisle 2023: 267–8)[^carlisle-2023].
    step1: |-
      十九世纪五十年代和六十年代，艾略特与刘易斯颇为频繁地前往欧陆，尤其是德国与意大利的大城市。两人没有子女，不过艾略特是刘易斯三个儿子的继母。刘易斯1878年去世；1880年春，艾略特嫁了旧友、富有的银行家约翰·克罗斯。她1880年12月22日在伦敦去世，以“玛丽·安·克罗斯”与“乔治·艾略特”两个名字葬在伦敦北的海格特公墓，紧挨着刘易斯的墓。她曾希望葬进威斯敏斯特教堂的诗人角，教会方面以她“在婚姻问题上对基督教实践的公然对抗”为由拒绝了（Carlisle 2023: 267–8）[^carlisle-2023]。
