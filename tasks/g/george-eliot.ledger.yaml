      As a creator of characters, Eliot confronted questions about the nature and significance of character throughout her literary career. In this way she contributed to wider philosophical debates: in 1843 John Stuart Mill proposed an “Exact Science of Human Nature” which would be a “science of character…including the formation of national or collective character as well as individual” (Mill 1843: bk. VI, ch. V, §4 [1889: 567])[^mill-1843]. Mill named this new science “Ethology”, thus placing it within an Aristotelian tradition of moral philosophy focused on the cluster of concepts—character, custom, habit, and way of life—signalled by the Greek word *ethos*. Eliot invokes this tradition explicitly by naming the narrator of her final work after Theophrastus, pupil of Aristotle and author of *The Characters* (Henry 1994; Brilmyer 2014)[^brilmyer-2014][^henry-1994]. The working title of *Impressions of Theophrastus Such* was “Characters and Characteristics of Theophrastus Such”.
    step1: |-
      作为性格的创造者，艾略特在整个文学生涯中都在面对关于性格之本性与意义的问题。她由此参与了更广的哲学论争：1843年，约翰·斯图亚特·密尔提出一门“关于人性的精确科学”，它将是一门“性格的科学……既包括个人性格的形成，也包括民族或集体性格的形成”（Mill 1843: bk. VI, ch. V, §4 [1889: 567]）[^mill-1843]。密尔把这门新科学命名为“Ethology（性格学）”，由此把它放进一个亚里士多德式的道德哲学传统，该传统聚焦于一组概念：性格、习俗、习惯、生活方式，其标志是希腊词 *ethos*。艾略特明确地援引这一传统：她给自己的最后一部作品中的叙述者取名特奥弗拉斯托斯，此人乃亚里士多德的学生，《人物志》的作者（Henry 1994; Brilmyer 2014）[^brilmyer-2014][^henry-1994]。《特奥弗拉斯托斯·萨奇印象》的暂定书名是“特奥弗拉斯托斯·萨奇的人物与性格”。
    step2: |-
