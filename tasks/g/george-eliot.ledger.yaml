      艾略特道德哲学的核心是同情这个概念，它受惠于费尔巴哈。费尔巴哈的《基督教的本质》由她在五十年代初译出，书中把“共同受苦”立为伦理生活的根基（Feuerbach 1854: 53；见 Griffin 2017; Anger 2001 [2019]）[^feuerbach-1854][^anger-2001][^griffin-2017]。在艾略特的小说里，同情是认知上、情感上双重的成就，根在人性的自然情感里，而这情感需要养、需要校正。同情还解另一种常见的人性毛病：苛刻地评判别人。《珍妮特的悔悟》的叙述者赞“深察的同情，它比一切责备明智，比一切斥责有力”（SCL 203）。《米德尔马契》里，同情的认知之力在一场情感危机中格外显出来：多萝西娅发觉，她全部“鲜活的同情经验如今回到身上，成了一种力”，照亮了她的实践理性，“就像既得的知识自己主张起来，不叫我们再照无知那日的样子看”（M II: 321）。
