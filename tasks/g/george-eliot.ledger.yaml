      While Eliot’s writings frequently reference political events and issues, her approach to such matters is more moral than political. Broadly speaking, she maintained a hope for both individual and collective moral progress. Politically, she favoured gradual and moderate reform, rather than revolution, because she believed that continuity with the past is the essence of culture. From *Felix Holt: The Radical* onwards, her thinking about the role of art within the national political arena engaged closely with Mill’s “On Representative Government” and Matthew Arnold’s *Culture and Anarchy* (Gallagher 1985: 217–267)[^gallagher-1985]. Her consideration of these questions is characteristically attuned to ambiguity.
    step1: |-
      艾略特的写作虽常涉及政治事件与议题，她对这类事情的态度却更偏道德而非政治。宽泛地说，她对个人与集体的道德进步都抱有希望。政治上，她倾向于渐进、温和的改革，而不是革命，因为她相信与过去的连续性才是文化的本质。从《费利克斯·霍尔特：激进派》起，她关于艺术在民族政治场域中作用的思考，便与密尔的《论代议制政府》和阿诺德的《文化与无政府状态》密切交涉（Gallagher 1985: 217–267）[^gallagher-1985]。她对这些问题的考虑，一贯对含混之处保持敏感。
    step2: |-
      艾略特写的东西虽常涉及政治事件与议题，她待这类事的态度更偏道德，不偏政治。宽泛地说，她对个人和集体的道德进步都存着希望。政治上她倾向渐进、温和的改革，不倾向革命，因为她信文化之本质在于同过去的连续。从《费利克斯·霍尔特：激进派》起，她思考艺术在民族政治场里的作用，就紧贴着密尔《论代议制政府》与阿诺德《文化与无政府状态》（Gallagher 1985: 217–267）[^gallagher-1985]。她考虑这些问题，一向对含混处敏感。
