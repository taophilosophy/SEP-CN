      While Eliot usually described herself as an artist, many contemporaries regarded her as a philosopher. A few months after her death, an early volume of *MIND* carried a substantial article on “George Eliot’s Art” (Sully 1881)[^sully-1881]. During the twentieth century, her exploratory intellectual style, coupled with her decision to work in the medium of fiction, tended to occlude her significance for an increasingly professionalized and technical discipline of philosophy. Twenty-first-century scholars have been more keen to recognize Eliot’s contributions to philosophy, especially in view of the fact that Victorian women had to philosophize outside the academy. While British universities did not begin to admit women until the 1860s and restricted their access to higher qualifications and academic careers well into the twentieth century, philosophical thinking can be found in a wide variety of women’s writing, including letters, poems, novels, travel writing, memoir, and journalism (Stone 2023)[^stone-2023].
    step1: |-
      艾略特通常把自己说成艺术家，但许多同时代人把她看作哲学家。她死后几个月，《心灵》（*Mind*）杂志早期的一卷就刊出论“乔治·艾略特的艺术”的长文（Sully 1881）[^sully-1881]。在二十世纪，她那种探索性的思想风格，加上她选择在小说这一媒介中工作，使她的重要性对一个日益专业化、日益技术化的哲学学科趋于遮蔽。二十一世纪的学者更愿意承认艾略特对哲学的贡献，尤其考虑到维多利亚时代的女性不得不在学院之外做哲学这件事。英国大学直到十九世纪六十年代才开始接收女生，而把女性限制在高等学位与学术生涯之外，则一直延续到二十世纪；但哲学性的思考可以在妇女写作的各种体裁中找到，包括书信、诗、小说、游记、回忆录和新闻（Stone 2023）[^stone-2023]。
    step2: |-
      艾略特自己常说她是艺术家，许多同时代人却把她当哲学家。她死后不过几个月，《心灵》（*Mind*）杂志的早期一卷就登了论“乔治·艾略特的艺术”的长文（Sully 1881）[^sully-1881]。到了二十世纪，她那探索性的思想方式，加上她挑中小说这个媒介来做工，使她的重要性在一个日益专业化、日益技术化的哲学学科里趋于被遮蔽。二十一世纪的学者更愿意承认艾略特对哲学的贡献，尤其因为维多利亚时代的女性只能在学院之外做哲学。英国大学到十九世纪六十年代才开始收女生，而把女性挡在高等学位与学术生涯之外，一直拖到二十世纪；可是哲学性的思考到处存在于妇女的写作里：书信、诗、小说、游记、回忆录、新闻，都有（Stone 2023）[^stone-2023]。
