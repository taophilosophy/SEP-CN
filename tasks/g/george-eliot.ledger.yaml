      Eliot’s literary practice was integral to her philosophical method. Her style of thinking is often exploratory and dialectical, reflexive and self-problematizing. When doctrinal statements are made by a character or a narrator, we cannot assume they articulate Eliot’s own position. For these reasons, her philosophical claims can be difficult to pin down. Moreover, she argued against the application of “general doctrine[s]” (M III: 133) and “general rules” (MF III: 265) to the complexities of human life. Eliot aimed less to solve problems, or offer ready-made doctrines, than to undertake an open-ended enquiry alongside her readers. In 1875, while writing *Daniel Deronda*, she stated that “I don’t consider myself a teacher, but a companion in the struggle for thought” (Eliot to Mary Ponsonby, 11 February 1875; LGHL 3: 83).
    step1: |-
      艾略特的文学实践，是她哲学方法不可分割的一部分。她的思想方式常是探索性的、辩证性的，反身而自设难题。当某个人物或某个叙述者作出教义式的陈述时，我们不能假定那就是艾略特本人的立场。因此，她的哲学主张有时难以确定。再者，她还反对把“一般学说”（M III: 133）与“一般规则”（MF III: 265）应用于人类生活的复杂情形。与其解决问题、提供现成的学说，她的目标毋宁说是与读者一同从事一种没有终点的探询。1875年写《丹尼尔·德隆达》期间，她说过：“我不把自己看作教师，而是思想斗争中的同伴”（艾略特致玛丽·庞森比，1875年2月11日；LGHL 3: 83）。
    step2: |-
      艾略特的文学实践，本就是她哲学方法内在的一环。她的思想方式常是探索的、辩证的，反身自询，自己给自己设难题。人物或叙述者说出教义式的断言时，我们不能假定那就是艾略特本人的立场。她的哲学主张因此有时难以下定论。她还反对把“一般学说”（M III: 133）和“一般规则”（MF III: 265）套在人类生活的复杂情形上。她要做的与其说是解决问题、给出成套学说，不如说是同读者一起从事一场不见终点的探询。1875年写《丹尼尔·德隆达》时她说：“我不把自己当教师，而当思想这场角力中的同伴”（艾略特致玛丽·庞森比，1875年2月11日；LGHL 3: 83）。
