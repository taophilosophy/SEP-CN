      Eliot was cautiously supportive of widening women’s access to higher education. In 1869 her friends Barbara Bodichon and Emily Davies founded Cambridge’s first women’s college, to which Eliot—who was by then wealthy as a consequence of her bestselling novels—donated a relatively modest £50. Her writing is more emphatic in highlighting the paucity of women’s education and considering its diverse effects on different female characters. *Middlemarch*’s Rosamond Vincy, whose shallow education does nothing to reform her vain, self-centred character, exemplifies Mary Wollstonecraft’s ingenious argument that giving women equal access to education will be beneficial to men. In a brief essay on Wollstonecraft’s *The Vindication of the Rights of Women* (1792), Eliot endorses the view that “so far as obstinacy is concerned, your unreasoning animal is the most unmanageable of creatures”: in other words, an “unreasoning” wife will be troublesome to her husband (Eliot 1855c: 988–9; Carlisle 2023: 196–7)[^carlisle-2023]. The plot of *Middlemarch* exposes Dr Lydgate’s error in fearing intellectual women, since Rosamond, his wife, turns out to be a far more formidable adversary.
    step1: |-
      艾略特对扩大女性接受高等教育的机会持谨慎的支持态度。1869年，她的友人芭芭拉·博迪雄与埃米莉·戴维斯创办剑桥第一所女子学院，艾略特——其时因畅销小说而富有——捐了相对微薄的五十英镑。她的文字在凸显女性教育的贫乏、并考量这对不同女性人物的多样影响方面，态度要明确得多。《米德尔马契》的罗莎蒙德·文西受的教育浅薄，对她的虚荣与自我中心毫无矫正之功，恰好印证了玛丽·沃斯通克拉夫特那巧妙的论证：让女性平等地受教育，对男人也有好处。在一篇评沃斯通克拉夫特《女权辩护》（1792）的短文中，艾略特赞同这一看法：“就固执而言，你那不讲理的畜生是最难对付的造物”：换句话说，一个“不讲理”的妻子会给丈夫添麻烦（Eliot 1855c: 988–9; Carlisle 2023: 196–7）[^carlisle-2023]。《米德尔马契》的情节揭出利德盖特医生害怕有智识的女人的错误，因为他的妻子罗莎蒙德原来是个难对付得多的对手。
