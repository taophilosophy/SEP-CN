      The concept of sympathy at the heart of Eliot’s moral philosophy is indebted to Feuerbach, whose *Essence of Christianity*—which Eliot translated in the early 1850s—made “suffering in common” a foundation for ethical life (Feuerbach 1854: 53; see Griffin 2017; Anger 2001 [2019])[^feuerbach-1854][^anger-2001][^griffin-2017]. In Eliot’s novels, sympathy is a cognitive and emotional achievement, rooted in natural human feelings that are in need of cultivation and correction. Sympathy provides an antidote to another prevailing human tendency: harsh moral judgements of others. The narrator of “Janet’s Repentance” praises “deep-sighted sympathy which is wiser than all blame, more potent than all reproof” (SCL 203). In *Middlemarch*, sympathy’s cognitive power is accentuated through a key scene of emotional crisis, where Dorothea finds that all her “vivid sympathetic experience returned to her now as a power”, illuminating her practical reason “as acquired knowledge asserts itself and will not let us see as we saw in the day of our ignorance” (M II: 321).
    step1: |-
      艾略特道德哲学核心的同情概念，受惠于费尔巴哈；他的《基督教的本质》——艾略特在十九世纪五十年代初译出——把“共同受苦”当作伦理生活的根基（Feuerbach 1854: 53；见 Griffin 2017; Anger 2001 [2019]）[^feuerbach-1854][^anger-2001][^griffin-2017]。在艾略特的小说里，同情是一项认知与情感的成就，植根于人性的自然情感，而这些情感需要培养与校正。同情提供了对另一种流行人性倾向的解药：对他人严厉的道德评判。《珍妮特的悔悟》的叙述者称赞“深察的同情，它比一切责备更明智，比一切斥责更有力”（SCL 203）。在《米德尔马契》中，同情的认知力量通过一场情感危机的关键场景得到凸显：多萝西娅发现，她全部“鲜活的同情经验如今作为一股力量回到她身上”，照亮了她的实践理性，“如同既得的知识自行主张，不让我们再照无知之日那样看”（M II: 321）。
