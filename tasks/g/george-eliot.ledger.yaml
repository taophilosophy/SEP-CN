      Eliot’s art engages in intensive yet subtle ways with what Victorians called “the Woman Question”. She returns repeatedly to the question of female vocation; several of her female characters struggle to find intellectual or artistic fulfilment. Marriage is explored in all her novels, especially but not exclusively from a female point of view. In keeping with her moral particularism, Eliot considers broadly moral benefits and harms within a series of particular marriages. She gives close attention to marital violence and coercive control: variations on this theme appear in “Janet’s Repentance”, “The Lifted Veil”, *Romola*, *Middlemarch*, and *Daniel Deronda*. Her analysis of two unhappy marriages in *Middlemarch* mirrors Hegel’s account of the master-slave dialectic in *The Phenomenology of Spirit*, which Eliot studied while writing the novel. Drawing on the Hegelian theme of recognition, Eliot’s depiction of the Casaubons and the Lydgates explores how a partnership can be mutually destructive: all these partners misrecognize one another, because they imagine their prospective spouse according to their own desires (Armstrong 2020; Carlisle 2023: 190–98)[^armstrong-2020][^carlisle-2023]. Eliot’s most radically feminist critique of marriage occurs in *Daniel Deronda*, where the heroine, feeling compelled to marry for money, enters an abusive marriage portrayed as *de facto* prostitution, with disastrous psychological consequences.
