      也许不必说：一位以小说为媒介从事哲学工作的十九世纪女性，作为哲学家，得到的重视不如 J. S. 密尔、赫伯特·斯宾塞这类同时代人。尽管如此，尼采对乔治·艾略特足够重视，认为她值得一骂。在《偶像的黄昏》中，他把艾略特（一个“道德上的小女人”）当作英国“道德家”的首要例子：这些人否弃基督教信仰，只为更紧地攀住基督教道德（Nietzsche 1889: *Streifzüge eines Unzeitgemässen* §5 [2005: 193]）[^nietzsche-1889]。这里尼采显出他对艾略特道德思考之精微与复杂的无知；他自己那种自然主义的、生理学的伦理学，其实受惠于一个英国哲学传统，而这个传统是艾略特同斯宾塞、刘易斯一道帮助塑成的（见 Staten 2014: 1–9）[^staten-2014]。十九世纪七十与八十年代，西格蒙德·弗洛伊德读过并欣赏《米德尔马契》与《丹尼尔·德隆达》，可能受过艾略特关于“被压抑的经验”（DD II: 120）对心理与情感发展之作用的研究的影响，也受过她对女性经验的微妙探查的影响（见 Jones 1953: 131, 168, 174; Rotenberg 1999）[^jones-1953][^rotenberg-1999]。由于那段虐待性的婚姻，《丹尼尔·德隆达》的女主人公表现出当时正受到科学注意的神经疾患症状，如癔症与神经性厌食（Vrettos 1990; Matus 2008; Carlisle 2023: 221–2, 342–3）[^carlisle-2023][^matus-2008][^vrettos-1990]。
