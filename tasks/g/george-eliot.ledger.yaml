      The concept of character was Eliot’s route into metaphysical questions of freedom and determinism (G. Levine 1962; Brilmyer 2015)[^brilmyer-2015][^levine-1962]. At stake in nineteenth-century debates about character was a dispute between biological determinists and defenders of a liberal doctrine of collective and individual moral improvement. Though influenced by the strict determinism she encountered while translating Spinoza’s *Ethics*, Eliot refuses the polarities of this debate and probes its complexities. Her art emphasizes social over biological constraints, and inter-dependence over both determinism and free will. Its explorations of habit and custom—laws that, to borrow Leibniz’s opportune phrase, “incline without necessitating” (Look 2008 [2022: § 4])[^look-2008]—open up a middle path through these alternatives. In “The Natural History of German Life”, an 1856 review of two works by the German sociologist Wilhelm Riehl, Eliot notes “the generic character of the German peasant” for whom “custom” is the “supreme law” (Eliot 1856b: 68; Dillane 2009)[^dillane-2009].
