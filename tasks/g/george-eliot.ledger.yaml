      It perhaps goes without saying that a nineteenth-century woman who pursued her philosophical work in the medium of fiction was taken less seriously, as a philosopher, than contemporaries such as J. S. Mill and Herbert Spencer. Nevertheless, Nietzsche took George Eliot seriously enough to deem her worthy of insult. In *Twilight of the Idols* he treats Eliot (a “little moral female”) as the prime example of English “moralists” who reject Christian belief only to cling more tightly to Christian morality (Nietzsche 1889: *Streifzüge eines Unzeitgemässen* §5 [2005: 193])[^nietzsche-1889]. Here Nietzsche displays his ignorance of the sophistication and complexity of Eliot’s moral thinking; his own naturalistic, physiological ethics were indebted to an English philosophical tradition that Eliot, along with Spencer and Lewes, helped to shape (see Staten 2014: 1–9)[^staten-2014]. In the 1870s and 80s Sigmund Freud read and admired *Middlemarch* and *Daniel Deronda*, and may have been influenced by Eliot’s study of the effects of “suppressed experience” (DD II: 120) on psychological and emotional development, as well as by her subtle explorations of female experience in particular (see Jones 1953: 131, 168, 174; Rotenberg 1999)[^jones-1953][^rotenberg-1999]. As a consequence of her abusive marriage, the heroine of *Daniel Deronda* displays symptoms of nervous disorders, such as hysteria and anorexia nervosa, that were receiving scientific attention at that time (Vrettos 1990; Matus 2008; Carlisle 2023: 221–2, 342–3)[^carlisle-2023][^matus-2008][^vrettos-1990].
