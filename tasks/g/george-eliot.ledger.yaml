      Eliot treats the artist’s creative egoism with similar ambivalence. We have seen (4.1) how Eliot’s artist mediates reality in the mirror of their own subjectivity and experience. This is depicted as an act of generosity or of narcissism—or possibly both at once. When the narrator of *Adam Bede* expounds his theory of literary realism, he rejects the idealizing alternative, which would “refashion life and character entirely after my own liking”, thereby creating an “arbitrary picture” (AB I: 265). Eliot uses similar phrasing to describe young Maggie Tulliver, the partially autobiographical heroine of *The Mill on the Floss*, “refashioning her little world into just what she should like it to be” (MF I: 69). Maggie, an avid reader, feels that “the world outside books was not a happy one” (MF II: 80). Perhaps Eliot’s implicit comment here is that Maggie’s imagination is shaped by idealizing, romanticizing literature of the type she criticizes. Yet the characterization may also involve a self-critique. Despite her realist commitment to truthfully depicting averagely flawed human beings, the distinctive compassionate tone of Eliot’s narrative voice nevertheless refashions the world as she would like it to be. The literary world of Eliot’s fiction is infused with sympathy and acceptance; it is, in other words, a world as it appears in the eyes of an attentive, loving mother. James Sully aptly described Eliot’s trademark “attitude of a large maternal charity” and “mood of compassionate tenderness touched with playful indulgence” (Sully 1881: 391)[^sully-1881]. In this respect Eliot’s fictive world is markedly different from the real world that its author herself experienced—a world formed both by narrowly moralistic human judgements, and by the doctrines of divine judgement espoused by patriarchal religion.
