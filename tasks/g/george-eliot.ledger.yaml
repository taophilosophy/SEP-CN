      Like character, the milieu is a crucial concept in Eliot’s art. In the early decades of the nineteenth century this concept emerged, within the new science of biology, to draw attention to the relations between an organism and its surrounding conditions of existence. Lamarck’s *les circonstances* and Geoffroy Saint-Hilaire’s *le milieu ambiant* preceded Auguste Comte’s use of *le milieu* in 1838, evoking “a certain intuition of a centred formation” (Canguilhem 2001: 11)[^canguilhem-2001]. Another new science, “sociology”, stretched the concept to encompass cultural as well as natural conditions of life. In the early 1850s, Eliot urged Herbert Spencer to read Comte’s *Cours de philosophie positive*; Spencer then developed Comte’s concept of milieu, proposing “environment” as a single term naming biological and social circumstances. His thesis that organisms are constantly adjusting to their environment anticipated the theory of adaptation presented in Darwin’s *Origin of Species*.
    step1: |-
      与性格一样，环境在艾略特的艺术中也是一个关键概念。在十九世纪最初几十年，这个概念在生物学这门新兴科学内部出现，用以引起人们对有机体与其周围生存条件之间关系的注意。拉马克的 *les circonstances*（周围条件）与若弗鲁瓦·圣伊莱尔的 *le milieu ambiant*（周围环境），早于奥古斯特·孔德1838年对 *le milieu* 的使用，后者唤起“对一种有中心之构型的某种直觉”（Canguilhem 2001: 11）[^canguilhem-2001]。另一门新兴科学“社会学”把这个概念伸展到文化的、以及自然的生活条件。十九世纪五十年代初，艾略特力劝赫伯特·斯宾塞读孔德的《实证哲学教程》；斯宾塞随后发展了孔德的环境概念，提出用“environment（环境）”这个单一术语来命名生物性的与社会性的境况。他关于有机体在不断适应其环境的论点，预示了达尔文《物种起源》所提出的适应理论。
    step2: |-
      环境同性格一样，是艾略特艺术里的关键概念。十九世纪头几十年，这个概念在生物学这门新科学里冒出来，用意在提醒人注意有机体同它周围生存条件的关系。拉马克的 *les circonstances*（周围条件）、若弗鲁瓦·圣伊莱尔的 *le milieu ambiant*（周围环境），都早于奥古斯特·孔德1838年用的 *le milieu*；孔德那个词唤起“对一种有中心之构型的某种直觉”（Canguilhem 2001: 11）[^canguilhem-2001]。另一门新科学“社会学”把概念拉宽，让它兼指文化的与自然的生活条件。五十年代初，艾略特劝赫伯特·斯宾塞去读孔德的《实证哲学教程》；斯宾塞随后发展了孔德的环境概念，提出用“environment（环境）”一个词统称生物的与社会的境况。他主张有机体不断在适应环境，这预示了达尔文《物种起源》里的适应理论。
