      While philosophers throughout history, at least since Plato, have experimented with literary form in ways that are not philosophically trivial, Eliot exerted a decisive influence on new convergences between philosophy and literature during the twentieth century. As some contemporary critics recognized, *Middlemarch* “marks an epoch in the history of fiction” insofar as its interest in subjectivity and inter-subjectivity determines “the form in which the conception is placed before us” (Simcox 1873)[^simcox-1873]. Eliot exerted a profound influence on Anglophone modernism, with its distinctive attention to the relation between truth and literary form. Virginia Woolf and Henry James, for example, were direct heirs to her literary innovations. Eliot’s novels, not least her semi-autobiographical *The Mill on the Floss*, were also formative for Proust and Simone de Beauvoir, whose own experiments in life-writing were the medium for their philosophical work (see Fraser 1994: 87–113; Gobeil 1965)[^fraser-1994][^gobeil-1965]. In light of such influence—and arguably because of, as well as despite, its diffusiveness—Eliot can justly be regarded as the progenitor of the modern philosophical novel.
    step1: |-
      历史上至少自柏拉图以来，哲学家们就在试验文学形式，这些试验在哲学上并非无足轻重；而艾略特对二十世纪哲学与文学之间新的汇合施加了决定性的影响。正如一些当代批评家所认识到的，《米德尔马契》“标志了小说史上的一个时代”，因为它对主体性与主体间性的兴趣决定了“把构想摆在我们面前的形式”（Simcox 1873）[^simcox-1873]。艾略特对英语现代主义有深远影响，后者独特地关注真理与文学形式的关系。弗吉尼亚·伍尔夫与亨利·詹姆斯，便是她文学创新的直接继承者。艾略特的小说，尤其是她半自传性的《弗洛斯河上的磨坊》，对普鲁斯特与西蒙娜·德·波伏娃也有塑成之功；后两人自己在人生书写上的试验，正是他们哲学工作的媒介（见 Fraser 1994: 87–113; Gobeil 1965）[^fraser-1994][^gobeil-1965]。鉴于这样的影响，而且可以说既因为它、也不顾它那种弥散性，艾略特可以被正当地看作现代哲学小说的先驱。
    step2: |-
      哲学家从柏拉图以来就在拿文学形式做试验，而这些试验在哲学上并不轻；艾略特则对二十世纪哲学与文学之间新的汇合起了决定作用。有些当代批评家已经看出：《米德尔马契》“在小说史上标志了一个时代”，因为它对主体性与主体间性的兴趣，决定了“那个构想被摆到我们面前时所取的形式”（Simcox 1873）[^simcox-1873]。艾略特对英语现代主义有深刻影响，现代主义那种独特的关切正是真理与文学形式的关系。弗吉尼亚·伍尔夫、亨利·詹姆斯，都是她文学创新的直接继承人。她的小说，尤其那部半自传的《弗洛斯河上的磨坊》，也塑成了普鲁斯特与西蒙娜·德·波伏娃；这两人自己在人生书写上的试验，正是他们哲学的媒介（见 Fraser 1994: 87–113; Gobeil 1965）[^fraser-1994][^gobeil-1965]。有这般影响，加上（可说是因为、也可说是不顾）它弥散得那样广，艾略特完全可以被看作现代哲学小说的先驱。
