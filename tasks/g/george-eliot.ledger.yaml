      Eliot claims that artists offer new knowledge, insofar as art extends the range of our perceptions—not least by channelling attention to phenomena that have been veiled by habit, or by self-centred preoccupations. In “The Natural History of German Life”, this aesthetic cognitivism is underpinned by an account of imaginative, associative thinking drawn from Part 2 of Spinoza’s *Ethics* (*Ethics* IIp18). Eliot observes how a certain word (her example is “railways”) evokes in the mind of an ordinary person a limited “range of images” representing that person’s particular experiential history, whereas in the mind of an expert the same word will evoke a much fuller knowledge, comprising “all the essential facts in the existence and relations of the thing” (Eliot 1856b: 51–2). She argues that such a complete knowledge of the working classes can be gained by studying “their natural history”, and can be articulated by artists as well as by theorists. The distinction between “narrow” and “wide” mental capacities recurs continually in Eliot’s novels, marking a moral as well as a cognitive divide. The “Natural History” essay qualifies this distinction by suggesting that wide views must be matched by wide “observation” that yields “concrete knowledge” of particulars (Eliot 1856b: 51–2, 56). Wide views alone are not just insufficient, but potentially pernicious. They may produce a character such as *Middlemarch*’s Mr Brooke, whose mental openness is mere vacuity, just as his tolerance amounts to little more than neglect of his moral responsibilities, not least for his poor tenants who live in squalid conditions (Carlisle 2020b)[^carlisle-2020b].
    step1: |-
      艾略特主张艺术家提供新知识，因为艺术扩展我们知觉的范围，尤其是把注意力引向被习惯、被自我中心的牵挂所遮蔽的现象。在《德意志生活的自然史》中，这种审美认知主义由一种取自斯宾诺莎《伦理学》第二部分的想象性、联想性思维说明所支撑（《伦理学》IIp18）。艾略特观察：某个词（她的例子是“铁路”）在一个普通人心里唤起的，是有限的“一串意象”，代表此人特定的经验史；而在一个专家心里，同一个词会唤起充实得多的知识，包括“该物存在与关系中的全部本质事实”（Eliot 1856b: 51–2）。她论证说，对工人阶级的这种完整知识，可以通过研究“他们的自然史”获得，并且能由艺术家表述，也能由理论家表述。“狭窄”与“宽广”心智能力的区分在艾略特的小说中不断出现，标示出一条既是道德、也是认知的分界。《自然史》一文对这区分加以限定，指出宽广的见识必须配上宽广的“观察”，从而产出关于个别事物的“具体知识”（Eliot 1856b: 51–2, 56）。光有宽广的见识不止不够，还可能有害。它们可能造出《米德尔马契》中布鲁克先生那样的人物：他的心胸开阔只是空洞，他的宽容也不过是疏于道德责任，尤其是对他那些住在肮脏环境里的穷佃户的责任（Carlisle 2020b）[^carlisle-2020b]。
    step2: |-
      艾略特说艺术家给人新知识，因为艺术拓宽我们知觉的范围，尤其把注意力引向被习惯、被自我中心的牵挂蒙住的现象。《德意志生活的自然史》里，这套审美认知论底下有一份关于想象、联想的说明，取自斯宾诺莎《伦理学》第二部分（《伦理学》IIp18）。艾略特看：一个词（她举“铁路”）在平常人心里唤起的是有限“一串意象”，代表此人自己那点经验史；同一个词在专家心里唤起的知识就丰满得多，含“该物之存在与关系中的全部本质事实”（Eliot 1856b: 51–2）。她说，要得关于工人阶级的完整知识，可以去研究“他们的自然史”；这样的知识艺术家讲得出，理论家也讲得出。“窄”与“宽”两种心智能力的分野在她小说里一再出现，划出一条既是道德、也是认知的界线。《自然史》一文给这条界线加了限定：宽的眼界必须配宽的“观察”，才能生出关于个别的“具体知识”（Eliot 1856b: 51–2, 56）。单有宽的眼界，不止不够，还可能坏事儿。它会造出《米德尔马契》里布鲁克先生那种人：心胸开阔，只是空；待人宽容，只是不管自己的道德责任，尤其不管他那些住在污糟处的穷佃户（Carlisle 2020b）[^carlisle-2020b]。
