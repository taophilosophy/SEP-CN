      According to Eliot’s interpretation of the *Ethics*, such intellectual feeling is continuous with emotional feeling: she consistently introduces the verb “to feel” into her translations of Spinoza’s discussions of the emotions. In his late work *The System of Positive Polity* (1855) Comte postulates a “unity” and “harmony” of human being comprising “a complete convergence both of the Feelings and of the Thoughts”; “the continuous union of the two principal elements, affective and speculative” (Comte 1875: 16–17)[^comte-1875]. For Comte, these elements are gendered female and male respectively, and their balance within society turns out to require women to devote themselves to domesticity and “surrender all claim to temporal authority”, even within the home (Comte 1875: 302)[^comte-1875]. In 1875, when the English translation of *The System of Positive Polity* was published, Eliot took detailed notes on Comte’s account of the relationship between emotion and knowledge (Wright 1986: 173–201; Anger 2001 [2019: 223])[^anger-2001][^wright-1986].
    step1: |-
      照艾略特对《伦理学》的解读，这种智性的感受与情感的感受是连续的：她在翻译斯宾诺莎论情感的段落时，一贯把“感到”这个动词引入译文。孔德在其晚期著作《实证政治体系》（1855）中设定人的存在有一种“统一”与“和谐”，包含“情感与思想的完全趋同”、“两个主要要素，情感的与思辨的，持续的结合”（Comte 1875: 16–17）[^comte-1875]。在孔德看来，这两个要素分别具有女性与男性的性别，而社会内部两者的平衡，竟要求女性把自己奉献给家务，即使在家庭之内也要“放弃一切对世俗权威的诉求”（Comte 1875: 302）[^comte-1875]。1875年，《实证政治体系》英译本出版，艾略特对孔德论情感与知识关系的说法作了详细的笔记（Wright 1986: 173–201; Anger 2001 [2019: 223]）[^anger-2001][^wright-1986]。
    step2: |-
      按艾略特对《伦理学》的了解，这类智性感受同情感感受本是一贯：她译斯宾诺莎论情感的段落，一贯把“感到”这个动词引进译文。孔德晚年《实证政治体系》（1855）设定人的存在有“统一”与“和谐”，其中“情感与思想完全汇合”、“两个主要要素，情感的与思辨的，持续联合”（Comte 1875: 16–17）[^comte-1875]。在孔德那里，这两个要素一属女一属男，而社会里两者的平衡，竟要女性献身家务，连在家中也“放弃对世俗权威的一切诉求”（Comte 1875: 302）[^comte-1875]。1875年《实证政治体系》英译本问世，艾略特对孔德讲情感与知识之关系，作了细密的笔记（Wright 1986: 173–201; Anger 2001 [2019: 223]）[^anger-2001][^wright-1986]。
