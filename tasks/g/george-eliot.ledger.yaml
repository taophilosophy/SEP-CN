      Eliot’s first scholarly work, a translation of D. F. Strauss’s *Life of Jesus Critically Examined*, was published in 1846. In translating this controversial work, Eliot was following in the footsteps of Samuel Taylor Coleridge and Thomas Carlyle, who had produced English translations of important German works (by Schiller and Goethe respectively) during the first decades of the nineteenth century. Eliot was thus positioning herself as a modern woman of letters, within this broadly Romantic and Germanic intellectual movements (Ashton 1980; Newton 1981; Carlisle 2025)[^ashton-1980][^carlisle-2025][^newton-1981].
    step1: |-
      艾略特的第一桩学术工作，是翻译 D. F. 施特劳斯的《耶稣传：批判性考察》，1846年出版。翻译这部引发争议的书，她踏着塞缪尔·泰勒·柯勒律治和托马斯·卡莱尔的足迹——此二人在十九世纪头几十年各自把重要的德语作品译成了英文（分别译席勒和歌德）。她由此把自己摆在一个现代文字工作者的位置上，处在这一大体上属于浪漫主义、属于德意志的思想运动之中（Ashton 1980；Newton 1981；Carlisle 2025）[^ashton-1980][^carlisle-2025][^newton-1981]。
    step2: |-
      艾略特的第一项学术工作是翻译 D. F. 施特劳斯的《耶稣传，经批判性考察》，1846年出版。译这部招争议的书，她走的是塞缪尔·泰勒·柯勒律治和托马斯·卡莱尔走过的路——这两位在十九世纪头几十年各把一部重要的德意志著作译成英文，一位译席勒，一位译歌德。她由此把自己安放在一个现代文字工作者的位置上，置身于这一大体属浪漫主义、属德意志的思想运动（Ashton 1980；Newton 1981；Carlisle 2025）[^ashton-1980][^carlisle-2025][^newton-1981]。
  - id: 5
    kind: body
    source: |-
      In 1850 Eliot moved to London, adopted the name Marian Evans, and became *de facto* editor of *The Westminster Review*, a high-brow radical journal founded in 1824 by Jeremy Bentham and edited by John Stuart Mill from 1836 to 1840. Eliot was not the first female editor of a periodical, but she was the first women to be closely involved with such a prestigious quarterly journal (Dillane 2011)[^dillane-2011]. She co-edited *The Westminster Review* with the publisher John Chapman, who acquired it in 1851. In their “Prospectus”, printed in their first issue of January 1852, Chapman and Eliot highlighted the journal’s special interest in “Social Philosophy”; its commitment to free speech and “Progress”; and its support for gradual reform, including “a progressive extension of the suffrage, in proportion as the people become fitted for using it”. On religious questions, the editors declared their “uncompromising pursuit of truth” and their “conviction that religion has its foundation in man’s nature”, while recognizing religion to be closely connected to “moral”, “poetic”, and “emotional” development (Chapman & Eliot 1852). This progressive editorial agenda somewhat softened the radical politics and secularism of the *Westminster Review* under Bentham and Mill. A more significant difference was its greater emphasis on new and recent literary works (Gray 2000; Dillane 2011)[^dillane-2011][^gray-2000]. The issues co-edited by Eliot and Chapman carried substantial articles on contemporary literature in England, America, Germany, and France, propagating the very concept of a national literature. Eliot also oversaw innovations in the journal’s design and layout, including the addition of a substantial index.
    step1: |-
      1850年，艾略特迁居伦敦，改用玛丽安·埃文斯这个名字，并成为《威斯敏斯特评论》（*Westminster Review*）的实际编辑——这是一份由杰里米·边沁于1824年创办、由约翰·斯图亚特·密尔在1836至1840年主持的高级激进派期刊。艾略特不是第一位担任期刊编辑的女性，但却是第一位与这样一份有声誉的季刊密切合作的女性（Dillane 2011）[^dillane-2011]。她与出版人约翰·查普曼共同编辑《威斯敏斯特评论》，查普曼在1851年买下了这份刊物。在他们印于1852年1月第一期的《发刊词》中，查普曼与艾略特着重指出刊物对“社会哲学”的特殊兴趣、对言论自由与“进步”的承诺、对渐进改革的支持，其中包括“随着人民逐渐配得上使用选举权而逐步扩大选举权”。在宗教问题上，两位编辑宣示他们对“真理的不妥协追求”，宣示他们“确信宗教植根于人的本性”，同时承认宗教与“道德的”“诗的”“情感的”发展密切相关（Chapman & Eliot 1852）。这份渐进的编辑纲领，稍稍缓和了《威斯敏斯特评论》在边沁与密尔手底的激进政治与世俗主义。更重要的差别，是它对新近文学作品给予更多重视（Gray 2000；Dillane 2011）[^dillane-2011][^gray-2000]。由艾略特与查普曼共同编辑的各期，载有论及英格兰、美国、德国、法国当代文学的长篇论文，传播的正是“民族文学”这个概念本身。艾略特还主持了刊物版式与编排上的革新，包括增设一份篇幅可观的索引。
    step2: |-
      1850年，艾略特搬到伦敦，改叫玛丽安·埃文斯，成了《威斯敏斯特评论》的实际上编辑。这份高级趣味的激进刊物由杰里米·边沁1824年创办，1836至1840年由约翰·斯图亚特·密尔主持。艾略特不是第一位编期刊的女性，却是第一位同这样有声望的季刊发生密切关系的女性（Dillane 2011）[^dillane-2011]。她与出版人约翰·查普曼合编《威斯敏斯特评论》，此刊1851年由查普曼买下。两人在1852年1月创刊号上刊出《发刊词》，点出刊物对“社会哲学”的特别兴趣、对言论自由与“进步”的担当、对渐进改革的支持，其中包括“选举权应随人民渐能使用而渐次扩大”。宗教问题上，两位编辑声明要“毫不妥协地追求真理”，声明“确信宗教植根于人的本性”，同时承认宗教同“道德的”“诗的”“情感的”发展紧相关联（Chapman & Eliot 1852）。这套渐进的编辑纲领，把《威斯敏斯特评论》在边沁与密尔手里的激进政治和世俗主义稍稍软化。差别更大的一处，是它格外看重新的、近时的文学作品（Gray 2000；Dillane 2011）[^dillane-2011][^gray-2000]。艾略特与查普曼合编的那几期，登了论及英格兰、美国、德国、法国当代文学的分量十足的论文，传播的正是“民族文学”这个概念。艾略特还主持了刊物设计版式上的革新，比如添了一份篇幅可观的索引。
  - id: 6
    kind: body
    source: |-
      As editor at the *Westminster Review*, Eliot entered a network of influential intellectuals including J. S. Mill, Herbert Spencer, Harriet Martineau, James Froude, and George Henry Lewes. Lewes became her long-term partner and collaborator. In the late 1850s she took on the name “Marian Lewes”, though Lewes remained legally married to his estranged wife Agnes Lewes. Their relationship was widely regarded as scandalous, and ruined Eliot’s reputation. For years she was socially ostracized. While this changed when she became a celebrated author, the reputational damage from her partnership with Lewes continued to affect her life, work, and public image.
    step1: |-
      在《威斯敏斯特评论》做编辑期间，艾略特进入一个有影响的智识者的网络，其中有 J. S. 密尔、赫伯特·斯宾塞、哈丽雅特·马蒂诺、詹姆斯·弗劳德和乔治·亨利·刘易斯。刘易斯成了她长期的伴侣与合作者。十九世纪五十年代末，她采用“玛丽安·刘易斯”这个名字，虽然刘易斯在法律上仍与他分居的妻子阿格尼丝·刘易斯保持婚姻关系。他们的关系被舆论普遍看作丑闻，毁掉了艾略特的名声，此后多年她在社交上被人排斥。她成为有名望的作家之后，情况有所改变，但与刘易斯同居带来的名声损害，一直影响着她的生活、作品和公众形象。
    step2: |-
      在《威斯敏斯特评论》编稿期间，艾略特进了一个有影响的智识圈子，圈里有 J. S. 密尔、赫伯特·斯宾塞、哈丽雅特·马蒂诺、詹姆斯·弗劳德、乔治·亨利·刘易斯。刘易斯成了她终身的伴侣与合作者。五十年代末，她改用“玛丽安·刘易斯”之名，而刘易斯在法律上仍是其分居妻子阿格尼丝·刘易斯的丈夫。两人这事被公认为丑闻，艾略特的名声就此毁掉，此后多年她在社会上被人拒斥。她成了有名的作家，境况才变，但与刘易斯同居所伤的名声，一路影响着她的生活、她的作品、她的公众形象。
  - id: 7
    kind: body
    source: |-
      During the 1850s Eliot produced the first English translations of Ludwig Feuerbach’s *On the Essence of Christianity* (1854) and Spinoza’s *Ethics* (1856, but unpublished in her lifetime). Feuerbach, like Strauss, was a liberal German Protestant influenced by the German Idealists, especially Hegel; a reviewer of Eliot’s translation of *The Essence of Christianity* criticized the way it “exhibit[ed] the new Hegelian Atheism to English readers” (Anonymous 1854: 559)[^anonymous-1854]. Eliot admired Feuerbach’s ideas, and planned to publish an original essay titled “On the Idea of a Future Life”, advertised in the *Westminster Review* as forthcoming by the translator of Feuerbach. This lost essay may have resembled *The Essence of Christianity* in being a philosophical-theological treatise aimed at a broad cultured readership, and in applying Feuerbachian insights to the question of human immortality. Framing her professional identity as the translator of Strauss and Feuerbach suggests a plan to contribute in her own voice to the religious and philosophical debates carried out by these German thinkers.
    step1: |-
      十九世纪五十年代，艾略特产出了路德维希·费尔巴哈《基督教的本质》（1854）与斯宾诺莎《伦理学》（1856，但她生前未出版）的第一个英译本。费尔巴哈同施特劳斯一样，是受德国观念论、尤其是黑格尔影响的自由派德国新教徒；艾略特译的《基督教的本质》有一篇书评，批评它“把新的黑格尔式无神论呈给英国读者看”（Anonymous 1854: 559）[^anonymous-1854]。艾略特敬佩费尔巴哈的思想，并计划发表一篇自撰论文，题为《论来世观念》，《威斯敏斯特评论》曾预告此文出自费尔巴哈的译者之手。这篇后来散佚的论文，可能在两方面类似《基督教的本质》：它是一部哲学—神学论著，面向广大的有教养读者；它把费尔巴哈式的洞见应用于人的不朽这一问题。把自己的职业身份表述为“施特劳斯与费尔巴哈的译者”，暗示她原本打算以自己的声音，加入这些德国思想家进行的宗教与哲学论争。
    step2: |-
      五十年代，艾略特译出路德维希·费尔巴哈《基督教的本质》（1854）和斯宾诺莎《伦理学》（1856，但她生前未曾出版）的两种最早的英译本。费尔巴哈同施特劳斯一样，是自由派的德国新教徒，受过德国观念论、特别是黑格尔的影响。她译的《基督教的本质》有人写书评，指责它“把新的黑格尔式无神论摆到英国读者眼前”（Anonymous 1854: 559）[^anonymous-1854]。艾略特服膺费尔巴哈的思想，打算发表一篇自撰的《论来世观念》，《威斯敏斯特评论》也预告过这篇出自费尔巴哈译者之手的文章。这篇论文已经散佚，它可能像《基督教的本质》那样是一部面向广大有教养读者的哲学—神学论著，也可能同样把费尔巴哈式的洞见用到人的不朽问题上。她把“施特劳斯与费尔巴哈的译者”当作自己的职业身份，这暗示她本来打算用自己的声音，参加这些德国思想家正在进行的那些宗教与哲学论争。
  - id: 8
    kind: body
    source: |-
      In translating Spinoza, Eliot was going back to the most significant source of her intellectual milieu. Spinoza’s non-dualist metaphysics was a foundation for German Romanticism and Idealism alike, and thus formative for Strauss and Feuerbach. Although Eliot’s translation of the *Ethics* remained unpublished and therefore did not have the cultural impact it deserved, its effect on her own intellectual formation was both immediate and enduring. Its influence is evident on her *Westminster Review* essays on the popular Calvinist preacher John Cumming (Carlisle 2020a: 22–26)[^carlisle-2020a] and on Wilhelm Riehl’s *The Natural History of German Life* (Carlisle 2020b: 601–4)[^carlisle-2020b]. These substantial, authoritative, wide-ranging essays, marking the culmination of Eliot’s journalistic career, were both written during her immersion in Spinoza. Scholars have traced through the novels of George Eliot Spinozist ideas about freedom and determinism, emotion, human flourishing, and the work of imagination (Atkins 1978; Lynn 1996, Armstrong 2013; Gatens 2003, 2007, 2023; Frazer 2018; Anger 2001 [2019])[^anger-2001][^armstrong-2013][^atkins-1978][^frazer-2018][^gatens-2003][^lynn-1996]. Towards the end of her career, Eliot would examine questions about literary labour—scholarship, originality, appropriation, productivity, cultural transmission—and about the nature of Englishness that first arose during her generative period as a translator (Raterman 2013; Carlisle 2025)[^carlisle-2025][^raterman-2013].
    step1: |-
      翻译斯宾诺莎，是艾略特回到她智识环境最重要的源头。斯宾诺莎非二元论的形而上学，是德国浪漫主义与德国观念论共同的基座，也因此塑造了施特劳斯与费尔巴哈。虽然艾略特译的《伦理学》未曾出版，因而没有获得它应得的文化影响，但对她自己的智识养成，其作用是既直接又长久的。她的《威斯敏斯特评论》上论通俗加尔文宗布道家约翰·卡明的文章（Carlisle 2020a: 22–26）[^carlisle-2020a]，以及论威廉·里尔《德意志生活的自然史》的文章（Carlisle 2020b: 601–4）[^carlisle-2020b]，都显出这一影响。这两篇论文分量足、见地稳、涉及面广，标志她新闻写作生涯的顶点，都写于她沉浸于斯宾诺莎期间。学者们已经追踪出乔治·艾略特小说里的斯宾诺莎式观念，涉及自由与决定论、情感、人的繁盛、想象力的工作（Atkins 1978; Lynn 1996, Armstrong 2013; Gatens 2003, 2007, 2023; Frazer 2018; Anger 2001 [2019]）[^anger-2001][^armstrong-2013][^atkins-1978][^frazer-2018][^gatens-2003][^lynn-1996]。到生涯末期，艾略特回头考察了两类问题：一类关于文学生产——学问、原创性、挪用、生产力、文化传递；一类关于英格兰性之本性。这些问题最初在她作为译者那段多产的时期就已产生（Raterman 2013; Carlisle 2025）[^carlisle-2025][^raterman-2013]。
    step2: |-
      译斯宾诺莎，等于艾略特回到她智识环境最重要的源头。斯宾诺莎那个非二元论的形而上学，是德国浪漫主义与德国观念论共同的底座，也因此塑成施特劳斯与费尔巴哈。她译的《伦理学》没有出版，因而没得到它应得的文化影响；但对她自己的智识养成，这作用既直接又长久。她在《威斯敏斯特评论》上论通俗加尔文宗布道家约翰·卡明的文章（Carlisle 2020a: 22–26）[^carlisle-2020a]、论威廉·里尔《德意志生活的自然史》的文章（Carlisle 2020b: 601–4）[^carlisle-2020b]，都带着这一影响的痕迹。两篇文章分量足、见地稳、牵涉面广，是她新闻写作生涯的顶点，也都写成于她沉潜斯宾诺莎的那段日子。学者们已从乔治·艾略特的小说中追踪出斯宾诺莎式的观念，涉及自由与决定论、情感、人的繁盛、想象力的运作（Atkins 1978; Lynn 1996, Armstrong 2013; Gatens 2003, 2007, 2023; Frazer 2018; Anger 2001 [2019]）[^anger-2001][^armstrong-2013][^atkins-1978][^frazer-2018][^gatens-2003][^lynn-1996]。到生涯末尾，她回头考察两类问题：一类关于文学生产，涉及学问、原创性、挪用、生产力、文化传递；一类关于英格兰性的本性。这些问题最初起于她做译者那段多产的时期（Raterman 2013; Carlisle 2025）[^carlisle-2025][^raterman-2013]。
