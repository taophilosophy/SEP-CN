      Eliot’s moral particularism led James Sully to claim that “George Eliot gives us a life-like picture of the moral struggle, and not a theory of it” (Sully 1881: 391)[^sully-1881]. However, this claim is too hasty: it is possible to reconstruct several meta-ethical claims from Eliot’s fiction. To begin with, the insistence on “circumstances” in the passage quoted above from *The Mill on the Floss* highlights the moral significance of the concept of the milieu deployed in Eliot’s novels (see §3.2). Duty is another moral concept that structures her thinking, accompanied by the claim that particular duties must be determined with reference to each individual’s situation. Eliot’s sustained interest in the concepts of character and habit situates her moral thinking within the virtue ethics tradition (see §3.1). At times she espouses an exemplarist moral theory that foregrounds the concept of imitation; here we may detect the influence of Spinoza’s *Ethics* as well as more contemporary works such as Carlyle’s *Heroes* and Emerson’s *Representative Men* (see §3.4). Her interest in the concept of a character “type”, going back to Theophrastus’s *Characters*, suggests a meta-ethical view that fuses virtue theory and exemplarism.
    step1: |-
      艾略特的道德特殊主义使詹姆斯·萨利断言“乔治·艾略特给我们的是一幅道德斗争的逼真图画，而不是关于它的理论”（Sully 1881: 391）[^sully-1881]。然而这断言过于仓促：从艾略特的小说中可以重构出若干元伦理主张。首先，上文所引《弗洛斯河上的磨坊》那段对“情形”的坚持，凸显了艾略特小说中运用的环境概念的道德意义（见 §3.2）。责任是另一个组织她思想的道德概念，与之相伴的主张是：具体的责任必须参照每个人的处境来确定。艾略特对性格与习惯这两个概念的持久兴趣，把她的道德思考置于德性伦理学传统之中（见 §3.1）。她有时主张一种突显模仿概念的范例论道德理论；这里我们可以察觉到斯宾诺莎《伦理学》的影响，也可以察觉到卡莱尔《英雄》、爱默生《代表人物》这类更当代的著作的影响（见 §3.4）。她对“类型”性格这一概念的兴趣可回溯到特奥弗拉斯托斯的《人物志》，这暗示一种融合了德性论与范例论的元伦理看法。
