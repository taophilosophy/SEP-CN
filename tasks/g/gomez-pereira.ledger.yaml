      For Pereira, there are three main types of movement in nature. The simplest is movement of inorganic objects. It is ruled by the principles of perpetual and invariable motion. This movement is merely a local one: for example, the attraction of metal to a magnet. The most complex category is voluntary movement (i.e., the complete freedom of movement of humans). At the medium level of complexity, Pereira located what he called “vital movement”, which describes animal movements. Vital movement includes movement caused by muscular and nervous organs in direct response to interior and exterior stimuli; this movement does not involve will nor any kind of spontaneous decision. Notwithstanding this, Pereira said that vital movement does not consist of invariable movement. Instead, the complexity of movements that can be observed in animals is the result of the complexity of the stimuli or forces that can act on them. To clarify this, Pereira classified four different types of animal movement: i) movements produced as a reaction to objects that are present; ii) movements produced by objects that were present in the past time; iii) movements produced as consequence of some previous instruction; iv) movements resulting from the so-called *natural instinct* (AM: I.241). The central core of Pereira’s theory on animal behavior is found precisely in the explanation of these four types of movement (see Sánchez Vega 1954: 383–387; Bandrés & Llavona 1992: 161; Rodríguez Pardo 2008: 191)[^bandrés-1992][^rodríguez-2008][^sánchez-1954].
    step1: |-
      在佩雷拉看来，自然界的运动主要有三类。最简单的是无机物体的运动，它受永恒而不变的运动原则支配。这种运动只是位置移动，例如金属被磁石吸引。最复杂的类别是自愿运动（即人的完全自由的运动）。在复杂性的中间层次，佩雷拉安置了他所称的“生命运动”，用以描述动物的运动。生命运动包括由肌肉与神经器官直接回应内外刺激所引起的运动；这种运动不涉及意志，也不涉及任何自发的决定。尽管如此，佩雷拉说，生命运动并不由不变的运动构成。相反，在动物身上可以观察到的运动之所以复杂，是作用于它们的刺激或力量的复杂性所致。为说明这一点，佩雷拉把动物运动分为四类：(i) 作为对在场对象的反应而产生的运动；(ii) 由过去在场的对象所产生的运动；(iii) 由先前某种训练而产生的运动；(iv) 由所谓 *natural instinct*（自然本能）产生的运动（AM: I.241）。佩雷拉关于动物行为理论的核心，恰恰在于对这四类运动的解释（见 Sánchez Vega 1954: 383–387；Bandrés & Llavona 1992: 161；Rodríguez Pardo 2008: 191）[^bandrés-1992][^rodríguez-2008][^sánchez-1954]。
