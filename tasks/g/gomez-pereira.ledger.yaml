      Like several other thinkers of his time, Gómez Pereira devoted considerable attention to exposing what he regarded as the shortcomings and internal tensions of scholastic natural philosophy. The Aristotelian scheme seemed to him insufficient, so he directed severe criticism at it for being unclear or even contradictory in some essential respects, especially those which had to do with the explanation of life and the controversial issue of the nature and origin of the soul (Andrès 2015)[^andrès-2015].
    step1: |-
      与他那个时代的若干思想家一样，戈麦斯·佩雷拉花了不少气力揭露他所认为的经院自然哲学的缺陷与内部张力。在他看来，亚里士多德式框架不够用，于是他对之大加批评，指其在一些关键方面含混甚至自相矛盾，尤其是那些涉及生命解释以及灵魂之性质与起源这一争议问题的方面（Andrès 2015）[^andrès-2015]。
    step2: |-
      与当时不少思想家一样，戈麦斯·佩雷拉着力揭发经院自然哲学的短处与内在紧张。他嫌亚里士多德式框架不够用，便严加批评，指其在若干要害处含混，甚至自相矛盾，尤以生命如何解释、灵魂之性质与起源这一争议为甚（Andrès 2015）[^andrès-2015]。
