    source: |-
      Gómez Pereira (1500–?) was a Spanish physician and philosopher best known for having formulated a systematic theory of animal mechanism a century before Descartes. Although often discussed in connection with Cartesianism, Pereira’s philosophical project was primarily shaped by sixteenth-century debates on the immortality of the soul, the unity of substantial form, and the epistemological foundations of Aristotelian natural philosophy. In the context of the debate over the immortality of the soul, he defended a radical division between the soul and the body, and a conception of the soul as simple form whose essential activity lies in self-consciousness. Pereira was an alumnus of the University of Salamanca, where he met the new pedagogical methods developed by nominalists as well as an increasing interest on natural philosophy. From a heterodox point of view, he addressed some physical and metaphysical topics in his books. Pereira rejected some concepts widely accepted in his time such as prime matter, common sense or intelligible species. Grounded upon a psychology that gave priority to simplicity, he replaced the scholastic theory of cognitive faculties with a new one in which the intentional act became relevant. For Pereira the subject and the object constitute a unity that can only be conceptually separated; this unity is determined by the conception of the mind as pure attention that is capable of perceiving itself.
    step1: |-
      戈麦斯·佩雷拉（Gómez Pereira，1500–？）是西班牙医生与哲学家，以其早于笛卡尔一个世纪提出系统的动物机械论而著称。佩雷拉的哲学事业虽然常与笛卡尔主义一并讨论，主要却由十六世纪关于灵魂不朽、实体形式之统一性以及亚里士多德自然哲学之认识论基础的论争所塑造。在灵魂不朽之争的脉络中，他捍卫灵魂与身体的彻底分离，并主张灵魂是单纯的形式，其本质活动在于自我意识。佩雷拉是萨拉曼卡大学的校友，在那里接触到唯名论者发展出的新教学方法，也接触到对自然哲学日益增长的兴趣。他从异端的立场出发，在著作中处理了一些物理学与形而上学题目。佩雷拉拒斥当时广为接受的一些概念，如第一质料、共同感官或可理解种相。他以一种优先强调单纯性的心理学为基础，用一套新的理论取代经院的认知官能说，其中意向行为变得重要。对佩雷拉来说，主体与客体构成一种只能从概念上加以分离的统一体；这种统一体由这样一种心灵构想所决定：心灵是纯粹的注意，能够知觉自身。
    step2: |-
      戈麦斯·佩雷拉（Gómez Pereira，1500–？）是西班牙医生兼哲学家，以早于笛卡尔一个世纪提出系统的动物机械论而闻名。他的哲学工作虽常被放在笛卡尔主义的脉络里讨论，底色却主要来自十六世纪的几场论争：灵魂是否不朽，实体形式是否统一，亚里士多德自然哲学的认识论根基何在。在灵魂不朽之争中，他主张灵魂与身体彻底分离，并把灵魂理解为单纯的形式，其本质活动在于自我意识。佩雷拉出身萨拉曼卡大学，在那里接触了唯名论者推行的新教学法，也感受到自然哲学日益升温的兴趣。他站在异端立场上，在著作中处理了若干物理学与形而上学题目，并拒斥当时广被接受的一些概念，如第一质料、共同感官、可理解种相。他立足于一种以单纯性为优先的心理学，用新理论取代经院的认知官能说，使意向行为成为关键。在佩雷拉看来，主体与客体构成一个只能从概念上分开的统一体；这一统一体取决于他把心灵设想为能够知觉自身的纯粹注意。
