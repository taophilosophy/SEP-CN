      Once the soul has known its own affection, it is able to reflect on itself and discover itself as existing. This is a single process in which two moments must be distinguished: in the first act the soul knows the fact of being affected by something, whereas only in the second does it know itself as an independent entity, with autonomous existence. Now, the immediacy with which the soul reaches the consciousness of this existence shows that for Gómez Pereira this is not a deductive development, but a pure intuitive act that has a previous formal factor: the awareness of the affection is, in effect, “*quodam antecedens cognitum*” necessary to verify that the soul “*seipsam noscit*”.
    step1: |-

    step2: |-

  - id: 38
    kind: body
    source: |-
      The above expression “*nosco me aliquid noscere, et quicquid noscit est, ergo ego sum*” is not the final sentence of the *Antoniana Margarita*, since Gómez Pereira will formulate new arguments *pro immortalitate*, but it can be considered as the true culmination of all the discourse that the author has directed to prove the immortality of the soul. This discourse represents the central nerve of the work to which the other contents, and especially the doctrine of animal insensitivity, are secondary derivations. Many scholars have argued that animal automatism represents the genuine motif of the *Antoniana*, probably because of its originality, but we should not confuse originality with logical priority. Underneath the amalgam of contents and the diffuse and often disordered prose of the author of the *Antoniana*, a well-structured reasoning was present, in which three stages can be distinguished (González Vila 1975: 22.)[^gonzález-1975]:
    step1: |-

    step2: |-

  - id: 39
    kind: body
    source: |-
      1. The nature of the act of knowledge requires an indivisible principle, so that only the soul, the unique indivisible principle in man, knows; the body does not participate in sensory knowledge, not even as a tool; therefore, the soul, in its main functions (which are cognitive) enjoys complete independence and full operational self-sufficiency regardless of the body.
      2. This operational independence logically founds the ontological independence that allows the survival of the separated soul. Although Pereira does not deny the “corporeal” conditioning factors to which knowledge is subject, as evidenced by experience, he recognizes that the soul is weighed down by the body in its cognitive operations, so the body restricts the original and absolute cognitive spontaneity of the soul.
      3. Once the operating-ontological independence of the soul is asserted, and consequently its separate subsistence, the perpetuity of this subsistence does not involve any difficulty, since in the soul, which is indivisible, there is no intrinsic principle of corruption.
    step1: |-

