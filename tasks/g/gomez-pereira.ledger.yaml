      Gómez Pereira only wrote three books: the *Antoniana Margarita*, published in 1554, an *Apologia* that he redacted in 1555 to answer the objections raised against his first book, and the *Novae veraeque medicinae* of 1558 (González Vila 1976: 111–114)[^gonzález-1976]. As can be seen by the dates, the publication of his writings was concentrated in a few years, probably at the end of his life. It is, then, likely that these writings had many years of reflection, readings and experimentation probably determined by his profession. The *Antoniana Margarita*, entitled so in honor of Pereira’s parents, is his best-known work. It is composed in three parts without any internal division of chapters: the first part, which gives the title to the entire book, is the largest; the second is a commentary on Aristotle’s *De anima* III, and the third is a treatise *De immortalitate animorum*. The discourse is arranged in a sequence of paragraphs whose content is sometimes announced by marginal notes which are more numerous in the first part than in the other two. The prose is dense and frequently digressive, and the absence of a clear internal division can make the argumentative structure difficult to follow. Nevertheless, beneath this stylistic irregularity lies a coherent argumentative architecture oriented toward demonstrating the independence and immortality of the rational soul. In his *Apologia*, Pereira summarized and confirmed all the theses previously established in the *Antoniana*, and took the opportunity to clarify some points of his own thought, as for example the nature of human soul as a simple substance that only conceptually can be divided into parts. Finally, the *Novae veraeque medicinae*, probably published posthumously, were written following an empirical methodology that aimed to discover the true causes and the effects of diseases and affections. For example, against the common opinion of his time and the criteria of Greek and Arab medical treatises, Pereira explained fever as a mechanism devoted to restoring a lost equilibrium in the body (Marín Pareja 2022)[^marín-2022].
    step1: |-
      戈麦斯·佩雷拉只写了三部书：1554 年出版的 *Antoniana Margarita*；1555 年他为回应针对第一部书的反对意见而写成的 *Apologia*；以及 1558 年的 *Novae veraeque medicinae*（González Vila 1976: 111–114）[^gonzález-1976]。从年代可以看出，他的著述集中在几年之内，大概是在他生命的晚年。因此，这些著述很可能经过多年思考、阅读与实验，而这些大概又由他的职业所决定。*Antoniana Margarita* 为纪念佩雷拉的父母而得名，是他最知名的著作。该书分为三部分，内部不再分章：第一部分与全书同名，篇幅最大；第二部分是对亚里士多德《论灵魂》第三卷的评注；第三部分是一篇题为 *De immortalitate animorum* 的论文。全书按段落顺序排列，有时以页边注提示段落内容，第一部分中的页边注多于后两部分。文风密实，常离题旁涉，加之缺乏清晰的内部划分，论证结构有时难以把握。然而，在这种文体上的不规则之下，隐藏着一套连贯的论证架构，其旨在于证明理性灵魂的独立与不朽。在 *Apologia* 中，佩雷拉概述并确认了 *Antoniana* 中先前确立的全部论点，并借机澄清了自己思想中的一些要点，例如人的灵魂是单纯实体，只能在概念上分为部分。最后，*Novae veraeque medicinae* 大概在身后出版，写作时遵循一种经验方法论，旨在发现疾病与病状的真正原因及其效果。例如，佩雷拉违背当时的通行意见与希腊、阿拉伯医学论著的标准，把发热解释为一种旨在恢复身体失去之平衡的机制（Marín Pareja 2022）[^marín-2022]。
    step2: |-
      戈麦斯·佩雷拉一生只写了三部书：1554 年刊行的 *Antoniana Margarita*，1555 年为答复针对前书的诘难而写的 *Apologia*，以及 1558 年的 *Novae veraeque medicinae*（González Vila 1976: 111–114）[^gonzález-1976]。从年份看，他的著作集中在几年之间，大约在生命的晚期。这些文字想必经过多年思索、阅读与实验的积累，而积累又多半由他的行医本行促成。*Antoniana Margarita* 以佩雷拉双亲之名命名，是他最知名的著作。全书分三部分，内部不再分章：第一部分与全书同名，篇幅最巨；第二部分评注亚里士多德《论灵魂》第三卷；第三部分是一篇论 *De immortalitate animorum* 的文章。行文按段落推进，间以页边注点出段落要旨，第一部分的页边注多于后两部分。其文风密实，时或旁逸斜出；内部既无清楚划分，论证脉络便不易跟住。然而在这种文体上的参差之下，自有一套连贯的论证骨架，目标始终是证明理性灵魂的独立与不朽。*Apologia* 中，佩雷拉概述并确认了 *Antoniana* 已立的全部论点，又顺势澄清自己思想中的若干要点，例如人的灵魂是单纯实体，惟有在概念上才可分为部分。至于 *Novae veraeque medicinae*，大约身后才问世，遵循一种经验方法，意在发现疾病与病状的真正原因和结果。举例说，当时舆论与希腊、阿拉伯医学典籍的准绳都认为发热另有其因，佩雷拉却把它解释为一种机制，用以恢复身体失去的平衡（Marín Pareja 2022）[^marín-2022]。
