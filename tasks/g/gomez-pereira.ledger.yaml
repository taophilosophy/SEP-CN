      The little attention that has been paid to the *Antoniana Margarita* by Spanish researchers (outside Spain this attention has been non-existent) has been mainly focused on the impact of the work especially in post-sixteenth century philosophy, just when its fortune was linked to the Cartesian philosophy as a possible precedent of the animal mechanism formulated by the French philosopher (see González Vila 1977: 99–125; Bandrés & Llavona 1993: 131–137; Valverde 2019: 55–61; Arén Janeiro 2021: 1374–1376)[^arén-2021][^bandrés-1993][^gonzález-1977][^valverde-2019]. However, a closer look allows us to verify that in the immediate context of sixteenth century Spanish philosophy the *Antoniana* had a certain impact, negative rather than positive. Gómez Pereira himself introduced in an early reprint of his work the first or at least one of the first reactions to his book. In this case, the reaction was solicited directly by Pereira, because he asked his old teacher Miguel de Palacios, Professor of Theology at the University of Salamanca, for a critical survey of his book. The *Objectiones* which Palacios wrote to please his pupil were included in the *Antoniana Margarita* and accompanied by an *Apologia* where Pereira summarized and defended all the theses previously established. Palacios’ attitude was that of a professor who condescendingly reads the work of a good student, not that of a genuine critic. In any case, these *Objectiones* failed to identify the central message of the *Antoniana*, either because the author did not read the work carefully or because he did read it but did not understand his student’s thought. Palacios’ work analyzed some questions which, even if they do not lack some interest, do not address the core of the work, that is, Pereira’s intention of dissociating the soul and the body so as to formulate on this basis a demonstrative proof of the immortality of the human soul. For, even if in the order of the text the thesis of animals’ lack of sensory perception is the first issue addressed, this was only one of the consequences drawn from the claimed independence and unity of the human soul. In Palacios’ opinion, however, that was the only significant content of the book, so he was unable to build a systematic criticism of Pereira’s arguments.
    step1: |-

    step2: |-

  - id: 60
    kind: body
    source: |-
      Another notably adverse reaction to the *Antoniana* was the *Endecálogo contra Antoniana Margarita*, written in Castilian by Francisco Sosa, a colleague of Pereira who lived in the same city and probably met him. This work is a satiric fable in which the animals bring a suit before Jupiter, as a judge, against Pereira because he has deprived them of genuine sensory perception and self-movement. González Vila emphasizes that the work, beyond its questionable literary quality and lack of philosophical depth, serves only to demonstrate that the *Antoniana* had some popular repercussion (see González Vila 1977: 102)[^gonzález-1977].
    step1: |-

    step2: |-

  - id: 61
    kind: body
    source: |-
      These two books show that the immediate reception of Pereira’s work was adverse and probably disappointing for the author, who could feel misunderstood and unjustly attacked. In any case, the echo of his work vanished soon, as evidenced by the fact that during the next century the references to the *Antoniana* and to Gómez Pereira himself were very few.
    step1: |-

    step2: |-

  - id: 62
    kind: body
    source: |-
      The second period dates from the moment when Gómez Pereira became the object of the attention of those who saw in him a precedent of the philosophy of Descartes. The great occasion for this ephemeral change arose from the French philosopher Pierre Bayle. Before him, Vossius had already spoken of Pereira as a precursor of animal mechanism (Vossius, *De theologia gentili*, 1641 [1700: vol. V, p. 345]). But when Bayle included Pereira in his *Dictionnaire* (Bayle 1730: vol. III, pp. 649–656)[^bayle-1730], he gave rise to a debate about the true originality of Descartes before the unquestionable precedent contained in the *Antoniana Margarita*. Bayle did not discuss Pereira’s merit as the true author of a primitive version of animal mechanism, but he thought that the real originality should nevertheless be attributed to Descartes, because his mechanism derived from the firm principles of its philosophy, while Pereira had only an ingenious occurrence without the support of a true system of principles such as that of Descartes.
    step1: |-

    step2: |-

  - id: 63
    kind: body
    source: |-
      From this moment on, the figure of Pereira acquired a relevance like never before. Even if Bayle tried to show the unmethodical way in which the doctor of Medina del Campo expressed his doctrine of animals’ lack of sensory perception, the fact is that it did not take the opponents of Descartes long to spread the suspicion that he had plagiarized some of the contents of the *Antoniana Margarita*. This accusation was known to the extent that Adrien Baillet, the great biographer of the French philosopher, was obliged to claim that the doctrine of animal mechanism had already been conceived by the young Descartes before he had the opportunity to know of the existence of Pereira’s book (Baillet 1691: vol. I, p. 51 ff.)[^baillet-1691]. However, it has been maintained that neither the chronological observations of Baillet nor the denial expressed by Descartes himself of having read Pereira’s work completely rules out the possibility that he could have read Pereira’s book in the Netherlands, where it was probably more accessible than in France. Those chronological reasons of Baillet were not accepted by many others, such as Huet, who openly stated that Pereira had clearly anticipated Descartes in the theory of animal automatism (Huet 1689 [1734: 193 ff.])[^huet-1689].
    step1: |-

    step2: |-

  - id: 64
    kind: body
    source: |-
      Other references to the work of Gómez Pereira can be found during the transition from the seventeenth to the eighteenth century, for example, in the Portuguese Jewish physician Isaac Cardoso, who edited his *Philosophia libera* in 1673. Here Pereira is placed on the same level as Vallés and Gassendi as a modern atomist who rejected the Aristotelian concept of prime matter. Even in Leibniz himself we can find traces of Pereira: in two letters dated on 1711 and 1713 he said he was looking for a copy of the *Antoniana*, and after having found it, he recognized that the thought of Descartes was not too different from that of Pereira. Leibniz believed, however, that the French philosopher had not read his work.
    step1: |-

    step2: |-

  - id: 65
    kind: body
    source: |-
      The question of Descartes’ debt to Gómez Pereira will be found again among the Enlightenment writers, as we can see in the Dictionaries of Calmeto, Moreri, Brucker, etc. (see Bandrés & Llavona 1993: 133–134)[^bandrés-1993]. In the *Encyclopedia* of Diderot and D’Alembert, particularly in the article devoted to the soul of beasts, we may read that Descartes was the first who dared to treat animals as mere machines, even if Gómez Pereira had said something similar before him, but he arrived at this concept by pure chance. The Enlightenment authors echoed the opinion of Bayle in pointing out that Pereira did not draw his doctrine from any principle, and therefore his name had scant relevance: he suffered the saddest thing that can happen to an innovator, “*il ne fit point de Secte*” (Bayle 1730: vol. III, pp. 651)[^bayle-1730].
    step1: |-

    step2: |-

  - id: 66
    kind: body
    source: |-
      One unexpected effect of the presence of Gómez Pereira in the French erudite elite, even if in a pale way, was the recovery of his work during the eighteenth century. But, unfortunately for our author again, this recovery did not involve any serious and detailed study of his thought (González Vila 1977: 109)[^gonzález-1977]. The unique perspective adopted to comment on and analyze the contents of the *Antoniana Margarita* was determined by the notion of their possible influence on Descartes; moreover, the Spanish writers generally followed the sentence of Bayle denying such an influence. One of the most notable exceptions was the Jesuit Juan de Ulloa, who after refuting mechanism and atomism, said that, in spite of everything, he was proud of the fact that some of his countrymen, such as Pereira and Vallés, had guided such powerful minds as that of Descartes (Bandrés & Llavona 1993: 134)[^bandrés-1993].
    step1: |-

    step2: |-

  - id: 67
    kind: body
    source: |-
      This growing interest in animal mechanism and specifically in the *Antoniana Margarita* was the cause of the second and final edition of the book in 1749, whose preface and permission generously praised Gómez Pereira, and lamented the fact that such an innovator had fallen into total oblivion among the philosophers of his own land. Unfortunately, this new edition did not remedy the prevailing ignorance about him, as one can realize by reading the different works of natural philosophy and the dictionaries produced in Spain at that time, where there are few references to our doctor and they seem to come from indirect sources, not from a direct reading of the text.
    step1: |-

    step2: |-

