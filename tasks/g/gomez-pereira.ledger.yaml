      有趣的是，他的许多同代人试图诉诸连贯性来回应证明灵魂不朽的挑战，而恰恰在这个时候，亚历山大派强调亚里士多德的连贯性在于有朽：每一种实体形式都与它所赋予本质的复合物一同生成、一同消亡。因此，佩雷拉试图用一种建立在身体与心灵彻底分离之上的另一种连贯性来回应彭波那齐的必死论论题时，并不算原创。但在这番尝试中，他大概比任何人都更清楚地表明：把质形论的说明框架应用于人的本性，会导致一个无法回避的十字路口：一条路通向整体唯物主义，另一条路通向严格二元论。选择后一条路的人（佩雷拉无疑就是），面前有一个不容回避的问题：身体究竟有何用处？对佩雷拉来说，身体是一个经验事实，否定它会与他据以支撑自己著作的原则（即经验与逻辑连贯性）相悖。他的回答借用了囚徒的寓言（AM: II.1067）。灵魂就像一个身处网状鞘膜之中的人。这个人若不被外界落在周围鞘膜上的打击所“唤醒”，就什么也不能认识。外部实在所产生的这类打击或感受，是裹在此种鞘膜中的人得以醒来并认识所必需的，但它们不足以解释认识本身。因此，对佩雷拉来说，身体是灵魂的一种“闹钟”。这种形体上的感受，作为人的理解之 *conditio sine qua non*（必要条件），是 *pro statu isto*（在此状态中，即身体与灵魂结合的状态）所必需的。但同样真实的是，在佩雷拉看来，灵魂若在这座鞘膜监狱之外，就会永久清醒，并对自身及其他对象拥有更完善的认识。遗憾的是，佩雷拉始终没有解释，灵魂为什么必须处于如此可悲的状态：忘却自身，只有在外界刺激使它不快地兴奋时才有所知觉。佩雷拉谈到降生之灵魂处境时的语气，向我们展示了人类学二元论最悲观的版本：灵魂在此生所能获得的认识，只是它在彼世所能达到之认识的一个苍白映像。如果像佩雷拉似乎认为的那样，灵魂本质上就是自我意识，那么这种本性在此生只能间接地、并在有限的时间内达到。但佩雷拉没有告诉我们，究竟需要怎样的形而上学框架，才能解释何种普遍秩序容许一种更高本性的实在受到如此限制。如果复合物的死亡意味着灵魂与其真实状态的重新合一（“*corrupto carcere statim in totum expergiscetur*”，即“牢狱一旦毁坏，他就会完全醒来”，AM: II.1068/1069），那么它为什么应当遭受在身体中所受的那些不幸限制？尽管他想从自然理性的角度处理灵魂不朽问题，最终却不得不超越物理领域，才能充分解释精神与身体这两种如此不同的本性何以在人的身上共居。
