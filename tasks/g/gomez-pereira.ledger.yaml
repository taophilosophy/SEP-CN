      西班牙学界对 *Antoniana Margarita* 的关注本就不多（西班牙之外则无人问津），且多集中于该书的“影响”，尤其是十六世纪以后的哲学：在那里，此书的命运拴在笛卡尔哲学上，被看作那位法国哲学家动物机械论的先声（见 González Vila 1977: 99–125；Bandrés & Llavona 1993: 131–137；Valverde 2019: 55–61；Arén Janeiro 2021: 1374–1376）[^arén-2021][^bandrés-1993][^gonzález-1977][^valverde-2019]。不过，细究之下便知，在十六世纪西班牙哲学的直接语境里，*Antoniana* 确曾激起反响，只是贬多于褒。最早的回应之一，还是佩雷拉自己收进早期重印本的：他请自己的老师、萨拉曼卡大学神学教授米格尔·德·帕拉西奥斯给此书作一批评性审阅。帕拉西奥斯为应门生之请而写的 *Objectiones*（诘难）收入 *Antoniana Margarita*，并附一篇 *Apologia*，佩雷拉在其中概述并捍卫先前所立的一切论点。帕拉西奥斯的态度，是教授居高临下地翻阅高足之作，不是真正批评者的态度。无论如何，这些诘难都没抓住 *Antoniana* 的中心信息，或因其人未细读，或读而未解门生之思。帕拉西奥斯所析的几个问题虽不无趣味，却未触到全书的要害：佩雷拉要把灵魂与身体拆开，并在此基础上对灵魂不朽作出证明。因为，动物无感觉这一论题虽在文本次序上居首，却只是从他所主张的灵魂独立与统一中引出的一个后果。帕拉西奥斯却以为那是全书唯一可观的内容，自然无从对佩雷拉的论证作出系统批评。
