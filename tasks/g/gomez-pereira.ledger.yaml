      Gómez Pereira’s biography is largely unknown. Only a few data have been extracted from the Prologues of his books and from some legal documents discovered in his hometown Medina del Campo (Alonso Cortés 1914: 10; González Vila 1976: 95–96)[^alonso-1914][^gonzález-1976]. He was a prestigious doctor who practiced his profession in his own town, which at that time enjoyed great prosperity as a center of commerce. His medical reputation seems to have extended beyond Medina del Campo, since he was reportedly summoned to court to attend members of the royal household. Some sources suggest that he was called to assist Don Carlos, son of Philip II, though the documentation remains indirect and should be treated cautiously.The origin of his family is uncertain (the surname “Pereira” indicates that its origin was probably in Galicia or Portugal). It seems that his family was in trade and had a favorable position. Because of this professional activity it has been suggested that Gómez Pereira came from a family of Jewish “conversos” (González Vila 1976: 96–97; Rodríguez Pardo 2008: 195–199)[^gonzález-1976][^rodríguez-2008].
    step1: |-
      戈麦斯·佩雷拉的生平大体不明。我们所知的少量材料，来自他著作的序言以及在其故乡梅迪纳德尔坎波发现的一些法律文书（Alonso Cortés 1914: 10；González Vila 1976: 95–96）[^alonso-1914][^gonzález-1976]。他是一位有声望的医生，在家乡行医；当时的梅迪纳德尔坎波作为商业中心极为繁荣。他的医名似乎越出了梅迪纳德尔坎波，因为据说他曾被召入宫廷为王室成员诊治。有些材料暗示，他曾被召去为腓力二世之子堂卡洛斯治病，但文献仍是间接的，应当谨慎对待。其家族来源不明（“佩雷拉”这个姓氏表明其渊源可能在加利西亚或葡萄牙）。他的家庭似经商，且地位优渥。由于这一职业活动，有人推测戈麦斯·佩雷拉出身于犹太“改宗者”家庭（González Vila 1976: 96–97；Rodríguez Pardo 2008: 195–199）[^gonzález-1976][^rodríguez-2008]。
    step2: |-
      戈麦斯·佩雷拉的生平，今人所知甚少。几项材料得自他各书的序言，以及在其故乡梅迪纳德尔坎波发现的法律文书（Alonso Cortés 1914: 10；González Vila 1976: 95–96）[^alonso-1914][^gonzález-1976]。他是名医，在家乡执业；梅迪纳德尔坎波当时是商业中心，正处繁荣。他的医名似已越出本乡：据说他曾奉召入宫为王室成员诊病。有些材料暗示，他曾被召去医治腓力二世之子堂卡洛斯，但文献只是间接的，须谨慎看待。佩雷拉的家世不明，从“佩雷拉”这一姓氏看，其渊源或在加利西亚，或在葡萄牙。他家似乎经商，地位优渥；正因这一行当，有人推测戈麦斯·佩雷拉出自犹太“改宗者”之家（González Vila 1976: 96–97；Rodríguez Pardo 2008: 195–199）[^gonzález-1976][^rodríguez-2008]。
