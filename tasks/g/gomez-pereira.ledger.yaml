      1. The nature of the act of knowledge requires an indivisible principle, so that only the soul, the unique indivisible principle in man, knows; the body does not participate in sensory knowledge, not even as a tool; therefore, the soul, in its main functions (which are cognitive) enjoys complete independence and full operational self-sufficiency regardless of the body.
      2. This operational independence logically founds the ontological independence that allows the survival of the separated soul. Although Pereira does not deny the “corporeal” conditioning factors to which knowledge is subject, as evidenced by experience, he recognizes that the soul is weighed down by the body in its cognitive operations, so the body restricts the original and absolute cognitive spontaneity of the soul.
