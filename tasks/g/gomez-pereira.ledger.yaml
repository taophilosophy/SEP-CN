      This same poverty of references to Gómez Pereira’s philosophy was also present during the nineteenth century, at least until the moment when, in the context of a debate on Spanish science which was stimulated by Menéndez Pelayo and J. M. Guardia, among others, the figure of Gómez Pereira was recovered as an illustrious example of a true scientific tradition, or on the contrary as an exception in the most desolate desert.
    step1: |-

    step2: |-

  - id: 69
    kind: body
    source: |-
      In the case of Menéndez Pelayo, whose interest in the *Antoniana* came from his youth, Gómez Pereira was considered as an outstanding physician, a great scholar and a true pioneer of Cartesianism not only from the point of view of animal mechanism, but also as the first author of the famous *cogito ergo sum* (González Vila 1977: 113)[^gonzález-1977]. Later the Cantabrian scholar dedicated a detailed monographic study to the *Antoniana*, which he first published independently in 1878 and later as an appendix to his famous work *La ciencia española* (Menéndez Pelayo 1887–1888: vol. II, *Appendix*)[^menéndez-1887]. Against the interpretative tradition that was rooted in Pierre Bayle’s opinion with respect to the thought of Pereira, Menéndez Pelayo argued that in the *Antoniana* there is a complete philosophical system based on well-established principles. The image of Pereira drawn by Menéndez Pelayo was that of a great thinker (comparable to Vives), a sincere Catholic who was able to reconcile independence with orthodoxy, and someone who represented the living proof of the freedom of Spanish scientists under the Inquisition.
    step1: |-

    step2: |-

  - id: 70
    kind: body
    source: |-
      Another relevant vision of the Castilian doctor, contemporary with that of Menéndez Pelayo, can be found in the doctor, science writer and Humanist José M. Guardia, who was educated in France (in fact, the majority of his works were published in the famous *Revue Philosophique de la France et de l’Etranger*). Guardia destined an extensive study to the figure of Gómez Pereira, for whom he felt a special affinity as a free thinker in a remarkably hostile environment (Guardia 1889: 270–291, 382–407, 607–634)[^guardia-1889]. He tried to present him as a victim of the Inquisition in Spain: Pereira’s unquestionable materialism was soon persecuted, and his works almost disappeared. But, in spite of everything, an heroic Pereira was able to exercise a scientific methodology which helped him to overcome all the prejudices accumulated over the long history of the scholastic school. From this perspective, Guardia held that the third part of the *Antoniana* devoted, as we have seen, to the immortality of the soul, was only a subterfuge to “keep up appearances”. For him the central thesis of the book is the animal mechanism, where it is necessary to place Pereira’s great originality. With regard to the “Cartesian question” Guardia emphasized that neither Descartes nor the Cartesians wanted to recognize how much their philosophy owed to this Spanish doctor. This debate on the interpretation and the meaning of Pereira’s thinking somehow determined his recovery among the small number of Spanish scholars who have focused their attention on the figure of Gómez Pereira during the twentieth century (González Vila 1977: 120 ff.)[^gonzález-1977].
    step1: |-

