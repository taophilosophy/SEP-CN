      戈麦斯·佩雷拉同样不接受第一质料这一概念。亚里士多德构想此概念，用的无非类比，因为第一质料不为感官所及。它是在形式与形式交替之际作为不变主体而存留的东西：譬如在生成过程中要引入新形式，形成新活体所需的自然禀赋便须先已具备，并在全过程保持；这些禀赋不为感觉所及，就是第一质料，它没有任何积极本性。亚里士多德因此才在《形而上学》第七卷指出：它既非某个 *quid*，亦非 *quantum*，也不属于任何其他种类的谓词（见 *Metaphysica*, VII, 3, 1029a6–29）。*Antoniana Margarita* 的作者反驳此说：在自然生成中，不只复合物的质料部分消失，形式部分同样消失；既然如此，亚里士多德派若用 *ex nihilo nihil fieri*（无中不能生有）来论证质料必然长存，对形式也该照说，因为形式与质料都不能化为虚无，也不能自虚无而生——这等于说形式也存在于时间的连续之中（AM: I.549）。佩雷拉认为，只要想到元素是自然的基本材料，此难便迎刃而解：元素尽可充任质料的角色；元素本身会变、甚至会灭，也无妨碍，因为它们终究受制于与其自身一致性相违的性质——这类性质在元素中强盛时，总招致其毁灭；反之，第一性的质一旦以恰当比例出现，同样的元素便又生成。
