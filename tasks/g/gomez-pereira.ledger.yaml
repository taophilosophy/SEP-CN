      The young Pereira was sent to study Arts at the University of Salamanca, where a profound pedagogical renewal was just then under way (Muñoz Delgado 1964: 75–89; Valverde 2019: ix)[^muñoz-1964][^valverde-2019]. Among the professors whose lectures he attended we must pay particular attention to Juan Martínez Guijarro and Juan de Oria. The first came from the University of Paris and developed at the University of Salamanca new teaching methods in the field of logic and natural philosophy. Many years later, Gómez Pereira dedicated one of his books to him as a sign of affection and admiration for the man who was in charge of the education of young Philip II and became Archbishop of Toledo. Also, Juan de Oria – who was later condemned by the Inquisition and spent his last years of life in seclusion – lectured on logic and natural philosophy. Oria may have stimulated Pereira’s interest in the problem of immortality, since he was well acquainted with the controversies then unfolding – especially in the universities of northern Italy during those years (Muñoz Delgado 1987: vol. I, 9–17; Valverde 2020: 242–247)[^muñoz-1987][^valverde-2020].
    step1: |-
      年轻的佩雷拉被送往萨拉曼卡大学学习文科；当时那里正进行一场深刻的教学改革（Muñoz Delgado 1964: 75–89；Valverde 2019: ix）[^muñoz-1964][^valverde-2019]。在他听讲的教授中，应特别注意胡安·马丁内斯·吉哈罗与胡安·德·奥里亚。前者来自巴黎大学，在萨拉曼卡大学发展了逻辑学与自然哲学领域的新教学法。许多年后，戈麦斯·佩雷拉把一部著作题献给他，以表达对这位曾负责少年腓力二世的教育、后来成为托莱多大主教者的敬爱与钦佩。胡安·德·奥里亚讲授逻辑学与自然哲学；他后来被宗教裁判所判罪，晚年幽居。奥里亚可能激发了佩雷拉对不朽问题的兴趣，因为他熟知当时正在展开的论争，尤其是那几年意大利北部各大学的论争（Muñoz Delgado 1987: vol. I, 9–17；Valverde 2020: 242–247）[^muñoz-1987][^valverde-2020]。
    step2: |-
      少年佩雷拉被送到萨拉曼卡大学攻读文科，那里恰在推行一场深刻的教学革新（Muñoz Delgado 1964: 75–89；Valverde 2019: ix）[^muñoz-1964][^valverde-2019]。听他课的教授中，尤须留意胡安·马丁内斯·吉哈罗与胡安·德·奥里亚。吉哈罗来自巴黎大学，在萨拉曼卡开创了逻辑学与自然哲学的新教法。多年以后，戈麦斯·佩雷拉将一部书题献给他，既是敬爱，也是感念：此人曾主持少年腓力二世的教育，后任托莱多大主教。胡安·德·奥里亚讲授逻辑学与自然哲学，后来遭宗教裁判所判罪，晚年幽居。佩雷拉对不朽问题的兴趣，或许正是奥里亚点起来的，因为他对当时正在展开的论争十分熟悉，尤其是那几年意大利北部各大学的论争（Muñoz Delgado 1987: vol. I, 9–17；Valverde 2020: 242–247）[^muñoz-1987][^valverde-2020]。
