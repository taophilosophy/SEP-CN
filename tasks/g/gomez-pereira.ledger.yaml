      This conception adopted by Pereira to explain the integral unity of the rational soul needed to be developed to explain the integral unity of the human being. Many of his statements, both in the *Antoniana* and in the *Apologia*, pointed out that the human being is not only the soul, but the conjunction of a body and a soul (see, for example, AM: I.687, I.697, II.1077, II.1149). In fact, he never abandoned the formal relationship that the rational soul has with regard to the body (see González Vila 1975: 41)[^gonzález-1975]. However, the concept of form used by Pereira permitted him to speak of a plurality of forms in a single subject (as many Averroists defended: see above). For him, the *unity* of a compound is not given by the *uniqueness* of a substantial form, but by the hierarchy of several forms under a superior one that gives the compound its ultimate denomination. In a human, who is the most complex being of creation, there would be a compound of compounds. Therefore, the rational soul is not the only substantial form in him, although it is the only *human* form since it crowns that hierarchy of forms and confers to the *whole human being* his nature and denomination. Pereira defended what can be considered a *dynamic* hylomorphism which was surely built on his own biological experience as a doctor. However, the body-soul union of which the Spanish physician spoke in his *Antoniana* can hardly be considered substantial *sensu stricto*, mainly because in his book there is no detailed explanation of the relation of the soul to the body, or of what kind of union there is between two natures so different in themselves. For him it is a *factum* that in human beings these two natures converge, but he failed to explain this question – probably for the sake of a coherence that was perhaps impossible.
    step1: |-
      佩雷拉为解释理性灵魂的整体统一而采用的这一构想，需要加以发展，以解释人的整体统一。他在 *Antoniana* 与 *Apologia* 中的许多表述都指出，人不仅是灵魂，而且是身体与灵魂的结合（例如见 AM: I.687, I.697, II.1077, II.1149）。事实上，他从未放弃理性灵魂相对于身体所具有的形式关系（见 González Vila 1975: 41）[^gonzález-1975]。然而，佩雷拉所用的形式概念使他能够谈论单一主体中的形式多元（如许多阿威罗伊主义者所主张：见上文）。在他看来，复合物的 **统一** 不是由某一实体形式的 **唯一性** 给出的，而是由诸多形式在一个更高形式之下的层级给出的，这个更高形式赋予复合物最终的命名。在人这个造物中最复杂的存在者身上，将有一个复合物的复合物。因此，理性灵魂在他身上不是唯一的实体形式，尽管它是唯一的 **人的** 形式，因为它位居那一形式层级的顶端，并赋予 **完整的人** 以本性与命名。佩雷拉所捍卫的，可以看作一种 **动态的** 质形论，这无疑建立在他作为医生的生物学经验之上。然而，这位西班牙医生在 *Antoniana* 中所说的身体与灵魂的结合，很难在 *sensu stricto*（严格意义）上被视为实体性的结合，主要因为他的书中没有详细解释灵魂与身体的关系，也没有说明两种本身如此不同的本性之间究竟是何种结合。对他来说，在人的身上这两种本性会合是一个 *factum*（事实），但他未能解释这一问题，这大概是为了某种也许不可能的连贯性。
    step2: |-
      佩雷拉为说明理性灵魂的整体统一而提出的这套构想，还须推展，才能说明人的整体统一。他在 *Antoniana* 与 *Apologia* 中多处指出，人不只是灵魂，而是身体与灵魂的会合（例如见 AM: I.687, I.697, II.1077, II.1149）。事实上，他从未放弃理性灵魂对身体的这一形式关系（见 González Vila 1975: 41）[^gonzález-1975]。不过，他沿用的形式概念容许他谈单一主体中的形式多元（许多阿威罗伊主义者即持此说：见上文）。在他看来，复合物的 **统一** 不来自实体形式的 **唯一**，而来自诸形式在一个更高形式之下的层级；正是那个更高形式给复合物最终命名。人乃造物中最复杂者，其上还套着一层复合物。所以，理性灵魂在人身上并非唯一的实体形式；它却是唯一的 **人的** 形式，因为它高踞那一形式层级之顶，赋予 **完整的人** 以本性与名称。佩雷拉所主张的，可称一种 **动态的** 质形论，其根底无疑是他行医所得的生物学经验。然而，这位西班牙医生在 *Antoniana* 中所说的身心结合，很难在 *sensu stricto*（严格意义）上算作实体性的结合：他的书里既没有细说灵魂与身体的关系，也没有交代两种本身如此不同的本性之间究竟是怎样一种结合。在他看来，这两种本性在人与上会合是一个 *factum*（事实），但他未能解释这一点——大概是为了某种也许无法企及的连贯。
