      This growing interest in animal mechanism and specifically in the *Antoniana Margarita* was the cause of the second and final edition of the book in 1749, whose preface and permission generously praised Gómez Pereira, and lamented the fact that such an innovator had fallen into total oblivion among the philosophers of his own land. Unfortunately, this new edition did not remedy the prevailing ignorance about him, as one can realize by reading the different works of natural philosophy and the dictionaries produced in Spain at that time, where there are few references to our doctor and they seem to come from indirect sources, not from a direct reading of the text.
    step1: |-
      人们对动物机械论、尤其是对 *Antoniana Margarita* 日益增长的兴趣，促成了该书 1749 年的第二版、也是最后一版；其序言与许可文书慷慨地赞扬了戈麦斯·佩雷拉，并慨叹这样一位创新者竟在本国哲学家中间陷入彻底的遗忘。遗憾的是，这一新版并未纠正人们对他的普遍无知；只要读一读当时西班牙出版的自然哲学著作与词典便可明白：其中提到我们这位医生的地方很少，而且似乎来自间接材料，而非直接阅读原书。
    step2: |-
      动物机械论日受关注，*Antoniana Margarita* 尤其如此，于是有了 1749 年的第二版，也是末版。序言与准印文书对戈麦斯·佩雷拉备加称许，并慨叹这样一位创新者竟在本国哲学家中遭人全忘。可惜新版并未驱散世人的无知：读一读当时西班牙刊行的自然哲学著作与词典便知，提到这位医生的地方寥寥，且似出自间接材料，而非直接读其原书。
  - id: 68
    kind: body
    source: |-
      This same poverty of references to Gómez Pereira’s philosophy was also present during the nineteenth century, at least until the moment when, in the context of a debate on Spanish science which was stimulated by Menéndez Pelayo and J. M. Guardia, among others, the figure of Gómez Pereira was recovered as an illustrious example of a true scientific tradition, or on the contrary as an exception in the most desolate desert.
    step1: |-
      十九世纪同样存在对戈麦斯·佩雷拉哲学的引用贫乏，至少直到某一刻为止：在由梅嫩德斯·佩拉约与 J. M. 瓜尔迪亚等人激起的关于西班牙科学的争论中，戈麦斯·佩雷拉的形象被重新发掘出来，或被当作真正科学传统的杰出范例，或被相反地视为最荒凉沙漠中的一个例外。
    step2: |-
      十九世纪里，关于戈麦斯·佩雷拉哲学的引证依旧稀少，直到某一刻为止：梅嫩德斯·佩拉约与 J. M. 瓜尔迪亚等人激起一场关于西班牙科学的争论，佩雷拉的形象随之被重新抬出，或被奉为真正科学传统的显例，或被反过来说成一片荒原中的孤例。
  - id: 69
    kind: body
    source: |-
      In the case of Menéndez Pelayo, whose interest in the *Antoniana* came from his youth, Gómez Pereira was considered as an outstanding physician, a great scholar and a true pioneer of Cartesianism not only from the point of view of animal mechanism, but also as the first author of the famous *cogito ergo sum* (González Vila 1977: 113)[^gonzález-1977]. Later the Cantabrian scholar dedicated a detailed monographic study to the *Antoniana*, which he first published independently in 1878 and later as an appendix to his famous work *La ciencia española* (Menéndez Pelayo 1887–1888: vol. II, *Appendix*)[^menéndez-1887]. Against the interpretative tradition that was rooted in Pierre Bayle’s opinion with respect to the thought of Pereira, Menéndez Pelayo argued that in the *Antoniana* there is a complete philosophical system based on well-established principles. The image of Pereira drawn by Menéndez Pelayo was that of a great thinker (comparable to Vives), a sincere Catholic who was able to reconcile independence with orthodoxy, and someone who represented the living proof of the freedom of Spanish scientists under the Inquisition.
    step1: |-
      就梅嫩德斯·佩拉约而言，他对 *Antoniana* 的兴趣始于青年时代；他把戈麦斯·佩雷拉看作杰出的医生、伟大的学者、笛卡尔主义的真正先驱：不仅在动物机械论方面，而且作为著名的 *cogito ergo sum*（我思故我在）的第一位作者（González Vila 1977: 113）[^gonzález-1977]。后来，这位坎塔布里亚学者为 *Antoniana* 写了一部详细的专题研究，先于 1878 年单独出版，后作为附录收入其名著 *La ciencia española*（《西班牙科学》）（Menéndez Pelayo 1887–1888: vol. II, *Appendix*）[^menéndez-1887]。针对那种植根于培尔对佩雷拉思想之看法的解释传统，梅嫩德斯·佩拉约论证说，*Antoniana* 中有一个建立在稳固原则之上的完整哲学体系。梅嫩德斯·佩拉约所描绘的佩雷拉形象，是一位伟大的思想家（可与比韦斯相比）、一位真诚的天主教徒（能把独立与正统调和起来），并且是宗教裁判所治下西班牙科学家享有自由的活生生证明。
    step2: |-
      梅嫩德斯·佩拉约自少年时便留意 *Antoniana*；在他眼里，戈麦斯·佩雷拉是名医、大学者，是笛卡尔主义的真正先驱——不仅在动物机械论上，还是著名的 *cogito ergo sum*（我思故我在）的首位作者（González Vila 1977: 113）[^gonzález-1977]。后来，这位坎塔布里亚学者为 *Antoniana* 作了一部详尽的专题研究，1878 年先行单行，后作为附录收入其名著 *La ciencia española*（《西班牙科学》）（Menéndez Pelayo 1887–1888: vol. II, *Appendix*）[^menéndez-1887]。当时流行的解释传统本于培尔对佩雷拉思想的评判；梅嫩德斯·佩拉约反其道而论，主张 *Antoniana* 中自有一套建筑在稳固原则之上的完整哲学体系。他笔下的佩雷拉，是堪与比韦斯比肩的大思想家，是能把独立与正统调和起来的真诚天主教徒，也是宗教裁判所之下西班牙科学家仍有自由的活证。
