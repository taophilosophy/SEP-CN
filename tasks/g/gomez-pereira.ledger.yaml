      戈麦斯·佩雷拉出现在法国博学精英之中（尽管是以暗淡的方式），一个意外的效果是：他的著作在十八世纪得到重新发掘。但令我们这位作者再次不幸的是，这一重新发掘并未带来对其思想的任何严肃而细致的研究（González Vila 1977: 109）[^gonzález-1977]。评论与分析 *Antoniana Margarita* 内容时所采用的唯一视角，是由它可能对笛卡尔产生影响这一观念所决定的；此外，西班牙作家通常追随培尔的判词，否认这种影响。最值得注意的例外之一，是耶稣会士胡安·德·乌略亚；他在驳斥机械论与原子论之后说，尽管如此，他仍为有几位同胞（如佩雷拉与巴列斯）曾指引过像笛卡尔那样强有力的头脑而感到自豪（Bandrés & Llavona 1993: 134）[^bandrés-1993]。
    step2: |-
      戈麦斯·佩雷拉跻身法国博学之士的行列，虽只占一席黯淡之地，却带来一个意外结果：他的著作在十八世纪重获关注。可惜对作者而言，这回关注依旧没有带来严肃细致的研究（González Vila 1977: 109）[^gonzález-1977]。评说 *Antoniana Margarita* 的唯一视角，是“它对笛卡尔可能有何影响”；而西班牙的论者又多随培尔的判词，否认这种影响。最可注意的例外之一，是耶稣会士胡安·德·乌略亚：他驳倒机械论与原子论之后，仍说无论如何都为有几位同胞（佩雷拉与巴列斯）曾为笛卡尔那样强健的头脑指路而自豪（Bandrés & Llavona 1993: 134）[^bandrés-1993]。
