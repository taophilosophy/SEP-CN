      Pereira’s epistemology rests upon a theory of the soul grounded in the principles of simplicity and indivisibility (González Vila 1975: 22)[^gonzález-1975]. His own vision of the rational soul led him to object to the philosophy of Aristotle, as well as to give a response to the question of whether the human intellect can perform its own activity without the support of the body. Pereira’s reply was a categorical yes: in fact, given his own epistemological premises, knowledge is possible only if it is identical with the substance of the soul itself. To demonstrate this assertion, the author addressed some issues that had been present in the debate about the nature and destiny of the soul from the Middle Ages (see Nardi 1958: 365–442; Kristeller 1979: 181–196; Valverde 2019: 35–55)[^kristeller-1979][^nardi-1958][^valverde-2019].
    step1: |-

    step2: |-

  - id: 30
    kind: body
    source: |-
      In the first place, the problem of the soul’s indivisibility had aroused an important debate within Aristotelianism. Aristotle himself had already denounced at the end of Book I of his *De Anima* the absurd consequences of considering that the soul has parts understood as substantially different: if the soul is the principle that unifies the body, it can in no way be divisible itself; if not, we should have to find another superior principle and so on to infinity. Notwithstanding this assess, there is no doubt that Aristotle also spoke of the different functions exercised by the soul through its different faculties: thus, it was inevitable that the unity of the soul reappeared once again. This issue had been widely discussed since the Middle Ages but remained still debated among many Renaissance Aristotelians. The subtleties (*distinctiones*) in the interpretation of the thought of Aristotle became increasingly complex, giving rise to an intricate tangle of arguments and counter-arguments difficult to follow even for the experts (see Di Napoli 1963: 339 ff.; Schmitt 1983: 13–42; Bianchi 2003a: 133–172)[^bianchi-2003a][^schmitt-1983].
    step1: |-

    step2: |-

  - id: 31
    kind: body
    source: |-
      Linked to this question was another topic also discussed among the Aristotelians: are there several substantial forms in a single compound? The different responses to this question had a particular impact on the debate over the connection of the intellectual soul with the body. Two main positions can be easily distinguished here: there was a unitary position based on the thought of St. Thomas, for whom the intellective soul is the only substantial form present in human beings, having in itself the derived potentialities of the vegetative and sensitive souls; the position contrary to this had as a pattern the philosophy of Averroes: in this case many – professed Averroists or not – admitted the existence of more than one substantial form in the same compound in order to explain the link between the human soul and the body, as can be seen in great figures of medieval and Renaissance Aristotelianism such as John of Jandun, Nicole Oresme, Paul of Venice, Agostino Nifo and later Giacomo Zabarella. Zabarella summarized this position by pointing out that the intellectual soul may in no way be attached directly to prime matter: its own complexity requires a high level of organization in the subject matter so that it can serve as an appropriate instrument for the powers that the human soul is capable of exercising. For this reason, our soul needs a preliminary compound with its own substantial form (Zabarella 1590 [2016: vol. II, pp. 897]; Park 1988: 464–484)[^park-1988].
    step1: |-

    step2: |-

  - id: 32
    kind: body
    source: |-
      In this debate Pereira wanted to intervene formulating a discourse whose principal aim was to resolve those difficulties which were inherent in the relation between the soul and the body. This discourse was clearly linked to the theoretical assumptions of his time, but it had in addition traits of certain originality which has gone alas largely unnoticed. The author of the *Antoniana Margarita* put his finger on the deficiencies of the Scholastic-Thomist philosophy when it was applied to demonstrate the immortal nature of the human soul. In this sense, he clearly assumed that the criticism of the Alexandrist Aristotelians, and in particular of Pietro Pomponazzi, was essentially correct (Pine 1986: 124 ff.; Perrone 1999: xlvi–lxvii)[^perrone-1999][^pine-1986]. Pereira concluded that assuming that the rational soul is potentially capable of exercising the activities related to vital functions implies recognizing that it is linked to the body. Thus, given the premises established by Aristotle himself in his *De generatione animalium* (II, 3), the origin of that soul must be found in the same process of natural generation that gives rise to the living body, but this process is essentially material. For Pereira, then, if we really want to save the immortality of the soul, we must radically separate it from all activity that is related in one way or another to the body. He accepted the consequences of the dilemma that Pomponazzi had established in his *De immortalitate animae* (1516): if the soul has the body as its own substratum (*ut subiecto*) or cannot operate without the support of the body (*ut obiecto*), it is inseparable from it, being then perishable (see Pine 1986: 55–123; Kessler 1988: 500–504)[^kessler-1988][^pine-1986]. It can be said that, to a great extent, the *Antoniana Margarita* was conceived to give a satisfactory answer to this unavoidable syllogism (see Valverde 2017: 541–553)[^valverde-2017]. Pereira tried to show that the rational soul has nothing to do with the body because it is a simple and independent substance dissociated from all those vital functions that have the body as their object or as their substrate: these functions belong then to a psychic principles different from the intellect:
    step1: |-

    step2: |-

