      持续的政治发展表明，这类辩论不止有狭窄的学术意义。直到不久以前，全球化的几条关键分支似乎注定要以看似永久的方式改造人类事务：经济全球化，以及一整套国际与全球政治、法律制度的增长，持续快速推进。应当说，这些制度发展曾被一些世界主义理论家解读为大体印证了他们的整体规范愿景。随着民族主义与民粹主义政治运动复兴——其中许多笼统地（有时误导性地）把矛头指向全球化的要素——全球化的前景似乎越来越不确定。例如，手握重权的政治领袖常对联合国与欧盟出言轻蔑；全球化最引人注目的特征之一，即“超越民族国家”的强化政治法律决策，是否还能持续，已不清楚。或许可悲的是，经济全球化没被管好、未能尽量减少可避免的不平等与不义，反而为民族主义与民粹主义的反弹开了门；如今许多人乐于拥戴那些许诺抵制“自由贸易”、抵制相对宽松的边界（对移民与难民）、抵制其他全球化表现的政客与运动（Stiglitz 2018）[^stiglitz-2018]。民族主义者或民粹主义者即便不大可能完全止住、更不用说逆转去地域化、互联性强化与社会加速的结构性趋势，他们或许仍能以世界主义者大概会警觉的方式重塑这些趋势。至于他们能否成功应对许多根本的全球挑战（例如气候变化或核扩散），可能性要小得多。
