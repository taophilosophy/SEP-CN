      A similar divide characterizes the ongoing debate about the prospects of democratic institutions at the global level. In a cosmopolitan mode, Daniele Archibugi (2008) and the late David Held (1995) have argued that globalization requires the extension of liberal democratic institutions (including the rule of law and elected representative institutions) to the transnational level. Nation state-based liberal democracy is poorly equipped to deal with deleterious side effects of present-day globalization such as ozone depletion or burgeoning material inequality. In addition, a growing array of genuinely transnational forms of activity calls out for correspondingly transnational modes of liberal democratic decision-making. According to this model, “local” or “national” matters should remain under the auspices of existing liberal democratic institutions. But in those areas where deterritorialization and social interconnectedness across national borders are especially striking, new transnational institutions (for example, cross-border referenda), along with a dramatic strengthening and further democratization of existing forms of supranational authority (in particular, the United Nations), are necessary if we are to assure that popular sovereignty remains an effective principle. In the same spirit, cosmopolitans debate whether a loose system of global “governance” suffices, or instead cosmopolitan ideals require something along the lines of a global “government” or state (Cabrera 2011; Scheuerman 2014)[^cabrera-2011][^scheuerman-2014]. Jürgen Habermas, a prominent cosmopolitan-minded theorist, has tried to formulate a defense of the European Union that conceives of it as a key stepping stone towards supranational democracy. If the EU is to help succeed in salvaging the principle of popular sovereignty in a world where the decay of nation state-based democracy makes democracy vulnerable, the EU will need to strengthen its elected representative organs and better guarantee the civil, political, and social and economic rights of all Europeans (Habermas 2001, 58–113; 2009)[^habermas-2001]. Representing a novel form of postnational constitutionalism, it potentially offers some broader lessons for those hoping to save democratic constitutionalism under novel global conditions. Despite dire threats to the EU posed by nationalist and populist movements, Habermas and other cosmopolitan-minded intellectuals believe that it can be effectively reformed and preserved (Habermas 2012)[^habermas-2012].
    step1: |-
      关于全球层面民主制度前景的持续辩论，也呈现类似的分野。以世界主义的方式，Daniele Archibugi（2008）与已故的 David Held（1995）论证，全球化要求把自由民主制度（包括法治与民选代议机构）扩展到跨国层面。以民族国家为基的自由民主，无力应对当今全球化的有害副作用，如臭氧耗竭或日益膨胀的物质不平等。此外，越来越多的真正跨国活动形式，呼唤相应的跨国自由民主决策模式。按此模型，“地方”或“国家”事务应留在现有自由民主制度的管辖之下。但在去地域化与跨国社会互联性特别突出的领域，若要确保人民主权仍是一项有效原则，就需要新的跨国制度（例如跨境公投），并大幅加强、进一步民主化现有超国家权威形式（尤其是联合国）。本着同一精神，世界主义者辩论：一个松散的全球“治理”体系是否足够，还是世界主义理想要求某种类似全球“政府”或国家的东西（Cabrera 2011; Scheuerman 2014）[^cabrera-2011][^scheuerman-2014]。著名世界主义倾向的理论家 Jürgen Habermas 试图为欧盟作一辩护，把它设想为通向超国家民主的关键垫脚石。若欧盟要有助于在一个民族国家民主衰败、民主因而脆弱的世界里挽救人民主权原则，它就需要加强其民选代议机关，并更好地保障全体欧洲人的公民、政治、社会与经济权利（Habermas 2001, 58–113; 2009）[^habermas-2001]。欧盟代表一种新型的后民族宪制主义，对那些希望在新全球条件下保住民主宪制的人，它可能提供一些更广泛的教训。尽管民族主义与民粹主义运动对欧盟构成严峻威胁，Habermas 与其他世界主义倾向的知识分子相信，欧盟能够得到有效改革并保存下来（Habermas 2012）[^habermas-2012]。
