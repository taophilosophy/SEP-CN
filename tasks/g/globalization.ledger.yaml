      Third, globalization must also include reference to the *speed* or *velocity* of social activity. Deterritorialization and interconnectedness initially seem chiefly spatial in nature. Yet it is easy to see how these spatial shifts are directly tied to the acceleration of crucial forms of social activity. As we observed above in our discussion of the conceptual forerunners to the present-day debate on globalization, the proliferation of high-speed transportation, communication, and information technologies constitutes the most immediate source for the blurring of geographical and territorial boundaries that prescient observers have diagnosed at least since the mid-nineteenth century. The compression of space presupposes rapid-fire forms of technology; shifts in our experiences of territory depend on concomitant changes in the temporality of human action. High-speed technology only represents the tip of the iceberg, however. The linking together and expanding of social activities across borders is predicated on the possibility of relatively fast flows and movements of people, information, capital, and goods. Without these fast flows, it is difficult to see how distant events could possibly posses the influence they now enjoy. High-speed technology plays a pivotal role in the velocity of human affairs. But many other factors contribute to the overall pace and speed of social activity. The organizational structure of the modern capitalist factory offers one example; certain contemporary habits and inclinations, including the “mania for motion and speed” described by Dewey, represent another. Deterritorialization and the expansion of interconnectedness are intimately tied to the acceleration of social life, while social acceleration itself takes many different forms (Eriksen 2001; Rosa 2013)[^eriksen-2001][^rosa-2013]. Here as well, we can easily see why globalization is always a matter of degree. The velocity or speed of flows, movements, and interchanges across borders can vary no less than their magnitude, impact, or regularity.
    step1: |-
      第三，全球化还必须包括社会活动的 *速度* 或 *速率*。去地域化与互联性初看似乎主要是空间性的。但很容易看出，这些空间变动与关键社会活动的加速直接相关。如前文讨论当今全球化辩论的概念前驱时所见，高速交通、通讯与信息技术的扩散，是地理与领土边界模糊化的最直接源头——敏锐的观察者至少从十九世纪中叶起就已诊断出这一点。空间压缩以快节奏的技术形式为前提；领土体验的变动依赖人类行动时间性的相伴变化。但高速技术只是冰山一角。跨边界的联结与扩展，以人、信息、资本与商品相对快速的流动与移动为前提。没有这些快速流动，就很难看出远方事件何以能有今日的影响。高速技术在人类事务的速率中起枢轴作用。但许多别的因素也促成社会活动的整体步速与速度。现代资本主义工厂的组织结构是一例；某些当代习惯与倾向，包括杜威描述的“对运动与速度的狂热”，又是一例。去地域化与互联性的扩展，与社会生活的加速紧密相连；而社会加速本身又形态各异（Eriksen 2001; Rosa 2013）[^eriksen-2001][^rosa-2013]。这里同样容易看出，为什么全球化总是一个程度问题。跨边界的流动、移动与交换的速率，其可变程度不亚于它们的量级、影响与规律性。
