      First, recent analysts associate globalization with *deterritorialization*, according to which a growing variety of social activities takes place irrespective of the geographical location of participants. As Jan Aart Scholte observes, “global events can – via telecommunication, digital computers, audiovisual media, rocketry and the like – occur almost simultaneously anywhere and everywhere in the world” (Scholte 1996, 45)[^scholte-1996]. Globalization refers to increased possibilities for action between and among people in situations where latitudinal and longitudinal location seems immaterial to the social activity at hand. Even though geographical location remains crucial for many undertakings (for example, farming to satisfy the needs of a local market), deterritorialization manifests itself in many social spheres. Business people on different continents now engage in electronic commerce; academics make use of the latest Internet conferencing equipment to organize seminars in which participants are located at disparate geographical locations; the Internet allows people to communicate instantaneously with each other notwithstanding vast geographical distances separating them. Territory in the sense of a traditional sense of a geographically identifiable location no longer constitutes the whole of “social space” in which human activity takes places. In this initial sense of the term, globalization refers to the spread of new forms of non-territorial social activity (Ruggie 1993; Scholte 2000)[^ruggie-1993][^scholte-2000].
    step1: |-
      第一，晚近的分析者把全球化与 **去地域化** 联系起来：据此，越来越多样的社会活动在参与者地理位置各异的情况下照样进行。正如 Jan Aart Scholte 所观察到的：“全球事件可以——经由电信、数字计算机、视听媒体、火箭技术等等——几乎同时在世界任何地方、一切地方发生”（Scholte 1996, 45）[^scholte-1996]。全球化指在经纬位置似乎与手头社会活动无关的情形下，人与人、人群与人群之间行动的可能性增加。尽管地理位置对许多事务仍然要紧（例如为满足本地市场需要而耕作），去地域化仍在许多社会领域显露出来。不同大陆的商人如今从事电子商务；学者用最新的互联网会议设备组织研讨会，与会者分处不同地理位置；互联网让人即时互通，哪怕相隔遥远。传统意义上可在地理上识别的位置式领土，不再构成人类活动所发生的“社会空间”之全部。在这个初步意义上，全球化指新的非领土性社会活动形式的扩散（Ruggie 1993; Scholte 2000）[^ruggie-1993][^scholte-2000]。
    step2: |-
      第一，晚近论者把全球化与 **去地域化** 联系起来：据此，日益多样的社会活动不必顾及参与者的地理位置。正如 Jan Aart Scholte 所说：“全球事件可以——经由电信、数字计算机、视听媒体、火箭技术等等——几乎同时在世界任何地方、一切地方发生”（Scholte 1996, 45）[^scholte-1996]。全球化说的是：在经纬位置似乎与手头活动无关的情形下，人与人、群体与群体之间行动的可能性在增加。地理位置对许多事务当然仍旧要紧（比如为供应本地市场而耕作），但去地域化已在许多社会领域显露。不同大陆的商人如今做起电子商务；学者用最新的互联网会议设备组织研讨会，与会者散处各地；互联网让人即时互通，哪怕相隔遥远。可在地理上识别位置的领土，这个传统意义上的领土，已不再构成人类活动所发生的“社会空间”之全部。在这个初步意义上，全球化指新的非领土性社会活动形式的扩散（Ruggie 1993; Scholte 2000）[^ruggie-1993][^scholte-2000]。
