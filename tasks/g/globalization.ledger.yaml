      哲学家与政治理论家热切地讨论我们这个日益全球化的世界的规范与政治意涵。围绕能否在全球层面实现正义，一场活跃的辩论把世界主义者与形形色色的社群主义者、民族主义者、现实主义者及其他赋予民族国家及其道德、政治、社会纽带以优先地位的人对立起来（Lieven 2020; Tamir 2019）[^lieven-2020][^tamir-2019]。世界主义者则倾向于强调我们对远方者的普遍义务——对可能与我们在语言、习俗、文化上少有共同之处者的义务——并常说“家园的正义”这一诉求同样可以适用于别处（Beardsworth 2011; Beitz 1999; Caney 2006; Wallace-Brown & Held 2010）[^beardsworth-2011][^beitz-1999][^brown-2010][^wallace-brown-2010]。世界主义就这样直接接续了现代道德与政治思想的普遍主义冲动。批评者质疑：我们对外国人的义务，真的与我们对自己仍深深隶属的特定地方与民族共同体成员所负的义务地位相同吗？他们绝不否认纠正全球不平等的必要，但对世界主义的一个倾向常表怀疑：把重大法律与政治改革说成解决行星不平等的必要之举——在这个行星上，每年有数百万人死于饥饿或可治愈的疾病（Miller 2007; 2013; Nagel 2005）[^miller-2007][^nagel-2005]。批评者也未必否认全球化进程的真实，尽管其中一些人认为其影响被严重夸大（Kymlicka 1999; Nussbaum *et al*. 1996; Streeck 2016）[^kymlicka-1999][^nussbaum-1996][^streeck-2016]。但他们怀疑，人类是否已形成一种丰富而足够明确的共同命运感，足以让实现更大全球正义的深远尝试（例如从富国向穷国大规模再分配）成功。世界主义者不只抛出一连串普遍主义、平等主义的道德论证，还指责对手掩盖了全球化对民族共同体特定形式所构成的威胁——而社群主义者、民族主义者等正为这些形式的伦理优先性背书。在世界主义者看来，偏袒民族国家同胞的道德与政治义务，是一种误入歧途、日趋反动的怀旧，所怀的是一套正迅速衰败的政治实践与制度。
