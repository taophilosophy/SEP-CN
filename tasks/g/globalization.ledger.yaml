      Second, theorists conceive of globalization as linked to the growth of social *interconnectedness* across existing geographical and political boundaries. In this view, deterritorialization is a crucial facet of globalization. Yet an exclusive focus on it would be misleading. Since the vast majority of human activities is still tied to a concrete geographical location, the more decisive facet of globalization concerns the manner in which distant events and forces impact on local and regional endeavors (Tomlinson 1999, 9)[^tomlinson-1999]. For example, this encyclopedia might be seen as an example of a deterritorialized social space since it allows for the exchange of ideas in cyberspace. The only prerequisite for its use is access to the Internet. Although substantial inequalities in Internet access still exist, use of the encyclopedia is in principle unrelated to any specific geographical location. However, the reader may very well be making use of the encyclopedia as a supplement to course work undertaken at a school or university. That institution is not only located at a specific geographical juncture, but its location is probably essential for understanding many of its key attributes: the level of funding may vary according to the state or region where the university is located, or the same academic major might require different courses and readings at a university in China, for example, than in Argentina or Norway. Globalization refers to those processes whereby geographically distant events and decisions impact to a growing degree on “local” university life. For example, the insistence by powerful political leaders in wealthy countries that the International Monetary Fund (IMF) or World Bank recommend to Latin and South American countries that they commit themselves to a particular set of economic policies might result in poorly paid teachers and researchers as well as large, understaffed lecture classes in São Paolo or Lima; the latest innovations in information technology from a computer research laboratory in India could quickly change the classroom experience of students in British Columbia or Tokyo. Globalization refers “to processes of change which underpin a transformation in the organization of human affairs by linking together and expanding human activity across regions and continents” (Held, McGrew, Goldblatt & Perraton 1999, 15). Globalization in this sense is a matter of degree since any given social activity might influence events more or less faraway: even though a growing number of activities seems intermeshed with events in distant continents, certain human activities remain primarily local or regional in scope. Also, the magnitude and impact of the activity might vary: geographically removed events could have a relatively minimal or a far more extensive influence on events at a particular locality. Finally, we might consider the degree to which interconnectedness across frontiers is no longer merely haphazard but instead predictable and regularized (Held, McGrew, Goldblatt & Perraton 1999).
