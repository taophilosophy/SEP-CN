      To claim, for example, that questions of distributive justice have no standing in the making of foreign affairs represents at best empirical naivete about economic globalization. At worst, it constitutes a disingenuous refusal to grapple with the fact that the material existence of those fortunate enough to live in the rich countries is inextricably tied to the material status of the vast majority of humanity residing in poor and underdeveloped regions. Growing material inequality spawned by economic globalization is linked to growing domestic material inequality in the rich democracies (Falk 1999; Pogge 2002)[^falk-1999][^pogge-2002]. Similarly, in the context of global warming and the destruction of the ozone layer, a dogmatic insistence on the sanctity of national sovereignty risks constituting a cynical fig leaf for irresponsible activities whose impact extends well beyond the borders of those countries most directly responsible. Global warming and ozone-depletion cry out for ambitious forms of transnational cooperation and regulation, and the refusal by the rich democracies to accept this necessity implies a failure to take the process of globalization seriously when doing so conflicts with their immediate material interests. Although it might initially seem to be illustrative of clever *Realpolitik* on the part of the culpable nations to ward off strict cross-border environmental regulation, their stubbornness is probably short-sighted: global warming and ozone depletion will affect the children of Americans who drive gas-guzzling SUVs or use environmentally unsound air-conditioning as well as the future generations of South Africa or Afghanistan (Cerutti 2007)[^cerutti-2007]. If we keep in mind that environmental degradation probably impacts negatively on democratic politics (for example, by undermining its legitimacy and stability), the failure to pursue effective transnational environmental regulation potentially undermines democracy at home as well as abroad.
    step1: |-
      例如，声称分配正义问题在对外事务的决策中没有地位，往好里说是对经济全球化的经验性幼稚。往坏里说，这是一种不诚实的拒绝，不肯正视一个事实：有幸生活在富国者的物质生存，与居住在贫穷不发达地区的绝大多数人类的物质状况不可分割。经济全球化催生的物质不平等加剧，与富裕民主国家国内物质不平等的加剧相联系（Falk 1999; Pogge 2002）[^falk-1999][^pogge-2002]。同样，在全球变暖与臭氧层破坏的背景下，教条地坚持国家主权的神圣，风险在于充当一块厚颜的遮羞叶，替那些影响远远超出最直接责任国边界的不负责任活动遮羞。全球变暖与臭氧耗竭亟需宏大的跨国合作与规制形式；富裕民主国家拒绝承认这一必要，意味着当此事与其眼前物质利益冲突时，它们未能认真对待全球化进程。受责国家挡开严格的跨境环境规制，起初看来像是聪明的 *Realpolitik*，但其固执大概是短视的：全球变暖与臭氧耗竭将影响开高油耗 SUV、用对环境不友善空调的美国人的孩子，也同样影响南非或阿富汗的后代（Cerutti 2007）[^cerutti-2007]。若我们记住环境退化大概会对民主政治产生负面影响（例如侵蚀其正当性与稳定性），那么未能追求有效的跨国环境规制，就可能同时损害国内与国外的民主。
