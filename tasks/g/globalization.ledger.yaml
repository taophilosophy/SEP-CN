      Globalization poses a fundamental challenge to each of these traditional assumptions. It is no longer self-evident that nation-states can be described as “self-sufficient schemes of cooperation for all the essential purposes of human life” in the context of intense deterritorialization and the spread and intensification of social relations across borders. The idea of a bounded community seems suspect given recent shifts in the spatio-temporal contours of human life. Even the most powerful and privileged political units are now subject to increasingly deterritorialized activities (for example, global financial markets or digitalized mass communication) over which they have limited control, and they find themselves nested in webs of social relations whose scope explodes the confines of national borders. Of course, in much of human history social relations have transcended existing political divides. However, globalization implies a profound quantitative increase in and intensification of social relations of this type. While attempts to offer a clear delineation of the “domestic” from the “foreign” probably made sense at an earlier juncture in history, this distinction no longer accords with core developmental trends in many arenas of social activity. As the possibility of a clear division between domestic and foreign affairs dissipates, the traditional tendency to picture the domestic arena as a privileged site for the realization of normative ideals and principles becomes problematic as well. As an empirical matter, the decay of the domestic-foreign frontier seems highly ambivalent, since it might easily pave the way for the decay of the more attractive attributes of domestic political life: as “foreign” affairs collapse inward onto “domestic” political life, the insufficiently lawful contours of the former make disturbing inroads onto the latter (Scheuerman 2004)[^scheuerman-2004]. As a normative matter, however, the disintegration of the domestic-foreign divide probably calls for us to consider, to a greater extent than ever before, how our fundamental normative commitments about political life can be effectively achieved on a global scale. If we take the principles of justice or democracy seriously, for example, it is no longer self-evident that the domestic arena is the exclusive or perhaps even main site for their pursuit, since domestic and foreign affairs are now deeply and irrevocably intermeshed. In a globalizing world, the lack of democracy or justice in the global setting necessarily impacts deeply on the pursuit of justice or democracy at home. Indeed, it may no longer be possible to achieve our normative ideals at home without undertaking to do so transnationally as well.
    step1: |-
      全球化对上述每一项传统假定都构成根本挑战。在强烈的去地域化与跨境社会关系扩散、强化之际，说民族国家是“为人类生活一切根本目的的自治自足的合作方案”，已不再自明。鉴于人类生活时空轮廓的晚近变动，有界共同体的想法显得可疑。就连最强大、最享有特权的政治单位，如今也须面对去地域化程度日增、自己掌控有限的活动（例如全球金融市场或数字化大众传播），并发现自己嵌在社会关系之网中，而这些关系的范围炸开了国界。当然，在人类历史的大部分时间里，社会关系一直超越既有政治分界。但全球化意味着这类社会关系在量上的深刻增长与强化。清楚划出“国内”与“对外”的尝试，在历史更早的节点上大概合理；这一区分如今已不合于许多社会活动领域的核心发展趋向。随着国内事务与对外事务清楚二分的可能趋于消散，把国内舞台描绘成实现规范理想与原则的特权场所这一传统倾向，也变得成问题。就经验而言，国内—对外边界的衰退似乎高度暧昧，因为它很容易为国内政治生活中较可取的属性之衰退铺路：当“对外”事务向内坍缩到“国内”政治生活上，前者法治不足的轮廓就会令人不安地侵入后者（Scheuerman 2004）[^scheuerman-2004]。然而就规范而言，国内—对外区分的瓦解大概要求我们比以往任何时候都更多考虑：我们对政治生活的根本规范承诺，如何能在全球范围有效实现。例如，若我们认真对待正义或民主原则，国内舞台是追求它们的唯一、甚至主要场所，已不再自明，因为国内与对外事务现已深深、不可逆地交织。在日益全球化的世界里，全球层面的民主或正义缺失，必然深深影响对国内正义或民主的追求。实际上，不在跨国层面同时着手，或许已不可能在家园实现我们的规范理想。
