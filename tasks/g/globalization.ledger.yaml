      Ongoing political developments suggest that such debates are of more than narrow scholarly interest. Until recently, some of globalization’s key prongs seemed destined to transform human affairs in seemingly permanent ways: economic globalization, as well as the growth of a panoply of international and global political and legal institutions, continued to transpire at a rapid rate. Such institutional developments, it should be noted, were interpreted by some cosmopolitan theorists as broadly corroborating their overall normative aspirations. With the resurgence of nationalist and populist political movements, many of which diffusely (and sometimes misleadingly) target elements of globalization, globalization’s future prospects seem increasingly uncertain. For example, with powerful political leaders regularly making disdainful remarks about the UN and EU, it seems unclear whether one of globalization’s most striking features, i.e., enhanced political and legal decision-making “beyond the nation state,” will continue unabated. Tragically perhaps, the failure to manage economic globalization so as to minimize avoidable inequalities and injustices has opened the door to a nationalist and populist backlash, with many people now ready to embrace politicians and movements promising to push back against “free trade,” relatively porous borders (for migrants and refugees), and other manifestations of globalization (Stiglitz 2018)[^stiglitz-2018]. Even if it seems unlikely that nationalists or populists can succeed in fully halting, let alone reversing, structural trends towards deterritorialization, intensified interconnectedness, and social acceleration, they may manage to reshape them in ways that cosmopolitans are likely to find alarming. Whether or not nationalists and populists can successfully respond to many fundamental global challenges (e.g., climate change or nuclear proliferation), however, remains far less likely.
    step1: |-
      持续的政治发展表明，这类辩论不止有狭窄的学术意义。直到不久以前，全球化的几条关键分支似乎注定要以看似永久的方式改变人类事务：经济全球化，以及一整套国际与全球政治法律制度的增长，持续以快速进行。应当注意，这些制度发展曾被一些世界主义理论家解读为大体印证了他们的整体规范愿景。随着民族主义与民粹主义政治运动复兴——其中许多笼统地（有时误导性地）把矛头指向全球化的要素——全球化的未来前景似乎越来越不确定。例如，手握重权的政治领袖经常对联合国与欧盟出言轻蔑，全球化最引人注目的特征之一，即“超越民族国家”的强化政治法律决策，是否还能持续下去，似乎并不清楚。或许可悲的是，未能管好经济全球化以尽量减少可避免的不平等与不义，为民族主义与民粹主义的反弹开了门；如今许多人乐于拥戴那些许诺抵制“自由贸易”、相对宽松的边界（对移民与难民）以及其他全球化表现的政客与运动（Stiglitz 2018）[^stiglitz-2018]。即便民族主义者或民粹主义者不大可能完全止住、更不用说逆转去地域化、互联性强化与社会加速的结构性趋势，他们或许仍能以世界主义者大概会感到警觉的方式重塑这些趋势。然而，他们能否成功应对许多根本的全球挑战（例如气候变化或核扩散），可能性要小得多。
