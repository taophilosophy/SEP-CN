      关于全球层面民主制度前景的持续辩论，也呈现类似的分野。世界主义一方的 Daniele Archibugi（2008）与已故的 David Held（1995）主张，全球化要求把自由民主制度（包括法治与民选代议机构）扩展到跨国层面。以民族国家为基的自由民主，无力应对当今全球化的有害副作用，如臭氧耗竭或日益膨胀的物质不平等；此外，越来越多的真正跨国活动形式，也呼唤相应的跨国自由民主决策模式。按此模型，“地方”或“国家”事务应仍归现有自由民主制度管辖；但在去地域化与跨国互联性特别突出的领域，要确保人民主权仍是一项有效原则，就须设立新的跨国制度（例如跨境公投），并大幅加强、进一步民主化现有的超国家权威形式（尤其是联合国）。同一精神下，世界主义者还辩论：一个松散的全球“治理”体系是否足够，还是世界主义理想要求某种类似全球“政府”或国家的东西（Cabrera 2011; Scheuerman 2014）[^cabrera-2011][^scheuerman-2014]。著名世界主义倾向理论家 Jürgen Habermas 试图为欧盟辩护，把它设想为通向超国家民主的关键垫脚石。在一个民族国家民主衰败、民主因而脆弱的世界里，欧盟若要帮助挽救人民主权原则，就须加强民选代议机关，并更好地保障全体欧洲人的公民、政治、社会与经济权利（Habermas 2001, 58–113; 2009）[^habermas-2001]。欧盟代表一种新型后民族宪制主义，对那些希望在新全球条件下保住民主宪制的人，它可能提供更广泛的教训。尽管民族主义与民粹主义运动对欧盟构成严峻威胁，Habermas 与其他世界主义倾向的知识分子仍相信，欧盟能够有效改革并保存下来（Habermas 2012）[^habermas-2012]。
