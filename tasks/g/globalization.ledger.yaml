      Western political theory has traditionally presupposed the existence of territorially bound communities, whose borders can be more or less neatly delineated from those of other communities. In this vein, the influential liberal political philosopher John Rawls described bounded communities whose fundamental structure consisted of “self-sufficient schemes of cooperation for all the essential purposes of human life” (Rawls 1993, 301)[^rawls-1993]. Although political and legal thinkers historically have exerted substantial energy in formulating defensible normative models of relations between states (Nardin and Mapel 1992)[^nardin-1992], like Rawls they typically have relied on a clear delineation of “domestic” from “foreign” affairs. In addition, they have often argued that the domestic arena represents a normatively privileged site, since fundamental normative ideals and principles (for example, liberty or justice) are more likely to be successfully realized in the domestic arena than in relations among states. According to one influential strand within international relations theory, relations between states are more-or-less lawless. Since the achievement of justice or democracy, for example, presupposes an effective political sovereign, the lacuna of sovereignty at the global level means that justice and democracy are necessarily incomplete and probably unattainable there. In this conventional realist view of international politics, core features of the modern system of sovereign states relegate the pursuit of western political thought’s most noble normative goals primarily to the domestic arena (Mearsheimer 2003.)[^mearsheimer-2003] Significantly, some prominent mid-century proponents of international realism rejected this position’s deep hostility to international law and supranational political organization, in part because they presciently confronted challenges that we now typically associate with intensified globalization (Scheuerman 2011)[^scheuerman-2011].
    step1: |-
      西方政治理论传统上预设存在领土界限内的共同体，其边界可以或多或少干净地与其他共同体的边界分开。有影响的自由主义政治哲学家 John Rawls 就这样描绘有界共同体：其基本结构由“为人类生活一切根本目的的自治自足的合作方案”构成（Rawls 1993, 301）[^rawls-1993]。尽管政治与法律思想家历来为阐发可辩护的国家间关系规范模型投入了大量精力（Nardin and Mapel 1992）[^nardin-1992]，他们像 Rawls 一样，通常依赖“国内”事务与“对外”事务之间的清晰分界。此外，他们常主张国内舞台在规范上享有优先，因为根本的规范理想与原则（例如自由或正义）更可能在国内舞台而非国家间关系中得到成功实现。按国际关系理论中一个有影响的支派，国家间关系或多或少无法无天。既然实现正义或民主例如以有效的政治主权为前提，全球层面主权的缺位就意味着正义与民主在那里必然不完整，且大概不可企及。在这种惯常的国际政治现实主义观点中，主权国家体系的核心特征把西方政治思想最崇高的规范目标主要降格到国内舞台（Mearsheimer 2003.）[^mearsheimer-2003] 值得注意的是，二十世纪中叶一些著名的国际现实主义倡导者拒绝这一立场对国际法与超国家政治组织的深切敌意，部分是因为他们富有预见地面对了我们今天通常与强化全球化相联系的挑战（Scheuerman 2011）[^scheuerman-2011]。
