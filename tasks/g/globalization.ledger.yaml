      Fifth, globalization should be understood as a *multi-pronged* process, since deterritorialization, social interconnectedness, and acceleration manifest themselves in many different (economic, political, and cultural) arenas of social activity. Although each facet of globalization is linked to the core components of globalization described above, each consists of a complex and relatively autonomous series of empirical developments, requiring careful examination in order to disclose the causal mechanisms specific to it (Held, McGrew, Goldblatt & Perraton 1999). Each manifestation of globalization also generates distinct conflicts and dislocations. For example, there is substantial empirical evidence that cross-border flows and exchanges (of goods, people, information, etc.), as well as the emergence of directly transnational forms of production by means of which a single commodity is manufactured simultaneously in distant corners of the globe, are gaining in prominence (Castells 1996)[^castells-1996]. High-speed technologies and organizational approaches are employed by transnationally operating firms, the so-called “global players,” with great effectiveness. The emergence of “around-the-world, around-the-clock” financial markets, where major cross-border financial transactions are made in cyberspace at the blink of an eye, represents a familiar example of the economic face of globalization. Global financial markets also challenge traditional attempts by liberal democratic nation-states to rein in the activities of bankers, spawning understandable anxieties about the growing power and influence of financial markets over democratically elected representative institutions. In political life, globalization takes a distinct form, though the general trends towards deterritorialization, interconnectedness across borders, and the acceleration of social activity are fundamental here as well. Transnational movements, in which activists employ rapid-fire communication technologies to join forces across borders in combating ills that seem correspondingly transnational in scope (for example, the depletion of the ozone layer), offer an example of political globalization (Tarrow 2005)[^tarrow-2005]. Another would be the tendency towards ambitious supranational forms of social and economic lawmaking and regulation, where individual nation-states cooperate to pursue regulation whose jurisdiction transcends national borders no less than the cross-border economic processes that undermine traditional modes of nation state-based regulation. Political scientists typically describe such supranational organizations (the European Union, for example, or United States-Mexico-Canada Agreement, or USMCA) as important manifestations of political and legal globalization. The proliferation of supranational organizations has been no less conflict-laden than economic globalization, however. Critics insist that local, regional, and national forms of self-government are being supplanted by insufficiently democratic forms of global governance remote from the needs of ordinary citizens (Maus 2006; Streeck 2016)[^maus-2006][^streeck-2016]. In contrast, defenders describe new forms of supranational legal and political decision as indispensable forerunners to more inclusive and advanced forms of self-government, even as they worry about existing democratic deficits and technocratic traits (Habermas 2015)[^habermas-2015].
    step1: |-
      第五，全球化应被理解为一个 *多管齐下* 的过程，因为去地域化、社会互联性与加速会在许多不同（经济、政治与文化的）社会活动领域中显现。全球化的每一面虽都与上述全球化的核心成分相连，每一面又各由一系列复杂而相对自主的经验发展构成，须细加考察，方能揭示其特有的因果机制（Held, McGrew, Goldblatt & Perraton 1999）。全球化的每一种表现也各生冲突与错位。例如，有大量经验证据表明，跨边界的流动与交换（商品、人员、信息等等）日益突出，同时出现了直接的跨国生产形式，一件商品得以在地球各个遥远角落同时制造（Castells 1996）[^castells-1996]。跨国经营的公司，即所谓“全球玩家”，极有效地运用高速技术与组织方式。“全天候、环球”金融市场的出现是一例——重大跨境金融交易在赛博空间中眨眼间完成，这是全球化经济面貌的常见例子。全球金融市场也挑战自由民主民族国家约束银行家活动的传统努力，引发可以理解的焦虑：金融市场对民主选出的代议机构的权力与影响日增。在政治生活中，全球化有独特形态，尽管去地域化、跨国互联性与社会活动加速的总体趋势在这里同样是根本的。跨国运动便是一例：活动者借助快节奏通讯技术跨边界联手，对抗看来同样跨国的问题（例如臭氧层耗竭），这是政治全球化的例子（Tarrow 2005）[^tarrow-2005]。另一例是倾向宏大的超国家社会与经济立法与规制形式：单个民族国家合作推行管辖范围超出国界的规制，其越界程度不亚于那些侵蚀传统民族国家规制模式的跨境经济过程。政治学家通常把这类超国家组织（如欧盟，或《美国—墨西哥—加拿大协定》，即 USMCA）描述为政治与法律全球化的重要表现。然而，超国家组织的扩散与经济的全球化一样充满冲突。批评者坚称，地方、区域与国家的自治形式正被民主成分不足、远离普通公民需要的全球治理形式取代（Maus 2006; Streeck 2016）[^maus-2006][^streeck-2016]。辩护者则把新的超国家法律与政治决策说成更包容、更先进的自治形式不可或缺的先驱，同时又为现有的民主赤字与技术官僚特征担忧（Habermas 2015）[^habermas-2015]。
    step2: |-
