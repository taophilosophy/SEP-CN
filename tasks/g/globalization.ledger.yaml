      第二，理论家把全球化视为与跨越既有地理、政治边界的社会 **互联性** 一道增长。在此观点下，去地域化是全球化关键的一面，但只盯住它就会看偏。既然绝大多数人类活动仍系于具体地理位置，全球化更具决定性的方面，是远方事件与力量如何作用于本地与区域的努力（Tomlinson 1999, 9）[^tomlinson-1999]。比如，本百科全书或可算一个去地域化的社会空间：它让观念在赛博空间里交换，唯一的门槛是能上网。上网机会当然仍很不平等，但使用本百科全书在原则上与任何具体地点无关。然而，读者很可能是在拿本百科全书补充学校或大学的课程。那所学校不只坐落在某个具体地理节点，其位置对理解它的许多关键属性大概也必不可少：拨款水平可能因大学所在州或地区而不同；同一个专业，在中国、阿根廷或挪威的大学里，要求的课程与书目就可能不同。全球化指这样一些过程：地理上遥远的事件与决定，日益深刻地作用于“本地”的大学生活。例如，富国政要执意要国际货币基金组织（IMF）或世界银行向拉美与南美国家建议，让它们承诺施行某一套经济政策；结果也许是圣保罗或利马的教师与研究人员薪水微薄，课堂大而师资不足。印度某计算机实验室在信息技术上的一项新发明，也可能很快改变不列颠哥伦比亚或东京学生的课堂体验。全球化指“这样一些变迁过程：它们跨越区域与大陆，把人类活动联结并扩展，从而支撑人类事务组织的转变”（Held, McGrew, Goldblatt, and Perraton 1999, 15）。这个意义上的全球化是个程度问题：任何一项社会活动对远方事件的影响都可大可小。尽管越来越多的活动似乎与远方大陆的事件交织在一起，某些人类活动仍主要限于本地或区域；活动的量级与影响也有分别，地理上疏远的事件对某一地方的影响或极小，或极广。最后还须考虑：跨疆界的互联性在多大程度上不再只是偶发，而已变得可预测、常规化（Held, McGrew, Goldblatt & Perraton 1999）。
