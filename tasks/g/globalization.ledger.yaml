      In opposition to Archibugi, Held, Habermas, and other cosmopolitans, skeptics underscore the purportedly utopian character of such proposals, arguing that democratic politics presupposes deep feelings of trust, commitment, and belonging that remain uncommon at the postnational and global levels. Largely non-voluntary commonalities of belief, history, and custom compose necessary preconditions of any viable democracy, and since these commonalities are missing beyond the sphere of the nation-state, global or cosmopolitan democracy is doomed to fail (Archibugi, Held, and Koehler 1998; Lieven 2020)[^lieven-2020]. Critics inspired by realist international theory argue that cosmopolitanism obscures the fundamentally pluralistic, dynamic, and conflictual nature of political life on our divided planet. Notwithstanding its pacific self-understanding, cosmopolitan democracy inadvertently opens the door to new and even more horrible forms of political violence. Cosmpolitanism’s universalistic normative discourse not only ignores the harsh and unavoidably agonistic character of political life, but it also tends to serve as a convenient ideological cloak for terrible wars waged by political blocs no less self-interested than the traditional nation state (Zolo 1997, 24)[^zolo-1997].
    step1: |-
      与 Archibugi、Held、Habermas 及其他世界主义者相对，怀疑者强调这类方案据说具有的乌托邦性质，论证民主政治以信任、承诺与归属的深切感受为前提，而这些感受在后民族与全球层面仍属罕见。信仰、历史与习俗上大体非自愿的共同性，构成任何可行民主的必要前提；既然这些共同性在民族国家领域之外阙如，全球或世界主义民主就注定失败（Archibugi, Held, and Koehler 1998; Lieven 2020）[^lieven-2020]。受现实主义国际理论启发的批评者论证，世界主义掩盖了我们这个分裂行星上政治生活根本多元、动态而冲突的性质。世界主义民主尽管自视为和平的，却无意中为新的、甚至更可怕的政治暴力形式开了门。世界主义的普遍主义规范话语不仅无视政治生活严酷而不可回避的争胜性质，还往往充当一块方便的意识形态遮羞布，替政治集团发动的可怕战争遮掩——这些集团的自利程度不亚于传统的民族国家（Zolo 1997, 24）[^zolo-1997]。
    step2: |-
      与 Archibugi、Held、Habermas 及其他世界主义者相对，怀疑者强调这类方案据说带有的乌托邦色彩：民主政治以信任、承诺与归属的深切感受为前提，而这些感受在后民族与全球层面仍属罕见。信仰、历史与习俗上大体非自愿的共同性，是任何可行民主的必要前提；这些共同性在民族国家之外阙如，全球或世界主义民主便注定失败（Archibugi, Held, and Koehler 1998; Lieven 2020）[^lieven-2020]。受现实主义国际理论启发的批评者则说，世界主义掩盖了我们这个分裂行星上政治生活根本多元、动态而冲突的性质。世界主义民主尽管自视为和平，却无意中为新的、乃至更可怕的政治暴力形式开了门。它的普遍主义规范话语既无视政治生活严酷而不可回避的争胜性质，又往往充当方便的意识形态遮羞布，替政治集团发动的可怕战争遮掩——这些集团的自利程度不亚于传统民族国家（Zolo 1997, 24）[^zolo-1997]。
