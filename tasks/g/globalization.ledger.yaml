      Fourth, even though analysts disagree about the causal forces that generate globalization, most agree that globalization should be conceived as a relatively *long-term process*. The triad of deterritorialization, interconnectedness, and social acceleration hardly represents a sudden or recent event in contemporary social life. Globalization is a constitutive feature of the modern world, and modern history includes many examples of globalization (Giddens 1990)[^giddens-1990]. As we saw above, nineteenth-century thinkers captured at least some of its core features; the compression of territoriality composed an important element of their lived experience. Nonetheless, some contemporary theorists believe that globalization has taken a particularly intense form in recent decades, as innovations in communication, transportation, and information technologies (for example, computerization) have generated stunning new possibilities for simultaneity and instantaneousness (Harvey 1989)[^harvey-1989]. In this view, present-day intellectual interest in the problem of globalization can be linked directly to the emergence of new high-speed technologies that tend to minimize the significance of distance and heighten possibilities for deterritorialization and social interconnectedness. Although the intense sense of territorial compression experienced by so many of our contemporaries is surely reminiscent of the experiences of earlier generations, some contemporary writers nonetheless argue that it would be mistaken to obscure the countless ways in which ongoing transformations of the spatial and temporal contours of human experience are especially far-reaching. While our nineteenth-century predecessors understandably marveled at the railroad or the telegraph, a comparatively vast array of social activities is now being transformed by innovations that accelerate social activity and considerably deepen longstanding trends towards deterritorialization and social interconnectedness. To be sure, the impact of deterritorialization, social interconnectedness, and social acceleration are by no means universal or uniform: migrant workers engaging in traditional forms of low-wage agricultural labor in the fields of southern California, for example, probably operate in a different spatial and temporal context than the Internet entrepreneurs of San Francisco or Seattle. Distinct assumptions about space and time often coexist uneasily during a specific historical juncture (Gurvitch 1964). Nonetheless, the impact of recent technological innovations is profound, and even those who do not have a job directly affected by the new technology are shaped by it in innumerable ways as citizens and consumers (Eriksen 2001, 16)[^eriksen-2001].
    step1: |-
      第四，尽管分析者对造成全球化的因果力量意见不一，多数人同意，全球化应被设想为一个相对 *长期的过程*。去地域化、互联性与社会加速这三者，几乎不是当代社会生活中突然或晚近的事件。全球化是现代世界的构成性特征，现代史包含许多全球化的例子（Giddens 1990）[^giddens-1990]。如上文所见，十九世纪的思想家已捕捉到它的至少一些核心特征；领土性的压缩构成他们切身经验的重要成分。尽管如此，一些当代理论家认为，近几十年来全球化采取了特别强烈的形式，因为通讯、交通与信息技术（例如计算机化）的创新造成了惊人的新的共时性与瞬时之可能（Harvey 1989）[^harvey-1989]。在此观点下，当今思想界对全球化问题的兴趣可直接与新的高速技术的兴起相联系——这类技术倾向于把距离的重要性降到最低，并提高去地域化与社会互联性的可能。虽然如此众多的同代人所体验到的强烈领土压缩感，无疑令人想起前几代人的经验，一些当代论者仍主张：抹杀人类经验时空轮廓正在进行的转变特别深远这一千端万绪，是错误的。我们的十九世纪前辈为铁路或电报惊叹，可以理解；而今天，相当广泛的社会活动正被各种创新所改变，这些创新加速社会活动，并大大加深由来已久的去地域化与社会互联性趋势。诚然，去地域化、社会互联性与社会加速的影响绝非普遍或齐一：比方说，在南加州田地里从事传统低薪农业劳动的移民工人，所处的时空情境大概与旧金山或西雅图的互联网创业者不同。关于空间与时间的种种不同假定，常在一个特定历史节点上不安地共存（Gurvitch 1964）。尽管如此，晚近技术创新的影响是深刻的；就连工作不直接受新技术影响的人，也作为公民与消费者以无数方式被它塑造（Eriksen 2001, 16）[^eriksen-2001]。
    step2: |-
      第四，分析者对造成全球化的因果力量虽意见不一，多数人却同意：全球化应视为一个相对 **长期的过程**。去地域化、互联性、社会加速这三者，绝非当代社会生活中骤然而起的新事。全球化是现代世界的构成性特征，现代史里全球化之例屡见不鲜（Giddens 1990）[^giddens-1990]。如前所见，十九世纪思想家已抓住它的若干核心特征；领土上的压缩感是他们切身经验的重要成分。不过，一些当代理论家认为，近几十年来全球化取了一种格外激烈的形式：通讯、交通与信息技术（如计算机化）的创新，造出惊人的共时与瞬时之可能（Harvey 1989）[^harvey-1989]。照此看法，今天思想界对全球化问题的兴趣，可直接系于新高速技术的兴起——这类技术倾向于把距离的意义压到最低，抬高去地域化与社会互联性的可能。众多同代人所感到的强烈领土压缩，固然让人想起前几代人的经验，但一些当代论者仍主张：无视人类经验时空轮廓的当下转变何其深远，是错的。十九世纪前辈为铁路、电报惊叹，可以理解；今天，相当广泛的社会活动正被加速社会活动的创新所改变，去地域化与社会互联性的旧趋势也随之大大加深。诚然，这些影响绝非普遍、齐一：在南加州田里干传统低薪农活的移民工人，所处时空情境大概就与旧金山或西雅图的互联网创业者不同。关于空间与时间的种种假定，常在一个特定历史节点上不安地并存（Gurvitch 1964）。尽管如此，晚近技术创新的影响是深刻的；即便工作不直接受新技术影响，人也作为公民与消费者，以无数方式被它塑造（Eriksen 2001, 16）[^eriksen-2001]。
