      The unabated proliferation of high-speed technologies is probably the main source of the numerous references in intellectual life since 1950 to the annihilation of distance. The Canadian cultural critic Marshall McLuhan made the theme of a technologically based “global village,” generated by social “acceleration at all levels of human organization,” the centerpiece of an anxiety-ridden analysis of new media technologies in the 1960s (McLuhan 1964, 103)[^mcluhan-1964]. Arguing in the 1970s and 1980s that recent shifts in the spatial and temporal contours of social life exacerbated authoritarian political trends, the French social critic Paul Virilio seemed to confirm many of Dewey’s darkest worries about the decay of democracy. According to his analysis, the high-speed imperatives of modern warfare and weapons systems strengthened the executive and debilitated representative legislatures. The compression of territory thereby paved the way for executive-centered emergency government (Virilio 1977)[^virilio-1977]. But it was probably the German philosopher Martin Heidegger who most clearly anticipated contemporary debates about globalization. Heidegger not only described the “abolition of distance” as a constitutive feature of our contemporary condition, but he linked recent shifts in spatial experience to no less fundamental alterations in the temporality of human activity: “All distances in time and space are shrinking. Man now reaches overnight, by places, places which formerly took weeks and months of travel” (Heidegger 1950, 165)[^heidegger-1950]. Heidegger also accurately prophesied that new communication and information technologies would soon spawn novel possibilities for dramatically extending the scope of *virtual reality*: “Distant sites of the most ancient cultures are shown on film as if they stood this very moment amidst today’s street traffic…The peak of this abolition of every possibility of remoteness is reached by television, which will soon pervade and dominate the whole machinery of communication” (Heidegger 1950, 165)[^heidegger-1950]. Heidegger’s description of growing possibilities for simultaneity and instantaneousness in human experience ultimately proved no less apprehensive than the views of many of his predecessors. In his analysis, the compression of space increasingly meant that from the perspective of human experience “everything is equally far and equally near.” Instead of opening up new possibilities for rich and multi-faceted interaction with events once distant from the purview of most individuals, the abolition of distance tended to generate a “uniform distanceless” in which fundamentally distinct objects became part of a bland homogeneous experiential mass (Heidegger 1950, 166)[^heidegger-1950]. The loss of any meaningful distinction between “nearness” and “distance” contributed to a leveling down of human experience, which in turn spawned an indifference that rendered human experience monotonous and one-dimensional.
    step1: |-
      高速技术的持续扩散，大概是 1950 年以来思想生活中大量提及距离湮灭的主要来源。加拿大文化批评家马歇尔·麦克卢汉（Marshall McLuhan）把由社会“在人类组织各个层面上的加速”所生成的技术性“地球村”这一主题，置于他在 1960 年代对新媒体技术那充满焦虑的分析的中心（McLuhan 1964, 103）[^mcluhan-1964]。法国社会批评家保罗·维利里奥（Paul Virilio）在 1970 与 1980 年代论证说，晚近社会生活时空轮廓的转变加剧了威权主义政治趋势；他似乎证实了杜威关于民主衰败的许多最阴暗的忧虑。按其分析，现代战争与武器系统的高速律令强化了行政权，削弱了代议制立法机构。领土的压缩由此为以行政为中心的紧急状态政府铺平了道路（Virilio 1977）[^virilio-1977]。但最清楚地预见到当代全球化辩论的，大概是德国哲学家马丁·海德格尔（Martin Heidegger）。海德格尔不仅把“距离的消除”描述为我们当代处境的一个构成性特征，还把空间体验的晚近转变与人类活动时间性中同样根本的变化联系起来：“时空中的一切距离都在缩短。人如今一夜之间便抵达那些从前需要数周或数月旅行的地方”（Heidegger 1950, 165）[^heidegger-1950]。海德格尔还准确地预言，新的通讯与信息技术不久将催生种种新可能，极大扩展 **虚拟现实** 的范围：“最古老文化的遥远遗址被放映在胶片上，仿佛此刻就矗立在今日的街道车流之中……这种对一切遥远之可能性的消除，其顶峰由电视达到，电视不久将渗透并支配整个通讯机器”（Heidegger 1950, 165）[^heidegger-1950]。海德格尔对人类经验中日益增长的共时性与瞬时性之可能的描述，最终表明并不比他的许多前辈的看法更少忧惧。按他的分析，空间的压缩日益意味着，从人类经验的角度看，“一切都同样远，也同样近”。距离的消除并未开启与那些一度远离多数人视野的事件进行丰富而多面互动的新可能，反而倾向于生成一种“齐一的无距离性”，使根本不同的对象成为平淡而同质的经验团块的一部分（Heidegger 1950, 166）[^heidegger-1950]。“近”与“远”之间任何有意义的区分一旦丧失，便促成了人类经验的拉平，而这又催生一种冷漠，使人类经验变得单调而单向度。
    step2: |-
      高速技术的不断扩散，大概是 1950 年以来思想界反复谈论距离湮灭的主要缘由。加拿大文化批评家马歇尔·麦克卢汉（Marshall McLuhan）以技术性的“地球村”为主题，而地球村又由社会“在人类组织各层面的加速”催生；他把这一主题放在 1960 年代对新媒体技术那充满焦虑的分析的核心（McLuhan 1964, 103）[^mcluhan-1964]。法国社会批评家保罗·维利里奥（Paul Virilio）在 1970 至 1980 年代论证：晚近社会生活时空轮廓的变动加剧了威权主义政治趋势。他的说法似乎印证了杜威对民主衰败的许多最阴暗的担忧。照他的分析，现代战争与武器系统的高速律令加强了行政权，削弱了代议制立法机关；领土压缩由此为以行政为中心的紧急状态政府铺了路（Virilio 1977）[^virilio-1977]。不过，最清楚预示了当代全球化辩论的，恐怕还是德国哲学家马丁·海德格尔（Martin Heidegger）。他不仅把“距离的消除”视为我们当代处境的构成性特征，还把空间体验的晚近变动与人类活动时间性中同样根本的变化联系在一起：“时空中的一切距离都在收缩。从前要走上数周数月的地方，如今人一夜之间就到了”（Heidegger 1950, 165）[^heidegger-1950]。他还准确预言，新的通讯与信息技术不久便会开辟新途径，大大扩展 **虚拟现实** 的疆域：“最古老文化的遥远遗址被拍成电影，仿佛此刻正立于今日的街道车流之中……电视把这种对一切遥远之可能性的消除推向顶峰，而不久之后，电视将渗透并支配整个通讯机器”（Heidegger 1950, 165）[^heidegger-1950]。海德格尔对人类经验中与日俱增的共时性与瞬时性的描述，终究与他的许多前辈一样忧心忡忡。在他看来，空间压缩日益意味着，从人类经验的角度说“一切都同样远，也同样近”。距离的消除不但没有让人与远方事件展开丰富而多面的互动，反倒造出一种“齐一的无距离性”，把本来判然有别的对象混成平淡而同质的经验团块（Heidegger 1950, 166）[^heidegger-1950]。“近”与“远”之间一旦失去有意义的分别，人类经验便随之被拉平，进而生出冷漠，使经验变得单调而单向度。
