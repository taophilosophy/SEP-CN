      第二，理论家把全球化设想为与跨越既有地理与政治边界的社会 **互联性** 的增长相联系。在此观点下，去地域化是全球化关键的一面。但只盯着它，会误导人。既然绝大多数人类活动仍系于具体地理位置，全球化更具决定性的方面在于远方事件与力量影响本地与区域努力的方式（Tomlinson 1999, 9）[^tomlinson-1999]。例如，本百科全书或可视为一个去地域化社会空间的例子，因为它让观念在赛博空间中交换。使用它的唯一前提是接入互联网。互联网接入的显著不平等仍存在，但使用本百科全书在原则上与任何特定地理位置无关。不过，读者很可能是在把本百科全书用作学校或大学所开课程的补充材料。那所学校不只位于某个具体地理节点，其位置对理解它的许多关键属性大概也必不可少：拨款水平可能随大学所在州或地区而不同；同一个专业，在中国的一所大学与在阿根廷或挪威的一所大学，所要求的课程与阅读书目也可能不同。全球化指这样一些过程：地理上遥远的事件与决定，日益深刻地影响“本地”的大学生活。例如，富国手握重权的政治领袖坚持国际货币基金组织（IMF）或世界银行向拉美与南美国家建议，要它们承诺施行某一套经济政策；这也许会造成圣保罗或利马教师与研究人员的低薪，以及大班额、缺师资的课堂。印度某计算机实验室在信息技术上的最新创新，也可能很快改变不列颠哥伦比亚或东京学生的课堂体验。全球化指“这样一些变迁过程：它们把人类活动跨越区域与大陆地联结并扩展，从而支撑人类事务组织的转变”（Held, McGrew, Goldblatt, and Perraton 1999, 15）。这个意义上的全球化是个程度问题，因为任何既定社会活动对远方事件的影响都可能或多或少：尽管越来越多的活动似乎与远方大陆的事件交织在一起，某些人类活动仍主要属本地或区域范围。活动的量级与影响也可能不同：地理上疏远的事件，对某一地方事件的影响或极小，或极广。最后，我们还可以考虑跨疆界互联性不再只是偶然、而变得可预测、常规化的程度（Held, McGrew, Goldblatt & Perraton 1999）。
