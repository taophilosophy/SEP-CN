      The wide-ranging impact of globalization on human existence means that it necessarily touches on many basic philosophical and political-theoretical questions. At a minimum, globalization suggests that academic philosophers in the rich countries of the West should pay closer attention to the neglected voices and intellectual traditions of peoples with whom our fate is intertwined in ever more intimate ways (Dallmayr 1998)[^dallmayr-1998]. In this section, however, we focus exclusively on the immediate challenges posed by globalization to normative political theory.
    step1: |-
      全球化对人类生存的广泛影响，意味着它必然触及许多基本的哲学与政治理论问题。至少，全球化提示西方富国的学院哲学家应更留意那些过去被忽视的声音与思想传统——我们与这些民族的命运正以越来越紧密的方式交织在一起（Dallmayr 1998）[^dallmayr-1998]。不过，本节只集中讨论全球化对规范政治理论构成的直接挑战。
    step2: |-
      全球化对人类生存的影响如此广泛，必然牵动许多基本的哲学与政治理论问题。它至少提示：西方富国的学院哲学家该更留意那些被忽视的声音与思想传统——我们与这些民族的命运正以越来越紧密的方式交织在一起（Dallmayr 1998）[^dallmayr-1998]。不过本节只集中讨论全球化给规范政治理论带来的直接挑战。
