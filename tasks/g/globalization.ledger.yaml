      Philosophers and political theorists have eagerly addressed the normative and political implications of our globalizing world. A lively debate about the possibility of achieving justice at the global level pits representatives of cosmopolitanism against myriad communitarians, nationalists, realists, and others who privilege the nation-state and moral, political, and social ties resting on it (Lieven 2020; Tamir 2019)[^lieven-2020][^tamir-2019]. In contrast, cosmopolitans tend to underscore our universal obligations to those who reside faraway and with whom we may share little in the way of language, custom, or culture, oftentimes arguing that claims to “justice at home” can and should be applied elsewhere as well (Beardsworth 2011; Beitz 1999; Caney 2006; Wallace-Brown & Held 2010)[^beardsworth-2011][^beitz-1999][^brown-2010][^wallace-brown-2010]. In this way, cosmopolitanism builds directly on the universalistic impulses of modern moral and political thought. Cosmopolitanism’s critics dispute the view that our obligations to foreigners possess the same status as those to members of particular local and national communities of which we remain very much a part. They by no means deny the need to redress global inequality, for example, but they often express skepticism in the face of cosmopolitanism’s tendency to defend significant legal and political reforms as necessary to address the inequities of a planet where millions of people a year die of starvation or curable diseases (Miller 2007; 2013; Nagel 2005)[^miller-2007][^nagel-2005]. Nor do cosmopolitanism’s critics necessarily deny that the process of globalization is real, though some of them suggest that its impact has been grossly exaggerated (Kymlicka 1999; Nussbaum *et al*. 1996; Streeck 2016)[^kymlicka-1999][^nussbaum-1996][^streeck-2016]. Nonetheless, they doubt that humanity has achieved a rich or sufficiently articulated sense of a common fate such that far-reaching attempts to achieve greater global justice (for example, substantial redistribution from the rich to poor) could prove successful. Cosmopolitans not only counter with a flurry of universalist and egalitarian moral arguments, but they also accuse their opponents of obscuring the threat posed by globalization to the particular forms of national community whose ethical primacy communitarians, nationalists, and others endorse. From the cosmopolitan perspective, the tendency to favor moral and political obligations to fellow members of the nation-state represents a misguided and increasingly reactionary nostalgia for a rapidly decaying constellation of political practices and institutions.
    step1: |-
      哲学家与政治理论家热切地处理我们这个日益全球化的世界的规范与政治意涵。一场关于在全球层面实现正义之可能的活跃辩论，把世界主义的代表与形形色色的社群主义者、民族主义者、现实主义者以及其他赋予民族国家及其道德、政治与社会纽带以优先地位的人对立起来（Lieven 2020; Tamir 2019）[^lieven-2020][^tamir-2019]。相形之下，世界主义者倾向于强调我们对远方者、对可能与我们在语言、习俗或文化上少有共同之处者的普遍义务，并常常主张“家园的正义”之诉求同样可以适用于别处（Beardsworth 2011; Beitz 1999; Caney 2006; Wallace-Brown & Held 2010）[^beardsworth-2011][^beitz-1999][^brown-2010][^wallace-brown-2010]。由此，世界主义直接建立在现代道德与政治思想的普遍主义冲动之上。世界主义的批评者质疑这一观点：我们对外国人的义务，与我们仍然深深隶属的特定地方与民族共同体成员所负的义务具有同等地位。例如，他们绝不否认纠正全球不平等的必要，但面对世界主义那种倾向——把重大法律与政治改革说成解决一个每年有数百万人死于饥饿或可治愈疾病的行星之不平等的必要之举——他们常表示怀疑（Miller 2007; 2013; Nagel 2005）[^miller-2007][^nagel-2005]。世界主义的批评者也未必否认全球化进程真实存在，尽管其中一些人认为其影响被严重夸大（Kymlicka 1999; Nussbaum *et al*. 1996; Streeck 2016）[^kymlicka-1999][^nussbaum-1996][^streeck-2016]。尽管如此，他们怀疑人类是否已形成一种丰富或充分表述的共同命运感，从而使实现更大全球正义的深远尝试（例如从富国向穷国的大规模再分配）能够成功。世界主义者不仅以一连串普遍主义、平等主义的道德论证回击，还指责对手掩盖全球化对民族共同体特定形式所构成的威胁——而社群主义者、民族主义者等正为这些形式的伦理优先性背书。从世界主义的视角看，偏袒民族国家同胞的道德与政治义务，是一种误入歧途、日趋反动的怀旧，所怀的是一套正迅速衰败的政治实践与制度。
