  - id: 4
    kind: body
    source: |-
      The term globalization has only become commonplace in the last three decades, and academic commentators who employed the term as late as the 1970s accurately recognized the novelty of doing so (Modelski 1972)[^modelski-1972]. At least since the advent of industrial capitalism, however, intellectual discourse has been replete with allusions to phenomena strikingly akin to those that have garnered the attention of recent theorists of globalization. Nineteenth and twentieth-century philosophy, literature, and social commentary include numerous references to an inchoate yet widely shared awareness that experiences of distance and space are inevitably transformed by the emergence of high-speed forms of transportation (for example, rail and air travel) and communication (the telegraph or telephone) that dramatically heighten possibilities for human interaction across existing geographical and political divides (Harvey 1989; Kern 1983)[^harvey-1989][^kern-1983]. Long before the introduction of the term globalization into recent popular and scholarly debate, the appearance of novel high-speed forms of social activity generated extensive commentary about the compression of space.
    step1: |-
      “全球化”一词直到最近三十年才变得习以为常，而迟至 1970 年代仍使用该词的学术评论者，也准确意识到这样做的新颖性（Modelski 1972）[^modelski-1972]。然而，至少自工业资本主义问世以来，思想话语中便充斥着对某些现象的提及，这些现象与晚近全球化理论家所关注者惊人地相似。十九与二十世纪的哲学、文学与社会评论中，大量提到一种尚属朦胧却广泛共享的意识：对距离与空间的体验，必然因高速交通运输（例如铁路与航空）与通讯（电报或电话）形式的出现而改变，这些形式极大地提高了跨越现有地理与政治鸿沟进行人类互动的可能性（Harvey 1989; Kern 1983）[^harvey-1989][^kern-1983]。远在“全球化”一词进入晚近的大众与学术辩论之前，新颖的高速社会活动形式的出现，就已引发关于空间压缩的大量评论。
    step2: |-
      “全球化”一词直到近三十年才成为常用语；迟至 1970 年代仍使用该词的学术评论者，也清楚地意识到这样用词的新鲜之处（Modelski 1972）[^modelski-1972]。不过，至少从工业资本主义兴起以来，思想话语中就不断出现对某些现象的提及，而这些现象与晚近全球化理论家关注的对象惊人相似。十九、二十世纪的哲学、文学与社会评论反复透露一种朦胧却普遍的自觉：高速交通（铁路、航空）与高速通讯（电报、电话）问世之后，跨越既有地理与政治鸿沟的人际互动可能性大增，人们对距离与空间的体验也必然为之改变（Harvey 1989; Kern 1983）[^harvey-1989][^kern-1983]。早在“全球化”一词进入大众与学界辩论之前，新式高速社会活动的出现就已引来大量关于空间压缩的评论。
  - id: 5
    kind: body
    source: |-
      Writing in 1839, an English journalist commented on the implications of rail travel by anxiously postulating that as distance was “annihilated, the surface of our country would, as it were, shrivel in size until it became not much bigger than one immense city” (Harvey 1996, 242)[^harvey-1996]. A few years later, Heinrich Heine, the émigré German-Jewish poet, captured this same experience when he noted: “space is killed by the railways. I feel as if the mountains and forests of all countries were advancing on Paris. Even now, I can smell the German linden trees; the North Sea’s breakers are rolling against my door” (Schivelbusch 1978, 34)[^schivelbusch-1978]. Another young German émigré, the socialist theorist Karl Marx, in 1848 formulated the first theoretical explanation of the sense of territorial compression that so fascinated his contemporaries. In Marx’s account, the imperatives of capitalist production inevitably drove the bourgeoisie to “nestle everywhere, settle everywhere, and establish connections everywhere.” The juggernaut of industrial capitalism constituted the most basic source of technologies resulting in the annihilation of space, helping to pave the way for “intercourse in every direction, universal interdependence of nations,” in contrast to a narrow-minded provincialism that had plagued humanity for untold eons (Marx 1848, 476)[^marx-1848]. Despite their ills as instruments of capitalist exploitation, Marx argued, new technologies that increased possibilities for human interaction across borders ultimately represented a progressive force in history. They provided the necessary infrastructure for a cosmopolitan future socialist civilization, while simultaneously functioning in the present as indispensable organizational tools for a working class destined to undertake a revolution no less oblivious to traditional territorial divisions than the system of capitalist exploitation it hoped to dismantle.
    step1: |-
      1839 年，一位英国记者评论铁路旅行的意涵，忧心忡忡地设想：随着距离被“湮灭”，我们国家的表面将仿佛缩小，直到比一座巨大的城市大不了多少（Harvey 1996, 242）[^harvey-1996]。几年之后，流亡的德国犹太诗人海因里希·海涅（Heinrich Heine）捕捉到同样的体验，他写道：“空间被铁路杀死了。我觉得所有国家的山峦与森林都在向巴黎逼近。此刻我就能闻到德国的椴树；北海的浪涛正拍打我的门”（Schivelbusch 1978, 34）[^schivelbusch-1978]。另一位年轻的德国流亡者、社会主义理论家卡尔·马克思（Karl Marx）在 1848 年首次对令其同代人如此着迷的领土压缩感作出理论解释。在马克思的叙述中，资本主义生产的律令不可避免地驱使资产阶级“到处落户，到处创业，到处建立联系”。工业资本主义这一庞然巨力构成了导致空间湮灭的技术的最根本来源，为“各个方向上的交往、各民族普遍的相互依赖”铺平道路，与长期折磨人类的狭隘地方主义形成对照（Marx 1848, 476）[^marx-1848]。马克思主张，尽管新技术作为资本主义剥削的工具弊端重重，它们毕竟扩大了跨越国界的人类互动的可能性，归根到底代表了历史上的进步力量。它们为未来的世界主义社会主义文明提供了必要的基础设施，同时在当下充当不可或缺的组织工具，服务于注定要从事一场革命的工人阶级——这场革命对传统领土划分的漠视，丝毫不亚于它意欲摧毁的资本主义剥削体系。
    step2: |-
      1839 年，一位英国记者评论铁路旅行的后果，他忧心忡忡地推断：距离既已“湮灭”，我们国家的表面就会仿佛萎缩，直到比一座巨大的城市大不了多少（Harvey 1996, 242）[^harvey-1996]。几年之后，流亡的德国犹太诗人海因里希·海涅（Heinrich Heine）写下了同样的体验：“空间被铁路杀死了。我仿佛觉得各国的山峦与森林都在向巴黎推进。此刻我还能闻到德国椴树的气息；北海的浪涛正拍打我的家门”（Schivelbusch 1978, 34）[^schivelbusch-1978]。又一位年轻的德国流亡者、社会主义理论家卡尔·马克思（Karl Marx），在 1848 年首次对那种令同代人着迷的领土压缩感作出了理论解释。按马克思的说法，资本主义生产的律令驱使资产阶级不可避免地“到处落户，到处创业，到处建立联系”。工业资本主义这台庞然巨力，正是带来空间湮灭的技术的最根本源头；它为“各个方向上的交往、各民族普遍的相互依赖”铺平道路，与长期困扰人类的狭隘地方主义恰成对照（Marx 1848, 476）[^marx-1848]。马克思主张，新技术作为资本主义剥削的工具固然弊端重重，却扩大了跨越国界的人际互动可能，归根到底是历史上的进步力量。它们为未来世界主义的社会主义文明准备了必要的基础设施，同时在此刻充当工人阶级不可缺少的组织工具；这个阶级注定要发起一场革命，而这场革命对传统领土划分的漠视，并不亚于它一心要拆毁的资本主义剥削体系。
  - id: 6
    kind: body
    source: |-
      European intellectuals have hardly been alone in their fascination with the experience of territorial compression, as evinced by the key role played by the same theme in early twentieth-century American thought. In 1904, the literary figure Henry Adams diagnosed the existence of a “law of acceleration,” fundamental to the workings of social development, in order to make sense of the rapidly changing spatial and temporal contours of human activity. Modern society could only be properly understood if the seemingly irrepressible acceleration of basic technological and social processes was given a central place in social and historical analysis (Adams 1931 [1904])[^adams-1931]. John Dewey argued in 1927 that recent economic and technological trends implied the emergence of a “new world” no less noteworthy than the opening up of America to European exploration and conquest in 1492. For Dewey, the invention of steam, electricity, and the telephone offered formidable challenges to relatively static and homogeneous forms of local community life that had long represented the main theatre for most human activity. Economic activity increasingly exploded the confines of local communities to a degree that would have stunned our historical predecessors, for example, while the steamship, railroad, automobile, and air travel considerably intensified rates of geographical mobility. Dewey went beyond previous discussions of the changing temporal and spatial contours of human activity, however, by suggesting that the compression of space posed fundamental questions for democracy. Dewey observed that small-scale political communities (for example, the New England township), a crucial site for the exercise of effective democratic participation, seemed ever more peripheral to the great issues of an interconnected world. Increasingly dense networks of social ties across borders rendered local forms of self-government ineffective. Dewey wondered, “How can a public be organized, we may ask, when literally it does not stay in place?” (Dewey 1927, 140)[^dewey-1927]. To the extent that democratic citizenship minimally presupposes the possibility of action in concert with others, how might citizenship be sustained in a social world subject to ever more astonishing possibilities for movement and mobility? New high-speed technologies attributed a shifting and unstable character to social life, as demonstrated by increased rates of change and turnover in many arenas of activity (most important perhaps, the economy) directly affected by them, and the relative fluidity and inconstancy of social relations there. If citizenship requires some modicum of constancy and stability in social life, however, did not recent changes in the temporal and spatial conditions of human activity bode poorly for political participation? How might citizens come together and act in concert when contemporary society’s “mania for motion and speed” made it difficult for them even to get acquainted with one another, let alone identify objects of common concern? (Dewey 1927, 140)[^dewey-1927].
    step1: |-
      欧洲知识分子绝非唯一着迷于领土压缩体验的人，同一主题在二十世纪初的美国思想中所起的关键作用即为明证。1904 年，文学家亨利·亚当斯（Henry Adams）诊断出一种“加速律”，认为它是社会发展运作的根本，以便理解人类活动迅速变化的空间与时间轮廓。只有把基本技术与社会进程那看似无法遏制的加速置于社会与历史分析的中心，现代社会才能得到恰当理解（Adams 1931 [1904]）[^adams-1931]。约翰·杜威（John Dewey）在 1927 年主张，晚近的经济与技术趋势意味着一个“新世界”的出现，其重要性不亚于 1492 年美洲向欧洲的探索与征服敞开。对杜威来说，蒸汽、电与电话的发明，对长期充当多数人类活动主要舞台的、相对静止而均质的本地共同体生活形式，构成了严峻挑战。例如，经济活动日益冲破本地共同体的范围，其程度足令我们的历史前辈震惊；而汽船、铁路、汽车与航空旅行则大大提高了地理流动的速率。然而，杜威超越了此前关于人类活动时空轮廓变化的讨论，他提出空间的压缩给民主提出了根本问题。杜威观察到，小型政治共同体（例如新英格兰的乡镇）是有效行使民主参与的关键场所，却似乎日益边缘化于一个相互关联的世界的重大问题之外。跨越国界的社会纽带网络日益稠密，使地方形式的自治变得无效。杜威问道：“我们可以问，当公众简直不再待在原地时，一个公众如何可能组织起来？”（Dewey 1927, 140）[^dewey-1927]。民主公民身份至少在最低限度上预设了与他人协同行动的可能性，那么，在一个流动与迁移的可能性日益惊人的社会世界里，公民身份又如何维系？新的高速技术赋予社会生活以变动不居的性格，其表现是受其直接影响的许多活动领域（或许最重要的是经济）变化与更替的速率上升，以及那里社会关系相对的流动与无常。然而，如果公民身份要求社会生活具有某种最低限度的恒常与稳定，那么人类活动的时间与空间条件在晚近的变化，岂非对政治参与不利？当当代社会“对运动与速度的狂热”使公民彼此甚至难以结识，更不用说辨认共同关切的对象时，他们又如何可能聚集起来协同行动？（Dewey 1927, 140）[^dewey-1927]。
    step2: |-
      对领土压缩体验的着迷，远不止于欧洲知识分子。同一主题在二十世纪初的美国思想中也举足轻重，可为明证。1904 年，文学家亨利·亚当斯（Henry Adams）提出存在一种“加速律”，认为它构成社会发展的根本机制，借此才能理解人类活动急剧变化的空间与时间轮廓。在他看来，唯有把基本技术与社会进程那看似不可遏止的加速置于社会与历史分析的中心，现代社会才谈得上被正确理解（Adams 1931 [1904]）[^adams-1931]。约翰·杜威（John Dewey）于 1927 年主张：晚近的经济与技术趋势意味着一个“新世界”的诞生，其意义不下于 1492 年美洲对欧洲探险与征服的敞开。在杜威看来，蒸汽、电与电话的发明，对本地共同体的生活形式构成严峻挑战——那种生活相对静止而均质，长期是多数人类活动的主要舞台。经济活动日益突破本地共同体的界限，其程度会让我们的历史前辈瞠目；汽船、铁路、汽车与航空则大幅加快了地理流动的速度。杜威更进一步：他不止于讨论人类活动时空轮廓的变迁，还指出空间压缩给民主带来了根本问题。他看到，小型政治共同体（如新英格兰的乡镇）本是有效民主参与的关键场所，却似乎越来越被挤到一个相互关联的世界的重大议题之外。跨国社会纽带的网络日益稠密，地方自治随之失效。杜威发问：“试问，当公众简直不再待在原地时，一个公众如何组织得起来？”（Dewey 1927, 140）[^dewey-1927]。民主公民身份至少要以与他人协同行动的可能性为前提；那么，在一个流动与迁徙的可能性越来越惊人的社会世界里，公民身份还能靠什么维系？新的高速技术使社会生活变动不居：受其直接影响的许多领域（其中最重要的或许是经济）变化与更替加快，此处的社会关系也相对流动而反复无常。可是，倘若公民身份要求社会生活有几分恒常与稳定，人类活动时空条件在晚近的变化岂非不利于政治参与？当代社会“对运动与速度的狂热”，使公民连彼此结识都难，更不用说辨识共同关切的对象；他们又怎能聚集起来共同行动？（Dewey 1927, 140）[^dewey-1927]。
