    source: |-
      Suppose that the angle of parallellism for *PQ* is one half a right angle. In this case, *b*₁ and *b*₂ make a right angle at *Q* and we thus have two mutually perpendicular straight lines on the same plane as *a*, which fail to meet *a*.
    step1: |-
      假设 *PQ* 的平行角是一直角的一半。在这种情况下，*b*₁ 与 *b*₂ 在 *Q* 处构成直角，于是我们在与 *a* 相同的平面上就有两条相互垂直却不与 *a* 相交的直线。
    step2: |-
      设 *PQ* 的平行角恰为直角之半。此时 *b*₁ 与 *b*₂ 在 *Q* 处夹成直角，于是同一平面上便有两条互相垂直、却都不与 *a* 相交的直线。
  - id: 12
    kind: body
    source: |-
      Lobachevsky's geometry abounds in surprising theorems (many of which had already been found by Saccheri). Here are a few: The three interior angles of a triangle add up to *less* than two right angles. The difference or “defect” is proportional to the triangle's area. Hence, in Lobachevskian geometry, similar triangles are congruent. Moreover, if a triangle is divided into smaller triangles, the defect of the whole equals the sum of the defects of the parts. Since the defect cannot be greater than two right angles, the area of triangles has a finite maximum. If a quadrilateral, by construction, has three right angles, the fourth angle is necessarily acute. Thus, in Lobachevskian geometry there are no rectangles.
    step1: |-
      罗巴切夫斯基几何中充满令人惊异的定理（其中许多萨凯里早已发现）。这里举几条：三角形的三个内角之和*小于*两直角。其差额或“亏量”与三角形的面积成正比。因此，在罗巴切夫斯基几何中，相似的三角形全等。此外，若把一个三角形分割成较小的三角形，整体的亏量等于各部分亏量之和。既然亏量不能大于两直角，三角形的面积就有一个有限的最大值。若一个四边形按构造有三个直角，则第四个角必为锐角。因此，在罗巴切夫斯基几何中没有矩形。
    step2: |-
      罗巴切夫斯基几何里满是令人吃惊的定理（其中不少萨凯里早已发现）。略举数例：三角形三内角之和 **小于** 两直角；这一差额即“亏量”，与三角形面积成正比。于是，在罗巴切夫斯基几何中，相似三角形必全等。再者，若把一三角形剖分为若干小三角形，整体亏量等于各小三角形亏量之和。亏量既不能超过两直角，三角形面积便有一个有限上界。一个四边形若按作图带有三个直角，第四角必为锐角。所以，罗巴切夫斯基几何中没有矩形。
