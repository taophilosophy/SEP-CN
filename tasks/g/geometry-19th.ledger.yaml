      2. 变换的复合是可结合的，因此，若 *T*₁、*T*₂ 与 *T*₃ 是 *S* 的变换，则 (*T*₃ ○ *T*₂) ○ *T*₁ = *T*₃ ○ (*T*₂ ○ *T*₁)；
