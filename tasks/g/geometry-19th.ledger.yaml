      If κ stands for a different sort of conic, not an ordinary real one, the function *d*_{κ} obtained by the above procedure behaves on suitably defined regions of the projective plane like a Euclidian distance function or like the distance function of elliptic geometry (this depends on the nature of the conic κ). Thus, depending on whether κ belongs to one or the other of three kinds of conic, the group of collineations that map κ onto itself is structurally identical with one of the three groups of Lobachevskian, Euclidean, or elliptic isometries. Similar results hold for the three-dimensional case, with κ a quadric surface.
    step1: |-
      若 κ 代表另一种圆锥曲线，而非普通的实圆锥曲线，则由上述程序得到的函数 *d*_{κ}，在射影平面适当定义的区域上，会表现出像欧几里得距离函数、或像椭圆几何距离函数的行为（这取决于圆锥曲线 κ 的性质）。于是，视 κ 属于三类圆锥曲线中的哪一类，把 κ 映到自身的直射变换群，在结构上分别与罗巴切夫斯基、欧几里得或椭圆的三种等距变换群之一相同。三维情形也有类似结果，此时 κ 是二次曲面。
    step2: |-
      倘若 κ 代表另一类圆锥曲线，而非寻常的实圆锥曲线，那么照上述程序得到的函数 *d*_{κ}，在射影平面中适当界定的区域上，行为便如欧几里得距离函数，或如椭圆几何的距离函数（视 κ 的性质而定）。因此，依 κ 属于三类圆锥曲线中的哪一类，把 κ 映到自身的直射变换群，在结构上恰与罗巴切夫斯基、欧几里得、椭圆三种等距变换群之一相同。三维情形亦有相应结果，只是 κ 换作二次曲面。
