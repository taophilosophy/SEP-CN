  - id: 7
    kind: body
    source: |-
      In the darker ages that followed, Euclid's sense of mathematical freedom was lost and philosophers and mathematicians expected geometry to rest on self-evident grounds. Now, if *a* is perpendicular and *b* is almost perpendicular to *PQ*, *a* and *b* approach each other very slowly on one side of *PQ* and it is not self-evident that they must eventually meet somewhere on that side. After all, the hyperbole indefinitely approaches its asymptotes and yet, demonstrably, never meets them. Through the centuries, several authors demanded—and attempted—a proof of Euclid's Postulate. John Wallis (b. 1616, d. 1703) derived it from the assumption that there are polygons of different sizes that have the same shape. But then this assumption needs proof in turn. Girolamo Saccheri (b. 1667, d. 1733) tried *reductio*. He inferred a long series of propositions from the negation of Euclid's Postulate, until he reached one which he pronounced “repugnant to the nature of the straight line”. But Saccheri's understanding of this “nature” was rooted in Euclidean geometry and his conclusion begged the question.
    step1: |-
      在其后较为黯淡的岁月里，欧几里得那种数学上的自由感丧失了，哲学家和数学家都期望几何学立足于自明的根据。现在，若 *a* 垂直于 *PQ* 而 *b* 几乎垂直于 *PQ*，则 *a* 与 *b* 在 *PQ* 的一侧彼此逼近得非常缓慢，而它们必定最终在该侧某处相交这一点并非自明。毕竟，双曲线无限逼近其渐近线，却可以证明永不与之相交。几个世纪以来，有几位作者要求——并尝试过——证明欧几里得公设。约翰·沃利斯（1616 年生，1703 年卒）由“存在大小不同而形状相同的多边形”这一假定推出该公设。但这个假定反过来又需要证明。吉罗拉莫·萨凯里（1667 年生，1733 年卒）尝试了归谬法。他从欧几里得公设的否定出发推出一长串命题，直到得出一个他断言“与直线本性相悖”的命题。但萨凯里对这种“本性”的理解植根于欧几里得几何，他的结论是在乞题。
    step2: |-
      在此后较为黯淡的岁月里，欧几里得那种数学上的自由气度失落了，哲学家与数学家都指望几何学奠基于自明的地基之上。试看：若 *a* 垂直于 *PQ*，而 *b* 几乎垂直于 *PQ*，则 *a* 与 *b* 在 *PQ* 一侧缓慢地相互靠近，它们终将在该侧某处相交，此点并非自明。毕竟，双曲线无限趋近其渐近线，却明明白白永不与之相交。数百年来，好几位作者要求——也曾尝试——给出欧几里得公设的证明。约翰·沃利斯（1616—1703）从“存在大小不同而形状相同的多边形”这一假定把它推了出来。可这个假定反过来又需要证明。吉罗拉莫·萨凯里（1667—1733）诉诸归谬法：他从欧几里得公设的否定推出一长串命题，直至得出一个他判为“与直线本性相抵牾”的命题。然而萨凯里对这条“本性”的理解植根于欧几里得几何，他的结论不过是乞题。
  - id: 8
    kind: body
    source: |-
      In the 1820's, Nikolai I. Lobachevsky (b. 1793, d. 1856) and Janos Bolyai (b. 1802, d. 1860) independently tackled this question in a radically new way. Lobachevsky built on the negation of Euclid's Postulate an alternative system of geometry, which he dubbed “imaginary” and tried inconclusively to test for validity at the astronomical scale by calculating the sum of the internal angles of triangles formed by stars on the sky. Bolyai excised the postulate from Euclid's system; the remaining rump is the “absolute geometry”, which can be further specified by adding to it either Euclid's Postulate or its negation. From the 1790's Carl Friedrich Gauss (b. 1777, d. 1855) had been working on the subject in the same direction, but he refrained from publishing for fear of scandal. Since Lobachevsky was the first to publish, the system of geometry based on the said “absolute geometry” plus the negation of Euclid's Postulate is properly called *Lobachevskian geometry*.
    step1: |-
      19 世纪 20 年代，尼古拉·伊·罗巴切夫斯基（1793 年生，1856 年卒）与亚诺什·鲍耶（1802 年生，1860 年卒）各自以全新的方式处理了这个问题。罗巴切夫斯基在欧几里得公设的否定之上建立了一套替代的几何体系，他称之为“想象几何”，并试图通过计算天上恒星所成三角形的内角和，在宇宙尺度上检验其有效性，但未获定论。鲍耶把该公设从欧几里得体系中切除；剩下的残余部分即“绝对几何”，可以通过给它加上欧几里得公设或其否定而进一步确定。自 1790 年代起，卡尔·弗里德里希·高斯（1777 年生，1855 年卒）就一直沿同一方向研究这一问题，但因害怕引起丑闻而未发表。由于罗巴切夫斯基最先发表，基于上述“绝对几何”加上欧几里得公设之否定的几何体系，就被恰当地称为*罗巴切夫斯基几何*。
    step2: |-
      到 19 世纪 20 年代，尼古拉·伊·罗巴切夫斯基（1793—1856）与亚诺什·鲍耶（1802—1860）各自另辟蹊径，独立处理了这一问题。罗巴切夫斯基以欧几里得公设的否定为地基，另立一套几何体系，称之为“想象几何”，并试图借天文尺度上恒星所成三角形的内角和来检验其有效性，结果未成定论。鲍耶则把该公设从欧几里得体系中切除；余下的残余即“绝对几何”，再补入欧几里得公设或其否定，便可进一步确定。从 1790 年代起，卡尔·弗里德里希·高斯（1777—1855）已朝同一方向研究此问题，却因惧生丑闻而未刊布。由于罗巴切夫斯基首发其说，以“绝对几何”加欧几里得公设之否定为基础的几何体系，便得名为 **罗巴切夫斯基几何**。
  - id: 9
    kind: body
    source: |-
      The construction introduced above to explain Euclid's Postulate can also be used for elucidating its negation. Draw the straight line *a* through point *P* at right angles with the segment *PQ*. If Euclid's Postulate is denied, there are countless straight lines through *Q*, coplanar with *a*, that make acute angles with *PQ* but never meet *a*. Consider the set of real numbers which are the magnitudes of these acute angles. Let the greatest lower bound of this set be μ. Evidently, μ > 0. There are exactly two straight lines through *Q*, coplanar with *a*, that make an angle of size μ with *PQ*. (See Figure 2.) Call them *b*₁ and *b*₂. Neither *b*₁ nor *b*₂ meets *a*, but *a* meets every line through *Q* that is coplanar with *a* and makes with *PQ* an angle less than μ. Gauss, Lobachevsky and Bolyai—unbeknownst to each other—coincided in calling *b*₁ and *b*₂ *the* parallels to *a* through *Q*. μ is called the angle of parallellism for segment *PQ*. Its size depends on the length of *PQ*, and decreases as the latter increases.
    step1: |-
      上文为解释欧几里得公设而引入的构造，也可用来阐明对该公设的否定。过点 *P* 作垂直于线段 *PQ* 的直线 *a*。若否认欧几里得公设，则过 *Q* 有无数条与 *a* 共面的直线，它们与 *PQ* 成锐角却永不与 *a* 相交。考虑由这些锐角的大小所构成的实数集合。设该集合的最大下界为 μ。显然，μ > 0。过 *Q* 恰有两条与 *a* 共面的直线与 *PQ* 成大小为 μ 的角。（见图 2。）称它们为 *b*₁ 与 *b*₂。*b*₁ 与 *b*₂ 都不与 *a* 相交，但 *a* 与过 *Q* 且与 *a* 共面、与 *PQ* 成小于 μ 之角的每一条直线都相交。高斯、罗巴切夫斯基与鲍耶彼此并不知情，却不约而同地把 *b*₁ 与 *b*₂ 称为过 *Q* 的 *a* 的*平行线*。μ 称为线段 *PQ* 的平行角。它的大小取决于 *PQ* 的长度，并随后者的增大而减小。
    step2: |-
      为解释欧几里得公设而引入的上述作图，同样可用来阐明对它的否定。过点 *P* 作直线 *a*，与线段 *PQ* 成直角。一旦否弃欧几里得公设，过 *Q* 便有无数条与 *a* 共面的直线，它们与 *PQ* 夹成锐角，却始终不与 *a* 相交。取这些锐角大小为元素构成实数集，设其最大下界为 μ。显然 μ > 0。过 *Q* 恰有两条与 *a* 共面的直线，与 *PQ* 所成之角等于 μ。（见图 2。）名之为 *b*₁ 与 *b*₂。*b*₁ 和 *b*₂ 都不与 *a* 相交；但过 *Q* 的每一条与 *a* 共面、且与 *PQ* 成小于 μ 之角的直线，*a* 都与它相交。高斯、罗巴切夫斯基与鲍耶互不相谋，却一致把 *b*₁ 与 *b*₂ 叫作过 *Q* 的 *a* 的 **那条** 平行线。μ 称为线段 *PQ* 的平行角，其大小随 *PQ* 长度而定，*PQ* 越长，μ 越小。
