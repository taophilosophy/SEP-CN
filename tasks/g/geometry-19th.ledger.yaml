    source: |-
      By virtue of conditions (i)-(iv), the transformations of *S* form a *group* *G*_{*S*}  in the precise sense that this term has in algebra. *G*_{*S*}  includes subgroups, i.e., subsets which contain I and satisfy conditions (i) and (iv). If *H* is a subgroup of *G*_{*S*}  and Φ is a feature of *S*, or of its elements or parts, which is not affected by the transformations of Φ, we say that Φ is *H*-invariant. The only *G*_{*S*}-invariant is the cardinality of *S* (i.e., the number of elements in the manifold). On the other hand, the group {*I*}, consisting of the identity alone, trivially preserves every conceivable feature. Between these two extremes there can be many different subgroups with all sorts of interesting invariants, depending on the respective group structure. If *S* is not an arbitrary (structureless) set, but a numerical manifold as described by Klein, it inherits structure from the real number field, which contributes to characterize the different subgroups of *G*_{*S*}  and their invariants. Thus, the group of continuous transformations preserves the topological properties (neighborhood relations), and the group of linear transformations preserves the projective properties.
    step1: |-
      凭条件 (i)-(iv)，*S* 的变换构成一个*群* *G*_{*S*}，其意义正是代数中该词项的精确意义。*G*_{*S*} 包含子群，即包含 I 且满足条件 (i) 与 (iv) 的子集。若 *H* 是 *G*_{*S*} 的子群，Φ 是 *S* 或其元素或部分的特征，且不受 Φ 的变换影响，我们就说 Φ 是 *H* 不变的。唯一的 *G*_{*S*} 不变量是 *S* 的基数（即流形中元素的数目）。另一方面，仅由恒等映射构成的群 {*I*} 平凡地保持一切可以想象的特征。在这两个极端之间，可以有许多不同的子群，带有各种有趣的不变量，视各自的群结构而定。若 *S* 不是任意的（无结构的）集合，而是克莱因所描述的数值流形，它就继承实数域的结构，而这有助于刻画 *G*_{*S*} 的不同子群及其不变量。于是，连续变换群保持拓扑性质（邻接关系），线性变换群保持射影性质。
    step2: |-
      由条件 (i)-(iv)，*S* 的全体变换构成一个**群** *G*_{*S*}，其含义正是代数中“群”一词的严格意义。*G*_{*S*} 含有子群，即包含 I 并满足条件 (i) 与 (iv) 的子集。设 *H* 为 *G*_{*S*} 的子群，Φ 为 *S* 或其元素、部分的某一特征，若 Φ 不受 Φ 的变换影响，便称 Φ 是 *H* 不变的。唯一的 *G*_{*S*} 不变量是 *S* 的基数（即流形所含元素的个数）。另一极端，由恒等映射单独构成的群 {*I*}，则平凡地保持一切想得到的特征。两端之间可以有许多不同的子群，各自带有种种有趣的不变量，视其群结构而定。若 *S* 并非任意的（无结构的）集合，而是克莱因所说的数值流形，它便从实数域承袭结构，这有助于刻画 *G*_{*S*} 的各子群及其不变量。于是，连续变换群保持拓扑性质（邻接关系），线性变换群保持射影性质。
  - id: 32
    kind: body
    source: |-
      Can metric properties be fixed in this way? Traditionally one defines the distance between two points (*x*₁, … ,*x*_{*n*}) and (*y*₁, … ,*y*_{*n*}) of a numerical manifold as the positive square root of (*x*₁ − *y*₁)^{ 2} + … + (*x*_{*n*} − *y*_{*n*})². The group of isometries consists of the transformations that preserve this function. However, this is just a convention, adopted to ensure that the geometry is Euclidean. Using projective geometry, Klein thought of something better. No real-valued function of point pairs, defined on all projective space, is an invariant of the projective group, but there is a function of collinear point quadruples, called the *cross-ratio*, which is such an invariant. Drawing on work by Arthur Cayley (b. 1821, d. 1895), Klein (1871, 1873) considered the cross-ratio of point quadruples <*P*₁,*P*₂,*P*₃,*P*₄>. such that *P*₃ and *P*₄ belong to a given conic κ on a projective plane, while *P*₁ and *P*₂ range over a region **R** that is bounded by or otherwise fixed by κ. Since *P*₃ and *P*₄ must be the points where the straight line through *P*₁ and *P*₂ meets κ, the said cross-ratio may be regarded as a function of the point pair <*P*₁,*P*₂>. The collineations that map a given conic onto itself form a group, and the said function is clearly an invariant of this group. Klein showed that a certain function of this function behaves like an ordinary distance function on **R**. According to the nature of the conic κ, the structure determined by this function satisfies either (i) all the theorems of Euclidian plane geometry, or (ii) all those of Lobachevskian plane geometry, or (iii) those of a third geometry which Klein himself discovered and dubbed ‘elliptic’. (In elliptic geometry every straight line meets every other, and the three internal angles of a triangle always add up to more than two right angles. Klein's names for the geometries of Euclid and Lobachevsky were ‘parabolic’ and ‘hyperbolic’, respectively.)
    step1: |-
      度量性质能以这种方式确定下来吗？传统上，人们把数值流形中两点 (*x*₁、……、*x*_{*n*}) 与 (*y*₁、……、*y*_{*n*}) 之间的距离定义为 (*x*₁ − *y*₁)^{ 2} + … + (*x*_{*n*} − *y*_{*n*})² 的正平方根。等距变换群由保持这一函数的变换构成。然而，这只是一个约定，采用它是为了保证几何是欧几里得的。克莱因借助射影几何，想到了更好的办法。在整个射影空间上定义的、关于点对的实值函数，没有一个是射影群的不变量；但有一种关于共线四点组的函数，称为*交比*，它正是这样的不变量。克莱因吸取阿瑟·凯莱（1821 年生，1895 年卒）的工作，考察四点组 <*P*₁,*P*₂,*P*₃,*P*₄> 的交比，其中 *P*₃ 与 *P*₄ 属于射影平面上一个给定的圆锥曲线 κ，而 *P*₁ 与 *P*₂ 在一个由 κ 界定或以其他方式由 κ 确定的区域 **R** 上变动。既然 *P*₃ 与 *P*₄ 必定是过 *P*₁ 与 *P*₂ 的直线与 κ 的交点，上述交比就可以看作点对 <*P*₁,*P*₂> 的函数。把给定圆锥曲线映到自身的直射变换构成一个群，而上述函数显然是这个群的不变量。克莱因证明，这个函数的某个函数在 **R** 上的行为就像普通的距离函数。按照圆锥曲线 κ 的性质，由这个函数所确定的结构，或者满足 (i) 欧几里得平面几何的全部定理，或者满足 (ii) 罗巴切夫斯基平面几何的全部定理，或者满足 (iii) 克莱因本人发现并称为“椭圆”的第三种几何的定理。（在椭圆几何中，每一条直线都与每一条其他直线相交，三角形的三个内角之和总是大于两直角。克莱因给欧几里得与罗巴切夫斯基的几何所起的名字分别是“抛物”与“双曲”。）
    step2: |-
      度量性质能否这样确定？传统做法是把数值流形中两点 (*x*₁、……、*x*_{*n*}) 与 (*y*₁、……、*y*_{*n*}) 的距离，定义为 (*x*₁ − *y*₁)^{ 2} + … + (*x*_{*n*} − *y*_{*n*})² 的正平方根；保持此函数的变换构成等距变换群。然而这不过是约定，采用它是为确保几何为欧几里得几何。克莱因借射影几何另谋更佳之策：定义于整个射影空间、以点对为自变量的实值函数，没有一个是射影群的不变量；但以共线四点组为自变量的函数中，却有这样一个不变量，即**交比**。克莱因汲取阿瑟·凯莱（1821—1895）的研究，考察四点组 <*P*₁,*P*₂,*P*₃,*P*₄> 的交比，其中 *P*₃、*P*₄ 属于射影平面上一给定了的圆锥曲线 κ，*P*₁、*P*₂ 则在由 κ 界定、或以别的方式由 κ 确定的区域 **R** 内变动。既然 *P*₃、*P*₄ 必是过 *P*₁、*P*₂ 的直线与 κ 的交点，上述交比便可视为点对 <*P*₁,*P*₂> 的函数。把给定圆锥曲线映到自身的直射变换构成一群，而上述函数显然为此群的不变量。克莱因进而表明，这个函数的某一函数在 **R** 上的表现一如普通距离函数。依圆锥曲线 κ 的性质，由此函数确定的结构或满足 (i) 欧几里得平面几何的全部定理，或满足 (ii) 罗巴切夫斯基平面几何的全部定理，或满足 (iii) 克莱因本人发现并命名为“椭圆”的第三种几何的定理。（在椭圆几何中，每一直线皆与每另一直线相交，三角形三内角之和恒大于两直角。克莱因把欧几里得几何与罗巴切夫斯基几何分别命名为“抛物”几何与“双曲”几何。）
  - id: 33
    kind: body
    source: |-
      This is how Klein's approach works for Lobachevskian geometry on the plane. Let κ be a real conic—a conic comprising only real points—on the projective plane. Let *G*_{κ} be the set of all collineations that map κ onto itself. *G*_{κ} is a subgroup of the projective group. Consider now the cross-ratio of point quadruples <*P*₁,*P*₂,*P*₃,*P*₄> such that *P*₃ and *P*₄ belong to κ, while *P*₁ and *P*₂ range over the interior Int(κ) of the region of the real plane bounded by κ. (*P* ∈ Int(κ) if and only if *P* is a real point and no real tangent to κ passes through *P*.) As noted above, the choice of points *P*₁ and *P*₂ fixes *P*₃ and *P*₄, so the said cross-ratio may be regarded as a function of the first pair of points only, say, *f*_{κ}(*P*₁,*P*₂). The function *f*_{κ} is clearly *G*_{κ}-invariant. Put *d*_{κ}(*P*₁,*P*₂) = *c* log *f*_{κ}(*P*₁,*P*₂), where *c* is an arbitrary real-valued constant, different from 0, and log *x* denotes the principal value of the natural logarithm of *x*. Klein was able to show that *d*_{κ} behaves precisely like a Lobachevskian distance function on Int(κ). In other words, every theorem of Lobachevskian geometry holds for suitable figures formed from points of Int(κ), if the distance between any two of these points is given by the function *d*_{κ}. Consider, for instance, four points *P*₁,*P*₂,*P*₃, and *P*₄ in Int(κ), such that *d*_{κ}(*P*₁,*P*₂) = *d*_{κ}(*P*₂,*P*₃) = *d*_{κ}(*P*₃,*P*₄) = *d*_{κ}(*P*₄,*P*₁). They are the vertices of a Lobachevskian equilateral quadrilateral *Q*, which can have at most three right angles, in which case the fourth interior angle of *Q* must be acute. (Where ‘right angle’ means, as usual, an angle equal to its adjacent angle, and two angles in Int(κ) are said to be equal if one is the image of the other by a transformation of group *G*_{κ}).
    step1: |-
      克莱因的方法用于平面上的罗巴切夫斯基几何时是这样运作的。设 κ 是射影平面上的实圆锥曲线——只由实点构成的圆锥曲线。设 *G*_{κ} 为把 κ 映到自身的所有直射变换之集。*G*_{κ} 是射影群的子群。现在考察四点组 <*P*₁,*P*₂,*P*₃,*P*₄> 的交比，其中 *P*₃ 与 *P*₄ 属于 κ，而 *P*₁ 与 *P*₂ 在由 κ 界定的实平面区域的内部 Int(κ) 中变动。（*P* ∈ Int(κ) 当且仅当 *P* 是实点，且没有 κ 的实切线经过 *P*。）如前所述，*P*₁ 与 *P*₂ 的选取确定了 *P*₃ 与 *P*₄，所以上述交比可以只当作前一对点的函数，比如说 *f*_{κ}(*P*₁,*P*₂)。函数 *f*_{κ} 显然是 *G*_{κ} 不变的。令 *d*_{κ}(*P*₁,*P*₂) = *c* log *f*_{κ}(*P*₁,*P*₂)，其中 *c* 是任意实值常数，不等于 0，log *x* 表示 *x* 的自然对数的主值。克莱因能够证明，*d*_{κ} 在 Int(κ) 上的行为恰好就像罗巴切夫斯基距离函数。换言之，只要任意两点之间的距离由函数 *d*_{κ} 给出，罗巴切夫斯基几何的每一条定理都适用于由 Int(κ) 中的点构成的适当图形。例如，考虑 Int(κ) 中四点 *P*₁,*P*₂,*P*₃ 与 *P*₄，使得 *d*_{κ}(*P*₁,*P*₂) = *d*_{κ}(*P*₂,*P*₃) = *d*_{κ}(*P*₃,*P*₄) = *d*_{κ}(*P*₄,*P*₁)。它们是罗巴切夫斯基等边四边形 *Q* 的顶点；*Q* 至多可以有三个直角，若有三个直角，则 *Q* 的第四个内角必为锐角。（这里“直角”照常指等于其邻角的角，而 Int(κ) 中的两个角称为相等，是指其中一个角在群 *G*_{κ} 的某个变换下成为另一个角。）
    step2: |-
      克莱因的方法施于平面上的罗巴切夫斯基几何，运作如下。设 κ 为射影平面上的实圆锥曲线，即只含实点的圆锥曲线；设 *G*_{κ} 为把 κ 映到自身的全部直射变换之集，它是射影群的子群。今考察四点组 <*P*₁,*P*₂,*P*₃,*P*₄> 的交比，其中 *P*₃、*P*₄ 属于 κ，*P*₁、*P*₂ 在由 κ 界定的实平面区域的内部 Int(κ) 中变动（*P* ∈ Int(κ) 当且仅当 *P* 为实点，且 κ 的任何实切线都不经过 *P*）。如上所述，选定了 *P*₁、*P*₂ 也就确定了 *P*₃、*P*₄，故上述交比可仅视为前一对点的函数，记作 *f*_{κ}(*P*₁,*P*₂)。函数 *f*_{κ} 显然是 *G*_{κ} 不变的。令 *d*_{κ}(*P*₁,*P*₂) = *c* log *f*_{κ}(*P*₁,*P*₂)，其中 *c* 为不等于 0 的任意实值常数，log *x* 表示 *x* 的自然对数主值。克莱因得以证明：*d*_{κ} 在 Int(κ) 上的行为恰如罗巴切夫斯基距离函数。换言之，只要两点距离由 *d*_{κ} 给出，罗巴切夫斯基几何的每条定理都适用于 Int(κ) 之点所构成的适当图形。譬如取 Int(κ) 中四点 *P*₁、*P*₂、*P*₃、*P*₄，使 *d*_{κ}(*P*₁,*P*₂) = *d*_{κ}(*P*₂,*P*₃) = *d*_{κ}(*P*₃,*P*₄) = *d*_{κ}(*P*₄,*P*₁)。它们构成一个罗巴切夫斯基等边四边形 *Q* 的顶点；*Q* 至多能有三个直角，若真有三个直角，其第四个内角必为锐角。（此处“直角”照常指与其邻角相等之角；Int(κ) 中两角称为相等，谓其中一角经群 *G*_{κ} 的某变换成为另一角。）
