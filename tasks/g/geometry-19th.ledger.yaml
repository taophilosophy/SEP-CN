      ## 6. Lie Groups
    step1: |-

    step2: |-

  - id: 51
    kind: body
    source: |-
      For a philosopher, the most satisfying feature of the tremendous complication attained by 19th-century mathematics was perhaps the promptness with which the newly created (or discovered?) mathematical structures found their way into empirical science, enabling the intellectual grasp and handling of actual phenomena. We shall wind up this survey of 19th-century geometry with a few light remarks on a particularly rich and fruitful structure that has pride of place in current physics, namely, *Lie groups*, so called after Sophus Lie (1842–1899), the Norwegian mathematician who studied them in depth after 1870. A Lie group is, of course, a group in the algebraic sense we met in §3, that is, a set *G* such that (i) every ordered pair <*x*,*y*> ∈ *G* is associated to a unique element *x* · *y* ∈ *G* (known as the *product* or the *sum* of *x* and *y*); (ii) the product operation is associative, i.e., (*x* · *y*) · *z* = *x* · (*y* · *z*), for every *x*, *y*, *z* ∈ *G*; (iii) there is a one and only one element 0 ∈ *G* such that for every *x* ∈ *G*, *x* · 0 = 0 · *x* = *x* (0 is the *identity* or *neutral element* of *G*); (iv) for every *x* ∈ *G*, there is one and only one element *x*^{−1} ∈ *G* such that *x* · *x*^{−1} = 0 (*x*^{−1} is known as the *inverse* of *x*). But a Lie group is also a smooth manifold, as described in the supplement [A Modern Formulation of Riemann's Theory](geometry-19th.supplement.md): the set *G* can be represented patchwise by systems of real-valued (or alternatively complex-valued) coordinates, mutually linked by well-defined, differentiable coordinate transformations wherever their respective patches overlap. The group and manifold structures of *G* are meshed together by the condition that the product operation is a differentiable mapping of *G* × *G* into *G*.
    step1: |-

    step2: |-

  - id: 52
    kind: body
    source: |-
      A simple, yet important, example of a Lie group is the group SO(2), instantiated by the rotations of the plane about an arbitrary fixed point. The manifold is topologically compact and therefore cannot be covered by a single coordinate patch, but three will suffice: one including, say, all counterclockwise rotations by more than three radians and less than four, which can be naturally coordinatized using the real numbers in the open interval (3,4); another patch comprising the inverses of the former, which can be mapped onto the open interval (−4,−3), and a third one covering all counterclockwise rotations by less than two right angles plus their clockwise inverses, which can be mapped onto the open interval (−π,π). Indeed, all the groups we encountered in §3, which Klein used for characterizing the Euclidean geometry of space and the classical Non-Euclidean geometries, are Lie groups, and their respective smooth manifold structures allow for topological quirks. Thus the Euclidean isometries constitute a disconnected manifold, with mirror reflection not included in the same component as the subgroup of Euclidean motions.
    step1: |-

    step2: |-

  - id: 53
    kind: body
    source: |-
      Like all smooth manifolds, a Lie group *G* has a tangent vector space attached to each element. In particular, the tangent space at the neutral element 0 of *G* becomes the *Lie algebra* of *G* by the definition of the so-called *Lie bracket*, a bilinear mapping of *T*₀*G* × *T*₀*G* into *T*₀*G*, which, for all *u*,*v*,*w* in *T*₀*G* satisfies the condition [*u*,*u*] = 0 and the Jacobi identity: [*u*,[*v*,*w*]] + [*v*,[*w*,*u*]] + [*w*,[*u*,*v*]] = 0. The Lie algebra of *G* throws much light on the structure of *G* through the homeomorphic (“exponential”) mapping of a neighborhood of 0 ∈ *T*₀*G* into a neighborhood of 0 ∈ *G*.
    step1: |-

    step2: |-

  - id: 54
    kind: body
    source: |-
      In the supplement [A Modern Formulation of Riemann's Theory](geometry-19th.supplement.md) we touch on the idea of a *fiber bundle*, formed by two smooth manifolds *F* and *M*, bound together by a “projection” mapping π of *F* onto *M*, which partitions the manifold *F* into “fibers”, mapped by π to the different points of *M*. A fiber bundle <*F*,*M*,π> becomes a *principal fiber bundle* <*F*,*M*,π,*G*> if a Lie group *G*, known as the bundle's *structure group*, acts on *F* in such a way that each fiber of *F* is an orbit of the action and a few other conditions are met. For instance, the Lorentz group is the structure group of the principal fiber bundle of tetrads (orthonormal 4-tuples of tangent vectors at each point) on any relativistic spacetime, no matter how bizarre. In such ways, Lie groups provide a means of unifying the many models allowed by a physical theory and of introducing some degree of homogeneity among them.
    step1: |-

    step2: |-

  - id: 55
    kind: body
    source: |-
      During the last third of the 20th-century, fibre bundles and their Lie groups have virtually taken over fundamental physics. This is not the place to explain how or why, but the unstoppable evolution of physics towards ever more mathematically sophisticated, *prima facie* less straightforward representations of its subject-matter, deserves the attention of philosophers. It is clear that the concept of a definite stable thing out there, which might, at least in principle, be held and manipulated, is no longer so serviceable to us as it was once to our flint-carving ancestors.
    step1: |-

    step2: |-

