      ## 5. The differential geometry of Riemann
    step1: |-

    step2: |-

  - id: 47
    kind: body
    source: |-
      In a lecture “On the hypotheses that lie at the foundation of geometry”, delivered to the Faculty of Philosophy at Göttingen in 1854 and posthumously published in 1867, Bernhard Riemann (b. 1826, d. 1866) presented some radically innovative views on this matter. He noted that the measurable properties of a discrete manifold can be readily determined by counting. (Think of the population of a country, and the proportion of born-again Christians, or of couples who divorced within the first year of their marriage.) But continuous manifolds do not admit this approach. In particular, the measurable properties of physical space, which are the subject of geometry, depend on the binding forces that act on it. The distance between two points in space can be ascertained with a rod, or a tape, or by optical means, and the result depends essentially on the physical behavior of the instruments used. Up to now, the measurable properties of space have been successfully described in accordance with Euclidean geometry. However, “the empirical concepts on which the metric determinations of space are based—the concepts of a rigid body and a light ray—lose their validity in the infinitely small; it is therefore quite likely that the metric relations of space in the infinitely small do not agree with the assumptions of geometry, and in fact one would have to accept this as soon as the phenomena can thereby be explained in a simpler way” (Riemann 1854, p. 149)[^riemann-1854]. To prepare physicists for this eventuality, Riemann proposed a more general conception of geometry. Riemann's basic scheme makes allowance for much greater generality than he actually reaches for; but, in his judgment, it should be enough for the time being to characterize the geometry of continuous manifolds in such a way that it agrees optimally with Euclidean geometry on a small neighborhood of each point.
    step1: |-

    step2: |-

  - id: 48
    kind: body
    source: |-
      Riemann extends to *n* dimensions the methods employed by Gauss (1828) in his study of the intrinsic geometry of curved surfaces embedded in Euclidean space (called ‘intrinsic’ because it describes the metric properties that the surfaces display by themselves, independently of the way they lie in space). Looking back at Gauss's work one gets a better intuitive feel for Riemann's concepts (see Torretti 1978, pp. 68–82)[^torretti-1978]. However, for the sake of conciseness and perspicuity, it is advisable to look forward and to avail oneself of certain concepts introduced by later mathematicians as they tried to make sense of Riemann's proposal. Consider the modern formulation of Riemann's theory in the supplement [A Modern Formulation of Riemann's Theory](geometry-19th.supplement.md).
    step1: |-

    step2: |-

  - id: 49
    kind: body
    source: |-
      In his study of curved surfaces, Gauss introduced a real-valued function, the *Gaussian curvature*, which measures a surface's local deviation from flatness in terms of the surface's intrinsic geometry. Riemann extended this concept of curvature to Riemannian *n*-manifolds. By using his extended concept of curvature, he was able to characterize with great elegance the metric manifolds in which all figures can freely move around without changing their size and shape. They are the Riemannian manifolds of *constant curvature*. This idea can be nicely combined with Klein's classification of metric geometries. Regarded as Riemannian 3-manifolds, Euclidean space has constant zero curvature, Lobachevskian space has constant negative curvature, and elliptic space has constant positive curvature. Pursuant to the Erlangen Program, each of these geometries of constant curvature is characterized by its own group of isometries. But Klein's conception is too narrow to embrace all Riemannian geometries, which include spaces of variable curvature. Indeed, in the general case, the group of isometries of a Riemannian *n*-manifold is the trivial group consisting of the identity alone, whose structure conveys no information at all about the respective geometry.
    step1: |-

    step2: |-

