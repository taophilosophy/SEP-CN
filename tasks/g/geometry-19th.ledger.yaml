      1. If *T*₁ and *T*₂ are transformations of *S*, the composite mapping *T*₂ ○ *T*₁, which consists of *T*₁ followed by *T*₂, is also a transformation of *S*;
      2. the composition of transformations is associative, so that, if *T*₁, *T*₂ and *T*₃ are transformations of *S*, (*T*₃ ○ *T*₂) ○ *T*₁ = *T*₃ ○ (*T*₂ ○ *T*₁);
      3. the identity mapping I that sends each point of *S* to itself is a transformation of *S* such that, for any transformation *T*, *T* ○ *I* = *I* ○ *T* = *T*;
      4. for every transformation *T* there is a transformation *T*^{−1}, the *inverse* of *T*, such that *T*^{−1} ○ *T* = I (*T*^{−1} sends each point of *S* back to where it was brought from by *T*).
    step1: |-
