      第二，君主制和共和制政府各有特定的政府结构，并要求公民具有特定类型的动机。这些结构一旦瓦解，或这些动机一旦失灵，君主制和共和制政府就会腐化，而腐化的结果就是落入专制。但某个专制政府垮台时，通常并不会由君主制或共和制取而代之。建立一个稳定的君主制或共和制极其困难：“这是立法上的杰作，极少出于偶然，也难得凭审慎达到”（SL 5.14）。如果那些既要为这样的政府制定法律、又要依之生活的人，先前已被专制摧残、贬损，那就尤其困难。相比之下，制造一个专制政府要简单得多。专制不需要精心平衡各种权力，不需要创设并维持任何制度，不需要培养复杂的动机，也不需要让任何对权力的约束持续存在。只需把同胞吓住，足以把自己的意志强加于他们；孟德斯鸠断言，“这是任何能力都办得到的”（SL 5.14）。因此，专制与其他政体在腐化问题上必然处于不同的关系：其他政体可能腐化，专制本身就是腐化的化身。
