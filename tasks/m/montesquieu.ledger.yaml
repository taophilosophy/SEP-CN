      在民主制下，人民是主权者。他们可以通过官员治理，也可以由元老院提供建议，但必须有权自行选择官员和元老。民主制的原则是政治德性，孟德斯鸠用它指“对法律和祖国的热爱”（SL 4.5），包括对民主宪制的热爱。民主政府的形式使规定选举权和投票的法律成为根本大法。然而，保护其原则的需要提出了远为广泛的要求。在孟德斯鸠看来，运转良好的民主制所需要的德性并非自然生成。它要求“始终把公共利益置于私人利益之上”（SL 4.5）；它“把野心限制在唯一愿望、唯一幸福之上：为祖国做出比同胞更大的贡献”（SL 5.3）；它“是一种自我舍弃，始终艰难而痛苦”（SL 4.5）。孟德斯鸠把它比作修士对其修会的爱：“会规使他们被排除在一切滋养寻常激情的事物之外；于是只剩下对这条折磨他们的会规本身的激情。……会规越是约束他们的性情，就越给这仅存的激情增添力量”（SL 5.2）。要造就这种非自然的自我舍弃，“必须动用教育的全部力量”（SL 4.5）。民主制必须教育公民把自身利益与祖国利益视为一体，并应设置监察官以维护风尚。它应当设法以法律确立节俭，以免公民受诱去牺牲公共利益来增进私利；出于同样的理由，规范财产转让的法律应当力求保持公民之间财产的平等分配。它的疆域应当狭小，以便公民容易认同它，也使庞大的私人利益难以形成。
