      民主制可能以两种方式腐化：孟德斯鸠称之为“不平等的精神”和“极端平等的精神”（SL 8.2）。当公民不再把自身利益与祖国利益视为一体，因而既想牺牲同胞来增进私利，又想取得支配同胞的政治权力时，不平等的精神便产生了。当人民不再满足于作为公民的平等，而想在一切方面都平等时，极端平等的精神便产生了。在运转良好的民主制中，人民选出官员行使行政权，并尊重和服从自己选出的官员；这些官员若失去人民的尊重，人民就换掉他们。然而，一旦极端平等的精神扎根，公民便既不尊重也不服从任何官员。他们“什么都想自己管，替元老院辩论，替官员执行，替法官裁决”（SL 8.2）。最终政府将无法运转，德性的最后残余也会消失，民主制将被专制取代。
