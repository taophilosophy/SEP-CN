      孟德斯鸠写道：“专制政府的原则不断受到腐化，因为它在本质上就是腐化的”（SL 8.10）。这话在好几层意义上都成立。第一，专制政府会自我削弱。专制国家里财产没有保障，商业便无法繁荣，国家就会贫困。人民必须靠惩罚的威胁被维持在恐惧状态；然而随着时间推移，为使人民就范所需的惩罚会越来越严厉，直到进一步的威胁失去效力。不过最重要的是，专制君主的性格很可能使他无法有效统治。由于专制君主的每个念头都会得到满足，他“无须斟酌、怀疑、推理；他只需发号施令”（SL 4.3）。因此，他从来不必发展出任何类似才智、性格或决断力的东西。相反，他“天生懒惰、贪图享乐、愚昧无知”（SL 2.5），对真正治理人民毫无兴趣。于是他会选一个维齐尔（vizier）替他治理，自己退入后宫寻欢作乐。然而他不在时，针对他的阴谋会成倍增加，尤其因为他的统治必然令臣民憎恶，而臣民若谋反失败也几乎没有什么可失去。他不能依靠军队保护自己，因为军队权力越大，将领们自己夺取政权的可能性就越大。因此，专制国家的统治者并不比他的臣民更安全。
