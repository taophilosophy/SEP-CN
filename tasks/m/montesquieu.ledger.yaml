      在贵族制下，人民的一部分统治其余部分。贵族制政府的原则是节制，这种德性使贵族制中的统治者既克制自己不去压迫人民，也克制自己不去谋求凌驾于彼此之上的过度权力。在贵族制中，法律的设计应当用来灌输并保护这种节制精神。为此，法律必须做三件事。第一，法律必须防止贵族滥用人民。贵族的权力使这种滥用在贵族制中成为长期的诱惑；为避免这一点，法律应当剥夺贵族的某些权力，例如征税权，因为有了这种权力，诱惑几乎无法抗拒；法律还应当设法促成负责而温和的行政。第二，法律应当尽可能掩盖贵族与人民之间的差别，使人民尽量少感到自己无权。因此，贵族应当举止谦逊、生活简朴，因为他们若不试图与人民区别开来，“人民就容易忘记自己的从属地位和软弱”（SL 5.8）。最后，法律应当设法确保贵族之间、贵族家族之间的平等。法律若做不到这一点，贵族就会失去节制精神，政府就会腐化。
