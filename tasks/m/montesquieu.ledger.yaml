      一国土壤的性质也影响其政体形式。土壤肥沃之处，君主制更常见；土壤贫瘠之处，共和制更常见。原因有三。第一，生活在富饶国家的人更容易安于现状，他们在政府身上看重的不是政府给予的自由，而是政府能否提供足够的安全，让他们安心耕作。因此，只要君主制能提供这种安全，他们就比较愿意接受。君主制往往做得到，因为它比共和制更能迅速应对威胁。第二，肥沃国家既比贫瘠国家更令人觊觎，也更容易征服：它们“总是平坦开阔，居民无力对抗更强的权力；于是他们只能屈服；一旦屈服，自由精神便再也无法回归；国家的财富就是他们效忠的抵押”（SL 18.2）。孟德斯鸠认为，君主制比共和制更可能发动征服战争，因此征服者往往是君主制国家。第三，生活在贫瘠土地上的人必须辛勤劳作才能生存；这往往使他们“勤劳、节制、惯于艰苦、勇敢、适于作战”（SL 18.4）。相反，生活在肥沃国家的人偏爱“安逸、柔弱，以及对保全生命的某种迷恋”（SL 18.4）。因此，贫瘠国家的居民更能抵御可能来犯的攻击，也更能保卫自己的自由，不让想摧毁它的人得逞。
