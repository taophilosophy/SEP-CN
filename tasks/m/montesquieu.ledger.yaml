      然而，《波斯人信札》的伟大主题之一，是自我认识实际上不可能，而于斯贝克是这一主题最充分的例证。于斯贝克在波斯留下了一个后宫，他的妻妾被阉奴囚禁，而这些阉奴是他的奴隶的一部分。他的妻妾和奴隶都可以按他的命令被鞭打、残害或杀死，任何不幸看见她们的外人也是如此。换言之，于斯贝克在自己家里是一个专制君主。从一开始，他就被妻妾不贞的念头折磨。他写道，并不是他爱他的妻妾，而是“正是从我感情的缺乏中，产生了一种正在吞噬我的秘密嫉妒”（第 6 封信）。随着时间推移，后宫出现了问题：于斯贝克的妻妾彼此争斗，阉奴发现越来越难以维持秩序。最终纪律完全崩溃；阉奴总管向于斯贝克报告此事，随后突然死去。他的继任者显然不是服从于斯贝克，而是服从他的妻妾：他设法不接收于斯贝克的任何信件；当在后宫发现一个年轻人时，他写道：“我起了床，检查了这件事，发现那是一个幻象”（第 149 封信）。于斯贝克命令另一个阉奴恢复秩序：“把怜悯和温情抛在身后。……把我的后宫变成我离开时的样子；但要从赎罪开始：消灭罪犯，让那些曾想成为罪犯的人心生恐惧。对于如此出色的服务，你尽可指望从你的主人那里得到任何东西”（第 153 封信）。他的命令被服从了，“恐怖、黑暗和畏惧统治着后宫”（第 156 封信）。最后，于斯贝克最宠爱的妻子、也是他唯一信任其德性的罗克珊娜（Roxana）被发现与另一个男人在一起；她的情人被杀，她在给于斯贝克写了一封尖刻的信后自杀。信中她问道：“你怎么会以为我轻信到这种地步，竟以为我活在世上只是为了崇拜你的任性？以为你纵容自己一切，就有权阻挠我的一切欲望？不：我也许生活在奴役之中，但我一直是自由的。我按照自然法修正了你的法律，我的心灵始终保持独立”（第 161 封信）。小说以这封信结束。
