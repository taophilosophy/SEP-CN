      Though it is often talked about as an epistemic view (see Zagzebski 1996)[^zagzebski-1996], it is also discussed as a moral virtue too. Arpaly (2011) sees it as a disposition to change our beliefs without being opinionated out of moral concern. McRae (2016) also sees it as involving moral concern but also a willingness to consider alternate self-narratives, linking it with equanimity in the Buddhist tradition. This casts open-mindedness as a freedom from certain mental habits involving the self and its place in the world.
