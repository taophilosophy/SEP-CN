      Another type of strong accuracy view appeals to different scales of evaluation. This type of view is defended by Brennan (2007), who attributes it to Adam Smith (see *Theory of Moral Sentiments* 6.3.22–23; it is also considered and rejected by Sidgwick 1907/1981, 334–5)[^sidgwick-1907]. On this view, modest people evaluate themselves relative to an ideal but evaluate others relative to practical norms. So modest people rightly think of themselves as not very good (compared to an ideal like a saint), and can rightly think of other people as being good (relative to how good most people actually are). Having two scales allows the modest person to make accurate assessments of themselves and others, albeit with regard to different evaluative standards. (See also asymmetry accounts below).
    step1: |-
      另一类强准确论诉诸不同的评价尺度。这一类观点由 Brennan（2007）捍卫，他将其归于亚当·斯密（见《道德情操论》6.3.22–23；Sidgwick 1907/1981, 334–5 也考虑并否弃了它）[^sidgwick-1907]。在这种观点看来，谦逊的人相对于理想来评价自己，却相对于实践规范来评价他人。所以谦逊的人有理由认为自己不太好（与圣徒之类的理想相比），也有理由认为他人是好的（相对于多数人实际有多好而言）。有两套尺度，谦逊的人便能对自己与他人作出准确的评价，尽管所用的评价标准不同。（另见下文的不对称说明。）
    step2: |-
      另一类强准确论诉诸不同的评价尺度。这一类由 Brennan（2007）主张，他把它归到亚当·斯密（Adam Smith）名下（见《道德情操论》（*Theory of Moral Sentiments*）6.3.22–23；Sidgwick 1907/1981, 334–5 曾考虑并否弃这一说法）[^sidgwick-1907]。照这套看法，谦逊的人拿理想来衡量自己，却拿实践常规来衡量别人。于是谦逊的人有理由认为自己不算好（比起圣徒之类的理想），也有理由认为别人是好的（就多数人实际的样子而言）。两套尺度在手，谦逊的人便能准确评价自己和他人，只是所依的评价标准不同。（另见下文的不对称说明。）
