      尽管它常被当作一种认知观点来谈（见 Zagzebski 1996）[^zagzebski-1996]，人们也把它当作一种道德德性来讨论。Arpaly（2011）把它视为一种出于道德关切而在不固执己见的情况下改变自己信念的倾向。McRae（2016）也认为它涉及道德关切，但也涉及愿意考虑别的自我叙事，并把它与佛教传统中的平静联系起来。这把开放心态描绘为对某些涉及自我及自我在世界中位置的心理习惯的摆脱。
    step2: |-
      人们常把思想开明当作认知立场来谈（见 Zagzebski 1996）[^zagzebski-1996]，却也把它当作道德德性来讨论。Arpaly（2011）视之为一种倾向：出于道德上的关切去改变自己的信念，而不固执己见。McRae（2016）也认为其中有道德关切，但同时还有愿意考虑另一些自我叙事的成分，并把它同佛教传统里的平静相联。如此描画下来，思想开明便是从某些关涉自我及自我在世界中位置的心理习惯中脱身。
