      Since modesty is a matter of knowing the equal moral worth of all people, defenders of this view sometimes deny that modesty is a dependent virtue since one can have the relevant knowledge while lacking any good qualities oneself (see Ben-Ze’ev 1993)[^ben-ze’ev-1993]. They also sometimes deny that immoral people, or people who deny the equal moral worth of everyone, can ever be modest at all; see Nuyen (1998, 107) and Statman (1992, 434).
    step1: |-
      既然谦逊在于知道所有人平等的道德价值，这一观点的捍卫者有时否认谦逊是依附性德性，因为一个人可以在自己没有任何好品质的情况下拥有相关的知识（见 Ben-Ze’ev 1993）[^ben-ze’ev-1993]。他们有时也否认不道德的人、或者否认人人平等道德价值的人，能够做到谦逊；见 Nuyen（1998, 107）与 Statman（1992, 434）。
    step2: |-
      既然谦逊在于知道人人道德价值平等，这一派有时便否认谦逊是依附性德性——相关的知识可以同自身毫无好品质并存（见 Ben-Ze’ev 1993）[^ben-ze’ev-1993]。他们有时还否认：不道德的人，或者不承认人人道德价值平等的人，根本不可能谦逊。见 Nuyen（1998, 107）与 Statman（1992, 434）。
