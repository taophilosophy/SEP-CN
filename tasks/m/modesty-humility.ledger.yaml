      This account is set against the background of a more general account of virtue. Driver defends a consequentialist account of virtue where traits are virtuous when they, in general, produce good effects (Driver, 2001). This view of virtue makes it easy to accommodate morally virtuous traits that involve epistemic defects since some epistemic defects might turn out to produce better effects in the long run. Accounts of virtue inspired by Aristotle, however, make virtue a matter of practical wisdom which makes moral virtue incompatible with epistemic defects. It’s important to note that while Driver’s early work makes modesty require ignorance, the weaker claim that moral virtue is compatible with ignorance is enough to make problems for Aristotelian accounts of virtue (see Driver 1999)[^driver-1999]. Accuracy accounts of modesty and humility are largely responses to Driver that are typically motivated to deny the idea that moral virtue can require, or even be compatible with, ignorance and false belief.
    step1: |-
      这一说明放在一个更一般的德性说明的背景之下。Driver 捍卫一种后果论的德性说明，其中各种品性在总体上产生好效果时就是德性的（Driver, 2001）。这种德性观很容易容纳那些涉及认知缺陷的道德德性品性，因为某些认知缺陷在长远看来可能产生更好的效果。然而，受亚里士多德启发的德性说明把德性视为实践智慧的事，这就使道德德性与认知缺陷不相容。要注意的是，Driver 的早期工作使谦逊要求无知，但“道德德性与无知相容”这一较弱的论断，已经足以给亚里士多德式的德性说明制造麻烦（见 Driver 1999）[^driver-1999]。关于谦逊与谦卑的准确论说明，很大程度上是对 Driver 的回应，其动机通常是反对“道德德性能够要求、甚至能够与无知和假信念相容”这一想法。
    step2: |-
      这套说明背后是一个更一般的德性观。Driver 主张后果论的德性观：一种品性只要总体上产生好效果，便是德性（Driver, 2001）。这样的德性观很容易安顿那些带认知缺陷的道德品性——某些认知缺陷从长远看，说不定效果更好。受亚里士多德启发的德性观则把德性系于实践智慧，道德德性于是与认知缺陷不能并存。值得注意的是，Driver 早期的工作固然要谦逊以无知为条件，但“道德德性与无知相容”这个较弱的论断，已足以为亚里士多德式的德性说明添麻烦（见 Driver 1999）[^driver-1999]。关于谦逊与谦卑的准确论说明，大体都是对 Driver 的回应，动机多半是反对“道德德性竟能要求、乃至兼容无知与假信念”这一想法。
