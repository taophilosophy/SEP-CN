      Hurka (2001, 110–111) sees modesty and humility as virtues of proportion. For him, attitudes should be proportionate to the absolute goodness of their object. This involves a denial of an asymmetry that some (Maes 2004)[^maes-2004] see as central to modesty; one’s responses should track absolute goodness regardless of whether the object is our own good qualities or those of another. Though he acknowledges that this will involve some cognitive states, what must be proportionate for Hurka are positive responses like pleasure or enjoyment. This account requires accuracy in the sense that one’s responses must be accurately proportioned to the goodness of the object, but not in the sense that it requires accurate beliefs about one’s own good qualities.
    step1: |-
      Hurka（2001, 110–111）把谦逊与谦卑视为比例的德性。在他看来，态度应当与其对象的绝对善成比例。这涉及否认一种不对称，而有些人（Maes 2004）[^maes-2004] 认为这种不对称是谦逊的核心；一个人的反应应当追随绝对善，不论对象是我们自己的优良品质还是他人的优良品质。尽管他承认这会涉及某些认知状态，但对 Hurka 来说必须成比例的是诸如快乐或享受这样的积极反应。这一说明要求准确，含义是反应必须与对象的善准确成比例，而不是说它要求关于自身优良品质的准确信念。
    step2: |-
      Hurka（2001, 110–111）把谦逊与谦卑看作比例的德性（virtues of proportion）。在他看来，态度应当与对象的绝对善成正比。这就否认了一种不对称，而 Maes（2004）[^maes-2004] 等人认为这种不对称正是谦逊的核心：人的反应应当跟随绝对善，无论对象是自己的好品质还是别人的好品质。Hurka 承认这里牵涉某些认知状态，但在他看来必须成比例的是快乐、享受这类积极反应。这套说明也要准确，但这准确指的是反应与对象的善准确成比例，而不是说要有关于自身好品质的准确信念。
