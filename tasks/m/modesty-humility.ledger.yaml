      Anti-expertise highlights the limits of what attitudes we can take to our own epistemic states and faculties. Disagreement raises similar issues in a social context by considering how one should respond to disagreement with others who have similar evidence and faculties as you. For conciliation views, the disagreement itself is a type of higher-order evidence that warrants you to be less confident in your own position (see Christensen 2010)[^christensen-2010]. For steadfast views, such disagreement should not alter your confidence in your own view (see Kelly 2005 and 2010)[^kelly-2010][^kelly-2005].
    step1: |-
      反专长突显了我们能对自己认知状态与官能采取何种态度的限度。分歧在社会语境中提出类似问题：一个人应当如何回应与自己证据和官能相似的他人之间的分歧。对调和论观点来说，分歧本身就是一种高阶证据，使你理应对自己的立场不那么自信（见 Christensen 2010）[^christensen-2010]。对坚定论观点来说，这类分歧不应当改变你对自己观点的信心（见 Kelly 2005 与 2010）[^kelly-2010][^kelly-2005]。
    step2: |-
      反专长显出我们能对自己认知状态与认知官能取何种态度的限度。分歧把同类问题挪到社会语境里：面对证据与官能都跟你相仿的他人，你该怎样回应彼此的分歧。调和论（conciliation views）认为，分歧本身就是一种高阶证据，使你有理由对自己原先的立场少几分自信（见 Christensen 2010）[^christensen-2010]。坚定论（steadfast views）则认为，这类分歧不该动摇你对自己观点的信心（见 Kelly 2005 与 2010）[^kelly-2010][^kelly-2005]。
  - id: 77
    kind: body
    source: |-
      Like modesty, the epistemology of disagreement in part turns on whether or not we have a special relationship with our own states aside from more general agent-neutral considerations (see Christensen 2007, 335ff.)[^christensen-2007]. This affects how we should relate to our own beliefs and how to respond when such beliefs conflict with those of others. This is relevant to responding to rival philosophical views; see Barnett (forthcoming).
    step1: |-
      像谦逊一样，关于分歧的认识论在某种程度上取决于：除了更一般的行动者中立的考虑之外，我们是否与自己的状态有特殊关系（见 Christensen 2007, 335 以下）[^christensen-2007]。这影响我们应当如何面对自己的信念，以及当这些信念与他人的信念冲突时应当如何回应。这与回应相互竞争的哲学观点相关；见 Barnett（待刊）。
    step2: |-
      与谦逊相仿，分歧的认识论在某种程度上取决于一件事：撇开那些行动者中立的考虑，我们与自己的状态是否还有一种特殊关系（见 Christensen 2007, 335 以下）[^christensen-2007]。这既影响我们如何看待自己的信念，也影响这些信念同别人的信念冲突时该怎么回应。回应相争的哲学观点也与此相关；见 Barnett（待刊）。
