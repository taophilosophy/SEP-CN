  - id: 14
    kind: body
    source: |-
      Modesty has several key features that theoretical accounts aim to capture. These are explicitly stated in Driver (1989 and 2001) and are taken up in most work on modesty since then.
    step1: |-
      谦逊有几个关键特征，是各种理论说明力图把握的。这些特征在 Driver（1989 与 2001）中被明确列出，此后关于谦逊的多数研究都加以采纳。
    step2: |-
      谦逊有几个关键特征，各种理论说明都要设法把它们抓住。这些特征在 Driver（1989 与 2001）中被明确列出，此后的多数研究都沿用了这份清单。
  - id: 15
    kind: body
    source: |-
      **Dependent Virtue:** Slote (1983, 61ff) notes that modesty is a dependent virtue. One is modest *about* something else that is good, about their success or intelligence. In this sense, modesty requires the existence of another good quality. This is typically taken to be something objectively good rather than simply something that the person *thinks* is good, though most views can accommodate either intuition. Most views assume that the good quality in question is a good quality of the person who is modest, though Bommarito (2013, 94) broadens the scope to allow modesty about the good qualities in others when they reflect on us, as when one is modest about the achievements of their child, nation, or local sports teams. Others, such as Ben-Ze’ev (1993) and Um (forthcoming), go further and deny that modesty is a dependent virtue at all.
    step1: |-
      **依附性德性：** Slote（1983, 61 以下）指出，谦逊是一种依附性德性。人是就某件别的好东西而谦逊的，就自己的成功或聪明而谦逊的。在这个意义上，谦逊要求另一种好品质的存在。这通常被理解为客观上好的东西，而不只是这个人*认为*好的东西，不过多数观点对两种直觉都能容纳。多数观点假定，所说的好品质是谦逊者自己的好品质，尽管 Bommarito（2013, 94）拓宽了范围，允许就他人身上那些反映到我们身上的好品质而谦逊，例如一个人就自己孩子、国家或本地球队的成就而谦逊。另一些人，如 Ben-Ze’ev（1993）与 Um（待刊），走得更远，干脆否认谦逊是依附性德性。
    step2: |-
      **依附性德性：** Slote（1983, 61 以下）指出，谦逊是一种依附性德性，人总是就着别的某种好东西而谦逊，就着自身的成功或聪明而谦逊。如此说来，谦逊以另一种好品质的存在为前提。这种东西通常算作客观上好的东西，而不仅是当事人自认为好的东西；多数观点两者都能容纳。多数观点还假定，这种好品质属于谦逊者本人；Bommarito（2013, 94）则放开了范围：只要他人的好品质映照到我们身上，也可以为之谦逊——比如为自己的孩子、国家或主队的成绩而谦逊。Ben-Ze’ev（1993）与 Um（待刊）等人更进一步，索性否认谦逊是依附性德性。
  - id: 16
    kind: body
    source: |-
      **False Modesty:** Theories of modesty also need to be able to distinguish modesty from false modesty. That is, some people who are not modest can act as if they are. This rules out accounts of modesty that are entirely behavioral. If being modest is simply a matter of certain external behaviors, then there would be no way to distinguish modesty from false modesty. Modesty and humility require certain mental states in addition to overt behaviors.
    step1: |-
      **虚假的谦逊：** 关于谦逊的理论还必须能够把谦逊与虚假的谦逊区分开。也就是说，有些不谦逊的人能够装出谦逊的样子。这就排除了完全以行为来界定谦逊的说明。如果谦逊只是某些外在行为的事，那就没有办法把谦逊与虚假的谦逊区分开。谦逊与谦卑除了外显行为之外，还要求某些心理状态。
    step2: |-
      **伪谦逊：** 关于谦逊的理论还得能分辨真谦逊与假谦逊。不谦逊的人照样能装出一副谦逊的样子，所以纯粹以行为来界定谦逊的说明就此出局。倘若谦逊只是某些外在举止的事，那就无从把它同伪谦逊区分开。谦逊与谦卑除了外显行为，还需要某些内心状态。
  - id: 17
    kind: body
    source: |-
      **Self-Attribution Strangeness:** Self-predications of modesty and humility are, at least in general, self-undermining. This is highlighted by Sorensen (1988, 120ff) and Driver (1989, 375) who note that the sentence “I am modest” is a distinctly *im*modest thing to say. Though Raterman (2006, 232) and Bommarito (2013, 113) describe contexts in which saying “I am modest” is not self-undermining, self-ascriptions of modesty are, in general, self-undermining. It is important to note that this need not be about public utterances; a person seems less modest for *thinking* about how modest they are. Bernard Williams, for example, writes that “… it is a notorious truth that a modest person does not act under the title of modesty” (1993, 10). That is, a modest person does not think of themselves as acting modestly, while a just person typically does think of themselves as acting justly.
    step1: |-
      **自我归属的怪异性：** 对谦逊与谦卑的自我谓述，至少在一般情况下，是自我拆台的。Sorensen（1988, 120 以下）与 Driver（1989, 375）着重指出了这一点，他们注意到“我很谦逊”这句话说的是一件分明*不*谦逊的事。尽管 Raterman（2006, 232）与 Bommarito（2013, 113）描述了说“我很谦逊”并不自我拆台的一些语境，但谦逊的自我归属一般而言仍是自我拆台的。重要的是要注意，这不一定关乎公开的言说；一个人若*思考*自己有多谦逊，他似乎就不那么谦逊了。例如伯纳德·威廉斯写道：“……一个众所周知的事实是，谦逊的人不会以谦逊的名义行事”（1993, 10）。也就是说，谦逊的人并不认为自己是在谦逊地行事，而公正的人通常会认为自己在公正地行事。
    step2: |-
      **自我归属的怪异性：** 把谦逊或谦卑说成自己的属性，通常不免自我拆台。Sorensen（1988, 120 以下）与 Driver（1989, 375）都强调了这一点：“我很谦逊”恰恰是最不谦逊的一句话。Raterman（2006, 232）与 Bommarito（2013, 113）固然指出过某些语境下说“我很谦逊”并不自我拆台，但一般而言，自我归属谦逊仍不免如此。值得注意的是，问题不限于公开说出口：一个人只要心里盘算自己有多谦逊，他就似乎不那么谦逊了。伯纳德·威廉斯（Bernard Williams）就写道：“……众所周知，谦逊的人并不会以谦逊为名行事”（1993, 10）。意思是：谦逊的人并不觉得自己行事谦逊，公正的人却通常觉得自己行事公正。
