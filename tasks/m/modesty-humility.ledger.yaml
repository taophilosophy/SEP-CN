    source: |-
      Philosophical work on modesty and humility brackets several senses of these terms. Philosophical accounts typically do not aim, for example, to capture uses of ‘modest’ that apply to objects as when we say “He lives in a modest house” or “She has a modest income”. The sexual sense of modesty, involving dress and behavior that presents a non-sexual image, is typically also bracketed (see Driver 1989, Statman 1992, Bommarito 2013)[^bommarito-2013][^driver-1989][^statman-1992], though some accounts aim to capture this use of the term as well; see Schueler (1997, 482), McMullin (2010, 785–786), and Wilson (2014, 79).
    step1: |-
      关于谦逊与谦卑的哲学工作搁置了这两个词的若干含义。例如，哲学上的说明通常并不打算涵盖 “modest” 用于事物的用法，如我们说“他住着一栋 modest 的房子”或“她的收入 modest”。谦逊在性方面的含义——涉及呈现非性化形象的穿着与举止——通常也被搁置（见 Driver 1989, Statman 1992, Bommarito 2013）[^bommarito-2013][^driver-1989][^statman-1992]，不过有些说明也力图涵盖这个词的这一用法；见 Schueler（1997, 482）、McMullin（2010, 785–786）与 Wilson（2014, 79）。
    step2: |-
      哲学界对谦逊与谦卑的讨论，把这几个词的若干义项搁在一边。比如，哲学上的说明通常并不打算囊括 “modest” 形容物件的用法——“他住在一所简朴的房子里”“她收入微薄”。谦逊在性方面的含义，即关乎穿着与举止所呈现的非性化形象的那一层，通常同样被搁置（见 Driver 1989, Statman 1992, Bommarito 2013）[^bommarito-2013][^driver-1989][^statman-1992]。不过也有一些说明意在兼顾这个词的这一用法，见 Schueler（1997, 482）、McMullin（2010, 785–786）与 Wilson（2014, 79）。
  - id: 11
    kind: body
    source: |-
      There is disagreement about both terms and concepts. Many theorists treat the terms ‘modesty’ and ‘humility’ as interchangeable. Hare (1996), Schueler (1997), Hurka (2001), Raterman (2006), Garcia (2006), Kellenberger (2010), and Um (forthcoming), to name just a few, all treat the terms as referring to more or less the same phenomenon. Others take the different terms to refer to very different concepts. There is some historical precedent for this; Aquinas, for example, considers both modesty and humility to be types of temperance (see *Summa Theologica* 2.2 Q.160 and Foley 2004)[^foley-2004].
    step1: |-
      在语词与概念两方面都存在分歧。许多论者把 “modesty” 与 “humility” 这两个词当作可以互换。Hare（1996）、Schueler（1997）、Hurka（2001）、Raterman（2006）、Garcia（2006）、Kellenberger（2010）与 Um（待刊），仅举数例，都把这些词视为指称大体相同的现象。另一些人则认为，不同的词指称很不相同的概念。这有历史先例；例如托马斯·阿奎那就把谦逊与谦卑都视为节制的类型（见《神学大全》2.2 Q.160 与 Foley 2004）[^foley-2004]。
    step2: |-
      分歧既在语词，也在概念。许多论者把 “modesty” 与 “humility” 视为可互换之词。Hare（1996）、Schueler（1997）、Hurka（2001）、Raterman（2006）、Garcia（2006）、Kellenberger（2010）与 Um（待刊）等，这还只举了几位，都把这些词看作指称大体相同的现象。另一些人却认为，不同的语词所指的概念很不一样。这么看也有历史先例：例如托马斯·阿奎那（Thomas Aquinas）就把谦逊与谦卑都算作节制（temperance）的分支（见《神学大全》（*Summa Theologica*）2.2 Q.160 与 Foley 2004）[^foley-2004]。
  - id: 12
    kind: body
    source: |-
      Among those who do draw a distinction between the concepts, there is little agreement about what exactly the difference is. For some, the difference is between public and private domains. Statman (1992, 438n45) claims that modesty has an external domain while humility does not and Sinha (2012, 265) says that modesty is public while humility is private. For others, they have different epistemic requirements: Ben-Ze’ev (1993, 240) and Nuyen (1998, 101) claim that humility involves underrating oneself, while modesty does not. Driver (1998, 378f5), however, claims the opposite making modesty involve underrating and humility not. This article will take both terms to refer to a general response to one’s own goodness or achievements and will use the term that the author under consideration uses when discussing particular views.
    step1: |-
      在那些确实对两个概念加以区分的人中间，关于区别究竟何在，几乎没有共识。对一些人来说，区别在于公共领域与私人领域。Statman（1992, 438n45）声称谦逊有一个外在的领域，谦卑没有；Sinha（2012, 265）则说谦逊是公共的，谦卑是私人的。对另一些人来说，二者有不同的认知要求：Ben-Ze’ev（1993, 240）与 Nuyen（1998, 101）声称谦卑涉及低估自己，谦逊则不然。然而 Driver（1998, 378f5）主张的恰好相反，认为谦逊涉及低估，谦卑不涉及。本文将把两个词都视为对自身之善或成就的一种普遍回应，并在讨论具体观点时，随相关作者所用的那个词。
    step2: |-
      就算确实要在两个概念之间划线，划在哪里也众说纷纭。有人认为，分别在于公域与私域：Statman（1992, 438n45）说谦逊有对外的领域，谦卑则没有；Sinha（2012, 265）说谦逊属于公共场合，谦卑属于私人领域。也有人认为，分别在于认知要求：Ben-Ze’ev（1993, 240）与 Nuyen（1998, 101）主张谦卑包含自我低估，谦逊不包含；Driver（1998, 378f5）却说相反，把低估归给谦逊，不归给谦卑。本文把这两个词都看作人对自己之善或成就的一般回应，讨论各家观点时，随原作者用哪个词就用哪个词。
