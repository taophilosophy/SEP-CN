      6. *符号学*。皮尔士是这里的奠基人物，见 Carter 2014；应用于 PMP 的工作见 Gastaldi 2024; Wagner 2017; Waszek 2024。
      7. *文化进路*。Wilder 1981 可视为先声；与 PMP 的关联见 Larvor 2016a 的近期工作。
