    source: |-
      “Philosophy of Mathematical Practice” (PMP) refers to a broad cluster of approaches in the philosophy of mathematics. These approaches share a common focus on philosophical issues arising from actual mathematical practice. It is also characteristic of PMP to consider philosophical problems in the context of specific historical or current mathematical practices. While there have been attempts to more precisely define the notion of mathematical practice, all that needs to be understood by this, as a first approximation, is mathematics as practiced by mathematicians ranging from heuristic informal strategies to formalized developments.
    step1: |-
      “数学实践的哲学”（Philosophy of Mathematical Practice，缩写 PMP）指数学哲学中一大批彼此相近的进路。这些进路有一个共同的关注点：由实际数学实践引出的哲学问题。PMP 的另一个特征，是把哲学问题放到具体的、历史的或当下的数学实践语境中来考量。虽然已有不少尝试想更精确地界定“数学实践”这个概念，但作为初步理解，只需把它理解为数学家们所从事的数学即可——从启发式的非正式策略到形式化的发展，都在其列。
    step2: |-
      “数学实践的哲学”（Philosophy of Mathematical Practice，缩写 PMP）指数学哲学中一大批彼此相近的进路。这些进路有一个共同关注点：由实际数学实践引出的哲学问题。PMP 的另一特征，是把哲学问题放到具体数学实践的语境——历史的或当下的——中来考量。界定“数学实践”概念的更精确尝试虽有多种，但作为初步理解，只需把它理解为数学家所从事的数学即可：从启发式的非正式策略到形式化的发展，都在其列。
  - id: 2
    kind: body
    source: |-
      Typically, approaches within PMP reject a-historical conceptions of mathematics and are open to interdisciplinary research. PMP has been characterized by an innovative focus on aspects of mathematics largely neglected in 20ᵗʰ-century analytic philosophy of mathematics. Foundational concerns and the problem of access to abstract mathematical entities, despite their importance, resulted in an impoverished approach to the philosophy of mathematics, which was often limited to the discussion of set theory and arithmetic. The questions philosophers of mathematical practice ask call for a dramatic extension of the domain of philosophical investigation as conceived in the previous tradition, as well for alternative perspectives on traditional problems. Examples of such questions are: Why do mathematicians prove the same theorem multiple times? Are there virtues of proofs other than correctness? What is mathematical explanation? What are the epistemic roles of visualization in mathematics? What are mathematical notations, and how do they function? What constitutes progress in mathematics, and how is it achieved? How does the use of computational tools influence mathematical practice? Not all these questions are new, and PMP recognizes its debt to certain aspects of investigation that had emerged from Lakatos’ (1976) approach to the philosophy of mathematics as well as to particular trends of investigations (such as Maddy 1997)[^maddy-1997] within the more traditional analytic philosophy of mathematics.
    step1: |-
      通常来说，PMP 内部的各种进路都拒斥非历史的数学观，并对跨学科研究持开放态度。PMP 的显著特点，是创新性地聚焦于 20 世纪分析数学哲学大体忽略的数学面向。基础问题与抽象数学对象的可达性问题固然重要，但围绕它们的研究却造成了一种贫瘠的数学哲学——它往往被局限于对集合论与算术的讨论。数学实践哲学家提出的问题，要求把先前传统所设想的哲学研究疆域大幅扩展，也要求对传统问题给出另类视角。这类问题的例子有：数学家为什么反复证明同一定理？证明除正确性之外还有别的德性吗？什么是数学解释？可视化在数学中扮演什么认识论角色？数学记号是什么，如何起作用？数学中的进步由什么构成，又如何达成？计算工具的使用如何影响数学实践？这些问题并非全是新的；PMP 也承认自己受惠于若干探究脉络——既有从拉卡托斯（Lakatos 1976）的数学哲学进路中生长出来的，也有更传统的分析数学哲学内部的特定潮流（如 Maddy 1997）[^maddy-1997]。
    step2: |-
      通常，PMP 内部的各种进路都拒斥非历史的数学观，并对跨学科研究持开放态度。PMP 的显著特点，是创新性地聚焦于 20 世纪分析数学哲学大体忽略的数学面向。基础问题与抽象数学对象的可达性问题固然重要，围绕它们的研究却造成了一种贫瘠的数学哲学：其讨论往往局限于集合论与算术。数学实践哲学家提出的问题，要求把先前传统所设想的哲学研究疆域大幅扩展，也要求对传统问题给出另类视角。这类问题例如：数学家为什么反复证明同一定理？证明除正确性之外还有别的德性吗？什么是数学解释？可视化在数学中有什么认识论角色？数学记号是什么，如何起作用？数学中的进步由什么构成，又如何达成？计算工具的使用如何影响数学实践？这些问题并非全是新的；PMP 也承认自己受惠于若干探究脉络——既有从拉卡托斯（1976）的数学哲学进路中生长出来的，也有更传统的分析数学哲学内部的特定潮流（如 Maddy 1997）[^maddy-1997]。
  - id: 3
    kind: body
    source: |-
      PMP pushes the boundaries of the philosophy of mathematics by endorsing a broad conception of what areas of mathematics should be object of philosophical attention, extending the range of questions, and introducing new methodologies. Although the philosophy of mathematical practice is placed under the heading ‘the Future’ in the entry on philosophy of mathematics, it has dramatically increased in popularity in the past decades and has generated a remarkable amount of philosophical research. For instance, a considerable number of articles in PMP are included in the recent massive volume (of more than 3,000 pages) *Handbook of the History and Philosophy of Mathematical Practice* (Sriraman 2024)[^sriraman-2024]. Moreover, some of the themes first canvassed within the philosophy of mathematical practice are becoming of more general interest. Indeed, in some cases, such as explanation in mathematics – a topic whose analysis was pioneered by philosophers of mathematical practice – the area has become one of the most widely discussed by analytic philosophers of mathematics.
    step1: |-
      PMP 拓展了数学哲学的边界：它主张数学的哪些领域应成为哲学关注对象，对此持一种宽泛的理解；它扩充问题的范围；它引入新的方法论。虽然数学实践的哲学在“数学哲学”词条中被归入“未来”一栏，但过去几十年里它的受欢迎程度急剧上升，产生的哲学研究成果也相当可观。例如，近年出版的皇皇巨著《数学实践史与哲学手册》（*Handbook of the History and Philosophy of Mathematical Practice*，三千余页，Sriraman 2024）[^sriraman-2024]就收录了大量 PMP 方面的文章。不仅如此，数学实践的哲学率先探讨的某些主题，如今正获得更普遍的关注。确实，在某些情形下——比如数学中的解释，这一专题的分析正是由数学实践哲学家开创的——该领域已成为分析数学哲学中被讨论得最多的领域之一。
    step2: |-
      PMP 拓展了数学哲学的边界：它对哪些数学领域应成为哲学关注对象持宽泛的理解，扩充问题的范围，并引入新的方法论。数学实践的哲学虽在“数学哲学”词条中被归入“未来”一栏，过去几十年里却人气急升，产出的哲学研究成果相当可观。例如，近年出版的皇皇巨著《数学实践史与哲学手册》（*Handbook of the History and Philosophy of Mathematical Practice*，三千余页；Sriraman 2024）[^sriraman-2024]就收录了大量 PMP 方面的文章。不仅如此，数学实践的哲学率先探讨的某些主题，如今正获得更普遍的关注。在某些情形下——例如数学中的解释，这一专题的分析正是由数学实践哲学家开创的——该领域已成为分析数学哲学中被讨论最多的领域之一。
