      Although most results within PMP deploy traditional philosophical methodology, they tend to endorse a *bottom-up* rather than a *top-down* approach. In other words, they tend to draw philosophical conclusions by basing them on the detailed analysis of case studies rather than on general principles. In addition, focusing on mathematical practice provides solutions specific to mathematics to general epistemological problems, such as the problem of access to abstract objects, that might not generalize across the board (Panza 2024)[^panza-2024].
    step1: |-
      PMP 内部的大多数成果虽采用传统哲学方法论，但倾向于自下而上而非自上而下的进路。换句话说，它们倾向于通过个案研究的细致分析来得出哲学结论，而不是从一般原则出发。此外，聚焦数学实践还能为一般认识论问题——如抽象对象的通达问题——提供数学特有的解法，而这些解法未必能普遍推广（Panza 2024）[^panza-2024]。
