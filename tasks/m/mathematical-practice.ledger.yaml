      Another motivation to look at the practice comes from philosophical issues that emerged from taking seriously the history of mathematics. One important precursor of PMP is Imre Lakatos’ *Proofs and Refutations* (1976). In his rational reconstruction of a historical case study from combinatorial topology (Euler’s theorem on polyhedra), Lakatos emphasized the quasi-empirical nature of the development of mathematics in which previously accepted arguments and results could be refuted by counterexamples by yielding new, more general theorems. This challenged the view of mathematics as a static body of a priori knowledge held in place by an unshakable foundation in a Euclidean axiomatic style. Moreover, it opened new topics of investigation, such as the nature of mathematical rigor and the process of mathematical discovery, the role of fruitful definitions, and the explanatory value of mathematical theories.
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      Lakatos rejects the separation of the contexts of discovery and justification, and puts forward a view of mathematics as dynamic, tentative, and fallible. This perspective on mathematics was deeply influenced by George Polya’s (1945) writings on heuristics. Lakatos also raised some very broad questions about mathematics and its development: how does mathematics grow? What is progress in mathematics? These topics were the focus, among other contributions, of the collection Breger and Grosholz 2000.
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      Lakatos’ work had an impact in the work of many scholars who count as major contributors to PMP. See Gillies 2023 for a discussion of several contributions along the lines of a historical approach to the philosophy of mathematics that reveal the influence of Lakatos’ approach. Gillies’ discussion includes some of the most active philosophers in PMP.
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      Lakatos’ account was also criticized, and it is not clear how it could be extended to contemporary mathematics (Feferman 1978)[^feferman-1978]. Moreover, his sample was very narrow: one case from topology and one case from real analysis (on Cauchy). To repeat, many studies in the history of mathematics have provided ample material for analysis by philosophers of mathematical practice but some areas of investigation have seen a convergence of perspectives coming from different approaches. We are thinking for instance of the diagrammatic reasoning in Euclid’s *Elements* as developed by Manders (2008), who was coming from a philosophical perspective, and Netz (1999), who merged cognitive and historical motivations.
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      ### 2.4 Alternative Foundations
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      Beyond the impasses the foundational schools encountered, we can identify both global and local challenges to the set-theoretic foundationalist picture of mathematics. Global challenges derive from the development of category theory as an alternative foundation of mathematics as well as from the recent program in homotopy type theory. Local challenges, which we discuss in the next section, derived from what some consider a change in the nature of proofs, due to technological advancements. Thus, the ultimate nature of the set-theoretic foundation of mathematics is not only challenged by the mathematics of the past but also by more recent developments in mathematics.
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      Set theory is generally understood to provide the standard foundational apparatus for mathematics. Still, there are ongoing debates on the acceptability of some axioms. The status of the Axiom of Choice and of the Continuum Hypothesis as well as the use of Large Cardinal Axioms remain topics of debate that are significant for the practice of set theory. Interesting questions for the philosophy of mathematical practice here concern the rationale for the choice of new axioms (see for instance Maddy 2011)[^maddy-2011] and the intertwined nature of philosophical motivation and mathematical developments that is characteristic of the attempts to overcome the incompleteness of set theory. See Rittberg 2020 for an overview of two recent programs, those of Woodin and Hamkins, and further references.
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      With the advent and increasing popularity of category theory, the special role of set theory has been challenged. Category theory offers an alternative perspective on mathematics, one that does not seem to be in need of an account of mathematical objects, such as sets and numbers. Looking at mathematics from the perspective of category theory thus naturally leads to new philosophical questions. Here we need to distinguish two questions: 1) Can category theory claim to be a foundations of mathematics on a par, or even with better features, than set theory? The debate on this topic has been quite lively. 2) Does category theory display novel and interesting features (independently of its possible role as a foundations of mathematics) which can be of relevance to PMP? The answer to the latter question should be an unequivocal Yes both on account of the role that category theory plays in the formulations of important mathematical theories as well as on account of the attention that philosophers of mathematical practice have displayed towards it. Further readings in the history and philosophy of category theory include (Awodey 2008, 1996; Krömer 2007; Landry 2017; Landry and Marquis 2005; Marquis 2009; McLarty 2005, 2008, 1992)[^awodey-2008][^krömer-2007][^landry-2017][^landry-2005][^marquis-2009][^mclarty-2005]. For a general overview, see Marquis 2023.
    step1: TBD
    step2: TBD
  - id: 73
    kind: body
    source: |-
      Of course, challenges to set theory as foundations of mathematics in the constructivist tradition have been countless, but we cannot survey them here (however, see the section below for some comments on homotopy type theory). Once again, attention to mathematical practice is essential in this area as one would like to know how much of classical mathematics can be given a constructivist or computational meaning. An excellent, if now outdated, reference in this area remains Beeson 1985; for more recent work see Bridges et al. 2023.
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      ### 2.5 Technological Developments
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      Local challenges to the foundationalist picture came from technological advancements that led to rethink the nature of mathematical proofs. For instance, the existence of computer-assisted proofs has put pressure on the idea that proofs should be the kind of arguments that a single mathematician could survey.
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      When Kenneth Appel and Wolfgang Haken (1977) announced a computer-assisted proof of the 4-color conjecture, this brought to the forefront a novel aspect of the way in which mathematics proceeds. The conjecture states that all planar maps can be colored with only four colors in such a way that no two adjacent regions share the same color. It entered the agenda of mathematicians in the mid-19th century, but a genuine proof was first published after more than a century. Appel and Haken’s proof raised much ado in both the mathematical and the philosophical community. Being beyond the reach of flash-and-blood mathematicians, it challenged the very nature of mathematical proofs and questioned the a priori status of mathematical knowledge (Detlefsen and Luker 1980; Tymoczko 1979)[^detlefsen-1980][^tymoczko-1979]. For a defense of the a priori nature of computer-assisted proofs, see (Burge 1998; Duede and Davey 2026)[^burge-1998][^duede-2026].
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      Another development that is worth mentioning is one related to Interactive Theorem Provers (ITP). These are computer tools supposed to help mathematicians in creating formal counterparts of their proofs. They are gaining traction among some mathematicians, but their use is still limited. However, some think that in the not so distant future, their use will be much more common, at least in some areas of mathematics (Avigad 2018b; Buzzard 2022; Avigad 2024)[^avigad-2018b][^avigad-2024][^buzzard-2022]. For a philosophical discussion, see (De Toffoli 2024).
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      The use of ITPs is also linked to alternative foundations of mathematics. As a matter of fact, in the last part of his career, Vladimir Voevodsky contributed to the effort of developing homotopy type theory (HoTT) as a new foundational framework for mathematics that could be more readily integrated into ITPs (Voevodsky 2014 – see Other Internet Resources). Voevodsky’s main motivation in developing and promoting ITPs was related to worries related to the correctness of published mathematical results. For a useful set of contributions on different foundations approaches such as set theory and homotopy type theory see Centrone, Kant, and Sarikaya 2019.
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      ITPs have been used to check the correctness of traditional proofs. Moreover, they have also been deployed to check the correctness of computer-assisted proofs, whose epistemological status remains somewhat borderline. One of the first major achievements in the formalization of mathematics is George Gothier’s formalization of a proof of the 4-color Theorem in 2005. Another major achievement is the formalization of Tom Hales’ proof of the Kepler Conjecture, which extensively used automated computations, by him and a group of collaborators (Hales et al. 2017)[^hales-2017].
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      The use of technology in mathematics is continuing to grow, and new AI tools are already posing new philosophical challenges. See, for example, the contribution in the Special Issue of the *Bulletin of the American Mathematical Society* dedicated to the topic (Fraser et al. 2024)[^fraser-2024].
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      Another area of interest, which has been aided by technological developments, is experimental mathematics. The *Handbook in the History and Philosophy of Mathematical Practice* (Sriraman 2024)[^sriraman-2024] contains many articles devoted this topic – see, among others (Carter 2024a; Sørensen 2024)[^carter-2024a][^sørensen-2024].
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      ### 2.6 Ecumenical and Anti-Foundationalist PMP
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      Not all philosophers of mathematical practice share the same attitude towards more foundationalist traditions. We propose to make a distinction between an ecumenical stance, adopted by philosophers of mathematical practice who see their work as complementary to foundational endeavors, and an anti-foundationalist stance, taken up by those who position themselves in straight opposition to them.
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      Early authors working on what came to be called the philosophy of mathematical practice prefaced their studies with an explicit and often polemical rejection of what they considered to be the received view. For example, Lakatos (1976) explicitly argued against a ‘deductivist’ view of mathematics, while Tymoczko (1986) and Aspray and Kitcher (1988) saw in foundationalist approaches their primary target. To emphasize the radical nature of their view, the latter presented themselves as part of the “maverick tradition” in philosophy of mathematics.
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      In addition to creating an ideological rift within the philosophy of mathematics, this narrative also ignored the fact that philosophers within the foundationalist tradition itself had begun to criticize foundationalist approaches (Putnam 1967; Quine 1951)[^putnam-1967][^quine-1951] and to pursue new questions related to contemporary mathematics (Maddy 1996)[^maddy-1996].
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      The ecumenical stance does not oppose foundational efforts. It considers them to be valuable contributions to the philosophy of mathematics while at the same time recognizing that there are other important questions to be addressed. This stance is well-exemplified in the volume “The Philosophy of Mathematical Practice” (Mancosu 2008b)[^mancosu-2008b]. On the contrary, the anti-foundationalist stance directly opposes foundationalist efforts. A contribution adopting this stance is Corfield 2003. Even within the analytic framework, one can perceive anti-foundationalist features in the work of Maddy (1997), at least to the extent that her naturalism rejects a philosophy-first approach and she embraces a methodology that sits uncomfortably with the traditional foundationalist programs.
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
    source: |-
      While the ecumenical stance sees the developments in the philosophy of mathematics as an extension of the topics and the perspectives which fall under the purview of philosophy of mathematics, the anti-foundationalist stance sees it as an irreconcilable split between different approaches and traditions. The latter is made explicit in the “brief and biased history” of philosophy of mathematics by Aspray and Kitcher (1988), who identify two traditions that are centered around two general research programs: (1) the *mainstream*, which started with Frege and is centered around questions regarding the foundations of mathematics; and (2) a much less developed, *maverick tradition* that began with Lakatos. Philosophical topics within the latter tradition deal with current or historical mathematical practices and include the growth of mathematical knowledge, the nature of mathematical progress, the criteria for evaluating mathematical ideas and theories, and the nature of mathematical explanation.
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      On the relation between these two traditions, Aspray and Kitcher find no consensus among philosophers of mathematics. Some, such as Parsons, Steiner and Maddy, suggest that they are compatible, while others, such as Lakatos and Kitcher, have argued on the basis of the methodology of mathematics, that there is no a priori foundation of mathematics (thus concluding that the Fregean tradition leads to a dead end). The question whether philosophy of mathematics should be concerned with identifying foundations of mathematics is singled out as provoking “the clearest divisions in the volume” that they edited.
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      A philosopher who explicitly opposes research on the foundations of mathematics is Carlo Cellucci (2006, 32), who speaks of the “rejection” of the dominant view in the philosophy of mathematics that considers the justification of mathematics, rather than mathematical discovery, as its main problem. He rejects more ecumenical approaches as being an extension of mainstream philosophy of mathematics, but not as a proper alternative.
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      In a similar vein, David Corfield sees himself as continuing the Lakatos tradition in philosophy of mathematics and he clearly takes a side with regard to the question regarding its relation to foundationalist philosophy of mathematics. He speaks of dismantling the “foundationalist filter” that has held back philosophers from taking seriously past and contemporary mathematics, because of their inability of providing novel contributions to the foundationalist questions, and he presents his discussion as a head-on confrontation of such “erroneous beliefs” (Corfield 2003, 5)[^corfield-2003]. Reactions have been mixed: Unsurprisingly, Corfield’s “anti-foundationalist manifesto” has irked some philosophers (Paseau 2005, 195)[^paseau-2005], while for others that are more sympathetic to the general approach “Corfield’s project is not nearly as radical as he would have us think” (Arana 2007, 83)[^arana-2007].
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      In the next section, we include a brief survey of what we consider to be among the most important topics that have been investigated within PMP. They all fall under the umbrella heading of epistemic virtues in mathematics.
    step1: TBD
    step2: TBD
