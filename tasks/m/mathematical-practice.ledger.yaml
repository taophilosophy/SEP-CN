    kind: body
    source: |-
      ## 3. Epistemic Virtues in Mathematics
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      At first, it might seem strange to appeal, in reference to mathematics, to a notion like virtue, which is traditionally associated with ethics or moral theory. Aristotle famously discussed moral and intellectual virtues, the former to be fostered through the development, by means of training, of the appropriate character traits and the latter through teaching and experience for developing the appropriate intellectual traits. The bearers of such virtues are human subjects and/or their actions although much recent work in virtue theory (Hursthouse and Pettigrove 2023)[^hursthouse-2023] has also considered extensions to groups (e.g., a just jury, a fair-minded committee) and institutions (honesty and generosity might be predicated of some such entities). Moreover, in connection with intellectual virtues, groups and institutions might display open-mindedness, originality, etc. It is thus not surprising that talk of moral and intellectual virtues can be applied to the more specific agents involved in scientific activities: we can certainly speak of honesty, courage, justice (the area of epistemic injustice is an important area of contemporary epistemology; see Fricker 2009; Turri, Alfano, and Greco 2021)[^fricker-2009], practical wisdom, understanding, open-mindedness etc. By now the original surprise originated by bringing together virtues with a scientific area such as mathematics might appear to weaken. However, things are more complex. Indeed, it is not clear that intellectual and moral virtues display the same features in all areas of human activity (and thus also in mathematical activity) as opposed to receiving specific inflections in different areas. For instance, one could reasonably think of the opposite of certain virtues as vices. And now we encounter the paradoxical situation that certain virtues might turn out to obstruct, in some circumstances, the *telos* of the discipline whereas certain vices might promote the *telos*.
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      Consider the intellectual virtue of rigor in mathematics. The word “rigor” suffers from the process/product ambiguity we already discussed: it may mean that a mathematician proceeds rigorously in her investigation or that a product of the mathematical activity (e.g., a theorem or a theory) is rigorous. We embrace this ambiguity here because in general when speaking about mathematics we have to consider both the activities of the mathematicians as well as the products of their activities. So, rigor would seem a quintessential positive virtue in mathematics, both when attributed to the agent doing mathematics as well as to the product of that activity. And yet it turns out that rigor can be an obstructive virtue: the mathematicians of the seventeenth century (starting from Descartes and Fermat on to Leibniz and Newton) had to abandon the rigor characteristic of Greek mathematics, for it had become detrimental to the progress of the discipline. It also appears that certain vices can be productive with respect to the end-goals of the discipline. Cases of mathematical environments driven by lack of intellectual humility, epistemic injustice, and sheer aggressiveness have been known to stimulate the epistemic exposure of a mathematical community to a vast range of new mathematics. A famous case is that of the Gelfand seminar in Moscow (Tanswell and Kidd 2021; Gerovitch 2016)[^gerovitch-2016][^tanswell-2021] but it is by no means unique.
    step1: TBD
    step2: TBD
  - id: 95
    kind: body
    source: |-
      Thus far, we have discussed aspects of moral and intellectual virtues that apply to mathematicians and communities of mathematicians as agents who are the bearers of the ascription of such virtues (Aberdein, Rittberg, and Tanswell 2021; Tanswell 2017)[^tanswell-2017][^tanswell-2021]. While we think that this is an extremely interesting part of the story, our interest here is in epistemic virtues as they apply to the products of mathematical activities. Mathematicians prove theorems, create theories, provide definitions, make conjectures, and do many more things in their work. The products of these activities (proofs, theories, definitions, conjectures, etc.) have objective features that mathematicians themselves have characterized through reference to epistemic virtues. And it is the task of philosophers of mathematics to try to make sense of the objective properties that justify the ascription of such virtues to the relevant mathematical products/objects.
    step1: TBD
    step2: TBD
  - id: 96
    kind: body
    source: |-
      In “The Philosophy of Mathematical Practice”, Mancosu wrote:
    step1: TBD
    step2: TBD
  - id: 97
    kind: body
    source: |-
      > If mathematicians cared only about the truth of certain results, it would be hard to understand why after discovering a certain mathematical truth they often go ahead to prove the result in several different ways. This happens because different proofs or different presentations of entire mathematical areas (complex analysis etc.) have different epistemic virtues. Explanation is among the most important virtues that mathematicians seek. Very often the proof of a mathematical result convinces us that the result is true but does not tell us why it is true. Alternative proofs, or alternative formulations of entire theories, are often given with this explanatory aim in mind. (2008a, 15)
    step1: TBD
    step2: TBD
  - id: 98
    kind: body
    source: |-
      But explanatoriness is only one of the epistemic virtues that can be applied to the products of a mathematical activity (in this case proofs and theories). Another very important virtue is purity of methods, namely the idea that the proof of a certain mathematical statement should appeal only to concepts that appear in the statement itself and not make appeal to “remote” or “foreign” concepts. The notion of purity has played an important role in the history of mathematics – consider, for instance, the elimination of geometrical intuition from the development of analysis in the 19ᵗʰ century – and in a way it underlies all the investigations concerning issues of conservativity in contemporary proof theory. That purity is often cherished in mathematical practice is made obvious by the fact that Selberg was awarded the Fields Medal (the equivalent of the Nobel Prize in mathematics) for, among other things, the elementary proof of the prime number theorem (already demonstrated with analytical tools in the late 19ᵗʰ century).
    step1: TBD
    step2: TBD
  - id: 99
    kind: body
    source: |-
      Alongside purity and explanatoriness, two further epistemic virtues are particularly important in mathematical practice: rigor and visualizability. Mathematical rigor ensures the reliability of mathematical results and distinguishes genuine proofs from mere persuasive arguments. Yet, rigor is not a fixed notion – it evolves with mathematical methods and technologies. Visualizability concerns instead the cognitive accessibility of mathematical reasoning: the capacity to grasp a proof, concept, or structure through visual or spatial representations such as different kinds of diagrams. Far from being in tension with rigor, visualizability often supports our understanding of proofs.
    step1: TBD
    step2: TBD
  - id: 100
    kind: body
    source: |-
      The list of epistemic virtues could be easily added to: depth, simplicity, ontological parsimony, epistemic economy, rigor, fruitfulness, beauty, generalizability, etc. (Morris 2024)[^morris-2024]. Rather than try to address all of them we will consider here purity of methods, explanation, rigor, and visualizability which are arguably the areas in which progress has been more substantial. For the other epistemic virtues, we will limit ourselves to some bibliographical references.
    step1: TBD
    step2: TBD
  - id: 101
    kind: body
    source: |-
      ### 3.1 Purity of Methods
    step1: TBD
    step2: TBD
  - id: 102
    kind: body
    source: |-
      Purity of methods refers to a cluster of issues which emerge in mathematical practice and whose analysis leads to several issues of great philosophical relevance. It is not uncommon in mathematics to see efforts leading to the request that a certain problem (or theorem) should be solved (resp. proved) using only conceptual resources that belong to the mathematical discipline in which the problem (or theorem) is stated or only through conceptual resources that are somehow already mentioned or are implicit in the statement of the problem (resp. theorem). Examples abound but typical instances of the former type of purity are Bolzano’s (1817 [1996]) analytic proof of the intermediate value theorem which eschewed any appeal to geometry or mechanics in favor of a purely analytic proof or the number theoretic proof of Jacobi’s four square theorem which was first proved by Jacobi using elliptic integrals and only later received an elementary number theoretic proof (Arana 2024)[^arana-2024]. The type of purity that is relevant to Bolzano’s proof has been called *geographical purity*. Mathematical disciplines can be compared to countries on a map (whose boundaries can change with time) and the request is that one should not go beyond the (conceptual) boundaries of the discipline to find a solution or a proof for a certain problem or theorem. In the case of Bolzano’s intermediate value theorem, geometry and analysis were seen by Bolzano as two different mathematical disciplines with the principles of analysis not dependent on those of geometry (by contrast, Bolzano considered geometry as an applied area of analysis). Hence a purely analytic proof of the intermediate value theorem (or any other theorem of analysis) should not appeal to principles of geometry which are “foreign” to the disciplinary area to which the theorem belongs. Same reasoning for the use of transcendental techniques (elliptic integrals, complex analysis, Fourier series, etc.) that were deployed in Jacobi’s original proof of the four-square theorem (i.e., “the number of representations of *n* as a sum of four squares is 8 times the sum of the positive divisors of *n* that are not divisible by 4”). Elementary number theory as a discipline has its own disciplinary boundaries which concern properties of the integers and concepts from complex analysis, integrals, etc. are foreign to it. But the statement of Jacobi’s four-square theorem is a statement about elementary properties of the integers. Hence the request for a proof of the theorem that only uses concepts from elementary number theory. Such a proof was given by Jacobi himself in 1834 (seven years after he had published his “transcendental” proof) by “translating” the transcendental proof into a number theoretic proof; later, other mathematicians gave other number-theoretic proofs that were not mere translations of Jacobi’s original proof; see Arana 2024. Engel (1987) brings the request for purity in number theory clearly to the fore:
    step1: TBD
    step2: TBD
  - id: 103
    kind: body
    source: |-
      > Number theory deals with the properties of integers, so one should actually demand that it prove all of its theorems without leaving the realm of integers. But there is still a long way to go before she can do that. A good number of apparently extremely simple theorems have hitherto only been able to be proved with the use of an enormous apparatus of transcendent means, of theorems from the theory of elliptic functions, and the like. (cited in Arana 2024, 20)[^arana-2024]
    step1: TBD
    step2: TBD
  - id: 104
    kind: body
    source: |-
      The cases just discussed concern purity with respect to disciplinary boundaries. There are however issues of purity that emerge even within a given disciplinary area. For instance, one might focus on what is mentioned in a problem or theorem one is interested in and request that the concepts deployed in the solution or proof do not go beyond those mentioned in the problem or theorem at hand. Hilbert gives voice to such request in his discussion of Desargues’ theorem in projective geometry:
    step1: TBD
    step2: TBD
  - id: 105
    kind: body
    source: |-
      > This theorem gives us an opportunity now to discuss an important issue. The content [Inhalt] of Desargues’ theorem belongs completely to planar geometry; for its proof we needed to use space. Therefore we are for the first time in a position to put into practice a critique of means of proof. In modern mathematics such criticism is raised very often, where the aim is to preserve the purity of method [die Reinheit der Methode], i.e. to prove theorems if possible using means that are suggested by the content of the theorem. (Hilbert 2004 cited in Arana and Mancosu 2012, 315–316)[^arana-2012][^hilbert-2004]
    step1: TBD
    step2: TBD
  - id: 106
    kind: body
    source: |-
      While Hilbert’s discussion concerns alternative proofs of the plane version of Desargues’ theorem in projective geometry, the request for purity here addresses finer boundary lines than mere disciplinary ones, namely the legitimacy of using spatial concepts or metric concepts for proving a statement which only appeals to plane projective concepts. One often refers to this phenomenon as *topical purity*.
    step1: TBD
    step2: TBD
  - id: 107
    kind: body
    source: |-
      The above examples are hopefully clear enough to bring out the kind of mathematical practice from which a philosophical analysis of purity emerges. In addition to the study of specific cases of purity in mathematical practice, philosophers of mathematical practice have addressed the following questions: what are the epistemic virtues of purity and those of impurity, respectively (on impurity as an epistemic virtue see Lehet 2021a; Ryan 2021; Blue 2025)[^blue-2025][^lehet-2021a][^ryan-2021]? Is it in general true that impurity leads to shorter proofs? How does purity relate to explanation? What is the proper notion of “content” of a statement needed to articulate a fruitful notion of purity? Should one look for more than one notion of “content” depending on different notions of purity? How does one articulate the major varieties of purity found in mathematical practice? For instance, Arana (2024) articulates the distinction corresponding to the examples we mentioned above by distinguishing “geographical” and “topical purity”, but other notions of purity are also brought to the fore in his book: “elemental” and “syntactic” purity, among others. The notion of “elemental” purity can be formulated as follows: the proof of a theorem is elementally pure if it only draws on what is more elementary than the theorem itself. But “more elementary” can be cashed out either in cognitive or metaphysical terms and this leads to issues in epistemology and metaphysics. This is not the place to enter into details but hopefully what has been said is sufficient to provide a sense of the area. The reader with find an up-to-date investigation of the topic in Arana 2024. Among other recent contributions see: Arana 2023; Arana and Mancosu 2012; Arana and Stafford 2023; Detlefsen 2008; Detlefsen and Arana 2011; Ferraro and Panza 2012; Giovannini, Haeusler, and Lassalle Casanave 2024; Hallett 2008.
    step1: TBD
    step2: TBD
  - id: 108
    kind: body
    source: |-
      ### 3.2 Mathematical Explanation
    step1: TBD
    step2: TBD
  - id: 109
    kind: body
    source: |-
      Just like purity of methods, the topic of mathematical explanation finds its roots in scientific and mathematical practice. On the one hand, mathematics is often appealed to in explanations provided in the natural or social sciences and this raises the question of the exact role of mathematics in the economy of such explanations. On the other hand, within mathematics one often distinguishes, for instance, between explanatory versus non explanatory theories or proofs. Of the many new areas studied in the philosophy of mathematical practice, mathematical explanation is arguably the one that has witnessed the most impressive development. Here we will limit ourselves to a presentation of some of the major areas of work and some essential bibliography. For a more comprehensive overview see (Mancosu, Poggiolesi, and Pincock 2023; Pincock 2023)[^pincock-2023].
    step1: TBD
    step2: TBD
  - id: 110
    kind: body
    source: |-
      Mathematics plays a central role in our scientific picture of the world. How the connection between mathematics and the world is to be accounted for remains one of the most challenging problems in philosophy of science, philosophy of mathematics, and general philosophy. A very important aspect of this problem is that of accounting for the explanatory role mathematics seems to play in the account of physical phenomena. Consider the following example from evolutionary biology introduced in Baker 2005 and discussed extensively in the philosophical literature. It has to do with the life-cycle of the so-called ‘periodical’ cicada. It turns out that three species of such cicadas:
    step1: TBD
    step2: TBD
  - id: 111
    kind: body
    source: |-
      > …share the same unusual life-cycle. In each species the nymphal stage remains in the soil for a lengthy period, then the adult cicada emerges after 13 years or 17 years depending on the geographical area. Even more strikingly, this emergence is synchronized among the members of a cicada species in any given area. The adults all emerge within the same few days, they mate, die a few weeks later and then the cycle repeats itself. (Baker 2005, 229)[^baker-2005]
    step1: TBD
    step2: TBD
  - id: 112
    kind: body
    source: |-
      Several questions have been raised about this specific type of life cycle but one of them is why such periods are prime. One explanation appeals to the biological claim that cicadas that minimize intersection with other cicadas’ and predators’ life cycles have an evolutionary advantage over those that do not. The mathematical component of the explanation complements the biological claim by pointing out that prime periods minimize intersection. Baker concludes that:
    step1: TBD
    step2: TBD
  - id: 113
    kind: body
    source: |-
      > The explanation makes use of specific ecological facts, general biological laws, and number theoretic result. My claim is that the purely mathematical component [prime periods minimize intersection (compared to non-prime periods)] is both essential to the overall explanation and genuinely explanatory on its own right. In particular it explains why prime periods are evolutionarily advantageous in this case. (2005, 233)
    step1: TBD
    step2: TBD
  - id: 114
    kind: body
    source: |-
      While not everyone agrees as to the role of mathematics in the above explanation, or whether it is an explanation, it is clear that one of the reasons why philosophers are especially interested in such explanations is that they appear to be counterexamples to the claim that all explanations in the natural sciences must be causal. The dominant accounts of scientific explanation in the natural sciences have been causal accounts: to provide an explanation of a scientific fact is to provide its cause or the mechanism yielding the fact. In the last two decades there have been major contributions in the study of non-causal explanations in the sciences (for a recent volume devoted to the issue see Reutlinger and Saatsi 2018)[^reutlinger-2018]. And since many of the non-causal explanations that have been discussed in the literature are mathematical explanations, this area of philosophy of science is fueled by concerns related to the nature of scientific explanation.
    step1: TBD
    step2: TBD
  - id: 115
    kind: body
    source: |-
      There are two major areas in which the discussion of whether mathematics can play an explanatory role in science makes itself felt. The first concerns issues of modeling and idealization in science and more generally, as pointed out above, the nature of scientific explanation. The second, concerns the nominalism-platonism debate. By and large the former area is a major concern to philosophers of science. The latter is the preoccupation of those philosophers of mathematics primarily concerned with issues of mathematical ontology. In the latter area one of the major focal points of the discussion have been on so-called ‘enhanced indispensability arguments’–for general accounts, see (Colyvan 2001, 2024; Panza and Sereni 2016; Paseau and Baker 2023)[^colyvan-2001][^panza-2016][^panza-2016-2][^paseau-2023]. There is actually a variety of classical indispensability arguments but the general structure of the argument runs as follows. One begins with the premise that mathematics is indispensable for our best science. But, second premise, we ought to believe our best theories. Thus, we ought to be committed to the kind of entities that our best theories quantify over. In general this is an argument in favor of Platonism, as our best science quantifies over mathematical entities. Several versions of the indispensability argument rely on a holistic conception of scientific theories according to which the ontological commitments of the theory is determined by looking at all the existential claims implied by the theory. However, no attention is paid to how the different parts of the theory might be responsible for different posits and to the different roles that the latter might play. Baker (2005) offers a version of the indispensability argument that does not depend on holism. Baker starts from a debate between Colyvan (2001, 2002) and Melia (2000, 2002) that saw both authors agreeing that the prospects for a successful platonist use of the indispensability argument rests on examples from scientific practice in which the postulation of mathematical objects results in an increase of those theoretical virtues which are provided by the postulation of theoretical entities. Both authors agree that among such theoretical virtues is explanatory power. Such explanations give a new twist to the indispensability argument. The argument now runs as follows.
    step1: TBD
    step2: TBD
  - id: 116
    kind: body
    source: |-
      1. There are genuinely mathematical explanations of empirical phenomena
      2. We ought to be committed to the theoretical posits postulated by such explanations; thus,
      3. We ought to be committed to the entities postulated by the mathematics in question.
    step1: TBD
    step2: TBD
  - id: 117
    kind: body
    source: |-
      Baker (2005) provided the example of the prime period of the cicadas already introduced above, in an attempt to argue that in this particular case the role of the mathematics involved was clearly explanatory and not merely descriptive and thus that this type of explanation was exactly of the sort needed for an enhanced indispensability argument. The discussion since then has developed in many directions including attempts to characterize descriptive and explanatory roles of mathematics in the natural sciences, the discussion of many more cases of mathematical explanations (in physics, biology, medicine and the social sciences), the validity of the enhanced indispensability argument, the nature of inferences to the best explanation, and other issues. To provide the reader with a sense of the growth of the secondary literature in this area, it is enough to note that more than twenty articles discuss Baker’s cicada example directly.
    step1: TBD
    step2: TBD
  - id: 118
    kind: body
    source: |-
      Lyon and Colyvan 2008 also contains a much-discussed example from evolutionary biology. Why do hive-bee honeycombs have a hexagonal structure? The nature of the question is contrastive: why hexagonal as opposed to, say, any other polygonal figure or combination thereof? Part of the explanation depends on evolutionary facts. Bees that use less wax and thus spend less energy have a better chance at evolving via natural selection. The explanation is completed by pointing out that ‘any partition of the plane into regions of equal area has perimeter at least that of the regular hexagonal honeycomb tiling’. Thus, the hexagonal tiling is optimal with respect to dividing the plane into equal areas and minimizing the perimeter. This fact, known as the ‘honeycomb conjecture’ was proved in Hales 2001 (see also Hales 2000)[^hales-2000]. The explanation of the biological fact seems to depend essentially on a mathematical fact. Just like the cicada example, this case has been extensively discussed in the literature.
    step1: TBD
    step2: TBD
  - id: 119
    kind: body
    source: |-
      Let us now move to explanations within mathematics. Much mathematical activity is driven by factors other than justificatory aims such as establishing the truth of a mathematical fact. In many cases, mere knowledge that something is the case will be considered unsatisfactory and this will lead mathematicians to probe the situation further to look for better explanations of the facts. This might take the form of, just to give a few examples, providing alternative proofs for known results, giving an account for surprising analogies, or recasting an entire area of mathematics on a new basis in the pursuit of a more satisfactory ‘explanatory’ account of the area.
    step1: TBD
    step2: TBD
  - id: 120
    kind: body
    source: |-
      An interesting case is that of Gregory Brumfiel, a real algebraic geometer. In his book “Partially ordered rings and semi-algebraic geometry” (1979), Brumfiel contrasts different methods for proving theorems about real closed fields. One method of proof consists in using a so-called transfer principle which allows one to infer the truth of a sentence for all real closed fields from its being true in one real closed field, say the real numbers. Despite the fact that the transfer principle is a very efficient tool, Brumfiel does not make any use of it, and he is very clear about this.
    step1: TBD
    step2: TBD
  - id: 121
    kind: body
    source: |-
      > In this book we absolutely and unequivocally refuse to give proofs of this second type [the one relying on the transfer principle]. Every result is proved uniformly for all real closed ground fields. Our philosophical objection to transcendental proofs [those relying on the transfer principle] is that they may logically prove a result but they do not explain it, except for the special case of real numbers. (Brumfiel 1979, 166)[^brumfiel-1979]
    step1: TBD
    step2: TBD
  - id: 122
    kind: body
    source: |-
      Brumfiel prefers a third proof method which aims at giving non transcendental proofs of purely algebraic results. This does not mean that he restricts himself to just elementary methods; he does use stronger tools but it is crucial that they apply uniformly to all real closed fields. For an analysis of Brumfiel’s explanatory program see (Hafner and Mancosu 2008)[^hafner-2008].
    step1: TBD
    step2: TBD
  - id: 123
    kind: body
    source: |-
      The above example is one in which an entire area of mathematics is organized favoring certain proofs (which, according to the author, possess explanatory virtue) over others (which lack explanatory virtue). One could easily provide myriads of statements by mathematicians contrasting explanatory and non-explanatory proofs of the same theorem or explanatory talk applied other aspects of mathematics that do not reduce to proofs. We will only provide one more example taken from a book by Mordell where dissatisfaction for the lack of explanatoriness of certain Euclidean proofs is at stake:
    step1: TBD
    step2: TBD
  - id: 124
    kind: body
    source: |-
      > Even when a proof has been mastered, there may be a feeling of dissatisfaction with it, though it may be strictly logical and convincing; such as, for example, the proof of a proposition in Euclid. The reader may feel that something is missing. The argument may have been presented in such a way as to throw no light on the why and wherefore of the procedure or on the origin of the proof or why it succeeds. (1959, 11)
    step1: TBD
    step2: TBD
  - id: 125
    kind: body
    source: |-
      This sense of dissatisfaction will often lead to a search for a more satisfactory proof. Mathematicians appeal to this phenomenon often enough. While early work in the area (see Sandborg 1997 and Hafner and Mancosu 2005)[^hafner-2005][^mancosu-2005][^mancosu-2005-2][^sandborg-1997] had attempted to sample the variety of mathematical explanations and the extent of their recognition in mathematical practice by limited search tools, a combination of experimental philosophy (Pease, Aberdein, and Martin 2019) and application of AI using large language models (D’Alessandro forthcoming; Meja-Ramos et al. 2019)[^meja-ramos-2019] have recently been deployed to map in more systematical ways the extent of explanatory talk both in the making of mathematics (the ‘back’ of mathematics) as well as in the final outcome of such research (the ‘front’ of mathematics).
    step1: TBD
    step2: TBD
  - id: 126
    kind: body
    source: |-
      Mathematical explanations of mathematical facts have a distinguished pedigree as they are already singled out by Aristotle in his distinction between ‘proof of the fact’ and ‘proof of the reasoned fact’. The distinction played a role in the development of the philosophy of mathematics and is still at the core of the accounts of philosophy of mathematics propounded by Bolzano and Cournot, two major philosophers of mathematics in the nineteenth century. They construe the central problem of philosophy of mathematics as that of accounting for the distinction between explanatory and nonexplanatory demonstrations. In the case of Bolzano this takes the form of a theory of Grund (ground) and Folge (consequence). Kitcher (1975) was the first to read Bolzano as articulating a theory of mathematical explanation. In the case of Cournot this is spelled out in terms of the opposition between “ordre logique” and “ordre rationnel” (see Cournot 1851; Mancosu 1999)[^cournot-1851][^mancosu-1999]. In Bolzano’s case, the aim of providing a reconstruction of parts of analysis and geometry, so that the exposition would use only “explanatory” proofs, also led to major mathematical results, such as his purely analytic proof of the intermediate value theorem. There is another tradition of thinking of explanation in mathematics that includes Mill, Lakatos, Russell and Gödel. These authors are motivated by a conception of mathematics (and/or its foundations) as hypothetico-deductive in nature and this leads them to construe mathematical activity in analogy with how explanatory hypotheses occur in science (see Mancosu 2001 for more details)[^mancosu-2001].
    step1: TBD
    step2: TBD
  - id: 127
    kind: body
    source: |-
      There are several accounts on offer of mathematical explanation and it is not possible here to list them all or in any detail. Various classification schemes can also be used to classify such accounts. For instance, Chris Pincock (2023) uses the opposition between monism (mathematical explanations can be reduced to a single explanatory relevance relation) and pluralism (mathematical explanations display a multiplicity of explanatory relevance relations) as the watershed for classifying the major accounts on offer, but other criteria are also possible.
    step1: TBD
    step2: TBD
  - id: 128
    kind: body
    source: |-
      Among the major accounts are those of Steiner (1978), Kitcher (1989), Lange (2017), and Pincock (2015a, 2015b, 2025). A variety of counterfactual accounts have also been proposed in the last decade (by, among others, Reutlinger, Baron, Colyvan, Ripley, and Povich; for a critical survey of the counterfactual accounts see the extended discussion in Chapter 1 of Pincock 2023)[^pincock-2023].
    step1: TBD
    step2: TBD
  - id: 129
    kind: body
    source: |-
      Another point is the relationship between explanation and understanding. While nobody denies that explanation is connected to understanding, some scholars have been trying to characterize explanation in terms of understanding and have developed so-called *epistemic* accounts of mathematical explanation (see Inglis and Mejía Ramos 2021; Frans and Van Kerkhove 2023; for a critique of such approaches, see Chudnoff and De Toffoli 2025. See also Lehet 2021b; D’Alessandro and Lehet 2024)[^chudnoff-2025][^d’alessandro-2024][^frans-2023][^inglis-2021][^lehet-2021b].
    step1: TBD
    step2: TBD
  - id: 130
    kind: body
    source: |-
      ### 3.3 Mathematical Rigor
    step1: TBD
    step2: TBD
  - id: 131
    kind: body
    source: |-
      Rigor is perhaps the most paradigmatic of the epistemic virtues associated with mathematical proof. Proofs should be rigorous. More than that, a putative proof that is not rigorous is not a genuine proof, so proofs *must* be rigorous. To call a proof rigorous means that it successfully establishes that its conclusion follows from its premises through acceptable deductive steps. Rigorous proofs are contrasted with proof sketches, flawed arguments, and mere plausibility claims. As with other epistemic virtues, rigor admits of a process/product ambiguity: one may say that a mathematician proceeds rigorously, or that a proof or theory is itself rigorous. We will focus on the latter.
    step1: TBD
    step2: TBD
  - id: 132
    kind: body
    source: |-
      While mathematicians are generally satisfied with being able to recognize rigorous proofs, the main philosophical challenge around rigor is to provide a clear characterization of it. Historically, rigor has been implemented in different ways. With its axiomatic structure, Euclidean geometry strived for an ideal of rigor where all primitive objects were defined in advance and all propositions were deduced from other propositions, going back to the postulates. A relaxation of this ideal was introduced with the development of the calculus in the 18ᵗʰ century. This relaxation involved the use of unreliable methods, such as those involving infinitesimals and infinite series. This gave rise to a counter-tendency, known as the “rigorization” or “arithmetization” of analysis, which implied, for instance, a ban on intuitive reasoning in analysis (Hahn 1980; Burgess 2015)[^burgess-2015][^hahn-1980].
    step1: TBD
    step2: TBD
  - id: 133
    kind: body
    source: |-
      Even if we can talk about mathematical rigor before the rigorization of analysis that culminated at the beginning of the 20ᵗʰ century, the problem surrounding mathematical rigor that we face today has clearer contours than its historical counterparts and can only be stated with the aid of modern logic. From the standpoint of logic, rigor guarantees that the premises of an argument logically imply its conclusion. It is through breakthroughs in logic in the 1920s and 30s that the semantic conception of logical implication was linked to syntactic notions of deducibility. Gödel proved his completeness theorem in 1929. By the 1940s, it was widely accepted that any rigorously established modern mathematical result admits a formal derivation from the axioms of set theory.
    step1: TBD
    step2: TBD
  - id: 134
    kind: body
    source: |-
      Through these results, one major aspect of the contemporary problem of rigor can be articulated as a problem about the relationship between informal proofs, which are the common currency among mathematicians, and formal proofs, or derivations in a specific formal system, that are the logicians’ ideal of proof. Or, even more precisely, about the relationship between informal and formal provability (Leitgeb 2009)[^leitgeb-2009]. The question is: how can informal proofs guarantee the existence of formal proofs without being one? That is: how can the perspective of the working mathematicians match that of logicians?
    step1: TBD
    step2: TBD
  - id: 135
    kind: body
    source: |-
      From the perspective of working mathematicians, informal proofs are sufficient to establish a mathematical proposition. This does not mean that mathematicians do not believe that a formal derivation of such a proposition does not exist, but simply that the criteria of acceptability for proofs often do not depend on formal proofs:
    step1: TBD
    step2: TBD
  - id: 136
    kind: body
    source: |-
      > In some cases, mathematicians don’t accept a proof because it is formalizable; they accept a proof for other reasons (e.g., visualizations they know to be reliable), and then they infer that it is formalizable. (De Toffoli 2021b, 1787)
    step1: TBD
    step2: TBD
  - id: 137
    kind: body
    source: |-
      That is, correctness is equated to formalizability, but the latter is not used as evidence – it is rather a consequence:
    step1: TBD
    step2: TBD
  - id: 138
    kind: body
    source: |-
      > [W]e do not need to invoke formal verification for empirical support. Mathematical disputes over the correctness of a proof generally hinge on the complexity of the argument and the difficulty of filling in the details, not on the correctness of any single, atomic inference. In practice, mathematicians generally expect that if a step in a proof is correct, it can be spelled out in detail, reducing it to inferences that are mathematically immediate. And we have seen enough logic by now to know that such inferences are generally amenable to formalization. (Avigad 2021, 3–4)[^avigad-2021]
    step1: TBD
    step2: TBD
  - id: 139
    kind: body
    source: |-
      Even if formalizability is not often used as support, evidence that formalization is impossible is generally taken as evidence that a result cannot be proven *tout court* (for a contrary opinion, see Weatherall and Wolfson forthcoming). Consider the independence results; everyone agrees that mathematicians would waste their time trying to prove the Continuum Hypothesis using conventional means. This holds more generally. Evidence of non-formalizability is evidence that something has gone awry:
    step1: TBD
    step2: TBD
  - id: 140
    kind: body
    source: |-
      > should it become clear that the implications (of assumptions to conclusion) of an informal proof cannot be replicated by a formal analogue, the status of that informal proof as a successful proof will be rejected. (Azzouni 2009, 14)[^azzouni-2009]
    step1: TBD
    step2: TBD
  - id: 141
    kind: body
    source: |-
      And formalizability, or at least partial formalizability, has also been invoked to explain the extraordinary consensus that contemporary mathematicians enjoy. According to Wagner (2022), historically, mathematical consensus on the validity of proof was much less widespread. The current robust agreement is a modern development, consolidating around the turn of the 20ᵗʰ century. Wagner proposes that this modern consensus is best explained not by the ubiquitous use of full formalizations – which are rare – but by formalization acting as a sort of hierarchical court of appeal for resolving disputes.
    step1: TBD
    step2: TBD
  - id: 142
    kind: body
    source: |-
      Let’s take stock. Mathematicians generally accept the perspective of logicians in thinking that a formal counterpart of their informal proof must exist, at least in principle. They also use partial formalizations to resolve disputes. The contemporary philosophical problem of rigor then concerns how to put together these two perspectives on proof: that of the working mathematicians and that offered by logicians. In other words, it is about the connection between traditional, or informal proofs, and derivations in formal systems, or formal proofs.
    step1: TBD
    step2: TBD
  - id: 143
    kind: body
    source: |-
      According to what is often called the “Standard View,” a mathematical proof is rigorous if and only if it can be translated into a formal derivation in some canonical deductive system. This, however, is a family of views rather than a single position (see Burgess and De Toffoli 2022; Hamami 2022; Tanswell 2024)[^burgess-2022][^hamami-2022][^tanswell-2024][^tanswell-2024-2]. What does it mean exactly, “translated”? Philosophers of mathematical practice have often emphasized the distance between formal and informal proofs, thus challenging the Standard View or at least some of its strict interpretations.
    step1: TBD
    step2: TBD
  - id: 144
    kind: body
    source: |-
      In the last century, the Standard View has been popularized by Bourbaki and was explicitly endorsed by Mac Lane:
    step1: TBD
    step2: TBD
  - id: 145
    kind: body
    source: |-
      > A Mathematical proof is rigorous when it is (or could be) written out in the first order predicate language […] In practice, a proof is a sketch, in sufficient detail to make possible a routine translation of this sketch into a formal proof. (Mac Lane 1986, 377)[^mac-1986]
    step1: TBD
    step2: TBD
  - id: 146
    kind: body
    source: |-
      Hamami (2022) critically assesses the origins of the Standard View and further develops the idea of “routine translation.” In his view, this can be decomposed into a three-stage algorithmic procedure: (i) make the informal argument explicit at a “higher-level,” (ii) unpack those higher-level moves into more basic steps, and (iii) formalize those basic steps in a suitable system.
    step1: TBD
    step2: TBD
  - id: 147
    kind: body
    source: |-
      Recent concrete efforts towards the formalization of mathematics with the aid of *Interactive Theorem Provers* (e.g., Lean, Coq, Isabelle) align well with the Standard View. Interactive Theorem Provers are software that help mathematicians create formal proofs from their informal arguments. Some of the proponents of these tools are even thinking that mathematical practice is about to face a new rigorization trend driven by emerging technologies that are going to make formalization much easier than before (Avigad 2024; Buzzard 2024; see also De Toffoli 2024; Granville 2024; Harris 2024 for philosophical discussions)[^avigad-2024][^buzzard-2024][^granville-2024][^harris-2024]. The dream of some scholars involved in the formalization of mathematics is to develop reliable auto-formalization systems that combine traditional symbolic methods with neural AI (Wu et al. 2022).
    step1: TBD
    step2: TBD
  - id: 148
    kind: body
    source: |-
      An early proponent of the Standard View is Steiner (1975), who claims that to get to a formal proof we can start from an informal proof and proceed simply by “filling in the gaps.” This strict interpretation of the connection between formal and informal proofs, however, poses some problems with respect to the use of representations and diagrams (De Toffoli and Giardino 2016; Larvor 2012)[^larvor-2012], an issue we turn to in the next section. Burgess (2015) develops a more moderate version of the Standard View.
    step1: TBD
    step2: TBD
  - id: 149
    kind: body
    source: |-
      Some philosophers of mathematical practice felt the need to oppose the Standard View because they thought that it threatened to *reduce* informal proofs to formal proof (in the same way that, according to some, mathematics was “reduced” to set theory). However, it is not clear whether proponents of the Standard View have this aim in mind. In any case, looking at the practice of mathematics, it is clear that informal proofs achieve much more than the justification of a particular result and cannot be reduced to derivations. This is an aspect that has been highlighted by philosophers of mathematical practice.
    step1: TBD
    step2: TBD
  - id: 150
    kind: body
    source: |-
      It is in this context that, at the turn of the last century, a debate was carried out in a series of papers between Azzouni and Rav. By focusing on different functions of proofs, Rav (1999, 2007) put forward an account according to which proofs cannot be reduced to formal derivations. Contra Rav, Azzouni (2004a, 2006, 2009) argued that proofs *indicate* derivations.
    step1: TBD
    step2: TBD
  - id: 151
    kind: body
    source: |-
      An issue with Azzouni’s view of proofs as indicators of derivations is the over-generation problem (Tanswell 2015)[^tanswell-2015]. When we formalize an informal proof, we make many non-trivial choices, starting with the choice of a specific formal system – among the many formal proofs we can associate with an informal proof, which one should we choose? This and other issues led Azzouni to refine his account (Azzouni 2017, 2024)[^azzouni-2017].
    step1: TBD
    step2: TBD
  - id: 152
    kind: body
    source: |-
      Other critiques of the Standard View can be found in Pelc 2008; Antonutti Marfori 2010; Larvor 2016b; Pawlowski and Zahidi 2024; Weber 2022.
    step1: TBD
    step2: TBD
  - id: 153
    kind: body
    source: |-
      Larvor (2012) opposes the Standard View by offering a programmatic account of informal proofs and arguing that some proofs cannot be translated into formal proofs at all. Larvor’s main idea is that we cannot appeal to formal correctness to explain why mathematicians accept certain informal proofs, and thus that we have to develop other ways to articulate the normative dimension governing a specific mathematical practice. It is with this goal in mind that he puts forward the notion of “permissible (inferential) actions,” adopting a broad conception of inference (not necessarily involving propositions) and a framework from argumentation theory.
    step1: TBD
    step2: TBD
  - id: 154
    kind: body
    source: |-
      Another approach inspired by argumentation theory is Dutilh Novaes’ (2020) account. She argues that proofs are usefully conceived as dialogues between a prover and a skeptic. Her “Prover–Skeptic model” conceptualizes deductive arguments as semi-adversarial interactions where the need for necessary truth-preservation emerges from the need to convince a skeptical opponent, while the requirement for steps to be clear reflects the cooperative goal of producing explanatory persuasion. From this perspective, the features that are often attributed to rigorous proofs arise from the fact that the authors of such proofs have internalized the demands of this critical Skeptic.
    step1: TBD
    step2: TBD
  - id: 155
    kind: body
    source: |-
      The contextual and social dimensions of rigor are also emphasized by Ashton (2021). She notes that judgments of rigor vary across subfields, historical periods, and even pedagogical aims – something that has been observed also by scholars working in mathematical education (Inglis et al. 2013)[^inglis-2013]. In her view, rigor is not an invariant relation to formal derivability, but a context-sensitive standard negotiated within specific mathematical practices. In a similar spirit, Aberdein and Ashton (2024) analyze proof as a form of argumentation, emphasizing that proofs aim not merely to track formal validity but also to persuade, explain, and withstand critical scrutiny in social settings.
    step1: TBD
    step2: TBD
  - id: 156
    kind: body
    source: |-
      While the debate on the relationship between formal and informal proofs may seem to be divided into two opposing camps (and it is often framed in this way in the literature), Feferman argues that most of the proposed views are compatible. According to him, the Standard View, or formalizability thesis
    step1: TBD
    step2: TBD
  - id: 157
    kind: body
    source: |-
      > is an in principle thesis that has nothing to do with conviction, understanding, or feasibility and it seems […] to be perfectly consistent with the view of the central and methodological virtues of proofs emphasized by the critics. (2012, 385)
    step1: TBD
    step2: TBD
  - id: 158
    kind: body
    source: |-
      In a similar vein, Burgess and De Toffoli (2022) argue that the debate should not be seen as a clash between “formalist” and “anti-formalist” camps but as a mapping of positions across several dimensions: how closely informal proofs must track formal derivations; whether the relevant relation is actual or merely potential; and whether formalization is routine or requires creativity and background knowledge.
    step1: TBD
    step2: TBD
  - id: 159
    kind: body
    source: |-
      Tanswell (2024) also emphasizes the compatibility of different stances by reframing the debate around aims and models of rigor. He argues for rigor pluralism: different models of informal proof illuminate different features and functions of rigor, and no single model is suitable for all contexts. He distinguishes between four models: (i) rigor as formality (the Standard View), (ii) proofs as arguments and dialogues, (iii) the recipe model (proofs as guides to actions/activities), and (iv) rigor as an intellectual virtue – here rigor, like curiosity or intellectual humility, is viewed as a trait of mathematicians rather than an absolute property of proofs. He then evaluates each against multiple aims – including tracking correctness, preserving content, enabling agreement, and accommodating techniques such as diagram use. In this proposal, Hamami’s routine-translation account, inspired by Mac Lane and Bourbaki, excels at correctness (and, to some extent, agreement), but it faces challenges under techniques and content, especially when mathematical reasoning proceeds via diagrammatic or highly field-specific inferential transitions.
    step1: TBD
    step2: TBD
  - id: 160
    kind: body
    source: |-
      A related issue concerns the epistemic value of “absolute rigor.” Paseau (2016) has argued that the pursuit of *complete* inferential rigor – “atomizing” proofs into the smallest logical steps – fails to deliver the epistemic benefits it promises. Such atomization does not preserve credences, resolve disagreements, or illuminate why an argument succeeds. The value of rigor, he suggests, is not exhausted by decomposability into atomic inferential moves, raising doubts about whether complete formalization is even a defensible epistemic ideal.
    step1: TBD
    step2: TBD
  - id: 161
    kind: body
    source: |-
      More generally, proponents and opponents of the Standard View often acknowledge that informal proofs bring about specific epistemic values, not reducible to values of formal arguments (Avigad 2021; Weatherall and Wolfson forthcoming)[^avigad-2021]. This issue is pressing today, as formal proofs are more readily available than ever, thanks to new technologies. Interactive Theorem Provers and AI models are already changing mathematical practice and could also contribute to a re-definition of the problem of rigor.
    step1: TBD
    step2: TBD
  - id: 162
    kind: body
    source: |-
      ### 3.4 Mathematical Diagrams and Visualization
    step1: TBD
    step2: TBD
  - id: 163
    kind: body
    source: |-
      Although traditional philosophy of mathematics tends to dismiss diagrams as mere heuristic tools or potential sources of error, philosophers of mathematical practice emphasize the importance of studying them and other notational devices to gain a better understanding of actual mathematics.
    step1: TBD
    step2: TBD
  - id: 164
    kind: body
    source: |-
      By now, there is a substantial body of work on the topic. Crucially, this work is not limited to the analysis of diagrams in geometry but encompasses different fields from different historical periods and cultures. The philosophical discussions often arise from the analysis of detailed case studies, and the approach is thus bottom-up, in line with the methodology of the philosophy of mathematical practice. The diverse works in this area aim to clarify the precise nature of diagrams, their efficacy, and their justificatory role across diverse mathematical domains and across different mathematical activities.
    step1: TBD
    step2: TBD
  - id: 165
    kind: body
    source: |-
      One overall result that these studies obtained is to establish that mathematical reasoning is intimately linked to the choice of the representations used and that diagrams often fulfill specific epistemic and cognitive functions and thus cannot be trivially replaced by purely linguistic expressions. Studies on diagrams are thus tightly related to works on mathematical notations in general (Grosholz 2007; Krämer 2003; Macbeth 2014; Muntersbjorn 2003; Schlimm 2025)[^grosholz-2007][^krämer-2003][^macbeth-2014][^muntersbjorn-2003][^schlimm-2025].
    step1: TBD
    step2: TBD
  - id: 166
    kind: body
    source: |-
      A central effort in the literature is to establish that diagrams can be highly structured and systematic, particularly in historical contexts that are often criticized for relying on intuition and lacking rigor. In this respect, the work of Manders (2008) on Euclidean diagrams has been path-breaking.
    step1: TBD
    step2: TBD
  - id: 167
    kind: body
    source: |-
      Manders’ analysis of Euclidean geometry provides a foundational framework for understanding how diagrammatic reasoning can be rigorous. He argues that Euclid’s practice relies on an interplay between the textual component (dealing with “exact” properties, such as metric relations) and the diagrammatic component (dealing with “co-exact” properties, such as incidence, connectivity, and ordering relations, which are stable under small perturbations of the diagram). The ability to distinguish between these features controls the inferential use of the diagram.
    step1: TBD
    step2: TBD
  - id: 168
    kind: body
    source: |-
      Drawing on Manders’ work, Larvor (2019) proposes three conditions for diagrammatic proof practices to be rigorous, suggesting these generalize beyond Euclid: (i) they are easy to draw (require no special skill), (ii) the displayed information is not metrical (or non-metrical), and (iii) the inferences can be put into systematic mathematical relation with other inferential practices.
    step1: TBD
    step2: TBD
  - id: 169
    kind: body
    source: |-
      Giaquinto (2011) further develops Manders’ ideas and emphasizes the importance of considering the mathematical context in which diagrammatic inferences are drawn. According to him, while it is legitimate to infer that two lines intersect by inspecting a diagram in Euclidean geometry, this is not so in analysis, precisely because of the different nature of geometric and analytical concepts.
    step1: TBD
    step2: TBD
  - id: 170
    kind: body
    source: |-
      Manders’ analysis also provided the conceptual background for the development of formal diagrammatic systems for Euclidean geometry (Avigad, Dean, and Mumma 2009). Mumma’s (2010, 2019) formal proof system **Eu** is designed to be faithful to Euclid’s original argumentation structure and shows that diagrams can be integrated into formal systems. Formal diagrammatic systems have also been developed in logic (Shin 2002, 1994)[^shin-2002] and basic number theory (Jamnik 2001)[^jamnik-2001].
    step1: TBD
    step2: TBD
  - id: 171
    kind: body
    source: |-
      An alternative interpretation of Euclidean diagrams is provided by Panza (2012), who identifies a twofold role for diagrams in Euclid’s plane geometry: a global role (providing identity conditions for abstract geometric objects) and a local role (allowing objects to inherit properties and relations from their concrete diagrammatic representations). This view sees the objects of Euclidean geometry as quasi-concrete, determined by their relation to concrete diagrams.
    step1: TBD
    step2: TBD
  - id: 172
    kind: body
    source: |-
      For other accounts of Euclidean diagrams, see Azzouni 2004b; Catton and Montelle 2012; Macbeth 2010; Larvor 2019.
    step1: TBD
    step2: TBD
  - id: 173
    kind: body
    source: |-
      Scholars have not confined themselves to the study of Euclidean diagrams. They have also considered diagrams in logic (Allwein and Barwise 1996)[^allwein-1996] and contemporary mathematics (Carter 2010, 2018, 2019a; De Toffoli 2017, 2023, forthcoming; De Toffoli and Giardino 2014, 2015; Halimi 2012; Starikova 2012)[^carter-2010][^halimi-2012][^starikova-2012]. Moreover, different mathematical cultures have been considered. For example, Netz (1999) studies how diagrams and text interact in Greek mathematics and how the labeling of diagrams might reflect certain cognitive constraints; and Chemla (2018) analyzes diagrams in ancient Chinese mathematics. Chemla demonstrates that interpreting such diagrams often requires a dynamic reading involving navigation between the discursive text and the diagram, and that the diagram itself can formulate a proof of an algorithm’s correctness.
    step1: TBD
    step2: TBD
  - id: 174
    kind: body
    source: |-
      A systematic work on the epistemology of diagrams, in dialogue with research in cognitive science, is Giaquinto 2007. For reviews of the literature, see Giaquinto 2020 and Giardino 2024.
    step1: TBD
    step2: TBD
  - id: 175
    kind: body
    source: |-
      To properly analyze diagrams, researchers have sought to define them precisely and distinguish them from other types of representations.
    step1: TBD
    step2: TBD
  - id: 176
    kind: body
    source: |-
      Stenning (2002), focusing on diagrams in logic, argues that the fundamental distinction between diagrammatic and sentential systems lies in their semantic modality, specifically the difference between direct (diagrammatic) and indirect (sentential) interpretation. Indirect systems interpose an abstract syntax defined on a concatenation relation; directly interpreted systems interpret spatial relations between symbols directly and uniformly. (See also Giardino and Greenberg 2015; Greenberg 2023)[^giardino-2015][^greenberg-2023].
    step1: TBD
    step2: TBD
  - id: 177
    kind: body
    source: |-
      Another characterization of diagrams is proposed by De Toffoli (2023, forthcoming). She considers mathematical diagrams to be elements of notational systems that are either geometric-topological representations (GT) or two-dimensional representations (or both). Crucially, diagrams are distinguished from illustrations by their systematicity – they are representations where both the information carried and the rules for correct use can be (at least potentially) spelled out precisely. See also Carter 2024b, Ch. 3.
    step1: TBD
    step2: TBD
  - id: 178
    kind: body
    source: |-
      Beyond efforts towards a definition of diagrams, scholars have been investigating why they are at times so efficacious aids for reasoning in mathematics. The efficacy of diagrams is often traced to specific cognitive benefits they offer, both in geometry and topology and in non-geometric fields like abstract algebra and category theory.
    step1: TBD
    step2: TBD
  - id: 179
    kind: body
    source: |-
      Carter (2019a) explores whether mathematical diagrams are uniquely fruitful compared to other representations. She introduces the notion of a “faithful representation,” which iconically represents relations, and allows for manipulations that track relations between the represented entities. While she concludes that fruitfulness is not exclusive to diagrams, she highlights two of diagrams’ unique features: the ability to show a relation rather than merely stating it, and two-dimensionality, which allows a single diagram to represent connections to multiple objects efficiently. Carter (2021, 2024b) also develops Shimojima’s (1999) idea that diagrams support “free rides” – that is, thanks to their spatial configuration, they can exhibit properties (such as inclusions) that are not explicit in their linguistic counterpart.
    step1: TBD
    step2: TBD
  - id: 180
    kind: body
    source: |-
      De Toffoli and Giardino (2014, 2015, 2016) show that proofs in topology often rely on envisioning transformations on diagrammatic representations (such as knot diagrams and arrow diagrams for surfaces). This imaginative activity involves performing “epistemic actions” on the representations. In their view, knot diagrams (as well as other types of topological diagrams) are an effective notation because they are dynamic and support specific manipulations.
    step1: TBD
    step2: TBD
  - id: 181
    kind: body
    source: |-
      Shin’s (2002, 2015) work on Peirce’s Existential Graphs highlights that their two-dimensional structure allows for multiple readability – the possibility to carve up and translate the same diagram into several logically equivalent sentences without needing inferential steps. This multiplicity makes the equivalence of different sentences manifest, eliminating the need for complex, unique parsing rules required in linear sentential systems. For a discussion on multiple readability and push back on the idea that it is a property arising only within diagrammatic notations, see Bellucci and Pietarinen 2016.
    step1: TBD
    step2: TBD
  - id: 182
    kind: body
    source: |-
      Whereas some scholars have been stressing the importance of diagrams in different phases of the mathematical activity (Carter 2024b; Giaquinto 2007)[^carter-2024b][^giaquinto-2007], others focus on proof and support the stronger but more circumscribed claim that diagrams can be essential for certain proofs (Corfield 2003; De Toffoli 2023, forthcoming)[^corfield-2003].
    step1: TBD
    step2: TBD
  - id: 183
    kind: body
    source: |-
      Studies on diagrams across history (e.g., Euclidean geometry, ancient China) and contemporary mathematics (e.g., geometry, topology, algebra, category theory) converge in sketching a picture of mathematical practice where diagrams play an important role. Diagrams cannot be neglected by a philosophy of mathematics sensitive to actual mathematical practice. Moreover, these studies challenge the derivation-centric view of proof. However, as we discussed above, the use of diagrams in proofs is not incompatible with the Standard View of mathematical rigor, which is an in-principle thesis. Still, it is incompatible with reducing informal proofs to formal derivations.
    step1: TBD
    step2: TBD
  - id: 184
    kind: body
    source: |-
      We have limited ourselves to the discussion of four epistemic virtues: purity, explanation, rigor, and visualizability. But there are several more that have been discussed in the literature, and they interact in interesting ways with these four. A partial list and some major references will have to suffice here: simplicity (Kossak and Ording 2017; Arana and Stafford 2023)[^arana-2023][^arana-2023-2][^kossak-2017], beauty (Cellucci 2015; Dutilh Novaes 2019; Giaquinto 2016; Inglis and Aberdein 2015; Lange 2016; Sa et al. 2024; Starikova 2018)[^cellucci-2015][^dutilh-2019][^giaquinto-2016][^inglis-2015][^lange-2016][^starikova-2018], epistemic economy (Panza 2016, 2026)[^panza-2016][^panza-2016-2], depth (see the Special Issue of *Philosophia Mathematica* (Ernst et al. 2015 – in particular Gray 2015 and Lange 2015)[^ernst-2015][^gray-2015][^lange-2015], and D’Alessandro 2021), naturalness and fruitfulness as pertains to definitions and concepts (Heuer, Pérez-Escobar and Sarikaya 2025; Morris 2024; Tappenden 2005)[^morris-2024][^tappenden-2005]; transferability, fitness, and motivation as a property of proofs (Easwaran 2009; Morris 2024; Raman-Sundström 2016; Raman-Sundström and Öhman 2018)[^easwaran-2009][^morris-2024][^raman-sundström-2016][^raman-sundström-2018]. Other topics narrowly connected to epistemic virtues are mathematical understanding (Avigad 2008, 2010, 2022; D’Alessandro 2023; Folina 2018; Frans 2021; Macbeth 2012; Manders 2012; Hamami and Morris 2024; Tappenden 2005)[^avigad-2008][^d’alessandro-2023][^folina-2018][^frans-2021][^hamami-2024][^hamami-2024-2][^macbeth-2012][^manders-2012][^morris-2024][^tappenden-2005] and mathematical style (see the entry on mathematical style).
    step1: TBD
    step2: TBD
