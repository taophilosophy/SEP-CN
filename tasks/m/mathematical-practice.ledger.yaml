      By the mid-20ᵗʰ century, many philosophers of mathematics seemed to have reached a consensus. Mathematics was seen as a science that yields objective and a priori knowledge. Arithmetic and logic (including set theory) were considered to be paradigmatic domains of mathematics. The main philosophical questions revolved around the possibility of mathematical knowledge, the nature of mathematical objects, and the several positions on the foundations of mathematics (usually represented by formalism, intuitionism and logicism). This philosophical outlook emerged from research on the foundations of mathematics in the late 19ᵗʰ century, especially from the work of Frege and Hilbert. Because of its popularity, it has been referred to as “mainstream philosophy of mathematics,” or, because of the central role of foundational questions, as “foundationalism” (see Horsten 2019)[^horsten-2019].
    step1: |-
      到 20 世纪中叶，许多数学哲学家似乎达成了共识。数学被视为产生客观且先天知识的科学。算术与逻辑（包括集合论）被视为数学的范型领域。主要的哲学问题围绕数学知识的可能性、数学对象的性质，以及数学基础上的若干立场（通常以形式主义、直觉主义与逻辑主义为代表）。这一哲学图景脱胎于 19 世纪晚期的数学基础研究，尤其是弗雷格与希尔伯特的工作。因其流行，它被称为“主流数学哲学”；又因基础问题的中心地位，也被称为“基础主义”（见 Horsten 2019）[^horsten-2019]。
    step2: |-
      到 20 世纪中叶，许多数学哲学家似已达成共识。数学被视为产生客观且先天知识的科学。算术与逻辑（包括集合论）被视为数学的范型领域。主要哲学问题围绕数学知识的可能性、数学对象的性质，以及数学基础上的若干立场（通常以形式主义、直觉主义与逻辑主义为代表）。这一哲学图景脱胎于 19 世纪晚期的数学基础研究，尤其是弗雷格与希尔伯特的工作。因其流行，它被称为“主流数学哲学”；又因基础问题的中心地位，也称“基础主义”（见 Horsten 2019）[^horsten-2019]。
