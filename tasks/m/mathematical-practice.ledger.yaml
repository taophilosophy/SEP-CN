      1. *History of mathematics*. Chemla 2012 and Ferreirós and Gray 2006 are two significant examples, but in this area there is simply an embarrassment of riches. It is fair to say that while the history of mathematics has provided the material for many case studies in PMP, it is also the case that developments in PMP are influencing many historians of mathematics to pay more attention to certain issues (historical studies of diagrammatic reasoning are perhaps the primary example of this interaction).
      2. *Studies about the social dimension of mathematics*. See Bloor 1976; Restivo 1985 and the survey paper Barany and Kremakova 2024. For an attempt to bring this direction of studies into PMP, see Löwe and Müller 2008; Jean Paul Van Bendegem and Van Kerkhove 2007.
      3. *Cognitive psychology*. See Butterworth 1999; Dehaene 1999; Kosslyn 1994, with Giaquinto 2007 as the best example of inclusion of issues of cognitive psychology into PMP (see also Mancosu, Jørgensen, and Pedersen 2005 and Giaquinto 2020 for an overview)[^giaquinto-2020].
      4. *Ethnomathematics*. See Everett and Madora 2012 with François and Van Bendegem 2007 as examples of interactions of ethnomathematics and mathematical education with PMP.
      5. *Evolutionary biology*. See Dehaene and Brannon 2011 and Lorenzi, Perrino, and Vallortigara 2021 for animal and developmental psychology, and Pantsar 2023, 2019a for some recent work related to PMP.
      6. *Semiotics*. Peirce is here the founding figure, see Carter 2014; see Gastaldi 2024; Wagner 2017; Waszek 2024 for applications to PMP.
      7. *Cultural approaches*. Wilder 1981 can be seen as antecedent with recent work by Larvor 2016a for some connections to PMP.
      8. *Linguistic approaches*. See, for instance, the analysis of instructions and imperatives in mathematical texts carried out in Tanswell and Inglis 2024.
      9. *Mathematics education*. See Hamami and Morris 2020 and Weber and Inglis 2024 for two overviews from mathematics educators and philosophers of mathematical practice. See also the Special Issue of the *Journal of Mathematical Behavior* edited by De Toffoli, Inglis, Hamami, and Mejia-Ramos (forthcoming).
    step1: |-
      1. *数学史*。Chemla 2012 与 Ferreirós and Gray 2006 是两个重要例子，但这一领域资源多得难以尽收。可以说，数学史为 PMP 的许多个案研究提供了材料；同样，PMP 的发展也在影响许多数学史家更关注某些问题（图式推理的历史研究或许就是这种互动的首要例子）。
      2. *关于数学之社会维度的研究*。见 Bloor 1976; Restivo 1985 与综述文章 Barany and Kremakova 2024。把这一研究方向引入 PMP 的尝试，见 Löwe and Müller 2008; Jean Paul Van Bendegem and Van Kerkhove 2007。
      3. *认知心理学*。见 Butterworth 1999; Dehaene 1999; Kosslyn 1994；Giaquinto 2007 是把认知心理学问题纳入 PMP 的最佳例子（综述另见 Mancosu, Jørgensen, and Pedersen 2005 与 Giaquinto 2020）[^giaquinto-2020]。
      4. *民族数学*。见 Everett and Madora 2012 与 François and Van Bendegem 2007，它们是民族数学、数学教育与 PMP 互动的例子。
