      By considering mathematics as a static body of truths rather than a discipline in evolution, philosophers of mathematics engaged in foundational projects have by and large paid very little attention to the history of mathematics, contenting themselves with some references to the arithmetization of analysis (and its role in the development of logic and set theory) and the development of non-Euclidean geometries in the 19ᵗʰ century (as a prelude to an understanding of Hilbert’s approach to axiomatics). After all, the project is to provide solid foundations for current, rigorous mathematics, rather than engaging in historical exegesis. To be sure, there are exceptions, and we can mention, by way of example, two cases pre-dating the 1970s. On the philosophical side, one could mention the work by Cavaillès (1938), which was driven by foundational concerns and yet displayed a fine attention to historical nuance. On the mathematical side, one can mention Robinson’s (1966) interest in the historical debates concerning Leibnizian infinitesimals as a way to provide a perspective on the importance of non-standard analysis. Of course, things have much improved in the last fifty years with detailed studies of, among others, Dedekind, Frege, Cantor, and Hilbert. Still, the majority of efforts in the foundationalist tradition do not need to concern themselves with the historical aspects of the discipline and squarely focus on modern mathematics.
    step1: |-
      把数学看作静态的真理集合体而非演化中的学科，投身基础项目的数学哲学家便大体上很少关注数学史，只满足于提几句分析学的算术化（及其在逻辑与集合论发展中的作用）、19 世纪非欧几何的发展（把它当作理解希尔伯特公理化进路的序幕）。毕竟，这个项目是要为当前的严格数学提供坚实基础，而不是从事历史考释。当然也有例外，这里可举 1970 年代前的两个例子。哲学方面，可提卡瓦耶斯（Cavaillès 1938）的工作：它由基础关切驱动，却对历史细节显示出了精到的注意。数学方面，可提罗宾逊（Robinson 1966）对莱布尼茨无穷小量历史论辩的兴趣——他借此为非标准分析的重要性提供了一个视角。当然，最近五十年情况已大为改观，对戴德金、弗雷格、康托尔、希尔伯特等人的研究都很细致。但基础主义传统中的多数工作仍无须关心这门学科的历史面向，而径直聚焦现代数学。
