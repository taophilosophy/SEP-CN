  - id: 17
    kind: body
    source: |-
      For example, it is evident that in order to pursue an epistemological analysis of visualization and diagrammatic reasoning, we cannot avoid considering geometry and topology – and indeed we cannot avoid considering other areas of mathematics as well (e.g., analysis (Carter 2010)[^carter-2010] and algebra (De Toffoli 2017)). Moreover, in order to study whether computational technology can enhance mathematical understanding, it is helpful to look into combinatorics and related areas (Avigad 2022)[^avigad-2022]. What is more, these themes and many other themes, like mathematical explanation and mathematical understanding, are transversal, and it would be artificial to restrict them to specific mathematical areas.
    step1: |-
      例如，显然要对可视化与图式推理作认识论分析，就免不了考察几何与拓扑——事实上也免不了考察其他数学领域（如分析学（Carter 2010）[^carter-2010]与代数（De Toffoli 2017））。再者，要研究计算技术能否增进数学理解，考察组合数学及相关领域会很有帮助（Avigad 2022）[^avigad-2022]。更有甚者，这些主题以及许多别的主题——如数学解释与数学理解——都是横贯性的，把它们限定在特定的数学领域内就太人为了。
