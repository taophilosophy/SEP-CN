  - id: 1
    kind: body
    source: |-
      “Philosophy of Mathematical Practice” (PMP) refers to a broad cluster of approaches in the philosophy of mathematics. These approaches share a common focus on philosophical issues arising from actual mathematical practice. It is also characteristic of PMP to consider philosophical problems in the context of specific historical or current mathematical practices. While there have been attempts to more precisely define the notion of mathematical practice, all that needs to be understood by this, as a first approximation, is mathematics as practiced by mathematicians ranging from heuristic informal strategies to formalized developments.
    step1: TBD
    step2: TBD
  - id: 2
    kind: body
    source: |-
      Typically, approaches within PMP reject a-historical conceptions of mathematics and are open to interdisciplinary research. PMP has been characterized by an innovative focus on aspects of mathematics largely neglected in 20ᵗʰ-century analytic philosophy of mathematics. Foundational concerns and the problem of access to abstract mathematical entities, despite their importance, resulted in an impoverished approach to the philosophy of mathematics, which was often limited to the discussion of set theory and arithmetic. The questions philosophers of mathematical practice ask call for a dramatic extension of the domain of philosophical investigation as conceived in the previous tradition, as well for alternative perspectives on traditional problems. Examples of such questions are: Why do mathematicians prove the same theorem multiple times? Are there virtues of proofs other than correctness? What is mathematical explanation? What are the epistemic roles of visualization in mathematics? What are mathematical notations, and how do they function? What constitutes progress in mathematics, and how is it achieved? How does the use of computational tools influence mathematical practice? Not all these questions are new, and PMP recognizes its debt to certain aspects of investigation that had emerged from Lakatos’ (1976) approach to the philosophy of mathematics as well as to particular trends of investigations (such as Maddy 1997)[^maddy-1997] within the more traditional analytic philosophy of mathematics.
    step1: TBD
    step2: TBD
  - id: 3
    kind: body
    source: |-
      PMP pushes the boundaries of the philosophy of mathematics by endorsing a broad conception of what areas of mathematics should be object of philosophical attention, extending the range of questions, and introducing new methodologies. Although the philosophy of mathematical practice is placed under the heading ‘the Future’ in the entry on philosophy of mathematics, it has dramatically increased in popularity in the past decades and has generated a remarkable amount of philosophical research. For instance, a considerable number of articles in PMP are included in the recent massive volume (of more than 3,000 pages) *Handbook of the History and Philosophy of Mathematical Practice* (Sriraman 2024)[^sriraman-2024]. Moreover, some of the themes first canvassed within the philosophy of mathematical practice are becoming of more general interest. Indeed, in some cases, such as explanation in mathematics – a topic whose analysis was pioneered by philosophers of mathematical practice – the area has become one of the most widely discussed by analytic philosophers of mathematics.
    step1: TBD
    step2: TBD
  - id: 4
    kind: body
    source: |-
      ## 1. Overview of Practice-Based Approaches to Mathematics
    step1: TBD
    step2: TBD
  - id: 5
    kind: body
    source: |-
      The central commitment of philosophers of mathematical practice is to tackle philosophical issues that arise by considering the inner workings of mathematics. This common core leaves plenty of leeway in choosing specific questions and deciding how to pursue them. In particular, the way in which mathematics is characterized, as well as the methodology adopted, shape radically different approaches within PMP. We survey such approaches below, highlighting the differences between them and more traditional approaches in the philosophy of mathematics.
    step1: TBD
    step2: TBD
  - id: 6
    kind: body
    source: |-
      We will describe different approaches to mathematics by specifying (1) what areas of mathematics are taken into consideration, (2) who are the mathematical subjects (some would say agents) under investigation and what kind of activities they are engaged in, and (3) the methodology adopted.
    step1: TBD
    step2: TBD
  - id: 7
    kind: body
    source: |-
      Our aim in this section is to provide a broad taxonomy that will be helpful in navigating between specific positions within PMP. However, the reader should not infer that the taxonomy is exhaustive and that all the positions in the taxonomy have been investigated to the same extent or have yielded the same amount of philosophical success.
    step1: TBD
    step2: TBD
  - id: 8
    kind: body
    source: |-
      Needless to say, the proposed taxonomy is not the only way of organizing the landscape created by philosophers of mathematical practice. For alternatives, we recommend the following surveys (Carter 2019b, 2024b; Giardino 2017; Hamami and Morris 2020; Mancosu 2008a; Rittberg 2019; Van Bendegem 2014)[^carter-2019b][^giardino-2017][^hamami-2020][^mancosu-2008a][^rittberg-2019][^van-2014].
    step1: TBD
    step2: TBD
  - id: 9
    kind: body
    source: |-
      ### 1.1 Areas of Mathematics
    step1: TBD
    step2: TBD
  - id: 10
    kind: body
    source: |-
      It is notoriously difficult to define what mathematics is. Nonetheless, philosophers of mathematics usually share certain assumptions about the nature of mathematics. These assumptions include what domains should be investigated. 20ᵗʰ-century foundational approaches have mainly focused on arithmetic, set theory, and logic (and to a more limited extent on elementary geometry). Instead, PMP considers all areas of mathematics to be under its purview.
    step1: TBD
    step2: TBD
  - id: 11
    kind: body
    source: |-
      The oldest areas of mathematics are geometry and arithmetic, which originated from the everyday activities of measuring and counting. With time, more abstract areas developed, such as topology, abstract algebra, real and complex analysis, set theory, and category theory. Logic, as the study of reasoning, also originates in antiquity but became a mathematical theory only in the 19ᵗʰ century.
    step1: TBD
    step2: TBD
  - id: 12
    kind: body
    source: |-
      Geometry has been considered the paradigm of rigorous mathematics for about two millennia, from Euclid’s time all the way to the end of the 18ᵗʰ century. While the historical development is complicated, there is no denying that in the 19ᵗʰ century arithmetic and algebra became more central to foundational concerns, for instance in the works of Gauss, Bolzano, Dedekind, and Frege.
    step1: TBD
    step2: TBD
  - id: 13
    kind: body
    source: |-
      Indeed, foundational approaches have mostly concentrated on arithmetic because they take it to be representative or more fundamental. Frege’s logicism is a prime example of this – the primary aim of Frege’s logicism is to reduce arithmetic (not all mathematics!) to logic.
    step1: TBD
    step2: TBD
  - id: 14
    kind: body
    source: |-
      Moreover, 20ᵗʰ-century analytical philosophy of mathematics has almost exclusively focused on general epistemological and ontological questions that by and large could be framed in terms of set theory. This has led to reducing philosophical discussions about mathematics to philosophical discussions about sets (what are they? How can we have access to them?), thus neglecting the specificities of different branches of mathematics. Jeremy Avigad is explicit about the negative effect that this had on the philosophy of mathematics:
    step1: TBD
    step2: TBD
  - id: 15
    kind: body
    source: |-
      > The problem is that set-theoretic idealisation idealises too much. Mathematical thought is messy. When we dig beneath the neatly composed surface we find a great buzzing, blooming confusion of ideas, and we have a lot to learn about how mathematics channels these wellsprings of creativity into rigorous scientific discourse. But that requires doing hard work and getting our hands dirty. And so the call of the sirens is pleasant and enticing: mathematics is set theory! Just tell us a really good story about abstract objects, and the secrets of the Universe will be unlocked. This siren song has held the philosophy of mathematics in thrall, leaving it to drift into the rocky shores. (2018a, 6)
    step1: TBD
    step2: TBD
  - id: 16
    kind: body
    source: |-
      Philosophers of mathematical practice tend to get their hands dirty with all sorts of different mathematics. They recognize that mathematics is not monolithic but multiform. The common thought is that focusing on a few areas such as arithmetic and set theory results in a lost opportunity for philosophical analyses of mathematics.
    step1: TBD
    step2: TBD
  - id: 17
    kind: body
    source: |-
      For example, it is evident that in order to pursue an epistemological analysis of visualization and diagrammatic reasoning, we cannot avoid considering geometry and topology – and indeed we cannot avoid considering other areas of mathematics as well (e.g., analysis (Carter 2010)[^carter-2010] and algebra (De Toffoli 2017)). Moreover, in order to study whether computational technology can enhance mathematical understanding, it is helpful to look into combinatorics and related areas (Avigad 2022)[^avigad-2022]. What is more, these themes and many other themes, like mathematical explanation and mathematical understanding, are transversal, and it would be artificial to restrict them to specific mathematical areas.
    step1: TBD
    step2: TBD
  - id: 18
    kind: body
    source: |-
      ### 1.2 Subjects Doing Mathematics
    step1: TBD
    step2: TBD
  - id: 19
    kind: body
    source: |-
      Philosophers of mathematics engaged in foundationalist projects often conceive of mathematics as a collection of theories that can be expressed in specific formal systems. This conception gives little if no role to the diachronic nature of mathematics as well as to the subjects doing mathematics. While acknowledging the importance of the synchronic analysis of mathematics for certain goals, philosophers of mathematical practice give, when appropriate, special attention to the history of mathematics and to how specific features (cognitive or otherwise) of the subjects engaged in mathematical activity might affect the development and constitution of mathematics. To emphasize the activity in which the mathematicians engage in, some prefer to speak of agents (Ferreirós 2020; Hamami 2024)[^ferreirós-2020][^hamami-2024][^hamami-2024-2].
    step1: TBD
    step2: TBD
  - id: 20
    kind: body
    source: |-
      By considering mathematics as a static body of truths rather than a discipline in evolution, philosophers of mathematics engaged in foundational projects have by and large paid very little attention to the history of mathematics, contenting themselves with some references to the arithmetization of analysis (and its role in the development of logic and set theory) and the development of non-Euclidean geometries in the 19ᵗʰ century (as a prelude to an understanding of Hilbert’s approach to axiomatics). After all, the project is to provide solid foundations for current, rigorous mathematics, rather than engaging in historical exegesis. To be sure, there are exceptions, and we can mention, by way of example, two cases pre-dating the 1970s. On the philosophical side, one could mention the work by Cavaillès (1938), which was driven by foundational concerns and yet displayed a fine attention to historical nuance. On the mathematical side, one can mention Robinson’s (1966) interest in the historical debates concerning Leibnizian infinitesimals as a way to provide a perspective on the importance of non-standard analysis. Of course, things have much improved in the last fifty years with detailed studies of, among others, Dedekind, Frege, Cantor, and Hilbert. Still, the majority of efforts in the foundationalist tradition do not need to concern themselves with the historical aspects of the discipline and squarely focus on modern mathematics.
    step1: TBD
    step2: TBD
  - id: 21
    kind: body
    source: |-
      Moreover, focusing on general worries about the nature of abstract objects and our access to them has, by and large, led philosophers of mathematics to put at the center of their epistemological inquiries highly idealized subjects in isolation. A common assumption is that epistemic access worries only arise with respect to the axioms of a theory and what follows from what is taken to be epistemically unproblematic as if the underlying subjects were logically omniscient subjects.
    step1: TBD
    step2: TBD
  - id: 22
    kind: body
    source: |-
      By contrast, since philosophers of mathematical practice address a number of epistemological issues that are in many cases unrelated to the foundations of mathematics or to the problem of access, they tend to be more inclusive both in terms of the historical practices considered and of who are the subjects engaged in mathematics.
    step1: TBD
    step2: TBD
  - id: 23
    kind: body
    source: |-
      In the introduction to the volume *The Philosophy of Mathematical Practice*, Paolo Mancosu explains:
    step1: TBD
    step2: TBD
  - id: 24
    kind: body
    source: |-
      > The authors in this collection believe that the single-minded focus on the problem of ‘access’ has reduced the epistemology of mathematics to a torso. They believe that the epistemology of mathematics needs to be extended well beyond its present confines to address epistemological issues having to do with fruitfulness, evidence, visualization, diagrammatic reasoning, understanding, explanation, and other aspects of mathematical epistemology which are orthogonal to the problem of access to ‘abstract objects.’ (2008b, 1–2)
    step1: TBD
    step2: TBD
  - id: 25
    kind: body
    source: |-
      The volume contains several contributions devoted to the topics listed above and treated for the most part using a methodology of conceptual analysis. We will return in Section 3 to some of the areas listed in the above quote but for the moment we would like to point out that broadening the confines of the epistemology of mathematics has led to an analysis of historical mathematical practices such as, for instance, Euclidean geometry (as developed in Euclid’s *Elements* and not only in a contemporary axiomatic framework).
    step1: TBD
    step2: TBD
  - id: 26
    kind: body
    source: |-
      In addition, the extension of the range of the epistemology of mathematics has led to changes in the underlying assumptions concerning the subjects practicing mathematics, which has, in some cases, brought about fruitful interactions also with cognitive psychology and mainstream epistemology. For instance, in the study of notations and diagrammatic reasoning, it is crucial to assume that those who do mathematics are subjects sharing broad features of our human cognitive architecture. This is a natural and uncontroversial assumption, but one that is not necessarily needed if the only epistemological problems about mathematics, as conceived in the traditional analytical approach, are linked to the problem of access to abstract objects. It is thus unsurprising that philosophers of mathematical practice working on these issues have engaged with studies on mathematical cognition (Giaquinto 2007; Schlimm 2018)[^giaquinto-2007][^schlimm-2018].
    step1: TBD
    step2: TBD
  - id: 27
    kind: body
    source: |-
      Other examples of the interaction between cognitive psychology and PMP include the application of the theory of embodied cognition to mathematics. One early work in this direction is Lakoff and Núñez 2000; more recent studies are Giardino 2018; Pantsar 2019b.
    step1: TBD
    step2: TBD
  - id: 28
    kind: body
    source: |-
      Interactions between PMP and mainstream epistemology include discussions on epistemic defeaters (Easwaran 2015)[^easwaran-2015] and fallibility (De Toffoli 2021a; Dove 2003; Easwaran 2009)[^dove-2003][^easwaran-2009]. Moreover, themes of social epistemology are also being investigated within PMP. Mathematicians rely on each other (and at times on machines) to check the correctness of their putative proofs. They also commonly rely on results without proving them for themselves. Focusing on the social dimension of mathematics has shown that themes that are gaining traction in social epistemology could be fruitfully applied to the philosophy of mathematics, and scholars working in PMP have been especially sensitive to incorporating these developments. These themes include group knowledge and justification (Habgood-Coote and Tanswell 2021)[^habgood-coote-2021][^tanswell-2021], testimony (Geist, Löwe, and Van Kerkhove 2010; Andersen, Andersen, and Sørensen 2021), trust (De Toffoli and Tanswell 2025), epistemic exclusions (Rittberg 2023)[^rittberg-2023], epistemic injustice (Rittberg, Tanswell, and Van Bendegem 2020; Hunsicker and Rittberg 2022)[^hunsicker-2022], and the epistemic significance of disagreement (Aberdein 2023; De Toffoli and Fontanari 2023; Kant 2025)[^aberdein-2023][^kant-2025].
    step1: TBD
    step2: TBD
  - id: 29
    kind: body
    source: |-
      Mainstream philosophy of action has also been put into service in the study of mathematical practice. In particular, in (Hamami and Morris 2023, 2024)[^hamami-2023], the authors propose an account of mathematical understanding inspired by Bratman’s (1987) classic account of planning and practical reasons. But the focus on agents has also brought contributions in the area of social ontology, which are surveyed in a Special Issue of *Topoi* edited by Cantù and Testa (2023).
    step1: TBD
    step2: TBD
  - id: 30
    kind: body
    source: |-
      Summarizing the above, we can say that, in addition to contributions that address problems of mathematical practice with a more traditional methodology of conceptual analysis, a more detailed attention to mathematical practice and the subjects practicing it has led several scholars engaged in PMP to take into account the cognitive architecture of the subjects and the social dimension of the epistemic activities in which mathematicians are engaged in, at times in consonance with parallel developments in mainstream analytic philosophy.
    step1: TBD
    step2: TBD
  - id: 31
    kind: body
    source: |-
      ### 1.3 Methodology
    step1: TBD
    step2: TBD
  - id: 32
    kind: body
    source: |-
      Although most results within PMP deploy traditional philosophical methodology, they tend to endorse a *bottom-up* rather than a *top-down* approach. In other words, they tend to draw philosophical conclusions by basing them on the detailed analysis of case studies rather than on general principles. In addition, focusing on mathematical practice provides solutions specific to mathematics to general epistemological problems, such as the problem of access to abstract objects, that might not generalize across the board (Panza 2024)[^panza-2024].
    step1: TBD
    step2: TBD
  - id: 33
    kind: body
    source: |-
      The difference between these approaches can be clearly appreciated by looking at works on mathematical explanation (see Section 3.3 for more details). Top-down approaches were typical of the earlier analytic tradition (even when motivated by the desire to include more attention to mathematical practice) and offered general characterizations of mathematical explanation. Influential proposals are Steiner’s (1978) account of explanation in terms of a “characteristic property” and Kitcher’s (1981) unificationist account. While important in having brought the attention of philosophers to mathematical explanation, these proposals have been criticized by scholars looking at detailed case studies from the practice of mathematics, thus adopting a bottom-up approach. See, for example, Hafner and Mancosu 2005, 2008 for specific criticisms of Steiner and Kitcher, respectively, and Mancosu, Poggiolesi, and Pincock 2023 for a comprehensive overview of this area.
    step1: TBD
    step2: TBD
  - id: 34
    kind: body
    source: |-
      Different methodologies within PMP can also be identified by locating them along the spectrum between normative and descriptive analyses of mathematical practice. Consider, for example, epistemology. A purely normative analysis articulating norms governing mathematical justification and knowledge will float free from actual practice – for instance, it won’t be a problem if it leads to the skeptical conclusion that we do not know much mathematics after all. However, when the normative analysis integrates a descriptive component, the norms are taken to be at least partially successfully implemented in practice. For example, some scholars have spelled out norms for proofs with an eye toward what gets accepted in practice. See Tymoczko 1979 for a by-now classic analysis. For more recent proposals, see Easwaran 2009, where it is suggested that proofs should be “transferable”, and De Toffoli 2021a, where it is argued that proofs should be “shareable.”
    step1: TBD
    step2: TBD
  - id: 35
    kind: body
    source: |-
      While traditional efforts in 20th-century mainstream philosophy of mathematics are almost entirely on the normative side, philosophers of mathematical practice tend to inform their normative assessments with a descriptive component. This integration comes in degrees. The more extreme branches of PMP tend to abandon the normative analysis altogether by focusing almost exclusively on a descriptive endeavor, which can, for example, consist of a detailed account of specific episodes in the history of mathematics or in sociological descriptions of how particular mathematical communities are regulated. The different positions along the normative/descriptive dimension are also related by how the term practice is understood, to which we turn in the next section.
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      This discussion leads us to a more general observation. One problem in the area of PMP is to navigate the porous boundary between aspects of mathematical practice that can be the object of investigation on the part of different sciences and the aspects that are more properly classified as belonging to PMP. The reason why the boundary is porous is that mathematical practice can be studied from a variety of perspectives which include historical, sociological, educational, ethnomathematical, cultural, linguistic, semiotic, biological, and cognitive approaches (see, for example, Van Bendegem 2014)[^van-2014]. While in our opinion these approaches are to be considered in principle separate from the philosophy of mathematical practice, specific results emerging from these disciplines, as we have pointed out above, might provide important elements of reflection or evidence for philosophical claims in PMP. However, we must point out that more radical approaches to PMP call for a closer symbiosis with one or more of the areas just mentioned.
    step1: TBD
    step2: TBD
  - id: 37
    kind: body
    source: |-
      In the remaining part of the entry, we will refer to these different fields sparingly, but this does not imply that we downplay their potential, and in some cases actual, relevance to PMP, if only as catalysts for philosophical reflection. Among the studies we have in mind, let us mention:
    step1: TBD
    step2: TBD
  - id: 38
    kind: body
    source: |-
      1. *History of mathematics*. Chemla 2012 and Ferreirós and Gray 2006 are two significant examples, but in this area there is simply an embarrassment of riches. It is fair to say that while the history of mathematics has provided the material for many case studies in PMP, it is also the case that developments in PMP are influencing many historians of mathematics to pay more attention to certain issues (historical studies of diagrammatic reasoning are perhaps the primary example of this interaction).
      2. *Studies about the social dimension of mathematics*. See Bloor 1976; Restivo 1985 and the survey paper Barany and Kremakova 2024. For an attempt to bring this direction of studies into PMP, see Löwe and Müller 2008; Jean Paul Van Bendegem and Van Kerkhove 2007.
      3. *Cognitive psychology*. See Butterworth 1999; Dehaene 1999; Kosslyn 1994, with Giaquinto 2007 as the best example of inclusion of issues of cognitive psychology into PMP (see also Mancosu, Jørgensen, and Pedersen 2005 and Giaquinto 2020 for an overview)[^giaquinto-2020].
      4. *Ethnomathematics*. See Everett and Madora 2012 with François and Van Bendegem 2007 as examples of interactions of ethnomathematics and mathematical education with PMP.
      5. *Evolutionary biology*. See Dehaene and Brannon 2011 and Lorenzi, Perrino, and Vallortigara 2021 for animal and developmental psychology, and Pantsar 2023, 2019a for some recent work related to PMP.
      6. *Semiotics*. Peirce is here the founding figure, see Carter 2014; see Gastaldi 2024; Wagner 2017; Waszek 2024 for applications to PMP.
      7. *Cultural approaches*. Wilder 1981 can be seen as antecedent with recent work by Larvor 2016a for some connections to PMP.
      8. *Linguistic approaches*. See, for instance, the analysis of instructions and imperatives in mathematical texts carried out in Tanswell and Inglis 2024.
      9. *Mathematics education*. See Hamami and Morris 2020 and Weber and Inglis 2024 for two overviews from mathematics educators and philosophers of mathematical practice. See also the Special Issue of the *Journal of Mathematical Behavior* edited by De Toffoli, Inglis, Hamami, and Mejia-Ramos (forthcoming).
    step1: TBD
    step2: TBD
  - id: 39
    kind: body
    source: |-
      We should also add that analytic philosophy of mathematics has also been faced with similar boundary issues. If Frege’s warning in the *Grundlagen* that psychology could not contribute anything to the foundations of mathematics became for a long time the standard position, the reliance of analytic philosophy on linguistic analyses created a porous boundary between linguistics and analytic philosophy of mathematics (consider for instance the study of number words in linguistics and their use in making various ontological claims about the nature of numbers in philosophy of mathematics, see Moltmann 2013)[^moltmann-2013].
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      ### 1.4 Practice: Product or Process?
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      We surveyed how different approaches within PMP can be distinguished by 1) what areas of mathematics are considered, 2) who are the subjects doing mathematics taken to be and what this doing is taken to consists in, and 3) the adopted methodology.
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      These approaches can be seen to derive from different understandings of the term ‘practice’ in ‘philosophy of mathematical practice.’ This term suffers from a typical process/product ambiguity. Practice can either refer to the process or activity of doing mathematics, or to the product of such process. Some of the major differences among philosophers of mathematical practice have to do with this same ambiguity.
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      It is crucial to note, however, that the product/process ambiguity does not give rise to a dichotomy, but rather to a spectrum. We saw that different methodologies within PMP can be located in various positions along the normative/descriptive methodological dimension – similarly, they can be located in various positions along the product/process dimension. While foundational efforts and studies on mathematical platonism will be at the product end of the product/process dimension, studies within PMP will occupy intermediate positions. Still, many of them will be closer to the product than the process end of the spectrum.
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      For instance, the contributors of some of the most influential edited volumes and Special Issues in the field (Mancosu 2005, 2008b; Mumma and Panza 2012)[^mancosu-2005][^mancosu-2005-2][^mumma-2012][^panza-2012] zoom in on the precipitate of mathematical activity, i.e., the product: explanations, diagrammatic inferences, etc.
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      This approach can be contrasted with more traditional approaches in the philosophy of mathematics since the products on which philosophers of mathematical practice have been focusing are more heterogeneous compared to the products analyzed by traditional philosophers of mathematics. This is because it is the precipitate of a wider range of mathematical activities, including historical ones.
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      Moreover, focusing mainly on the product does not mean that the activity or the subjects engaged in it are entirely ignored. For instance, when looking at diagrammatic reasoning in Euclid, Manders (2008) refers to the ‘discipline of control’ specific to the community of geometers involved. Still, the focus is on the arguments themselves, not the activity.
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      A similar, intermediate position that works at the intersection of the process and the product is that found in Philip Kitcher’s Millian analysis of mathematics. In *The Nature of Mathematical Knowledge* (1984), Kitcher defines a mathematical practice in terms of five elements: 1) the language adopted, intended as the “vehicle for the performance of mathematical operations as well as its reporting on those operations,” 2) the metamathematical views, such as goals and values, 3) the sets of accepted statements, 4) the methods of reasoning, and 5) the questions (*ibid.* p. 163). Kitcher mainly focuses on the products of the mathematical activity but keeps in mind the specific origin of these products.
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      Even studies applying the techniques of social epistemology to the philosophy of mathematics often focus on the product. For example, it is by analyzing specific proofs, such as proofs that require large-scale collaborations like the one for the classification theorem for finite simple groups, that new epistemological evaluations are developed (Habgood-Coote and Tanswell 2021; Steingart 2012)[^habgood-coote-2021][^steingart-2012][^tanswell-2021].
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      By contrast, other philosophers of mathematical practice are better understood as located towards the process end of the product/process dimension. They focus on the process and the subjects carrying out the process, conceiving of mathematics as formed by many practices. For example, Van Bendegem and Van Kerkhove (2005, 534) characterize mathematical practices in a way that puts the community of mathematicians at the core. The other aspects of mathematical practices are, according to their view, a research program, a formal language, proof methods, concepts, argumentative methods, and proof strategies. Ferreirós (2016) offers yet another proposal, one that is inspired by Kitcher’s. He suggests revising Kitcher’s characterization of mathematical practice by emphasizing the active role of the practitioners, whom he prefers to call ‘agents,’ and by stressing the co-existence of different mathematical and proto-mathematical practices interacting with each other. Of course, the use of the singular noun ‘mathematical practice’ in other authors in no way carries the implication that mathematics is a monolithic activity, in the same way in which speaking of the nature of physical experiment is compatible with the position that physical experiments are heterogeneous.
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      For some researchers, especially those influenced by sociological and ethnographic considerations, the notion of mathematical practice (even intended in the plural) is too narrow. They are even further towards the process end of the product/process dimensions – and they also tend to be positioned towards the descriptive end of the normative/descriptive methodological dimension. They aim to replace the notion of mathematical practice with the more general concept of mathematical culture (Larvor 2016a; Selin 2000)[^larvor-2016a][^selin-2000].
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      ## 2. Above and Beyond Traditional Philosophy of Mathematics
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      In this section, we list the main motivations that led to the development of practice-based approaches in the philosophy of mathematics.
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      By the mid-20ᵗʰ century, many philosophers of mathematics seemed to have reached a consensus. Mathematics was seen as a science that yields objective and a priori knowledge. Arithmetic and logic (including set theory) were considered to be paradigmatic domains of mathematics. The main philosophical questions revolved around the possibility of mathematical knowledge, the nature of mathematical objects, and the several positions on the foundations of mathematics (usually represented by formalism, intuitionism and logicism). This philosophical outlook emerged from research on the foundations of mathematics in the late 19ᵗʰ century, especially from the work of Frege and Hilbert. Because of its popularity, it has been referred to as “mainstream philosophy of mathematics,” or, because of the central role of foundational questions, as “foundationalism” (see Horsten 2019)[^horsten-2019].
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      As noted above, the development of the philosophy of mathematical practice involved a broadening of the underlying conception of mathematics. Interestingly, this was pursued at the same time from within the foundationalist tradition in the philosophy of mathematics (e.g., by Kitcher (1984) and Maddy (1990, 1997, 2011) and from without (e.g., by philosophers like Lakatos (1976), Tymoczko (1979), and mathematicians like Davis and Hersh (1999)). In both cases, this broadening was presented as being in stark opposition to mainstream approaches in the philosophy of mathematics. The relation to analogous developments in the philosophy of science is worth noting. A practical turn in the philosophy of science occurred in the wake of Thomas Kuhn’s groundbreaking *The Structure of Scientific Revolutions* (1962) – see Soler et al. (2014).
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      In this section, we present some of the main considerations that played in favor of extending the range of philosophical studies about mathematics. We end by distinguishing two camps into which philosophers of mathematical practice can be divided: an ecumenical one that emphasizes the continuity and complementarity with foundational projects and an anti-foundational one.
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      ### 2.1 Pressures on Foundationalist Programs
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      Part of the impetus to explore new directions in the philosophy of mathematics came from what was perceived as a failure of the main schools in the foundations of mathematics, namely logicism, formalism, and intuitionism (see the entry on philosophy of mathematics). All three schools ran into difficulties that some have perceived as insurmountable.
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      In brief, Frege’s attempt to reduce arithmetic and analysis to logic was halted by Russell’s Paradox – and Russell’s own version of logicism had to accept principles (the Axiom of Infinity and the Axiom of Reducibility) that could hardly be considered logical. Hilbert’s program found an impasse in Gödel’s Incompleteness Theorems, which showed some principled limitations to what could be proved in formal systems. Brouwer’s intuitionism rejected widely used mathematical principles, such as the law of excluded middle, and could therefore not become a viable account of generally accepted mathematics. This is not to say that new versions of Fregeanism (neo-logicism), modified versions of Hilbert’s program, and varieties of constructive mathematics are not still viable possibilities, but only that the original foundational schools did encounter significant impasses.
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      This might also be the place to point out that the development of foundationalist positions often demands a deep understanding of important aspects of mathematical practice. Just to give one example, how different areas of mathematics are affected by foundational restrictions (say, what can be rescued of classical analysis when your principles are restricted to set-existence axioms limited in various ways such as in reverse mathematics (Simpson 2009; Stillwell 2018)[^simpson-2009][^stillwell-2018] is a type of foundational investigation that requires intimate knowledge of mathematical practice. Of course, proponents of PMP would go on to point out that one cannot limit attention to only these aspects of the mathematical activity.
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      ### 2.2 Overly General Questions
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      Another reason that motivated PMP approaches is that beyond foundational issues, traditional philosophy of mathematics in the 20ᵗʰ century has focused almost exclusively on very general ontological, semantical, and epistemological questions that did not require extensive attention to mathematics.
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      While the three main schools in the foundations of mathematics were looking inward, since they were concerned with securing mathematical knowledge, analytic philosophy of mathematics also explored the role and indispensability of mathematics in empirical sciences in order to address general questions about the existence of abstract objects, their nature, and our knowledge thereof.
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      In particular, various articles by Quine (1948, 1951) and two articles by Paul Benacerraf (“What Numbers Could Not Be” (1965) and “Mathematical Truth” (1973)), dominated the landscape. Much of the action in the seventies and eighties was focused on the nominalism-platonism debate with no lack of clever work all around (neo-logicism; structuralism; indispensability arguments; nominalistic approaches; etc.).
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      ### 2.3 The Relevance of History
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      Another motivation to look at the practice comes from philosophical issues that emerged from taking seriously the history of mathematics. One important precursor of PMP is Imre Lakatos’ *Proofs and Refutations* (1976). In his rational reconstruction of a historical case study from combinatorial topology (Euler’s theorem on polyhedra), Lakatos emphasized the quasi-empirical nature of the development of mathematics in which previously accepted arguments and results could be refuted by counterexamples by yielding new, more general theorems. This challenged the view of mathematics as a static body of a priori knowledge held in place by an unshakable foundation in a Euclidean axiomatic style. Moreover, it opened new topics of investigation, such as the nature of mathematical rigor and the process of mathematical discovery, the role of fruitful definitions, and the explanatory value of mathematical theories.
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      Lakatos rejects the separation of the contexts of discovery and justification, and puts forward a view of mathematics as dynamic, tentative, and fallible. This perspective on mathematics was deeply influenced by George Polya’s (1945) writings on heuristics. Lakatos also raised some very broad questions about mathematics and its development: how does mathematics grow? What is progress in mathematics? These topics were the focus, among other contributions, of the collection Breger and Grosholz 2000.
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      Lakatos’ work had an impact in the work of many scholars who count as major contributors to PMP. See Gillies 2023 for a discussion of several contributions along the lines of a historical approach to the philosophy of mathematics that reveal the influence of Lakatos’ approach. Gillies’ discussion includes some of the most active philosophers in PMP.
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      Lakatos’ account was also criticized, and it is not clear how it could be extended to contemporary mathematics (Feferman 1978)[^feferman-1978]. Moreover, his sample was very narrow: one case from topology and one case from real analysis (on Cauchy). To repeat, many studies in the history of mathematics have provided ample material for analysis by philosophers of mathematical practice but some areas of investigation have seen a convergence of perspectives coming from different approaches. We are thinking for instance of the diagrammatic reasoning in Euclid’s *Elements* as developed by Manders (2008), who was coming from a philosophical perspective, and Netz (1999), who merged cognitive and historical motivations.
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      ### 2.4 Alternative Foundations
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      Beyond the impasses the foundational schools encountered, we can identify both global and local challenges to the set-theoretic foundationalist picture of mathematics. Global challenges derive from the development of category theory as an alternative foundation of mathematics as well as from the recent program in homotopy type theory. Local challenges, which we discuss in the next section, derived from what some consider a change in the nature of proofs, due to technological advancements. Thus, the ultimate nature of the set-theoretic foundation of mathematics is not only challenged by the mathematics of the past but also by more recent developments in mathematics.
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      Set theory is generally understood to provide the standard foundational apparatus for mathematics. Still, there are ongoing debates on the acceptability of some axioms. The status of the Axiom of Choice and of the Continuum Hypothesis as well as the use of Large Cardinal Axioms remain topics of debate that are significant for the practice of set theory. Interesting questions for the philosophy of mathematical practice here concern the rationale for the choice of new axioms (see for instance Maddy 2011)[^maddy-2011] and the intertwined nature of philosophical motivation and mathematical developments that is characteristic of the attempts to overcome the incompleteness of set theory. See Rittberg 2020 for an overview of two recent programs, those of Woodin and Hamkins, and further references.
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      With the advent and increasing popularity of category theory, the special role of set theory has been challenged. Category theory offers an alternative perspective on mathematics, one that does not seem to be in need of an account of mathematical objects, such as sets and numbers. Looking at mathematics from the perspective of category theory thus naturally leads to new philosophical questions. Here we need to distinguish two questions: 1) Can category theory claim to be a foundations of mathematics on a par, or even with better features, than set theory? The debate on this topic has been quite lively. 2) Does category theory display novel and interesting features (independently of its possible role as a foundations of mathematics) which can be of relevance to PMP? The answer to the latter question should be an unequivocal Yes both on account of the role that category theory plays in the formulations of important mathematical theories as well as on account of the attention that philosophers of mathematical practice have displayed towards it. Further readings in the history and philosophy of category theory include (Awodey 2008, 1996; Krömer 2007; Landry 2017; Landry and Marquis 2005; Marquis 2009; McLarty 2005, 2008, 1992)[^awodey-2008][^krömer-2007][^landry-2017][^landry-2005][^marquis-2009][^mclarty-2005]. For a general overview, see Marquis 2023.
    step1: TBD
    step2: TBD
  - id: 73
    kind: body
    source: |-
      Of course, challenges to set theory as foundations of mathematics in the constructivist tradition have been countless, but we cannot survey them here (however, see the section below for some comments on homotopy type theory). Once again, attention to mathematical practice is essential in this area as one would like to know how much of classical mathematics can be given a constructivist or computational meaning. An excellent, if now outdated, reference in this area remains Beeson 1985; for more recent work see Bridges et al. 2023.
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      ### 2.5 Technological Developments
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      Local challenges to the foundationalist picture came from technological advancements that led to rethink the nature of mathematical proofs. For instance, the existence of computer-assisted proofs has put pressure on the idea that proofs should be the kind of arguments that a single mathematician could survey.
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      When Kenneth Appel and Wolfgang Haken (1977) announced a computer-assisted proof of the 4-color conjecture, this brought to the forefront a novel aspect of the way in which mathematics proceeds. The conjecture states that all planar maps can be colored with only four colors in such a way that no two adjacent regions share the same color. It entered the agenda of mathematicians in the mid-19th century, but a genuine proof was first published after more than a century. Appel and Haken’s proof raised much ado in both the mathematical and the philosophical community. Being beyond the reach of flash-and-blood mathematicians, it challenged the very nature of mathematical proofs and questioned the a priori status of mathematical knowledge (Detlefsen and Luker 1980; Tymoczko 1979)[^detlefsen-1980][^tymoczko-1979]. For a defense of the a priori nature of computer-assisted proofs, see (Burge 1998; Duede and Davey 2026)[^burge-1998][^duede-2026].
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      Another development that is worth mentioning is one related to Interactive Theorem Provers (ITP). These are computer tools supposed to help mathematicians in creating formal counterparts of their proofs. They are gaining traction among some mathematicians, but their use is still limited. However, some think that in the not so distant future, their use will be much more common, at least in some areas of mathematics (Avigad 2018b; Buzzard 2022; Avigad 2024)[^avigad-2018b][^avigad-2024][^buzzard-2022]. For a philosophical discussion, see (De Toffoli 2024).
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      The use of ITPs is also linked to alternative foundations of mathematics. As a matter of fact, in the last part of his career, Vladimir Voevodsky contributed to the effort of developing homotopy type theory (HoTT) as a new foundational framework for mathematics that could be more readily integrated into ITPs (Voevodsky 2014 – see Other Internet Resources). Voevodsky’s main motivation in developing and promoting ITPs was related to worries related to the correctness of published mathematical results. For a useful set of contributions on different foundations approaches such as set theory and homotopy type theory see Centrone, Kant, and Sarikaya 2019.
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      ITPs have been used to check the correctness of traditional proofs. Moreover, they have also been deployed to check the correctness of computer-assisted proofs, whose epistemological status remains somewhat borderline. One of the first major achievements in the formalization of mathematics is George Gothier’s formalization of a proof of the 4-color Theorem in 2005. Another major achievement is the formalization of Tom Hales’ proof of the Kepler Conjecture, which extensively used automated computations, by him and a group of collaborators (Hales et al. 2017)[^hales-2017].
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      The use of technology in mathematics is continuing to grow, and new AI tools are already posing new philosophical challenges. See, for example, the contribution in the Special Issue of the *Bulletin of the American Mathematical Society* dedicated to the topic (Fraser et al. 2024)[^fraser-2024].
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      Another area of interest, which has been aided by technological developments, is experimental mathematics. The *Handbook in the History and Philosophy of Mathematical Practice* (Sriraman 2024)[^sriraman-2024] contains many articles devoted this topic – see, among others (Carter 2024a; Sørensen 2024)[^carter-2024a][^sørensen-2024].
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      ### 2.6 Ecumenical and Anti-Foundationalist PMP
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      Not all philosophers of mathematical practice share the same attitude towards more foundationalist traditions. We propose to make a distinction between an ecumenical stance, adopted by philosophers of mathematical practice who see their work as complementary to foundational endeavors, and an anti-foundationalist stance, taken up by those who position themselves in straight opposition to them.
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      Early authors working on what came to be called the philosophy of mathematical practice prefaced their studies with an explicit and often polemical rejection of what they considered to be the received view. For example, Lakatos (1976) explicitly argued against a ‘deductivist’ view of mathematics, while Tymoczko (1986) and Aspray and Kitcher (1988) saw in foundationalist approaches their primary target. To emphasize the radical nature of their view, the latter presented themselves as part of the “maverick tradition” in philosophy of mathematics.
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      In addition to creating an ideological rift within the philosophy of mathematics, this narrative also ignored the fact that philosophers within the foundationalist tradition itself had begun to criticize foundationalist approaches (Putnam 1967; Quine 1951)[^putnam-1967][^quine-1951] and to pursue new questions related to contemporary mathematics (Maddy 1996)[^maddy-1996].
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      The ecumenical stance does not oppose foundational efforts. It considers them to be valuable contributions to the philosophy of mathematics while at the same time recognizing that there are other important questions to be addressed. This stance is well-exemplified in the volume “The Philosophy of Mathematical Practice” (Mancosu 2008b)[^mancosu-2008b]. On the contrary, the anti-foundationalist stance directly opposes foundationalist efforts. A contribution adopting this stance is Corfield 2003. Even within the analytic framework, one can perceive anti-foundationalist features in the work of Maddy (1997), at least to the extent that her naturalism rejects a philosophy-first approach and she embraces a methodology that sits uncomfortably with the traditional foundationalist programs.
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
    source: |-
      While the ecumenical stance sees the developments in the philosophy of mathematics as an extension of the topics and the perspectives which fall under the purview of philosophy of mathematics, the anti-foundationalist stance sees it as an irreconcilable split between different approaches and traditions. The latter is made explicit in the “brief and biased history” of philosophy of mathematics by Aspray and Kitcher (1988), who identify two traditions that are centered around two general research programs: (1) the *mainstream*, which started with Frege and is centered around questions regarding the foundations of mathematics; and (2) a much less developed, *maverick tradition* that began with Lakatos. Philosophical topics within the latter tradition deal with current or historical mathematical practices and include the growth of mathematical knowledge, the nature of mathematical progress, the criteria for evaluating mathematical ideas and theories, and the nature of mathematical explanation.
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      On the relation between these two traditions, Aspray and Kitcher find no consensus among philosophers of mathematics. Some, such as Parsons, Steiner and Maddy, suggest that they are compatible, while others, such as Lakatos and Kitcher, have argued on the basis of the methodology of mathematics, that there is no a priori foundation of mathematics (thus concluding that the Fregean tradition leads to a dead end). The question whether philosophy of mathematics should be concerned with identifying foundations of mathematics is singled out as provoking “the clearest divisions in the volume” that they edited.
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      A philosopher who explicitly opposes research on the foundations of mathematics is Carlo Cellucci (2006, 32), who speaks of the “rejection” of the dominant view in the philosophy of mathematics that considers the justification of mathematics, rather than mathematical discovery, as its main problem. He rejects more ecumenical approaches as being an extension of mainstream philosophy of mathematics, but not as a proper alternative.
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      In a similar vein, David Corfield sees himself as continuing the Lakatos tradition in philosophy of mathematics and he clearly takes a side with regard to the question regarding its relation to foundationalist philosophy of mathematics. He speaks of dismantling the “foundationalist filter” that has held back philosophers from taking seriously past and contemporary mathematics, because of their inability of providing novel contributions to the foundationalist questions, and he presents his discussion as a head-on confrontation of such “erroneous beliefs” (Corfield 2003, 5)[^corfield-2003]. Reactions have been mixed: Unsurprisingly, Corfield’s “anti-foundationalist manifesto” has irked some philosophers (Paseau 2005, 195)[^paseau-2005], while for others that are more sympathetic to the general approach “Corfield’s project is not nearly as radical as he would have us think” (Arana 2007, 83)[^arana-2007].
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      In the next section, we include a brief survey of what we consider to be among the most important topics that have been investigated within PMP. They all fall under the umbrella heading of epistemic virtues in mathematics.
    step1: TBD
    step2: TBD
