      Moreover, 20ᵗʰ-century analytical philosophy of mathematics has almost exclusively focused on general epistemological and ontological questions that by and large could be framed in terms of set theory. This has led to reducing philosophical discussions about mathematics to philosophical discussions about sets (what are they? How can we have access to them?), thus neglecting the specificities of different branches of mathematics. Jeremy Avigad is explicit about the negative effect that this had on the philosophy of mathematics:
    step1: |-
      此外，20 世纪的分析数学哲学几乎只聚焦于一般性的认识论与本体论问题，而这些大体都能用集合论的术语来框定。其结果是，关于数学的哲学讨论被化约为关于集合的哲学讨论（集合是什么？我们如何通达它们？），数学各分支的特殊性则被忽视。杰里米·阿维加德（Jeremy Avigad）对这种做法给数学哲学带来的负面效应说得很明白：
    step2: |-
      此外，20 世纪的分析数学哲学几乎只聚焦一般性的认识论与本体论问题，而这些大体都能用集合论术语框定。其结果是，关于数学的哲学讨论被化约为关于集合的哲学讨论（集合是什么？我们如何通达它们？），数学各分支的特殊性则遭忽视。杰里米·阿维加德（Jeremy Avigad）对这种做法的负面效应说得很明白：
  - id: 15
    kind: body
    source: |-
      > The problem is that set-theoretic idealisation idealises too much. Mathematical thought is messy. When we dig beneath the neatly composed surface we find a great buzzing, blooming confusion of ideas, and we have a lot to learn about how mathematics channels these wellsprings of creativity into rigorous scientific discourse. But that requires doing hard work and getting our hands dirty. And so the call of the sirens is pleasant and enticing: mathematics is set theory! Just tell us a really good story about abstract objects, and the secrets of the Universe will be unlocked. This siren song has held the philosophy of mathematics in thrall, leaving it to drift into the rocky shores. (2018a, 6)
    step1: |-
      > 问题在于，集合论式的理想化理想化得过了头。数学思想是杂乱的。在整洁的表层之下挖下去，我们会发现一片嗡嗡作响、纷然杂陈的观念丛林；数学如何把这些创造的泉源引入严格的科学话语，这方面我们还有很多要学。但这需要下硬功夫，需要把手弄脏。于是海妖的歌声显得悦耳而诱人：数学就是集合论！只要给我们讲一个关于抽象对象的好故事，宇宙的秘密就将被解开。这首塞壬之歌把数学哲学迷得神魂颠倒，任它漂向礁石。（2018a, 6）
    step2: |-
      > 问题在于，集合论式的理想化理想化得过了头。数学思想是杂乱的。在整洁的表层之下挖下去，会发现一片嗡嗡作响、纷然杂陈的观念丛林；数学如何把这些创造泉源引入严格的科学话语，这方面我们还有很多要学。但这需要下硬功夫、把手弄脏。于是海妖的歌声显得悦耳诱人：数学就是集合论！只要给我们讲一个关于抽象对象的好故事，宇宙的秘密就将被解开。这首塞壬之歌把数学哲学迷得神魂颠倒，任它漂向礁石。（2018a, 6）
  - id: 16
    kind: body
    source: |-
      Philosophers of mathematical practice tend to get their hands dirty with all sorts of different mathematics. They recognize that mathematics is not monolithic but multiform. The common thought is that focusing on a few areas such as arithmetic and set theory results in a lost opportunity for philosophical analyses of mathematics.
    step1: |-
      数学实践哲学家则乐于把手弄脏，涉足五花八门的数学。他们承认，数学不是铁板一块，而是形态多样。共同的看法是：只盯着算术、集合论这几个领域，就错失了对数学作哲学分析的机会。
    step2: |-
