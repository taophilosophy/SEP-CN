  - id: 10
    kind: body
    source: |-
      It is notoriously difficult to define what mathematics is. Nonetheless, philosophers of mathematics usually share certain assumptions about the nature of mathematics. These assumptions include what domains should be investigated. 20ᵗʰ-century foundational approaches have mainly focused on arithmetic, set theory, and logic (and to a more limited extent on elementary geometry). Instead, PMP considers all areas of mathematics to be under its purview.
    step1: |-
      众所周知，给数学下定义是件难事。不过，数学哲学家对数学的本性通常共享一些假设。这些假设包括：应当研究哪些领域。20 世纪的基础主义进路主要聚焦于算术、集合论与逻辑（在更有限的程度上也涉及初等几何）。与此不同，PMP 把数学的所有领域都纳入自己的管辖范围。
    step2: |-
      众所周知，给数学下定义是件难事。不过，数学哲学家对数学的本性通常共享一些假设，其中包括：应当研究哪些领域。20 世纪的基础主义进路主要聚焦算术、集合论与逻辑（在更有限程度上也涉及初等几何）。与此不同，PMP 把数学的所有领域都纳入自己的管辖范围。
  - id: 11
    kind: body
    source: |-
      The oldest areas of mathematics are geometry and arithmetic, which originated from the everyday activities of measuring and counting. With time, more abstract areas developed, such as topology, abstract algebra, real and complex analysis, set theory, and category theory. Logic, as the study of reasoning, also originates in antiquity but became a mathematical theory only in the 19ᵗʰ century.
    step1: |-
      最古老的数学领域是几何与算术，它们源自测量与计数这些日常活动。随着时间推移，更抽象的领域相继发展起来，如拓扑学、抽象代数、实分析与复分析、集合论、范畴论。逻辑作为对推理的研究，同样起源于古代，但直到 19 世纪才成为一门数学理论。
    step2: |-
      最古老的数学领域是几何与算术，源自测量与计数这些日常活动。随着时间推移，更抽象的领域相继发展：拓扑学、抽象代数、实分析与复分析、集合论、范畴论。逻辑作为对推理的研究同样起源于古代，但直到 19 世纪才成为一门数学理论。
  - id: 12
    kind: body
    source: |-
      Geometry has been considered the paradigm of rigorous mathematics for about two millennia, from Euclid’s time all the way to the end of the 18ᵗʰ century. While the historical development is complicated, there is no denying that in the 19ᵗʰ century arithmetic and algebra became more central to foundational concerns, for instance in the works of Gauss, Bolzano, Dedekind, and Frege.
    step1: |-
      大约两千年来——从欧几里得的时代一直到 18 世纪末——几何学一直被视为严格性数学的典范。历史发展固然复杂，但无可否认：19 世纪，算术与代数成为基础问题的核心，例如高斯、波尔查诺、戴德金与弗雷格的工作。
    step2: |-
      大约两千年来——从欧几里得的时代直到 18 世纪末——几何学一直被视为严格数学的典范。历史发展固然复杂，但无可否认：19 世纪，算术与代数成了基础问题的核心，例如高斯、波尔查诺、戴德金与弗雷格的工作。
  - id: 13
    kind: body
    source: |-
      Indeed, foundational approaches have mostly concentrated on arithmetic because they take it to be representative or more fundamental. Frege’s logicism is a prime example of this – the primary aim of Frege’s logicism is to reduce arithmetic (not all mathematics!) to logic.
    step1: |-
      确实，基础主义进路大多聚焦于算术，因为它们把算术当作有代表性或更根本的领域。弗雷格的逻辑主义就是典型——它的首要目标，是把算术（而不是全部数学！）还原为逻辑。
    step2: |-
