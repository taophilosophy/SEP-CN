      Interactions between PMP and mainstream epistemology include discussions on epistemic defeaters (Easwaran 2015)[^easwaran-2015] and fallibility (De Toffoli 2021a; Dove 2003; Easwaran 2009)[^dove-2003][^easwaran-2009]. Moreover, themes of social epistemology are also being investigated within PMP. Mathematicians rely on each other (and at times on machines) to check the correctness of their putative proofs. They also commonly rely on results without proving them for themselves. Focusing on the social dimension of mathematics has shown that themes that are gaining traction in social epistemology could be fruitfully applied to the philosophy of mathematics, and scholars working in PMP have been especially sensitive to incorporating these developments. These themes include group knowledge and justification (Habgood-Coote and Tanswell 2021)[^habgood-coote-2021][^tanswell-2021], testimony (Geist, Löwe, and Van Kerkhove 2010; Andersen, Andersen, and Sørensen 2021), trust (De Toffoli and Tanswell 2025), epistemic exclusions (Rittberg 2023)[^rittberg-2023], epistemic injustice (Rittberg, Tanswell, and Van Bendegem 2020; Hunsicker and Rittberg 2022)[^hunsicker-2022], and the epistemic significance of disagreement (Aberdein 2023; De Toffoli and Fontanari 2023; Kant 2025)[^aberdein-2023][^kant-2025].
    step1: |-
      PMP 与主流认识论的互动，包括关于认知挫败者的讨论（Easwaran 2015）[^easwaran-2015]与可错论的讨论（De Toffoli 2021a; Dove 2003; Easwaran 2009）[^dove-2003][^easwaran-2009]。此外，社会认识论的主题也在 PMP 内部得到研究。数学家彼此依赖（有时依赖机器）来核查其候选证明的正确性；他们也常常径直引用结果而不亲自证明。聚焦数学的社会维度表明：社会认识论中日渐走红的主题，可以富有成果地应用于数学哲学；从事 PMP 的学者对吸纳这些发展尤为敏感。这些主题包括：群体知识与辩护（Habgood-Coote and Tanswell 2021）[^habgood-coote-2021][^tanswell-2021]、证言（Geist, Löwe, and Van Kerkhove 2010; Andersen, Andersen, and Sørensen 2021）、信任（De Toffoli and Tanswell 2025）、认知排斥（Rittberg 2023）[^rittberg-2023]、认知不正义（Rittberg, Tanswell, and Van Bendegem 2020; Hunsicker and Rittberg 2022）[^hunsicker-2022]，以及分歧的认识论意义（Aberdein 2023; De Toffoli and Fontanari 2023; Kant 2025）[^aberdein-2023][^kant-2025]。
