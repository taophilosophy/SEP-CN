      We should also add that analytic philosophy of mathematics has also been faced with similar boundary issues. If Frege’s warning in the *Grundlagen* that psychology could not contribute anything to the foundations of mathematics became for a long time the standard position, the reliance of analytic philosophy on linguistic analyses created a porous boundary between linguistics and analytic philosophy of mathematics (consider for instance the study of number words in linguistics and their use in making various ontological claims about the nature of numbers in philosophy of mathematics, see Moltmann 2013)[^moltmann-2013].
