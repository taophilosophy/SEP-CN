      Finally, Marsilius’s understanding of *per se* predication provides a similar picture. His point of departure again is Buridan. Yet, he includes some remarkable new elements. For example, he defines *per se* predication not as a necessary predication, as Buridan and most contemporary authors do, but as a predication which excludes any contingency. Thus *per se* predication covers both necessary propositions like ‘Man is a living being’ and impossible ones such as ‘Man is a donkey’. Also, he widens the realm of *per se* predications by allowing not only the traditional categorical affirmative *per se* predication, but also hypothetical and negative ones, like ‘If there are humans, all humans are living beings, and ‘Man is not a donkey’. Here, his probable sources of inspiration were William of Ockham and Albert of Saxony (Corbini 2015)[^corbini-2015].
    step1: |-
      最后，马西利乌斯对*自身*谓述的理解呈现出类似的图景。他的出发点同样是布里丹。然而，他纳入了一些引人注目的新要素。例如，他并不像布里丹与大多数同时代作者那样把*自身*谓述定义为必然谓述，而是定义为一个排除了任何偶然性的谓述。因此，*自身*谓述既涵盖“人是生物”这类必然命题，也涵盖“人是驴”这类不可能命题。此外，他拓宽了*自身*谓述的领域，不仅允许传统的直言肯定*自身*谓述，还允许假言的和否定的*自身*谓述，如“如果存在人，那么所有人都是生物”以及“人不是驴”。此处，他可能的灵感来源是奥卡姆的威廉与萨克森的阿尔伯特（Corbini 2015）[^corbini-2015]。
    step2: |-
      最后，马西利乌斯对*自身*谓述的理解也呈现类似的图景。出发点仍是布里丹，但他添入了一些引人注目的新要素。例如，他不像布里丹与大多数同时代作者那样，把*自身*谓述定义为必然谓述，而是定义为排除了一切偶然性的谓述。于是，*自身*谓述既涵盖“人是生物”这类必然命题，也涵盖“人是驴”这类不可能命题。他还拓宽了*自身*谓述的地盘：不仅容纳传统的直言肯定*自身*谓述，也容纳假言的和否定的*自身*谓述——“如果存在人，那么所有人都是生物”“人不是驴”。此处，他可能的灵感来源是奥卡姆的威廉与萨克森的阿尔伯特（Corbini 2015）[^corbini-2015]。
