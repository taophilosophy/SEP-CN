      Marsilius was his own person when it came to assessing the views of others. In his analysis of the proposition ‘Socrates is not a chimera’ he followed what he called ‘the Parisian method’, according to which the proposition is false because the term ‘chimera’ supposits for nothing, there being no real chimeras to which it can refer. Others, however, considered the proposition to be true [TPT, 84]. Yet, even though ‘chimera’ has no supposition, for Marsilius it has a signification of its own, in contrast to his Parisian colleague Buridan, who claimed that ‘chimera’ only has a complex signification, dependent on its constituent parts, such as the body of a goat and the head of a lion (see Ciola 2020)[^ciola-2020].
    step1: |-
      在评价他人的观点时，马西利乌斯自成一格。在分析命题“苏格拉底不是客迈拉”时，他遵循所谓“巴黎方法”：该命题为假，因为“客迈拉”一词无所指代——不存在它所能指涉的实在的客迈拉。然而，其他人认为该命题为真［TPT, 84］。不过，即便“客迈拉”没有指代，在马西利乌斯看来它仍有自己的意谓——这与他的巴黎同事布里丹形成对照，后者主张“客迈拉”只有复杂意谓，依赖其构成部分，如山羊的身体与狮子的头（见 Ciola 2020）[^ciola-2020]。
