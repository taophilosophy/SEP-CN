      According to Marsilius, the ten Aristotelian categories refer to things in reality which themselves are not signs of other things. These categories are names or concepts of primary intention, as he calls them. However, since there are also names which are used to refer to signs or to names of things and not to things themselves — such as the terms ‘genus’ and ‘species’, which are called names of secondary intention — there needs to be an additional category of secondary intention, beside the ten Aristotelian categories of primary intention. This category may be called the ‘category of signs’ (*praedicamentum signi*) or the ‘category of terms’ (*praedicamentum termini*), Marsilius says.[^note-9] The existence of such a category does not refute the traditional number of ten categories, since the traditional categories, even though they are names or concepts themselves, do not refer to names or concepts, but to things in reality. In claiming such a category, Marsilius goes beyond John Buridan, who does not recognize it, and further elaborates a position already mentioned by Duns Scotus. Accordingly, for the metaphysician who considers ‘being as being’ (*ens inquantum ens*) there are only ten categories, whereas for the logician who deals with ‘concepts as concepts’ (*intentiones per se*) there are more than ten. In the late Middle Ages, philosophers like John Eck attributed the view that there is an additional category called *praedicamentum signi* to Marsilius of Inghen and his followers, among whom was the Nominalist John Parreut.[^note-10]
    step1: |-
      按马西利乌斯的说法，十个亚里士多德范畴指涉实在中那些本身不是其他事物之符号的事物。这些范畴是他所谓的第一意向的名称或概念。然而，既然还有一些名称被用来指涉符号或事物的名称而非事物本身——例如“属”与“种”这两个词项，它们被称为第二意向的名称——那么，在十个第一意向的亚里士多德范畴之外，还需要一个第二意向的范畴。马西利乌斯说，这个范畴可以称为“符号范畴”（*praedicamentum signi*）或“词项范畴”（*praedicamentum termini*）。[^note-9] 这样一个范畴的存在并不推翻十个范畴的传统数目，因为传统范畴尽管本身也是名称或概念，指涉的却不是名称或概念，而是实在中的事物。通过主张这样一个范畴，马西利乌斯超越了不承认它的约翰·布里丹，并进一步阐发了邓斯·司各脱已经提到的一个立场。据此，对考虑“作为存在的存在”（*ens inquantum ens*）的形而上学家而言，只有十个范畴；而对处理“作为概念的概念”（*intentiones per se*）的逻辑学家而言，范畴多于十个。在中世纪晚期，约翰·艾克等哲学家把存在一个名为 *praedicamentum signi* 的额外范畴的观点归于因根的马西利乌斯及其追随者，其中有唯名论者约翰·帕勒特。[^note-10]
    step2: |-
      按马西利乌斯的说法，十个亚里士多德范畴所指涉的，是实在中那些本身并非其他事物之符号的事物——这些范畴是他所谓的第一意向的名称或概念。然而，既然还有些名称被用来指涉符号、或指涉事物的名称而非事物本身——例如“属”与“种”这两个词项，即所谓第二意向的名称——那么，在十个第一意向的亚里士多德范畴之外，还需增设一个第二意向的范畴。马西利乌斯说，这一范畴可名为“符号范畴”（*praedicamentum signi*）或“词项范畴”（*praedicamentum termini*）。[^note-9] 这般范畴的存在并不推翻十范畴的传统数目：传统范畴虽然本身也是名称或概念，指涉的却不是名称或概念，而是实在中的事物。主张这样一个范畴，马西利乌斯便越过了不承认它的约翰·布里丹，并进一步阐发了邓斯·司各脱已提及的一个立场。据此：对考虑“作为存在的存在”（*ens inquantum ens*）的形而上学家而言，范畴只有十个；对处理“作为概念的概念”（*intentiones per se*）的逻辑学家而言，范畴多于十个。中世纪晚期，约翰·艾克等哲学家把“存在名为 *praedicamentum signi* 的额外范畴”之说归于因根的马西利乌斯及其追随者——唯名论者约翰·帕勒特亦在其中。[^note-10]
