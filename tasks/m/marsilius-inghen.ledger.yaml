    source: |-
      In the later Middle Ages the study of the soul was part of natural philosophy. Marsilius treated the human soul in his commentary on Aristotle’s *De anima*, in which he followed the Parisian tradition of Buridan and Oresme concerning the particular questions addressed. Following Buridan, he argued that there is no natural proof of the immortality of the human soul. For the human natural mind, unaided by revelation, the theory of Alexander of Aphrodisias that the human soul is corruptible is the most probable. That Alexander of Aphrodisias is mistaken and that the soul continues to exist after the death of the body is known through revelation alone. Faith has more authority than human reason and must be accepted in all cases where the two conflict since the things we believe on faith come from God, who cannot err.[^note-14]
    step1: |-

    step2: |-

  - id: 39
    kind: body
    source: |-
      ### 2.3 Metaphysics
    step1: |-

    step2: |-

  - id: 40
    kind: body
    source: |-
      Although metaphysics cannot surpass the limits of human knowledge, Marsilius considered it to be the entry point to theology. Natural reason is capable of forming some adequate and true concepts of God, and also of forming true propositions about God. It is able to prove that God exists and possesses knowledge and will. But it cannot demonstrate that God has free will or infinite power. This, Marsilius claimed, was also true for philosophers such as Aristotle, whose teachings equal those of natural reason itself [SE0, fol. 178va–179ra].
    step1: |-

    step2: |-

  - id: 41
    kind: body
    source: |-
      From Buridan, Marsilius took the idea that God according to Aristotle and Averroes is not only the final cause of the heavens and separate substances, but also their efficient cause. On this point Buridan and Marsilius were following the view of Scotus and Ockham against that of John of Jandun, Johannes Baconis, and Gregory of Rimini. It is worth noting in this connection that in the *Puncta super libros Metaphysicae* (i.e., brief abstracts of Aristotle’s *Metaphysics* for teaching purposes) attributed to Johannes de Slupcza and written in Krakow in 1433, some of the views that Marsilius adopted from Buridan, including the one just mentioned, are attributed to Marsilius instead of Buridan — notwithstanding the fact that the author was familiar with both Marsilius’s and Buridan’s commentaries. This illustrates the strong influence Marsilius’s work exerted on fifteenth-century students and commentators (see Tatarzynski 1979)[^tatarzynski-1979].
    step1: |-

    step2: |-

  - id: 42
    kind: body
    source: |-
      On other points, however, Marsilius was critical of Buridan. For example, concerning the question of whether God can restore things that have been corrupted, Marsilius argues that he cannot, even miraculously, because he cannot do what in itself implies a contradiction. Buridan, however, had claimed that even though naturally speaking corrupted things cannot be restored, God has the supernatural power to do so (see Wood 2023)[^wood-2023]. Also, Marsilius considered Buridan’s solution to the problem of the possible separation of accidents from their substance as not in accordance with the teachings of Aristotle, and therefore not truly metaphysical (*metaphysicaliter*), but rather in line with theological concerns. Only miraculously could God take over the supporting power of the substance, thus separating the accident from its natural bearer. According to Marsilius, however, such possible divine intervention should not be taken into account in metaphysics, where the philosopher must use natural reason alone (see Bakker 2000)[^bakker-2000].
    step1: |-

    step2: |-

  - id: 43
    kind: body
    source: |-
      Marsilius was the first rector of the University of Heidelberg. According to the oldest Statutes of the Arts Faculty of this university, every master must inform the students that whenever Aristotle contradicts faith, e.g. in his claim that the world is eternal, he is following natural reason and although his arguments in these cases are wrong and faith must be accepted, natural reason cannot help but follow Aristotle and therefore cannot prove the conclusions of faith (see Winkelmann 1886, 41)[^winkelmann-1886]. This paragraph clearly echos Marsilius’s view on the issue. Other contemporary universities, like that of Vienna, were less rigorous and prescribed a more harmonious procedure, stipulating that whenever there was a conflict with faith, the masters had to argue in favor of faith against Aristotle to the best of their possibilities (see Kink 1854, 202 (titulus 17)).
    step1: |-

    step2: |-

  - id: 44
    kind: body
    source: |-
      ### 2.4 Theology
    step1: |-

    step2: |-

  - id: 45
    kind: body
    source: |-
      Marsilius expressed his theological views in a voluminous commentary on the *Sentences*. He quoted and often adopted views that were put forward by fourteenth-century theologians such as Adam Wodeham and Gregory of Rimini, but was also influenced by earlier thinkers such as Thomas Aquinas and Bonaventure. He has serious reservations about the use of logic in theology.
    step1: |-

    step2: |-

  - id: 46
    kind: body
    source: |-
      #### 2.4.1 Attributes and Ideas
    step1: |-

    step2: |-

  - id: 47
    kind: body
    source: |-
      In his discussion of the divine attributes he followed mainly the teachings of Adam Wodeham. God is perfectly one. Divine wisdom and all other perfections attributed to God are in reality as identical to the divine essence as the divine essence is identical to itself. In the divine essence itself there is no distinction or non-identity whatsoever between the attributes of God. Any distinctions between divine attributes are necessarily of a rational (rather than real) nature and are made by us.[^note-15]
    step1: |-

    step2: |-

  - id: 48
    kind: body
    source: |-
      A similarly radical stance on the unity of God was assumed in his treatment of divine ideas. Ideas are not formally distinct in God, as some Scotists would argue, but only extrinsically and objectively distinct. Their distinction is a consequence of the differences between the creatures produced by God (which is why Marsilius spoke of extrinsic distinction), and of the fact that they are known by God as different (which accounts for their objective distinction). God knows that he is the cause of infinitely many differences between creatures. That is why his mind contains infinitely many different ideas [SE1, 7–15].
    step1: |-

    step2: |-

  - id: 49
    kind: body
    source: |-
      Marsilius criticized Ockham’s view that God’s idea coincides with creation. If this were true, Marsilius argued, the idea of producing a stone must be identical with either the stone itself, or the stone insofar as it is known by God. If the former, then God must look outside of himself in his idea, which contradicts the position of Augustine, who is quoted by Ockham. If the latter, then the idea of its production is not the stone itself, but rather God’s foreknowledge of the stone [SE1, 15–17].
    step1: |-

    step2: |-

  - id: 50
    kind: body
    source: |-
      #### 2.4.2 Theology and Logic
    step1: |-

    step2: |-

  - id: 51
    kind: body
    source: |-
      Marsilius advanced his criticism of the use of logic in theology in his discussion of the position of Robert Holcot. Holcot had argued that logically, God can be called the cause of evil. If God is the cause of every thing (*entitas*) and moral evil (*malum culpae*) is a thing, then God is the cause of evil. Marsilius acknowledged that the argument is based on true premises, yet the conclusion should not be defended as true because it contradicts faith and therefore might cause confusion among believers. Theologians should not flaunt their personal skills in logic, but always write out of reverence for the divine. Their writings should not erode the beliefs of ordinary people, who are not skilled in logic, but rather aim to strengthen them spiritually.[^note-16]
    step1: |-

    step2: |-

  - id: 52
    kind: body
    source: |-
      Marsilius was anxious, however, to avoid the implication that God’s foreknowledge is somehow dependent upon human beings. In his discussion of Adam Wodeham on the causality of the human will, he complained that Adam had not been emphatic enough on this point, since he allowed the following argument: if an event *E* will happen in the future, then God knows *E* from eternity; but if not-*E* will happen, then God knows not-*E* form eternity; since man is free, he can choose between *E* and not-*E*; therefore, he can change God’s foreknowledge. This argument is logically sound, Marsilius argued, but it easily leads to the false conclusion that God’s knowledge depends on the free will of man, which is absurd. The eternal cannot fall under the power of that which is created by it. Therefore, this argument should not be used. It is better to remain on the safe side by maintaining what has always been maintained, namely that God through his absolute omniscience knows the future activities of human beings, but without being dependent on them [SE0, fol. 167va–vb].
    step1: |-

    step2: |-

  - id: 53
    kind: body
    source: |-
      Also in his discussion of trinitarian and Christological issues he warns theologians not to naively follow the rules of logic without bearing possible misunderstandings in mind. Although the sentence ‘Christ is only God’ is logically true because Christ is God and no other person born on earth but Christ is God, it is dangerous to accept this sentence without further qualifications, Marsilius argues, because it seems to confirm the view of those heretics who claim that Christ was without a human nature, as the word ‘only’ can be understood to exclude humanity when added to the word ‘God’ [SE3, 94].
    step1: |-

    step2: |-

  - id: 54
    kind: body
    source: |-
      When treating Christiological and Mariological subjects, he argued that it is beneficial to discuss counterfactuals, as this can train the students to defend Christian views against the infidels. On the other hand, he was reluctant to enter into medical issues concerning conception and female sperm, as this would force him to use impudent vocabulary, unworthy of the Holy Virgin that gave birth to Christ [SE4, 139 and 232].
    step1: |-

    step2: |-

  - id: 55
    kind: body
    source: |-
      #### 2.4.3 The Sacraments
    step1: |-

    step2: |-

  - id: 56
    kind: body
    source: |-
      In his treatment of the sacraments at the end of his commentary on the *Sentences*, Marsilius drew heavily on the writings of Thomas Aquinas and Bonaventure. He defended Thomas’s view that the word ‘this’ pronounced by Christ at the Last Supper in uttering ‘This is my body’ (Mk. 14:22) refers to what the bread and body have in common. Thomas of Strasbourg had attacked this view, but Marsilius showed that the earlier Thomas was right and the later wrong [SE0, fol. 515va].
    step1: |-

    step2: |-

  - id: 57
    kind: body
    source: |-
      In his discussion of the causality of the sacraments, Marsilius followed the exposition of Bonaventure, according to whom the sacraments have no causality of their own. It is God who acts whenever the sacraments are administered correctly. Only in a broad sense is it true to say that the sacraments have the power to act.[^note-17]
    step1: |-

    step2: |-

  - id: 58
    kind: body
    source: |-
      ## 3. Influence
    step1: |-

    step2: |-

  - id: 59
    kind: body
    source: |-
      The influence of Marsilius has been considerable, particularly through his logical works and commentaries on Aristotle. This may be gathered not only from the large number of manuscripts that have been preserved, but also from several other considerations.[^note-18] Marsilius’s commentary on Aristotle’s *Prior analytics* was used in Prague in the 1380s. His logical works, including the *Obligationes* and the *Consequentiae*, were used as textbooks in Vienna in the 1390s. His commentaries on Aristotle’s *Metaphysics* and *Physics* were read in Krakow during the first sixty years of the fifteenth century. At the universities of Heidelberg, Erfurt, Basle, and Freiburg, his works were studied throughout the fifteenth century, in particular as part of the university curriculum. In 1499, Jacob Wimpfeling and Jacob Merstetter, on behalf of the doctors and masters of the *Via Moderna* at the University of Heidelberg published a volume that included epigrams on Marsilius by humanist colleagues and students, as well as a defense of Nominalism in the style of Marsilius (*Via Marsiliana*). Praise in the form of epigrams can also be found in the 1501 Strasbourg edition of Marsilius’s commentary on the *Sentences*. The commentary was edited by Jacob Wimpfeling in the frame of his educational and theological attempt to establish a spirituality in the footsteps of Jean Gerson. For Wimpfeling, Marsilius was the German counterpart of the French Chancellor. The *Obligationes*, printed in 1489 under the name of Peter of Ailly, were used by Thomas Bricot, John Major, and Domingo de Soto. The commentary on the *Prior Analytics* was quoted by Agostino Nifo. Jodocus Trutvetter and Bartholomew of Usingen, who consolidated nominalism in Erfurt, repeatedly mentioned Marsilius in their works. Both Leonardo da Vinci and Galileo Galilei referred to Marsilius’s commentary on *De Generatione et Corruptione*.
    step1: |-

    step2: |-

  - id: 60
    kind: body
    source: |-
      The theological views of Marsilius appear to have had some circulation as well. His commentary on the *Sentences* was known in Krakow in the first half of the fifteenth century, and was used by Thomas de Strampino in his *Principia* (1441–1442). The University of Salamanca had a theological chair (Cátedra de Nominales) for commentary on the works of Marsilius of Inghen and Gabriel Biel. His commentary on the *Sentences* was quoted by Spanish theologians such as Francisco de Vitoria, Domingo de Soto, Luis de Molina, and Francisco Suárez, usually in connection with questions about divine foreknowledge and grace.
    step1: |-

    step2: |-

  - id: 61
    kind: body
    source: |-
      There are nine extant manuscripts of Marsilius’s commentary on the *Sentences*. Among the former owners of these manuscripts were two libraries for preachers (Ansbach and Isny), and two libraries of faculties of arts (Erfurt and Leipzig). The education in Erfurt and Leipzig included the reading of nominalist authors. In all probability, the artists became interested in Marsilius’s theological work after studying his writings on logic and physics. The presence of Marsilius’s commentary on the *Sentences* in preachers’ libraries bears witness to the fact that the impact of his work was felt beyond university circles [SE1, xxvii–lv].
    step1: |-

    step2: |-

