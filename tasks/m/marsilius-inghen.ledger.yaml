  - id: 3
    kind: body
    source: |-
      Marsilius of Inghen was born around 1340 in Nijmegen, a city in the eastern part of the Low Countries (Netherlands).[^note-1] In the older literature it is often said that he came from one of the villages in the vicinity of Nijmegen (Inghen), but this view is mistaken. It was based on a confused reading of the *Oratio Funebris* held in 1396 by Nicholas Prowin at the funeral of Marsilius and published in 1499 at Mainz.[^note-2] From 1362 on, Marsilius was master at the Faculty of Arts at the University of Paris, where he was also rector (1367 and 1371), and a student of theology. As a teacher at Paris, Marsilius was much esteemed and his lectures drew large audiences. Among his students were many compatriots, some of whom came from Nijmegen and surrounding villages. In 1378, Marsilius found himself the University’s delegate at the court of Pope Urban VI in Tivoli. In 1379, he instructed one of his colleagues, Hugh of Hervort, to look after his interests in Paris. After 1379, Marsilius’s name is no longer mentioned in the acts of the University of Paris. He probably turned away from Paris because of the imbroglio surrounding the Great Schism of 1378. Meanwhile, he kept in touch with his native city. In 1382 the town council of Nijmegen treated him to a banquet. From 1386 on, Marsilius was master at the University of Heidelberg. There, as in Paris, he held a number of administrative offices. He was one of the founders of the University of Heidelberg, of which he was rector no fewer than nine times, from 1386–1392 and also in 1396. In 1389–1390, as the University’s *nuncio* together with Conrad of Soltau, he was responsible for transferring the University register to Rome (Boniface IX). At the beginning of the 1390s, Marsilius again took up the study of theology. The masters who taught theology were by then Conrad of Soltau (since 1387) and Matthew of Krakow (since 1394), both from the University of Prague. In 1395/1396 Marsilius finished his lectures on the *Sentences* and so became the first theologian to obtain the doctorate at Heidelberg. He died a short time later, on August 20, 1396.
    step1: |-
      因根的马西利乌斯约于 1340 年生于奈梅亨，低地国家（尼德兰）东部的一座城市。[^note-1] 较旧的文献常说，他来自奈梅亨附近的一个村庄（因根），但这一看法是错误的。它基于对尼古拉斯·普罗温 1396 年在马西利乌斯葬礼上所致、1499 年于美因茨出版的《悼词》的误读。[^note-2] 自 1362 年起，马西利乌斯任巴黎大学艺学院硕士，并在那里担任院长（1367 与 1371 年），同时也是神学学生。作为巴黎的教师，马西利乌斯备受推崇，其讲授课听者甚众。他的学生中有许多同胞，其中一些来自奈梅亨及周边村庄。1378 年，马西利乌斯作为大学代表出席教皇乌尔班六世在蒂沃利的宫廷。1379 年，他指示同事之一的休·冯·赫尔弗特照管他在巴黎的利益。1379 年之后，巴黎大学的档案中不再提及马西利乌斯的名字。他离开巴黎，大概是因为 1378 年教会大分裂的纷乱。与此同时，他与故乡保持联系。1382 年，奈梅亨市政会为他设宴。自 1386 年起，马西利乌斯任海德堡大学硕士。在那里，如同在巴黎，他担任多项行政职务。他是海德堡大学的创建人之一，1386–1392 年间九次出任该校院长，1396 年又任一次。1389–1390 年，他与康拉德·冯·佐尔陶一道作为大学的*使节*，负责把大学名册迁往罗马（卜尼法斯九世处）。1390 年代初，马西利乌斯重拾神学。当时讲授神学的硕士有康拉德·冯·佐尔陶（自 1387 年）与克拉科夫的马修（自 1394 年），二人都来自布拉格大学。1395/1396 年，马西利乌斯完成《箴言四书》讲稿，成为海德堡大学第一位获得博士学位的神学家。不久之后的 1396 年 8 月 20 日，他去世了。
    step2: |-
      因根的马西利乌斯约 1340 年生于奈梅亨——低地国家（尼德兰）东部的一座城市。[^note-1] 较旧的文献常说，他出身奈梅亨附近的一个村庄（因根）；此说有误。它源自对尼古拉斯·普罗温 1396 年在马西利乌斯葬礼上所致、1499 年刊于美因茨的《悼词》的一处误读。[^note-2] 自 1362 年起，马西利乌斯任巴黎大学艺学院硕士，并两度出任该校院长（1367 与 1371 年），同时研习神学。执教巴黎期间，马西利乌斯备受推崇，讲课听者甚众；学生中有许多同胞，其中一些来自奈梅亨及周边村庄。1378 年，他作为大学代表赴蒂沃利觐见教皇乌尔班六世的宫廷。1379 年，他托请同事休·冯·赫尔弗特代管其在巴黎的事务。此后巴黎大学的档案中便不再出现他的名字——他离开巴黎，多半是因为 1378 年教会大分裂的纷乱。同一时期，他与故乡联系未断：1382 年，奈梅亨市政会为他设宴款待。自 1386 年起，马西利乌斯任海德堡大学硕士，与在巴黎一样身兼多项行政职务。他是海德堡大学的创建人之一，1386–1392 年间九度出任校长，1396 年又任一次。1389–1390 年，他与康拉德·冯·佐尔陶一道以大学*使节*的身份，负责把大学名册迁呈罗马（卜尼法斯九世）。1390 年代初，马西利乌斯重拾神学：当时讲授神学的硕士有康拉德·冯·佐尔陶（自 1387 年）与克拉科夫的马修（自 1394 年），皆出自布拉格大学。1395/1396 年，他完成《箴言四书》讲稿，成为海德堡大学首位获神学博士者。不久，1396 年 8 月 20 日，他与世长辞。
