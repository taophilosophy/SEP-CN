      Elsewhere, he departed again from the opinions of the Parisian School (*scola Parisiensis*) and opted for the perspective of ordinary language or common way of speaking (*communis modus loquendi*). This was the case with his analysis of the proposition ‘The Antichrist is not, but he will be’. According to the Parisian School, the term ‘he’ refers to the thing referred to by the term ‘Antichrist’. Since there is no Antichrist, neither term has reference. But in ordinary language it is different, for there the term ‘he’ is meant to refer to the future Antichrist. Marsilius accepted the latter analysis as sound, despite the authority of the former [TPT, 89–90].
    step1: |-
      在别处，他再次偏离巴黎学派（*scola Parisiensis*）的意见，而选择日常语言或通常说话方式（*communis modus loquendi*）的视角。他分析命题“敌基督现在不在，但他将来会在”时就是这样。按巴黎学派的说法，词项“他”指涉词项“敌基督”所指涉的东西。既然没有敌基督，两个词项都没有指涉。但在日常语言中情况不同：在那里，“他”意指未来的敌基督。马西利乌斯认为后一种分析是健全的，尽管有前一种分析的权威［TPT, 89–90］。
