      According to the principles of natural philosophy, creation from nothing is impossible. The senses show that things always come from other things. Because there is no serious reason to doubt the information given by the senses, the human mind legitimately jumps to the universal principle that nothing can come from nothing, driven by the natural tendency to search for truth. Consequently, for the human mind creation from nothing is impossible. It contradicts the universal principle that nothing comes from nothing. That God has created the world from nothing is therefore only a matter of faith (*sola fide est creditum*). Revelation shows that human knowledge of creation is limited, but it cannot be aided by natural philosophy at this point.[^note-13]
