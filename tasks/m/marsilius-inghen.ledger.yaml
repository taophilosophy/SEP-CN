      #### 2.1.2 共相
  - id: 20
    kind: body
    source: |-
      Marsilius argued that universal concepts such as ‘humanity’ do not refer to real universals outside the human mind. Accordingly, there is no universal essence in singular individuals. Individuals of one genus or species do resemble each other, however, and this resemblance is the foundation of universal concepts in the human mind. The generation of universal concepts is a natural process, which Marsilius described as follows: suppose individual *A* of species *S* evokes concept *X* in the human mind. This concept is similar to concept *Y* which has been evoked by *B* of the same species *S*. By abstracting from all the differences between *X* and *Y*, the human mind is able to produce another concept, *Z*, which stands for both *A* and *B*. Universality is then taken to be a quality of concept *Z*, the product of the epistemological operation of abstraction on concepts *X* and *Y* by the human mind.[^note-4]
    step1: |-
      马西利乌斯论证，“人性”这类普遍概念并不指涉人的心灵之外的实在共相。因此，在单个个体之中没有普遍本质。然而，同一属或种的诸个体确实彼此相似，这种相似是人的心灵中普遍概念的基础。普遍概念的产生是一个自然过程，马西利乌斯描述如下：设种 *S* 的个体 *A* 在人的心灵中唤起概念 *X*。这个概念与概念 *Y* 相似，后者由同一种 *S* 的 *B* 唤起。通过抽离 *X* 与 *Y* 之间的一切差异，人的心灵能够产生另一个概念 *Z*，它同时代表 *A* 与 *B*。于是，普遍性被看作概念 *Z* 的性质——它是人的心灵对概念 *X* 与 *Y* 施行抽象这一认识论运作的产物。[^note-4]
    step2: |-
      马西利乌斯论证：诸如“人性”这类普遍概念，并不指涉人心之外的实在共相。因此，个体之中没有普遍本质。不过，同属或同种的诸个体确实彼此相似，而相似正是人心之中普遍概念的地基。普遍概念的产生是自然过程，马西利乌斯如此描述：设种 *S* 的个体 *A* 在人心中唤起概念 *X*；此概念与 *Y* 相似，后者由同种的 *B* 唤起。通过抽离 *X* 与 *Y* 之间的一切差异，人心能产生另一个概念 *Z*——它同时代表 *A* 与 *B*。普遍性于是被看作 *Z* 的性质：它是人心对 *X* 与 *Y* 施行抽象这一认识论运作的产物。[^note-4]
