      马西利乌斯批评奥卡姆的如下观点：上帝的理念与创世同一。马西利乌斯论证，若果真如此，那么产生一块石头的理念必然要么与石头本身同一，要么与就其被上帝所知而言的石头同一。若是前者，那么上帝必定在其理念中看向自身之外，这与奥卡姆所引奥古斯丁的立场相矛盾。若是后者，那么关于其产生的理念就不是石头本身，而是上帝对石头的预知［SE1, 15–17］。
