      Marsilius was the first rector of the University of Heidelberg. According to the oldest Statutes of the Arts Faculty of this university, every master must inform the students that whenever Aristotle contradicts faith, e.g. in his claim that the world is eternal, he is following natural reason and although his arguments in these cases are wrong and faith must be accepted, natural reason cannot help but follow Aristotle and therefore cannot prove the conclusions of faith (see Winkelmann 1886, 41)[^winkelmann-1886]. This paragraph clearly echos Marsilius’s view on the issue. Other contemporary universities, like that of Vienna, were less rigorous and prescribed a more harmonious procedure, stipulating that whenever there was a conflict with faith, the masters had to argue in favor of faith against Aristotle to the best of their possibilities (see Kink 1854, 202 (titulus 17)).
    step1: |-
      马西利乌斯是海德堡大学的第一任院长。按该校艺学院最古老的章程，每位硕士都必须告知学生：凡亚里士多德与信仰相抵触之处（例如他主张世界永恒），他遵循的是自然理性；尽管他在这些情形中的论证是错误的、必须接受信仰，但自然理性不能不追随亚里士多德，因而无法证明信仰的结论（见 Winkelmann 1886, 41）[^winkelmann-1886]。这一段显然呼应了马西利乌斯在该问题上的观点。其他同时代大学（如维也纳大学）没有那么严格，规定了更为和谐的程序：凡与信仰冲突之处，硕士们必须尽其所能为信仰、反对亚里士多德而论证（见 Kink 1854, 202（titulus 17））。
    step2: |-
      马西利乌斯是海德堡大学首任校长。按该校艺学院最古老的章程，每位硕士都须告知学生：凡亚里士多德与信仰相抵之处（例如他主张世界永恒），他所循的是自然理性；纵使他在此类情形中的论证有误、必须接受信仰，自然理性仍不能不以亚里士多德为依归，因而证明不了信仰的结论（见 Winkelmann 1886, 41）[^winkelmann-1886]。这一段显然呼应了马西利乌斯在该问题上的立场。同时代其他大学（如维也纳大学）则不那么严苛，规定了一套更圆融的程序：凡与信仰冲突之处，硕士须尽力为信仰、反亚里士多德而辩（见 Kink 1854, 202（titulus 17））。
