      In line with his account of the nature of universals, Marsilius rejected simple supposition. Logicians such as Peter of Spain had used the notion to indicate that a term stood not for an individual but for a universal or common nature in the external world, like the term ‘man’ in the proposition, ‘Man is a species’. Since Marsilius rejected the idea of universals existing outside the mind, he eliminated simple supposition from the list of different types of supposition. He was critical of some of his contemporaries (e.g., Albert of Saxony) who likewise dismissed the concept of real universals, yet kept on using the notion of simple supposition. They had changed the meaning of the term, he said, by claiming that a written or spoken term had simple supposition if it was used to refer to a concept in the human mind. Marsilius wondered whether young students would be able to understand this new meaning of simple supposition, since they would hardly know what concepts are. To avoid confusion, Marsilius decided not to deal with simple supposition at all in his logic.[^note-5]
    step1: |-
      与他对共相之本性的说明一致，马西利乌斯拒绝了简单指代。西班牙的彼得等逻辑学家曾用这一概念表明：词项代表的不是个体，而是外部世界中的普遍或共同本性，如命题“人是种”中的“人”。由于马西利乌斯拒绝心灵之外存在共相的观念，他把简单指代从指代的诸类型中剔除。他批评某些同时代人（例如萨克森的阿尔伯特），他们同样否认实在共相的概念，却继续使用简单指代的概念。他说，这些人改变了这个词项的含义：他们主张，一个书写或口说的词项，如果被用来指称人的心灵中的概念，就具有简单指代。马西利乌斯怀疑年轻学生能否理解简单指代的这种新含义，因为他们几乎不知道概念是什么。为避免混淆，马西利乌斯决定在其逻辑中完全不处理简单指代。[^note-5]
