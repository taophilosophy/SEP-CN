      A similarly radical stance on the unity of God was assumed in his treatment of divine ideas. Ideas are not formally distinct in God, as some Scotists would argue, but only extrinsically and objectively distinct. Their distinction is a consequence of the differences between the creatures produced by God (which is why Marsilius spoke of extrinsic distinction), and of the fact that they are known by God as different (which accounts for their objective distinction). God knows that he is the cause of infinitely many differences between creatures. That is why his mind contains infinitely many different ideas [SE1, 7–15].
    step1: |-
      他在处理神圣理念时采取了关于上帝之统一性的类似激进立场。理念在上帝之中并非形式上区分，如某些司各脱派所主张的那样，而只是外在地区分与客观地区分。它们的区分是上帝所造受造物之间差异的后果（这就是马西利乌斯称之为外在区分的原因），也是它们被上帝认作不同这一事实的结果（这解释了它们的客观区分）。上帝知道自己是一切受造物之间无穷多差异的原因。这就是为什么他的心灵包含无穷多不同的理念［SE1, 7–15］。
