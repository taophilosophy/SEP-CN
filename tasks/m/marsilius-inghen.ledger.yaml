      In natural philosophy and metaphysics Marsilius was an empiricist, meaning that he thought all scientific knowledge must be based on either sense data or self-evident propositions, i.e., propositions in which the meaning of the predicate is included in the subject. Everyone who knows the meaning of the terms of such propositions judges them to be evidently true [SE0, fol. 176va]. This has far-reaching consequences for the relationship between philosophy and theology. Since the philosopher uses only sense data and self-evident propositions, his inquiry may come to different conclusion than that of the theologian, who has additional knowledge from Scripture. The philosopher makes judgments about the world from a limited human perspective, whereas the theologian is helped by divine revelation [SE0, fol. 176va, fol. 203va]. Yet Marsilius took the task of the philosopher seriously because he thought the human mind has a natural tendency to search for truth, which is satisfied (although not ultimately satisfied) in natural philosophy and metaphysics.[^note-12]
    step1: |-
      在自然哲学与形而上学中，马西利乌斯是一位经验主义者，意即他认为一切科学知识都必须基于感觉材料或自明命题，即谓词的意义包含在主词之中的命题。凡是懂得这类命题之词项含义的人，都会判定它们显然为真［SE0, fol. 176va］。这对哲学与神学的关系有深远后果。由于哲学家只使用感觉材料与自明命题，其探究可能得出与神学家不同的结论——后者拥有来自圣经的额外知识。哲学家从有限的人类视角对世界作出判断，而神学家则得到神圣启示的助益［SE0, fol. 176va, fol. 203va］。然而马西利乌斯认真对待哲学家的任务，因为他认为人的心灵有一种寻求真理的自然倾向，这种倾向在自然哲学与形而上学中得到满足（尽管不是最终的满足）。[^note-12]
