      In the context is his theory of consequence, Marsilius treats the well-known issue of coming to be (*incipit*) and passing away (*desinit*). Here he likewise follows John Buridan, although once again in an independent way. His logical point of view, intentionally ignoring specific features of physical reality, is striking. For example, he considers the physical distinction between permanent and successive things irrelevant to the validity of consequences that imply notions of coming to be and passing away. Also, in dealing with such consequences, he accepts indivisible instances of time for methodological reasons, though physically speaking time is infinitely divisible for him. Here, he joins Albert of Saxony.[^note-11]
    step1: |-
      在其推论理论的语境中，马西利乌斯处理了著名的开始存在（*incipit*）与停止存在（*desinit*）问题。这里他同样追随约翰·布里丹，但又是以独立的方式。他有意忽略物理实在的具体特征，其逻辑视角引人注目。例如，他认为常存事物与相继事物之间的物理区别，与那些蕴涵开始存在与停止存在之概念的推论的有效性无关。同样，在处理此类推论时，他出于方法论理由接受不可分的时间瞬间，尽管在物理上对他而言时间是无限可分的。在这一点上，他与萨克森的阿尔伯特一致。[^note-11]
    step2: |-
      在其推论理论的语境中，马西利乌斯处理了著名的“开始存在”（*incipit*）与“停止存在”（*desinit*）问题。这里他依然追随约翰·布里丹，但仍旧是独立地追随。他有意搁置物理实在的具体特征，其逻辑视角颇为醒目：例如，他认为常存事物与相继事物之间的物理区别，与那些蕴涵开始存在、停止存在概念的推论之有效性毫不相干；同理，处理此类推论时，他出于方法论理由接受不可分的时间瞬间——尽管在他看来，物理上时间是无限可分的。在这一点上，他与萨克森的阿尔伯特同道。[^note-11]
