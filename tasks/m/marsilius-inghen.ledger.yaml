      评价他人观点时，马西利乌斯自成一格。分析命题“苏格拉底不是客迈拉”时，他遵循所谓的“巴黎方法”：命题为假，因为“客迈拉”一词无所指代——世间并不存在它可指涉的实在的客迈拉。另一些人则认为命题为真［TPT, 84］。不过，即便“客迈拉”没有指代，马西利乌斯仍认为它自有意谓——这与巴黎同事布里丹恰成对照：布里丹主张“客迈拉”只有复杂意谓，寄于其构成部分，如山羊之身、狮子之头（见 Ciola 2020）[^ciola-2020]。
