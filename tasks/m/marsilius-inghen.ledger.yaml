      Regarding the theory of consequences, Marsilius was in line with John Buridan and Albert of Saxony. However, unlike them, he considers the consequence as an *oratio*, not as a hypothetical proposition, properly speaking. As such, consequences also include statements that have no truth value. Crucial for a consequence is the so-called *nota illationis*, which signifies the necessary connection between the antecedent and the consequent. This connection is understood as a relationship of semantic entailment. Similar to Albert of Saxony but unlike Buridan, for Marsilius there are no invalid consequences. A consequence is either valid or it is no consequence (see Ciola 2018a)[^ciola-2018a].
    step1: |-
      关于推论学说，马西利乌斯与约翰·布里丹及萨克森的阿尔伯特一致。然而与他们不同，他把推论看作一个 *oratio*（语句），而不是严格意义上的假言命题。如此一来，推论也包括没有真值的陈述。对推论至关重要的是所谓的*推断标记*（*nota illationis*），它标示前件与后件之间的必然联系。这种联系被理解为语义蕴涵关系。与萨克森的阿尔伯特相似而与布里丹不同，对马西利乌斯而言不存在无效的推论：一个推论要么有效，要么根本不是推论（见 Ciola 2018a）[^ciola-2018a]。
    step2: |-
      关于推论学说，马西利乌斯与约翰·布里丹、萨克森的阿尔伯特同调。但与他们不同，他把推论看作一个 *oratio*（语句），而非严格意义上的假言命题。如此一来，推论也涵盖没有真值的陈述。对推论至关紧要的，是所谓*推断标记*（*nota illationis*）——它标示前件与后件之间的必然联系；这种联系被理解为语义蕴涵关系。与萨克森的阿尔伯特相似而与布里丹不同：在马西利乌斯看来，不存在无效的推论——一个推论要么有效，要么压根不是推论（见 Ciola 2018a）[^ciola-2018a]。
