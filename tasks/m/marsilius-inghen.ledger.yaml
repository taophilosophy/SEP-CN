      In his commentary on the *Categories*, Marsilius adheres to William of Ockham’s and John Buridan’s view that the ten Aristotelian categories are distinguished by the way they refer to things in extra-mental reality. The emphasis here is on the ‘way they refer to’ things, i.e., their *modus significandi*, and not on the things themselves, he argues, since distinct categories like ‘quantity’ and ‘quality’, while doing so in different manners, may still refer to one and the same individual thing in the outside world, e.g., Socrates. Different categories, therefore, do not represent different things but stand for distinct and unique ways of signifying things.[^note-6] Together, the ten categories cover all possible ways of speaking about things. Like Buridan, however, Marsilius emphasizes that it is impossible to prove that their precise number is and must be ten, as some philosophers like Albert the Great had claimed. It is only lengthy experience that has led philosophers to acknowledge their number to be ten.[^note-7] If an additional mode of signifying things was discovered in the future, Marsilius states, he would readily accept there to be more than ten Aristotelian categories, even though he does not consider such a discovery to be very likely.[^note-8]
    step1: |-
      在《范畴篇》评注中，马西利乌斯坚持奥卡姆的威廉与约翰·布里丹的观点：十个亚里士多德范畴以它们指涉心灵外实在之事物的方式相区别。他论证，这里强调的是“指涉事物的方式”，即其*意谓方式*（*modus significandi*），而非事物本身——因为彼此不同的范畴，如“量”与“质”，尽管以不同方式指涉，仍可以指涉外部世界中的同一个个体事物，例如苏格拉底。因此，不同的范畴并不代表不同的事物，而是代表意谓事物的不同且独特的方式。[^note-6] 十个范畴合起来覆盖了谈论事物的一切可能方式。不过，与布里丹一样，马西利乌斯强调，无法证明它们的精确数目是且必须是十个——正如大阿尔伯特等一些哲学家所主张的。只是漫长的经验使哲学家承认其数目为十。[^note-7] 马西利乌斯声明，如果将来发现了意谓事物的另一种方式，他将欣然接受亚里士多德范畴多于十个，尽管他认为这样的发现不太可能。[^note-8]
    step2: |-
      在《范畴篇》评注中，马西利乌斯坚持奥卡姆的威廉与约翰·布里丹的立场：十个亚里士多德范畴，以它们指涉心灵外实在之事物的方式相区分。他论证：此处强调的是“指涉事物的方式”——即其*意谓方式*（*modus significandi*）——而非事物本身；因为彼此不同的范畴，如“量”与“质”，虽以不同方式指涉，仍可指涉外部世界中的同一个个体，例如苏格拉底。所以，不同的范畴并不代表不同的事物，而是代表着意谓事物的彼此不同且各自独特的方式。[^note-6] 十个范畴合起来，覆盖谈论事物的一切可能方式。但与布里丹一样，马西利乌斯强调：无法证明它们的精确数目是且必须是十——大阿尔伯特等哲学家曾如此主张；使哲学家承认数目为十的，只是漫长经验的积累。[^note-7] 马西利乌斯声明：倘若将来发现了意谓事物的另一种方式，他会欣然接受亚里士多德范畴多于十个——尽管他认为这种发现不太可能。[^note-8]
