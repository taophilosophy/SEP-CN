      In the later Middle Ages the study of the soul was part of natural philosophy. Marsilius treated the human soul in his commentary on Aristotle’s *De anima*, in which he followed the Parisian tradition of Buridan and Oresme concerning the particular questions addressed. Following Buridan, he argued that there is no natural proof of the immortality of the human soul. For the human natural mind, unaided by revelation, the theory of Alexander of Aphrodisias that the human soul is corruptible is the most probable. That Alexander of Aphrodisias is mistaken and that the soul continues to exist after the death of the body is known through revelation alone. Faith has more authority than human reason and must be accepted in all cases where the two conflict since the things we believe on faith come from God, who cannot err.[^note-14]
    step1: |-
      在中世纪晚期，灵魂研究是自然哲学的一部分。马西利乌斯在其《论灵魂》评注中处理人的灵魂，就所讨论的具体问题而言，他遵循布里丹与奥雷斯姆的巴黎传统。追随布里丹，他论证不存在对人灵魂不朽的自然证明。对未受启示助益的人类自然心灵而言，阿弗罗迪西亚斯的亚历山大关于人的灵魂可朽的理论是最可能的。阿弗罗迪西亚斯的亚历山大错了、灵魂在身体死后继续存在，这一点仅通过启示才能知道。信仰比人类理性更有权威，凡二者冲突之处都必须接受信仰，因为我们凭信仰相信的事情来自不会犯错的上帝。[^note-14]
    step2: |-
      中世纪晚期，灵魂研究属于自然哲学。马西利乌斯在《论灵魂》评注中处理人的灵魂；就所讨论的具体问题而言，他遵循布里丹与奥雷斯姆的巴黎传统。他随布里丹论证：人对灵魂不朽没有自然证明。对未受启示助益的人类自然心灵来说，阿弗罗迪西亚斯的亚历山大“人的灵魂可朽”之说最为可能。至于亚历山大错了、灵魂在身体死后仍存，这只能凭启示知道。信仰的权威高于人类理性；凡二者冲突之处，皆须接受信仰——因为我们凭信仰所信之事来自不会犯错的上帝。[^note-14]
