      #### 2.1.1 The Object of Scientific Knowledge
    step1: |-
      #### 2.1.1 科学知识的对象
    step2: |-
      #### 2.1.1 科学知识的对象
  - id: 18
    kind: body
    source: |-
      According to the Aristotelian standard accepted by Marsilius, the object of scientific knowledge must be universal and necessarily true. This is not the case with individual things in the external world, since they are subject to change. Only the conclusion of a true and necessary syllogism can meet the standard. Hence, for Marsilius, the object of scientific knowledge is not anything outside the mind, but the mental proposition which refers to individual things and their qualities. More specifically, the proper object of scientific knowledge is a proposition in the form of a conclusion that has been deduced from necessary premises [SE1, 77–79].
    step1: |-
      按马西利乌斯接受的亚里士多德标准，科学知识的对象必须是普遍的且必然为真。外部世界中的个体事物并非如此，因为它们处于变化之中。只有真且必然的三段论的结论能满足这一标准。因此，对马西利乌斯而言，科学知识的对象不是心灵之外的任何东西，而是指涉个体事物及其性质的心灵命题。更具体地说，科学知识的固有对象是这样一个命题：它以结论的形式从必然前提中演绎得出［SE1, 77–79］。
    step2: |-
      按马西利乌斯所接受的亚里士多德标准，科学知识的对象必须普遍且必然为真。外部世界中的个体事物不满足这一点——它们处于流变之中。唯有真且必然的三段论之结论能满足标准。于是，对马西利乌斯而言，科学知识的对象不是心灵之外的任何东西，而是指涉个体事物及其性质的心灵命题。更确切地说，科学知识的固有对象，是以结论的形式从必然前提演绎而来的命题［SE1, 77–79］。
