      During this period, Montessori herself held teaching positions, first as a Chair of “Hygiene and Anthropology” at the Women’s Magisterial Institute in Rome (a position she held from 1899–1917) and then, after 1904, as an instructor of anthropology in the Faculties of Medicine and of Physical, Mathematical and Natural Sciences. Her 1910 *Antropologia Pedagogica [Pedagogical Anthropology]*, based on these courses, arguably begins to bridge the gap she had identified between scientific method and philosophical insight into the human condition.[^note-3] During this period, Montessori also continued writing and speaking on empirical scientific work and was involved with various progressive causes, including a student group called Pensiero e Azione (Thought and Action), which, among other things, advocated for women’s suffrage.
    step1: |-
      这一时期，蒙台梭利本人也担任教职：先在罗马女子师范学院任“卫生学与人类学”讲席（1899–1917），1904 年后又在医学院与物理、数学与自然科学学院教授人类学。她基于这些课程写成的 1910 年《教育人类学》，可以说是开始弥合她所看到的科学方法与关于人类境况的哲学洞见之间的鸿沟。[^note-3] 同一时期，蒙台梭利继续就实证科学工作写作与演讲，并投身多项进步事业，包括一个名为 Pensiero e Azione（思想与行动）的学生团体——它也倡导妇女选举权。
    step2: |-
      这一时期，蒙台梭利自己也教书：先在罗马女子师范学院任“卫生学与人类学”讲席（1899–1917），1904 年之后，又在医学院与物理、数学、自然科学学院教人类学。基于这些课程的 1910 年《教育人类学》，可以说已开始弥合她所看到的那道鸿沟：科学方法与关于人类境况的哲学洞见之间的鸿沟。[^note-3] 同期，她还不断就实证科学写作、演讲，投身多个进步事业，包括一个叫 Pensiero e Azione（思想与行动）的学生团体，为妇女选举权发声。
