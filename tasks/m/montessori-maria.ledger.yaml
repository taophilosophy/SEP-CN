      Drawing not only from philosophical influences like Hegel, Schopenhauer, and Nietzsche but also from her contemporaries’ biology and especially embryology (e.g., Naegeli and De Vries), Montessori describes the “life” or “spirit” of humans and other beings in ways that reflect a broader spirit operative in world history (see Montessori 1:39).[^note-4] An emphasis on intrinsic, teleological principles in organic, psychological, and historical development permeates Montessori’s philosophy. Teleology is both individual and species-level, as life and spirit lead living things (including human beings) to cultivate their full development and to drive their species towards progress. This teleological “creative energy” is
    step1: TBD
