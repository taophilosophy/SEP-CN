      Montessori’s metaphysics emphasizes life and spirit as active forces in the universe, in ways that Steven Gimbel and Anne Emerson have compared with G. W. F. Hegel’s teleological metaphysics (2009), Harriet Hunt has connected with Bergson’s concept of creative evolution (1912), and Patrick Frierson has called a “metaphysics of life” (2018). Several texts provide good entry points for her metaphysics, including the introduction and first chapters of Montessori’s *Pedagogical Anthropology* (1910 [1913]), where she directly tackles the evolutionary theories of her contemporaries; her elementary materials as described in *From Childhood to Adolescence* (MS 12) and *To Educate the Human Potential* (MS 6; see too Regni 2023: 99–102)[^regni-2023], where she outlines how the universe should be described to elementary children; and occasional essays that directly tackle metaphysical themes, such as “The Unconscious in History” (1948 [1973]) or “Lectures in Cosmic Education” (1935–6 [2007–9]).
    step1: |-
      蒙台梭利的形而上学强调生命与精神是宇宙中的能动力量：Steven Gimbel 与 Anne Emerson 将其与 G. W. F. 黑格尔的目的论形而上学相比（2009），Harriet Hunt 将其与柏格森的“创造性演化”概念相连（1912），Patrick Frierson 则称之为一种“生命形而上学”（2018）。几部文本是进入其形而上学的良好入口：《教育人类学》（1910 [1913]）的导论与头几章——她在那里正面处理同时代人的演化理论；《从童年到青春期》（MS 12）与《教育人类潜能》（MS 6；另见 Regni 2023: 99–102）[^regni-2023] 中描写的小学教具——她在那里概述应当如何向小学生描述宇宙；以及直接处理形而上学主题的散篇文章，如《历史中的无意识》（1948 [1973]）与《宇宙教育讲座》（1935–6 [2007–9]）。
    step2: |-
      蒙台梭利的形而上学，把生命与精神当作宇宙里的能动力量：Steven Gimbel 与 Anne Emerson 拿它比 G. W. F. 黑格尔的目的论形而上学（2009）；Harriet Hunt 把它接到柏格森的“创造性演化”（1912）；Patrick Frierson 则叫它“生命形而上学”（2018）。几条文本是入门的好路：《教育人类学》（1910 [1913]）的导论与头几章，她正面迎战同时代人的演化论；《从童年到青春期》（MS 12）与《教育人类潜能》（MS 6；另见 Regni 2023: 99–102）[^regni-2023] 里描述的小学教具，她在那里勾勒该向小学生怎么讲宇宙；还有正面谈形而上学的散篇文章，如《历史中的无意识》（1948 [1973]）与《宇宙教育讲座》（1935–6 [2007–9]）。
