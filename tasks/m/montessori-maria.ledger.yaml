      After graduating from medical school, Montessori established a medical practice and was appointed as a co-director of a new “Orthophrenic School”, which treated children with a range of disadvantages, from poverty to what we would now call intellectual disability to severe mental illness. In that context, Montessori argued—against biological theories such as those of Cesare Lombroso—that the problems faced by these children are “more…educational than medical” (MS 2:21,[^note-1] cf. 1903). She was interested in the psychological and pedagogical work of Édouard Séguin and Jean-Gaspard Itard and in 1899, in conjunction with her work at the Orthophrenic school, she traveled to Paris to study their work.
    step1: |-
      医学院毕业后，蒙台梭利开设了私人诊所，并被任命为一所新“精神矫治学校”的共同主任；该校收治各类处境不利的儿童，从贫困、今天所说的智力障碍到严重精神疾病。在这一语境中，蒙台梭利反驳切萨雷·龙勃罗梭等人的生物学理论，主张这些儿童面临的问题“与其说是……医学的，不如说是教育的”（MS 2:21,[^note-1] 参看 1903）。她对爱德华·塞甘与让-加斯帕尔·伊塔的心理与教育工作很感兴趣，1899 年，结合她在精神矫治学校的工作，她赴巴黎研究二人的著述。
    step2: |-
      医学院毕业后，蒙台梭利开了诊所，又被聘为一所新设“精神矫治学校”的共同主任；学校收的是各类处境不利的孩子——从贫困，到今天叫作智力障碍的，再到重度精神病。正是在这里，蒙台梭利驳斥切萨雷·龙勃罗梭一类的生物学理论，主张这些孩子的问题“与其说是医学的，不如说是教育的”（MS 2:21,[^note-1] 参看 1903）。她留意爱德华·塞甘与让-加斯帕尔·伊塔的心理与教育研究；1899 年，借着在矫治学校的工作，她专程去巴黎研读两人的著述。
