      ### 3.5 God and Nature
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      In *Mind and Cosmos*, Thomas Nagel calls for a metaphysics that might include teleology and that would provide a plausible account of mind, consciousness, and values; Montessori’s metaphysics provides just such an account. Nagel, however, explicitly seeks a “*secular* conception” (2012: 22), while Montessori often freely connects nature’s purpose with a “governing intelligence” or “Divine Spirit” (see 6:28, 22:169). Moreover, Montessori was a practicing Catholic throughout her life, explicitly discusses God in several of her published works, and applied her pedagogical theories to religious instruction (see especially 1929 [1965: 3–20]; MS 19). Within contemporary scholarship on Montessori, the role of theism and religious (Catholic) concepts has become a significant issue, with views ranging from describing “the religious and Christian sensibility of Montessori” (Honegger Fresco 2018: 112; see too De Giorgi 2013, 2018, 2019)[^honegger-2018] to those that emphasize her “series of open conflicts with the Catholic Church” (Romano 2020: 204; cf. Foschi & Cicciola 2019; Moretti & Dieguez 2018, 2019)[^foschi-2019][^foschi-2019-2][^moretti-2018][^romano-2020]. Others emphasize her connections to theosophy (Giovetti 2009)[^giovetti-2009], including claiming that “Montessori was a theosophist” (Wilson 1985; see too Wylie 2008)[^wilson-1985][^wylie-2008]. Giacomo Cives helpfully describes the overall tenor of the debate:
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      > the interpretation of Montessori’s [religious] thought…in De Giorgi and Foschi…[is] fundamentally dialectical, in a primarily Catholic key for the former and secular for the latter. (2015: 123)
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      Meanwhile Patrick Frierson (forthcoming) argues that Montessori’s philosophy of religion can contribute to debates about the hiddenness of God, the role of embodiment and liturgy in religion, and the connection between a moral sense and divine commands; and Natalie Carnes (2015: 319)
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      > continues the work of feminist and liberationist theologians by noting the importance of children to theological reflection…by establishing Montessori as a figure worthy of theological consideration,
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      particularly in what Carnes calls her “supple theological anthropology that offers a sophisticated and persuasive approach to original sin”.
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      Ultimately, Montessori uses the concept of God to direct attention back to her philosophy’s methodological and ethical core: the child. She emphasizes “the child’s own powers, given to him by the Creator” (1929 [1965: 4]) the “wonderful powers of divine creation in the child’s soul” (1929 [1965: 5]), and the ways that “children in spiritual freedom disclose the will of God” (in De Giorgi 2013: 325–6, my translation). When she seems to theologize pedagogy, saying “we must not just see the child, but God in him”, she immediately makes this theology immanent and naturalized with*in* the child: “We must respect the laws of creation in him. We must not think we can make him; if we do, we are spoiling the Divine work” (7:96). Her personal faith in God and her theistic statements in writings directed towards religious believers thus primarily serve to enhance the dignity of the child.
    step1: TBD
    step2: TBD
