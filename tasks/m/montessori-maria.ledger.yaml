      Others of Montessori’s books have important contributions to make to understanding her philosophy. *The Secret of Childhood* (MS 22), for example, discusses the nature of children’s and adults’ work, the role of guiding instincts, and various psychic deviations and repressions that arise from repression of those instincts. *Psychogeometry* and *Psychoarithmetic* (MS 16 & 20) give insight not only into Montessori’s philosophy of mathematics but her cognitive theory more broadly. Her works on art and music (especially MS 2: 299–314; MS 13: 283–354; MS 23: passim) elucidate the role of beauty and art in human life. And she has several works—including *The Child in the Church* (Montessori 1929 [1965])[^montessori-1929], *The Mass Explained to Children* (MS 19), and the lectures collected as *Montessori. Dio e il bambino e altri scritti* (De Giorgi 2013)—that are important for understanding her theology and philosophy of religion.
    step1: |-
      蒙台梭利的另一些著作对理解其哲学也有重要贡献。例如《童年的秘密》（MS 22）讨论儿童与成人的工作本性、引导性本能的作用，以及压抑这些本能所造成的种种心理偏差与压抑。《心理几何》与《心理算术》（MS 16 与 20）不仅透露蒙台梭利的数学哲学，也透露她更广的认知理论。她论艺术与音乐的著作（尤其 MS 2: 299–314; MS 13: 283–354; MS 23: 各处）阐明美与艺术在人类生活中的作用。她还有几部著作——《教会中的儿童》（Montessori 1929 [1965]）[^montessori-1929]、《向儿童解释弥撒》（MS 19）以及结集为《蒙台梭利：上帝与儿童及其他文集》的讲座（De Giorgi 2013）——对理解她的神学与宗教哲学很重要。
    step2: |-
      蒙台梭利另有一些书，对理解其哲学也贡献不小。如《童年的秘密》（MS 22）谈儿童与成人工作的本性、引导性本能的作用，以及压抑本能造成的种种心理偏差。《心理几何》与《心理算术》（MS 16、20）不但照出她的数学哲学，也照出她更宽的认知理论。论艺术与音乐的著作（尤其 MS 2: 299–314; MS 13: 283–354; MS 23: 各处）阐明美与艺术在人生中的作用。还有几部对理解她的神学与宗教哲学很重要：《教会中的儿童》（Montessori 1929 [1965]）[^montessori-1929]、《向儿童解释弥撒》（MS 19），以及结集为《蒙台梭利：上帝与儿童及其他文集》的讲座（De Giorgi 2013）。
