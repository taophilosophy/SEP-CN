      ### 3.3 Emergent Mind
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      Given an overarching teleological and progressive metaphysics within which new forces arise to bring harmonious unity and complexity to conflicts at lower levels of organization, Montessori positions herself well to see the emergence of mind as a natural process. The mind is a “telluric force”, to use terminology Montessori adopts from the geologist Antonio Stoppani (Montessori 1936 [2008/1: 6]; see Stoppani 1898: 68)[^stoppani-1898]. This force makes use of but supersedes biological forces in something like the way that biological forces make use of and supersede chemical forces. The mind marks a higher, more complex, and more agile form of teleologically-oriented agency than mere life, and it has laws of its own that are irreducible to mere biology, but mind is ultimately an aspect of the life of (conscious) organisms. This biologically-grounded account of consciousness arguably addresses the so-called hard problem of consciousness in a way akin to that hinted at by Thomas Nagel’s *Mind and Cosmos* (Nagel 2012)[^nagel-2012] and also, as we will see, in a way consonant with her contemporary Henri Bergson (see especially Bergson 1907 [1911] and Hunt 1912)[^bergson-1907][^hunt-1912] and with more recent emergentist and enactive concepts of mind developed by thinkers such as Francisco Varela, Eleanor Rosch, and Evan Thompson in *The Embodied Mind* (1991). Montessori’s emphasis on a “biological concept of freedom” (18:54) even contributes to understanding meaning and value in naturalistic terms.
    step1: TBD
    step2: TBD
