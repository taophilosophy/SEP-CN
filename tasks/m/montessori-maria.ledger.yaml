      Gesine Dörnberg has related the “inner creative powers” that Montessori sees as guiding free children with Schiller’s accounts of the “Spieltrieb und Bildungstrieb” (drives towards play and towards development), rightly pointing out that for both Montessori and Schiller, children’s development occurs in response to free activity in environments conducive to development (see Dörnberg 2006)[^dörnberg-2006]. Unlike Schiller, however, Montessori’s account of children’s self-directed activity conceptualizes that activity as “work” rather than play, though Dörnberg interestingly suggests that the difference in focus might be due a difference between the education of children (Montessori) and that of adults (Schiller). For the experience of freedom, “play” might—somewhat ironically—be more important for adults, for whom work typically has instrumental and productive connotations.
    step1: |-
      Gesine Dörnberg 把蒙台梭利视为引导自由儿童的“内在创造力”，与席勒关于“Spieltrieb und Bildungstrieb”（游戏冲动与形成冲动）的论述联系起来，并正确指出：对蒙台梭利与席勒而言，儿童的发展都发生在适宜发展的环境中的自由活动之回应里（见 Dörnberg 2006）[^dörnberg-2006]。然而与席勒不同，蒙台梭利把儿童的自导活动理解为“工作”而非游戏；不过 Dörnberg 有趣地提出，这一重心差异也许来自儿童教育（蒙台梭利）与成人教育（席勒）之别。就自由的体验而言，“游戏”对成人也许——说来有点反讽——更重要，因为对成人来说，工作通常带有工具性与生产性的含义。
    step2: |-
      Gesine Dörnberg 把蒙台梭利眼中引导自由儿童的“内在创造力”，同席勒的“Spieltrieb und Bildungstrieb”（游戏冲动与形成冲动）相比，并正确指出：在蒙台梭利与席勒那里，儿童的发展都发生在适宜环境中的自由活动里（见 Dörnberg 2006）[^dörnberg-2006]。但与席勒不同，蒙台梭利把儿童的自导活动叫作“工作”，不叫游戏。Dörnberg 倒有个有趣的猜想：这一重心之差，也许源于儿童教育（蒙台梭利）与成人教育（席勒）之别——就自由的体验说，“游戏”对成人反而更要紧（说来有点反讽），因为成人眼里的工作通常带工具性、生产性。
