      In her context, Montessori’s emphasis on children’s agency also came into conflict with prevalent views about original sin; many saw Montessori as denying the presence of original sin infecting the agency of young children (see Giovetti 2009: 59; Cives 2019: 229; Quarfood 2022: 194)[^cives-2019][^giovetti-2009][^quarfood-2022], to which she responded that while she did not deny the presence of original sin, children’s agency was actually less corrupted than adult agency because it lacked the negative effects of accrued self-conscious sins (see De Giorgi 2019: 78–9; Quarfood 2022: 195)[^quarfood-2022].
    step1: |-
