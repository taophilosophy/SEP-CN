      In *Mind and Cosmos*, Thomas Nagel calls for a metaphysics that might include teleology and that would provide a plausible account of mind, consciousness, and values; Montessori’s metaphysics provides just such an account. Nagel, however, explicitly seeks a “*secular* conception” (2012: 22), while Montessori often freely connects nature’s purpose with a “governing intelligence” or “Divine Spirit” (see 6:28, 22:169). Moreover, Montessori was a practicing Catholic throughout her life, explicitly discusses God in several of her published works, and applied her pedagogical theories to religious instruction (see especially 1929 [1965: 3–20]; MS 19). Within contemporary scholarship on Montessori, the role of theism and religious (Catholic) concepts has become a significant issue, with views ranging from describing “the religious and Christian sensibility of Montessori” (Honegger Fresco 2018: 112; see too De Giorgi 2013, 2018, 2019)[^honegger-2018] to those that emphasize her “series of open conflicts with the Catholic Church” (Romano 2020: 204; cf. Foschi & Cicciola 2019; Moretti & Dieguez 2018, 2019)[^foschi-2019][^foschi-2019-2][^moretti-2018][^romano-2020]. Others emphasize her connections to theosophy (Giovetti 2009)[^giovetti-2009], including claiming that “Montessori was a theosophist” (Wilson 1985; see too Wylie 2008)[^wilson-1985][^wylie-2008]. Giacomo Cives helpfully describes the overall tenor of the debate:
    step1: |-
      在《心灵与宇宙》中，托马斯·内格尔呼吁一种或许包含目的论的形而上学，它能对心灵、意识与价值给出可信的说明；蒙台梭利的形而上学恰好提供了这样一种说明。不过，内格尔明确寻求的是“*世俗的*构想”（2012: 22），而蒙台梭利常常径直把自然的目的与一种“主宰性理智”或“神圣精神”联系起来（见 6:28, 22:169）。此外，蒙台梭利终身是天主教徒，在多部出版著作中明确讨论上帝，并把她的教育理论应用于宗教教学（尤其见 1929 [1965: 3–20]；MS 19）。在当代蒙台梭利研究中，有神论与宗教（天主教）概念的作用已成为重要议题：有人描述“蒙台梭利的宗教与基督教感受性”（Honegger Fresco 2018: 112；另见 De Giorgi 2013, 2018, 2019）[^honegger-2018]，也有人强调她“与天主教会的一系列公开冲突”（Romano 2020: 204；参见 Foschi & Cicciola 2019；Moretti & Dieguez 2018, 2019）[^foschi-2019][^foschi-2019-2][^moretti-2018][^romano-2020]。还有人强调她与神智学的关联（Giovetti 2009）[^giovetti-2009]，甚至主张“蒙台梭利是一位神智学者”（Wilson 1985；另见 Wylie 2008）[^wilson-1985][^wylie-2008]。Giacomo Cives 对这场争论的总体基调作了有益的描述：
