      [^note-5]: In the same collection, Montessori offers extensive reflections about the philosophy of technology, the dangers that human beings face as a result of having mastered new energies and developed new technologies, pointing out—in ways that anticipate contemporary discussions of the Anthropocene—that our technological development has brought about a new “geological epoch” and warning of the possibility of a “universal cataclysm” and the danger that if human beings use those “energies… for the purposes of destroying themselves, they will soon attain that goal” (10:20). At the same time, Montessori is not a pessimist about technological progress; consistent with her broader, quasi-Nietzschean emphasis on increasing perfection, she sees this new epoch as one in which, potentially, “new, higher, more perfect forms of life” can appear (10:20).
