      Horme is the fundamental force of unconscious life, a “vital force within [each living thing] that guides [its] efforts towards their goal”, a “force” that “might be likened to will power” (1:75). She compares *horme*, albeit merely by “resembl[ance]”, to Bergson’s *élan vitale* or Freud’s *libido*, but says the concept was “first proposed” by the British educationalist Percy Nunn (1:75n). On the one hand, *“Horme* belongs to life in general” (1:75) and can even be called a “a great universal power” (1:229); “the will of nature” can be “called horme” and even “the roots of every plant” manifest something like a “power to choose that … which is conducive to its life” (1:246). Animal instincts and the teleological tendencies of all living things are recognizably continuous with the “interests” of the newborn in features of its environment conducive to its development (cf. Thompson 2007: 57–8)[^thompson-2007]. On the other hand, human infants’ horme lies on a developmental continuum that includes adult willing. Unconscious horme is not *identical* to its conscious manifestation. Following Nunn, Montessori defines the “will” as “conscious horme” (1:75; Nunn 1930 [2010]: 23)[^nunn-1930]. But the unconscious horme intrinsic to the life of the human animal in infancy organically and gradually develops into the conscious (and even self-conscious) willing of the adult, though a series of “successive stages…like the gradual rising of the sun whose light increases until midday” (17:38).
    step1: |-
      *horme* 是无意识生命的基本力量，是“[每个生物]内部引导[其]努力朝向目标的一种生命力量”，是一种“可以比作意志力”的“力量”（1:75）。她把 *horme* 比作柏格森的 *élan vitale* 或弗洛伊德的 *libido*，尽管只是就“相似[之处]”而言；但她指出，这个概念是英国教育家 Percy Nunn“最先提出”的（1:75n）。一方面，“*horme* 属于一般的生命”（1:75），甚至可以被称作“一种伟大的宇宙力量”（1:229）；“自然的意志”可以被“称为 horme”，甚至“每一种植物的根”也表现出某种类似“选择……有益于其生命的东西的力量”（1:246）。动物的本能以及一切生物的合目的倾向，与新生儿对环境中有益于其发展的特征的“兴趣”明显是连续的（参见 Thompson 2007: 57–8）[^thompson-2007]。另一方面，人类婴儿的 horme 处于一个包含成人意志的发展连续统之上。无意识的 horme 并不*等同于*它有意识的显现。遵循 Nunn 的用法，蒙台梭利把“意志”定义为“有意识的 horme”（1:75；Nunn 1930 [2010]: 23）[^nunn-1930]。但婴儿期人类动物生命所固有的无意识 horme，会经由一系列“相继的阶段……就像太阳渐渐升起，其光不断增长，直到正午”（17:38），有机而逐渐地发展为成人有意识（甚至有自我意识）的意志。
