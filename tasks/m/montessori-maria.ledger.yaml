      Montessori was a feminist before becoming a pedagogue and before starting formal study in philosophy. From her childhood, she broke barriers for women in Italy, such as by attending a science and engineering school traditionally reserved for male students and then becoming one of the first women to attend (and graduate from) medical school (see Kramer 1976: 32–51; Babini & Lama 2000: 31–43)[^babini-2000][^babini-2000-2][^kramer-1976]. She represented Italy at major international women’s congresses in 1896 in Berlin, where she argued for equal pay for equal work and represented Italian women’s opposition to colonialism, and then again in 1899 in London (see Kramer 1976: 55; Moretti 2021: 105)[^kramer-1976][^moretti-2021]. As a student and young professor, she supported feminist organizations such as Associazione per la Donna (Association for the Woman) and Pensiero e Azione (Thought and Action), including working with the latter to promote women’s suffrage (see Moretti 2021: 34–38, 104; Babini & Lama 2000: 164–81, 231–37; Babini 2023: 23)[^babini-2000][^babini-2023][^babini-2000-2][^moretti-2021]. We could even
    step1: |-
