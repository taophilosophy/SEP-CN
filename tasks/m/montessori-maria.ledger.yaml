      Dewey offers this critique in the context of a broader description of educational approaches whose “fundamental fallacy” is “in supposing that experience on the part of pupils may be assumed” (1916: 180). In Montessori’s case, the supposed assumption is not warranted, but the underlying critique aptly gets at a fundamental distinction between Dewey’s and Montessori’s methods, one Dewey reiterates later in terms of what he identifies as an “unconscious suspicion of native experience and consequent overdoing of external control” that are “shown…in the material supplied…[in the] Montessori house of childhood” (Dewey 1916: 232)[^dewey-1916].
