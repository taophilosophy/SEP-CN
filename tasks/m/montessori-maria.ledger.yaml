      其一，克伯屈反对蒙台梭利“没有提供更充分社会合作的情境”（1914: 20）。克伯屈的反对可能基于他对“共担责任”与“集体民主”的强调，与他所感知的“个人主义的、几乎反社会的蒙台梭利进路”相对（Simons 1988: 341）[^simons-1988]。如我们所见（§3.2, §5.2, §7），蒙台梭利强烈肯定社会团结、人类相互关联（彼此之间以及与更广生态系统）以及合作的价值；但尤其在她的早期著作中，她强调对个体自由与个体工作的相互尊重。她的课堂促进社会与道德发展，但克伯屈正确地指出：*合作*本身从属于相互尊重与独立工作的可能。
