      Maria Montessori was born in Chiaravalle, Ancona, Italy, on August 31, 1870 and died in Noordwijk aan Zee, the Netherlands, on May 6, 1952. Over the course of her life, she spent prolonged periods in many countries running training courses for teachers who sought to implement her pedagogical philosophy, and she lived for extended periods in Italy, Spain, the Netherlands, and India. Like William James or Sigmund Freud, she did not begin her career as a professional philosopher. Instead, she studied technical engineering in her secondary school and then enrolled at the University of Rome (La Sapienza) in 1890, where after two years of study in the natural sciences and then supplementary exams in Latin and Italian, she was admitted as a third-year medical student, becoming one of the first women in Italy to attend medical school (see Matellicani 2007 for detailed discussion of her years at the University of Rome)[^matellicani-2007]. According to one biographer, early in her life she wanted to be “anything but a teacher” (Standing 1957: 23)[^standing-1957], and she always identified more as a scientist of human nature than as a teacher per se. During the year that she graduated from medical school (1896), Montessori also represented Italy at the International Women’s Congress in Berlin, evidence of her important role in feminist and progressive political circles.
    step1: |-
      玛丽亚·蒙台梭利 1870 年 8 月 31 日生于意大利安科纳的基亚拉瓦莱，1952 年 5 月 6 日卒于荷兰诺德韦克泽。她一生长期辗转多国，为想践行其教育哲学的教师开设培训课程，并曾在意大利、西班牙、荷兰与印度长期居住。与威廉·詹姆斯或西格蒙德·弗洛伊德一样，她的职业生涯并非始于职业哲学家。她先在中学读技术工程，1890 年进入罗马大学（La Sapienza），修完两年自然科学并补考拉丁文与意大利文之后，被录取为三年级医学生，成为意大利最早进入医学院的女性之一（她在罗马大学岁月的详细讨论见 Matellicani 2007）[^matellicani-2007]。据一位传记作者说，她早年“除了教师什么都想做”（Standing 1957: 23）[^standing-1957]，她始终更以“人性科学家”自居，而不是教师本身。在她医学院毕业的当年（1896），蒙台梭利还代表意大利出席了柏林的国际妇女大会，足见她在女权与进步政治圈中的重要地位。
    step2: |-
      玛丽亚·蒙台梭利 1870 年 8 月 31 日生于意大利安科纳的基亚拉瓦莱，1952 年 5 月 6 日殁于荷兰诺德韦克泽。她一生长期辗转多国，为想践行其教育哲学的教师开班授课，又在意大利、西班牙、荷兰、印度住过多年。同威廉·詹姆斯、西格蒙德·弗洛伊德一样，她起初并不是职业哲学家：中学先学的是技术工程，1890 年进罗马大学（La Sapienza），读完两年自然科学、补考拉丁文与意大利文之后，被录取为三年级医学生，跻身意大利最早入医学院的女性之列（罗马大学岁月的详细讨论见 Matellicani 2007）[^matellicani-2007]。据一位传记作者说，她年轻时“除了当教师，什么都想做”（Standing 1957: 23）[^standing-1957]；她一生都以“研究人性的科学家”自居，而非教师本行。医学院毕业那年（1896），她还代表意大利出席柏林国际妇女大会，足见其在女权与进步政治圈中的分量。
