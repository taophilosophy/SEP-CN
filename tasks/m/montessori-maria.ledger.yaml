      The pivotal event in Montessori’s life was an invitation by Edoardo Talamo, a developer of a progressive real estate association renovating tenement housing in the slum district of San Lorenzo in Rome. Talamo wanted to provide childcare and education to residents of his new buildings and invited Montessori to oversee the endeavor. Montessori used this opportunity to create a model classroom in which she could study the effects of various educational materials and pedagogical methods on ordinary children. This provided the foundation for what Patrick Frierson has called a “pedagogical naturalism”, a project of cultivating materials and prepared environments within which children could flourish in freedom and thereby disclose fundamental truths about human nature, development, and culture (Frierson forthcoming). In 1909, Montessori described the results of her initial work in the “Casa dei Bambini” (Children’s House) in a work entitled *Il Metodo della Pedagogia Scientifica applicato all’educazione infantile nelle Case dei Bambini* [*The Method of Scientific Pedagogy Applied to Children’s Education in the Children’s Houses*], which was translated into English in 1912 as *The Montessori Method*, and which went through a series of substantive revisions over the next forty years (see Trabalzini 2003, 2011, 2023)[^trabalzini-2003]. This initial experiment garnered Montessori international attention and enabled (indeed, required) a shift away from her medical practice towards a full time focus on developing, teaching, and spreading her pedagogical methods. Over the rest of her life, she gave over fifty teacher training courses in several countries, including Italy, England, Spain, the United States, and India. Throughout her life, she continued to weigh in on topics of public importance, though her emphasis increasingly shifted from feminist and broadly progressive political concerns to a focus on children’s right and the role of children in the rehabilitation of society and the future of humankind.
    step1: |-
      蒙台梭利一生的关键事件，来自埃多阿尔多·塔拉莫的邀请。塔拉莫是一个进步房地产协会的经营者，在罗马圣洛伦索贫民区改造出租房屋。他想为新楼的居民提供保育与教育，遂邀蒙台梭利主持此事。蒙台梭利借这一机会创建了一个示范教室，用以研究各种教具与教学法对普通儿童的影响。这为 Patrick Frierson 所谓“教育学自然主义”的项目奠定基础：培育教具与预备好的环境，让儿童在其中自由地蓬勃生长，从而揭示关于人性、发展与文化的基本真理（Frierson 即出）。1909 年，蒙台梭利在题为《应用于儿童之家幼儿教育的科学教育学方法》的著作中描述了她在“儿童之家”初期工作的成果；该书 1912 年英译为《蒙台梭利方法》，此后四十年间经了数轮实质修订（见 Trabalzini 2003, 2011, 2023）[^trabalzini-2003]。这场初始实验为蒙台梭利赢得国际关注，也使她得以（实为必须）离开行医，全力投入其教育方法的研发、教学与传播。此后一生，她在意大利、英国、西班牙、美国与印度等国开设了五十多期教师培训课程。终其一生，她都在公共要务上发声，只是重点逐渐从女权与广义的进步政治关切，转向儿童权利以及儿童在重塑社会与人类未来中的角色。
    step2: |-
      蒙台梭利一生的转折点，来自埃多阿尔多·塔拉莫的邀请。塔拉莫是个进步房地产协会的经营者，在罗马圣洛伦索贫民区改造平民住宅，想给新楼住户配上保育与教育，便请蒙台梭利来主持。蒙台梭利借此搭起一间示范教室，研究各种教具与教法对普通儿童的影响。这便是 Patrick Frierson 所称“教育学自然主义”的起点：培育教具与预备好的环境，让孩子在其中自由生长，从而显露关于人性、发展与文化的根本真相（Frierson 即出）。1909 年，蒙台梭利在《应用于儿童之家幼儿教育的科学教育学方法》里写下了她在“儿童之家”头几年的成果；此书 1912 年英译为《蒙台梭利方法》，此后四十年里屡经实质修订（见 Trabalzini 2003, 2011, 2023）[^trabalzini-2003]。这场实验让她名动国际，也让她得以——其实是不得不——放下行医，专心研发、教授并推广她的教育法。此后一生，她在意大利、英国、西班牙、美国、印度等国开了五十多期教师培训。一辈子她都在公共要事上发声，只是重心渐渐从女权与广义的进步政治，转向儿童权利、儿童在重建社会与人类未来中的角色。
