      Andrew Colgan has rightly noted “an unfortunate absence of Montessorian thought in our modern education and philosophy of education literature” (Colgan 2016: 137)[^colgan-2016], and others have remarked that the Montessori “movement remains largely unstudied by educational researchers” (Whitescarver & Cossentino 2008: 2571)[^whitescarver-2008]. Montessori’s pedagogy is discussed among Montessori educators in professional trade publications such as *The AMI Journal* (from the Association Montessori Internationale) and *Montessori Life* (from the American Montessori Society), but academic philosophers of education have, thus far, given her remarkably little attention. The *Journal of the Philosophy of Education*, for example, has published only two articles that take Montessori as a focus (Frierson 2016a; 2021a)[^frierson-2016a] and only a handful that discuss her in any significant way (e.g., Engelmann 2022)[^engelmann-2022].
    step1: |-
      Andrew Colgan 中肯地指出，“现代教育学与教育哲学文献中不幸缺少蒙台梭利的思想”（Colgan 2016: 137）[^colgan-2016]；也有人指出，蒙台梭利“运动仍大体未受教育研究者研究”（Whitescarver & Cossentino 2008: 2571）[^whitescarver-2008]。蒙台梭利教育者内部会在《AMI 学刊》（国际蒙台梭利协会）与《蒙台梭利生活》（美国蒙台梭利学会）之类的行业刊物上讨论其教育学，但学院派教育哲学家至今对她关注得少得惊人。例如，《教育哲学杂志》只发表过两篇以蒙台梭利为焦点的文章（Frierson 2016a; 2021a）[^frierson-2016a]，认真讨论她的也只寥寥几篇（如 Engelmann 2022）[^engelmann-2022]。
    step2: |-
      Andrew Colgan 说得很对：“现代教育学与教育哲学文献里，蒙台梭利的思想不幸缺位”（Colgan 2016: 137）[^colgan-2016]。也有人指出，蒙台梭利“运动至今大体不在教育研究者的视野内”（Whitescarver & Cossentino 2008: 2571）[^whitescarver-2008]。蒙台梭利圈内人自会在《AMI 学刊》（国际蒙台梭利协会）、《蒙台梭利生活》（美国蒙台梭利学会）这类行业刊物上讨论她的教育学；可学院里的教育哲学家，至今对她关注之少令人吃惊。比如《教育哲学杂志》只发过两篇以她为焦点的文章（Frierson 2016a; 2021a）[^frierson-2016a]，正经讨论她的也就寥寥几篇（如 Engelmann 2022）[^engelmann-2022]。
