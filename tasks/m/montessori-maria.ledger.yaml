      In 1903, Montessori returned to the University of Rome, being admitted as a third-year graduate student in philosophy, despite not having the classical diploma that was technically a prerequisite for admission (De Stefano 2020 [2022, 73]). As she explained, “wishing to undertake the study of normal[^note-2] pedagogy and of the principles upon which it is based, I registered as a student of philosophy at the University” (2:23; 1909 [1912: 33]). While there, she took courses in the history of philosophy, ethics, metaphysics, and the philosophy of education with philosophers such as Antonio Labriola and Luigi Credaro, though she was also drawn to both pragmatist and positivist currents that were influential at the time (see Matellicani 2007; James 1906; Santucci 1963)[^james-1906][^matellicani-2007][^santucci-1963]. One contemporary reported that during this period,
