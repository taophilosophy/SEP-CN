      Relatedly, Tiziana Pironi has shown how Montessori “seems to take up Ellen Key’s challenge”, referring to the Nietzsche-inspired challenge issued by early twentieth century feminist philosopher Ellen Key, the challenge of developing early educational programs capable of raising humanity to a higher level. Pironi argues that while Key emphasized the important role of maternal love in this elevation and was pessimistic about formal schooling, Montessori shows how to develop institutions that can free women to engage in the workplace while providing children with liberty and love to flourish and develop (Pironi 2010)[^pironi-2010].
    step1: |-
      与此相关，Tiziana Pironi 说明蒙台梭利如何“似乎接下了 Ellen Key 的挑战”。这里指的是二十世纪初女权主义哲学家 Ellen Key 受尼采启发提出的挑战：发展能够把人类提升到更高层次的早期教育方案。Pironi 论证说，Key 强调母爱在这一提升中的重要作用，并对正规学校教育持悲观态度；蒙台梭利则展示了如何发展制度，既把女性解放出来进入职场，又给孩子以自由与爱，使其蓬勃成长（Pironi 2010）[^pironi-2010]。
