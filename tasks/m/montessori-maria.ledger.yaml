      First, Kilpatrick objects that Montessori “does not provide situations for more adequate social cooperation” (1914: 20). Kilpatrick’s opposition may be based on his emphasis on “shared responsibility” and “collective democra[cy]”, in contrast to what Kilpatrick perceived as a “individualistic, almost anti-social Montessori approach” (Simons 1988: 341)[^simons-1988]. As we have seen (§3.2, §5.2, §7), Montessori strongly affirms the value of social solidarity, human interconnectedness (with each other and the broader ecosystem), and cooperation; but especially in her early writings, she emphasized the importance of mutual respect for individual liberty and individual work. Her classrooms promote social and moral development, but Kilpatrick rightly notes that *cooperation* per se is secondary to mutual respect and the possibility of independent work.
