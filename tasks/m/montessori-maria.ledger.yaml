      Early response(s) to Montessori’s work reflect the tumults of the times in which she lived. On one hand, she was received with international acclaim during her early career. Her participation in feminist conferences in Berlin and London was hailed in international media. Throughout her life, educators around the world sought her trainings and her insights. She was nominated three times (1949, 1950, 1951) for the Nobel Peace Prize (see Moretti 2021: 217)[^moretti-2021]. Her works were and are widely translated and disseminated throughout the world.
    step1: |-
      对蒙台梭利工作的早期回应，反映了她所处时代的动荡。一方面，她的早期生涯获得了国际赞誉。她参加柏林与伦敦女性主义会议一事，受到国际媒体的礼赞。终其一生，世界各地的教育者都寻求她的培训与洞见。她曾三次（1949、1950、1951）获得诺贝尔和平奖提名（见 Moretti 2021: 217）[^moretti-2021]。她的著作过去和现在都被广泛翻译并传播于全世界。
    step2: |-
      对蒙台梭利工作的早期回应，映照出她所处时代的动荡。一方面，她早期生涯获得国际赞誉：她参加柏林与伦敦女性主义会议，受到国际媒体礼赞；终其一生，世界各地的教育者都来寻求她的培训与洞见。她曾三次（1949、1950、1951）获诺贝尔和平奖提名（见 Moretti 2021: 217）[^moretti-2021]。她的著作过去和现在都被广泛翻译、传播于全世界。
