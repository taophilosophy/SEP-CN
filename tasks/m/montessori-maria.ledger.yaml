      Third, Montessori sees sensory awareness as *trainable* and *cultivatable*. Unlike Locke, for whom sensory distinctions are accomplished “without … labour; but at first view, by [a] natural power” (Locke 1689: IV.i.4 [1975: 526])[^locke-1689], Montessori observed that even the most basic sensory discrimination requires, for its development, cultivation through “sensory gymnastics” or “sensory exercises” (Montessori 1909 [1912: 168–76])[^montessori-1909]. Her more thoroughgoing empiricism provides an answer to David Hume’s famous *missing shade of blue*, which Hume raises as a possible counter-example to strict empiricism. Hume suggests that if one experienced a range of colors “except one particular shade of blue” (1748: §2.8), one would be able imagine this shade and thereby form an idea one had never experienced. Montessori, however, found that discrimination among shades is not merely a passive capacity but an acquired skill. She developed a series of color tablets of different shades on which students train their sensory discrimination through a series of increasingly difficult distinctions. As it turns out, it is quite difficult even to properly distinguish shades of colors physically present to one’s senses; even “many…adults” are often unable to “distinguish shades of color” (17:195). To develop the ability to *see* colors, much less to imagine them, requires not only experience, but sensory exercises in which one “keep their attention fixed in these exercises in such a way that they will continue the exercises … until they have developed the ability to distinguish the shades” (18:160).
    step1: |-
      第三，蒙台梭利把感官知觉看作*可训练的*、*可培育的*。洛克认为感官分辨“无须……劳作，初看之下便由[一种]自然力量完成”（Locke 1689: IV.i.4 [1975: 526]）[^locke-1689]；与此不同，蒙台梭利观察到，即便最基本的感官分辨，其发展也需要通过“感官体操”或“感官练习”来培育（Montessori 1909 [1912: 168–76]）[^montessori-1909]。她更彻底的经验主义为 David Hume 著名的*缺失的蓝色*提供了答案；休谟提出它，作为严格经验主义的可能反例。休谟设想：一个人如果经验过一系列颜色，“唯独缺某一种特定的蓝色”（1748: §2.8），他仍能想象这种色调，从而形成一个从未经验过的观念。然而蒙台梭利发现，色调之间的分辨并非被动能力，而是习得的技能。她设计了一系列不同色调的颜色卡片，学生通过一系列由易到难的分辨来训练感官分辨力。事实证明，即便要恰当分辨感官面前实际呈现的色调，也相当困难；甚至“许多……成人”也常常无法“分辨色调”（17:195）。要发展*看见*颜色的能力，更不用说想象它们的能力，不仅需要经验，还需要这样的感官练习：练习者“在练习中保持注意的固定，从而继续练习……直到发展出分辨色调的能力”（18:160）。
