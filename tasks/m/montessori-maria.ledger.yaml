      Some of Montessori’s ecological principles are now familiar facts. Organisms exist in ecosystems and fill various niches within those ecosystems, niches that both serve eco-systemic purposes and provide what is necessary for the organisms. Montessori’s account of adaptation shows how individual/species-level fitness and the ecological fitness are integrated. Organisms adapt to their environments by serving functions within those environments. But unlike most contemporary ecologists, Montessori sees a more basic teleology underlying these processes. For her, the ecological function of the organism is not merely the result of efficient-causal processes of selection and (consequent) adaptation. As in the individual case, teleology is *fundamental*. Adaptation is central to living organisms *because* it provides a mechanism for directing evolution in a way conducive to the promotion of ecological harmony and—in a more Hegelian or Nietzschean vein—the “evolution” of the cosmos (cf. Gimbel & Emerson 2009)[^gimbel-2009].
    step1: TBD
    step2: TBD
