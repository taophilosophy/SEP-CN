      This neglect is not due to a lack of philosophical richness within Montessori’s thought. When Montessori returned to the University of Rome to study philosophy, she explicitly did so “wishing to undertake the study of normal pedagogy and of the principles upon which it is based” (Montessori 1909 [1912, 33])[^montessori-1909]. She studied philosophical pedagogy with Luigi Credaro, the founder of a journal devoted to the philosophy of education (the *Rivista Pedagogica*, 1908–39) and an important Italian popularizer of Johann Friedrich Herbart’s pedagogy (Credaro 1900 [1915]; see Matellicani 2007: 221–3; D’Arcangeli 2021)[^credaro-1900][^d’arcangeli-2021][^matellicani-2007]. Even while seeking to disclose broader philosophical insights from the study of children, Montessori saw herself as following Credaro’s lead, with a goal “to raise Pedagogy from the inferior position it has occupied as a secondary branch of philosophy, to the dignity of a definite science” (Montessori 1909 [1912: 5])[^montessori-1909].
    step1: |-
      这种忽视并不是因为蒙台梭利思想缺乏哲学厚度。蒙台梭利重返罗马大学攻读哲学时，明确是“希望研究普通教育学及其所依据的原理”（Montessori 1909 [1912, 33]）[^montessori-1909]。她随路易吉·克雷达罗研习哲学的教育学；克雷达罗创办了一份专攻教育哲学的刊物（《教育评论》，1908–39），也是约翰·弗里德里希·赫尔巴特教育学在意大利的重要普及者（Credaro 1900 [1915]；见 Matellicani 2007: 221–3; D’Arcangeli 2021）[^credaro-1900][^d’arcangeli-2021][^matellicani-2007]。即便在力求从儿童研究中揭示更广的哲学洞见时，蒙台梭利也自认是在追随克雷达罗，目标是把“教育学从它作为哲学次要分支的低微地位，提升为一门确定科学的尊严”（Montessori 1909 [1912: 5]）[^montessori-1909]。
    step2: |-
      这份忽视，并非因为蒙台梭利的思想不够哲学。她回罗马大学读哲学，明说是“为研究普通教育学及其原理”（Montessori 1909 [1912, 33]）[^montessori-1909]。她跟路易吉·克雷达罗学哲学的教育学——克雷达罗办过一份专攻教育哲学的刊（《教育评论》，1908–39），也是约翰·弗里德里希·赫尔巴特教育学在意大利的重要推手（Credaro 1900 [1915]；见 Matellicani 2007: 221–3; D’Arcangeli 2021）[^credaro-1900][^d’arcangeli-2021][^matellicani-2007]。即便想从孩子身上挖出更宽的哲学洞见，蒙台梭利也自认跟着克雷达罗走，目标是把“教育学从哲学附庸的低位，抬到一门确定科学的尊严”（Montessori 1909 [1912: 5]）[^montessori-1909]。
