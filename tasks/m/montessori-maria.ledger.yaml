      在教学工作的背景下，蒙台梭利从“对儿童的研究”中寻求一种“无限更广的影响，延伸到一切人类问题”，特别是那个“未知量，对它的发现或许能使成人解决其个体与社会问题”（22:1）。这一工作揭示了一个“新儿童”，以及人类繁荣的新可能。她尤其看到：儿童有一种能动性，努力独立完成有挑战的工作；一旦置于有益于繁荣的条件中，这种能动性会生发出若干关键的蒙台梭利式德性，包括她所谓的“品格”（1:174）、“尊重他人的工作并体谅他人的权利”（9:70），以及她称为“社会团结”的一种深刻的统一（1:237）。此外，她聚焦儿童（尤其是幼童）道德生命的发展，引起人们注意（道德）能动性与伦理生活在本质上的具身性与生成性。
