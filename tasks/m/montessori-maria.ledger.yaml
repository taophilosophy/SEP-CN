      Kilpatrick was influential within the U.S. educational establishment and helped push Montessori’s method out of the spotlight. While there was a significant revival of interest in Montessori with the founding of the American Montessori Society by Nancy Rambusch in 1960, Montessori has still not been incorporated into mainstream educational theory in the U.S. With Kilpatrick’s critique of Montessori, “For the first time in modern history of American public education, a genuine lay enthusiasm had been engendered but died in the face of professional opposition” (Beck 1960: 162)[^beck-1960].
