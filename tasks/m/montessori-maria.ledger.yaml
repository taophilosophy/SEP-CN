      Christine Quarfood connects this interest in creating idyllic prepared environments with Michel Foucault’s concept of the heterotopia, wherein “the utopia of the autonomous child could be realized” (Quarfood 2022: 57; cf. Foucault 1984 [1997: 335])[^foucault-1984][^quarfood-2022]. Montessori’s philosophy of education emphasized providing children with rich environments within which they would not only find child-sized furniture and tools for practical life, but also carefully designed materials enabling them to follow various “guiding instincts” towards development (22: 178). She identified an innate desire for persistent concentration on self-chosen tasks, a “vital instinct” oriented towards “work”, “for without work his personality cannot organize itself and deviates from the normal lines of its construction” (22: 165). Her pedagogy is grounded on the construction of environments within which children can find activities that engage their attention and then the protection of the independence of the child once in those environments: “human beings placed in the most favorable conditions should be left free to develop themselves” (18:9). In these contexts, Montessori describes a process she calls “normalization”, which is not a standardization of children to a pre-given norm, but rather “a psychological recovery” whereby “a unique type of child appears, a ‘new child’; but really…the child’s true ‘personality’ allowed to construct itself normally” (1:134, 183).
    step1: |-
      Christine Quarfood 把这种创造田园式预备环境的兴趣，与米歇尔·福柯的“异托邦”概念联系起来：在那里，“自主儿童的乌托邦得以实现”（Quarfood 2022: 57；参看 Foucault 1984 [1997: 335]）[^foucault-1984][^quarfood-2022]。蒙台梭利的教育哲学强调为儿童提供丰富的环境：其中不仅有适合儿童尺寸的家具与日常生活用具，还有精心设计的材料，使他们能循着各种“引导性本能”走向发展（22: 178）。她认定儿童有一种天生的欲望，要持续专注于自选的任务，一种朝向“工作”的“生命本能”，“因为不工作，他的人格就无法组织起来，就会偏离其建构的正常路线”（22: 165）。她的教育学立足于营造环境：让孩子在其中找到能吸引注意的活动，然后在这种环境里保护儿童的独立：“处在最有利条件下的人，应当被任其自由发展”（18:9）。在此语境中，蒙台梭利描述了一个她称为“正常化”的过程；这不是把儿童标准化到一个预设规范，而是“一种心理康复”：由此“出现一种独特的儿童，‘新儿童’；但其实……是儿童真正的‘人格’得以正常地建构自身”（1:134, 183）。
    step2: |-
      Christine Quarfood 把这种营造田园式预备环境的兴致，跟米歇尔·福柯的“异托邦”概念挂上钩：在那里，“自主儿童的乌托邦得以成真”（Quarfood 2022: 57；参看 Foucault 1984 [1997: 335]）[^foucault-1984][^quarfood-2022]。蒙台梭利的教育哲学讲究给孩子丰足的环境：既有儿童尺寸的家具与日常用具，也有精心设计的材料，让他们能顺着种种“引导性本能”往前走（22: 178）。她认定孩子天生就想长久专注于自己挑的事，这是一种朝向“工作”的“生命本能”，“因为不工作，他的人格就组织不起来，就会偏离建构的正常路线”（22: 165）。她的教育学就落在营造这样的环境：孩子在其中找得到抓得住注意的活动；一旦进去了，还要护住他的独立——“把人放在最有利的条件下，就该任其自由发展”（18:9）。由此，蒙台梭利讲一个她称为“正常化”的过程：不是把孩子按某个既定标准统一起来，而是“一种心理康复”——“由此出现一种独特的儿童，‘新儿童’；其实……是儿童真正的‘人格’得以正常地长成”（1:134, 183）。
