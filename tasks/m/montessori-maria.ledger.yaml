      Ultimately, Montessori uses the concept of God to direct attention back to her philosophy’s methodological and ethical core: the child. She emphasizes “the child’s own powers, given to him by the Creator” (1929 [1965: 4]) the “wonderful powers of divine creation in the child’s soul” (1929 [1965: 5]), and the ways that “children in spiritual freedom disclose the will of God” (in De Giorgi 2013: 325–6, my translation). When she seems to theologize pedagogy, saying “we must not just see the child, but God in him”, she immediately makes this theology immanent and naturalized with*in* the child: “We must respect the laws of creation in him. We must not think we can make him; if we do, we are spoiling the Divine work” (7:96). Her personal faith in God and her theistic statements in writings directed towards religious believers thus primarily serve to enhance the dignity of the child.
