      §2 已指出，预备环境是蒙台梭利的基本教学原则之一。基于对儿童的观察，蒙台梭利发现儿童偏爱具有清晰而离散秩序的材料，以及她后来所谓“错误控制”（1:224）——材料本身提供自我纠正的手段。（举一个直观而非蒙台梭利式的例子：拼图若未拼对，会因与盒盖上的图画不相像而显出错误。）对蒙台梭利来说，促进儿童的自由需要关注哪些材料能使儿童进行持续的、自我导向的注意，然后精心营造充满这些材料的环境。对杜威来说，这种环境准备构成一种“对原始材料的恐惧”，是对儿童选择的过度成人控制；“外部控制”既发生在“材料中……也发生在……教师的命令中”（1916: 232）。相反，杜威寻求让儿童在自然与寻常环境中获得自由——一种包含更开放的探索与对环境的创造性回应的自由。
