      Given the emphasis on embodied cognition in practice, Montessori emphasizes cognition as something active (what we would now call “[enactive cognition](https://plato.stanford.edu/entries/embodied-cognition/#EnacCogn)”): “mind and movement are part of the same entity” (1:126), “by the most intelligent being we do not mean only the one who gathers most but also the being who moves the most” (18:165), and “Only by action can the child learn” (1:154). Arguably, “the first true Montessori revolution” was the claim that “movement and cognition [are] deeply intertwined” (Foschi 2012: 132; see 1:126, 154)[^foschi-2012]. Similarly, contemporary philosophers of mind who advocate embodied approaches to cognition often also encourage replacing conceptions of the mind as a representational or computational process with thinking of the mind as a kind of embodied *activity*. Alva Nöe, for example, says that “consciousness is more like dancing than it is like digestion” (2009: xii).
    step1: |-
      既然在实践中强调具身认知，蒙台梭利便强调认知是一种活动（即我们今天所说的“[生成认知](https://plato.stanford.edu/entries/embodied-cognition/#EnacCogn)”）：“心灵与运动是同一实体的组成部分”（1:126）；“所谓最有智慧的存在者，我们指的不仅是收集最多的那个，也是运动最多的那个”（18:165）；“儿童唯有通过行动才能学习”（1:154）。可以说，“第一次真正的蒙台梭利革命”就是这一主张：“运动与认知[是]深度交织的”（Foschi 2012: 132；见 1:126, 154）[^foschi-2012]。类似地，当代主张具身认知进路的心灵哲学家，也常常鼓励用“心灵是一种具身的*活动*”来替换“心灵是表征或计算过程”的构想。例如 Alva Nöe 说：“意识更像跳舞，而不像消化”（2009: xii）。
