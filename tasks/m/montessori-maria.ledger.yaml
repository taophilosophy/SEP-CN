      On the other hand, particularly after the outbreak of the First World War and then with the rising prominence of Dewey in the United States and other progressive educators in Europe, not to mention the widespread adoption of so-called “factory” or “banking” models of education in the U.S. and U.K. and fascist suppression of liberatory education in Germany and also (after initial support) in Italy, Montessori’s thought as educator, scientist, and philosopher was increasingly marginalized over the course of the twentieth century. Her choice to leave the university and focus practitioners informed by her philosophy played some role in this marginalization, but we should not underestimate the role of her sex, nationality, and advocacy on behalf of children. Freud, an Austrian man who built a movement around analysis of adults, had little trouble gaining academic attention even from outside the academy. Montessori, an Italian woman focusing her energy on the insights disclosed by children, was rapidly sidelined. Thus, recent responses to Montessori are relatively few. Most philosophers of education treat her as a marginal member of a line of progressive pedagogues from Rousseau through Freire or bell hooks. Particularly among Anglophone philosophers, Dewey rather than Montessori is emblematic of early twentieth-century progressive education. In other fields of philosophy, she has been virtually ignored, for many of the reasons other women have been marginalized in the history of philosophy (see Shapiro 2016)[^shapiro-2016].
    step1: |-
      另一方面，特别是在第一次世界大战爆发之后，加上杜威在美国及其他进步教育者在欧洲的地位渐隆，更不必说所谓“工厂”或“银行”教育模式在美国与英国的广泛采用，以及法西斯主义对解放性教育的压制（在德国，以及[在最初支持之后]在意大利），蒙台梭利作为教育家、科学家与哲学家的思想在整个二十世纪日益边缘化。她选择离开大学、专注于由其哲学启发的实践者，对这种边缘化起了一定作用；但我们不应低估她的性别、国籍与为儿童发声的作用。弗洛伊德，一位围绕对成人的分析建立运动的奥地利男性，即便在学院之外也几乎不费力就获得了学术关注。蒙台梭利，一位把精力倾注于儿童所揭示之洞见的意大利女性，则迅速被边缘化。因此，对蒙台梭利的晚近回应相对较少。大多数教育哲学家把她当作从卢梭经弗莱雷到 bell hooks 的进步教育家谱系中的边缘成员。尤其在英语哲学家中间，代表二十世纪初进步教育的是杜威而非蒙台梭利。在哲学的其他领域，她几乎被忽视，其原因与许多女性在哲学史中被边缘化的原因相同（见 Shapiro 2016）[^shapiro-2016]。
