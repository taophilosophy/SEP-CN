      ## 9. Montessori’s Influence and Relevance
    step1: TBD
    step2: TBD
  - id: 173
    kind: body
    source: |-
      Montessori’s most significant impacts over the past hundred years have been the tens of thousands of schools throughout the world in which children develop in classrooms overseen by teachers trained in her pedagogical philosophy, methods, and materials. In addition, many of Montessori’s ideas about children and childhood—such as “sensitive periods” in child development, the need for environments designed and sized for children, children’s rights, and freedom in education—have all become widespread. Some of Montessori’s most important political ideals, such as her advocacy for a Social Party of the Child or a White Cross that would deal with psychological trauma in wartime, have yet to materialize. But her overall role in making the twentieth century the “Century of the Child” (see Key 1909)[^key-1909] was substantial and lasting.
    step1: TBD
    step2: TBD
  - id: 174
    kind: body
    source: |-
      Her pedagogical work gave rise to several national and international organizations that continue her legacy in both theory and practice. The Association Montessori Internationale (AMI), which was established by Montessori in 1929 and is currently headquartered in Amsterdam, maintains a publication—*The AMI Journal*—and archives and works with the Montessori-Pierson Publishing Company (a publishing company established by Montessori’s heirs) to put out editions of Montessori’s works and lectures in multiple languages, sometimes in collaboration with other publishers. The American Montessori Society (AMS) is the largest professional association of Montessorians in the United States and has its own trade publication—*Montessori Life*—and sponsors an academic journal: *The Journal of Montessori Research*. Other Montessori-related organizations abound, many with their own publications. Increasingly, Montessorians have sought to bring Montessori’s ideas into richer conversation with other educational, psychological, and philosophical ideas. Within psychology, Angeline Lillard’s research program examines Montessori in the light of contemporary psychology (see Lillard 2005 and subsequent editions and links at [Montessori-Science.org](https://www.montessori-science.org/)). *The Bloomsbury Montessori Handbook* (Murray et al. 2023)[^murray-2023] pulls together recent research on Montessori from a variety of fields (including philosophy).
    step1: TBD
    step2: TBD
  - id: 175
    kind: body
    source: |-
      Among philosophers, Montessori has been largely neglected, though there are some signs of new interest in applying her work to ongoing philosophical problems not only in the philosophy of education but also, as this entry has shown, to a wide range of philosophical issues. Andrew Colgan’s work (2016) shows the relevance of her epistemology for her philosophy of education. Patrick Frierson has shown how she speaks to current issues in virtue epistemology (2018; 2020), moral philosophy (2021b; 2022), technology studies (2024), and other fields (forthcoming). Laura Di Paolo shows the anticipation of embodied/enactive/extended mind in Montessori work, and the ongoing relevance of that work for a range of issues in the philosophy of mind (Di Paolo et al. 2024). Erica Moretti’s work on the central role of peace in Montessori not only provides a new historical perspective on Montessori but opens room for developing Montessorian alternatives to contemporary approaches to peace studies and peace education (2021), and Nicholas Parkin draws on Montessori to defend what he calls “educational pacificism” (2024). De Giorgi has done historical work on Montessori’s religious works (see especially 2013; 2018; 2019), while Natalie Carnes’s excellent article on Montessori’s “theological anthropology” shows how Montessori’s approach to children provides new ways of thinking about oppression, the human condition, original sin, and other important topics in a feminist-liberationist theological context (2015). Like other marginalized figures in the history of philosophy, Montessori’s contemporary relevance outstrips her influence, and research on her philosophical contributions is still in its infancy.
