      Kilpatrick offers many criticisms, but the two most important are these:
    step1: TBD
    step2: TBD
  - id: 167
    kind: body
    source: |-
      First, Kilpatrick objects that Montessori “does not provide situations for more adequate social cooperation” (1914: 20). Kilpatrick’s opposition may be based on his emphasis on “shared responsibility” and “collective democra[cy]”, in contrast to what Kilpatrick perceived as a “individualistic, almost anti-social Montessori approach” (Simons 1988: 341)[^simons-1988]. As we have seen (§3.2, §5.2, §7), Montessori strongly affirms the value of social solidarity, human interconnectedness (with each other and the broader ecosystem), and cooperation; but especially in her early writings, she emphasized the importance of mutual respect for individual liberty and individual work. Her classrooms promote social and moral development, but Kilpatrick rightly notes that *cooperation* per se is secondary to mutual respect and the possibility of independent work.
    step1: TBD
    step2: TBD
  - id: 168
    kind: body
    source: |-
      Second, consistent with Dewey’s central critique, Kilpatrick objects to the artificiality and especially rigidity of Montessori materials: “The didactic apparatus which forms the principal means of activity in the Montessori school affords singularly little variety” and thus “affords but meager diet for normally active children” (1914: 27–8). Instead of such material, we should offer “life itself and the situations that arise therefrom” (1914: 34).
    step1: TBD
    step2: TBD
  - id: 169
    kind: body
    source: |-
      In the end, he says, “in the content of her doctrine, she belongs essentially to the mid-nineteenth century, some fifty years behind the present development of educational theory” and “if we compare the work of Madame Montessori with that of…Professor Dewey”, we find that Dewey’s ideas
    step1: TBD
    step2: TBD
  - id: 170
    kind: body
    source: |-
      > include all that is valid in [her] doctrines…, afford the criteria for correcting her errors…and…go vastly farther in the construction of an educational method. (1914: 63, 65)
    step1: TBD
    step2: TBD
