      A full discussion of Montessori’s life would go beyond what is necessary or appropriate here; instead, see Kramer 1976 or Moretti 2021. Even a brief discussion of her life cannot leave out, however, one of its more controversial episodes, namely Montessori’s willingness to work with Benito Mussolini during the period of Italian fascism. As Mussolini rose to power in Italy in the late 1920s and 1930s, Montessori was an international sensation living and working in Barcelona, Spain. Starting with its inclusion in Giovanni Gentile’s school reforms in 1923, Montessori’s education method was included in discussions of reforming education in Italy, and in the early years of his reign, Mussolini offered “official recognition and extensive establishment of Montessori schools” throughout Italy (Moretti 2023: 292)[^moretti-2023]. Montessori reciprocated by inviting him to be, for example, President of the Opera Nazionale Montessori and offering that, as Quarfood puts it, “her character-building method is entirely in line with the regime’s intentions to improve the population’s morale” (Quarfood 2022: 176)[^quarfood-2022]. By 1936, however, Montessori and Mussolini severed their relationship, as Mussolini went to war in East Africa, the Nazis shut down all Montessori schools in Germany, and Montessori and her colleagues were being surveilled by the fascists for anti-fascist activity. The Opera Nazionale Montessori was shut down and Montessori education not supported (though not officially banned) in Italy. Scholars disagree about how best to assess the relationship between Montessori’s philosophy and that of the fascist regime in Italy. Some have claimed that Montessori’s pedagogy was “well equipped to serve the fascist regime of Mussolini” (Engelmann 2022: 527; see too Leenders 2001)[^engelmann-2022][^leenders-2001]. The more common reading is that the relationship was marriage of convenience, in which at first each “heard what [they] wanted to hear” (Kramer 1976: 282, see too 302–3)[^kramer-1976], but eventually “the fundamental differences between the principles of Montessori’s work and…the fascist regime brought the relationship to a predictable halt” (Moretti 2023: 293)[^moretti-2023]. Christine Quarfood offers an overview of debates about Montessori’s fascism (Quarfood 2022: 129–167)[^quarfood-2022], including intermediate views such as Luisa Lama’s suggestion that “fascism’s attention to the problems of childhood may have deceived Montessori” (Lama 2002: 325, quoted and translated in Quarfood 2022: 184; see too Marazzi 2000)[^lama-2002][^marazzi-2000][^quarfood-2022]. Quarfood herself highlights certain features of fascism that Montessori would have found congenial, such as Mussolini’s suggestion that “ignorant parents” are the “‘main obstacle’ to the regime’s eugenics program” or that the right kind of education could enhance the human race and promote “the moral and physical health of the lineage” (see Quarfood 2022: 203, 208)[^quarfood-2022]. Nonetheless, Montessori’s commitments to peace, cosmopolitanism, and especially to expanding liberty for children and ultimately for all people put her fundamentally at odds with fascist ideology. At a time when illiteracy was still a serious problem in Italy, Montessori and the fascists shared an interest in the role of education in human progress, but fundamental differences led them to take this shared interest in very different directions in the end.
    step1: |-
      全面讨论蒙台梭利的生平超出了此处的必要与适当范围；可参见 Kramer 1976 或 Moretti 2021。但即便简要讨论其生平，也无法略过一段争议甚多的经历，即蒙台梭利在意大利法西斯时期愿意与贝尼托·墨索里尼合作。二十世纪二三十年代，当墨索里尼在意大利上台时，蒙台梭利正是一位住在西班牙巴塞罗那的国际名人。自 1923 年蒙台梭利法被纳入乔瓦尼·真蒂莱的学校改革起，改革意大利教育的话题中就包括她的方法；墨索里尼在位初期，“官方承认并大规模设立蒙台梭利学校”，遍布意大利（Moretti 2023: 292）[^moretti-2023]。蒙台梭利投桃报李，邀请墨索里尼出任意大利全国蒙台梭利学会主席之类的职务，并如 Quarfood 所说，表示“她塑造性格的方法，完全符合该政权改善国民士气的意图”（Quarfood 2022: 176）[^quarfood-2022]。然而到 1936 年，蒙台梭利与墨索里尼断绝了关系：墨索里尼在东非开战，纳粹查禁了德国的全部蒙台梭利学校，蒙台梭利与同事也因反法西斯活动而受到法西斯分子的监视。意大利全国蒙台梭利学会被关停，蒙台梭利教育在意大利不再受支持（虽未正式禁止）。关于如何评估蒙台梭利哲学与意大利法西斯政权的关系，学界意见不一。有人说蒙台梭利的教育学“很适合为墨索里尼的法西斯政权服务”（Engelmann 2022: 527；另见 Leenders 2001）[^engelmann-2022][^leenders-2001]。更常见的解读是：这段关系是一桩权宜婚姻——起初双方“都只听见自己想听的话”（Kramer 1976: 282，另见 302–3）[^kramer-1976]，但最终“蒙台梭利工作原则与……法西斯政权之间的根本分歧，使这段关系走向可以预见的终点”（Moretti 2023: 293）[^moretti-2023]。Christine Quarfood 对蒙台梭利与法西斯主义的争论作了综述（Quarfood 2022: 129–167）[^quarfood-2022]，其中也有中间立场，如 Luisa Lama 的建议：“法西斯主义对童年问题的关注可能蒙骗了蒙台梭利”（Lama 2002: 325，转引自 Quarfood 2022: 184；另见 Marazzi 2000）[^lama-2002][^marazzi-2000][^quarfood-2022]。Quarfood 本人则点出法西斯主义的某些特征会让蒙台梭利觉得投缘，比如墨索里尼说“无知的父母”是政权优生计划的“主要障碍”，又比如恰当的教育能改善人种、促进“血统的道德与身体健康”（见 Quarfood 2022: 203, 208）[^quarfood-2022]。尽管如此，蒙台梭利对和平、世界主义的坚持，尤其对扩展儿童自由、进而扩展所有人自由的坚持，使她从根本上与法西斯意识形态格格不入。在文盲仍是意大利严重问题的年代，蒙台梭利与法西斯分子都关心教育在人类进步中的作用，但根本分歧最终使他们把这层共同兴趣引向截然不同的方向。
    step2: |-
      全面讨论蒙台梭利的生平，此处既不必也不宜；详见 Kramer 1976 或 Moretti 2021。不过哪怕只作简述，也绕不开她生平中一桩争议极大的事：意大利法西斯时期，她愿意与贝尼托·墨索里尼合作。二十世纪二三十年代，墨索里尼当权之际，蒙台梭利正住在西班牙巴塞罗那，是国际名人。自 1923 年她的方法被乔瓦尼·真蒂莱的学校改革收编，意大利教改话题里就有蒙台梭利；墨索里尼当政头几年，更在意大利各地“官方承认、大规模设立蒙台梭利学校”（Moretti 2023: 292）[^moretti-2023]。蒙台梭利也投桃报李：请墨索里尼出任意大利全国蒙台梭利学会主席一类职务，还如 Quarfood 转述，说“她塑造性格的方法，完全符合该政权改善国民士气的意图”（Quarfood 2022: 176）[^quarfood-2022]。可到 1936 年，两人决裂：墨索里尼在东非开战，纳粹查封德国全部蒙台梭利学校，蒙台梭利与同事又因反法西斯活动受法西斯分子监视。意大利全国蒙台梭利学会被关停，蒙台梭利教育在国内失宠（虽未正式遭禁）。她与法西斯政权的关系该怎么评，学界看法不一。有人说，她的教育学“很适合为墨索里尼的法西斯政权所用”（Engelmann 2022: 527；另见 Leenders 2001）[^engelmann-2022][^leenders-2001]。更通行的读法是权宜联姻：起初双方“都只听见自己想听的话”（Kramer 1976: 282，另见 302–3）[^kramer-1976]，最终“蒙台梭利工作的原则与……法西斯政权的根本分歧，把这段关系带向可以预见的终点”（Moretti 2023: 293）[^moretti-2023]。Christine Quarfood 梳理过这桩争论（Quarfood 2022: 129–167）[^quarfood-2022]，中间立场也有，如 Luisa Lama 的猜想：“法西斯主义对童年问题的关注，可能蒙骗了蒙台梭利”（Lama 2002: 325，转引自 Quarfood 2022: 184；另见 Marazzi 2000）[^lama-2002][^marazzi-2000][^quarfood-2022]。Quarfood 本人则点出法西斯主义的几处特征会让蒙台梭利觉得投缘：墨索里尼说“无知的父母”是政权优生计划的“主要障碍”，又说好的教育能改良人种、增进“血统的道德与身体健康”（见 Quarfood 2022: 203, 208）[^quarfood-2022]。尽管如此，蒙台梭利坚持和平、坚持世界主义、尤其坚持扩展儿童自由乃至所有人的自由，这使她从根本上与法西斯意识形态格格不入。在文盲仍是意大利大患的年代，双方都看重教育之于人类进步的作用，可根本分歧终究把这层共同兴趣引向了截然相反的方向。
