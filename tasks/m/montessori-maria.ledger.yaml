      Montessori is often seen as part of a broader tradition of progressive or child-centered pedagogy that includes Rousseau, Pestalozzi, and Dewey (see Kilpatrick 1914; Kazepides 1979; Mili 2018; Tonner 2022; Whitescarver & Cossentino 2008; but cf. L’Ecuyer 2023)[^kazepides-1979][^kilpatrick-1914][^l’ecuyer-2023][^mili-2018][^tonner-2022][^whitescarver-2008], and she has also been described as a constructivist about education and child development (see Ültanir 2012)[^ültanir-2012]. During her own life, her pedagogy often suffered the twin fates of being condemned both as overly liberal for giving children too much freedom and also overly constrained or disciplined (see discussion in Quarfood 2022: 76–85)[^quarfood-2022].
    step1: |-
      蒙台梭利常被视为一个更广的传统——进步主义或以儿童为中心的教育学——的一部分，该传统包括卢梭、裴斯泰洛齐与杜威（见 Kilpatrick 1914; Kazepides 1979; Mili 2018; Tonner 2022; Whitescarver & Cossentino 2008；但参看 L’Ecuyer 2023）[^kazepides-1979][^kilpatrick-1914][^l’ecuyer-2023][^mili-2018][^tonner-2022][^whitescarver-2008]；她也曾被描述为在教育与儿童发展上的建构主义者（见 Ültanir 2012）[^ültanir-2012]。在她生前，其教育学常遭双重命运：既被斥为过分自由、给孩子太多自由，又被斥为过分约束、纪律过严（讨论见 Quarfood 2022: 76–85）[^quarfood-2022]。
    step2: |-
      人们常把蒙台梭利归入一个更大的传统——进步主义或以儿童为中心的教育学，成员有卢梭、裴斯泰洛齐、杜威（见 Kilpatrick 1914; Kazepides 1979; Mili 2018; Tonner 2022; Whitescarver & Cossentino 2008；但参看 L’Ecuyer 2023）[^kazepides-1979][^kilpatrick-1914][^l’ecuyer-2023][^mili-2018][^tonner-2022][^whitescarver-2008]；也有人把她描述成教育与儿童发展上的建构主义者（见 Ültanir 2012）[^ültanir-2012]。她生前，其教育学常两面挨骂：一面被指太自由、给孩子放得太松，一面又被指太束缚、管得太严（讨论见 Quarfood 2022: 76–85）[^quarfood-2022]。
