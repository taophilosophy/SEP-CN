      In specifically promoting scientific education in areas related to motherhood and sexuality, Montessori advocated a kind of “maternal” feminism, consistent with an overall trend within Italian feminism wherein “women were encouraged to fight for their rights without relinquishing the putatively defining traits of their gender, especially their reproductive functions” (Moretti 2021: 36)[^moretti-2021], and also influenced by Ellen Key’s feminist emphasis on the value of maternal love and the tensions between maternity and freedom (see Key 1909; Pironi 2010)[^key-1909][^pironi-2010]. Montessori warns that women ignorant of science lack both knowledge and power and can be “made the instrument for the birth of weak [and] diseased children” (1910 [1913: 473]). Conversely, as early as 1902, Montessori said,
    step1: |-
      在专门推动与母职和性有关的领域的科学教育时，蒙台梭利倡导一种“母性的”女性主义；这既符合意大利女性主义的一个总体趋势——“鼓励女性为权利而斗争，同时不放弃其性别被认定的界定性特征，尤其是生殖功能”（Moretti 2021: 36）[^moretti-2021]，也受 Ellen Key 女性主义的影响：后者强调母爱的价值以及母职与自由之间的张力（见 Key 1909；Pironi 2010）[^key-1909][^pironi-2010]。蒙台梭利警告说，不懂科学的女性既缺少知识也缺少力量，可能“成为生下虚弱[和]患病孩子的工具”（1910 [1913: 473]）。反过来，早在 1902 年，蒙台梭利就说：
    step2: |-
      在专门推动与母职、性相关的科学教育时，蒙台梭利倡导一种“母性的”女性主义；这既符合意大利女性主义的总体趋势——“鼓励女性为权利而斗争，同时不放弃其性别被认定的界定性特征，尤其是生殖功能”（Moretti 2021: 36）[^moretti-2021]，也受 Ellen Key 女性主义的影响：后者强调母爱的价值，以及母职与自由之间的张力（见 Key 1909；Pironi 2010）[^key-1909][^pironi-2010]。蒙台梭利警告说，不懂科学的女性既缺知识也缺力量，可能“成为生下虚弱[和]患病孩子的工具”（1910 [1913: 473]）。反过来，早在 1902 年她就说过：
