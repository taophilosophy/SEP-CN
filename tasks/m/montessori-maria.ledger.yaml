      ### 5.3 Embodied Ethics
    step1: TBD
    step2: TBD
  - id: 116
    kind: body
    source: |-
      One relatively unique feature of Montessori’s moral theory is her emphasis on the *embodied* nature of ethical life. Her pedagogical concerns and embodied notion of cognition included an embodied approach to moral virtue. To even have a “will” at all, “some mastery of the body is also necessary”, and “Voluntary action … increases in degree as its dependent muscles perfect themselves and so achieve the necessary conditions for seconding its efforts” (9:137, 140).
    step1: TBD
    step2: TBD
  - id: 117
    kind: body
    source: |-
      Montessorian virtues are thus embodied virtues. “Character formation” is like learning the piano (17:236–7) and requires that one “make a selection among the muscular coordinations of which he is capable, persist in them, and thus begin to make such coordinations permanent” (9:129). Likewise with respect and solidarity, “When [one] begins to respect the work of others”, one must be able to “walk about without knocking against his companions, without stamping on their feet, without overturning the table” (9:129–30; cf. 17:139). A child who must “wait for [a work material] to be released … every hour of the day for years … respecting others and … waiting one’s turn”, learns bodily practices of mutual respect, such as standing, diverting attention to avoid interruption, speaking softly if necessary to get attention, and lifting the replaced material with care. Eventually, embodied ethical practices “become a habitual part of life” (1:202). Moreover, concrete bodily movements constitute forms of “grace and courtesy”, “exactitude and grace of action” that is a kind of “will-power” (see Bettman 2003; Montessori 1912: 84, 353, 365–66; cf. 17:139)[^montessori-1912]. This emphasis on embodied grace and courtesy adds important embodied dimensions to contemporary discussions of the role of politeness in moral life (e.g., Buss 1999)[^buss-1999].
    step1: TBD
    step2: TBD
