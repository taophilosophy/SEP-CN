      ## 6. Feminism
    step1: TBD
    step2: TBD
  - id: 119
    kind: body
    source: |-
      Montessori was a feminist before becoming a pedagogue and before starting formal study in philosophy. From her childhood, she broke barriers for women in Italy, such as by attending a science and engineering school traditionally reserved for male students and then becoming one of the first women to attend (and graduate from) medical school (see Kramer 1976: 32–51; Babini & Lama 2000: 31–43)[^babini-2000][^babini-2000-2][^kramer-1976]. She represented Italy at major international women’s congresses in 1896 in Berlin, where she argued for equal pay for equal work and represented Italian women’s opposition to colonialism, and then again in 1899 in London (see Kramer 1976: 55; Moretti 2021: 105)[^kramer-1976][^moretti-2021]. As a student and young professor, she supported feminist organizations such as Associazione per la Donna (Association for the Woman) and Pensiero e Azione (Thought and Action), including working with the latter to promote women’s suffrage (see Moretti 2021: 34–38, 104; Babini & Lama 2000: 164–81, 231–37; Babini 2023: 23)[^babini-2000][^babini-2023][^babini-2000-2][^moretti-2021]. We could even
    step1: TBD
    step2: TBD
  - id: 120
    kind: body
    source: |-
      > go so far as to assert that feminism, understood in the broadest sense as a concern with the condition of women in social, political, and even private political life, was the guiding thread of the intellectual and scientific formation of the young Montessori. (Babini 2023: 21; cf. Babini & Lama 2000)[^babini-2000][^babini-2023][^babini-2000-2].
    step1: TBD
    step2: TBD
  - id: 121
    kind: body
    source: |-
      Although “her involvement with feminist associations ceased to be a major active influence on her, … it would continue to resonate with her work for years to come” (Moretti 2021: 68; see too Babini & Lama 2000: 155–7)[^babini-2000][^babini-2000-2][^moretti-2021].
    step1: TBD
    step2: TBD
  - id: 122
    kind: body
    source: |-
      Montessori’s feminism fits within moderate nineteenth-century Italian “practical feminism” (Babini 2023: 21; cf. Babini & Lama 2000: 85–90; Moretti 2021: 36; Buttafuoco 1988)[^babini-2000][^babini-2023][^babini-2000-2][^buttafuoco-1988][^moretti-2021]. Rather than primarily focusing on political power (e.g., suffrage), practical feminists emphasized women’s capacities to take on active roles within civil society. Montessori’s success as a doctor, researcher, co-director of a major psychiatric institution, and university professor fit well within this practical feminist agenda:
    step1: TBD
    step2: TBD
  - id: 123
    kind: body
    source: |-
      > the particular form of her feminist militancy…was always focused on demonstrating the professional capacities of women in traditionally masculine fields. (Babini & Lama 2000: 240)[^babini-2000][^babini-2000-2]
    step1: TBD
    step2: TBD
  - id: 124
    kind: body
    source: |-
      Relatedly, when she developed her pedagogy, Montessori created classroom contexts in which both boys and girls explored their interests and developed freely in healthy environments that did not distinguish gender roles, and in which children of all genders demonstrated intellectual and moral development beyond expectations of contemporary psychologists and pedagogues (see too Pironi 2010, regarding how this approach was influenced by Ellen Key’s calls for more liberatory education)[^pironi-2010].
    step1: TBD
    step2: TBD
  - id: 125
    kind: body
    source: |-
      At the same time, Montessori took practical feminism in a specifically scientific direction, developing a “scientific feminism”, or “science understood as a form of feminist militancy”, with several dimensions (Babini & Lama 2000: 85 and passim; Babini 2023: 23)[^babini-2000][^babini-2023][^babini-2000-2]. Most obviously, Montessori showed how women contribute to scientific fields, including medicine, anthropology, and properly scientific pedagogy. She also direct tackled misogynistic anthropological theories that purported to show women’s essential/biological inferiority to men. She cites
    step1: TBD
    step2: TBD
  - id: 126
    kind: body
    source: |-
      > a very widespread belief of long standing that is confirmed in the name of science: that woman is biologically, in other words totally, inferior, that the volume of her brain is condemned by nature to an inferiority against which nothing can prevail (1910 [1913: 256])
    step1: TBD
    step2: TBD
  - id: 127
    kind: body
    source: |-
      and, without endorsing phrenological methodology as such, she shows how the best phrenological research available at the time “arrived at an opposite conclusion: namely, that they can demonstrate a greater development of brain in woman” (1910 [1913: 257]). She highlights the “contradiction between existing anthropological and social conditions” (1910 [1913: 258]) and argues for elevating women’s status.
    step1: TBD
    step2: TBD
  - id: 128
    kind: body
    source: |-
      In addition to these scientific contributions, Montessori’s scientific feminism promoted scientific literacy as a means for elevating women’s status in society. Montessori reportedly said, “my wish is for women to fall in love with scientific reasoning” (Kramer 1976: 80)[^kramer-1976] and Babini explains,
    step1: TBD
    step2: TBD
  - id: 129
    kind: body
    source: |-
      > With this unusual but intentional wording Maria Montessori sought to identify rationality itself as a guide to female conduct, even in the most personal and intimate choices, including marriage…The choice of motherhood was thus referred back to a female consciousness “illuminated” by science. (Babini 2023: 22)[^babini-2023]
    step1: TBD
    step2: TBD
  - id: 130
    kind: body
    source: |-
      Montessori hoped to elevate women’s authority in both social life and their own personal lives through equipping them with the scientific fluency by which they could demonstrate rational bases for their claims.
    step1: TBD
    step2: TBD
  - id: 131
    kind: body
    source: |-
      In specifically promoting scientific education in areas related to motherhood and sexuality, Montessori advocated a kind of “maternal” feminism, consistent with an overall trend within Italian feminism wherein “women were encouraged to fight for their rights without relinquishing the putatively defining traits of their gender, especially their reproductive functions” (Moretti 2021: 36)[^moretti-2021], and also influenced by Ellen Key’s feminist emphasis on the value of maternal love and the tensions between maternity and freedom (see Key 1909; Pironi 2010)[^key-1909][^pironi-2010]. Montessori warns that women ignorant of science lack both knowledge and power and can be “made the instrument for the birth of weak [and] diseased children” (1910 [1913: 473]). Conversely, as early as 1902, Montessori said,
    step1: TBD
    step2: TBD
  - id: 132
    kind: body
    source: |-
      > Women’s social victory will be a maternal victory, one destined to ameliorate, to render stronger the human species. [A woman,] after having gone on to conquer social labor, will take a further step: she will conquer her biological labor, which is the true goal of feminism: the victory of her own children. (quoted in Babini 2023: 22)[^babini-2023]
    step1: TBD
    step2: TBD
  - id: 133
    kind: body
    source: |-
      This passage has been “criticized by Italian feminist historians” (see Babini 2023: 22)[^babini-2023], and Montessori’s invocation of broadly eugenic ideas of “weakly, diseased, or degenerate children” (Montessori 1910 [1913: 473])[^montessori-1910] is equally subject to criticism. In promoting this maternal feminism, Montessori also risks “biologism” or “biological determinism”, which “discounts a history of personal, social, and political efforts that aim at affirming women’s diversity” (Moretti 2021: 37; see too Botti 2007: 39–40)[^botti-2007][^moretti-2021]. Consistent with her teleological vision of humanity, Montessori emphasizes women’s role in the development of the human species, though her maternal feminism is not entirely as traditional as it might seem. While not challenging the gender essentialism that links femininity and maternity, not only do her classrooms and pedagogical writings consistently challenge gender stereotypes, but even within her association of women and reproduction, her primary emphasis remains squarely on empowering women over their reproductive capacities. Her “Sexual morality in education”, for example, presented at the National Congress of Italian Women in 1908 (Montessori 1912)[^montessori-1912], sought to empower women within domestic and social life (see Babini & Lama 2000: 240–244)[^babini-2000][^babini-2000-2], and she even condemned marriage as a patriarchal institution in which “the wife is a slave, for she has married in ignorance and has neither…knowledge nor…power” (1910 [1913: 473]).
    step1: TBD
    step2: TBD
  - id: 134
    kind: body
    source: |-
      Montessori’s feminism was also, from the start, a pacifist feminism (see §7). At her first international women’s conference, she combined advocacy for women’s rights with condemnations of colonialism, and her work with Associazione per la Donna starting in 1896 included “launch[ing] a petition against the colonial occupations in East Africa” (Moretti 2021: 104–5)[^moretti-2021]. As Moretti shows,
    step1: TBD
    step2: TBD
  - id: 135
    kind: body
    source: |-
      > these early political efforts [on behalf of women] were intertwined with the educator’s pedagogical work and prompted her to start thinking of an approach to education that could transform children into proponents of peace. (Moretti 2021: 105)[^moretti-2021]
    step1: TBD
    step2: TBD
  - id: 136
    kind: body
    source: |-
      Unsurprisingly, within a maternal feminism oriented towards equipping women to foster the improvement of humanity, Montessori saw peace as one of its greatest fruits:
    step1: TBD
    step2: TBD
  - id: 137
    kind: body
    source: |-
      > As soon as she [woman] becomes a free human being with her own social rights, she will begin to work for peace; she will know how to ignite the divine light among the minds that lose it in selfishness, and instill in hearts the holy love of humanity—which is widespread maternal love in the world. (Montessori 1899 [2019: 7], quoted in Moretti 2021: 34)[^montessori-1899][^moretti-2021]
    step1: TBD
    step2: TBD
  - id: 138
    kind: body
    source: |-
      Before closing this section, it’s worth adding one final contribution of Montessori’s feminism to her broader philosophy. Fundamental to her philosophical methodology is profound awareness of often-invisible oppressions of children, as adults paternalistically care for them in ways that ultimately undermine their dignity and development. In those contexts, she often draws on struggles for women’s rights as analogies for children’s rights.
    step1: TBD
    step2: TBD
  - id: 139
    kind: body
    source: |-
      > Some time ago, a very important question arose—that of the role of women…The same kinds of things were said at that time about women as are now being said about children and their role in society. In those days, too, it seemed absurd to speak of women as forgotten human beings. “We’ve neglected women, you say? How can that be, when we do everything possible for them, when we love them so much, when we protect them and are ready to die for them, when we work all our lives for them”. (10:45)
    step1: TBD
    step2: TBD
  - id: 140
