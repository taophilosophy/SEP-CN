      Beyond this theoretical contribution to virtue epistemological theory, Montessori has important insights that deepen our understanding of particular traits often considered intellectual virtues. Patrick Frierson (2016b; 2020) has discussed Montessori’s distinctive accounts of epistemic character, intellectual love, sensory acuity, intellectual patience and quickness, intellectual humility, and intellectual courage. Moreover, consistent with Montessori’s emphasis on embodied cognition, she also sees physical dexterity or excellence in intelligent movement as a kind of intellectual virtue (see, e.g., 1:123–140). Beyond those virtues, Montessori’s emphasis on “deeply engaged states of concentration”, as well as her specific pedagogical practices, enhance what has come to be known as flow (Rathunde 2023: 271; see too Rathunde 2001; Rathunde & Csikszentmihalyi 2005)[^rathunde-2001][^rathunde-2023][^rathunde-2005]. Montessorian freedom and flexibility can also contribute to creativity (Fleming et al. 2019; Lillard 2005: 163–4)[^fleming-2019][^lillard-2005]. Angeline Lillard provided, and regularly updates, the most comprehensive discussion of Montessori’s method in relation to contemporary psychological appraisals of development and proper functioning (see Lillard 2005 and subsequent editions)[^lillard-2005].
    step1: |-
      除了这一对德性认识论的理论贡献，蒙台梭利对一些常被视为理智德性的具体品质也有重要洞见。Patrick Frierson（2016b；2020）讨论了蒙台梭利对认识品格、理智之爱、感官敏锐、理智耐心与敏捷、理智谦逊、理智勇气等的独特说明。此外，与她强调具身认知相一致，她也把身体的灵巧或智能运动中的卓越视为一种理智德性（例如见 1:123–140）。除了这些德性，蒙台梭利对“深度投入的专注状态”的强调，以及她具体的教学实践，都增益于后来所谓的心流（Rathunde 2023: 271；另见 Rathunde 2001；Rathunde & Csikszentmihalyi 2005）[^rathunde-2001][^rathunde-2023][^rathunde-2005]。蒙台梭利式的自由与灵活也能促进创造力（Fleming et al. 2019；Lillard 2005: 163–4）[^fleming-2019][^lillard-2005]。Angeline Lillard 就蒙台梭利方法与当代心理学对发展与正常功能的评价之间的关系，提供了最全面的讨论并持续更新（见 Lillard 2005 及后续版本）[^lillard-2005]。
    step2: |-
      除这一对德性认识论的理论贡献外，蒙台梭利对一些常被视为理智德性的具体品质也有重要洞见。Patrick Frierson（2016b；2020）讨论了她对认识品格、理智之爱、感官敏锐、理智耐心与敏捷、理智谦逊、理智勇气等的独特说明。此外，与其具身认知的强调相一致，她也把身体的灵巧或智能运动中的卓越视为一种理智德性（例如见 1:123–140）。除这些德性之外，蒙台梭利对“深度投入的专注状态”的强调，加上她具体的教学实践，增益于后来所谓的心流（Rathunde 2023: 271；另见 Rathunde 2001；Rathunde & Csikszentmihalyi 2005）[^rathunde-2001][^rathunde-2023][^rathunde-2005]。蒙台梭利式的自由与灵活也能促进创造力（Fleming et al. 2019；Lillard 2005: 163–4）[^fleming-2019][^lillard-2005]。Angeline Lillard 就蒙台梭利方法与当代心理学对发展及正常功能评价的关系提供了最全面的讨论，并持续更新（见 Lillard 2005 及后续版本）[^lillard-2005]。
