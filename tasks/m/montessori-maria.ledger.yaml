      Her pedagogical work gave rise to several national and international organizations that continue her legacy in both theory and practice. The Association Montessori Internationale (AMI), which was established by Montessori in 1929 and is currently headquartered in Amsterdam, maintains a publication—*The AMI Journal*—and archives and works with the Montessori-Pierson Publishing Company (a publishing company established by Montessori’s heirs) to put out editions of Montessori’s works and lectures in multiple languages, sometimes in collaboration with other publishers. The American Montessori Society (AMS) is the largest professional association of Montessorians in the United States and has its own trade publication—*Montessori Life*—and sponsors an academic journal: *The Journal of Montessori Research*. Other Montessori-related organizations abound, many with their own publications. Increasingly, Montessorians have sought to bring Montessori’s ideas into richer conversation with other educational, psychological, and philosophical ideas. Within psychology, Angeline Lillard’s research program examines Montessori in the light of contemporary psychology (see Lillard 2005 and subsequent editions and links at [Montessori-Science.org](https://www.montessori-science.org/)). *The Bloomsbury Montessori Handbook* (Murray et al. 2023)[^murray-2023] pulls together recent research on Montessori from a variety of fields (including philosophy).
