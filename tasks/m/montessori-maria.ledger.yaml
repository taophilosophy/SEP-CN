      Montessori does have a place for more substantive forms of social cooperation, however. She calls the third element of ethical life “social solidarity” or “society by cohesion” (1:237, 17:233). Consistent with broadly Hegelian notions of individual in society (cf. Gimbel & Emerson 2009)[^gimbel-2009], she advocates a social unity that goes beyond mere respect, one within which different individuals unite into a shared will or shared agent. There are other elements of a fully developed Montessorian ethic, including the role of obedience and hierarchy in social organization (see 1:229–38, 12:8). Character, respect, and solidarity, however, form the most basic pillars of human flourishing and ethical life.
    step1: |-
      不过，蒙台梭利确实为更实质的社会合作形式留有位置。她把伦理生活的第三个元素称为“社会团结”或“凝聚而成的社会”（1:237, 17:233）。与大体的黑格尔式社会中的个体观念一致（参见 Gimbel & Emerson 2009）[^gimbel-2009]，她主张一种超出单纯尊重的社会统一：在其中，不同个体联合成一个共同意志或共同行动者。发展成熟的蒙台梭利伦理还有别的元素，包括服从与等级制在社会组织中的作用（见 1:229–38, 12:8）。但品格、尊重与团结构成人类繁荣与伦理生活最基础的支柱。
    step2: |-
      不过，蒙台梭利确实为更实质的社会合作留有位置。她把伦理生活的第三个元素称为“社会团结”或“凝聚而成的社会”（1:237, 17:233）。与大体的黑格尔式社会中个体观念相合（参见 Gimbel & Emerson 2009）[^gimbel-2009]，她主张一种超出单纯尊重的社会统一：不同个体在其中联合成一个共同意志或共同行动者。发展成熟的蒙台梭利伦理还有别的元素，包括服从与等级制在社会组织中的作用（见 1:229–38, 12:8）。但品格、尊重与团结，构成人类繁荣与伦理生活最基础的支柱。
