      ## 7. Peace, Education, and the Rights of the Child
    step1: TBD
    step2: TBD
  - id: 144
    kind: body
    source: |-
      One of Montessori’s most oft-quoted claims is that “establishing peace is the work of education” (10: 21), and one of the most important recent developments in Montessori scholarship is Erica Moretti’s *The Best Weapon for Peace* (2021), in which she shows in detail the extent to which Montessori’s pedagogy was developed with peace-work in mind. (See too Parkin 2024, who defends the view that Montessori is what he calls an “educational pacifist”.)[^parkin-2024] For Montessori, the “goal was peace; teaching was the method” (Moretti 2021: 4)[^moretti-2021], and this interest in peace extended from feminist struggles that preceded her work in education through nominations of Montessori for the Nobel Peace Prize near the end of her life. Throughout,
    step1: TBD
    step2: TBD
  - id: 145
    kind: body
    source: |-
      > the educator repeatedly reconceived her theory of peace, with each revision expanding to include a larger set of relationships and agents. Her vision evolved in concentric circles of influence, first as a form of harmony between the child’s own body and immediate environment, then with the family, and then further outward with the nation-state and the world. (Moretti 2021: 12)[^moretti-2021]
    step1: TBD
    step2: TBD
  - id: 146
    kind: body
    source: |-
      Many of Montessori’s writings on peace are held in archives with curated access, particularly in the Association Montessori Internationale archives in Amsterdam; the best published collection of philosophical works on peace is her *Education and Peace* (Montessori MS 10). This work lays out a detailed diagnosis of the state of the world when the speeches collected there were delivered (1932–9, cf. Van Hook 2023)[^van-2023]. There Montessori highlights the fundamental interconnectedness of human beings and the irrationality of war, emphasizing, for example, that “The impoverishment of one nation does not make another nation richer” and pointing out how
    step1: TBD
    step2: TBD
  - id: 147
    kind: body
    source: |-
      > The [first world] war in Europe has already shown that the victors have not gained new energies and benefits from their victory, as victors did in the past. An entirely new phenomenon has occurred: defeated peoples have become a danger, a burden, an obstacle. The victors must aid them and help them get back on their feet. (10:22)
    step1: TBD
    step2: TBD
  - id: 148
    kind: body
    source: |-
      She discusses how mass communication, rapid transportation, and economic interdependence have transformed human beings into a “single organism, one nation”, though this unity is something of which “we are not yet fully aware” (10:22–3).[^note-5]
    step1: TBD
    step2: TBD
  - id: 149
    kind: body
    source: |-
      Into this context, Montessori offers education as a means to peace. Contrary to much contemporary “peace education”, however, which is often “content-oriented” (Moretti 2021: 5)[^moretti-2021], she argues that a system of education within which children are able to work together freely is the only way to promote a *lasting* human peace.
    step1: TBD
    step2: TBD
  - id: 150
    kind: body
    source: |-
      > Achieving peace was a twofold process: first, the child would be called to develop an internal peace, a harmony with the environment, and a moral sense to guide her acts. Competition, injustice, and abuse of power found no place in a Montessori classroom. Thanks to an innovative pedagogy, the child would grow in response to her own bodily and intellectual needs, fulfilling her own potential. Second, having developed into a satisfied adult, she would be gratified by her own work and would be able to find a place within the larger ecology of the world. The resulting adult would have a natural propensity toward peace; she would find joy in her work and in her relationships with people. Montessori’s progressive approach would produce self-determining adults naturally opposed to war. (Moretti 2021: 4)[^moretti-2021]
    step1: TBD
    step2: TBD
  - id: 151
    kind: body
    source: |-
      From the start, Montessori’s pedagogical approach was oriented towards avoiding the oppressions and influences that steer children towards fearful, egotistic, and violent ways of relating towards their world. In conditions of freedom, and particularly in conditions where children engage with their environment in accordance with their guiding instincts, but also where ordinary social problems arise amongst those free children, the character, respect, and solidarity that naturally arise create a solid foundation on which peaceful cooperation among adults can become a reality. Just as Montessorian classrooms are spaces wherein conflict does not help children freely work on materials that satisfy their needs, so too the world is a place within which conflict does not reward the victors. What Montessori identified as necessary was not didactic exhortations or instruction related to peace, but the creation of prepared environments wherein peaceful freedom became a lived reality incorporated into the psyches of future adults.
    step1: TBD
    step2: TBD
  - id: 152
    kind: body
    source: |-
      Beyond that pedagogical project, Montessori also advocated for specific humanitarian and political changes, primarily through emerging international organizations. Two of the most important such efforts were the “White Cross” and the “Social Party of the Child”. The inspiration for the White Cross came from Montessori’s efforts, especially during the First World War, to provide safe educational environments for child victims of war. She worked closely with American philanthropist and educator Mary Rebecca Cromwell, who set up Montessori-inspired schools for refugees from Belgium and northern France. From this work came the idea for the White Cross.
    step1: TBD
    step2: TBD
  - id: 153
    kind: body
    source: |-
      > Whereas before World War I she had envisioned educating children to peace through a prepared environment and scientifically trained teachers, she now observed the traumatizing effects of war and realized that her approach—and even education *per se*—was not enough. The war had such a profound and long-lasting impact on the child’s psyche that new practices were needed in order to restore his mental and physical capacity and bring him back to being a collaborative individual, able to live harmoniously within society. (Moretti 2021: 70)[^moretti-2021]
    step1: TBD
    step2: TBD
  - id: 154
    kind: body
    source: |-
      The fundamental idea was to create an organization that would meet the spiritual and intellectual needs of victims of war, especially children, in much the way that the Red Cross worked to meet their physical, medical needs. (White in this context refers to the color of the nerves, in contrast to the red color of blood.)
    step1: TBD
    step2: TBD
  - id: 155
    kind: body
    source: |-
      As noted in §6, Montessori’s feminist attention to the paternalistic treatment and denial of rights of women made her attuned to similar violations of children’s dignity. Just as she fought for women’s suffrage early in her life, so later she advocated the creation of a “Ministry of the Child” and a “Social Party of the Child”, going so far as to refer to the need for “a second French Revolution aimed at promoting the rights of children” (Moretti 2021: 173)[^moretti-2021]. Montessori went as far as “drafting the statutes of the Social Party of the Child”, in which she argued that “far from needing to be sheltered from the ills of the adult world, children should in fact take an active role in political and civic debates” (Moretti 2021: 174–5)[^moretti-2021], and she established the Social Party of the Child as an independent organization to “ensure the moral, social and economical rights of all that part of humanity which is in the process of development” (Montessori, October 1937 AMI circular letter, available through the AMI archives in Amsterdam).
    step1: TBD
    step2: TBD
