      Montessori’s commitment to children’s freedom gave rise to other important features of her pedagogy. Through observing children, she identified various “sensitive periods” during which children are particularly prone to developing various capacities because of special interest in work related to those developments. Given this “developmentalist” view of learning (see Colgan 2016: 132)[^colgan-2016], many of Montessori’s central philosophical insights—e.g., about ethical life—play out in different ways at different stages. For example, as we will see in §5.1, Montessori rejects the view that agency requires adult capacities for reflection or deliberation, but she does not deny that those capacities transform the nature of human ethics. One of Montessori’s more controversial educational claims relates to the role of fantasy in children’s education: “for children under age 6, Montessori came to believe that fantasy had no place” (Lillard 2005: 183)[^lillard-2005], and even in elementary years, when the “imagination” comes to play an important role in development, such imaginative exploration must be grounded in truth (see Lillard 2005: 186)[^lillard-2005]. For discussion of imagination in her pedagogy, see MS 1:161, 9:179–202; Lillard 2005: 183–90; Lillard: 2013.
    step1: |-
      蒙台梭利对儿童自由的坚持，催生了其教育学的其他重要特征。通过观察儿童，她识别出各种“敏感期”：在此期间，儿童因对相关工作有特殊兴趣，特别容易发展出相应能力。鉴于这种“发展主义”的学习观（见 Colgan 2016: 132）[^colgan-2016]，蒙台梭利的许多核心哲学洞见——如关于伦理生活的洞见——在不同阶段以不同方式展开。例如，正如我们将在 §5.1 所见，蒙台梭利拒斥“能动性需要成人式的反思或慎思能力”这一观点，但她并不否认这些能力会改变人类伦理的本性。蒙台梭利较有争议的一项教育主张，关乎幻想在儿童教育中的作用：“蒙台梭利后来认为，对六岁以下儿童来说，幻想没有位置”（Lillard 2005: 183）[^lillard-2005]；即便在小学阶段，当“想象”开始在发展中扮演重要角色时，这种想象性探索也必须奠基于真理（见 Lillard 2005: 186）[^lillard-2005]。关于其教育学中想象的讨论，见 MS 1:161, 9:179–202; Lillard 2005: 183–90; Lillard: 2013。
