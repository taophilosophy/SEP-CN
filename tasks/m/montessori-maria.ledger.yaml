      Montessori’s most significant impacts over the past hundred years have been the tens of thousands of schools throughout the world in which children develop in classrooms overseen by teachers trained in her pedagogical philosophy, methods, and materials. In addition, many of Montessori’s ideas about children and childhood—such as “sensitive periods” in child development, the need for environments designed and sized for children, children’s rights, and freedom in education—have all become widespread. Some of Montessori’s most important political ideals, such as her advocacy for a Social Party of the Child or a White Cross that would deal with psychological trauma in wartime, have yet to materialize. But her overall role in making the twentieth century the “Century of the Child” (see Key 1909)[^key-1909] was substantial and lasting.
