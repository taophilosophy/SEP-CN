      Over the course of her life, in addition to extensive lecture courses (for many of which we have transcripts) and concrete pedagogical materials, Maria Montessori wrote nearly two dozen books and hundreds of essays and articles. During her early years as a student and shortly thereafter, she actively wrote scientific articles and papers such as “Sul significato dei cristalli del Leyden nell’asma bronchiale” (“On the significance of Leyden crystals in bronchial asthma”; Montessori 1896)[^montessori-1896], “Sulle cosidette allucinazioni antagonistiche” (“On supposed antagonistic hallucinations”; Montessori & De Sanctis 1897)[^montessori-1897] or “La teoria lombrosiana e l’educazione morale” (“The Lombrosian theory and moral education”; Montessori 1903)[^montessori-1903]. Throughout her life, too, she wrote short articles on various topics ranging from specific pedagogical practices to broader cultural critique.
    step1: |-
      一生之中，除了大量讲座（其中许多留有记录稿）与具体的教具之外，玛丽亚·蒙台梭利写了近二十部书和数百篇文章与论文。学生时代及此后不久，她积极撰写科学论文，如《论莱顿晶体在支气管哮喘中的意义》（Montessori 1896）[^montessori-1896]、《论所谓对抗性幻觉》（Montessori & De Sanctis 1897）[^montessori-1897]、《龙勃罗梭理论与道德教育》（Montessori 1903）[^montessori-1903]。终其一生，她也写短文，题目从具体的教学方法直到更广的文化批评。
