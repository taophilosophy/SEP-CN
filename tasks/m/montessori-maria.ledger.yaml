      Montessori refers to free children in environments conducive to freedom as “normalized” (see 1:202, 22:133), by which she does not mean that they are brought to conform to some pre-given set of norms or that they come to be identical in some way, but that they undergo “a psychological recovery, a return to *normal conditions*” (22:134). Whereas children subject to discipline, oppression, or deprivation have to repress natural expressions of their agency, children in conditions of freedom can be fully human and thereby flourish as human beings. This process provides Montessori with a naturalistic means for identifying conditions of human excellence (see Colgan 2016: 136–7)[^colgan-2016]. Three key pillars are central to Montessorian ethical life: character, respect, and solidarity.
    step1: |-
      蒙台梭利把处于有益自由之环境中的自由儿童称为“正常化的”（见 1:202, 22:133）；她并不是说这些儿童被带去符合某种预先给定的规范集，也不是说他们在某种意义上变得彼此同一，而是说他们经历了一种“心理的恢复，向*正常状态的*回归”（22:134）。遭受管束、压迫或剥夺的儿童不得不压抑其能动性的自然表达；处于自由条件中的儿童则可以完全成为人，并作为人繁荣发展。这一过程为蒙台梭利提供了一种自然主义手段，用以识别人类卓越的条件（见 Colgan 2016: 136–7）[^colgan-2016]。蒙台梭利式伦理生活的三个关键支柱是：品格、尊重与团结。
