      Her broadly pragmatist epistemology is “hierarchical” in that “perceptual knowledge (or lower-order concepts) are the building blocks of higher-order concepts” (Colgan 2016: 128, see too Lillard 2005: 21)[^colgan-2016][^lillard-2005]. Her epistemology is hierarchical or empiricist in that she identified the senses as “the foundation of the entire intellectual organism” such that “there can be neither ideas nor imagination, nor any intellectual construction, if we do not presuppose an activity of the senses” (18:260, cf. 17:193–4). While Montessori shares with empiricists such as John Locke and David Hume a conviction that all ideas have their origin in the senses, however, she differs from them in (at least) four important ways.
    step1: |-
      她大体属于实用主义的认识论是“分层的”：“知觉知识（或低阶概念）是高阶概念的构件”（Colgan 2016: 128，另见 Lillard 2005: 21）[^colgan-2016][^lillard-2005]。她的认识论之所以是分层且经验主义的，是因为她把感官确定为“整个理智有机体的基础”，以致“如果我们不预设感官的活动，就不会有观念，不会有想象，也不会有任何理智的构造”（18:260，参见 17:193–4）。不过，尽管蒙台梭利与 John Locke、David Hume 等经验主义者同样相信一切观念都源于感官，她与他们至少在四个重要方面有所不同。
