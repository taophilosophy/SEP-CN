      In addition to published books, many of Montessori’s smaller speeches and articles are important for understanding her philosophy. Some of these lectures have been collected and published in their entirety; her *1913 Rome Lectures* (MS 28) and *1946 London Lectures* (MS 27) are particularly valuable not only for the explicit discussion of philosophical themes such as freedom, morality, and the nature of the world, but also because they span virtually her entire career, making it easy to see development in her ideas. Articles such as “Norme per una classificazione dei deficienti in rapporto ai metodi speciali di educazione” (Montessori 1902)[^montessori-1902] or “La teoria lombrosiana e l’educazione morale” (Montessori 1903)[^montessori-1903] help situate her philosophical ideas in the context of intellectual developments in early twentieth-century Italy. “The Unconscious in History” (Montessori 1948 [1973])[^montessori-1948] and “Cosmic Education Lectures” (Montessori 1935–6 [2007–9])[^montessori-1935] provide crucial insights into her metaphysics. Among the most important set of writings are those collected in the volume *Education and Peace* (MS 10). These discuss her vision of peace and the role of education in fostering peace (see Moretti 2021, and §7 below)[^moretti-2021] and also provide insight into her political philosophy more broadly and her insightful philosophy of technology.
    step1: |-
      除出版成书外，蒙台梭利的许多短篇演讲与文章对理解其哲学也很重要。有些演讲已被结集全文出版；她的《1913 年罗马讲座》（MS 28）与《1946 年伦敦讲座》（MS 27）尤其宝贵，不仅因为明确讨论了自由、道德与世界本性等哲学主题，还因为它们几乎贯穿她的全部职业生涯，便于看出其思想的演变。《为特殊教育方法对缺陷者进行分类的规范》（Montessori 1902）[^montessori-1902]、《龙勃罗梭理论与道德教育》（Montessori 1903）[^montessori-1903] 等文章，有助于把她哲学思想的语境放进二十世纪初意大利思想界的动向。《历史中的无意识》（Montessori 1948 [1973]）[^montessori-1948] 与《宇宙教育讲座》（Montessori 1935–6 [2007–9]）[^montessori-1935] 则提供了洞悉其形而上学的关键。最重要的文集当属《教育与和平》（MS 10）：其中讨论了她对和平的构想以及教育在培育和平中的作用（见 Moretti 2021，及下文 §7）[^moretti-2021]，也让我们看见她更广的政治哲学，以及她颇有见地的技术哲学。
    step2: |-
      除成书外，蒙台梭利的许多短演讲、短文章对理解其哲学同样要紧。有些讲座已全文结集出版：《1913 年罗马讲座》（MS 28）与《1946 年伦敦讲座》（MS 27）尤其宝贵——不仅明确讨论自由、道德、世界本性这类哲学主题，还几乎贯穿她整个职业生涯，看思想演变极方便。《为特殊教育方法对缺陷者进行分类的规范》（Montessori 1902）[^montessori-1902]、《龙勃罗梭理论与道德教育》（Montessori 1903）[^montessori-1903] 等文，能把她放进二十世纪初意大利思想界的语境。《历史中的无意识》（Montessori 1948 [1973]）[^montessori-1948] 与《宇宙教育讲座》（Montessori 1935–6 [2007–9]）[^montessori-1935] 则是洞悉其形而上学的钥匙。最重要的文集当数《教育与和平》（MS 10）：既谈她对和平的构想与教育培育和平的作用（见 Moretti 2021，及下文 §7）[^moretti-2021]，也照出她更广的政治哲学，以及她颇有见地的技术哲学。
