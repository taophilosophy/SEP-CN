      ## 4. Epistemology
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      ### 4.1 Interested Empiricism
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      As Andrew Colgan notes,
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      > Montessori’s Method presents the conditions of an epistemologically-sensitive education, a philosophy contingent on epistemological questions of the validity of the senses and induction. (2016: 127)
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      Her broadly pragmatist epistemology is “hierarchical” in that “perceptual knowledge (or lower-order concepts) are the building blocks of higher-order concepts” (Colgan 2016: 128, see too Lillard 2005: 21)[^colgan-2016][^lillard-2005]. Her epistemology is hierarchical or empiricist in that she identified the senses as “the foundation of the entire intellectual organism” such that “there can be neither ideas nor imagination, nor any intellectual construction, if we do not presuppose an activity of the senses” (18:260, cf. 17:193–4). While Montessori shares with empiricists such as John Locke and David Hume a conviction that all ideas have their origin in the senses, however, she differs from them in (at least) four important ways.
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
    source: |-
      First, Montessori’s empiricism is interested, in the sense that sensory processes are volitional:
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      > In the world around us, we do not see everything … but only some things that suit us … We do not concentrate our attention haphazardly, … but according to an inner drive. (18:185)
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      Consistent with her enactive view of the mind (§3.3), perception is a modification of a dynamic, embodied system actively engaged with a world.
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      Second, and following from the way senses are interested, Montessori rejects the broadly Lockean notion that senses are passive. Partly because of her conviction that life is essentially active, but primarily through her work actually educating the senses of young children, she recognizes even raw sensory experience as requiring an “attention which…is not passive, but corresponds to an activity” because
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      > stimuli will appeal in vain to the senses, if the internal cooperation of attention be lacking … It is not enough that an object should be before our eyes to make us see it; it is necessary that we should fix our attention upon it; an internal process, preparing us to receive the impression of the stimulus, is essential. (15:229; 9:172)
    step1: TBD
    step2: TBD
  - id: 92
    kind: body
    source: |-
      An infant “sees only a part, determined by his feelings and interests” (22:49), and even among mature epistemic agents, “untrained persons” cannot see “stellar phenomena by means of the telescope or the details of a cell under the microscope” (9:99). As Colgan puts it, in this “active consciousness view”,
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      > the child must begin to discriminate the sensations and link them to their sources by way of acting in the world and awaiting feedback (from sensations to perceptions). (2016, 134n18, 131)
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      Third, Montessori sees sensory awareness as *trainable* and *cultivatable*. Unlike Locke, for whom sensory distinctions are accomplished “without … labour; but at first view, by [a] natural power” (Locke 1689: IV.i.4 [1975: 526])[^locke-1689], Montessori observed that even the most basic sensory discrimination requires, for its development, cultivation through “sensory gymnastics” or “sensory exercises” (Montessori 1909 [1912: 168–76])[^montessori-1909]. Her more thoroughgoing empiricism provides an answer to David Hume’s famous *missing shade of blue*, which Hume raises as a possible counter-example to strict empiricism. Hume suggests that if one experienced a range of colors “except one particular shade of blue” (1748: §2.8), one would be able imagine this shade and thereby form an idea one had never experienced. Montessori, however, found that discrimination among shades is not merely a passive capacity but an acquired skill. She developed a series of color tablets of different shades on which students train their sensory discrimination through a series of increasingly difficult distinctions. As it turns out, it is quite difficult even to properly distinguish shades of colors physically present to one’s senses; even “many…adults” are often unable to “distinguish shades of color” (17:195). To develop the ability to *see* colors, much less to imagine them, requires not only experience, but sensory exercises in which one “keep their attention fixed in these exercises in such a way that they will continue the exercises … until they have developed the ability to distinguish the shades” (18:160).
    step1: TBD
    step2: TBD
  - id: 95
    kind: body
    source: |-
      Fourth and finally, Montessori’s empiricist epistemology holds open substantial space for a broadly empiricist account of unconscious intelligence. Not only are many of the interests that guide attention unconscious, but “every human being does his most intelligent work in the subconscious, where psychic complexes … organize themselves to carry out work which we are unable to do consciously” (6:13). Given the broadly empiricist notion that cognitive activity consists largely of “associative or reproductive activities” (9:147; see Hume 1740 [1978: 12–13])[^hume-1740], and given a philosophy of mind within which *conscious* ideas and beliefs are just forms of unconscious “Mneme”, Montessori can extend “what used to be called the Association of Ideas” to the association of what Montessori calls “engrams” (borrowed from Richard Semon) and describes as unconscious “traces of [experiences] left behind in the mneme” which traces “make a mind powerful” when “sub-conscious … association[s] of engrams [that are] spontaneous…organize themselves to carry out work which we are unable to do consciously” (6:11–13).
    step1: TBD
    step2: TBD
  - id: 96
    kind: body
    source: |-
      Overall, then, Montessori develops a distinctive empiricist epistemology, informed by her pedagogical naturalism. The senses are the foundation of intelligence, knowledge, and understanding, and further developments occur by means of principles of association amongst ideas formed in the light of experience. (For more specifically on concept development, see Colgan 2016: 131–4. For a critique of her epistemology for not taking sufficiently seriously the Bergsonian idea of an innate human “tendency to relate”, see Hunt 1912: 19–20; and for critique of her sensory gymnastics as “based on an outworn and cast-off psychological theory”, see Kilpatrick 1914: 42–62). Her view is empiricist, though she focuses more on the cultivation of the senses as elements in an embodied cognitive system than on sense data as brute input. Moreover, her treatment of senses as active, interest-governed, and cultivatable capacities, and her emphasis on unconscious processing, distinguish her empiricism from that of philosophical predecessors like Locke and Hume.
    step1: TBD
    step2: TBD
  - id: 97
    kind: body
    source: |-
      ### 4.2 Intellectual Virtues
    step1: TBD
    step2: TBD
  - id: 98
    kind: body
    source: |-
      In the context of her interested empiricism and concern with cognitive *development*, Montessori elaborates a distinctive virtue epistemology. Like virtue reliabilists such as Ernest Sosa (1991; 2007) or John Greco (2002; see too Battaly 2008)[^battaly-2008], Montessori sees basic cognitive faculties as faculties the reliable exercise of which is epistemically excellent, but like virtue responsibilists such as Linda Zagzebski or Jason Baehr (Zagzebski 1996; Baehr 2011; 2016)[^baehr-2011][^zagzebski-1996], she affirms that agents must be able to be responsible for genuine intellectual virtues. She reconciles these views by showing that even apparently basic capacities such as sensation are cultivatable and due to exercises of agency.
    step1: TBD
    step2: TBD
  - id: 99
    kind: body
    source: |-
      Beyond this theoretical contribution to virtue epistemological theory, Montessori has important insights that deepen our understanding of particular traits often considered intellectual virtues. Patrick Frierson (2016b; 2020) has discussed Montessori’s distinctive accounts of epistemic character, intellectual love, sensory acuity, intellectual patience and quickness, intellectual humility, and intellectual courage. Moreover, consistent with Montessori’s emphasis on embodied cognition, she also sees physical dexterity or excellence in intelligent movement as a kind of intellectual virtue (see, e.g., 1:123–140). Beyond those virtues, Montessori’s emphasis on “deeply engaged states of concentration”, as well as her specific pedagogical practices, enhance what has come to be known as flow (Rathunde 2023: 271; see too Rathunde 2001; Rathunde & Csikszentmihalyi 2005)[^rathunde-2001][^rathunde-2023][^rathunde-2005]. Montessorian freedom and flexibility can also contribute to creativity (Fleming et al. 2019; Lillard 2005: 163–4)[^fleming-2019][^lillard-2005]. Angeline Lillard provided, and regularly updates, the most comprehensive discussion of Montessori’s method in relation to contemporary psychological appraisals of development and proper functioning (see Lillard 2005 and subsequent editions)[^lillard-2005].
    step1: TBD
    step2: TBD
