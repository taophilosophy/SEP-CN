      理性原则主要适用于可能序列这一想法具有广泛含义，充分讨论需要处理。但由此形成的观点——至少在 Portmore 的表述中——并不在理性上允许所有超义务行为。若你牺牲性命去救另外两人，你在非道德善上的巨大损失意味着，由此得到的较短一生比你不作牺牲的那些人生更不被你全部理由所支持，这使这一生及其中所含的超义务行为都在理性上被禁止。Portmore 接受这一含义；对他而言，只需表明多数超义务行为是理性的。但别人可能拒绝“任何道德上允许或英勇的行为都不理性”这一想法。他的观点同样在理性上禁止许多人生，例如一种圣徒式人生：你计划持续不断地捐助饥荒救济，以致始终只比饥荒受难者略好一点。这一生并不合理平衡，因而不理性；一种只略微偏离所需平衡的、较为温和的利他人生同样如此。许多人又会否认这些道德上可敬的人生违背理性。然而在其他方面，这一观点似乎非常宽松。圣徒式人生作为整体虽被禁止，它的大部分慈善行为至少直到临近终点，似乎都在理性上获许，因为每一个都是某个可能人生的一部分——在那个人生里，它在其他时刻被足够的自利所平衡。但一个作为整体被禁止的人生，怎么能在其大部分长度上只由获许的部分组成？Portmore 的观点还有其他要素，包括一项把他人善采纳为终极而重要目的的不完善义务——别扭的是，这项义务必须在你的实际行为序列中履行，而不只是在某个可能序列中；这些要素引出更多问题。至少他的讨论表明：一个只含要求性理由的观点，要哪怕接近捕捉关于可允许行动的全部可信主张，得有多复杂。
