      The other reply to the objection grants that consequentialist and similar views are demanding but denies that this is a flaw. If we don’t always do what results in the most good, it says, that’s a failing in us rather than in the moral view that requires us to do more; if we think we’re sometimes permitted not to maximize the good, we’re mistaken. In fact, those who urge such a permission may just be trying to justify retaining their privileged social position (Wilson 1993)[^wilson-1993]. A more theoretical version of this reply says, first, that all views recognize a duty to promote the good impartially as at least one element in morality, and then argues that none of the revisions or additions needed to generate a less demanding view can be justified (Kagan 1989)[^kagan-1989]. This assumes, perhaps controversially, that the revisions need further justification and are unacceptable without one.
    step1: |-
      对这一异议的另一种回应承认后果主义及类似观点是苛刻的，但否认这是缺陷。它说，如果我们并不总是做产生最多善的事，那是我们自身的失败，而不是要求我们做得更多的道德观点的失败；如果我们认为自己有时被允许不最大化善，那是我们弄错了。事实上，主张这种允许的人可能只是在试图为自己保留特权社会地位辩护 (Wilson 1993)[^wilson-1993]。这一回应的一种更理论化的版本先说，所有观点都承认不偏不倚促进善的义务至少是道德的一个要素，然后论证：为产生一个不那么苛刻的观点所需的任何修正或添加都无法得到辩护 (Kagan 1989)[^kagan-1989]。这假定——或许有争议——这些修正需要进一步的辩护，而没有辩护便不可接受。
    step2: |-
      另一种回应则承认后果主义及类似观点确实苛刻，但否认这是缺陷：若我们不总是做产生最多善的事，那失败在我们自身，而不在要求我们多做些的道德观点；若我们以为自己有时被允许不最大化善，那是我们想错了。事实上，主张这种允许的人，也许只是在为自己保留特权社会地位找理由 (Wilson 1993)[^wilson-1993]。这一回应还有一个更理论化的版本：它先说所有观点都承认，不偏不倚地促进善至少是道德的一个要素；再论证，为造出一个不那么苛刻的观点所需的任何修正或增补，都得不到辩护 (Kagan 1989)[^kagan-1989]。这假定——或许有争议——那些修正本身需要辩护，没有辩护便不可接受。
