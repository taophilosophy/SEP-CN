      Standard consequentialist moral views, which say the right act is always the one that will result in the most good impartially considered, face two main objections (Kagan 1989)[^kagan-1989]. One says these views permit too much. They can permit and even require acts of killing, lying, or promise-breaking if these will produce even slightly more good than any alternative; thus they can require you to kill one innocent person if that will save two other people’s lives. The other objection says these views demand too much. They say you must always do what will produce the best outcome, regardless of the cost to you. Thus, you must sacrifice your life if that will save just two other people’s lives, nor may you ever just relax or entertain yourself. Spending an evening watching television is wrong if you could do more good volunteering at the food bank, and volunteering at the food bank wrong if you could do even more good delivering medical aid in Africa. On most moral views you have some duty to contribute to charities that benefit people who are worse off than you, such as those suffering from famine. But consequentialism says you must keep giving as long as the benefit to them is greater than the cost to you, which can be until you’ve reduced yourself to their welfare level (Singer 1972: 241)[^singer-1972]. It makes no distinction between what is morally required and what, though admirable and good, is beyond duty or supererogatory. For consequentialism there is no moral time off and no sacrifice you can’t be required to make. Its demands, the second objection says, are unreasonably strong.
    step1: |-
      标准后果主义道德观点认为，正当行为永远是经不偏不倚考虑后能产生最多善的行为；这类观点面临两项主要异议 (Kagan 1989)[^kagan-1989]。一项说这类观点允许得太多。只要能比任何替代方案产生哪怕略多一点的善，它们就可以允许甚至要求杀人、撒谎或背约；因此，如果杀死一个无辜者能救另外两人性命，它们就可以要求你这么做。另一项异议说这类观点要求得太多。它们说你必须永远做能产生最佳结果的事，无论对你代价多大。因此，如果牺牲你的生命只救另外两人性命，你也必须牺牲；你也永远不能只是放松或娱乐。如果能去食物银行做志愿者产生更多善，那么花一晚上看电视就是错的；而如果去非洲提供医疗援助能产生更多善，去食物银行做志愿者也是错的。在多数道德观点中，你有某种义务向那些境况不如你的人——比如遭受饥荒者——捐款。但后果主义说，只要给他们带来的好处大于你的代价，你就必须一直给予，这可能直到你把自己降到他们的福利水平 (Singer 1972: 241)[^singer-1972]。它不区分道德上被要求的东西与令人钦佩、良善却超出义务或超义务的东西。对后果主义而言，没有道德上的休息时间，也没有你不能被要求做出的牺牲。第二项异议说，它的要求强得不合理。
    step2: |-
      标准的后果主义道德观点主张：正当行为永远是经不偏不倚考量后能带来最多善的那一个。这类观点面临两项主要异议 (Kagan 1989)[^kagan-1989]。一说它们允许得太多：只要能比任何替代方案多产生哪怕一丁点善，它们就允许甚至要求杀人、撒谎或背约——若杀死一个无辜者能救另外两人，它便要求你杀人。另一说它们要求得太多：无论对你代价几何，你都必须做能产生最佳结果的事。于是，若牺牲你的性命只能救另外两人，你也得牺牲；你永远不能只是歇一歇、寻点乐子。若能去食物银行做志愿者产生更多善，花一晚上看电视便是错的；若去非洲送医疗援助能产生更多善，去食物银行做志愿者也是错的。多数道德观点都承认，你有某种义务向造福境况不如你者的慈善机构捐款，比如饥荒中的受难者。可后果主义说，只要对方所得大于你的付出，你就必须一直给予——这可能一直给到你把自身降到他们的福利水平 (Singer 1972: 241)[^singer-1972]。它不区分道德上被要求之事与虽可嘉可赞、本身良善、却超出义务（超义务）之事。在后果主义这里，没有道德上的休息时间，也没有你不能被要求去做的牺牲。按第二项异议，它的要求强得不合理。
