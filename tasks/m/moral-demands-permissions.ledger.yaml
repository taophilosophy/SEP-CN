      One possibility is to replace a maximizing duty to promote the good with a satisficing duty (Slote 1985: 35–59)[^slote-1985], which says an act is right so long as it produces a reasonable amount of good, or has an outcome that’s in one or both of two senses good enough. In one sense an outcome is good enough if in it all people, or perhaps some reasonable percentage of them, lead what by absolute standards are reasonably good lives. In another it’s good enough if you’ve made some reasonable percentage, say two thirds, of the largest improvement in it you can (Hurka 1990)[^hurka-1990]. A duty that is satisficing in both senses is in two ways less demanding than a maximizing one. If the situation is by absolute standards already reasonably good, you have no duty whatever to improve it; and even if the situation isn’t reasonably good and nothing you do can make it so, you need only do, say, two thirds of the most you can to improve it.
