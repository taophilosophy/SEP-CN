      Views using only requiring factors also have difficulty accommodating a different type of permission. Alongside “agent-favouring” permissions to prefer your own lesser good, common-sense morality seems to grant “agent-sacrificing” permissions, ones to prefer other people’s lesser good (Slote 1985: 11–12, 24–26)[^slote-1985]. While the first type of permission allows you to choose nine units of good for yourself rather than ten for another, the second says you may choose nine for another rather than ten for yourself; common sense doesn’t see that sacrifice as wrong. It may condemn preferring another’s vastly lesser good, as it condemns preferring your own vastly lesser good. But with that proviso it seems to permit some agent-sacrifice, and this doesn’t fit easily in a view with only requiring reasons. In our example both your impartial reason and your self-regarding one favour giving yourself the ten units, which makes giving the other the nine units wrong both on the simpler view that weighs the two reasons directly and on some two-stage ones. This conclusion won’t follow if your moral reason is to promote, not the good impartially, but just other people’s good, your own excluded; then your moral reason favours the sacrifice and can make it not on balance wrong. And some requiring-reason views, especially two-stage ones, do take moral reasons to concern only other people’s good (Portmore 2003, 2011, 2019; Harman 2016)[^harman-2016][^portmore-2003]; they can therefore allow agent-sacrifice. But the idea that your own good can’t ground or contribute to moral reasons is contentious (Lazar 2019a)[^lazar-2019a], and this means that to accommodate agent-sacrificing permissions a view with only requiring factors needs, if not a controversial assumption of metaphysical indeterminacy, then one about what counts as a moral reason.
