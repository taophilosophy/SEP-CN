      A third view weighs this factor against some negative duties but not others (e.g., Quong 2009; Kamm 2016: 83–91)[^kamm-2016][^quong-2009]. One case where this weighing has been accepted involves self-defence against an innocent threat, such as a fat man who’s been thrown off a cliff and will crush you if he lands on you but whom you may, many think, permissibly vaporize with a ray gun. There would be no need for weighing here if the threat had lost his right not to be killed, so you had no duty even other things equal not to kill him (J. J. Thomson 1991)[^thomson-1991]. But many find this implausible; the fat man isn’t at fault nor is his being a threat the result of any choice of his. And if the duty not to kill him is still present, the explanation why you may use the ray gun must be that your permission other things equal to promote your good, or to care especially about your life, outweighs the duty (e.g., Davis 1984; Quong 2009, 2016)[^davis-1984][^quong-2009]. And this explanation is strengthened if the threat is likewise permitted to kill you to stop you from killing him, and if a third party may not intervene on either’s side; both facts underscore the permission’s agent-relativity. The weighing has also been accepted where a runaway trolley is bearing down on you and you’re permitted to save yourself by diverting it to a track where it will kill a bystander but a third party may not divert it, or where you can throw a bomb that will destroy the trolley but will also kill a bystander; here too some think you may prefer your own to the bystander’s good even though you actively kill him. But many who endorse agent-relative permissions in some or all of these cases deny them in ones where the killing is of someone who isn’t a threat and where his death is intended, in particular as a means, rather than merely foreseen as in the last two cases. Thus, they deny that you may save yourself from a trolley by throwing an innocent person in front of it (Quong 2009; Kamm 2016)[^kamm-2016][^quong-2009]. When the duty is not to kill or harm as a means, considerations of your good have no weight against it; only agent-neutral ones do. (In the innocent-threat case, however, you do intend the fat man’s death as a means.) But this view faces even more starkly the challenge about consistency: why should a factor concerning your good weigh against some negative duties but not others? What explains the difference?
    step1: |-
      第三种观点让这一因素与某些消极义务相抗衡，但不与另一些相抗衡 (e.g., Quong 2009; Kamm 2016: 83–91)[^kamm-2016][^quong-2009]。这种衡量被接受的一个案例涉及对无辜威胁者的自卫，比如一个被抛下悬崖的胖子，如果他落到你身上就会压死你，但许多人认为你可以允许地用射线枪把他汽化。如果该威胁者已经丧失了不被杀的权利，以至于你连其他条件相同下不杀他的义务都没有，这里就无需衡量 (J. J. Thomson 1991)[^thomson-1991]。但许多人觉得这不合理；胖子没有过错，他成为威胁也不是他的任何选择的结果。而如果不杀他的义务仍然在场，那么解释你为何可以用射线枪的，就只能是：你其他条件相同下促进自身善、或特别关心自己生命的允许，压过了那一义务 (e.g., Davis 1984; Quong 2009, 2016)[^davis-1984][^quong-2009]。如果威胁者同样被允许杀你以阻止你杀他，且第三方不得介入任何一方，这一解释就更有力；这两个事实都突显了该允许的行动者相对性。当一辆失控电车轮向你，你可以把电车扳到一条会压死一个旁观者的轨道以自救而第三方不得这样扳，或者你可以扔一枚炸弹炸毁电车但也会炸死一个旁观者，这种衡量也被接受；在这里同样有人认为，即便你主动杀了他，你也可以偏好自己的善胜过旁观者的善。但在这些案例中的部分或全部支持行动者相对允许的许多人，在另一些案例中否认这种允许：那里被杀的人不是威胁者，而且他的死亡是被意图的——尤其是作为手段——而不像最后两个案例那样只是被预见。于是，他们否认你可以把一个无辜者扔到电车前面以自救 (Quong 2009; Kamm 2016)[^kamm-2016][^quong-2009]。当义务是不把杀人或伤害用作手段时，关于你的善的考量对它毫无分量；只有行动者中立的考量才有分量。（不过在无辜威胁案例中，你确实把胖子的死亡作为手段来意图。）但这一观点面临的一致性挑战更为尖锐：一个关涉你的善的因素，为什么能与某些消极义务相抗衡，却不与另一些相抗衡？差别何在？
    step2: |-
      第三种观点让这一因素与某些消极义务相抗衡，却不对另一些 (e.g., Quong 2009; Kamm 2016: 83–91)[^kamm-2016][^quong-2009]。这种衡量被接受的一个案例，是对无辜威胁者的自卫：一个胖子被人抛下悬崖，若砸在你身上便会压死你，而许多人认为，你可以正当地用射线枪把他汽化。倘若该威胁者已经丧失了不被杀的权利，以致你连“其他条件相同下不杀他”的义务都没有，这里就根本无需衡量 (J. J. Thomson 1991)[^thomson-1991]。但许多人觉得此说不妥：胖子并无过错，他之成为威胁也不是他自己选择的结果。既然不杀他的义务仍在，那么你能用射线枪的理由，就只能是其他条件相同下促进自身之善——或特别看重自己性命——的允许压过了这一义务 (e.g., Davis 1984; Quong 2009, 2016)[^davis-1984][^quong-2009]。若威胁者同样被允许杀你以自保，且第三方不得介入任何一方，这个解释就更站得住：两个事实都突显了这一允许的行动者相对性。失控电车轮到你头上时，你可以把它扳向一条会压死旁观者的轨道自救，而第三方不得如此；或者你可以扔炸弹毁掉电车——附带炸死一个旁观者。在这里，这种衡量同样被接受：有人认为，即便你主动杀了旁观者，也可以偏好自己的善胜过他的善。然而，在上述部分或全部案例中支持行动者相对允许的许多人，在另一些案例中却否认这种允许：那里被杀的并非威胁者，而且他的死亡是被意图的——尤其是当作手段——不像最后两个案例那样只是被预见。于是他们否认你可以把一个无辜者扔到电车前面来自救 (Quong 2009; Kamm 2016)[^kamm-2016][^quong-2009]。当义务是“不把杀人或伤害用作手段”时，关于你的善的考量对它全无分量；唯有行动者中立的考量才有分量。（不过在无辜威胁案例里，你恰恰是把胖子的死当作手段来意图的。）但这一观点面临的一致性挑战更为刺眼：一个关涉你的善的因素，凭什么与某些消极义务相抗衡，却不与另一些相抗衡？差别作何解释？
