      Some consequentialists argue that, since you know much less about what will promote the good of distant strangers than you do about promoting your own good or that of your family and friends, you’ll do the most good, even impartially considered, if you concentrate your efforts locally, on those you know best (e.g., Sidgwick 1907: 430–39)[^sidgwick-1907]. This, they say, makes their view not in practice that demanding. But though it contains some truth, this argument hardly meets all the objection. If you can save either your own life or two strangers’, you don’t need specialized knowledge to be confident that saving the two will preserve more good. Nor can a well-off person in a developed country really doubt that the cost to his family of donating $1000 to a food agency will be smaller than the benefit to those it saves from starvation.
    step1: |-
      一些后果主义者论证说，既然你对遥远的陌生人何为促进其善的了解，远少于对促进自己或亲友之善的了解，那么即使从不偏不倚的角度考虑，把努力集中在本地、集中在你最了解的人身上，你反而会做最多的善 (e.g., Sidgwick 1907: 430–39)[^sidgwick-1907]。他们说，这使他们的观点在实践中并不那么苛刻。但这论证虽含有些真理，却很难回应全部异议。如果你能救自己或两个陌生人的命，你并不需要专门知识就能确信救两人会保存更多善。一个富裕国家的富人，也无法真的怀疑：向粮食机构捐 1000 美元给其家庭带来的代价，会小于它使一些人免于饥饿所带来的好处。
