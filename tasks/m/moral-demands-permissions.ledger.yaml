      One possibility is to place a limit on the total sacrifice you can be required to make in your life, so once your costs of benefiting others reach that limit you need accept no more. This view has some similarity to a satisficing one, since it in effect says you need only sacrifice a reasonable amount of your good. And it has a similar weakness, since it implies that once you’ve, say, given enough to charity, you needn’t accept even a minimal cost, say $1, to save a drowning child. A different view extends to your life as a whole the idea that the strength of your permission other things equal to promote your good increases as the good at stake for you gets larger. Then the more you’ve sacrificed or will sacrifice through time, the larger the difference between the benefits and costs of a further contribution must be for you to be required to make it now (Pummer 2023: 138–44)[^pummer-2023]; thus, if you’ve already contributed and thereby sacrificed a great deal, that difference must be greater than ten times. So long as the ratio between the benefit to others and the cost to you remains the same, you’ll eventually be permitted to cease contributing. Nor would you be required to keep saving drowning children in a sequence of hundreds of ponds; even there your permission to avoid costs would eventually outweigh the benefit to the next child.
    step1: |-
      一种可能是给你一生中可被要求做出的总牺牲设一个上限，一旦你造福他人的代价达到该上限，你便无需再接受更多。这一观点与满足性观点有几分相似，因为它实际上说你只需牺牲你的善中合理的一部分。它也有类似的弱点，因为它蕴含：一旦你已经向慈善捐了足够多，你便无需接受哪怕极小的代价——比如 $1——去救一个溺水的孩子。另一个不同的观点把下述观念扩展到你的一生整体：你对促进自身之善的其他条件相同下的允许，其强度随所关涉的善的增大而增强。于是，你在时间中已经牺牲或将牺牲的越多，一笔进一步捐助的收益与代价之间的差别就必须越大，你才被要求现在就做出它 (Pummer 2023: 138–44)[^pummer-2023]；因此，如果你已经捐助并由此牺牲了很多，该差别就必须大于十倍。只要对他人的收益与对你的代价之间的比率保持不变，你最终将被允许停止捐助。你也不会被要求在几百个池塘的序列中持续拯救溺水儿童；即便在那里，你避免代价的允许最终也会压过对下一个孩子的益处。
    step2: |-
      一种可能是给“你一生可被要求做出的总牺牲”设一个上限：一旦你造福他人的代价触及上限，就不必再接受更多。此说与满足性观点有几分相似——它实际上主张，你只需牺牲你的善中合理的一份。它也有类似的弱点：它意味着，一旦你已向慈善捐够了数，哪怕只需 $1 去救一个溺水的孩子，你也不必再接受这种极小的代价。另一观点则把前文的观念扩展到你的一生整体：其他条件相同，你促进自身之善的允许，其强度随所关涉善的增大而增强。于是，你在时间中已经牺牲、或将牺牲的越多，一笔追加捐助的收益与代价之差就得越大，你才被要求现在做出它 (Pummer 2023: 138–44)[^pummer-2023]；倘若你已捐助良多、牺牲已巨，这一差别就得超过十倍。只要他人所得与你所付的比率不变，你终有一天会被允许停止捐助。面对几百个池塘接连而来，你也不会被要求一直救下去；即便在那里，你避免代价的允许终会压过下一个孩子的性命之益。
