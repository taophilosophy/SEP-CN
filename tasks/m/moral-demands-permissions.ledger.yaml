      In the other version of the strategy that supplements the duty to promote the good with a competing factor that can outweigh it, this factor is only permissive: it’s a permission other things equal or a justifying reason, and not an ought or requiring reason, concerning your good. Scheffler proposed a version of this view in which the permissive factor is comparative, or is a permission to give your own good somewhat more weight than other people’s, say up to ten times more (1982: 20). In a different version this factor is a simpler permission other things equal to promote your good, which then has a weight (Hurka & Shubert 2012; Muñoz 2021; Pummer 2023)[^hurka-2012][^muñoz-2021][^pummer-2023]. If the permission’s weight is greater than the duty’s, you’re permitted all things considered to prefer your lesser to another’s greater good; if it’s not, you must do what is impartially best. Though perhaps not entirely familiar, the idea that permissions can have weights mirrors the parallel idea about duties. If the strength of a duty other things equal is its tendency to make an act simply required, the strength of a permission other things equal is its tendency to make an act simply permitted. Thus, a permission other things equal to promote two units of your good is stronger than a permission to promote just one unit because it outweighs some duties the other permission does not. If your permission to promote a unit of your good is ten times as strong as your duty to promote a unit of other people’s, the result is, as in Scheffler’s view, that you may all things considered prefer a unit of your good to as many as ten, but not to more than ten, for others.
    step1: |-
      在补充促进善义务、引入一个可压过它的竞争因素这一策略的另一版本中，该因素只是允许性的：它是一项其他条件相同下的允许或一个辩护性理由，而非关于你的善的应当或要求性理由。Scheffler 提出了这一观点的一个版本，其中允许性因素是比较性的，即一项允许你给自己的善比他人之善稍多权重的许可，比如多到十倍 (1982: 20)。在另一个版本中，该因素是一项更简单的、其他条件相同下促进你自己善的允许，它随后具有一个权重 (Hurka & Shubert 2012; Muñoz 2021; Pummer 2023)[^hurka-2012][^muñoz-2021][^pummer-2023]。若该允许的权重大于义务的权重，你经通盘考量就被允许偏好自己较小的善而非他人较大的善；若不然，你必须做不偏不倚最好的事。允许可以有权重这一想法虽然也许并不完全熟悉，却与关于义务的平行想法相映：若一项其他条件相同下义务的力量在于它倾向于使行为径直被要求，那么一项其他条件相同下允许的力量就在于它倾向于使行为径直被允许。因此，一项其他条件相同下促进你两单位善的允许，强于只促进一单位的允许，因为它能压过后者压不过的某些义务。若你促进一单位自己善的允许十倍强于你促进一单位他人善的义务，结果——如 Scheffler 观点那样——就是你经通盘考量可以偏好自己一单位善，胜过他人多达十单位，但不能超过十。
