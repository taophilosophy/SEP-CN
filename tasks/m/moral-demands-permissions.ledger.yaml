      In Singer’s pond case it’s natural to assume that once you’ve saved the child you won’t, at least immediately, face a further demand of the same kind; the required sacrifice is a one-off. But if you save one person from starving by donating, say, $1000 to a food agency, there will be many other people facing the same fate and imposing the same demand on you. And if you give a second $1000 there will be a similar demand to give a third, and so on. Over time a sequence of individually modest demands can end up requiring a large sacrifice from you. It’s as if you encountered a long series of ponds, each requiring you to abandon what you were doing to save a child and leaving you no time for yourself (Kuper 2002; Timmerman 2015; Woollard 2015: 126; J. A. Thomson 2022)[^kuper-2002][^thomson-2022][^timmerman-2015][^woollard-2015]. Is that immense sacrifice required? Many will say not. They will say that you can’t reasonably be required to keep saving all the children in the long series of ponds, and likewise can’t be required to keep giving $1000. Even if, at any given time, you need only give aid if the benefit to the recipient is, say, ten times the cost to you, the result of your doing so repeatedly can be a very large cost to you, and the demand that you accept that cost is excessive.
    step1: |-
      在 Singer 的池塘案例中，人们自然假定：你一旦救起孩子，至少在短期内不会再面临同类的进一步要求；所要求的牺牲是一次性的。但如果你通过向粮食机构捐助比如 $1000 而使一个人免于饿死，将会有许多其他人面临同样的命运并对你提出同样的要求。而如果你捐出第二个 $1000，就会出现捐出第三个的类似要求，如此类推。随着时间推移，一连串各自温和的要求最终可能要求你做出巨大的牺牲。这就好比你接连遇到一长串池塘，每一处都要求你撇下手头的事去救一个孩子，不留一点时间给你自己 (Kuper 2002; Timmerman 2015; Woollard 2015: 126; J. A. Thomson 2022)[^kuper-2002][^thomson-2022][^timmerman-2015][^woollard-2015]。那种巨大的牺牲也是被要求的吗？许多人会说不。他们会说，不能合理地要求你不断救起那一长串池塘里的所有孩子，同样也不能要求你不断捐出 $1000。即便在任何给定时刻，只要受益者的所得是你代价的比如十倍你才需要给予援助，你反复这样做的结果也可能是你付出非常大的代价，而要求你接受这一代价就过分了。
    step2: |-
      在 Singer 的池塘案例里，人们自然以为：救起孩子之后，至少短时间内不会再遇到同类的要求；所要求的牺牲是一次性的。可若你向粮食机构捐出比如 $1000、救下一人不致饿死，世上还有许多人在走向同样的命运，也会向你提出同样的要求；你捐出第二个 $1000，第三个的要求接踵而至，如此无穷。假以时日，一连串各自温和的要求，最终能逼出你一笔巨大的牺牲。这就像你接连遇上一长串池塘，每一处都要你撇下手头的一切去救一个孩子，不留一点时间给自己 (Kuper 2002; Timmerman 2015; Woollard 2015: 126; J. A. Thomson 2022)[^kuper-2002][^thomson-2022][^timmerman-2015][^woollard-2015]。如此巨大的牺牲也是被要求的吗？许多人会说不是：不能合理地要求你把那一长串池塘里的孩子一个个都救下去，同样也不能要求你源源不断地捐出 $1000。即便在任何给定时刻，只要受益者的所得是你代价的比如十倍，你就该出手相助，你反复照做的结果也可能是压在你身上的一笔极大代价；而要求你接受这笔代价，就太过分了。
