      The view that the competing factor is an ought or requiring reason is simple conceptually, since it uses just one type of normative element. In what I’ll call a one-stage version this view weighs a requiring reason to promote the good impartially and a similar reason to promote your own good (and perhaps that of those close to you) directly against each other. If one of the two is stronger, you must do as it directs; but if neither is stronger, you’re permitted all things considered to act on either (Parfit 2011: 137–41)[^parfit-2011]. This one-stage view has difficulty, however, generating permissions that are sufficiently extended. If you’re permitted to choose either one unit of good for yourself or ten for others, you surely often may also choose either one for yourself or nine or eleven for others. But this won’t be possible if the competing reasons have precise weights. If your reason to promote your own good is exactly ten times as strong as your impartial reason, you may choose either of two acts when the ratio of cost to benefit is exactly 1:10 but not when it’s either greater or smaller than 1:10; then one of the reasons is stronger and you must act on it (Kagan 1989: 374–75)[^kagan-1989]. To avoid this result, the view’s proponents often say the reasons can’t be weighed precisely. There’s a band of indeterminacy where neither is stronger but they’re also not exactly equally strong, and within this band you may act on either (Parfit 2011: 137)[^parfit-2011]. But while it’s plausible that we can’t ourselves weigh the reasons precisely, to imply that in an extended range the two choices are permitted objectively, rather than just relative to our beliefs, this view must say the reasons don’t in fact, or metaphysically, have precise weights. And do extended objective permissions really depend on this abstruse claim of objective indeterminacy? Would there be no such permissions if the normative truth were completely precise (Hurka & Shubert 2012: 4)[^hurka-2012]?
