      A related possibility is to make the duty to promote the good what Kant called an “imperfect” rather than “perfect” duty. A Kantian imperfect duty mainly requires you to adopt an end rather than to perform any acts; when it does require acts, it doesn’t mandate specific ones but gives you some “latitude” to decide when and to what degree you’ll fulfill it; and it allows some exceptions for inclination or desire (Kant 1797 [1964: 49, 54, 73–74, 112]; Kant 1785 [1997: 31n2]; see also Hill 1971)[^hill-1971][^kant-1785][^kant-1797]. The third feature, about inclination, seems to introduce a competing factor that weighs against the duty, as in the second general strategy, and so can be set aside here. And the first feature only distinguishes imperfect duties given the second, about latitude, which therefore seems the primary one. But if the latitude is “for doing more or less” (Kant 1797 [1964: 54])[^kant-1797], so you may sometimes opt not to produce the best outcome, an imperfect duty is close to a satisficing one and open to similar objections; thus, it too can permit you not to benefit another when that would involve no or minimal cost for you. Some defenders of imperfect duties say that, if you don’t benefit another when that would involve minimal cost to you, you haven’t really adopted an end of beneficence (Noggle 2009; Stohr 2011)[^noggle-2009][^stohr-2011]. But this implies that when you are permitted not to benefit, it’s because there are significant costs for you, which again suggests the second strategy, with a competing factor, rather than the first of just weakening the duty. Kant’s imperfect duties do have a distinctive temporal dimension. While a satisficing duty can be read as requiring you at each time to produce at least two thirds of the most good you then can, Kant allows you sometimes not to produce any good so long as, over time, you produce a reasonable amount. But, a competing factor aside, there’s still no attention to costs as such and, in consequence, the possibility of strong demands if even promoting just some good through time requires large sacrifices by you.
    step1: |-
      一个相关的可能是把促进善的义务做成康德所说的“不完善的”而非“完善的”义务。康德式不完善义务主要要求你采纳一个目的而非实施任何行为；当它要求行为时，也不强制具体的行为，而是给你一些“余地”去决定何时、在何种程度上履行它；并且允许为偏好或欲望留些例外 (Kant 1797 [1964: 49, 54, 73–74, 112]; Kant 1785 [1997: 31n2]; see also Hill 1971)[^hill-1971][^kant-1785][^kant-1797]。第三个特征——关于偏好——似乎引入了与义务相抗的竞争因素，正如第二条一般策略那样，因此可在此搁置。而第一个特征只有在第二个特征（关于余地）给定后才区分出不完善义务，因此余地看来是首要特征。但如果余地是“做多做少的余地” (Kant 1797 [1964: 54])[^kant-1797]，即你有时可以选择不产生最佳结果，那么不完善义务就近乎满足性义务，面临类似异议；因此，当造福他人对你毫无或只有极小代价时，它也可以允许你不这么做。一些不完善义务的捍卫者说，如果你在该造福他人而代价极小时没有这么做，你就没有真正采纳仁爱这一目的 (Noggle 2009; Stohr 2011)[^noggle-2009][^stohr-2011]。但这意味着你被允许不造福他人时，是因为那对你有重大代价，这又指向第二条策略（引入竞争因素），而非单纯削弱义务的第一条。康德的不完善义务确有独特的时间维度。满足性义务可读作要求你在每一时刻至少产出当时所能产出的最大善的三分之二，而康德允许你有时不产出任何善，只要在时间中你产出合理数量的善。但除了竞争因素之外，仍不关注代价本身，结果便是：即便通过时间促进些许善就需要你作出巨大牺牲，也可能出现强要求。
