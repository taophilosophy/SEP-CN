      ## 5. Supplementing the Duty to Promote the Good: A Permissive Factor
    step1: TBD
    step2: TBD
  - id: 39
    kind: body
    source: |-
      In the other version of the strategy that supplements the duty to promote the good with a competing factor that can outweigh it, this factor is only permissive: it’s a permission other things equal or a justifying reason, and not an ought or requiring reason, concerning your good. Scheffler proposed a version of this view in which the permissive factor is comparative, or is a permission to give your own good somewhat more weight than other people’s, say up to ten times more (1982: 20). In a different version this factor is a simpler permission other things equal to promote your good, which then has a weight (Hurka & Shubert 2012; Muñoz 2021; Pummer 2023)[^hurka-2012][^muñoz-2021][^pummer-2023]. If the permission’s weight is greater than the duty’s, you’re permitted all things considered to prefer your lesser to another’s greater good; if it’s not, you must do what is impartially best. Though perhaps not entirely familiar, the idea that permissions can have weights mirrors the parallel idea about duties. If the strength of a duty other things equal is its tendency to make an act simply required, the strength of a permission other things equal is its tendency to make an act simply permitted. Thus, a permission other things equal to promote two units of your good is stronger than a permission to promote just one unit because it outweighs some duties the other permission does not. If your permission to promote a unit of your good is ten times as strong as your duty to promote a unit of other people’s, the result is, as in Scheffler’s view, that you may all things considered prefer a unit of your good to as many as ten, but not to more than ten, for others.
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      This version of the second strategy is more complex conceptually than the one with only requiring reasons, since it uses two types of normative factor. But it’s hard to see this as a decisive flaw. “Ought” and “permitted” are mutually interdefinable, just like “necessary” and “possible”, and there’s no reason to see either as more fundamental. At the same time, this view is simpler structurally than some requiring-reason ones, especially two-stage ones, since it involves just one weighing and one assessment. With a merely permissive competing factor, moreover, it can yield an extended range of permissions even if this factor has a metaphysically precise weight. If your permission to promote a unit of your own good outweighs your duty to promote ten units for others, it also outweighs your duty to give nine, eight, or seven for others, and it does so even if ten is an exact cutoff. And since it involves only a permission other things equal, it also allows you to weigh your good equally against other people’s and so always allows you to do what’s impartially best. If its permissive factor reflects a personal point of view that, as Scheffler says, cares more about your good because it’s yours, it’s hard to see how it can allow agent-sacrifice (Slote 1985: 25)[^slote-1985]. But if that ambitious grounding is set aside, the view can give you a further permission to give your good somewhat less weight than other people’s, or a permission other thing equal not to promote your good, and this will generate agent-sacrificing permissions. The view will then allow you to depart from impartial beneficence in each of two directions, preferring either your own or another’s lesser good.
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      Controversially, however, a view that includes only a permission concerning your good doesn’t give you a non-moral, prudential, or personal requiring reason to seek what’s best for you, where many will say that non-moral reason is essential. A view of this type can derive a requiring reason to promote your good from an impartial moral duty, so you ought to do what’s good for you just as you ought to do what’s good for anyone else. But many will say you have a distinctively non-moral or personal reason to promote your good that this view omits; if you fail to do what’s best for you, you may act wrongly all things considered but you don’t, contrary to the proposed derivation, act immorally. Moreover, the derivation requires the duty the permission competes with to be impartial rather than, as in some two-stage views, just about others’ good. So not only does a purely permissive view omit a distinctive requiring reason to promote your good that some think essential, it can only affirm any requiring reason at all about your good given a specific and controversial view of what the competing moral duty is.
    step1: TBD
    step2: TBD
