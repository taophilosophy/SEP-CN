      The most radical version of the first strategy rejects the duty to promote the good entirely, recognizing only, say, deontological duties not to harm or interfere with others. The resulting view, which may be libertarian, never requires you to sacrifice any of your good to benefit others, or even to benefit them when that would be costless for you, and is therefore completely undemanding (Narveson 2003)[^narveson-2003]. But many will find this view too radical and will prefer a version of the strategy that retains a duty to promote the good, either on its own or as one duty among others, but weakens the duty so that by itself it permits some or even many acts that produce less than the most good possible. The question, though, is whether this weakening, which can be done in several ways, fully meets the demandingness objection.
    step1: |-
      第一种策略最激进的版本完全拒斥促进善的义务，只承认例如不伤害或不干涉他人的义务论义务。由此形成的观点可能属于自由至上主义，它从不要求你牺牲自己的任何善来造福他人，甚至在造福他人对你毫无代价时也不要求，因而完全不苛刻 (Narveson 2003)[^narveson-2003]。但许多人会觉得这一观点太激进，而更青睐该策略的一个版本：保留促进善的义务——或是单独保留，或是作为诸多义务之一——但削弱它，使其本身允许某些甚至许多产生少于最大可能之善的行为。然而问题在于，这种削弱（可有好几种做法）是否能完全回应苛刻性异议。
