      This first view has the virtue of consistency, since it weighs its ought or permission other things equal equally against all duties, negative as well as positive. But many, especially those with strong deontological intuitions, will reject it; they’ll say that effects specifically on you are irrelevant to duties such as not to kill. Though these duties can sometimes be outweighed by impartial beneficence, that killing or lying will benefit you in particular can never change it from wrong to right (e.g., J. J. Thomson 1991; Tadros 2011: 202–08; Frowe 2021)[^frowe-2021][^tadros-2011][^thomson-1991]. This view fits easily in a theory like Ross’s, where there’s no non-deontological factor that can weigh against the duty to promote the good. It can also fit in one that limits that duty in some other way (e.g., Frowe 2021)[^frowe-2021]. But if what weighs against the duty to promote the good is a requiring or permissive factor of the kind discussed above, a deontology that says this factor can’t weigh against a negative duty faces a challenge about its internal consistency (Kagan 1984: 251)[^kagan-1984]. What explains why this factor has force against some duties but not others? Shouldn’t the costs to you weigh either against all duties, both negative and positive, or against none?
    step1: |-
      这第一种观点有一致性之长，因为它把其他条件相同下的应当或允许同等地与一切义务相抗衡，无论消极的还是积极的。但许多人——尤其是义务论直觉强烈的人——会拒绝它；他们会说，专门落在你身上的效应对不杀人这类义务不相干。虽然这些义务有时可以被不偏不倚的仁爱压过，但杀人或撒谎将特别地让你受益，永远不能把错变成对 (e.g., J. J. Thomson 1991; Tadros 2011: 202–08; Frowe 2021)[^frowe-2021][^tadros-2011][^thomson-1991]。这一观点容易安放进像 Ross 的理论那样的理论：在那里没有任何非义务论因素可以与促进善的义务相抗衡。它也能安放进以某种其他方式限制该义务的理论 (e.g., Frowe 2021)[^frowe-2021]。但如果与促进善义务相抗衡的是上面讨论的那种要求性或允许性因素，而一种义务论又说这一因素不能与消极义务相抗衡，那么这种义务论就面临关于其内在一致性的挑战 (Kagan 1984: 251)[^kagan-1984]。是什么解释了这一因素为何对某些义务有力量、对另一些没有？你的代价难道不应该要么与一切义务——消极与积极皆然——相抗衡，要么与任何义务都不相抗衡吗？
    step2: |-
      第一种观点有一致性之长：它把其他条件相同下的应当或允许，同等地与一切义务相抗衡——消极的与积极的都在内。但许多人——义务论直觉尤强的人——会拒绝它：他们说，专门落在你身上的效应对不杀人这类义务全然不相干。这类义务固然有时可以被不偏不倚的仁爱压过，但“杀人或撒谎偏偏让你受益”，永远不能把错变成对 (e.g., J. J. Thomson 1991; Tadros 2011: 202–08; Frowe 2021)[^frowe-2021][^tadros-2011][^thomson-1991]。这一观点很容易安放进 Ross 式的理论：那里根本没有能与促进善义务相抗衡的非义务论因素。它也能安放进以别的方式限制该项义务的理论 (e.g., Frowe 2021)[^frowe-2021]。可如果抗衡促进善义务的是前文那种要求性或允许性因素，而一种义务论偏偏说这因素不能抗衡消极义务，它就撞上内在一致性的挑战 (Kagan 1984: 251)[^kagan-1984]：凭什么这一因素对某些义务有力量、对另一些就没有？你的代价，难道不该要么与一切义务——消极积极都在内——相抗衡，要么就与任何义务都不相抗衡吗？
