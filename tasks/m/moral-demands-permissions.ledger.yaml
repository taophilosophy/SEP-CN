      A related argument invokes “indirect” or “two-level” consequentialism, which distinguishes what’s true—the consequentialist principle—from what’s in practice the best way of deciding how to act. Since someone who tries to identify the act with the best outcome will too often get it wrong, this view says, each person should identify some simpler moral rules by following which he can, as an individual, produce the most good through time and then mainly be guided by them (e.g., Bales 1971; Hare 1981; Parfit 1984)[^bales-1971][^hare-1981][^parfit-1984]. The rules must, however, be ones he’ll actually obey, as he won’t if they’re too demanding. He’ll do better if he internalizes a weaker duty to promote the good that he’ll act on than a stronger one he’ll ignore, making again for lesser demands in practice. But it’s again unclear that this argument fully meets the objection. Even if the rule with the best consequences demands less than full maximization, it may still be considerably more demanding than those concerned about demandingness will find plausible (Mulgan 2001: 44)[^mulgan-2001]. This may especially be so if few others are doing much to promote the good, so this person’s acts can make a large difference. In addition, both this argument and the preceding one have a crucial limitation. They concern only what’s right subjectively, or relative to what you know or to what your best decision-procedure is. Both allow that objectively, or relative to the facts, any act that fails to maximize the good is wrong, and objectors may still find that unacceptable. Their concern, they may say, isn’t just that you should be able to think or act as if you’re permitted not to make large sacrifices; it’s that you actually are, objectively, permitted not to make them. A possible response distinguishes between what’s wrong and what you can be blamed for. If you do what’s objectively wrong when you couldn’t have known it was wrong or were following the rules it’s best for you to follow, this response says, you aren’t to blame for your act (e.g., Arneson 2004, 2009)[^arneson-2004]. But the objectors can again deny that this meets their point, which isn’t just about what morality says you can be blamed for but also about what it says you must, objectively, do.
    step1: |-
      一个相关的论证诉诸“间接的”或“两层次的”后果主义，它区分什么是真的——后果主义原则——与实践中决定如何行动的最佳方式。这一观点说，既然试图找出最佳结果行为的人往往弄错，那么每个人都应确定一些更简单的道德规则，遵循这些规则他可作为一个体在时间中产生最多的善，然后主要受它们指导 (e.g., Bales 1971; Hare 1981; Parfit 1984)[^bales-1971][^hare-1981][^parfit-1984]。但这些规则必须是他实际会遵守的，若规则太苛刻他就不会遵守。内化一项较弱、他会照做的促进善的义务，胜过内化一项较强却会被他忽视的义务，这又在实践中带来较少的要求。但同样不清楚这论证是否完全回应了异议。即便后果最佳的规则所要求的少于完全最大化，它仍可能比关心苛刻性者认为合理的要求苛刻得多 (Mulgan 2001: 44)[^mulgan-2001]。如果很少有人致力于促进善，以致此人的行动能带来很大差别，情形尤其可能如此。此外，这一论证与前一论证都有一个关键局限。它们只关涉主观上正当，或相对于你所知、相对于你最佳决策程序而言的正当。两者都承认客观上、或相对于事实而言，任何未能最大化善的行为都是错的，而反对者仍可能觉得这不可接受。他们可以说，他们关心的不只是你应能想着或表现得像被允许不作重大牺牲；而是你客观上确实被允许不作这些牺牲。一种可能的回应区分什么是错的与什么可受责备。若你做了客观上错的事，而你本不可能知道它错、或你在遵循对你最好的规则，那么按这一回应，你不因自己的行为受责备 (e.g., Arneson 2004, 2009)[^arneson-2004]。但反对者同样可以否认这回应了他们的要点——其要点不只关乎道德说你该受何责备，也关乎道德说你客观上必须做什么。
