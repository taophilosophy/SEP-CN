      These are philosophically ambitious arguments, which try to ground a competing factor in something more explanatory than the bare intuition that a consequentialist or other strong duty is too demanding. Some may think a grounding of this kind is essential, so without one agent-relative permissions are unacceptable; others may think it at best a useful addition. And of any proposed grounding we can ask whether it really gives the permissions an independent rationale rather than just restating the idea that there are some in more grandiose terms (Kagan 1989)[^kagan-1989].
