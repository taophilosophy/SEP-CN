      一些后果主义者说：你对远方的陌生人何以为善，远不如对自家亲友之善了解得多；因此哪怕从不偏不倚的角度算，把力气用在近处、用在你最了解的人身上，反而能做最多的善 (e.g., Sidgwick 1907: 430–39)[^sidgwick-1907]。这样一来，他们的观点在实践中就没那么苛刻了。这说法固然有几分道理，却远不足以回应整个异议。若能救自己或两个陌生人的命，你不需要什么专门知识，也确信救两人能保住更多善；一个发达国家的富裕者，也很难真怀疑给粮食机构捐 $1000 对其家庭的代价会小于受助者免于饥饿所得的好处。
