      It seems, first, that the permissions must be accompanied by the duties if unacceptable consequences aren’t to follow. If you may save your own life rather than sacrifice it to save two others and there’s no morally significant distinction between killing and letting die, or no stronger duty not to kill, you may also kill two others to save yourself, something not even impartial consequentialism allows. A view with agent-favouring permissions but no deontological duties, as in Scheffler (1982), is therefore even more open to the objection about permitting too much than consequentialism is, since it can allow killing or lying when that won’t have the best outcome (Kagan 1984; 1989: 19–24; Myers 1994; Mulgan 2001)[^kagan-1984][^mulgan-2001][^myers-1994]. To avoid this implication, agent-relative permissions must be supplemented by deontological constraints, the one departure from consequentialism mandating the other. If you’re sometimes not required to produce the best outcome, you must sometimes be forbidden to produce it.
    step1: |-
      首先，如果不想让不可接受的后果随之而来，这些允许就必须伴随以这些义务。如果你可以保全自己的生命而不牺牲它去救另外两人，而杀人与任其死亡之间没有道德上的重要区别，或不存在更强的不杀人义务，那么你也可以杀另外两人来救自己——这连不偏不倚的后果主义都不允许。像 Scheffler (1982) 那样，一项有偏袒行动者的允许却没有义务论义务的观点，因此比后果主义更容易受“允许太多”的异议攻击，因为它可以在不会产生最佳结果时允许杀人或撒谎 (Kagan 1984; 1989: 19–24; Myers 1994; Mulgan 2001)[^kagan-1984][^mulgan-2001][^myers-1994]。为避免这一推论，行动者相对的允许必须以义务论约束来补充：对后果主义的一处偏离强制要求另一处偏离。如果你有时不被要求产生最佳结果，你就必须有时被禁止产生它。
    step2: |-
      首先，若不想引出不可接受的后果，这些允许就必须配上相应的义务。倘若你可以保全自己的性命而不必牺牲它去救另外两人，而杀人与任其死亡之间又没有道德上的重要区分——或者没有更强的不杀人义务——那你也可以杀掉另外两人来自救，这连不偏不倚的后果主义都不容许。像 Scheffler (1982) 那样只有偏袒行动者的允许、却没有义务论义务的观点，因而比后果主义更容易招致“允许太多”的异议：它可以在产生不了最佳结果时容许杀人或撒谎 (Kagan 1984; 1989: 19–24; Myers 1994; Mulgan 2001)[^kagan-1984][^mulgan-2001][^myers-1994]。要避开这一推论，行动者相对的允许就必须辅以义务论约束——对后果主义的一处偏离，强制引出另一处。既然你有时不被要求去产生最佳结果，你就必须有时被禁止产生它。
