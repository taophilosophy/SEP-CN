      A final, more complex weakening, that of rule-consequentialism, may have better prospects of doing so. It says an act is right if it’s required or permitted by the set of moral rules whose internalization by a large majority, say 90%, of people in your society would have the best consequences through time (Hooker 2000)[^hooker-2000]. Though like indirect consequentialism in citing the effects of certain rules, it uses them to identify not just a desirable decision-procedure but also objective rightness and so lacks that other view’s limitation. Since it considers the effects not just of your accepting rules, like the indirect view, but of most people’s doing so, it can join the co-operative view in significantly weakening the duty to contribute to charity. But by considering their internalizing a rule, rather than just their acting as it requires, it can count it against a rule imposing large costs that people won’t obey it or that vast resources would be needed to get them to do so; it can therefore also allow you not to sacrifice your life to save two others. It’s unclear, though, exactly how far the resulting weakening goes. Could there not be better consequences if most people obey a more demanding rule 30% of the time than if they obey a less demanding one 80% of the time? And the very features that give rule-consequentialism its strengths also create difficulties. Will rules justified by the consequences of their acceptance by most people always give the right directives in situations where most people don’t accept and therefore aren’t acting on the rules? May the rules not then be too permissive? And what if different rules have the best consequences given different percentages of people accepting them? More abstractly, how plausible is it to rest the objective rightness of actual acts on the merely hypothetical consequences of a hypothetical acceptance of rules? How persuasive is that rationale?
