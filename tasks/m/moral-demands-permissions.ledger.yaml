      由于上述观点对两种理由作对称处理，它把关心自身的理由归为道德的还是非道德的，关系不大。但有些要求性理由观点恰恰依赖把这一理由视为非道德的，并在一个更复杂的判断行为程序中运用它。我将称之为两阶段观点：它们先把你的道德理由（例如促进所有人善或仅促进他人善）与一项非道德的促进你自己善的理由相权衡，以确定你最有理由、或经通盘考量应当做什么。然后它们把这一权衡的结果与其中一个组成部分配对，以确定你在道德上被要求或被允许做什么——当两者不同时。一种这样的观点说，若你可以给他人十单位善或给自己九单位，你的非道德理由压过道德理由，你经通盘考量应当给自己那九。但与此同时，你有一项专门的道德允许去给他人那十，因为你总在道德上被允许去做要么最受你全部理由支持的事，要么最受你仅仅道德理由支持的事 (Slote 1991; Portmore 2003)[^portmore-2003][^slote-1991]。另一种观点以相反方式权衡两种理由。它说，此处你的道德理由压过非道德理由，所以你经通盘考量应当给他人那十单位。但没这样做并不在道德上错，因为其中涉及对你的代价；它虽是就你全部理由而言的错误，却是道德上可允许的错误，或不违反一项专门的道德义务 (Harman 2016; McElwee 2017)[^harman-2016][^mcelwee-2017]。这两种两阶段观点都产生一段延展的通盘考量道德允许：任何使不按更强道德理由行事在道德上被允许的代价，在道德理由较弱时也会如此。两者也都总在道德上允许你做道德上最好的事，或因为那总是通盘考量最好的（第二种观点），或即便不是（第一种）。但两者也都面临困难。
