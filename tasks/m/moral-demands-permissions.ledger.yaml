      First, the very complexity that gives two-stage views these merits can make them look ad hoc. What, beyond the desire to fit some intuitions, explains why one requiring reason, either the moral or the non-moral, counts twice in the assessment of acts, first in determining what you have most reason to do and then, separately, in determining what is morally permitted? These views also face a version of the last objection to the one-stage view. Both say that in our example one of the two acts is what you ought all things considered to do, so the other is all things considered forbidden; this second act is permitted only in a different, merely moral sense. Thus, the first view says that giving the other the ten units, though morally permitted, is all things considered forbidden. But many will deny that you have only a moral permission here; they will say that giving the other the ten units and giving yourself the nine are both all things considered permitted. If an act is one the balance of reasons says you ought not to do, doing it is against reason and in that sense irrational. But surely, many will say, neither doing a supererogatory act nor declining to do it is irrational (Kagan 1991: 927–28)[^kagan-1991].
