      The more specific implications of a view of this type depend on how much weight it gives its competing factor. If it permits you to prefer a unit of your own good to only as many as two for other people, it is still very demanding; if it permits you to prefer a unit for you to as many as 100 for others, it is much less so. Significantly different versions of the view are therefore possible, and some may worry that no version will be intuitively acceptable across the board. To yield intuitively plausible results in some cases, they may say, the view must give the competing factor more weight than will allow intuitive results in other cases (e.g., Frowe 2021)[^frowe-2021]. This worry may be partly met if the competing factor’s strength, or the ratio of benefit to cost needed for it to be outweighed, increases with the cost to you, as suggested above. But a further difficulty is raised by the issue of demandingness through time, or in an extended series of acts. For even a limited requirement to sacrifice your good can, if repeated enough times, demand a great deal.
