      Since the above view treats the two reasons symmetrically, it makes little difference whether it classifies the self-regarding one as moral or non-moral. But some requiring-reason views turn on treating this reason as non-moral and using it in a more complex procedure for judging acts. These two-stage views, as I’ll call them, first weigh your moral reasons, such as to promote everyone’s good or just the good of others, against a non-moral reason to promote your own good in order to determine what you have most reason, or ought all things considered, to do. They then pair the result of this weighing with one of its components to determine what you’re morally required or permitted to do, where that is different. One such view says that, if you can give either ten units of good to another person or nine to yourself, your non-moral reason outweighs your moral one and you ought all things considered to give yourself the nine. But you have, alongside this, a specifically moral permission to give the other the ten, because you’re always morally permitted to do either what is most supported by all your reasons or what is most supported by just your moral ones (Slote 1991; Portmore 2003)[^portmore-2003][^slote-1991]. A different view weighs the two reasons in the opposite way. It says that here your moral reason outweighs your non-moral one, so you ought all things considered to give the other the ten units. But failing to do so isn’t morally wrong, because of the cost it involves for you; though a mistake given all your reasons, it’s a morally permissible mistake, or doesn’t violate a specifically moral obligation (Harman 2016; McElwee 2017)[^harman-2016][^mcelwee-2017]. Both these two-stage views yield an extended range of all-things-considered moral permissions, since any cost that makes not acting on a stronger moral reason morally permitted will do the same given a weaker moral reason. Both also always morally permit you to do what’s morally best, either because that’s always all things considered best (the second such view) or even if it’s not (the first). But both also face difficulties.
