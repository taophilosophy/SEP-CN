      Deontological duties can also, though in a different way, be demanding. As merely negative these duties don’t require you to make positive sacrifices for others, or cause yourself harm, but they can require you to accept sacrifices or forgo benefits. If the only way you can save your life is by intentionally killing an innocent person, a duty that makes such killing wrong requires you to accept an outcome where you die; if the only way you can gain a financial benefit is by telling a lie, you must pass up the benefit. In this way even negative or deontological duties can be demanding, or can require sacrifices by you.
    step1: |-
      义务论义务也可以苛求人，只是方式不同。作为纯消极义务，它们不要求你为他人作出积极牺牲、或使自身受损，但它们可以要求你接受牺牲或放弃利益。如果你保住性命的唯一办法是故意杀死一个无辜者，那么一项使这种杀人为错的义务就要求你接受自己死亡的结果；如果你获得经济利益的唯一办法是撒谎，你就必须放弃这项利益。这样，即便消极义务或义务论义务也能苛求人，或要求你作出牺牲。
    step2: |-
      义务论义务也可能苛求人，只是方式不同。作为纯消极义务，它们不要求你为他人积极牺牲，或让自己受损；但它们可以要求你接受牺牲、放弃利益。若保住性命的唯一办法是故意杀死无辜者，那么“不得如此杀人”的义务就要求你接受自己死去的结局；若获取经济利益的唯一办法是撒谎，你就得放弃这笔利益。由此可见，即便消极的、义务论的义务，也能苛求人，也能要求你有所牺牲。
  - id: 7
    kind: body
    source: |-
      These claims about demandingness all consider only the costs to you, the person subject to a duty, and not the costs to others who may be affected by what you do. If you’re required to sacrifice your life to save two others, your death is a relevant cost and makes the duty demanding on you. But if you’re permitted not to make that sacrifice, the deaths of the two aren’t relevant costs and don’t make the permission objectionably demanding on them. (If they were, the result would be something like impartial consequentialism.) It has been argued that the demandingness objection is therefore not in fact distinct from the objection that consequentialist views permit too much. Since it relies on the same distinction between what you actively cause (here your death if you make the sacrifice) and what you merely allow (the others’ deaths if you don’t) that’s central to many versions of the other objection, it just repeats that objection (Sobel 2007)[^sobel-2007]. But the doing/allowing distinction doesn’t figure in all claims about demandingness. A duty not to kill even to save your life is demanding even though it requires you to allow, not actively cause, your death, and some think this duty is at times too demanding (see Section 7). What matters in this and arguably all claims about demandingness is just that a duty applies to you, so only effects on you are relevant. That the two objections are independent is underscored by the fact that Ross’s view is open to one but not the other, and they also appeal to different intuitions: the one that it’s not wrong to choose not to sacrifice your life to save two others, the other that it is wrong to kill one to save two others.
    step1: |-
      这些关于苛刻性的主张都只考虑对你的代价——对受义务约束者本人的代价，而不考虑可能受你行为影响的他人的代价。如果你被要求牺牲生命去救另外两人，你的死亡是一项相关代价，使该义务对你而言是苛求的。但如果你被允许不作这一牺牲，那两人的死就不是相关代价，不会使这一允许对他们而言苛求得令人反感。（如果它们是，结果就会类似不偏不倚的后果主义。）有人论证说，因此苛刻性异议实际上与“后果主义观点允许太多”的异议并无区别。因为它依赖的正是你主动造成什么（此处是若你作出牺牲则你死亡）与你仅仅允许什么（若你不牺牲则他人死亡）之间的区分，而这正是另一异议许多版本的核心，所以它只是在重复那一异议 (Sobel 2007)[^sobel-2007]。但作为/允许之分并不出现在所有关于苛刻性的主张中。一项即使为救自己性命也不得杀人的义务是苛求的，尽管它要求你允许而非主动造成自己的死亡；有些人认为这项义务有时过于苛刻（见第 7 节）。在这一主张以及可以说所有苛刻性主张中，要紧的只是某项义务适用于你，因此只有对你的影响才相关。两项异议相互独立，这点因 Ross 的观点只对其中之一敞开而对另一项不然而更加凸显；它们诉诸的直觉也不同：一说选择不牺牲性命去救另外两人并无错，另一说杀死一人去救另外两人是错的。
    step2: |-
      这些关于苛刻性的说法，都只算对你的代价——对受义务约束者的代价，不算可能受你行为影响的他人的代价。若你被要求牺牲性命去救另外两人，你的死就是一项相关代价，使该义务对你而言苛求。但若你被允许不作此牺牲，那两人的死便不算相关代价，不会让这项允许对他们苛求得令人反感。（若算，结果就近于不偏不倚的后果主义。）有人因此论证：苛刻性异议与“后果主义允许太多”的异议其实并无分别。因为它依赖的正是你主动造成之事（此处是牺牲则你死）与你仅予允许之事（不牺牲则他人死）的区分，而这一区分恰是另一异议许多版本的要害，所以它不过是在重复那一异议 (Sobel 2007)[^sobel-2007]。然而作为与允许之分并不见于所有苛刻性主张。一项即便为救己命也不得杀人的义务是苛求的，尽管它要求你允许、而非主动造成自己的死；有些人认为这项义务有时过于苛刻（见第 7 节）。在此处、乃至可以说在所有苛刻性主张中，要紧的只是某项义务适用于你，因而只有对你的影响才相关。两项异议彼此独立，还因 Ross 观点只招其一而不招其二而更显分明；它们所诉诸的直觉也不同：一说选择不牺牲性命去救另外两人并不为错，另一说杀死一人去救另外两人是错的。
  - id: 8
    kind: body
    source: |-
      There is, then, a distinctive and important issue about how demanding morality is or should be taken to be. Are you required to maximize the good or benefit others as often as consequentialism and Ross’s view say? Or are you sometimes permitted not to do what will have the best outcome or would otherwise be morally required, because of the cost to you? If this sometimes is permitted, when and why is it that so?
    step1: |-
      于是，道德有多苛求、或应被看作多苛求，是一个独特而重要的问题。你被要求像后果主义与 Ross 观点所说的那样，尽可能经常地最大化善或造福他人吗？还是说，由于对你的代价，你有时被允许不做会产生最佳结果、或在其他方面为道德所要求的事？如果这种“有时被允许”成立，那么何时、为何如此？
    step2: |-
      由此看来，“道德有多苛求、又应当被看成多苛求”是一个独特而重要的问题。你究竟是否像后果主义与 Ross 观点所说的那样，必须尽可能多地去最大化善、造福他人？还是说，由于代价落在你身上，你有时被允许不做能产生最佳结果、或在其他方面为道德所要求的事？若确有这种“有时被允许”，那是在何时、又为什么？
