      Many think you don’t have an equal duty to promote all others’ good. Your duty is stronger concerning those who are close to you, such as your children, so there’s a stronger demand to benefit them. This makes for a duty of beneficence that’s differentiated and, in consequence, can also make for differentiated permissions. Since an ought or permission other things equal of fixed strength will less often outweigh a stronger duty, you have less extensive agent-favouring permissions concerning those you’re close to. If your duty to promote your child’s good is, say, five times stronger than your duty to promote a stranger’s and you may prefer a unit of your own good to as many as ten for a stranger, you may prefer a unit for you to only as many as two for your child; some self-preference that’s allowed in relation to strangers isn’t in relation to your child. Similarly, more agent-sacrifice may be permitted in relation to your child, since then the duty that supports the sacrifice is stronger; if you may prefer a unit of a stranger’s good to only as many as two for you, you may prefer a unit of your child’s to as many as three or four for you. If a competing factor weighs against a differentiated rather than impartial duty, the result is different permissions regarding different people (Hurka & Shubert 2012)[^hurka-2012].
    step1: |-
      许多人认为，你对促进所有他人的善并没有同等的义务。对与你亲近的人——比如你的孩子——义务更强，所以造福他们的要求也更强。这造出一项有差别的仁爱义务，并进而也能造出有差别的允许。既然强度固定的其他条件相同下的应当或允许较不常压过更强的义务，对于亲近之人，你偏袒行动者的允许就更为有限。如果你促进孩子之善的义务，比如说，五倍于你促进陌生人之善的义务，而你可以偏好自己一个单位的善胜过多达十个单位的陌生人之善，那么对你的孩子，你只能偏好自己一个单位胜过多达两个单位的他的善；某些相对于陌生人被允许的自我偏袒，相对于你的孩子就不被允许。类似地，相对于你的孩子可以允许更多牺牲行动者的偏好，因为支持这一牺牲的义务更强；如果相对于陌生人，你可以偏好一个单位的陌生人之善胜过多达两个单位的你自己的善，那么对于你的孩子，你可以偏好他一个单位的善胜过多达三四个单位的你自己的善。如果竞争因素所抗衡的是一项有差别的义务而非不偏不倚的义务，结果就是对不同的人有不同的允许 (Hurka & Shubert 2012)[^hurka-2012]。
    step2: |-
      许多人认为，你对促进所有他人的善并非负有同等的义务。对亲近之人——比如你的孩子——义务更强，造福他们的要求随之更强。这便造出一项差等化的仁爱义务，随之而来的还可以有差等化的允许。其他条件相同的应当或允许，强度一经固定，能压过更强义务的机会就更少；对亲近之人，你偏袒行动者的允许也就更窄。设你促进孩子之善的义务五倍于促进陌生人之善的义务，而你可以偏好自己一个单位的善胜过多达十个单位陌生人的善；那么对孩子，你只能偏好自己一个单位胜过至多两个单位他的善——某些相对于陌生人可容的自我偏袒，放到孩子身上就不容了。反过来，相对于孩子也可以容许更多牺牲行动者的偏好，因为支持这份牺牲的义务更强：若你可以偏好陌生人一个单位的善胜过至多两个单位你自己的善，那么对孩子的善，你可以偏好一个单位胜过多达三四个单位你自己的善。竞争因素若抗衡的是差等化的义务而非不偏不倚的义务，结果便是对不同的人有不同的允许 (Hurka & Shubert 2012)[^hurka-2012]。
