      There are, however, several differences between the pond case and ones involving charitable giving. The child in the pond is just a short distance from you while those suffering from famine are far away; you know who in particular will benefit if you save the child—you can see him—but you know only that someone or other will be saved if you contribute to famine relief; and only you can save the child whereas many others can contribute to charity. (The pond case is also usually imagined as a one-off, whereas if you save one person from famine there will be another whose plight makes the same demand, and then another and another. This issue, about demandingness through time, is discussed in Section 6.) Those who defend a strong duty of aid deny that these differences, either individually or together, are morally significant (e.g., Singer 1972; Unger 1996; Kagan 1998: 134–35; Pummer 2023: 99–125)[^kagan-1998][^pummer-2023][^singer-1972][^unger-1996]; thus, they deny that this duty is weakened by physical distance (contrast Kamm 2000)[^kamm-2000]. Others argue that one or more of the differences do weaken the duty (e.g., Woollard 2015: 129–43)[^woollard-2015]. More specifically, they argue that the pond case invokes a duty of immediate or emergency rescue that’s distinct from, and stronger than, any general duty of beneficence (Kagan 1998; Igneski 2006)[^igneski-2006][^kagan-1998]. Imagine that you encounter a drowning child while on your way to make a charitable donation that will save two lives and must be made without delay. If the duty to save the child were just an instance of a more general duty of beneficence, it would be wrong for you to stop and save the child; you should keep going and make the donation. But many think that would be wrong; your stronger duty is to save the child, which implies that it’s a distinct duty (e.g., Woollard 2015: 132, 142)[^woollard-2015]. But then the verdict about the original pond case doesn’t extend, at least without some loss of demandingness, to non-rescue cases like ones of charitable giving.
    step1: |-
      然而，池塘案例与涉及慈善捐赠的案例之间存在若干差别。池塘里的孩子离你只有很短距离，而饥荒受难者远在天边；你知道救孩子时具体谁将受益——你能看见他——而你只知道若捐助饥荒救济，某人将被救；而且只有你能救那孩子，而许多人可以捐助慈善。（池塘案例通常还被设想为一次性的，而你若救一个饥荒中的人，还会有另一个人的困境提出同样要求，然后又一个、又一个。这一关于跨时间苛刻性的问题在第 6 节讨论。）捍卫强援助义务者否认这些差别——无论是各自还是合在一起——在道德上重要 (e.g., Singer 1972; Unger 1996; Kagan 1998: 134–35; Pummer 2023: 99–125)[^kagan-1998][^pummer-2023][^singer-1972][^unger-1996]；因此，他们否认这一义务因物理距离而减弱（对比 Kamm 2000）[^kamm-2000]。另一些人则论证，这些差别中有一项或多项确实削弱了义务 (e.g., Woollard 2015: 129–43)[^woollard-2015]。更具体地说，他们论证池塘案例援引的是一项即时或紧急救助义务，它不同于、并且强于任何一般的仁爱义务 (Kagan 1998; Igneski 2006)[^igneski-2006][^kagan-1998]。设想你在赶去作一笔能救两条命、且不得延误的慈善捐助途中，遇到一个溺水的孩子。如果救孩子的义务只是一般仁爱义务的一个实例，那么你停下来救孩子就是错的；你应当继续赶路去捐款。但许多人认为那样做是错的；你更强的义务是救孩子，这意味着它是一项独立的义务 (e.g., Woollard 2015: 132, 142)[^woollard-2015]。但这样一来，关于原初池塘案例的裁决至少会在失去一些苛刻性的情况下，无法延伸到慈善捐赠这类非救助案例。
    step2: |-
      然而，池塘案例与慈善捐赠类案例之间有几处差别：池塘里的孩子近在咫尺，饥荒受难者却远在天边；救孩子时你知道具体谁将受益——你看得见他——而捐助饥荒救济只知“总有人”得救；而且救孩子非你莫属，捐助慈善却人人可为。（池塘案例通常还被设想为一次性事件；而你若救了一个饥荒中的人，还会有下一个的困境提出同样的要求，然后又一个、又一个。这个跨时间的苛刻性问题见第 6 节。）主张强援助义务的人否认这些差别——无论单看还是合看——具有道德意义 (e.g., Singer 1972; Unger 1996; Kagan 1998: 134–35; Pummer 2023: 99–125)[^kagan-1998][^pummer-2023][^singer-1972][^unger-1996]，因而也否认这项义务会因地理距离而减弱（对比 Kamm 2000）[^kamm-2000]。另一些人则认为，其中一项或数项差别确实削弱了义务 (e.g., Woollard 2015: 129–43)[^woollard-2015]；更具体地说，池塘案例援引的是一项即时或紧急救助义务，它不同于、也强于任何一般意义上的仁爱义务 (Kagan 1998; Igneski 2006)[^igneski-2006][^kagan-1998]。设想你正赶去作一笔能救两条命、且不可延误的慈善捐助，路上遇到一个溺水的孩子。若救孩子的义务只是一般仁爱义务的实例，你停下来救他就是错的——你应当继续赶路去捐款。但许多人认为那样才错：你更强的义务是救孩子，足见这是一项独立义务 (e.g., Woollard 2015: 132, 142)[^woollard-2015]。但既然如此，关于原初池塘案例的判断，至少要在牺牲一些苛刻性的前提下，才能延伸到慈善捐赠这类非救助案例。
