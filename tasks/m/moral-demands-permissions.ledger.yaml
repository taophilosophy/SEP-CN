      A different weakening, proposed by Liam B. Murphy, requires you to do only as much as you would have to do if everyone else were fulfilling their duty. In charitable giving, for example, you need give only as much as would be your share if everyone else were contributing as they should (Murphy 1993, 2000)[^murphy-1993]. This “co-operative” view can be motivated by concerns other than demandingness and is so for Murphy; his rationale is more that a duty shouldn’t become more onerous for you because others aren’t fulfilling theirs. The resulting co-operative duty is considerably less demanding in cases like that of charitable giving, where others can help produce a good, but not in ones where they can’t. On its own it does nothing to block the claim that if two people are drowning and no one else can save them, you must sacrifice your life to do so. And if it may seem not permissive enough in these cases, it can seem too permissive in others. If you and another could save a third person’s life at a total cost of $20 but the other refuses to contribute his $10, the view gives you no duty to spend $20 to save the life (Tadros 2016: 106; also Mulgan 2001: 217–18; Arneson 2004: 36–37)[^arneson-2004][^mulgan-2001][^tadros-2016]. Like satisficing and imperfect-duty views, this co-operative one weakens the duty to promote the good but arguably doesn’t fully address the core concern about costs.
    step1: |-
      另一种削弱由 Liam B. Murphy 提出，只要求你做到：若人人都在履行其义务时你所需做的程度。以慈善捐赠为例，你只需捐出若人人都依应然方式捐助时你所应承担的份额 (Murphy 1993, 2000)[^murphy-1993]。这一“合作的”观点可以由苛刻性之外的关切来支撑，Murphy 正是如此；他的理由更多是：义务不应因他人未履行其义务而对你变得更沉重。由此得到的合作义务在慈善捐赠这类他人能协助产出善的情形中要求大减，但在他人无力协助的情形中不然。仅凭其自身，它无力阻止这样的主张：若两人溺水而无人能救，你必须牺牲性命去救。而且，如果它在这些情形中显得不够宽松，在另一些情形中又显得太宽松。若你与另一人本可以 $20 的总代价救第三人性命，而对方拒付他那 $10，这一观点便不给你花 $20 救人的义务 (Tadros 2016: 106; also Mulgan 2001: 217–18; Arneson 2004: 36–37)[^arneson-2004][^mulgan-2001][^tadros-2016]。与满足性观点和不完善义务观点一样，这一合作观点削弱了促进善的义务，但可以说并未充分处理关于代价的核心关切。
