      只使用要求性因素的观点，也难以容纳另一种允许。除了“偏袒行动者的”允许——偏好你自己较小的善——常识道德似乎还授予“牺牲行动者的”允许：偏好他人较小的善 (Slote 1985: 11–12, 24–26)[^slote-1985]。第一种允许让你为自己选九单位善而非为他人选十单位；第二种则说你可以为他人选九而非为自己选十；常识并不认为这种牺牲是错的。它可能谴责偏好他人远小于己的善，正如它谴责偏好自己远小于他人的善。但除开这一点，它似乎允许某种牺牲行动者的行为，而这难以纳入只含要求性理由的观点。在我们的例子中，你的不偏不倚理由与关心自身的理由都偏向给自己那十单位，这使给他人那九在直接权衡两理由的简单观点上、以及某些两阶段观点上都是错的。若你的道德理由是促进——不是不偏不倚的善，而只是他人的善、把你自己的排除在外——这一结论便不成立；此时你的道德理由偏向牺牲，可以使之经权衡不为错。而一些要求性理由观点、尤其是两阶段观点，确实认为道德理由只关他人之善 (Portmore 2003, 2011, 2019; Harman 2016)[^harman-2016][^portmore-2003]；因此它们可以允许牺牲行动者。但“你自己的善不能为道德理由奠基或有所贡献”这一想法有争议 (Lazar 2019a)[^lazar-2019a]，这意味着：要容纳牺牲行动者的允许，只含要求性因素的观点若不需要一个有争议的形而上学不确定性假定，就需要一个关于何谓道德理由的假定。
