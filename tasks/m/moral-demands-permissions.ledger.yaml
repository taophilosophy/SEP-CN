      A different version appeals to intuitions about particular cases (e.g., Singer 1972; Unger 1996)[^singer-1972][^unger-1996]. It first describes a case where benefiting others seems uncontroversially required, most famously one of Peter Singer’s where you can save a child from drowning in a pond at the cost of dirtying your clothes (1972: 231). It then argues that cases where many deny there’s a duty to benefit, such as ones where you can save a life by contributing to famine relief, don’t differ in any morally significant way from this one and so likewise involve a requirement; there too you must sacrifice your good. As Singer recognizes, a defence starting from his pond case can’t support a duty as strong as the fully maximizing one he himself prefers. That would require an initial example where you must sacrifice something like both your legs to save the child or your life to save two children, and those acts aren’t uncontroversially required. But the defence can, if successful, support a stronger duty of aid than everyday morality recognizes, one that makes substantial contributions to charity not just generous or supererogatory but in the strict sense required.
    step1: |-
      一个不同的版本诉诸对具体案例的直觉 (e.g., Singer 1972; Unger 1996)[^singer-1972][^unger-1996]。它先描述一个造福他人显得无可争议地被要求的情形，最著名的是 Peter Singer 的一个例子：你可以救起一个池塘中溺水的孩子，代价是弄脏自己的衣服 (1972: 231)。然后它论证：许多人否认有造福义务的情形——例如你可以通过捐助饥荒救济救一条命的情形——与这一例子在道德上并无重要差别，因此同样含有要求；在那里你也必须牺牲自己的善。正如 Singer 所承认，从池塘案例出发的辩护无法支持一项像他本人偏好的完全最大化那样强的义务。那将需要一个初始例子，其中你必须牺牲类似双腿来救孩子、或牺牲性命来救两个孩子，而这些行为并非无可争议地被要求。但这一辩护若成功，可以支持一项比日常道德所承认的更强的援助义务——它使对慈善的实质性捐助不只是慷慨或超义务，而是严格意义上被要求的。
