      These issues about justification aside, the competing factor that generates the permissions can have either of two forms. On one view it’s a duty or ought other things equal to avoid costs to you, or a reason to do what’s best for you in the “requiring” sense where a reason to do an act tends, like an ought other things equal, to make the act simply required. Here what weighs against the duty to promote the good is a normative factor of the same general type. On the other view the factor is merely permissive. It’s a permission or prerogative other things equal to do what’s best for you, or a reason to avoid costs in the weaker “justifying” sense where a reason to do an act tends only to make it simply permitted (Gert 2004)[^gert-2004]; this factor differs in type from the duty. And whatever its form, the factor can be seen either as non-moral, so a moral duty to promote the good weighs against a non-moral ought, reason, or permission, or as itself moral, so the weighing is of two elements of morality.
