      In an influential discussion Samuel Scheffler proposed grounding this competing factor in a claim about our nature as agents. We don’t, he argued, evaluate outcomes only from an impersonal point of view that ranks as best those containing the most total good. We also have a personal point of view that cares disproportionately about our own projects and good because they’re ours. An adequate moral view should reflect this duality in our psychology, or reflect the “independence of the personal point of view”, as it will if it grants agent-relative permissions (Scheffler 1982: 56–70)[^scheffler-1982]. A different justification says we need these permissions if our bodies, time, and resources are truly to belong to us, or to be under our authority. If we were required to sacrifice them whenever the benefit to others would be slightly greater, they would be no more ours than anyone else’s (Woollard 2015: 109–12)[^woollard-2015]. A related claim says it’s good if we have “moral autonomy”, or the freedom to make a wide range of choices among morally permissible options, something we wouldn’t have if there was a requirement always to maximize (Slote 1985: 23–34; Shiffrin 1991)[^shiffrin-1991][^slote-1985]. Or the permissions can reflect a moral status we’re said to have as unconditionally valuable. If we always had to do what will most promote the good, we would matter only as means to that good rather than as ends in ourselves: our being such ends requires some permission not to produce what’s best (Kamm 2007, 82; Lazar 2019a)[^kamm-2007][^lazar-2019a].
    step1: |-
      在一项有影响的讨论中，Samuel Scheffler 提出把这一竞争因素奠基于一个关于我们作为行动者之本性的主张。他论证说，我们并非只从一个把包含最多总体善的结果排为最佳的不偏不倚观点来评价结果。我们还有一个个人观点，对自己的计划与善抱有不成比例的关切，只因它们是我们的。一个充分的道德观点应反映我们心理中的这种二元性，或反映“个人观点的独立性”——若它授予行动者相对的允许，便会如此 (Scheffler 1982: 56–70)[^scheffler-1982]。另一种辩护说，如果我们的身体、时间与资源要真正属于我们、或处于我们的权威之下，就需要这些允许。若每当他人的利益略大一些就要求我们牺牲它们，它们就不再比别人的更属于我们 (Woollard 2015: 109–12)[^woollard-2015]。一个相关的主张说，若我们有“道德自主性”，即在道德上被允许的选项中作出广泛选择的自由，那是好的；若总有最大化的要求，我们便不会有这种自由 (Slote 1985: 23–34; Shiffrin 1991)[^shiffrin-1991][^slote-1985]。或者，这些允许可以反映我们作为无条件有价值者而被认为拥有的道德地位。若我们总须做最能促进善的事，我们就只作为那善的手段而重要，而非作为目的自身：我们之为目的自身，要求某种不产生最佳结果的允许 (Kamm 2007, 82; Lazar 2019a)[^kamm-2007][^lazar-2019a]。
    step2: |-
      在一项有影响的讨论中，Samuel Scheffler 主张把这一竞争因素奠基于一个关于我们作为行动者之本性的说法。他论证：我们并非只从不偏不倚的观点评价结果——那种观点把含最多总体善的结果列为最佳；我们还有一个个人观点，对自己的计划与善抱有不成比例的关切，只因它们属于我们。一个充分的道德观点应当反映我们心理中的这种二元性，即反映“个人观点的独立性”——只要它授予行动者相对的允许，便会如此 (Scheffler 1982: 56–70)[^scheffler-1982]。另一种辩护说：要使我们的身体、时间与资源真正属于我们、真正处于我们的支配之下，就需要这些允许。若每当他人所得略多就须牺牲它们，那它们就不再比别人的更属于我们 (Woollard 2015: 109–12)[^woollard-2015]。还有一种相关主张：拥有“道德自主性”——在道德上允许的选项中广泛选择的自由——是好事；若时时都被要求最大化，这种自由便无从谈起 (Slote 1985: 23–34; Shiffrin 1991)[^shiffrin-1991][^slote-1985]。或者，允许可以反映一种我们被认作无条件有价值者的道德地位：若我们总须做最能促进善之事，我们便只作为那善的手段而有分量，而非作为目的自身；我们之为目的自身，要求某种不做最佳之事的允许 (Kamm 2007, 82; Lazar 2019a)[^kamm-2007][^lazar-2019a]。
