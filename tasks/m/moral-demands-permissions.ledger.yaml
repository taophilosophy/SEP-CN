      A different argument says a view without permissions is in a certain sense self-contradictory. If you spend $1000 on pleasures for yourself rather than contribute it to saving others, such a view says you act wrongly. But if you contribute the $1000, those others can use it to gain pleasures or similar goods for themselves, which if it’s wrong in you must also be wrong in them. Yet surely you can’t be required to enable others to do something it would be wrong for you to do. This result is avoided, the argument says, if the others may spend some of what they receive on themselves, which means you too must be permitted to spend some of it on you (Cullity 2003, 2004)[^cullity-2003]. But this argument seems to conflate claims about the right and about the good. If you spend the $1000 on yourself, the pleasure you get, even if wrongly obtained, is still a good in your life. So is the others’ pleasure, if they spend the money on themselves, a good in theirs. And the pleasure they’ll get from the $1000 is greater than any you can get, since their material condition is worse. So even if your contributing the $1000 enables wrong acts by them, it produces more good, and so is morally preferable or closer to being right, than if you spent it on yourself (Arneson 2009)[^arneson-2009]. There may indeed be agent-relative permissions, but there’s no contradiction if there aren’t.
