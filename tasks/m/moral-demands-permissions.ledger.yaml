      认为竞争因素是一项应当或要求性理由的观点，概念上简单，因为它只使用一种规范性要素。在我将称为单阶段版本的观点中，这一观点把不偏不倚促进善的要求性理由与促进你自己善（或许还有亲近者之善）的类似理由直接相权衡。若两者之一更强，你必须照它行事；但若两者都不更强，经通盘考量你按任一者行事都是允许的 (Parfit 2011: 137–41)[^parfit-2011]。然而这一单阶段观点难以产生足够延展的允许。若你被允许在自己得一单位善与为他人得十单位善之间任选，你多半也常可以在自己得一与为他人得九或十一之间任选。但如果竞争理由有精确的权重，这就不可能。若你促进自己善的理由恰好十倍强于你的不偏不倚理由，那么只有当代价与收益之比恰为 1:10 时你才可以在两个行为中任选；若比值更大或更小，其中一理由更强，你就必须依它行事 (Kagan 1989: 374–75)[^kagan-1989]。为避免这一结果，该观点的支持者常说理由无法被精确权衡。存在一段不确定地带，在其中两者都不更强，却也不恰好等强；在这段地带内你可以依任一者行事 (Parfit 2011: 137)[^parfit-2011]。但虽然我们自己无法精确权衡理由这一点可信，要推出在一段延展范围内两个选择客观上都被允许——而不只是相对于我们的信念被允许——这一观点必须说理由事实上、或形而上学上并没有精确权重。而延展的客观允许真的依赖这一玄奥的客观不确定性主张吗？若规范真理完全精确，就没有这类允许了吗 (Hurka & Shubert 2012: 4)[^hurka-2012]？
