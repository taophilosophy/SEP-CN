      在“给促进善的义务补上一个可压过它的竞争因素”的另一版本里，该因素纯属允许性：它是一项关于你自己之善的、其他条件相同下的允许，或一个辩护性理由，而非应当、也不是要求性理由。Scheffler 曾提出其中一个版本：允许性因素是比较性的，即允许你给自己的善相对于他人之善多打些权重，比如多到十倍 (1982: 20)。另一个版本则把它设为一项更简单的允许——其他条件相同下促进你自己的善——并给这项允许一个权重 (Hurka & Shubert 2012; Muñoz 2021; Pummer 2023)[^hurka-2012][^muñoz-2021][^pummer-2023]。允许的权重若大于义务，你经通盘考量便可偏好自己较小的善而非他人较大的善；若不然，你就得做不偏不倚最好的事。“允许可以有权重”这想法或嫌生疏，却与义务的平行道理相映：其他条件相同下的义务，其力量在于倾向于使行为径直被要求；其他条件相同下的允许，其力量则在于倾向于使行为径直被允许。于是，一项促进你两单位善的允许强于只促进一单位的允许——因为它能压过后者压不过的某些义务。若你促进一单位自身善的允许强于促进一单位他人善之义务十倍，结果便如 Scheffler 所言：你经通盘考量可以偏好自己一单位之善，胜过他人多达十单位，但不可更多。
