      另一个相关的做法，是把促进善的义务立为康德所说的“不完善的”而非“完善的”义务。康德式不完善义务主要要求你采纳一个目的，而非实施某种行为；即便要求行为，也不指定具体动作，而是留给你一定“余地”，让你自行决定何时、以何种程度履行；并允许为偏好或欲望留些例外 (Kant 1797 [1964: 49, 54, 73–74, 112]; Kant 1785 [1997: 31n2]; see also Hill 1971)[^hill-1971][^kant-1785][^kant-1797]。第三点关于偏好，似已引入与义务相抗的竞争因素（正如第二条一般路径），此处可搁置；而第一点唯有在第二点（余地）成立时才区分出不完善义务，故余地当属首要特征。可若余地是“做多做少的余地” (Kant 1797 [1964: 54])[^kant-1797]——你有时可以选择不产生最佳结果——那么不完善义务就近乎满足性义务，会招致类似异议：在造福他人对你毫无或只有极小代价时，它也可允许你不为。一些不完善义务的捍卫者说，若你在代价极小时不造福他人，那说明你并未真正采纳仁爱这一目的 (Noggle 2009; Stohr 2011)[^noggle-2009][^stohr-2011]。但这等于说，你被允许不造福他人，是因为代价对你重大——这又滑回第二条路径（引入竞争因素），而非单纯削弱义务的第一条。康德的不完善义务确有独特的时间维度：满足性义务可读成要求你在每个时刻至少产出当时最大善的三分之二，康德却允许你有时分毫不产，只要长期总量合理。但撇开竞争因素不论，它依旧不管代价本身，结果便是：即便长期促进些许善就要求你作出巨大牺牲，强要求仍可能出现。
