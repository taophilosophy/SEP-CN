      This version of the second strategy is more complex conceptually than the one with only requiring reasons, since it uses two types of normative factor. But it’s hard to see this as a decisive flaw. “Ought” and “permitted” are mutually interdefinable, just like “necessary” and “possible”, and there’s no reason to see either as more fundamental. At the same time, this view is simpler structurally than some requiring-reason ones, especially two-stage ones, since it involves just one weighing and one assessment. With a merely permissive competing factor, moreover, it can yield an extended range of permissions even if this factor has a metaphysically precise weight. If your permission to promote a unit of your own good outweighs your duty to promote ten units for others, it also outweighs your duty to give nine, eight, or seven for others, and it does so even if ten is an exact cutoff. And since it involves only a permission other things equal, it also allows you to weigh your good equally against other people’s and so always allows you to do what’s impartially best. If its permissive factor reflects a personal point of view that, as Scheffler says, cares more about your good because it’s yours, it’s hard to see how it can allow agent-sacrifice (Slote 1985: 25)[^slote-1985]. But if that ambitious grounding is set aside, the view can give you a further permission to give your good somewhat less weight than other people’s, or a permission other thing equal not to promote your good, and this will generate agent-sacrificing permissions. The view will then allow you to depart from impartial beneficence in each of two directions, preferring either your own or another’s lesser good.
    step1: |-
      第二条策略的这一版本在概念上比只含要求性理由的版本更复杂，因为它使用两类规范性因素。但很难把这看作决定性的缺陷。“应当”与“被允许”相互可定义，正如“必然”与“可能”，没有理由认为哪一个更根本。同时，这一观点在结构上比某些要求性理由观点、尤其是两阶段观点更简单，因为它只涉及一次权衡和一次评估。此外，仅凭一个纯允许性的竞争因素，即便该因素具有形而上学上精确的权重，它也能产生延展范围的允许。若你促进一单位自身善的允许压过你为他人促进十单位的义务，它也同样压过为他人给九、八或七的义务，即便十是一个精确的界限。且由于它只涉及一项其他条件相同下的允许，它也允许你把自身之善与他人之善等量权衡，从而总允许你做不偏不倚最好的事。若其允许性因素反映的是 Scheffler 所说的个人观点——因其属于你而更关心你的善——那它很难允许牺牲行动者 (Slote 1985: 25)[^slote-1985]。但若搁置那一雄心勃勃的奠基，这一观点可以再给你一项允许，使你给自己的善比他人之善少些权重，或一项其他条件相同下不促进你自己善的允许；这会生成牺牲行动者的允许。于是该观点允许你在两个方向上偏离不偏不倚的仁爱：偏好自己较小的善，或偏好他人较小的善。
