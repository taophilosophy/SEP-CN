      This strategy supplements a maximizing or weaker duty to promote the good with a competing factor that considers the costs to you and that can sometimes outweigh the duty, making not acting as the duty directs, for example not producing the most good possible, all things considered permitted. The result is an “agent-relative permission” (Parfit 1978; Davis 1980)[^davis-1980][^parfit-1978] or “agent-centred prerogative” (Scheffler 1982)[^scheffler-1982] not to make certain sacrifices. This all-things-considered permission is agent-relative because the factor it rests on considers only the costs to you or perhaps to someone close to you. If it’s unavoidable that either you or two strangers will die, this factor allows you to save yourself even though sacrificing your life to save the others would preserve more good; saving them is permitted and even heroic but not required. The factor may also permit you to save your child rather than two strangers, though here some will say you have a positive duty to save your child and saving the strangers would be wrong. But if someone else can save either you or two strangers or your child or two strangers, they must save the strangers. The only costs relevant to a person’s choice are costs to him or to someone close to him; what it weighs against an impersonal duty is relativized or personal.
    step1: TBD
    step2: TBD
