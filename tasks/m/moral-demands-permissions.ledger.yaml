      This last issue aside, in views where the competing factor is merely permissive this factor is often seen as moral, or as a permission other things equal morality itself grants (e.g., Scheffler 1992: Ch. 2; Hurka & Shubert 2012)[^hurka-2012][^scheffler-1992]. It wouldn’t make much difference, however, if it were classified as non-moral. And because the factor is permissive, some further possibilities may be attractive that would be less so given a requiring one. Thus, instead of a constant weight, your permission other things equal to promote your good may have more weight when greater rather than lesser goods are at stake for you (Mulgan 2001: 152; Kamm 2007: 15–16; Pummer 2023: 22–23)[^kamm-2007][^mulgan-2001][^pummer-2023]. Thus, if benefiting others has a small cost for you, say just a headache, you may be permitted to avoid it only if the benefit to them is less than five times as great. But if the cost to you is, say, the loss of your legs or your life, you may be permitted to decline it if the benefit to others is less than twenty or thirty times as great, the larger absolute cost to you having greater relative weight. It may even be that, for some very large costs, you can never be required to accept them no matter how much good will result; thus, you may never be required to accept being tortured to death, even to save many lives. In addition, given a permissive factor the notion of cost may be extended. Instead of counting just standard harms to you, such as pains or losses of pleasure, it may also include limitations on your freedom, especially your freedom to make choices about the larger structure of your life. If a career that would benefit others a little more would be no more costly to you in standard terms than one that would benefit them a little less, you may nonetheless be permitted to choose the second career because of a permission other things equal to yourself determine your life’s main course (Shiffrin 1991; Pummer 2023: 27–30)[^pummer-2023][^shiffrin-1991]. This would be an autonomy- or freedom-based permission rather than one just about standard costs.
    step1: |-
      撇开最后这个问题，在竞争因素纯属允许性的观点中，这一因素常被视为道德的，即道德本身授予的一项其他条件相同下的允许 (e.g., Scheffler 1992: Ch. 2; Hurka & Shubert 2012)[^hurka-2012][^scheffler-1992]。不过，把它归为非道德的也不会有多大差别。而由于该因素是允许性的，某些进一步的可能性会显得有吸引力，而在要求性因素下则不那么有吸引力。例如，你其他条件相同下促进自己善的允许不必是恒定权重：当对你而言涉及更大的善时，它可能权重更大 (Mulgan 2001: 152; Kamm 2007: 15–16; Pummer 2023: 22–23)[^kamm-2007][^mulgan-2001][^pummer-2023]。于是，若造福他人对你只有小代价，比如只是头痛，那么只有当对他人的好处大于五倍时，你才被允许避开它。但若对你的代价是失去双腿或性命，那么只要对他人的好处小于二十或三十倍，你就可以拒绝，因为对你更大的绝对代价具有更大的相对权重。甚至可能的是，对某些极其巨大的代价，无论会产生多少善，你都不能被要求接受；因此，你可能永远不被要求接受被折磨至死，即便为救许多性命。此外，在允许性因素下，代价概念可以扩展。它不必只计入对你标准意义上的伤害，如痛苦或快乐的丧失，还可包括对你自由的限制，尤其是对你就人生较大结构作选择的自由的限制。若一份对他人好处略多的职业在标准意义上对你不比另一份好处略少的职业代价更大，你仍可能被允许选择第二份职业，因为有一项其他条件相同下由你自己决定人生主要走向的允许 (Shiffrin 1991; Pummer 2023: 27–30)[^pummer-2023][^shiffrin-1991]。这将是一项基于自主性或自由的允许，而非仅关标准代价的允许。
    step2: |-
      撇开最后这个问题不谈：在竞争因素纯属允许性的观点里，这一因素常被看作道德的，即道德本身所授的一项其他条件相同下的允许 (e.g., Scheffler 1992: Ch. 2; Hurka & Shubert 2012)[^hurka-2012][^scheffler-1992]；但即便把它归入非道德，差别也不大。正因该因素是允许性的，有些进一步的可能性便显诱人，换成要求性因素则不无勉强。比如，你促进自身之善的那项允许不必权重恒定：当涉及的对你而言是更大的善时，它的权重可能更大 (Mulgan 2001: 152; Kamm 2007: 15–16; Pummer 2023: 22–23)[^kamm-2007][^mulgan-2001][^pummer-2023]。若造福他人对你是小代价——比如不过一场头痛——那么只有在他人的好处大于五倍时，你才获许回避；若代价是失去双腿、甚至性命，那么只要他人的好处不到二十或三十倍，你便获许拒绝——因为对你而言更大的绝对代价，相对权重也更大。甚至可能：某些极其巨大的代价，无论能换来多少善，你都不该被要求接受——你可能永远不必接受被折磨至死，哪怕能救许多性命。此外，有了允许性因素，“代价”概念还可以扩宽：它不只计标准意义上的伤害（痛苦、快乐之丧失），还可包括对你自由的限制，尤其是对“安排人生较大格局”这一自由的限制。若一份对他人好处略多的职业，按标准尺度对你不比另一份稍逊的职业更费代价，你仍可能获许选择后者——凭的是一项其他条件相同下由你自己决定人生主干的允许 (Shiffrin 1991; Pummer 2023: 27–30)[^pummer-2023][^shiffrin-1991]。这便是一项基于自主或自由的允许，而非只关标准代价的允许。
