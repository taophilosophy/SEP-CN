      另一个版本诉诸对具体案例的直觉 (e.g., Singer 1972; Unger 1996)[^singer-1972][^unger-1996]。它先给出一个造福他人显得无可争议地被要求的情形——最著名的是 Peter Singer 的例子：你弄脏衣服便能救起池塘里溺水的孩子 (1972: 231)；再论证：许多人否认存在造福义务的情形（比如捐钱救济饥荒即可救命），与这一例子并无道德上的重要差别，因而同样含有要求——在那里你也必须牺牲自己的善。Singer 本人也承认，从池塘案例出发的辩护撑不起他偏好的那种完全最大化义务；那得先有一个“须牺牲双腿去救孩子、或牺牲性命去救两个孩子”的例子，而这类行为并非无可争议地被要求。但这一辩护若成功，足以支持一项比日常道德所承认的更强的援助义务：它使对慈善的实质性捐助不只是慷慨或超义务之举，而是严格意义上被要求的。
