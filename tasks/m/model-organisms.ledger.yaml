      Philosophical debates about surrogates and exemplars often focus on whether shared ancestry can justify extrapolating findings from one organism to another without treating the surrogate as a representation of the target (Levy and Currie 2015, Weisberg 2013)[^levy-2015][^weisberg-2013]. Ankeny and Leonelli note that this approach to model organisms relies more on organismal attributes (shared ancestry) and does not engage with the extensive body of scientific practice concerning how model organism research is done (Ankeny and Leonelli 2020, 56)[^ankeny-2020]. Moreover, appeal to shared ancestry alone is complicated when the organism and its target have distinct environmental histories. However, in the context of clinical and translational research, the philosophical discussion of surrogates has typically focused less on deep biological similarity and more on features that facilitate practical relevance. To discover the appropriateness of a surrogate for purposes of intervention and generalization, researchers will prioritize the display of relevant phenotypes or traits, physiological mechanisms or processes that are known to be homologous with humans, and focus on symptom expression rather than disease etiology (Bolker 2009)[^bolker-2009][^bolker-2009-2]. Consequently, even when the underlying causes of a disorder are unknown or not reproducible in an animal model, the presence of behaviorally or physiologically similar traits can justify the use of surrogate models within a translational framework.
    step1: |-
      关于替代物与范例的哲学争论，常常集中在共同祖先能否证成从一个生物外推到另一个生物，而不把替代物当作目标的表征（Levy and Currie 2015, Weisberg 2013）[^levy-2015][^weisberg-2013]。Ankeny 和 Leonelli 指出，这种处理模式生物的方式更多依赖生物属性（共同祖先），并未触及关于模式生物研究如何进行的广泛科学实践（Ankeny and Leonelli 2020, 56）[^ankeny-2020]。此外，当生物与其目标有着不同的环境史时，仅诉诸共同祖先就变得复杂了。然而，在临床与转化研究的语境中，关于替代物的哲学讨论通常较少关注深层的生物学相似，而更多关注那些促进实践相关性的特征。为了查明一个替代物对于干预与概括的目的是否恰当，研究者会优先考虑相关表型或性状的呈现、已知与人类同源的生理机制或过程，并把重点放在症状表现而非疾病病因上（Bolker 2009）[^bolker-2009][^bolker-2009-2]。因此，即便某种失调的根本原因未知或无法在动物模型中重现，行为上或生理上相似性状的存在，也足以在转化框架内证成替代模型的使用。
    step2: |-
      关于替代物与范例的哲学争论，多半集中在一点：共同祖先能否证成由此及彼的外推，而又不把替代物当成目标的表征（Levy and Currie 2015, Weisberg 2013）[^levy-2015][^weisberg-2013]。Ankeny 与 Leonelli 指出，这样处理模式生物，靠的多是生物属性（共同祖先），并没有碰到那大片关于模式生物研究究竟怎么做的科学实践（Ankeny and Leonelli 2020, 56）[^ankeny-2020]。再说，一旦生物与目标各有不同的环境史，单靠共同祖先就说不通了。不过在临床与转化研究的语境里，关于替代物的哲学讨论一向少谈深层的生物学相似，多谈那些能带来实践相关性的特征。要判断一个替代物对干预与概括是否合用，研究者先看的是：相关表型或性状有没有呈现，生理机制或过程是否已知与人类同源，重点则放在症状表现，而非疾病病因（Bolker 2009）[^bolker-2009][^bolker-2009-2]。所以，哪怕某种失调的根由尚不清楚、或无法在动物模型里重现，只要行为上或生理上有相似性状，在转化框架内就足以证成替代模型的使用。
