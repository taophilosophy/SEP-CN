      Strong representational accounts, such as Sartori’s, provide resources for extending the representational capacities of model organisms into new domains. Recent work draws on this framework to justify the use of novel model organisms in neuroscience, including in research on basal cognition systems (Rorot 2025 [Other Internet Resources]). Nonetheless, not all philosophers agree that thinking about model organisms as theoretical models provides the right framework for understanding what model organisms do epistemically. Some have instead sought the foundations of model organism research outside of a strongly representational account.
    step1: |-
      像 Sartori 这样强的表征论说明，为把模式生物的表征能力扩展到新领域提供了资源。晚近的研究借助这一框架，为在神经科学中使用新的模式生物作辩护，包括在基础认知系统研究中的使用（Rorot 2025 [其他网络资源]）。然而，并非所有哲学家都同意，把模式生物当作理论模型来思考，为理解模式生物在认知上做什么提供了正确的框架。有些人转而在一种强的表征论说明之外寻找模式生物研究的基础。
    step2: |-
      Sartori 这类较强的表征论说明，为把模式生物的表征能力拓展到新领域备下了资源。晚近就有研究借这套框架，为在神经科学里使用新的模式生物作辩护，基础认知系统方面的研究也在其列（Rorot 2025 [其他网络资源]）。不过，并非所有哲学家都认为，把模式生物当理论模型来想，就是理解其认知功用的正解。有人索性跳出强的表征论说明，另寻模式生物研究的根基。
