    source: |-
      Drawing from Ankeny and Leonelli’s account of model organisms, minimally, for a system to count as a model organism, it must stand in a modelling relation characterized by a representational scope and a representational target. Animal model organisms satisfy these conditions because they belong to well-defined biological groups with shared evolutionary histories, which constrain both the range of systems to which results can generalize and the features those results are taken to represent. By contrast, it is unclear what the representational scope or targets are meant to be for DNNs given their limitations as non-biological models with no shared evolutionary history (Scholte 2018)[^scholte-2018]. Furthermore, the causal mechanisms by which these models operate are only partially understood, making it difficult to specify which systems they represent and in what respect (Millière and Buckner 2024 [Other Internet Resources]). In many cases, the functions that are instantiated by artificial systems are explicitly engineered differently than those in the target system. Hardalupas (2021) argues because DNNs lack a principled basis for projection to a determinate class of organisms or phenomena, this renders their modelling status vague and limited and better classifies them as Krogh organisms. Rather than explicitly aimed at representing a target system, artificial organisms are problem-focused and a representational target that is narrow (Hardalupas 2021)[^hardalupas-2021]. In the absence of a shared material makeup, questions about the use of artificial model organisms as model organisms for cognitive and behavioral capacities rely on answering more fundamental questions about what is required for such capacities – specifically, whether intelligence, cognition, and complex behavior require a biological substrate at all (for more, see Bickle 2020)[^bickle-2020].
    step1: |-
      依据 Ankeny 和 Leonelli 对模式生物的说明，最低限度上，一个系统要被算作模式生物，就必须处在一种以表征范围与表征目标为特征的模式化关系之中。动物模式生物满足这些条件，因为它们属于有共同演化史的、界定明确的生物类群，而这既约束了结果可以概括到的系统范围，也约束了这些结果被认为表征的特征。相比之下，鉴于 DNN 作为没有共同演化史的非生物模型所具有的局限，它们所要的表征范围或表征目标究竟是什么，并不清楚（Scholte 2018）[^scholte-2018]。此外，这些模型运作所凭借的因果机制只被部分理解，这就难以指明它们表征哪些系统、在什么方面表征（Millière and Buckner 2024 [其他网络资源]）。在许多情形中，人工系统所例示的功能，其设计方式与目标系统中的功能明显不同。Hardalupas（2021）主张，由于 DNN 缺乏向某类确定生物或现象投射的原则性基础，这使其建模地位变得模糊而有限，更宜把它们归类为 Krogh 生物。人工生物并非明确以表征某个目标系统为旨归，而是以问题为焦点，其表征目标是狭窄的（Hardalupas 2021）[^hardalupas-2021]。在缺乏共同的物质构成的情况下，关于把人工模式生物当作认知与行为能力之模式生物的问题，取决于能否回答更根本的问题：这类能力究竟需要什么——具体说，智能、认知与复杂行为到底是否需要生物基质（更多讨论见 Bickle 2020）[^bickle-2020]。
    step2: |-
      照 Ankeny 与 Leonelli 对模式生物的说明，一个系统至起码得处在一种以表征范围与表征目标为特征的模式化关系里，才算模式生物。动物模式生物满足这条：它们属于界定明确、有共同演化史的生物类群，这既限定了结果能概括到哪些系统，也限定了这些结果被认为表征了哪些特征。反观 DNN，它没有共同演化史，只是非生物的模型，局限摆在那里，所谓表征范围、表征目标究竟指什么，就说不清了（Scholte 2018）[^scholte-2018]。再说，这类模型运作所凭的因果机制只弄懂了一部分，要说清它们表征哪些系统、在哪方面表征，就难（Millière and Buckner 2024 [其他网络资源]）。许多情形下，人工系统所例示的功能，设计上就跟目标系统里的功能不一样。Hardalupas（2021）主张，DNN 缺一条向某类确定生物或现象投射的原则性依据，其建模地位因此模糊而有限，不如归为 Krogh 生物。人工生物不以表征某个目标系统为明确旨归，它盯的是问题，表征目标也窄（Hardalupas 2021）[^hardalupas-2021]。既没有共同的物质构成，那么“人工模式生物能否充当认知与行为能力的模式生物”一问，就得先回答更根本的问题：这类能力到底需要什么——说白了，智能、认知与复杂行为是不是非要有生物基质不可（详见 Bickle 2020）[^bickle-2020]。
