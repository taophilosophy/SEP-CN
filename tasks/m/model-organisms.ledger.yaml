      AI models are also being increasingly used to reduce the hypothesis space for testing, using computational models and simulations to run scenarios that would not otherwise be possible. In this way, AI-based modeling of nonhuman model organisms has already led to new theoretical targets for testing, and the same logic now extends to humans, as scientists use task-performing AI models to reduce the space of what is neurobiologically plausible in people (Kriegeskorte and Douglas 2018)[^kriegeskorte-2018]. For behavioral and cognitive functions, the success of specific task-performing models, such as deep neural networks (DNNs) has begun to unsettle core tenets and theoretical frameworks, such as large language models (LLMs) challenging key tenets of generative linguistics in language research (Piantadosi 2024)[^piantadosi-2024]. On the other hand, more specialized convolutional neural networks (CNNs) have been used to generate biologically testable predictions, such as about how anatomical and physical constraints shape receptive fields in the vertebrate retina and primary visual cortex, and to reconcile competing views of retinal function (Lindsey et al. 2019 [Other Internet Resources]).
    step1: |-
      AI 模型也日益被用于缩小待检验的假设空间，即用计算模型与模拟来运行原本不可能进行的各种情景。这样，基于 AI 的非人模式生物建模已经引出新的待检验理论目标；同一逻辑如今延伸到人类，因为科学家用执行任务的 AI 模型来缩小在人身上神经生物学上可能的空间（Kriegeskorte and Douglas 2018）[^kriegeskorte-2018]。就行为与认知功能而言，深度神经网络（DNN）这类执行特定任务的模型取得了成功，已经开始动摇核心教条与理论框架，例如大语言模型（LLM）在语言研究中挑战生成语言学的关键教条（Piantadosi 2024）[^piantadosi-2024]。另一方面，更专门的卷积神经网络（CNN）已被用于生成可在生物学上检验的预测，例如关于解剖与物理约束如何塑造脊椎动物视网膜与初级视皮层中感受野的预测，并被用来调和关于视网膜功能的相互竞争的看法（Lindsey et al. 2019 [其他网络资源]）。
    step2: |-
      AI 模型还越来越常用来缩小待检验的假设空间：借用计算模型与模拟，跑起原本跑不成的种种情景。基于 AI 的非人模式生物建模，已经由此引出新的待检验理论目标；如今同一套逻辑伸到人身上，科学家用执行任务的 AI 模型，去压缩“在人身上神经生物学上说得通”的那片空间（Kriegeskorte and Douglas 2018）[^kriegeskorte-2018]。论行为与认知功能，深度神经网络（DNN）这类执行特定任务的模型一成功，就开始撼动核心教条与理论框架——比如大语言模型（LLM）在语言研究里挑战生成语言学的关键教条（Piantadosi 2024）[^piantadosi-2024]。另一方面，更专门的卷积神经网络（CNN）被用来生成可在生物学上检验的预测，例如解剖与物理约束怎样塑造脊椎动物视网膜与初级视皮层的感受野；还被用来调和关于视网膜功能的争执（Lindsey et al. 2019 [其他网络资源]）。
