  - id: 1
    kind: body
    source: |-
      Model organisms are a widely used component of contemporary biology and biomedicine. Although the term “model organism” gained formal recognition with the National Institutes of Health (NIH) in 2000 [Other Internet Resources], it has a longer history and has become increasingly widespread in both the sciences and philosophy. Today, definitions of model organisms vary, including which organisms considered count as model organisms. While biologists conceive of model organisms as experimental tools, philosophers have increasingly examined how model organisms count as scientific models in their own right, raising questions about how they represent other systems, the criteria that justify their selection, and the broader infrastructures and practices that sustain their epistemic and practical roles within scientific experimentation.
    step1: |-
      模式生物是当代生物学和生物医学中广泛使用的一个组成部分。虽然“模式生物”这一术语在 2000 年获得了美国国立卫生研究院（NIH）的正式认可[其他网络资源]，但它有着更长的历史，并且在科学和哲学中都日益普遍。今天，模式生物的定义各不相同，连哪些生物算作模式生物也是如此。生物学家把模式生物当作实验工具，而哲学家则越来越多地考察模式生物本身如何算作科学模型，由此提出种种问题：它们如何表征其他系统，证明其选择正当的标准是什么，以及哪些更广泛的基础设施与实践在科学实验中支撑着它们的认知角色与实践角色。
    step2: |-
      模式生物是当代生物学与生物医学研究中广泛使用的一类对象。“模式生物”一词在 2000 年得到美国国立卫生研究院（NIH）的正式认可[其他网络资源]，但它的历史更久，如今在科学界与哲学界都日益通行。今天，模式生物的定义并不统一，连哪些生物算模式生物也说法不一。生物学家把模式生物当作实验工具；哲学家则越来越多地追问，模式生物本身如何算得上是科学模型——它们怎样表征别的系统，选定它们的标准何在，又有哪些更广的基础设施与实践，撑着它们在科学实验中的认知角色与实用角色。
