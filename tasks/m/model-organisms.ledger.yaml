      As mentioned before (see section 2.2), a central challenge for mapping model organisms to their target systems concerns what’s known about the similarity between the model and its target. Determining which features are sufficiently similar between two biological systems to justify using one as a model for the other is not only a philosophical challenge, but also an empirical one. These empirical challenges are increasingly addressed by the use of various AI techniques in the biological sciences that can handle large datasets, permitting a kind of “discovery science” for model organism research (Wooley and Lin 2005)[^wooley-2005].
    step1: |-
      如前所述（见 2.2 节），把模式生物映射到其目标系统的一个核心挑战，关乎人们对模型与其目标之间相似性的所知。判定两个生物系统之间哪些特征足够相似、从而证成用其一作为另一的模型，不仅是哲学挑战，也是经验挑战。这些经验挑战正日益通过生物科学中各种能够处理大型数据集的 AI 技术得到应对，从而使模式生物研究有可能进行一种“发现科学”（Wooley and Lin 2005）[^wooley-2005]。
    step2: |-
      前面说过（见 2.2 节），把模式生物映射到目标系统，核心难题在于我们对模型与目标之间的相似所知多少。两个生物系统之间哪些特征足够相似、足以证成拿一个当另一个的模型，这既是哲学难题，也是经验难题。生物科学里那些能处理大型数据集的 AI 技术，正日益接手这些经验难题，使模式生物研究有望做成一种“发现科学”（Wooley and Lin 2005）[^wooley-2005]。
  - id: 84
    kind: body
    source: |-
      In model organism selection, for instance, AI techniques assist scientists’ selection of the appropriate model organism by providing high throughput comparisons of genomic, molecular, or phenotypic similarities between candidate models and their target systems (Tee 2025)[^tee-2025]. Innovations in molecular measurement techniques are also providing more detailed longitudinal recording across the development and lifespan of animals, revising the landscape of model organism research by requiring further temporal and spatial details for model mapping. For example, identifying specific timepoints over development and the organism’s lifespan where certain features align more closely between species can refine how model organisms are chosen and interpreted in research.
    step1: |-
      例如，在模式生物的选择中，AI 技术通过对候选模型与其目标系统之间的基因组、分子或表型相似性提供高通量比较，协助科学家选择合适的模式生物（Tee 2025）[^tee-2025]。分子测量技术的革新也在提供跨越动物发育与寿命的、更详细的纵向记录，通过要求为模型映射提供更精细的时间与空间细节，改变着模式生物研究的格局。例如，辨识发育与生物寿命中某些特征在物种之间更接近的特定时间点，可以改进研究中模式生物被选择与被解释的方式。
    step2: |-
      比如在选模式生物这件事上，AI 技术对候选模型与目标系统之间的基因组、分子、表型相似性做高通量比较，帮科学家挑出合适的模式生物（Tee 2025）[^tee-2025]。分子测量技术的革新，还能沿动物发育与寿命提供更细致的纵向记录；模型映射因而要求更精细的时间与空间细节，模式生物研究的格局也随之改变。举例说，若能认出在发育与寿命中哪些具体时间点上、物种之间的某些特征更为接近，选模式生物、解释模式生物的方式都能改进。
