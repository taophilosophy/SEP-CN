      Many scientists attribute epistemic value to model organisms while remaining agnostic about their representational status. In this way, model organisms can act as exemplars – examples that stand in for a broader class or lineage (Bolker 2009)[^bolker-2009][^bolker-2009-2] – or as model surrogates, which are meant to substitute for a specific biological target. Using surrogate models is widespread in the biomedical and biological sciences because it aligns with the NIH policy of using animal models as experimental stand-ins for humans for clinical and translational research. A surrogate model organism has some physical or functional similarity as a designated target organism or class of organisms. Here, animal systems become stand-ins for a target system because they offer greater epistemically tractability, as, for example, rodents do for certain human processes and traits in biomedical research (see Frigg and Hartmann 2025)[^frigg-2025]. Although using models as surrogates and exemplars are not mutually exclusive, model exemplars are not subject to the same demands as surrogates. Whereas surrogates need to be responsive to manipulations in the same way as would its target, exemplars represent a higher taxon (Bolker 2009)[^bolker-2009][^bolker-2009-2]. In other words, surrogates only need to match its representandum with respect to the processes narrowly relevant to one’s study (Creager, Lunbeck, and Wise 2007), whereas exemplars raise philosophical issues about the legitimacy of modeling an entire class or lineage. For example, *Drosophila melanogaster* is often treated as an exemplar of invertebrate genetics, or *Danio rerio* (zebrafish) as an exemplar of vertebrate embryonic development, rather than as surrogates for a particular species or condition.
    step1: |-
      许多科学家把认知价值归于模式生物，同时对其表征地位保持不作表态。这样，模式生物就可以充当范例——代表更广类别或谱系的例子（Bolker 2009）[^bolker-2009][^bolker-2009-2]——或者充当替代模型，后者意在代替某个特定的生物学目标。使用替代模型在生物医学与生物科学中十分普遍，因为它与 NIH 把动物模型用作人类临床与转化研究之实验替身的政策相一致。一个替代模式生物与某个指定目标生物或生物类别具有某种物理上或功能上的相似性。在这里，动物系统成为目标系统的替身，因为它们提供了更大的认知可操作性，例如在生物医学研究中，啮齿动物对某些人类过程与性状就是如此（见 Frigg and Hartmann 2025）[^frigg-2025]。尽管把模型用作替代物与用作范例并不互斥，模型范例并不承受与替代物相同的那些要求。替代物需要以与其目标相同的方式对操作作出反应，而范例代表的是一个更高的分类阶元（Bolker 2009）[^bolker-2009][^bolker-2009-2]。换言之，替代物只需在与研究狭义相关的那些过程上与它所代表者相匹配（Creager, Lunbeck, and Wise 2007），而范例则引出关于为整个类别或谱系建模之正当性的哲学问题。例如，黑腹果蝇（*Drosophila melanogaster*）常被当作无脊椎动物遗传学的范例，或者斑马鱼（*Danio rerio*）被当作脊椎动物胚胎发育的范例，而不是当作某个特定物种或病症的替代物。
    step2: |-
      许多科学家把认知价值归于模式生物，对它的表征地位却不置可否。这样用起来，模式生物可以充当范例——代表更广类别或谱系的例子（Bolker 2009）[^bolker-2009][^bolker-2009-2]——也可以充当替代模型，专为顶替某个特定的生物学目标。替代模型在生物医学与生物科学里用得极广，这与 NIH 的政策正相合：把动物模型当作人类的实验替身，做临床与转化研究。替代模式生物与所指定的目标生物或生物类别，总有几分物理上或功能上的相似。动物系统之所以能当目标系统的替身，是因为它们认知上更好操作——比如在生物医学研究里，啮齿动物之于某些人类过程与性状就是如此（见 Frigg and Hartmann 2025）[^frigg-2025]。把模型用作替代物和用作范例并不互斥，可范例要担的担子轻些。替代物得跟目标一样对操作作出反应；范例代表的却是更高的一个分类阶元（Bolker 2009）[^bolker-2009][^bolker-2009-2]。换句话说，替代物只需在与研究狭义相关的那些过程上与所代表者相合（Creager, Lunbeck, and Wise 2007）；范例却会牵出哲学问题：凭什么为整个类别或谱系建模？举例说，黑腹果蝇（*Drosophila melanogaster*）常被当作无脊椎动物遗传学的范例，斑马鱼（*Danio rerio*）常被当作脊椎动物胚胎发育的范例，都没被当成某一物种或病症的替代物。
