      ### 6.2 伦理意涵
  - id: 98
    kind: body
    source: |-
      The extensive use of animal systems in biomedical research, including the animal model organisms, has been the subject of criticism from proponents of animal ethics for decades (Franco 2013, Green 2024)[^franco-2013][^green-2024]. While acknowledging the scientific value of animal experimentation, William Russell and Rex Burch began advocating for more humane standards in animal experimentation in the 1950s (Russell and Burch 1959)[^russell-1959]. Their book, The Principles of Humane Experimental Technique, famously argued for the adoption of the 3Rs: Refine, Reduce, and Replace. Refinement of experimental practices sought to decrease the suffering of animals used in experiments, while reduction urged researchers to use as few animals as possible while still maintaining the quality of their experiment. Replacement urged the substitution of “non-sentient material” for “conscious living vertebrates” (Russell and Burch 1959)[^russell-1959]. The three Rs approach became widely accepted in the 1980s as a moderate path in animal ethics (Franco 2013)[^franco-2013]. Versions of it are now common parts of animal welfare policies, including those the European Commission.
    step1: |-
      动物系统在生物医学研究中的广泛使用，包括动物模式生物，数十年来一直是动物伦理倡导者批评的对象（Franco 2013, Green 2024）[^franco-2013][^green-2024]。在承认动物实验之科学价值的同时，William Russell 与 Rex Burch 于 20 世纪 50 年代开始倡导动物实验中更人道的标准（Russell and Burch 1959）[^russell-1959]。他们那本《人道实验技术原理》以主张采纳 3R 而著名，即优化、减少与替代。实验实践的优化力求减少所用动物的痛苦，减少则敦促研究者在维持实验质量的同时尽量少用动物，替代则敦促以“无感觉的材料”取代“有意识的活动脊椎动物”（Russell and Burch 1959）[^russell-1959]。3R 进路在 20 世纪 80 年代作为动物伦理中的一条温和路线而被广泛接受（Franco 2013）[^franco-2013]。如今其各种版本已成为动物福利政策的常见组成部分，包括欧盟委员会的相关政策。
    step2: |-
      动物系统在生物医学研究中的广泛使用，动物模式生物也在内，几十年来一直是动物伦理倡导者的批评靶子（Franco 2013, Green 2024）[^franco-2013][^green-2024]。William Russell 与 Rex Burch 一面承认动物实验的科学价值，一面从 20 世纪 50 年代起倡导更人道的实验标准（Russell and Burch 1959）[^russell-1959]。他们的《人道实验技术原理》因主张采纳 3R 而闻名：优化、减少、替代。优化，是设法减轻实验动物的痛苦；减少，是敦促研究者在保住实验质量的前提下尽量少用动物；替代，是敦促以“无感觉的材料”取代“有意识的活动脊椎动物”（Russell and Burch 1959）[^russell-1959]。3R 进路在 20 世纪 80 年代作为动物伦理中的一条温和路线被广泛接受（Franco 2013）[^franco-2013]。如今它的各种版本已是动物福利政策的常规内容，欧盟委员会的政策也在其列。
