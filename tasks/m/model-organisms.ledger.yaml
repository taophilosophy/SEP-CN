    source: |-
      Model organisms are themselves not completely “natural” things. Like most experimental organisms, model organisms have been highly standardized. Naturally occurring variability has been eliminated through the breeding programs of most model organism strains, so that some causal interventions will more reliably produce their effects. This standardization within and across laboratories imparts greater experimental control, making it easier for experimental results to travel and for results to be replicated and extended in other laboratories because of close similarities between the organisms used in each. Nicole Karafyllis refers to these kinds of results as “biofacts” that are both biological and artificial (Karafyllis 2003)[^karafyllis-2003]. This kind of standardization may be a feature of early stages in model organism development. According to Ankeny and Leonelli, “focus on highly standardised organisms in fully standardised environments”… “were key components of the (original) model organism repertoire” (Ankeny and Leonelli 2020, 66)[^ankeny-2020]. As research progresses, scientists are able to reintroduce the kinds of variability that were initially reduced by conditions of research that demand control. They are motivated to do so because highly standardized model organisms can be less representative of a range of targets (Ankeny 2010, Love & Travisano 2013)[^ankeny-2010][^love-2013]. For example, various strategies exist in the biomedical literature for re-exposing models to microbes to improve the quality of mouse models in preclinical translational research, with the argument that overly controlled experiments can lose epistemic power for clinical translation (Wallis 2025)[^wallis-2025]. In recent years, similar motivations have shaped work on model organisms in the behavioral neurosciences, where researchers seek to recover more ecologically rich behavior, arguing that non-“naturalistic” laboratory behavior may interfere with adequately understanding neural activity (Ulanovsky 2025)[^ulanovsky-2025]. Nonetheless, unlike preclinical biomedicine – where model targets such as immune responses or disease phenotypes that are relatively well specified – efforts to restore “naturalistic” experiments with model organisms in the behavioral neurosciences face epistemic problems related to the ‘unknown unknowns’ generated by the selection pressures of the laboratory contexts themselves (see section 2.2). Nemati argues that when behavior itself is the target, introducing ecological richness does not straightforwardly make model organisms more representative of wild type models. Instead, such approaches depend on new forms of technological and methodological standardization that stabilize model organism–environment interactions. As a result, attempts to make behavioral model organisms more “natural” simultaneously engineer what kinds of behaviors the model organism can express and be used to represent (Nemati 2026)[^nemati-2026].
    step1: |-
      模式生物本身并不是完全“自然的”东西。像大多数实验生物一样，模式生物已被高度标准化。自然发生的变异性已通过大多数模式生物品系的繁育计划而被消除，从而使某些因果干预更可靠地产生其效果。实验室内部与实验室之间的这种标准化，赋予了更大的实验控制，使实验结果更容易传播，也使结果更容易在其他实验室被复制和扩展，因为各实验室所用的生物彼此十分相似。Nicole Karafyllis 把这类结果称为“生物人工物”，它们既是生物的，又是人工的（Karafyllis 2003）[^karafyllis-2003]。这种标准化可能是模式生物发展早期阶段的一个特征。据 Ankeny 和 Leonelli 说，“关注处于完全标准化环境中的高度标准化生物”……“是（最初的）模式生物本领库的关键组成部分”（Ankeny and Leonelli 2020, 66）[^ankeny-2020]。随着研究推进，科学家能够重新引入最初因要求控制的研究条件而被减少的那类变异性。他们之所以这样做，是因为高度标准化的模式生物可能不那么能代表一系列目标（Ankeny 2010, Love & Travisano 2013）[^ankeny-2010][^love-2013]。例如，生物医学文献中存在各种策略，让模型重新接触微生物，以提高临床前转化研究中鼠标模型的质量，其论据是过度受控的实验可能丧失临床转化的认知力量（Wallis 2025）[^wallis-2025]。近年来，类似的动因塑造了行为神经科学中的模式生物研究，研究者在那里寻求恢复更丰富的生态行为，主张非“自然主义”的实验室行为可能妨碍对神经活动的充分理解（Ulanovsky 2025）[^ulanovsky-2025]。然而，与临床前生物医学不同——在后者的语境中，免疫反应或疾病表型这类模型目标相对而言已被较好地规定——在行为神经科学中恢复模式生物“自然主义”实验的努力，面临着与实验室语境本身的选择压力所生成的“未知的未知”相关的认知问题（见 2.2 节）。Nemati 主张，当行为本身就是目标时，引入生态丰富性并不会径直使模式生物更能代表野生型模型。相反，这类进路依赖于新的技术与方法标准化形式，来稳定模式生物与环境的互动。结果是，使行为模式生物更“自然”的尝试，同时也在设计模式生物可以表达、并可以被用来表征的行为种类（Nemati 2026）[^nemati-2026]。
    step2: |-
      模式生物本身也不是完全“自然”的东西。与大多数实验生物一样，模式生物已被高度标准化：多数品系通过繁育计划把自然发生的变异清除掉了，好让某些因果干预更可靠地见效。实验室之内、实验室之间的这种标准化带来了更强的实验控制，使实验结果更便于流通，也更容易在别的实验室复制、扩展——因为各家用的生物彼此十分相似。Nicole Karafyllis 把这类结果称为“生物人工物”：既是生物的，又是人工的（Karafyllis 2003）[^karafyllis-2003]。这种标准化，也许是模式生物发展早期的一个特征。Ankeny 与 Leonelli 说，“关注处于完全标准化环境中的高度标准化生物”……“是（最初的）模式生物本领库的关键组成部分”（Ankeny and Leonelli 2020, 66）[^ankeny-2020]。研究往前推进，科学家又能把当初为了控制而被削减的那类变异重新引进来。他们这么做，是因为高度标准化的模式生物可能不那么能代表一系列目标（Ankeny 2010, Love & Travisano 2013）[^ankeny-2010][^love-2013]。例如生物医学文献里就有各种办法，让模型重新接触微生物，以提高临床前转化研究中小鼠模型的质量，理由是实验控制得过死，反而会丢掉临床转化所需的认知力量（Wallis 2025）[^wallis-2025]。近年来，类似的动因也塑造着行为神经科学里的模式生物研究：研究者想找回更丰富的生态行为，认为非“自然主义”的实验室行为会妨碍对神经活动的充分理解（Ulanovsky 2025）[^ulanovsky-2025]。可是临床前生物医学跟这里情形不同——那边的模型目标（免疫反应、疾病表型之类）规定得比较清楚；行为神经科学想在模式生物身上恢复“自然主义”实验，却要面对认知上的麻烦，那麻烦恰恰由实验室语境自身的选择压力造出的“未知的未知”而来（见 2.2 节）。Nemati 主张，当行为本身就是目标时，添几分生态丰富性并不会径直让模式生物更能代表野生型模型；这类进路得靠新的技术与方法标准化，去稳住模式生物与环境的互动。结果是，把行为模式生物弄得更“自然”的尝试，同时也在设计模式生物能表达、能被用来表征哪些行为（Nemati 2026）[^nemati-2026]。
