      The ontology of organisms is complicated by recent efforts to use AI models to construct novel biological building blocks to generate novel model organisms, as well as novel behaviors (Kriegman et al. 2020)[^kriegman-2020]. These pipelines complicate the boundary of model organisms insofar as biological information guides cognitive and behavioral modeling, then the representational scope and targets of these artificially generated systems, including the basis for projecting their results to natural organisms, remain indeterminate.
    step1: |-
      生物的本体论因晚近用 AI 模型构造新颖生物学构件、以生成新颖模式生物及新颖行为的努力而变得复杂（Kriegman et al. 2020）[^kriegman-2020]。只要生物学信息引导着认知与行为建模，这些流程就搅乱了模式生物的边界；而这些人工生成的系统的表征范围与表征目标、包括把其结果投射到自然生物的依据，仍然是不确定的。
    step2: |-
      近来的尝试又给生物的本体论添了乱：用 AI 模型造出新颖的生物学构件，由此生成新颖的模式生物，还生成新颖的行为（Kriegman et al. 2020）[^kriegman-2020]。只要生物学信息在引导认知与行为建模，这些流程就把模式生物的边界搅糊涂了；而这些人工生成的系统，其表征范围与表征目标、连同把结果投射回自然生物的根据，都还没个准。
