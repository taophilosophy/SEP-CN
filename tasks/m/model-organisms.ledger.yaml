      Green, Dietrich, Leonelli, and Ankeny (2018) argue that what they call Krogh organisms can often constitute negative models. Building on the August Krogh’s selection of organisms with extreme adaptations for physiological research (see section 4.1), Green and her collaborators claim that “Krogh organisms are not selected for their representational scope or their similarity to other organisms; rather, they are selected because of distinct features that make a given trait (a mechanism in this case) more experimentally accessible” (Green et al. 2018, 65)[^green-2018]. The selection of the axon of the squid, *Loligo*, for instance, was based on how its very large size made voltage clamp techniques much easier for the scientists involved (Green et al. 2018, 64–65; Maxson Jones 2022)[^green-2018][^maxson-2022]. The transition from the extreme adaptations common in Krogh organisms to using them as negative models is “motivated by the hope that understanding why certain physiological limitations are not observed in selected species can offer insights into human physiological problems and potential solutions” (Green at al. 2018, 64)[^green-2018]. Even if the traits of these organisms have translational value, Krogh organisms usually do not serve as the basis for generalizations in the way that model organisms can.
    step1: |-
      Green、Dietrich、Leonelli 和 Ankeny（2018）主张，他们所称的 Krogh 生物常常可以构成负模型。在 August Krogh 为生理学研究挑选具有极端适应的生物（见 4.1 节）的基础上，Green 及其合作者主张：“Krogh 生物之被挑选，不是为了它们的表征范围或与其他生物的相似性；它们之被挑选，是因为某些独特特征使某一给定性状（此处指某种机制）在实验上更易通达”（Green et al. 2018, 65）[^green-2018]。例如，枪乌贼（*Loligo*）轴突之被选中，是因为它极大的尺寸使电压钳技术对相关科学家来说容易得多（Green et al. 2018, 64–65; Maxson Jones 2022）[^green-2018][^maxson-2022]。从 Krogh 生物中常见的极端适应，转向把它们用作负模型，其动因是“一种希望：理解某些生理局限为何在所选物种中观察不到，可以为人类的生理问题及其潜在解决办法提供洞见”（Green at al. 2018, 64）[^green-2018]。即便这些生物的性状具有转化价值，Krogh 生物通常也不像模式生物那样充当概括的基础。
    step2: |-
      Green、Dietrich、Leonelli 与 Ankeny（2018）主张，他们所说的 Krogh 生物常常可以构成负模型。August Krogh 当年专挑极端适应的生物做生理学研究（见 4.1 节）；Green 等人顺着这条线说：“Krogh 生物之被挑中，不为表征范围，也不为与其他生物相似；挑它们，是因为某些独特特征让某一给定性状（此处是某种机制）在实验上更好通达”（Green et al. 2018, 65）[^green-2018]。枪乌贼（*Loligo*）的轴突便是一例：它被选中，是因为那根轴突大得惊人，电压钳技术做起来容易许多（Green et al. 2018, 64–65; Maxson Jones 2022）[^green-2018][^maxson-2022]。从 Krogh 生物身上常见的极端适应，转到把它们当负模型用，其动因是“一种指望：弄明白某些生理局限为何在这些物种身上看不到，也许就能为人类的生理问题及其可能的解决办法提供线索”（Green at al. 2018, 64）[^green-2018]。就算这些生物的性状有转化价值，Krogh 生物通常也不像模式生物那样，能充当概括的根基。
