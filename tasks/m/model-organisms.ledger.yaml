      Table 2. Criteria for Organismal Choice (From Dietrich et al. 2020)[^dietrich-2020]
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      While these criteria were proposed as generally applicable to all organism choices, the decision to use a model organism is often justified by invoking a narrower set of similar features. For instance, according to Hans-Jörg Rheinberger, “the operative criteria for selection of a model organism are the ease with which it can be maintained and handled, the quantity and quality of the knowledge already accumulated about it, and the ease of access to the phenomenon under investigation” (Rheinberger 2010, 7)[^rheinberger-2010]. Love and Yoshida (2026) further another perspective from evolutionary developmental biology, where model species are chosen to balance experimental tractability with the ability to integrate developmental conservation and evolutionary change, highlighting how organism choice can serve both practical and theoretical aims. Ankeny and Leonelli provide a more extensive set of criteria that include ease of breeding and maintenance in the laboratory, standardization of the organism, accumulation of resources including database infrastructures, conferences, training workshops, and systems for the distribution of organismal stocks. These last kinds of features are important to them because they argue that one of the aims of model organism research includes the creation of “a platform for interdisciplinary integration across biological disciplines and a reference point for comparative research across species” (Ankeny and Leonelli 2020, 3)[^ankeny-2020]. Ease of phenomenal access is included in Ankeny and Leonelli’s account when they speak of the recognized usefulness of model organisms as tool for biological research. Of course, they also require that a model organism be capable of being applied to a broad set of representational targets.
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      ## 5. Artificial Intelligence and Model Organisms
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      The rise of artificially intelligent, or AI, systems in science also introduces new epistemic challenges for the evaluation and use of model organisms. As AI models increasingly improve on tasks such as pattern recognition and feature extraction, they begin to function as models both for improving the scientific study of model organisms and even as substitutes for the organisms themselves.
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      ### 5.1 AI as a “Discovery” Tool in Model Organism Research
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      As mentioned before (see section 2.2), a central challenge for mapping model organisms to their target systems concerns what’s known about the similarity between the model and its target. Determining which features are sufficiently similar between two biological systems to justify using one as a model for the other is not only a philosophical challenge, but also an empirical one. These empirical challenges are increasingly addressed by the use of various AI techniques in the biological sciences that can handle large datasets, permitting a kind of “discovery science” for model organism research (Wooley and Lin 2005)[^wooley-2005].
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      In model organism selection, for instance, AI techniques assist scientists’ selection of the appropriate model organism by providing high throughput comparisons of genomic, molecular, or phenotypic similarities between candidate models and their target systems (Tee 2025)[^tee-2025]. Innovations in molecular measurement techniques are also providing more detailed longitudinal recording across the development and lifespan of animals, revising the landscape of model organism research by requiring further temporal and spatial details for model mapping. For example, identifying specific timepoints over development and the organism’s lifespan where certain features align more closely between species can refine how model organisms are chosen and interpreted in research.
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      AI models are also being increasingly used to reduce the hypothesis space for testing, using computational models and simulations to run scenarios that would not otherwise be possible. In this way, AI-based modeling of nonhuman model organisms has already led to new theoretical targets for testing, and the same logic now extends to humans, as scientists use task-performing AI models to reduce the space of what is neurobiologically plausible in people (Kriegeskorte and Douglas 2018)[^kriegeskorte-2018]. For behavioral and cognitive functions, the success of specific task-performing models, such as deep neural networks (DNNs) has begun to unsettle core tenets and theoretical frameworks, such as large language models (LLMs) challenging key tenets of generative linguistics in language research (Piantadosi 2024)[^piantadosi-2024]. On the other hand, more specialized convolutional neural networks (CNNs) have been used to generate biologically testable predictions, such as about how anatomical and physical constraints shape receptive fields in the vertebrate retina and primary visual cortex, and to reconcile competing views of retinal function (Lindsey et al. 2019 [Other Internet Resources]).
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      Different AI techniques are also responsible for identifying genomic sequences that can be inserted from different model organisms to create new model systems – such as hybrid chimeras – that are ideal for answering specific scientific questions. These chimeric models can further serve as theoretical models to reduce the hypothesis space for testing in model organisms, as well as test what is minimally genomically necessary for specific biological functions (Green 2025)[^green-2025].
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
    source: |-
      ### 5.2 Artificial model “organisms”
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      The pervasiveness of AI models is not confined to their use in the scientific testing of model organisms; rather, AI models can be used as a substitute for organisms as well. Scientists have long used virtual animal models as tools for hypothesis generation in biology, such as using computational creatures to test evolutionary hypotheses (Sims 1994)[^sims-1994]. However, it is only in recent years that the behavioral performance of AI models – particularly, DNNs – have improved to such a degree that scientists are now using them as cognitive and behavioral models that stand in for both humans and nonhuman animals. For instance, researchers now place AI systems into roles structurally analogous to laboratory organisms by translating paradigms such as navigation, object permanence, and problem solving into virtual environments. Here, the artificial agents, rather than living animals, are trained and evaluated on a battery of cognitive tasks, undergoing standardized behavioral assays without any biological substrate (Crosby et al. 2020)[^crosby-2020]. This raises a question for using artificial models as model organisms, particularly in psychological and behavior research: do model organisms need to be living organisms, or can artificial models also serve as model organisms?
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      Drawing from Ankeny and Leonelli’s account of model organisms, minimally, for a system to count as a model organism, it must stand in a modelling relation characterized by a representational scope and a representational target. Animal model organisms satisfy these conditions because they belong to well-defined biological groups with shared evolutionary histories, which constrain both the range of systems to which results can generalize and the features those results are taken to represent. By contrast, it is unclear what the representational scope or targets are meant to be for DNNs given their limitations as non-biological models with no shared evolutionary history (Scholte 2018)[^scholte-2018]. Furthermore, the causal mechanisms by which these models operate are only partially understood, making it difficult to specify which systems they represent and in what respect (Millière and Buckner 2024 [Other Internet Resources]). In many cases, the functions that are instantiated by artificial systems are explicitly engineered differently than those in the target system. Hardalupas (2021) argues because DNNs lack a principled basis for projection to a determinate class of organisms or phenomena, this renders their modelling status vague and limited and better classifies them as Krogh organisms. Rather than explicitly aimed at representing a target system, artificial organisms are problem-focused and a representational target that is narrow (Hardalupas 2021)[^hardalupas-2021]. In the absence of a shared material makeup, questions about the use of artificial model organisms as model organisms for cognitive and behavioral capacities rely on answering more fundamental questions about what is required for such capacities – specifically, whether intelligence, cognition, and complex behavior require a biological substrate at all (for more, see Bickle 2020)[^bickle-2020].
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      The ontology of organisms is complicated by recent efforts to use AI models to construct novel biological building blocks to generate novel model organisms, as well as novel behaviors (Kriegman et al. 2020)[^kriegman-2020]. These pipelines complicate the boundary of model organisms insofar as biological information guides cognitive and behavioral modeling, then the representational scope and targets of these artificially generated systems, including the basis for projecting their results to natural organisms, remain indeterminate.
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      ## 6. Implications of Model Organism Research
    step1: TBD
    step2: TBD
  - id: 92
    kind: body
    source: |-
      Out of the nine million or so species available to scientists, even a generously inclusive list of model organisms is only going to constitute a very small sample of extant species. Considered from a phylogenetic standpoint, the NIH canonical model organisms are confined to a very small portion of the tree of life. If, on the one hand, the point of designating model organisms was for them to serve as models for human biomedicine, perhaps this restricted range of species is justified. On the other hand, if model organisms are conceived of as needing to represent a wider array of species and addressing questions beyond the confines of biomedicine, then perhaps their lack of biodiversity is a more serious concern.
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      ### 6.1 The Research Biodiversity Challenge
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      Some critics of model organism research argue that many of these canonical model organisms were chosen without sufficient attention to diversity of life forms available to study (Bolker 2019, Gest 1995, Hughes and Kaufman 2000, Gilbert 2009)[^bolker-2019][^gest-1995][^gilbert-2009][^hughes-2000]. Ralf Sommer, for instance, wrote, “All established model organisms represent just one of many species in a given taxa.… Also, these organisms do not represent the tree of life in a comprehensive way” (Sommer 2005)[^sommer-2005]. Others object to a presumption of generality regarding molecular processes that has led model organism researchers to discount the importance of variation and of comparison between species (Bolker 2012, 2019; Bolker and Raff 2009; Gest 1995; Jenner and Wills 2007; Gilbert 2009; Sedivy 2009; Sommer 2009, Farris 2020)[^bolker-2009][^bolker-2012][^bolker-2009-2][^farris-2020][^gest-1995][^gilbert-2009][^jenner-2007][^sedivy-2009][^sommer-2009]. Among the many proposed solutions to this narrow focus have been to sample more widely (Bolker 2012)[^bolker-2012], sample related but similar species (Sommer 2005)[^sommer-2005], sample species that “illustrate evo-devo’s conceptual themes” (Jenner and Wills 2007)[^jenner-2007], and to be more careful in extrapolating from one species to another (Budd 2012)[^budd-2012]. Another biologist has suggested disposing “of the terms ‘model’ and ‘non-model’ systems and adopt instead the more accurate term ‘research organism’” (Sánchez Alvarado 2018)[^sánchez-2018].
    step1: TBD
    step2: TBD
  - id: 95
    kind: body
    source: |-
      Documenting changes in organism used in biological research using bibliometric data, Dietrich, Ankeny, and Chen demonstrated that since 1960 there has been considerable growth in the use of most of the NIH canonical model organisms (Dietrich, Ankeny, and Chen 2014). Moreover, within the journal *Genetics* since 1960, the proportion of publication using non-model organisms has declined sharply. Although articles using non-model organisms comprise only 25% of the articles published in 2010, they account for 75% of the biodiversity in the journal’s articles. Overall, the diversity of species represented in the pages of Genetics is about the same between 1960 and 2010. The number of species (species richness) has actually increased since 1960, but that increase has come largely from non-model species (Dietrich, Ankeny, and Chen 2014). This overall increase in the diversity of organisms used in biological research has been further supported by an analysis of organism use trends in 817,239 publications (Pierson et al. 2017). However, Pierson and his collaborators note that this diversifying trend plateaued in the 1990s and that the instances of model organism use declined in their sample “from around 26–28% in the 1980s to around 21–22% in the 2010s.” Peirson and his collaborators conclude that their data calls into question “the widely held assumption that a small handful of model organisms have increasingly dominated biomedical research, causing declines in the diversity of experimental organisms in general” (Pierson et al. 2017). Earlier, Jamie Davies surveyed publications in developmental biology and argued that there is no clear dividing line between model and non-model organisms (Davies 2007)[^davies-2007]. He takes this to be evidence that there is no preference for model organisms, despite the fact that the most widely used organisms in development are model organisms (Davies 2007)[^davies-2007].
    step1: TBD
    step2: TBD
  - id: 96
    kind: body
    source: |-
      These analyses of trends in research biodiversity should not be taken to imply that the concerns of scientists asking for more attention to a wider range of organisms have been addressed. Most of the concerns raised regarding research biodiversity are made with reference to specific fields of research, such as evolutionary developmental biology. Overall trends and the trend in the journal *Genetics* may not accurately represent that of other fields within biology.
    step1: TBD
    step2: TBD
  - id: 97
    kind: body
    source: |-
      ### 6.2 Ethical Implications
    step1: TBD
    step2: TBD
  - id: 98
    kind: body
    source: |-
      The extensive use of animal systems in biomedical research, including the animal model organisms, has been the subject of criticism from proponents of animal ethics for decades (Franco 2013, Green 2024)[^franco-2013][^green-2024]. While acknowledging the scientific value of animal experimentation, William Russell and Rex Burch began advocating for more humane standards in animal experimentation in the 1950s (Russell and Burch 1959)[^russell-1959]. Their book, The Principles of Humane Experimental Technique, famously argued for the adoption of the 3Rs: Refine, Reduce, and Replace. Refinement of experimental practices sought to decrease the suffering of animals used in experiments, while reduction urged researchers to use as few animals as possible while still maintaining the quality of their experiment. Replacement urged the substitution of “non-sentient material” for “conscious living vertebrates” (Russell and Burch 1959)[^russell-1959]. The three Rs approach became widely accepted in the 1980s as a moderate path in animal ethics (Franco 2013)[^franco-2013]. Versions of it are now common parts of animal welfare policies, including those the European Commission.
    step1: TBD
    step2: TBD
  - id: 99
    kind: body
    source: |-
      Animal welfare considerations have a significant impact on model organism research because the most popular model organisms, mice and rats, are vertebrates and so are subject to calls for reduction and replacement. Additionally, efforts to close the translational gap between, for instance, mice, as models, and humans, as targets, has led to efforts to “humanize” mice (Davies 2012, Hyun 2019)[^davies-2012][^hyun-2019]. In these mouse model systems, a mouse bred to have a suppressed immune system has human cells or tissues introduced into their own tissues producing a human-mouse chimera (Stripecke et al. 2020)[^stripecke-2020]. These humanized mice are then used to study features of the immune system, metabolism, and/or pathologies, such as cancer (Stripecke et al. 2020, Green 2024)[^green-2024][^stripecke-2020]. The most controversial type of human-animal chimera, however, are human-animal neurological chimeras, such as those created when human glial progenitor cells were transplanted into neonatal mice and allowed to develop (Hyun 2019)[^hyun-2019]. From the standpoint of making an inference from model organism to its target, humanized mice can allow for more accurate comparisons based on shared features created through the process of humanization (Maugeri and Blasimme 2011)[^maugeri-2011]. However, these epistemic advantages trade-off against new ethical concerns. The chief ethical concern with these kinds of chimeras is that they would begin to have characteristics, including cognitive traits, that we consider to be important to moral status (Hyun 2019, Streiffer 2005, on the moral status of animals see Gruen and Monsó 2024)[^gruen-2024][^hyun-2019][^streiffer-2005]. An even stronger case for replacement then could be made for neurological chimeras.
    step1: TBD
    step2: TBD
  - id: 100
    kind: body
    source: |-
      The goal of replacing animal models may be admired and even mandated, but the successful replacement of animal models by non-animal models has also created a paradox. In the words of Hunter, “The paradox of model organisms seems to be that the need for them will only diminish once most of the fundamental mechanisms of biology have been solved to allow the greater use of both human tissue cultures and in silico methods for drug discovery. To reach that point, however, requires the extensive use of model organisms” (Hunter 2008, 719)[^hunter-2008]. Put another way, we are far from having enough knowledge of fundamental biological systems to be able to fully implement that knowledge into computer models and simulations. To get that necessary knowledge will require much more animal based research, so the goal of animal replacement may be laudable, but will not be fully realized in the near future.
    step1: TBD
    step2: TBD
  - id: 101
    kind: oir
