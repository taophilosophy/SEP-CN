      It is precisely this tension that Prieto and Fábregas-Tejeda (2025) aim to resolve in recent efforts to take a hybrid view to this representational/ non-representational debate. They side with non-representationalists in arguing that model organisms are not themselves models. At the same time, they agree that scientists routinely construct models of specific target phenomena using model organisms. Their proposal claims that model organisms are best understood not as models tout court but as material carriers of scientific models (Prieto and Fábregas-Tejeda 2025)[^prieto-2025]. On their account, organisms are physical systems from which researchers selectively abstract and interpret particular parts, mechanisms, or behaviors, and organize these into models of phenomena of interest. The model itself consists of the interpreted subset of organismal features (e.g., particular cellular mechanisms), not the whole organism (Prieto and Fábregas-Tejeda 2025)[^prieto-2025]. The carrier provides the experimental context, but only the interpreted parts are mapped onto the domain of interest and then used to represent phenomena in other organisms (Prieto and Fábregas-Tejeda 2025)[^prieto-2025]. This distinction helps reconcile traditional representationalist intuition that model organisms function like formal and mathematical models with the view that organisms are not models in themselves but support the construction of models by virtue of what researchers abstract and interpret from them.
