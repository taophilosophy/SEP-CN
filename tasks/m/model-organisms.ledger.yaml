      ## 4. The Multi-faceted Justification of Organism Choice
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      Biologists choose to work on only a fraction of the millions of species on this planet. Which organism a biologist chooses to use and their justification for that choice constitute the problem of organism choice. Biologists typically employ a range of practical and epistemic criteria for their choice. Model organisms are often seen as possessing a particular cluster of distinctive features that justifies their use in biology and medicine.
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      ### 4.1 Krogh Organisms
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      Among biologists, the criterion most frequently cited for organism choice is that of the Nobel Prize winning physiologist, August Krogh. Dubbed “Krogh’s Principle” in 1929, the principle states: “[f]or such a large number of problems there will be some animal of choice, or a few such animals, on which it can be most conveniently studied” (Krogh 1929, Krebs 1975, Krebs and Krebs 1980, Green et al. 2018)[^green-2018][^krebs-1975][^krebs-1980][^krogh-1929]. For instance, Krogh collaborated with Christian Bohr on lung function using the tortoise (Krogh 1929)[^krogh-1929]. Bohr had brought the tortoise to lung research because the branching of its trachea was much higher up in the neck than that of other vertebrates, which made it easier to independently study each lung in respiratory studies (Green et al. 2018)[^green-2018].
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      The kinds of organisms that Krogh favored in his research tended to have unique features that were often extreme adaptations. In contrast to model organisms, Green and her collaborators note that so-called Krogh organisms tend not to be standardized, do not have lasting infrastructures supporting their use, and most importantly tend to pick out a small set of specialized features as bearing on a particular research question (Green et al. 2018, 5–6)[^green-2018].
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      While Krogh’s principle is popular among biologists, a number of biologists and philosophers have moved beyond an appeal to convenience and proposed more fine-grained accounts of organism choice (Dietrich et al. 2020, Andrews and Enstipp 2016, Burian 1993, Clarke and Fujimura 1992, Gest 1995, Hopwood 2011, Robert 2008, Zallen 1993)[^andrews-2016][^burian-1993][^clarke-1992][^dietrich-2020][^gest-1995][^hopwood-2011][^robert-2008][^zallen-1993].
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      ### 4.2 Expanding the Range of Reasons for Model Organism Choice
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      The canonical model organisms were given special status by the NIH, which led to their prioritization among researchers for funding purposes. In a 2106 news post, Michael Lauer, the NIH’s Deputy Director for Extramural Research, discussed an internal NIH study that found that projects using model organisms were awarded grants at a rate that was higher than the rate for all NIH applications (Lauer 2016 [Other Internet Resources]). Increases in NIH and National Science Foundation (NSF) funding for specific organisms were also correlated with increases in publications (Dietrich, Ankeny, and Chen 2014, 792). Being designated a model organism thus seemed to be associated with both higher rates of funding and publication.
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      Although many federal grants supported laboratory research, several also funded community resources and infrastructure necessary for model organism work. Stock centers and databases for *Arabidopsis* and *C. elegans*, for instance, supported both the research of disparate laboratories and the creation of a sense of community among researchers using the same model organism (Leonelli and Ankeny 2012)[^leonelli-2012].
    step1: TBD
    step2: TBD
  - id: 73
    kind: body
    source: |-
      While cost has been an important factor in the selection of particular model organisms, this factor alone does not capture the complexity of these decisions, which are often multi-dimensional. Additionally, some model organisms are repurposed from other experimental contexts, chosen not only for their practical tractability but also for the availability of associated methods and infrastructure, even when they were originally studied for different purposes (Kaplan 2025)[^kaplan-2025]. Scientists will sometimes articulate the grounds for their choices explicitly. For instance, Isabel Rubio-Aliaga writes:
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      > Most model organisms are cost-effective: they have short regeneration times, their maintenance and reproduction in the laboratory is easy and standardized, they have small size and require little space. Moreover, model organisms have been chosen for their different basic biological properties and should reflect the underlying human-derived questions, i.e. have similar pathways and physiological/pathological responses. Most models have been chosen due to their practicability or physiological tractability. A good understanding of their metabolism and biochemistry facilitates data interpretation and extrapolation to humans and therefore their applicability (Rubio-Aliaga 2012, 17)[^rubio-aliaga-2012].
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      This mix of practical and biological reasons for organism choice is very common (Dietrich et al. 2020)[^dietrich-2020]. However, Rubio-Aliaga also includes important community features that support research on a specific organism. In her words, “the use of a model organism is reinforced by a large scientific community behind it, which promotes the interchange of knowledge and tools, such as mutant or bioinformatic resources” (Rubio-Aliaga 2012, 17)[^rubio-aliaga-2012]. These kinds of features figure prominently in Ankeny and Leonelli’s analysis of model organism success (Ankeny and Leonelli 2020, see section 3.3)[^ankeny-2020]. From scientists’ accounts, Dietrich and his collaborators articulated a list of twenty criteria (Table 2) that may be used in selection of an organism for biological research (Dietrich et al. 2020)[^dietrich-2020]. These criteria were grouped into five clusters: access, tractability, resourcing, economies, and promise. Choice of an organism using these clusters and criteria involves multiple criteria in a heavily contextualized judgement that may weigh criteria against each other and force researchers to refine their understanding of the criteria and the capabilities of the organisms under consideration.
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      *Table 2.*
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      | Cluster | Criteria |
      | --- | --- |
      | (A) Access | (1) Ease of Supply (2) Phenomenal Access (3) Ethical Considerations |
      | (B) Tractability | (4) Standardization (5) Viability and Durability (6) Responsiveness (7) Availability of Methods and Techniques (8) Researcher Risks |
      | (C) Resourcing | (9) Previous Use (10) Epistemic Resources (11) Training Requirements (12) Informational Resources |
      | (D) Economies | (13) Institutional Support (14) Financial Considerations (15) Community Support (16) Affective and Cultural Attributes |
      | (E) Promise | (17) Commercial and Other Applications (18) Comparative Potential (19) Translational Potential (20) Novelty |
    step1: TBD
    step2: TBD
