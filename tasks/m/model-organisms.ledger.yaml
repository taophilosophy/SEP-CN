      ### 3.1 Materiality, Abstraction, and Standardization of Model Organisms
    step1: |-
      ### 3.1 模式生物的物质性、抽象与标准化
    step2: |-
      ### 3.1 模式生物的物质性、抽象与标准化
  - id: 42
