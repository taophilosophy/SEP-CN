      Our focus has been on the positive mapping between models and targets, but there are also a plethora of model organisms used in research precisely because they lack specific diseases or physiological conditions observed in standard model systems. Known as negative models, these systems are frequently used in the context of clinical translation to understand the mechanisms of resistance when they fail to demonstrate physiological reactions to particular stimuli or diseases. Examples include the use of chimpanzees to study HIV pathogenesis (Veazey and Lackner 2017)[^veazey-2017], cats to study diabetes (Hoenig 2012)[^hoenig-2012], or pangolins to study Covid19 (Gupta et al. 2022)[^gupta-2022], as these models fail to develop conditions and symptoms of disease in the same way that humans do.
    step1: |-
      我们此前的焦点是模型与目标之间的正面映射，但还有大量模式生物被用于研究，恰恰因为它们缺少标准模式系统中所观察到的特定疾病或生理状况。这些系统称为负模型，常用于临床转化的语境，以理解当它们未能对特定刺激或疾病表现出生理反应时的抗性机制。例子包括用黑猩猩研究 HIV 发病机制（Veazey and Lackner 2017）[^veazey-2017]、用猫研究糖尿病（Hoenig 2012）[^hoenig-2012]，或用穿山甲研究 Covid19（Gupta et al. 2022）[^gupta-2022]，因为这些模型未能以人类相同的方式发展出疾病状况与症状。
    step2: |-
      此前的焦点，都放在模型与目标之间的正面映射上；可还有一大批模式生物之所以被用来研究，恰恰因为它们没有标准模式系统里那些特定的疾病或生理状况。这类系统叫负模型，常用于临床转化：当它们对特定刺激或疾病毫无生理反应时，正好借以弄清抗性机制。例子有用黑猩猩研究 HIV 发病机制（Veazey and Lackner 2017）[^veazey-2017]、用猫研究糖尿病（Hoenig 2012）[^hoenig-2012]、用穿山甲研究 Covid19（Gupta et al. 2022）[^gupta-2022]——这些模型都没能像人类那样发展出相应的疾病状况与症状。
