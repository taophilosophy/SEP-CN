      Animal welfare considerations have a significant impact on model organism research because the most popular model organisms, mice and rats, are vertebrates and so are subject to calls for reduction and replacement. Additionally, efforts to close the translational gap between, for instance, mice, as models, and humans, as targets, has led to efforts to “humanize” mice (Davies 2012, Hyun 2019)[^davies-2012][^hyun-2019]. In these mouse model systems, a mouse bred to have a suppressed immune system has human cells or tissues introduced into their own tissues producing a human-mouse chimera (Stripecke et al. 2020)[^stripecke-2020]. These humanized mice are then used to study features of the immune system, metabolism, and/or pathologies, such as cancer (Stripecke et al. 2020, Green 2024)[^green-2024][^stripecke-2020]. The most controversial type of human-animal chimera, however, are human-animal neurological chimeras, such as those created when human glial progenitor cells were transplanted into neonatal mice and allowed to develop (Hyun 2019)[^hyun-2019]. From the standpoint of making an inference from model organism to its target, humanized mice can allow for more accurate comparisons based on shared features created through the process of humanization (Maugeri and Blasimme 2011)[^maugeri-2011]. However, these epistemic advantages trade-off against new ethical concerns. The chief ethical concern with these kinds of chimeras is that they would begin to have characteristics, including cognitive traits, that we consider to be important to moral status (Hyun 2019, Streiffer 2005, on the moral status of animals see Gruen and Monsó 2024)[^gruen-2024][^hyun-2019][^streiffer-2005]. An even stronger case for replacement then could be made for neurological chimeras.
