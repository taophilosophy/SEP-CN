      These analyses of trends in research biodiversity should not be taken to imply that the concerns of scientists asking for more attention to a wider range of organisms have been addressed. Most of the concerns raised regarding research biodiversity are made with reference to specific fields of research, such as evolutionary developmental biology. Overall trends and the trend in the journal *Genetics* may not accurately represent that of other fields within biology.
    step1: |-
      这些关于研究生物多样性趋势的分析，不应被理解为：要求更多关注更广范围生物的科学家们的关切已经得到解决。关于研究生物多样性所提出的大多数关切，都是针对特定研究领域而发的，例如演化发育生物学。总体趋势以及《遗传学》杂志中的趋势，也许不能准确代表生物学中其他领域的情形。
    step2: |-
      这些关于研究生物多样性趋势的分析，不能理解为：那些呼吁多关注一些生物的科学家，其关切已经解决。关于研究生物多样性的大多数关切，都是对着特定研究领域说的，比如演化发育生物学。总体趋势也好，《遗传学》杂志里的趋势也罢，未必准确代表生物学其他领域的情形。
