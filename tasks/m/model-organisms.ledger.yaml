      Taken together, these approaches resist the idea that model organisms earn their epistemic status primarily by standing in representational relations to targets. Instead, they emphasize extrapolation, intervention, and material continuity as the basis for inference. Yet abandoning representation entirely leaves open an important question: how do scientists move from concrete experimental systems to claims about broader biological domains without some form of modeling relation?
