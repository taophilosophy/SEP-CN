      According to Hans-Jörg Rheinberger, research in biology always “begins with the choice of a system rather than with the choice of a theoretical framework” (Rheinberger 1997, 25)[^rheinberger-1997]. Of course, in biology, organisms are crucial components of those systems. One way to contextualize model organisms then is as components of experimental systems.
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      Rheinberger characterizes experimental systems as units of experimental activity that combine “local, technical, instrumental, institutional, social, and epistemic aspects.” (Rheinberger 1997, 238)[^rheinberger-1997]. Here, an experimental system is comprised of two components: epistemic things and experimental conditions (also referred to as scientific objects and technical objects). The former is the object of study and defined as a material thing that is subject to manipulation but is not fully known or characterized. The experimental conditions are created by a collection of technical objects that are well defined and often standardized. These objects partially stabilize the epistemic thing and in doing so limit its possible actions within the conditions of the experiment. Crucially they do not limit all of the possible outcomes, otherwise an experimental system would not be able to generate novel results and would be reduced to demonstrating already known results that were the products of that set of experimental conditions. As such, Rheinberger’s concept of an experimental system addresses the challenge of explaining how an experiment can be both controlled and able to generate novel results (Weber 2024)[^weber-2024].
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      Rheinberger applies his framework to many instances within the history of biology. Most notably for present purposes, in his book, *The Epistemology of the Concrete*, Rheinberger addresses five experimental systems built around organisms: Carl Corren’s research on *Pisum* and *Zea maize*, Max Hartmann’s research on *Eudorina elegans*, Alfred Kühn’s work on *Ephestia kühniella*, and the efforts in the Kaiser Wilhelm Institute for Virus Research to research Tobacco Mosaic Virus. Rheinberger assembles his discussion of these organisms under the heading of model organisms, by which he means: “a living thing from the plant, animal, or bacterial kingdom that has been tailored to experimental purposes; manipulating it can generate insights into the constitution, functioning, development, or evolution of an entire class of organisms” (Rheinberger 2010, 7)[^rheinberger-2010]. Rheinberger’s analysis does not focus on model organisms qua model, but as parts of experimental systems. From his analysis of these cases, Rheinberger notes a peculiar feature of model organisms; namely, that “as material supports for scientific work, they can survive the disappearance of entire research programs” (Rheinberger 2010, 8)[^rheinberger-2010]. His history of Tobacco Mosaic Virus certainly supports this claim. However, he also shows how research on Ephestia did not have the staying power that *Drosophila* did (Rheinberger 2010, 127)[^rheinberger-2010].
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      Gail Davies uses Rheinberger’s experimental systems to differentiate the standardization of a model organism from the standardization of the technical objects that comprise its experimental conditions (Davies 2013)[^davies-2013]. While her argument is developed for the case of mice as model organisms, it can be extrapolated to other model organisms. For Davies, there are two senses of standardization relevant to model organisms. The first is “the standardization of the animals around specific gene loci to develop replicable animal models of human diseases” (Davies 2013, 135)[^davies-2013]. This sense of standardization allows the mouse to function as a genetic tool. The second sense of standardization applies to parts of the experimental system. Davies argues that standards “for cage size and design, for husbandry procedures and operating protocols,” are necessary “so that the whole experimental systems can be replicated in different laboratory spaces” 2013, 136). Model organisms are both technical objects in an experimental system and partly epistemic things under investigation. This allows the experimental systems featuring model organisms to “replicate themselves whilst also remaining arrangements in which new kinds of knowledge can be generated” (Davies 2013, 136)[^davies-2013].
