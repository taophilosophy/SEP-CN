      Different AI techniques are also responsible for identifying genomic sequences that can be inserted from different model organisms to create new model systems – such as hybrid chimeras – that are ideal for answering specific scientific questions. These chimeric models can further serve as theoretical models to reduce the hypothesis space for testing in model organisms, as well as test what is minimally genomically necessary for specific biological functions (Green 2025)[^green-2025].
    step1: |-
      不同的 AI 技术还负责辨识可从不同模式生物插入、以创造新的模式系统——例如混合嵌合体——的基因组序列，这些新系统对回答特定科学问题极为理想。这些嵌合模型可以进一步充当理论模型，以缩小模式生物中待检验的假设空间，并检验特定生物学功能在基因组上最低限度需要什么（Green 2025）[^green-2025]。
    step2: |-
      还有些 AI 技术专管找出可从不同模式生物身上取来插入、以造出新模式系统的基因组序列——比如杂交嵌合体，这类系统最宜回答某些特定的科学问题。嵌合模型还能再当理论模型用：一方面缩小模式生物里待检验的假设空间，一方面检验某项生物学功能在基因组上最低限度需要什么（Green 2025）[^green-2025]。
