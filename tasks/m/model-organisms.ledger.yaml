      Levy and Currie (2015), for example, argue that model organisms are better understood as specimens rather than as theoretical models. On their view, experimental organisms are concrete biological samples drawn from a larger population, and the inferences scientists make from them depend on empirical extrapolation rather than representational mapping. These extrapolations are secured by background knowledge – such as phylogenetic relatedness, mechanistic conservation, and population structure – rather than by abstract keys linking model features to target features. Whereas theoretical models are typically characterized by explicit abstraction, idealization, and formal mapping rules, Levy and Currie emphasize that model organisms are contingent, embodied systems. The epistemic work they perform derives from their status as well-chosen biological specimens, not from their functioning as representational surrogates.
    step1: |-
      例如，Levy 和 Currie（2015）主张，模式生物更宜理解为标本，而非理论模型。在他们看来，实验生物是从更大种群中抽取的具体生物学样本，科学家由它们作出的推断依赖于经验外推，而非表征映射。这些外推由背景知识保证——例如系统发生亲缘关系、机制保守性和种群结构——而不是由把模型特征与目标特征联系起来的抽象键保证。理论模型通常以明确的抽象、理想化和形式映射规则为特征，而 Levy 和 Currie 强调，模式生物是偶然的、具身的系统。它们所履行的认知工作来自它们作为精心挑选的生物学标本的地位，而不是来自它们作为表征替代物的功能。
    step2: |-
      例如 Levy 与 Currie（2015）主张，模式生物更该理解为标本，而不是理论模型。在他们看来，实验生物是从更大种群中抽出的具体生物学样本，科学家由之作出的推断靠的是经验外推，不是表征映射。给这些外推作保的是背景知识——系统发生亲缘关系、机制保守性、种群结构等等——而不是把模型特征与目标特征联系起来的抽象键。理论模型通常带有明确的抽象、理想化与形式映射规则；Levy 与 Currie 偏要强调，模式生物是偶然的、具身的系统。它们所担的认知活儿，来自它们是精心挑选的生物学标本，而不是来自它们充当表征替代物。
