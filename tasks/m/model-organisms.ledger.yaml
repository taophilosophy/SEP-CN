      The canonical model organisms were given special status by the NIH, which led to their prioritization among researchers for funding purposes. In a 2106 news post, Michael Lauer, the NIH’s Deputy Director for Extramural Research, discussed an internal NIH study that found that projects using model organisms were awarded grants at a rate that was higher than the rate for all NIH applications (Lauer 2016 [Other Internet Resources]). Increases in NIH and National Science Foundation (NSF) funding for specific organisms were also correlated with increases in publications (Dietrich, Ankeny, and Chen 2014, 792). Being designated a model organism thus seemed to be associated with both higher rates of funding and publication.
    step1: |-
      经典模式生物被 NIH 赋予了特殊地位，这使它们在研究者当中为争取经费而被优先考虑。在 2016 年的一篇新闻帖中，NIH 负责院外研究的副主任 Michael Lauer 讨论了一项 NIH 内部研究，该研究发现使用模式生物的项目获得资助的比率高于全部 NIH 申请的比率（Lauer 2016 [其他网络资源]）。NIH 与国家科学基金会（NSF）对特定生物的经费增加，也与论文发表量的增加相关（Dietrich, Ankeny, and Chen 2014, 792）。因此，被认定为模式生物，似乎既与更高的经费获得率相关，也与更高的发表率相关。
    step2: |-
      经典模式生物经 NIH 认定，地位特殊，研究者在争经费时也因此被优先考虑。2016 年的一篇新闻帖里，NIH 主管院外研究的副主任 Michael Lauer 谈到一项 NIH 内部研究：用模式生物的项目，获资助的比率高于 NIH 全部申请的比率（Lauer 2016 [其他网络资源]）。NIH 与国家科学基金会（NSF）对某些特定生物的经费一旦增加，相关论文的发表量也跟着增加（Dietrich, Ankeny, and Chen 2014, 792）。这样看来，被认定为模式生物，既牵着更高的经费命中率，也牵着更高的发表率。
