      While Krogh’s principle is popular among biologists, a number of biologists and philosophers have moved beyond an appeal to convenience and proposed more fine-grained accounts of organism choice (Dietrich et al. 2020, Andrews and Enstipp 2016, Burian 1993, Clarke and Fujimura 1992, Gest 1995, Hopwood 2011, Robert 2008, Zallen 1993)[^andrews-2016][^burian-1993][^clarke-1992][^dietrich-2020][^gest-1995][^hopwood-2011][^robert-2008][^zallen-1993].
