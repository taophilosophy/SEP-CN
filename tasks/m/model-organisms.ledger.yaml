      The goal of replacing animal models may be admired and even mandated, but the successful replacement of animal models by non-animal models has also created a paradox. In the words of Hunter, “The paradox of model organisms seems to be that the need for them will only diminish once most of the fundamental mechanisms of biology have been solved to allow the greater use of both human tissue cultures and in silico methods for drug discovery. To reach that point, however, requires the extensive use of model organisms” (Hunter 2008, 719)[^hunter-2008]. Put another way, we are far from having enough knowledge of fundamental biological systems to be able to fully implement that knowledge into computer models and simulations. To get that necessary knowledge will require much more animal based research, so the goal of animal replacement may be laudable, but will not be fully realized in the near future.
