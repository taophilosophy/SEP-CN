      Rachel Ankeny and Sabina Leonelli embed model organisms in an extensive system, called a repertoire. As they first described it in 2015, a repertoire is “the ensemble of material and social conditions that makes it possible for a short-term collaboration, set up to accomplish a specific task, to give rise to relatively stable communities of researchers” (2015). Repertoires provide a context for model organism research that Ankeny and Leonelli use to explain how model organisms represent, why they are plausible models, and why certain canonical model organisms, such as *Drosophila*, *C. elegans*, and *Arabidopsis* have been so successful (Ankeny and Leonelli 2020, 40)[^ankeny-2020].
