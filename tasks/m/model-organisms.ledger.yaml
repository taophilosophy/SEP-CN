      Rachel Ankeny and Sabina Leonelli embed model organisms in an extensive system, called a repertoire. As they first described it in 2015, a repertoire is “the ensemble of material and social conditions that makes it possible for a short-term collaboration, set up to accomplish a specific task, to give rise to relatively stable communities of researchers” (2015). Repertoires provide a context for model organism research that Ankeny and Leonelli use to explain how model organisms represent, why they are plausible models, and why certain canonical model organisms, such as *Drosophila*, *C. elegans*, and *Arabidopsis* have been so successful (Ankeny and Leonelli 2020, 40)[^ankeny-2020].
    step1: |-
      Rachel Ankeny 和 Sabina Leonelli 把模式生物嵌入一个广泛的系统，称为本领库。如他们在 2015 年最初的描述，本领库是“使一项为完成特定任务而建立的短期合作得以产生相对稳定的研究者共同体的物质条件与社会条件的集合”（2015）。本领库为模式生物研究提供了一个语境，Ankeny 和 Leonelli 用它来解释模式生物如何表征、它们为何是可信的模型，以及为什么某些经典模式生物（如*Drosophila*、*C. elegans* 和 *Arabidopsis*）如此成功（Ankeny and Leonelli 2020, 40）[^ankeny-2020]。
    step2: |-
      Rachel Ankeny 与 Sabina Leonelli 把模式生物安放进一个广大的系统，叫作本领库。按他们 2015 年最初的描述，本领库是“使一项为完成特定任务而建立的短期合作得以生出相对稳定的研究者共同体的物质条件与社会条件的集合”（2015）。本领库为模式生物研究提供了语境，Ankeny 与 Leonelli 用它解释三件事：模式生物如何表征，它们为何是可信的模型，以及某些经典模式生物（*Drosophila*、*C. elegans*、*Arabidopsis* 之类）为何如此成功（Ankeny and Leonelli 2020, 40）[^ankeny-2020]。
  - id: 53
    kind: body
    source: |-
      For Ankeny and Leonelli, a repertoire is “a general framework for analysing the emergence, development, and evolution of particular ways of doing science,” which is focused on how researchers align “conceptual, material, logistical, and institutional” practices to create a plan for research that can be supported and sustained (2020, 41). As such a model organism repertoire includes (1) characteristics of the organism, such as it size, tractability, and its representational scope and target, (2) characteristics of the community, such as commitments to evolutionary conservation and data sharing as well as a source of long-term funding, and (3) characteristics of the broader landscape, such as institutional support for model organism research and a regulated system of exchange for materials, techniques, and data (see Table 1 for a complete list from Ankeny and Leonelli 2020, 41–42)[^ankeny-2020].
    step1: |-
      对 Ankeny 和 Leonelli 来说，本领库是“一个分析特定科研方式之出现、发展与演化的总体框架”，其焦点是研究者如何协调“概念的、物质的、后勤的与制度的”实践，以制定出一项能够得到支持与维持的研究计划（2020, 41）。因此，一个模式生物本领库包括：（1）生物的特征，如其大小、可操作性及其表征范围与表征目标；（2）共同体的特征，如对演化保守性与数据共享的承诺，以及长期资金的来源；（3）更广阔格局的特征，如对模式生物研究的制度性支持，以及材料、技术与数据的有规制的交换体系（完整清单见 Ankeny and Leonelli 2020, 41–42 的表 1）[^ankeny-2020]。
    step2: |-
      在 Ankeny 与 Leonelli 那里，本领库是“一个分析特定科研方式之出现、发展与演化的总体框架”，着眼点在研究者如何把“概念的、物质的、后勤的与制度的”实践协调起来，编出一份撑得住、维持得下的研究计划（2020, 41）。这样一个模式生物本领库包括三块：（1）生物的特征，如大小、可操作性、表征范围与表征目标；（2）共同体的特征，如对演化保守性与数据共享的承诺，以及长期经费的来源；（3）更大格局的特征，如对模式生物研究的制度性支持，以及材料、技术、数据之有规制的交换体系（完整清单见 Ankeny and Leonelli 2020, 41–42 表 1）[^ankeny-2020]。
  - id: 54
    kind: body
    source: |-
      As much as some philosophers may want to separate features included in a repertoire and deal with their favorites in isolation from the rest, Ankeny and Leonelli argue for their functional integration based on how science is practiced. With their own detailed historical studies of model organism development in *Arabidopsis* and *C. elegans* supporting their views, Ankeny and Leonelli argue that “without a combination of canny management by the stock centres, databases, and their users; public relations efforts by governmental funders across the globe; and regularly updated arguments about the role played by these resources in research development including new data-driven methods, these essential components of the repertoire would have disappeared along with much of the attraction of working with model organisms” (2020, 42, 45, Ankeny 2001, Leonelli 2007)[^ankeny-2001][^leonelli-2007]. Put another way, work at the community and broader landscape levels created the conditions necessary for model organisms, such as *Drosophila*, to have an incredible record of empirical scientific success. A growing track record of scientific successes also reinforced certain community practices. As a result, the model organism system and its community of users become intertwined or “co-constitutive” (Ankeny and Leonelli 2020, 45)[^ankeny-2020].
    step1: |-
      尽管有些哲学家可能想把本领库中的各项特征拆开，只挑自己喜欢的、与其余部分隔离开来处理，Ankeny 和 Leonelli 却依据科学实际如何被实践，主张它们功能上的一体化。Ankeny 和 Leonelli 以自己的详细历史研究支持其观点——对拟南芥与秀丽隐杆线虫模式生物发展的研究——并主张“若无种质资源中心、数据库及其使用者的精明管理，若无全球各地政府资助者的公共关系努力，若无关于这些资源在研究发展（包括新的数据驱动方法）中所扮角色的定期更新的论证，本领库的这些关键组成部分就会连同使用模式生物的大部分吸引力一道消失”（2020, 42, 45, Ankeny 2001, Leonelli 2007）[^ankeny-2001][^leonelli-2007]。换一种说法，共同体层面与更广阔格局层面的工作，为果蝇这样的模式生物创造出必要条件，使其拥有令人惊叹的经验科学成功记录。不断增长的科学成功记录也强化了某些共同体实践。结果，模式生物系统与其使用者共同体变得相互交织，或说“共同构成的”（Ankeny and Leonelli 2020, 45）[^ankeny-2020]。
    step2: |-
      有些哲学家或许想把本领库里的各项特征拆开来，挑自己喜欢的，与其余部分隔离开单独处理；Ankeny 与 Leonelli 不这么看，他们依据科学实际怎么被做，主张这些特征在功能上是一体的。他们拿自己对拟南芥与秀丽隐杆线虫模式生物发展的详细历史研究作支撑，说：“要是没有种质资源中心、数据库及其使用者的精明打理，没有全球各地政府资助者的公关努力，也没有关于这些资源在研究发展（含新的数据驱动方法）中所扮角色的定期更新的论证，本领库的这些关键部件就会连同使用模式生物的大部分吸引力一道消失”（2020, 42, 45, Ankeny 2001, Leonelli 2007）[^ankeny-2001][^leonelli-2007]。换个说法，共同体层面与更大格局层面的工作，替果蝇这样的模式生物备好了必要条件，它才挣下那一串惊人的经验科学成功记录。成功记录越积越多，某些共同体实践又被加固。于是模式生物系统与它的使用者共同体缠在一起，成了“共同构成的”（Ankeny and Leonelli 2020, 45）[^ankeny-2020]。
  - id: 55
    kind: body
    source: |-
      Each model organism has its own unique repertoire, even if they share some commonalities. This allows Ankeny and Leonelli to explain why the mouse repertoire is different from the *Drosophila* repertoire, for instance. Importantly, while repertoires are complex and contingent, not every organism develops or sustains one. Even some of the canonical model organisms, such as *Xenopus*, faltered in the development of its repertoire early on. Other organisms, such as planaria or axolotls, have been widely used in biological research, but, according to Ankeny and Leonelli, do not have all of the features found in the repertoires of the most successful model organisms. For them, this is a valid reason to not consider them as model organisms. Putting aside what gets to be called a model organism for a moment, Ankeny and Leonelli’s repertoire concept offers a way to explain the historical success and distinctiveness of the canonical model organisms. They have identified important features of scientific practice among different organismal systems that explain differences in research output and impact among organismal research communities.
    step1: |-
      每个模式生物都有自己独特的本领库，即便它们共享某些共同点。这使 Ankeny 和 Leonelli 能够解释，例如，为什么小鼠的本领库不同于果蝇的本领库。重要的是，虽然本领库是复杂而偶然的，却并非每个生物都能发展或维持一个本领库。甚至某些经典模式生物，如*Xenopus*，其本领库的发展早期也曾受挫。其他生物，如涡虫或美西螈，在生物学研究中曾被广泛使用，但据 Ankeny 和 Leonelli 说，并不具备最成功模式生物的本领库中所见的全部特征。对他们来说，这是不把它们视为模式生物的正当理由。暂且不论什么才配称为模式生物，Ankeny 和 Leonelli 的本领库概念提供了一种方式，来解释经典模式生物的历史成功与独特性。他们辨识出了不同生物系统中科学实践的重要特征，用以解释各生物研究共同体之间在研究产出与影响上的差异。
    step2: |-
      每个模式生物各有各的本领库，哪怕彼此有相通之处。Ankeny 与 Leonelli 借此解释，例如，小鼠的本领库为何不同于果蝇的。要紧的是，本领库尽管复杂而偶然，却并非每种生物都能长出、或维持住一个。连 *Xenopus* 这种经典模式生物，早年本领库的发展也曾卡住。涡虫、美西螈之类，在生物学研究里用得也广，可按 Ankeny 与 Leonelli 的说法，它们并不具备最成功模式生物本领库中的全部特征；在他们看来，这就是不把它们算作模式生物的正当理由。且不论什么才配叫模式生物，Ankeny 与 Leonelli 的本领库概念提供了一条路子，去解释经典模式生物的历史成功与独特性。他们从不同的生物系统中辨出科学实践的重要特征，用以说明各生物研究共同体在研究产出与影响上的差别。
