    kind: body
    source: |-
      For Ankeny and Leonelli, a repertoire is “a general framework for analysing the emergence, development, and evolution of particular ways of doing science,” which is focused on how researchers align “conceptual, material, logistical, and institutional” practices to create a plan for research that can be supported and sustained (2020, 41). As such a model organism repertoire includes (1) characteristics of the organism, such as it size, tractability, and its representational scope and target, (2) characteristics of the community, such as commitments to evolutionary conservation and data sharing as well as a source of long-term funding, and (3) characteristics of the broader landscape, such as institutional support for model organism research and a regulated system of exchange for materials, techniques, and data (see Table 1 for a complete list from Ankeny and Leonelli 2020, 41–42)[^ankeny-2020].
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      As much as some philosophers may want to separate features included in a repertoire and deal with their favorites in isolation from the rest, Ankeny and Leonelli argue for their functional integration based on how science is practiced. With their own detailed historical studies of model organism development in *Arabidopsis* and *C. elegans* supporting their views, Ankeny and Leonelli argue that “without a combination of canny management by the stock centres, databases, and their users; public relations efforts by governmental funders across the globe; and regularly updated arguments about the role played by these resources in research development including new data-driven methods, these essential components of the repertoire would have disappeared along with much of the attraction of working with model organisms” (2020, 42, 45, Ankeny 2001, Leonelli 2007)[^ankeny-2001][^leonelli-2007]. Put another way, work at the community and broader landscape levels created the conditions necessary for model organisms, such as *Drosophila*, to have an incredible record of empirical scientific success. A growing track record of scientific successes also reinforced certain community practices. As a result, the model organism system and its community of users become intertwined or “co-constitutive” (Ankeny and Leonelli 2020, 45)[^ankeny-2020].
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      Each model organism has its own unique repertoire, even if they share some commonalities. This allows Ankeny and Leonelli to explain why the mouse repertoire is different from the *Drosophila* repertoire, for instance. Importantly, while repertoires are complex and contingent, not every organism develops or sustains one. Even some of the canonical model organisms, such as *Xenopus*, faltered in the development of its repertoire early on. Other organisms, such as planaria or axolotls, have been widely used in biological research, but, according to Ankeny and Leonelli, do not have all of the features found in the repertoires of the most successful model organisms. For them, this is a valid reason to not consider them as model organisms. Putting aside what gets to be called a model organism for a moment, Ankeny and Leonelli’s repertoire concept offers a way to explain the historical success and distinctiveness of the canonical model organisms. They have identified important features of scientific practice among different organismal systems that explain differences in research output and impact among organismal research communities.
    step1: TBD
    step2: TBD
