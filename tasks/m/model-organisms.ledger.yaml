      Many discussions of model organisms similarly proceed without strong commitments to representation. Marcel Weber, for instance, emphasizes their epistemic value not in terms of representational scope or specimen status, but in their capacity to function as instruments for causal inference (Weber 2005)[^weber-2005]. Importantly, Weber stresses that speaking of model organisms as “tools” or “technological artifacts” must be understood metaphorically. Experimental organisms are not machines constructed by humans; they are evolved, living beings that have been modified, standardized, and stabilized to make experimental interventions possible. Practices such as inbreeding, genetic engineering, and cross-species gene transfer do not transform organisms into artifacts, but exemplify the experimental manipulation of natural objects (Weber 2024)[^weber-2024]. On this view, what gives model organisms their epistemic force is their ability to render causal structures accessible through controlled intervention, allowing scientists to identify and generalize causal relationships beyond the particular organism under study.
    step1: |-
      许多关于模式生物的讨论同样在没有对表征作出强承诺的情况下进行。例如，Marcel Weber 强调其认知价值不在于表征范围或标本地位，而在于它们作为因果推断工具的能力（Weber 2005）[^weber-2005]。重要的是，Weber 强调，把模式生物说成“工具”或“技术人工物”必须作隐喻理解。实验生物不是人造的机器；它们是经过演化、被修改、标准化并稳定下来、以使实验干预成为可能的活物。近亲繁殖、遗传工程和跨物种基因转移等实践并没有把生物变成人工物，而是例示了对自然对象的实验操作（Weber 2024）[^weber-2024]。在这种观点下，赋予模式生物认知力量的，是它们能够通过受控干预使因果结构变得可通达，使科学家能够识别并把因果关系推广到所研究的特定生物之外。
    step2: |-
      许多关于模式生物的讨论，同样没有对表征作什么强承诺。Marcel Weber 便是一例：他强调的不是表征范围，也不是标本地位，而是模式生物充当因果推断工具的能力（Weber 2005）[^weber-2005]。要紧的是，Weber 强调把模式生物说成“工具”或“技术人工物”，只能作隐喻解。实验生物不是人造的机器，而是演化而来、活生生的存在者，只是经过改造、标准化与稳定化，才使实验干预成为可能。近交、遗传工程、跨物种基因转移这类做法，并没有把生物变成人工物，而恰恰例示了对自然对象的实验操作（Weber 2024）[^weber-2024]。照这种看法，模式生物的认知力量在于：它们能借受控干预让因果结构变得可通达，使科学家得以识别因果关系，并把它推广到所研究的特定生物之外。
