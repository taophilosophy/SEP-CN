      ### 4.1 Krogh Organisms
    step1: |-
      ### 4.1 Krogh 生物
    step2: |-
      ### 4.1 Krogh 生物
  - id: 67
    kind: body
    source: |-
      Among biologists, the criterion most frequently cited for organism choice is that of the Nobel Prize winning physiologist, August Krogh. Dubbed “Krogh’s Principle” in 1929, the principle states: “[f]or such a large number of problems there will be some animal of choice, or a few such animals, on which it can be most conveniently studied” (Krogh 1929, Krebs 1975, Krebs and Krebs 1980, Green et al. 2018)[^green-2018][^krebs-1975][^krebs-1980][^krogh-1929]. For instance, Krogh collaborated with Christian Bohr on lung function using the tortoise (Krogh 1929)[^krogh-1929]. Bohr had brought the tortoise to lung research because the branching of its trachea was much higher up in the neck than that of other vertebrates, which made it easier to independently study each lung in respiratory studies (Green et al. 2018)[^green-2018].
    step1: |-
      在生物学家当中，选择生物时最常被引用的标准，来自诺贝尔奖得主、生理学家 August Krogh。该原则在 1929 年被称为“Krogh 原则”，其表述为：“对于如此之多的问题，总会有某种可供选择的动物，或少数几种这样的动物，可以在它们身上最方便地加以研究”（Krogh 1929, Krebs 1975, Krebs and Krebs 1980, Green et al. 2018）[^green-2018][^krebs-1975][^krebs-1980][^krogh-1929]。例如，Krogh 曾与 Christian Bohr 合作，用陆龟研究肺功能（Krogh 1929）[^krogh-1929]。Bohr 之所以把陆龟带入肺研究，是因为其气管分叉处在颈部的位置远高于其他脊椎动物，这使呼吸研究中分别研究每一叶肺变得更容易（Green et al. 2018）[^green-2018]。
    step2: |-
      生物学家谈选材，最常引的是诺奖得主、生理学家 August Krogh 的那条标准。1929 年它被称作“Krogh 原则”，说的是：“问题如此之多，总有某种可供选择的动物，或少数几种这样的动物，能让研究做得最方便”（Krogh 1929, Krebs 1975, Krebs and Krebs 1980, Green et al. 2018）[^green-2018][^krebs-1975][^krebs-1980][^krogh-1929]。举例说，Krogh 曾与 Christian Bohr 合作，用陆龟研究肺功能（Krogh 1929）[^krogh-1929]。Bohr 把陆龟带进肺研究，是因为它的气管分叉在颈部的位置比其他脊椎动物高得多，呼吸研究里要分别研究每一叶肺便容易些（Green et al. 2018）[^green-2018]。
  - id: 68
    kind: body
    source: |-
      The kinds of organisms that Krogh favored in his research tended to have unique features that were often extreme adaptations. In contrast to model organisms, Green and her collaborators note that so-called Krogh organisms tend not to be standardized, do not have lasting infrastructures supporting their use, and most importantly tend to pick out a small set of specialized features as bearing on a particular research question (Green et al. 2018, 5–6)[^green-2018].
    step1: |-
      Krogh 在其研究中青睐的那类生物，往往具有常属极端适应的独特特征。与模式生物相对照，Green 及其合作者指出，所谓的 Krogh 生物往往不被标准化，没有支撑其使用的持久基础设施，而最重要的是，往往只挑出一小组专门特征，使之与某个特定研究问题相关（Green et al. 2018, 5–6）[^green-2018]。
    step2: |-
      Krogh 在研究中偏爱的那些生物，往往有独特的特征，且常常是极端的适应。Green 等人拿它们与模式生物对照：所谓 Krogh 生物往往不经标准化，没有支撑其使用的持久基础设施；最要紧的是，它们通常只挑出一小组专门特征，用来对应某个特定研究问题（Green et al. 2018, 5–6）[^green-2018]。
