      Because there are many other uses for experimental organisms and because the term “model organism” is liberally used in biology, we find it appropriate to refer to all organisms that satisfy a modeling relation as model organisms, where model organisms serve as a source for a target. However, to preserve the variable ways in which model organisms acquire epistemic value, those satisfying single criteria, such as representation alone, may be referred to as minimal model organisms, whereas those accounts that define model organisms by multiple criteria can be referred to as complex model organisms (see Figure 1). More complex definitions of model organisms often include features such as the tractability of an organism, the infrastructure costs of maintaining such organisms, and the breadth of the organism’s representational scope. Many biologists define model organisms using a set of features (Russell et al. 2017, Farris 2020, Wittbrodt et al. 2002)[^farris-2020][^russell-2017][^wittbrodt-2002]. Some philosophers, however, seem to apply a simpler definition when they consider model organisms as models (Frigg 2023, 401; Sartori 2023, 1)[^frigg-2023][^sartori-2023]. The boundary between model organisms and non-model organisms is also not fixed, because an organism can serve as a model at one point in time and as non-model at some other point in time depending on its research context.
    step1: |-
      由于实验生物还有许多其他用途，而且“模式生物”一词在生物学中被宽松地使用，我们认为，把一切满足某种建模关系的生物都称为模式生物是恰当的，其中模式生物充当目标的来源。不过，为了保留模式生物获得认知价值的不同方式，那些只满足单一标准（例如仅满足表征）的，可以称为最低限度模式生物；而那些以多重标准界定模式生物的说明，则可以称为复杂模式生物（见图 1）。模式生物的更复杂定义往往包括这样的特征：生物的可操作性、维持这类生物的基础设施成本，以及该生物表征范围的广度。许多生物学家用一组特征来定义模式生物（Russell et al. 2017, Farris 2020, Wittbrodt et al. 2002）[^farris-2020][^russell-2017][^wittbrodt-2002]。然而，一些哲学家在把模式生物当作模型时，似乎采用了一种更简单的定义（Frigg 2023, 401; Sartori 2023, 1）[^frigg-2023][^sartori-2023]。模式生物与非模式生物之间的界限也不是固定的，因为一个生物可以在某一时点作为模型，在另一时点作为非模型，取决于其研究语境。
    step2: |-
      实验生物的用处很多，加上“模式生物”一词在生物学里用得宽松，我们不妨把一切满足某种建模关系的生物都叫作模式生物——它们充当目标之所本。不过，模式生物获得认知价值的方式各不相同，为保住这一点，那些只凭单一标准（例如单凭表征）就算数的，不妨称为最低限度模式生物；那些按多重标准来界定的说明，则称为复杂模式生物（见图 1）。模式生物的定义越复杂，越常把这类特征算进去：生物是否易于操作，维持它要花多少基础设施成本，以及它的表征范围有多宽。许多生物学家就用一组特征来定义模式生物（Russell et al. 2017, Farris 2020, Wittbrodt et al. 2002）[^farris-2020][^russell-2017][^wittbrodt-2002]。可有些哲学家在把模式生物当模型看时，用的却是更简单的定义（Frigg 2023, 401; Sartori 2023, 1）[^frigg-2023][^sartori-2023]。模式生物与非模式生物的界线同样不固定：同一生物可以在某个时点是模型，换个时点又不是，全看研究语境。
