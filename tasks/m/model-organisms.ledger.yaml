      Exploratory models gain their distinctiveness as tools that aim less at representing target systems faithfully and more at opening up new investigative pathways: generating novel questions, uncovering patterns, mapping out conceptual or empirical possibilities, helping identify fruitful directions for inquiry, and sometimes revealing overlooked aspects of phenomena (Weber 2024)[^weber-2024]. Axel Gelfert (2016) notes that these models are often deliberately simplified or idealized to the point that their epistemic value lies in four general functions: as a starting point for future inquiry, as a feature in proof-of-principle demonstrations, as a source of potential explanations of observed (types of) phenomena, and as a means of exploring the suitability of the target. With respect to model organisms, Juan Larraín argues that exploratory models also have a type of perspectival modelling function (2024). For example, in the context of early embryonic studies, Larraín notes that *C. elegans* enabled the mapping of a complete cell lineage and the discovery of apoptosis, while mice provided proof-of-principle demonstrations of regulative development and later revealed unexpected biases in early cell fate (2024). In both cases, their usefulness derived not from mirroring human development but from their capacity to support exploration and generate new vantage points that fostered new thinking about development. Exploratory models can be epistemically indispensable without making strong commitments about the representational content of the putative target systems.
    step1: |-
      探索性模型之所以独特，在于它们作为工具，较少着眼于忠实表征目标系统，而更多着眼于开辟新的探究路径：生成新问题、揭示模式、勾画概念上或经验上的可能性、帮助找出富有成果的探究方向，有时还揭示现象中被忽视的方面（Weber 2024）[^weber-2024]。Axel Gelfert（2016）指出，这些模型往往被有意简化或理想化，以致其认知价值在于四项一般功能：作为未来探究的起点，作为原理验证演示中的一个特征，作为对已观察到的（各类）现象之潜在解释的来源，以及作为探索目标是否合宜的手段。就模式生物而言，Juan Larraín 主张探索性模型还具有一种视角建模的功能（2024）。例如，在早期胚胎研究的语境中，Larraín 指出，秀丽隐杆线虫（*C. elegans*）使完整细胞谱系的绘制与细胞凋亡的发现成为可能，而小鼠则提供了调整型发育的原理验证演示，后来又揭示了早期细胞命运中意想不到的偏向（2024）。在这两种情形中，它们的用处都不来自映照人类发育，而来自它们支撑探索、生成新视角的能力，这些视角促成了关于发育的新思考。探索性模型可以在认知上不可或缺，而不对所设目标系统的表征内容作出强承诺。
    step2: |-
      探索性模型的独特之处，在于它们作为工具，志不在忠实表征目标系统，而在开辟新的探究路子：提出新问题、找出模式、勾画概念上或经验上的可能、帮着辨认有前途的探究方向，有时还能揭出被人忽略的现象侧面（Weber 2024）[^weber-2024]。Axel Gelfert（2016）指出，这类模型往往有意简化、理想化到这种地步：它们的认知价值就在四项一般功能上——作未来探究的起点，作原理验证演示里的一环，作已观察到的那类现象之潜在解释的来源，作试探目标是否合宜的手段。就模式生物来说，Juan Larraín 认为探索性模型还多一种视角建模的功能（2024）。比如在早期胚胎研究里，Larraín 指出，秀丽隐杆线虫（*C. elegans*）让完整细胞谱系的绘制和细胞凋亡的发现成为可能；小鼠则给出了调整型发育的原理验证演示，后来又揭出早期细胞命运里意想不到的偏向（2024）。两种情形下，它们的用处都不在映照人类发育，而在能支撑探索、生出新视角，而这些视角又催生了关于发育的新想法。探索性模型可以在认知上不可或缺，却不必对所设目标系统的表征内容许下什么强承诺。
