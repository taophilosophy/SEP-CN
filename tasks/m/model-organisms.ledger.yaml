    source: |-
      Biologists choose to work on only a fraction of the millions of species on this planet. Which organism a biologist chooses to use and their justification for that choice constitute the problem of organism choice. Biologists typically employ a range of practical and epistemic criteria for their choice. Model organisms are often seen as possessing a particular cluster of distinctive features that justifies their use in biology and medicine.
    step1: |-
      生物学家选择只研究这个星球上数百万物种中的一小部分。生物学家选择使用哪种生物、以及为该选择给出的理据，构成了生物选择问题。生物学家通常为其选择采用一系列实用的与认知的标准。模式生物常被认为具有一组独特的特征，从而证成了它们在生物学与医学中的使用。
    step2: |-
      这个星球上有数百万物种，生物学家只挑其中一小部分来做研究。挑哪一种生物、又凭什么挑，这就构成了生物选择问题。生物学家通常拿出一套实用的与认知的标准来挑。模式生物常被认为身上聚着一组与众不同的特征，正是这组特征证成了它们在生物学与医学中的用处。
  - id: 66
    kind: body
