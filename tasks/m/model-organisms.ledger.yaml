      This logic is paramount in the context of psychiatric and neurological research through the use of what scientist Georg Striedter has called endophenotypes (2022). Rather than attempt to reproduce the full complexity or causal history of a disorder such as schizophrenia or autism, researchers isolate intermediate traits – features such as deficits in working memory, altered social interaction, or impaired sensorimotor gating – that are measurable across species (Dietrich, DiMarco, Taylor, and Lewontin 2026). These endophenotypes serve as tractable targets for modeling and intervention, even when their connection to the underlying pathology remains uncertain. In this way, endophenotypes extend the logic of surrogate modeling by emphasizing epistemically useful symptoms over representational fidelity to disease origins.
    step1: |-
      这一逻辑在精神病学与神经学研究的语境中最为重要，靠的是科学家 Georg Striedter 所称的内表型（2022）。研究者不去试图重现精神分裂症或自闭症这类失调的全部复杂性或因果历史，而是分离出可在物种之间测量的中间性状——例如工作记忆缺陷、社会互动改变或感觉运动门控受损这类特征（Dietrich, DiMarco, Taylor, and Lewontin 2026）。这些内表型充当建模与干预的可操作目标，即便它们与底层病理的联系仍不确定。这样，内表型就通过强调认知上有用的症状、而非对疾病起源的表征忠实性，扩展了替代建模的逻辑。
    step2: |-
      这套逻辑在精神病学与神经学研究里最吃重，靠的就是科学家 Georg Striedter 所说的内表型（2022）。研究者并不打算把精神分裂症、自闭症这类失调的全部复杂性或因果来历都复制出来，而是挑出可在物种之间测量的中间性状——工作记忆缺陷、社会互动改变、感觉运动门控受损之类（Dietrich, DiMarco, Taylor, and Lewontin 2026）。这些内表型便成了建模与干预时好操作的目标，至于它们与底层病理的关联，仍可存疑。内表型就这样把替代建模的逻辑又推远一步：看重的是认知上有用的症状，而不是对疾病起源的表征忠实。
