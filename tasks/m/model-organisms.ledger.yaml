      Philosophical challenges to surrogate models focus less on perfect biological equivalence and more on what Bolker (2009) notes as the inherent incompleteness and disparity between model and target systems. Due to ‘unknown unknowns,’ surrogate models are shaped by selection pressures in laboratory contexts and empirical uncertainties about which biological aspects must be included for the model to remain relevant. These gaps reveal the limits of any model’s capacity to fully capture the target system’s complexity, although they are increasingly being addressed by the use of big data techniques in science (see section 5). Moreover, Weber (2014) highlights an important distinction in experimental modeling strategies: models that physically replicate the same kinds of processes found in their targets, and surrogate or ‘stand-in’ models that represent physically distinct processes but are nevertheless used as functional substitutes in laboratory settings. This distinction emphasizes that surrogate models do not require physical identity with their targets but instead operate as pragmatic tools that stand in for aspects of the system under study. Sara Green also outlines a more instrumental sense of surrogacy for model organisms where they serve as tools or living assays. Rabbits, for instance, used to be used as a means for pregnancy testing, only to be replaced by the frog, *Xenopus* (Gurdon and Hopwood 2000)[^gurdon-2000]. These animals were not models of human reproduction per se, but they were sensitive to human hormones, and their responses provided evidence of some of the human hormonal changes that accompany pregnancy (Green 2024)[^green-2024]. Generally, surrogate models exemplify a broader shift in experimental biology toward prioritizing measurable and manipulable traits over comprehensive reproduction of a target’s full biology. While surrogate models do not provide one-to-one representations, their utility lies in balancing practical relevance with the acknowledgment of inevitable epistemic gaps. This is a tension that underlies many contemporary strategies for designing and validating experimental models, as discussed below.
    step1: |-
      对替代模型的哲学挑战，较少关注完美的生物学等价，而更多关注 Bolker（2009）所指出的模型与目标系统之间固有的不完整与差异。由于存在“未知的未知”，替代模型受实验室语境中的选择压力塑造，也受关于哪些生物学方面必须纳入才能保持模型相关性的经验不确定性的塑造。这些缺口揭示了任何模型充分把握目标系统复杂性的能力之限度，尽管它们正日益通过科学中的大数据技术得到处理（见第 5 节）。此外，Weber（2014）强调了实验建模策略中的一项重要区分：在物理上复制其目标中所见同类过程的模型，以及在物理上表征不同过程、却仍被用作实验室环境中功能替代物的替代模型或“替身”模型。这一区分强调，替代模型并不要求与其目标在物理上同一，而是作为实用的工具，替身于所研究系统的某些方面。Sara Green 还勾勒出模式生物一种更具工具意味的替代性，即它们充当工具或活体测定。例如，兔子曾被用作妊娠检测的手段，后来才被蛙类（*Xenopus*）取代（Gurdon and Hopwood 2000）[^gurdon-2000]。这些动物本身并不是人类生殖的模型，但它们对人类激素敏感，其反应为伴随妊娠的某些人类激素变化提供了证据（Green 2024）[^green-2024]。总的来看，替代模型例示了实验生物学的一种更广的转向：优先看重可测量、可操作的性状，而不是对目标全部生物学的全面复制。替代模型虽不提供一对一的表征，其用处却在于把实践相关性与对不可避免的认知缺口的承认平衡起来。这一张力正是下文所讨论的许多当代实验模型设计与验证策略的底子。
    step2: |-
      对替代模型的哲学质疑，重点不在生物学上是否完全等价，而在 Bolker（2009）点出的那种模型与目标系统之间固有的不完整与落差。有“未知的未知”在，替代模型就被实验室语境里的选择压力塑形，也被一种经验上的不确定塑形：究竟哪些生物学方面必须纳入，模型才算仍然相关。这些缺口说明，任何模型要全盘把握目标系统的复杂性都有其限度，尽管科学中的大数据技术正日益着手处理它们（见第 5 节）。Weber（2014）还点出实验建模策略里的一项重要分别：一类模型在物理上复制目标中同种过程；另一类是替代模型或“替身”模型，它们表征的物理过程并不相同，却仍在实验室里充当功能替代品。这一分别说明，替代模型无需与目标物理同一，它只是实用的工具，替身于所研究系统的某些方面。Sara Green 还讲出模式生物一种更像工具的替代性：它们充当工具，或活体测定。兔子当年就用来做妊娠检测，后来才让位给蛙类（*Xenopus*）（Gurdon and Hopwood 2000）[^gurdon-2000]。这些动物本身算不上人类生殖的模型，但它们对人类激素敏感，反应便可作为伴随妊娠的某些人类激素变化的证据（Green 2024）[^green-2024]。总体看，替代模型例示了实验生物学的一个更大转向：优先要可测量、可操作的性状，而不是把目标的全部生物学整个复制出来。替代模型给不出一对一的表征，其用处恰在于把实践相关性与对认知缺口的坦然承认摆平——那缺口是躲不掉的。这个张力，正是下文许多当代实验模型设计与验证策略的底子。
