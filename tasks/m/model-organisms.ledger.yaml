      Some critics of model organism research argue that many of these canonical model organisms were chosen without sufficient attention to diversity of life forms available to study (Bolker 2019, Gest 1995, Hughes and Kaufman 2000, Gilbert 2009)[^bolker-2019][^gest-1995][^gilbert-2009][^hughes-2000]. Ralf Sommer, for instance, wrote, “All established model organisms represent just one of many species in a given taxa.… Also, these organisms do not represent the tree of life in a comprehensive way” (Sommer 2005)[^sommer-2005]. Others object to a presumption of generality regarding molecular processes that has led model organism researchers to discount the importance of variation and of comparison between species (Bolker 2012, 2019; Bolker and Raff 2009; Gest 1995; Jenner and Wills 2007; Gilbert 2009; Sedivy 2009; Sommer 2009, Farris 2020)[^bolker-2009][^bolker-2012][^bolker-2009-2][^farris-2020][^gest-1995][^gilbert-2009][^jenner-2007][^sedivy-2009][^sommer-2009]. Among the many proposed solutions to this narrow focus have been to sample more widely (Bolker 2012)[^bolker-2012], sample related but similar species (Sommer 2005)[^sommer-2005], sample species that “illustrate evo-devo’s conceptual themes” (Jenner and Wills 2007)[^jenner-2007], and to be more careful in extrapolating from one species to another (Budd 2012)[^budd-2012]. Another biologist has suggested disposing “of the terms ‘model’ and ‘non-model’ systems and adopt instead the more accurate term ‘research organism’” (Sánchez Alvarado 2018)[^sánchez-2018].
    step1: |-
      一些模式生物研究的批评者主张，这些经典模式生物中有许多在被选中时，并未充分注意可用于研究的生命形式的多样性（Bolker 2019, Gest 1995, Hughes and Kaufman 2000, Gilbert 2009）[^bolker-2019][^gest-1995][^gilbert-2009][^hughes-2000]。例如，Ralf Sommer 写道，“所有已确立的模式生物都只是某一分类单元中众多物种之一……而且，这些生物并不以全面的方式代表生命之树”（Sommer 2005）[^sommer-2005]。另一些人则反对一种关于分子过程之普遍性的预设，这种预设使模式生物研究者低估了变异以及物种之间比较的重要性（Bolker 2012, 2019; Bolker and Raff 2009; Gest 1995; Jenner and Wills 2007; Gilbert 2009; Sedivy 2009; Sommer 2009, Farris 2020）[^bolker-2009][^bolker-2012][^bolker-2009-2][^farris-2020][^gest-1995][^gilbert-2009][^jenner-2007][^sedivy-2009][^sommer-2009]。针对这一狭隘焦点提出的许多解决办法包括：更广泛地取样（Bolker 2012）[^bolker-2012]、取亲缘相近但相似的物种（Sommer 2005）[^sommer-2005]、取“体现演化发育生物学概念主题”的物种（Jenner and Wills 2007）[^jenner-2007]，以及在从一个物种外推到另一个物种时更加谨慎（Budd 2012）[^budd-2012]。另一位生物学家建议摒弃“‘模式’与‘非模式’系统的说法，改采更准确的术语‘研究生物’”（Sánchez Alvarado 2018）[^sánchez-2018]。
    step2: |-
      模式生物研究的一些批评者认为，这些经典模式生物里有许多当初被挑中时，并没有充分顾及可用于研究的生命形式有多多样（Bolker 2019, Gest 1995, Hughes and Kaufman 2000, Gilbert 2009）[^bolker-2019][^gest-1995][^gilbert-2009][^hughes-2000]。Ralf Sommer 就说，“所有已确立的模式生物，都只是某一分类单元里众多物种之一……再说，这些生物也未能全面地代表生命之树”（Sommer 2005）[^sommer-2005]。另一些人反对一种关于分子过程之普遍性的预设，正是这种预设让模式生物研究者看轻了变异、看轻了物种之间的比较（Bolker 2012, 2019; Bolker and Raff 2009; Gest 1995; Jenner and Wills 2007; Gilbert 2009; Sedivy 2009; Sommer 2009, Farris 2020）[^bolker-2009][^bolker-2012][^bolker-2009-2][^farris-2020][^gest-1995][^gilbert-2009][^jenner-2007][^sedivy-2009][^sommer-2009]。针对这种狭隘，提出的办法不少：扩大取样面（Bolker 2012）[^bolker-2012]；取亲缘近而相似的物种（Sommer 2005）[^sommer-2005]；取“能体现演化发育生物学概念主题”的物种（Jenner and Wills 2007）[^jenner-2007]；从一个物种外推到另一个物种时更审慎（Budd 2012）[^budd-2012]。还有一位生物学家主张，干脆弃用“‘模式’与‘非模式’系统”的说法，改用更准确的术语“研究生物”（Sánchez Alvarado 2018）[^sánchez-2018]。
