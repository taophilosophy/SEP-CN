      This mix of practical and biological reasons for organism choice is very common (Dietrich et al. 2020)[^dietrich-2020]. However, Rubio-Aliaga also includes important community features that support research on a specific organism. In her words, “the use of a model organism is reinforced by a large scientific community behind it, which promotes the interchange of knowledge and tools, such as mutant or bioinformatic resources” (Rubio-Aliaga 2012, 17)[^rubio-aliaga-2012]. These kinds of features figure prominently in Ankeny and Leonelli’s analysis of model organism success (Ankeny and Leonelli 2020, see section 3.3)[^ankeny-2020]. From scientists’ accounts, Dietrich and his collaborators articulated a list of twenty criteria (Table 2) that may be used in selection of an organism for biological research (Dietrich et al. 2020)[^dietrich-2020]. These criteria were grouped into five clusters: access, tractability, resourcing, economies, and promise. Choice of an organism using these clusters and criteria involves multiple criteria in a heavily contextualized judgement that may weigh criteria against each other and force researchers to refine their understanding of the criteria and the capabilities of the organisms under consideration.
    step1: |-
      这种把实践理由与生物学理由混合起来的选材方式非常普遍（Dietrich et al. 2020）[^dietrich-2020]。不过，Rubio-Aliaga 也纳入了支持某一特定生物研究的重要共同体特征。用她的话说，“一种模式生物的使用，得到其背后庞大科学共同体的加强，这个共同体促进知识与工具的交流，例如突变体资源或生物信息学资源”（Rubio-Aliaga 2012, 17）[^rubio-aliaga-2012]。这类特征在 Ankeny 和 Leonelli 对模式生物成功的分析中十分突出（Ankeny and Leonelli 2020，见 3.3 节）[^ankeny-2020]。根据科学家们的陈述，Dietrich 及其合作者阐发了一张二十条标准的清单（表 2），可用于为生物学研究选择生物（Dietrich et al. 2020）[^dietrich-2020]。这些标准被归为五个簇：获取、可操作性、资源供给、经济性与前景。运用这些簇与标准来选择一种生物，涉及在高度语境化的判断中使用多重标准，这种判断可能要把各项标准相互权衡，并迫使研究者修正其对标准以及所考虑生物之能力的理解。
    step2: |-
      把实践理由与生物学理由掺在一起选材，是极常见的做法（Dietrich et al. 2020）[^dietrich-2020]。不过 Rubio-Aliaga 还点出了支撑某一生物研究的重要共同体特征。她说，“一种模式生物的使用，背后有庞大的科学共同体在撑，这个共同体推动知识与工具的互通，比如突变体资源、生物信息学资源”（Rubio-Aliaga 2012, 17）[^rubio-aliaga-2012]。这类特征在 Ankeny 与 Leonelli 对模式生物何以成功的分析里十分吃重（Ankeny and Leonelli 2020，见 3.3 节）[^ankeny-2020]。Dietrich 等人依科学家们的自述，整理出一张二十条标准的清单（表 2），可用于为生物学研究挑选生物（Dietrich et al. 2020）[^dietrich-2020]。这二十条归成五簇：获取、可操作性、资源供给、经济性、前景。照这些簇与标准来挑生物，就是在一个高度语境化的判断里同时用上多条标准，彼此权衡，甚至逼得研究者回去修正对标准本身、对所考虑生物之能力的理解。
