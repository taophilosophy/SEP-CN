      Out of the nine million or so species available to scientists, even a generously inclusive list of model organisms is only going to constitute a very small sample of extant species. Considered from a phylogenetic standpoint, the NIH canonical model organisms are confined to a very small portion of the tree of life. If, on the one hand, the point of designating model organisms was for them to serve as models for human biomedicine, perhaps this restricted range of species is justified. On the other hand, if model organisms are conceived of as needing to represent a wider array of species and addressing questions beyond the confines of biomedicine, then perhaps their lack of biodiversity is a more serious concern.
    step1: |-
      在科学家可用的约九百万个物种中，即便一份从宽收录的模式生物清单，也只会构成现存物种的一个极小样本。从系统发生的立场看，NIH 的经典模式生物只限于生命之树的极小一部分。一方面，如果指定模式生物的目的在于让它们充当人类生物医学的模型，那么这种受限的物种范围也许是有道理的。另一方面，如果模式生物被设想为需要代表更广的一组物种、并处理生物医学范围之外的问题，那么它们生物多样性的匮乏也许就是一个更严重的隐忧。
    step2: |-
      科学家手边约有九百万个物种，即便把模式生物的名单放宽，它也只是现存物种中极小的一份样本。从系统发生上看，NIH 的经典模式生物只占了生命之树的一丁点。一方面，若指定模式生物本就是为了给人类生物医学当模型，物种范围窄些倒也有理。另一方面，若设想模式生物该代表更广的一批物种、还得处理生物医学以外的问题，那它们生物多样性的贫乏就成了更严重的隐忧。
