      The rise of artificially intelligent, or AI, systems in science also introduces new epistemic challenges for the evaluation and use of model organisms. As AI models increasingly improve on tasks such as pattern recognition and feature extraction, they begin to function as models both for improving the scientific study of model organisms and even as substitutes for the organisms themselves.
    step1: |-
      人工智能（AI）系统在科学中的兴起，也为模式生物的评估与使用带来了新的认知挑战。随着 AI 模型在模式识别与特征提取等任务上日益进步，它们开始既作为改进模式生物科学研究的模型发挥作用，甚至也作为生物本身的替代物发挥作用。
    step2: |-
      人工智能（AI）系统进了科学，也给模式生物的评估与使用带来新的认知难题。AI 模型在模式识别、特征提取这类任务上越来越好，于是它们开始充当模型：既用来改进对模式生物的科学研究，甚至也用来顶替生物本身。
