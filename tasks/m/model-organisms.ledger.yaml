      Model organisms were developed by communities of scientists and cultivated as resources for those communities. Understood as parts of social and material systems for the production of knowledge, model organisms carry with them more than just their intrinsic biological features. Put another way, model organisms are embedded in larger systems; the features of those systems play important roles in explanations of the how model organisms function in experiments and why certain model organism systems have been so historically successful.
    step1: |-
      模式生物由科学家共同体发展出来，并作为资源为这些共同体所培育。作为知识生产之社会系统与物质系统的一部分来理解，模式生物所携带的不只是其内在的生物学特征。换一种说法，模式生物嵌入在更大的系统之中；这些系统的特征，在解释模式生物如何在实验中发挥作用、以及某些模式生物系统为何在历史上如此成功时，起着重要作用。
    step2: |-
      模式生物是科学家共同体发展出来的，又被当作资源加以培育，供这些共同体使用。把它们看成知识生产之社会系统与物质系统的一部分，就会看到：模式生物身上带的，不只是内在的生物学特征。换个说法，模式生物嵌在更大的系统里；解释模式生物在实验中如何起作用、某些模式生物系统为何在历史上如此成功时，那些系统的特征都担着要紧角色。
