      Whether and how models represent their target systems remains an open philosophical problem (Frigg and Hartmann 2025)[^frigg-2025]. Do model organisms satisfy the same representational criteria as theoretical models– for example, in the same way that dynamical equations represent fluid motion or where neural networks represent cognitive processes?
    step1: |-
      模型是否表征其目标系统、以及如何表征，仍是一个悬而未决的哲学问题（Frigg and Hartmann 2025）[^frigg-2025]。模式生物是否满足与理论模型相同的表征标准——例如，就像动力学方程表征流体运动、神经网络表征认知过程那样？
    step2: |-
      模型是否表征其目标系统、又如何表征，至今仍是悬而未决的哲学问题（Frigg and Hartmann 2025）[^frigg-2025]。模式生物满足的，是同理论模型一样的表征标准吗？比如动力学方程表征流体运动、神经网络表征认知过程所用的那种标准。
  - id: 19
    kind: body
    source: |-
      Ankeny and Leonelli offer one influential way of addressing this question by characterizing model organisms in terms of their representational scope and representational target (Ankeny and Leonelli 2020)[^ankeny-2020]. In the simplest case, a species A is a model for another species B, if A has a property, p, that represents a feature of B. Representational scope captures how many different species, B, can be modeled by A, while the representation target refers to the properties or phenomena, p, that are represented in both species A and B. Scope may range from one species to many, and the target may range from a single phenomenon to a broad set of organism features.
    step1: |-
      Ankeny 和 Leonelli 提供了一个有影响的方式来回答这个问题：以表征范围和表征目标来刻画模式生物（Ankeny and Leonelli 2020）[^ankeny-2020]。在最简单的情形中，如果一个物种 A 具有某种属性 p，而 p 表征物种 B 的某个特征，那么 A 就是 B 的模型。表征范围刻画的是 A 能为多少个不同物种 B 建模，而表征目标指的是在物种 A 和 B 中被表征的属性或现象 p。范围可以从一个物种到许多物种，目标可以从单一现象到广泛的一组生物特征。
    step2: |-
      Ankeny 与 Leonelli 给出了一个颇有影响的回答：用表征范围与表征目标来刻画模式生物（Ankeny and Leonelli 2020）[^ankeny-2020]。最简单的情形是：物种 A 具有属性 p，而 p 表征物种 B 的某个特征，A 便是 B 的模型。表征范围说的是 A 能为多少个不同的物种 B 建模；表征目标指的则是 A 与 B 中被表征的属性或现象 p。范围可从一个物种直至许多物种，目标可从单一现象直至一大组生物特征。
