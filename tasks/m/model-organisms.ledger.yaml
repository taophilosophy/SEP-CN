      Prieto 和 Fábregas-Tejeda（2025）近来的努力，正是要化解这一张力：他们试图对表征论与非表征论之争采取一种混合观点。他们站在非表征论者一边，主张模式生物本身并不是模型。与此同时，他们也同意，科学家经常用模式生物构造关于特定目标现象的模型。他们的提议是：模式生物最好理解为科学模型的物质载体，而不是无条件的模型（Prieto and Fábregas-Tejeda 2025）[^prieto-2025]。在他们看来，生物是物理系统，研究者从中有选择地抽象并解释特定的部分、机制或行为，再把这些组织成关于所关注现象的模型。模型本身由被解释的生物特征子集（例如特定的细胞机制）构成，而不是整个生物（Prieto and Fábregas-Tejeda 2025）[^prieto-2025]。载体提供实验语境，但只有被解释的部分才被映射到所关注的领域，然后用来表征其他生物中的现象（Prieto and Fábregas-Tejeda 2025）[^prieto-2025]。这一区分有助于调和两种看法：传统的表征论直觉认为模式生物的功能类似形式模型与数学模型；而另一种看法认为生物本身不是模型，而是凭研究者从中抽象和解释的东西支撑模型的构造。
