  - id: 8
    kind: body
    source: |-
      The NIH played a key role in formalizing the category and terminology of model organisms, but today, the term is not restricted to the canonical NIH list. Scientists use the term liberally and informally across fields, ranging from biology to medicine and from neuroscience to psychology. Despite its widespread use, philosophical disagreement remains over how model organisms function as scientific models, and what kinds of models they are.
    step1: |-
      NIH 在使模式生物这一范畴与术语正式化方面起了关键作用，但今天，这个词并不限于 NIH 的经典清单。科学家在各领域宽松而不正式地使用这个词，从生物学到医学，从神经科学到心理学。尽管用法广泛，哲学上仍有分歧：模式生物如何作为科学模型发挥作用，以及它们属于何种模型。
    step2: |-
      NIH 在把“模式生物”确立为一个范畴、一套术语上起了关键作用，但今天这个词早已不限于 NIH 的经典清单。从生物学到医学，从神经科学到心理学，科学家在各领域都随意而宽松地用着它。尽管用途如此之广，哲学上的分歧却仍在：模式生物究竟如何充当科学模型？它们又算哪一类模型？
  - id: 9
    kind: body
    source: |-
      Although all organisms used in scientific experiments count as experimental organisms, model organisms are a subset of those experimental organisms (see Figure 1). Some philosophers define a model organism in terms of a representational relationship between species (see section 2.1). For example, Ankeny and Leonelli argue that an organism functions as a model when it can represent features of other organisms by having a broad representational scope (allowing results to be extrapolated across species) and a clear representational target (allowing it to stand in for particular phenomena in another system). Model organisms, on such a view, are supported by communities and infrastructures that integrate knowledge about the organism as a whole, treating its properties as part of an interconnected system rather than as isolated experimental traits (see section 3.3 on repertoires). In other words, model organism can be readily adapted to investigate new phenomena and be extended to new species.
    step1: |-
      虽然一切用于科学实验的生物都算实验生物，但模式生物是这些实验生物中的一个子集（见图 1）。一些哲学家以物种之间的表征关系来定义模式生物（见 2.1 节）。例如，Ankeny 和 Leonelli 主张，当一个生物能够通过拥有宽泛的表征范围（使结果可以跨物种外推）和明确的表征目标（使它可以代表另一个系统中的特定现象）来表征其他生物的特征时，它就作为模型发挥作用。在这种观点下，模式生物得到共同体与基础设施的支撑，这些共同体与基础设施把关于该生物整体的知识整合起来，把它的各种属性视为相互关联的系统的一部分，而非孤立的实验性状（见 3.3 节关于本领库的讨论）。换言之，模式生物可以随时被改造去研究新现象，并扩展到新的物种。
    step2: |-
      实验中所用的生物都算实验生物，模式生物只是其中一个子集（见图 1）。有些哲学家从物种之间的表征关系入手界定模式生物（见 2.1 节）。Ankeny 与 Leonelli 便主张，一种生物之所以起模型作用，是因为它具备宽泛的表征范围（结果得以跨物种外推）和明确的表征目标（可以代表另一系统中的特定现象），从而表征其他生物的特征。照这种看法，模式生物背后有共同体与基础设施撑着：这些共同体与设施把关于该生物整体的知识整合起来，把它的种种属性看成相互关联的系统的一部分，而不是一项项孤立的实验性状（见 3.3 节关于本领库的讨论）。换句话说，模式生物随时可以改作他用，去研究新现象，也能推广到新的物种。
  - id: 10
    kind: body
    source: |-
      Emphasizing multiple targets and species thus explains what is epistemically distinctive about model organism research (Ankeny and Leonelli 2011, 2020)[^ankeny-2011]. Others, however, have argued that such representational accounts alone fail to capture the versatility of model organisms. Instead, model organisms should be seen as model carriers – understood not through their representational power, but instead as organisms that are ontogenetically changeable, standardized, and evolved (Prieto and Fábregas-Tejeda 2025)[^prieto-2025].
    step1: |-
      强调多重目标与多重物种，因而说明了模式生物研究在认知上的独特之处（Ankeny and Leonelli 2011, 2020）[^ankeny-2011]。然而，另一些人主张，这类表征论说明本身无法把握模式生物的多面性。相反，模式生物应被看作模型载体——不应通过其表征能力来理解，而应理解为在个体发育上可变、被标准化、且经过演化的生物（Prieto and Fábregas-Tejeda 2025）[^prieto-2025]。
    step2: |-
      强调多重目标与多重物种，恰好点出了模式生物研究在认知上的独到之处（Ankeny and Leonelli 2011, 2020）[^ankeny-2011]。不过也有人认为，单靠这类表征论的说法，抓不住模式生物的多面性。在他们看来，模式生物该被看作模型载体——理解它们不靠表征能力，而要看它们是发生上可变、经过标准化、并且演化而来的生物（Prieto and Fábregas-Tejeda 2025）[^prieto-2025]。
