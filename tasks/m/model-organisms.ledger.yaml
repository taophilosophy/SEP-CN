      The epistemic status of negative models as generalizable models has been disputed, since having an animal exhibit unique adaptations to disease does not imply that it shares the same mechanisms as a human, even though these adaptations can provide insights into human biology via analogous mechanisms (Stegmann 2021)[^stegmann-2021]. Nonetheless, negative models continue to be scientifically generative, contributing both to translational research, such as potential therapies, and to basic understanding of physiological and pathological processes beyond their original applied context (Green 2024)[^green-2024]. For example, research on naked mole rats’ cancer resistance has provided fundamental insights into tissue mechanics related to aging and pain in humans (Green 2024)[^green-2024].
    step1: |-
      负模型作为可概括模型的认知地位一直有争议，因为一个动物表现出对疾病的独特适应，并不蕴含它与人类共享同样的机制，尽管这些适应可以通过类似机制为人类生物学提供洞见（Stegmann 2021）[^stegmann-2021]。尽管如此，负模型在科学上仍富有生成力，既对转化研究（例如潜在疗法）有贡献，也对超越其原初应用语境的生理与病理过程的基础理解有贡献（Green 2024）[^green-2024]。例如，关于裸鼹鼠抗癌性的研究，为与人类衰老和疼痛相关的组织力学提供了基础性洞见（Green 2024）[^green-2024]。
    step2: |-
      负模型算不算可概括的模型，其认知地位一直有争议：一种动物对疾病表现出独特的适应，并不等于它与人类共享同样的机制，尽管这些适应能通过类似机制给人上生物学以启发（Stegmann 2021）[^stegmann-2021]。可话说回来，负模型在科学上照样富有生成力：既有助于转化研究（比如潜在疗法），也有助于超出原初应用语境去理解生理与病理过程（Green 2024）[^green-2024]。例如裸鼹鼠抗癌性的研究，就为与人类衰老、疼痛相关的组织力学提供了基础性的洞见（Green 2024）[^green-2024]。
