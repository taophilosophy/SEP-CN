      Lorenzo Sartori (2023) extends Ankeny and Leonelli’s representational picture and use of DEKI by clarifying the role of interpretive keys within such repertoires. He distinguishes between broad and local keys. Broad keys capture general background assumptions about how models relate to targets, while local keys provide the fine-grained mappings from specific model properties to target properties that are required for justificatory work. Although broad and local keys ideally inform one another and reach reflective equilibrium, only local keys can support claims about a model’s accuracy. On Sartori’s account, factual correctness is therefore justified on a case-by-case basis rather than inherited globally from a model system.
    step1: |-
      Lorenzo Sartori（2023）扩展了 Ankeny 和 Leonelli 的表征图景及其对 DEKI 的运用，澄清了解释键在这类本领库中的作用。他区分了宽解释键与局部解释键。宽解释键把握的是关于模型如何与目标相关联的一般背景假设，而局部解释键提供的是从特定模型属性到目标属性的精细映射，这种映射是证成工作所必需的。虽然宽解释键与局部解释键理想上相互启发并达到反思平衡，但只有局部解释键能够支持关于模型准确性的主张。因此，在 Sartori 的说明中，事实正确性是逐个案例得到证成的，而不是从某个模型系统整体继承来的。
    step2: |-
      Lorenzo Sartori（2023）把 Ankeny 与 Leonelli 的表征图景及其对 DEKI 的运用推进一步，把解释键在这类本领库中的角色讲清楚了。他区分宽解释键与局部解释键：宽解释键承载的是关于模型如何与目标相关联的一般背景假设；局部解释键给出从具体模型属性到目标属性的精细映射，证成工作要的正是这种映射。宽、局部两种解释键在理想情况下互相启发，达到反思平衡；但能支撑“模型准确”这类主张的，只有局部解释键。因此在 Sartori 的说明里，事实正确性是逐案证成的，并非从一个模型系统整体继承而来。
