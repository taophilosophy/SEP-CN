      While cost has been an important factor in the selection of particular model organisms, this factor alone does not capture the complexity of these decisions, which are often multi-dimensional. Additionally, some model organisms are repurposed from other experimental contexts, chosen not only for their practical tractability but also for the availability of associated methods and infrastructure, even when they were originally studied for different purposes (Kaplan 2025)[^kaplan-2025]. Scientists will sometimes articulate the grounds for their choices explicitly. For instance, Isabel Rubio-Aliaga writes:
    step1: |-
      虽然成本一直是选择特定模式生物的重要因素，但仅凭这一因素并不能把握这些决定的复杂性，它们往往是多维的。此外，有些模式生物是从其他实验语境中改作他用的，其被选中不仅因为实践上的可操作性，还因为相关方法与基础设施的可得性，即便它们最初是为别的目的而被研究的（Kaplan 2025）[^kaplan-2025]。科学家有时会明确说出其选择的理由。例如，Isabel Rubio-Aliaga 写道：
    step2: |-
      成本一向是挑选特定模式生物的重要因素，可单凭这一条，抓不住这类决定的复杂——它们往往是多维的。还有些模式生物是从别的实验语境里挪过来的：选中它们，不只因为实践上好操作，还因为相关方法与基础设施现成可用，哪怕当初研究它们本是为了别的目的（Kaplan 2025）[^kaplan-2025]。科学家有时会把选择的理由明说出来。Isabel Rubio-Aliaga 便写道：
