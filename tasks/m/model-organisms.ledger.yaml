      Abstraction and idealization are familiar features of theoretical models in science, where theoretical models can be thought of as fictions, sets, or expressions (Griesemer 2005, Potochnik 2017, on theoretical models see Frigg and Hartmann 2025)[^frigg-2025][^griesemer-2005][^potochnik-2017]. As material models, model organisms create an important opportunity to consider how philosophical accounts of abstraction or standardization must be understood within the context of the material practices of science.
    step1: |-
      抽象与理想化是科学中理论模型熟悉的面貌，理论模型可以被视为虚构物、集合或表达式（Griesemer 2005, Potochnik 2017，关于理论模型见 Frigg and Hartmann 2025）[^frigg-2025][^griesemer-2005][^potochnik-2017]。作为物质模型，模式生物提供了一个重要机会，来考虑关于抽象或标准化的哲学说明必须如何在科学物质实践的语境中得到理解。
    step2: |-
      抽象与理想化，是科学中理论模型的老面孔了：理论模型可以被看成虚构物、集合或表达式（Griesemer 2005, Potochnik 2017；关于理论模型见 Frigg and Hartmann 2025）[^frigg-2025][^griesemer-2005][^potochnik-2017]。而模式生物作为物质模型，恰好提供了一个重要机会，让我们想一想：关于抽象、关于标准化的哲学说明，落到科学那套物质实践里，该怎么理解。
