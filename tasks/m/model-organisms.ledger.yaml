      Model organisms can also be subject to a process of abstraction. Leonelli characterizes this process “as the activity of selecting some features of a phenomenon P, as performed by an individual scientist within a specific context, in order to produce a model of (an aspect of) P” (Leonelli 2008, 521)[^leonelli-2008]. For a material model, like *Arabidopsis*, the process of abstraction involves choosing a set of features of interest and then stabilizing those models (plant ecotypes) so that they retain those features. This practice aligns with the epistemic priorities of scientists using this material model, because they need to “maintain control over the development of traits characterising different ecotypes, thus ensuring the replicability of specimens as well as their non-locality (that is, the stability of their features regardless of the time and location of their use)” (Leonelli 2008, 522)[^leonelli-2008]. Abstraction, then, is a set of practices that take place in a particular experimental context relative to articulated epistemic goals. Leonelli summarizes the entire process when she writes: “Abstracting involves selecting a limited set of material features of *Arabidopsis* wild types as potentially interesting for research purposes; devising ways in which these properties can be incorporated into a unique specimen; making sure that specimens with those characteristics can actually be grown; and constructing a toolkit of guidelines, materials and instruments allowing researchers worldwide to grow specimens in the same way” (Leonelli 2008, 523)[^leonelli-2008]. Abstraction in this sense is rooted in the materiality of the model, incorporates some parts of standardization, and is necessary for the functioning the model organism research community.
    step1: |-
      模式生物也可能经历一个抽象的过程。Leonelli 把这一过程刻画为“由个别科学家在特定语境中执行的、选择现象 P 的某些特征的活动，目的是产出关于 P（的某个方面）的模型”（Leonelli 2008, 521）[^leonelli-2008]。对于像拟南芥这样的物质模型，抽象过程包括选择一组所关注的特征，然后把这些模型（植物生态型）稳定下来，使它们保持这些特征。这一实践与使用该物质模型的科学家的认知优先次序相符，因为他们需要“保持对不同生态型所具性状之发育的控制，从而确保标本的可复制性及其非局部性（即无论使用的时间与地点如何，其性状保持稳定）”（Leonelli 2008, 522）[^leonelli-2008]。因此，抽象是一组在特定实验语境中、相对于明确表述的认知目标而发生的实践。Leonelli 在写到下述内容时总结了整个过程：“抽象包括：选择拟南芥野生型的有限一组物质特征，视为对研究目的可能有趣；设计把这些属性纳入单一标本的方式；确保具有这些特征的标本确实能够被栽培；并构造一套指南、材料与工具，使全世界的研究者能够以同样的方式栽培标本”（Leonelli 2008, 523）[^leonelli-2008]。这个意义上的抽象植根于模型的物质性，包含标准化的一些部分，并且是模式生物研究共同体得以运作所必需的。
    step2: |-
      模式生物也会经历一个抽象的过程。Leonelli 把这个过程说成“个别科学家在特定语境中选择现象 P 的某些特征，以产出关于 P（某一侧面）的模型”的活动（Leonelli 2008, 521）[^leonelli-2008]。对拟南芥这样的物质模型来说，抽象就是挑出一组所关注的特征，再把这类模型（植物生态型）稳定下来，使之保住这些特征。这与使用该物质模型的科学家的认知优先次序正相合：他们得“控制不同生态型各自性状的发育，从而确保标本可复制，并确保其非局部性（即无论何时何地使用，性状都保持稳定）”（Leonelli 2008, 522）[^leonelli-2008]。可见抽象是一组实践，在特定实验语境里、对着明确说出的认知目标展开。Leonelli 一段话把整个过程概括了：“抽象包括：从拟南芥野生型中挑出有限的一组物质特征，视之为对研究可能有趣；设计把这些属性装进单一标本的办法；确保带有这些特征的标本真能栽培出来；再编成一套指南、材料与工具，让全世界的研究者都能照同样的方式栽培标本”（Leonelli 2008, 523）[^leonelli-2008]。这个意义上的抽象植根于模型的物质性，含纳了标准化的一部分，也是模式生物研究共同体得以运转所必需的。
