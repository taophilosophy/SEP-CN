      ## 1 术语史
  - id: 3
    kind: body
    source: |-
      Although the term “model organism” was occasionally used before the 1990s, it came into widespread use in the life sciences with the rise of genome mapping and sequencing projects (Ankeny and Leonelli 2020)[^ankeny-2020]. In 1990, the Department of Health and Human Services and the Department of Energy issued a report on the first five years of the Human Genome Project that featured a limited set of organisms, including a bacterium, *Escherichia coli*, the yeast *Saccharomyces cerevisiae*, the fruit fly *Drosophila melanogaster*, the roundworm *Caenorhabditis elegans*, and the mouse *Mus musculus* (Department of Health and Human Services et al. 1990). The priority for this list reflected the aim of sequencing the genomes of what were considered to be a core set of biomedically important organisms. During this time period, genome sequencing was seen as an important modality to develop in different organismal systems; however, it was not sufficient to make an organism a model organism for the NIH (2000b [Other Internet Resources]).
    step1: |-
      尽管“模式生物”一词在 20 世纪 90 年代以前偶有使用，但它随着基因组作图和测序项目的兴起而在生命科学中广泛流行（Ankeny and Leonelli 2020）[^ankeny-2020]。1990 年，美国卫生与公众服务部和能源部就人类基因组计划最初五年发表了一份报告，其中列出的生物数量有限，包括一种细菌——大肠杆菌（*Escherichia coli*）、酵母——酿酒酵母（*Saccharomyces cerevisiae*）、果蝇——黑腹果蝇（*Drosophila melanogaster*）、线虫——秀丽隐杆线虫（*Caenorhabditis elegans*）以及小鼠——小家鼠（*Mus musculus*）（Department of Health and Human Services et al. 1990）。这份清单的优先次序，反映了对一批被认为是生物医学核心的重要生物进行基因组测序的目标。在这一时期，基因组测序被视为应当在各种生物系统中加以发展的一种重要手段；然而，对 NIH 来说，单凭这一点还不足以使一种生物成为模式生物（2000b [其他网络资源]）。
    step2: |-
      “模式生物”一词在 20 世纪 90 年代以前偶有人用，真正流行起来，是随着基因组作图与测序工程的兴起（Ankeny and Leonelli 2020）[^ankeny-2020]。1990 年，美国卫生与公众服务部与能源部就人类基因组计划头五年发表报告，所列生物数量有限：一种细菌（大肠杆菌 *Escherichia coli*）、一种酵母（酿酒酵母 *Saccharomyces cerevisiae*）、一种果蝇（黑腹果蝇 *Drosophila melanogaster*）、一种线虫（秀丽隐杆线虫 *Caenorhabditis elegans*）和小鼠（小家鼠 *Mus musculus*）（Department of Health and Human Services et al. 1990）。这份清单的先后次序，反映的是把一批生物医学上至关重要的物种列为测序重点这一目标。当时，基因组测序被视为值得在各种生物系统里发展的重要手段；可在 NIH 看来，光有测序还不足以让一种生物成为模式生物（2000b [其他网络资源]）。
  - id: 4
    kind: body
    source: |-
      In 2000, the National Institutes of Health (NIH) officially designated a canonical set of model organisms for biomedical research which included the mouse (*Mus musculus*), rat (*Rattus rattus*), fruit fly (*Drosophila melanogaster*), zebrafish (*Danio rerio*), frog (*Xenopus*), roundworm (*Caenorhabditis elegans*), social amoebae (*Dictyostelium discoideum*), and budding yeast (*Saccharomyces cerevisiae*) (NIH 2000a [Other Internet Resources]). The next year, the NIH added a plant, the thale cress (*Arabidopsis thaliana*) and by 2007, the list was expanded to include the chicken (*Gallus gallus*), a filamentous fungi (*Neurospora crassa*), the water flea (*Daphnia*), and fission yeast (*Schizosaccharomyces pombe*) (Leonelli 2007; NIH 2009 [Other Internet Resources])[^leonelli-2007]. Each of these organisms had parts or systems of parts that served as models for parts and systems in humans of medical importance. They also served as models for non-human targets as well.
    step1: |-
      2000 年，美国国立卫生研究院（NIH）正式指定了一套用于生物医学研究的经典模式生物，包括小鼠（*Mus musculus*）、大鼠（*Rattus rattus*）、果蝇（*Drosophila melanogaster*）、斑马鱼（*Danio rerio*）、蛙（*Xenopus*）、线虫（*Caenorhabditis elegans*）、社会阿米巴（*Dictyostelium discoideum*）和出芽酵母（*Saccharomyces cerevisiae*）（NIH 2000a [其他网络资源]）。第二年，NIH 增加了一种植物——拟南芥（*Arabidopsis thaliana*）；到 2007 年，清单又扩充，收入鸡（*Gallus gallus*）、一种丝状真菌（粗糙脉孢菌 *Neurospora crassa*）、水蚤（*Daphnia*）和裂殖酵母（*Schizosaccharomyces pombe*）（Leonelli 2007; NIH 2009 [其他网络资源]）[^leonelli-2007]。这些生物各自都有某些部分或部分系统，可充当人类身上那些具医学重要性的部分与系统的模型。它们同样被用作非人类目标的模型。
    step2: |-
      2000 年，美国国立卫生研究院（NIH）正式圈定了一套用于生物医学研究的经典模式生物：小鼠（*Mus musculus*）、大鼠（*Rattus rattus*）、果蝇（*Drosophila melanogaster*）、斑马鱼（*Danio rerio*）、蛙（*Xenopus*）、线虫（*Caenorhabditis elegans*）、社会阿米巴（*Dictyostelium discoideum*）与出芽酵母（*Saccharomyces cerevisiae*）（NIH 2000a [其他网络资源]）。次年，NIH 把拟南芥（*Arabidopsis thaliana*）这一植物收入名单；到 2007 年，名单又扩至鸡（*Gallus gallus*）、一种丝状真菌（粗糙脉孢菌 *Neurospora crassa*）、水蚤（*Daphnia*）与裂殖酵母（*Schizosaccharomyces pombe*）（Leonelli 2007; NIH 2009 [其他网络资源]）[^leonelli-2007]。这些生物各自都有某些部分，或由部分组成的系统，堪作人类身上那些具医学重要性的部分与系统的模型；它们也被当作非人目标的模型使用。
  - id: 5
    kind: body
    source: |-
      Most of the NIH designated model organisms have had a long history of use in biology and medicine. *Drosophila*, rats, and mice were developed as experimental systems early in the twentieth century and played foundational roles in the development of genetics (Kohler 1994, Rader 2004, Clause 1993, Logan 2002, 2005)[^clause-1993][^kohler-1994][^logan-2002][^rader-2004]. Most of this early research concerned basic biological processes. Only gradually would these organisms become models for processes in other species. In *Drosophila*, a comparative approach that juxtaposed *D. melanogaster* to other closely related species gave way to its functioning as a model for other species with the advent of molecular biology beginning in the 1950s (Kohler 1991)[^kohler-1991]. The rat had a much quicker trajectory toward use as model for other species. Beginning in the 19th century, it was used as a model for human disease. The standardization of rat models in 1906 at the Wistar Institute allowed it to flourish in the early twentieth century as an experimental organism with low variability that enabled higher reproducibility of results (Clause 1993, Logan 2002)[^clause-1993][^logan-2002]. Other organisms had been used as models for human disease but were not included in the NIH list and gradually became less common in their use. Guinea pigs, for instance, had been used as a model for human epilepsy as early as 1899, but in the twentieth century lost out to rats and mice as the mammalian model systems (Logan 2002, Endersby 2007)[^endersby-2007][^logan-2002].
    step1: |-
      NIH 指定的模式生物大多在生物学和医学中有着长期的使用史。果蝇、大鼠和小鼠在 20 世纪初就被发展为实验系统，在遗传学的发展中发挥了奠基性作用（Kohler 1994, Rader 2004, Clause 1993, Logan 2002, 2005）[^clause-1993][^kohler-1994][^logan-2002][^rader-2004]。这些早期研究大多涉及基本的生物学过程。这些生物是逐渐才成为其他物种中诸过程的模型的。在果蝇中，把黑腹果蝇与其他近缘物种并置比较的比较进路，随着 20 世纪 50 年代分子生物学的兴起，让位于它充当其他物种模型的功能（Kohler 1991）[^kohler-1991]。大鼠转向其他物种模型的轨迹要快得多。从 19 世纪起，它就被用作人类疾病的模型。1906 年威斯塔研究所对大鼠模型的标准化，使它在 20 世纪初作为一种变异性低的实验生物而兴盛起来，从而提高了结果的可重复性（Clause 1993, Logan 2002）[^clause-1993][^logan-2002]。其他生物也曾被用作人类疾病的模型，但未被列入 NIH 清单，使用也渐渐不那么常见。例如，豚鼠早在 1899 年就被用作人类癫痫的模型，可在 20 世纪却输给了大鼠和小鼠，没能成为哺乳动物模式系统（Logan 2002, Endersby 2007）[^endersby-2007][^logan-2002]。
    step2: |-
      NIH 指定的模式生物，大多在生物学与医学中已用得很久。果蝇、大鼠与小鼠在 20 世纪初便已发展为实验系统，并在遗传学的建立中起了奠基作用（Kohler 1994, Rader 2004, Clause 1993, Logan 2002, 2005）[^clause-1993][^kohler-1994][^logan-2002][^rader-2004]。这些早期研究大多针对基本的生物学过程；这些生物是后来才慢慢成为其他物种中诸过程的模型的。在果蝇那里，研究的比较进路原是把黑腹果蝇与近缘物种并置，随着 20 世纪 50 年代分子生物学的兴起，它才转而充当其他物种的模型（Kohler 1991）[^kohler-1991]。大鼠走上“其他物种之模型”这条路要快得多：19 世纪起，它就被用来做人类疾病的模型；1906 年威斯塔研究所把大鼠模型加以标准化，于是它在 20 世纪初大行其道，成为变异度低、结果可重复性高的实验生物（Clause 1993, Logan 2002）[^clause-1993][^logan-2002]。另一些生物也曾被用作人类疾病的模型，却未进入 NIH 清单，用途日渐稀少。豚鼠便是一例：早在 1899 年它就被用作人类癫痫的模型，到了 20 世纪却在大鼠、小鼠面前落败，没能成为哺乳动物模式系统（Logan 2002, Endersby 2007）[^endersby-2007][^logan-2002]。
  - id: 6
    kind: body
    source: |-
      By the first decades of the 21st century, the designation of model organism by the NIH became a marker of status and authority, not to mention financial investment from U.S. federal funding agencies, like the NIH (Gilbert 2009, Farris 2020)[^farris-2020][^gilbert-2009]. Soon after the NIH announced its list, many other organisms were proposed as model organisms by scientists eager to highlight their organism’s value for a range of problems (Wittbrodt, Shima, and Schartl 2002, Behringer et al. 2009)[^behringer-2009]. Other organism that had long been in use in biology were re-christened as model organisms (Bonner 1999)[^bonner-1999] and guides have been published for turning any organism into a model organism (Matthews and Vosshall 2020)[^matthews-2020]. Advocacy for the importance of non-model systems also started to rise (Shuker, Lynch, and Morais 2003). A common refrain among many non-model organism advocates was that preference for model organisms amounted to a deliberate neglect of most of the species in the tree of life (see section 6.1 on the research biodiversity challenge).
    step1: |-
      到 21 世纪最初几十年，NIH 的模式生物认定已成为地位与权威的标志，更不用说来自 NIH 等美国联邦资助机构的资金投入了（Gilbert 2009, Farris 2020）[^farris-2020][^gilbert-2009]。NIH 公布清单后不久，许多其他生物被科学家提名为模式生物，他们急于突出自己的生物对一系列问题的价值（Wittbrodt, Shima, and Schartl 2002, Behringer et al. 2009）[^behringer-2009]。另一些在生物学中早已使用的生物被重新命名为模式生物（Bonner 1999）[^bonner-1999]，还出版了把任何生物变成模式生物的指南（Matthews and Vosshall 2020）[^matthews-2020]。主张非模式系统重要的呼声也开始高涨（Shuker, Lynch, and Morais 2003）。许多非模式生物倡导者常说的一句话是：偏爱模式生物等于有意忽视生命之树上的大多数物种（见第 6.1 节关于研究生物多样性挑战的讨论）。
    step2: |-
      到 21 世纪头几十年，被 NIH 认定为模式生物，已成了地位与权威的标志，更不用说还能带来 NIH 之类美国联邦资助机构的经费（Gilbert 2009, Farris 2020）[^farris-2020][^gilbert-2009]。NIH 公布名单后不久，科学家们便纷纷提名别的生物当模式生物，急着表明自己手上这种生物对一批问题的价值（Wittbrodt, Shima, and Schartl 2002, Behringer et al. 2009）[^behringer-2009]。有些生物在生物学里早已用惯，又被重新命名为模式生物（Bonner 1999）[^bonner-1999]；甚至有指南教人把任何一种生物改造成模式生物（Matthews and Vosshall 2020）[^matthews-2020]。为非模式系统鸣不平的呼声也随之而起（Shuker, Lynch, and Morais 2003）。非模式生物的倡导者常挂在嘴边的一句话是：偏爱模式生物，等于有意无视生命之树上的大多数物种（参见第 6.1 节关于研究生物多样性难题的讨论）。
