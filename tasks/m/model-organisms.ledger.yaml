    source: |-
      The pervasiveness of AI models is not confined to their use in the scientific testing of model organisms; rather, AI models can be used as a substitute for organisms as well. Scientists have long used virtual animal models as tools for hypothesis generation in biology, such as using computational creatures to test evolutionary hypotheses (Sims 1994)[^sims-1994]. However, it is only in recent years that the behavioral performance of AI models – particularly, DNNs – have improved to such a degree that scientists are now using them as cognitive and behavioral models that stand in for both humans and nonhuman animals. For instance, researchers now place AI systems into roles structurally analogous to laboratory organisms by translating paradigms such as navigation, object permanence, and problem solving into virtual environments. Here, the artificial agents, rather than living animals, are trained and evaluated on a battery of cognitive tasks, undergoing standardized behavioral assays without any biological substrate (Crosby et al. 2020)[^crosby-2020]. This raises a question for using artificial models as model organisms, particularly in psychological and behavior research: do model organisms need to be living organisms, or can artificial models also serve as model organisms?
    step1: |-
      AI 模型的普遍性并不限于它们在模式生物科学检验中的使用；相反，AI 模型也可以用作生物的替代物。科学家早已把虚拟动物模型当作生物学中生成假设的工具，例如用计算生物来检验演化假设（Sims 1994）[^sims-1994]。然而，只是近年来，AI 模型——尤其是 DNN——的行为表现才提高到这种程度：科学家如今把它们当作认知模型与行为模型，来顶替人类与非人动物。例如，研究者如今把 AI 系统放进结构上类似于实验室生物的角色，把导航、客体永久性与问题解决等范式转译进虚拟环境。在这里，受训练与评估的是人工行动者而非活体动物，它们在一组认知任务上接受标准化行为测定，而没有任何生物基质（Crosby et al. 2020）[^crosby-2020]。这就为把人工模型当作模式生物使用、尤其是在心理学与行为研究中提出了一个问题：模式生物必须是活的生物吗？还是说人工模型也可以充当模式生物？
    step2: |-
      AI 模型的普遍性，并不限于拿来对模式生物作科学检验；它们还能直接顶替生物。科学家早就把虚拟动物模型当作生物学中生成假设的工具，例如用计算生物去检验演化假设（Sims 1994）[^sims-1994]。可直到近些年，AI 模型——尤其是 DNN——的行为表现才长进到这种地步：科学家已把它们当作认知模型、行为模型，用来顶替人类与非人动物。例如研究者把 AI 系统摆进结构上类似实验室生物的角色，把导航、客体永久性、问题解决这些范式搬进虚拟环境。受训练、受评估的成了人工行动者，而非活体动物；它们在一组认知任务上接受标准化行为测定，身上却没有半点生物基质（Crosby et al. 2020）[^crosby-2020]。这就给“把人工模型当模式生物用”出了道题，在心理学与行为研究里尤其尖锐：模式生物非得是活的生物不可吗？人工模型能不能也当模式生物？
