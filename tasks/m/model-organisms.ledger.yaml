      Below we survey the various ways that model organisms have been treated as models within philosophical and scientific contexts, including accounts of models as surrogates, exploratory models, and negative models. These accounts are not mutually exclusive. As will become evident, model organisms can be any combination of negative, surrogate, or exploratory models.
    step1: |-
      下面我们梳理模式生物在哲学与科学语境中被当作模型的各种方式，包括把模型看作替代物、探索性模型和负模型的说明。这些说明并不互斥。下文将会看到，模式生物可以是负模型、替代物或探索性模型的任意组合。
    step2: |-
      下面我们逐一梳理模式生物在哲学与科学语境中被当作模型的种种方式：把模型看作替代物、探索性模型、负模型的说明，都在其列。这些说法彼此并不排斥。下文会看到，模式生物可以同时是负模型、替代物或探索性模型，组合方式不拘。
