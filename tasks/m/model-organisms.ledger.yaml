      This account supports treating model organisms as something similar to theoretical models by drawing on Frigg and Nguyen’s DEKI framework for scientific representation (Frigg and Nguyen 2021; Frigg and Hartmann 2025)[^frigg-2025][^frigg-2021]. On the DEKI model, a model denotes a target system (D), exemplifies relevant features (E), provides a key or mapping rule linking those features to the target (K), and imputes them to the target (I) to generate information about it. Interpreted through DEKI, model organisms denote biological targets, exemplify experimentally accessible traits, rely on interpretive keys supplied by experimental practice, and license inferences about the target systems (Frigg and Nguyen 2021)[^frigg-2021].
    step1: |-
      这一说明通过借助 Frigg 和 Nguyen 关于科学表征的 DEKI 框架，支持把模式生物当作类似于理论模型的东西来处理（Frigg and Nguyen 2021; Frigg and Hartmann 2025）[^frigg-2025][^frigg-2021]。在 DEKI 模型中，一个模型指称一个目标系统（D），例示相关的特征（E），提供把这些特征与目标联系起来的键或映射规则（K），并把它们归予目标（I），以生成关于目标的信息。以 DEKI 来解读，模式生物指称生物学目标，例示可在实验上通达的性状，依靠实验实践所提供的解释键，并许可关于目标系统的推断（Frigg and Nguyen 2021）[^frigg-2021]。
    step2: |-
      这一说明借用了 Frigg 与 Nguyen 的科学表征 DEKI 框架，从而支持把模式生物看作与理论模型相类的东西（Frigg and Nguyen 2021; Frigg and Hartmann 2025）[^frigg-2025][^frigg-2021]。DEKI 模型有四步：模型指称（denote）一个目标系统（D），例示（exemplify）相关特征（E），给出把这些特征与目标联系起来的键或映射规则（K），再把它们归予（impute）目标（I），据以生成关于目标的信息。用 DEKI 来读，模式生物指称生物学目标，例示实验上可通达的性状，倚仗实验实践所提供的解释键，并许可人们就目标系统作出推断（Frigg and Nguyen 2021）[^frigg-2021]。
  - id: 21
    kind: body
    source: |-
      What distinguishes model organisms from other experimental organisms, on Ankeny and Leonelli’s view, is not merely their material similarity to a target but their representational power, which is established and maintained through a history of practices. These include techniques, infrastructures, conventions, and social organization that stabilize and transform organisms over time, or what they call a repertoire of practices (see section 3.3). Although DEKI provides a schema for understanding representation, how a model denotes a target is complicated by the fact that modeling is embedded in evolving research practices. The conceptual, material, and social elements of repertoires shape not only what counts as a model but how representational relations are continuously modified rather than fixed once and for all.
    step1: |-
      在 Ankeny 和 Leonelli 看来，模式生物与其他实验生物的区别，不仅在于它们与目标在物质上的相似，还在于它们的表征力量，而这种力量是通过实践的历史建立并维持的。这些实践包括使生物随时间稳定并发生转变的技术、基础设施、惯例与社会组织，或者他们所说的实践的本领库（见 3.3 节）。尽管 DEKI 提供了理解表征的图式，但建模嵌入在不断演变的研究实践之中，这就使模型如何指称目标变得复杂。本领库的概念要素、物质要素与社会要素，不仅塑造了什么算作模型，也塑造了表征关系如何被不断修改，而非一劳永逸地固定下来。
    step2: |-
      在 Ankeny 与 Leonelli 看来，模式生物之所以不同于其他实验生物，不只在它与目标的物质相似，更在它的表征力量——而这力量是靠着一段实践史立起来、维持住的。这里说的实践，包括技术、基础设施、惯例与社会组织，它们使生物随时间稳定下来，又不断被改造；他们把这整套东西叫作实践的本领库（见 3.3 节）。DEKI 虽给理解表征提供了一套图式，但建模本身就嵌在变动不居的研究实践里，模型如何指称目标，也就复杂起来。本领库里的概念要素、物质要素与社会要素，不只决定什么算模型，也决定表征关系怎样被一再修改，而不是一劳永逸地定死。
