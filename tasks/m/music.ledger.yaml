      不出所料，那些把音乐表现力的体验看作更贴近情感的人（比如把它建立在与音乐的想象性交融上），倾向于强调这种体验对音乐理解更核心，从而把音乐价值的更大份额归给表现力。反过来，那些对音乐表现力体验持更疏离看法的人（比如把它看作被注意到的相似），在其音乐价值理论中给这一要素的权重就较小。这一谱系的一端，是根本否认音乐有表现力的立场，因而无法把音乐的任何价值归给表现力（最著名的是 Hanslick 1854；另见 Zangwill 2004）[^hanslick-1854][^zangwill-2004]。然而，多数理论家同意，音乐的价值应定位于不同种类的经验，包括对形式特征与表现特征的经验；他们的分歧主要在于，在完整的音乐价值说明中，这些不同种类经验的相对权重。
