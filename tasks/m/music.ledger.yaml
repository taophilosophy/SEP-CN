      One radical way to solve the puzzle is to deny that music is emotionally expressive. A major burden of such eliminativism is to explain away the widespread tendency to describe music in emotional terms. This has been attempted by arguing that such descriptions are shorthand or metaphor for purely sonic features (Urmson 1973)[^urmson-1973], basic dynamic features (Hanslick 1854)[^hanslick-1854], purely musical features (Sharpe 1982)[^sharpe-1982], or aesthetic properties (Zangwill 2007)[^zangwill-2007]. There are many problems with such views. For one thing, they seem committed to some sort of scheme for reduction of expressive predicates to other terms, such as sonic or musical ones, and such a scheme is difficult to imagine (Budd 1985a: 31–6)[^budd-1985a]. For another, anyone not drawn to this theory is likely to reject the claim that the paraphrase captures all that is of interest and value about the passage described, precisely because it omits the expressive predicates (Davies 1994: 153–4)[^davies-1994].
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      Conventionalism is the view that music’s expressiveness is a matter of the conventional association of certain musical elements, such as slow tempi, with certain emotional states, such as sadness. Such conventions must play a role in some cases of expression—for instance, cases of particular musical instruments (e.g., the snare drum) being associated with particular situations (e.g., war) and thus emotions (e.g., foreboding). But such conventions seem unlikely to account for all musical expressiveness, since much of that expressiveness seems less arbitrary than conventionalism would suggest. It seems implausible, for instance, that the convention for funeral dirges might just as easily have that they should be quick-paced and in major keys. Even in cases like the snare drum, it seems possible that the instrument was chosen for the battlefield in part because of the expressive character of its sonic profile.
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      The cliché that music is “the language of the emotions” is often considered as a possible starting point for a theory of musical expressiveness. The idea combines the attractive simplicity of conventionalism with the formalist notion that music’s order is to be understood in terms of syntax. (See Lerdahl & Jackendoff 1983 for a theory along the latter lines.)[^lerdahl-1983] However, although Deryck Cooke (1959) and Leonard Meyer (1956) are often cited as proponents, it is not clear that anyone holds a full-blown version of the theory. The central problem is the great disparities between language and music, in terms of the ways in which each is both syntactic and semantic (Jackendoff 2011)[^jackendoff-2011]. A serious subsidiary problem is that even if music *were* about the emotions in the way that language can be, that would not account for music’s *expressiveness*. The sentence “I am sad” is about the emotions, but it is not *expressive of* sadness in the way a sad face is, though you could use either to express your sadness. Most people agree that music’s relation to emotion is more like that of a sad face than that of a sentence. (This last criticism is also applicable to Susanne Langer’s theory (1953) that music is about the emotions in a symbolic yet non-linguistic way.)
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      We now turn to theories that attempt to connect the notion of music’s expressiveness to actual felt emotions. One obvious way to do so is to argue that pieces of music or performances of them are expressions of such emotions—those of the composer or performer. There are two major problems with this “expression theory.” The first is that neither composers nor performers often experience the emotions their music is expressive of as it is produced. Nor does it seem unlikely that a composer could create, or a performer perform, a piece expressive of an emotion that she had never experienced. This is not to deny that a composer could write a piece expressive of her emotional state, but for the expression theory to be an account of musical expressiveness, at least all central cases of expressiveness must follow this model, which is not the case. Moreover, if a composer is to express her sadness, say, by writing a sad piece, she must pen the right kind of piece. In other words, if she is a bad composer she might fail to express her emotion. This brings us to the second major problem for the expression theory. If a composer can fail to express her emotions in a piece, then the music she writes is expressive independent of the emotion she is experiencing. Thus music’s expressiveness cannot be explained in terms of direct expression.
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      Those usually cited as classic expression theorists include Tolstoy (1898), Dewey (1934), and Collingwood (1938). (A classic critique is Tormey 1971: 97–127.)[^tormey-1971] These theorists have been defended in recent discussions, however, from accusations that they hold the simple view outlined above (Ridley 2003, Robinson 2005: 229–57)[^ridley-2003][^robinson-2005]. Jenefer Robinson has attempted to revive the expression theory, though she defends it as an interesting and valuable *use* of music’s expressiveness, rather than an account of expressiveness itself (2005: 229–347; 2011).
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      A second way to link music’s expressiveness with actual felt emotions is through the audience. According to arousalism, the expressiveness of a passage of music amounts to its tendency to arouse that emotion in a competent listener. Arousalism faces several objections. First, some competent listeners seem emotionally unmoved by music (or are at least not moved to the specific emotions expressed by it). But perhaps the arousalist can simply restrict the class of listener to which his theory appeals to those who are so moved. Second, some emotions, such as fear, require a particular kind of intentional object (something threatening), yet there is no such object at hand when we hear fearful music. Thus it seems implausible to claim the music’s fearfulness resides in its arousal of fear in us. But perhaps the arousalist can broaden the class of aroused emotions to include appropriate *responses* to the expressed emotion, such as pity. Third, in many cases it seems that listeners respond emotionally to the expressiveness of the music. It is not clear that the arousalist can handle such cases non-circularly. (A sophisticated defense of the arousal theory is to be found in Matravers 1998: 145–224, though see the second thoughts in Matravers 2011. For an extended critique, see S. Davies 1994: 104–200.)[^davies-1994][^matravers-1998][^matravers-2011]
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      Despite the problems of the arousal theory as the whole story of musical expressiveness, there is a growing consensus, thanks largely to the work of Jenefer Robinson (1994, 2005), that our lower-level, less cognitive responses to music must play some role in the emotional expressiveness we attribute to it. However, this role is likely to be a causal one, rather than part of an analysis of what it is for music to be emotionally expressive.
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      Several theorists have defended accounts of musical expressiveness known variously as resemblance, contour, or appearance theories (e.g., Kivy 1989, though see Kivy 2002: 31–48 for recent qualms; Budd 1995: 133–54; S. Davies 1994: 221–67)[^budd-1995][^davies-1994][^kivy-1989][^kivy-2002]. The central idea is that music’s expressiveness consists in the resemblance between its dynamic character and that of various typical aspects of people experiencing emotions. The aspects appealed to include the phenomenology of the experience of the emotion, the emotion’s facial expression, the contour of vocal expression or bodily behavior of a person experiencing the emotion. Stephen Davies argues that such theories hold music to be expressive in a literal albeit secondary sense of the term. We say that a piece of music is sad in the same sense in which we say that a weeping willow is sad (S. Davies 2006: 183)[^davies-2006]. Such uses are no more metaphorical than a claim that a chair has arms.
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      Jerrold Levinson agrees that there is an important resemblance between the contour of music expressive of an emotion and the contour of typical behavioral expressions of that emotion. He objects, however, that such an account cannot be the whole, or even the most fundamental part of the story (Levinson 1996a, 2006b)[^levinson-1996a]. He drives in a wedge precisely at the point where an appeal is made to the resemblance between the music and typical behavioral expressions. He asks what the manner and extent of the resemblance between the two must be, precisely, in order for the music to count as expressive of some emotion. After all, everything resembles everything else in all sorts of ways, and so one could point out many resemblances between a funeral march and an expression of joy, or for that matter a cup of coffee and sadness. The resemblance theorist must give some account of why the funeral march, and not the cup of coffee, is expressive of sadness and not joy. Levinson claims that the obvious answer here is that the funeral march is “readily hearable as” an expression of sadness. If this is correct, then the resemblance the music bears to emotional behavior is logically secondary—a cause or ground of its expressiveness. The expressiveness itself resides in the music’s disposition to elicit the imaginative response in us of hearing the music as a literal expression of emotion. As a logical consequence, the imaginative experience prompted must include some agent whose expression the music literally is.
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      In reply to this kind of objection, Stephen Davies has emphasized the role of the listener’s response in resemblance theories. Such responses have always been appealed to by such theories, as evidenced by Malcolm Budd’s talk of “hearing as” (1995: 135–7), and Peter Kivy’s discussion of our tendency to “animate” that which we perceive (1980: 57–9). But Davies now makes the appeal quite explicit and central, devoting as much space to explication of the response-dependent nature of expressiveness as to the role of resemblance (2006). For Davies, the response of the competent listener upon which the expressiveness of the music depends is one of an *experience of resemblance* rather than imagined expression (2006: 181–2). Matteo Ravasio (2019b) argues that this leads to further problems.
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      Since Davies’s theory posits at base a contour-recognition experience while Levinson’s posits an imaginative experience of expression, the link between literal expression and musical expressiveness looks closer in Levinson’s theory than in Davies’s. An empirical consequence seems to be that Davies’s theory will predict weaker emotional responses to music than Levinson’s. Whether or not this is an advantage or disadvantage of the theory depends on the empirical facts about how we respond emotionally to music.
