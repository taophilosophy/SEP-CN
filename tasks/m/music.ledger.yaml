      There have been two sources of widespread confusion in the debate over authenticity in performance. One is a failure to recognize that authenticity is not simply a property, but a relation that comes in degrees and holds with respect to different aspects of its target. Something may be more authentic in one regard and less authentic in another (S. Davies 2001: 203–5)[^davies-2001]. Another is the assumption that authenticity is an evaluative concept, in the sense that “authentic” implies “good.” That this is not the case is clear from the fact that an authentic murderer is not a good thing (S. Davies 2001: 204)[^davies-2001]. Thus, our value judgments will be complex functions of the extent to which we judge performances authentic in various regards, and the values we assign to those various kinds of authenticity.
    step1: |-
      关于演奏中本真性的争论，有两个普遍的混乱来源。其一，是没有认识到本真性不只是一个属性，而是一种有关系、分程度、并相对于其对象不同方面而言的关系。某事物可能在这方面更本真，在那方面却更不本真（S. Davies 2001: 203–5）[^davies-2001]。其二，是假定本真性是一个评价性概念，即“本真的”意味着“好的”。事实并非如此，因为一个本真的杀人犯并不是好事（S. Davies 2001: 204）[^davies-2001]。因此，我们的价值判断将是复杂的函数：既取决于我们在各方面判定演奏本真的程度，也取决于我们赋予各类本真性的价值。
    step2: |-
      围绕演奏本真性的争论，混乱多半来自两处。第一，人们没看出本真性不只是一种属性，而是一种关系：分程度，且相对于对象的不同方面。同一事物可以在这方面更本真，在那方面更不本真（S. Davies 2001: 203–5）[^davies-2001]。第二，人们误以为本真性是个评价词，仿佛“本真的”就等于“好的”。其实不然：一个本真的杀人犯可不是什么好事（S. Davies 2001: 204）[^davies-2001]。所以价值判断是个复杂函数，一头是我们在各方面判定演奏本真的程度，另一头是我们给各类本真性所安的价值。
