      Moving on from authenticity, a second area that may be independent of the fundamentalist debate is that of comparative ontology. (For dispute over this framing issue, see Brown 2011, 2012.)[^brown-2011] Just as classical works from different historical periods may be ontologically diverse, so may works from different contemporary traditions. Theodore Gracyk has argued that instances of works of rock music are not performances. Rather, the work is instanced by playing a copy of a recording on an appropriate device (1996; cf. Fisher 1998)[^fisher-1998]. Stephen Davies has argued that rock is more like classical music than Gracyk acknowledges, with works for performance at the heart of the tradition, albeit works for a different kind of performance (2001: 30–6). Gracyk’s view has been amplified and defended in attempts to find a place for composition, live performance, and performance skill within his basic framework (Kania 2006, Bruno 2013, Bartel 2017, Magnus 2022)[^bartel-2017][^bruno-2013][^kania-2006][^magnus-2022].
    step1: |-
      从本真性转向另一处：第二个可能独立于基础主义之争的领域，是比较本体论。（关于这一框架问题的争论，见 Brown 2011, 2012。）[^brown-2011] 正如不同历史时期的古典作品在本体论上可能多样，不同当代传统的作品也可能如此。Theodore Gracyk 主张，摇滚音乐作品的实例不是演奏；作品是通过在适当设备上播放录音的副本而得到实例化的（1996；参看 Fisher 1998）[^fisher-1998]。Stephen Davies 主张，摇滚比 Gracyk 所承认的更接近古典音乐，其传统的核心仍是为演奏而作的作品，只不过是为另一种演奏而作（2001: 30–6）。Gracyk 的观点在试图为作曲、现场演奏与演奏技巧在其基本框架中寻找位置的种种努力中，得到了扩充与辩护（Kania 2006, Bruno 2013, Bartel 2017, Magnus 2022）[^bartel-2017][^bruno-2013][^kania-2006][^magnus-2022]。
    step2: |-
      再看第二处：比较本体论。它或许与基础主义之争彼此独立。（关于这一框架本身的争论，见 Brown 2011, 2012。）[^brown-2011] 不同历史时期的古典作品在本体论上可能各异，不同当代传统的作品同样如此。Theodore Gracyk 主张，摇滚作品的实例不是演奏：作品要靠适当设备播放录音副本才算得到实例化（1996；参看 Fisher 1998）[^fisher-1998]。Stephen Davies 则认为，摇滚比 Gracyk 承认的更接近古典音乐：传统的核心仍是为演奏而作的作品，只是另一种演奏罢了（2001: 30–6）。后来为给作曲、现场演奏与演奏技巧在他的框架里找位置，Gracyk 的观点又被扩充、辩护了一番（Kania 2006, Bruno 2013, Bartel 2017, Magnus 2022）[^bartel-2017][^bruno-2013][^kania-2006][^magnus-2022]。
