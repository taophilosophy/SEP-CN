      According to “complex Platonism,” musical works come to exist in time as the result of human action. The complexity is motivated by a number of features of musical practice, including the intuition that musical works are creatable, the attribution of various aesthetic and artistic properties to works, and the fine-grained individuation of works and performances (e.g., in terms of who composed them, or what instruments they are properly performed upon) (Ingarden 1961; Thomasson 2004; Wolterstorff 1980; Wollheim 1968: 1–10, 74–84; Levinson 1980, 1990b, 2012; S. Davies 2001: 37–43; Howell 2002; Stecker 2003a: 84–92)[^davies-2001][^howell-2002][^ingarden-1961][^levinson-1980][^stecker-2003a][^thomasson-2004][^wollheim-1968][^wolterstorff-1980].
    step1: |-
      按“复杂柏拉图主义”，音乐作品作为人类行动的结果而在时间中开始存在。其复杂性由音乐实践的若干特征所驱动，包括音乐作品可被创造的直觉、赋予作品各种审美与艺术属性的做法，以及对作品与演奏的精细个体化（例如按谁作曲、或按应当在什么乐器上演奏来区分）（Ingarden 1961; Thomasson 2004; Wolterstorff 1980; Wollheim 1968: 1–10, 74–84; Levinson 1980, 1990b, 2012; S. Davies 2001: 37–43; Howell 2002; Stecker 2003a: 84–92）[^davies-2001][^howell-2002][^ingarden-1961][^levinson-1980][^stecker-2003a][^thomasson-2004][^wollheim-1968][^wolterstorff-1980]。
    step2: |-
      “复杂柏拉图主义”则说，音乐作品因人类行动而在时间中开始存在。之所以要这么复杂，是因为音乐实践有若干特征需要交代：我们觉得作品可以被创造，会给作品安上各种审美与艺术属性，还会对作品与演奏作精细区分（谁作的曲、照规矩该用什么乐器演奏，等等）（Ingarden 1961; Thomasson 2004; Wolterstorff 1980; Wollheim 1968: 1–10, 74–84; Levinson 1980, 1990b, 2012; S. Davies 2001: 37–43; Howell 2002; Stecker 2003a: 84–92）[^davies-2001][^howell-2002][^ingarden-1961][^levinson-1980][^stecker-2003a][^thomasson-2004][^wollheim-1968][^wolterstorff-1980]。
