      A central topic in the understanding of narrative art forms, such as literature and film, is what constitutes an acceptable interpretation of a work. One debate concerns whether there is a single correct interpretation of any work or multiple acceptable interpretations. Another concerns the constraints on acceptable interpretations, e.g., the extent to which the artist’s intentions may or should be taken into account.
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      Though these questions seem equally applicable to musical works (S. Davies 2002a; Dubiel 2011)[^davies-2002a][^dubiel-2011], most of the literature on understanding music has focused on two more specifically musical topics: first, our understanding of basic musical features, such as pitch and rhythm and, second, interpretations of works of the sort given by music theorists. (For more detailed introductions to these and other topics in musical understanding, see S. Davies 2011c and Huovinen 2011.)[^davies-2011][^davies-2011c][^huovinen-2011]
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      Before we turn to those topics, it is worth noting that two distinct activities go by the name of “interpretation” in music (and other performance arts): what might be called *performative* and *critical* interpretation (Levinson 1993)[^levinson-1993]. While a critical interpretation of a musical work (often called an analysis) is roughly equivalent to an interpretation of a novel—typically expressed linguistically—a performative interpretation is a way of playing or singing the work, typically expressed in a performance of it. It is not easy to clarify the relationship between these two kinds of musical interpretation, but see Levinson 1993, Maus 1999, Thom 2007, Neufeld 2012, and Dodd 2020a.
    step1: TBD
