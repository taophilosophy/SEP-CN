      As for emotional responses to music’s expressiveness, there are at least two possible explanations. One appeals to the phenomenon of “emotional contagion” or “mirroring responses” (S. Davies 1994: 279–307; 2006: 186–8)[^davies-1994]. When surrounded by moping people, one tends to become sad. Moreover, such a “mood” is not *about* some intentional object. One is not necessarily sad *for* the mopers, nor whatever they are sad about, if anything. Similarly, when “surrounded” by music that presents an appearance of sadness, one might become sad, but not sad about the music, or anything else (Radford 1991). For critical discussion, see Robinson 2005: 379–412 and S. Davies 2011b.
    step1: |-
      至于对音乐表现力的情感反应，至少有两种可能的解释。一种诉诸“情绪感染”或“镜像反应”现象（S. Davies 1994: 279–307; 2006: 186–8）[^davies-1994]。身边围着一群垂头丧气的人，自己也容易变得低落。而且，这种“情绪”并不*关于*某个意向对象。人未必是为那些垂头丧气的人难过，也未必是为他们所难过的事（如果有的话）难过。同样，被呈现悲伤面貌的音乐所“包围”时，人可能变得悲伤，但不是对音乐悲伤，也不是对别的什么悲伤（Radford 1991）。批评性讨论见 Robinson 2005: 379–412 与 S. Davies 2011b。
    step2: |-
      对音乐表现力的情感反应，至少有两条解释路子。其一是“情绪感染”或“镜像反应”（S. Davies 1994: 279–307; 2006: 186–8）[^davies-1994]。身边围着一圈唉声叹气的人，自己也跟着郁闷；而这种“情绪”并不*关于*什么意向对象——你未必是为那几位叹气的人难过，也未必是为他们难过的那件事（要真有的话）难过。同理，被一派悲伤面貌的音乐“围住”，人可能也跟着悲伤，但不是对音乐悲伤，也不是对别的什么悲伤（Radford 1991）。批评性讨论见 Robinson 2005: 379–412 与 S. Davies 2011b。
