      ### 4.2 Higher-level Musical Understanding
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      For various art-historical reasons, formalism was the dominant approach to music-theoretic analysis, that is, the critical interpretation of musical works, throughout the twentieth century. (Hamilton 2007: 66–94 & 153–91 provides a useful discussion of the history from a philosophical perspective.)[^hamilton-2007] In short, the value of works of music was held to reside primarily in their large-scale harmonic structure.
    step1: TBD
    step2: TBD
  - id: 73
    kind: body
    source: |-
      Jerrold Levinson (1997) makes a case against such “architectonicism” in favor of “concatenationism,” the view that basic musical understanding consists in following the musical and emotional qualities of passages of music, and transitions between them, that are short enough to be apprehended as a single experience (“quasi-hearing”). He qualifies this basic idea considerably, allowing for the experience of previous parts of the piece, and anticipation of future parts, to modify one’s experience of the music in the moment. He also allows that architectonic awareness may play a role in enhancing one’s moment-to-moment experience, and may even play an ineliminable part in the understanding of some pieces. Nonetheless, Levinson maintains that the part played by architectonic knowledge in basic musical understanding is minimal, and that the cases where architectonic knowledge is necessary are very much the exception.
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      Peter Kivy has taken up the gauntlet on behalf of architectonicism (2001; see also S. Davies 2011c: 95–9)[^davies-2011c]. While Kivy acknowledges that the kinds of experiences Levinson champions are necessary to basic musical understanding, he defends the idea that grasping the large-scale form of most pieces of Western classical music, at least, is necessary for an adequate understanding of them. He does not deny that the experience of the form of a piece in listening to it is more intellectual than quasi-hearing, but he rejects Levinson’s argument that it is non-perceptual, and thus marginal to an adequate experience of it as music. Rather, Kivy argues, such experience is a matter of bringing one’s perceptions under sophisticated concepts. (A tactic Kivy does not consider is an attempt to hoist Levinson with his own contextualist petard, arguing that even if architectonic listening is non-perceptual it is a well-established mode of understanding pieces of music in the Western classical music world, and thus that to argue music must be understood primarily perceptually is to beg the question.)
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      The extent of the disagreement between the architectonicist and the concatenationist is unclear. They agree that the aspect of musical understanding the other emphasizes is a non-negligible component in the full understanding of a musical work. Levinson has been explicit since the first publication of his view that he intends it more as a polemic against and corrective to architectonicism, rather than as a replacement for it (1997: ix–xi; 1999: 485; 2006a). Perhaps that purpose has now been fulfilled, but see Huovinen 2013 for a revival of the debate and an attempted synthesis.
