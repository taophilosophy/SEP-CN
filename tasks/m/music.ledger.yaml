      ### 5.2 Music’s Moral Value
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      There are musical aspects or elements of many uncontroversially representational art forms, such as song. Jeanette Bicknell (2015: 81–91) and Aaron Smuts (2013) discusses the ethics of song performance. But there has been little discussion, in the analytic tradition, of the relationship between musical and ethical values (as opposed to musical examples of more general ethical concerns, such as cultural appropriation). Kathleen Higgins (1991, 2012) and Roger Scruton (1997: 457–508) argue in very different ways that music is – or should be – central to our thinking about ethics. Garry Hagberg has explored many connections between improvisatory jazz practice, ethics, and politics (2002, 2006, 2008, 2021; see also Higgins 1991: 177)[^higgins-1991]. Peter Kivy (2008) argues against music’s capacity to affect our moral knowledge, behavior, or character. Jerrold Levinson (2013: 51–5), Philip Alperson (2014), and James Harold (2016) defend music’s moral efficacy.
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
