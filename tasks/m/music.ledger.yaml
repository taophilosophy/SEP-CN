      Leaving behind the topic of how and why we respond emotionally to music, we turn to the question of why we seek out music that arouses “negative” emotions in us, such as sadness, assuming henceforth that we are in fact aroused to such emotions. (Since this problem is a close analog of the “paradox of tragedy,” some of the references below are to literature not explicitly about music, but the transposition of the arguments to music is not difficult to imagine. (See also the entry on the paradox of tragedy.) Most solutions assume that our negative emotional response is a price we are willing to pay for the benefits of engaging with the piece in question. The benefits appealed to include understanding and appreciating the music, including the expressiveness responsible for the negative response (Goodman 1968: 247–51; S. Davies 1994: 311–20; Goldman 1995: 68; Robinson 2005: 348–78)[^davies-1994][^goldman-1995][^goodman-1968][^robinson-2005].
    step1: |-
      放下我们如何、为何对音乐产生情感反应的话题，转向另一个问题：我们为什么偏要找那种在我们身上唤起悲伤之类“负面”情感的音乐，并从此假定我们确实被唤起了这类情感。（由于此问题与“悲剧悖论”极为相近，以下一些文献并不专论音乐，但把论证移植到音乐上并不难想象。另见“悲剧悖论”词条。）多数解答假定，我们的负面情感反应，是我们为参与该作品所获益处愿意付出的代价。所诉诸的益处包括对音乐的理解与欣赏，其中包括导致负面反应的那种表现力（Goodman 1968: 247–51; S. Davies 1994: 311–20; Goldman 1995: 68; Robinson 2005: 348–78）[^davies-1994][^goldman-1995][^goodman-1968][^robinson-2005]。
    step2: |-
      先说我们如何、为何对音乐动情，再说另一个问题：悲伤之类的“负面”情感既被唤起，我们为何还要找这种音乐来听？以下姑且假定我们确实被唤起了这类情感。（此问题与“悲剧悖论”极为相近，下面有些文献并非专论音乐，但把论证搬到音乐上并不难。另见“悲剧悖论”词条。）多数解答都假定：负面情感反应是我们为参与该作品所换来的好处而甘愿付的代价。所谓好处，包括对音乐的理解与欣赏，其中就有惹出负面反应的那份表现力（Goodman 1968: 247–51; S. Davies 1994: 311–20; Goldman 1995: 68; Robinson 2005: 348–78）[^davies-1994][^goldman-1995][^goodman-1968][^robinson-2005]。
