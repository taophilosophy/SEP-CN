      Part of the solution is that not all emotional responses (broadly construed) are cognitive (Robinson 1994; 2005: 387–400)[^robinson-1994]. For instance, it is no more puzzling that one could be startled by a *fortissimo* blow to a bass drum than that one could so respond to a thunderclap. Another part of the solution is that the music can be the object of our emotions, as when we are delighted by an effective ending to a long and complex piece.
