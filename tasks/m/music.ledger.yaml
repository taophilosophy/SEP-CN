      By contrast, those who defend the value of formal features tend to argue that the value of those features is primary, and that the value of music’s expressiveness is overrated. Peter Kivy, for instance, argues that expressive properties serve merely to highlight musical structure, as color might be used by the painter to emphasize contour or mass. Other expressive properties serve as structural properties in their own right (1990: 196). (See also Sharpe 2000: 1–83, and Zangwill 2004.)[^sharpe-2000][^zangwill-2004]
