      The question that naturally arises next is what it is about the experience an artwork affords that makes it valuable. That *pleasure* is a non-negligible part of the answer to this question is the second point upon which there is some consensus (S. Davies 1987: 198–205; Levinson 1992; Kivy 1997b: 212–17)[^davies-1987][^kivy-1997b][^levinson-1992]. However, concomitant with this consensus is an acknowledgment that simple pleasure taken, say, in the sensuousness of the musical sounds is too trivial to ground the great value widely attributed to music. In looking for other sources, the puzzle that arises is that music is supposed to be an abstract art, *par excellence*. If this means that music is divorced from everything else that concerns us in the “real world” (that is, extra-musical life), it is puzzling why we should find so valuable the experiences musical works afford.
    step1: |-
      随之而来的问题是：艺术品所提供的经验中，究竟是什么使它有价值。*快乐*是这一问题答案中不可忽视的一部分，这是第二点共识（S. Davies 1987: 198–205; Levinson 1992; Kivy 1997b: 212–17）[^davies-1987][^kivy-1997b][^levinson-1992]。然而，与此共识相伴的是承认：单纯的快乐，比如从音乐声音的感官性中获得的快乐，太微不足道，不足以支撑人们广泛赋予音乐的伟大价值。在寻找其他来源时，出现的谜题是：音乐据说是*最典型*的抽象艺术。如果这意味着音乐与“真实世界”（即音乐之外的生活）中一切关乎我们的事物相脱离，那么，我们为何应当觉得音乐作品所提供的经验如此宝贵，就令人费解。
    step2: |-
      接下来自然要问：艺术品带来的经验里，到底哪一点使它可贵？答案里少不了*快乐*，这是第二点共识（S. Davies 1987: 198–205; Levinson 1992; Kivy 1997b: 212–17）[^davies-1987][^kivy-1997b][^levinson-1992]。可共识也附带一句：光是快乐——比如从乐音悦耳中得来的那点快感——太单薄，撑不起人们普遍加在音乐头上的巨大价值。于是要另找来源，谜题就来了：音乐据说是*最*典型的抽象艺术。倘若这意味着音乐与“真实世界”（即音乐之外的生活）里一切与我们相关的事都断了线，那我们凭什么把音乐作品带来的经验看得那么重？
