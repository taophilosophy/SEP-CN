      ### 5.1 Music’s Artistic Value
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      Most philosophical discussions of the value of music are implicitly restricted to the artistic value of purely instrumental musical works. To the extent that such discussions are motivated by the abstract nature of such music (see below), it is not clear to what extent they can be extended to musical hybrids such as song. Moreover, as we saw in section 1.2, it is not obvious that all music is art. Perhaps non-art music can be artistically valuable, but it presumably has other values; a complete theory of the value of music would apparently have to account for those values. (Presumably, art music can also have non-artistic value.)
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      Following the literature, however, the remainder of this subsection considers the artistic value of purely musical works. This is not the place to go into the many disputes about the nature of aesthetic and artistic value. (For an excellent introduction, see Stecker 2003b.)[^stecker-2003b] For our purposes, we can note there are two central points about artistic value on which there is some consensus. First, most philosophers take the value of artworks to be intrinsic (or inherent) to them, in the sense that the value of a work is tied essentially to the experience that the work affords. Thus, artworks are not (properly) valued merely instrumentally, as means to some end, but “for” or “in” themselves (Budd 1995: 1–16; S. Davies 1987: 198–200; Scruton 1997: 374–6; Levinson 1992: 15–17)[^budd-1995][^davies-1987][^levinson-1992][^scruton-1997].
    step1: TBD
    step2: TBD
