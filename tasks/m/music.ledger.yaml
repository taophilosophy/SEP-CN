      Much of this debate over the fundamental ontological category to which musical works belong has turned on “technical” issues, that is, controversial general metaphysical claims about the nature of properties, causation, embodiment, and so on (e.g., Howell 2002; Trivedi 2002; Caplan & Matheson 2004, 2006; Dodd 2007; Hazlett 2012; Kleinschmidt & Ross 2012; Dodd & Letts 2017; Cameron 2008)[^cameron-2008][^caplan-2004][^dodd-2007][^dodd-2017][^hazlett-2012][^howell-2002][^kleinschmidt-2012][^trivedi-2002]. In the face of this, some theorists have pointed out that musical works are cultural entities, and thus the methodology appropriate to uncovering their ontological status might be quite different from that of general metaphysics (Goehr 1992; S. Davies 2003a; D. Davies 2004; Thomasson 2006)[^davies-2004][^davies-2003a][^goehr-1992][^thomasson-2006]. For further discussion of the methodology of musical ontology, see D. Davies 2009, 2017; Predelli 2009; Stecker 2009; Dodd 2010, 2013; Mag Uidhir 2012b; and Nussbaum 2021.
    step1: |-
      这场关于音乐作品所属基本本体范畴的争论，许多都取决于“技术性”问题，即关于属性、因果、体现等等本性的一般形而上学主张，而这些主张本身是有争议的（例如 Howell 2002; Trivedi 2002; Caplan & Matheson 2004, 2006; Dodd 2007; Hazlett 2012; Kleinschmidt & Ross 2012; Dodd & Letts 2017; Cameron 2008）[^cameron-2008][^caplan-2004][^dodd-2007][^dodd-2017][^hazlett-2012][^howell-2002][^kleinschmidt-2012][^trivedi-2002]。面对这一局面，一些理论家指出，音乐作品是文化实体，因此揭示其本体论地位所需的方法论，可能与一般形而上学相当不同（Goehr 1992; S. Davies 2003a; D. Davies 2004; Thomasson 2006）[^davies-2004][^davies-2003a][^goehr-1992][^thomasson-2006]。关于音乐本体论方法论的进一步讨论，见 D. Davies 2009, 2017；Predelli 2009；Stecker 2009；Dodd 2010, 2013；Mag Uidhir 2012b；以及 Nussbaum 2021。
    step2: |-
      音乐作品究竟属于哪个基本本体范畴，这场争论大半落在“技术性”问题上，也就是关于属性、因果、体现之类的一般形而上学主张，而这些主张本身就有争议（例如 Howell 2002; Trivedi 2002; Caplan & Matheson 2004, 2006; Dodd 2007; Hazlett 2012; Kleinschmidt & Ross 2012; Dodd & Letts 2017; Cameron 2008）[^cameron-2008][^caplan-2004][^dodd-2007][^dodd-2017][^hazlett-2012][^howell-2002][^kleinschmidt-2012][^trivedi-2002]。有鉴于此，一些理论家提醒说，音乐作品是文化实体，探明其本体论地位的方法，未必同于一般形而上学（Goehr 1992; S. Davies 2003a; D. Davies 2004; Thomasson 2006）[^davies-2004][^davies-2003a][^goehr-1992][^thomasson-2006]。音乐本体论方法论的进一步讨论，见 D. Davies 2009, 2017；Predelli 2009；Stecker 2009；Dodd 2010, 2013；Mag Uidhir 2012b；以及 Nussbaum 2021。
