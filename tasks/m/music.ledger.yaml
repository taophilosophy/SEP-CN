      Work on the ontology of jazz has centered on the nature of improvisation, particularly the relation between improvisation and composition (Alperson 1984, 1998; Valone 1985; Brown 1996, 2000; Hagberg 1998; Gould & Keaton 2000; Sterritt 2000; and Young & Matheson 2000; Bresnahan 2015; Love 2016; Magnus 2016)[^alperson-1984][^bresnahan-2015][^brown-1996][^gould-2000][^hagberg-1998][^love-2016][^magnus-2016][^sterritt-2000][^valone-1985][^young-2000]. This has been a useful reminder that not all music is the performance of pre-composed works (Wolterstorff 1987: 115–29)[^wolterstorff-1987]. However, improvisation can occur within the context of such a work, as in the performance of an improvised cadenza in a classical concerto. Some have argued that there is not as significant a distinction between improvisation and composition as is usually thought (Alperson 1984)[^alperson-1984]. Others have argued that all performance requires improvisation (Gould & Keaton 2000)[^gould-2000]. Yet others restrict the possibility of improvisation to certain kinds of musical properties, such as “structural” rather than “expressive” ones (Young & Matheson 2000)[^young-2000]. However, none of these arguments are compelling. Usually they turn on equivocal use of terms such as “composition” and “performance,” or beg the question by defining improvisation in terms of deviation from a score or variation of a limited set of “expressive” properties.
    step1: |-
      关于爵士本体论的工作，集中于即兴的本性，尤其是即兴与作曲的关系（Alperson 1984, 1998; Valone 1985; Brown 1996, 2000; Hagberg 1998; Gould & Keaton 2000; Sterritt 2000; 以及 Young & Matheson 2000; Bresnahan 2015; Love 2016; Magnus 2016）[^alperson-1984][^bresnahan-2015][^brown-1996][^gould-2000][^hagberg-1998][^love-2016][^magnus-2016][^sterritt-2000][^valone-1985][^young-2000]。这有益地提醒我们：并非所有音乐都是对预先写就的作品的演奏（Wolterstorff 1987: 115–29）[^wolterstorff-1987]。不过，即兴也能发生在此类作品的语境中，如古典协奏曲中即兴华彩段的演奏。有人主张，即兴与作曲之间的区分并不像通常想的那么重大（Alperson 1984）[^alperson-1984]。另有人说，一切演奏都需要即兴（Gould & Keaton 2000）[^gould-2000]。还有人把即兴的可能性限制在某些种类的音乐属性上，例如“结构性的”而非“表现性的”属性（Young & Matheson 2000）[^young-2000]。然而这些论证都不令人信服。它们通常靠“作曲”“演奏”之类术语的歧义，或者靠以“偏离乐谱”或“对有限一组表现性属性的变奏”来定义即兴，从而偷取论题。
    step2: |-
      爵士本体论的研究，多围绕即兴展开，尤其是即兴与作曲的关系（Alperson 1984, 1998; Valone 1985; Brown 1996, 2000; Hagberg 1998; Gould & Keaton 2000; Sterritt 2000; 以及 Young & Matheson 2000; Bresnahan 2015; Love 2016; Magnus 2016）[^alperson-1984][^bresnahan-2015][^brown-1996][^gould-2000][^hagberg-1998][^love-2016][^magnus-2016][^sterritt-2000][^valone-1985][^young-2000]。这提醒得好：并不是所有音乐都在演奏现成写好的作品（Wolterstorff 1987: 115–29）[^wolterstorff-1987]。当然，即兴也能出现在这类作品的语境里，比如古典协奏曲中即兴的华彩段。有人说，即兴与作曲的界线并没有通常以为的那么要紧（Alperson 1984）[^alperson-1984]；有人说，凡演奏都需要即兴（Gould & Keaton 2000）[^gould-2000]；还有人把即兴限定在某些音乐属性上，比如“结构性”而非“表现性”的属性（Young & Matheson 2000）[^young-2000]。这些论证都不够硬。它们往往靠“作曲”“演奏”这类词的两可用法，或者拿“偏离乐谱”“对一小撮表现性属性的变奏”来定义即兴，等于把要证的东西当前提。
