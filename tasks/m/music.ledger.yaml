      Most theorists think that some kind of Platonist or nominalist theory of musical works is more plausible than those so far considered. Platonism, the view that musical works are abstract objects, is arguably still the dominant view, though it seems to be losing ground to sophisticated nominalisms. Its great advantage is its ability to respect more of our pre-theoretic intuitions about musical works than other theories can. On the other hand, it is the most ontologically puzzling, since abstract objects are not well understood. Nonetheless, Platonism has been tenacious, with much of the debate centering around what variety of abstract object musical works are. What we might call “simple Platonism” (known simply as “Platonism” in the literature), is the view that works are eternal existents, existing in neither space nor time (Kivy 1983a, 1983b, Dodd 2007)[^dodd-2007][^kivy-1983a]. Puy (2019) presents a variation according to which musical works are higher-order types, of which the types other Platonist thinks are works are specific *versions* of works. (See D. Davies 2021 for discussion.)[^davies-2021]
    step1: |-
      多数理论家认为，某种柏拉图主义或唯名论的音作作品理论，比目前考虑过的观点更可信。柏拉图主义主张音乐作品是抽象对象，可以说仍是主流观点，尽管它似乎在把地盘让给精致的唯名论。它的巨大优势在于，能比其他理论更多地尊重我们先理论的音乐作品直觉。另一方面，它在本体论上最令人困惑，因为抽象对象尚未得到很好的理解。尽管如此，柏拉图主义十分顽强，许多争论都围绕音乐作品是哪种抽象对象展开。我们可称之为“简单柏拉图主义”（文献中径称“柏拉图主义”）的观点主张，作品是永恒存在物，既不存在于空间，也不存在于时间（Kivy 1983a, 1983b, Dodd 2007）[^dodd-2007][^kivy-1983a]。Puy（2019）提出一个变体：音乐作品是*高阶类型*，其他柏拉图主义者视为作品的那些类型，只是作品的具体*版本*。（讨论见 D. Davies 2021。）[^davies-2021]
    step2: |-
      多数理论家觉得，某种柏拉图主义或唯名论的方案，比前面那些观点更可信。柏拉图主义——音乐作品是抽象对象——大概仍占主流，只是地盘正被精致的唯名论蚕食。它的长处是能比别家更好地照顾我们先理论的直觉；短处是本体论上最费解，毕竟抽象对象至今没人说得很清楚。尽管如此，柏拉图主义相当顽强，争论多半集中在音乐作品究竟是哪一类抽象对象上。所谓“简单柏拉图主义”（文献里径称“柏拉图主义”）认为，作品是永恒存在物，不在空间，也不在时间（Kivy 1983a, 1983b, Dodd 2007）[^dodd-2007][^kivy-1983a]。Puy（2019）给了一个变体：音乐作品是*高阶类型*，别的柏拉图主义者当作作品的那些类型，其实只是作品的具体*版本*。（讨论见 D. Davies 2021。）[^davies-2021]
