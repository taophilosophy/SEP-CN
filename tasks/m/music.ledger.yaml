      争论的各方到底差多远，仍说不清。替表现力价值说话的人，多半称它对总体音乐价值贡献重大；可许多人只说到“重要”为止，连首要价值都不肯给，也不否认作品形式要素的价值（Ridley 1995: 192–6; Levinson 1982, 1992: 20–2, 1996a: 124–5; Robinson 2005: 413; Young 2014: 150–4）[^levinson-1982][^ridley-1995][^robinson-2005][^young-2014]。他们宁可细数表现力值钱的各种路径，重心多半落在这类表现力在我们心里唤起的情感反应上。这些路径包括上文谈过的不少特征，都关乎我们为何爱听那些勾起负面情感状态的音乐。回顾一下：对音乐表现力的情感反应，能让我们以“安全”的方式品味、理解、乃至（在某种程度上）体验情感。它能给我们卡塔西斯式的释放，还能让我们与作曲家往来，或与音乐文化里的其他人相通（Levinson 1982, 1996a; Higgins 1991, 2012; S. Davies 1994: 271）[^davies-1994][^higgins-1991][^levinson-1982]。Roger Scruton 把最后一点说得更重：音乐的价值是准道德的——一个人回应什么音乐，一种文化看重什么音乐，都映照着该个体或该文化“灵魂”的成色（1997: 380–91；另见 S. Davies 1994: 275–6）[^davies-1994]。Stephen Davies（1987: 207–12）则说，对音乐*总体*的兴趣有好些善果，比如情感与听觉更敏锐；这些不该作为听某部作品的后果来估价，但它们让我们看重整个音乐文化（就像我们因善良的总体后果而看重善良，同时又不认“为好处而行善”是正当动机）。
