      Most analytic work has primarily discussed Western classical music. (For criticism of this tendency, see Alperson 2009.)[^alperson-2009] In the last 25 years, there has been increasing recognition that different musical practices may not only suggest different answers to the same philosophical questions, but also raise different philosophical questions. Apart from Western classical music, popular Western traditions, such as rock and jazz, have received the most attention. Non-Western musical traditions have received little attention. (Exceptions include S. Davies 2001: 254–94 and 2007; Alperson, Nguyen, & To 2007; S. P. Walton 2007; and Higgins 2007.)[^davies-2001][^davies-2007][^higgins-2007][^walton-2007]
    step1: |-
      分析传统的工作大多主要讨论西方古典音乐。（对这一倾向的批评，见 Alperson 2009。）[^alperson-2009] 在过去 25 年里，人们日益认识到，不同的音乐实践不仅可能对同样的哲学问题给出不同答案，还可能提出不同的哲学问题。除西方古典音乐外，西方流行传统——如摇滚与爵士——受到最多关注。非西方音乐传统受到的关注很少。（例外包括 S. Davies 2001: 254–94 与 2007；Alperson, Nguyen, & To 2007；S. P. Walton 2007；以及 Higgins 2007。）[^davies-2001][^davies-2007][^higgins-2007][^walton-2007]
    step2: |-
      分析传统的研究大多围绕西方古典音乐展开。（对这一偏向的批评，见 Alperson 2009。）[^alperson-2009] 近 25 年来，学界日渐认识到：不同的音乐实践不仅可能对同一批哲学问题给出不同答案，还会提出新的哲学问题。西方流行传统——摇滚、爵士之类——获得的关注仅次于西方古典音乐；非西方音乐传统则少有人问津。（例外有 S. Davies 2001: 254–94 与 2007；Alperson, Nguyen, & To 2007；S. P. Walton 2007；以及 Higgins 2007。）[^davies-2001][^davies-2007][^higgins-2007][^walton-2007]
