      ### 4.1 Basic Musical Understanding
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      Animals can hear music in a sense—your dog might be frightened by the loud noise emitted by your stereo. People, by contrast, can *understand* the music they hear. What constitutes this experience of understanding music? To use an analogy, while the mere *sound* of a piece of music might be represented by a sonogram, our experience of it as *music* is better represented by something like a marked-up score. We hear individual notes that make up distinct melodies, harmonies, rhythms, sections, and so on, and the interaction between these elements. Such musical understanding comes in degrees along a number of dimensions. Your understanding of a given piece or style may be deeper than mine, while the reverse is true for another piece or style. My general musical understanding may be narrow, in the sense that I only understand one kind of music, while you understand many different kinds (Budd 1985b: 233–5; S. Davies 2011c: 88–95)[^budd-1985b][^davies-2011c]. Moreover, different pieces or kinds of pieces may call on different abilities, since some music has no harmony to speak of, some no melody, and so on. Many argue that, in addition to purely musical features, understanding the emotions expressed in a piece is essential to adequately understanding it (e.g., Ridley 1993; S. Davies 1994; Levinson 1990d: 30; Scruton 1997; Robinson 2005: 348–78)[^davies-1994][^levinson-1990d][^ridley-1993][^robinson-2005][^scruton-1997].
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      At the base of the musical experience seem to be (i) the experience of *tones*, as opposed to mere sounds of various frequencies, where a tone is heard as being in “musical space,” that is, as bearing relations to other tones such as being higher or lower, or of the same kind (at the octave), and (ii) the experience of *movement*, as when we hear a melody as leaping up or wandering far afield and then coming to rest where it began. Roger Scruton (1983; 1997: 1–96) argues that these experiences are irreducibly metaphorical, since they involve the application of spatial concepts to that which is not literally spatial. (There is no identifiable individual that moves from place to place in a melody (S. Davies 1994: 229–34)[^davies-1994].) Malcolm Budd (1985b) argues that to appeal to metaphor in this context is unilluminating since, first, it is unclear what it means for an *experience* to be metaphorical and, second, a metaphor is only given meaning through its interpretation, which Scruton not only fails to give, but argues is unavailable. Budd suggests that the metaphor *is* reducible, and thus eliminable, apparently in terms of purely musical (i.e., non-spatial) concepts or vocabulary. Stephen Davies (1994: 234–40) doubts that the spatial vocabulary can be eliminated, but he is sympathetic to Budd’s rejection of the centrality of metaphor. Instead, he argues that our use of spatial and motion terms to describe music is a secondary, but literal, use of those terms that is widely used to describe temporal processes, such as the ups and downs of the stock market, the theoretical position one occupies, one’s spirits plunging, and so on. The debate continues in Budd 2003, Scruton 2004, and S. Davies 2011d.
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      Davies is surely right about the ubiquity of the application of the language of space and motion to processes that lack individuals located in space. The appeal to secondary literal meanings, however, can seem as unsatisfying as the appeal to irreducible metaphor. We do not hear music simply as a temporal process, it might be objected, but as *moving* in the *primary* sense of the word, though we know that it does not literally so move. Andrew Kania (2015) develops a position out of this intuition by emphasizing Scruton’s appeal to imagination while dropping the appeal to metaphor, arguing that hearing the music as moving is a matter of imagining that its constituent sounds move. (See also de Clercq 2007 and Trivedi 2011: 116–18.)[^trivedi-2011] Kania explicitly models his theory on the popular Waltonian theory of fiction (K. Walton 1990)[^walton-1990], though Walton seems to resist the application of his theory to basic musical understanding because of the differences between music and more paradigmatically representational arts (K. Walton 1988: 358–9, 1994: 53–4)[^walton-1988].
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      Apart from pitch space and melodic movement, there has been little philosophical discussion of either the nature and understanding of basic musical features such as melody, rhythm, meter, and harmony or how these elements work together in complex musical wholes. But see Roger Scruton 1997: 19–79, 2007; Stephen Davies 2001: 47–71; Hamilton 2007: 119–52; and Cheyne, Hamilton, and Paddison 2020.
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      It is widely acknowledged that explicit music-theoretical knowledge can aid deeper musical understanding and is essential for the adequate description and understanding of musical experiences—including one’s own (Kivy 1990)[^kivy-1990]. However, several philosophers have argued that one need not possess these concepts explicitly (nor the correlative vocabulary) in order to listen with understanding (Budd 1985b; 245–8; S. Davies 1994: 346–9; Levinson 1990d: 35–41)[^budd-1985b][^davies-1994][^levinson-1990d]. Mark DeBellis (1995: 117–31) argues that understanding fairly basic features of music, such as different kinds of cadences, requires a fused experience in which one applies a concept such as dominant seventh in one’s perception of the musical sounds. Stephen Davies (2011c: 88–94) responds that the serious but untutored listener should be able to develop such concepts, and thus have such experiences. Erkki Huovinen (2008) provides an example intended to cast doubt on this. Suppose that a melody is transposed from C major to D-flat major, but in a lower octave. One listener might hear the melody as reappearing higher, since D-flat is a half-step above C, while another might hear it as lower, since the constituent pitches of the second appearance are all lower than those of the first. Only a listener who understands the sense in which *both* these claims are true—that the melody has been transposed down a major seventh—truly understands what is going on musically. Yet such concepts of pitch organization … are not usually learned without some tuition (Huovinen 2008: 325)[^huovinen-2008].
    step1: TBD
    step2: TBD
