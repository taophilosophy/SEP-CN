      It is widely acknowledged that explicit music-theoretical knowledge can aid deeper musical understanding and is essential for the adequate description and understanding of musical experiences—including one’s own (Kivy 1990)[^kivy-1990]. However, several philosophers have argued that one need not possess these concepts explicitly (nor the correlative vocabulary) in order to listen with understanding (Budd 1985b; 245–8; S. Davies 1994: 346–9; Levinson 1990d: 35–41)[^budd-1985b][^davies-1994][^levinson-1990d]. Mark DeBellis (1995: 117–31) argues that understanding fairly basic features of music, such as different kinds of cadences, requires a fused experience in which one applies a concept such as dominant seventh in one’s perception of the musical sounds. Stephen Davies (2011c: 88–94) responds that the serious but untutored listener should be able to develop such concepts, and thus have such experiences. Erkki Huovinen (2008) provides an example intended to cast doubt on this. Suppose that a melody is transposed from C major to D-flat major, but in a lower octave. One listener might hear the melody as reappearing higher, since D-flat is a half-step above C, while another might hear it as lower, since the constituent pitches of the second appearance are all lower than those of the first. Only a listener who understands the sense in which *both* these claims are true—that the melody has been transposed down a major seventh—truly understands what is going on musically. Yet such concepts of pitch organization … are not usually learned without some tuition (Huovinen 2008: 325)[^huovinen-2008].
    step1: |-
      人们普遍承认，明确的音乐理论知识有助于更深的音乐理解，并且对于充分描述与理解音乐经验——包括自己的经验——是必要的（Kivy 1990）[^kivy-1990]。然而，几位哲学家主张，人不必明确拥有这些概念（以及相应的词汇），也能带着理解去聆听（Budd 1985b; 245–8; S. Davies 1994: 346–9; Levinson 1990d: 35–41）[^budd-1985b][^davies-1994][^levinson-1990d]。Mark DeBellis（1995: 117–31）主张，理解相当基本的音乐特征，如不同类型的终止式，需要一种融合的体验：人在对音乐声音的感知中运用诸如“属七和弦”这样的概念。Stephen Davies（2011c: 88–94）回应说，认真而未受训练的听者应当能够发展出这类概念，从而拥有这类体验。Erkki Huovinen（2008）提供了一个意在对此表示怀疑的例子。设想一段旋律从 C 大调移到降 D 大调，但在低八度。一位听者可能把旋律听作升高了重现，因为降 D 比 C 高半音；另一位则可能听作降低了，因为第二次出现的构成音高全都低于第一次。只有理解了*两种*说法各自在何种意义上为真——旋律被移低了大七度——的听者，才真正理解音乐上发生了什么。然而，这类音高组织的概念……通常不是不经指点就能学会的（Huovinen 2008: 325）[^huovinen-2008]。
    step2: |-
      有一点大家认账：明确的音乐理论知识能帮人听得更深，对充分描述和理解音乐经验——包括自己的经验——不可或缺（Kivy 1990）[^kivy-1990]。可也有几位哲学家说：不必把这些概念（连同配套词汇）明明白白摆在手上，也能带着理解去听（Budd 1985b; 245–8; S. Davies 1994: 346–9; Levinson 1990d: 35–41）[^budd-1985b][^davies-1994][^levinson-1990d]。Mark DeBellis（1995: 117–31）则主张，要理解相当基本的音乐特征——比如各种终止式——就得有一种融合的体验：在对乐音的感知里用上“属七和弦”这类概念。Stephen Davies（2011c: 88–94）回敬说：认真却没受过训练的听者，也应当能长出这些概念、获得这类体验。Erkki Huovinen（2008）举了个例子来泼冷水。设想一段旋律从 C 大调移到降 D 大调，但落在低八度。一位听者可能觉得旋律升高了再出现，因为降 D 比 C 高半音；另一位却觉得它变低了，因为第二次出现时每个音都比第一次低。只有听懂了*两种*说法各自在什么意义上成立——旋律其实下移了大七度——的人才真明白音乐上出了什么事。然而，这类音高组织的概念……通常非得有人指点才学得会（Huovinen 2008: 325）[^huovinen-2008]。
