      A different kind of solution to the problem argues that responses such as sadness that are evoked by expressive music are not really negative. Hume (1757) argues, with respect to tragedy, that the pleasure we take in the mode of presentation of the content of an artwork does not simply counterbalance the negative emotion evoked, but rather subsumes and transforms it into a pleasurable feeling. Kendall Walton argues (also with respect to tragedy) that sadness is not in itself negative. Rather, it is the situation to which sadness is the response that is negative. Thus, though we would not seek out the death of a loved one, *given* the death we “welcome” the sorrow (K. Walton 1990: 255–9)[^walton-1990]. Similarly, we cannot affect the sadness of a musical work by not listening to it, and so we welcome our sorrowful response to it as appropriate. Berys Gaut (2007: 203–26) argues that though sadness is *typically* aroused by situations we would prefer to avoid, sadness in response to artistic expressiveness is an exception and thus not negative in any paradoxical way. A difficulty for all three solutions is the extent to which they accord with our emotional experience in rejecting the characterization of our sadness as negative.
    step1: |-
      另一类解答主张，表现性音乐所唤起的悲伤之类反应，其实并不是负面的。Hume（1757）就悲剧论证：我们从艺术作品内容的呈现方式中获得的快乐，并不只是抵消被唤起的情感，而是把它包摄并转化为一种愉悦感。Kendall Walton 论证（同样就悲剧）：悲伤本身并不负面，负面的是悲伤所回应的处境。因此，尽管我们不会去寻求亲人死亡，但*一旦*死亡发生，我们便“欢迎”悲伤（K. Walton 1990: 255–9）[^walton-1990]。同样，我们无法通过不听某部音乐作品来改变它的悲伤，因此我们欢迎自己对它的悲伤反应，视之为恰当的。Berys Gaut（2007: 203–26）主张，虽然悲伤*通常*由我们希望避免的处境唤起，但面对艺术表现力的悲伤是个例外，因此并不以任何悖论的方式成为负面。这三种解答都有一个困难：它们在拒绝把我们的悲伤刻画为负面时，与我们的情感经验究竟吻合到什么程度。
    step2: |-
      还有一类解答说：表现性音乐勾起的悲伤之类反应，压根儿不算负面。Hume（1757）就悲剧说过：我们从艺术作品内容的呈现方式里得的快乐，不只是抵消了被唤起的情感，而是把它收进自身，化成了愉悦。Kendall Walton 也说（同样就悲剧）：悲伤本身不负面，负面的是悲伤所回应的处境。我们不会去求亲人去世，可*一旦*人没了，我们反倒“欢迎”悲伤（K. Walton 1990: 255–9）[^walton-1990]。同理，一部音乐作品悲不悲伤，不是我们不听就能改的；于是我们欢迎自己的悲伤反应，觉得它得体。Berys Gaut（2007: 203–26）则说：悲伤*通常*由我们宁可避开的处境勾起，但面对艺术表现力时的悲伤是例外，因此算不得悖论意义上的负面。三种说法共有一个难处：它们硬不认我们的悲伤是负面的，这跟我们的情感经验究竟对不对得上？
