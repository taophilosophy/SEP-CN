      Julian Dodd (2014a) argues that the kinds of considerations adduced in favor of these views confuse questions of ontology with questions of value. Jazz is ontologically like early classical music, according to Dodd: the focus of critical attention is the improvisatory performance rather than the composition it instantiates, but that composition is no less a musical work for that difference in critical emphasis. (See Fisher 2018 for an attempted reconciliation.)[^fisher-2018] Similar considerations might be adduced against the increasingly complicated ontologies of rock referred to above. Such arguments return us to debates about the methodology of musical ontology.
