      Julian Dodd（2014a）主张，支持这些观点的那些考虑，混淆了本体论问题与价值问题。按 Dodd 的说法，爵士在本体论上像早期古典音乐：批评关注的焦点是即兴演奏，而不是它所实例化的作曲；但那一作曲并不因为批评重心的转移就不再是音乐作品。（关于尝试调和，见 Fisher 2018。）[^fisher-2018] 类似的考虑也可以用来反对上文提到的日益复杂的摇滚本体论。这类论证把我们带回关于音乐本体论方法论的争论。
    step2: |-
      Julian Dodd（2014a）认为，撑起上述观点的那些考虑，把本体论问题与价值问题搅在了一起。照 Dodd 看，爵士在本体论上就像早期古典音乐：批评的焦点落在即兴演奏上，而不在它所实例化的作曲；可那部作曲并未因此就不是音乐作品。（调和之尝试见 Fisher 2018。）[^fisher-2018] 同样的理由，也可拿来对付上文那套越来越繁复的摇滚本体论。绕了一圈，我们又回到音乐本体论的方法论之争。
