    kind: body
    source: |-
      The debate over whether an artwork’s moral flaws are artistic flaws has focused almost exclusively on representational (especially narrative) art forms. (Gaut (2007) offers an excellent overview.) Music has largely been ignored because it has been assumed to lack sufficient representational capacity to embody an attitude toward some object. Maria José Alcaraz León (2012), however, argues that music’s emotional expressiveness is enough to apply arguments about whether moral flaws are artistic flaws to pure instrumental music. (For critical discussion, see Kania 2020: 254–5.)[^kania-2020] Musicologist Susan McClary argues that canonical works of instrumental classical music oppress women by expressing a positive attitude toward narratives of the subjection of feminine elements (e.g., certain musical themes) by masculine ones. (See, for example, McClary 1991: 19–23, 53–79; for critical discussion, see Maus (2011).)
    step1: |-
      关于艺术品的道德缺陷是否艺术缺陷的争论，几乎完全集中在再现性（尤其是叙事性）艺术形式上。（Gaut（2007）提供了出色的概述。）音乐大体被忽略，因为人们假定它缺乏足够的再现能力来体现对某对象的态度。然而，Maria José Alcaraz León（2012）主张，音乐的情感表现力足以让“道德缺陷是否艺术缺陷”的论证适用于纯器乐。 （批评性讨论见 Kania 2020: 254–5。）[^kania-2020] 音乐学家 Susan McClary 主张，器乐古典音乐的经典作品压迫女性，因为它们对“阳性的”要素对“阴性的”要素（如某些音乐主题）的征服叙事表达了一种肯定的态度。（例如见 McClary 1991: 19–23, 53–79；批评性讨论见 Maus（2011）。）
    step2: |-
      “作品的道德缺陷算不算艺术缺陷”，这场争论几乎全压在再现性艺术（尤其叙事艺术）上。（Gaut（2007）有出色的概述。）音乐被晾在一边，理由是它再现能力不足，体现不了对什么对象的态度。可是 Maria José Alcaraz León（2012）主张：音乐的情感表现力够用了，那套论证照样能落到纯器乐上。 （批评性讨论见 Kania 2020: 254–5。）[^kania-2020] 音乐学家 Susan McClary 则主张，器乐古典音乐的经典作品压迫女性：它们把“阳性”要素征服“阴性”要素（如某些音乐主题）的叙事，唱成了正面调子。（例如见 McClary 1991: 19–23, 53–79；批评性讨论见 Maus（2011）。）
