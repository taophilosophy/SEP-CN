      In contrast to all these realist views stand those of the anti-realists, who deny that there are any such things as musical works. An early proponent of such a view is Richard Rudner (1950), though it is difficult to say whether he is best interpreted as an eliminativist or a fictionalist, the two anti-realist views currently on the table. According to eliminativists, there are no such things as musical works, and thus we ought to stop trying to refer to them. Ross Cameron (2008) defends such a view, but only with respect to “Ontologese”—the language we speak when we do ontology. He argues that ordinary English locutions such as “there are many musical works” can be true without there being any musical works. (For critical discussion, see Predelli 2009 and Stecker 2009.)[^predelli-2009][^stecker-2009] According to fictionalists, the value of discourse about musical works is not truth, and thus we ought not to abandon the discourse despite the non-existence of its subject matter, but rather to adopt a different, make-believe attitude towards it (or perhaps we already do so). (See Kania 2008; for criticism, see D. Davies 2011: 45–50, Letts 2015, and Nussbaum 2021: 337.)[^davies-2011][^kania-2008][^letts-2015][^nussbaum-2021]
    step1: |-
      与所有这些实在论观点相对的是反实在论者的观点，他们否认存在音乐作品这种东西。这种观点的早期支持者是 Richard Rudner（1950），不过很难说他最好被理解为取消论者还是虚构论者——这是目前摆在桌面上的两种反实在论观点。按取消论者，不存在音乐作品这种东西，因此我们应当停止试图指称它们。Ross Cameron（2008）为这种观点辩护，但仅就“本体论语言”——我们做本体论时所说的语言——而言。他主张，“有许多音乐作品”这样的日常英语语句可以为真，而并不存在任何音乐作品。（批评性讨论见 Predelli 2009 与 Stecker 2009。）[^predelli-2009][^stecker-2009] 按虚构论者，关于音乐作品的话语，其价值不在真理，因此尽管其主题不存在，我们也不应放弃这种话语，而应对它采取另一种、假装态度（或者我们其实早已如此）。（见 Kania 2008；批评见 D. Davies 2011: 45–50、Letts 2015 与 Nussbaum 2021: 337。）[^davies-2011][^kania-2008][^letts-2015][^nussbaum-2021]
    step2: |-
      与上述实在论相对的，是反实在论：根本不承认有音乐作品这号东西。较早的倡言者是 Richard Rudner（1950），不过很难判定他究竟算取消论者还是虚构论者——这是眼下两种反实在论选项。取消论者说，既然没有音乐作品，我们就该干脆不再试图指称它们。Ross Cameron（2008）替这种说法辩护，但仅限于“本体论语言”，即我们做本体论时所用的那套话。他认为，“有许多音乐作品”这类日常英语说法可以为真，哪怕压根儿没有音乐作品。（批评性讨论见 Predelli 2009 与 Stecker 2009。）[^predelli-2009][^stecker-2009] 虚构论者则说，关于音乐作品的话语，其价值不在真假；主题虽不存在，话语却不必废弃，只需换一副“假装”的态度（说不定我们本来就是这副态度）。（见 Kania 2008；批评见 D. Davies 2011: 45–50、Letts 2015 与 Nussbaum 2021: 337。）[^davies-2011][^kania-2008][^letts-2015][^nussbaum-2021]
