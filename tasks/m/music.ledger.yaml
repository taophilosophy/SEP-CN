      Explications of the concept of music usually begin with the idea that music is organized sound. They go on to note that this characterization is too broad, since there are many examples of organized sound that are not music, such as human speech, or the sounds non-human animals and machines make. There are two further kinds of necessary conditions philosophers have added in attempts to fine tune the initial idea. One is an appeal to “tonality” or essentially musical features such as pitch and rhythm (Scruton 1997: 1–79; Hamilton 2007: 40–65; Kania 2011a)[^hamilton-2007][^kania-2011a][^scruton-1997]. Another is an appeal to aesthetic properties or experience (Levinson 1990a; Scruton 1997: 1–96; Hamilton 2007: 40–65)[^hamilton-2007][^levinson-1990a][^scruton-1997]. As these references suggest, one can endorse either of these conditions in isolation, or both together.
    step1: |-
      对音乐概念的阐释通常从音乐是组织化的声音这一想法开始。接下来他们指出，这一刻画过于宽泛，因为有许多组织化的声音并非音乐，例如人类言语，或非人动物与机器发出的声音。哲学家为了微调最初的观念，又添加了两类进一步的必要条件。一类诉诸“调性”，或音高与节奏这类本质上属于音乐的特征（Scruton 1997: 1–79；Hamilton 2007: 40–65；Kania 2011a）[^hamilton-2007][^kania-2011a][^scruton-1997]。另一类诉诸审美属性或审美经验（Levinson 1990a；Scruton 1997: 1–96；Hamilton 2007: 40–65）[^hamilton-2007][^levinson-1990a][^scruton-1997]。正如这些引文所示，人们可以单独接受两类条件中的一类，也可以两者兼取。
    step2: |-
      阐释“音乐”概念，通常从“音乐是组织化的声音”这一想法入手。不过论者随即指出，这个说法太宽：人类言语，非人动物与机器发出的声音，都是组织化的声音，却不是音乐。为了收紧最初的观念，哲学家又补了两类必要条件。一类诉诸“调性”，即音高、节奏这类本质上属于音乐的特征（Scruton 1997: 1–79；Hamilton 2007: 40–65；Kania 2011a）[^hamilton-2007][^kania-2011a][^scruton-1997]。另一类诉诸审美属性或审美经验（Levinson 1990a；Scruton 1997: 1–96；Hamilton 2007: 40–65）[^hamilton-2007][^levinson-1990a][^scruton-1997]。从这些文献可以看出，两类条件可以单独采用，也可以一并采用。
