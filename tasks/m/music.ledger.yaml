      The most widely discussed philosophical question concerning music and the emotions is that of how music can express emotions. (For a more extensive introduction, see part II of Gracyk & Kania 2011; for a thorough treatment, see S. Davies 1994.)[^davies-1994][^gracyk-2011][^gracyk-2011-2] There is a second group of questions centered around listeners’ emotional responses to music. These include questions about why and how we respond emotionally to music, the value of such responses, and why we choose to listen to music that elicits “negative” responses from us, such as sadness. Theorists typically restrict themselves to “pure” or “absolute” music on the grounds that it is easier to understand how music with an accompanying text, say, could express the emotions evident in the text. However, an important criterion for the evaluation of such music is how appropriately the composer has set her chosen text to music. So an accompanying text is clearly not sufficient for the musical expression of an emotion. Thus, a better reason for initially putting such music to one side is perhaps that the interrelation of music and text, or other elements, is likely to be highly complex, and best approached with as well-developed a theory of the more basic phenomena in hand as possible. (For an extended criticism of this approach, see Ridley 2004: 1–104.)[^ridley-2004]
    step1: |-
      关于音乐与情感，讨论最广的哲学问题是：音乐何以能表达情感。（更全面的导论见 Gracyk & Kania 2011 第二部分；详尽的讨论见 S. Davies 1994。）[^davies-1994][^gracyk-2011][^gracyk-2011-2] 第二组问题围绕听众对音乐的情感反应。这些问题包括：我们为何、如何对音乐产生情感反应，这类反应的价值何在，以及我们为何偏偏选择聆听那些在我们身上引出“负面”反应（例如悲伤）的音乐。理论家通常把自己限定在“纯”或“绝对”音乐上，理由是：配有文字的音乐如何表达文字中显见的情感，比较好懂。然而，评价这类音乐的一个重要标准，恰是作曲家把所选文字配上音乐配得是否妥帖。所以，伴文显然不足以保证音乐的情感表达。因此，一开始把这类音乐放在一边的更好理由，也许是：音乐与文字（或其他要素）之间的相互关系可能极其复杂，最好在手头备有尽可能成熟的关于更基本现象的理论再来处理。（对这一进路的长篇批评，见 Ridley 2004: 1–104。）[^ridley-2004]
    step2: |-
      音乐与情感的话题里，最热闹的哲学问题是：音乐凭什么能表达情感。（更全面的导论见 Gracyk & Kania 2011 第二部分；最详尽的讨论见 S. Davies 1994。）[^davies-1994][^gracyk-2011][^gracyk-2011-2] 另一组问题围着听众的情感反应转：我们为何、如何对音乐起情感反应，这类反应有何价值，以及我们为何偏偏去听那些让人“难受”（比如悲伤）的音乐。理论家通常只谈“纯”音乐或“绝对”音乐，理由是：带着歌词的音乐如何唱出歌词里明摆着的情感，似乎不难理解。可别忘了，评价这类音乐的一个重要标准，正是作曲家把文字配进音乐时配得妥不妥帖——伴文显然不等于音乐的情感表达。所以，先把它搁下的更好理由，也许是：音乐与文字（或其他要素）的相互关系太复杂，最好等手上有了足够成熟的、关于更基本现象的理论，再回头收拾。（对这一安排的长篇批评，见 Ridley 2004: 1–104。）[^ridley-2004]
