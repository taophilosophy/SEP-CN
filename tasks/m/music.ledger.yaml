      The question that naturally arises next is what it is about the experience an artwork affords that makes it valuable. That *pleasure* is a non-negligible part of the answer to this question is the second point upon which there is some consensus (S. Davies 1987: 198–205; Levinson 1992; Kivy 1997b: 212–17)[^davies-1987][^kivy-1997b][^levinson-1992]. However, concomitant with this consensus is an acknowledgment that simple pleasure taken, say, in the sensuousness of the musical sounds is too trivial to ground the great value widely attributed to music. In looking for other sources, the puzzle that arises is that music is supposed to be an abstract art, *par excellence*. If this means that music is divorced from everything else that concerns us in the “real world” (that is, extra-musical life), it is puzzling why we should find so valuable the experiences musical works afford.
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      There are a couple of dimensions to most solutions of the puzzle of pure music’s value. One is the extent to which it is agreed that music really is abstract. To the extent that one thinks that music is *not* divorced from the real world, one will be able to argue that music’s value is at least no more puzzling than the value of arts more obviously related to the real world, such as literature and representational painting and sculpture. The other dimension to most solutions of the puzzle of pure music’s value is the extent to which one thinks the abstractness of music is the source of its value. Thus, two theorists might agree on the extent to which music is related to the real world (by being expressive, say), yet one locate its primary value in that expressiveness while the other locates it in its abstract, purely formal features.
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      Unsurprisingly, those who take the experience of music’s expressiveness to be a more intimately emotional one (through being predicated on imaginative engagement with the music, say), tend to emphasize that experience as more central to musical understanding, and thus attribute a larger part of music’s value to its expressiveness. Those, on the other hand, whose theory of the experience of musical expressiveness is more distanced (a matter of noticed resemblance, say), tend to place less weight on this element in their theories of musical value. At one extreme of this spectrum is the position that denies music to be expressive at all, and thus cannot attribute any of music’s value to its expressiveness (most notably Hanslick 1854; see also Zangwill 2004)[^hanslick-1854][^zangwill-2004]. Most theorists agree, however, that music’s value is to be located in different kinds of experience, including the experience of formal and expressive features; their disagreements are mostly about the relative weight of these different kinds of experiences in a complete account of musical value.
    step1: TBD
    step2: TBD
