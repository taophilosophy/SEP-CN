      The central kind of authenticity that has been discussed is authenticity with respect to the instantiation of the work. Most agree that the fullest such authenticity requires the production of the right pitches and rhythms in the right order. (For skepticism based on the history of the practice, see Dyck 2014; Ravasio 2019a; and the discussion in Dodd 2020b and Ravasio 2020.)[^dodd-2020b][^dyck-2014][^ravasio-2019a][^ravasio-2020] *Pure sonicists* argue that this is sufficient (e.g., Kivy 1988a)[^kivy-1988a]. *Timbral sonicists* argue that these pitches must also have timbres reflecting the composer’s instrumentation (e.g., Dodd 2007: 201–39)[^dodd-2007]. *Instrumentalists* argue that such sounds must be produced on the kinds of instruments specified in the score (e.g., Levinson 1990c)[^levinson-1990c]. Much of the debate is over what kinds of aesthetic or artistic properties are essential to musical works. If the limpid textures of Bach’s *Brandenburg Concerto No. 5* are essential to it, then one cannot authentically instance the work using a grand piano instead of a harpsichord. As such, the debate reflects a wider one in aesthetics, musical and otherwise, between *formalists* (or empiricists, or structuralists), who believe that the most important properties of a work are intrinsic ones, accessible to listeners unaware of the historical and artistic context in which it was created, and *contextualists*, who believe that a work is essentially tied to its context of creation. Stephen Davies has argued for a strong contextualism, claiming that one cannot give a single answer to the question of whether particular instrumentation is required for the fully authentic instantiation of a work. Works can be ontologically “thicker” or “thinner” as a result of the specifications of a composer working within certain conventions (1991, 2001). The more properties of a fully authentic performance a particular work specifies, the thicker it is. Thus for some works (typically earlier in the history of Western music) instrumentation is flexible, while for others (e.g., Romantic symphonies) quite specific instrumentation is required for fully authentic performances.
    step1: |-
      讨论最多的核心一类，是就作品实例化而言的本真性。多数人同意，最充分的本真性要求以正确的顺序奏出正确的音高与节奏。（基于实践史的怀疑，见 Dyck 2014；Ravasio 2019a；以及 Dodd 2020b 与 Ravasio 2020 中的讨论。）[^dodd-2020b][^dyck-2014][^ravasio-2019a][^ravasio-2020] *纯声音论者*主张这就够了（例如 Kivy 1988a）[^kivy-1988a]。*音色声音论者*主张，这些音高还须带有反映作曲家配器设想的音色（例如 Dodd 2007: 201–39）[^dodd-2007]。*乐器论者*主张，这些声音必须用乐谱指定的那类乐器奏出（例如 Levinson 1990c）[^levinson-1990c]。争论的许多内容在于：哪些审美或艺术属性对音乐作品是本质性的。如果巴赫《勃兰登堡协奏曲第五号》清澈的织体对它来说是本质性的，那就不能用三角钢琴代替大键琴来本真地实例化这部作品。因此，这场争论反映了美学中一场更广泛的争论——音乐的与其他领域的——一方是*形式主义者*（或经验主义者、结构主义者），相信作品最重要的属性是内在属性，未意识到其创作的历史与艺术语境的听众也能把握；另一方是*语境主义者*，相信作品本质上与其创作语境相连。Stephen Davies 主张一种强语境主义，声称对于“完全本真地实例化一部作品是否需要特定配器”这一问题，不能给出单一答案。由于作曲家在某些惯例内工作所作的规定，作品可以在本体论上“更厚”或“更薄”（1991, 2001）。一部作品对完全本真的演奏所规定的属性越多，它就越厚。因此，对某些作品（通常是西方音乐史上较早的作品），配器是灵活的；对另一些作品（例如浪漫主义交响曲），则需要相当具体的配器才算完全本真的演奏。
    step2: |-
      讨论最多的核心一类，是就作品实例化而言的本真性。多数人同意，最充分的本真性要求以正确顺序奏出正确的音高与节奏。（基于实践史的怀疑见 Dyck 2014、Ravasio 2019a，以及 Dodd 2020b 与 Ravasio 2020 的讨论。）[^dodd-2020b][^dyck-2014][^ravasio-2019a][^ravasio-2020] *纯声音论者*说，这就够了（如 Kivy 1988a）[^kivy-1988a]。*音色声音论者*说，不够：音高还须带上反映作曲家配器设想的音色（如 Dodd 2007: 201–39）[^dodd-2007]。*乐器论者*说，还不够：这些声音必须出自乐谱指定的那类乐器（如 Levinson 1990c）[^levinson-1990c]。争论的焦点，多半是哪些审美或艺术属性对音乐作品具有本质性。倘若巴赫《勃兰登堡协奏曲第五号》那清澈的织体是本质性的，用三角钢琴代替大键琴，就不算本真地实例化这部作品。这么一来，争论便映照出美学中一场更大的争论——不限于音乐：*形式主义者*（或经验主义者、结构主义者）相信，作品最重要的属性是内在的，听众即便不了解创作的历史与艺术语境，也能把握；*语境主义者*则相信，作品本质上系于其创作语境。Stephen Davies 力主强语境主义：对于“完全本真地实例化一部作品是否需要特定配器”，没有一刀切的答案。作曲家在某些惯例内工作，其规定可使作品在本体论上“更厚”或“更薄”（1991, 2001）：一部作品对完全本真演奏所规定的属性越多，它就越厚。于是，有些作品（通常是西方音乐史上较早的）配器灵活；另一些作品（如浪漫主义交响曲）则须有相当具体的配器，才算完全本真的演奏。
