      音乐体验的底层似乎是：（i）对*音*的体验，而非对各种频率的纯声音的体验；这里的音被听作处在“音乐空间”中，即与其他音保持高低或同类（八度）关系；（ii）对*运动*的体验，例如我们听到一段旋律跃起、远游，然后回到起点歇下。Roger Scruton（1983; 1997: 1–96）主张，这些体验不可还原地是隐喻性的，因为它们把空间概念用于并非字面空间的东西。（旋律中并没有一个可辨认的个体从一处移到另一处（S. Davies 1994: 229–34）[^davies-1994]。）Malcolm Budd（1985b）主张，在此语境中诉诸隐喻并不能说明什么，因为第一，不清楚一种*经验*是隐喻性的意味着什么；第二，隐喻只有通过解释才获得意义，而 Scruton 不仅未给出解释，还主张解释不可得。Budd 提出，这个隐喻*是*可还原、从而可消除的，看来可以用纯音乐（即非空间的）概念或词汇来还原。Stephen Davies（1994: 234–40）怀疑空间词汇能否被消除，但他同情 Budd 对隐喻中心地位的拒斥。他转而主张，我们用空间与运动术语来描述音乐，是这些术语的一种次要但字面的用法；这种用法广泛用于描述时间过程，如股市的起伏、人所处的理论立场、情绪的低落等等。争论在 Budd 2003、Scruton 2004 与 S. Davies 2011d 中继续。
