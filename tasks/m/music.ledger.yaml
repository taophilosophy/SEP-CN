      Having discussed complications, it’s worth returning to the basic idea of “organized sound.” Most theorists note that music does not consist entirely of sounds. Most obviously, much music includes rests. You might think that silence can function only to organize the sounds of music. One counterargument is that an understanding listener *listens to* the rests, just as she listens to the sounds (Kania 2010)[^kania-2010]. Another is to provide putative cases of music in which the silences do not structure sounds as ordinary rests do. John Cage’s *4′33″* is frequently discussed, though there is broad agreement that this piece is not silent—its content is the ambient sounds that occur during its performance. (See Dodd 2018 for dissent.)[^dodd-2018] Anyway, S. Davies (1997a), Dodd (2018), and Kania (2010) all argue that Cage’s piece is not music—Davies and Dodd because its sounds (if any) fail to qualify as organized, Kania because they fail to meet a tonality condition. Wadle (forthcoming) argues that the piece *is* music, because of its contextual connections to previous musical works. Kania considers several other contenders for the label of “silent music,” arguing that there are indeed extant examples, most notably Erwin Schulhoff’s “In Futurum” from his *Fünf Pittoresken*, which predates Cage’s *4′33″* by some 33 years.
    step1: |-
      讨论完这些复杂情况，值得回到“组织化的声音”这一基本想法。大多数理论家注意到，音乐并不完全由声音构成。最明显的是，许多音乐包含休止。你也许认为，静默只能用来组织音乐的声音。一种反驳是，理解力强的听者会*聆听*休止，就像她聆听声音一样（Kania 2010）[^kania-2010]。另一种反驳是给出一些据称是音乐的例子，其中的静默并不像普通休止那样组织声音。约翰·凯奇的《4′33″》常被讨论，不过人们普遍同意，这首作品并不静默——它的内容是演奏期间发生的环境声音。（异议见 Dodd 2018。）[^dodd-2018] 无论如何，S. Davies（1997a）、Dodd（2018）与 Kania（2010）都主张凯奇这首作品不是音乐——Davies 与 Dodd 因为它的声音（如果有的话）算不上组织化的，Kania 因为它不满足调性条件。Wadle（即将发表）主张这首作品*是*音乐，因为它与先前的音乐作品有语境上的联系。Kania 还考察了其他几个“静默音乐”的候选者，主张确实存在现成的例子，最著名的是埃尔温·舒尔霍夫的 *Fünf Pittoresken* 中的“In Futurum”，它比凯奇的《4′33″》早了约 33 年。
