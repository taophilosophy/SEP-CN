      处于柏拉图主义与唯名论之间的是 Philip Letts（2018）与 Guy Rohrbaugh（2003）的观点。Letts 主张，任何把音乐作品视为*类型*的观点，都可以通过把这些类型等同于其相关属性而得到改进；这一提议既可以向柏拉图主义方向发展，也可以向唯名论方向发展。Rohrbaugh 把音乐作品视为*历史个体*，“体现于”乐谱与演奏等物理事物之中，但并不由它们构成；这一观点与上文讨论的 Nussbaum 和 Magnus 的观点十分相似，但 Rohrbaugh 认为作品是超出其体现物之上的抽象对象。（讨论见 Dodd 2007: 143–66。）[^dodd-2007]
