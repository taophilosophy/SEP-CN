      Nominalists identify a musical work with something concrete. The most obvious candidate is a collection of performances, whether the collection be understood as a set (Goodman 1968; Predelli 1995, 1999a, 1999b, 2001)[^goodman-1968][^predelli-1995], a fusion (Caplan & Matheson 2004, 2006)[^caplan-2004], or something more esoteric (Tillman 2011; see also Moruzzi 2018)[^moruzzi-2018][^tillman-2011]. Charles Nussbaum (2007: 143–87) and P. D. Magnus (2012) argue for a close analogy between musical works and species. Nussbaum (2021: 334) points out that a sophisticated nominalist theory of species has been developed in great detail over the years by Ruth Millikan (1984, 2000). While such views are attractive because they appeal only to the least problematic kinds of entities, they face serious challenges. Though many of our claims about musical works may be paraphraseable into claims about sets of (possible) performances, some seem to make intractable reference to works. For instance, most performances of The Rite of Spring—even including the possible ones—include several wrong notes. Thus it is difficult to imagine how the paraphrase schema will avoid the nonsensical conclusion that The Rite of Spring contains several wrong notes, if the work consists entirely of performances. In response to this problem, most nominalists add to the collection of performances some provenential item, such as an original score or act of composition. Whether this addition can solve the problem without necessitating the reintroduction of an abstract entity is one question any nominalist must address.
    step1: |-
      唯名论者把音乐作品等同于某种具体之物。最明显的候选者是演奏的集合，不管这个集合被理解为集合（Goodman 1968; Predelli 1995, 1999a, 1999b, 2001）[^goodman-1968][^predelli-1995]、融合体（Caplan & Matheson 2004, 2006）[^caplan-2004]，还是更玄妙的东西（Tillman 2011; 另见 Moruzzi 2018）[^moruzzi-2018][^tillman-2011]。Charles Nussbaum（2007: 143–87）与 P. D. Magnus（2012）主张音乐作品与物种之间有紧密类比。Nussbaum（2021: 334）指出，Ruth Millikan（1984, 2000）多年来已详尽发展出一套精致的物种唯名论。这类观点有吸引力，因为它们只诉诸最不成问题的实体，但也面临严峻挑战。虽然我们关于音乐作品的许多说法也许可以改述为关于（可能的）演奏集合的说法，有些说法似乎不可避免地指涉作品本身。例如，《春之祭》的大多数演奏——即便把可能的演奏也算上——都包含若干错音。因此，如果作品完全由演奏构成，就很难想象这种改述方案如何避免“《春之祭》包含若干错音”这一荒谬结论。为回应此问题，多数唯名论者在演奏集合之外再加上某种来源性条目，如原始乐谱或作曲行动。这一添加能否在不重新引入抽象实体的前提下解决问题，是任何唯名论者都必须回答的问题。
