      Julian Dodd (2020a) argues that there is more than one way to be true to a musical work, and thus to produce an authentic performance: One can comply with the score, or one can be true to the music’s overall integrity or point (136). When the two conflict, interpretive authenticity trumps score-compliance authenticity (147) because the fundamental norm of work-performance practice is to perform it in a way that evinces a subtle or profound understanding of it (163), while score compliance is valued only because it tends to lead to such performances. Andrew Kania responds that it is unclear whether, even by the lights of Dodd’s own theory, Dodd’s central examples are cases of interpretive authenticity trumping score compliance (Kania 2022: 131–2)[^kania-2022]. More importantly, he argues that Dodd’s conception of the music’s overall integrity or point misses the importance of the surface-level details to a work’s meaning or content. Kania suggests, instead, that the fundamental norm of the practice is to evince an understanding of the work *through* complying with its score (2022: 127, italics altered).
