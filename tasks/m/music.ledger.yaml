      A second way to link music’s expressiveness with actual felt emotions is through the audience. According to arousalism, the expressiveness of a passage of music amounts to its tendency to arouse that emotion in a competent listener. Arousalism faces several objections. First, some competent listeners seem emotionally unmoved by music (or are at least not moved to the specific emotions expressed by it). But perhaps the arousalist can simply restrict the class of listener to which his theory appeals to those who are so moved. Second, some emotions, such as fear, require a particular kind of intentional object (something threatening), yet there is no such object at hand when we hear fearful music. Thus it seems implausible to claim the music’s fearfulness resides in its arousal of fear in us. But perhaps the arousalist can broaden the class of aroused emotions to include appropriate *responses* to the expressed emotion, such as pity. Third, in many cases it seems that listeners respond emotionally to the expressiveness of the music. It is not clear that the arousalist can handle such cases non-circularly. (A sophisticated defense of the arousal theory is to be found in Matravers 1998: 145–224, though see the second thoughts in Matravers 2011. For an extended critique, see S. Davies 1994: 104–200.)[^davies-1994][^matravers-1998][^matravers-2011]
    step1: |-
      把音乐的表现力与实际被感受到的情感联系起来的第二条途径是经由听众。按唤起论，一段音乐的表现力，就在于它使有能力的听者唤起那种情感的倾向。唤起论面临几个反驳。第一，一些有能力的听者似乎不为音乐所动（或至少没有被引向音乐所表达的特定情感）。但唤起论者也许可以简单地把其理论诉诸的听者范围，限定于那些被打动的人。第二，有些情感（如恐惧）需要特定种类的意向对象（有威胁之物），而我们听到令人恐惧的音乐时，手边并没有这种对象。因此，说音乐的可怕在于它在我们身上唤起恐惧，似乎难以置信。但唤起论者也许可以把被唤起的情感范围扩大，纳入对被表达情感的恰当*反应*，如怜悯。第三，在许多情形中，听众似乎是对音乐的表现力作出情感反应。唤起论者能否不循环地处理这类情形，并不清楚。（唤起论的精致辩护见 Matravers 1998: 145–224，但 Matravers 2011 有所反悔。长篇批评见 S. Davies 1994: 104–200。）[^davies-1994][^matravers-1998][^matravers-2011]
    step2: |-
      第二条路从听众下手。唤起论说：一段音乐的表现力，就是它让称职的听者唤起相应情感的倾向。毛病有好几处。第一，有些称职的听者面对音乐无动于衷（至少没被引向音乐所表达的那种情感）。不过唤起论者大概可以说：我的理论只管被打动的那批听众。第二，有些情感（如恐惧）需要特定的意向对象（有威胁的东西），可听恐怖音乐时，眼前并没有这么个对象。因此，说音乐的可怕就在于它在我们身上唤起恐惧，实在难以置信。唤起论者也许可以退一步，把被唤起的情感扩成对被表达情感的恰当*反应*，比如怜悯。第三，许多时候听众是对音乐的表现力本身起情感反应；唤起论者能不能不绕圈子地处理这种情形，还不好说。（唤起论的精致辩护见 Matravers 1998: 145–224，不过 Matravers 2011 改了口风。长篇批评见 S. Davies 1994: 104–200。）[^davies-1994][^matravers-1998][^matravers-2011]
