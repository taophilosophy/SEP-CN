      Alan Goldman（1992）反对音乐特别适合表达情感这一想法，声称绘画、文学之类再现性艺术在这方面更胜一筹。此外，他质疑上文给出的表现力价值的根据。例如，他否认音乐能教给我们多少关于情感的东西，也否认我们能品味对表现性音乐的负面情感反应。同样，Malcolm Budd 在详尽讨论音乐表现力本性之后，主张这种表现力远不足以解释音乐的价值（1995: 155–7）。他指出，许多有价值的音乐并不具表现力；在比较评价中，不同作品表现力相当，也会被它们在形式价值上的差异所压过。
