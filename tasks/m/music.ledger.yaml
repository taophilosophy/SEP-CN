      ### 3.2 Emotions in the Listener
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      There are three main questions asked about our emotional responses to pure music, apart from what role they play in expressiveness. The first is analogous to the “paradox of fiction.” It is not clear why we should respond emotionally to music’s expressiveness when we know that no one is undergoing the emotions expressed. The second is a variant of the “paradox of tragedy.” If some music arouses “negative” emotional responses in us, such as sadness, why do we seek out the experience of such music? This leads to the more general question of the value of our emotional responses to music. The first two questions are addressed in this section, and the third in section 5.1.
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      Peter Kivy (1999) argues that those who report emotional reactions to music are confusing the pleasure they take in the beauty of the music, in all its expressive individuality, with the feeling of the emotion expressed. Though most philosophers appeal to ordinary experience and empirical data to reject the plausibility of Kivy’s position, they admit the problem that motivates it, namely, the conceptual tension between the nature of music and the nature of the emotions we feel in response to it. There is some consensus that emotions are cognitive, in the sense that they take intentional objects—they are *about* things—of certain kinds. For instance, in order to feel *fear*, one must believe that something is *threatening* (the “intentional object” of the emotion). When one listens to a sad piece of music, however, one knows there is nothing literally feeling sad, and thus it is puzzling that one should be made sad by the experience.
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      Part of the solution is that not all emotional responses (broadly construed) are cognitive (Robinson 1994; 2005: 387–400)[^robinson-1994]. For instance, it is no more puzzling that one could be startled by a *fortissimo* blow to a bass drum than that one could so respond to a thunderclap. Another part of the solution is that the music can be the object of our emotions, as when we are delighted by an effective ending to a long and complex piece.
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      As for emotional responses to music’s expressiveness, there are at least two possible explanations. One appeals to the phenomenon of “emotional contagion” or “mirroring responses” (S. Davies 1994: 279–307; 2006: 186–8)[^davies-1994]. When surrounded by moping people, one tends to become sad. Moreover, such a “mood” is not *about* some intentional object. One is not necessarily sad *for* the mopers, nor whatever they are sad about, if anything. Similarly, when “surrounded” by music that presents an appearance of sadness, one might become sad, but not sad about the music, or anything else (Radford 1991). For critical discussion, see Robinson 2005: 379–412 and S. Davies 2011b.
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      If our experience of music’s expressiveness necessarily involves *imagining* that the music is a literal expression of emotion, then our emotional responses to that expressiveness are no more puzzling than emotional responses to other imagined expressive agents, such as fictional characters in novels. The advantage is only slight because the question of how and why we respond emotionally to fictions is itself a philosophical problem of some magnitude. Nonetheless, there are several theories available (see the entry on emotional responses to fiction). One difficulty with appealing to a solution to the paradox of fiction is that it is not clear that our emotional responses to the expressiveness of music are the same as those to emotionally expressive characters. For instance, the standard example of an emotional response to music is being made sad by a dirge, while the standard example of emotional response to fiction is (something like) to feel pity for a sad character. If the former is to be explained in the same way as the latter, we would expect listeners to feel *pity* in response to the funeral march (pity for the persona imagined to be expressing her sadness through it). However, we surely do feel sad (in some sense) in response to tragedy, and it is not obvious that we do *not* feel pity (or imagined pity, or whatever one’s preferred theory of emotional response to fiction posits) in response to sad music.
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      Leaving behind the topic of how and why we respond emotionally to music, we turn to the question of why we seek out music that arouses “negative” emotions in us, such as sadness, assuming henceforth that we are in fact aroused to such emotions. (Since this problem is a close analog of the “paradox of tragedy,” some of the references below are to literature not explicitly about music, but the transposition of the arguments to music is not difficult to imagine. (See also the entry on the paradox of tragedy.) Most solutions assume that our negative emotional response is a price we are willing to pay for the benefits of engaging with the piece in question. The benefits appealed to include understanding and appreciating the music, including the expressiveness responsible for the negative response (Goodman 1968: 247–51; S. Davies 1994: 311–20; Goldman 1995: 68; Robinson 2005: 348–78)[^davies-1994][^goldman-1995][^goodman-1968][^robinson-2005].
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      A different benefit is Aristotelian *catharsis*, in which our negative emotional response to expressive art results in a psychological purgation of the negative emotions (Aristotle 1987: 6, 1449b21–1450b20)[^aristotle-1987]. A less therapeutic approach is the suggestion that, since these emotions are without “life implications” (that is, as discussed above, we are not sad *about* any actual tragic events), we are able to take advantage of our responses to savor these emotions, gain an understanding of them, and be reassured that we have the capacity to feel them (Levinson 1982)[^levinson-1982]. Two things that must be explained by any defender of this kind of response are, first, our persistence in seeking out music that elicits negative emotional experiences after we have received the resulting benefit and, second, the enjoyment we seem to take in these negative responses, as opposed to putting up with them for their related benefits.
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      A different kind of solution to the problem argues that responses such as sadness that are evoked by expressive music are not really negative. Hume (1757) argues, with respect to tragedy, that the pleasure we take in the mode of presentation of the content of an artwork does not simply counterbalance the negative emotion evoked, but rather subsumes and transforms it into a pleasurable feeling. Kendall Walton argues (also with respect to tragedy) that sadness is not in itself negative. Rather, it is the situation to which sadness is the response that is negative. Thus, though we would not seek out the death of a loved one, *given* the death we “welcome” the sorrow (K. Walton 1990: 255–9)[^walton-1990]. Similarly, we cannot affect the sadness of a musical work by not listening to it, and so we welcome our sorrowful response to it as appropriate. Berys Gaut (2007: 203–26) argues that though sadness is *typically* aroused by situations we would prefer to avoid, sadness in response to artistic expressiveness is an exception and thus not negative in any paradoxical way. A difficulty for all three solutions is the extent to which they accord with our emotional experience in rejecting the characterization of our sadness as negative.
    step1: TBD
    step2: TBD
