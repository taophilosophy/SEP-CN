      Even if these three reasons are compelling (see Ridley 2004 for a sustained critique)[^ridley-2004], music’s combination with other media raises further philosophical questions. There is no space to consider those questions here, but on the aesthetics of song, see Levinson 1987; Gracyk 2001; Bicknell & Fisher 2013; and Bicknell 2015. On music drama, see Kivy 1988b, 1994; Goehr 1998; and Penner 2020. On film music, see Carroll 1988: 213–225; Smith 1996; Levinson 1996b; and Kivy 1997a. See also the chapters in part V of Gracyk & Kania 2011. On hybrid art forms more generally, see Levinson 1984 and Ridley 2004.
