      Musical ontology is the study of the kinds of musical things there are and the relations that hold between them. The most discussed issues within this field have been the metaphysical nature of works of Western classical music (the “fundamentalist debate”), and what it is to give an “authentic performance” of such works. Recently there has been growing interest in the ontologies of other Western musical traditions, such as rock and jazz, and discussion of the methodology and value of musical ontology. (For more detailed overviews of these debates, see Matheson & Caplan 2011, and Nussbaum 2021.)[^matheson-2011][^nussbaum-2021]
    step1: |-
      音乐本体论研究存在哪些种类的音乐事物，以及它们之间保持什么关系。这一领域讨论最多的问题，是西方古典音乐作品的形而上学本性（“基础主义之争”），以及什么算是这类作品的“本真演奏”。晚近以来，人们对摇滚与爵士等其他西方音乐传统的本体论，以及对音乐本体论的方法论与价值的讨论，兴趣日增。（关于这些争论更详细的概述，见 Matheson & Caplan 2011 与 Nussbaum 2021。）[^matheson-2011][^nussbaum-2021]
    step2: |-
      音乐本体论研究音乐世界里有哪些东西、它们之间又有什么关系。这个领域谈得最多的，是西方古典音乐作品的形而上学本性（“基础主义之争”），以及什么叫这类作品的“本真演奏”。近来，摇滚、爵士等其他西方音乐传统的本体论，连同音乐本体论的方法论与价值，也日益受到关注。（更详细的概述见 Matheson & Caplan 2011 与 Nussbaum 2021。）[^matheson-2011][^nussbaum-2021]
