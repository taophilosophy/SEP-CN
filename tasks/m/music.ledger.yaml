      It might seem that, since musical works are ontologically multiple, once we have figured out their true nature, we will know what relation holds between the work and its performances, namely, whatever relationship holds between entities of that kind and their instances. However, since the fundamentalist debate is about the basic ontological category to which works belong, resolving that debate may leave open many questions about the relation between a work and its performances. For instance, is the use of a harpsichord required to instance Bach’s *Brandenburg Concerto No. 5* in performance? Would producing harpsichord-like sounds on a synthesizer do just as well? What about using another keyboard instrument from Bach’s time, or a modern piano? Learning that musical works are, say, eternal types will not necessarily help settle this issue of “authentic performance,” which is perhaps the most discussed music-ontological issue, of interest to philosophers, musicologists, musicians, and audiences alike. (For an excellent overview of the authentic performance debate, see S. Davies 2001: 201–53. For an investigation of authenticity with respect to things other than instantiation of the work, see Kivy 1995; Gracyk 2001, 2009, 2017; Bicknell 2015; and Cray 2019.)[^bicknell-2015][^cray-2019][^davies-2001][^gracyk-2001][^kivy-1995]
    step1: |-
      也许有人会想：既然音乐作品在本体论上是多重的，那么一旦弄清它们的真实本性，我们就会知道作品与其演奏之间保持什么关系，即那种实体与其实例之间通常保持的关系。然而，由于基础主义之争关乎作品所属的基本本体范畴，解决那场争论，可能仍会留下许多关于作品与演奏之关系的问题。例如，演奏巴赫《勃兰登堡协奏曲第五号》时，是否必须使用大键琴？在合成器上制造类似大键琴的声音，是否同样可以？使用巴赫时代的另一件键盘乐器，或现代钢琴，又如何？即便知道音乐作品是永恒类型之类，也未必有助于解决这个“本真演奏”问题——它也许是讨论最多的音乐本体论问题，哲学家、音乐学家、音乐家与听众都关心。（关于本真演奏之争的出色概述，见 S. Davies 2001: 201–53。关于作品实例化之外的“本真性”研究，见 Kivy 1995; Gracyk 2001, 2009, 2017; Bicknell 2015；以及 Cray 2019。）[^bicknell-2015][^cray-2019][^davies-2001][^gracyk-2001][^kivy-1995]
    step2: |-
      有人也许会想：音乐作品在本体论上是多重的，弄清其真实本性之后，作品与演奏的关系自然就明白了——无非是这类实体与其实例之间的通常关系。可惜事与愿违。基础主义之争问的是作品属于哪个基本本体范畴；就算这场争论有了结果，作品与演奏的关系仍可能留着一大堆问号。比方说，演奏巴赫《勃兰登堡协奏曲第五号》，非得用大键琴吗？用合成器做出类似大键琴的声音，算不算数？换成巴赫时代的另一件键盘乐器，或者现代钢琴呢？就算知道作品是永恒类型之类，也未必能替这个“本真演奏”问题定案——而这大概是音乐本体论里讨论最多的问题，哲学家、音乐学家、音乐家、听众都关心。（本真演奏之争的出色概述见 S. Davies 2001: 201–53；作品实例化之外的“本真性”研究见 Kivy 1995、Gracyk 2001, 2009, 2017、Bicknell 2015 与 Cray 2019。）[^bicknell-2015][^cray-2019][^davies-2001][^gracyk-2001][^kivy-1995]
