      Intermediate between Platonism and nominalism are the views of Philip Letts (2018) and Guy Rohrbaugh (2003). Letts argues that any view of musical works as *types* would be improved by identifying those types with their associated properties, a proposal that may be developed in a Platonist or nominalist direction. Rohrbaugh’s view of musical works as *historical individuals* “embodied in,” but not constituted by, physical things such as scores and performances closely resembles to the views of Nussbaum and Magnus, discussed above, but Rohrbaugh takes the work to be an abstract object over and above its embodiments. (For discussion, see Dodd 2007: 143–66.)[^dodd-2007]
