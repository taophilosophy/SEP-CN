    source: |-
      In this piece moral learning is taken to comprise the acquisition of norms and values in the moral domain. The investigation of the acquisition of such norms and values stretches back to antiquity, and it has received focused attention in contemporary moral psychology.
    step1: |-
      本文把道德学习理解为道德领域中规范与价值的获得。对这种规范与价值之获得的研究可追溯至古代，并在当代道德心理学中受到集中关注。
    step2: |-
      本文所说的道德学习，指在道德领域中习得规范与价值。对这类规范与价值如何习得的研究，远可追溯至古代，近在当代道德心理学中备受关注。
  - id: 2
    kind: body
    source: |-
      Moral prohibitions are found in virtually every culture (Brown 1991)[^brown-1991]. But there is considerable cultural variability on which groups count morally. The Mbuti think that it is wrong to steal from each other, but acceptable to take from outsiders (Turnbull 1972)[^turnbull-1972]. The morality surrounding incest is also variable across cultures. In some cultures (e.g. parts of Korea), first-cousin marriage is absolutely forbidden; in other cultures (e.g., in Saudi Arabia), it is permitted; in other cultures (e.g., parts of south India), it is wrong to marry one’s *parallel cousin* (i.e., the child of a parent’s same-sex sibling), but not a *cross-cousin* (i.e., the child of a parent’s opposite sex sibling). Both the uniformity and diversity of moral attitudes across cultures entail an important role for moral learning.
    step1: |-
      几乎所有文化中都能见到道德禁令（Brown 1991）[^brown-1991]。但哪些群体在道德上算数，文化差异相当大。姆布提人认为彼此之间偷窃是错的，但拿外人的东西却可以接受（Turnbull 1972）[^turnbull-1972]。围绕乱伦的道德也因文化而异。有些文化（例如韩国部分地区）绝对禁止表亲通婚；另一些文化（如沙特阿拉伯）则允许；还有些文化（如南印度部分地区）认为与*平行表亲*（即父母同性别同胞的子女）结婚是错的，但与*交叉表亲*（即父母异性别同胞的子女）结婚则不然。跨文化道德态度的这种一致与多样，都意味着道德学习扮演着重要角色。
    step2: |-
      道德禁令几乎每种文化都有（Brown 1991）[^brown-1991]，可哪些群体在道德上算数，文化之间却差得很远。姆布提人觉得彼此之间偷东西是错的，拿外人的东西却无妨（Turnbull 1972）[^turnbull-1972]。乱伦的道德也随文化而变：有些地方（如韩国部分地区）绝对禁止表亲通婚；有些地方（如沙特阿拉伯）则容许；还有些地方（如南印度部分地区）认为与*平行表亲*（父母同性别同胞的子女）结婚是错的，与*交叉表亲*（父母异性别同胞的子女）结婚却不算错。道德态度跨文化既有一致也有多样，两头都说明道德学习少不了。
  - id: 3
    kind: body
    source: |-
      In addition, people seem to make critical moral distinctions. There is a difference between representing “this is something people shouldn’t do” and representing “this is something I’m required to stop people from doing”. How are such distinctions acquired? Again, moral learning seems to be required.
    step1: |-
      此外，人们似乎作出关键的道德区分。“这是人们不该做的事”与“这是我有义务阻止人们去做的事”这两种表征之间有差别。这类区分是如何获得的？同样，道德学习似乎是必需的。
    step2: |-
      此外，人还会作一些关键的道德区分：“这是人们不该做的”与“这是我有义务阻止别人去做的”，两者表征不同。这类区分从何而来？同样得靠道德学习。
  - id: 4
    kind: body
    source: |-
      In this entry, we start by considering the initial states from which moral learning might begin; this includes both affective and cognitive precursors. We then review another critical element in the repertoire: the capacity for learning from testimony. Following this, we review several of the key aspects of moral cognition the acquisition of which calls out for explanation, including the moral/conventional distinction and moral parochialism. One class of accounts of moral acquisition draws on associative learning, a ubiquitous and powerful form of learning. We review how associative learning might explain aspects of our moral psychology and where it seems to be inadequate to the explanatory task. We then turn to nativist accounts, according to which crucial aspects of our moral cognition cannot be explained without adverting to an innate faculty dedicated to moral acquisition. The following section reviews recent attempts to explain moral cognition by appeal to statistical learning. In the final section, we take up broader issues about when the acquired norms and values should be construed as moral, and how norms and values might come to be moralized.
    step1: |-
      本词条先考察道德学习可能从中开始的初始状态，包括情感前体与认知前体。然后回顾技能库中的另一关键要素：从证言中学习的能力。接着回顾道德认知的几个关键方面——其获得有待解释，包括道德/习俗区分与道德偏狭主义。一类关于道德获得的说明借助联想学习，这是一种无处不在且强有力的学习形式。我们考察联想学习如何可能解释我们道德心理的某些方面，以及在何处不足以承担解释任务。之后转向先天论说明：按这种说明，不诉诸一种专司道德获得的先天官能，就无法解释我们道德认知的关键方面。下一节回顾晚近借助统计学习来解释道德认知的尝试。最后一节处理更宽泛的问题：所获得的规范与价值何时应被理解为道德的，以及规范与价值如何可能被道德化。
    step2: |-
      本词条先看道德学习可能从哪些初始状态起步，既包括情感前体，也包括认知前体。接着回顾技能库里的另一项关键本事：从证言中学习。随后检视道德认知的几个关键方面——它们的获得需要解释——包括道德/习俗区分与道德偏狭主义。关于道德获得，有一类说明求助于联想学习，这是无处不在、又极有力量的一种学习。我们会看联想学习能解释道德心理的哪些方面，又在哪儿力有不逮。之后再谈先天论：按这种说法，若不承认有一种专管道德获得的先天官能，道德认知的关键方面就无从解释。接下来一节，评述晚近用统计学习解释道德认知的尝试。最后一节讨论更宽的问题：习得的规范与价值何时才算“道德的”，以及规范与价值如何被道德化。
