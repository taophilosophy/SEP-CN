      Not only do 3-year-olds readily pick up on rules, but they also assume that rules and norms *ought* to be followed. This is seen in the increase around the third birthday in children’s motivation to follow all sorts of arbitrary actions demonstrated by adults, and their assumptions that such actions are social conventions or norms (see section 1.2.5 below). Most convincingly, 3-year-olds will act as norm *enforcers*, and will protest when others violate rules. This phenomenon of normative protest was first demonstrated by Rakoczy et al. (2008). In their study, 2- and 3-year-old children learned how to play a game with a simple rule. Children then saw a puppet state their intentions to play the game, but instead perform an action that violated the game rule. Three-year-olds protested the puppet’s action, often accompanying their protest with deontic language (“it doesn’t go like that”, “that’s not how we do it”). Two-year-olds sometimes protested, but without deontic language.
    step1: |-
      3 岁儿童不仅容易接受规则，还假定规则与规范*应当*被遵守。这表现在：快到 3 岁时，儿童追随成人示范的各种任意动作的动机增强，并假定这类动作是社会习俗或规范（见下文 1.2.5 节）。最有说服力的是，3 岁儿童会充当规范的*执行者*，在他人违反规则时提出抗议。这种规范性抗议现象最早由 Rakoczy 等（2008）展示。研究中，2 岁与 3 岁儿童学会一个规则简单的游戏。随后儿童看到木偶说出要玩这个游戏的意图，却做出违反游戏规则的动作。3 岁儿童抗议木偶的动作，抗议时常用道义语言（“不是这样玩的”“我们不这么做”）。2 岁儿童有时也抗议，但不用道义语言。
    step2: |-
      三岁孩子不只是容易学会规则，还认定规则与规范*应当*遵守。快三岁时，他们模仿成人示范的种种任意动作的劲头明显上来，并认定这类动作属于社会习俗或规范（见下文 1.2.5 节）。最有说服力的是，三岁孩子会当规范*执行者*，别人犯规就抗议。Rakoczy 等（2008）最早演示了这种规范性抗议：二岁与三岁孩子先学会一个规则简单的游戏，随后看到一个木偶声称要玩游戏，做的动作却违反规则。三岁孩子当即抗议，还常带着道义口吻（“不是这样玩的”“我们不这么做”）。两岁孩子有时也抗议，但不带道义语言。
