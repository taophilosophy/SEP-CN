      #### 4.2.1 Reinforcement learning and operant conditioning
    step1: |-
      #### 4.2.1 Reinforcement learning and operant conditioning
    step2: |-
      #### 4.2.1 强化学习与操作性条件作用
  - id: 70
    kind: body
    source: |-
      Classical conditioning leads to associations between stimuli (e.g., a bell and the arrival of meat powder), and such associations can inform behavior like salivating. But classical conditioning does not involve learning from *behavior*. Skinner introduced the notion of *operant* conditioning to capture the evident fact that organisms learn from their behavior. In operant conditioning, the organism learns associations between behaviors and their consequences. A rat might learn that hitting a lever is associated with the appearance of food. This association might then affect future behavior. Because the consequence of the behavior (hitting the lever) is rewarding, the behavior will become more frequent. As a result, this consequence would count as “reinforcement”. But sometimes the result of the behavior will be aversive. For instance, a rat might learn that walking on red squares is associated with electric shock. This association will then make the behavior (walking on red squares) less frequent. The consequence of walking on the red squares would count as “punishment”.
    step1: |-
      经典条件作用建立刺激之间的联想（如铃声与肉粉的到来），这类联想可以影响流口水之类的行为。但经典条件作用不涉及从*行为*中学习。Skinner 引入*操作性*条件作用的概念，以刻画一个明显的事实：有机体从自己的行为中学习。在操作性条件作用中，有机体学习行为与其后果之间的联想。大鼠可能学会按杠杆与食物出现相关。这一联想随后可能影响未来行为。由于该行为（按杠杆）的后果是有奖励的，行为会变得更频繁。因此，这个后果便可算作“强化”。但有时行为的后果是厌恶性的。例如，大鼠可能学会走在红色方格上与电击相关。这一联想随后会使该行为（走红格）更少发生。走红格的后果便算作“惩罚”。
    step2: |-
      经典条件作用建立的是刺激之间的联想（铃声与肉粉），这类联想能影响流口水之类的行为，却不涉及从*行为*中学。Skinner 提出*操作性*条件作用，正是要抓住一个明摆着的事实：有机体会从自己的行为里学。操作性条件作用学的是行为与后果的联想。大鼠可能学会：按杠杆跟出食物有关。这层联想接着影响行为：按杠杆有甜头，就按得更勤，这个后果便算“强化”。有时后果是苦头：大鼠学会踩红格跟电击有关，踩红格就少了，这后果便算“惩罚”。
  - id: 71
    kind: body
    source: |-
      The notion of *operant conditioning* was introduced by Skinner (see, e.g., 1938) and is bound up with his behaviorism. As a result, the theoretical framework of operant conditioning does not include any account of the internal processing involved in generating the behavior. Computational cognitive science examines much of the same phenomena as Skinner, but under the label *reinforcement learning*, which explicitly invokes processing and representations of value. The appeal to value representations can explain a great deal of behavior. Rats push the lever because they place a high value on food and expect that pressing the lever will result in the appearance of food. Monkeys select grapes over cucumbers because they assign a higher value to grapes. Water-deprived rats who are allowed to run a Y-maze will run towards the branch with water (rather than the food branch) because they place a high value on water after being deprived of it. A rat can acquire a positive value representation for pressing a lever (e.g. when it’s followed by food) or a negative vale representation for the action (e.g., when it’s followed by a shock).
    step1: |-
      *操作性条件作用*的概念由 Skinner 引入（见如 1938），并与其行为主义紧密相连。因此，操作性条件作用的理论框架不包含对产生行为所涉内部加工的任何说明。计算认知科学考察的许多现象与 Skinner 相同，但冠以*强化学习*之名，后者明确诉诸加工与价值表征。诉诸价值表征可以解释大量行为。大鼠按杠杆，是因为它们高度重视食物，并预期按杠杆会导致食物出现。猴子选葡萄而非黄瓜，是因为它们赋予葡萄更高价值。缺水的大鼠被放进 Y 形迷宫，会跑向有水的分支（而非食物分支），因为缺水之后它们高度重视水。大鼠可以习得对按杠杆的正价值表征（如当其后跟着食物时），或对该动作的负价值表征（如当其后跟着电击时）。
    step2: |-
      *操作性条件作用*是 Skinner 提出的（见如 1938），跟他的行为主义绑在一起。因此这套框架不谈行为背后的内部加工。计算认知科学研究许多同样的现象，却换个名目叫*强化学习*，明明白白讲加工、讲价值表征。一讲价值表征，许多行为就说得通了：大鼠按杠杆，是因为它看重食物，并预期按了就有食；猴子挑葡萄不挑黄瓜，是因为葡萄在它眼里更值钱；缺水的大鼠进了 Y 形迷宫，会奔向有水的那条岔路（不是有食的那条），因为渴过之后它把水看得很重。大鼠也能习得对“按杠杆”这个动作的正价值表征（后头跟着食物时），或负价值表征（后头跟着电击时）。
  - id: 72
