      ### 1.2 Cognitive precursors
    step1: |-
      ### 1.2 Cognitive precursors
    step2: |-
      ### 1.2 认知前体
  - id: 13
    kind: body
    source: |-
      In addition to the emotional capacities described above, human learners have a set of cognitive capacities which emerge within the first few years of life that are foundational for learning about the complexities of the social world. Several researchers have argued that this is part of a suite of evolved cognitive skills that enable humans to engage in cooperation in social groups (Chudek & Henrich 2011; Tomasello 2018a; Cosmides & Tooby 1992)[^chudek-2011][^cosmides-1992][^tomasello-2018a]. As a leading proponent of the view that morality and cooperation are connected, and tied to uniquely human psychology, Tomasello writes:
    step1: |-
      除上述情感能力外，人类学习者还具备一组在生命最初几年出现的认知能力，它们是以此学习社会世界之复杂性的基础。几位研究者主张，这是一套演化而来的认知技能的一部分，使人能够在社会群体中合作（Chudek & Henrich 2011; Tomasello 2018a; Cosmides & Tooby 1992）[^chudek-2011][^cosmides-1992][^tomasello-2018a]。作为主张道德与合作相连、并系于人类独有心理的领军人物，Tomasello 写道：
    step2: |-
      情感能力之外，人类学习者还有一组认知能力，在生命最初几年冒出来，日后用来摸清社会世界的门道。好几位研究者认为，这属于一套演化出来的认知本领，使人能在群体里合作（Chudek & Henrich 2011; Tomasello 2018a; Cosmides & Tooby 1992）[^chudek-2011][^cosmides-1992][^tomasello-2018a]。Tomasello 主张道德与合作相连、并系于人类独有的心理，可算这一派的旗手。他写道：
  - id: 14
    kind: body
    source: |-
      > Cooperation and morality both refer to intentional actions in which the agent is not just pursuing its own self-interested motives, but is also concerned with the well-being of others. … to account for cooperation, and so morality, we need a psychology that recognizes individuals’ interdependence with one another that makes it rational for each individual to be concerned that their groupmates survive and thrive, and that those groupmates reciprocate this concern. (2018a, 661–662)
    step1: |-
      > Cooperation and morality both refer to intentional actions in which the agent is not just pursuing its own self-interested motives, but is also concerned with the well-being of others. … to account for cooperation, and so morality, we need a psychology that recognizes individuals’ interdependence with one another that makes it rational for each individual to be concerned that their groupmates survive and thrive, and that those groupmates reciprocate this concern. (2018a, 661–662)
    step2: |-
      > 合作与道德都指这样一些有意行动：行动者不只在追求自身利益动机，也关心他人的福祉。……要说明合作、从而说明道德，我们需要一种承认个体彼此相互依赖的心理：这种相互依赖使每个个体有理由关心同伴的生存与兴旺，也关心同伴对这种关心的回报。（2018a, 661–662）
  - id: 15
    kind: body
    source: |-
      Tomasello’s view (2018a) on moral starting states involves two maturational changes in development that are timed to emerge in sequence (see SEP entry “Collective Intentionality” for more details on the view). The first is the development, at the end of the first year of life (roughly at 9 months of age), of cognitive capacities that allow the infant to cooperate as an individual with other individuals *and* include the ability to engage in joint attention, and to infer others’ intentions and goals (see below). The second is the development, at the beginning of early childhood (roughly age 3), of cognitive capacities that allow the young child to cooperate as a *member of a group* with other group members*.* This includes the abilities to coordinate shared intentions, to take the perspective of others and reason about mental states (see SEP entry “Folk Psychology as a Theory”), and to understand social norms. On Tomasello’s view, these developmental changes parallel two transitions in human evolution: the former includes cognitive characteristics shared with other primates and the latter is unique to our species.
    step1: |-
      Tomasello（2018a）关于道德起始状态的观点，涉及发展中的两次成熟变化，它们在时间上依次出现（关于该观点的更多细节，见 SEP 词条“集体意向性”）。第一次是生命第一年末（约 9 个月大时）出现的一组认知能力，使婴儿能作为个体与其他个体合作，*并且*包括参与共同注意、推断他人意图与目标的能力（见下文）。第二次是幼儿期初（约 3 岁）出现的一组认知能力，使幼儿能作为*群体成员*与其他成员合作。这包括协调共同意图、采取他人视角并对心理状态进行推理（见 SEP 词条“作为理论的民间心理学”）、以及理解社会规范的能力。按 Tomasello 的看法，这些发展变化与人类演化中的两次转变平行：前者包括与其他灵长类共有的认知特征，后者则为人类所独有。
    step2: |-
      Tomasello（2018a）讲道德起始状态，说的是发展过程中两次成熟变化，前后相继（细节见 SEP 词条“集体意向性”）。头一次在第一年末，约九个月大，出现一组认知能力，让婴儿能作为个体跟别的个体合作，*还*包括参与共同注意、推断他人意图与目标（见下文）。第二次在幼儿期初，约三岁，出现另一组能力，让幼儿能作为*群体的一员*跟其他成员合作：协调共同意图，采取他人视角、推断心理状态（见 SEP 词条“作为理论的民间心理学”），以及理解社会规范。按他的看法，这两步正对应人类演化中的两次转变：前者与其他灵长类共有，后者则为人类独有。
