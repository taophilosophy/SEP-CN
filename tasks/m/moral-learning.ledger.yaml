      Importantly for moral learning, by age 3 children assume that adults have *pedagogical goals* when they act intentionally (Bonawitz et al. 2011)[^bonawitz-2011]. The result is the phenomenon of “overimitation” – or a tendency to imitate arbitrary sequences of actions that have no instrumental value (Lyons et al. 2007)[^lyons-2007]. Studies have shown that by 3 years of age children infer that adults who intentionally perform instrumentally irrelevant actions are in fact intending to teach something socially relevant, and thus children will imitate these actions as a form of norm learning (Kenward et al. 2011)[^kenward-2011].
    step1: |-
      对道德学习重要的是，到 3 岁，儿童假定成人有意行动时抱有*教学意图*（Bonawitz et al. 2011）[^bonawitz-2011]。其结果就是“过度模仿”现象——倾向于模仿没有工具价值的任意动作序列（Lyons et al. 2007）[^lyons-2007]。研究表明，到 3 岁，儿童推断有意做出与工具目的无关动作的成人，其实想教某种社会相关的东西，因此儿童会模仿这些动作，作为规范学习的一种形式（Kenward et al. 2011）[^kenward-2011]。
    step2: |-
      对道德学习要紧的是：三岁孩子假定，成人有意做某个动作时，怀的是*教学意图*（Bonawitz et al. 2011）[^bonawitz-2011]。于是就有了“过度模仿”：孩子会照抄一串毫无工具用途的任意动作（Lyons et al. 2007）[^lyons-2007]。研究发现，三岁孩子会推断：成人有意做这些与目的无关的动作，其实是想教点社会性的东西；因此孩子照做，当作规范学习（Kenward et al. 2011）[^kenward-2011]。
