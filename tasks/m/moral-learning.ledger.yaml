      Crockett (2013) and Cushman (2013) independently drew on reinforcement learning to explain people’s intuitions about moral dilemmas like the ubiquitous trolley cases (section 3.2). In *Switch*, one can pull a lever to divert a trolley from five innocent individuals towards a side track with only one such individual; people tend to judge it permissible to pull the switch. In *Footbridge*, one can push a person in front of the speeding trolley to prevent it from killing five innocents; the modal judgment here is that it’s not permissible to push the person. Crockett and Cushman suggest that these different kinds of judgments derive from the different kinds of value representations issued by model-based and model-free reinforcement learning. Model-based value representations are focused on consequences, model-free value representations are focused on actions (Crockett 2013, 363; Cushman 2013, 279)[^crockett-2013][^cushman-2013]. Accordingly, model-based value representations are said to facilitate utilitarian verdicts whereas model-free value representations are said to facilitate deontological verdicts like those in *Footbridge* (Crockett 2013, 364; Cushman 2013, 282)[^crockett-2013][^cushman-2013].
    step1: |-
      Crockett（2013）与 Cushman（2013）各自借助强化学习，来解释人们对电车难题这类无处不在的道德困境的直觉（3.2 节）。在*岔道*案例中，人可以扳动道岔，使电车从五名无辜者转向只有一人的侧轨；人们倾向于判断扳道岔是允许的。在*天桥*案例中，人可以把一个人推到疾驰的电车前，以阻止它轧死五名无辜者；此时的典型判断是，推人不被允许。Crockett 与 Cushman 提出，这些不同种类的判断，源自基于模型与无模型强化学习所产生的不同种类的价值表征。基于模型的价值表征关注后果，无模型的价值表征关注行动（Crockett 2013, 363; Cushman 2013, 279）[^crockett-2013][^cushman-2013]。据此，据说基于模型的价值表征促成功利主义裁决，而无模型的价值表征促成*天桥*案例那样的义务论裁决（Crockett 2013, 364; Cushman 2013, 282）[^crockett-2013][^cushman-2013]。
    step2: |-
      Crockett（2013）与 Cushman（2013）不约而同，拿强化学习来解释人对电车难题这类道德困境的直觉（3.2 节）。*岔道*案里，扳一下道岔，电车就从五名无辜者转向只有一人的侧轨；人们多半说：扳得。*天桥*案里，把一人推下天桥挡住电车，救下五人；典型判断是：推不得。Crockett 与 Cushman 认为，这两种判断出自两种不同的价值表征：基于模型的盯着后果，无模型的盯着行动（Crockett 2013, 363; Cushman 2013, 279）[^crockett-2013][^cushman-2013]。照此说来，基于模型的价值表征偏向功利主义裁决，无模型的价值表征偏向义务论裁决，如*天桥*案（Crockett 2013, 364; Cushman 2013, 282）[^crockett-2013][^cushman-2013]。
