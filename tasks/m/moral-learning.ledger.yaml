      The previous sections review the ways in which infants interpret their social world from the beginning of life, setting the stage for moral learning that is based on observations of others’ behavior. But infants also learn by doing; they act and make decisions. Their decisions can result from observations of others (imitation), can be motivated by their nascent conceptions of what is helpful or fair (prosocial motives), and/or can be motivated by what they think one ought to do (normative motives). Moral agency and moral learning are in a cycle of feedback: young moral learners’ actions and decisions result from their current state of moral knowledge and self-regulatory skill. In turn, their actions are subject to corrective feedback and guidance from their moral teachers (peers, older peers, adults), resulting in further learning.
    step1: |-
      前面几节回顾了婴儿从生命之初解释社会世界的方式，这为以观察他人行为为基础的道德学习搭好了台。但婴儿也边做边学：他们行动、作决定。他们的决定可能来自对他人行为的观察（模仿），可能由他们初步的帮助或公平观念驱动（亲社会动机），也可能由他们认为人应当做什么驱动（规范动机）。道德能动性与道德学习处于反馈循环中：年幼道德学习者的行动与决定，源于他们当前的道德知识状态与自我调节技能；反过来，他们的行动又受道德教师（同伴、年长同伴、成人）的纠正性反馈与引导，从而带来进一步的学习。
    step2: |-
      前几节讲的是婴儿如何从一开始就解读社会世界，这为“看别人怎么做”的道德学习铺了路。但婴儿也边做边学：会行动，也会选择。选择可能来自观察他人（模仿），可能出于初萌的帮助或公平观念（亲社会动机），也可能出于“人应当如何”的想法（规范动机）。道德能动性与道德学习互为循环：孩子的行动与选择，出自他当下的道德知识与自我调节本领；反过来，这些行动又受道德教师（同伴、大孩子、成人）的纠正与指点，于是学得更多。
