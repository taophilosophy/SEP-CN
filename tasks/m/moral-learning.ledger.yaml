      How does testimony influence moral learning? Hills (2020) distinguishes between two types of moral testimony. The first is “transmission” of moral assertions that a speaker directs at a listener (e.g. “X is wrong”). The second is what Hills refers to as “propagation” in which a speaker gives reasons or rationales for a listener to consider in coming to their own moral evaluations (e.g. “X can be harmful to others”). According to Hills, transmission is epistemically problematic, even if one happens to be learning from a moral expert, as it can result in second-hand moral *knowledge* but not any deeper form of moral *understanding* or cultivation of moral *virtue*. Propagation is less problematic, at least for mature moral agents who are expected to come to their own conclusions, understandings, and evaluations.
    step1: |-
      证言如何影响道德学习？Hills（2020）区分了两类道德证言。第一类是说话者向听者发出的道德断言的“传递”（如“X 是错的”）。第二类是 Hills 所称的“传播”：说话者给出理由或理据，供听者在自己形成道德评价时考虑（如“X 可能伤害他人”）。按 Hills 的看法，传递在认识论上有问题，即便你恰好是在向一位道德专家学习，因为它只能带来二手的道德*知识*，而不能带来更深层的道德*理解*或道德*德性*的培养。传播的问题较小，至少对成熟的道德能动者而言如此——他们本就应当自己得出结论、形成理解与评价。
    step2: |-
      证言怎么影响道德学习？Hills（2020）把道德证言分成两类。一类叫“传递”：说话者直接把道德断言抛给听者（如“X 是错的”）。另一类叫“传播”：说话者给出理由或道理，让听者自己琢磨、自己下判断（如“X 可能伤人”）。Hills 认为，传递在认识论上成问题——哪怕你是向道德专家请教，得到的也只是二手的道德*知识*，谈不上更深的道德*理解*，更谈不上养成道德*德性*。传播问题小些，至少对成熟的道德行动者如此：他们本来就该自己得出结论、形成理解与评价。
