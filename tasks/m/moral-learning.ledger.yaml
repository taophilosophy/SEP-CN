      ### 1.1. Affective precursors
    step1: |-
      ### 1.1. Affective precursors
    step2: |-
      ### 1.1 情感前体
  - id: 9
    kind: body
    source: |-
      One set of precursors to moral learning is emotional or broadly affective capacities. Among our emotional capacities early in development is sensitivity to behavioral manifestations of suffering in others. In a well-known experiment, Simner exposed newborn infants to recordings of various sounds, including the spontaneous crying of another newborn, the crying of a 5-month-old, a synthetic crying sound created by computer, and white noise of the same loudness (Simner 1971)[^simner-1971]. The study revealed that infants cried notably more when hearing the recording of another newborn crying compared to the other conditions. These results have been replicated by independent groups (Sagi & Hoffman 1976; Martin & Clark 1982)[^martin-1982][^sagi-1976].
    step1: |-
      道德学习的一类前体是情绪或广义情感能力。发展早期的情感能力之一，是对他人痛苦的行为表现的敏感。在一项著名实验中，Simner 让新生儿听各种声音的录音，包括另一个新生儿的自发啼哭、5 个月大婴儿的啼哭、计算机合成的啼哭声，以及同样响度的白噪声（Simner 1971）[^simner-1971]。研究发现，与其它条件相比，婴儿听到另一个新生儿啼哭的录音时哭得明显更多。这些结果已被独立团队重复（Sagi & Hoffman 1976; Martin & Clark 1982）[^martin-1982][^sagi-1976]。
    step2: |-
      道德学习的前体之一，是情绪或广义上的情感能力。发展早期的一项情感本事，是对他人痛苦的外在表现很敏感。Simner 做过一个著名实验：让新生儿听各种录音，有另一个新生儿的自发啼哭、五个月大婴儿的啼哭、电脑合成的哭声，还有同样响的白噪声（Simner 1971）[^simner-1971]。结果，听到另一个新生儿啼哭时，婴儿哭得明显比别的条件多。后来有独立团队重复出同样结果（Sagi & Hoffman 1976; Martin & Clark 1982）[^martin-1982][^sagi-1976]。
  - id: 10
    kind: body
    source: |-
      Something similar is found in other mammals. For example, rats and monkeys seem to have a natural aversion to distress cues exhibited by members of their own species (Masserman et al. 1964; Greene 1969)[^greene-1969][^masserman-1964]. In one somewhat disturbing study, a monkey was trained to pull a chain to receive food, but the setup was later modified so that pulling the chain would also deliver an electric shock to another monkey in a nearby cage. The shocked monkey would shriek in pain, which the other monkey would quickly associate with his pulling the chain. Several monkeys chose to stop pulling the chain, presumably as a result of the association between pulling the chain and the shrieks of the other monkey. By refraining from pulling the chain, the monkey prevented his conspecific from being shocked, but he also no longer received any food. As the authors put it, “a majority of rhesus monkeys will consistently suffer hunger rather than secure food at the expense of electroshock to a conspecific” (Masserman et al. 1964, 585)[^masserman-1964].
    step1: |-
      其他哺乳动物身上也发现类似现象。例如，大鼠与猴子似乎天生厌恶同种成员表现出的痛苦信号（Masserman et al. 1964; Greene 1969）[^greene-1969][^masserman-1964]。在一项多少令人不安的研究中，一只猴子被训练拉动链条以获得食物，但后来装置被改动：拉链也会对邻近笼中的另一只猴子施加电击。被电击的猴子痛苦尖叫，拉链的猴子很快把叫声与自己拉链联系起来。几只猴子选择不再拉链，想必是因为拉链与另一只猴子的尖叫形成了联结。不拉链，猴子使同伴免遭电击，但自己也得不到食物。正如作者所说，“大多数恒河猴会宁可忍受饥饿，也不愿以电击同伴为代价获取食物”（Masserman et al. 1964, 585）[^masserman-1964]。
    step2: |-
      别的哺乳动物也有类似表现。大鼠和猴子似乎天生就受不了同种成员发出的痛苦信号（Masserman et al. 1964; Greene 1969）[^greene-1969][^masserman-1964]。有一项研究读来让人不太舒服：先训练一只猴子拉链条取食，后来改装装置，让拉链同时电击隔壁笼里的另一只猴子。被电的猴子痛得尖叫，拉链的猴子很快把叫声与自己拉链联系起来。有几只猴子索性不拉了——多半就是因为这层联结。不拉，同伴免于电击，自己却也吃不上东西。作者的原话是：“大多数恒河猴宁可一直挨饿，也不肯以电击同伴为代价换取食物”（Masserman et al. 1964, 585）[^masserman-1964]。
  - id: 11
    kind: body
    source: |-
      One interpretation of these findings on human infants is that the indicators of suffering trigger self-focused distress on the part of the infant (cf. Batson 1991)[^batson-1991]. In this kind of distress, one might seek comfort for oneself rather than attend to or comfort the injured person. However, even in the first year of life, infants sometimes show other-regarding interests in the presence of distress cues. In an early study by Hay, Nash, and Pederson (1981), researchers observed how 6-month-old infants reacted when another infant spontaneously began crying or fussing. Self-focused distress was uncommon; instead, the babies tended to focus on the distressed peer, often leaning toward them, gesturing, or making physical contact, and showing sober, concerned expressions or vocalizations. Similarly, Roth-Hanania et al. (2011) examined infants’ reactions to an adult (the mother) feigning injury. In two separate episodes, the mother displayed facial and vocal signs of moderate pain for about 60 seconds, while avoiding eye contact with the child. Researchers assessed the infants for visible signs of concern—such as facial expressions, vocal tones, and body gestures. They also rated prosocial actions, such as attempts to comfort (e.g. by patting). Findings showed that by 8 to 10 months, infants already showed facial and vocal expressions associated with other-oriented sympathetic concern. Prosocial behaviors—like helping or consoling—were rare in the first year but became far more frequent during the second year, with strong responses evident by 16 months (see also Roberts and Strayer 1996, 456; Eisenberg et al. 1989, 58; Miller et al. 1996, 213)[^eisenberg-1989][^miller-1996][^roberts-1996].
    step1: |-
      对人类婴儿的这些发现的一种解释是：痛苦迹象触发了婴儿以自我为中心的痛苦（cf. Batson 1991）[^batson-1991]。这种痛苦中，人可能为自己寻求安慰，而不是关注或安慰受伤者。然而，即便在生命第一年，婴儿有时也会在痛苦迹象面前表现出关注他人的兴趣。Hay、Nash 与 Pederson（1981）的早期研究观察到 6 个月大婴儿在另一个婴儿自发啼哭或烦躁时的反应。以自我为中心的痛苦并不常见；婴儿往往把注意力放在痛苦的同伴身上，常向其倾身、做手势或身体接触，并露出严肃关切的表情或发出声音。类似地，Roth-Hanania 等（2011）考察了婴儿对成人（母亲）假装受伤的反应。在两个独立情境中，母亲表现出中度疼痛的面部与声音信号约 60 秒，并避免与孩子目光接触。研究者评估婴儿是否有可见的关切迹象——如面部表情、声调与身体姿态——也对安慰（如轻拍）之类的亲社会行为评分。结果显示，到 8 至 10 个月，婴儿已表现出与指向他人的同情关切相关的面部与声音表达。亲社会行为——如帮助或安慰——在第一年很少见，但在第二年频繁得多，到 16 个月已有强烈反应（另见 Roberts and Strayer 1996, 456; Eisenberg et al. 1989, 58; Miller et al. 1996, 213）[^eisenberg-1989][^miller-1996][^roberts-1996]。
    step2: |-
      对人类婴儿的这些结果，一种解释是：痛苦的迹象勾起了婴儿以自我为中心的难受（cf. Batson 1991）[^batson-1991]。这种难受里，人只顾给自己找安慰，未必去照看伤者。可是即便在一岁以内，婴儿面对痛苦迹象时也常有顾人的表现。Hay、Nash 与 Pederson（1981）早年观察过：另一个婴儿自发哭闹时，六个月大的婴儿怎么反应。以自我为中心的难受并不多见；婴儿多半盯着那个难受的同伴，倾身过去，比划、碰触，脸上或声音里露出凝重关切。Roth-Hanania 等（2011）做法类似：让母亲假装受伤。两个情境里，母亲露出中度疼痛的表情与声音约六十秒，同时不与孩子对视。研究者看婴儿有没有可见的关切——表情、声调、身体动作——并给安慰（如轻拍）这类亲社会行为打分。结果，八到十个月的婴儿已显出指向他人的同情关切，表情与声音都有。帮助、安慰这类亲社会行为，一岁内很少，第二年就多得多，十六个月时反应已很强烈（另见 Roberts and Strayer 1996, 456; Eisenberg et al. 1989, 58; Miller et al. 1996, 213）[^eisenberg-1989][^miller-1996][^roberts-1996]。
