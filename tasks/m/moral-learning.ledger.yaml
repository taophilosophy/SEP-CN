      Another form of testimonial propagation emerges in peer-to-peer disagreements (Tomasello 2018b)[^tomasello-2018b]. From at least age 5, children actively defend moral points of view in discussions with peers and are more receptive to considering alternative perspectives on complex moral issues; this is more pronounced when engaging in discussions with peers rather than parents or other authority figures (Mammen et al. 2019)[^mammen-2019]. These findings strengthen the idea that moral learning through testimony is selective and dependent on the interpersonal characteristics of the interlocutor – parents are treated as moral “experts”, more so than peers, thus each potentially plays a unique role in moral learning.
    step1: |-
      证言传播的另一种形式出现在同伴间的分歧中（Tomasello 2018b）[^tomasello-2018b]。至少从 5 岁起，儿童就在与同伴的讨论中积极捍卫道德观点，也更愿意考虑关于复杂道德问题的其他视角；与同伴讨论时，这种表现比与父母或其他权威人物讨论时更明显（Mammen et al. 2019）[^mammen-2019]。这些发现强化了一个想法：通过证言的道德学习是有选择性的，取决于对话者的人际特征——父母被当作道德“专家”，胜过同伴，因此二者在道德学习中可能各司其职。
    step2: |-
      还有一种传播，发生在同伴之间的争执里（Tomasello 2018b）[^tomasello-2018b]。五岁起，孩子就会在跟同伴的讨论中为自己的道德观点辩护，也更愿意听听复杂道德问题的别的看法；跟同伴聊，比跟父母或别的权威聊更能激起这股劲（Mammen et al. 2019）[^mammen-2019]。这更说明：靠证言的道德学习是挑人的，要看对话者是谁——父母被视为道德“专家”，地位高于同伴，两者在道德学习里各管一摊。
