    kind: body
    source: |-
      People’s capacities to make moral judgments, draw distinctions, and determine moral boundaries demand explanation. In this section, we will review several features of moral cognition that have been targets of learning theory: the moral/conventional distinction, the focus on action, the scope of moral patiency (e.g. who deserves to receive moral treatment), and the role of universalizing judgments. Importantly, many of these features show up early in development (Levine et al. 2018; Pellizzonni et al. 2010; Powell et al. 2012; Heiphetz and Young 2017; Smetana & Braeges 1990)[^heiphetz-2017][^levine-2018][^powell-2012][^smetana-1990].
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      ### 3.1 The moral/conventional distinction
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      From a young age, children treat canonical moral violations differently from conventional violations (Turiel 1983)[^turiel-1983]. This has been explored extensively via the “moral/conventional” task (for reviews see Smetana 1993; Tisak 1995; Killen & Smetana 2015)[^killen-2015][^smetana-1993][^tisak-1995]. In this task, preschool-age children are presented with various kinds of violations, some of which are considered moral (e.g., unprovoked hitting), and others conventional (e.g., standing up during nap time). Children, like adults, tend to treat the moral violations differently from the conventional violations on a variety of measures. Moral violations are rated as more serious than the conventional ones. People are also more likely to cite harm when explaining why the moral violations are wrong, as compared to the conventional violations.
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      On a somewhat more subtle measure, the *authority dependence* task, participants are asked whether the action would be wrong if some relevant authority didn’t have a rule against it. For example, would it be wrong to hit someone in class without provocation if the teacher didn’t have a rule against it? People tend to say that it would still be wrong in such a case but are less likely to say this when asked about a conventional rule, like standing up during nap time.
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      A further measure explores whether conventional violations are more likely to be treated as *relative* to a group or culture. Children are more likely to judge that moral violations will be wrong in other places and countries, as compared to conventional violations (Smetana 1985)[^smetana-1985]. Relativism is also measured via a *disagreement task*, in which adult participants are presented with an action and told that two people disagree about whether it’s wrong and then asked whether only one of the disputants must be right or whether both of them could be right (Goodwin & Darley 2008)[^goodwin-2008]. Participants are more likely to say that both of the individuals can be right for conventional items, as compared to moral items. That is, moral rules (e.g., it’s wrong to hit) tend to be taken to hold universally while other rules are taken to hold only relative to certain contexts (e.g., it’s wrong to wear jeans at school [for certain schools]) (Wright et al. 2014)[^wright-2014].
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      There is a great deal of dispute about how exactly to interpret the results on moral/conventional tasks (see, e.g., SEP entry “The Moral/Conventional Distinction”). But the effects themselves have been widely replicated. The moral violations presented to participants in these studies are treated differently on these questions. This differential treatment has been found from preschoolers through adulthood (Huebner et al. 2010)[^huebner-2010]. And this generates a learning-theoretic question: how is this differentiation acquired?
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      ### 3.2 Moral intuitions and action
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      People show a marked distinction in moral intuitions about scenarios that involve actions as compared to allowings. Young children judge that it’s worse to produce a bad outcome than it is to fail to prevent the same outcome (Powell et al. 2012)[^powell-2012]. More generally, people tend to regard social and moral rules a*s act-based* (keep your promises; don’t litter) rather than *consequence-based* (maximize promise-keeping; minimize litter). This focus on action is revealed in studies on moral dilemmas like trolley cases. In *Footbridge*, one can push a person in front of the speeding trolley to prevent the trolley from killing five innocents; the modal judgment here is that it’s not permissible to push the person. But in this case, while the agent refrains from producing the death of the one person, he is thereby allowing the death of five people. *Allowing* the deaths doesn’t seem to carry the same moral import as producing a death via one’s own action. This pattern of judgment has also been found in young children (Pellizzoni et al. 2010)[^pellizzoni-2010].
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      ### 3.3 Parochialism
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      It’s a familiar observation from anthropology that in many cultures, moral prohibitions apply to members of the local community but not to outsiders. Just to take one famous example, according to Turnbull (1972), the nomadic Mbuti thought it was wrong to steal from each other, but they thought it was fine to steal from people in villages. Moral rules are thus often *parochial* (e.g., Read 1955, 255; Snare 1980, 364)[^read-1955][^snare-1980].
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      Homophily (section 1.2.4) is likely an important precursor to various parochial attitudes. Babies prefer others who have the same accent as their mother (see, e.g., Kinzler, Dupoux, & Spelke 2007). This affects social choices, e.g. who they would want to be friends with (Kinzler et al. 2009)[^kinzler-2009]. Children are also more generous to ingroup members (Sparks, Schinkel, & Moore 2017), and they provide more positive trait evaluations for ingroup members (Richter, Over, & Dunham 2016).
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      Classic and striking work comes from studies using the “minimal group paradigm” (Tajfel 1970; Diehl 1990; Dunham 2018)[^diehl-1990][^dunham-2018][^tajfel-1970]. In these studies, people display ingroup favoritism even when randomly assigned to previously unfamiliar social groups based on arbitrary cues (e.g., a label, ‘the red group’). Although the classic work on minimal groups was done on adults, the core result is also found in children. For instance, in a minimal group paradigm, children were more willing to trust the testimony of ingroup members even in the absence of any prior knowledge about the group (MacDonald et al. 2013)[^macdonald-2013].
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      ## 4. Associative learning and morality
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      ### 4.1 Classical conditioning and moral judgment
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      Classical conditioning is a fundamental form of associative learning. Such conditioning depends ultimately on natural links between a stimulus (e.g., meat powder) and a response (e.g., salivation) such that an organism reliably exhibits the response in the presence of the stimulus. The natural responses occur before any learning, and both the stimulus and the response are dubbed “unconditioned”. This relation between the unconditioned stimulus (US) and unconditioned response (UR) forms the basis for learning new associations. When a neutral stimulus, like a bell ringing, occurs shortly before the appearance of the US (meat powder), over time, the neutral stimulus comes to be associated with the unconditioned stimulus and it will, all by itself, generate the familiar response (salivation). When that occurs, the bell, which had been a neutral stimulus, has become a “conditioned stimulus” and the salivation that follows it is a “conditioned response”. (See SEP entry “Associationist Theories of Thought”.)
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      Classical conditioning is a ubiquitous and powerful form of learning. It’s found across the animal kingdom, from humans to snails (Kemenes & Benjamin 1989). And it’s implicated in a wide range of phenomena, from phobias (e.g., LeDoux 2014)[^ledoux-2014] to drug tolerance (e.g., Siegel et al. 1982).
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      James Blair has recruited classical conditioning as an important element in the emergence of moral judgment. As we saw in section 1.1, infants are acutely sensitive to the distress of others. This fact is of central importance in Blair’s theory. In Blair’s classic (1995) articulation of the model, humans possess an innate mechanism, the violence inhibition mechanism (VIM). This proposal is derived from the idea that social animals have mechanisms to inhibit intra-species aggression (see, e.g., Lorenz 1966)[^lorenz-1966]. A distress cue (e.g., crying) is an unconditioned stimulus for the activation of VIM, and VIM activation is an unconditioned response to such cues (Blair 1995, 5)[^blair-1995]. The activation of VIM results in a withdrawal response but also generates an aversive experience (1995, 7). It is this aversive experience that is critical to moral judgments on Blair’s view. However, the distress cues that constitute unconditioned stimuli for VIM are a limited class, tied directly to perceptual signs of distress like crying and shrieking. Moral judgments, by contrast, can be made in the absence of any such perceptual cues. This is where the learning story enters for Blair. Blair maintains that classical conditioning will lead to associations between perceptual cues of pain and *thoughts* about harm. In particular, classical conditioning will build an association between perceptual cues of pain and “representations of the victim’s internal state, formed through role taking” (1995, 9). As a result of this association, representations of a victim’s pain will activate VIM even in the absence of any perceptual signs, and this activation will carry an aversive experience. As Blair puts it, “an individual may generate empathic arousal to just the thought of someone’s distress (e.g., "what a poor little boy") without distress cues being actually processed” (1995, 5).
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      Although Blair’s original VIM-based account is based on ethological work, this is not essential to the learning story. That is, it needn’t be VIM in particular that underlies the aversion to distress cues. What matters is that (1) perceptual signs of pain trigger aversive experiences, (2) conditioning can establish an association between perceptual signs of pain and *thoughts* of acts that cause pain to others, and (3) a consequence of this association is that thoughts of acts that cause pain to others will trigger an aversive experience.
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      After the foregoing kind of conditioning, an aversive experience will occur whenever the normally developing child thinks about harmful actions. That will confer a special salience to thoughts about harmful actions. Blair summarizes as follows:
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      > moral socialization occurs through the pairing of the activation of the mechanism by distress cues with representations of the acts which caused the distress cues (moral transgressions—for example, one person hitting another). A process of classical conditioning results in these representations of moral transgressions becoming triggers for the mechanism. (2001, 730)
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      The result of this process of classical conditioning is that representations of moral transgressions are aversive. This, Blair suggests, is key to the special status of moral violations, as reflected in the moral/conventional task (section 3.1).
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      Blair draws on his account of aversion to harmful thoughts in order to explain the differences found between moral violations (e.g., unprovoked hitting) and conventional violations (e.g., standing up during nap time). In particular, Blair maintains that the moral items, unlike the conventional ones, will trigger aversive experiences. This is simply because of the conditioned response to thoughts of harmful actions. When we think about Johnny hitting Billy, because of our history of conditioning, we find this thought aversive, whereas when we think about Johnny standing up during nap time, we have no history of conditioning that makes this thought aversive (Blair 1995, 7–8)[^blair-1995]. This felt difference between the moral and conventional cases gives rise to the differences in judgments, according to Blair.
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      ### 4.2 Model-free reinforcement learning and moral judgment
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      #### 4.2.1 Reinforcement learning and operant conditioning
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      Classical conditioning leads to associations between stimuli (e.g., a bell and the arrival of meat powder), and such associations can inform behavior like salivating. But classical conditioning does not involve learning from *behavior*. Skinner introduced the notion of *operant* conditioning to capture the evident fact that organisms learn from their behavior. In operant conditioning, the organism learns associations between behaviors and their consequences. A rat might learn that hitting a lever is associated with the appearance of food. This association might then affect future behavior. Because the consequence of the behavior (hitting the lever) is rewarding, the behavior will become more frequent. As a result, this consequence would count as “reinforcement”. But sometimes the result of the behavior will be aversive. For instance, a rat might learn that walking on red squares is associated with electric shock. This association will then make the behavior (walking on red squares) less frequent. The consequence of walking on the red squares would count as “punishment”.
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      The notion of *operant conditioning* was introduced by Skinner (see, e.g., 1938) and is bound up with his behaviorism. As a result, the theoretical framework of operant conditioning does not include any account of the internal processing involved in generating the behavior. Computational cognitive science examines much of the same phenomena as Skinner, but under the label *reinforcement learning*, which explicitly invokes processing and representations of value. The appeal to value representations can explain a great deal of behavior. Rats push the lever because they place a high value on food and expect that pressing the lever will result in the appearance of food. Monkeys select grapes over cucumbers because they assign a higher value to grapes. Water-deprived rats who are allowed to run a Y-maze will run towards the branch with water (rather than the food branch) because they place a high value on water after being deprived of it. A rat can acquire a positive value representation for pressing a lever (e.g. when it’s followed by food) or a negative vale representation for the action (e.g., when it’s followed by a shock).
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      In the case of water-deprived rats, the water is represented as higher-value than the food, and hence the rats navigate to the portion of the maze with water. This behavior depends on the rat learning a *model* of the maze that includes the locations of the water and food. This kind of learning is called *model-based reinforcement learning*, since it involves the agent building a model of their situation.
    step1: TBD
    step2: TBD
  - id: 73
    kind: body
    source: |-
      While models can be excellent tools for making decisions, real-world environments are often far more complex than simple experimental setups like Y-mazes. To learn a model of complicated environments is computationally expensive, and animals also rely on a simple associationist learning procedure – habit learning. This is also known as *model-free* reinforcement learning because it doesn’t involve constructing or representing a model. For example, after getting food rewards from pressing a lever, an animal might come to assign a positive value to lever-pressing itself. Such value representations drive habitual behavior, and this behavior can persist even when the original goal of the behavior is undermined.
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      It can be difficult to determine whether an animal’s lever-pressing is motivated by a goal (get the food) or a mere habit. If the animal presses the lever specifically to obtain food, that’s goal-directed behavior based on understanding the relationship between action and outcome. However, if the animal presses the lever simply because the action itself feels rewarding, that’s habitual behavior. The difference between these two types of behavior is revealed in "devaluation" experiments. In these tests, researchers first teach a rat that lever-pressing produces food. Then, they completely satisfy the rat’s hunger before returning it to the test cage. Sometimes, rats will continue pressing the lever even though they’re no longer interested in eating the food that appears. Similar behavior occurs when hungry rats know that pressing the lever won’t produce any food – they may still press it habitually under certain circumstances. In this case, we might say the rat just likes to press the lever. In real life, model-free reinforcement learning explains why I check my phone for messages even when I just checked a minute ago. In some sense, I just “like” checking my phone without having further thoughts about possible consequences. This behavior is habitual rather than goal-directed.
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      #### 4.2.2 Moral intuitions and reinforcement learning
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      Crockett (2013) and Cushman (2013) independently drew on reinforcement learning to explain people’s intuitions about moral dilemmas like the ubiquitous trolley cases (section 3.2). In *Switch*, one can pull a lever to divert a trolley from five innocent individuals towards a side track with only one such individual; people tend to judge it permissible to pull the switch. In *Footbridge*, one can push a person in front of the speeding trolley to prevent it from killing five innocents; the modal judgment here is that it’s not permissible to push the person. Crockett and Cushman suggest that these different kinds of judgments derive from the different kinds of value representations issued by model-based and model-free reinforcement learning. Model-based value representations are focused on consequences, model-free value representations are focused on actions (Crockett 2013, 363; Cushman 2013, 279)[^crockett-2013][^cushman-2013]. Accordingly, model-based value representations are said to facilitate utilitarian verdicts whereas model-free value representations are said to facilitate deontological verdicts like those in *Footbridge* (Crockett 2013, 364; Cushman 2013, 282)[^crockett-2013][^cushman-2013].
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      Cushman characterizes the distinction between value representations as follows:
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      > the functional role of value representation in a model-free system is to select actions without any knowledge of their actual consequences, whereas the functional role of value representation in a model-based system is to select actions precisely in virtue of their expected consequences. (2013, 279)
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      According to Cushman, when presented with *Footbridge*, we rebel against pushing the man because our model-free system has assigned a negative value to the action-type *pushing*. Why do we assign this negative value? At least part of the reason, Cushman suggests, derives from model-free reinforcement learning – pushing is associated with a negative value-representation because pushing typically led to aversive outcomes (e.g., harm to victim) (2013, 282). Again, as with habit learning generally, the verdict is not thought through in terms of consequences but just in terms of the attraction or aversion to the action itself.
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      Is it true that pushing itself is aversive in a way that goes beyond the foreseen bad consequences? It seems so. In a series of studies, Cushman found that participants showed negative reactions to performing actions typically associated with harm, but in which the harm clearly will not occur (Cushman et al. 2012). For example, participants were asked to use a rock to smash a manifestly fake hand; in a control condition, participants were told to use a rock to crack a nut. Even though participants knew the hand wasn’t real, they showed greater physiological distress response when striking the fake hand compared to the nut. This demonstrates that humans naturally recoil from actions that usually hurt others, even when they know those specific actions won’t cause any real harm (Cushman 2013, 286)[^cushman-2013].
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      ### 4.3 Beyond associationism
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      Associative learning plausibly does play an important role in moral reactions. Classical conditioning likely makes certain thoughts aversive because of the association with primitive triggers of distress. Thinking of someone pointing a gun at another is distressing, though guns are not unconditioned stimuli for distress. Rather, we have learned to associate guns with harmful actions that naturally trigger our empathic responses. Classical conditioning can explain how thoughts of guns get linked with these natural (unconditioned) responses of distress. Similarly, model-free reinforcement learning likely makes certain actions intrinsically aversive. Hitting a person with a rock causes distressing reactions in the victim. This can lead us to attach negative value representations to the act of hitting itself. Thus, we find it difficult to perform such actions even if we know that the typical bad consequence won’t follow.
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      Although associative learning plausibly plays a key role in what thoughts and actions we find aversive, it’s less plausible that this suffices to explain moral judgment. One reason is that to judge something to be wrong is not the same as registering that thing as aversive. People who spank their children often find it aversive to do so, without thinking it wrong to do so. And many moral judgments concern the wrongness, not the aversiveness, of an action. In Cushman’s experiments, participants found it aversive to hit the fake hand with the rock, but they probably didn’t regard it as morally wrong. Thus, aversion isn’t sufficient for a wrongness judgment. Neither is an aversive experience necessary for a wrongness judgment. I can judge it to be wrong to cheat on one’s income taxes without working up any substantial distress response.
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      In order to explain moral judgments, more sophisticated representations seem to be demanded, representations that encode rules (e.g., Mikhail 2011; Nichols 2004 and 2021; Nichols & Mallon 2008)[^mikhail-2011][^nichols-2004][^nichols-2021]. However, once we allow such complex representations, we then face a new kind of question about moral learning – how do we learn complex moral representations? One answer is that a substantial portion of the moral system depends on a special-purpose learning system for morality.
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      ## 5. Nativism and moral learning
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      ### 5.1 The linguistic analogy
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
    source: |-
      It seems that moral judgment involves complex representations that go beyond what can be acquired through associative learning processes. A prevailing systematic account of how we acquire complex moral representations is that of nativist views that are inspired by Chomskyan linguistics. On the Chomskyan view, the acquisition of grammar depends on a domain-specific learning device: a Language Acquisition Device. Similarly, according to the analogy, the acquisition of morality depends on a domain-specific learning device: a Morality Acquisition Device (Dwyer 1999 and 2006; Harman 1999; Levine et al. 2018; Mikhail 2011 and 2022)[^harman-1999][^levine-2018][^mikhail-2011][^mikhail-2022]. According to Chomskyans, the actual grammatical knowledge that a child attains depends on innate domain-specific processes that constrain the kinds of languages that humans can acquire. The point is not simply that the Language Acquisition Device is a distinct mechanism. Rather, the Chomskyan proposal is that different acquisition devices run different programs: the program for learning to perceive faces is supposed to be quite different from the device for acquiring a grammar.
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      The core argument in favor of an innate language-acquisition device is a Poverty of the Stimulus argument. The argument maintains that the evidence available to the learner is not sufficient for domain-general learning (e.g. associative or statistical learning) to yield the mature state of grammatical knowledge from the starting state. Moral Chomskyans advance a parallel Poverty of the Stimulus argument for moral knowledge.
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      According to the linguistic analogy, just as the acquisition of complex linguistic structures depends on a domain-specific language-acquisition device, so too the acquisition of the complex moral structures depends on a domain-specific morality-acquisition device. As Dwyer puts the view:
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      > The child’s mindbrain contains (at some level of abstraction) a *morality acquisition device* (or *moral faculty*) that makes possible the acquisition of all and only humanly possible moralities. The moral faculty is characterized in terms of a set of rules, principles, and constraints (universal moral grammar) that determine what aspects of her environment a child needs to pay attention to, and, together with what she hears and sees around her, determines her mature moral competence, which we can call her I-morality, or moral idiolect. (Dwyer 2006, 242)
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      Similarly, Mikhail proposes that we possess
    step1: TBD
    step2: TBD
  - id: 92
    kind: body
    source: |-
      > a “Universal Moral Grammar” (UMG) analogous to the linguist’s notion of Universal Grammar (UG), that is, an innate … morality acquisition device that maps the child’s early experience into the system of principles that constitutes the mature state of her moral competence. (Mikhail 2008, 355; 2011, 90)[^mikhail-2008]
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      The morality-acquisition device is, of course, different from the language-acquisition device, and both are different from any domain-general learning device like associationism (section 4) or statistical inference (see below, section 6).
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      An innate morality-acquisition device has been posited to explain several aspects of moral cognition (see, e.g., Dwyer et al. 2009; Mikhail 2011; Mahlmann 2023)[^mahlmann-2023][^mikhail-2011]. But perhaps the most detailed accounts have applied to the moral/conventional distinction and the content of moral rules.
    step1: TBD
    step2: TBD
  - id: 95
    kind: body
    source: |-
      Dwyer takes early appreciation of the moral/conventional distinction as a central competence that depends on a learning device specific to morality. She writes:
    step1: TBD
    step2: TBD
  - id: 96
    kind: body
    source: |-
      > [T]he recognition of a distinction between moral and conventional domains, and the belief that moral considerations are imbued with special force and authority appear to be universal features of human life (Song, Smetana, and Kim 1987; Turiel 1983)[^turiel-1983]. (Dwyer 1999, 169–170)
    step1: TBD
    step2: TBD
  - id: 97
    kind: body
    source: |-
      Similarly, in a later treatment of moral nativism, she writes:
    step1: TBD
    step2: TBD
  - id: 98
    kind: body
    source: |-
      > Three- to four-year-olds understand that moral rules differ from conventional rules in terms of two main criteria: the former have force that is independent of any particular authority (e.g., God, parents, social custom) and are closely tied up with considerations of harm and injury (see Nucci 2001; Turiel 1983, 1998)[^nucci-2001][^turiel-1983]. (Dwyer 2006, 237)
    step1: TBD
    step2: TBD
  - id: 99
    kind: body
    source: |-
      Thus, Dwyer maintains that a key feature of what is acquired is the recognition that moral rules, unlike conventional rules, are authority-independent.
    step1: TBD
    step2: TBD
  - id: 100
    kind: body
    source: |-
      In keeping with the linguistic analogy, Dwyer uses a Poverty of the Stimulus argument to show that the moral/conventional distinction depends on an innate learning device (Dwyer 1999, 171–177; 2006, 239–242). According to Dwyer, “the fundamental mistake” of domain-general learning theories is “the assumption that all the information the child needs to achieve moral maturity is available in her environment” (172). She continues:
    step1: TBD
    step2: TBD
  - id: 101
    kind: body
    source: |-
      > Absent a detailed account of how children extrapolate distinctly moral rules from the barrage of parental imperatives and evaluations, the appeal to explicit moral instruction will not provide anything like a satisfactory explanation of the emergence of mature moral competence. What we have here is a set of complex, articulated abilities that (i) emerge over time in an environment that is impoverished with respect to the content and scope of their mature manifestations, and (ii) appear to develop naturally across the species. (1999, 173)
    step1: TBD
    step2: TBD
  - id: 102
    kind: body
    source: |-
      According to Dwyer, just as domain-general learning can’t explain the child’s linguistic competence, domain-general learning can’t explain the child’s *moral* competence, as revealed by their grasp of the moral/conventional distinction (see also Dwyer 2006, 239–240). Thus, Dwyer maintains that the child’s moral competence exceeds what a domain-general learning system would be able to achieve given the information available in the environment. She concludes that “we all come into the world equipped with a store of innate moral knowledge which, together with our experience, determines our mature moral competence” (1999, 176–177). In particular, Dwyer speculates that neonates are “in possession of some knowledge that primes them for recognizing two normative social domains” (1999, 177).
    step1: TBD
    step2: TBD
  - id: 103
    kind: body
    source: |-
      While Dwyer focuses on the moral/conventional distinction, other moral Chomskyans have focused on the character of the rules. Harman and Mikhail suggest that the *Principle of Double Effect* is reflected in the pattern of intuitions people have about trolley cases (Harman 1999, 113–14; Mikhail 2011, 360)[^harman-1999][^mikhail-2011]. The Principle of Double Effect holds that it can be permissible to bring about a bad consequence when that consequence is foreseen but not intentional. If people have this principle represented in some way, this would partly explain why they judge it permissible to pull the switch to save five people, knowing that one person on the side track will be killed.
    step1: TBD
    step2: TBD
  - id: 104
    kind: body
    source: |-
      Mikhail maintains that the acquisition of these principles likely depends on the morality-acquisition device (2011). And we find a poverty-of-the-stimulus-style argument from Harman:
    step1: TBD
    step2: TBD
  - id: 105
    kind: body
    source: |-
      > An ordinary person was never taught the principle of Double-Effect…, and it is unclear how such a principle might have been acquired from the examples available to the ordinary person. This suggests that the relevant principle is built into I-morality ahead of time, in which case we should expect it to occur in all I-moralities (or be a default case, or something of the sort). In other words, the principles should be part of universal moral grammar. (Harman 225)
    step1: TBD
    step2: TBD
  - id: 106
    kind: body
    source: |-
      Harman’s point is that given the evidence available to the learner, it’s implausible that the learner could have acquired a principle as complex as the Principle of Double Effect without some innate contribution. And for the Chomskyan, the contribution is characteristically a dedicated acquisition device.
    step1: TBD
    step2: TBD
  - id: 107
    kind: body
    source: |-
      ### 5.2 Parochialism and nativism
    step1: TBD
    step2: TBD
  - id: 108
    kind: body
    source: |-
      As we reviewed in section 3.3, infants and young children are highly sensitive to group boundaries, and their affiliations and inferences are influenced by these distinctions. One explanation for parochial moral norms, then, is that it’s the inevitable consequence of innate tribalism. The moral Chomskyans don’t try to explain this via innate learning devices, but other theorists do maintain that parochial norms derive from innate tribal biases.
    step1: TBD
    step2: TBD
  - id: 109
    kind: body
    source: |-
      Clark and colleagues affirm tribal nativism: “tribal bias is a natural and nearly ineradicable feature of human cognition” (Clark, Liu, Winegard, & Ditto 2019, 587). This gets recruited into accounts of moral acquisition by cultural evolutionary, social, and developmental psychologists. For instance, Chalik and Rhodes (2020) propose that children have an *automatic group bias:* “children assume all norms (not just moral norms) are bounded by some type of category… once they learn that something falls under the scope of a norm… they assume there is a boundary on whom it applies” (80). This idea of an automatic group bias is motivated by the idea that there are evolutionary reasons to expect norm acquisition to facilitate within-group coordination (see, e.g., Boyd & Richerson 2009; Rand & Nowak 2013)[^boyd-2009][^rand-2013]. Chudek and Henrich (2011, 219) propose that such pressures resulted in “…a coevolutionary selection for an ‘ethnic psychology’: a tendency for social group members to adopt arbitrary ethnic markers and preferentially interact with and learn from people who share those markers, further reinforcing the degree of and pressure for coordination”. There was, they maintain, evolutionary pressure in favor of having a “skill at recognizing and representing the most common behaviors, beliefs, or strategies in one’s community and for dispositions to adopt them or even internalize them as proximate motivations or heuristics” (Chudek and Henrich 2011, 219–20)[^chudek-2011].
    step1: TBD
    step2: TBD
  - id: 110
    kind: body
    source: |-
      ## 6. Statistical learning and norms
    step1: TBD
    step2: TBD
  - id: 111
    kind: body
    source: |-
      As moral nativists like Mikhail have emphasized, moral rules seem to have complexity not explained directly by associative learning or explicit testimony. However, children and adults also learn via rational statistical inference based on available evidence (Kushnir et al. 2010; Xu & Kushnir 2013; Gopnik & Wellman 2012)[^gopnik-2012][^kushnir-2010]. While some statistical inference methods are intricate and specialized, others are straightforward and commonly understood. For example, if you want to estimate the difficulty of a logic exam you’ve administered, you might randomly grade 10 of the exams and use this sample to infer how the rest of the class performed. If 8 out of the 10 graded exams scored 100%, this suggests that the broader group likely did well, indicating that the test wasn’t too challenging. Here, you consider the graded sample as representative of the overall population of exams. Interestingly, even infants can make inferences from samples to populations (Xu & Kushnir 2013), and they demonstrate an early ability to use several statistical inference techniques (Dewar & Xu 2010; Girotto & Gonzalez 2008; Fontanari et al. 2014)[^dewar-2010][^fontanari-2014][^girotto-2008].
    step1: TBD
    step2: TBD
  - id: 112
    kind: body
    source: |-
      Various cognitive phenomena have been identified as relying on statistical inference, including categorization (Smith et al. 2002; Kemp et al. 2007)[^kemp-2007][^smith-2002], word learning (Xu & Tenenbaum 2007), theory of mind (Kushnir et al. 2010)[^kushnir-2010] and parsing (Gibson et al. 2013)[^gibson-2013]. In the case of the moral domain, rational statistical learning might not be able to tell the child what counts as moral (see section 7), but some of the complexity surrounding moral cognition might be explained via statistical learning. In this section, we will review statistical-learning approaches to some of the phenomena reviewed above.
    step1: TBD
    step2: TBD
  - id: 113
    kind: body
    source: |-
      ### 6.1 The size principle
    step1: TBD
    step2: TBD
  - id: 114
    kind: body
    source: |-
      One simple principle that has been invoked to capture moral representations is known as the “size principle” (Xu & Tenenbaum 2007). To grasp the principle intuitively, imagine your friend has two dice: a 4-sided and a 10-sided die. He randomly selects one, conceals it from you, and rolls it 10 times. He then reports the results: 3, 2, 2, 3, 1, 1, 1, 4, 3, 2. Which die do you think he rolled? Intuitively it seems like it must be the 4-sided die. While the results are technically compatible with the 10-sided die, it would be a suspicious coincidence that all the rolls happened to be 4 or lower. This reasoning aligns with the size principle, which we can represent using a nested structure to compare different hypotheses (figure 1).
    step1: TBD
    step2: TBD
  - id: 115
    kind: body
    source: |-
      *Figure 1:*
    step1: TBD
    step2: TBD
  - id: 116
    kind: body
    source: |-
      ![a large square with the number 10 inside it; nested inside is a smaller square with the number 4 inside it; the bottom- and left-side of the smaller square overlap with the bottom- and left-side of the larger square.](../assets/moral-learning/image001.png)
    step1: TBD
    step2: TBD
  - id: 117
    kind: body
    source: |-
      Figure 1: The numbers represent the highest denomination of the die; the rectangles represent the relative sizes of the hypotheses
    step1: TBD
    step2: TBD
  - id: 118
    kind: body
    source: |-
      The size principle states that when the evidence is consistent with the “smaller hypothesis” (in this case that is the hypothesis that it’s the 4-sided die), that hypothesis is the one that should be favored.
    step1: TBD
    step2: TBD
  - id: 119
    kind: body
    source: |-
      #### 6.1.1 Moral intuitions and action
    step1: TBD
    step2: TBD
  - id: 120
    kind: body
    source: |-
      As we saw in section 3.2, children tend to interpret moral rules as being focused on specific actions rather than on the broader consequences of those actions. They often understand these rules to mean that individuals should avoid causing certain outcomes rather than striving to reduce or minimize such outcomes. For example, the moral rule about lying is typically understood as "one should not lie" instead of "one should work to minimize instances of lying". Although children seem to register this distinction, they are not explicitly told anything like "it’s wrong to lie, but you’re not obligated to minimize others’ lying". So, how do children acquire moral rules defined over actions rather than consequences? The size principle provides a possible explanation.
    step1: TBD
    step2: TBD
  - id: 121
    kind: body
    source: |-
      As with the hypotheses about the dice, hypotheses about the range of a rule can be organized into a nested structure: the set of consequences actively produced by an agent is a subset of the broader set of consequences either produced or allowed by an agent (see figure 2).
    step1: TBD
    step2: TBD
  - id: 122
    kind: body
    source: |-
      *Figure 2*
    step1: TBD
    step2: TBD
  - id: 123
    kind: body
    source: |-
      ![a large rectangle with the label 'consequences' inside it; nested inside is a smaller rectangle with the label 'Consequences produced by agent' inside it.](../assets/moral-learning/image002.png)
    step1: TBD
    step2: TBD
  - id: 124
    kind: body
    source: |-
      Figure 2: The potential scope of rules. A rule confined to the smaller box (e.g., “it is wrong for an agent to make a mess”) is act-based. In contrast, a rule that spans the larger box (e.g., “it is wrong for an agent to make a mess or allow a mess to remain”) is consequence-based.
    step1: TBD
    step2: TBD
  - id: 125
    kind: body
    source: |-
      Children are rarely given explicit instruction about the difference between *doing* and *allowing*, yet they may still infer the distinction from the evidence they encounter. If all of the sample violations they encounter involve an agent intentionally producing an outcome, this pattern can suggest that the operative rule is not meant to forbid merely allowing that outcome to occur. This reasoning follows from the size principle (section 6.1). When none of the observed violations are “allowings” this would be a suspicious coincidence if the rule prohibited allowings. The absence of evidence is itself evidence.
    step1: TBD
    step2: TBD
  - id: 126
    kind: body
    source: |-
      But what kind of evidence does the child actually receive? Nichols and colleagues analyzed a portion of the standard database for child-directed speech (CHILDES) and found that over 99% of observed rule violations involved intentional actions (Nichols et al. 2016)[^nichols-2016]. For most of the rules children encounter, the data show a conspicuous lack of evidence in favor of the hypothesis that the rule applies both to acting and allowing. And this counts as evidence that the rules do not apply to allowings but only to actions.
    step1: TBD
    step2: TBD
  - id: 127
    kind: body
    source: |-
      #### 6.1.2 Parochialism
    step1: TBD
    step2: TBD
  - id: 128
    kind: body
    source: |-
      The size principle can also explain how children might learn parochial rather than inclusive norms. Suppose a learner is trying to determine whether some rule applies to everyone or just to a designated proper subset of the population. For instance, imagine a set of creatures, some of whom are blue and some of whom are yellow. If the child has an opportunity to see several violations, and all of them are restricted to the blue creatures, that would provide evidence that the rule only applies to the blue creatures. That is, if the rule applied to the entire population, it would be a suspicious coincidence that all of the sample violations only applied to the blue creatures. Hence, it would be appropriate to infer that the rule had a parochial scope.
    step1: TBD
    step2: TBD
  - id: 129
    kind: body
    source: |-
      Using a novel rules paradigm, Partington and colleagues (2023) investigated whether adults and children would make these kinds of inferences about social rules. Participants were told about two distinct groups of creatures, Glerks and Hibbles, and given sample violations. For instance, an image showing a Glerk wearing a ribbon is labeled as violating the rule. Based on the sample violations, participants were asked to infer whether the rule applied to just Glerks or to Glerks as well as Hibbles. In keeping with the size principle, participants tended to think that when all of sample violations were with Glerks, they tended to infer that the rule only applied to Glerks. This tendency was stronger when the population of Glerks was small (20%) rather than large (80%). This is in fact the rational inference to draw since if all of the sample violations involved Glerks, then it’s especially likely that the rule only applies to Glerks if the population of Glerks is only 20%. That is, it would be even more of a suspicious coincidence if the rule applied to everyone when all the samples come from a designated small minority.
    step1: TBD
    step2: TBD
  - id: 130
    kind: body
    source: |-
      ### 6.2 Trade-off between fit and flexibility
    step1: TBD
    step2: TBD
  - id: 131
    kind: body
    source: |-
      Another statistical principle that has been invoked to explain moral representations involves the trade-off between fit and flexibility. Of course, it’s important for a hypothesis to *fit the data*; but it’s also important to take into account the *flexibility* of the hypothesis, i.e., *its ability to fit data*. An extremely flexible hypothesis can accommodate a very wide range of data and thus risks overfitting. Thus each prediction of a highly flexible hypothesis is less likely than the prediction of a more committal hypothesis.
    step1: TBD
    step2: TBD
  - id: 132
    kind: body
    source: |-
      This applies naturally to evaluating whether a claim is universally or relatively true. Consider a child learning about months and seasons. She thinks that the sentence “July is a summer month” is true, and she’s trying to figure out whether it’s universally true or only relatively true. If she discovers that just over half the world considers July a summer month while the rest do not, it would be reasonable for her to conclude that the sentence “July is a summer month” is only relatively true. The hypothesis that it is a universal truth fits the consensus data too poorly.
    step1: TBD
    step2: TBD
  - id: 133
    kind: body
    source: |-
      Now imagine the child learns that 99% of people around the world think that “Snow melts when it warms” is true. The consensus surrounding this judgment provides reason to think that it is a universal truth about which a small minority is mistaken. A relativist account can, of course, fit the responses – one could say that the judgment is true relative to one group and false relative to another, much smaller group; however, the relativist hypothesis can say this about *any* distribution of responses, and this massive amount of flexibility counts against it. It will often be more plausible to count a small minority as mistaken about a universal truth rather than correct about a relative one.
    step1: TBD
    step2: TBD
  - id: 134
    kind: body
    source: |-
      More generally, if opinion is largely split, then, unless we have prior reason to think it’s a universal domain or the opinion-holders are unreliable on the topic, it is rational to infer relativism as a means of fitting the data. However, if opinion is almost universal then, unless we have prior reason to think it’s a relativist domain or the opinion holders are unreliable on the topic, we should maintain universalism rather than take on a flexible account like relativism.
    step1: TBD
    step2: TBD
  - id: 135
    kind: body
    source: |-
      #### 6.2.1 Universal norms
    step1: TBD
    step2: TBD
  - id: 136
    kind: body
    source: |-
      People tend to think it’s universally true that it’s wrong to steal (e.g., Goodwin & Darley 2008)[^goodwin-2008]. But people think that it’s only relatively true that it’s wrong to wear jeans to school. In other words, whether it’s wrong to wear jeans depends on the context, but it’s wrong to steal across all contexts. How do people come to make these meta-normative judgments? Reasoning from fit and flexibility provides a method. If we discover that almost everyone thinks it’s wrong to steal, then this favors the view that stealing is universally wrong. To invoke relativism would introduce unwarranted flexibility into the model. By contrast, if we discover that there is wide divergence about whether it’s wrong to wear jeans to school, this suggests that the claim about attire must be relativized to context.
    step1: TBD
    step2: TBD
  - id: 137
    kind: body
    source: |-
      Are people actually sensitive to consensus evidence when making judgments about whether a claim is universally or only relatively true? Indeed they are. First, there is a correlation between judgments of universalism and judgments of high consensus. For instance, people tend to think that (1) there is widespread consensus that it’s wrong to rob banks and that (2) robbing a bank is universally wrong; by contrast, people tend to think that (1*) there is no widespread consensus about whether abortion is wrong and that (2*) abortion is not universally wrong (Goodwin & Darley 2008)[^goodwin-2008]. Goodwin & Darley (2012) also manipulated perceived consensus about various issues by informing participants either that there was high or low consensus in the United States about the issue; they found that people gave more universalist responses when they were told that consensus was high and more relativist responses when they were told that consensus was low (see also Ayars & Nichols 2020)[^ayars-2020].
    step1: TBD
    step2: TBD
  - id: 138
    kind: body
    source: |-
      #### 6.2.2 The moral/conventional distinction
    step1: TBD
    step2: TBD
  - id: 139
    kind: body
    source: |-
      As we saw above (section 3.1), children reliably treat moral violations differently from conventional violations. Of particular interest is that children are more likely to regard conventional violations (e.g., standing up during nap time) as authority-dependent than moral violations (e.g., hitting another child). If a teacher says that there is no rule against standing up during nap time, then children are more inclined to say that the action is permissible than if the teacher says there is no rule against hitting another child (Smetana, 1985; Turiel 1983)[^turiel-1983].
    step1: TBD
    step2: TBD
  - id: 140
    kind: body
    source: |-
      The account of universalist and relativist judgments offered above naturally extends to explain judgments about authority-independence. Insofar as perceived high consensus generates a universalist judgment – that the action is wrong universally – it follows that the action should also be regarded as wrong independent of authority. In a recent study, consensus information was manipulated directly and the results indicated that when there is high consensus regarding an unspecified normative prohibition, people tend to think that the prohibited action is wrong independent of authority (Ayars & Nichols 2020)[^ayars-2020]. Thus, statistical learning seems to provide an explanation for how people come to make judgments of universalism and relativism as well as authority independence.
    step1: TBD
    step2: TBD
  - id: 141
    kind: body
    source: |-
      ## 7. Moralization
    step1: TBD
    step2: TBD
  - id: 142
    kind: body
    source: |-
      Although statistical learning might explain some of the complexity of moral representations, it does so at the expense of capturing anything distinctively moral (see, e.g., Mikhail 2022)[^mikhail-2022]. Thus, even if statistical learning offers a how-possible explanation for the acquisition of rules that are act-based and parochial, as well as how rules might be accorded the status of being authority-independent, it’s not obvious that this is the correct story about the acquisition of *moral* rules and the moral/conventional distinction. In this final section, we consider various ways that distinctively moral representations might be acquired, or not, as the case may be.
    step1: TBD
    step2: TBD
  - id: 143
    kind: body
    source: |-
      ### 7.1 Rejecting the distinction
    step1: TBD
    step2: TBD
  - id: 144
    kind: body
    source: |-
      The first, simplest option regarding distinctively moral representations is to deny that there is a true distinction between moral and non-moral representations (e.g., Kelly et al. 2007; Sinnott-Armstrong & Wheatley 2012 and 2014; Sinnott-Armstrong 2016)[^kelly-2007][^sinnott-armstrong-2016][^sinnott-armstrong-2012][^sinnott-armstrong-2014]. The most prominent version of this skeptical position focuses on the moral/conventional literature. According to standard ways of drawing the moral domain, it is essentially tied to harmful actions, such that if an action is registered as harming an individual, it will be regarded as morally wrong. However, some experimental results seem to speak against this simple identification. For instance, Kelly and colleagues found that most participants thought that whipping a sailor who is neglectful of their duties was wrong now, but a majority thought it was okay to whip a derelict sailor 300 years ago (Kelly et al. 2007; see also Quintelier and Fessler 2015)[^kelly-2007][^quintelier-2015]. *Pace* the traditional account of the moral/conventional distinction, these results are supposed to show that actions that constitute harm-based violations for us now still show context-relativity. That would mean that one of the core signatures that is supposed to attend to moral representations is really not dispositive. For responses to this line of critique, see e.g., Sousa et al. 2009; Kumar 2015; Dahl & Waltzer 2020 (supplementary online materials); Margoni & Surian 2021. (See also SEP entry “The Moral/Conventional Distinction”.)
    step1: TBD
    step2: TBD
  - id: 145
    kind: body
    source: |-
      ### 7.2 Testimony
    step1: TBD
    step2: TBD
  - id: 146
    kind: body
    source: |-
      Even if skeptics about the moral/conventional distinction are right, there remains a question about the ordinary use of the term “moral”. People do reliably identify certain transgressions as “moral” (see, e.g., Wright et al. 2013 and 2014)[^wright-2013][^wright-2014]. For instance, most people regard the type of issue involved in cheating on a lifeguard exam as “moral”, whereas most people regard the type of issue involved in wearing pajamas to a meeting as “social conventions/norm” (Wright et al. 2013, 4)[^wright-2013]. There is a simple question about how these labels get attached, and skepticism about the moral/conventional distinction doesn’t answer this question. However, one flat-footed possibility is that people simply hear the word “moral” attached to certain kinds of actions, like cheating. This would be a minimal explanation for the emergence of talk of “morality”. One version of this idea would be broadly consistent with the skepticism about the moral/conventional distinction. For it might be that the use of “moral” is relatively undisciplined. Another possibility, though, is that there is some deeper regularity about the way the term “moral” is used, and that this deeper regularity conforms to a great extent to the traditional characterization of morality in terms of harm.
    step1: TBD
    step2: TBD
  - id: 147
    kind: body
    source: |-
      ### 7.3 Innate
    step1: TBD
    step2: TBD
  - id: 148
    kind: body
    source: |-
      A much more robust view is that moral representations are distinctive because there is an innate learning device for moral acquisition. This view was discussed in section 5 above. According to this nativist view, even if it’s possible to acquire the act/allow distinction or the moral/conventional distinction from statistical learning, this is not how humans actually acquire such distinctions in the moral domain. Although this is a theoretical possibility, more work would be needed to show that this is a superior explanation to the domain-general explanation offered by statistical learning. That is, it remains to be seen why we should think that the act/allow distinction is learned differently in the moral domain than it is in the, say, conventional domain.
    step1: TBD
    step2: TBD
  - id: 149
    kind: body
    source: |-
      ### 7.4 Emotional resonance
    step1: TBD
    step2: TBD
  - id: 150
    kind: body
    source: |-
      Another explanation for distinctiveness of moral representations harks back to findings on emotional sensitivity. Blair’s theory ties moral judgment to the innate sensitivity to distress cues (see section 4.1). His theory has difficulty accommodating the fact that we regard moral violations as wrong, and not merely as bad (see section 4.3). It’s partly because of this failure to register wrongness that many theorists have maintained that rules play an essential role in moral representations that go beyond mere emotional response. However, one might attempt to capture the distinctiveness of moral representations by invoking both rules and emotional responses. It might be that rules that prohibit actions that are independently likely to elicit aversive responses get treated in distinctive ways. And this coupling would plausibly occur for central moral violations like those involving assault (see, e.g., Nichols 2004)[^nichols-2004]
    step1: TBD
    step2: TBD
  - id: 151
    kind: body
    source: |-
      ### 7.5 Universalizability
    step1: TBD
    step2: TBD
  - id: 152
    kind: body
    source: |-
      A final possibility for how we might develop distinctively moral representations draws on roughly Kantian ideas about the permissibility of universalizing a particular kind of action. At least in some cases, we feel obligations not because our individual action has direct consequences, and not because it is bound by societal norms or even strong emotions, but rather because we consider a hypothetical: “What if everyone did/didn’t do X?” and the potential harms or benefits that would result. Examples include voting (for potential collective political benefits), recycling and reusing (for potential environmental benefits), and vaccination (for potential public health benefits).
    step1: TBD
    step2: TBD
  - id: 153
    kind: body
    source: |-
      Levine and colleagues (2020) termed this consideration of hypothetical collective actions *universalization*. They found that this tendency to think about the hypothetical actions of collectives of individuals can explain the generation of new moral rules in certain cases. These cases can be predicted through a computational model as a function of the number of people *n* who would hypothetically engage in an action if they felt “at moral liberty to do so” (Levine et al. 2020, 26159)[^levine-2020] and the aggregate utility *U(n)* of that collective action. When the hypothetical number of people exceeds a threshold for harm, *U(n)* decreases and the action is judged to be impermissible.
    step1: TBD
    step2: TBD
  - id: 154
    kind: body
    source: |-
      In a series of experiments, Levine et al. (2020) showed that this model of universalization matches well with people’s evaluations of the permissibility of individual actions. For example, in one vignette, participants read a story about a fictional lakeside town where people could fish without harming the lake. They were then told about a new fishing hook that could be used by three or fewer people without harming the lake but would harm the lake if more than three people used it (the harm was a “total collapse” of the fish population). Participants were asked to evaluate one fisherman’s actions as morally good or bad across two conditions: in the *low-interest* condition they were told that no one else is interested in using the hook, and in the *high-interest* condition they were told that everyone was interested in using the hook. Importantly, participants in both conditions were also told that (1) everyone else had decided not to use the hook, and (2) there were no rules against using the hook. Despite these additional assurances, participants judged the fisherman’s action as less permissible in the *high-interest* than in the *low-interest* condition.
    step1: TBD
    step2: TBD
  - id: 155
    kind: body
    source: |-
      The tendency to universalize drives moralization of otherwise harmless actions even early in development. With child-friendly vignettes, Levine and colleagues (2020) showed that even 4- to 11-year-old children consider the potential threshold of harm when judging whether an action is permissible or impermissible. Finiasz and colleagues (2025) replicated this finding with a new sample of 6- to 10-year-old children, showing that children’s tendency to universalize is influenced not only by hypothetical interest, but by the severity of the potential harmful consequences that result. Together these studies suggest universalization as a mechanism for moralizing actions in the absence of individual direct harms, emotional resonance, or explicit rules.
    step1: TBD
    step2: TBD
  - id: 156
    kind: body
    source: |-
      In this entry, we have reviewed the main threads of work on moral learning in contemporary moral psychology. The result suggests that several different mechanisms are implicated in moral learning, including innate starting states, associative learning, statistical learning, and emotional sensitivity. This just illustrates some of the broad contours of how we acquire morality. There is much left to discover.
    step1: TBD
    step2: TBD
