      People show a marked distinction in moral intuitions about scenarios that involve actions as compared to allowings. Young children judge that it’s worse to produce a bad outcome than it is to fail to prevent the same outcome (Powell et al. 2012)[^powell-2012]. More generally, people tend to regard social and moral rules a*s act-based* (keep your promises; don’t litter) rather than *consequence-based* (maximize promise-keeping; minimize litter). This focus on action is revealed in studies on moral dilemmas like trolley cases. In *Footbridge*, one can push a person in front of the speeding trolley to prevent the trolley from killing five innocents; the modal judgment here is that it’s not permissible to push the person. But in this case, while the agent refrains from producing the death of the one person, he is thereby allowing the death of five people. *Allowing* the deaths doesn’t seem to carry the same moral import as producing a death via one’s own action. This pattern of judgment has also been found in young children (Pellizzoni et al. 2010)[^pellizzoni-2010].
    step1: |-
      人们对涉及行动与允许的情境，在道德直觉上表现出显著区别。幼儿判定，造成坏结果比未能阻止同样结果更糟（Powell et al. 2012）[^powell-2012]。更一般地说，人们倾向于把社会与道德规则视为*以行动为基础*的（信守承诺；不要乱扔垃圾），而不是*以后果为基础*的（最大化守诺；最小化乱扔）。这种对行动的关注，在电车难题之类道德困境研究中显露出来。在*天桥*案例中，人可以把一个人推到疾驰的电车前，以阻止电车轧死五名无辜者；此时的典型判断是，推人不被允许。但在这个案例中，行动者虽未亲手造成那一个人的死亡，却因此允许了五个人的死亡。*允许*死亡，似乎并不具有与自己行动造成死亡同样的道德分量。这种判断模式在幼儿身上也有发现（Pellizzoni et al. 2010）[^pellizzoni-2010]。
    step2: |-
      人对“动手做”与“任由发生”这两类情境，道德直觉差别很大。幼儿就认为，弄出坏结果比没能阻止同样的结果更糟（Powell et al. 2012）[^powell-2012]。更一般地说，人们把社会与道德规则看作*以行动为基础*（守住承诺；别乱扔垃圾），而不是*以后果为基础*（尽量多守诺；尽量少乱扔）。这份对行动的看重，在电车难题一类困境里看得最清。*天桥*案中，可以把一人推下天桥挡住电车，救下五名无辜者；典型判断是：不许推。可这样一来，行动者虽没亲手弄死那个人，却等于任由五人死去。*任由*死亡，似乎不如亲手致死那么有道德分量。幼儿身上也有同样的判断模式（Pellizzoni et al. 2010）[^pellizzoni-2010]。
