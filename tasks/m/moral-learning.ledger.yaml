      Classical conditioning is a ubiquitous and powerful form of learning. It’s found across the animal kingdom, from humans to snails (Kemenes & Benjamin 1989). And it’s implicated in a wide range of phenomena, from phobias (e.g., LeDoux 2014)[^ledoux-2014] to drug tolerance (e.g., Siegel et al. 1982).
    step1: |-
      经典条件作用是无处不在且强有力的学习形式。从人类到蜗牛，整个动物界都能见到（Kemenes & Benjamin 1989）。它牵涉广泛现象，从恐惧症（如 LeDoux 2014）[^ledoux-2014] 到药物耐受（如 Siegel et al. 1982）。
    step2: |-
      经典条件作用到处都在，威力也大。从人到蜗牛，整个动物界都有（Kemenes & Benjamin 1989）；它牵涉的现象也广，从恐惧症（如 LeDoux 2014）[^ledoux-2014] 到药物耐受（如 Siegel et al. 1982）。
