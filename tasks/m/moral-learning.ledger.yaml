      James Blair has recruited classical conditioning as an important element in the emergence of moral judgment. As we saw in section 1.1, infants are acutely sensitive to the distress of others. This fact is of central importance in Blair’s theory. In Blair’s classic (1995) articulation of the model, humans possess an innate mechanism, the violence inhibition mechanism (VIM). This proposal is derived from the idea that social animals have mechanisms to inhibit intra-species aggression (see, e.g., Lorenz 1966)[^lorenz-1966]. A distress cue (e.g., crying) is an unconditioned stimulus for the activation of VIM, and VIM activation is an unconditioned response to such cues (Blair 1995, 5)[^blair-1995]. The activation of VIM results in a withdrawal response but also generates an aversive experience (1995, 7). It is this aversive experience that is critical to moral judgments on Blair’s view. However, the distress cues that constitute unconditioned stimuli for VIM are a limited class, tied directly to perceptual signs of distress like crying and shrieking. Moral judgments, by contrast, can be made in the absence of any such perceptual cues. This is where the learning story enters for Blair. Blair maintains that classical conditioning will lead to associations between perceptual cues of pain and *thoughts* about harm. In particular, classical conditioning will build an association between perceptual cues of pain and “representations of the victim’s internal state, formed through role taking” (1995, 9). As a result of this association, representations of a victim’s pain will activate VIM even in the absence of any perceptual signs, and this activation will carry an aversive experience. As Blair puts it, “an individual may generate empathic arousal to just the thought of someone’s distress (e.g., "what a poor little boy") without distress cues being actually processed” (1995, 5).
    step1: |-
      James Blair 把经典条件作用纳入道德判断的兴起过程，作为重要要素。正如 1.1 节所见，婴儿对他人的痛苦极为敏感。这一事实在 Blair 的理论中居于核心。在 Blair（1995）对该模型的经典表述中，人类拥有一种先天机制，即暴力抑制机制（VIM）。这一提法源自一个想法：社会性动物具有抑制种内攻击的机制（见如 Lorenz 1966）[^lorenz-1966]。痛苦信号（如哭泣）是激活 VIM 的无条件刺激，VIM 的激活是对这类信号的无条件反应（Blair 1995, 5）[^blair-1995]。VIM 的激活导致退缩反应，但也产生一种厌恶体验（1995, 7）。按 Blair 的看法，正是这种厌恶体验对道德判断至关重要。然而，构成 VIM 无条件刺激的痛苦信号是一类有限的刺激，直接系于哭泣、尖叫之类痛苦的知觉标志。相比之下，道德判断可以在没有任何这类知觉线索的情况下作出。Blair 的学习故事正是在此登场。Blair 主张，经典条件作用会建立痛苦知觉线索与关于伤害的*思想*之间的联想。具体说，经典条件作用会在痛苦知觉线索与“通过角色采择形成的受害者内部状态表征”之间建立联想（1995, 9）。由于这一联想，受害者痛苦的复现即便在没有任何知觉迹象时也会激活 VIM，而这种激活会带来厌恶体验。用 Blair 的话说，“个体可能仅仅想到某人的痛苦（例如‘多可怜的小男孩’）就产生共情唤醒，而痛苦信号并未实际得到加工”（1995, 5）。
    step2: |-
      James Blair 把经典条件作用摆进道德判断的形成过程，当作关键一环。1.1 节已见，婴儿对他人的痛苦极敏感；这一点在 Blair 的理论里是顶梁柱。Blair（1995）的经典表述是：人类有一种先天机制，叫暴力抑制机制（VIM）。这个提法来自一个想法：社会性动物有抑制种内攻击的机制（见如 Lorenz 1966）[^lorenz-1966]。痛苦信号（如哭声）是激活 VIM 的无条件刺激，VIM 被激活则是对这类信号的无条件反应（Blair 1995, 5）[^blair-1995]。VIM 一激活，人就会退缩，同时生出一种厌恶体验（1995, 7）。Blair 认为，正是这份厌恶，对道德判断至关重要。可麻烦在于：能当 VIM 无条件刺激的痛苦信号很有限，只限于哭声、尖叫这类看得见听得见的痛苦迹象；道德判断却可以在毫无这类迹象时作出。Blair 的学习故事就从这儿接上。他说，经典条件作用会把痛苦的知觉线索与关于伤害的*念头*联在一起，具体说，是与“通过角色采择形成的受害者内部状态表征”联在一起（1995, 9）。有了这层联想，即便没有任何知觉迹象，一想到受害者的痛苦，VIM 也会被激活，厌恶体验随之而来。用 Blair 的话说，“个体可能仅仅想到某人的痛苦（比如‘多可怜的小男孩’）就产生共情唤醒，而痛苦信号并未实际得到加工”（1995, 5）。
