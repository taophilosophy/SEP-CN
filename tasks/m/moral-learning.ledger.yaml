      The earliest prosocial behaviors emerge in concert with emotional and cognitive developments discussed above. Notably, the capacity to understand intentions combines with empathic concern to inform early prosocial behavior, especially helping, comforting, and sharing (Paulus 2014)[^paulus-2014]. For example, toddlers will go out of their way to remove obstacles or obtain out-of-reach objects if such actions help another person accomplish their goals (Dunfield et al. 2011; Warneken & Tomasello 2006; Svetlova et al. 2010)[^dunfield-2011][^svetlova-2010][^warneken-2006]. The understandings of fairness (equitable resource allocation) which emerge in the second year of life correlate with infants’ own sharing behavior: infants who themselves share expect others to share. These and other examples suggest early ties between moral cognition and prosocial action.
    step1: |-
      最早的亲社会行为，与上文讨论的情感与认知发展一同出现。值得注意的是，理解意图的能力与共情关切结合，共同塑造早期亲社会行为，尤其是帮助、安慰与分享（Paulus 2014）[^paulus-2014]。例如，如果某举动能帮别人达成目标，幼儿会特意去移开障碍，或取来够不着的东西（Dunfield et al. 2011; Warneken & Tomasello 2006; Svetlova et al. 2010）[^dunfield-2011][^svetlova-2010][^warneken-2006]。生命第二年出现的公平理解（资源均分），与婴儿自己的分享行为相关：自己愿意分享的婴儿，也预期别人分享。这些例子以及其他例子表明，道德认知与亲社会行动之间早有联系。
    step2: |-
      最早的亲社会行为，跟前面说的情感、认知发展一块儿冒出来。看得出，理解意图的本事与共情关切一联手，就成了早期亲社会行为的推手，尤其是帮助、安慰与分享（Paulus 2014）[^paulus-2014]。比如，只要某个举动能帮别人达成目标，幼儿会特意绕过去挪开障碍、取来够不着的东西（Dunfield et al. 2011; Warneken & Tomasello 2006; Svetlova et al. 2010）[^dunfield-2011][^svetlova-2010][^warneken-2006]。第二年出现的公平观念（资源均分），跟婴儿自己的分享行为对得上：肯分享的孩子，也指望别人分享。这类例子说明，道德认知与亲社会行动很早就牵上了手。
