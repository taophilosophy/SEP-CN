      ## 1 起始状态
  - id: 6
    kind: body
    source: |-
      Learning requires input, but it also requires a psychology – in the learner – that receives input in a way that is useful for learning. Thus, one of the questions we must answer before addressing mechanisms of learning in any domain is what states of reacting, attending, encoding, representing, and knowing exist prior to receiving input. Answering this question is important for understanding the emergence of moral knowledge early in human development. It is also important for understanding changes to and advances in moral knowledge later in life, in as much as prior processing capacities, reactions, and knowledge bias treatment of new information.
    step1: |-
      学习需要输入，但也需要学习者具备一种心理机制，以对学习有用的方式接收输入。因此，在任何领域讨论学习机制之前，我们必须回答的问题之一是：在接收输入之前，存在哪些反应、注意、编码、表征与认知的状态。回答这个问题，对理解人类发展早期道德知识的出现很重要；它同样有助于理解此后人生中道德知识的变化与进展，因为先前的加工能力、反应与知识会影响对新信息的处理。
    step2: |-
      学习要输入，可光有输入不够：学习者还得有一套心理机制，把输入接得对学习有用。所以，无论研究哪个领域的学习机制，先得回答一个问题：在接收输入之前，学习者已经具备哪些反应、注意、编码、表征与认知状态？弄清这一点，才能理解道德知识在人生早期如何冒头；也才能理解它此后如何变化、如何长进——因为先前的加工能力、反应与知识会左右新信息怎么被处理。
  - id: 7
    kind: body
    source: |-
      When it comes to young moral learners, the theories of moral learning discussed below assume a set of such “starting states”, though they disagree on which ones. Much of the disagreement stems from a connection between modern scientific views on learning and historical debates over innateness of knowledge (see SEP entries “The Historical Controversies Surrounding Innateness” and “Innateness and Contemporary Theories of Cognition”). The current entry does not aim to resolve debates on the innateness (or not) of moral knowledge, nor to resolve controversies about which starting states are innate. Here instead we start by specifying the set of emotional and cognitive capacities present early in life that – whether innate or themselves learned – are together useful, and perhaps necessary, as foundations for moral learning.
    step1: |-
      就年幼的道德学习者而言，下文讨论的道德学习理论都假定存在一组这样的“起始状态”，尽管它们对具体是哪些状态意见不一。分歧大多源自现代科学的学习观与历史上关于知识先天性的争论之间的联系（见 SEP 词条“围绕先天的历史争议”与“先天和当代认知理论”）。本词条不打算解决道德知识是否先天的问题，也不打算裁断哪些起始状态属于先天。我们转而先说明生命早期就已具备的一组情感与认知能力——无论它们是先天的还是本身习得的——它们合在一起，作为道德学习的基础是有用的，或许还是必要的。
    step2: |-
      讲到年幼的道德学习者，下文各种理论都假定有一套“起始状态”，只是各家对“哪些算”争执不下。分歧多半来自现代科学的学习观与历史上关于知识先天的老争论之间的牵连（见 SEP 词条“围绕先天的历史争议”与“先天和当代认知理论”）。本词条无意裁断道德知识是否先天，也不裁断哪些起始状态属于先天。我们只先清点生命早期已具备的一组情感与认知能力——不论先天还是习得——它们合起来，作为道德学习的底子，有用，或许还不可缺少。
