      On a somewhat more subtle measure, the *authority dependence* task, participants are asked whether the action would be wrong if some relevant authority didn’t have a rule against it. For example, would it be wrong to hit someone in class without provocation if the teacher didn’t have a rule against it? People tend to say that it would still be wrong in such a case but are less likely to say this when asked about a conventional rule, like standing up during nap time.
    step1: |-
      在一项更为微妙些的测量即*权威依赖*任务中，参与者被问：如果相关权威没有立规矩反对，该动作是否仍然错误？例如，如果老师没有规定不许，在课堂上无故打人是否仍然错误？人们倾向于说，在这种情况下打人仍然错误；但问到“午睡时站起来”这类习俗规则时，人们较少这样说。
    step2: |-
      还有一项更细的测量，叫*权威依赖*任务：问“要是权威没有禁止，这事还错吗？”比如，老师没立规矩，课堂上无故打人就对了吗？人们多半说，还是错。换成“午睡时站起来”这种习俗规则，说“还错”的人就少了。
