      Understanding intentional agency also allows for social learning through imitation. Infants in the second year of life are motivated to imitate what they perceive to be the intentions of a demonstrator, rather than an exact copy of their body movements (Melzoff 1995; Carpenter et al. 1998)[^carpenter-1998], and they imitate what they infer to be a demonstrator’s goal even if the attempt is unsuccessful (Melzoff 1995; Gergeley et al. 2002).
    step1: |-
      理解意向行动，还使通过模仿进行的社会学习成为可能。生命第二年的婴儿，动机在于模仿他们所理解的示范者意图，而不是精确复制其身体动作（Melzoff 1995; Carpenter et al. 1998）[^carpenter-1998]；即便示范者的尝试未成功，他们也会模仿所推断的示范者目标（Melzoff 1995; Gergeley et al. 2002）。
    step2: |-
      读懂意向行动，还打开了靠模仿学习的大门。第二年的婴儿，模仿的是他理解的示范者意图，而不是照搬人家的身体动作（Melzoff 1995; Carpenter et al. 1998）[^carpenter-1998]；哪怕示范者没做成，婴儿也会照自己推断的目标去模仿（Melzoff 1995; Gergeley et al. 2002）。
