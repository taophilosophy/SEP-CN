      ### 1.2 Cognitive precursors
    step1: |-
      ### 1.2 Cognitive precursors
    step2: |-
      ### 1.2 认知前体
  - id: 13
    kind: body
    source: |-
      In addition to the emotional capacities described above, human learners have a set of cognitive capacities which emerge within the first few years of life that are foundational for learning about the complexities of the social world. Several researchers have argued that this is part of a suite of evolved cognitive skills that enable humans to engage in cooperation in social groups (Chudek & Henrich 2011; Tomasello 2018a; Cosmides & Tooby 1992)[^chudek-2011][^cosmides-1992][^tomasello-2018a]. As a leading proponent of the view that morality and cooperation are connected, and tied to uniquely human psychology, Tomasello writes:
    step1: |-
      除上述情感能力外，人类学习者还具备一组在生命最初几年出现的认知能力，它们是以此学习社会世界之复杂性的基础。几位研究者主张，这是一套演化而来的认知技能的一部分，使人能够在社会群体中合作（Chudek & Henrich 2011; Tomasello 2018a; Cosmides & Tooby 1992）[^chudek-2011][^cosmides-1992][^tomasello-2018a]。作为主张道德与合作相连、并系于人类独有心理的领军人物，Tomasello 写道：
    step2: |-
      情感能力之外，人类学习者还有一组认知能力，在生命最初几年冒出来，日后用来摸清社会世界的门道。好几位研究者认为，这属于一套演化出来的认知本领，使人能在群体里合作（Chudek & Henrich 2011; Tomasello 2018a; Cosmides & Tooby 1992）[^chudek-2011][^cosmides-1992][^tomasello-2018a]。Tomasello 主张道德与合作相连、并系于人类独有的心理，可算这一派的旗手。他写道：
  - id: 14
    kind: body
    source: |-
      > Cooperation and morality both refer to intentional actions in which the agent is not just pursuing its own self-interested motives, but is also concerned with the well-being of others. … to account for cooperation, and so morality, we need a psychology that recognizes individuals’ interdependence with one another that makes it rational for each individual to be concerned that their groupmates survive and thrive, and that those groupmates reciprocate this concern. (2018a, 661–662)
    step1: |-
      > Cooperation and morality both refer to intentional actions in which the agent is not just pursuing its own self-interested motives, but is also concerned with the well-being of others. … to account for cooperation, and so morality, we need a psychology that recognizes individuals’ interdependence with one another that makes it rational for each individual to be concerned that their groupmates survive and thrive, and that those groupmates reciprocate this concern. (2018a, 661–662)
    step2: |-
      > 合作与道德都指这样一些有意行动：行动者不只在追求自身利益动机，也关心他人的福祉。……要说明合作、从而说明道德，我们需要一种承认个体彼此相互依赖的心理：这种相互依赖使每个个体有理由关心同伴的生存与兴旺，也关心同伴对这种关心的回报。（2018a, 661–662）
  - id: 15
    kind: body
    source: |-
      Tomasello’s view (2018a) on moral starting states involves two maturational changes in development that are timed to emerge in sequence (see SEP entry “Collective Intentionality” for more details on the view). The first is the development, at the end of the first year of life (roughly at 9 months of age), of cognitive capacities that allow the infant to cooperate as an individual with other individuals *and* include the ability to engage in joint attention, and to infer others’ intentions and goals (see below). The second is the development, at the beginning of early childhood (roughly age 3), of cognitive capacities that allow the young child to cooperate as a *member of a group* with other group members*.* This includes the abilities to coordinate shared intentions, to take the perspective of others and reason about mental states (see SEP entry “Folk Psychology as a Theory”), and to understand social norms. On Tomasello’s view, these developmental changes parallel two transitions in human evolution: the former includes cognitive characteristics shared with other primates and the latter is unique to our species.
    step1: |-
      Tomasello（2018a）关于道德起始状态的观点，涉及发展中的两次成熟变化，它们在时间上依次出现（关于该观点的更多细节，见 SEP 词条“集体意向性”）。第一次是生命第一年末（约 9 个月大时）出现的一组认知能力，使婴儿能作为个体与其他个体合作，*并且*包括参与共同注意、推断他人意图与目标的能力（见下文）。第二次是幼儿期初（约 3 岁）出现的一组认知能力，使幼儿能作为*群体成员*与其他成员合作。这包括协调共同意图、采取他人视角并对心理状态进行推理（见 SEP 词条“作为理论的民间心理学”）、以及理解社会规范的能力。按 Tomasello 的看法，这些发展变化与人类演化中的两次转变平行：前者包括与其他灵长类共有的认知特征，后者则为人类所独有。
    step2: |-
      Tomasello（2018a）讲道德起始状态，说的是发展过程中两次成熟变化，前后相继（细节见 SEP 词条“集体意向性”）。头一次在第一年末，约九个月大，出现一组认知能力，让婴儿能作为个体跟别的个体合作，*还*包括参与共同注意、推断他人意图与目标（见下文）。第二次在幼儿期初，约三岁，出现另一组能力，让幼儿能作为*群体的一员*跟其他成员合作：协调共同意图，采取他人视角、推断心理状态（见 SEP 词条“作为理论的民间心理学”），以及理解社会规范。按他的看法，这两步正对应人类演化中的两次转变：前者与其他灵长类共有，后者则为人类独有。
  - id: 16
    kind: body
    source: |-
      Below we review four cognitive capacities important for moral learning and describe a timeline for their emergence in human development:
    step1: |-
      下文我们回顾四种对道德学习重要的认知能力，并描述它们出现于人类发展的时间线：
    step2: |-
      下面看四种对道德学习要紧的认知能力，并给出它们在人类发展中出现的先后：
  - id: 17
    kind: body
    source: |-
      1. the capacity to understand that agents act *intentionally* with respect to their *goals*,
      2. the capacity to represent *social* or *interpersonal goals* including the goal of helping or harming another agent,
      3. the capacity to understand deontic *rules, social conventions, and norms*, and
      4. the capacity to view individual agents as members of social *groups* and to make inductive inferences about the properties of those groups, such as typical behaviors and attitudes of group members.
    step1: |-
      1. the capacity to understand that agents act *intentionally* with respect to their *goals*,
      2. the capacity to represent *social* or *interpersonal goals* including the goal of helping or harming another agent,
      3. the capacity to understand deontic *rules, social conventions, and norms*, and
      4. the capacity to view individual agents as members of social *groups* and to make inductive inferences about the properties of those groups, such as typical behaviors and attitudes of group members.
    step2: |-
      1. 理解行动者就其*目标*而*有意*行动的能力；
      2. 表征*社会*或*人际目标*——包括帮助或伤害另一行动者——的能力；
      3. 理解道义*规则、社会习俗与规范*的能力；
      4. 把个体行动者视为社会*群体*成员，并对群体属性（如成员的典型行为与态度）作出归纳推断的能力。
  - id: 18
    kind: body
    source: |-
      For each subsection, we briefly review what is known about the developmental emergence of these capacities based on existing empirical evidence. Section 1.2.5 briefly addresses how these cognitive capacities manifest in early social behaviors.
    step1: |-
      对每个小节，我们根据现有经验证据，简要回顾这些能力在发展中出现的情况。1.2.5 节简要讨论这些认知能力如何表现于早期社会行为。
    step2: |-
      每小节都依据现有实证证据，简述这些能力在发展中出现的情形；1.2.5 节再简短交代它们如何见于早期社会行为。
  - id: 19
    kind: body
    source: |-
      *Note on research methods in cognitive development*: Even with little or no verbal ability (prior to the age of 3 years) infants’ developing social cognition can be assessed based on observing behavior in experimentally controlled settings. The predominant empirical paradigms for exploring the social-cognitive capacities of preverbal infants involve using various measures of visual attention to measure stimulus discrimination in visual displays (e.g. preferential looking, looking time, habituation and dishabituation: see e.g. Oakes 2010)[^oakes-2010]. Researchers interpret these patterns of visual attention as signs that infants have *expectations* about what agents will do under the circumstances presented. Critically, however, visual attention can only be reliably used when infants can control their saccades and head movements, around 3 months of age (see Robertson et al. 2001)[^robertson-2001] which makes any claims about capacities prior to this age speculative. As infants begin to achieve motor milestones such as reaching for and manipulating objects, or crawling and walking towards objects or people, experimental paradigms begin to rely less on visual attention and more on overt behaviors and decisions. Importantly, some degree of motor skill is necessary for studying early prosocial or normatively guided behaviors such as helping others or complying with directives or rules (see below for examples).
    step1: |-
      *认知发展研究方法注记*：即便语言能力很少或没有（3 岁以前），婴儿发展中的社会认知也可通过观察实验控制情境下的行为来评估。探索前语言婴儿社会认知能力的主要实证范式，是采用各种视觉注意测量来测量视觉显示中的刺激辨别（如优先注视、注视时长、习惯化与去习惯化：见如 Oakes 2010）[^oakes-2010]。研究者把这些视觉注意模式解释为婴儿对行动者在所呈现情境中将做什么抱有*预期*的迹象。但关键在于，视觉注意只有在婴儿能控制眼跳与头部运动时（约 3 个月大）才可可靠使用（见 Robertson et al. 2001）[^robertson-2001]，因此关于该年龄之前能力的论断都是推测性的。随着婴儿达到伸手抓握、摆弄物体，或爬行、走向物体或人等运动里程碑，实验范式开始较少依赖视觉注意，更多依赖外显行为与决定。重要的是，研究早期亲社会或受规范引导的行为——如帮助他人、服从指令或规则——需要一定程度的运动技能（见下文的例子）。
    step2: |-
      *认知发展研究方法注记*：三岁前语言能力很弱甚至没有，婴儿发展中的社会认知仍可在受控实验里靠观察行为来评估。研究前语言期婴儿社会认知的主要范式，是用各种视觉注意指标测量其对视觉显示的辨别（优先注视、注视时长、习惯化与去习惯化等：见如 Oakes 2010）[^oakes-2010]。研究者把这些注意模式看作婴儿*预期*行动者在眼前情境中会做什么的迹象。关键限制是：视觉注意只有在婴儿能控制眼跳与头部运动之后（约三个月大）才可靠（见 Robertson et al. 2001）[^robertson-2001]，所以再往前的能力论断都带推测。等婴儿会伸手抓物、摆弄东西，会爬、会走，范式便少看眼睛、多看外显行为与选择。还有一点：要研究帮助他人、听从指令或规则这类早期亲社会行为、受规范引导的行为，总得有一定运动本领（例子见下文）。
  - id: 20
    kind: body
    source: |-
      #### 1.2.1 Intentional agents
    step1: TBD
    step2: TBD
  - id: 21
    kind: body
    source: |-
      The ability to understand intentions is an important prerequisite for intent-based moral judgment. The cognitive capacities that allow us to represent intentions and goals first emerge in infancy. Within the first six months of life infants reliably distinguish agents from inanimate objects based on perceptual cues (Rakison & Poulin-Doubois 2001)[^rakison-2001]. Shortly thereafter, infants make two further distinctions that are relevant for understanding intentional agency: The first is that infants expect the *causes* of animate motion – unlike the motion of inanimate objects – to be internal to an agent (in particular, the motions do not require being initiated from the outside, Premack 1990; Saxe, Tzelnic, & Carey 2007)[^premack-1990]. The second is that infants expect the *consequences* of agents’ actions – unlike the consequences of inanimate object motion – to be determined by an agents’ intentions and goals rather than by predictable physical laws such as force and direction (Woodward 1998; Gergely & Csibra 2003)[^gergely-2003][^woodward-1998]. By 9 to 10 months of age, infants interpret agents’ behaviors with respect to goals even when agents fail to achieve those goals, which gives further evidence of a focus on intent rather than outcomes when encoding human actions (Brandone & Wellman 2009)[^brandone-2009].
    step1: TBD
    step2: TBD
  - id: 22
    kind: body
    source: |-
      #### 1.2.2 Social goals
    step1: TBD
    step2: TBD
  - id: 23
    kind: body
    source: |-
      Understanding moral norms involves considering the positive (helpful) and negative (harmful) consequences of actions to others. Our moral judgments, in turn, often depend on evaluations of intentions to harm or help others. A seminal study by Hamlin et al. (2007) showed some capacity to represent social goals in pre-verbal infants 6 to 10 months of age. Hamlin and colleagues habituated infants to two displays – one agent (a circle shape with eyes) “helps” another agent achieve the goal of climbing a hill, and one agent who “hinders” the same agent in achieving the same goal (see also Kuhlmeier et al. 2003; Premack & Premack 1997)[^kuhlmeier-2003][^premack-1997]. Infants’ patterns of dishabituation suggest they encode pro- and anti-social intentions and use them to guide expectations: they expect the climber to approach the helper and avoid the hinderer. Infants’ own behavior (selective reaching to helpful, harmful, or neutral agents) suggests they approach helpers and actively avoid hinderers. Follow-up studies have found expectations about social goals, and resulting preferences for socially helpful over harmful individuals, using a variety of methods and at a range of ages within the first two years of life (for a review see Hamlin 2013)[^hamlin-2013].[^note-1]
    step1: TBD
    step2: TBD
  - id: 24
    kind: body
    source: |-
      Beyond studies of physical harm (and helpfulness), additional work shows that infants have expectations that agents should distribute resources equally (for example, splitting items of food or toys in half as they distribute between two people: see Sommerville 2018)[^sommerville-2018]. By 15 months, infants prefer agents who intend to help but accidentally harm due to holding a false belief over agents who intend to harm but accidentally help (Woo & Spelke 2023)[^woo-2023]. These results suggest that, by the second year of life, infants’ expectations about social goals – similar to expectations about object-directed goals – are tied to intentions of agents regardless of outcomes.
    step1: TBD
    step2: TBD
  - id: 25
    kind: body
    source: |-
      #### 1.2.3 Deontic Rules
    step1: TBD
    step2: TBD
  - id: 26
    kind: body
    source: |-
      By 3 years old, children show a striking facility with picking up deontic rules (see e.g., Cummins 1996; Harris & Núñez 1996)[^cummins-1996][^harris-1996]. In a representative task by Harris and Núñez, children were presented with a rule that was clearly arbitrary: “One day Carol wants to do some painting. Her Mum says if she does some painting she should put her helmet on” (1996, 1581). Children were shown four pictures: two pictures depicted Carol painting, one with and one without a helmet; in the other two pictures, Carol is not painting, but in one of these pictures she has a helmet on. Children were asked, “Show me the picture where Carol is being naughty and not doing what her Mum told her?” Despite the fact that the rule was unfamiliar and arbitrary, 3- and 4-year old children tend to get the right answer. They can also identify the relevant feature; when asked “What is Carol doing in that picture which is naughty?” (1581), children tend to invoke the helmet.
    step1: TBD
    step2: TBD
  - id: 27
    kind: body
    source: |-
      This facility with deontic rules is contrasted with the great difficulty posed by indicative conditionals. Harris & Núñez paired deontic conditional cases like the helmet case with parallel indicative conditional cases. In the indicative case for the helmet scenario, the experimenter says, “One day Carol wants to do some painting. Carol says that if she does some painting she always puts her helmet on” (1996, 1585). Subjects were shown the usual array of pictures and in the indicative case were asked, “Show me the picture where Carol is doing something different and not doing what she said” (1585). Both 3-year-olds and 4-year-olds did much worse with these kinds of questions than with the parallel deontic questions (see also Cummins 1996)[^cummins-1996]. Despite the close similarity between deontic and indicative conditionals, young children were much better at evaluating whether deontic conditionals were met than whether indicative conditionals were true.
    step1: TBD
    step2: TBD
  - id: 28
    kind: body
    source: |-
      Not only do 3-year-olds readily pick up on rules, but they also assume that rules and norms *ought* to be followed. This is seen in the increase around the third birthday in children’s motivation to follow all sorts of arbitrary actions demonstrated by adults, and their assumptions that such actions are social conventions or norms (see section 1.2.5 below). Most convincingly, 3-year-olds will act as norm *enforcers*, and will protest when others violate rules. This phenomenon of normative protest was first demonstrated by Rakoczy et al. (2008). In their study, 2- and 3-year-old children learned how to play a game with a simple rule. Children then saw a puppet state their intentions to play the game, but instead perform an action that violated the game rule. Three-year-olds protested the puppet’s action, often accompanying their protest with deontic language (“it doesn’t go like that”, “that’s not how we do it”). Two-year-olds sometimes protested, but without deontic language.
    step1: TBD
    step2: TBD
  - id: 29
    kind: body
    source: |-
      Three-year-olds’ normative understanding, as measured by protest behaviors, integrates consideration of circumstances in which others might *not* have to follow rules. For example, children do not protest if the agent states that they are choosing to opt out of the game (Racoczy et al. 2008), or if the agent is unable to follow the norm due to a physical constraint (Josephs et al. 2016)[^josephs-2016]. If the agent is a member of a different social group (out-group), children protest the agent’s violations of moral norms (harmful actions) but not conventional norms (game rules) (Schmidt et al. 2011)[^schmidt-2011].
    step1: TBD
    step2: TBD
  - id: 30
    kind: body
    source: |-
      #### 1.2.4 Social Groups
    step1: TBD
    step2: TBD
  - id: 31
    kind: body
    source: |-
      Social groups share systems of norms, practices, beliefs, and attitudes that help regulate cooperation among group members (Chudek & Henrich 2011; Tomasello 2019)[^chudek-2011][^tomasello-2019]. The understanding of social groups, and a sense of one’s own group identity or belonging to a group, have been theorized to serve as a motivation for individuals to conform with social and moral norms (see SEP entry “Social Norms”). As a potential starting state for social group cognition, infants have been shown to demonstrate homophily – a tendency to prefer similar others – based on exposure to and familiarity with facial features or languages (Kelly et al. 2005; Bar Haim et al. 2006; Kinzler et al. 2007)[^kelly-2005][^kinzler-2007]. Infants also have expectations of homophily in other agents: they expect, for example, for agents who are similar to each other to like each other, to share food preferences, and to act in similar ways (Liberman et al. 2021)[^liberman-2021]. Homophily has early implications for social learning. Infants prefer to eat new foods when those foods are eaten by someone who speaks the same language (Shutts et al. 2009)[^shutts-2009]; infants also preferentially imitate members of their social group (Over & Carpenter 2012)[^over-2012].
    step1: TBD
    step2: TBD
  - id: 32
    kind: body
    source: |-
      As further evidence that social group cognitions emerge early, identification with social “ingroups” – and deidentification with social “outgroups” – can be induced in preschool age children using experimental “minimal groups” paradigms in the lab (Dunham et al. 2011)[^dunham-2011]. Moreover, even minimal group affiliations can lead children to view their own group members as having more positive characteristics, as more trustworthy, and as more deserving of fair and moral treatment than outgroups (McAuliffe & Dunham 2016)[^mcauliffe-2016].
    step1: TBD
    step2: TBD
  - id: 33
    kind: body
    source: |-
      Preschoolers show an early tendency to link social group affiliation to normative and moral behavior. Roberts and colleagues (2017) taught preschoolers about two novel social groups (a group of “Hibbles” and a group of “Glerks”) and described the behavior of one of the groups in generic terms (e.g. “Hibbles eat yellow berries”). Children as young as 4 took these descriptions of the behavior as suggestive of prescriptive norms that distinguished the groups from each other and evaluated non-conforming group members negatively (e.g. Hibbles *should* eat yellow berries). Social group information also influences preschoolers’ moral judgments. Rhodes & Chalik (2013) introduced 3- to 9-year-olds to two novel categories (“Flurps” and “Zazzes”). Children as young as 3 years old judged harm to be impermissible independent of any extrinsic rules *only* when the harm was inflicted by one group member on another. The authors suggest “social categories as marking patterns of intrinsic interpersonal obligations” (2013, 1003) that extend beyond conventions and rules.
    step1: TBD
    step2: TBD
  - id: 34
    kind: body
    source: |-
      #### 1.2.5 Early social (moral) behavior
    step1: TBD
    step2: TBD
  - id: 35
    kind: body
    source: |-
      The previous sections review the ways in which infants interpret their social world from the beginning of life, setting the stage for moral learning that is based on observations of others’ behavior. But infants also learn by doing; they act and make decisions. Their decisions can result from observations of others (imitation), can be motivated by their nascent conceptions of what is helpful or fair (prosocial motives), and/or can be motivated by what they think one ought to do (normative motives). Moral agency and moral learning are in a cycle of feedback: young moral learners’ actions and decisions result from their current state of moral knowledge and self-regulatory skill. In turn, their actions are subject to corrective feedback and guidance from their moral teachers (peers, older peers, adults), resulting in further learning.
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      The earliest prosocial behaviors emerge in concert with emotional and cognitive developments discussed above. Notably, the capacity to understand intentions combines with empathic concern to inform early prosocial behavior, especially helping, comforting, and sharing (Paulus 2014)[^paulus-2014]. For example, toddlers will go out of their way to remove obstacles or obtain out-of-reach objects if such actions help another person accomplish their goals (Dunfield et al. 2011; Warneken & Tomasello 2006; Svetlova et al. 2010)[^dunfield-2011][^svetlova-2010][^warneken-2006]. The understandings of fairness (equitable resource allocation) which emerge in the second year of life correlate with infants’ own sharing behavior: infants who themselves share expect others to share. These and other examples suggest early ties between moral cognition and prosocial action.
    step1: TBD
    step2: TBD
  - id: 37
    kind: body
    source: |-
      Understanding intentional agency also allows for social learning through imitation. Infants in the second year of life are motivated to imitate what they perceive to be the intentions of a demonstrator, rather than an exact copy of their body movements (Melzoff 1995; Carpenter et al. 1998)[^carpenter-1998], and they imitate what they infer to be a demonstrator’s goal even if the attempt is unsuccessful (Melzoff 1995; Gergeley et al. 2002).
    step1: TBD
    step2: TBD
  - id: 38
    kind: body
    source: |-
      Importantly for moral learning, by age 3 children assume that adults have *pedagogical goals* when they act intentionally (Bonawitz et al. 2011)[^bonawitz-2011]. The result is the phenomenon of “overimitation” – or a tendency to imitate arbitrary sequences of actions that have no instrumental value (Lyons et al. 2007)[^lyons-2007]. Studies have shown that by 3 years of age children infer that adults who intentionally perform instrumentally irrelevant actions are in fact intending to teach something socially relevant, and thus children will imitate these actions as a form of norm learning (Kenward et al. 2011)[^kenward-2011].
    step1: TBD
    step2: TBD
  - id: 39
    kind: body
    source: |-
      ## 2. Testimonial learning
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      In addition to the basic emotional and cognitive precursors mentioned above, children have an ability to learn from others via testimony, which might be defined as language-based assertions that listeners treat as reliable sources of evidence in themselves (see SEP entry “Epistemology of Testimony” for details and controversies). This includes spoken and written statements, and statements that result from first-hand experience, second-hand hearsay, relevant expertise, or personal reflection. A large body of work in developmental psychology (e.g. Koenig et al. 2022; Koenig & Harris 2005; Harris 2012; Mills 2013)[^harris-2012][^koenig-2005][^koenig-2022][^mills-2013] shows that testimony is an important mechanism of knowledge acquisition from the time children begin to understand and use language themselves. This body of work shows that children are *selective* in who they trust and in which testimony they consider reliable. Sometimes, children evaluate testimony by checking it against their own prior knowledge (Sobel & Kushnir 2013)[^sobel-2013]. Other times, children trust testimony for interpersonal rather than epistemic reasons – selectively learning from others based on a speaker’s familiarity, cultural similarity, or non-verbal cues such as confidence (Mills 2013)[^mills-2013]. Regardless of reasons to trust, children treat testimony as a fundamental source of knowledge, with its own status rivalling first-hand experience (Harris et al. 2018)[^harris-2018].
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      How does testimony influence moral learning? Hills (2020) distinguishes between two types of moral testimony. The first is “transmission” of moral assertions that a speaker directs at a listener (e.g. “X is wrong”). The second is what Hills refers to as “propagation” in which a speaker gives reasons or rationales for a listener to consider in coming to their own moral evaluations (e.g. “X can be harmful to others”). According to Hills, transmission is epistemically problematic, even if one happens to be learning from a moral expert, as it can result in second-hand moral *knowledge* but not any deeper form of moral *understanding* or cultivation of moral *virtue*. Propagation is less problematic, at least for mature moral agents who are expected to come to their own conclusions, understandings, and evaluations.
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      What about young moral learners? Li & Koenig (2023) argue that transmission may be less epistemically problematic for children, and suggest that direct statements are useful for providing a basis of moral principles or norms to consider in the first place. This claim is supported by work showing that children do in fact learn from direct moral statements. For example, Li et al. (2019) showed 3- to 5-year-old children an unspecified action that caused a child to cry. Most children initially judged this action wrong. But then children were provided with testimony from adults that the actions were, in fact “OK”. Many (but not all) children revised their initial belief, and younger children did so more than older children. This suggests that direct statements of wrongness by adults, even when counterintuitive, exert influence on children’s moral judgments, especially when they are young.
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      Propagation of various sorts – reasons, arguments, discussions – also influences young learners, and, as children get older, appeals to appropriate moral reasons become more effective than direct statements of wrongness (see Tomasello 2018b)[^tomasello-2018b]. For example, Rottman et al. (2017) presented 7-year-old children with a fictional group of “aliens” who engaged in a neutral action with no obvious harmful consequences (e.g. “putting cotton balls in the forest”), and provided testimony with either emotional condemnation (“when they do X it is disgusting”) or harm-based reasons (“when they do X it can be harmful to others”). Both types of testimony, neither of which was a direct statement of wrongness, led 7-year-olds to form moral judgments of the neutral action. Moreover, their judgments were stronger and longer lasting when testimony appealed to harm-based reasons rather than emotions.
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      Another form of testimonial propagation emerges in peer-to-peer disagreements (Tomasello 2018b)[^tomasello-2018b]. From at least age 5, children actively defend moral points of view in discussions with peers and are more receptive to considering alternative perspectives on complex moral issues; this is more pronounced when engaging in discussions with peers rather than parents or other authority figures (Mammen et al. 2019)[^mammen-2019]. These findings strengthen the idea that moral learning through testimony is selective and dependent on the interpersonal characteristics of the interlocutor – parents are treated as moral “experts”, more so than peers, thus each potentially plays a unique role in moral learning.
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      ## 3. Characteristics of moral cognition
    step1: TBD
    step2: TBD
