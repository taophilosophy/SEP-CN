      依这些观点，吸毒——哪怕用量可观——都是自由、理性且在完全控制之下作出的选择。我们也许在道德上不赞成这些人所做的选择，也许并不了解他们想达成的某些工具性目标；但他们选择得理性，控制也未受损。
