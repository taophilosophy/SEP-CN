      But many of our actions, in fact most, do not arise from deliberation; they arise spontaneously and unreflectively. A number of authors, including George Sher, Tim Scanlon, Angela Smith, and Santiago Amaya have pointed out that we can be morally responsible for various kinds of spontaneous conduct, including how we direct attention, what we notice and fail to notice, what we remember and forget, what we dwell on or ignore, our spur-of-the-moment actions (e.g., blurting something out), our momentary slips or lapses, our unwitting omissions, and so forth (Sher 2006, 2009; Scanlon 1998; A. Smith 2005, 2008; Amaya 2013; Amaya & Doris 2015; Nelkin & Rickless 2017)[^amaya-2013][^amaya-2015][^nelkin-2017][^scanlon-1998][^sher-2006][^smith-2005].
    step1: |-
      但我们的许多行动、事实上是大多数行动，并非出自慎思；它们自发地、不加反思地产生。若干作者——包括 George Sher、Tim Scanlon、Angela Smith 与 Santiago Amaya——指出，我们可以对各种自发行为负有道德责任，包括我们如何引导注意力、我们注意到什么与未注意到什么、我们记得什么与忘记什么、我们咀嚼或忽略什么、我们一时冲动的行动（例如脱口而出）、我们瞬间的失手或失误、我们不知不觉的遗漏，等等 (Sher 2006, 2009; Scanlon 1998; A. Smith 2005, 2008; Amaya 2013; Amaya & Doris 2015; Nelkin & Rickless 2017)[^amaya-2013][^amaya-2015][^nelkin-2017][^scanlon-1998][^sher-2006][^smith-2005]。
    step2: |-
      可我们的许多行动——其实是大多数——并不出自慎思，而是自发地、不加反思地发生。George Sher、Tim Scanlon、Angela Smith、Santiago Amaya 等一批作者都指出：我们可以对形形色色的自发行为负责，比如注意力如何引导、我们注意到什么又漏掉什么、记得什么又忘掉什么、反复琢磨什么又置之不理、一时冲动的举动（例如脱口而出）、瞬间的失手或疏忽、不自觉的遗漏，等等 (Sher 2006, 2009; Scanlon 1998; A. Smith 2005, 2008; Amaya 2013; Amaya & Doris 2015; Nelkin & Rickless 2017)[^amaya-2013][^amaya-2015][^nelkin-2017][^scanlon-1998][^sher-2006][^smith-2005]。
