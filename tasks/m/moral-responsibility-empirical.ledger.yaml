      There are, however, some serious problems with these “purposive choice” views. A typical pattern in addiction is that the person attempts to cut back or quit and has some temporary success (i.e., often days to weeks), but eventually resumes regular patterns of use, with this cycle typically repeating multiple times (Dennis et al. 2007; Hunt et al. 1971; Kirshenbaum et al. 2009; McLellan et al. 2000)[^dennis-2007][^hunt-1971][^kirshenbaum-2009][^mclellan-2000]. Also, in order to maintain sobriety, people with addiction frequently undertake interventions that are costly in terms of time, money, and other burdens and risks. For example, they join therapeutic communities (requiring meetings multiple times a week), attend counseling sessions, and undertake onerous drug treatments that require close clinical supervision. These observations seem inconsistent with the claim that drug use is chosen freely, purposively, and with full control.
    step1: |-
      然而，这些“目的性选择”观点存在一些严重问题。成瘾中的一个典型模式是：人尝试减量或戒除并取得暂时的成功（即往往数日到数周），但最终恢复规律的吸毒模式，这一循环通常重复多次 (Dennis et al. 2007; Hunt et al. 1971; Kirshenbaum et al. 2009; McLellan et al. 2000)[^dennis-2007][^hunt-1971][^kirshenbaum-2009][^mclellan-2000]。此外，为维持清醒，成瘾者经常采取在时间、金钱及其他负担与风险上代价高昂的干预。例如，他们加入治疗性社区（要求每周多次会面）、参加咨询、接受需要密切临床监督的繁重药物治疗。这些观察似乎与“吸毒是自由地、有目的地、在完全控制之下被选择的”这一主张不一致。
    step2: |-
      然而，这些“目的性选择”论有几处严重麻烦。成瘾的典型模式是：当事人尝试减量或戒断，暂时奏效（常为数日至数周），最终又恢复规律吸毒，如此循环往复多次 (Dennis et al. 2007; Hunt et al. 1971; Kirshenbaum et al. 2009; McLellan et al. 2000)[^dennis-2007][^hunt-1971][^kirshenbaum-2009][^mclellan-2000]。而且，为了维持清醒，成瘾者常常采取在时间、金钱以及其他负担与风险上代价高昂的干预：加入治疗性社区（每周要聚会多次）、接受咨询、进行需要严密临床监护的繁重药物治疗。这些观察，似乎与“吸毒是自由、有目的、在完全控制下作出的选择”一说难以相容。
