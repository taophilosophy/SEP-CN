      A key empirical assumption in Levy’s account is that taking on the beliefs of those around you is done solely, or even mostly, for epistemic reasons. But there is considerable evidence that people often adopt views, especially counternormative ones, that serve as “cultural badges” that identify the members of a moral, political, or ideological community and demarcate the community’s boundaries (Boyd & Richerson 1987; McElreath et al. 2003)[^boyd-1987][^mcelreath-2003]. These views are held on to tenaciously in the face of strong and persistent counterevidence because the epistemic costs are more than made up by personal, prudential gains. Membership in the group is valuable and deviations from orthodoxy are punished so the person has strong social incentives to endorse whatever is the “tribal” creed (Williams 2023, 2021; Kahan 2017; Funkhouser 2022)[^funkhouser-2022][^williams-2023].
    step1: |-
      Levy 说明中的一个关键经验假定是：采纳周围人的信念，完全或甚至主要出于认知理由。但有可观证据表明，人们常常采纳某些观点——尤其是反规范的观点——是因为它们充当“文化徽章”，标识某个道德、政治或意识形态共同体的成员身份，并划出该共同体的边界 (Boyd & Richerson 1987; McElreath et al. 2003)[^boyd-1987][^mcelreath-2003]。这类观点面对强有力且持续的反证仍被牢牢坚持，因为认知上的代价远被个人与审慎的收益抵消。群体成员身份很有价值，背离正统会受惩罚，因此个人有强烈的社会激励去认可无论何种“部落”信条 (Williams 2023, 2021; Kahan 2017; Funkhouser 2022)[^funkhouser-2022][^williams-2023]。
    step2: |-
      Levy 说明中有一个关键的经验假定：人们采纳周围人的信念，纯粹——甚至主要——是出于认知理由。但相当多的证据显示，人们常常采纳某些观点（尤其是违背常规的观点），是因为它们充当“文化徽章”，标示一个人属于某个道德、政治或意识形态共同体，并划出该共同体的边界 (Boyd & Richerson 1987; McElreath et al. 2003)[^boyd-1987][^mcelreath-2003]。这类观点面对强劲而持续的反证仍被死死抱住，因为认知上的代价远被个人的审慎收益所抵消：群体成员身份有价值，背离正统要受罚，于是个人有强烈的社会激励去拥护无论何种“部落”信条 (Williams 2023, 2021; Kahan 2017; Funkhouser 2022)[^funkhouser-2022][^williams-2023]。
