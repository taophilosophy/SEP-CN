      There is, in addition, an empirical problem for this “hard to resist” view under consideration. A number of studies have asked people to rate the strength of their drug-directed desires. These studies typically find that these desires are rated fairly moderately; notably, people almost never rate them using whatever is the highest rating the survey allows (Hofmann, Baumeister, et al. 2012; Hofmann, Vohs, et al. 2012; Preston et al. 2009)[^preston-2009].
    step1: |-
      此外，还有针对正在讨论的这种“难以抗拒”观点的经验问题。若干研究请人们评定其毒品导向欲望的强度。这些研究通常发现，这类欲望被评为相当中等；值得注意的是，人们几乎从不使用调查所允许的最高评分来评定它们 (Hofmann, Baumeister, et al. 2012; Hofmann, Vohs, et al. 2012; Preston et al. 2009)[^preston-2009]。
    step2: |-
      此外，眼下这种“难以抗拒”论还面临一个经验难题。多项研究请被试评定自身毒品导向欲望的强度，结果通常显示这些欲望只被评为中等；值得注意的是，人们几乎从不给出问卷所允许的最高分 (Hofmann, Baumeister, et al. 2012; Hofmann, Vohs, et al. 2012; Preston et al. 2009)[^preston-2009]。
