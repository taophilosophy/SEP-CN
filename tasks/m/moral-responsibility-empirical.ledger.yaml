      As Randy is about to leave his home for the office, Al calls to tell him that they are out of bourbon. His regular route to the office takes him right by a liquor store, and Randy tells Al he’ll buy some. Between his home and the liquor store, Randy starts thinking about a paper he is writing on omissions. He continues thinking about his work until he arrives at the department, where he realizes that he has forgotten the bourbon. (Murray & Vargas 2020, p. 826)[^murray-2020]
