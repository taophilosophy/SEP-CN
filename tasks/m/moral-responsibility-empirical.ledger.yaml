    source: |-
      The Atari-playing artificial agent has just a single goal that it reaches fairly quickly: win the Atari game. Humans have a much richer, interlocking set of things that they care about—health, success, relationships, cultivating one’s talents, and so forth (Jaworska 2007; Shoemaker 2003)[^jaworska-2007][^shoemaker-2003]. These things can typically be accomplished only through endeavors and projects that unfold over years and even decades. Moral responsibility, one might argue, requires an agent with a rich and complex evaluative point of view and capacities for long-term planning agency (Bratman 2000)[^bratman-2000] to bring about those things the agent cares about.
    step1: |-
      玩 Atari 的人工行动者只有一个目标，且很快达成：赢下游戏。人类所关心的事情要丰富得多、并相互交织——健康、成功、人际关系、培养自身才能，等等 (Jaworska 2007; Shoemaker 2003)[^jaworska-2007][^shoemaker-2003]。这些事情通常只能通过历经数年乃至数十年展开的努力与项目来实现。有人可能论证说，道德责任要求行动者具有丰富而复杂的评价性观点，以及长期计划性能动性的能力 (Bratman 2000)[^bratman-2000]，以促成行动者所关心之事。
    step2: |-
      玩 Atari 的人工行动者只有一个目标，而且很快就能达成：赢下这局游戏。人类所关心的东西却丰富得多、彼此交织——健康、成就、人际关系、培养自己的才能，等等 (Jaworska 2007; Shoemaker 2003)[^jaworska-2007][^shoemaker-2003]；这些多半只能靠历经数年乃至数十年展开的努力与项目来成就。因此有人会主张：道德责任要求行动者具备丰富而复杂的评价性观点，以及长期计划性能动性的能力 (Bratman 2000)[^bratman-2000]，方能促成其所关心之事。
