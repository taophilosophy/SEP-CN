      This entry examines four areas in which empirical insights have been fruitful aids in constructing and applying theories of moral responsibility. The focus is on work in empirical fields examining the mechanisms of agency, especially psychology, neuroscience, computational cognitive science, and artificial intelligence.
    step1: |-
      本词条考察经验洞见在构建与运用道德责任理论中成果丰硕的四个领域。焦点在于经验领域中对能动性机制的研究，尤其是心理学、神经科学、计算认知科学与人工智能。
    step2: |-
      本词条考察四个领域，经验洞见在其中为道德责任理论的构建与运用提供了有力帮助；重点放在研究能动性机制的经验学科，尤其是心理学、神经科学、计算认知科学与人工智能。
  - id: 7
    kind: body
    source: |-
      Of note, this entry does not take up findings from experimental philosophy, understood as the study of folk judgments about philosophically relevant cases (Mallon 2016)[^mallon-2016]. Experimental philosophy understood this way is about ordinary attributions of moral responsibility, especially ordinary intuitive judgments. The focus of this entry is, instead, on actual mechanisms of mind and agency, as revealed by empirical sciences, that have relevance for constructing and applying theories of moral responsibility.
    step1: |-
      值得注意的是，本词条不讨论实验哲学的发现，这里把实验哲学理解为对与哲学相关情形的大众判断的研究 (Mallon 2016)[^mallon-2016]。如此理解的实验哲学关涉的是道德责任的日常归赋，尤其是日常直觉判断。相反，本词条的焦点是由经验科学揭示的心灵与能动性的实际机制，这些机制与道德责任理论的构建和运用相关。
    step2: |-
      需要说明，本词条不涉及实验哲学的发现——这里把实验哲学理解为对哲学相关情形中大众判断的研究 (Mallon 2016)[^mallon-2016]。这种意义上的实验哲学关心的是道德责任的日常归赋，尤其是日常直觉判断；本词条则转而关注经验科学所揭示的心灵与能动性的实际机制，这些机制同道德责任理论的构建与运用相关。
