      ### 2.2 Opening Up the Black Box
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      A first step is to map the language of the *Bourbon* case into more precise, empirically tractable constructs. We are told that Randy “starts thinking” about omissions during the trip. This in turn might plausibly be understood in terms of the allocation of attention: Randy attends to an internally generated stream of thought that pertains to omissions rather than other things that he could be attending to, such as thoughts about getting the bourbon. His allocation of attention to omissions is harmless until he is near the store. Unfortunately, he continues to allocate attention to omissions rather than the goal of getting bourbon, and so he passes by the store and arrives to his destination empty handed.
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      Having reconstructed the *Bourbon* case in terms of attention allocation, we can next turn to the substantial body of empirical work that illuminates how attention allocation works. Much of this work specifically studies allocation of visual attention to spatially arrayed external targets. Nonetheless, it is widely thought that allocation of attention to candidate internal targets—for example, thoughts or memory items—follows similar principles (Chun et al. 2011; Kiyonaga & Egner 2013)[^chun-2011][^kiyonaga-2013].
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      According to a leading model, choices to allocate attention to candidate targets arise from integrated priority maps (Fecteau & Munoz 2006; Zelinsky & Bisley 2015; Theeuwes et al. 2022)[^fecteau-2006][^theeuwes-2022][^zelinsky-2015]. These are maps that assign to each candidate attentional target a scalar score that represents the expected value of attending to that target. On the basis of these priority maps, the person chooses to attend to the target with highest value. Of course, due to the selectivity of attention, this implies the person is not attending (or perhaps not attending sufficiently) to the other candidate targets of attention.
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      The priority map model of attention allocation fits nicely with a much broader picture of the etiology of spontaneous conduct that has emerged in computational cognitive science (Rangel et al. 2008; Rangel & Hare 2010; Busemeyer & Townsend 1993; Carruthers 2018; Railton 2017a; Haas 2022, forthcoming; Sripada, 2025)[^busemeyer-1993][^carruthers-2018][^haas-2022][^railton-2017a][^rangel-2008][^rangel-2010]. According to this model, the mind houses an extensive set of algorithms for the ongoing calculation of the expected value of one’s actional options, where the value at issue is instrumental value relative to a person’s more basic aims, goals, and priorities. On this picture, one’s spontaneous conduct, which can sometimes feel reflexive or automatic, is actually the product of rapid decisions made on the basis of representations of the expected value of the options.
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      We can distinguish two kinds of processes operative in the priority map model of attention allocation. First, there is a set of processes that leads to the construction of priority maps. These are *subpersonal* processes that integrate a number of cues into an overall expected value representation that attaches to each attentional target (Anderson & Kim 2018; Failing & Theeuwes 2018)[^anderson-2018][^failing-2018]. Second, there is a set of rapid decision processes that translate priority map value representations into actual choices about the target to which attention is in fact allocated (Forstmann et al. 2016; Ratcliff & McKoon 2007)[^forstmann-2016][^ratcliff-2007]. Importantly, the rapid decisions implemented by this second set of processes are *person-level* events. This accords well with first person phenomenology. Allocations of attention aren’t simply happenings within one’s psychology; they are something that the *person* does (Watzl 2017; Wu 2023)[^watzl-2017].
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      Adopting this overall priority map model, we get the following detailed account of what unfolds in the *Bourbon* case. At the start of the trip, Randy allocates attention to omission thoughts. He does so based on an attentional priority map that assigns omission thoughts a higher value than alternatives including bourbon thoughts. This makes sense—Randy is highly interested in omissions, so it is natural that his attentional priority map would reflect this. As he passes the store, however, there appears to be a missed opportunity: the subpersonal processes that construct and update priority maps could have been sensitive to his current store-adjacent location and shifted the priority map to place higher value on bourbon thoughts rather than omission thoughts. But this shift did not occur—his priority map continued to place higher value on omission thoughts rather than bourbon thoughts, and thus Randy continued to choose to attend to omission thoughts. And due to the limited capacity of attention, in attending to omission thoughts, he was not attending to bourbon thoughts—that is, he forgot about the bourbon.
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      ### 2.3 How Findings from Cognitive Science Inform Assessments of Moral Responsibility
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      With these empirical details filled in, what then about moral responsibility?
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      One approach holds that the kinds of mechanisms that underwrite attention allocation in our empirically-detailed reconstruction of the *Bourbon* case do in fact confer the kind of *control* that is required for moral responsibility. This is broadly the tack taken by Murray and Vargas (2020). A hallmark of mechanisms that confer control is that they are reasons-responsive—they flexibly issue in different responses when there are sufficient reasons to do so (Vargas 2013; Fischer & Ravizza 1998; Dennett 1984; Shepherd 2014)[^dennett-1984][^fischer-1998][^shepherd-2014][^vargas-2013]. The priority map-based mechanisms that underpin attention allocation appear to be reasons-responsive in just this way—a suite of learning algorithms and other mechanisms help to make sure priority maps track the things that promote one’s aims and priorities (Haas 2022; Railton 2017a)[^haas-2022][^railton-2017a]. On this approach[^note-1], since Randy satisfies the conditions for control, he is morally responsible for forgetting the bourbon, vindicating ordinary opinion.
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      Another position focuses on the *epistemic* condition for moral responsibility. Recall that priority maps are generated by subpersonal algorithms that are sensitive to the agent’s more basic aims and interests. Now, these algorithms work well most of the time, but they aren’t perfect. Like everything else in our psychology, they are only boundedly rational (Simon 1990; Lewis et al. 2014; Lieder & Griffiths 2020)[^lewis-2014][^lieder-2020][^simon-1990], and thus, inevitably, there will be many situations in which priority maps associated with candidate attentional targets are inaccurate. That is, there are many situations in which these maps will ascribe higher value to some candidate attentional target *A* rather than some target *B*, when, in fact, the actual value, relative to the agent’s own aims and priorities, favors *B* over *A*.
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      Suppose that, at the point when he is near the store, Randy’s priority map is in fact inaccurate. That is, the map assigns higher value to omission thoughts rather than bourbon thoughts when in fact the reverse should be the case, given Randy’s own more basic aims and priorities. If Randy allocates his attention on the basis of an inaccurate priority map and this is why he forgets to bring the bourbon, then he may have done what he did under ignorance. That is, he may fail the epistemic condition for moral responsibility, and thus he would not be morally responsible for his conduct (assuming, that is, that his ignorance is itself non-culpable—see the following section). This position revises folk opinion in the *Bourbon* case, identifying a potential excusing condition, i.e., ignorance, that might have otherwise gone unnoticed or been unappreciated.[^note-2]
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      Stepping back a bit, the larger point is that we appear to have made some progress. At the start, it was noted that most theorists treat the mechanisms that produce spontaneous conduct in cases like *Bourbon* as a black box. By consulting the empirical literature, we have been able to offer up one version of what happens in the case with the box meaningfully filled in. We can next ask, given this picture of the mechanisms that operate to produce the relevant instance of spontaneous conduct, whether the control condition is satisfied, whether the epistemic condition is satisfied, and so on for other conditions relevant for moral responsibility. Empirical considerations have not settled the question of whether and why agents are morally responsible for spontaneous conduct. But they have brought to bear additional resources that clarify the debate and move it forward.
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      ## 3. Moral Responsibility and the Etiology of Ignorance
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      ### 3.1 The Epistemic Condition and Culpable Ignorance
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      When assessing the epistemic condition for moral responsibility, most theorists agree that it is not enough to check whether the agent acts under ignorance. We must further assess whether the agent is culpable for bringing about their ignorance—whether they did something that led to their own “benighting” (H. Smith 1983; Zimmerman 1997; Rosen 2004; Wieland & Robichaud 2017)[^rosen-2004][^smith-1983][^wieland-2017][^zimmerman-1997].
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      Consider the case of a doctor who infuses the wrong type of blood into a patient who then has a severe reaction (the case is loosely drawn from Rosen 2004)[^rosen-2004]. The doctor does this out of ignorance; she thinks the patient has one blood type when in fact the patient has an incompatible one. She has this mistaken impression, however, because she does not doublecheck the chart, something all doctors are supposed to do. She does not doublecheck because she is in a rush to get to her tee time at a golf club, the most exclusive in the city, and chooses to skip portions of the usual protocol. Here, her ignorance plausibly does not excuse moral responsibility as she is culpable for bringing it about.
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      Now consider a second case in which the doctor *does* doublecheck the chart. The chart itself is wrong because of a rare mistake—the laboratory procedure that establishes a patient’s blood type is nearly always accurate, but in this particular case, the procedure has assigned the wrong blood type. The doctor acts under ignorance, but she is plausibly excused from moral responsibility because her ignorance itself arises non-culpably.
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      In the preceding examples, we were able to stipulate key features of how the respective agents come to falsely believe certain things. In many interesting real-world cases, we cannot rely on stipulation. We must go out and investigate the pathways by which the agent came to be ignorant. Armed with this etiological information, we can make better assessments of whether the agent’s ignorance is culpable or non-culpable and thus whether they might receive an excuse from moral responsibility.
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      One place where this kind of empirical etiological inquiry is important is in assessing the role of culture and socialization in creating impediments to knowledge, especially moral knowledge, impediments that bear on questions of moral responsibility (Wolf 2012)[^wolf-2012].
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      One note before proceeding. Our focus in what follows is on empirical questions about how certain forms of ignorance, especially moral ignorance, arise. In putting the focus here, we are passing over important conceptual questions that remain unsettled about such things as whether moral ignorance excuses at all (we are assuming, in agreement with the weight of philosophical opinion, that it does), and if so, precisely which forms of moral ignorance are excusing. Weatherson 2019, Chapter 5 provides a helpful overview of the literature on these questions.
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      ### 3.1 Culture and Moral Ignorance
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      Michael Slote observes that though slavery is viewed as morally repugnant today, it was widespread in the ancient world (Slote 1982)[^slote-1982]. So, can we blame Greek slave owners for their wrongdoing or their acts of vice? Slote thinks we cannot, because Greek slave owners were simply unable to see what virtue required regarding slavery. The reason, he believes, is that slavery was too much of a *universal* phenomenon, constraining people’s ability to conceive of alternatives. He writes:
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      Just as the alternative terms used by other languages can seem to make linguistic conventions seem like inevitable facts of nature, so too ignorance of alternatives to a given social arrangement can instill the belief that the arrangement is natural and inevitable and thus beyond the possibility of radical criticism. So, if the ancients were unable to see what virtue required in regard to slavery, that … requires some explanation by social and historical forces, by cultural limitations if you will. (Slote 1982, p. 72)[^slote-1982]
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      Michelle Moody-Adams agrees with Slote that whether culturally acquired beliefs defeat moral responsibility depends importantly on the empirical details of how they were acquired and sustained (Moody-Adams 1994)[^moody-adams-1994]. But she disagrees with Slote’s particular etiological story: “I challenge the empirical credentials of those views which attempt to exempt historical agents from responsibility on the grounds that they suffer from some presumed culturally generated inability to avoid wrongdoing” (Moody-Adams 1994, p. 293)[^moody-adams-1994].
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      According to Moody-Adams, a better explanation of culturally sanctioned immoral practices and institutions is that individuals choose to participate in these practices and perpetuate them.
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      Our failure to see this as the correct etiological story owes to underappreciation of two facts about human psychology that are, according to Moody-Adams, well attested to in anthropology, social psychology, and case reports. The first fact is the “banality of evil,” the observation that ordinary humans are regularly and routinely able to inflict great cruelty on their fellows if there are incentives to do so. Moody-Adams cites Stanley Milgram’s famous experiments on obedience (Milgram 1965)[^milgram-1965], among other empirical data, in support. The second fact is our proclivity towards “affected ignorance,” in which individuals engage in subtle forms of self-deception and motivated evidence seeking. Slavery was maintained as an institution, Moody-Adams surmises, because people made choices that were in part cruel and in part affectedly ignorant. See also Calhoun 1989 and Mills 2007, for influential related arguments.
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      ### 3.2 Social Networks and “Bad Beliefs”
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      Neil Levy offers a contrasting perspective in investigating a related phenomenon, the acquisition of “bad beliefs” among members of certain political or ideological subcultures, for example, communities of climate change deniers, vaccination skeptics, or supporters of demagogic political figures (Levy 2021)[^levy-2021].
    step1: TBD
    step2: TBD
  - id: 73
    kind: body
    source: |-
      Levy’s argument relies heavily on the ideas of bounded rationality and epistemic deference. He notes that the evidence that bears on most complex scientific matters (climate, evolution) is so extensive and abstruse, it is simply not feasible or rationally advisable for ordinary people to evaluate all this evidence for themselves. Drawing on the work of quantitative biologists and social scientists working in the “dual-inheritance” framework (Boyd & Richerson 1988; Henrich 2016)[^boyd-1988][^henrich-2016], Levy argues that people instead make heavy use of the strategy of deferring to the beliefs that prevail in their community. This strategy works because there are a number of features of human belief networks that jointly make it the case that the fact that others around you believe that *p* is in fact, on average, evidence for *p*. Levy argues that from these observations, it follows that those who hold beliefs that run counter to scientific consensuses are very often just engaging in rational deference—the problem is not in the way they form their beliefs but in the epistemic environment in which they are formed. See also Rini 2017, O’Connor & Weatherall 2019, Nguyen 2020, Dorst 2023, for importantly different arguments that reach similar conclusions.
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      A striking aspect of Levy’s picture is that those who hold “good” beliefs that are in line with the scientific consensus and those who hold “bad” beliefs that deviate from this consensus typically don’t differ much in terms of their respective methods of belief formation. The former just happen to be in a less favorable epistemic environment than the latter (see Worsnip 2022, for a helpful discussion of this point)[^worsnip-2022]. Levy’s picture furthermore suggests that the ignorance of those who hold bad beliefs is often non-culpable. A parent who fails to vaccinate their child may not be morally responsible for the damage inflicted because they may be non-culpably ignorant of the balance of risks and benefits. The fault lies not with them but with the unlucky fact that their epistemic environment is polluted.
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      A key empirical assumption in Levy’s account is that taking on the beliefs of those around you is done solely, or even mostly, for epistemic reasons. But there is considerable evidence that people often adopt views, especially counternormative ones, that serve as “cultural badges” that identify the members of a moral, political, or ideological community and demarcate the community’s boundaries (Boyd & Richerson 1987; McElreath et al. 2003)[^boyd-1987][^mcelreath-2003]. These views are held on to tenaciously in the face of strong and persistent counterevidence because the epistemic costs are more than made up by personal, prudential gains. Membership in the group is valuable and deviations from orthodoxy are punished so the person has strong social incentives to endorse whatever is the “tribal” creed (Williams 2023, 2021; Kahan 2017; Funkhouser 2022)[^funkhouser-2022][^williams-2023].
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      But notice that at this turn in the discussion, it is not at all clear that we are still talking about the attitude of *belief* anymore, which was our original topic. The present claim under consideration is that people express support for certain views for prudential reasons: personal gain, social status, avoiding ostracism, and so forth. None of this requires the person actually to believe the relevant claims for which they are expressing support. Recall the original issue that we were aiming to address: When is a person excused from moral responsibility due to ignorance and when are they not excused because they culpably brought about their ignorance? If the claims currently under consideration are correct, then some cases that appear overtly to be ignorance may turn out to be no such thing; they are simply cases of people expressing social support for certain false propositions without actually believing them. Such expressions of social support, it would seem, are not forms of ignorance and are no shield from moral responsibility.
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      We have considered several alternative explanations for the etiology of ignorance, or related attitudes. It should be emphasized that there is one sense in which they don’t necessarily compete: each explanation might be true of different sets of cases. That is, it might be true that Slote’s explanation invoking cultural inability is applicable to some cases, Levy’s view invoking rational deference is applicable to others, and the views of Moody-Adams and other critics are applicable in still other cases (see Benson 2001, which makes a related point)[^benson-2001]. It is ultimately an empirical question which of the preceding etiological explanations best fits the particular case at hand, if any. It follows that when dealing with complex, real-world cases, as opposed to stipulated hypothetical cases, assessing whether agents exhibit culpable versus non-culpable ignorance cannot generally be accomplished from the armchair alone. Such assessment will additionally require careful empirical inquiry into the etiology of how the relevant agents came to believe what they do.
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      ## 4. Moral Responsibility and Artificial Agents
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      *Agents*, we have been saying, can be morally responsible for what they do. But what is an agent? Conceptual work is certainly needed to answer this question, but empirical work can make key contributions. An empirical field of particular interest is artificial intelligence (AI). As AI gallops forward, questions arise about whether machines of various kinds might be morally responsible for what they do.
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      ### 4.1 The Agent Model
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      To get us going in thinking about this issue, a useful starting place is a framework for understanding agency developed in computer science and artificial intelligence called the “agent model” (Russell & Norvig 2020; Sutton & Barto 1998; Haas 2022)[^haas-2022][^russell-2020][^sutton-1998]. A standard formulation of the model considers an agent who interacts with an environment partitioned into a set of states, with various actions available at each state. The agent also has a function that assigns to each state a degree of intrinsic value to the agent; these assignments of intrinsic value capture the agent’s “goals”. Agency involves a loop. In the first step, the agent receives perceptual input regarding the current state and also receives the intrinsic value of that state. Next, the agent makes a selection from the actions available in that state. Based on that action, the agent enters a new state, and the loop starts again. The key task of agency involves learning over time to behave in ways that maximize cumulative, long-term achievement of intrinsic value.
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      Much of the excitement in the study of artificial agents is due to the development of a wide assortment of algorithms that explain how agents embedded in the above setup can learn what are the best actions (Sutton & Barto 1998; Haas 2022; Solway & Botvinick 2012)[^haas-2022][^solway-2012][^sutton-1998]. These algorithms take a variety of forms. Some learn directly from experience, while others learn a model of the workings of the world and consequences of one’s actions and leverage this information to guide the selection of actions. And though the agent model is relatively spartan in its setup, it has been shown to be extraordinarily powerful. Recent milestones in AI, such as machines that achieve expert-level performance at chess, Go, and Atari video games, have been achieved within the agent model framework (Campbell et al. 2002; Mnih et al. 2015)[^campbell-2002][^mnih-2015].
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      The agent model might also serve as a tool to probe a space of possible agents, each with varying capacities, some of which might potentially be morally responsible for what they do. Recall the two core conditions for moral responsibility. It seems at least some artificial agents of the type envisioned in the agent model (hereafter just “artificial agent”) might be able satisfy these two conditions (Nyholm, 2018; Menges & Altehenger 2024)[^menges-2024].
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      An artificial agent flexibly adjusts its actions based on the current circumstances in order to maximize attainment of its aims. This kind of behavioral flexibility in pursuit of goals is widely thought to be the central element of control (Dennett 1984; Fischer & Ravizza 1998; Shepherd 2014)[^dennett-1984][^fischer-1998][^shepherd-2014]. Moreover, an artificial agent selects its actions based on various kinds of knowledge. For example, it knows what actions are available in the current situation, which of these actions are most likely to achieve its goals, and so forth. Thus, it is at least prima facie plausible that an artificial agent might be able to satisfy moral responsibility’s epistemic condition.
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      And yet, suppose an Atari game-playing artificial agent is playing the game *Space Invaders*. It fends off wave after wave of aliens and thus saves the Earth’s cities from destruction. Putting aside the question of moral responsibility in fictional scenarios, it seems deeply implausible that the artificial agent should be considered morally responsible for what it does, or that it should be somehow praised (Nyholm 2022, Chapter 6)[^nyholm-2022]. So, questions naturally arise about what is missing for moral responsibility.
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      ### 4.2 What Is Needed for Artificial Agents to be Morally Responsible for What They Do?
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
    source: |-
      What capacities do ordinary unimpaired adult humans have that are relevant for moral responsibility that seem to be missing in relatively simple artificial agents such as an Atari-playing machine? Here are a few candidates.
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      #### 4.2.1 Temporally Extended Projects and Plans
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      The Atari-playing artificial agent has just a single goal that it reaches fairly quickly: win the Atari game. Humans have a much richer, interlocking set of things that they care about—health, success, relationships, cultivating one’s talents, and so forth (Jaworska 2007; Shoemaker 2003)[^jaworska-2007][^shoemaker-2003]. These things can typically be accomplished only through endeavors and projects that unfold over years and even decades. Moral responsibility, one might argue, requires an agent with a rich and complex evaluative point of view and capacities for long-term planning agency (Bratman 2000)[^bratman-2000] to bring about those things the agent cares about.
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      #### 4.2.2 A Moral Sense and Access to Moral Reasons
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      The Atari-playing artificial agent has no sense of what is right or wrong, fair or unfair, good or bad, and what kinds of actions manifest vices or virtues. To be morally responsible, one might argue, an agent needs to be outfitted with a moral sense, have access to moral reasons (Wolf 2012; Wallace 1998; Shoemaker 2011)[^shoemaker-2011][^wallace-1998][^wolf-2012], or be able to engage in moral learning (Railton 2017b)[^railton-2017b]. Only then can the agent be blamed for failing to do what morality demands.
    step1: TBD
    step2: TBD
  - id: 92
    kind: body
    source: |-
      #### 4.2.3 Consciousness
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      Suppose a person acts based on motives that are entirely unconscious; they do what they do without awareness of why they are doing it. This is in fact what may happen in, for instance, certain kinds of sleepwalking (Levy 2014)[^levy-2014]. Reflecting on cases such as these, some philosophers have claimed that consciousness is required for moral responsibility (Levy 2014; King & Carruthers 2012)[^king-2012][^levy-2014].
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      But why specifically might moral responsibility depend on consciousness? One influential view is that consciousness is required for, or else closely associated with, the widespread sharing of information throughout the agent’s psychology (King & Carruthers 2012; Levy 2014; Nahmias et al. 2020)[^king-2012][^levy-2014][^nahmias-2020]. In the conscious waking state, information is widely broadcast to diverse consumer systems, rendering the agent responsive to a wide range of reasons (Fischer & Ravizza 1998)[^fischer-1998] and rendering their actions reflective of their full evaluative point of view (Wolf 1993)[^wolf-1993]. The problem with the sleepwalker, it is argued, is that low-level modules produce their behavior. These modules are unlikely to be flexibly responsive to a broad range of reasons, and the agent’s actions correspondingly won’t (typically) be reflective of their motives and evaluations, thus explaining why the absence of consciousness undermines moral responsibility.
    step1: TBD
    step2: TBD
  - id: 95
    kind: body
    source: |-
      #### 4.2.4 “Ultimate” Control
    step1: TBD
    step2: TBD
  - id: 96
    kind: body
    source: |-
      Our Atari-playing artificial agent comes pre-programmed with its aims, in this case, a single aim to win the game. It learns over time to choose actions that bring it closer and closer to fulfillment of this externally installed aim. More generally, for an artificial agent like the Atari-playing machine, the moral quality of its actions depends strictly on what aims were prespecified. If these aims are morally commendable, the agent will act in the service of the good; if these aims are morally reprehensible, so too will be agent’s actions.
    step1: TBD
    step2: TBD
  - id: 97
    kind: body
    source: |-
      It might be argued that for genuine moral responsibility, agents cannot simply act on the basis of fixed, externally installed aims. The agents themselves must somehow have control over what they are aiming for, something we might term “ultimate control.”
    step1: TBD
    step2: TBD
  - id: 98
    kind: body
    source: |-
      What ultimate control amounts to is itself controversial. For some theorists, it only requires criticizability and revisability—whatever aims an agent has, there must be ways for the agent to reflectively criticize them (Frankfurt 1971)[^frankfurt-1971] or revise them (Mele 2001, 2006)[^mele-2001], or at least change them were they to conflict with certain standards of correctness (Wolf 1980, 1993; Nelkin 2011)[^nelkin-2011][^wolf-1980].
    step1: TBD
    step2: TBD
  - id: 99
    kind: body
    source: |-
      For other theorists, the agent must be the “root” source of their own aims or other elements of their evaluative point of view. For example, one formulation goes like this: To be responsible for what one chooses at some time *t*, the elements of one’s evaluative point of view that are the basis for what one chooses at *t* must themselves be the products of the agent’s own prior choices. This formulation appears to set up an infinite regress. This this way of understanding ultimate control may be so demanding, it makes moral responsibility essentially impossible (G. Strawson 1994)[^strawson-1994]. But notice that it is impossible irrespective of whether the agent in question is human or artificial.
    step1: TBD
    step2: TBD
  - id: 100
    kind: body
    source: |-
      ### 4.3 The Future of Moral Responsibility
    step1: TBD
    step2: TBD
  - id: 101
    kind: body
    source: |-
      We have identified several gaps that separate a fairly simple artificial agent from typical human agents. Looking to the future, some of these gaps are likely to shrink. For example, there are research programs trying to outfit artificial agents with abilities for long-term planning, leveraging sophisticated causal models of the world (Malinsky & Danks 2018; Steyvers et al. 2003)[^malinsky-2018][^steyvers-2003]. There is also great interest in building artificial agents that can engage in moral learning (Railton 2017b)[^railton-2017b] and moral reasoning (Awad et al. 2022; Sinnott-Armstrong & Skorburg 2021)[^awad-2022][^sinnott-armstrong-2021].
    step1: TBD
    step2: TBD
  - id: 102
    kind: body
    source: |-
      Interestingly, in some cases, gaps between humans and artificial agents may emerge and grow in the opposite direction. That is, artificial agents may exhibit responsibility-relevant abilities that exceed our own. For example, in humans, information sharing is importantly limited by the capacity of working memory (Baddeley 2019; Carruthers 2015; Persuh et al. 2018)[^baddeley-2019][^carruthers-2015][^persuh-2018], which is thought to be limited to roughly seven chunks of information at a time (Miller 1956)[^miller-1956]. In artificial systems, components that play an analogous role to working memory need not be so constrained; dozens, hundreds, or even thousands of pieces of information may be simultaneously activated and available for the purposes of reasoning and inference.
    step1: TBD
    step2: TBD
  - id: 103
    kind: body
    source: |-
      Accounts of moral responsibility have primarily been developed by considering ordinary adult humans as the targets for the theory. In the future, a menagerie of distinctive artificial agents might arise, each outfitted with different sets of abilities and exhibiting different limitations. The targets that a theory of moral responsibility must be sensitive to are likely to commensurably expand. Theories of moral responsibility may need to be amended, refined, or otherwise rethought to accommodate these developments.
    step1: TBD
    step2: TBD
