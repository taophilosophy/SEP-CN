      First of all, there are active philosophical disagreements about how best to understand the notion of “hard” or “difficult” (Bradford 2015)[^bradford-2015]. One sense of something’s being hard emphasizes subjective effort (Bermúdez & Massin 2023)[^bermúdez-2023]. This sense seems to be at work when it is said that it is hard to lift a hefty but ultimately manageable weight, say 50 pounds. The weight is not unliftable, but it is not easy to lift—it takes some effort and feels somewhat aversive to do it.
    step1: |-
      首先，关于如何最好地理解“难”或“困难”这一观念，存在活跃的哲学分歧 (Bradford 2015)[^bradford-2015]。某事物之“难”的一种意义强调主观努力 (Bermúdez & Massin 2023)[^bermúdez-2023]。当人们说举起一个沉重但终究可承受的重物（比如 50 磅）很难时，似乎就是这种意义在起作用。这个重量并非举不起来，但举起来并不轻松——它需要一些努力，做起来令人有些反感。
    step2: |-
      首先，“难”或“困难”究竟该怎样理解，哲学上仍有活跃的分歧 (Bradford 2015)[^bradford-2015]。一种意义强调主观努力 (Bermúdez & Massin 2023)[^bermúdez-2023]：说举起一件沉重但终究搬得动的重物（比如 50 磅）很难，用的似乎就是这层意思。它并非举不起来，但举起来不轻松——要费些力气，做起来还有点不好受。
