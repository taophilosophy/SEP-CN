      What are the conditions under which an agent is morally responsible for some action that they have performed? Put another way, and acknowledging that this rephrasing might be contentious, what are the conditions under which it would be appropriate to praise or blame the agent for something they have done? (Strawson 1962; Wallace 1998; Coates & Tognazzini 2013)[^coates-2013][^strawson-1962][^wallace-1998]. An account of moral responsibility supplies answers to these questions. (See the entry on “Moral Responsibility”).
    step1: |-
      行动者在何种条件下对其所做出的某个行动负有道德责任？换一种说法，并承认这一改写可能有争议：在何种条件下，就行动者所做的某事而赞扬或责备他们才是恰当的？(Strawson 1962; Wallace 1998; Coates & Tognazzini 2013)[^coates-2013][^strawson-1962][^wallace-1998]。一种道德责任理论正是为这些问题提供答案。（参见“道德责任”词条。）
    step2: |-
      行动者在什么条件下才对自己所做的某个行动负有道德责任？换个说法——这一改写或许有争议——在什么条件下，对某个行动者所做之事予以赞扬或责备才算恰当？(Strawson 1962; Wallace 1998; Coates & Tognazzini 2013)[^coates-2013][^strawson-1962][^wallace-1998]。一套道德责任理论，就是为这些问题提供答案。（参见“道德责任”词条。）
  - id: 2
    kind: body
    source: |-
      Most theorists agree that moral responsibility requires satisfying at least two core conditions. The first is a *control* condition; the agent must have the right sort of control over what they do (Dennett 1984; Fischer & Ravizza 1998; Shepherd 2014)[^dennett-1984][^fischer-1998][^shepherd-2014]. Such control would be lacking in cases involving force or coercion. The second is an *epistemic condition*; the agent must know certain things, such as what they are doing and the moral reasons that bear on their actions (Wieland & Robichaud 2017; Zimmerman 1997)[^wieland-2017][^zimmerman-1997]. The epistemic condition would be violated if a person does something out of ignorance, especially if their ignorance is itself non-culpable. See the entry by Fernando Rudy-Hiller on “The Epistemic Condition for Moral Responsibility” in this encyclopedia.
    step1: |-
      多数理论家同意，道德责任至少需要满足两个核心条件。第一个是*控制*条件；行动者必须对其所作所为拥有恰当类型的控制 (Dennett 1984; Fischer & Ravizza 1998; Shepherd 2014)[^dennett-1984][^fischer-1998][^shepherd-2014]。在涉及强制或胁迫的情形中，这种控制就是缺失的。第二个是*认知*条件；行动者必须知道某些事情，例如自己在做什么，以及影响其行动的道德理由 (Wieland & Robichaud 2017; Zimmerman 1997)[^wieland-2017][^zimmerman-1997]。如果一个人出于无知而做某事，尤其是当其无知本身不可归咎时，认知条件就被违反了。参见本百科全书中 Fernando Rudy-Hiller 的“道德责任的认知条件”词条。
    step2: |-
      多数理论家都同意，道德责任至少要满足两个核心条件。其一是*控制*条件：行动者必须对自身所为拥有恰当类型的控制 (Dennett 1984; Fischer & Ravizza 1998; Shepherd 2014)[^dennett-1984][^fischer-1998][^shepherd-2014]；凡涉强制或胁迫，这种控制便告缺失。其二是*认知*条件：行动者必须知道某些事情，比如自己在做什么、有哪些道德理由与行动相关 (Wieland & Robichaud 2017; Zimmerman 1997)[^wieland-2017][^zimmerman-1997]；人若因无知而行事——尤其当无知本身不可归咎——认知条件即遭违反。参看本百科全书中 Fernando Rudy-Hiller 所撰“道德责任的认知条件”词条。
  - id: 3
    kind: body
    source: |-
      Some of the work in constructing an account of moral responsibility is conducted from the “armchair” (Daniels 1979; Williamson 2007)[^daniels-1979][^williamson-2007]. Theorists put forward plausible principles for when an agent is morally responsible for what they do. They check these principles for consistency with other principles and with reactions to specific hypothetical cases. They revise these principles and reactions to cases in the direction of greater coherence, simplicity, explanatoriness, elegance, and so forth.
    step1: |-
      构建道德责任理论的部分工作是在“扶手椅”上进行的 (Daniels 1979; Williamson 2007)[^daniels-1979][^williamson-2007]。理论家提出一些看似合理的原理，用以判定行动者在何时对其所作所为负有道德责任。他们检验这些原理与其他原理是否一致，与对特定假想情形的反应是否一致。他们朝更大的融贯性、简洁性、解释力、优雅性等方向，修正这些原理与对情形的反应。
    step2: |-
      构建道德责任理论的某些工作，是在“扶手椅”里做的 (Daniels 1979; Williamson 2007)[^daniels-1979][^williamson-2007]。理论家先提出一些看似合理的原理，用来说明行动者何时对自身所为负有道德责任；再检验这些原理彼此是否相容，与对具体假想情形的反应是否一致；然后朝更融贯、更简洁、更具解释力、更优雅等方向，修改原理与反应。
  - id: 4
    kind: body
    source: |-
      Yet, consistent with the view that there is no sharp demarcation between philosophical and scientific inquiry (Quine 1957; Stich 1996)[^quine-1957][^stich-1996], there could be many ways empirical evidence might be relevant to the task of constructing an account of moral responsibility. For example, we might believe that ordinary adults have the kind of control that is needed to satisfy the control condition for moral responsibility, while individuals with certain mental disorders, such as addiction, lack this kind of control. Empirical investigations might help identify what is possessed by the former and lacked by the latter.
    step1: |-
      然而，与哲学探究和科学探究之间并无截然分界这一观点相一致 (Quine 1957; Stich 1996)[^quine-1957][^stich-1996]，经验证据可能与构建道德责任理论的任务有许多相关方式。例如，我们可能相信，普通成年人拥有满足道德责任之控制条件所需的那种控制，而患有某些精神障碍（如成瘾）的个体则缺乏这种控制。经验研究或许有助于确定前者拥有什么、后者缺少什么。
    step2: |-
      不过，若承认哲学探究与科学探究之间并无截然分界 (Quine 1957; Stich 1996)[^quine-1957][^stich-1996]，那么经验证据与道德责任理论的构建便可能有多种关联。举例来说，我们或许相信普通成年人拥有满足控制条件的那种控制，而成瘾等某些精神障碍患者则缺少这种控制；经验研究正可帮助弄清前者有何、后者缺何。
