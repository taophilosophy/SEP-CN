      Thus far we have been assuming that addiction involves some kind of impaired control over use of drugs and have examined several accounts of what this impaired control amounts to. Not everyone, however, subscribes to this assumption. Some theorists have been attracted to the position that people who use drugs heavily (and meet many of the conventional criteria for the diagnosis of addiction) do not genuinely have impaired control at all (Foddy & Savulescu 2007, 2010; Hart 2013; Heyman 2009)[^foddy-2007][^hart-2013][^heyman-2009]. See also Pickard 2012, for a nuanced related position.
    step1: |-
      至此我们一直假定，成瘾涉及某种对毒品使用的受损控制，并考察了关于这种受损控制究竟为何的几种说明。然而并非所有人都接受这一假定。一些理论家倾向于这样一种立场：大量使用毒品的人（且符合成瘾诊断的许多常规标准）实际上根本没有受损的控制 (Foddy & Savulescu 2007, 2010; Hart 2013; Heyman 2009)[^foddy-2007][^hart-2013][^heyman-2009]。另见 Pickard 2012 一个细致入微的相关立场。
    step2: |-
      到此为止，我们一直假定成瘾包含某种对吸毒的受损控制，并考察了几种说明。但并非人人都接受这一假定：有些理论家倾向于认为，大量吸毒者（且符合成瘾诊断的许多常规标准）其实根本没有受损的控制 (Foddy & Savulescu 2007, 2010; Hart 2013; Heyman 2009)[^foddy-2007][^hart-2013][^heyman-2009]。另可参看 Pickard 2012 一个更细致、与之相关的立场。
