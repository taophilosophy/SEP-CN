      Faced with the preceding observations, many theorists retreat to a weaker claim: In addiction, drug-directed desires are not literally irresistible, but they are somehow uniquely *hard* or *difficult* to resist (claims along these lines are found in Watson 1999; Wallace 1999; Kennett 2013; Levy 2006; Henden, Melberg, and Rogeberg 2013; Morse 2002; Holton and Berridge 2013 and Burdman 2022)[^burdman-2022][^holton-2013][^kennett-2013][^levy-2006][^morse-2002][^wallace-1999][^watson-1999]. There are several potential problems for these “hard to resist” views.
