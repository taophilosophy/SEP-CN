      ## 1. Addiction and Impaired Control
    step1: |-
      ## 1 成瘾与受损的控制
    step2: |-
      ## 1 成瘾与受损的控制
  - id: 10
    kind: body
    source: |-
      Addiction figures frequently in contemporary works on moral responsibility because it is supposed to illustrate a canonical way that agency goes awry. We are usually authors of our actions; what we do is up to us. Many philosophers and other theorists claim that this is not so for individuals addicted to drugs. These theorists claim that these individuals are not morally responsible for their drug-directed actions, or else responsibility is to an important degree mitigated.
    step1: |-
      成瘾在当代道德责任研究中频频出现，因为它被认为例示了能动性出错的典型方式。我们通常是自身行动的作者；我们所做的取决于我们自己。许多哲学家和其他理论家声称，对吸毒成瘾的个体而言并非如此。这些理论家声称，这些个体对其毒品导向的行动不负道德责任，或者责任在很大程度上被减轻了。
    step2: |-
      成瘾之所以频频出现在当代道德责任研究中，是因为它被视为能动性失常的典型例证。我们通常是自身行动的作者，所做之事取决于自己；但不少哲学家和其他理论家声称，对吸毒成瘾者来说并非如此——他们对其毒品导向的行动不负道德责任，或者责任已在相当程度上减轻。
  - id: 11
    kind: body
    source: |-
      To better understand and assess these claims, we must get clear on a number of empirical questions about the nature of addiction and the ways it impacts agency—specifically addiction to drugs such as alcohol or opiates, which have been the focus of philosophical interest.
    step1: |-
      为了更好地理解与评估这些主张，我们必须弄清若干关于成瘾之性质及其影响能动性方式的经验问题——具体说来，是酒精或阿片类药物等毒品的成瘾，这些一直是哲学兴趣的焦点。
    step2: |-
      要更好地理解并评估这些主张，就得先弄清若干经验问题：成瘾究竟是什么，它又以何种方式影响能动性——确切地说，是酒精、阿片类药物等毒品成瘾，这类成瘾一向是哲学关注的焦点。
  - id: 12
    kind: body
    source: |-
      ### 1.1 What is Addiction?
    step1: |-
      ### 1.1 何谓成瘾？
    step2: |-
      ### 1.1 何谓成瘾？
  - id: 13
    kind: body
    source: |-
      Addiction is a complex and heterogeneous phenomenon (Glackin et al. 2021)[^glackin-2021], and it is best conceptualized as encompassing several importantly distinct components (Griffiths 2005; Sussman & Sussman 2011; Sinnott-Armstrong & Pickard 2013)[^griffiths-2005][^sinnott-armstrong-2013][^sussman-2011]. These components include excessive use despite deleterious consequences, physiological changes including tolerance and withdrawal, and excessive time spent on drug-related activities, which crowds out other aspects of life. These components are reflected in the criteria for substance use disorders in the Diagnostic and Statistical Manual of Mental Disorders (American Psychiatric Association & DSM-5 Task Force 2013)[^american-2013], a widely used text for psychiatric diagnosis and classification.
    step1: |-
      成瘾是一种复杂而多样的现象 (Glackin et al. 2021)[^glackin-2021]，最好把它理解为包含若干重要而不同的成分 (Griffiths 2005; Sussman & Sussman 2011; Sinnott-Armstrong & Pickard 2013)[^griffiths-2005][^sinnott-armstrong-2013][^sussman-2011]。这些成分包括：尽管有有害后果仍过量使用；生理变化，包括耐受性与戒断；以及花在毒品相关活动上的时间过多，挤占了生活的其他方面。这些成分反映在《精神障碍诊断与统计手册》（American Psychiatric Association & DSM-5 Task Force 2013）[^american-2013]的物质使用障碍诊断标准中，该书是精神科诊断与分类广泛使用的文本。
    step2: |-
      成瘾是一种复杂而异质的现象 (Glackin et al. 2021)[^glackin-2021]，最宜理解为由若干重要且彼此不同的成分构成 (Griffiths 2005; Sussman & Sussman 2011; Sinnott-Armstrong & Pickard 2013)[^griffiths-2005][^sinnott-armstrong-2013][^sussman-2011]：不顾有害后果的过量使用；耐受性与戒断等生理变化；以及毒品相关活动占用过多时间，挤掉生活的其他方面。这些成分体现在《精神障碍诊断与统计手册》（American Psychiatric Association & DSM-5 Task Force 2013）[^american-2013]的物质使用障碍诊断标准里；该书是精神科诊断与分类领域广泛使用的文本。
  - id: 14
    kind: body
    source: |-
      Impaired control is another important component of addiction that is conceptually distinct from the previous three (Heather 1998, 2020; Sripada 2022)[^heather-1998][^sripada-2022]. The hallmark of impaired control is that a person with (sincerely held) goals to cut down or quit has an inability to get themselves to reach or maintain these goals. As noted earlier, control is a core condition for moral responsibility. Naturally, then, this fourth component of addiction, impaired control, has garnered the most philosophical attention, and it shall be our focus. What is the nature of impaired control in addiction?
    step1: |-
      受损的控制是成瘾的另一个重要成分，在概念上区别于前三个成分 (Heather 1998, 2020; Sripada 2022)[^heather-1998][^sripada-2022]。受损控制的标志是：一个有（真诚持有的）减少或戒除目标的人，无法使自己达成或维持这些目标。如前所述，控制是道德责任的核心条件。因此，成瘾的这一第四个成分——受损的控制——自然获得最多哲学关注，也将是我们的焦点。成瘾中受损控制的本质是什么？
    step2: |-
      受损的控制是成瘾的又一重要成分，概念上不同于前三种 (Heather 1998, 2020; Sripada 2022)[^heather-1998][^sripada-2022]。其标志在于：一个人怀着（真诚持有的）减量或戒除目标，却无法让自己达成或维持这些目标。前已指出，控制是道德责任的核心条件；因此成瘾的这第四个成分——受损的控制——自然最受哲学关注，也是本节焦点。成瘾中的受损控制究竟是怎么回事？
  - id: 15
    kind: body
    source: |-
      ### 1.2 Addiction Involves Irresistible Desires
    step1: |-
      ### 1.2 成瘾涉及不可抗拒的欲望
    step2: |-
      ### 1.2 成瘾涉及不可抗拒的欲望
  - id: 16
    kind: body
    source: |-
      One possibility is that impaired control in addiction arises from irresistible desires. Very roughly, a desire is irresistible if it is so strong that the person cannot resist it no matter how hard they try, though pinning down the idea with more precision is challenging (Mele 1990; Pickard 2015)[^mele-1990][^pickard-2015]. A particularly vivid depiction of irresistible addictive desires comes from Harry Frankfurt, who gives us the haunting figure of the unwilling addict:
    step1: |-
      一种可能是，成瘾中受损的控制源于不可抗拒的欲望。粗略地说，如果一个欲望强到无论人怎样努力都无法抗拒，它就是不可抗拒的；不过要以更精确的方式把握这一观念仍有困难 (Mele 1990; Pickard 2015)[^mele-1990][^pickard-2015]。Harry Frankfurt 对不可抗拒的成瘾欲望作了特别生动的描绘，他给我们提供了那个令人难忘的不情愿的成瘾者形象：
    step2: |-
      一种可能是：成瘾中的受损控制源自不可抗拒的欲望。粗略说来，若一个欲望强到无论人怎样努力都无法抗拒，它便是不可抗拒的——当然，要把这一想法说得更精确并不容易 (Mele 1990; Pickard 2015)[^mele-1990][^pickard-2015]。Harry Frankfurt 对不可抗拒的成瘾欲望有过特别生动的刻画，他笔下的“不情愿的成瘾者”令人难忘：
  - id: 17
    kind: body
    source: |-
      [The man] hates his addiction and always struggles desperately, although to no avail, against its thrust. He tries everything that he thinks might enable him to overcome his desires for the drug. But these desires are too powerful for him to withstand, and invariably, in the end, they conquer him. He is an unwilling addict, helplessly violated by his own desires. (Frankfurt 1971, p. 12)[^frankfurt-1971]
    step1: |-
      [此人]憎恨自己的成瘾，总是拼命挣扎，尽管徒劳，反抗它的冲力。他尝试一切他认为可能帮助自己克服对毒品之欲望的办法。但这些欲望太强，他无法抵挡，最终无一例外地征服了他。他是一个不情愿的成瘾者，被自己的欲望无助地侵犯。(Frankfurt 1971, p. 12)[^frankfurt-1971]
    step2: |-
      [此人]憎恨自己的成瘾，总是拼命挣扎，尽管徒劳，反抗它的冲势。他试遍一切自以为能帮他克服毒瘾的办法。可这些欲望太强，他抵挡不住，最终无一例外地被它们征服。他是个不情愿的成瘾者，被自己的欲望无助地侵犯。(Frankfurt 1971, p. 12)[^frankfurt-1971]
  - id: 18
    kind: body
    source: |-
      The idea that addiction involves irresistible desires was famously endorsed by William James (James 1890)[^james-1890] and has been widespread in philosophy, for example, in Fischer (2012, Section 2.2), Fischer and Ravizza (1998, p. 82), Wolf (1993, Chapter 2), Scanlon (1998, p. 290), and Wallace (1998, Chapter 5), among others. But is the idea accurate? Does impaired control in addiction typically take the form of desires too powerful for a person to withstand?
    step1: |-
      成瘾涉及不可抗拒的欲望这一想法，曾由 William James (James 1890)[^james-1890] 著名地支持，并在哲学中广泛流行，例如 Fischer (2012, Section 2.2)、Fischer and Ravizza (1998, p. 82)、Wolf (1993, Chapter 2)、Scanlon (1998, p. 290) 以及 Wallace (1998, Chapter 5) 等。但这一想法准确吗？成瘾中受损的控制，通常是否采取欲望强到人无法抵挡的形式？
    step2: |-
      “成瘾涉及不可抗拒的欲望”这一想法，因 William James (James 1890)[^james-1890] 的表态支持而广为人知，随后在哲学界流传甚广——Fischer (2012, Section 2.2)、Fischer and Ravizza (1998, p. 82)、Wolf (1993, Chapter 2)、Scanlon (1998, p. 290)、Wallace (1998, Chapter 5) 等皆持此说。但这想法准确吗？成瘾中受损的控制，通常真是以“欲望强到无法抵挡”的形式出现吗？
  - id: 19
    kind: body
    source: |-
      The answer appears to be, fairly clearly, no. Hanna Pickard provides an influential critique of the idea that that conditions such as addiction involve motives so strong that the person “cannot do otherwise” (Pickard 2015)[^pickard-2015]. A key observation is that individuals with addictions display substantial “incentive sensitivity”: they both act and withhold actions related to drug use based on incentives and disincentives for doing so (Pickard 2012; Hart 2013; Husak 1992; Heyman 2009; Sripada 2022)[^hart-2013][^heyman-2009][^husak-1992][^pickard-2012][^sripada-2022]. So, for example, they avoid drug use when negative consequences are clearly and saliently present, for example when a police officer is “at the elbow” (Morse 2000; Caplan 2006)[^caplan-2006][^morse-2000], and they choose to forsake using drugs if offered only modest-sized incentives (Hart et al. 2000; Higgins & Petry 1999)[^hart-2000][^higgins-1999]. Additionally, many individuals with addictions routinely attempt to quit, and typically manage to maintain sobriety for days and weeks, something that would not be possible if drug-directed desires are literally irresistible (Pickard 2015)[^pickard-2015].
    step1: |-
      答案似乎相当清楚：不是。Hanna Pickard 对“成瘾之类状况涉及强到人‘无法不那样做’的动机”这一想法提出了有影响力的批评 (Pickard 2015)[^pickard-2015]。一项关键观察是：成瘾者表现出可观的“激励敏感性”——他们会根据与毒品使用相关的激励与抑制因素而行动或不行动 (Pickard 2012; Hart 2013; Husak 1992; Heyman 2009; Sripada 2022)[^hart-2013][^heyman-2009][^husak-1992][^pickard-2012][^sripada-2022]。例如，当负面后果清楚而显著地出现时，比如警察“就在肘边” (Morse 2000; Caplan 2006)[^caplan-2006][^morse-2000]，他们会避免使用毒品；若只提供中等规模的激励，他们会选择放弃使用毒品 (Hart et al. 2000; Higgins & Petry 1999)[^hart-2000][^higgins-1999]。此外，许多成瘾者经常尝试戒除，且通常能维持数日到数周的清醒，若毒品导向的欲望字面上不可抗拒，这就不可能 (Pickard 2015)[^pickard-2015]。
    step2: |-
      答案似乎相当清楚：并非如此。Hanna Pickard 对“成瘾这类状况含有强到使人‘无法不那样做’的动机”这一想法，提出了颇具影响的批评 (Pickard 2015)[^pickard-2015]。关键的一点是：成瘾者表现出可观的“激励敏感性”——他们会依据与吸毒相关的激励与惩罚因素，采取或抑制相应行动 (Pickard 2012; Hart 2013; Husak 1992; Heyman 2009; Sripada 2022)[^hart-2013][^heyman-2009][^husak-1992][^pickard-2012][^sripada-2022]。譬如，负面后果清楚而显著地摆在眼前时——比如警察“就在肘边”——他们会避免吸毒 (Morse 2000; Caplan 2006)[^caplan-2006][^morse-2000]；若给出的激励只是中等规模，他们也会选择不吸 (Hart et al. 2000; Higgins & Petry 1999)[^hart-2000][^higgins-1999]。再者，许多成瘾者经常尝试戒断，且往往能维持数日乃至数周的清醒——若毒品导向的欲望真在字面上不可抗拒，这一点无从解释 (Pickard 2015)[^pickard-2015]。
