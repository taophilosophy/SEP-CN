      为了让重商主义与自由放任之争更细致、并最终超越这场争论，Nathan Rosenberg（1963）和 F. A. 哈耶克（1966）力图恢复并凸显曼德维尔社会发展说明中的演化面向。在曼德维尔较著名的 20 世纪读者里，没人比哈耶克更认真地对待他的社会哲学。在英国科学院“大师心智”讲座系列的一次演讲中，哈耶克（1966: 126）淡化曼德维尔经济观念的重要性。他转而把其著作的功绩说成标志着“演化与秩序之自发形成这对观念在现代思想中的决定性突破”。按哈耶克的说法，曼德维尔明白人有偏见，既预见不到也不理解自己个体行动的宏观后果。哈耶克把这种自欺倾向当成一条理由：不该信任任何个人——无论他多开明——去引导社会走向中央计划的未来。与曼德维尔的思路一致，哈耶克批评建构主义理性主义，以及他所谓植根于对人类理性过度信任的那种错误个人主义。哈耶克由此追随曼德维尔，强调人类知识的限度，并在此基础上主张市场中的分散决策。
