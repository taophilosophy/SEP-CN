      Throughout the twentieth century, there was much debate about whether Mandeville should be classified as a proponent of laissez-faire or mercantilist economic doctrines (for critical overviews, see Landreth 1975; Rashid 1985; Prendergast 2016, 104–112)[^landreth-1975][^prendergast-2016][^rashid-1985]. Evidence supporting both interpretations can be found, and Mandeville may have changed his position to some extent between different editions of the *Fable*, shifting from a more laissez-faire position when analyzing economic demand to a more mercantilist one when examining labor supply (Dew 2005)[^dew-2005]. Indeed, one area where his economic thinking closely intersects with his broader social and political philosophy concerns his views on the working poor.
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      In defending the thesis that private vices lead to public benefits, Mandeville maintains that the advantages of commercial prosperity extend to the lowest classes in society, with the poorest members of flourishing states enjoying more of the comforts of life than even the richest classes in less economically-developed societies (FB I, 169–172). Yet Mandeville does not support the liberal reward of labor—as David Hume and Adam Smith would later do—and instead endorses a version of the utility of poverty thesis. While the poor should have enough to survive, Mandeville argues that the state benefits more if the poor spend their entire income, rather than being able to build up savings. The poor are generally “more prone to Ease and Pleasure than they are to Labour”, and thus will only work if driven to do so by immediate necessity (FB I, 192–194). What is more, it is important that the poor are kept uneducated and do not acquire aspirations that will only be disappointed by striving to emulate the more affluent classes. The poor will be happier with their lot if their expectations are not raised beyond what they can ever hope to attain (FB I, 287–290).
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      As these remarks indicate, not only does Mandeville recognize that the societies of his day were demarcated into different socioeconomic classes, but he also holds that it is unrealistic—and even undesirable—to try to change this. He argues that maintaining clear class distinctions would protect the self-esteem of the working poor, who comprised most of the population. By ensuring that the lower classes do not compare themselves to those above them on the social ladder, their self-image could be preserved, leading to greater happiness and satisfaction with their condition. There is nothing egalitarian about the way that the economy of esteem plays out in Mandeville’s social vision.
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      One striking feature of Mandeville’s analysis of the working poor is that he does not allow that the desire for social standing and esteem could reliably motivate people to perform menial labor. Given the importance that he elsewhere accords to pride, envy, and emulation in stimulating the demand for luxury goods, Mandeville’s discussion of the motivations of the laboring poor may seem at odds with his more general account of human nature (Pongiglione & Tolonen 2016: 89–93)[^pongiglione-2016]. Adam Smith (1759 [1976: 50]) would later remark that it “is chiefly from this regard to the sentiments of mankind, that we pursue riches and avoid poverty”, and the thought that what drives the economy is not the desire for material possessions as much as the status and good opinion that wealth confers fits well with much of Mandeville’s analysis of human nature. When it comes to the working classes, however, he contends that it is only economic necessity, and not the desire for social esteem, that can secure the labor supply of a prosperous economy.
