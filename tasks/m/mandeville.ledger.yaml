      19 世纪还出现了更系统地整理曼德维尔思想的尝试。这项智识努力在德国找到了沃土：19 世纪后期，围绕曼德维尔的观念形成了一个兴旺的学术流派。一个显著的里程碑是 Paul Sakmann 的开创性著作《伯纳德·德·曼德维尔与蜜蜂寓言之争》（*Bernard de Mandeville und die Bienenfabel-controverse*，1897）；F. A. 哈耶克后来承认自己对此书负债甚多（Nolan 2016）[^nolan-2016]。与德国日益高涨的兴趣并行，对曼德维尔思想贡献的分类整理也在英国获得了动力。曼德维尔的影响在整个 19 世纪的英格兰延续下来，可见于一般杂志和其他思想家著作中对他的引用，尤其是涉及伦理、经济与人类行为的讨论。曼德维尔的一位坚定拥护者是詹姆斯·克罗斯利（James Crossley），他是一位著名的收藏家、伊壁鸠鲁派道德哲学的倡导者，积极促成了围绕曼德维尔著作的对话，巩固了曼德维尔在当时思想界的显赫地位（Tolonen 2010: 29）[^tolonen-2010]。随着 Leslie Stephen 的《论自由思想与直率言说》（*Essays on Freethinking and Plainspeaking*，1873: 243–278）和《18 世纪英国思想史》（*The History of English Thought in the Eighteenth Century*，1876: 15–46）出版，曼德维尔对道德哲学史的重要性得到进一步确立；这两部书把曼德维尔与沙夫茨伯里呈现为两极，此后的英国道德哲学不得不在其间穿行。
