    kind: body
    source: |-
      ### 5.1 Eighteenth-century reception
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      Although the public reception of Mandeville’s work in 1720s Britain was largely hostile, it swiftly elevated him to fame (for a collection of responses, see Stafford 1997)[^stafford-1997]. By 1732, over 300 reports on the *Fable* had appeared in the British press (Revolti 2016)[^revolti-2016], and Benjamin Franklin sought to meet Mandeville when he came to London in 1725. A strong case can also be made that Mandeville’s mature philosophy proved very influential in the Scottish and wider European Enlightenment, with some of his key ideas being developed by David Hume, Jean-Jacques Rousseau, and Adam Smith, amongst others (see, e.g., Castiglione 1986; Goldsmith 1988; Hundert 1994; Robertson 2005: 256–324; Heath 2014)[^castiglione-1986][^goldsmith-1988][^heath-2014][^hundert-1994][^robertson-2005]. Even when these philosophers criticized Mandeville directly, they appear to have adopted some of his key insights about the evolution of social norms and the importance of passions such as self-liking (or, in Rousseau’s lexicon, *amour-propre*) that lead us to care deeply about our social standing.
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      Reviewing Rousseau’s *Discours sur l’origine et les fondements de l’inégalité parmi les hommes*, Smith (1756 [1980: 250]) claimed that “the second volume of the Fable of the Bees has given occasion to the system of Mr. Rousseau”, noting that they both denied natural sociability and set out accounts of how humans gradually come to acquire the qualities required to live together in society. Indeed, one of the most striking features of Mandeville’s conjectural history of society is that it implicitly rejects the social contract approaches associated with political philosophers like Thomas Hobbes and John Locke, and instead places much more emphasis on how conventions of justice and politeness could have emerged over time—an approach that would be developed further and more famously in Hume’s *A Treatise of Human Nature* (Tolonen 2013)[^tolonen-2013]. Similarly, Mandeville’s naturalistic explanation of how language first developed may well have influenced Étienne Bonnot de Condillac and helped to shape subsequent debates on the origin of language (Kaye 1924b; Schreyer 1978; Hundert 1994: 86–115)[^hundert-1994][^kaye-1924b][^schreyer-1978].
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      In these respects, *The Fable of the Bees* is a quintessentially Enlightenment text. It offers a naturalistic account of the origins of society and morality, without appealing to God-given natural law, in the vein of Locke, or to any strong (and sometimes theologically grounded) assumptions about the reach of human benevolence—the very assumptions to which Francis Hutcheson would appeal, as one of Mandeville’s most trenchant critics. When confronted with serious religious thinkers like Hutcheson and especially George Berkeley, Mandeville reaffirmed his intellectual integrity and claimed that the outrage caused by the *Fable* was largely due to people criticizing it without having read it carefully. He insisted that the *Fable* should be read as “a Philosophical Disquisition into the Force of the Passions, and the Nature of Society” (LD 54–55), and it appears to have had the greatest philosophical impact amongst those who did take it seriously in these terms, such as Hume and Smith.
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      Mandeville’s economic ideas also proved influential in the eighteenth century, not least in France, where his ideas on luxury were taken up by Jean-François Melon and Voltaire (Hont 2006)[^hont-2006]. French translations of some of Mandeville’s texts, including *Free Thoughts on Religion*, appeared even before his rise to fame following the 1723 edition of the *Fable*. The French press extensively reviewed and discussed his works, especially once a full translation of both parts of the *Fable* was published in 1740 (Muceni 2015)[^muceni-2015]. While the influence of Mandeville’s ideas was greatest in eighteenth-century Britain and France, his works also received wider attention throughout the century, including in Germany (Fabian 1976)[^fabian-1976] and the Dutch Republic (Hengstmengel & Verburg 2023)[^hengstmengel-2023].
    step1: TBD
