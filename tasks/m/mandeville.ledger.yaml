      The main reason Mandeville’s sincerity has frequently been doubted is that he appears to revel in highlighting the most scandalous implications of his own analysis. His tone is often humorous or playful, and, despite what he says, if the road to worldly prosperity and glory diverges from the road to virtue, then Mandeville seems relatively untroubled by the fact that we invariably choose the former. Indeed, he repeatedly criticizes those—especially the clergy—who complain about the moral degeneracy of society while being far from paragons of virtue themselves. That Mandeville aimed to expose the hypocrisy of such people is beyond doubt, yet it is less clear what the implications are for understanding his own moral philosophy. Some commentators have read Mandeville as a libertine or hedonist, whose rigoristic definition of virtue was insincere and adopted solely for satirical purposes (e.g., Viner 1953 [1991: 178–182]; Harth 1969; Nieli 1989)[^harth-1969][^nieli-1989][^viner-1953]. Others, by contrast, have not only taken Mandeville’s rigorism seriously, but even suggested that he saw his philosophy as resting firmly on Christian foundations (e.g., Chiasson 1970; Crisp 2019: 60–73)[^chiasson-1970][^crisp-2019]. Another influential view is that there is a genuine tension between Mandeville’s rigoristic conception of virtue and the more general empiricist bent of his philosophy, with the latter aligning more closely with utilitarianism (Kaye 1924a: lii–lvi)[^kaye-1924a].
    step1: |-
      曼德维尔的真诚之所以屡受怀疑，主要原因是他似乎津津乐道于凸显自己分析中最骇人听闻的推论。他的语调常常诙谐、戏谑；而且不管他嘴上怎么说，如果通往世俗繁荣与荣耀的道路与通往德性的道路分岔，那么对于“我们总是选择前者”这一事实，曼德维尔似乎并不怎么不安。事实上，他反复批评那些人——尤其是教士——他们抱怨社会道德沦丧，自己却远非德性的典范。曼德维尔意在揭露这类人的伪善，这一点毋庸置疑；但这对他本人道德哲学的理解意味着什么，却不太清楚。一些评论者把曼德维尔读作放荡者或享乐主义者：其严格主义的德性定义并不真诚，只是为了讽刺目的才采用（例见 Viner 1953 [1991: 178–182]；Harth 1969；Nieli 1989）[^harth-1969][^nieli-1989][^viner-1953]。另一些评论者则相反：他们不仅认真对待曼德维尔的严格主义，甚至认为他把自己的哲学看作牢牢建立在基督教基础之上（例见 Chiasson 1970；Crisp 2019: 60–73）[^chiasson-1970][^crisp-2019]。还有一种有影响的看法：曼德维尔的严格主义德性观与他哲学中更一般的经验主义倾向之间存在真正的张力，而后者更接近功利主义（Kaye 1924a: lii–lvi）[^kaye-1924a]。
