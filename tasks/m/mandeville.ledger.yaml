      曼德维尔在《疑病症与歇斯底里激情论》中勾勒了这样一条进路。他声称人类知识“只能来自后验”（TH 100）。他贬斥那些仅凭理性提出抽象体系、却不为其思辨寻求经验支持的医生，反过来主张医生的技艺建立在实践知识之上：从积累的经验中观察模式，并提出能解释现有证据的合理假说（TH，尤见 61–63、91）。在《蜜蜂的寓言》中，曼德维尔有时也用类似的说法表述自己的方法：即便他为解释晦涩的社会现象提出思辨性猜测，他的推理仍以“人人对人都能作出的明白观察”为依据（FB II, 128）。
