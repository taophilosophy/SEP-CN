      Mandeville’s views on women do not always point so straightforwardly in a feminist direction, as is most evident in the considerations that he raises for tolerating sex work as a lesser evil (on which, see Rosenthal 2006: 42–69; Nacol 2015)[^nacol-2015][^rosenthal-2006]. In the *Fable*, Mandeville approaches this topic in terms of sacrificing one group of women to preserve the chastity and social status of another, since lustful men will inevitably find some way of satisfying their carnal desires, and the language that he uses to describe sex workers hardly invites much sympathy with their plight (FB I, 95–100). This is a topic that is explored further in *A Modest Defence of Publick Stews*—a pamphlet published anonymously in 1724 that is now widely attributed to Mandeville (although for evidence raising doubts about this attribution, see Ryan, Mahadevan, & Tolonen 2023: 41–46)—which sets out a case (whether sincerely or not) for the provision of public brothels. Up to a point, at least, *A Modest Defence* does show a little more concern for the welfare of sex workers, who would be less exposed to violence and disease if their trade was legalized and regulated.
