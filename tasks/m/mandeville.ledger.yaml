      While religion can have civic benefits, Mandeville was well aware that it often serves the ends of persecution and schism, amongst other evils. These are concerns that he discusses most fully in *Free Thoughts on Religion*, which attacks priestcraft and makes the case for tolerating all religious sects that recognize the authority of the government in matters of church and state (FT 140). Mandeville lays much of the blame for religious conflict with the clergy, while often aiming to reveal that they are just as vice-ridden as the laity. This involves little more than an application of his wider account of human nature. As “Pride and Ambition are so riveted in our Nature”, any group of people will seek to dominate and tyrannize others if given the opportunity to do so (FT 156). The clergy are certainly no exception, in this regard, and governments should therefore be extremely wary about entrusting any civil powers to the church. Mandeville’s analysis of the clergy is a good illustration of one of the broader political implications of his account of human nature: exposing the hypocrisy and self-centered motives behind our actions is one way of undermining the standing of those who appeal to their own moral credentials to wield power over others (see Douglass 2023: 117–118)[^douglass-2023].
    step1: |-
      宗教固然能带来公民层面的好处，曼德维尔却也清楚，它常常服务于迫害与分裂等恶事。这些问题他在《关于宗教的自由思想》中讨论得最充分；该书抨击教士权术，并主张容忍一切在教会与国家事务上承认政府权威的宗教派别（FT 140）。曼德维尔把宗教冲突的大部分责任归咎于教士，同时常常意在揭示他们与平信徒一样恶德缠身。这不过是他更宽泛人性说明的一次应用。既然“骄傲与野心如此牢固地铆在我们的本性之中”，任何一群人只要有机会，就会谋求支配和压制别人（FT 156）。就此而言，教士当然也不例外；因此，政府在把任何世俗权力托付给教会时都应极其谨慎。曼德维尔对教士的分析很好地说明了他人性说明的一项更广泛政治意涵：揭露我们行为背后的伪善与自我中心动机，是削弱那些诉诸自身道德资质来支配他人者之地位的一种方式（见 Douglass 2023: 117–118）[^douglass-2023]。
