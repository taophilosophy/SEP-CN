      然而在另一些情形中，曼德维尔采取另一种进路来揭示自爱之深：聚焦于我们对社会尊重的渴望。这里的关键激情是骄傲与羞耻；二者紧密配合，使我们念念不忘自己的名声，以及与别人相比的相对地位。骄傲使我们渴望赞扬与社会赞许，羞耻则使我们害怕非难与批评。曼德维尔主张，这些激情是数量惊人的人类行为背后的动力，促使我们按照流行的社会规范与期待来调节自身行为。这些激情如此强大，有时竟压过对死亡的恐惧；决斗之例最能说明这一点：对羞耻的恐惧使有荣誉感的男子冒着生命危险，以保住社会地位、避免被人视为懦夫（FB I, 334；FB II, 87–96）。在没那么极端的情形里，骄傲与羞耻习惯性地促使我们隐藏那些会招致社会非难的激情；因此，对于“我们为何经常做出看似热心公益的事、哪怕动机终究以自我为中心”，这两种激情在曼德维尔的解释中居于核心。
