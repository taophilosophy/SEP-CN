      The final three decades of the twentieth century witnessed a significant increase in scholarly interest in Mandeville, with several important book-length studies appearing in English, French, and Italian (Monro 1975; Primer 1975; Horne 1978; Carrive 1980, 1983; Scribano 1980; Goldsmith 1985; Jack 1987; Schneider 1987; Hundert 1994; Prior 2000)[^carrive-1980][^goldsmith-1985][^horne-1978][^hundert-1994][^jack-1987][^monro-1975][^primer-1975][^prior-2000][^schneider-1987][^scribano-1980]. As a result, Mandeville’s significance to the history of philosophy is now recognized within specialist circles, despite the fact that he is mainly remembered more widely for his infamous “private vices, public benefits” paradox. Even amongst historians of philosophy, attention has been mostly focused on *The Fable of the Bees* and there remains relatively little research dedicated to some of his lesser-known works, such as *The Virgin Unmask’d*, *A Treatise of the Hypochondriack and Hysterick Passions*, and *An Enquiry into the Origin of Honour*, which merit greater study if we are to fully appreciate the depth, range, and social implications of Mandeville’s philosophical investigations into human nature and society.
    step1: |-
      20 世纪最后三十年，学界对曼德维尔的兴趣显著增长，英语、法语和意大利语中出现了若干重要的专著（Monro 1975；Primer 1975；Horne 1978；Carrive 1980, 1983；Scribano 1980；Goldsmith 1985；Jack 1987；Schneider 1987；Hundert 1994；Prior 2000）[^carrive-1980][^goldsmith-1985][^horne-1978][^hundert-1994][^jack-1987][^monro-1975][^primer-1975][^prior-2000][^schneider-1987][^scribano-1980]。结果是，曼德维尔对哲学史的重要性如今在专业圈内已获承认，尽管在更广的范围内，人们记住他主要是因为那句臭名昭著的“私恶公利”悖论。即便在哲学史家当中，注意力也大多集中在《蜜蜂的寓言》上，对他一些不那么出名的著作——如《揭下面纱的处女》《疑病症与歇斯底里激情论》和《探究荣誉的起源》——研究仍然相对很少；而要充分领会曼德维尔对人性和社会的哲学探究之深度、范围与社会意涵，这些著作值得更多研究。
