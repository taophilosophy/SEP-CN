      *A Treatise of the Hypochondriack and Hysterick Passions*, first published in 1711 and later in an expanded edition (with a slightly different title) in 1730, brought Mandeville wider recognition and remained a notable reference point amongst physicians well into the late eighteenth century (Simonazzi 2016: 63–66)[^simonazzi-2016]. It also facilitated Mandeville’s entry into London’s medical circles, guided by the eminent physician and naturalist Sir Hans Sloane. In the *Treatise*, Mandeville employs a dialogue format to engage patients directly, highlighting the importance of their active participation in therapy. He examines the relationship between socioeconomic status and hypochondria, arguing that wealth, with its attendant fears and desires, contributes to the loss of animal spirits and psychosomatic ailments. The *Treatise* addresses broader philosophical themes beyond its focus on medical matters—while also offering some suggestive autobiographical remarks—and is thus a key text for understanding how Mandeville sought to combine a satirical and polemical approach with his wider scientific and philosophical goals (Hilton 2010)[^hilton-2010].
    step1: |-
      《疑病症与歇斯底里激情论》（*A Treatise of the Hypochondriack and Hysterick Passions*）初版于 1711 年，1730 年又出了扩充版（标题略有不同），为曼德维尔赢得了更广泛的认可，直到 18 世纪晚期仍是医生们常引的重要参照（Simonazzi 2016: 63–66）[^simonazzi-2016]。这本书也帮助他进入了伦敦的医学圈子，引路人是著名医生兼博物学家汉斯·斯隆爵士（Sir Hans Sloane）。在《论》中，曼德维尔采用对话体，直接与病人对话，强调病人积极参与治疗的重要性。他考察社会经济地位与疑病症之间的关系，主张财富连同随之而来的恐惧与欲望，会造成动物精气的丧失和身心疾病。除了医学问题，《论》还讨论更广泛的哲学主题，并提供了一些带有自传意味的暗示，因此是理解曼德维尔如何把讽刺与论辩手法同其更宽广的科学与哲学目标结合起来的关键文本（Hilton 2010）[^hilton-2010]。
    step2: |-
      《疑病症与歇斯底里激情论》（*A Treatise of the Hypochondriack and Hysterick Passions*）初版于 1711 年，1730 年又出了扩充版，标题略有不同。这本书为曼德维尔赢得了更广泛的认可，直到 18 世纪晚期，医生们仍常把它当作重要参照（Simonazzi 2016: 63–66）[^simonazzi-2016]。它也让曼德维尔打进了伦敦的医学圈子，引路人是著名医生兼博物学家汉斯·斯隆爵士（Sir Hans Sloane）。在《论》中，曼德维尔用对话体直接与病人交谈，强调病人积极参与治疗的重要性。他考察社会经济地位与疑病症的关系，主张财富连同随之而来的恐惧与欲望，会耗损动物精气，引发身心疾病。除了医学问题，《论》还涉及更广泛的哲学主题，并夹杂一些带有自传意味的暗示，因此是理解曼德维尔如何把讽刺与论辩手法同更宽广的科学、哲学目标结合起来的关键文本（Hilton 2010）[^hilton-2010]。
