      Born on 15 November 1670, in Rotterdam, the Netherlands, Bernard Mandeville hailed from a respected family of Dutch physicians, merchants, and political officials. He studied at Leiden University, known for its scholarly contributions to Cartesian and experimental philosophy. After earning degrees in philosophy and medicine, specializing in the connection between digestive disorders and psychology, Mandeville migrated to the British Isles, possibly due to his family’s involvement in the Costerman Riots of 1690 (Dekker 1992)[^dekker-1992]. In London, Mandeville worked as a physician from 1693, focusing on nervous disorders. He died in Hackney in 1733. Despite the fame that he had achieved by the end of his life, relatively little is known about his views beyond those that appear in his published works, due to the scarcity of personal correspondence or other available archival materials. Indeed, even identifying Mandeville’s published works is not without its challenges, since many originally appeared anonymously and, in some cases, his authorship was established only in the early decades of the twentieth century (see especially Kaye 1921; Anderson 1935)[^kaye-1921].
    step1: |-
      伯纳德·曼德维尔 1670 年 11 月 15 日生于荷兰鹿特丹，出身于一个受人尊敬的荷兰医生、商人与政治官员家庭。他求学于莱顿大学，该校以对笛卡尔哲学与实验哲学的学术贡献著称。取得哲学与医学学位、专攻消化紊乱与心理之间的联系之后，曼德维尔移居不列颠群岛，原因可能是其家族卷入 1690 年的科斯特曼骚乱（Costerman Riots）（Dekker 1992）[^dekker-1992]。在伦敦，曼德维尔自 1693 年起行医，专注于神经疾病。他于 1733 年卒于哈克尼。尽管他在生前已享有盛名，但除已刊著作中的观点外，人们对他的了解相对很少，因为个人书信及其他可用档案材料十分稀少。事实上，即便辨认曼德维尔的已刊著作也并非没有困难：许多著作最初匿名出版，有些情况下，他的作者身份直到 20 世纪最初几十年才被确定（尤见 Kaye 1921；Anderson 1935）[^kaye-1921]。
    step2: |-
      伯纳德·曼德维尔 1670 年 11 月 15 日生于荷兰鹿特丹，家族受人尊敬，出过好几代荷兰医生、商人和政界官员。他在莱顿大学求学，该校在笛卡尔哲学与实验哲学上贡献卓著。曼德维尔取得哲学和医学学位，专攻消化紊乱与心理之间的联系，随后移居不列颠群岛，原因可能是家族卷入了 1690 年的科斯特曼骚乱（Costerman Riots）（Dekker 1992）[^dekker-1992]。到伦敦后，他从 1693 年起行医，主治神经疾病，1733 年卒于哈克尼。曼德维尔生前已经成名，但除了已刊著作中的说法，人们对他的了解并不多，因为个人书信和其他可用档案材料都很稀少。其实，连辨认他有哪些已刊著作都不容易：许多书最初匿名问世，有些直到 20 世纪最初几十年才确认出自他手（尤见 Kaye 1921；Anderson 1935）[^kaye-1921]。
