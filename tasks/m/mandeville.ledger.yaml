      As his years in London progressed, Mandeville began to venture into prose publishing. *The Virgin Unmask’d* (1709) is one of his boldest yet least well-known works. It comprises nine dialogues between a young lady and her aunt, who discuss a range of topics from the inequalities between the sexes to matters of political economy and statecraft in European politics. Throughout his writings, Mandeville would maintain a keen interest in the role of women in society and the double standards they face in various aspects of life. This is a theme that he continued to explore in his wide-ranging contributions to the periodical *The Female Tatler*, consisting of thirty-two issues published in 1709–1710, which were written in response to the campaign for moral reform being advanced by Richard Steele in *The Tatler*. In these contributions, Mandeville analyzed the standards of female and male honor for the first time in print, along with many other topics to which he would later return, such as dueling, the social functions of pride and vanity, and the naturalistic origins of civil society (see Goldsmith 1985: 35–46; Peltonen 2003: 263–302)[^goldsmith-1985][^peltonen-2003].
    step1: |-
      随着在伦敦的岁月渐长，曼德维尔开始涉足散文出版。《揭下面纱的处女》（*The Virgin Unmask’d*，1709）是他最大胆、却最不为人知的作品之一。全书由九篇对话组成，对话双方是一位年轻小姐和她的姑母，话题从两性之间的不平等，一直到政治经济学与欧洲政治中的治国术，范围很广。终其一生，曼德维尔都对女性在社会中的角色、以及她们在生活各方面遭遇的双重标准保持浓厚兴趣。这一主题也延续到他在期刊《女性闲谈者》（*The Female Tatler*）上的大量撰稿中：该刊 1709–1710 年共出 32 期，正是为回应理查德·斯梯尔（Richard Steele）在《闲谈者》（*The Tatler*）上推动的道德改革运动而作。在这些文章里，曼德维尔首次在印刷品中分析了女性荣誉与男性荣誉的标准，还谈了许多后来会再回来的题目，如决斗、骄傲与虚荣的社会功能，以及公民社会的自然主义起源（见 Goldsmith 1985: 35–46；Peltonen 2003: 263–302）[^goldsmith-1985][^peltonen-2003]。
    step2: |-
      在伦敦住得越久，曼德维尔越往散文出版上使劲。《揭下面纱的处女》（*The Virgin Unmask’d*，1709）是他最大胆、却最不为人知的作品之一。全书九篇对话，发生在一位年轻小姐和她的姑母之间，话题从两性不平等一直扯到政治经济学和欧洲政治中的治国术。曼德维尔一生都对女性在社会中的角色、对她们在生活各处遭遇的双重标准抱有浓厚兴趣。这一主题也延续到他为期刊《女性闲谈者》（*The Female Tatler*）写的大量文章里：该刊 1709–1710 年共出 32 期，为回应理查德·斯梯尔（Richard Steele）在《闲谈者》（*The Tatler*）上推动的道德改革运动而作。曼德维尔在这些文章中首次以印刷文字分析女性荣誉与男性荣誉的标准，还涉及许多他日后会再捡起的题目，如决斗、骄傲与虚荣的社会功能，以及公民社会的自然主义起源（见 Goldsmith 1985: 35–46；Peltonen 2003: 263–302）[^goldsmith-1985][^peltonen-2003]。
