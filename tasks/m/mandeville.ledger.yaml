      曼德维尔关于女性的观点并不总是一贯朝向女性主义方向，最明显的表现是他为把卖淫当作较小恶而加以容忍所提出的理由（论此可参见 Rosenthal 2006: 42–69；Nacol 2015）[^nacol-2015][^rosenthal-2006]。在《寓言》中，曼德维尔从牺牲一群女性以保全另一群女性的贞洁与社会地位的角度处理这个话题，因为好色的男人总会找到某种方式满足肉欲；而他描述性工作者时所用的语言，很难让人对她们的处境生出多少同情（FB I, 95–100）。这个话题在《为公共妓院一辩》中得到进一步探讨——这本 1724 年匿名出版的小册子如今被广泛归到曼德维尔名下（不过有证据对这一归属提出疑问，见 Ryan, Mahadevan, & Tolonen 2023: 41–46）——该书（无论真诚与否）为设立公共妓院提出了一套论证。至少在一定程度上，《为公共妓院一辩》确实表现出对性工作者福祉的些许关切：如果这一行业合法化并受到规范，她们会较少遭受暴力与疾病。
