      ### 3.3 The question of sincerity
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      Given the ambiguities, equivocations, and perhaps even contradictions in Mandeville’s analysis of virtue, it is unsurprising that readers remain divided over how to make sense of his position. The main source of disagreement, however, is not so much the question of Mandeville’s consistency as that of his sincerity. He *says* that the *Fable* “is a Book of severe and exalted morality, that contains a strict Test of Virtue” (FB I, 404–405), but is this what he really *means*? Many of his contemporaries took the *Fable* to be a celebration of vice and an attack on virtue and Christianity, with Mandeville’s claims to the contrary treated as an insincere guise adopted to deflect criticism and censure.
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      The main reason Mandeville’s sincerity has frequently been doubted is that he appears to revel in highlighting the most scandalous implications of his own analysis. His tone is often humorous or playful, and, despite what he says, if the road to worldly prosperity and glory diverges from the road to virtue, then Mandeville seems relatively untroubled by the fact that we invariably choose the former. Indeed, he repeatedly criticizes those—especially the clergy—who complain about the moral degeneracy of society while being far from paragons of virtue themselves. That Mandeville aimed to expose the hypocrisy of such people is beyond doubt, yet it is less clear what the implications are for understanding his own moral philosophy. Some commentators have read Mandeville as a libertine or hedonist, whose rigoristic definition of virtue was insincere and adopted solely for satirical purposes (e.g., Viner 1953 [1991: 178–182]; Harth 1969; Nieli 1989)[^harth-1969][^nieli-1989][^viner-1953]. Others, by contrast, have not only taken Mandeville’s rigorism seriously, but even suggested that he saw his philosophy as resting firmly on Christian foundations (e.g., Chiasson 1970; Crisp 2019: 60–73)[^chiasson-1970][^crisp-2019]. Another influential view is that there is a genuine tension between Mandeville’s rigoristic conception of virtue and the more general empiricist bent of his philosophy, with the latter aligning more closely with utilitarianism (Kaye 1924a: lii–lvi)[^kaye-1924a].
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      When approaching these debates, it is helpful to consider the *scope* of Mandeville’s moral philosophy and its relationship with his social and political ideas. In theory, at least, one could be a moral rigorist at the level of individual ethics and nonetheless think that utilitarian concerns are more appropriate in the political sphere—the key point, for Mandeville, is that political questions should be evaluated without relying on any particular theory of individual ethics (see Maxwell 1951)[^maxwell-1951]. More generally still, it is worth recalling that one of Mandeville’s main goals was not to tell us how we ought to behave, but to explain how we do behave (FB I, 39). Insofar as this goal applies to his moral philosophy, we will likely go astray if we assume that Mandeville was concerned with defending a particular ethical position that we should strive to identify. His moral philosophy may be better understood as an investigation into the role that moral concepts, such as virtue and vice, play in our social lives. This explanatory project, which seeks to make sense of moral ideas as social phenomena, extends well beyond his conceptions of virtue and vice to encompass a wide range of social and political norms.
    step1: TBD
    step2: TBD
