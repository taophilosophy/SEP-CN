      Observing human nature accurately, however, is no easy task. Mandeville suggests that many people go astray either by moralizing about how we should behave, rather than focusing on how we really do behave (FB I, 39), or by assuming that we possess certain qualities that elevate us above other animals. The latter concern is especially evident in Mandeville’s changing views on whether humans possess an immaterial soul (see Simonazzi 2008: 119–128)[^simonazzi-2008]. While studying at the University of Leiden, Mandeville had written a dissertation (*Disputatio Philosophica de Brutorum Operationibus* [1689]; translated in McKee 1991)[^mckee-1991] endorsing the Cartesian view that non-human animals are incapable of anything approaching human consciousness, yet he would increasingly come to repudiate this position as he sought to uncover the more animalistic aspects of human nature (Callanan 2025: 23–45)[^callanan-2025]. We are conscious of thinking ourselves, so if we assume that matter is incapable of thought then it makes sense to conclude that we possess an immaterial soul. Yet Mandeville argues that our struggle to comprehend the idea of thinking matter reveals more about the limitations of human knowledge than it does about the properties of matter. The notion that an immaterial soul can act upon the body (and vice versa) poses at least as many difficulties as the idea that matter can produce thought and consciousness. What is more, Mandeville stresses that the reason many philosophers have insisted that we possess an immaterial and immortal soul is not because this is the most plausible inference to draw from a thorough examination of human nature, but rather because it is a pleasing idea that makes us feel better about ourselves. It is an idea that flatters our self-love and pride, in other words, which means that most people will be inclined to endorse it even in the absence of any compelling evidence (TH 59–60, 100–102; FB I, 230).
    step1: |-
      然而，准确地观察人性并非易事。曼德维尔认为，许多人之所以走岔路，要么是因为他们只就人应当如何行为作道德说教，而不去看人实际如何行为（FB I, 39）；要么是因为他们假定人具有某些使我们高居于其他动物之上的品质。后一种毛病尤其体现在曼德维尔关于人是否拥有非物质的灵魂这一看法的变化中（见 Simonazzi 2008: 119–128）[^simonazzi-2008]。在莱顿大学求学时，曼德维尔曾写过一篇学位论文（《论禽兽的活动》，*Disputatio Philosophica de Brutorum Operationibus* [1689]；英译见 McKee 1991）[^mckee-1991]，赞同笛卡尔式的观点：非人动物不可能具有任何接近人类意识的东西。但他后来日益摒弃这一立场，因为他要揭示人性中更具动物性的一面（Callanan 2025: 23–45）[^callanan-2025]。我们意识到自己在思维，因此，如果假定物质不能思维，那么结论似乎就是：我们拥有非物质的灵魂。但曼德维尔认为，我们难以理解“思维着的物质”这一观念，这更多说明人类知识的限度，而非物质的属性。非物质灵魂能作用于身体（以及反过来）这一说法，至少和物质能产生思维与意识这一说法一样困难重重。更重要的是，曼德维尔强调，许多哲学家坚称我们拥有非物质的、不朽的灵魂，并不是因为这是彻底考察人性后最合理的推论，而是因为这是一个讨人喜欢的观念，能让我们对自己感觉更好。换言之，这是一个迎合我们自爱与骄傲的观念，因此大多数人即便没有任何有力的证据，也倾向于接受它（TH 59–60, 100–102；FB I, 230）。
    step2: |-
      不过，准确观察人性绝非易事。曼德维尔认为，许多人走岔路，要么是因为只就人应当如何行为作道德说教，不看人实际如何行为（FB I, 39）；要么是因为假定人具有某些品质，足以让我们高踞于其他动物之上。后一种毛病，尤其见于曼德维尔对“人是否有非物质灵魂”这一问题的看法变化（见 Simonazzi 2008: 119–128）[^simonazzi-2008]。在莱顿大学求学时，他写过一篇学位论文《论禽兽的活动》（*Disputatio Philosophica de Brutorum Operationibus* [1689]；英译见 McKee 1991）[^mckee-1991]，赞同笛卡尔式的观点：非人动物不可能有任何接近人类意识的东西。但后来他日益摒弃这一立场，因为要揭示人性中更具动物性的一面（Callanan 2025: 23–45）[^callanan-2025]。我们意识到自己在思维；那么，如果假定物质不能思维，结论似乎就是：我们拥有非物质的灵魂。但曼德维尔认为，我们难以理解“思维着的物质”，这更多暴露了人类知识的限度，而不是物质的属性。非物质灵魂能作用于身体（以及反过来），这个说法至少和“物质能产生思维与意识”一样困难重重。更重要的是，曼德维尔强调，许多哲学家坚称我们拥有非物质的、不朽的灵魂，并非因为这是彻底考察人性后最合理的推论，而是因为这是个讨人喜欢的观念，能让我们对自己感觉更好。换言之，它迎合我们的自爱与骄傲，所以大多数人即便拿不出任何有力证据，也倾向于接受（TH 59–60, 100–102；FB I, 230）。
