      ## 3. Moral Philosophy
    step1: TBD
    step2: TBD
  - id: 32
    kind: body
    source: |-
      The area of Mandeville’s thought that has generated the greatest debate is undoubtedly his moral philosophy. Amongst many competing views, he has been read as a sceptic who aims to expose morality as a political trick while subverting the prevailing moral standards of his day, as a moral rigorist who seeks to demonstrate that much of our behavior falls considerably short of the demands of virtue, and as a utilitarian who holds that what really matters is the consequences of our actions and not the motives behind them (for an extensive survey, see Monro 1975: 178–248)[^monro-1975]. Our aim presently is not to pass judgement on the validity of these or other interpretations. Instead, we focus on some of the key questions and puzzles that arise from the most influential statement of Mandeville’s moral philosophy, “An Enquiry Into the Origin of Moral Virtue”, in which he explains how humans could have acquired ideas of virtue and vice without knowledge of revealed religion.
    step1: TBD
    step2: TBD
  - id: 33
    kind: body
    source: |-
      ### 3.1 The origin of moral virtue
    step1: TBD
    step2: TBD
  - id: 34
    kind: body
    source: |-
      In setting out his account of the origin of virtue, Mandeville addresses the problem of what leads us to act in ways that advance the interests of other people and the community. As we have seen, Mandeville thinks that we are fundamentally self-centered creatures, which means that we would only resist our natural appetites and inclinations if we anticipate some personal gain from doing so. Instead of providing individuals with tangible goods, Mandeville suggests that “lawgivers”—a broad concept that often encompasses those with the authority to establish moral rules—would have used praise and contempt as foundational tools to civilize humanity. Those who resist their selfish inclinations and act in ways that benefit others would be rewarded with praise, while those who indulge their appetites without regard to the public good would be held in contempt. It is on this basis, Mandeville argues, that everyone would have come to agree on definitions of virtue and vice. All acts where someone gratifies their appetites in a way that could prove socially detrimental would be counted as vices, with the term virtue reserved for acts where someone resists their natural impulses and endeavors “the Benefit of others, or the Conquest of his own Passions out of a Rational Ambition of being good” (FB I, 42–49).
    step1: TBD
    step2: TBD
  - id: 35
    kind: body
    source: |-
      On this account, we hold certain ideas of virtue and vice only because doing so is in everyone’s interest. Where those who approximate this standard of virtue have an interest in being esteemed as virtuous, those who fall short of this standard nevertheless have an interest in encouraging others to perform acts from which they benefit. Mandeville maintains that the earliest formulation of these ideas was an invention of ambitious lawgivers or politicians who wanted to govern people more easily. He describes the distinction between virtue and vice as “the Contrivance of Politicians”, and memorably declares that “the Moral Virtues are the Political Offspring which Flattery begot upon Pride” (FB I, 50–51). These assertions outraged many of Mandeville’s contemporaries, who accused him of bringing the idea of virtue into disrepute by denying the reality of moral distinctions. Mandeville’s explanation of how we acquire notions of virtue and vice implicitly rejects views of morality widely held at the time, such as the idea that we have an innate moral sense that allows us to understand the distinction between right and wrong, or that moral obligations can be deduced by right reason as precepts of natural law. By contrast, his critics argued, Mandeville’s account presents our ideas of virtue and vice as arbitrary, in the sense that these notions are dependent upon human will and agreement alone, rather than being based on any immutable or eternal standards (see e.g., Fiddes 1724: xvi; Law 1724: 22–23; Bluet 1725: 108–109, 136)[^bluet-1725][^fiddes-1724][^law-1724]. This worry was exacerbated by the fact that Mandeville elsewhere flirts with moral relativism, highlighting examples of how moral codes vary in different cultures to challenge the idea that virtue and vice are “permanent Realities that must ever be the same in all Countries and all Ages” (FB I, 324, 330–331).
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      As his critics also pointed out, the role of wise lawgivers or politicians in Mandeville’s account is somewhat question-begging, as it remains unclear how they attained the knowledge required to civilize everyone else (e.g., Bluet 1725: 25–28)[^bluet-1725]. Yet Mandeville’s later works do not rely on these figures to anywhere near the same degree, and, when they are invoked, he explains their inventions as the joint labor of numerous people over many ages (OH 40–41). He still maintains that humans do not naturally possess any equitable or reasonable notions of right and wrong (FB II, 223–224), arguing instead that we would have come to acquire such notions only through a long period of socialization. He also insists that this explanation does not involve denigrating virtue, as his critics had objected. Comparing the excellence of virtue to axioms of mathematics, Mandeville allows that it makes sense to call these eternal truths in a figurative sense, but the key point is that a great deal of learning is needed to discover them. To stress the difficulties involved in arriving at these truths, however, is not to deny their existence (OH vii–viii).
    step1: TBD
    step2: TBD
  - id: 37
    kind: body
    source: |-
      One way of understanding Mandeville’s position is that, given certain background facts about human nature and social interaction, ideas of virtue and vice are necessary for societies to function effectively. The distinction between virtue and vice is socially advantageous, in other words, and we must have come to understand moral concepts in a certain way to facilitate social order and cooperation. If this way of reading Mandeville’s position helps to evade the worry that he denied the reality of moral distinctions, it may nonetheless run into tension with his infamous “private vices, public benefits” thesis (see Bluet 1725: 23–24)[^bluet-1725]. On the one hand, *The Grumbling Hive* verse suggests that if vices were rooted out of society and everyone became virtuous then economic and social ruin would ensue. On the other hand, Mandeville argues that ideas of virtue and vice are required to ensure that we live peacefully together. Even if these two strands of his thought can be reconciled, doing so is far from straightforward (for further discussion, see Monro 1975, 203–209)[^monro-1975].
    step1: TBD
    step2: TBD
