      Mandeville clarifies that self-liking is the underlying cause of passions such as pride and shame (FB II, 131–132; OH 3–4, 12–13). Where self-love explains why we are concerned with matters of sustenance and security, self-liking explains why we care about our reputation and social standing (FB II, 133–134). The significance and bearing of the distinction between self-love and self-liking for Mandeville’s wider philosophy remains a matter of debate, with scholars disagreeing on the extent to which it constitutes a refinement or a repudiation of Mandeville’s earlier self-love thesis, and on whether the introduction of self-liking reflects a more general change in the character of his moral and social philosophy between the different editions of the *Fable* (see especially Hundert 1994: 53–55, 137–139; Tolonen 2013: 41–102; Maurer 2019: 60–64; Douglass 2023: 35–38, 62–67; Callanan 2025: 242–253)[^callanan-2025][^douglass-2023][^hundert-1994][^maurer-2019][^tolonen-2013].
