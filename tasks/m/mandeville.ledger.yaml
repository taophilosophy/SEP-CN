      Although the public reception of Mandeville’s work in 1720s Britain was largely hostile, it swiftly elevated him to fame (for a collection of responses, see Stafford 1997)[^stafford-1997]. By 1732, over 300 reports on the *Fable* had appeared in the British press (Revolti 2016)[^revolti-2016], and Benjamin Franklin sought to meet Mandeville when he came to London in 1725. A strong case can also be made that Mandeville’s mature philosophy proved very influential in the Scottish and wider European Enlightenment, with some of his key ideas being developed by David Hume, Jean-Jacques Rousseau, and Adam Smith, amongst others (see, e.g., Castiglione 1986; Goldsmith 1988; Hundert 1994; Robertson 2005: 256–324; Heath 2014)[^castiglione-1986][^goldsmith-1988][^heath-2014][^hundert-1994][^robertson-2005]. Even when these philosophers criticized Mandeville directly, they appear to have adopted some of his key insights about the evolution of social norms and the importance of passions such as self-liking (or, in Rousseau’s lexicon, *amour-propre*) that lead us to care deeply about our social standing.
    step1: |-
      尽管曼德维尔的作品在 1720 年代英国的公众接受大体上是敌意的，它却迅速把他推成了名人（回应文集见 Stafford 1997）[^stafford-1997]。到 1732 年，英国报刊上已出现 300 多篇关于《寓言》的报道（Revolti 2016）[^revolti-2016]；本杰明·富兰克林 1725 年来伦敦时，还设法求见曼德维尔。也有充分理由认为，曼德维尔成熟的哲学在苏格兰乃至整个欧洲启蒙运动中影响巨大，他的一些关键观念由大卫·休谟、让-雅克·卢梭和亚当·斯密等人加以发展（例见 Castiglione 1986；Goldsmith 1988；Hundert 1994；Robertson 2005: 256–324；Heath 2014）[^castiglione-1986][^goldsmith-1988][^heath-2014][^hundert-1994][^robertson-2005]。即便这些哲学家直接批评曼德维尔，他们似乎也采纳了他的一些关键洞见：社会规范如何演化，以及自矜之类激情（在卢梭的词汇里是 *amour-propre*）如何重要——正是这些激情让我们深切在乎自己的社会地位。
