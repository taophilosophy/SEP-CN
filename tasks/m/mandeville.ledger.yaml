      In 1732, Mandeville also published *A Letter to Dion*, in response to George Berkeley’s criticisms of the *Fable*. Mandeville protested that his critics had frequently misrepresented his ideas and intentions, in part so that they could divert attention from the ways in which the *Fable* exposed their own hypocrisy and moral shortcomings (Tolonen 2022)[^tolonen-2022]. To some extent, however, Mandeville’s paradoxical and satirical style invited criticism and perhaps even misunderstanding. He did not write systematic philosophical treatises, which has posed considerable obstacles for both his contemporaries and later readers who have attempted to grasp his overall philosophical stance. Nonetheless, and as we shall see, his works are characterized by a sustained and serious attempt to improve our understanding of a wide range of social and political phenomena through an in-depth analysis of human nature.
    step1: |-
      1732 年，曼德维尔还出版了《致狄翁的一封信》（*A Letter to Dion*），回应乔治·贝克莱（George Berkeley）对《寓言》的批评。曼德维尔抗辩说，批评者常常曲解他的观点和意图，部分是为了转移视线，不让人注意《寓言》如何暴露了他们自己的伪善与道德短处（Tolonen 2022）[^tolonen-2022]。然而在某种程度上，曼德维尔那种悖论式、讽刺式的文风本身就招致批评，甚至可能招致误解。他没有写过系统的哲学论著，这给他同时代的读者、也给后来试图把握其整体哲学立场的读者造成了相当大的障碍。不过，正如我们将会看到的，他的著作有一个一贯而严肃的追求：通过深入分析人性，增进我们对广泛社会现象与政治现象的理解。
