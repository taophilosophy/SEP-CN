      Reviewing Rousseau’s *Discours sur l’origine et les fondements de l’inégalité parmi les hommes*, Smith (1756 [1980: 250]) claimed that “the second volume of the Fable of the Bees has given occasion to the system of Mr. Rousseau”, noting that they both denied natural sociability and set out accounts of how humans gradually come to acquire the qualities required to live together in society. Indeed, one of the most striking features of Mandeville’s conjectural history of society is that it implicitly rejects the social contract approaches associated with political philosophers like Thomas Hobbes and John Locke, and instead places much more emphasis on how conventions of justice and politeness could have emerged over time—an approach that would be developed further and more famously in Hume’s *A Treatise of Human Nature* (Tolonen 2013)[^tolonen-2013]. Similarly, Mandeville’s naturalistic explanation of how language first developed may well have influenced Étienne Bonnot de Condillac and helped to shape subsequent debates on the origin of language (Kaye 1924b; Schreyer 1978; Hundert 1994: 86–115)[^hundert-1994][^kaye-1924b][^schreyer-1978].
    step1: |-
      斯密（1756 [1980: 250]）在评论卢梭的《论人类不平等的起源和基础》（*Discours sur l’origine et les fondements de l’inégalité parmi les hommes*）时声称，“《蜜蜂的寓言》第二卷给了卢梭先生的体系以契机”，并指出两人都否认人天生具有社会性，都说明了人类如何逐渐获得共同生活在社会中所需要的品质。的确，曼德维尔社会推测史最引人注目的特点之一，是它暗中否弃了托马斯·霍布斯、约翰·洛克等政治哲学家所代表的社会契约进路，而把更多分量放在正义与礼貌的习俗如何随时间形成之上——这一进路在休谟的《人性论》（*A Treatise of Human Nature*）中得到了更充分、也更著名的发挥（Tolonen 2013）[^tolonen-2013]。同样，曼德维尔对语言最初如何发展的自然主义解释，很可能影响了艾蒂安·博诺·德·孔狄亚克，并塑造了此后关于语言起源的争论（Kaye 1924b；Schreyer 1978；Hundert 1994: 86–115）[^hundert-1994][^kaye-1924b][^schreyer-1978]。
