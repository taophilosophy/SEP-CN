      ### 5.2 Nineteenth-century reception
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      Mandeville’s ideas continued to captivate the minds of important thinkers during the nineteenth century, sparking debates that extended into the twentieth century and beyond. For example, Karl Marx (1867 [1976: 764–765]) quoted at length from Mandeville’s discussion of the utility of poverty, which he regarded as a brutally honest assessment of the extent to which a thriving capitalist economy depends upon a poor underclass being kept at subsistence level. In addition, Marx (1867 [1976: 475]) claimed that parts of Adam Smith’s analysis of the division of labor were “copied almost word for word” from Mandeville. Other influential thinkers also turned to Mandeville’s ideas for insights into explaining complex societal phenomena. In particular, his attempts to naturalize social norms and institutions by charting their historical origins gave rise to questions about the relationship between individual behavior and collective outcomes that would dominate later social science, and which were taken up in very different ways in (for example) Thomas Malthus’s work on population dynamics and Jeremy Bentham’s account of utilitarianism (Gaukroger 2016: 267–302)[^gaukroger-2016]. Perhaps most notably, Charles Darwin appears to have read the second volume of the *Fable* closely and may have drawn inspiration from Mandeville’s conjectural history when developing his own evolutionary theory, recognizing its relevance for thinking through how unintended consequences and gradual change could relate to processes of natural selection (Alter 2008)[^alter-2008].
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      The nineteenth century also witnessed more systematic attempts to categorize Mandeville’s thought. This intellectual endeavor found fertile ground in Germany, where a flourishing school of scholarship emerged around Mandeville’s ideas in the later part of the century. One notable milestone was Paul Sakmann’s seminal work, *Bernard de Mandeville und die Bienenfabel-controverse* (1897), to which F. A. Hayek would later acknowledge a significant debt (Nolan 2016)[^nolan-2016]. Parallel to the burgeoning interest in Germany, the categorization of Mandeville’s intellectual contributions also gained momentum in Britain. Mandeville’s impact endured throughout the nineteenth century in England, as is evident from references to him in general magazines and other thinkers’ works, especially in relation to discussions of ethics, economics, and human behavior. One staunch advocate of Mandeville was James Crossley, a celebrated collector and champion of Epicurean moral philosophy, who actively fostered dialogues around Mandeville’s writings, consolidating his prominence in the intellectual milieu of the time (Tolonen 2010: 29)[^tolonen-2010]. Mandeville’s importance to the history of moral philosophy was further established with the publication of Leslie Stephen’s *Essays on Freethinking and Plainspeaking* (1873: 243–278) and *The History of English Thought in the Eighteenth Century* (1876: 15–46), which presented Mandeville and Shaftesbury as occupying the poles between which subsequent British moral philosophy had to navigate.
