      Mandeville’s definitions of virtue and vice admit of many ambiguities, giving rise to debates about whether he has a consistent account of the requirements of virtue, and, if so, whether those requirements place virtue beyond human reach (see Colman 1972; Douglass 2020)[^colman-1972][^douglass-2020]. Leaving aside the question of his sincerity, for the moment, two features of his expressed position are relatively uncontroversial. First, virtuous actions require self-denial. This is clear from Mandeville’s initial definition of virtue (FB I, 48–49), and it is a point that he emphasizes repeatedly when setting his ideas out against Shaftesbury (e.g., FB I, 323, 331; FB II, 108–109). Second, whether an act is virtuous depends on the motive from which someone acts (FB I, 56, 260–261). While this much is straightforward, complications soon arise once we start to interrogate these requirements further.
    step1: |-
      曼德维尔对德性与恶德的定义有许多含混之处，由此引发争论：他对德性要求是否有一套前后一致的说明？若有，这些要求是否使德性超出了人类力所能及的范围（见 Colman 1972；Douglass 2020）[^colman-1972][^douglass-2020]。暂时撇开他是否真诚的问题，他明确表达过的立场有两个特征相对没有争议。第一，有德的行为要求自我克制。这一点从曼德维尔最初对德性的定义即可看清（FB I, 48–49），也是他在把自己的观点与沙夫茨伯里对置时反复强调的一点（例见 FB I, 323, 331；FB II, 108–109）。第二，一个行为是否有德，取决于人出于何种动机行动（FB I, 56, 260–261）。这些还算直白；可一旦进一步追问这些要求，麻烦很快就来了。
