      On Mandeville’s evolutionary account of society, the variation we observe in norms and behavior is a result of education and socialization, with human nature remaining constant throughout. There is no difference, he claims, “between the original Nature of a Savage, and that of a civiliz’d Man” (FB II, 214); they both possess the same passions, but these are cultivated differently due to the social environments in which they are raised. Much the same applies when it comes to his analysis of gender roles, and across his works Mandeville challenges many of the assumptions held at the time regarding the supposedly natural differences between the sexes.
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      Mandeville’s views on women are not especially well-known (although for notable contributions, see Goldsmith 1986; O’Brien 2009: 19–27; Branchi 2022: 38–55; Callanan 2025: 71–97)[^branchi-2022][^callanan-2025][^goldsmith-1986][^o’brien-2009]. In part, this is because some of his most striking contributions are found in his least famous works. In both *The Virgin Unmask’d* and his contributions to *The Female Tatler*, Mandeville adopts a dialogue format with a range of female characters expressing many of his most important ideas. In the “Preface” to the former, he announces that his aim “is to let young Ladies know whatever is dreadful in Marriage”. Every married woman, one of his characters declares, is “a Slave to her Husband”, with the respect and affection that men display towards women being no more than an outward show that serves to conceal the reality of subordination (VU 127–128). As well as exposing the extent—and sometimes brutal violence—of women’s oppression in the domestic sphere, the female interlocutors in *The Virgin Unmaks’d* also discuss Louis XIV’s politics in considerable detail, with Mandeville thereby implying that educated women can analyze the public sphere with a level of insight that many of his contemporaries would have considered the preserve of men alone. In a similar vein, some of Mandeville’s contributions to *The Female Tatler* return to the idea that marriage is akin to slavery, while also providing examples of women who have excelled in learning, valor, and other such qualities. The reason so few women have been recognized as great or virtuous is simply that they live under “the Injustice and Tyranny of the Men”, who, like all conquerors, endeavor to keep their captives ignorant for fear of otherwise losing their dominion (EFT, especially 171–174).
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      Mandeville’s views on women do not always point so straightforwardly in a feminist direction, as is most evident in the considerations that he raises for tolerating sex work as a lesser evil (on which, see Rosenthal 2006: 42–69; Nacol 2015)[^nacol-2015][^rosenthal-2006]. In the *Fable*, Mandeville approaches this topic in terms of sacrificing one group of women to preserve the chastity and social status of another, since lustful men will inevitably find some way of satisfying their carnal desires, and the language that he uses to describe sex workers hardly invites much sympathy with their plight (FB I, 95–100). This is a topic that is explored further in *A Modest Defence of Publick Stews*—a pamphlet published anonymously in 1724 that is now widely attributed to Mandeville (although for evidence raising doubts about this attribution, see Ryan, Mahadevan, & Tolonen 2023: 41–46)—which sets out a case (whether sincerely or not) for the provision of public brothels. Up to a point, at least, *A Modest Defence* does show a little more concern for the welfare of sex workers, who would be less exposed to violence and disease if their trade was legalized and regulated.
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      A recurring theme throughout Mandeville’s various discussions of women is the way that norms of chastity and female modesty are socially constructed and inculcated in young girls from a very early age. Girls are taught to feel ashamed of displaying their legs, for example, long before they could have any understanding of why this is deemed inappropriate. There is nothing natural about the different standards of modesty for men and women, Mandeville maintains, which should instead be understood as the consequence of education alone (FB I, 72–73). Chastity is the basis of female honor in much the same way as courage is the basis of male honor. Where soldiers risk their lives in battle for fear of being thought cowardly, educated women fend off the advances of men, while resisting their own sexual desires, for fear of being thought promiscuous. Even if these examples strike readers today as somewhat archaic, they nonetheless serve to illustrate Mandeville’s broader point: shame is the underlying passion that leads all of us to care deeply about our reputation, even though what is taken to be shameful is determined by the prevailing social norms and will thus vary in different times and places, and amongst those of different social status.
