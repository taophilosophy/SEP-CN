      20 世纪来临之际，曼德维尔的著作已成为稀见的实体文物，很难弄到他的书。Frederick Benjamin Kaye 在补救这一点、并推动曼德维尔接受史上起了关键作用。他编辑的两卷本《蜜蜂的寓言》——1924 年由 Clarendon Press 首次出版，1988 年由 Liberty Fund 重印——重塑了阅读曼德维尔的格局。Kaye 的影响如此之大，以致早先的许多学术研究几乎黯然失色；自此以后，他的版本在让当代学生与学者更容易接近曼德维尔思想上，也一直扮演着不可或缺的角色。
