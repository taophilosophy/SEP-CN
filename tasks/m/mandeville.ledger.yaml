      曼德维尔在《疑病症与歇斯底里激情论》里勾勒的正是这样一条进路。他声称人类知识“只能来自后验”（TH 100）。他贬斥那些仅凭理性搭起抽象体系、却不为思辨寻求经验支持的医生。他主张，医生的技艺立足于实践知识：从积累的经验中观察模式，再提出能解释现有证据的合理假说（TH，尤见 61–63、91）。在《蜜蜂的寓言》里，曼德维尔有时也以类似口吻说明自己的方法：即便为晦涩社会现象提出思辨性猜测，推理仍以“人人对人都能做出的明白观察”为据（FB II, 128）。
