      One striking feature of Mandeville’s analysis of the working poor is that he does not allow that the desire for social standing and esteem could reliably motivate people to perform menial labor. Given the importance that he elsewhere accords to pride, envy, and emulation in stimulating the demand for luxury goods, Mandeville’s discussion of the motivations of the laboring poor may seem at odds with his more general account of human nature (Pongiglione & Tolonen 2016: 89–93)[^pongiglione-2016]. Adam Smith (1759 [1976: 50]) would later remark that it “is chiefly from this regard to the sentiments of mankind, that we pursue riches and avoid poverty”, and the thought that what drives the economy is not the desire for material possessions as much as the status and good opinion that wealth confers fits well with much of Mandeville’s analysis of human nature. When it comes to the working classes, however, he contends that it is only economic necessity, and not the desire for social esteem, that can secure the labor supply of a prosperous economy.
    step1: |-
      曼德维尔对穷苦劳动者的分析有一个引人注目的特点：他不承认对社会地位与尊重的渴望能可靠地驱使人去做卑贱的体力活。鉴于他在别处极为重视骄傲、嫉妒与效仿在刺激奢侈品需求方面的作用，曼德维尔关于劳动穷人动机的讨论，似乎与他更一般的人性说明不一致（Pongiglione & Tolonen 2016: 89–93）[^pongiglione-2016]。亚当·斯密（1759 [1976: 50]）后来指出，“我们追求财富、躲避贫穷，主要正是出于对世人情感的在意”；而认为驱动经济的与其说是对物质的占有欲，不如说是财富带来的地位与好评——这一想法与曼德维尔人性分析的许多部分十分契合。然而，一涉及劳动阶级，他就主张：只有经济上的必要性，而非对社会尊重的渴望，才能保障繁荣经济的劳动力供给。
