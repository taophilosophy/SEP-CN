      Once civil society is established, Mandeville thinks that the government has a crucial role to play in maintaining social order. That role, however, does not involve radically transforming the political and social institutions that have developed over time, but rather ensuring that those institutions continue to function effectively. A well-constituted society is analogous to a well-designed clock, in this respect, which will continue to operate by itself so long as people remember to wind it up. This means that civil societies can be governed effectively by people who do not possess any extraordinary knowledge or virtues (FB II, 322–324). Civil society is a complex arrangement and those who tamper with its roots—by clamoring for a moral reformation, for instance—will invariably do more harm than good. Mandeville develops this line of thought further elsewhere, claiming that, rather than depending upon the qualities of virtuous politicians, the best constitution is that “which provides against the worst Contingencies … and preserves itself firm and remains unshaken, though most Men should prove Knaves” (FT 167). In advancing this case, Mandeville breaks sharply from the classical republican tradition that had stressed the importance of civic virtue in public life, instead setting out an approach to understanding politics now more often associated with Hume’s analysis of constitutional government (Moore 1977: 824–826)[^moore-1977].
    step1: |-
      一旦公民社会建立起来，曼德维尔认为政府在维持社会秩序方面扮演关键角色。然而，这一角色并不涉及彻底改造历经时间发展而成的政治制度与社会制度，而是确保这些制度继续有效运作。就此而言，一个建构良好的社会类似于一台设计良好的钟：只要人们记得上发条，它就会自行运转。这意味着，公民社会可以由并不具备任何非凡知识或德性的人有效治理（FB II, 322–324）。公民社会是一种复杂的安排；那些从根基上胡乱摆弄它的人——例如叫嚷着要进行道德改革的人——必定弊大于利。曼德维尔在别处进一步发展了这一思路，声称最好的宪制并不依赖有德政治家的品质，而是“能防范最坏的偶然情形……并且，即便大多数人被证明是恶棍，也能保持自身稳固、不为所动”（FT 167）。在提出这一论点时，曼德维尔与强调公共生活中公民德性之重要的古典共和传统彻底决裂，转而提出一种理解政治的进路，这种进路如今更常与休谟对宪政政府的分析联系在一起（Moore 1977: 824–826）[^moore-1977]。
    step2: |-
      公民社会一旦建立，曼德维尔认为政府在维持社会秩序上就扮演关键角色。不过，这个角色不是要彻底改造历经时间发展而成的政治制度和社会制度，而是要确保它们继续有效运作。就此而言，一个建构良好的社会就像一台设计良好的钟：只要人们记得上发条，它自己就会走。这意味着，公民社会可以由并不具备任何非凡知识或德性的人有效治理（FB II, 322–324）。公民社会是一种复杂的安排；谁要是从根基上胡乱摆弄它——比如叫嚷着要搞道德改革——必定弊大于利。曼德维尔在别处把这一思路推得更远。他声称，最优宪制并不依赖有德政治家的品质，而是“能防范最坏的偶然情形……即便大多数人被证明是恶棍，也能保持自身稳固、不为所动”（FT 167）。提出这一论点，等于同强调公共生活中公民德性的古典共和传统彻底决裂；他转而提出一种理解政治的进路，如今人们更常把它同休谟对宪政政府的分析联系在一起（Moore 1977: 824–826）[^moore-1977]。
