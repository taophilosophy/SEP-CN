      ### 2.3 Self-love and self-liking
    step1: TBD
    step2: TBD
  - id: 28
    kind: body
    source: |-
      In the first volume of the *Fable*, Mandeville contends that all passions originate in self-love. Yet in both the second volume and its sequel, *An Enquiry into the Origin of Honour*, he draws a distinction between self-love and self-liking (FB II, 129–134; OH 3–8). The idea that all human action can be reduced to self-love came under sustained attack from philosophers such as Butler and Hutcheson in the 1720s, and Mandeville may well have introduced the distinction in response (Tolonen 2013: 49–65)[^tolonen-2013].
    step1: TBD
    step2: TBD
  - id: 29
    kind: body
    source: |-
      The concept of self-liking can helpfully be understood in relation to Mandeville’s (earlier) account of pride. In the first volume of the *Fable*, Mandeville claims that pride is the faculty by which we overvalue ourselves (FB I, 124), while also equating pride with the concern we have for our own reputation (FB I, 146). But why, if we overvalue ourselves, do we care so much about our reputation, which is based on how *others* view us? In the second volume of the *Fable*, Mandeville supplies a more complete answer to this question by introducing the concept of self-liking. He now describes self-liking (rather than pride) as the “Instinct, by which every Individual values itself above its real Worth”. As we are conscious that we overvalue ourselves, however, this instinct is accompanied by a sense of uneasiness, which leads us to desire the approbation of other people to “strengthen and confirm us in the good Opinion we have of ourselves” (FB II, 130). The approval of other people, then, eases the apprehension that arises from overvaluing ourselves.
    step1: TBD
    step2: TBD
  - id: 30
    kind: body
    source: |-
      Mandeville clarifies that self-liking is the underlying cause of passions such as pride and shame (FB II, 131–132; OH 3–4, 12–13). Where self-love explains why we are concerned with matters of sustenance and security, self-liking explains why we care about our reputation and social standing (FB II, 133–134). The significance and bearing of the distinction between self-love and self-liking for Mandeville’s wider philosophy remains a matter of debate, with scholars disagreeing on the extent to which it constitutes a refinement or a repudiation of Mandeville’s earlier self-love thesis, and on whether the introduction of self-liking reflects a more general change in the character of his moral and social philosophy between the different editions of the *Fable* (see especially Hundert 1994: 53–55, 137–139; Tolonen 2013: 41–102; Maurer 2019: 60–64; Douglass 2023: 35–38, 62–67; Callanan 2025: 242–253)[^callanan-2025][^douglass-2023][^hundert-1994][^maurer-2019][^tolonen-2013].
