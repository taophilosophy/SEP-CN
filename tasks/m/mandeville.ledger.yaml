      曼德维尔澄清说，自矜是骄傲、羞耻等激情的深层原因（FB II, 131–132；OH 3–4, 12–13）。自爱解释了我们为何关心生计与安全之事，自矜则解释了我们为何在乎自己的名声与社会地位（FB II, 133–134）。自爱与自矜的区分对曼德维尔更广阔的哲学有何意义与影响，至今仍有争论：学者们对它在多大程度上是对曼德维尔早期自爱论的完善还是否定意见不一，对引入自矜是否反映了《寓言》各版之间其道德哲学与社会哲学品格的总体变化也意见不一（尤见 Hundert 1994: 53–55, 137–139；Tolonen 2013: 41–102；Maurer 2019: 60–64；Douglass 2023: 35–38, 62–67；Callanan 2025: 242–253）[^callanan-2025][^douglass-2023][^hundert-1994][^maurer-2019][^tolonen-2013]。
