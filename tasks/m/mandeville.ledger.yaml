      曼德维尔关于女性的各种讨论中有一个反复出现的主题：贞洁规范与女性端庄规范如何被社会建构，并从很小的年纪就被灌输给女孩。例如，女孩被教导要为自己露出双腿感到羞耻，而她们远在这之前根本无法理解此事为何被视为不当。曼德维尔主张，男女端庄标准不同，这毫无自然可言，只应被理解为教育的结果（FB I, 72–73）。贞洁是女性荣誉的基础，正如勇气是男性荣誉的基础。士兵在战场上冒生命危险，是怕被人视为懦夫；受过教育的女性拒绝男人的追求、克制自己的性欲，是怕被人视为淫荡。即便这些例子在今天的读者看来有些古旧，它们仍然说明了曼德维尔更宽泛的论点：羞耻是引导我们所有人深切关心自己名声的底层激情，尽管什么算可耻由流行的社会规范决定，因而会因时代、地域和社会地位而不同。
