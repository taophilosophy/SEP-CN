      Throughout the twentieth century, there was much debate about whether Mandeville should be classified as a proponent of laissez-faire or mercantilist economic doctrines (for critical overviews, see Landreth 1975; Rashid 1985; Prendergast 2016, 104–112)[^landreth-1975][^prendergast-2016][^rashid-1985]. Evidence supporting both interpretations can be found, and Mandeville may have changed his position to some extent between different editions of the *Fable*, shifting from a more laissez-faire position when analyzing economic demand to a more mercantilist one when examining labor supply (Dew 2005)[^dew-2005]. Indeed, one area where his economic thinking closely intersects with his broader social and political philosophy concerns his views on the working poor.
    step1: |-
      整个 20 世纪，学界围绕曼德维尔究竟应被归为自由放任主义还是重商主义经济学说，争论不休（批判性综述见 Landreth 1975；Rashid 1985；Prendergast 2016, 104–112）[^landreth-1975][^prendergast-2016][^rashid-1985]。支持两种解读的证据都能找到；曼德维尔在《寓言》各版之间，立场也可能有所变化：分析经济需求时偏向自由放任，考察劳动供给时则更偏重商主义（Dew 2005）[^dew-2005]。的确，他的经济思考与更广泛的社会政治哲学密切交叠的一个领域，就是他对穷苦劳动者的看法。
