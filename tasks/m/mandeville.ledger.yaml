      In 1705, Mandeville published *The Grumbling Hive: Or, Knaves Turn’d Honest,* a poem describing a wealthy bee community that seeks to root out all vice from the hive, which serves as an allegory illustrating the disastrous consequences that would follow any successful attempt to impose a moral reformation on an opulent nation like England. The poem challenged the prevalent “public spirit” ideology associated with civic humanism at the turn of the eighteenth century, ridiculing the notion that our benevolent or virtuous qualities lie behind social order and prosperity. In addition to the *Grumbling Hive*’s doggerel couplets, poetry featured prominently in Mandeville’s early literary endeavors, both in the form of translations and original verses, such as *The Pamphleteers: A Satyr* (1703), *Aesop Dress’d: Or a Collection of Fables Writ in Familiar Verse* (1704), and *Typhon; Or the Wars Between the Gods and Giants: A Burlesque Poem* (1704). A little later in his career, Mandeville compiled a collection entitled *Wishes to a Godson, with Other Miscellany Poems* (1712).
    step1: |-
      1705 年，曼德维尔发表《抱怨的蜂巢：或，恶棍变诚实》（*The Grumbling Hive: Or, Knaves Turn’d Honest*）。这首长诗描写一个富庶的蜜蜂共同体，该共同体试图把一切恶德从蜂巢中根除；它是一则寓言，说明任何要把道德改革强加于英格兰这样奢靡之国的成功尝试，都会带来灾难性后果。这首诗挑战了 18 世纪之交与公民人文主义相联系的流行“公共精神”意识形态，嘲讽了这样一种观念：我们的仁慈品质或德性品质是社会秩序与繁荣的根基。除了《抱怨的蜂巢》中那种打油诗式的对句，诗歌在曼德维尔早期的文学尝试中也占突出地位，既有译作也有原创诗作，如《小册子作者：一部讽刺诗》（*The Pamphleteers: A Satyr*，1703）、《装扮过的伊索：或，用通俗韵文写成的寓言集》（*Aesop Dress’d: Or a Collection of Fables Writ in Familiar Verse*，1704）以及《堤丰：或，诸神与巨人之间的战争：一部诙谐诗》（*Typhon; Or the Wars Between the Gods and Giants: A Burlesque Poem*，1704）。稍后，曼德维尔又编成一部诗集，题为《致教子的祝愿及其他杂诗》（*Wishes to a Godson, with Other Miscellany Poems*，1712）。
    step2: |-
      1705 年，曼德维尔发表《抱怨的蜂巢：或，恶棍变诚实》（*The Grumbling Hive: Or, Knaves Turn’d Honest*）。这首长诗写一个富庶的蜜蜂共同体，它想把一切恶德从蜂巢里根除。这其实是一则寓言：任何要把道德改革强加给英格兰这类奢靡之国的成功尝试，都会带来灾难性后果。18 世纪之交流行一种与公民人文主义相联系的“公共精神”意识形态，这首诗正是对它的挑战，也嘲讽了这样一种想法：我们的仁慈品质或德性品质，是社会秩序与繁荣的根基。诗歌在曼德维尔早期的文学尝试中颇为醒目，既有打油诗式的对句，也有译作和原创诗作，如《小册子作者：一部讽刺诗》（*The Pamphleteers: A Satyr*，1703）、《装扮过的伊索：或，用通俗韵文写成的寓言集》（*Aesop Dress’d: Or a Collection of Fables Writ in Familiar Verse*，1704）以及《堤丰：或，诸神与巨人之间的战争：一部诙谐诗》（*Typhon; Or the Wars Between the Gods and Giants: A Burlesque Poem*，1704）。稍后，曼德维尔又编了一部诗集，题为《致教子的祝愿及其他杂诗》（*Wishes to a Godson, with Other Miscellany Poems*，1712）。
