      把自矜这一概念同曼德维尔（较早）关于骄傲的说明对照起来理解，会有帮助。在《寓言》第一卷里，曼德维尔声称骄傲是我们借以高估自己的那种官能（FB I, 124），同时又把骄傲等同于我们对自己名声的关切（FB I, 146）。但如果我们高估自己，又为何如此在乎名声——而名声恰恰取决于他人如何看待我们？在《寓言》第二卷中，曼德维尔引入自矜概念，为这个问题提供了更完整的答案。他现在把自矜（而非骄傲）描述为“一种本能，每个个体借此把自己估得高于其实际价值”。然而，由于我们意识到自己在高估自己，这种本能便伴随着一种不安之感，促使我们渴望他人的赞许，以“巩固并确认我们对自己的好评”（FB II, 130）。于是，他人的认可缓解了高估自己所引起的不安。
