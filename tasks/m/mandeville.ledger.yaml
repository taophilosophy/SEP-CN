      ## 5. Legacy
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      *The Fable of the Bees* was one of the most scandalous books published in eighteenth-century Europe. Beyond the work’s notoriety, however, it played an important role in the development of social and moral philosophy throughout the century, and, while not so widely read subsequently, it continued to attract the attention of some of the most famous philosophers and social scientists in the nineteenth and twentieth centuries (for wide-ranging surveys, see Kaye 1924a: cxiv–cxlvi; Hundert 1994: 237–249)[^hundert-1994][^kaye-1924a].
    step1: TBD
    step2: TBD
