      Visual processing is also understood in the context of the Two Visual Systems Model: vision-for-recognition and vision-for-action (Goodale et al. 1995)[^goodale-1995]. Molyneux’s problem may also include a new question on action: would a newly sighted subject be able to automatically grasp an object by sight alone (Gallagher 2005)[^gallagher-2005]? Ferretti (2018) argues that due to visual impairments at the cortical level of visual processing, Molyneux subjects would display problems in both recognition and visual guidance of action that make them unprepared for a grasping test. Molyneux’s problem thus involves multiple meanings of vision, blindness, and visual restoration (Brogaard et al. 2020). Under Molyneux’s original description, a Molyneux experiment may turn out to require a scientific miracle. Alternatively, subjects who are visually naïve yet primed for vision, such as human infants and non-human animals, may yield more reliable results.
    step1: |-
      视觉加工也在双视觉系统模型（Two Visual Systems Model）的语境下得到理解：识别视觉与行动视觉（Goodale et al. 1995）[^goodale-1995]。莫利纽克斯问题或可纳入一个关于行动的新问题：新近复明的受试者能否仅凭视觉自动抓取一个物体（Gallagher 2005）[^gallagher-2005]？Ferretti（2018）论证，由于视觉加工在皮层层面的损伤，莫利纽克斯受试者在识别与行动的视觉引导两方面都会表现出问题，从而未准备好通过抓取测试。因此，莫利纽克斯问题涉及视觉、失明与视觉恢复的多重含义（Brogaard et al. 2020）。在莫利纽克斯的原始描述下，一场莫利纽克斯实验或许最终需要一场科学奇迹。或者，视觉上天真却已为视觉做好准备的受试者——如人类婴儿与非人类动物——或能给出更可靠的结果。
    step2: |-
      视觉加工也在双视觉系统模型（Two Visual Systems Model）的语境下得到理解：识别视觉与行动视觉（Goodale et al. 1995）[^goodale-1995]。莫利纽克斯问题或可纳入一个关于行动的新问题：新近复明的受试者能否仅凭视觉自动抓取物体（Gallagher 2005）[^gallagher-2005]？Ferretti（2018）论证，由于视觉加工在皮层层面受损，莫利纽克斯受试者在识别与行动的视觉引导两方面都会出问题，因而不具备通过抓取测试的条件。莫利纽克斯问题由此涉及视觉、失明与视觉恢复的多重含义（Brogaard et al. 2020）。在莫利纽克斯的原始描述下，一场莫利纽克斯实验或许终须一场科学奇迹；而视觉上天真却已为视觉做好准备的受试者——如人类婴儿与非人类动物——则可能给出更可靠的结果。
