      New accounts of different kinds of blind subjects, most of whom could distinguish light from dark but not shapes, in a variety of different experimental conditions, suggested that, after time, some newly sighted subjects could partially distinguish and identify visual properties by sight alone. (Abbott 1864)[^abbott-1864] Sir Everard Home (1807) tested a young boy age 10, about the distances of candlelight and the sun, giving a report similar to Cheselden’s boy saying, “it appeared to touch his eyes.” (Abbott 1904, 546)[^abbott-1904] Dr. Franz (1841) performed experiments on a teenage boy newly healed from strabismus, able to see light and some colour, but no shapes or distances. Using the prescribed globe and cube, and after several days, Franz reported that his patient called out related two-dimensional versions of the shapes, a disc and “quadrangular figure.” Dr. Ramsay (1903) performed experiments on a 30-year-old man after cataract surgery. Ramsay reported that upon sight, the man identified a face: “he knew from having felt his own face…that he must be looking at a face.” (Abbott 1904, 549)[^abbott-1904] A day later, the man distinguished a ball from a brick, moving his fingers, “trying to feel them in imagination.” (Abbott 1904, 550)[^abbott-1904] While some of these reports agreed with Cheselden’s observations, others stood in marked contrast. Meaningful comparison between these cases is difficult due to significant differences in pre- and post-operative conditions. As might be expected, this diversity of experimental data expanded the range of possible solutions to Molyneux’s problem and paradigms for its testing.
    step1: |-
      关于各类盲人受试者的新报告——其中多数能分辨明暗却不能分辨形状——出现在多种不同的实验条件下，表明经过一段时间之后，一些新近复明者能部分地凭视觉辨认并识别视觉性质。（Abbott 1864）[^abbott-1864] Sir Everard Home（1807）测试了一个 10 岁男孩，涉及烛光与太阳的距离，给出的报告与切塞尔登的男孩相似，说“那光似乎碰到了他的眼睛”。（Abbott 1904, 546）[^abbott-1904] Dr. Franz（1841）对一位刚从斜视手术中痊愈的少年做了实验，此少年能看见光与某些颜色，但看不见形状与距离。使用规定的球体与立方体，并在若干天之后，Franz 报告说他的病人喊出了这些形状的相关二维版本：一个圆盘与一个“四边图形”。Dr. Ramsay（1903）对一位 30 岁男子在白内障手术后做了实验。Ramsay 报告说，此人一见之下认出了一张脸：“他凭曾摸过自己脸部的经验……知道自己必定是在看一张脸。”（Abbott 1904, 549）[^abbott-1904] 一天之后，此人区分了球与砖，一边移动手指，“试图在想象中摸到它们”。（Abbott 1904, 550）[^abbott-1904] 这些报告有的与切塞尔登的观察一致，有的则形成鲜明对照。由于术前术后状况差异显著，这些案例之间难以作有意义的比较。可以想见，这种实验数据的多样性扩大了莫利纽克斯问题可能解的范围，也扩充了检验它的范式。
    step2: |-
      各类盲人受试者的新报告出现在多种不同的实验条件下——其中多数受试者能分辨明暗却不能分辨形状。这些报告表明，一段时间之后，一些新近复明者能部分地凭视觉辨认乃至识别视觉性质。（Abbott 1864）[^abbott-1864] Sir Everard Home（1807）测试了一个 10 岁男孩对烛光与太阳的距离知觉，报告与切塞尔登的男孩相似：“那光似乎碰到了他的眼睛。”（Abbott 1904, 546）[^abbott-1904] Dr. Franz（1841）对一位刚经手术治愈斜视的少年做了实验：他能看见光与某些颜色，却看不见形状与距离。在使用规定的球体与立方体若干天之后，Franz 报告说，他的病人喊出了这些形状的相关二维版本：一个圆盘与一个“四边图形”。Dr. Ramsay（1903）对一位 30 岁男子在白内障手术后做了实验。据 Ramsay 报告，此人一见之下认出了一张脸：“他凭曾摸过自己脸部的经验……知道自己必定是在看一张脸。”（Abbott 1904, 549）[^abbott-1904] 一天之后，此人区分了球与砖，一边移动手指，“试图在想象中摸到它们”。（Abbott 1904, 550）[^abbott-1904] 其中一些报告与切塞尔登的观察一致，另一些则形成鲜明对照。由于术前术后状况差异显著，诸案例之间难以作有意义的比较。可以想见，实验数据的这种多样性既扩大了莫利纽克斯问题可能解的范围，也扩充了检验它的范式。
