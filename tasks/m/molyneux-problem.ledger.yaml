      Just-born infants are both visually naïve and primed for vision, making them excellent candidates for a Molyneux experiment. This may account for why they produce results opposite to Held’s (2011) surgically recovering once-blind subjects. Several hours-old infants look to familiar shapes known previously by their feel in their mouths (Meltzoff et al. 1979)[^meltzoff-1979] or look to novel shapes previously unknown but by their feel in their right hands (Streri 2012)[^streri-2012], looking being a behavioral basis for identifying visually novel shapes by sight alone. A variety of non-human animals are similarly successful at visually identifying shapes previously known only by another sense, including ants, birds, crabs, dolphins, fish, frogs, and a variety of mammals (Glenney 2024)[^glenney-2024]. Bees and bats fly to cube shapes known previously by touch or echolocation, respectively, though all these animal subjects have had natural, real-world experiences. By contrast, Versace et al. (2024) showed that newborn chicks dark-reared with either pointy- or smooth-featured shapes identified them immediately in lit conditions by sight alone. These chick behaviors, much like the human newborns’ looking behaviors, suggest a “yes” answer to a modified “action” version of Molyneux’s problem that is freed from verbal-based identification and one-off experimental conditions of past Molyneux experiments on humans.
    step1: |-
      刚出生的婴儿既视觉天真又已为视觉做好准备，是莫利纽克斯实验的绝佳候选。这或许可以解释：为什么他们的结果与 Held（2011）那些经手术恢复视力的曾盲受试者的结果相反。数小时大的婴儿会看向先前经口腔触感而熟悉的形状（Meltzoff et al. 1979）[^meltzoff-1979]，或看向先前仅凭右手触感而陌生的形状（Streri 2012）[^streri-2012]——“看”正是仅凭视觉识别视觉上新颖之形状的行为基础。多种非人类动物同样能凭视觉识别先前仅由另一感官知晓的形状，包括蚂蚁、鸟类、螃蟹、海豚、鱼类、蛙类与多种哺乳动物（Glenney 2024）[^glenney-2024]。蜜蜂与蝙蝠会飞向先前分别凭触觉或回声定位知晓的立方体形状，不过所有这些动物受试者都拥有自然真实世界的经验。相比之下，Versace 等人（2024）表明：在黑暗中饲养、分别接触带尖突或平滑特征形状的新生雏鸡，在有光照的条件下能立即凭视觉识别出这些形状。这些雏鸡行为，与人类新生儿的看之行为一样，暗示对一个修正版“行动”版莫利纽克斯问题的“是”答——该版本摆脱了基于言语的识别与以往在人类身上进行的莫利纽克斯实验的一次性实验条件。
    step2: |-
      刚出生的婴儿既视觉天真又已为视觉做好准备，堪称莫利纽克斯实验的绝佳候选。这或许可以解释，为何他们的结果与 Held（2011）那些经手术复明的曾盲受试者相反。数小时大的婴儿会看向先前经口腔触感而已熟悉的形状（Meltzoff et al. 1979）[^meltzoff-1979]，或看向先前仅凭右手触感认知的陌生形状（Streri 2012）[^streri-2012]——“看”正是仅凭视觉识别新颖形状的行为基础。多种非人类动物同样能凭视觉识别先前仅由另一感官知晓的形状：蚂蚁、鸟类、螃蟹、海豚、鱼类、蛙类与多种哺乳动物皆然（Glenney 2024）[^glenney-2024]。蜜蜂与蝙蝠会飞向先前分别凭触觉或回声定位知晓的立方体形状——不过所有这些动物受试者都拥有自然真实世界的经验。相比之下，Versace 等人（2024）表明：在黑暗中饲养、分别接触带尖突或平滑特征形状的新生雏鸡，在有光照的条件下能立即凭视觉识别这些形状。这些雏鸡行为与人类新生儿的“看”一样，暗示对一个修正版“行动”莫利纽克斯问题的“是”答。该版本摆脱了基于言语的识别，也摆脱了以往人类莫利纽克斯实验的一次性条件。
