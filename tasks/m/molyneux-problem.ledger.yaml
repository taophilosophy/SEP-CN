    source: |-
      Philosophers initially regarded Molyneux’s problem as a kind of thought experiment to be dealt with by reflection and conceptual analysis. Berkeley (1709) offered a more radical “no” answer than his fellow empiricists, Molyneux and Locke, arguing that the ideas of sight and touch bore no similarity at all. By contrast, those of a more rationalist persuasion, such as Synge (1693), Lee (1702), Leibniz (1704), and Hutcheson (1727) answered “yes,” maintaining that similarities between sight and touch could either be reasoned out or were innately linked. Leibniz’s own yes answer resisted Locke’s “at first sight” amendment, contending that time should be allowed for full recovery of sight, a point that would later prove crucial in later experimental tests of Molyneux’s problem.
    step1: |-
      哲学家起初把莫利纽克斯问题当作一种可借反思与概念分析来处理的思想实验。贝克莱（Berkeley，1709）给出了比其经验主义同道莫利纽克斯与洛克更激进的“否”答：视觉与触觉的观念毫无相似之处。相比之下，倾向理性主义的一派——Synge（1693）、Lee（1702）、莱布尼茨（1704）与哈奇森（1727）——答以“是”，主张视觉与触觉之间的相似或者可以推理得出，或者有先天联结。莱布尼茨本人的“是”答则抵制洛克“初见之际”的修正，主张应当给视力的完全恢复留出时间——这一点后来在莫利纽克斯问题的实验检验中被证明至关重要。
    step2: |-
      哲学家起初把莫利纽克斯问题当作一种可借反思与概念分析处理的思想实验。贝克莱（Berkeley，1709）给出了比其经验主义同道莫利纽克斯与洛克更激进的“否”答：视觉观念与触觉观念毫无相似之处。相比之下，倾向理性主义的一派——Synge（1693）、Lee（1702）、莱布尼茨（1704）与哈奇森（1727）——答以“是”，主张视觉与触觉之间的相似或者可由推理得出，或者有先天联结。莱布尼茨本人的“是”答则抵制洛克“初见之际”的修正，主张应为视力的完全恢复留出时间——这一点后来证明对莫利纽克斯问题的实验检验至关重要。
  - id: 16
    kind: body
    source: |-
      The English surgeon William Cheselden (1688–1752) was the first to publish an experimental account of “new sight” by a congenitally blind person after surgical displacement of cataracts (1728). The publication led philosophers like Berkeley to regard Molyneux’s problem as experimentally resolvable. In his somewhat anecdotal report, Cheselden observed his patient’s response “at first sight.” “When he first saw, he was so far from making any judgment of distances, that he thought all objects whatever touched his eyes (as he expressed it) as what he felt did his skin.” (Cheselden 1728, 448)[^cheselden-1728] For Berkeley (1733), this provided not only evidence for a “no” answer but also confirmation of his own conjecture that first sight would lack spatial extension, with objects seemingly “to be in his eye” (Berkeley 1709, Section 41).
    step1: |-
      英国外科医师威廉·切塞尔登（William Cheselden，1688–1752）最先发表了一份关于先天性盲者在白内障移位手术后获得“新视力”的实验报告（1728）。这篇报告使贝克莱等哲学家转而认为莫利纽克斯问题可以由实验解决。在其略带轶事色彩的报告中，切塞尔登观察了病人“初见之际”的反应。“他初次看见时，对距离全然无法作出判断，以至于他认为一切物体都碰到了他的眼睛（用他自己的话说），就像他感觉到的东西碰到皮肤一样。”（Cheselden 1728, 448）[^cheselden-1728] 对贝克莱（1733）而言，这不仅为“否”答提供了证据，也证实了他自己的猜想：初次视觉将缺乏空间延展，物体看起来似乎“就在他的眼睛里”（Berkeley 1709, Section 41）。
    step2: |-
      英国外科医师威廉·切塞尔登（William Cheselden，1688–1752）最先发表了先天性盲者在白内障手术移位后获得“新视力”的实验报告（1728）。这篇报告令贝克莱等哲学家转而认为，莫利纽克斯问题可交由实验解决。在那份略带轶事色彩的报告中，切塞尔登记录了病人“初见之际”的反应。据病人自述：“他初次看见时，对距离全然无从判断；用他自己的话说，他认为一切物体都碰到了他的眼睛，一如他感觉到的东西碰着皮肤。”（Cheselden 1728, 448）[^cheselden-1728] 对贝克莱（1733）而言，这不仅为“否”答提供了证据，也证实了他本人的猜想：初次视觉将缺乏空间延展，物体看上去仿佛“就在他的眼睛里”（Berkeley 1709, Section 41）。
