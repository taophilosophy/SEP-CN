      The invention of the stereoscope by Charles Wheatstone (1838), a device which instigated binocular vision of depth from flat photographs taken from slightly different angles, suggested immediate 3D spatial experience by sight alone. Samuel Bailey (1842), for instance, concluded from this and the report from Home’s (1807) once-blind patient a “yes” to Molyneux’s problem: the newly sighted upon seeing a shape through two retinal images, “the perception of an object of three dimensions would be doubtless produced in his mind.” (Bailey 1842, 100–1)[^bailey-1842] While Bailey believed depth was an innate ability of the mind, Mill (1842) argued that it was learned, albeit quickly.
    step1: |-
      查尔斯·惠斯通（Charles Wheatstone，1838）发明的立体镜——一种借助从略微不同角度拍摄的平面照片引发双目深度视觉的装置——暗示仅凭视觉即可获得即时的三维空间经验。例如 Samuel Bailey（1842）便由此并结合 Home（1807）那位曾盲病人的报告，对莫利纽克斯问题给出了“是”答：新近复明者通过两个视网膜像看见一个形状时，“对三维物体的知觉无疑会在他心灵中产生”。（Bailey 1842, 100–1）[^bailey-1842] Bailey 认为深度是心灵的一种先天能力，而穆勒（Mill，1842）则主张深度是习得的，尽管习得得很快。
    step2: |-
      查尔斯·惠斯通（Charles Wheatstone，1838）发明的立体镜——一种以略微不同角度拍摄的平面照片引发双目深度视觉的装置——暗示仅凭视觉即可获得即时的三维空间经验。例如，Samuel Bailey（1842）便由此并结合 Home（1807）那位曾盲病人的报告，对莫利纽克斯问题给出“是”答：新近复明者借两个视网膜像看见一个形状时，“对三维物体的知觉无疑会在其心灵中产生”。（Bailey 1842, 100–1）[^bailey-1842] Bailey 认为深度是心灵的先天能力，穆勒（Mill，1842）则主张深度是习得的，尽管习得极快。
