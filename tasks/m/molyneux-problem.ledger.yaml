      Throughout much of the twentieth century, interest in Molyneux’s problem was primarily historical. Molyneux’s problem is commonly presented as such in textbooks and general histories of psychology and other cognitive sciences. Historians of philosophy analyze answers to Molyneux for a better understanding of a philosopher’s thought. For instance, many scholars argue that Locke’s wider views, like shape being a common sensible, align better with a “yes” answer: J.L. Mackie (1976) argues that Locke must mean only 2D shape is a common sensible. Other scholars question whether even 2D shape is a common sensible for Locke (Levin 2020) or they defend 3D shape as a common sensible for Locke, mitigating his “no” answer via judgment (Bruno and Mandelbaum 2010; Berchielli 2003)[^bruno-2010], simple and complex ideas (Ayers 1993)[^ayers-1993], primary qualities (Vaughan 2018)[^vaughan-2018] or several of these simultaneously (Glenney 2024; Ott 2020)[^glenney-2024][^ott-2020]. Other philosophical historians have written book-length focused histories of the problem (Glenney 2024; Riskin 2002; Morgan 1977)[^glenney-2024][^morgan-1977][^riskin-2002], with others providing more comprehensive analyses (Degenaar 1996)[^degenaar-1996].
    step1: |-
      整个二十世纪的大部分时间里，对莫利纽克斯问题的兴趣主要是历史性的。在教科书以及心理学与其他认知科学的通史中，莫利纽克斯问题通常就以这种面目出现。哲学史家通过分析对莫利纽克斯问题的各种回答来更好地理解一位哲学家的思想。例如，许多学者认为洛克更宽泛的观点——如形状是共同可感性质——与“是”答更为吻合：J.L. Mackie（1976）论证洛克必定只是指二维形状是共同可感性质。另一些学者质疑即便二维形状对洛克而言也不是共同可感性质（Levin 2020），或者为洛克辩护三维形状作为共同可感性质，经由判断（Bruno and Mandelbaum 2010; Berchielli 2003）[^bruno-2010]、简单观念与复杂观念（Ayers 1993）[^ayers-1993]、第一性质（Vaughan 2018）[^vaughan-2018]或数者并举（Glenney 2024; Ott 2020）[^glenney-2024][^ott-2020]来缓和其“否”答。还有一些哲学史家为这一问题写出了专著史（Glenney 2024; Riskin 2002; Morgan 1977）[^glenney-2024][^morgan-1977][^riskin-2002]，另有人提供了更全面的分析（Degenaar 1996）[^degenaar-1996]。
    step2: |-
      二十世纪的大部分时间里，对莫利纽克斯问题的兴趣主要是历史性的。在教科书以及心理学与其他认知科学的通史中，莫利纽克斯问题通常正是以这种面目出现的。哲学史家通过分析各家对莫利纽克斯问题的回答，来更好地理解一位哲学家的思想。例如，许多学者认为，洛克更宽泛的观点——如形状是共同可感性质——与“是”答更为吻合：J.L. Mackie（1976）论证洛克必定只是指二维形状为共同可感性质。另一些学者质疑对洛克而言连二维形状也不是共同可感性质（Levin 2020），或者为洛克辩护三维形状作为共同可感性质，经由判断（Bruno and Mandelbaum 2010; Berchielli 2003）[^bruno-2010]、简单观念与复杂观念（Ayers 1993）[^ayers-1993]、第一性质（Vaughan 2018）[^vaughan-2018]，或数者并举（Glenney 2024; Ott 2020）[^glenney-2024][^ott-2020]来缓和其“否”答。还有一些哲学史家为此题写出了专著（Glenney 2024; Riskin 2002; Morgan 1977）[^glenney-2024][^morgan-1977][^riskin-2002]，另有人提供了更全面的分析（Degenaar 1996）[^degenaar-1996]。
  - id: 26
