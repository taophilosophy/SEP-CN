      Some novel paradigms considered observations of the sight of newly born animals and babies when discussing Molyneux’s problem. Adam Smith (1795), known best as an economist, was the first to report his observations of the behaviors of newly-hatched chicks, newborn foals and calves, and newborn human infants. This suggested to Smith that Berkeley’s “no” answer to Molyneux’s problem was incorrect: there is an immediate ability to visually identify objects previously known only to touch. Smith further speculated on innate connections between the senses in both newborn animals and human babies, a point subsequently mentioned by Thomas Brown (1838), Samuel Bailey (1842), and T.K. Abbott (1904). Johannes Müller’s (1826) experiments in bird vision further supported these animal observations and their speculations of innate connections between sight and touch. John Stuart Mill (1842) agreed with these views about animal vision, but argued they could not reasonably be applied to human vision.
    step1: |-
      一些新范式在讨论莫利纽克斯问题时考虑了对新生动物与婴儿视觉的观察。以经济学家之名最为著称的亚当·斯密（Adam Smith，1795）最先报告了他对刚孵化的小鸡、新生马驹与牛犊以及新生儿行为的观察。这使斯密认为，贝克莱对莫利纽克斯问题的“否”答是错误的：存在一种即时的能力，能凭视觉识别先前只被触觉认识的物体。斯密进而猜测新生动物与人类婴儿的诸感官之间存在先天联结，这一论点随后为 Thomas Brown（1838）、Samuel Bailey（1842）与 T.K. Abbott（1904）所提及。Johannes Müller（1826）的鸟类视觉实验进一步支持了这些动物观察及其关于视觉与触觉先天联结的猜测。约翰·斯图亚特·穆勒（John Stuart Mill，1842）赞同这些关于动物视觉的看法，但认为它们不能合理地应用于人类视觉。
    step2: |-
      一些新范式在讨论莫利纽克斯问题时纳入了对新生动物与婴儿视觉的观察。以经济学家之名最为著称的亚当·斯密（Adam Smith，1795）最先报告了他对刚孵化的小鸡、新生马驹与牛犊以及人类新生儿行为的观察。这使斯密认定，贝克莱对莫利纽克斯问题的“否”答有误：存在一种即时能力，可凭视觉识别先前只被触觉认识的物体。斯密进而猜测，新生动物与人类婴儿的诸感官之间存在先天联结；这一论点随后得到 Thomas Brown（1838）、Samuel Bailey（1842）与 T.K. Abbott（1904）的提及。Johannes Müller（1826）的鸟类视觉实验进一步支持了这些动物观察及其关于视觉与触觉先天联结的猜测。约翰·斯图亚特·穆勒（John Stuart Mill，1842）赞同这些关于动物视觉的见解，但认为它们不能合理地推广到人类视觉。
