      Molyneux’s *Dioptrica Nova* (1692), a work on optics and psychology of sight, reflected the general fascination with optics of his time. Molyneux’s interest was also personal as his wife lost her sight in the first year of their marriage (Simms 1982)[^simms-1982]. The direct influence for formulating what would become “Molyneux’s problem” was a French “extract” of Locke’s *An Essay Concerning Humane Understanding*, published in 1688 in the *Bibliothèque Universelle & Historique*. In this extract, Locke distinguishes between ideas we acquire by one sense, such as colour and texture, and those we acquire by a combination of senses, such as space, figure, movement, and rest. Locke further claims that a person deprived of a particular sense will lack the ideas belonging to it: a blind person, for example, can have no idea of colour. Molyneux extended this reasoning by asking whether a person born blind would be deprived of a visual idea of shape if they already know shape by touch alone. A devoted admirer of Locke, Molyneux dedicated *Dioptrica Nova* to him before his problem’s inclusion in Locke’s *Essay*, securing its legacy in the empiricist tradition.
    step1: |-
      莫利纽克斯的《新屈光学》（*Dioptrica Nova*，1692）是一部关于光学与视觉心理学的著作，折射出他那一代人对光学的普遍痴迷。他的兴趣也有个人缘由：婚后第一年妻子失明（Simms 1982）[^simms-1982]。促成他提出日后所谓“莫利纽克斯问题”的直接契机，是洛克《人类理解论》的一个法文“摘录”，1688 年发表于《万有与历史文库》（*Bibliothèque Universelle & Historique*）。在这篇摘录中，洛克区分了由单一感官获得的观念（如颜色与质地）与由诸感官组合获得的观念（如空间、形状、运动与静止）。洛克进而主张：被剥夺某一特定感官的人会缺乏属于该感官的观念——例如盲人不可能有颜色的观念。莫利纽克斯将这一推理向前推进一步：如果一个人先天失明，但已单凭触觉知道形状，他是否仍会缺乏形状的视觉观念？作为洛克的忠实仰慕者，莫利纽克斯在其问题被收入洛克的《人类理解论》之前，便已将《新屈光学》题献给他，从而确保了这一问题在经验主义传统中的传承。
    step2: |-
      莫利纽克斯的《新屈光学》（*Dioptrica Nova*，1692）是一部讨论光学与视觉心理学的著作，折射出他那一代人对光学的普遍痴迷。他的兴趣亦有个人缘由：婚后第一年妻子失明（Simms 1982）[^simms-1982]。促成他提出日后所谓“莫利纽克斯问题”的直接契机，是洛克《人类理解论》的一篇法文“摘录”，1688 年刊于《万有与历史文库》（*Bibliothèque Universelle & Historique*）。在这篇摘录中，洛克区分了由单一感官获得的观念（如颜色与质地）与由诸感官协同获得的观念（如空间、形状、运动与静止）。洛克进而主张：被剥夺某一特定感官的人将缺乏属于该感官的观念——例如盲人不可能有颜色的观念。莫利纽克斯把这一推理再推进一步：一个先天失明的人，若已单凭触觉知道形状，是否仍会缺乏形状的视觉观念？作为洛克的忠实仰慕者，莫利纽克斯在其问题被收入洛克的《人类理解论》之前，便已将《新屈光学》题献给他，为这一问题在经验主义传统中的传承奠定了根基。
