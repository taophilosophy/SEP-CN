      Molyneux’s problem was the fundamental question of the 18th Century for epistemology and psychology (Cassirer 1955)[^cassirer-1955] and captured the attention of many philosophers and men of learning throughout history, including Berkeley, Leibniz, Voltaire, Diderot, La Mettrie, Helmholtz, and William James.
    step1: |-
      莫利纽克斯问题是 18 世纪认识论与心理学的根本问题（Cassirer 1955）[^cassirer-1955]，历史上吸引了众多哲学家与学者，包括贝克莱（Berkeley）、莱布尼茨（Leibniz）、伏尔泰（Voltaire）、狄德罗（Diderot）、拉美特利（La Mettrie）、亥姆霍兹（Helmholtz）与威廉·詹姆斯（William James）。
