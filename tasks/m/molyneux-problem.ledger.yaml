      出于无从知晓的原因，洛克从未回复此信。经过数年友善的通信，莫利纽克斯在 1693 年 3 月 2 日的一封信中向洛克呈上问题的简化版，请洛克或许能在《人类理解论》中找一处地方谈谈它。这一次洛克反应热烈：“你那巧妙的问题值得公之于世。”洛克在《人类理解论》第二版（1694）第二卷第九章第 8 节“感觉常因判断而改变”（“Sensations often changed by the judgment.”）中几乎逐字引用了这封信，如下：
