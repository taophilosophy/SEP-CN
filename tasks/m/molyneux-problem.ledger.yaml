      Blindness today is often understood as less about a loss of sight and more as abnormal development of the visual system (Fine & Park 2018). Others have reconceptualized sight as more of a learned skill: training and experience with other senses, especially touch, are needed to know where to look at an object for its identification, to appreciate that smaller appearing objects may represent distant objects, and to infer hidden sides of an object made invisible under some perspectives (Toribio 2020). Others present Molyneux’s problem from the context of vision’s ocular, physiological, and cortical processing levels, including their normal cognitive development, where if the ocular processing is restored, cortical processing may still fail (Ferretti and Glenney 2020; Ferretti 2018; Glenney 2013; Gallagher 2005)[^ferretti-2018][^ferretti-2020][^gallagher-2005][^glenney-2013].
    step1: |-
      今天的失明往往不再被理解为视力的丧失，而更多被理解为视觉系统的异常发育（Fine & Park 2018）。另一些人则把视觉重新概念化为一种习得的技能：需要借助其他感官（尤其是触觉）的训练与经验，才能知道该看物体的哪里以识别它、领会较小的表观物体可能代表远处的物体、并推断在某些视角下不可见的物体隐蔽面（Toribio 2020）。还有一些人从视觉的眼、生理与皮层加工层级（包括其正常认知发育）出发呈现莫利纽克斯问题：若眼加工得到恢复，皮层加工仍可能失败（Ferretti and Glenney 2020; Ferretti 2018; Glenney 2013; Gallagher 2005）[^ferretti-2018][^ferretti-2020][^gallagher-2005][^glenney-2013]。
    step2: |-
      如今对失明的理解，重点往往不在视力丧失本身，而在视觉系统的异常发育（Fine & Park 2018）。另一些人把视觉重新概念化为一种习得的技能。按这种理解，人必须借助其他感官（尤其是触觉）的训练与经验：知道该看物体的何处以识别它；领会较小的表观物体可能对应远处的物体；推断出物体在某些视角下不可见的隐蔽面（Toribio 2020）。还有人从视觉的眼、生理与皮层加工层级（连同其正常认知发育）出发呈现莫利纽克斯问题：即使眼加工得到恢复，皮层加工仍可能失败（Ferretti and Glenney 2020; Ferretti 2018; Glenney 2013; Gallagher 2005）[^ferretti-2018][^ferretti-2020][^gallagher-2005][^glenney-2013]。
