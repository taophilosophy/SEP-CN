      Another variation of Molyneux’s problem was suggested by Evans (1985). He wondered whether the visual cortex of a patient with congenital blindness could be electrically stimulated in such a way that the patient experiences a pattern of light flashes (phosphenes) in the shape of a square or circle. This question has been investigated experimentally, but the results do not provide a final answer to Molyneux’s problem (Jacomuzzi et al. 2003)[^jacomuzzi-2003] However, improved non-invasive visual prostheses as well as more invasive technologies, such as electrostimulation of visual pathways, gene therapy, stem cells, or optogenetics may one day provide full visual restoration to people born blind (Ptito et al. 2021)[^ptito-2021]. However, even such conditions may fail to provide a satisfactory answer to Molyneux’s problem based on recent progress in reconceptualizing blindness and visual studies.
    step1: |-
      莫利纽克斯问题的另一种变式由 Evans（1985）提出。他想知道：一位先天性盲者的视觉皮层能否受到电刺激，使其体验到方形或圆形的光幻视图案。这一问题已得到实验研究，但其结果并未给出莫利纽克斯问题的最终答案（Jacomuzzi et al. 2003）[^jacomuzzi-2003] 不过，改进的非侵入式视觉假体，以及更具侵入性的技术——如视觉通路的电刺激、基因治疗、干细胞或光遗传学——有朝一日或能为先天失明者带来完全的视觉恢复（Ptito et al. 2021）[^ptito-2021]。然而，基于近年对失明与视觉研究的重新概念化，即便是这类条件也可能无法为莫利纽克斯问题提供令人满意的答案。
    step2: |-
      莫利纽克斯问题的另一种变式由 Evans（1985）提出：一位先天性盲者的视觉皮层能否受到电刺激，使其体验到方形或圆形的光幻视图案。这一问题已有实验研究，但结果并未给出莫利纽克斯问题的最终答案（Jacomuzzi et al. 2003）[^jacomuzzi-2003]。不过，日益改进的非侵入式视觉假体，以及更具侵入性的技术——视觉通路电刺激、基因治疗、干细胞、光遗传学——有朝一日或能为先天失明者带来完全的视觉恢复（Ptito et al. 2021）[^ptito-2021]。然而，鉴于近年对失明与视觉研究的重新概念化，即便这类条件也可能无法为莫利纽克斯问题给出令人满意的答案。
