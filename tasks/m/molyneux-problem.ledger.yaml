    source: |-
      This problem, posed by the Irish scientist and politician William Molyneux (1656–1698) to John Locke, who published it in his *An Essay Concerning Human Understanding* (1694), has engaged philosophers and scientists from the Enlightenment to the present day. Its study has deepened our understanding of how ideas are acquired, how they transfer between different senses, and how such processes ultimately contribute to the formation of knowledge.
    step1: |-
      这一问题由爱尔兰科学家兼政治家威廉·莫利纽克斯（William Molyneux，1656–1698）向约翰·洛克（John Locke）提出，洛克在其《人类理解论》（*An Essay Concerning Human Understanding*，1694）中将其发表。从启蒙时代至今，它一直吸引着哲学家与科学家。对它的研究深化了我们关于观念如何获得、如何在诸感官之间传递、以及这些过程最终如何促成知识之形成的理解。
    step2: |-
      这一问题由爱尔兰科学家兼政治家威廉·莫利纽克斯（William Molyneux，1656–1698）向约翰·洛克（John Locke）提出，洛克在《人类理解论》（*An Essay Concerning Human Understanding*，1694）中将其刊布。自启蒙时代至今，它始终吸引着哲学家与科学家。对它的研究深化了我们对于观念如何获得、如何在诸感官之间迁移、以及这些过程最终如何促成知识之形成的理解。
