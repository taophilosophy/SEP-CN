    source: |-
      Developments in cataract surgeries since Cheselden show that only a few cases fit Molyneux’s profile (Valvo 1971)[^valvo-1971], as the vast majority of cases are detected in infancy and treated as early as possible. One of the most discussed experiments is by Held et al. (2011), who tested five congenitally blind subjects whose vision had been restored through cataract surgery. Controls were added to show that the subjects could identify shapes by touch and sight independently, passing vision-to-vision and touch-to-touch shape matching tests. All subjects failed the touch-to-vision test, barely better than if the subjects had guessed, supporting a “no” answer to Molyneux’s problem. However, three were successful when tested after a few days of “natural real-world experience (Held et al. 552),” suggesting that such cross-modal mappings are rapidly made available, perhaps through brain plasticity or unmasking of innate pathways.
    step1: |-
      自切塞尔登以来白内障手术的发展表明，只有少数案例符合莫利纽克斯的设定（Valvo 1971）[^valvo-1971]，因为绝大多数案例在婴儿期即被发现并尽早治疗。讨论最多的实验之一出自 Held 等人（2011），他们测试了五名经白内障手术恢复视力的先天性盲受试者。实验加入了控制条件，以表明受试者能独立地凭触觉与凭视觉识别形状：视-视与触-触形状匹配测试均通过。所有受试者在触-视测试中失败，成绩仅略好于猜测，这支持对莫利纽克斯问题的“否”答。然而，经过几天“自然真实世界经验”（Held et al. 552）之后再测，其中三人成功了——这暗示此类跨模态映射可以迅速建立，或许是通过大脑可塑性，或是对先天通路的去掩蔽。
    step2: |-
