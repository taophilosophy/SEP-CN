      Towards the end of the century, several new technologies and experimental paradigms more amenable to experimental control began to provide renewed interest in resolving Molyneux’s problem. Sensory Substitution Devices (SSDs) that present information normally handled by one modality, such as vision, to another sense, typically audition or touch, were developed in the context of mobility or reading (Morgan, 1977). SSD experiments show that subjects need some time to learn to distinguish and identify objects, with some interpreting this delay as suggestive of a “no” answer (Morgan 1977)[^morgan-1977]. Others argue that SSDs unmask innate connections between the senses as evidenced by how quickly their use is learned, suggesting a “yes” answer to Molyneux’s problem (Hillenbrand et al. 2018)[^hillenbrand-2018]. Others argue that SSDs are not a substitution but an augmentation of a sense and that to learn to use such devices is only an approximation to Molyneux’s problem (Auvray et al. 2009)[^auvray-2009].
    step1: |-
      接近世纪末，若干更宜于实验控制的新技术与新实验范式开始为解决莫利纽克斯问题重新注入兴趣。感官替代设备（SSD）把通常由一种模态处理的信息——如视觉——呈现给另一种感官（典型的是听觉或触觉），其开发源于行动或阅读的需要（Morgan, 1977）。SSD 实验表明，受试者需要一些时间来学习区分并识别物体，有人将这种延迟解读为对“否”答的暗示（Morgan 1977）[^morgan-1977]。另一些人主张 SSD 揭开了诸感官之间先天联结的遮蔽——其用法习得之快即是明证——由此暗示莫利纽克斯问题的“是”答（Hillenbrand et al. 2018）[^hillenbrand-2018]。还有一些人认为 SSD 不是替代而是某一感官的扩展，学习使用此类设备只是对莫利纽克斯问题的一种近似（Auvray et al. 2009）[^auvray-2009]。
    step2: |-
      临近世纪末，若干更宜于实验控制的新技术与新范式开始为解决莫利纽克斯问题重燃兴趣。感官替代设备（SSD）将通常由一种模态处理的信息（如视觉）呈现给另一感官——典型为听觉或触觉——其研发源于行动或阅读的需要（Morgan, 1977）。SSD 实验表明，受试者需要一段时间才能学会区分并识别物体；有人将这种延迟解读为“否”答的暗示（Morgan 1977）[^morgan-1977]。另一些人主张，SSD 揭开了诸感官间先天联结的遮蔽——其用法习得之快即是明证——由此暗示“是”答（Hillenbrand et al. 2018）[^hillenbrand-2018]。还有人认为 SSD 并非感官的替代，而是其扩展，学习使用此类设备只是对莫利纽克斯问题的一种近似（Auvray et al. 2009）[^auvray-2009]。
