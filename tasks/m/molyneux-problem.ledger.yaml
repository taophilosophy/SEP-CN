      Held et al.’s experiment suggests a “no” answer to Molyneux’s problem if Locke’s “at first sight” amendment is included, though it is common to criticize the robustness of the visual experiences of these newly sighted subjects (Spence et al. 2024; Van Cleve 2014; Schwenkler 2013)[^schwenkler-2013][^spence-2024][^van-2014]. It remains an open question whether Molyneux’s original question would have also been answered “no”, which allows time and adequate visual experience but without tactile experience. The timing of the visual test remains ambiguous: should we test the subject right after surgery or allow time for restoration of visual capacities (Levin 2008)[^levin-2008]? The conditions of both versions generate a paradox: robust visual shape recognition normally requires a physically healthy visual system trained by active bodily experience, including active touch, opening the door to contamination with touch on the path to cross-modal learning. In this respect, not only are once-blind post-operative newly sighted human subjects poor candidates for robust vision, but the active tactile experiences normally associated with vision risk the purity of Molyneux’s test through the acquisition of visual knowledge of shapes by way of perceptual learning from touch (for a review, see Ferretti and Glenney 2020; Ferretti 2018; Glenney 2013; Gallagher 2005; Jacomuzzi et al. 2003)[^ferretti-2018][^ferretti-2020][^gallagher-2005][^glenney-2013][^jacomuzzi-2003]. As such, no control would provide certainty that subjects will be experientially and inferentially naïve to aspects of shape identification by sight alone. However, recent adaptations offer a potential resolution to this paradox.
    step1: |-
      若纳入洛克“初见之际”的修正，Held 等人的实验暗示对莫利纽克斯问题的“否”答；不过人们通常批评这些新近复明者视觉经验的稳健性（Spence et al. 2024; Van Cleve 2014; Schwenkler 2013）[^schwenkler-2013][^spence-2024][^van-2014]。莫利纽克斯的原始问题是否也会得到“否”答——该版本允许时间与充分的视觉经验，但无触觉经验——仍是一个悬而未决的问题。视觉测试的时机也不明确：应当在术后立即测试受试者，还是留出时间让视觉能力恢复（Levin 2008）[^levin-2008]？两个版本的条件都产生一个悖论：稳健的视觉形状识别通常需要一个经由主动身体经验（包括主动触觉）训练过的生理上健康的视觉系统，而这为触觉污染打开了大门，妨碍通往跨模态学习的路径。就这一点而言，术后复明的曾盲人类受试者不仅难有稳健视觉，而且通常伴随视觉的主动触觉经验，会有经由触觉知觉学习而习得形状视觉知识的风险，从而危及莫利纽克斯测试的纯粹性（综述见 Ferretti and Glenney 2020; Ferretti 2018; Glenney 2013; Gallagher 2005; Jacomuzzi et al. 2003）[^ferretti-2018][^ferretti-2020][^gallagher-2005][^glenney-2013][^jacomuzzi-2003]。因此，没有任何控制条件能确保受试者在经验与推理上对“仅凭视觉辨识形状”的诸方面保持天真。不过，晚近的一些改编为这一悖论提供了潜在的解决之道。
