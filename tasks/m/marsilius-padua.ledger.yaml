      《保卫者》中哲学还有第二项任务，它为理论在马西利乌斯的探究中保留了自主角色。马西利乌斯似乎并非只对抽象的形而上学处理感兴趣；但在第二编第 30 章第 4 节，这位帕多瓦人写道：“除信仰之外，没有任何行动倾向，也没有任何由这些倾向产生的行动，能像第一哲学家的倾向或由他产生的行动那样完美”（DP, 537）。在这里，马西利乌斯为哲学之完美性的观念辩护——这一观点在他那个时代的巴黎哲学家中广为流行（Bianchi 1990; Costa 2012）[^bianchi-1990][^costa-2012]——并主张，第一哲学或形而上学与信仰一道，构成人类完善的最高形式。他在此语境中对形而上学的构想也清楚表明：在马西利乌斯那里，哲学并不是作为启示的对立面而被设想的。
