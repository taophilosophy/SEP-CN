      By contrast, early modern readers were primarily engaged with the ecclesiological and political-theological arguments of the second Discourse, especially during the Protestant Reformation and the era of religious wars, when Marsilius’ anti-papal views attracted significant interest among Protestant authors (Piaia 1999)[^piaia-1999]. Some contemporary researchers have also undertaken specific studies on the ecclesiological arguments of the second Discourse, such as the notions of the Church and the Council (Battocchio 2005; Garnett 2006)[^battocchio-2005][^garnett-2006]. More recently, the specific practical role of the third Discourse in the overall structure of Marsilius’ work has also been underlined (Brett 2005; Moreno-Riaño 2008)[^brett-2005][^moreno-riaño-2008]. Surely, in the first Discourse, Marsilius explains how it is possible to institute a perfect secular polity in which there is no room for papal interference, whereas in the second Discourse, he rejects the key principles of the monarchical theory of the papacy in order to present his own original conciliar theory of ecclesiology. However, there is a certain consensus among contemporary scholars that the distinction between the different Discourses should not be overstated, as Marsilius’ goal remains the same throughout: rejecting the “perverted” idea of the plenitude of power (Briguglia 2013; Brett 2005; Mulieri, Masolini and Pelletier 2023; Nederman 1995a)[^brett-2005][^briguglia-2013][^masolini-2023][^nederman-1995a]. In a manner that closely reflects a characteristic pattern of medieval political disputation, all three Discourses of the *Defender* consistently integrate philosophical, theological, and ecclesiological ideas.
    step1: |-
      相比之下，近代早期的读者主要关注第二编的教会论与政治—神学论证，尤其是在新教宗教改革与宗教战争时代，马西利乌斯的反教皇观点在新教作者中引起了相当大的兴趣（Piaia 1999）[^piaia-1999]。一些当代研究者也专门研究了第二编的教会论论证，如教会与公会议的概念（Battocchio 2005; Garnett 2006）[^battocchio-2005][^garnett-2006]。晚近以来，第三编在马西利乌斯著作整体结构中的具体实践作用也得到强调（Brett 2005; Moreno-Riaño 2008）[^brett-2005][^moreno-riaño-2008]。诚然，在第一编中，马西利乌斯说明如何可能建立一个完美的世俗政体，其中没有教皇干预的余地；而在第二编中，他拒斥教皇君主制理论的关键原则，以提出自己原创的教会论公会议理论。不过，当代学者有某种共识：不同各编之间的区分不应被夸大，因为马西利乌斯自始至终目标如一：拒斥权力充盈这一“颠倒的”观念（Briguglia 2013; Brett 2005; Mulieri, Masolini and Pelletier 2023; Nederman 1995a）[^brett-2005][^briguglia-2013][^masolini-2023][^nederman-1995a]。以一种密切反映中世纪政治论辩典型模式的方式，《保卫者》三编始终把哲学、神学与教会论观念融为一体。
