      Scholars have been divided on how to interpret the complex relationship between political action, philosophy, and Revelation in the *Defender*. Some have emphasized the militant nature of Marsilius’ message. For example, Conal Condren explains that the presence of Aristotle, along with other philosophical sources such as Averroism in the *Defender* does not necessarily indicate that Marsilius was concerned with philosophical problems (Condren 1977, 213)[^condren-1977]. Others have pointed out that while the *Defender* undoubtedly functions as a political treatise, its philosophical underpinnings add depth to its argumentative structure. For instance, Cary Nederman cautions against an approach that reduces Marsilius’ philosophical perspective solely to a practical and polemical intention that motivates the *Defender* (Nederman 1995a, 24)[^nederman-1995a]. Another way to understand the practical function of Marsilius’ political theory is by situating it within the Ciceronian tradition. As Cary Nederman has pointed out, “Cicero looms large in Marsiglio’s thought: De officiis is among the most frequently cited pagan texts in the Defensor.” (Nederman 2020: 108)[^nederman-2020] In fact, Cicero takes a highly pragmatic approach—one that closely resembles the clear “call to action” characteristic of Marsilius’ “militant” theory in the *Defender* (Nederman 1990; 1995a: 14)[^nederman-1990].
    step1: |-
      学者们对如何解释《保卫者》中政治行动、哲学与启示之间的复杂关系意见分歧。一些人强调马西利乌斯信息的战斗性。例如，Conal Condren 解释说，《保卫者》中亚里士多德以及其他哲学资源（如阿威罗伊主义）的出现，并不必然表明马西利乌斯关心哲学问题（Condren 1977, 213）[^condren-1977]。另一些人指出，《保卫者》固然是一部政治论著，但其哲学基础为其论证结构增添了深度。例如，Cary Nederman 告诫说，不要把马西利乌斯的哲学视角仅仅化约为驱动《保卫者》的实践与论战意图（Nederman 1995a, 24）[^nederman-1995a]。理解马西利乌斯政治理论之实践功能的另一条途径，是把它置于西塞罗传统中。正如 Cary Nederman 所指出的，“西塞罗在马西利奥的思想中分量极重：《论义务》是《保卫者》中被引用最多的异教文本之一。”（Nederman 2020: 108）[^nederman-2020]事实上，西塞罗采取一种高度务实的方法——它同《保卫者》中马西利乌斯“战斗性”理论那种明确的“行动号召”十分相似（Nederman 1990; 1995a: 14）[^nederman-1990]。
    step2: |-
      《保卫者》中政治行动、哲学与启示之间的复杂关系，学者们解释不一。有人强调马西利乌斯信息的战斗性。例如，Conal Condren 解释说，《保卫者》里出现亚里士多德以及阿威罗伊主义之类的哲学资源，并不必然说明马西利乌斯关心哲学问题（Condren 1977, 213）[^condren-1977]。另一些人指出，《保卫者》固然是政治论著，但其哲学根基为论证结构增添了深度。例如，Cary Nederman 提醒说，不要把马西利乌斯的哲学视角仅仅化约为驱动《保卫者》的实践与论战意图（Nederman 1995a, 24）[^nederman-1995a]。要理解马西利乌斯政治理论的实践功能，另一条路是把它放回西塞罗传统。正如 Cary Nederman 所说，“西塞罗在马西利奥的思想中分量极重：《论义务》是《保卫者》中引用最多的异教文本之一。”（Nederman 2020: 108）[^nederman-2020]西塞罗本人就极其务实，这种务实与《保卫者》中马西利乌斯“战斗性”理论那种明确的“行动号召”颇为相似（Nederman 1990; 1995a: 14）[^nederman-1990]。
