      Scholars have long debated the role of Aristotelianism in Marsilius’s work, as this question is closely tied to the broader and complex issue of defining “political Aristotelianism” in the late Middle Ages (Briguglia 2013; Nederman 1996; Quillet 1970; Syros 2012)[^briguglia-2013][^nederman-1996][^quillet-1970][^syros-2012]. Cary Nederman argues that in the *Defender*, Aristotelianism is mainly “window dressing” used to attract support from Marsilius’ audience (Nederman 1996: 572)[^nederman-1996]. Other authors have stressed the “ideological” or rhetorical function of Aristotelianism in this text (Condren 1977; Piaia 1999)[^condren-1977][^piaia-1999]. A crucial aspect of Marsilius’s engagement with Aristotle is his willingness—like that of many medieval thinkers—to modify or reinterpret Aristotelian principles when he deems it necessary. Furthermore, Marsilius systematically integrates Aristotle’s ideas with those of Cicero, Augustine, and Ibn Rushd (Black 2008; Nederman 1990, 1995a; 1996; 2020; Mulieri, Masolini and Pelletier 2023; Syros 2012)[^black-2008][^masolini-2023][^nederman-1990][^syros-2012], creating a distinctive synthesis of philosophical, Roman, Christian, and Islamic thought. As explained by Syros, Marsilius’ political theory “draws on various traditions of learning that extend beyond the Aristotelian heritage” (Syros 2012: 5)[^syros-2012].
    step1: |-
      学者们长期争论亚里士多德主义在马西利乌斯著作中的作用，因为这个问题与界定中世纪晚期“政治亚里士多德主义”这一更广泛而复杂的议题紧密相关（Briguglia 2013; Nederman 1996; Quillet 1970; Syros 2012）[^briguglia-2013][^nederman-1996][^quillet-1970][^syros-2012]。Cary Nederman 主张，在《保卫者》中，亚里士多德主义主要是用来争取马西利乌斯受众支持的“门面装饰”（Nederman 1996: 572）[^nederman-1996]。其他作者强调亚里士多德主义在这部文本中的“意识形态”或修辞功能（Condren 1977; Piaia 1999）[^condren-1977][^piaia-1999]。马西利乌斯与亚里士多德打交道的一个关键方面，是他愿意——像许多中世纪思想家一样——在认为必要时修改或重新解释亚里士多德的原则。此外，马西利乌斯系统地把亚里士多德观念同西塞罗、奥古斯丁和伊本·鲁世德的观念结合起来（Black 2008; Nederman 1990, 1995a; 1996; 2020; Mulieri, Masolini and Pelletier 2023; Syros 2012）[^black-2008][^masolini-2023][^nederman-1990][^syros-2012]，形成一种哲学、罗马、基督教与伊斯兰思想的独特综合。正如 Syros 所解释的，马西利乌斯的政治理论“汲取了超出亚里士多德遗产之外的多种学术传统”（Syros 2012: 5）[^syros-2012]。
    step2: |-
      亚里士多德主义在马西利乌斯著作中扮演什么角色，学者们争论已久，因为这个问题牵连着中世纪晚期“政治亚里士多德主义”如何界定这一更大也更棘手的议题（Briguglia 2013; Nederman 1996; Quillet 1970; Syros 2012）[^briguglia-2013][^nederman-1996][^quillet-1970][^syros-2012]。Cary Nederman 认为，在《保卫者》中，亚里士多德主义主要是用来争取读者支持的“门面装饰”（Nederman 1996: 572）[^nederman-1996]。也有作者强调亚里士多德主义在这部文本中的“意识形态”或修辞功能（Condren 1977; Piaia 1999）[^condren-1977][^piaia-1999]。马西利乌斯对待亚里士多德，有一个关键之处：他愿意像许多中世纪思想家那样，在认为必要时修改或重新解释亚里士多德的原理。不仅如此，他还系统地融汇亚里士多德与西塞罗、奥古斯丁、伊本·鲁世德的观念（Black 2008; Nederman 1990, 1995a; 1996; 2020; Mulieri, Masolini and Pelletier 2023; Syros 2012）[^black-2008][^masolini-2023][^nederman-1990][^syros-2012]，造就一种哲学、罗马、基督教与伊斯兰思想的独特综合。用 Syros 的话说，马西利乌斯的政治理论“汲取了超出亚里士多德遗产之外的多种学术传统”（Syros 2012: 5）[^syros-2012]。
