      Albertino Mussato reports that, for some time, Marsilius had sought his advice, uncertain whether to pursue the study of medicine or law; he ultimately chose medicine (Godthardt 2006; 2012: 45–49)[^godthardt-2006]. It is likely that Marsilius began his studies—perhaps in medicine—in Padua, and subsequently continued them in Paris, although scholars disagree on the exact date of his relocation (Godthardt 2006, 2012; Courtenay 1999)[^courtenay-1999][^godthardt-2006]. The first reliable evidence of Marsilius’s presence in Paris is his tenure as rector of the Faculty of Arts, held between December 1312 and March 1313. This position suggests that he may have already been in Paris earlier, first as a student and later as a master (*magister*), most likely between 1310 and 1315—and possibly even as early as the beginning of the fourteenth century, according to Courtenay (1999). It is worth noting that during this period, the University of Paris was one of the most prominent intellectual and cultural centers in Western Europe, exposing Marsilius to a wide range of traditions and influential figures teaching there at the time.
    step1: |-
      阿尔贝蒂诺·穆萨托记载，马西利乌斯有一段时间曾向他求教，拿不定主意是学医还是学法；最终他选择了医学（Godthardt 2006; 2012: 45–49）[^godthardt-2006]。马西利乌斯很可能在帕多瓦开始学业——也许是医学——随后在巴黎继续，不过学者们对其迁居的确切日期意见不一（Godthardt 2006, 2012; Courtenay 1999）[^courtenay-1999][^godthardt-2006]。马西利乌斯在巴黎的第一条可靠证据，是他于 1312 年 12 月至 1313 年 3 月间担任艺学院院长。这一职位表明，他可能更早就在巴黎：先当学生，后当教师（*magister*），最可能是在 1310 年至 1315 年之间——按柯特尼（Courtenay 1999）的说法，甚至可能早至 14 世纪初。值得注意的是，这一时期巴黎大学是西欧最杰出的知识与文化中心之一，马西利乌斯因而接触到当时在该校任教的各种传统与有影响的人物。
    step2: |-
      据阿尔贝蒂诺·穆萨托记载，马西利乌斯曾有一段时间向他求教，在学医还是学法之间犹豫不决，最终选择了医学（Godthardt 2006; 2012: 45–49）[^godthardt-2006]。他很可能在帕多瓦开始学业——也许学的就是医学——随后转往巴黎继续，只是迁居的确切日期学者们说法不一（Godthardt 2006, 2012; Courtenay 1999）[^courtenay-1999][^godthardt-2006]。他在巴黎留下的第一条可靠证据，是 1312 年 12 月至 1313 年 3 月间出任艺学院院长。由此可以推想，他更早时已在巴黎：先做学生，后做教师（*magister*），最可能是在 1310 年至 1315 年之间；按柯特尼（Courtenay 1999）的看法，甚至可能早到 14 世纪初。值得一提的是，当时的巴黎大学是西欧最杰出的知识与文化中心之一，马西利乌斯因而得以接触在校任教的各种传统和有影响的人物。
