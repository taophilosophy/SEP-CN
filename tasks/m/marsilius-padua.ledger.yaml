      ### 6.3. The Idea of Natural Right
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      Marsilius’ theory of natural right reflects his radically distinctive understanding of the relationship between divine and human law and human acts, as previously discussed. In Chapter 12 of the second Discourse, Marsilius provides two different definitions of natural right. He first argues that natural right is something “upon which almost all agree as something honest that should be observed” (DP, 253). According to a second account, however, natural right is a “dictate of right reason” that falls under divine law. Marsilius clearly rejects the first account of natural right, writing that he considers it “equivocal” because “natural” in this context means “conventional” (DP, 254). As for the second view of natural right, Marsilius’ position is more ambiguous. Although he appears to suggest that, in this case as well, the phrase natural right could be considered equivocal—presenting something conventional as natural—he immediately adds that natural right as a “dictate of reason” is useful in distinguishing between what is licit and illicit “in absolute terms” (DP, 254). Marsilius defines “licit” as “everything that has been done according to a command or permission of the law or omitted according to a prohibition or permission of the law” (DP, 252), while “its contrary or opposite” is termed “illicit”. To illustrate this view, Marsilius refers to cases in which prohibitions and permissions deemed licit under human laws are patently illicit under divine law. In such cases, he explains, “what is licit and illicit in absolute terms should be understood according to divine law rather than human”. In fact, Marsilius acknowledges that absolute notions of “licit” and “illicit” play an important role in assessing moral behavior in earthly life. However, unlike Aquinas, Marsilius strips the idea of natural right of any decisive role in the formulation of human laws (Costa 2023)[^costa-2023]. For him, an extra-juridical standard for judging human action holds only limited political significance. This is because—just as in the case of Christian law’s judgment concerning deliberate “immanent” and “transitive” acts—punishments for transgressions and prohibitions grounded in natural right, and therefore in absolute notions of “licit” and “illicit,” can be enforced only in the afterlife by the supreme judge, Christ (Brett 2006; Costa 2023)[^brett-2006][^costa-2023]. This position makes clear that such punishments cannot be carried out in earthly life unless they are authorized by the human legislator (Lewis 1963; Nederman 1995a)[^lewis-1963][^nederman-1995a], which, as Marsilius explains in Chapter 12 of the first Discourse, is “the people” or the “universal body of citizens”.
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      Marsilius’ position is particularly original within the context of medieval political thought (Brett 2005; Hamilton-Bleakley 2007)[^brett-2005]. Yet, interpreters have disagreed on the sources of Marsilius’ position. For some, the roots of this position are to be found in Aristotle’s thought (Brett 2005)[^brett-2005]. Cary Nederman has emphasized the link between Marsilius’ ideas on natural right and Cicero’s views on the subject, also connecting it to Marsilius’ evocation of a “quasi-natural” law, which consists of a “certain duty of human society” (DP, 16), in the first part of the *Defender* (Nederman 2020: 111–112)[^nederman-2020]. Other interpreters have studied the complex relationship between Marsilius and Aquinas’ positions on natural law (Brett 2006; Costa 2023; Hamilton-Bleakly 2007)[^brett-2006][^costa-2023][^hamilton-bleakly-2007]. The strong similarities between Marsilius’ position and Averroes’ ideas in his commentary on the *Nicomachean Ethics* have also been underlined (Mulieri 2023a; Strauss 1953)[^mulieri-2023a][^strauss-1953]. This commentary had been translated into Latin by Hermannus Alemannus in the 13th century, and there is evidence of its presence in 13th-century Paris (Gauthier 1959: 117 and 123; Costa 2008)[^costa-2008][^gauthier-1959].
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      Regardless of its origins, Marsilius’s position on natural right must be understood in relation to his theory of collective prudence. As we have seen, in the *Defender*, he asserts that the theoretical foundation of human laws lies in a collective and epistemic conception of prudence (Mulieri 2023b; Nardi 1960; Syros 2007a; 2007b)[^mulieri-2023b][^nardi-1960][^syros-2007a]. Interpreting this claim in light of his stance on natural right—particularly his assertion that natural right has limited or no value in determining what is licit and illicit within the polity—further clarifies his broader legal and political framework. Indeed, Marsilius replaces natural right with his theory of collective prudence, which he regards as the sole source of legitimacy for human laws. This move may have been politically motivated. As Mulieri explains, “grounding human laws on natural law (which so often depended on divine law) could easily lend itself to being used as an argument in favour of the relevance of ecclesiastical power for the determination of temporal power”, thereby indirectly supporting claims in favor of the plenitude of power (Mulieri 2023: 556)[^mulieri-2023]. Conversely, by basing the legitimacy of human laws on a collective theory of prudence rather than on natural right, Marsilius provides an entirely human foundation for political authority and legal legitimacy in the polity he describes in the *Defender*.
