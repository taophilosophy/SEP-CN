      To better situate these positions, Marsilius examines the question of what kind of power Christ, who first established the Church in earthly life, granted to Peter and the Apostles at the very beginning of Christian history. Drawing on various arguments traditionally used by both sides in earlier disputes over the political characterization of ecclesiastical power (Briguglia 2013)[^briguglia-2013], Marsilius asserts that Christ explicitly subjected himself to the jurisdiction of civil power, as made clear by several Scriptural passages. According to Marsilius, Christ also submitted to the civil jurisdiction of Pilate’s trial. In fact, as explained by him, “Christ in his purposed intention, words and actions wanted to and did exclude himself and the apostles from the office of prince or of contentious jurisdiction, government or coercive judgement of whatever sort in this world” (DP, 161). Therefore, Christ never granted civil or coercive jurisdiction to the Apostles, Peter, or any other priest or bishop. This means that the power Christ conferred upon the Apostles and the early Church was not coercive in temporal terms but purely spiritual. As a result, the canonical laws of the Church and the decisions made by priests, bishops, and other ecclesiastical ministers hold only consultative, not binding, authority over civil and political matters. As he had already explained in the first Discourse (Chapter 6), Marsilius reiterates in the second Discourse that priests and members of the clergy fulfil an important moral and public function by guiding believers on the path to salvation. The Paduan describes priests as “physicians of the soul” and claims that “by analogy” with the physician, a “priest judges and exhorts concerning those things that lead to the eternal health of the soul or to its eternal death or temporal penalty for the status of the world to come. But he neither can nor should hold anyone to such things by coercive power in this world” (DP, 211). Therefore, punishments related to sins, stemming from the moral counsel of priests, are akin to a physician’s recommendations for healing—they are advisory rather than politically binding unless explicitly adopted and enforced by a civil or political authority.
    step1: |-
      为更好地定位这些立场，马西利乌斯考察了这样一个问题：在基督教历史之初，先在尘世建立教会的基督，把什么样的权力授予了彼得与使徒。他借用此前关于教会权力政治性质的争论中双方都使用的各种论证（Briguglia 2013）[^briguglia-2013]，断言基督明确服从了世俗权力的管辖，若干圣经段落清楚地说明了这一点。据马西利乌斯，基督也服从了彼拉多审判的民事管辖。事实上，如他所解释的，“基督在其有意为之的意图、言词与行动中，想要并且确实把自己与使徒排除在这个世界的君侯职位或争议管辖、治理或强制审判之外”（DP, 161）。因此，基督从未把民事管辖权或强制管辖权授予使徒、彼得，或任何其他司铎或主教。这意味着，基督授予使徒与早期教会的权力，在世俗意义上不是强制性的，而纯粹是精神性的。因此，教会的教会法以及司铎、主教和其他教职人员作出的决定，对民事与政治事务只有咨询性的、而无约束性的权威。正如他在第一编（第 6 章）已解释过的，马西利乌斯在第二编重申：司铎与神职人员通过引导信众走上救赎之路，履行着重要的道德与公共职能。这位帕多瓦人把司铎描述为“灵魂的医生”，并声称，与医生“类比”，司铎“就那些关乎灵魂永恒健康或永恒死亡、或关乎来世状态之尘世惩罚的事情作出判断与劝勉。但在此世，他既不能也不应以强制权力强迫任何人如此行事”（DP, 211）。因此，源于司铎道德劝勉的与罪相关的惩罚，类似于医生的治疗建议——它们是建议性的，而不具有政治约束力，除非被民事或政治权威明确采纳并执行。
    step2: |-
      要给这些立场定好位置，还得看马西利乌斯对另一个问题的考察：基督教历史之初，先在尘世建立教会的基督，究竟把什么权力授予了彼得与使徒。他取材于此前教会权力政治性质之争中双方共用的各种论证（Briguglia 2013）[^briguglia-2013]，断言基督明确服从世俗权力的管辖，多段经文可为明证。在他看来，基督也服从了彼拉多审判的民事管辖。他解释说，“基督在其有意为之的意图、言词与行动中，想要并且确实把自己与使徒排除在这个世界的君侯职位或争议管辖、治理或强制审判之外”（DP, 161）。所以，基督从未把民事管辖权或强制管辖权授予使徒、彼得或任何司铎主教。这就是说，基督授予使徒与早期教会的权力，在世俗意义上不带强制性，纯属精神性。于是，教会的教会法、司铎主教及其他教职人员的决定，对民事与政治事务只有咨询效力，没有约束效力。第一编（第 6 章）已有此说，第二编重申：司铎与神职人员引导信众走向救赎，履行着重要的道德与公共职能。这位帕多瓦人称司铎为“灵魂的医生”，并说，与医生“类比”，司铎“就那些关乎灵魂永恒健康或永恒死亡、或关乎来世状态之尘世惩罚的事情作出判断与劝勉。但在此世，他既不能也不应以强制权力强迫任何人如此行事”（DP, 211）。因此，由司铎道德劝勉而来的罪罚，好比医生开的治疗建议：只是建议，没有政治约束力，除非民事或政治权威明确采纳并付诸执行。
