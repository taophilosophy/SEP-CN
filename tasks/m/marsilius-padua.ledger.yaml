      Another important theme in the *Defender* is the presence of medical metaphors and concepts in Marsilius’ work. Of course, metaphors of the human body used to describe political problems already appear in Aristotle’s *Politics* and were also present in several medieval commentaries on this text. However, Marsilius’ training as a physician—attested by Mussato—his documented practice as a physician in Paris before leaving the city, as well as his closeness to Peter of Abano, likely played a role in his knowledge of this topic, which he drew from various medical and natural philosophy sources (Marangon 1997)[^marangon-1997]. Some scholars have rightly compared Marsilius’ attention to medical metaphors to that of John of Salisbury (Aichele 2012; Briguglia 2013; Nederman 1995a; Shogimen 2012)[^aichele-2012][^briguglia-2013][^nederman-1995a][^shogimen-2012], who draws similar comparisons in Books 5 and 6 of his *Policraticus* (see *Stanford Entry on John of Salisbury*). While the latter draws anatomical parallels between the various parts of the city and the various parts of the human body, Marsilius primarily employs the medical concept of complexion—that is, the Galenic notion of the proportional balance among the body’s various humors—to draw an analogy between the human body and the body politic (Kaye 2014)[^kaye-2014]. As Marsilius writes:
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      > An animal which is in a good condition in respect of its nature is composed of certain proportionate parts arranged in respect of each other, all communicating their actions between themselves and towards the whole; likewise too the city which is in a good condition and established in accordance with reason is made up of certain such parts. A city and its parts would therefore seem to be in the same relation to tranquillity as an animal and its parts is to health. (DP: 12)
    step1: TBD
