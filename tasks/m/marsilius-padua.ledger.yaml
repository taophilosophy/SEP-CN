      The relationship between Marsilius and the Aristotelian tradition warrants particular attention, given that Aristotle is the most frequently cited secular author in the *Defender*. Beginning in the 1260s, following William of Moerbeke’s Latin translation(s) of *Politics*, medieval thinkers increasingly engaged with this text, alongside the *Nicomachean Ethics*, to address ethical and political questions (Flueler 1992; Nederman 1996)[^nederman-1996]. Although the *Politics* was not part of the standard university *curriculum* (see entry on Medieval Political Philosophy), numerous scholars commented on the text and incorporated its passages into their political writings, either to provide a robust philosophical and theoretical foundation for their reflections or to engage with political issues relevant to their historical context (Lanza 2020; Toste 2020)[^lanza-2020][^toste-2020]. Marsilius, particularly in the first part of the *Defender* (though not exclusively there), follows this intellectual tradition, referring to Aristotle as “the best of philosophers” (DP, 5). Indeed, the *Defender* is replete with references to various Aristotelian works, primarily the *Politics*, but also the *Nicomachean Ethics*, the *Metaphysics*, the *Rhetoric*, and others. Marsilius’ reading of the *Politics* has attracted particular attention not only because the *Defender* contains roughly one hundred references to this text but also because, as explained by Lambertini, “Marsilius emerges as an attentive and knowledgeable reader of the Politica” (Lambertini 2023, 42)[^lambertini-2023].
    step1: |-
      马西利乌斯与亚里士多德传统的关系尤其值得注意，因为亚里士多德是《保卫者》中引用最多的世俗作者。13 世纪 60 年代起，随着威廉·凡·莫尔贝克（William of Moerbeke）对《政治学》的拉丁译本问世，中世纪思想家日益重视这部文本，并与《尼各马可伦理学》一道用它来处理伦理与政治问题（Flueler 1992; Nederman 1996）[^nederman-1996]。尽管《政治学》并不在标准大学课程（*curriculum*）之内（见“中世纪政治哲学”词条），众多学者仍评注这部文本，把其中的段落纳入自己的政治著作：或为反思提供坚实的哲学与理论基础，或借此介入与其历史语境相关的政治问题（Lanza 2020; Toste 2020）[^lanza-2020][^toste-2020]。马西利乌斯尤其在《保卫者》第一部（但不限于此）遵循这一思想传统，称亚里士多德为“最好的哲学家”（DP, 5）。的确，《保卫者》充满对亚里士多德各种著作的引用，首要的是《政治学》，但也有《尼各马可伦理学》《形而上学》《修辞学》等。马西利乌斯对《政治学》的解读尤其引人注目，不仅因为《保卫者》约有百处引用该书，而且正如兰贝蒂尼（Lambertini）所解释的，“马西利乌斯显现为《政治学》一位细心而博学的读者”（Lambertini 2023, 42）[^lambertini-2023]。
    step2: |-
      马西利乌斯与亚里士多德传统的关系尤其值得注意：在《保卫者》里，亚里士多德是引用最多的世俗作者。13 世纪 60 年代，威廉·凡·莫尔贝克（William of Moerbeke）译出《政治学》拉丁文本后，中世纪思想家日益重视此书，常与《尼各马可伦理学》并用，处理伦理与政治问题（Flueler 1992; Nederman 1996）[^nederman-1996]。《政治学》虽不在标准大学课程（*curriculum*）之列（见“中世纪政治哲学”词条），评注者却不少，许多人还把其中段落写进自己的政治著作：或为反思寻一个坚实的哲学与理论根基，或借以介入当下的政治问题（Lanza 2020; Toste 2020）[^lanza-2020][^toste-2020]。马西利乌斯在《保卫者》第一部（虽不限于此）正沿这一传统而行，称亚里士多德为“最好的哲学家”（DP, 5）。全书引用的亚里士多德著作极多，首推《政治学》，此外还有《尼各马可伦理学》《形而上学》《修辞学》等。马西利乌斯对《政治学》的解读尤其受关注：不仅因为《保卫者》引用此书约百处，更因为正如兰贝蒂尼所说，“马西利乌斯显现为《政治学》一位细心而博学的读者”（Lambertini 2023, 42）[^lambertini-2023]。
