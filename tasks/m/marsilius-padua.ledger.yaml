      The information on Marsilius’ life is scarce, as are the dates of his birth and death. His birth can likely be placed between 1275 and 1280, and his death in or before 1343. Marsilius’ earliest training took place in a rich and lively cultural environment in Padua between the late 13th and early 14th centuries. Starting in the 13th century, Padua had emerged as a significant intellectual center, witnessing the rise of two major developments (Collodo and Simonetti 2012; Hyde 1973)[^collodo-2012][^hyde-1973]. First, figures such as Lovato Lovati and Albertino Mussato—the latter being very close to Marsilius—had initiated a pre-humanist literary movement that placed the relationship between the present and classical antiquity at the forefront (Billanovich 1976)[^billanovich-1976]. Second, there was a growing engagement with Aristotelian natural philosophy, which, from the 13th century onward, shaped significant studies in medicine, astrology, and natural philosophy at the University of Padua. A significant representative of this tradition was Peter of Abano, who was likely one of Marsilius’ teachers and whose medical ideas would later exert a profound influence (Siraisi 1973)[^siraisi-1973].
    step1: |-
      关于马西利乌斯生平的资料很少，其生卒年月同样如此。他的出生时间大概可以定在 1275 年至 1280 年之间，去世则在 1343 年或更早。马西利乌斯最早的教育，是在 13 世纪末至 14 世纪初帕多瓦一个富庶而活跃的文化环境中接受的。自 13 世纪起，帕多瓦已崛起为重要的知识中心，见证了两大发展的兴起（Collodo and Simonetti 2012; Hyde 1973）[^collodo-2012][^hyde-1973]。第一，洛瓦托·洛瓦蒂（Lovato Lovati）与阿尔贝蒂诺·穆萨托（Albertino Mussato）等人——后者与马西利乌斯关系极近——发起了一场前人文主义文学运动，把当下与古典古代的关系置于首位（Billanovich 1976）[^billanovich-1976]。第二，对亚里士多德自然哲学的参与日益增长；自 13 世纪以降，这股风气塑造了帕多瓦大学在医学、占星学与自然哲学方面的重要研究。这一传统的一位重要代表是阿巴诺的彼得（Peter of Abano），他很可能是马西利乌斯的老师之一，其医学观念后来产生了深远影响（Siraisi 1973）[^siraisi-1973]。
    step2: |-
      关于马西利乌斯生平的记载很少，生卒年月也无从确考，只能大致定在 1275 年至 1280 年之间出生，1343 年或更早去世。他最早的教育，是在 13 世纪末至 14 世纪初帕多瓦那个富庶而活跃的文化环境里接受的。自 13 世纪起，帕多瓦已崛起为重要的知识中心，其间有两大发展（Collodo and Simonetti 2012; Hyde 1973）[^collodo-2012][^hyde-1973]。一是洛瓦托·洛瓦蒂（Lovato Lovati）与阿尔贝蒂诺·穆萨托（Albertino Mussato）等人——后者与马西利乌斯关系极近——发起前人文主义文学运动，把当下与古典古代的关系放在首位（Billanovich 1976）[^billanovich-1976]。二是对亚里士多德自然哲学的钻研日深；自 13 世纪以降，这股风气塑造了帕多瓦大学在医学、占星学与自然哲学上的重要研究。这一传统的重要代表是阿巴诺的彼得（Peter of Abano），他很可能是马西利乌斯的老师之一，其医学观念后来影响深远（Siraisi 1973）[^siraisi-1973]。
