      Marsilius’ ecclesiological arguments in the second Discourse have generally attracted less attention among contemporary scholars compared to the Paduan’s philosophical and political ideas. Michael Sweeney’s claim that “the secondary literature on Marsilius’ spiritual theology is one of the least developed areas of his thought” (Sweeney 2012, 184)[^sweeney-2012] aptly describes a prevailing prejudice that has even led some scholars to argue that, for Marsilius, Christianity was merely a “social problem” to be solved (Pincin 1967)[^pincin-1967]. This view fails to do justice to the fact that, in the second Discourse, Marsilius’s rejection of the plenitude of power is rooted in a highly innovative ecclesiological theory and a theory of the general council, to which, as we shall see, he gives a notably original definition. Two key aspects must be considered when assessing the second Discourse and its relationship to the first Discourse of the *Defender*. First, several scholars have emphasized that the second Discourse should be read as a consistent and logical continuation of the first, in which Marsilius presents his arguments based on human reason (Brett 2005; Briguglia 2013; Nederman 1995a)[^brett-2005][^briguglia-2013][^nederman-1995a]. In the second Discourse, he revisits some of these arguments but recasts them in theological and ecclesiological terms. In both Discourses, his primary objective remains the same: to refute the doctrine of the plenitude of power, albeit through different modes of reasoning. Second, for this reason, it is misguided to interpret the relationship between the two Discourses through the lens of the so-called “double truth” doctrine, which earlier scholars associated with the Averroist tradition (Condren 1977; Gilson 1948)[^condren-1977][^gilson-1948]—although the very notion of double truth has increasingly been challenged in recent scholarship (Bianchi 2008; Landucci 2006)[^bianchi-2008][^landucci-2006]. In the *Defender*, there is no opposition between reason and Revelation in the way Marsilius deploys arguments from both domains to critique the plenitude of power. Rather, he treats them as complementary, placing them on equal footing rather than in conflict
    step1: |-
      马西利乌斯在第二编中的教会论论证，一般不如这位帕多瓦人的哲学与政治观念那样受当代学者关注。Michael Sweeney 断言“关于马西利乌斯精神神学的二手文献，是其思想中发展最不足的领域之一”（Sweeney 2012, 184）[^sweeney-2012]，这恰切地描述了某种流行偏见；这种偏见甚至使一些学者主张，对马西利乌斯来说，基督教不过是亟待解决的“社会问题”（Pincin 1967）[^pincin-1967]。这种看法没有公正对待一个事实：在第二编中，马西利乌斯对权力充盈的拒斥，根植于一种极具创新性的教会论和公会议理论，而正如我们将看到的，他对公会议给出了格外原创的定义。评估第二编及其与《保卫者》第一编的关系时，必须考虑两个关键方面。第一，若干学者强调，第二编应被读作第一编前后一致、合乎逻辑的续篇：在第一编中，马西利乌斯提出基于人类理性的论证（Brett 2005; Briguglia 2013; Nederman 1995a）[^brett-2005][^briguglia-2013][^nederman-1995a]。在第二编中，他重访其中一些论证，但以神学与教会论术语重新表述。两编中他的首要目标始终如一：反驳权力充盈学说，只是推理方式不同。第二，正因如此，用所谓“双重真理”学说来解释两编之间的关系是错误的；早期学者把这种学说同阿威罗伊主义传统联系起来（Condren 1977; Gilson 1948）[^condren-1977][^gilson-1948]——尽管“双重真理”这一概念本身在晚近研究中日益受到质疑（Bianchi 2008; Landucci 2006）[^bianchi-2008][^landucci-2006]。在《保卫者》中，理性与启示并不对立，马西利乌斯从两个领域调动论证来批判权力充盈。相反，他把两者视为互补，使之处于平等地位而非相互冲突。
    step2: |-
      马西利乌斯第二编的教会论论证，向来不如这位帕多瓦人的哲学与政治观念受当代学者重视。Michael Sweeney 说“关于马西利乌斯精神神学的二手文献，是其思想中发展最不足的领域之一”（Sweeney 2012, 184）[^sweeney-2012]，这句话恰好点出一种流行偏见；受此影响，甚至有学者认为，对马西利乌斯来说，基督教不过是一个有待解决的“社会问题”（Pincin 1967）[^pincin-1967]。这种说法未免失之偏颇：第二编对权力充盈的拒斥，正根植于一种极具创新性的教会论与公会议理论，而他对公会议的定义，正如后文所示，格外原创。评估第二编及其与第一编的关系，有两点须把握。其一，若干学者强调，第二编应读作第一编前后一致、合乎逻辑的续篇：第一编的论证基于人类理性（Brett 2005; Briguglia 2013; Nederman 1995a）[^brett-2005][^briguglia-2013][^nederman-1995a]；第二编重访其中一些论证，只是改用神学与教会论语言。两编首要目标始终如一：反驳权力充盈学说，不过推理方式有别。其二，正因如此，用所谓“双重真理”学说来解释两编关系便是走错了路——早期学者常把这一学说同阿威罗伊主义传统挂钩（Condren 1977; Gilson 1948）[^condren-1977][^gilson-1948]；不过“双重真理”概念本身，晚近研究已多有质疑（Bianchi 2008; Landucci 2006）[^bianchi-2008][^landucci-2006]。在《保卫者》里，理性与启示并不对立：马西利乌斯从两个领域调取论证，同批权力充盈。他视二者为互补，使之平起平坐，而非彼此冲突。
