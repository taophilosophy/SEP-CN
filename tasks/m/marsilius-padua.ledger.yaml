      马西利乌斯的自然权利理论，反映了他对神法、人法与人类行为之间关系的那种彻底独特的理解，前文已讨论过。在第二编第 12 章，马西利乌斯给出自然权利的两种不同定义。他先主张，自然权利是“几乎所有人都同意应当遵守的某种正当之事”（DP, 253）。然而按第二种说法，自然权利是归于神法的“正确理性的命令”。马西利乌斯明确拒斥第一种自然权利说，写道他认为这种说法“含混”，因为此语境中的“自然的”意谓“约定的”（DP, 254）。至于第二种自然权利观，马西利乌斯的立场更模糊。尽管他似乎暗示，在此情形下“自然权利”一语同样可被视为含混——把某种约定的东西说成自然的——但他马上补充说，作为“理性命令”的自然权利，有用于区分“绝对意义上的”合法与非法（DP, 254）。马西利乌斯把“合法的”定义为“一切依法律的命令或许可而做、或依法律的禁止或许可而不做的事”（DP, 252），其“反面或对立面”则称为“非法的”。为说明这一观点，马西利乌斯举出一些情形：依人法被视为合法的禁止与许可，依神法却明显非法。他解释说，在这类情形中，“绝对意义上的合法与非法，应依神法而非人法来理解”。事实上，马西利乌斯承认，“合法”与“非法”的绝对观念在评估尘世生活中的道德行为时起重要作用。不过，与阿奎那不同，马西利乌斯剥去了自然权利观念在人法制定中的任何决定性作用（Costa 2023）[^costa-2023]。对他来说，判断人类行为的法外标准只具有有限的政治意义。这是因为——正如基督的法对有意“内在”与“及物”行为的判断一样——基于自然权利、因而基于“合法”与“非法”绝对观念的赏罚，只能由最高审判者基督在来世执行（Brett 2006; Costa 2023）[^brett-2006][^costa-2023]。这一立场清楚表明，此类惩罚在尘世生活中无法执行，除非得到人类立法者的授权（Lewis 1963; Nederman 1995a）[^lewis-1963][^nederman-1995a]；而正如马西利乌斯在第一编第 12 章所解释的，人类立法者就是“人民”或“公民的普遍团体”。
