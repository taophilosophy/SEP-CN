      ### 6.2. Evangelical Poverty and the Notion of “Right”
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      A further indication of continuity between the two Discourses of the *Defender* appears in Marsilius’ discussion of evangelical poverty in the second Discourse, which includes a highly original theory of natural right. In Marsilius’ time, a heated debate took place between certain factions within the Franciscan order and the clergy of the Roman Church over whether Christ and the Apostles had observed the vow of highest poverty, and what implications this had for the contemporary Church. While the former argued that Christ and the Apostles had embraced the ideal of highest poverty and that the Church should follow their example, the Roman Church rejected this position. Marsilius engages with the principal arguments in this debate and takes a clear stance. Scholars have noted that his treatment of the topic in the second Discourse closely resembles the structure of a *quaestio*, the traditional method of argumentation in medieval universities (Lambertini 2012)[^lambertini-2012]. Indeed, Marsilius discusses in detail many of the technical terms associated with the question and aligns himself with the Franciscans, affirming the view that Christ and the Apostles had renounced the property (*dominium*) of both individual and common possessions (DP, 262–286).
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      In II.8, the Paduan distinguishes between two principal meanings of the concept of “right”. One, which is central to Marsilius’ technical discussion of evangelical poverty, defines “right” as a “human act, power or acquired disposition that issues from an imperative of the human mind” (DP, 253). This conception has led some scholars to characterize this meaning of “right” as “subjective” (Brett 2006; Tierney 1991)[^brett-2006][^tierney-1991], in the sense that it refers to an individual’s capacity or entitlement to act. This meaning serves Marsilius’ purpose of isolating an idea of right that can be used to ground the legal idea of property (*dominium*), the definition of which is essential to any discussion of evangelical poverty. Marsilius also distinguishes another meaning, more typical of medieval thought, and identifies “right” with the third and fourth definitions of “law” presented in DP I.10. In this sense, “right” is essentially synonymous with law, understood either as a religious set of norms (such as Mosaic law or evangelical law) or as human law. It is this latter notion of right that proves crucial for understanding Marsilius’s discussion of natural right.
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      In fact, even if Marsilius takes the floor in the debate about apostolic poverty, upholding a conclusion that formally concurs with that defended by the Franciscans, he does so by subscribing to “a quite different theoretical framework, both on the level of ecclesiology and of political theory in general” (Lambertini 2012: 263)[^lambertini-2012]. Marsilius’ position on natural right, which closely echoes Aristotle, is a typical example of this same attitude. Marsilius does not accept the distinction between positive law and natural right, a distinction common in the Franciscan tradition (Lambertini 2012, 261)[^lambertini-2012]. As Lambertini points out, his silence on this topic “is telling and reveals once again his mistrust toward the notion of natural law” and his intention to defend Franciscan ideas without any recourse to Franciscan notions of natural law (Lambertini 2012, 262)[^lambertini-2012].
    step1: TBD
    step2: TBD
