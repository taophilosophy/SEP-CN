      Marsilius’ notion of the legislator has been interpreted in various ways by different scholars. Some, particularly in 20th-century scholarship, viewed his endorsement of the people as lawgivers as evidence that he was a precursor of modern ideas of democracy and liberalism or, more simply, a republican theorist (Gewirth 1951; Lagarde 1934; Skinner 1978)[^gewirth-1951][^skinner-1978]. Other scholars have emphasized that Marsilius’ formulation of the human legislator as the people should be understood as a reaffirmation of the *lex regia de imperio*, a point he makes clear in the *Defensor Minor* (Piaia 1999; Quillet 1970; Rubinstein 1965)[^piaia-1999][^quillet-1970][^rubinstein-1965]. More recently, several scholars, from different perspectives, have argued that Marsilius’ theory of the human legislator is merely a generic theoretical construction that he strategically advances to gain support from as many temporal rulers as possible in opposition to the idea of the plenitude of power (Briguglia 2013; Condren 1977; Nederman 1995a)[^briguglia-2013][^condren-1977][^nederman-1995a]. In this regard, it is also worth noting that, unlike Dante Alighieri (see entry on Dante Alighieri), Marsilius does not adhere to a universalist conception of empire. Rather, he believes that different types of political regimes can coexist (for example in DP, 496–497).
