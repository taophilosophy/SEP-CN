      Three aspects of Marsilius’ notion of the legislator must be emphasized. First, his theory of the legislator should primarily be understood as a theoretical construction that serves as the fundamental source of the legitimacy of power in the political community he envisions in the first Discourse (Mulieri 2023a; Nederman 1995a)[^mulieri-2023a][^nederman-1995a]. In this sense, as argued by Nederman, popular consent plays a crucial role in Marsilius’ theory of the legislator and his description of the political community (Nederman 1995a)[^nederman-1995a]. For the community to function properly, all members of the legislator and, more broadly, of the polity must agree on the human laws that are enacted, the division of the polity into its various parts, and the election of a particular government (see the entry on Medieval Political Philosophy). Second, Marsilius’ description of the legislator and the lawmaking procedure in certain chapters of the first part of *Defender* also reflects the functioning of lawmaking in the Italian city-states of his time (Briguglia 2013; Mulieri, Masolini and Pelletier 2023)[^briguglia-2013][^masolini-2023]. In fact, in Chapter 13 of the first Discourse (especially I.13.8), he distinguishes different stages of the lawmaking process and describes a continuous relationship between the prudent men and the general populace in the proposal, discussion, and approval of laws. Third, Marsilius’ concept of the human legislator also echoes legal theories of the legitimacy of power that were prevalent in the medieval period (Quillet 1970: Rubinstein 1965)[^quillet-1970][^rubinstein-1965]. For example, his depiction of the legislator as the people mirrors the idea, implicit in the *lex regia de imperio*, that the legitimacy of the emperor’s legislative or executive power derives from the Roman people (Lee 2018; Ullmann 1961)[^lee-2018][^ullmann-1961].
