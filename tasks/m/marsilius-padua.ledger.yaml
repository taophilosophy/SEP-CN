      This revised classification of law is related to a complex theory of human acts. Marsilius begins by distinguishing between acts that are “capable of being ordained to the end of this world, sc. the sufficiency of worldly life,” and those ordained “to the end of the world to come, which we call eternal life or glory” (DP, 213). He then classifies human acts into two main categories. The first, “non-commanded acts” (DP, 214), refers to “involuntary acts” (Costa 2023: 110)[^costa-2023], which occur “apart from the empire of the mind” (DP, 213), such as sensory perceptions and affective emotions—for example, desires caused by perception. The second category, which Marsilius names “commanded acts” (DP, 214), includes “imperative acts” (Costa 2023)[^costa-2023], which result “from the empire of the human mind” (DP, 213); that is, acts deliberately governed and commanded by the intellect, or rational part of the soul. Examples of the latter include deliberate decisions to fulfil or resist involuntary desires. “Commanded acts” are further divided into “immanent” and “transitive”. For Marsilius, “immanent” acts are those that do not extend beyond the subject “producing them” (DP, 214). These include internal acts—habits or operations of knowledge and desire—that hold moral significance but lack external consequences (Costa 2023: 108)[^costa-2023]. By contrast, “transitive” acts are performed through “some exterior organ of the body” (DP, 214) and represent the externalization of “immanent” acts in their effect upon other subjects. As such, “transitive” acts are those that extend beyond the agent and acquire both moral and juridical significance, insofar as they have the potential to cause harm or confer benefit upon others (Costa 2023)[^costa-2023].
    step1: |-
      这一修订过的法的分类，与一套复杂的人类行为理论相关。马西利乌斯先区分两类行为：一类“能够被规定朝向此世的目的，即现世生活的自足”，另一类被规定朝向“来世的目的，我们称之为永生或荣耀”（DP, 213）。然后他把人类行为分为两大范畴。第一类是“非受命行为”（DP, 214），指“非自愿行为”（Costa 2023: 110）[^costa-2023]，它们“在心灵统辖之外”发生（DP, 213），例如感官知觉与情感情绪——如由知觉引起的欲望。第二类被马西利乌斯称为“受命行为”（DP, 214），包括“命令性行为”（Costa 2023）[^costa-2023]，它们“出自人类心灵的统辖”（DP, 213）；即由理智或灵魂的理性部分有意治理并命令的行为。后者的例子包括满足或抵制非自愿欲望的有意决定。“受命行为”进一步分为“内在的”与“及物的”。对马西利乌斯来说，“内在的”行为是不超出“产生它们的”主体的行为（DP, 214）。这些包括内在行为——知识与欲望的习惯或运作——它们具有道德意义，却没有外在后果（Costa 2023: 108）[^costa-2023]。相比之下，“及物的”行为通过“身体的某个外部器官”实施（DP, 214），是“内在的”行为在其他主体身上产生效果的外化。因此，“及物的”行为超出行动者，并同时获得道德与法律意义，因为它们有可能对他人造成伤害或带来好处（Costa 2023）[^costa-2023]。
