      Marsilius’ idea of political reflection, as well as his discussion of the origins of human societies, exemplifies these two tendencies: both his reliance on Aristotelian concepts and his readiness to modify or reinterpret them in light of other intellectual traditions. For example, Marsilius’ appropriation of Aristotle’s thought as a theoretical framework for understanding the plenitude of power diverges from Aristotle on one important point. While, for Aristotle, practical sciences such as ethics and political science do not proceed in a demonstrative manner (Nielsen and Devin 2015)[^nielsen-2015], Marsilius explicitly states that his analysis will proceed with “sure methods” (*viis certis*). In other words, Marsilius ascribes to politics the same epistemological certainty that can be attributed to metaphysics, possibly echoing— in an original way—positions he encountered in certain commentators on the *Politics*, such as Peter of Auvergne (Petrus de Alvernia QS: 235).
    step1: |-
      马西利乌斯的政治反思观念，以及他对人类社会起源的讨论，都体现了这两种倾向：既依赖亚里士多德概念，又愿意依据其他思想传统修改或重新解释它们。例如，马西利乌斯借用亚里士多德思想作为理解权力充盈的理论框架，却在一点上背离亚里士多德。对亚里士多德来说，伦理学与政治学这类实践科学并不以证明方式推进（Nielsen and Devin 2015）[^nielsen-2015]；马西利乌斯却明确表示，他的分析将以“可靠方法”（*viis certis*）推进。换言之，马西利乌斯赋予政治学以可归于形而上学的同一种认识论确定性；这也许以一种原创的方式呼应了他在某些《政治学》评注者（如奥弗涅的彼得）那里遇到的立场（Petrus de Alvernia QS: 235）。
