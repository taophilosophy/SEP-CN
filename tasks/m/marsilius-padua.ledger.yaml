      The different models of law that Marsilius presents in II.8 regulate human acts in distinct ways. Marsilius argues that human laws do not concern themselves with involuntary or “immanent” acts; rather, they apply only to “transitive” acts, that is, acts with a practical bodily manifestation (DP, 215). When Marsilius claims that human laws regulate “transitive” acts, he means that such laws are capable of rewarding or punishing individuals who perform “transitive” acts within the framework of human jurisdiction and during this life. In contrast, Christian divine law—or evangelical law—applies to all deliberate acts, both “immanent” and “transitive”. It governs not only those acts that affect others but also those internal to the agent. However, the coercive power of divine law is limited to the afterlife. As a result, its rewards and punishments cannot be implemented in the present world by human authorities; they are reserved solely for Christ, the legislator of the life to come. This implies that, according to Marsilius, the law of Christ possesses no coercive force in the temporal realm. Only the human legislator—that is, “the people” or “the whole body of citizens”—may determine whether someone is to be punished or rewarded in this life, including for actions considered sinful under divine law. Therefore, Marsilius insists that divine and evangelical law lack any coercive power in the present life. Iacopo Costa highlights the anti-Thomistic nature of this position. In his comparison of Marsilius and Aquinas on the relationship between divine and human law, Costa describes Marsilius’ view as “probably one of the most revolutionary ideas that a medieval author put forward” (Costa 2023: 120)[^costa-2023].
    step1: |-
      马西利乌斯在 II.8 中提出的不同法的模型，以不同方式规范人类行为。他主张，人法不关心非自愿行为或“内在的”行为；人法只适用于“及物的”行为，即有实际身体表现的行为（DP, 215）。当马西利乌斯说人法规范“及物的”行为时，他的意思是：这类法能够奖赏或惩罚在人法管辖范围内、在此世实施“及物的”行为的个人。相比之下，基督的神法——或福音律法——适用于一切有意行为，无论“内在的”还是“及物的”。它不仅治理影响他人的行为，也治理行动者内部的行为。然而，神法的强制权力限于来世。因此，它的奖赏与惩罚无法由人类权威在现世实施；它们专属于基督，即来世生命的立法者。这意味着，按马西利乌斯的说法，基督的法在世俗领域不具任何强制力。只有人类立法者——即“人民”或“全体公民”——才能决定某人是否应在今生受罚或受赏，包括因依神法被视为罪的行为。因此，马西利乌斯坚持，神法与福音律法在今生不具任何强制权力。Iacopo Costa 强调这一立场的反托马斯主义性质。在比较马西利乌斯与阿奎那关于神法与人法关系的观点时，Costa 把马西利乌斯的看法描述为“中世纪作者提出过的最具革命性的观念之一”（Costa 2023: 120）[^costa-2023]。
