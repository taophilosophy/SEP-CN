      马西利乌斯的立场在中世纪政治思想语境中特别原创（Brett 2005; Hamilton-Bleakley 2007）[^brett-2005]。不过，解释者们对其立场来源意见不一。一些人认为，这一立场的根源在亚里士多德思想中（Brett 2005）[^brett-2005]。Cary Nederman 强调马西利乌斯自然权利观念与西塞罗相关观点的联系，并把它同马西利乌斯在《保卫者》第一部中援引的“准自然法”联系起来——后者由“人类社会的某种义务”构成（DP, 16）（Nederman 2020: 111–112）[^nederman-2020]。其他解释者研究了马西利乌斯与阿奎那在自然法立场上的复杂关系（Brett 2006; Costa 2023; Hamilton-Bleakly 2007）[^brett-2006][^costa-2023][^hamilton-bleakly-2007]。也有人强调马西利乌斯的立场与阿威罗伊在《尼各马可伦理学》评注中的观念之间存在强烈相似（Mulieri 2023a; Strauss 1953）[^mulieri-2023a][^strauss-1953]。这部评注在 13 世纪由赫尔曼努斯·阿莱曼努斯（Hermannus Alemannus）译成拉丁文，有证据表明 13 世纪的巴黎已有此书（Gauthier 1959: 117 and 123; Costa 2008）[^costa-2008][^gauthier-1959]。
