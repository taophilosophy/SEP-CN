      If Marsilius’ concept of the human legislator is primarily articulated in Chapter 12 of the first Discourse of the *Defender*, its philosophical foundations must be traced back to Chapter 11 (Mulieri 2023a; Gilson 1948; Nardi 1960)[^gilson-1948][^mulieri-2023a][^nardi-1960]. In Chapter 10, reflecting debates common among 13th- and 14th-century commentators on the *Politics* and the *Nicomachean Ethics* (Costa 2023; Lewis 1963)[^costa-2023][^lewis-1963], Marsilius outlines four distinct meanings of human law before isolating the definitions most central to his political system. In its third definition, “law” pertains to the norms of a religion and is defined as a “rule containing admonitions for those human acts that result from an imperative, insofar as they are ordered toward glory or punishment in the world to come” (DP, 52). In this definition, Marsilius includes all “religious followings” that are considered laws “either wholly or in part”, with the Mosaic and evangelical laws containing the full truth, in contrast to “those of Mohammed or the Persians” (DP, 53). Finally, in his fourth and most significant definition, Marsilius asserts that law can be understood in two ways: as a “science or doctrine of right” (DP, 53) when considered in terms of its content, and as a rule that must be enforced when viewed in terms of its implementation. For Marsilius, a proper human law must integrate both perspectives, such that a “perfect law” necessarily combines “justice” with “coercive power” (DP, 53). In Chapter 11, Marsilius situates this notion of perfect law within the framework of political prudence, drawing on a well-established idea among commentators on the *Nicomachean Ethics* that law requires prudence, which in turn depends on “long experience” (Costa 2023)[^costa-2023]. However, Marsilius’ perspective on this topic is particularly original.
