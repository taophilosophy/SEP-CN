      There is also a second task for philosophy in the *Defender*, which preserves an autonomous role for theory in Marsilius’ inquiry. Although Marsilius does not appear solely interested in an abstract metaphysical treatment of his subject, in paragraph 4 of Chapter 30 of the second Discourse, the Paduan writes: “no dispositions to action, other than faith, nor any action that results from them, is equally perfect as the disposition of the first philosopher or of the action that results from him” (DP, 537). Here, Marsilius defends the idea of the perfection of philosophy—a view widely held among Parisian philosophers of his time (Bianchi 1990; Costa 2012)[^bianchi-1990][^costa-2012]—and argues that first philosophy, or metaphysics, constitutes the highest form of human perfection, alongside faith. His conception of metaphysics in this context clearly also shows that, for Marsilius, philosophy is not conceived in opposition to Revelation.
