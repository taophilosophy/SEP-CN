      马西利乌斯著作中另一个重要主题，是亚里士多德关于心脏是身体中心器官、血液循环之源的观点。阿巴诺的彼得主张，心脏是人体的主要器官，因为灵魂与人的理智都寓于其中（Petrus de Abano 1504, f. 56v, Shogimen 2012: 104）[^shogimen-2012]。心脏是身体治理中心的传统观念，加上彼得的《调和者》中把这一主题同统治者在政治体制中的功能所作的比较，也出现在马西利乌斯那里（Shogimen 2012）[^shogimen-2012]。不过，在《保卫者》中，马西利乌斯对心脏这一医学—解剖学隐喻的政治含义持更细致的立场。在第一编第 15 章，他把人类立法者或“公民的普遍团体”定义为政治共同体的“灵魂”（*anima*）（DP, 92）。他声称，灵魂中有一部分是、或应当是“先在灵魂内部形成的，它类似于心脏”（DP, 91）。
