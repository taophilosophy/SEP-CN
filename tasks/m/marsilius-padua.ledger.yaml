      In Marsilius’ view, one of the main ways human beings can achieve a self-sufficient life is by ensuring that the actions and passions of the polity are proportionate, just as they are in a state of good health in the human body. Marsilius’ theory of government is based on the idea of complexion and on the premodern medical concept of the proportionate harmony of the body’s different humors as a necessary condition for achieving peace in the body politic (Shogimen 2012; Nederman 1995a)[^nederman-1995a][^shogimen-2012].
