      Perhaps after returning to Paris in 1321, Marsilius started working on his masterpiece, the *Defender of Peace*, which, as several manuscripts of this text indicate, must have been completed on 24 June 1324. At some point after the composition of this work, Marsilius left Paris with John of Jandun (though scholars are divided on whether he left immediately, in 1325, or in 1326, see Godthardt 2006, 2012; Courtenay 1999)[^courtenay-1999][^godthardt-2006] and went to the court of Ludwig the Bavarian in Munich to seek protection. From that moment onwards, Marsilius’ fate became intertwined with that of Ludwig. He accompanied him on his expedition to Italy, during which Ludwig was to be crowned Holy Roman Emperor in Rome in 1328 by Sciarra Colonna, a prominent member of the Roman aristocracy, and by Nicholas V, an anti-pope created by Ludwig himself. For his authorship of the *Defender*, Marsilius was excommunicated by John XXII in 1327 along with John of Jandun. In the final part of his life, evidence regarding Marsilius becomes even more fragmented, and we only know that he died at some point before or in 1343 in Munich.
    step1: |-
      也许是在 1321 年回到巴黎之后，马西利乌斯开始撰写他的代表作《和平的保卫者》。从该文本的若干抄本可知，此书必定完成于 1324 年 6 月 24 日。此书写成后的某个时候，马西利乌斯与让丹的约翰一同离开巴黎（不过学者们对他究竟是 1325 年立即离开，还是 1326 年离开，意见不一，见 Godthardt 2006, 2012; Courtenay 1999）[^courtenay-1999][^godthardt-2006]，前往慕尼黑巴伐利亚的路德维希的宫廷寻求庇护。从那一刻起，马西利乌斯的命运就与路德维希绑在一起。他随其远征意大利；1328 年，路德维希在罗马由罗马贵族的显要成员夏拉·科隆纳（Sciarra Colonna）以及由路德维希本人设立的对立教皇尼古拉五世加冕为神圣罗马帝国皇帝。由于撰写《和平的保卫者》，马西利乌斯于 1327 年与让丹的约翰一同被约翰二十二世开除教籍。在生命的最后阶段，关于马西利乌斯的证据更加零碎，我们只知道他于 1343 年或更早的某个时候卒于慕尼黑。
    step2: |-
      也许正是在 1321 年回到巴黎之后，马西利乌斯开始撰写代表作《和平的保卫者》。该文本的若干抄本表明，此书必完成于 1324 年 6 月 24 日。成书后的某个时候，马西利乌斯与让丹的约翰一道离开巴黎（学者们对他究竟是 1325 年即刻离去还是 1326 年才走，意见不一，见 Godthardt 2006, 2012; Courtenay 1999）[^courtenay-1999][^godthardt-2006]，投奔慕尼黑巴伐利亚的路德维希的宫廷，寻求庇护。从此，他的命运便与路德维希绑在一起。他随其远征意大利；1328 年，路德维希在罗马加冕为神圣罗马帝国皇帝，主持者是罗马贵族的显要成员夏拉·科隆纳（Sciarra Colonna），以及由路德维希本人设立的对立教皇尼古拉五世。因为撰写《和平的保卫者》，马西利乌斯于 1327 年与让丹的约翰一同被约翰二十二世开除教籍。至于晚年，证据更加零碎，我们只知道他卒于慕尼黑，时在 1343 年或更早。
