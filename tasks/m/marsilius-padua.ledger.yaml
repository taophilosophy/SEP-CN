      马西利乌斯的立法者概念有三方面必须强调。第一，他的立法者理论首先应被理解为一种理论建构，它在第一编所设想的政治共同体中充当权力正当性的根本来源（Mulieri 2023a; Nederman 1995a）[^mulieri-2023a][^nederman-1995a]。在这个意义上，正如 Nederman 所论，民众同意在马西利乌斯的立法者理论及其对政治共同体的描述中起关键作用（Nederman 1995a）[^nederman-1995a]。共同体要正常运转，立法者的一切成员、更广义地说政体的一切成员，都必须就所制定的法律、政体划分为各组成部分以及特定政府的选举达成一致（见“中世纪政治哲学”词条）。第二，马西利乌斯在《保卫者》第一部某些章节中对立法者与立法程序的描述，也反映了他那个时代意大利城邦立法活动的实际运作（Briguglia 2013; Mulieri, Masolini and Pelletier 2023）[^briguglia-2013][^masolini-2023]。事实上，在第一编第 13 章（尤其是 I.13.8），他区分了立法过程的不同阶段，并描述了明智者与普通民众在法律的提议、讨论与批准中的持续关系。第三，马西利乌斯的“人类立法者”概念也呼应了中世纪流行的关于权力正当性的法学理论（Quillet 1970: Rubinstein 1965）[^quillet-1970][^rubinstein-1965]。例如，他把立法者描绘为人民，正映照了《王权法》（*lex regia de imperio*）中隐含的观念：皇帝的立法权或行政权的正当性来自罗马人民（Lee 2018; Ullmann 1961）[^lee-2018][^ullmann-1961]。
