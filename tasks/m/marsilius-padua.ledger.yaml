      ## 7. The *Defensor Minor* and *De Translatione Imperii*. Marsilius’ Political Theory of Empire
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      Marsilius also authored a short treatise of 12 chapters called *De translatione imperii*. He announces the composition of this work in the last chapter of the second Discourse of the *Defender* (DP, 540). This treatise deals with a question that was quite typical in Marsilius’ context, i.e., the theme of the transfer of empire from the Romans to the Byzantines and then to the Franks and the Germans. The text largely reflects Landolfo Colonna’s pro-papal treatise *Tractatus de statu et mutatione imperii,* which was a work that Landolfo wrote in support of the role of the papacy in this transfer of empire (Briguglia 2012; Nederman 1995b)[^briguglia-2012][^nederman-1995b]. Marsilius’ text modifies Landolfo’s in some key passages with the aim of turning his treatise into a defence of the prerogatives of the empire. Marsilius’ presentation of this problem aims to defend the idea that none of the transfers of empire took place because of decisions of the clergy or the papacy but were the result of decisions made by human legislators.
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      Another work by Marsilius is the *Defensor Minor*, the composition date of which is likely 1340, though this remains a subject of scholarly debate. This short treatise reiterates some ideas that he had already explored in the *Defender of Peace* (with numerous quotations from the latter work). However, in this treatise, Marsilius’ pro-Empire stance becomes even more pronounced compared to the *Defender* (Briguglia 2012; Nederman 1995b)[^briguglia-2012][^nederman-1995b]. There are three main differences between the *Defensor Minor* and the *Defender of Peace*. First, in the former, Marsilius explicitly interprets his theory of the legislator as echoing the idea of the *lex regia de imperio*, referring to the legislator not simply as the people or the whole body of citizens but specifically as the Roman people (*populus romanus*). Second, unlike in the *Defender*, in *Defensor Minor* Marsilius appears to conflate the concepts of the legislator and the emperor (Briguglia 2012)[^briguglia-2012]. In fact, according to him, it is not the legislator, as in the *Defender*, but the emperor who has the authority to convene the Council. Third, and perhaps most importantly, the *Defensor Minor* may also serve as a response to William of Ockham’s ideas on the Council (Briguglia 2012)[^briguglia-2012]. While the latter denied the infallibility of the Council, Marsilius regarded this body as infallible, arguing that Truth emerges through dialogue among individual believers of the same faith and as a result of the workings of the Holy Spirit.
