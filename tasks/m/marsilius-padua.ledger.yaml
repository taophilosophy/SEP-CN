      In the years following his rectorate, Marsilius travelled repeatedly between Paris and Padua. There is evidence that he was in Padua in 1315, where he served as a witness to the orthodoxy of Peter of Abano during his trial for heresy (Pesenti 1980)[^pesenti-1980]. Similarly, in March 1319, Marsilius acted as an envoy and ambassador for the pro-imperial Ghibelline league led by Cangrande della Scala and Matteo Visconti, a coalition formed in Northern Italy in opposition to papal authority. At some point prior to 1321, Marsilius appears to have returned to Paris. According to John of Jandun—an Averroist philosopher and close associate—Marsilius brought with him from Padua a manuscript of Peter of Abano’s encyclopedic *Expositio* on the Pseudo-Aristotle *Problemata*, which Jandun is known to have consulted (Siraisi 1973: 164)[^siraisi-1973].
    step1: |-
      在卸任院长之后的几年里，马西利乌斯多次往返于巴黎与帕多瓦之间。有证据表明他 1315 年在帕多瓦，为阿巴诺的彼得在异端审判中的正统性作证（Pesenti 1980）[^pesenti-1980]。同样，1319 年 3 月，马西利乌斯作为使节与大使，为坎格兰德·德拉·斯卡拉（Cangrande della Scala）和马泰奥·维斯孔蒂（Matteo Visconti）领导的亲帝国吉伯林派联盟奔走；该联盟在意大利北部结成，以对抗教皇权威。1321 年之前的某个时候，马西利乌斯似乎已回到巴黎。据让丹的约翰——一位阿威罗伊主义哲学家、他的密切伙伴——说，马西利乌斯从帕多瓦带来一份阿巴诺的彼得对伪亚里士多德《问题集》的百科全书式《注释》抄本，已知让丹曾参考过它（Siraisi 1973: 164）[^siraisi-1973]。
    step2: |-
      卸任院长后的几年间，马西利乌斯多次往返巴黎与帕多瓦。有证据显示，1315 年他在帕多瓦，为阿巴诺的彼得在异端审判中的正统性作证（Pesenti 1980）[^pesenti-1980]。同样，1319 年 3 月，他作为使节和大使，为坎格兰德·德拉·斯卡拉（Cangrande della Scala）与马泰奥·维斯孔蒂（Matteo Visconti）领导的亲帝国吉伯林派联盟奔走；这个联盟在意大利北部结成，以对抗教皇权威。1321 年之前的某个时候，马西利乌斯似乎已回到巴黎。据让丹的约翰——一位阿威罗伊主义哲学家、他的密切伙伴——说，他从帕多瓦带来一份阿巴诺的彼得对伪亚里士多德《问题集》的百科全书式《注释》抄本，让丹曾参考过（Siraisi 1973: 164）[^siraisi-1973]。
