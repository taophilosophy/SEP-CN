      The *Defender* is a lengthy work divided into three Discourses (*dictiones*), each based on the type of sources or knowledge that, as Marsilius states, will be used to support his main arguments. In the first part, he argues against the plenitude of power based on “sure methods discovered by human rationality” (DP, 9); in the second, he writes that he will “corroborate what I shall take myself to have demonstrated with testimonies of the truth founded upon eternity, and also with authoritative passages of the saints, its interpreters, and other approved doctors of the Christian faith, so that this book should stand by itself, needing no extrinsic proof” (DP, 9). In the third, he summarizes the arguments presented in the previous two sections drawing “a number of conclusions or lessons of the utmost utility”, to “all citizens – those in the position of prince as much as those who are subject” (DP, 9). Given that Marsilius states in the first Discourse that he will rely more on arguments grounded in human reason, whereas in the second he will draw upon the language of Revelation, scholars have long debated how this distinction aligns with the overarching argument of the *Defender*. In the scholarly literature, there has been a prevailing tendency to characterize the first Discourse of the *Defender* as predominantly philosophical, while the second Discourse is generally seen as more theologically and ecclesiologically oriented. Broadly speaking, contemporary scholars have devoted greater attention to Marsilius’ philosophical-political ideas in the first Discourse (Ottaviani 2018; Syros 2012)[^ottaviani-2018][^syros-2012], with a particular focus on his concepts of republicanism, representation, and the role of the people (already noted in Lagarde 1934, but further explored in Skinner 1978)[^skinner-1978].
    step1: |-
      《保卫者》篇幅很长，分为三编（*dictiones*），每一编都依据马西利乌斯所说的、用来支持其主要论点的某类资料或知识。在第一编中，他依据“人类理性所发现的可靠方法”（DP, 9）反驳权力充盈；在第二编中，他写道，他将“用奠基于永恒之上的真理见证，以及圣徒、其解释者和其他经认可的基督教信仰博士的权威段落，来印证我认为已经证明的东西，使本书自足，无需外在证明”（DP, 9）。在第三编中，他总结前两编提出的论证，“引出若干极其有用的结论或教训”，面向“所有公民——无论身处君主之位者还是臣民”（DP, 9）。鉴于马西利乌斯在第一编中说他将更多依赖以人类理性为根据的论证，而在第二编中将借助启示的语言，学者们长期以来一直在争论这一区分如何与《保卫者》的整体论证相协调。在学术文献中，一种流行倾向是把《保卫者》第一编主要刻画为哲学的，而第二编一般被视为更偏神学与教会论。大体而言，当代学者更关注马西利乌斯在第一编中的哲学—政治观念（Ottaviani 2018; Syros 2012）[^ottaviani-2018][^syros-2012]，尤其聚焦于他的共和主义、代表制以及人民角色等概念（Lagarde 1934 已提及，Skinner 1978 进一步阐发）[^skinner-1978]。
