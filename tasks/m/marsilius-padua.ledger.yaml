      Marsilius’ position on the perfection of philosophy also sheds light on several genuinely philosophical claims advanced in the *Defender*. For instance, when explaining that the final cause of the polity is not merely “to live” but also “to live well,” he characterizes the latter as “having leisure for the liberal activities that result from the virtues both of the practical and of the theoretical soul” (DP, 18). This idea echoes the views of Aristotle (*Nicomachean Ethics*, Books I and X) as well as those of the Averroist philosopher John of Jandun, who, drawing on Jewish-Islamic sources (Brenet 2003, 2006; Lambertini 2013; Syros 2011)[^brenet-2003][^lambertini-2013][^syros-2011], argued that one of the principal duties of rulers in a political community is to promote wisdom and philosophy among all citizens (Brenet 2003, 2006; Lambertini 2013)[^brenet-2003][^lambertini-2013]. Additionally, Marsilius frequently equates the dispositions of prudence and science, ultimately articulating an epistemic theory of prudence as the foundation of human laws (Mulieri 2018)[^mulieri-2018]. It should be noted, however, that the concept of “living well” does not refer solely to the cultivation of the soul’s practical and intellectual virtues; it may also encompass the pursuit of activities aimed at ensuring the polity’s stability and its freedom from interference by the plenitude of power—elements that, in Marsilius’ view, already render a community self-sufficient and perfect.
    step1: |-
      马西利乌斯关于哲学完美性的立场，也照亮了《保卫者》中若干真正哲学性的主张。例如，他在说明政体的终极目的不只是“活着”而且是“活得好”时，把后者刻画为“有闲暇从事由实践灵魂与理论灵魂的德性所产生的自由活动”（DP, 18）。这一想法呼应了亚里士多德（《尼各马可伦理学》第一、十卷）以及阿威罗伊主义哲学家让丹的约翰的观点；后者借助犹太—伊斯兰资源（Brenet 2003, 2006; Lambertini 2013; Syros 2011）[^brenet-2003][^lambertini-2013][^syros-2011]，主张政治共同体中统治者的主要职责之一，是在全体公民中促进智慧与哲学（Brenet 2003, 2006; Lambertini 2013）[^brenet-2003][^lambertini-2013]。此外，马西利乌斯常常把明智与科学的倾向等同起来，最终阐发了一种把明智视为人法之基础的认知理论（Mulieri 2018）[^mulieri-2018]。不过应当注意，“活得好”的概念并不只指培养灵魂的实践德性与理智德性；它也可能包括从事旨在确保政体稳定、确保其不受权力充盈干预的活动——在马西利乌斯看来，这些要素已经使一个共同体自足而完美。
    step2: |-
      马西利乌斯关于哲学完美性的立场，也照亮了《保卫者》中若干真正属于哲学的主张。比如，他在说明政体的终极目的不止是“活着”、还要“活得好”时，把后者界说为“有闲暇从事由实践灵魂与理论灵魂的德性所产生的自由活动”（DP, 18）。这一想法上承亚里士多德（《尼各马可伦理学》第一、十卷），下应阿威罗伊主义哲学家让丹的约翰：后者借助犹太—伊斯兰思想资源（Brenet 2003, 2006; Lambertini 2013; Syros 2011）[^brenet-2003][^lambertini-2013][^syros-2011]，主张政治共同体中统治者的主要职责之一，就是在全体公民中推广智慧与哲学（Brenet 2003, 2006; Lambertini 2013）[^brenet-2003][^lambertini-2013]。此外，马西利乌斯屡屡把明智与科学这两种倾向等同起来，最终提出一套认知理论，把明智当作人法的根基（Mulieri 2018）[^mulieri-2018]。不过要留意，“活得好”并不只指培育灵魂的实践德性与理智德性；它也可以包括从事那些旨在确保政体稳定、使其免于权力充盈干预的活动——在马西利乌斯看来，这些要素已足以让一个共同体自足而完美。
