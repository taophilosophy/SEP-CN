      ### 6.4. Heresy, Excommunication and Marsilius’ Conciliarism
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      The same reasoning can be applied to how Marsilius theorizes heresy and excommunication. According to him, while ecclesiastical authorities certainly have a say in determining who counts as a heretic or who should be excommunicated, it is up to the civil and political authority to confirm and enforce this decision (DP, 455–459). Without this civil and coercive endorsement, decisions of the clergy on excommunication and heresy remain ineffective and politically irrelevant. In fact, as shown by Bettina Koch, while in *Defender* heresy remains a crime that can be punished, clergymen may participate in a trial for heresy only as advisors and experts, while final judgments can be passed only by the coercive secular judge, namely the legislator or the prince mandated by the legislator (Koch 2012: 165)[^koch-2012]. Moreover, Canon Law, for Marsilius, does not come with coercive power unless the human legislator decides to grant it such power, because it is not a set of laws that have been established by the human legislator. For Marsilius, insofar as we can speak of a priestly power, this is the “the power of performing the sacrament of the eucharist or body and blood of Christ, and also the power of binding or loosing men from their sin” (DP, 312). This power should instead be distinguished from the jurisdiction that certain bishops or ecclesiastical authorities exercise over a particular territory. While at the beginning of Church history these two powers were not clearly differentiated, over time they became entirely distinct, and the power of priests to perform the sacrament of the Eucharist no longer bore any direct relationship to jurisdictional authority.
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      At the core of Marsilius’s ecclesiological theory in the *Defender* lies a particularly original conception of the Council. Traditionally, the Council was understood as a gathering of bishops and other ecclesiastical authorities convened to decide matters of doctrine and church administration. In contrast, Marsilius envisions the Council as a “general assembly” of all the Christian faithful, representing “through succession, the gathering of the apostles and other elders of the faithful at that time” (DP, 361). The starting point of Marsilius’ reflection on this issue concerns the correct interpretation of the Holy Scriptures. Marsilius asserts that this interpretation should rest with the general Council of human believers—an assembly first convened by the Council of Apostles at the beginning of Christian history and which should continue to serve as the ultimate reference point for decisions regarding the interpretation of the Holy Scriptures. This assembly, which is “the general Council” of the faithful (DP 203; 358) rather than the Pope or the Roman clergy, must also have the authority to decide on complex ecclesiastical matters such as heresy, excommunication, and similar issues. Marsilius further states that “the provinces and communities of the world elect this Council” but “in accordance with the decision of their human legislator (be it single or several)” (DP 134). According to him, all the provinces of the world should elect a number of notables, priests, and laymen, who would then convene in a designated location to discuss what is necessary, appropriate, or uncertain regarding divine law. The members of the Council can make decisions concerning divine law. However, it would once again fall to the human legislator to transform the decisions of the Council into human laws and enforce them. This mechanism should not be interpreted through the lens of modern concepts of the separation of Church and State, but should instead be understood within the context of late medieval thought. In fact, as explained by Bettina Koch, Marsilius’ conciliarism “is not concerned to introduce a clear separation between Church and state, to use modern terminology. Indeed, he wants to integrate the Church into the secular state” (Koch 2012: 171)[^koch-2012].
