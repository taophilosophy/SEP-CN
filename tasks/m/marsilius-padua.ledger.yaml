      ### 6.4 Ecclesiology: Spiritual and Temporal Power
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      Marsilius’ attack on the plenitude of power leads him to develop highly original ideas regarding the concept of the Church and the role of the Council in the second Discourse. When discussing the Church, he begins by conducting a complex semantic analysis of the various meanings of this notion that were prevalent in his time. He argues that, based on its original Greek meaning, in its first and second senses, the term Church refers to “a gathering of a people contained under one single government” (DP, 144) and a “temple or house in which the faithful worship God as a community and most often pray to him” (DP, 144–145). A third meaning identifies the Church with “all the priests or bishops, deacons, and other ministers of the temple or church in the previous signification,” (DP 144) while a fourth meaning more specifically refers to the ecclesiastical ministries of the Church of Rome, including the Pope and the cardinals. Finally, Marsilius provides his own definition of the Church, which he describes as the “truest and most proper of all according to the original application of the term or the intention of those who originally applied it” (DP, 144). According to this definition, the Church is the “universal body of faithful believers who call upon the name of Christ, and of all the parts of this body within any community, even the household” (DP, 144). With this formulation, Marsilius presents a vision of the Church that is not hierarchical but horizontal, as it centers on the community of the faithful rather than the traditional ecclesiastical structures of the Roman Church in his time, with the Pope as its head. In fact, George Garnett has argued that Marsilius’ definition reflects the Church as it existed before Constantine’s conversion and demonstrates a “selective” use of Canon Law sources to show that, even after Constantine, the Church had not become a “papal monarchy,” as it became at a later stage (Garnett 2006: 189)[^garnett-2006]. This aligns well with Michael Sweeney’s characterization of Marsilius’ Church as an entity that, although it exists in the earthly world and maintains some relationship with temporal power, has its ultimate purpose in the heavenly world. (Sweeney 2012: 181)[^sweeney-2012].
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      To better situate these positions, Marsilius examines the question of what kind of power Christ, who first established the Church in earthly life, granted to Peter and the Apostles at the very beginning of Christian history. Drawing on various arguments traditionally used by both sides in earlier disputes over the political characterization of ecclesiastical power (Briguglia 2013)[^briguglia-2013], Marsilius asserts that Christ explicitly subjected himself to the jurisdiction of civil power, as made clear by several Scriptural passages. According to Marsilius, Christ also submitted to the civil jurisdiction of Pilate’s trial. In fact, as explained by him, “Christ in his purposed intention, words and actions wanted to and did exclude himself and the apostles from the office of prince or of contentious jurisdiction, government or coercive judgement of whatever sort in this world” (DP, 161). Therefore, Christ never granted civil or coercive jurisdiction to the Apostles, Peter, or any other priest or bishop. This means that the power Christ conferred upon the Apostles and the early Church was not coercive in temporal terms but purely spiritual. As a result, the canonical laws of the Church and the decisions made by priests, bishops, and other ecclesiastical ministers hold only consultative, not binding, authority over civil and political matters. As he had already explained in the first Discourse (Chapter 6), Marsilius reiterates in the second Discourse that priests and members of the clergy fulfil an important moral and public function by guiding believers on the path to salvation. The Paduan describes priests as “physicians of the soul” and claims that “by analogy” with the physician, a “priest judges and exhorts concerning those things that lead to the eternal health of the soul or to its eternal death or temporal penalty for the status of the world to come. But he neither can nor should hold anyone to such things by coercive power in this world” (DP, 211). Therefore, punishments related to sins, stemming from the moral counsel of priests, are akin to a physician’s recommendations for healing—they are advisory rather than politically binding unless explicitly adopted and enforced by a civil or political authority.
