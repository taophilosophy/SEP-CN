      Marsilius thus formulates a collective and trans-generational theory of experience and prudence as the necessary foundations of just human laws. The terms “experience” and “prudence” carry complex meanings in Marsilius’ thought (Mulieri 2023c)[^mulieri-2023c]. Following Aristotle, he presents prudence as a dianoetic virtue—one that requires cultivation through extensive practice, training and experience. For Marsilius, as for Aristotle, “experience” is the basis of prudence, which in turn serves as the grounding for human laws and ensures their impartiality. However, since human law is a collective enterprise—given that the legislator is “the people” or “the universal body of citizens”—Marsilius connects it to a collective notion of prudence. While Aristotle typically conceived of prudence as a dianoetic virtue pertaining to individual ethical action, in the *Politics* he also alludes to a collective form of prudence (*Politics* III.11–15, 1282a14–16), which can be exercised by the many through the *ex post* evaluation of magistrates within the polity. Some medieval commentators, such as Peter of Auvergne, briefly acknowledged this collective dimension of prudence, though without attributing to it significant importance. By contrast, also drawing on ideas rooted in the Latin Averroist tradition (Brenet 2006, 2019; Nardi 1960; Tabarroni 2019)[^brenet-2006][^nardi-1960][^tabarroni-2019], Marsilius places the concept of collective prudence at the core of his political theory, treating it as the very foundation of human law (Mulieri 2023c)[^mulieri-2023c]. Moreover, Marsilius uses the concepts of experience and prudence interchangeably with *scientia* (science), implying that they share the same degree of epistemic certainty.
