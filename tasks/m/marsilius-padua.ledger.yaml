      According to Marsilius, the best way to ensure this impartiality is to minimize the subjective interpretations of judges and instead ground human laws in an adequate theoretical framework—one that consists of a collective theory of knowledge and experience. This is where Marsilius develops what is arguably one of the most original aspects of his political theory (Mulieri 2023b; Nardi 1960)[^mulieri-2023b][^nardi-1960]: a collective theory of prudence with no clear antecedents in medieval political philosophy. In his view, the “long experience” necessary to acquire prudence must not derive from the knowledge of a single generation alone but must instead be the cumulative result of the experiences and insights of many successive generations over the course of history. As he writes:
    step1: |-
      在马西利乌斯看来，确保这种公正性的最佳方式，是尽量减少法官的主观解释，把人法奠基于一个充分的理论框架——一个由集体性的知识与经验构成的理论。正是在这里，马西利乌斯发展出其政治理论最原创的方面之一（Mulieri 2023b; Nardi 1960）[^mulieri-2023b][^nardi-1960]：一种集体明智理论，在中世纪政治哲学中没有明显先例。在他看来，获得明智所必需的“长期经验”，不应只来自单独一代人的知识，而必须是历史上许多相继世代的经验与洞见的累积结果。正如他写道：
