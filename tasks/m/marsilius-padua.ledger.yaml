      The spread of Marsilius’ ideas was considerable, especially during the age of the Wars of Religion, when his anti-papal message—particularly in the second Discourse—was adopted by several Protestants who were attacking the political and theological prerogatives of the Roman Church and the Pope. It is no accident that the first edition of *Defensor Pacis* was published in Basel in 1522, with several other editions following during the 16th and 17th centuries, notably in Germany. An English translation was completed by William Marshall for Thomas Cromwell in 1535. Several papalist Counter-Reformation texts attacked Marsilius’ doctrine in the *Defender* (often without reading it), and by 1559, the text had been placed on the *Index of Prohibited Books* (*Index Librorum Prohibitorum*) in Rome. During the 19th and 20th centuries, some scholars were primarily interested in the political ideas contained in the first Discourse of the *Defender*, sometimes interpreting Marsilius’ concepts of the people, representation, government, and human law through modern and anachronistic lenses. More recently, the study of Marsilius’ reception has experienced a revival. Scholars have examined the influence of his thought in 16th- and 17th-century England (Izbiky 2012; Simonetta 2000a,b)[^simonetta-2000a], in Althusius and Hobbes (Koch 2005, 2006; Simonetta 2000a,b)[^koch-2005][^simonetta-2000a], in Italian Renaissance and early modern political thought (Condren 1980; Masolini 2023; Piaia 1977)[^condren-1980][^masolini-2023][^piaia-1977], as well as his presence in contemporary contexts—for example, in the *Third Reich* (Godthardt 2023)[^godthardt-2023] or in contemporary political theory and philosophy (Mulieri 2021a; Nederman 2023; Piaia 2023; Vatter 2020)[^mulieri-2021a][^nederman-2023][^piaia-2023][^vatter-2020]. Nevertheless, the influence of Marsilius’ ideas remains a decidedly underdeveloped area of research that deserves more attention compared to other topics in Marsilius studies.
    step1: |-
      马西利乌斯思想的传播相当广泛，尤其在宗教战争时代，他反教皇的信息——特别是第二编中的信息——被若干攻击罗马教会与教皇政治、神学特权的新教徒采纳。《和平的保卫者》第一版 1522 年在巴塞尔出版，绝非偶然；16、17 世纪又出了若干版本，尤其在德国。1535 年，威廉·马歇尔为托马斯·克伦威尔完成了一部英译本。若干教皇派的反宗教改革文本攻击马西利乌斯《保卫者》中的学说（往往并未细读），到 1559 年，该书已被列入罗马的《禁书目录》（*Index Librorum Prohibitorum*）。19、20 世纪，一些学者主要关注《保卫者》第一编中的政治观念，有时以现代、时代错置的透镜解释马西利乌斯关于人民、代表制、政府与人法的概念。晚近以来，对马西利乌斯接受史的研究出现了复兴。学者们考察了他的思想在 16、17 世纪英格兰的影响（Izbiky 2012; Simonetta 2000a,b）[^simonetta-2000a]、在阿尔图修斯与霍布斯那里的影响（Koch 2005, 2006; Simonetta 2000a,b）[^koch-2005][^simonetta-2000a]、在意大利文艺复兴与近代早期政治思想中的影响（Condren 1980; Masolini 2023; Piaia 1977）[^condren-1980][^masolini-2023][^piaia-1977]，以及他在当代语境中的存在——例如在第三帝国（Godthardt 2023）[^godthardt-2023]，或在当代政治理论与哲学中（Mulieri 2021a; Nederman 2023; Piaia 2023; Vatter 2020）[^mulieri-2021a][^nederman-2023][^piaia-2023][^vatter-2020]。尽管如此，马西利乌斯思想的影响仍是一个明显欠发展的研究领域，与马西利乌斯研究中的其他题目相比，值得更多关注。
    step2: |-
      马西利乌斯的思想传播甚广，宗教战争时代尤盛：他反教皇的讯息——尤其第二编——被不少攻击罗马教会与教皇政治、神学特权的新教徒取用。《和平的保卫者》初版 1522 年刊于巴塞尔，绝非偶然；16、17 世纪又出了若干版，多在德国。1535 年，威廉·马歇尔为托马斯·克伦威尔译出英文本。教皇派的反宗教改革文本纷纷攻击《保卫者》的学说（往往并未细读）；1559 年，此书被列入罗马《禁书目录》（*Index Librorum Prohibitorum*）。19、20 世纪，一些学者主要盯住第一编的政治观念，时而以现代眼光、时代错置地解释马西利乌斯的人民、代表制、政府与人法概念。晚近，接受史研究复兴：学者考察其思想在 16、17 世纪英格兰的影响（Izbiky 2012; Simonetta 2000a,b）[^simonetta-2000a]、在阿尔图修斯与霍布斯那里的影响（Koch 2005, 2006; Simonetta 2000a,b）[^koch-2005][^simonetta-2000a]、在意大利文艺复兴与近代早期政治思想中的影响（Condren 1980; Masolini 2023; Piaia 1977）[^condren-1980][^masolini-2023][^piaia-1977]，也考察他在当代语境中的身影——如第三帝国（Godthardt 2023）[^godthardt-2023]，或当代政治理论与哲学（Mulieri 2021a; Nederman 2023; Piaia 2023; Vatter 2020）[^mulieri-2021a][^nederman-2023][^piaia-2023][^vatter-2020]。尽管如此，马西利乌斯思想的影响仍是研究中明显薄弱的一环，较之其他题目，更值得关注。
