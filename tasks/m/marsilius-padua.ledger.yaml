      ### 6.1. Divine/Human Laws and Human Acts
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      An indication of continuity between the two Discourses of the *Defender* appears in Marsilius’s theory of human acts and its relation to human, divine, and natural law. As discussed, in Chapter 10 of the first Discourse, Marsilius offers multiple definitions of law. In Chapter 8 of the second Discourse, he expands upon these distinctions in light of his theory of human acts. In this context, he slightly revises the fourfold model of law introduced in I.10 and proposes two additional typologies based on their relation to coercive power (*potentia coactiva*). He distinguishes laws that consist merely of admonitions without coercive force—such as those found in the “active or productive” disciplines (e.g., the arts)—from those, primarily human and divine law, that possess coercive power, meaning their observance or transgression may be “subject to penalty or reward being meted out to those who do or omit them through the coercive power of another agent” (DP, 215). Marsilius emphasizes that coercive power is applied differently across distinct domains. In the case of human law, rewards and punishments are enacted in this life; in contrast, divine law is concerned exclusively with rewards and punishments in the afterlife.
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      This revised classification of law is related to a complex theory of human acts. Marsilius begins by distinguishing between acts that are “capable of being ordained to the end of this world, sc. the sufficiency of worldly life,” and those ordained “to the end of the world to come, which we call eternal life or glory” (DP, 213). He then classifies human acts into two main categories. The first, “non-commanded acts” (DP, 214), refers to “involuntary acts” (Costa 2023: 110)[^costa-2023], which occur “apart from the empire of the mind” (DP, 213), such as sensory perceptions and affective emotions—for example, desires caused by perception. The second category, which Marsilius names “commanded acts” (DP, 214), includes “imperative acts” (Costa 2023)[^costa-2023], which result “from the empire of the human mind” (DP, 213); that is, acts deliberately governed and commanded by the intellect, or rational part of the soul. Examples of the latter include deliberate decisions to fulfil or resist involuntary desires. “Commanded acts” are further divided into “immanent” and “transitive”. For Marsilius, “immanent” acts are those that do not extend beyond the subject “producing them” (DP, 214). These include internal acts—habits or operations of knowledge and desire—that hold moral significance but lack external consequences (Costa 2023: 108)[^costa-2023]. By contrast, “transitive” acts are performed through “some exterior organ of the body” (DP, 214) and represent the externalization of “immanent” acts in their effect upon other subjects. As such, “transitive” acts are those that extend beyond the agent and acquire both moral and juridical significance, insofar as they have the potential to cause harm or confer benefit upon others (Costa 2023)[^costa-2023].
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      The different models of law that Marsilius presents in II.8 regulate human acts in distinct ways. Marsilius argues that human laws do not concern themselves with involuntary or “immanent” acts; rather, they apply only to “transitive” acts, that is, acts with a practical bodily manifestation (DP, 215). When Marsilius claims that human laws regulate “transitive” acts, he means that such laws are capable of rewarding or punishing individuals who perform “transitive” acts within the framework of human jurisdiction and during this life. In contrast, Christian divine law—or evangelical law—applies to all deliberate acts, both “immanent” and “transitive”. It governs not only those acts that affect others but also those internal to the agent. However, the coercive power of divine law is limited to the afterlife. As a result, its rewards and punishments cannot be implemented in the present world by human authorities; they are reserved solely for Christ, the legislator of the life to come. This implies that, according to Marsilius, the law of Christ possesses no coercive force in the temporal realm. Only the human legislator—that is, “the people” or “the whole body of citizens”—may determine whether someone is to be punished or rewarded in this life, including for actions considered sinful under divine law. Therefore, Marsilius insists that divine and evangelical law lack any coercive power in the present life. Iacopo Costa highlights the anti-Thomistic nature of this position. In his comparison of Marsilius and Aquinas on the relationship between divine and human law, Costa describes Marsilius’ view as “probably one of the most revolutionary ideas that a medieval author put forward” (Costa 2023: 120)[^costa-2023].
