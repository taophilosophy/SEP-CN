      The primary task of philosophy in the *Defender* is to address the practical concern of investigating the divisions caused by the doctrine of the plenitude of power. This is accomplished by identifying the conditions necessary for the establishment of a perfect human community capable of achieving self-sufficiency and maintaining political stability. Marsilius distinguishes his political reflections from the “natural science of plants and animals” (DP, 24). Nevertheless, he develops a political theory that—drawing on Aristotle and other philosophical sources—proceeds by analogy, comparing the political body to the biological functions and mechanisms of the human body. Scholarly literature has highlighted the influence of Peter of Abano and other natural philosophical texts on Marsilius’s method (Marangon 1997; Quillet 1970; Shogimen 2012; Syros 2012)[^marangon-1997][^quillet-1970][^shogimen-2012][^syros-2012]. Marsilius’s effort to analyze thoroughly the various semantic implications of the terms and concepts he employs in both Discourses—aimed specifically at uncovering the causes of political stability and instability—also reflects his academic training and intellectual activity at the University of Paris in the fourteenth century (Courtenay 1999, 70)[^courtenay-1999].
    step1: |-
      《保卫者》中哲学的首要任务，是处理一个实践关切：考察权力充盈学说所造成的分裂。这一任务通过辨明建立完美人类共同体所需的条件来完成——这样的共同体能够实现自足并维持政治稳定。马西利乌斯把自己的政治思考同“植物与动物的自然科学”（DP, 24）区分开来。不过，他发展出一套政治理论，借亚里士多德及其他哲学资源，以类比方式推进，把政治体比作人体的生物功能与机制。学术文献已强调阿巴诺的彼得和其他自然哲学文本对马西利乌斯方法的影响（Marangon 1997; Quillet 1970; Shogimen 2012; Syros 2012）[^marangon-1997][^quillet-1970][^shogimen-2012][^syros-2012]。马西利乌斯在两编中都力求彻底分析他所用术语与概念的各种语义蕴含——尤其旨在揭示政治稳定与不稳定的原因——这也反映出他在 14 世纪巴黎大学的学术训练与思想活动（Courtenay 1999, 70）[^courtenay-1999]。
