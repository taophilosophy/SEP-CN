      Marsilius’ theory of natural right reflects his radically distinctive understanding of the relationship between divine and human law and human acts, as previously discussed. In Chapter 12 of the second Discourse, Marsilius provides two different definitions of natural right. He first argues that natural right is something “upon which almost all agree as something honest that should be observed” (DP, 253). According to a second account, however, natural right is a “dictate of right reason” that falls under divine law. Marsilius clearly rejects the first account of natural right, writing that he considers it “equivocal” because “natural” in this context means “conventional” (DP, 254). As for the second view of natural right, Marsilius’ position is more ambiguous. Although he appears to suggest that, in this case as well, the phrase natural right could be considered equivocal—presenting something conventional as natural—he immediately adds that natural right as a “dictate of reason” is useful in distinguishing between what is licit and illicit “in absolute terms” (DP, 254). Marsilius defines “licit” as “everything that has been done according to a command or permission of the law or omitted according to a prohibition or permission of the law” (DP, 252), while “its contrary or opposite” is termed “illicit”. To illustrate this view, Marsilius refers to cases in which prohibitions and permissions deemed licit under human laws are patently illicit under divine law. In such cases, he explains, “what is licit and illicit in absolute terms should be understood according to divine law rather than human”. In fact, Marsilius acknowledges that absolute notions of “licit” and “illicit” play an important role in assessing moral behavior in earthly life. However, unlike Aquinas, Marsilius strips the idea of natural right of any decisive role in the formulation of human laws (Costa 2023)[^costa-2023]. For him, an extra-juridical standard for judging human action holds only limited political significance. This is because—just as in the case of Christian law’s judgment concerning deliberate “immanent” and “transitive” acts—punishments for transgressions and prohibitions grounded in natural right, and therefore in absolute notions of “licit” and “illicit,” can be enforced only in the afterlife by the supreme judge, Christ (Brett 2006; Costa 2023)[^brett-2006][^costa-2023]. This position makes clear that such punishments cannot be carried out in earthly life unless they are authorized by the human legislator (Lewis 1963; Nederman 1995a)[^lewis-1963][^nederman-1995a], which, as Marsilius explains in Chapter 12 of the first Discourse, is “the people” or the “universal body of citizens”.
