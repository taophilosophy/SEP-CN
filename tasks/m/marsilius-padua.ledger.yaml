      马西利乌斯主要在第一编开头的几章讨论人类社会起源以及政体划分为各组成部分的问题。不过他处理这些问题的方式相对亚里士多德颇为原创。后者区分了人类社会发展的三个阶段：家庭、村落与城邦（*polis*）（Aristotle, *Politics*, 1252a24–1254a13）。马西利乌斯则以两种独特而原创的方式重新解释这一图式。第一，他的处理完全略去亚里士多德的自然奴隶概念——自然奴隶在家庭中扮演特定角色，奴隶同妇女、儿童一样处于父亲权威之下。第二，马西利乌斯特别关注家长权力与村长权力的区别，而亚里士多德对此着墨甚少。正如马西利乌斯所解释的，在家庭的情形里，“单个家庭的家主”显然可以“完全凭自己的意愿和喜好赦免或惩罚家庭过错”；在村落的情形里，这对“作为这个称为村落的第一个共同体的首领”的他来说“就不合法了”（DP, 16）。马西利乌斯主张，家长可以正当地按自己的意志行使权力，村长则不然，因为村落具有一些使之更接近政治共同体的特征。他明确说，在村落里，“长者必须依某种合理的条例或准自然法来分配公正而有利的东西”（DP, 17），这表明村落内部已经存在某种形式的政治秩序。
