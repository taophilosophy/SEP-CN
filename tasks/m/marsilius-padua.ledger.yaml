      如果说马西利乌斯的人类立法者概念主要在第一编第 12 章得到阐发，那么其哲学基础必须追溯到第 11 章（Mulieri 2023a; Gilson 1948; Nardi 1960）[^gilson-1948][^mulieri-2023a][^nardi-1960]。在第 10 章，马西利乌斯回应 13、14 世纪《政治学》与《尼各马可伦理学》评注者之间的常见争论（Costa 2023; Lewis 1963）[^costa-2023][^lewis-1963]，先勾勒人法的四种不同含义，然后抽出对其政治体系最核心的定义。在第三种定义中，“法”涉及一种宗教的规范，被定义为“一项包含针对那些由命令产生的人类行为的告诫的规则，就其被规定朝向来世的荣耀或惩罚而言”（DP, 52）。在这一定义中，马西利乌斯把一切“宗教追随体系”都纳入“整体或部分”被视为法的范围，其中摩西律法与福音律法包含完整真理，与“穆罕默德或波斯人的”法相对（DP, 53）。最后，在第四种也最重要的定义中，马西利乌斯断言，法可以从两方面理解：就内容而言，是“关于权利的科学与学说”（DP, 53）；就实施而言，是必须被强制执行的规则。对马西利乌斯来说，正当的人法必须整合这两个方面，因此“完善的法”必然把“正义”与“强制权力”结合起来（DP, 53）。在第 11 章，马西利乌斯把这种完善法的概念置于政治明智的框架中，借用《尼各马可伦理学》评注者中一个确立已久的观念：法需要明智，而明智又依赖“长期经验”（Costa 2023）[^costa-2023]。不过，马西利乌斯在这个问题上的视角特别原创。
