      It is well established that Marsilius composed three principal writings: *Defensor Pacis* (his *magnum opus* and by far his most extensive work), *Defensor Minor* (a more concise reiteration of many ideas from the former, with a stronger pro-imperial stance, likely written in 1340), and *De translatione imperii* (which reproduces Landolfo Colonna’s treatise *Tractatus de statu et mutatione imperii*, with some minor yet meaningful modifications). His involvement in a few additional texts, mostly unrelated to political matters, remains disputed in most cases (Mulieri, Masolini and Pelletier 2023, 13)[^masolini-2023].
    step1: |-
      可以确定，马西利乌斯写了三部主要著作：《和平的保卫者》（他的代表作，也是篇幅最大的一部）、《小保卫者》（对前者许多观念更简练的重述，亲帝国立场更强，很可能写于 1340 年），以及《帝国的转移》（它复述了兰多尔福·科隆纳的论著《论帝国的状态与变迁》，只作了少量却意味深长的修改）。他还参与过另外几部文本，大多与政治事务无关；这些参与在多数情况下仍存争议（Mulieri, Masolini and Pelletier 2023, 13）[^masolini-2023]。
    step2: |-
      可以确定，马西利乌斯有三部主要著作：《和平的保卫者》（他的代表作，也是篇幅最大的一部）、《小保卫者》（把前书许多观念重述得更简练，亲帝国立场更强，很可能写于 1340 年），以及《帝国的转移》（复述兰多尔福·科隆纳的《论帝国的状态与变迁》，只作了少量却意味深长的修改）。此外的几部文本，大多与政治事务无关，他是否参与多数仍存争议（Mulieri, Masolini and Pelletier 2023, 13）[^masolini-2023]。
