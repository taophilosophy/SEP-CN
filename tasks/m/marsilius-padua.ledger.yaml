      Another important theme in Marsilius’s work is the Aristotelian notion of the heart as the central organ of the body and the source of blood circulation. Peter of Abano argues that the heart is the principal organ of the human body because it houses both the soul and human intellect (Petrus de Abano 1504, f. 56v, Shogimen 2012: 104)[^shogimen-2012]. The traditional idea that the heart is the governing center of the body, along with the comparison found in Peter’s *Conciliator* between this theme and the function of the ruler in the political regime, also appears in Marsilius (Shogimen 2012)[^shogimen-2012]. However, in the *Defender*, Marsilius presents a more nuanced position on the political implications of the medical-anatomical metaphor of the heart. In Chapter 15 of the first Discourse, he defines the human legislator or “universal body of citizens” as the “soul” (*anima*) of the political community (DP, 92). From this soul, he claims, one part is or should be “formed first within it, which is analogous to the heart” (DP, 91).
