    kind: body
    source: |-
      He presents his opinion on universals as intermediate between those of Thomas Aquinas and Giles of Rome, on the one side, and Walter Burley, on the other (see the entry on Wyclif). Like Giles Wyclif recognizes three main kinds of universals: (1) ideal universals, which are the ideas in God and archetypes of all that is; (2) formal universals, which are the common natures shared by individual things; and (3) intentional universals, which are the mental signs by which we refer to the formal universals, or universals *in re*. On the other hand, like Burley, Wyclif holds that formal universals exist outside our minds *in actu* and not *in potentia*, even if, unlike Burley, he maintains that they are really identical with their own individuals (*De enti in communi*, ch. 5. p. 58). More precisely, universals and individuals are really the same but formally distinct, since they share the same empirical reality, which is that of individuals, but if considered as universals and individuals, they have opposite constituent principles: the generality or natural-tendency-to-be-common for universals, and the thisness or impossibility-of-being-common for individuals (see *Tractatus de universalibus*, ch. 2, pp. 62–63, ch. 4, pp. 86–87; ch. 10, pp. 208–13).
    step1: |-
      他把自己的共相观点呈现为介于两方之间：一方是托马斯·阿奎那（Thomas Aquinas）与罗马的吉莱斯（Giles of Rome），另一方是沃尔特·伯利（Walter Burley）（见威克里夫词条）。与吉莱斯一样，威克里夫承认三种主要的共相：(1) 观念共相（ideal universals），即上帝心中的诸理念，是万物的原型；(2) 形式共相（formal universals），即个体事物所分享的共同本性；(3) 意向共相（intentional universals），即我们借以指涉形式共相或事物中（*in re*）共相的心灵符号。另一方面，与伯利一样，威克里夫主张形式共相现实地（*in actu*）而非仅仅潜在地（*in potentia*）存在于我们的心灵之外，尽管与伯利不同，他主张它们与其个体实在地同一（《论共同存在》，*De enti in communi*，ch. 5, p. 58）。更精确地说：共相与个体是实在的同一，而只是形式上不同，因为它们共享同一个经验实在——即个体的实在；但若分别作为共相与个体来考虑，它们便拥有相反的构成原则：共相是普遍性或趋于共同的天然倾向，个体是此性（thisness）或不可能共同。见《论共相》（*Tractatus de universalibus*），ch. 2, pp. 62–63；ch. 4, pp. 86–87；ch. 10, pp. 208–13。
    step2: |-
      他把共相观点呈现为介于两造之间：一造是托马斯·阿奎那（Thomas Aquinas）与罗马的吉莱斯（Giles of Rome），另一造是沃尔特·伯利（Walter Burley）（见威克里夫词条）。与吉莱斯相同，威克里夫承认三种主要共相：(1) 观念共相（ideal universals），即上帝心中的诸理念、万物的原型；(2) 形式共相（formal universals），即个体事物分享的共同本性；(3) 意向共相（intentional universals），即我们借以指涉形式共相或事物中（*in re*）共相的心灵符号。另一方面，与伯利相同，威克里夫主张形式共相现实地（*in actu*）而不仅是潜在地（*in potentia*）存在于心灵之外；不过与伯利不同，他认为共相与其个体实在同一（《论共同存在》，*De enti in communi*，ch. 5, p. 58）。说得再精确些：共相与个体实在同一而形式上不同——两者共享同一个经验实在（也就是个体的实在）；但一旦分别作为共相与个体来看，二者便有相反的构成原则：共相是普遍性、是趋于共同的天然倾向，个体是此性（thisness）、是不可能共同。见《论共相》（*Tractatus de universalibus*），ch. 2, pp. 62–63；ch. 4, pp. 86–87；ch. 10, pp. 208–13。
  - id: 8
    kind: body
    source: |-
      This description of the logical relationship between universals and individuals entailed the possibility of an indirect inherence of an accidental form in a substantial universal and of a second intention in any other. Therefore in the *Tractatus de universalibus* Wyclif distinguished three main types of real predication in order to guarantee such possibilities: formal predication (*praedicatio formalis*), predication by essence (*praedicatio secundum essentiam*), and predication by relation (*praedicatio secundum habitudinem*). These three kinds of predication are described by him as three non-mutually exclusive ways of predicating, each more general than the preceding (*Tractatus de universalibus*, ch. 1, p. 35), but it is evident that predication by relation does not require any kind of identity between the entities signified by the subject and predicate terms in the same way as formal predication and predication by essence do. Formal predication is that in which the form designated by the predicate-term is directly present in the entity signified by the subject- term. Predication by essence (note that in this expression the term ‘essence’ has Wyclif’s technical meaning of *real entity with a given nature*—see the entry on Wyclif) is that in which the same empirical reality is both the real subject and predicate, even though the formal principle connoted by the predicate-term differs from that connoted by the subject-term. ‘God is man’ and ‘The universal is particular’ are instances of this kind of predication. Finally, predication by relation is that in which the form connoted by the predicate-term does not inhere, directly or indirectly (namely, not by itself but by means of something that is directly present in the thing signified by the subject-term), in the essence designated by the subject but simply implies a relation to it, so that the same predicate may be at different times said truly or falsely of its subject without any change in the subject itself (*Tractatus de universalibus*, ch. 1, p. 34). According to Wyclif, we use such predication mainly to express theological truths, such as God is known and loved by many creatures or brings about, as efficient, exemplar, and final cause many good effects.
    step1: |-
      这种对共相与个体之间逻辑关系的刻画，蕴含了这样的可能性：一个偶性形式可以间接地内在于一个实体共相之中，一个第二意向也可以间接地内在于另一个第二意向之中。因此，威克里夫在《论共相》（*Tractatus de universalibus*）中区分了三种主要的实在谓述，以保证这类可能性：形式谓述（*praedicatio formalis*）、依本质的谓述（*praedicatio secundum essentiam*）与依关系的谓述（*praedicatio secundum habitudinem*）。他把这三种谓述描述为三种不相互排斥的谓述方式，每一种都比前一种更普遍（《论共相》，ch. 1, p. 35）；但显而易见，依关系的谓述并不像形式谓述与依本质的谓述那样，要求主词项与谓词项所指意的实体之间存在任何同一性。形式谓述是指：谓词项所指意的形式直接现于主词项所指意的实体之中。依本质的谓述（注意：在这一表达中，“本质”取威克里夫的专门含义，即“具有某种本性的实在实体”——见威克里夫词条）是指：同一个经验实在既是实在的主词又是实在的谓词，尽管谓词项所意涵的形式原则不同于主词项所意涵的形式原则。“上帝是人”与“共相是个体”就属于这类谓述。最后，依关系的谓述是指：谓词项所意涵的形式并不——直接或间接地（即不凭自身，而是凭借某种直接现于主词项所指意事物之中的东西）——内在于主词所指意的本质之中，而只是意涵一种与该本质的关系；于是，同一个谓词可以在不同时候对同一主词或真或假，而主词本身没有任何改变（《论共相》，ch. 1, p. 34）。按威克里夫的看法，我们主要用这种谓述来表达神学真理，比如“上帝被众多受造物认识并爱戴”，或“上帝作为动力因、范式因与目的因产生众多善果”。
    step2: |-
