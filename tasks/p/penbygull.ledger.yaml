    source: |-
      The treatise on universals is a work of around 30–35 printed pages, which, despite its brevity, is of some philosophical depth. It consists of the same textual material as Roger Whelpdale’s (d. 1423) *Tractatus de universalibus* for about half of its extension; however they have different doctrinal outcomes: while Penbygull’s treatise is aimed to be a discussion and defence of Wyclif’s theses on universals and predication, such a purpose seems to be alien to Whelpdale’s. Furthermore, in Whelpdale’s tract is absent that particular theory of identity and distinction that we find clearly exposed in Penbygull’s *De universalibus* and mentioned in Scharpe’s *Quaestio super universalia* and in Milverley’s *Compendium de quinque universalibus*. Yet, they both remained very close to Wyclif’s teaching as manifested in the *Purgans errores circa universalia in communi*, since they divided predication into formal (*formalis*), by essence (*secundum essentiam*), and causal (*secundum causam*), and considered these three kinds of predication mutually exclusive.
    step1: |-
      这部论共相的著作篇幅约 30–35 个印刷页，尽管简短，却有相当的哲学深度。在其约一半的篇幅中，它与罗杰·惠尔普代尔（Roger Whelpdale，卒于 1423）的《论共相》（*Tractatus de universalibus*）使用同样的文本材料；然而两者的教义结局不同：彭比尔的论著旨在讨论与捍卫威克里夫关于共相与谓述的论题，而这样的目的似乎与惠尔普代尔的论著相异。此外，惠尔普代尔的论著缺少那种特殊的同一性与区分理论——我们在彭比尔的《论共相》（*De universalibus*）中看到它得到清晰的阐述，在夏普（Scharpe）的《共相问题》（*Quaestio super universalia*）与米尔弗利（Milverley）的《五共相纲要》（*Compendium de quinque universalibus*）中它也被提及。不过，两者都非常接近威克里夫在《斥共相通论之误》（*Purgans errores circa universalia in communi*）中所展示的教导，因为它们把谓述分为形式的（*formalis*）、依本质的（*secundum essentiam*）与因果的（*secundum causam*），并认为这三种谓述相互排斥。
    step2: |-
      论共相的这部著作约 30–35 个印刷页，篇幅虽短，却有相当的哲学深度。约一半篇幅与罗杰·惠尔普代尔（Roger Whelpdale，卒于 1423）的《论共相》（*Tractatus de universalibus*）共用同一批文本材料，但两者的学说旨趣迥异：彭比尔的论著旨在讨论并捍卫威克里夫关于共相与谓述的论题，这种目的在惠尔普代尔那里似乎全然缺席。此外，惠尔普代尔的论著中不见那套特殊的同一性与区分理论——它清晰地呈现在彭比尔的《论共相》（*De universalibus*）里，夏普（Scharpe）的《共相问题》（*Quaestio super universalia*）与米尔弗利（Milverley）的《五共相纲要》（*Compendium de quinque universalibus*）也曾提及。尽管如此，两者都紧随威克里夫在《斥共相通论之误》（*Purgans errores circa universalia in communi*）中示现的教导：把谓述分为形式的（*formalis*）、依本质的（*secundum essentiam*）与因果的（*secundum causam*）三类，并视之为互斥。
