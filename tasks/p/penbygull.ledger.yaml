      This description of the logical relationship between universals and individuals entailed the possibility of an indirect inherence of an accidental form in a substantial universal and of a second intention in any other. Therefore in the *Tractatus de universalibus* Wyclif distinguished three main types of real predication in order to guarantee such possibilities: formal predication (*praedicatio formalis*), predication by essence (*praedicatio secundum essentiam*), and predication by relation (*praedicatio secundum habitudinem*). These three kinds of predication are described by him as three non-mutually exclusive ways of predicating, each more general than the preceding (*Tractatus de universalibus*, ch. 1, p. 35), but it is evident that predication by relation does not require any kind of identity between the entities signified by the subject and predicate terms in the same way as formal predication and predication by essence do. Formal predication is that in which the form designated by the predicate-term is directly present in the entity signified by the subject- term. Predication by essence (note that in this expression the term ‘essence’ has Wyclif’s technical meaning of *real entity with a given nature*—see the entry on Wyclif) is that in which the same empirical reality is both the real subject and predicate, even though the formal principle connoted by the predicate-term differs from that connoted by the subject-term. ‘God is man’ and ‘The universal is particular’ are instances of this kind of predication. Finally, predication by relation is that in which the form connoted by the predicate-term does not inhere, directly or indirectly (namely, not by itself but by means of something that is directly present in the thing signified by the subject-term), in the essence designated by the subject but simply implies a relation to it, so that the same predicate may be at different times said truly or falsely of its subject without any change in the subject itself (*Tractatus de universalibus*, ch. 1, p. 34). According to Wyclif, we use such predication mainly to express theological truths, such as God is known and loved by many creatures or brings about, as efficient, exemplar, and final cause many good effects.
