      彭比尔与其一代的其他牛津逻辑学家一样，试图改进威克里夫的理论：排除依关系的谓述，并以略有不同的方式重新定义另外两种谓述。因此，彭比尔把谓述（他把它设想为形而上学对象之间的一种实在关系［《论共相》，p. 188］）分为形式谓述（*praedicatio formalis*）、依本质的谓述（*secundum essentiam*）与因果谓述。依本质的谓述显示主词与谓词之间的部分同一——两者共享某些但并非全部的形而上学构成部分——并且不要求谓词项所意涵的形式直接现于主词项所指意的本质之中。相反，形式谓述要求这种直接在场。如果谓词项所意涵的形式内在于主词的本性，那么该谓述就是形式本质谓述；如果它是外在的，则该谓述就是形式偶性谓述。“人是动物”是形式本质谓述的实例；“苏格拉底是白的”是形式偶性谓述的实例。威克里夫只把依本质的谓述用于第二意向——因为他承认“(凡)共相(即)单一者”（即 *universale est singulare*）这样的句子是合乎语法且真实的——与威克里夫不同，彭比尔认为依本质的谓述也适用于第一意向。因此他主张，只要至少有一个个体是白的，就可以把白的属性谓述给普遍的人（*homo in communi*）。不过他确保以中性形式的实体化形容词作谓词项，因为只有这样，才能显明谓词项所意涵的形式并不直接现于主词之中，而是通过其个体间接地归属于主词。因此，只要至少有一个现存的人是白的，他就承认命题“普遍的人是（某种）白的”（*homo in communi est album*）为真（《论共相》，pp. 186–87）。最后，当谓词项所指意的事项不以任何方式现于主词项所指意的事项之中，而实在的主词是由实在的谓词所产生的时候，就是因果谓述（《论共相》，p. 188）。
