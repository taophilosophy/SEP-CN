      Formal accidental predication is then further divided into according to change/motion (*secundum motum*) and according to relation (*secundum habitudinem*) (see *De universalibus*, pp. 187–88). The basic idea of this last division seems to be that modes of being and natures of the accidental forms determine the set of substantial items which can play the role of their substrate. Penbygull distinguishes between those accidental forms that require a substance capable of undergoing change (*per se mobile*) as their own direct substrate of inherence, and those which do not need a substrate with such a characteristic. Forms like quantity, whiteness, alteration, diminution and so on belong to the first group, while relations of reason and *respectus*, like causation, difference, and so on, fall under the second one. The forms of the first group bring about formal accidental predication *secundum motum*, and the forms of the second group formal accidental predication *secundum habitudinem*. The former necessarily entail singular substances as their substrates, since individuals alone can undergo change, while the latter can directly inhere in both individual and universal substances (*insunt denominative tam communibus quam singularibus*—*De universalibus*, p. 188).
    step1: |-
      形式偶性谓述又被进一步分为依变化/运动的谓述（*secundum motum*）与依关系的谓述（*secundum habitudinem*）（见《论共相》，pp. 187–88）。后一划分的基本想法似乎是：偶性形式的存在方式与本性，决定了哪些实体性事项可以充当它们的基体。彭比尔区分了两类偶性形式：一类要求以能够承受变化的实体（*per se mobile*）作为其直接的内属基体；另一类则不需要具有这种特征的基体。量、白性、变化、减少等诸形式属于第一组；而理性关系与 *respectus*，如因果关系、差异关系等，则归入第二组。第一组的形式造成依运动的（*secundum motum*）形式偶性谓述，第二组的形式造成依关系的（*secundum habitudinem*）形式偶性谓述。前者必然以单一实体为其基体，因为只有个体才能承受变化；后者则可以直接内属于个体实体与共相实体（*insunt denominative tam communibus quam singularibus*——*De universalibus*, p. 188）。
