      The information on the life and works of William Penbygull (or Penbegyll) is scanty. He was from Exeter diocese; he studied at Oxford, where he was fellow of Exeter College in 1399, and rector in 1406–07. He was licensed to preach in the diocese of Bath and Wells on 28 February 1410. He probably died at Oxford in 1420. According to Emden 1957–59, he wrote the following treatises on logic: *De universalibus* (*On Universals*), *Divisio entis* (*The Division of Being*), and *Super Porphyrii Isagogen* (*On Porphyry’s Isagoge*).
    step1: |-
      关于威廉·彭比尔（或拼作 Penbegyll）的生平与著作，资料颇为稀少。他来自埃克塞特（Exeter）教区；他就读于牛津，1399 年任埃克塞特学院（Exeter College）评议员（fellow），1406–07 年任院长（rector）。1410 年 2 月 28 日，他获准在巴斯与韦尔斯（Bath and Wells）教区讲道。他可能于 1420 年在牛津去世。据 Emden 1957–59，他写有下列逻辑论著：《论共相》（*De universalibus*，On Universals）、《存在的划分》（*Divisio entis*，The Division of Being）与《波菲利〈导论〉评注》（*Super Porphyrii Isagogen*，On Porphyry's Isagoge）。
    step2: |-
      威廉·彭比尔（又拼 Penbegyll）的生平与著作资料甚少。他出身埃克塞特（Exeter）教区，在牛津求学，1399 年成为埃克塞特学院评议员（fellow），1406–07 年任院长（rector）；1410 年 2 月 28 日获准在巴斯与韦尔斯（Bath and Wells）教区讲道。他大约于 1420 年在牛津去世。据 Emden 1957–59 所载，他撰有下述逻辑论著：《论共相》（*De universalibus*，On Universals）、《存在的划分》（*Divisio entis*，The Division of Being）与《波菲利〈导论〉评注》（*Super Porphyrii Isagogen*，On Porphyry's Isagoge）。
