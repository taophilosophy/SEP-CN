      As is well known, in the second and third decades of the fourteenth century, Ockham argued that the common realist account of the relationship between universals and individuals was incoherent. His central argument was that if universals are something existing *in re*, really identical with their individuals, then whatever is predicated of individuals must be predicated of their universals too. Hence a unique universal entity (say, human nature) would possess contrary attributes simultaneously (short and tall, young and old), just as different individuals do. This is clearly unacceptable (*In Praedicamenta* 8.1; *Summa logicae* I, 15). Later medieval Realists conceded that the traditional explanation of the universals-individulas relation was questionable, but they were confident that realism was still preferable to nominalism. It was simply a matter of finding the right countermeasures. Two fundamental strategies emerged: either to accept a real distinction between universals and particulars, or to elaborate new notions of identity and distinction. The first strategy was adopted solely by Walter Burley; the second, developed by many authors, took two different approaches: one inspired by Hervaeus Natalis’s notion of conformity and one (the predominant one) inspired by Duns Scotus’s formal distinction. This second approach was that of the most important school of later medieval Realists: the so-called *Oxford Realists*, started by John Wyclif.
    step1: |-
      众所周知，在十四世纪二十与三十年代，奥卡姆论证说：关于共相与个体之间关系的通行实在论说明是不融贯的。其核心论证是：如果共相是存在于事物之中（*in re*）的东西、与其个体实在地同一，那么凡是谓述个体的东西也必定谓述其共相。于是，一个独一无二的普遍实体（比如说人性）就会像不同的个体那样同时拥有相反的属性（既矮又高、既老又少）。这显然不可接受（*In Praedicamenta* 8.1；*Summa logicae* I, 15）。后期中世纪实在论者承认，对共相—个体关系的传统解释有问题，但他们仍自信实在论优于唯名论；问题只在于找到正确的对策。由此出现两种基本策略：要么承认共相与殊相之间存在实在区分，要么发展新的同一性与区分概念。前一策略只为沃尔特·伯利（Walter Burley）一人采纳；后一策略由许多作者发展，又分两条路径：一条受埃尔韦·纳塔利（Hervaeus Natalis）的“符合”（conformity）概念启发，另一条（占主导地位的一条）受邓斯·司各脱（Duns Scotus）的形式区分启发。第二条路径属于后期中世纪实在论者最重要的学派——由约翰·威克里夫（John Wyclif）开创的所谓*牛津实在论者*（Oxford Realists）。
    step2: |-
      众所周知，十四世纪二三十年代，奥卡姆论证了通行的实在论说明——即关于共相与个体关系的那种说明——并不融贯。其核心论证是：若共相是存在于事物之中（*in re*）的东西，且与其个体实在同一，则凡可谓述个体者必可谓述其共相。如此一来，独一无二的普遍实体（比如人性）便会像不同的个体一样同时具有相反属性（既矮又高、既老又少）。这显然不可接受（*In Praedicamenta* 8.1；*Summa logicae* I, 15）。后期中世纪的实在论者承认，对共相—个体关系的传统解释确有可疑之处，但他们坚信实在论仍然优于唯名论，剩下的问题只是找到正确的对策。由此形成两种基本策略：或者承认共相与殊相之间有实在区分，或者精心构造新的同一性与区分概念。前者仅沃尔特·伯利（Walter Burley）一人采用；后者由众多作者发展，又分两路：一路受埃尔韦·纳塔利（Hervaeus Natalis）的“符合”（conformity）概念启发，另一路（也是主流）受邓斯·司各脱（Duns Scotus）的形式区分启发。后一路径正是后期中世纪实在论最重要学派——由约翰·威克里夫（John Wyclif）开创的所谓*牛津实在论者*（Oxford Realists）——所取的路径。
