      Penbygull, like other Oxford logicians of his generation, tried to improve Wyclif’s theory by excluding predication by relation and redefining the other two kinds in a slightly different way. Penbygull therefore divides predication (which he conceives as a real relation which holds between metaphysical objects [*De universalibus*, p. 188]) into formal predication (*praedicatio formalis*), predication by essence (*secundum essentiam*), and causal predication. Predication by essence shows a partial identity between subject and predicate, which share some, but not all, metaphysical component parts, and does not require that the form connotated by the predicate-term be directly present in the essence denotated by the subject-term. Formal predication, on the contrary, requires such a direct presence. If the form connotated by the predicate-term is intrinsic to the nature of the subject, then the predication is a case of formal essential predication, while if it is extrinsic, the predication is a case of formal accidental predication. “Man is an animal” is an instance of formal essential predication; “Socrates is white” is an instance of formal accidental predication. Unlike Wyclif, who applied predication by essence to second intentions only—since he admitted sentences like “(What is) universal is (what is) singular” (that is, *universale est singulare*) as well-formed and true—Penbygull thinks that it holds also when applied to first intentions. So he claims that it is possible to predicate of the universal-man (*homo in communi*) the property of being white, if at least one of its individuals is white. However he makes sure to use as a predicate-term a substantival adjective in its neuter form, because only in this way can it appear that the form connoted by the predicate-term is not directly present in the subject, but is indirectly attributed to it, through its individuals. Therefore he acknowledges the proposition “The universal-man is (something) white” (*homo in communi est album*) as a true one, if at least one of the existing men is white (*De universalibus*, pp. 186–87). Finally, there is causal predication when the item signified by the predicate-term is not present in any way in the item signified by the subject-term, but the real subject has been caused by the real predicate (*De universalibus*, p. 188).
