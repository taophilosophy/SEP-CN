      Peirce was more direct in a course of Lowell Lectures on ‘Ideality in the physical sciences’ delivered at Harvard in 1879, which James Peirce edited for posthumous publication (Peirce 1881b)[^peirce-1881b]. ‘Ideality’ connoted ‘ideal-ism’ as evident in certain knowledge, ‘pre-eminently the foundation of the mathematics’. His detailed account concentrated almost entirely upon cosmology and cosmogony with some geology (Petersen 1955). He did not argue for his stance beyond some claims for existence by design.
    step1: |-
      皮尔斯在 1879 年于哈佛讲授的“自然科学中的理想性”洛厄尔讲座课程中更为直白，该讲稿由 James Peirce 编订并于身后出版（Peirce 1881b）[^peirce-1881b]。“理想性”含有“观念论”（ideal-ism）之意，即在某种确然知识中显明者，“尤其是数学的基础”。他详尽的论述几乎完全集中于宇宙论与宇宙生成论，兼及一些地质学（Petersen 1955）。除了若干“存在出于设计”的主张之外，他没有为自己的立场作更多论证。
    step2: |-
