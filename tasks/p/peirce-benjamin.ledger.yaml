      Born in 1809, Peirce became a major figure in mathematics and the physical sciences during a period when the U.S. was still a minor country in these areas (Hogan 1991)[^hogan-1991]. A student at Harvard College, he was appointed tutor there in 1829. Two years later he became Professor of Mathematics in the University, a post which was changed in 1842 to cover astronomy also; he held it until his death in 1880. He played a prominent role in the development of the science curriculum of the university, and also acted as College librarian for a time. However, he was not a successful teacher, being impatient with students lacking strong gifts; but he wrote some introductory textbooks in mathematics, and also a more advanced one in mechanics (Peirce 1855)[^peirce-1855]. Among his other appointments, the most important one was Director of the U.S. Coast Survey from 1867 to 1874. Peirce also exercised influence through his children. By far the most prominent was Charles Sanders Peirce (1839–1914), who became a remarkable though maverick polymath, as mathematician, chemist, logician, historian, and many other activities. In addition, James Mills (1834–1906) became in turn professor of mathematics at Harvard, Benjamin Mills (1844–1870) a mining engineer, and Herbert Henry Davis (1849–1916) a diplomat. Harvard professor Benjamin Osgood Peirce (1854–1914), mathematician and physicist was a cousin. Benjamin Peirce did not think of himself as a philosopher in any academic sense, yet his work manifests interests of this kind, in two different ways. The first was related to his teaching.
    step1: |-
      皮尔斯生于 1809 年，在数学与物理科学于美国尚属弱项的年代，成长为这两个领域的一位重要人物（Hogan 1991）[^hogan-1991]。他在哈佛学院求学，1829 年被聘任为该校的辅导教师。两年后他出任该大学的数学教授，1842 年这一教职改为兼辖天文学；他担任此职直至 1880 年去世。他在该大学科学课程体系的发展中扮演了突出角色，还一度担任学院图书馆馆长。然而他并不是成功的教师，对缺乏突出天分的学生缺乏耐心；但他写过若干数学入门教科书，还写了一部更进阶的力学教科书（Peirce 1855）[^peirce-1855]。在他其他任职中，最重要的一项是 1867 至 1874 年任美国海岸测量局局长。皮尔斯也通过子女发挥影响。迄今最杰出的是查尔斯·桑德斯·皮尔士（Charles Sanders Peirce，1839–1914），他成为一名卓越而不循常规的博学者，身兼数学家、化学家、逻辑学家、历史学家以及许多其他身份。此外，James Mills（1834–1906）相继成为哈佛的数学教授，Benjamin Mills（1844–1870）成为矿业工程师，Herbert Henry Davis（1849–1916）成为外交官。哈佛教授 Benjamin Osgood Peirce（1854–1914），数学家与物理学家，是他的堂亲。本杰明·皮尔斯在任何学院意义上都不把自己看作哲学家，但他的著作以两种不同方式显露出这类兴趣。第一种与他的教学有关。
    step2: |-
      皮尔斯生于 1809 年；在他成长的年代，美国在数学与物理科学上还只是无足轻重的国家，而他成了这两个领域的一位重要人物（Hogan 1991）[^hogan-1991]。他求学于哈佛学院，1829 年受聘为该校辅导教师；两年后升任本校数学教授，1842 年这一教职的范围扩及天文学，他任此职直至 1880 年去世。他深度参与了哈佛科学课程体系的建设，并一度兼任学院图书馆馆长。不过他算不上成功的教师——对天分平平的学生缺乏耐心；但他撰写过若干数学入门教科书，还有一部更进阶的力学教科书（Peirce 1855）[^peirce-1855]。在其余任职中，最重要的当属 1867 至 1874 年出任美国海岸测量局局长。皮尔斯的影响也经由子女延续：其中最杰出者当属查尔斯·桑德斯·皮尔士（Charles Sanders Peirce，1839–1914）——一位卓越而不循常规的博学家，集数学家、化学家、逻辑学家、历史学家等众多身份于一身。此外，James Mills（1834–1906）相继出任哈佛数学教授，Benjamin Mills（1844–1870）成为矿业工程师，Herbert Henry Davis（1849–1916）成为外交官；哈佛教授、数学家兼物理学家 Benjamin Osgood Peirce（1854–1914）则是他的堂亲。本杰明·皮尔斯从未以任何学院意义自居为哲学家，但其著作仍以两种不同方式显露出这类兴趣。第一种与他的教学有关。
