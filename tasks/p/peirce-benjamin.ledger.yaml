      Peirce began with a philosophical statement of a different kind about mathematics which has become his best remembered single statement “Mathematics is the science that draws necessary conclusions” (Peirce 1870, p. 1)[^peirce-1870]. What does ‘necessary’ denote? Perhaps he was following a tradition in algebra, upheld especially by Britons such as George Peacock and Augustus De Morgan (a recipient of the lithograph), of distinguishing the ‘form’ of an algebra from its ‘matter’ (that is, an interpretation or application to a given mathematical and/or physical situation) and claiming that its form alone would deliver the consequences from the premises. In his first draft of his text he wrote the rather more comprehensible “Mathematics is the science that draws inferences”, and in the second draft “Mathematics is the science that draws consequences”, though the last word was altered to yield the enigmatic form involving ‘necessary’ used in the book. The change is not just verbal; he must have realised that the earlier forms were not sufficient (they are satisfied by other sciences, for example), and so added the crucial adjective. Certainly no whiff of modal logic was in his air. His statement appears in the mathematical literature fairly often, but usually without explanation. One feature is clear, but often is not stressed. In all versions Peirce always used the active verb ‘draws’: mathematics was concerned with the act of drawing conclusions, not with the theory of so acting, which belonged in disciplines such as logic. He continued:
    step1: |-
      皮尔斯以一句关于数学的另一种哲学陈述开篇，它已成为他最令人铭记的单句：“数学是作出必然结论的科学”（Peirce 1870, p. 1）[^peirce-1870]。“必然”指什么？也许他遵循了代数学中的一种传统——尤以乔治·皮科克（George Peacock）与奥古斯都·德摩根（Augustus De Morgan；石印本的一名受赠者）等英国人为代表——即把代数的“形式”与其“质料”（即对某一给定数学和／或物理情境的一种解释或应用）区分开来，并主张仅凭形式即可从前提推出结论。在其文本的初稿中，他写的是更易懂得多的“数学是作出推断的科学”，二稿是“数学是作出结论的科学”，不过最后一个词被改动，成了书中那个涉及“必然”的谜一般的形式。改动不只是措辞问题；他必定意识到早先的表述并不充分（例如其他科学也满足它们），于是加上了这个关键形容词。可以肯定，他的空气里没有一丝模态逻辑的气息。他的这句话在数学文献中出现得相当频繁，但通常没有解释。有一个特征是清楚的，却常被忽略。在所有版本中，皮尔斯始终用主动动词“作出”（draws）：数学关注的是作出结论这一行为，而非如此行动的理论——后者属于逻辑学等学科。他接着写道：
    step2: |-
      皮尔斯开篇便抛出另一类关于数学的哲学陈述，它也成了他最令人铭记的一句话：“数学是作出必然结论的科学”（Peirce 1870, p. 1）[^peirce-1870]。“必然”究竟何指？他或许承续了代数学中的一脉传统——以乔治·皮科克（George Peacock）、奥古斯都·德摩根（Augustus De Morgan；石印本受赠者之一）等英国人为代表——即把代数的“形式”与其“质料”（亦即对某一给定数学或物理情境的解释或应用）区分开来，并主张单凭形式即可由前提得出结论。手稿初稿作“数学是作出推断的科学”，显然浅白得多；二稿作“数学是作出结论的科学”；最终改定时，末一个词被换掉，成了书中这个带“必然”二字的、谜一般的形式。改动绝非仅在字面：他必定已意识到先前的表述并不充分——例如其他科学同样满足它们——于是补上了这个关键形容词。可以断言，他那里闻不到一丝模态逻辑的气息。这句话在数学文献中出现得相当频繁，却往往无人解释。有一个特征明白无误，却常被忽视：无论哪个版本，皮尔斯用的都是主动动词“作出”（draws）——数学关心的是作出结论这个动作本身，而不是如此行事的原理；后者属于逻辑学之类的学科。他接着写道：
