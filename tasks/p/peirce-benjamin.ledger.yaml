    source: |-
      Thus Peirce maintained the position asserted by Boole that mathematics could be used to analyse logic, not the vice versa relationship between the two disciplines that Gottlob Frege was about to put forward for arithmetic, and which Bertrand Russell was optimistically to claim for *all* mathematics during the 1900s. Curiously, the third draft of the lithograph contains this contrary stance in “Mathematics, as here defined, belongs to every enquiry; it is even a portion of deductive logic, to the laws of which it is rigidly subject”; but by completion he had changed his mind. Peirce's son Charles claimed to have influenced his father in forming his definitive position, and fiercely upheld it himself; thereby he helped to forge a wide division between the algebraic logic which he was developing from the early 1870s with his father, Boole and de Morgan as chief formative influences, and the logicism (as it became called later) of Frege and Russell and also the ‘mathematical logic’ of Giuseppe Peano and his school in Turin (Grattan-Guinness 1988)[^grattan-guinness-1988].
    step1: |-
      因此，皮尔斯坚持了布尔所主张的立场，即数学可以用来分析逻辑，而不是这两个学科之间那种相反的关系——戈特洛布·弗雷格（Gottlob Frege）马上就要为算术提出那种相反关系，而伯特兰·罗素（Bertrand Russell）在 1900 年代乐观地主张它适用于 *全部* 数学。奇怪的是，石印本的第三稿含有这一相反立场：“数学，如此处所定义的，属于一切探究；它甚至是演绎逻辑的一部分，受其法则的严格支配”；但到完成时他已改变主意。皮尔斯之子查尔斯声称，自己在父亲形成其最终立场的过程中施加了影响，并且自己也曾激烈地维护它；由此他促成了两道宽阔的分野：一边是他自 1870 年代初起与父亲、布尔和德摩根为主要形成性影响而发展的代数逻辑，另一边是弗雷格与罗素的逻辑主义（后来如此称呼），以及朱塞佩·皮亚诺（Giuseppe Peano）及其都灵学派的“数学逻辑”（Grattan-Guinness 1988）[^grattan-guinness-1988]。
    step2: |-
      如此，皮尔斯坚持的是布尔所主张的立场：数学可以用来分析逻辑；而非两学科之间那种方向相反的关系——戈特洛布·弗雷格（Gottlob Frege）即将就算术提出这种关系，伯特兰·罗素（Bertrand Russell）又将在 20 世纪初乐观地主张它适用于 *全部* 数学。有趣的是，石印本第三稿中竟含有这一相反的立场：“数学，如此处所定义，属于一切探究；它甚至是演绎逻辑的一部分，受其法则的严格约束”；但到定稿时，他已改变了主意。皮尔斯之子查尔斯声称，父亲形成其最终立场时受过自己的影响，他本人也曾激烈捍卫这一立场；由此，他促成了两道宽阔的分野：一侧是他自 19 世纪 70 年代初起与父亲一道发展的代数逻辑——其形成期的首要影响来自其父、布尔与德摩根；另一侧则是弗雷格与罗素的逻辑主义（此名后来才流行），以及朱塞佩·皮亚诺（Giuseppe Peano）及其都灵学派的“数学逻辑”（Grattan-Guinness 1988）[^grattan-guinness-1988]。
