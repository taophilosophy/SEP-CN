      > To my friends This work has been the pleasantest mathematical effort of my life. In no other have I seemed to myself to have received so full a reward for my mental labor in the novelty and breadth of the results. I presume that to the uninitiated the formulae will appear cold and cheerless. But let it be remembered that, like other mathematical formulae, they find their origin in the divine source of all geometry. Whether I shall have the satisfaction of taking part in their exposition, or whether that will remain for some more profound expositer, will be seen in the future (Peirce 1870, 1)[^peirce-1870].
    step1: |-
      > 献给我的朋友们。这部著作是我一生中最愉快的数学劳作。在其成果的新颖与广博之中，我从未觉得自己在其他著作里为脑力劳动得到过如此圆满的报偿。我料想，在未入门者眼里，这些公式会显得冰冷而乏味。但请记住：与其他数学公式一样，它们源自一切几何的神圣源头。我将来能否有幸参与阐释它们，抑或这将留给某位更深刻的阐释者，且看未来（Peirce 1870, 1）[^peirce-1870]。
