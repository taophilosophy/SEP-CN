      in the case of a quaternion *q*. Peirce wrote an extensive survey (Peirce 1870)[^peirce-1870], determining the numbers of all algebras with from two to six elements obeying also various other laws (Walsh 2000, ch. 2)[^walsh-2000]. To two of those he gave names which have become durable: ‘idempotent’, the law *x*^{*m*} = *x* (for *m*≥2) which George Boole had introduced in this form in his algebra of logic in 1847; and ‘nilpotent’, when *x*^{*m*} = 0, for some *m*. The history of the publication of this work is very unusual (Grattan-Guinness 1997)[^grattan-guinness-1997]. Peirce had presented some of his results from 1867 onwards to the National Academy of Sciences, of which he had been appointed a founder member four years earlier; but they could not afford to print it. Thus, in an initiative taken by Coast Survey staff, a lady without mathematical training but possessing a fine hand was found who could both read his ghastly script and write out the entire text 12 pages at a time on lithograph stones. 100 copies were printed (Peirce 1870)[^peirce-1870], and distributed world-wide to major mathematicians and professional colleagues. Eleven years later Charles, then at Johns Hopkins University, had the lithograph reprinted posthumously, with some additional notes of his own, as a long paper in American journal of mathematics, which J.J. Sylvester had recently launched (Peirce 1881a)[^peirce-1881a]; it also came out in book form in the next year. This study helped mathematicians to recognise an aspect of the wide variety of algebras which could be examined; it also played a role in the development of model theory in the U.S. in the early 1900s. Enough work on it had been done by then for a book-length study to be written (Shaw 1907)[^shaw-1907].
    step1: |-
      以四元数 *q* 的情形为例。皮尔斯写了一篇内容广泛的综述（Peirce 1870）[^peirce-1870]，确定了从两个到六个元素、且还服从各种其他定律的全部代数的数目（Walsh 2000, ch. 2）[^walsh-2000]。对其中两个他起了流传至今的名字：“幂等”，即定律 *x*^{*m*} = *x*（当 *m*≥2），乔治·布尔（George Boole）早在 1847 年就在其逻辑代数中以这种形式引入；以及“幂零”，即当 *x*^{*m*} = 0、对某个 *m* 时。这部著作的出版史非常不寻常（Grattan-Guinness 1997）[^grattan-guinness-1997]。从 1867 年起，皮尔斯把他的部分结果提交给美国国家科学院——他早在四年前即被任命为该院创始成员；但科学院无力付印。于是，在海岸测量局职员的倡议下，找到了一位没有受过数学训练却写得一手好字的女士，她既能辨认他那可怕的笔迹，又能把全文以每次 12 页的速度誊写到石印石板上。共印 100 份（Peirce 1870）[^peirce-1870]，并分发至全世界的主要数学家与同行。十一年后，当时在约翰斯·霍普金斯大学的查尔斯安排将这篇石印本于作者身后重印，加上他自己的一些附注，作为一篇长文发表于 J. J. 西尔维斯特（J.J. Sylvester）新近创办的《美国数学杂志》（Peirce 1881a）[^peirce-1881a]；次年又出了书装本。这项研究帮助数学家认识到可加考察的代数之广泛多样的一个侧面；它也对 20 世纪初美国模型论的发展起了作用。到那时，围绕它的工作已足以写成一部专著（Shaw 1907）[^shaw-1907]。
