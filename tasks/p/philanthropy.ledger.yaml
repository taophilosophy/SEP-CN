      Any philosophical discussion of philanthropy must at some point engage the effort of many modern philosophers to distinguish between the concepts of justice and charity (variously dubbed “humanity” or “beneficence”). According to the French sociologist Marcel Mauss, the distinction is anticipated in pre-modern societies when, during periods of surplus, the social expectations concerning generosity shift from “the ancient morality of the gift” to a “principle of justice” in which the wealthy are seen as obligated to the poor (Mauss 1925 [1990: 18])[^mauss-1925]. A social order of almsgiving and charity slowly gives way to a distinctively modern tradition of justice (Fleischacker 2004)[^fleischacker-2004].
    step1: |-
      任何关于慈善的哲学讨论，迟早都必须面对许多现代哲学家区分正义与慈善（后者也被称为“人道”或“行善”）的努力。据法国社会学家马塞尔·莫斯说，这一区分在前现代社会中已可预见：在剩余时期，关于慷慨的社会期待从“古老的礼物道德”转向一种“正义原则”，在这种原则下，富人被视为对穷人负有义务（Mauss 1925 [1990: 18]）[^mauss-1925]。施舍与慈善的社会秩序慢慢让位于一种独具现代特色的正义传统（Fleischacker 2004）[^fleischacker-2004]。
