  - id: 5
    kind: body
    source: |-
      Every human society has practiced some form of gift-giving or gift exchange with non-intimates. Altruism is universal, perhaps even biological (see the entry on biological altruism). Despite its potential root in human nature, philanthropy has taken many different forms; various conventions of philanthropy reveal significant points of convergence as well as differences. Debates about philanthropy are also bound up with central developments in sociopolitical history and the history of moral and political philosophy.
    step1: |-
      每个人类社会都实践过某种与非亲密者进行的赠予或礼品交换形式。利他主义是普遍的，甚至可能是生物性的（见“生物利他主义”词条）。尽管其潜在根源或在人性之中，慈善却采取了诸多不同形态；各种慈善惯俗既显示出显著的趋同点，也显示出差异。关于慈善的争论还与社会政治史以及道德哲学史和政治哲学史的核心进展纠缠在一起。
    step2: |-
      人类每个社会都实践过某种面向非亲昵者的赠予或礼物交换。利他主义普遍存在，甚至可能写进了生物本能（见“生物利他主义”词条）。慈善纵然植根于人性，却呈现出形态万千；不同文化的慈善惯俗既透露出明显的汇合之处，也显示出差异。围绕慈善的争论，还同社会政治史与道德—政治哲学史上的重大进程交织在一起。
  - id: 6
    kind: body
    source: |-
      The different words used to describe practices of non-intimate gift-giving tend to reflect different normative valences. The term “philanthropy” stems from the Ancient Greek φιλανθρωπία (“philanthrôpía”) and originally referred to the gods’ love of humankind. One of the first known usages of the term occurs in Aeschylus’s *Prometheus Bound* (5ᵗʰ century BCE) to describe Prometheus’s gift of fire to humankind (in defiance of Zeus) (Sulek 2010)[^sulek-2010]. Fire allowed humans more independence from the gods, which posed a challenge to the gods’ power. Zeus’s criticism prefigures an enduring debate in the ethics of philanthropy regarding who is an appropriate object of giving.
    step1: |-
      用来描述非亲密赠予实践的不同词语，往往反映出不同的规范性色彩。“慈善”一词源于古希腊语 φιλανθρωπία（philanthrôpía），原指诸神对人类的爱。该词最早为人所知的用法之一见于埃斯库罗斯的《被缚的普罗米修斯》（公元前 5 世纪），用以描述普罗米修斯（违抗宙斯）把火赠予人类之举（Sulek 2010）[^sulek-2010]。火使人类更加独立于诸神，从而构成对神权的挑战。宙斯的批评预示了慈善伦理学中一场持久的争论：谁才是适当的给予对象。
    step2: |-
      描述非亲昵赠予实践的各个语词，往往带有不同的规范色彩。“慈善”（philanthropy）源自古希腊语 φιλανθρωπία（philanthrôpía），本义是诸神对人类的爱。这个词最早有案可查的用法之一，见于埃斯库罗斯的《被缚的普罗米修斯》（公元前 5 世纪）：普罗米修斯违抗宙斯，把火赠予人类（Sulek 2010）[^sulek-2010]。火让人对诸神更加独立，等于向神权发起挑战。宙斯的责难，预示了慈善伦理学中一场绵延不绝的争论——谁才是恰当的给予对象。
  - id: 7
    kind: body
    source: |-
      Romans were more likely to use the term beneficentia (beneficence), which focuses on the quality of the outcomes to be produced rather than the motives behind giving or the kinds of recipients to be sought. (For more on the reception and application of this concept in modern and contemporary philosophy, see the entry on the principle of beneficence in applied ethics.) Cicero’s *De Officiis* (*On Duties*) is a quasi-philosophical how-to on navigating giving expectations in Classical Rome. Despite many disagreements and differences, Greco-Roman traditions exhibit certain common elements. Generally speaking, Greco-Roman philanthropy emphasized gifts of benefit to the city and to its citizens—liturgia—such as stadiums, festivals, and military campaigns (Ober 1989; Reich 2018: chapter 1)[^ober-1989][^reich-2018]. Expectations of making gifts outside of friends and family were generally limited to the wealthiest members of society. Although notionally voluntary, failure to provide gifts could incur reputational costs or formal sanctions, such as loss of titles or exile.
    step1: |-
      罗马人更常用 *beneficentia*（行善）一词，它着眼于所产生结果的品质，而非给予背后的动机或所寻求的受赠者类型。（关于这一概念在现代与当代哲学中的接受与应用，见“应用伦理学中的有益原则”词条。）西塞罗的《论义务》是一部半哲学性的实务指南，教人如何在古典罗马的赠予期待中周旋。尽管分歧与差异众多，希腊—罗马传统仍显示出某些共同要素。总体而言，希腊—罗马的慈善强调有益于城邦及其公民的赠予——*liturgia*（公益捐献）——如体育场、节庆与军事远征（Ober 1989; Reich 2018: chapter 1）[^ober-1989][^reich-2018]。在亲友之外赠予的社会期待，一般只落在最富有的社会成员身上。虽然在名义上是自愿的，不履行赠予却可能带来声誉代价或正式制裁，如失去头衔或被放逐。
    step2: |-
      罗马人则多用 *beneficentia*（行善）一词：它看的是行为所产生的结果之品质，而非给予背后的动机或刻意挑选的受赠对象。（关于这一概念在现代与当代哲学中的流传与应用，见“应用伦理学中的有益原则”词条。）西塞罗的《论义务》近乎一部实务手册，教人如何在古典罗马的赠予期待下周旋得体。希腊—罗马传统尽管分歧重重，仍显出若干共性。大体上说，希腊—罗马式慈善看重造福城邦及其公民的赠予，即 *liturgia*（公益捐献）：体育场、节庆、军事远征之类（Ober 1989; Reich 2018: chapter 1）[^ober-1989][^reich-2018]。在亲友圈外承担赠予的社会期待，一般只压在最富有的阶层头上。赠予名义上自愿，但拒不捐输可能招致声誉损失乃至正式惩处，例如夺去头衔或放逐出境。
  - id: 8
    kind: body
    source: |-
      Plato implicitly criticized the economic and political institutions of Classical Athens as disordered and unvirtuous. The *Republic* proposes common ownership of property as one potential corrective to these ills. One of Aristotle’s main critiques of Plato is that the communal property regime makes no space for individual acts of generosity, which facilitate friendship and are central to ethical life (Irwin 1987)[^irwin-1987]. This dispute reverberates in subsequent debates about the status and distribution of property and the role of giving in ethical and political life.
    step1: |-
      柏拉图含蓄地批评古典雅典的经济与政治制度失序而无德。《理想国》提议财产共有，作为矫正这些弊病的一种可能办法。亚里士多德对柏拉图的主要批评之一是：共有财产制不给个人慷慨行为留出空间，而慷慨行为促进友谊，是伦理生活的核心（Irwin 1987）[^irwin-1987]。这场争论在后世关于财产的地位与分配、以及给予在伦理与政治生活中之作用的辩论中回响不绝。
    step2: |-
      柏拉图暗讽古典雅典的经济与政治制度：既失序，又无德。《理想国》提议财产共有，以此作为矫正时弊的一条出路。亚里士多德批评柏拉图的一大要点是：财产共有制容不下个人的慷慨之举，而慷慨恰能成全友谊，是伦理生活的枢纽（Irwin 1987）[^irwin-1987]。这场争执在后世关于财产地位与分配、给予在伦理与政治生活中所处地位的辩论中，回响不断。
  - id: 9
    kind: body
    source: |-
      The Christianization of the Roman Empire largely upended Classical giving norms. Some scholars even link the fall of the Roman Empire to disagreements about the proper ends of philanthropic giving (Brown 2012)[^brown-2012]. Early Christians discussed gift-giving in terms of agape (in Greek), caritas (in Latin), and later *charity* (in English), which referred to love for God as expressed by love for one another. For Christians, the point of such gifts was not to fund public works for the benefit of citizens. It was instead to bestow love on the least fortunate, regardless of their citizenship. Moreover, Christians believed that this practice of gift-giving was a universal virtue to be expected of everyone, not only the wealthiest.
    step1: |-
      罗马帝国的基督教化在很大程度上颠覆了古典赠予规范。一些学者甚至把罗马帝国的衰落与关于慈善赠予之正当目的的分歧联系起来（Brown 2012）[^brown-2012]。早期基督徒用 *agape*（希腊语）、*caritas*（拉丁语）以及后来的 *charity*（英语）来讨论赠予，它们指对上帝之爱，通过人与人之间的彼此相爱而表达。对基督徒来说，这类赠予的目的不在于资助造福公民的公共工程，而在于把爱倾注给最不幸的人，无论其公民身份如何。而且，基督徒相信这种赠予实践是人人皆当具备的普遍德性，而非仅属于最富有者。
    step2: |-
      罗马帝国皈依基督教，古典赠予规范随之大体倾覆。有学者甚至将罗马帝国的衰亡归因于人们在慈善赠予正当目的上的分歧（Brown 2012）[^brown-2012]。早期基督徒以 *agape*（希腊语）、*caritas*（拉丁语），以及后来的 *charity*（英语）来谈论赠予，指的是对上帝之爱——这种爱通过人与人之间的彼此相爱表达出来。在基督徒看来，赠予的要义不是资助造福公民的公共工程，而是把爱倾注给最不幸的人，无关其公民身份。基督徒还相信，赠予是人人应尽的普遍德性，不专属于最富有者。
  - id: 10
    kind: body
    source: |-
      A focus on poverty is common in other religious traditions of giving, though the basis is often different. The Jewish norm of *tzedakah* treats giving to the poor as a duty of justice, a matter of strict obligation and to be made in proportion to givers’ advantages and recipients’ needs (Topolski 2016)[^topolski-2016]. The medieval Jewish philosopher Maimonides famously postulates an ethic of giving that ranks different approaches, drawing special attention to the value of the recipient’s dignity and the donor’s anonymity (Twersky 1980)[^twersky-1980]. Islamic practices contain both *zakat*, a strict obligation to give a portion of one’s wealth for eleemosynary and religious purposes, as well as *sadaqa*, additional gifts made in excess of obligation that are nonetheless praiseworthy (Hashmi 2010)[^hashmi-2010]. Hindu, Buddhist, and Jain traditions emphasize the unilateral and unreciprocated character of giving (Heim 2004)[^heim-2004]. The *dāna* encourages giving that indicates renunciation of material concerns and targets worthy recipients, such as members of monastic societies who have taken voluntary vows of poverty.
    step1: |-
      关注贫困也见于其他宗教赠予传统，尽管依据往往不同。犹太教的 *tzedakah*（公义捐助）规范把施贫当作正义义务，是严格的应尽之事，须按给予者的优势与受助者的所需按比例施行（Topolski 2016）[^topolski-2016]。中世纪犹太哲学家迈蒙尼德提出了著名的给予伦理，将不同做法分等排序，特别强调受助者尊严与捐赠者匿名的价值（Twersky 1980）[^twersky-1980]。伊斯兰教实践既包含 *zakat*（天课）——为济贫与宗教目的捐出部分财富的严格义务——也包含 *sadaqa*（自愿施舍），即义务之外的额外赠予，同样值得称赞（Hashmi 2010）[^hashmi-2010]。印度教、佛教与耆那教传统则强调给予的单向性与不可回报性（Heim 2004）[^heim-2004]。布施（*dāna*）鼓励那种表明舍弃物质牵挂、指向值得的受助者的给予，例如向自愿立誓守贫的僧团成员施与。
    step2: |-
      其他宗教的赠予传统同样聚焦贫困，只是理据各异。犹太教的 *tzedakah*（公义捐助）把济贫当作正义义务：这是严格的分内之事，须依给予者的能力与受助者的需求相称而行（Topolski 2016）[^topolski-2016]。中世纪犹太哲学家迈蒙尼德立下著名的给予伦理，给各种行善方式排出高下，格外看重受助者的尊严与捐赠者的匿名（Twersky 1980）[^twersky-1980]。伊斯兰实践中，既有 *zakat*（天课）这种为济贫与宗教目的缴纳部分财富的严格义务，也有义务之外、却同样可嘉的额外捐献 *sadaqa*（自愿施舍）（Hashmi 2010）[^hashmi-2010]。印度教、佛教与耆那教传统则突出给予的单向与不求回报（Heim 2004）[^heim-2004]。布施（*dāna*）所鼓励的给予，须显出对物质牵挂的舍弃，并投向配得的受施者，例如已自愿立誓安贫的僧团成员。
  - id: 11
    kind: body
    source: |-
      A rejection of hierarchy and vertical relationships appears as a common thread in several other non-western perspectives on philanthropy, such as ubuntu, which recommends giving on reciprocal terms and sees it as central to the construction of common humanity (Mottiar & Ngcoya 2015)[^mottiar-2015].
    step1: |-
      拒斥等级制与纵向关系，是另一些非西方慈善视角的共同线索，例如 *ubuntu*（乌班图）主张以对等条件给予，并把给予视为人之共同人性建构的核心（Mottiar & Ngcoya 2015）[^mottiar-2015]。
    step2: |-
      在另外一些非西方慈善观念中，拒斥等级与纵向关系是一条共同主线。*ubuntu*（乌班图）即主张以对等方式给予，并把给予视为人之共同人性得以构筑的关键（Mottiar & Ngcoya 2015）[^mottiar-2015]。
  - id: 12
