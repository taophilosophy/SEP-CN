      ### 3.3 Nonconsequentialist Views
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      Kant, and those influenced by him, generally discuss philanthropy in connection with the virtue of beneficence, which directs us to promote the happiness of others and assist others in need (Kant 1797; see the entry on Kant’s moral philosophy)[^kant-1797]. Beneficence is an imperfect duty, meaning that determining its targets and strategies requires individual judgment and cannot be defined in advance (Hill 2018)[^hill-2018]. Imperfect duties are contrasted with perfect duties, like justice and promise-keeping, which admit of less discretion and whose satisfaction ordinarily take priority (ibid.).
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      Kant requires that individuals be attentive to others’ needs and respond to emergencies, and he stresses that beneficence is not optional, even as he denies that beneficence must always be impartial among potential objects or maximizing in its focus. He allows that individuals may sometimes count personal attachments as reasons to favor some persons or causes over others, and he supports investments in culture and education as necessary for cultivating human virtues. Proponents of a Kantian approach defend Kant’s lack of systematic guidance on these questions, stressing that choosing whom to benefit and how requires many personal and contextual judgments that resist precise calculation (Hill 2018)[^hill-2018].
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      It is important to consider Kant’s moral theory in connection with his political and legal theory, which covers property rights, economic institutions, and constitutional design. Kant assigns to the state the duty to insure against absolute deprivation, and he has mixed feelings about private almsgiving as a general practice—calling it demeaning (Kant *Lectures on Ethics*: AK 27:455 [1997: 209]) and illustrative of government injustice, while at the same time noting that unjustly rich citizens may indeed have duties to give alms, but as duties of reparative justice rather than beneficence (Kant 1797 AK 6:454 [1996: 573)[^kant-1797].
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      For an effective altruist, the core question is how one person can benefit another person, and the relationship placed in the foreground is benefactor to beneficiary. But for Kant, the core question is about justice, and the relationship placed in the foreground is mutual respect and accountability. (For more on the contrast between effective altruism and Kant, see Darwall 2024)[^darwall-2024]. Furthermore, because on Kant’s view the immiseration of some is likelier due to injustice than misfortune, the voluntary action of the advantaged to assist the disadvantaged is improperly described as charity.
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      > Having the resources to practice such beneficence as depends on the goods of fortune is, for the most part, a result of certain human beings being favored through the injustice of government, which introduces an inequality of wealth that makes others need their beneficence. Under such circumstances, does a rich man’s help to the needy, on which he so readily prides himself as something meritorious, really deserve to be called beneficence at all? (Kant 1797 AK 6:454 [1996: 573])[^kant-1797]
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      Kant assigns the state the duty to provide public goods, noting that private action on behalf of the public can often be unauthorized, unilateral vigilantism (Ripstein 2009)[^ripstein-2009]. To be legitimate, action that affects all members of a society must be authorized by all of them omnilaterally. Similar arguments can be found in contemporary Kantian treatments of philanthropy, which tend to see philanthropy as completing and adorning the work of just institutions and temporarily repairing the mistakes of unjust institutions, but never seeking to supplant them (e.g., Herman 2001; Cordelli 2016, 2020)[^cordelli-2016][^cordelli-2016-2][^herman-2001].
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      In addition to positive guidance about duties to give, deontological perspectives can be important in specifying *constraints* on philanthropic action. Without providing a complete positive theory of how or how much one ought to give, neo-Kantians have argued that donors’ moral discretion to give as they like does not apply under conditions of institutional injustice, where wealthy people’s moral claims to their property are significantly weaker than is generally supposed (Cordelli 2016, 2020)[^cordelli-2016][^cordelli-2016-2].
