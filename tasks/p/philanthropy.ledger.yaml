      晚近许多民主规范性理论把民主的正当性联系到对人们能否作为社会平等者相互交往的关切上（例如 Anderson 1999; Kolodny 2014, 2023; Wilson 2019）[^anderson-1999][^kolodny-2014][^wilson-2019]。社会平等主义或关系平等主义的民主理论，虽常聚焦正式政治制度与程序，却有理由关切非正式产生的社会不平等——包括通过慈善产生的不平等，因为慈善有可能助长非正式的控制与尊崇等级。桑德斯-黑斯廷斯（2019, 2022a）主张，应推定反对以*家长主义*方式给予——这种方式表达对受益人判断的不尊重，并可能助长从属关系。一旦考虑到慈善不只由孤立交易构成，还常常在捐赠者与接受者之间创造持续关系（例如在机构环境中），慈善可能表达可反对的家长主义形式这一担忧就更强了。据桑德斯-黑斯廷斯与赖希（2024），家长主义是指一方把自己置于对自主行动者的长期权威地位，并代替其作出判断，即便被家长主义对待的一方同意也是如此。因此，即便家长主义使被对待者过得更好、且其真心同意，它仍可能可反对。错误在于对自主性的侮辱与不平等的权力动态，而不只是强制或负面结果。慈善基金会常常以家长主义方式行事：保留决策控制权、强加自己的判断，而不是赋权受赠者与受益人。尊重受影响者，要求基金会给他们更多发言权，既有工具性理由（地方知识改善结果），也有内在理由（缓解权力失衡、尊重自主）。
