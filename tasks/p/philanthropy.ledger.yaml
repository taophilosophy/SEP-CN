      美国的慈善捐赠税收待遇允许个人从应税收入中扣除（有上限）其合格慈善捐赠的总额。然而，这一政策工具带有财阀偏向，有利于富人及其慈善项目。该扣除造成一种“倒挂效应”：在累进税制中，较高收入者为同一笔慈善捐赠获得的补贴比较低收入者更多。若慈善给予是一种德性，那么德性的代价分配不均。
