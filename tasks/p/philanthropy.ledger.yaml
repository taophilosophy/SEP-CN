      Kant, and those influenced by him, generally discuss philanthropy in connection with the virtue of beneficence, which directs us to promote the happiness of others and assist others in need (Kant 1797; see the entry on Kant’s moral philosophy)[^kant-1797]. Beneficence is an imperfect duty, meaning that determining its targets and strategies requires individual judgment and cannot be defined in advance (Hill 2018)[^hill-2018]. Imperfect duties are contrasted with perfect duties, like justice and promise-keeping, which admit of less discretion and whose satisfaction ordinarily take priority (ibid.).
    step1: |-
      康德及其追随者一般在行善德性的关联中讨论慈善：行善德性指引我们促进他人的幸福、援助有需要者（Kant 1797；见“康德道德哲学”词条）[^kant-1797]。行善是不完全义务，这意味着确定其对象与策略需要个人判断，无法预先规定（Hill 2018）[^hill-2018]。不完全义务与完全义务相对，后者如正义与守信，裁量余地较小，其履行通常优先（同上）。
