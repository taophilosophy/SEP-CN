      Many recent normative theories of democracy link its justification to a concern for people’s ability to relate as social equals, rather than as superiors and inferiors (e.g., Anderson 1999; Kolodny 2014, 2023; Wilson 2019)[^anderson-1999][^kolodny-2014][^wilson-2019]. Social or relational egalitarian theories of democracy, while often focused on formal political institutions and processes, have reason to be concerned about social inequalities that arise informally—including through philanthropy, which has the potential to contribute to informal hierarchies of control and esteem. Saunders-Hastings (2019, 2022a) argues for a presumption against giving in *paternalistic* ways that express disrespect for the judgment of beneficiaries and that may contribute to subordinating relationships. The concern that philanthropy can express objectionable forms of paternalism grows stronger still once one considers that philanthropy consists not only of isolated transactions but often creates ongoing relationships between donors and recipients (e.g., in institutional settings). According to Saunders-Hastings and Reich (2024), paternalism involves one party putting itself in a position of longer-term authority over an autonomous agent and making judgments on their behalf, even if the paternalized party consents. Thus, paternalism can be objectionable even if it makes the paternalized party better off and they genuinely consent. The wrong lies in the insult to autonomy and the unequal power dynamic, not just in coercion or negative outcomes. Philanthropic foundations often act paternalistically by retaining control over decision making and imposing their own judgments rather than empowering grantees and beneficiaries. Respect for those affected requires foundations to give them more of a say, both for instrumental reasons (local knowledge improves outcomes) and intrinsic reasons (mitigating power imbalances and respecting autonomy).
