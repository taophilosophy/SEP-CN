      Critics of effective altruism frequently point to its antipolitics and strong orientation toward individual rather than institutional change (see Srinivasan 2015; Berkey 2018; Dietz 2019; Lechterman 2020; Crary 2021)[^berkey-2018][^crary-2021][^dietz-2019][^lechterman-2020][^lechterman-2020-2][^srinivasan-2015]. Srinivasan, for example, criticizes effective altruism for a certain paradoxical conservatism. Despite its ambition to change the world for the better, the effective altruist takes the political and organizational structure of the world as is—global capitalism, minimalist democracy, and the existing set of international aid organizations.
    step1: |-
      有效利他主义的批评者频频指出其反政治倾向，以及面向个人而非制度变革的强烈取向（见 Srinivasan 2015; Berkey 2018; Dietz 2019; Lechterman 2020; Crary 2021）[^berkey-2018][^crary-2021][^dietz-2019][^lechterman-2020][^lechterman-2020-2][^srinivasan-2015]。例如斯里尼瓦桑批评有效利他主义带有某种悖谬的保守主义：尽管胸怀改善世界之志，有效利他主义者却把世界的政治与组织结构视为给定——全球资本主义、极简民主，以及现存的一整套国际援助组织。
    step2: |-
      批评有效利他主义的人，常点出它的反政治气质与“重个人、轻制度变革”的取向（见 Srinivasan 2015; Berkey 2018; Dietz 2019; Lechterman 2020; Crary 2021）[^berkey-2018][^crary-2021][^dietz-2019][^lechterman-2020][^lechterman-2020-2][^srinivasan-2015]。例如阿米娅·斯里尼瓦桑指其含有一种悖谬的保守：有效利他主义者虽有改善世界之雄心，却把世界的政治与组织构造照单全收——全球资本主义、极简民主政体，连同现存的国际援助组织体系。
