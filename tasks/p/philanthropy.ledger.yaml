      Allen Buchanan rejects the firm distinction between justice and charity (Buchanan 1987)[^buchanan-1987]. He objects to the commonplace idea that justice is a perfect whereas charity is an imperfect duty. Duties of charity can be made perfect through the construction of social institutions that identify those to whom one is obligated and provide the means for supporting them. Thus, the common view that philanthropy is supererogatory and discretionary because it falls under charity rather than justice. With proper institutions, duties of aid can be made sufficiently determinate to be socially enforced to some degree, even if they don’t correlate with individual rights. So, philanthropy need not be an uncoordinated individual enterprise. In the end, whether philanthropic duties are required as a matter of justice depends for Buchanan on what ends philanthropy is intended to serve and the justifiability of the social arrangements that specify and allocate those duties. It cannot be settled by simply labeling them matters of charity rather than justice.
    step1: |-
      艾伦·布坎南拒斥正义与慈善之间的僵硬区分（Buchanan 1987）[^buchanan-1987]。他反对一种老生常谈：正义是完全义务，慈善是不完全义务。慈善义务可以通过社会制度的建构而变成完全义务，这些制度指明一个人对谁负有义务，并提供支持他们的手段。因此，那种认为慈善因属于慈善而非正义、所以是超义务且可自由裁量的常见观点。有了适当的制度，援助义务可以被弄得足够确定，从而在一定程度上可由社会强制执行，即便它们并不与个体权利相关联。所以，慈善不必是一种无协调的个体事业。归根结底，在布坎南看来，慈善义务是否作为正义问题被要求，取决于慈善旨在服务什么目的，以及规定并分配这些义务的社会安排是否正当。仅仅把它们标为慈善而非正义，并不能解决这个问题。
