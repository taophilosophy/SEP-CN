      Kant assigns the state the duty to provide public goods, noting that private action on behalf of the public can often be unauthorized, unilateral vigilantism (Ripstein 2009)[^ripstein-2009]. To be legitimate, action that affects all members of a society must be authorized by all of them omnilaterally. Similar arguments can be found in contemporary Kantian treatments of philanthropy, which tend to see philanthropy as completing and adorning the work of just institutions and temporarily repairing the mistakes of unjust institutions, but never seeking to supplant them (e.g., Herman 2001; Cordelli 2016, 2020)[^cordelli-2016][^cordelli-2016-2][^herman-2001].
    step1: |-
      康德把提供公共善的义务交给国家，并指出代表公众的私人行动往往可能是未经授权的单边治安私刑（Ripstein 2009）[^ripstein-2009]。要获得正当性，影响社会全体成员的行动必须由全体成员全方授权。类似论证也见于当代康德主义对慈善的处理：它们倾向于把慈善看作正义制度工作的补全与增饰，以及不义制度过失的临时修补，而绝不寻求取而代之（如 Herman 2001; Cordelli 2016, 2020）[^cordelli-2016][^cordelli-2016-2][^herman-2001]。
    step2: |-
      康德又把供给公共善的责任派给国家，理由是：以公众之名行事的私人行动，常常沦为未经授权的单边“私刑正义”（Ripstein 2009）[^ripstein-2009]。要谈正当性，波及社会全体成员的行动必须得到全体成员的全方授权。当代康德主义者处理慈善时持类似论证：在他们眼中，慈善不过是为正义制度之业查漏补缺、锦上添花，为不义制度之失暂时缝补，绝不图谋取而代之（如 Herman 2001; Cordelli 2016, 2020）[^cordelli-2016][^cordelli-2016-2][^herman-2001]。
