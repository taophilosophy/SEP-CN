      Kant requires that individuals be attentive to others’ needs and respond to emergencies, and he stresses that beneficence is not optional, even as he denies that beneficence must always be impartial among potential objects or maximizing in its focus. He allows that individuals may sometimes count personal attachments as reasons to favor some persons or causes over others, and he supports investments in culture and education as necessary for cultivating human virtues. Proponents of a Kantian approach defend Kant’s lack of systematic guidance on these questions, stressing that choosing whom to benefit and how requires many personal and contextual judgments that resist precise calculation (Hill 2018)[^hill-2018].
