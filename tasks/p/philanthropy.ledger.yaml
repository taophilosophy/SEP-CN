      However, this position also suggests that the appropriate role of the state with respect to philanthropy is not to subsidize it (which involves interfering with the liberty of some for the benefit of others) (Fleischer 2010)[^fleischer-2010]. And the state is generally to respect and enforce the terms that donors choose to attach to their gifts—despite the disadvantages this may create for recipients and third parties (Florino 2016)[^florino-2016].
