      Another important concept in the virtue ethics tradition is *phronesis,* or practical wisdom. Virtues are not simply emotional dispositions like pity, which a child might have (Hursthouse 1999; Hursthouse & Pettigrove 2016 [2023])[^hursthouse-1999][^hursthouse-2016]. Rather, they are characteristics of rational agents who have learned from experience how to choose virtuous actions in a range of situations. The well-intentioned but thoughtless or profligate giver therefore lacks the virtue of the thoughtful and provident donor. In that sense, a kind of folk virtue ethics animates many classic discussions of giving by non-philosophers, such as Andrew Carnegie’s “Gospel of Wealth” (1889).
    step1: |-
      德性伦理学传统的另一个重要概念是 *phronesis,* 或实践智慧。德性不只是怜悯之类的情感气质——孩子也可能有怜悯（Hursthouse 1999; Hursthouse & Pettigrove 2016 [2023]）[^hursthouse-1999][^hursthouse-2016]。德性是理性行动者的特质：这类行动者从经验中学会如何在各种情境中选择有德行动。因此，善意为怀却轻率或挥霍的给予者，缺乏深思熟虑、未雨绸缪的捐赠者所具有的德性。在这个意义上，一种民间德性伦理学激活了许多非哲学家关于给予的经典讨论，例如安德鲁·卡内基的《财富的福音》（1889）。
    step2: |-
      德性伦理学传统还有一重要概念：*phronesis,* 即实践智慧。德性并非怜悯那类情感倾向——孩童也会有怜悯（Hursthouse 1999; Hursthouse & Pettigrove 2016 [2023]）[^hursthouse-1999][^hursthouse-2016]；德性属于理性行动者，他们从经验中习得如何在多种情境下择定有德之行。所以，心怀善意却欠思量或挥霍无度的给予者，不具备深思远虑的捐赠者那种德性。由此可以说，一种“民间德性伦理”贯注在非哲学家的许多经典给予论之中，安德鲁·卡内基的《财富的福音》（1889）即是一例。
