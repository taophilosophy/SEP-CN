      自启蒙运动以来，各类批评者力图使慈善与宗教、尤其是与天主教会的联系保持距离。对安妮-罗贝尔·杜尔哥、伊曼努尔·康德与孟德斯鸠等启蒙理性主义者而言，教会不仅是在信众中传播宗教迷信者，还紧紧占有数百年来积累、被永久基金束缚的土地与资本。例如，密尔坚持，国家应被允许干预长期设立的基金，必要时甚至为国家征用其资产（Mill 1869a）[^mill-1869a]。永久性加上固定的捐赠者意图，确立了死者对生者的统治，这既违背常识，也有损社会效用。因此密尔拒斥永久性，主张限期基金。
