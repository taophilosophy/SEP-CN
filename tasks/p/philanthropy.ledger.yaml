      It is important to consider Kant’s moral theory in connection with his political and legal theory, which covers property rights, economic institutions, and constitutional design. Kant assigns to the state the duty to insure against absolute deprivation, and he has mixed feelings about private almsgiving as a general practice—calling it demeaning (Kant *Lectures on Ethics*: AK 27:455 [1997: 209]) and illustrative of government injustice, while at the same time noting that unjustly rich citizens may indeed have duties to give alms, but as duties of reparative justice rather than beneficence (Kant 1797 AK 6:454 [1996: 573)[^kant-1797].
