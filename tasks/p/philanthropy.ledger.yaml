      ### 4.1 Tensions between Philanthropy and Democracy
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      The relationship between philanthropy and democracy is a question of longstanding interest (e.g., Tocqueville 1840 [2000: 485–92])[^tocqueville-1840]. Of course, a state need not be democratic for tensions between public power and private philanthropy to arise: Livy and Machiavelli, for example, both note that munificent citizens can acquire popularity and power through their giving, in ways that present threats to ruling political elites. But the role of philanthropy, and especially philanthropy by the very rich, is often thought to present particular problems in democratic societies (Reich 2018)[^reich-2018]. Big philanthropy represents the direction of private resources toward some public purpose or influence, and in this respect it is an exercise of power. Democracies promise their citizens political equality and equal opportunity for voice or influence over important public decisions. By contrast, large scale philanthropy gives donors the power to influence public outcomes and thereby threatens to amplify the voices of the wealthy. In this respect, big philanthropy is a plutocratic element in a democratic setting, and the relevant question to be asked is whether wealth can be domesticated to serve rather than subvert core democratic principles and practices (Reich 2018)[^reich-2018].
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      Some democratic perspectives focus on the concept of *legitimacy* and attempt to resolve the tensions between philanthropy and democracy by more strictly delimiting the appropriate role of philanthropy in the institutional division of labor. Cordelli (2020) offers a Kantian argument against the privatization of state functions, which applies to much *non-*profit (not just for-profit) private action. On her account, privatization represents an illegitimate outsourcing of decision-making power to private actors, who are empowered to define and affect people’s rights in ways that can only legitimately be done by a state’s democratically authorized and accountable representatives. Beerbohm (2016) and Pevnick (2016) also attempt to isolate the state functions that must remain under democratic control. And Lechterman (2022) develops an account of “democratic sovereignty” which charges that philanthropic influence over essential public goods or matters of basic justice violates citizens’ rights to self-determination.
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      Many recent normative theories of democracy link its justification to a concern for people’s ability to relate as social equals, rather than as superiors and inferiors (e.g., Anderson 1999; Kolodny 2014, 2023; Wilson 2019)[^anderson-1999][^kolodny-2014][^wilson-2019]. Social or relational egalitarian theories of democracy, while often focused on formal political institutions and processes, have reason to be concerned about social inequalities that arise informally—including through philanthropy, which has the potential to contribute to informal hierarchies of control and esteem. Saunders-Hastings (2019, 2022a) argues for a presumption against giving in *paternalistic* ways that express disrespect for the judgment of beneficiaries and that may contribute to subordinating relationships. The concern that philanthropy can express objectionable forms of paternalism grows stronger still once one considers that philanthropy consists not only of isolated transactions but often creates ongoing relationships between donors and recipients (e.g., in institutional settings). According to Saunders-Hastings and Reich (2024), paternalism involves one party putting itself in a position of longer-term authority over an autonomous agent and making judgments on their behalf, even if the paternalized party consents. Thus, paternalism can be objectionable even if it makes the paternalized party better off and they genuinely consent. The wrong lies in the insult to autonomy and the unequal power dynamic, not just in coercion or negative outcomes. Philanthropic foundations often act paternalistically by retaining control over decision making and imposing their own judgments rather than empowering grantees and beneficiaries. Respect for those affected requires foundations to give them more of a say, both for instrumental reasons (local knowledge improves outcomes) and intrinsic reasons (mitigating power imbalances and respecting autonomy).
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      Some perspectives argue that the relationship between philanthropy and democracy can be complementary, or that the tensions between philanthropy and democracy can be resolved through institutional designs that render philanthropy compatible with democratic ideals. Reich (2018) argues that philanthropy can be supportive of democracy when it contributes to the distinctive goods of *pluralism* (i.e., in the provision of public goods) and *discovery* (roughly, innovation in the provision of public goods, in ways that electoral incentives may militate against). For Reich, if democracy is construed as a political system that champions a diverse and contestatory civil society, then philanthropic support from a broad base of ordinary citizens can provide one form of fuel for a pluralistic civil society and diminish governmental orthodoxy in defining its contours. Institutionalized philanthropy, such as through philanthropic foundations, can be one vehicle for experimentalism in social problem-solving, over longer-time horizons than state agencies and commercial firms are likely to undertake. Pevnick (2013) argues that the nonprofit sector might be democratized if the power to contribute were more widely dispersed, e.g., by replacing existing tax mechanisms for subsidizing philanthropy with vouchers distributed in equal amounts to all citizens. Rubenstein (2022) argues that small-dollar donating is itself a democratic practice. MacKenzie (2021) has proposed using participatory budgeting models within philanthropic foundations to democratize the allocation of funds.
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      The tensions between philanthropy and democracy are often explored within the context of the nation-state, but some philosophers explore them in a global context. International non-governmental organizations (INGOs) are often government-funded, but many rely at least in part on philanthropic funding (from either elite donors, large numbers of small donors, or a combination thereof). There is ongoing debate as to whether the activities of INGOs ought to be understood as a form of (unelected) interest-representation, and how (if at all) such representation can meet democratic standards (Rubenstein 2015; Montanaro 2018)[^montanaro-2018][^rubenstein-2015]. Others have proposed mechanisms for democratizing the allocation of international philanthropic funds themselves: Tanasoca and Dryzek (2021) advocate for deliberative democratic fora in which the global poor could exercise collective voice in the direction of proposed donations.
    step1: TBD
    step2: TBD
