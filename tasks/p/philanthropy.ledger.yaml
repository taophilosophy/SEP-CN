      任何关于慈善的哲学讨论，早晚都得面对许多现代哲学家区分正义与慈善（后者也被称为“人道”或“行善”）的努力。据法国社会学家马塞尔·莫斯说，这一区分在前现代社会已露端倪：在剩余产品充裕的时期，关于慷慨的社会期待从“古老的礼物道德”转向“正义原则”，富人被视为对穷人负有义务（Mauss 1925 [1990: 18]）[^mauss-1925]。施舍与慈善的社会秩序，逐渐让位于一种独具现代特色的正义传统（Fleischacker 2004）[^fleischacker-2004]。
