      然而，这一立场也意味着，国家对慈善的恰当角色不是补贴它（这涉及为他人利益干涉某些人的自由）（Fleischer 2010）[^fleischer-2010]。国家一般应尊重并执行捐赠者选择附加于其赠与的条件——尽管这可能给受赠者与第三方带来不利（Florino 2016）[^florino-2016]。
