      Stripped of its religious connotations, charity is typically considered to involve the voluntary fulfillment of an imperfect duty, a duty that requires agents to adopt an end but leaves to their discretion how to fulfill it (Hill 2018; see also the entries on supererogation and Kant’s moral philosophy)[^hill-2018]. Some, if not all, charity may be supererogatory, worthy of praise when performed but unworthy of blame when not performed (McMahan 2018)[^mcmahan-2018]. By contrast, justice is obligatory and usually considered a perfect duty of persons and of social institutions, a duty that admits of limited discretion, correlates to rights and claims of specific individuals, and may be enforced or compelled by law. Of course, the distinction can quickly become complicated when unjust circumstances prevail, which is to say, nearly always in actually-existing societies. In unjust circumstances, the voluntary charitable actions of givers can supply goods that are owed to others as a matter of justice.
    step1: |-
      剥去宗教意涵之后，慈善通常被认为涉及一种不完全义务的自愿履行：这种义务要求行动者采纳某个目的，却把如何实现留给其裁量（Hill 2018；另见“超义务”与“康德的道德哲学”词条）[^hill-2018]。即便不是全部，部分慈善也可能是超义务的：做了值得称赞，不做无可指责（McMahan 2018）[^mcmahan-2018]。相比之下，正义是强制性的，通常被视为个人与社会制度的完全义务：这种义务几乎没有裁量余地，对应着特定个体的权利与主张，并可由法律强制执行。当然，当不义的环境盛行时——也就是说，在几乎一切现实存在的社会中——这一区分很快会变得复杂。在不义的环境下，给予者的自愿慈善行为可能供给他人按正义本应享有的善物。
    step2: |-
      慈善一旦剥去宗教意涵，通常被理解为对一种不完全义务的自愿履行：这种义务只要求行动者认领一个目的，如何达成则听凭其裁量（Hill 2018；另见“超义务”与“康德的道德哲学”词条）[^hill-2018]。慈善即便不全、至少有一部分是超义务的：做了值得称许，不做也不该受责（McMahan 2018）[^mcmahan-2018]。正义则相反，具有强制性，通常被视作个人与社会制度的完全义务：裁量余地极小，对应着特定个体的权利与主张，且可由法律强制或强迫执行。当然，一旦不义的处境当道——这几乎是一切实际存在的社会的常态——这条界线很快就会变得盘根错节：在不义处境下，给予者的自愿慈善行为可能填补他人依正义本该享有的善物。
