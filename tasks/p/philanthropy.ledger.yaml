      Longtermism extends the concern of effective altruism from seeking to improve currently living human beings (and animals) to seeking to influence the indefinite future and the interest in there being a great many future generations. As a practical matter, this orients effective altruism away from identifying highly effective aid organizations and toward reducing existential risks to humanity, low probability events that could prevent future generations from coming into existence (Ord 2020; MacAskill 2022)[^macaskill-2022][^ord-2020].
    step1: |-
      长期主义把有效利他主义的关切从改善当前活着的人类（与动物）扩展到试图影响无限未来、以及关心未来世代数量极大。就实践而言，这使有效利他主义从识别高效援助组织，转向降低人类的存在性风险——那些可能阻止未来世代存在的低概率事件（Ord 2020; MacAskill 2022）[^macaskill-2022][^ord-2020]。
    step2: |-
      **长期主义**把有效利他主义的关切从改善当前活着的人类（与动物）扩展到试图影响无限未来、以及关心未来世代数量极大。就实践而言，这使有效利他主义从识别高效援助组织，转向降低人类的**存在性风险**——那些可能阻止未来世代存在的低概率事件（Ord 2020; MacAskill 2022）[^macaskill-2022][^ord-2020]。
