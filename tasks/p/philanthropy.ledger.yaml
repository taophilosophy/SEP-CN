      If support for the pluralism of civil society rather than the fulfillment of basic needs is the rationale for public subsidies for philanthropy, then the policy instrument of a charitable tax deduction is harder to support. The plutocratic bias in the charitable deduction policies means that the public funds forgone due to the deduction flow disproportionately to the favored charities and causes of the wealthy. The charitable priorities of the rich are weighted more heavily than those of lower and middle-income households. According to data from 2005, the distribution of charitable giving across causes differs significantly between high-income and general households. Religious and basic-needs organizations receive a much smaller share of donations from high-income households compared to the general population (Reich 2018: chapter 2)[^reich-2018].
