      According to one of its most prominent exponents, William MacAskill, effective altruism asks individuals how they can make the biggest difference or maximize the good they can do in the world. It invites people to use evidence and reason to determine how to benefit others as much as possible (MacAskill 2019: 13)[^macaskill-2019]. Effective altruism’s roots, however, can be found in Peter Singer’s argument, dating back to his famous 1972 article, “Famine, Affluence, and Morality”, that persons in the developed world have strong obligations to address desperate global poverty (and, as he would later argue, resist the inhumane treatment of sentient animals) (Singer 1972; Singer 1975)[^singer-1972][^singer-1975]. Singer’s pond example from that article prefigures the moral force of effective altruism. Singer asks the reader to imagine walking past a shallow pond in which a small child is drowning. It would be trivially easy to wade into the pond and rescue the child, but doing so would soil one’s clothes and make one late for work. Nevertheless, it would seem that we have a moral obligation to rescue the child; it would be morally monstrous not to do so.
    step1: |-
      据其最著名的倡导者之一威廉·麦卡斯基尔说，有效利他主义向个人提出这样的问题：他们怎样才能造成最大的改变，或最大化自己在这个世界上所能做出的善？它邀请人们运用证据与理性，来确定如何尽可能多地造福他人（MacAskill 2019: 13）[^macaskill-2019]。不过，有效利他主义的根源可追溯到彼得·辛格的论证：早在 1972 年那篇著名文章《饥荒、富裕与道德》中，辛格就主张，发达世界的人有强烈义务去解决全球赤贫问题（并且，如他后来所主张的，抵制对有感动物不人道的对待）（Singer 1972; Singer 1975）[^singer-1972][^singer-1975]。辛格在该文中举的池塘例子，预示了有效利他主义的道德力量。辛格请读者设想：你走过一个浅池塘，里面有个小孩快要淹死。蹚进池塘救出孩子轻而易举，但这样做会弄脏衣服，还会让你上班迟到。尽管如此，我们似乎仍有道德义务去救那个孩子；不救才是道德上的禽兽之行。
