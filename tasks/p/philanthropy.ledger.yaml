      ### 3.1 Virtue Ethics
    step1: TBD
    step2: TBD
  - id: 29
    kind: body
    source: |-
      Consequentialist perspectives and their deontological critics have dominated much of the recent philosophical discussion of philanthropy. But the virtue ethics tradition provides a much longer history of philosophical reflection on giving. And from Aristotle to the Stoics to contemporary perspectives, virtually all philosophers whom one might place in the virtue ethics tradition have agreed that traits like generosity and compassion are important virtues. (Nietzsche, a controversial candidate for inclusion as a virtue ethicist, is a possible exception.) Aristotle offers up one of the earliest and most enduring reflections on the ethics of giving, writing
    step1: TBD
    step2: TBD
  - id: 30
    kind: body
    source: |-
      > To give away money is an easy matter and in any man’s power. But to decide to whom to give it, and how large, and when, and for what purpose and how, is neither in every man’s power nor an easy matter. (*Nicomachean Ethics* 2.9.1109a27)
    step1: TBD
    step2: TBD
  - id: 31
    kind: body
    source: |-
      Virtue ethical perspectives treat characteristics of the virtuous agent as primary, rather than as derivative of moral duties or reasons to promote good states of affairs. They emphasize the cultivation of good moral character, which will have important implications for what matters in evaluating philanthropy: rather than simply assessing whether donors have done their duty, or whether they have promoted impartially good states of affairs, we will want to know about the character of the giver (which cannot be assessed on the basis of a single act of giving). Her *motive* and *disposition* will be important objects of ethical evaluation. Unlike a utilitarian, a virtue ethicist has reason to censure large-scale philanthropy motivated by a desire for prestige. And unlike a Kantian, a virtue ethicist will not be satisfied by donors acting from duty (even against inclination): the fully virtuous individual (unlike the merely continent one) does not experience internal conflict or engage in virtuous action only after a struggle (Hursthouse & Pettigrove 2016 [2023])[^hursthouse-2016].
    step1: TBD
    step2: TBD
  - id: 32
    kind: body
    source: |-
      Another important concept in the virtue ethics tradition is *phronesis,* or practical wisdom. Virtues are not simply emotional dispositions like pity, which a child might have (Hursthouse 1999; Hursthouse & Pettigrove 2016 [2023])[^hursthouse-1999][^hursthouse-2016]. Rather, they are characteristics of rational agents who have learned from experience how to choose virtuous actions in a range of situations. The well-intentioned but thoughtless or profligate giver therefore lacks the virtue of the thoughtful and provident donor. In that sense, a kind of folk virtue ethics animates many classic discussions of giving by non-philosophers, such as Andrew Carnegie’s “Gospel of Wealth” (1889).
    step1: TBD
    step2: TBD
  - id: 33
    kind: body
    source: |-
      Virtue ethicists encourage us to disaggregate our ethical analyses: G.E.M. Anscombe’s pathbreaking “Modern Moral Philosophy” argues that, rather than saying something is (morally) “wrong”, it is better to always name “a genus such as ‘untruthful,’ ‘unchaste,’ ‘unjust’” (Anscombe 1958: 9)[^anscombe-1958]. While they have been in the minority in contemporary philosophical discussion of philanthropy (e.g., Swanton 2018; Martin 1994)[^martin-1994][^swanton-2018], virtue ethical perspectives have the potential to vary and deepen the terms of discussion about it. When debate is framed in terms of whether making or accepting a philanthropic donation is right or wrong (or permissible or impermissible), some objections to philanthropy may be difficult to understand without availing ourselves of virtue ethics’ more granular vocabulary. For example, it may be morally permissible for a private university to sell naming rights to its graduate school of arts and sciences for $100 million dollars: both the donor and the university may be acting within their rights. But this need not mean that there are no ethical objections to be made: selling naming rights in this way might be “vulgar” or “undignified” even if not “morally wrong” in a general sense.
    step1: TBD
    step2: TBD
  - id: 34
    kind: body
    source: |-
      Crucially, it is not only virtues for *givers* about which a virtue ethicist will have something to say. There are also virtues of recipients: most importantly gratitude, but perhaps also providence and self-respect. Since contemporary philosophical discussion of philanthropy generally privileges the moral perspective of donors, virtue ethics also has the potential to contribute to a discussion of the ethics of receiving gifts (for both individuals and institutions).
    step1: TBD
    step2: TBD
  - id: 35
    kind: body
    source: |-
      As they develop, it will be important for virtue ethical perspectives on giving to consider the possibility of tensions between virtues (e.g., between compassion and respect, or between gratitude and dignity). Are any apparent tensions illusory or resolvable with sufficient practical wisdom? Or are there sometimes irresolvable conflicts between virtues that may limit the ability of virtue ethical perspectives to provide determinate action guidance? A further question is whether virtue *ethical* perspectives can contribute to the growing literature on philanthropy in *political* philosophy: perhaps, for example, by considering how the virtues and dispositions that should guide individual givers and recipients might be cultivated (or undermined) through political action.
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      ### 3.2 Effective Altruism and Other Consequentialist Views
    step1: TBD
    step2: TBD
  - id: 37
    kind: body
    source: |-
      Aristotle may have set the agenda long ago for the most essential questions to answer concerning philanthropy. But until recently, contemporary philosophers have had little to say about philanthropy, perhaps because their concerns have been directed in large part to questions of justice. That has changed with effective altruism. Effective altruism is the label for an umbrella of views that are the product of recent philosophical argument that has also given rise to a growing social movement far beyond the quarters of philosophy departments and academic journals.
    step1: TBD
    step2: TBD
  - id: 38
    kind: body
    source: |-
      According to one of its most prominent exponents, William MacAskill, effective altruism asks individuals how they can make the biggest difference or maximize the good they can do in the world. It invites people to use evidence and reason to determine how to benefit others as much as possible (MacAskill 2019: 13)[^macaskill-2019]. Effective altruism’s roots, however, can be found in Peter Singer’s argument, dating back to his famous 1972 article, “Famine, Affluence, and Morality”, that persons in the developed world have strong obligations to address desperate global poverty (and, as he would later argue, resist the inhumane treatment of sentient animals) (Singer 1972; Singer 1975)[^singer-1972][^singer-1975]. Singer’s pond example from that article prefigures the moral force of effective altruism. Singer asks the reader to imagine walking past a shallow pond in which a small child is drowning. It would be trivially easy to wade into the pond and rescue the child, but doing so would soil one’s clothes and make one late for work. Nevertheless, it would seem that we have a moral obligation to rescue the child; it would be morally monstrous not to do so.
    step1: TBD
    step2: TBD
  - id: 39
    kind: body
    source: |-
      Singer then argues that there is no morally relevant difference between the drowning child and a child in a poor country who will die without our assistance. Just as one has a moral duty to save the drowning child, we have a similar obligation to assist people in extreme poverty through donations to effective charities. Still more, taking the argument to its logical conclusion, individuals are obligated to divest themselves of resources to assist desperately needy others up to the point of being only marginally better off than those they would assist. Yet of course few people offer assistance to the global poor and almost none donate large percentages of their wealth for this purpose. One sees in the pond example some of the core claims of effective altruism—that all lives have equal moral worth, and distance or nationality or even membership in a generational cohort in time are not morally relevant factors. Effective altruism counsels us to maximize the good we can do for others, on impartial and welfarist grounds, using evidence and reason.
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      Effective altruism is responsible for inspiring a number of different organizations dedicated to spreading its message and reducing the effort involved in identifying highly effective charitable organizations, including Giving What We Can (where members pledge to donate at least 10 percent of their income to effective charities), 80,000 Hours (offering advice on effective altruist career choices), the Centre for Effective Altruism (founded by philosophers William MacAskill and Toby Ord), the charity rating organization GiveWell, and the grant maker Open Philanthropy.
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      Some of its proponents, such as MacAskill, eschew the idea that effective altruism is committed to utilitarianism or any other substantive moral view. For many others the consequentialist underpinnings are important. Though maximizing the good one can do in the world might allow for a variety of ways of defining the good, effective altruism seems committed to producing the best outcomes or, in prospect, identifying the best action by measuring the expected value of any action. The motive of the donor matters little or not at all. As a result, consequentialists embrace the idea of self-interest (e.g., the production of a “warm glow” in giving; taking satisfaction in doing good) alongside benefits to others. And they are eager to embrace self-interest when it might be shown to be useful in stimulating others to give or to give more (e.g., naming rights on buildings, reputational competition in philanthropic giving).
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      In recent years, effective altruism has spawned two new developments: earning to give and longtermism. Earning to give takes the approach of effective altruism and applies it to one’s time and career choice: what job should one take to maximize good in the world? Against conventional wisdom that doing good in the world involves working at an international aid organization, for example, earning to give suggests that an individual choose a high-earning career path with the intention of donating a significant portion of income to highly effective charities. By maximizing one’s earnings potential, effective altruists claim that one may do more good overall by donating that money to carefully selected charities than through typical altruistic career paths. The cryptocurrency mogul Sam Bankman-Fried adopted this approach, allegedly because of a college encounter with William MacAskill, in choosing a career that might earn him billions and allow him to donate most of it to effective altruist causes. (Bankman-Fried was convicted of criminal charges related to his cryptocurrency platform in 2023.)
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      Longtermism extends the concern of effective altruism from seeking to improve currently living human beings (and animals) to seeking to influence the indefinite future and the interest in there being a great many future generations. As a practical matter, this orients effective altruism away from identifying highly effective aid organizations and toward reducing existential risks to humanity, low probability events that could prevent future generations from coming into existence (Ord 2020; MacAskill 2022)[^macaskill-2022][^ord-2020].
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      Critics of effective altruism frequently point to its antipolitics and strong orientation toward individual rather than institutional change (see Srinivasan 2015; Berkey 2018; Dietz 2019; Lechterman 2020; Crary 2021)[^berkey-2018][^crary-2021][^dietz-2019][^lechterman-2020][^lechterman-2020-2][^srinivasan-2015]. Srinivasan, for example, criticizes effective altruism for a certain paradoxical conservatism. Despite its ambition to change the world for the better, the effective altruist takes the political and organizational structure of the world as is—global capitalism, minimalist democracy, and the existing set of international aid organizations.
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      > No expected value calculation is likely to counsel an individual to undertake to uproot capitalism, build a new political movement, or even start a new aid organization,
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      she writes (Srinivasan 2015)[^srinivasan-2015].
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      > Its utilitarian calculations presuppose that everyone else will continue to conduct business as usual; the world is a given, in which one can make careful, piecemeal interventions. The tacit assumption is that the individual, not the community, class or state, is the proper object of moral theorizing. (ibid.)
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      Critics of longtermism may hold that we have stronger duties to the present and near-term generations because the relationships and causal connections we share make us more responsible for their interests. They may also point to the difficulty of predicting the effects of our actions over the long term, especially in comparison with more reliable predictions we can make about nearer events (Tarsney 2023)[^tarsney-2023]. Others may point to controversial axioms prominent longtermists hold about population ethics (Setiya 2022)[^setiya-2022]. Some have sought to defend Parfit’s Repugnant Conclusion (Parfit 1984)[^parfit-1984], which holds that maximizing wellbeing can lead us to prefer a world of many lives barely worth living over an alternative world where a smaller population enjoys flourishing lives (see the entry on the repugnant conclusion).
    step1: TBD
    step2: TBD
