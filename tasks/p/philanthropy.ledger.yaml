      This entry has traced debates over the concept, conception, and practice of philanthropy across periods and schools of philosophical thought. As we have seen, philanthropy raises ethical and political issues that have long been subjects of philosophical investigation; more recently, a contemporary philosophical literature has developed that considers philanthropy as a distinctive space of ethical and political action. Space limitations naturally preclude a comprehensive treatment of the topics we have chosen, and we have omitted many interesting and important topics altogether. We have made only brief contact with the ethics of nonprofit organizations (the intermediaries of philanthropic gifts), as a related but distinct topic of philosophical study. We have entirely ignored the question of state philanthropy, i.e., whether philanthropy is something in which states can also engage, and if so, how such a practice might figure in moral and political philosophy (Dworkin 1985; Murphy & Nagel 2002; Weinberg 2011)[^dworkin-1985][^murphy-2002][^weinberg-2011]. As philosophers show increasing interest in the topic of philanthropy, we look forward to further efforts to unravel lingering puzzles about this crucial and stimulating topic.
    step1: |-
      本词条跨时代与流派追溯了关于慈善的概念、观念与实践的辩论。如我们所见，慈善提出的伦理与政治问题久已是哲学考察的对象；晚近，一种当代哲学文献发展起来，把慈善视为伦理与政治行动的一个独特空间。篇幅所限自然无法对我们选定的论题作全面处理，我们也整体省略了许多有趣而重要的论题。对于非营利组织（慈善赠予的中介者）的伦理学这一相关而不同的哲学研究论题，我们仅作了简短接触。国家慈善的问题——即国家是否也能从事慈善，若能，这种实践在道德与政治哲学中会如何定位——我们全然未涉（Dworkin 1985; Murphy & Nagel 2002; Weinberg 2011）[^dworkin-1985][^murphy-2002][^weinberg-2011]。哲学家对慈善论题的兴趣日增，我们期待更多努力来解开这一紧要而激动人心的论题上尚存的谜团。
