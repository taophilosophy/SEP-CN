      Traditionally, worries about dirty money have been more prominent in non-consequentialist philosophical traditions. Both consequentialists and non-consequentialists can take account of the potential bad effects of accepting dirty money, such as the risk of legitimizing or further encouraging harmful economic activities. But for consequentialists, the potential for donations to do good (relative to the relevant alternative uses to which the money might be put) will often outweigh these risks. Peter Singer, for example, has argued against a generalized rejection of Sackler money (Singer 2019)[^singer-2019]. Put in the extreme, one thinks of the adage attributed to the founder of the Salvation Army, William Booth, who is alleged to have said, “The only problem with tainted money is that there just tain’t enough of it”.
    step1: |-
      传统上，对脏钱的忧虑在非后果论哲学传统中更为突出。后果论者与非后果论者都能把接受脏钱的潜在坏效果算进来，例如使有害经济活动合法化或进一步受鼓励的风险。但对后果论者来说，捐赠做好事的潜力（相对于这笔钱可能用途中的相关替代选项）往往会盖过这些风险。例如彼得·辛格便反对一概拒收萨克勒的钱（Singer 2019）[^singer-2019]。推到极端，人们会想起救世军创始人威廉·布斯的名言，据说他曾言：“脏钱唯一的问题是它实在不够多”。
    step2: |-
      就传统而言，对脏钱的疑虑在非后果论哲学传统里声势更壮。接受脏钱自有其潜在恶果——比如替有害的经济活动背书、或进一步助长其气焰——后果论者与非后果论者都会把这笔账算进去。但在后果论者看来，捐款的行善潜力（相对于这笔钱的其他可能用途）常常压倒这些风险。彼得·辛格即反对一刀切拒收萨克勒之钱（Singer 2019）[^singer-2019]。说到极致，有救世军创始人威廉·布斯的那句名言在：据说他曾讲——“脏钱唯一的问题是，它实在不够多”。
