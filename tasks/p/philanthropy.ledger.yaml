      Virtue ethical perspectives treat characteristics of the virtuous agent as primary, rather than as derivative of moral duties or reasons to promote good states of affairs. They emphasize the cultivation of good moral character, which will have important implications for what matters in evaluating philanthropy: rather than simply assessing whether donors have done their duty, or whether they have promoted impartially good states of affairs, we will want to know about the character of the giver (which cannot be assessed on the basis of a single act of giving). Her *motive* and *disposition* will be important objects of ethical evaluation. Unlike a utilitarian, a virtue ethicist has reason to censure large-scale philanthropy motivated by a desire for prestige. And unlike a Kantian, a virtue ethicist will not be satisfied by donors acting from duty (even against inclination): the fully virtuous individual (unlike the merely continent one) does not experience internal conflict or engage in virtuous action only after a struggle (Hursthouse & Pettigrove 2016 [2023])[^hursthouse-2016].
    step1: |-
      德性伦理学视角把有德行动者的特征视为首要的，而不是把它们视为道德义务或促进善事态之理由的派生。它们强调良好道德品质的培养，这对评价慈善时什么要紧有重要含义：我们不仅评估捐赠者是否尽了义务、或是否不偏不倚地促进了善事态，还想了解给予者的品格（这无法基于单次给予行为来评估）。她的*动机*与*气质*将是伦理评价的重要对象。与功利主义者不同，德性伦理学家有理由谴责出于求名欲的大规模慈善。与康德主义者不同，德性伦理学家不会满足于捐赠者出于义务而行（哪怕违背其倾向）：完全有德者（不同于仅仅有节制者）不会经历内心冲突，也不会只在挣扎之后才作出有德行为（Hursthouse & Pettigrove 2016 [2023]）[^hursthouse-2016]。
