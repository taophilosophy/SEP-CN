      ### 4.2 Philanthropy and Freedom
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      Libertarian views vary in their justifications and implications, but most tend to create comparatively wide space for philanthropy as a consequence of limiting the scope of permissible state action. For libertarians, freedom is typically understood as non-interference with individual choices (except to prevent harm or protect the rights of others) and a just society is one that minimizes the exercise of coercive force. Liberty encompasses the freedom to allocate one’s resources according to one’s preferences, and it includes the permission to donate one’s resources to willing recipients. For libertarians, philanthropy—as with marketplace activity—can be understood as a form of consensual exchange or contract (Nozick 1974)[^nozick-1974]. A society organized largely in terms of voluntary transactions will likely contain many inequalities and unmet needs. Consequently, libertarians tend to see philanthropy as an especially praiseworthy exercise of liberty (Lomasky 1995)[^lomasky-1995]. But it is more than praiseworthy; a libertarian view emphasizes the beneficial outcomes and moral superiority of philanthropy when compared to government-provided assistance. Charity is regarded as a commendable and liberty-preserving means of aiding the underprivileged, as it is voluntary in nature, unlike public provision, which relies on state coercion through taxation and redistribution. Consequently, private charity is considered to have greater legitimacy than government programs. Furthermore, libertarians argue that, due to its often localized and innovative approach, private charity is more likely to yield effective results than government aid.
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      However, this position also suggests that the appropriate role of the state with respect to philanthropy is not to subsidize it (which involves interfering with the liberty of some for the benefit of others) (Fleischer 2010)[^fleischer-2010]. And the state is generally to respect and enforce the terms that donors choose to attach to their gifts—despite the disadvantages this may create for recipients and third parties (Florino 2016)[^florino-2016].
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      Republicans understand freedom as non-domination, where to be dominated is to be susceptible to arbitrary exercises of power (Pettit 1997)[^pettit-1997]. Government legitimacy requires that power is limited in ways that track citizens’ interests. But the threat of domination can also come from private sources, and republicans are especially critical of dominating relationships between philanthropists and beneficiaries, who may depend on gifts for their livelihood and thus live a precarious and servile existence. Republican arguments can thus lend support to institutional designs that seek to make the necessities of life more reliably accessible. The welfare state and universal basic income schemes are familiar proposals here (Pettit 2006)[^pettit-2006]. However, republicanism also supports the position that a sufficient number of philanthropists competing in an area can limit domination by enabling beneficiaries to choose more freely among them (Taylor 2018)[^taylor-2018]. For many republicans, whether or how much philanthropy dominates depends on background conditions and policy choices. Additionally, a prominent theme in republican thought is the importance of a contestatory citizenry for checking government domination (Pettit 2012)[^pettit-2012]. Such efforts require resources, and philanthropy is the most obvious source of funds for civil society organizations that monitor, protest, and advocate (Lechterman & Reich 2020)[^lechterman-2020][^lechterman-2020-2].
    step1: TBD
    step2: TBD
