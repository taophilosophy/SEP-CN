      In short, justice crowds out the space for charity—and this is not to be regretted (Kymlicka 2001)[^kymlicka-2001]. If acts of charity are subsumed under the requirements of justice, then they are not truly "charity" in the traditional sense of voluntarily giving up resources one is entitled to keep. And if they go beyond justice, they seem more like optional personal goals rather than moral obligations.
