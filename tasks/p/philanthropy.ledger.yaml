      For an effective altruist, the core question is how one person can benefit another person, and the relationship placed in the foreground is benefactor to beneficiary. But for Kant, the core question is about justice, and the relationship placed in the foreground is mutual respect and accountability. (For more on the contrast between effective altruism and Kant, see Darwall 2024)[^darwall-2024]. Furthermore, because on Kant’s view the immiseration of some is likelier due to injustice than misfortune, the voluntary action of the advantaged to assist the disadvantaged is improperly described as charity.
    step1: |-
      对有效利他主义者来说，核心问题是一个人如何能惠及另一个人，置于前景的关系是施惠者与受惠者。但对康德来说，核心问题关乎正义，置于前景的关系是相互尊重与问责。（关于有效利他主义与康德对照的更多讨论，见 Darwall 2024）[^darwall-2024]。此外，在康德看来，一些人的赤贫化更可能缘于不义而非不幸，因此优势者扶助劣势者的自愿行动不宜被描述为慈善。
    step2: |-
      有效利他主义者的核心问题是：一个人如何使另一个人受惠；被推到前景的关系是施惠者与受惠者。康德的核心问题则是正义；被推到前景的是相互尊重与彼此问责（两种进路的对照详见 Darwall 2024）[^darwall-2024]。再者，康德认为某些人沦于赤贫，多半该归咎不义而非厄运，故优势者自愿扶助劣势者，称之为“慈善”并不恰当。
