      如果慈善捐赠税收豁免的一个关键理由，是支持一个放大公民声音的多元公民社会，那么现行慈善扣除未能通过这一检验。其财阀偏向使其从支持民主的角度看不可辩护。有人主张应取消税收优惠。其他人，如佩夫尼克（2016），主张应代之以一种统一的税收抵免，向所有纳税人开放，对全体公民的慈善捐赠给予同等补贴，不论收入高低。这将使税收政策更好地与促进公民在公民社会中声音与影响平等的目标相一致。
