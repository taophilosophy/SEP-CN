      ## 2. Justice versus Charity
    step1: TBD
    step2: TBD
  - id: 17
    kind: body
    source: |-
      Any philosophical discussion of philanthropy must at some point engage the effort of many modern philosophers to distinguish between the concepts of justice and charity (variously dubbed “humanity” or “beneficence”). According to the French sociologist Marcel Mauss, the distinction is anticipated in pre-modern societies when, during periods of surplus, the social expectations concerning generosity shift from “the ancient morality of the gift” to a “principle of justice” in which the wealthy are seen as obligated to the poor (Mauss 1925 [1990: 18])[^mauss-1925]. A social order of almsgiving and charity slowly gives way to a distinctively modern tradition of justice (Fleischacker 2004)[^fleischacker-2004].
    step1: TBD
    step2: TBD
  - id: 18
    kind: body
    source: |-
      Stripped of its religious connotations, charity is typically considered to involve the voluntary fulfillment of an imperfect duty, a duty that requires agents to adopt an end but leaves to their discretion how to fulfill it (Hill 2018; see also the entries on supererogation and Kant’s moral philosophy)[^hill-2018]. Some, if not all, charity may be supererogatory, worthy of praise when performed but unworthy of blame when not performed (McMahan 2018)[^mcmahan-2018]. By contrast, justice is obligatory and usually considered a perfect duty of persons and of social institutions, a duty that admits of limited discretion, correlates to rights and claims of specific individuals, and may be enforced or compelled by law. Of course, the distinction can quickly become complicated when unjust circumstances prevail, which is to say, nearly always in actually-existing societies. In unjust circumstances, the voluntary charitable actions of givers can supply goods that are owed to others as a matter of justice.
    step1: TBD
    step2: TBD
  - id: 19
    kind: body
    source: |-
      Allen Buchanan rejects the firm distinction between justice and charity (Buchanan 1987)[^buchanan-1987]. He objects to the commonplace idea that justice is a perfect whereas charity is an imperfect duty. Duties of charity can be made perfect through the construction of social institutions that identify those to whom one is obligated and provide the means for supporting them. Thus, the common view that philanthropy is supererogatory and discretionary because it falls under charity rather than justice. With proper institutions, duties of aid can be made sufficiently determinate to be socially enforced to some degree, even if they don’t correlate with individual rights. So, philanthropy need not be an uncoordinated individual enterprise. In the end, whether philanthropic duties are required as a matter of justice depends for Buchanan on what ends philanthropy is intended to serve and the justifiability of the social arrangements that specify and allocate those duties. It cannot be settled by simply labeling them matters of charity rather than justice.
    step1: TBD
    step2: TBD
  - id: 20
    kind: body
    source: |-
      Will Kymlicka agrees that if justice is to be realized in a world where our basic institutional arrangements ignore or create unjust inequalities, then charity can be a welcome mechanism for addressing deprivation and disadvantage (Kymlicka 2001)[^kymlicka-2001]. But, contra Buchanan, charity is nevertheless still secondary to, and derivative of, justice. The primary obligation of citizens is to strive to bring about just institutions through social and political change. Responding to injustice through private almsgiving is at best a second-best response. This is so for two reasons. First, charity is inefficient, a patchwork of uncoordinated efforts in which donors tend to prefer those with similar religious or ethnoracial identities. Were charitable efforts directed more impartially, seeking out the neediest without concern for social identity, it would still be less effective than thoroughgoing institutional reform. Think here of J.S. Mill’s view that
    step1: TBD
    step2: TBD
  - id: 21
    kind: body
    source: |-
      > the great error of reformers and philanthropists in our time [is] to nibble at the consequences of unjust power, instead of redressing the injustice itself. (Mill 1848: V.XI.§9)[^mill-1848]
    step1: TBD
    step2: TBD
  - id: 22
    kind: body
    source: |-
      Second is a point of principle, namely that the demands of justice subsume and define the aims of charity. The appropriate objects of charitable giving are those who suffer from injustice and unfairness. “[I]n identifying appropriate acts of charity”, says Kymlicka,
    step1: TBD
    step2: TBD
  - id: 23
    kind: body
    source: |-
      > we invoke our criteria of justice to identify who should be giving charity, to whom it should be given, and how much should be given. (Kymlicka 2001: 95)[^kymlicka-2001]
    step1: TBD
    step2: TBD
  - id: 24
    kind: body
    source: |-
      In short, justice crowds out the space for charity—and this is not to be regretted (Kymlicka 2001)[^kymlicka-2001]. If acts of charity are subsumed under the requirements of justice, then they are not truly "charity" in the traditional sense of voluntarily giving up resources one is entitled to keep. And if they go beyond justice, they seem more like optional personal goals rather than moral obligations.
    step1: TBD
    step2: TBD
  - id: 25
    kind: body
    source: |-
      On Kymlicka’s view, the virtue of charity exists in name only: it is either defined by justice (and hence not an independent virtue) or beyond justice (and hence not a moral requirement). The only way to give charity more theoretical space is via a radically different vision of justice. One such alternative (to be discussed later) is libertarianism.
    step1: TBD
    step2: TBD
  - id: 26
    kind: body
    source: |-
      This assumes, it must be said, a restricted view of charity. But for many, philanthropy has a weaker association with addressing deprivation and disadvantage or meeting the demands of distributive justice. Donating to a museum, for instance, is not an obligation of justice and yet many perceive this as a philanthropic act. Some donors may perceive their actions as an expression of their conception of the good, their understanding of what is valuable in life, or their personal tastes. Thus, for many it is crucial to emphasize philanthropy’s role in providing *non*-justice goods alongside its involvement in the realization or hindrance of justice (see Pevnick 2013; Lechterman 2022; Schiller 2023)[^lechterman-2022][^pevnick-2013][^schiller-2023].
    step1: TBD
    step2: TBD
