      The tensions between philanthropy and democracy are often explored within the context of the nation-state, but some philosophers explore them in a global context. International non-governmental organizations (INGOs) are often government-funded, but many rely at least in part on philanthropic funding (from either elite donors, large numbers of small donors, or a combination thereof). There is ongoing debate as to whether the activities of INGOs ought to be understood as a form of (unelected) interest-representation, and how (if at all) such representation can meet democratic standards (Rubenstein 2015; Montanaro 2018)[^montanaro-2018][^rubenstein-2015]. Others have proposed mechanisms for democratizing the allocation of international philanthropic funds themselves: Tanasoca and Dryzek (2021) advocate for deliberative democratic fora in which the global poor could exercise collective voice in the direction of proposed donations.
    step1: |-
      慈善与民主的张力常在民族国家语境中考察，但一些哲学家在全球语境中探讨它们。国际非政府组织（INGOs）常由政府资助，但许多至少部分依赖慈善资金（或来自精英捐赠人、大量小额捐赠人，或二者兼有）。关于国际非政府组织的活动应否被理解为一种（未经选举的）利益代表制，以及这种代表制如何（如果能够）满足民主标准，争论持续不断（Rubenstein 2015; Montanaro 2018）[^montanaro-2018][^rubenstein-2015]。另一些人为国际慈善资金配置本身的民主化提出机制：塔纳索卡与德雷泽克（2021）倡议设立审议民主论坛，让全球穷人能在拟议捐赠的方向上行使集体发声。
