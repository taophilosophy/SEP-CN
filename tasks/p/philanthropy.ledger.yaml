      Critics of longtermism may hold that we have stronger duties to the present and near-term generations because the relationships and causal connections we share make us more responsible for their interests. They may also point to the difficulty of predicting the effects of our actions over the long term, especially in comparison with more reliable predictions we can make about nearer events (Tarsney 2023)[^tarsney-2023]. Others may point to controversial axioms prominent longtermists hold about population ethics (Setiya 2022)[^setiya-2022]. Some have sought to defend Parfit’s Repugnant Conclusion (Parfit 1984)[^parfit-1984], which holds that maximizing wellbeing can lead us to prefer a world of many lives barely worth living over an alternative world where a smaller population enjoys flourishing lives (see the entry on the repugnant conclusion).
    step1: |-
      长期主义的批评者可能主张，我们对当下与近期世代负有更强义务，因为我们共享的关系与因果联系使我们对其利益负有更大责任。他们也可能指出，预测我们行动在长时段内的效果很困难，尤其是与我们对较近事件能作出的更可靠预测相比（Tarsney 2023）[^tarsney-2023]。其他人可能指出，著名长期主义者持有一些有争议的人口伦理学公理（Setiya 2022）[^setiya-2022]。有些人试图为帕菲特的“令人厌恶的结论”辩护（Parfit 1984）[^parfit-1984]：该结论认为，最大化福祉可能使我们宁愿选择一个由许多仅勉强值得活的生命组成的世界，也不愿选择一个人口较少但生活繁荣的替代世界（见“令人厌恶的结论”词条）。
