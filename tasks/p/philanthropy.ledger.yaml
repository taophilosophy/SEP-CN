      One of the most striking developments in the practice of philanthropy over the past several decades has been the attempts to combine philanthropy with commercial activity. Should business firms engage in philanthropy, and if so, how? Strong social norms support the donation of some portion of profits to charitable causes. Corporate philanthropy might be justified, for instance, on the grounds that corporations have surplus resources that can often be put to better uses than padding executive salaries or lining shareholders’ pockets. Perhaps businesses owe donations to society in return for their many privileges. However, corporate philanthropy also invites fundamental criticisms. Some libertarians, such as the economist Milton Friedman, hold that the social responsibility of business is to increase profits, and therefore corporate philanthropy is tantamount to theft of shareholder’s assets (Friedman 1970)[^friedman-1970]. Corporate profits are shareholders’ property, and it is the right of shareholders—not business managers—to determine whether and how to donate their property. A more recent “market failures” view holds that businesses maximize their contribution to social welfare by seeking efficiency, which they accomplish by conscientious profit-seeking (Heath 2014)[^heath-2014]. From this perspective, directly seeking good outcomes through philanthropy may reduce firms’ efficiency gains and compromise their contributions to social welfare. Democratic critics question the potential distortions to political equality of corporate giving programs, which may allow corporations disproportionate influence over matters of common concern, and the ways in which firms’ business goals may distort their philanthropic priorities (Lechterman 2022; Saunders-Hastings 2022b)[^lechterman-2022][^saunders-hastings-2022b]. And a common cynical view regards philanthropy as a way of deflecting attention from misconduct and exploitation in other areas of a firm’s business activities. Critics of corporate philanthropy often agree there are nonetheless certain limited forms of corporate giving that may be morally permissible if not morally required in certain cases, such as the sharing of proprietary resources during emergencies (Mejia 2021)[^mejia-2021].
    step1: |-
      过去几十年慈善实践中最引人注目的进展之一，是试图把慈善与商业活动结合起来。企业应否从事慈善？若应，如何从事？强有力的社会规范支持把部分利润捐给慈善事业。企业慈善或许可以得到辩护，理由是：企业拥有盈余资源，与其用来膨胀高管薪酬或填满股东腰包，常常不如用于更好的用途。或许，企业以其诸多特权，应当向社会回馈捐赠。然而，企业慈善也招致根本性的批评。一些自由至上主义者，如经济学家米尔顿·弗里德曼，主张企业的社会责任就是增加利润，因此企业慈善无异于盗窃股东的资产（Friedman 1970）[^friedman-1970]。企业利润是股东的财产，决定是否以及如何捐赠这份财产的是股东——而非企业管理者——的权利。较晚近的“市场失灵”观主张，企业通过追求效率来最大化其对社会保障的贡献，而效率来自自觉的逐利（Heath 2014）[^heath-2014]。照此观点，经由慈善直接追求好结果，可能削减企业的效率收益，从而损害其对社会保障的贡献。民主批评者质疑企业捐赠计划可能扭曲政治平等：它可能让企业对公共事务享有不成比例的影响；企业逐利目标也可能扭曲其慈善优先项（Lechterman 2022; Saunders-Hastings 2022b）[^lechterman-2022][^saunders-hastings-2022b]。而一种流俗的冷眼观把慈善看作转移视线的手段：企业其他业务中的不法与剥削借此逃出聚光灯。企业慈善的批评者们往往也同意：某些有限形式的企业捐赠在特定情形下纵非道德所要求，也在道德上允许，例如紧急时期共享专有资源（Mejia 2021）[^mejia-2021]。
    step2: |-
      过去几十年，慈善实践上最扎眼的动态之一，是设法把慈善与商业经营揉在一起。企业该不该做慈善？若该，怎么做？强有力的社会规范支持企业捐出部分利润行善。为企业慈善辩护，可以说：企业握有盈余资源，与其拿去抬高管薪酬、塞股东腰包，不如派上更好的用场；也可以说，企业享尽特权，欠社会一些回馈捐赠。但企业慈善同样招来釜底抽薪式的批评。一部分自由至上主义者——如经济学家米尔顿·弗里德曼——主张企业的社会责任就是增加利润，企业慈善无异于偷窃股东的资产（Friedman 1970）[^friedman-1970]：利润是股东的财产，要不要捐、怎么捐，是股东（而非经理人）的权利。较晚近的“市场失灵”论则说：企业靠自觉逐利来追求效率，效率最大化即是对社会保障的最大贡献（Heath 2014）[^heath-2014]。按此看法，企业借慈善直接追求善果，反会侵蚀效率收益，折损其对社会保障的贡献。民主派批评者则质疑企业捐赠计划对政治平等的潜在扭曲：它可能让企业对公共事务施加不成比例的影响；企业的经营目标也可能带偏其慈善优先序（Lechterman 2022; Saunders-Hastings 2022b）[^lechterman-2022][^saunders-hastings-2022b]。流俗的冷眼旁观者更把慈善看作烟幕：企业其他板块的不法与剥削，借慈善转移了视线。不过企业慈善的批评者多半承认：某些有限形态的企业捐赠，纵非道德所要求，在特定情形下也是道德所允许的，比如紧急时期共享专有资源（Mejia 2021）[^mejia-2021]。
