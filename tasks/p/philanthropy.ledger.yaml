      Republicans understand freedom as non-domination, where to be dominated is to be susceptible to arbitrary exercises of power (Pettit 1997)[^pettit-1997]. Government legitimacy requires that power is limited in ways that track citizens’ interests. But the threat of domination can also come from private sources, and republicans are especially critical of dominating relationships between philanthropists and beneficiaries, who may depend on gifts for their livelihood and thus live a precarious and servile existence. Republican arguments can thus lend support to institutional designs that seek to make the necessities of life more reliably accessible. The welfare state and universal basic income schemes are familiar proposals here (Pettit 2006)[^pettit-2006]. However, republicanism also supports the position that a sufficient number of philanthropists competing in an area can limit domination by enabling beneficiaries to choose more freely among them (Taylor 2018)[^taylor-2018]. For many republicans, whether or how much philanthropy dominates depends on background conditions and policy choices. Additionally, a prominent theme in republican thought is the importance of a contestatory citizenry for checking government domination (Pettit 2012)[^pettit-2012]. Such efforts require resources, and philanthropy is the most obvious source of funds for civil society organizations that monitor, protest, and advocate (Lechterman & Reich 2020)[^lechterman-2020][^lechterman-2020-2].
    step1: |-
      共和主义者把自由理解为无支配：受支配即容易遭受权力的任意行使（Pettit 1997）[^pettit-1997]。政府正当性要求权力受到追随公民利益的限制。但支配的威胁也可来自私人方面，共和主义者对慈善家与受助者之间的支配性关系批评尤烈——后者可能靠赠予维生，因而过一种朝不保夕、仰人鼻息的生活。共和主义的论证因此可以支持那些力求让生活必需品更可靠可及的制度设计。福利国家与全民基本收入方案是这里的熟悉提案（Pettit 2006）[^pettit-2006]。不过，共和主义也支持这样的立场：某一领域内足够多的慈善家相互竞争，能让受助者更自由地择选，从而限制支配（Taylor 2018）[^taylor-2018]。对许多共和主义者来说，慈善是否支配、支配多少，取决于背景条件与政策选择。此外，共和主义思想的一个突出主题是：可争议的公民对于制衡政府支配何其重要（Pettit 2012）[^pettit-2012]。这类努力需要资源，而慈善是那些监督、抗议与倡导的公民社会组织最显眼的资金来源（Lechterman & Reich 2020）[^lechterman-2020][^lechterman-2020-2]。
    step2: |-
      共和主义把自由理解为无支配：所谓受支配，就是随时可能遭到权力的任意摆布（Pettit 1997）[^pettit-1997]。政府的正当性要求权力受限，且限制之道须追踪公民利益。可是支配之患也会从私人一侧袭来；对慈善家与受助者之间的支配关系，共和主义者批评得格外严厉——受助者或须仰赖捐赠糊口，日子过得朝不保夕、低眉顺眼。由此，共和主义的论证支持那些力求让生活必需品更有保障可及的制度设计；福利国家与全民基本收入方案是其间耳熟能详的提案（Pettit 2006）[^pettit-2006]。不过共和主义同时力挺另一种立场：只要同一领域里慈善家数目够多、彼此竞争，受助者便可在其间较自由地挑选，支配由此受限（Taylor 2018）[^taylor-2018]。在许多共和主义者看来，慈善支配与否、支配几何，系于背景条件与政策抉择。此外，共和主义思想反复申说一个主题：能提出异议的公民是遏制政府支配的关键（Pettit 2012）[^pettit-2012]。而这类努力离不开资源——监督、抗议、倡导的公民社会组织，其最醒目的资金来源正是慈善（Lechterman & Reich 2020）[^lechterman-2020][^lechterman-2020-2]。
