      ### 3.1 Virtue Ethics
    step1: TBD
    step2: TBD
  - id: 29
    kind: body
    source: |-
      Consequentialist perspectives and their deontological critics have dominated much of the recent philosophical discussion of philanthropy. But the virtue ethics tradition provides a much longer history of philosophical reflection on giving. And from Aristotle to the Stoics to contemporary perspectives, virtually all philosophers whom one might place in the virtue ethics tradition have agreed that traits like generosity and compassion are important virtues. (Nietzsche, a controversial candidate for inclusion as a virtue ethicist, is a possible exception.) Aristotle offers up one of the earliest and most enduring reflections on the ethics of giving, writing
    step1: TBD
    step2: TBD
  - id: 30
    kind: body
    source: |-
      > To give away money is an easy matter and in any man’s power. But to decide to whom to give it, and how large, and when, and for what purpose and how, is neither in every man’s power nor an easy matter. (*Nicomachean Ethics* 2.9.1109a27)
    step1: TBD
    step2: TBD
  - id: 31
    kind: body
    source: |-
      Virtue ethical perspectives treat characteristics of the virtuous agent as primary, rather than as derivative of moral duties or reasons to promote good states of affairs. They emphasize the cultivation of good moral character, which will have important implications for what matters in evaluating philanthropy: rather than simply assessing whether donors have done their duty, or whether they have promoted impartially good states of affairs, we will want to know about the character of the giver (which cannot be assessed on the basis of a single act of giving). Her *motive* and *disposition* will be important objects of ethical evaluation. Unlike a utilitarian, a virtue ethicist has reason to censure large-scale philanthropy motivated by a desire for prestige. And unlike a Kantian, a virtue ethicist will not be satisfied by donors acting from duty (even against inclination): the fully virtuous individual (unlike the merely continent one) does not experience internal conflict or engage in virtuous action only after a struggle (Hursthouse & Pettigrove 2016 [2023])[^hursthouse-2016].
    step1: TBD
    step2: TBD
  - id: 32
    kind: body
    source: |-
      Another important concept in the virtue ethics tradition is *phronesis,* or practical wisdom. Virtues are not simply emotional dispositions like pity, which a child might have (Hursthouse 1999; Hursthouse & Pettigrove 2016 [2023])[^hursthouse-1999][^hursthouse-2016]. Rather, they are characteristics of rational agents who have learned from experience how to choose virtuous actions in a range of situations. The well-intentioned but thoughtless or profligate giver therefore lacks the virtue of the thoughtful and provident donor. In that sense, a kind of folk virtue ethics animates many classic discussions of giving by non-philosophers, such as Andrew Carnegie’s “Gospel of Wealth” (1889).
    step1: TBD
    step2: TBD
  - id: 33
    kind: body
    source: |-
      Virtue ethicists encourage us to disaggregate our ethical analyses: G.E.M. Anscombe’s pathbreaking “Modern Moral Philosophy” argues that, rather than saying something is (morally) “wrong”, it is better to always name “a genus such as ‘untruthful,’ ‘unchaste,’ ‘unjust’” (Anscombe 1958: 9)[^anscombe-1958]. While they have been in the minority in contemporary philosophical discussion of philanthropy (e.g., Swanton 2018; Martin 1994)[^martin-1994][^swanton-2018], virtue ethical perspectives have the potential to vary and deepen the terms of discussion about it. When debate is framed in terms of whether making or accepting a philanthropic donation is right or wrong (or permissible or impermissible), some objections to philanthropy may be difficult to understand without availing ourselves of virtue ethics’ more granular vocabulary. For example, it may be morally permissible for a private university to sell naming rights to its graduate school of arts and sciences for $100 million dollars: both the donor and the university may be acting within their rights. But this need not mean that there are no ethical objections to be made: selling naming rights in this way might be “vulgar” or “undignified” even if not “morally wrong” in a general sense.
    step1: TBD
    step2: TBD
  - id: 34
    kind: body
    source: |-
      Crucially, it is not only virtues for *givers* about which a virtue ethicist will have something to say. There are also virtues of recipients: most importantly gratitude, but perhaps also providence and self-respect. Since contemporary philosophical discussion of philanthropy generally privileges the moral perspective of donors, virtue ethics also has the potential to contribute to a discussion of the ethics of receiving gifts (for both individuals and institutions).
    step1: TBD
    step2: TBD
  - id: 35
    kind: body
    source: |-
      As they develop, it will be important for virtue ethical perspectives on giving to consider the possibility of tensions between virtues (e.g., between compassion and respect, or between gratitude and dignity). Are any apparent tensions illusory or resolvable with sufficient practical wisdom? Or are there sometimes irresolvable conflicts between virtues that may limit the ability of virtue ethical perspectives to provide determinate action guidance? A further question is whether virtue *ethical* perspectives can contribute to the growing literature on philanthropy in *political* philosophy: perhaps, for example, by considering how the virtues and dispositions that should guide individual givers and recipients might be cultivated (or undermined) through political action.
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
