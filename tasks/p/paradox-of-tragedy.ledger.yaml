      An alternative objection to the distancing approach is that it improperly locates the source of the putative ameliorative effect that fictionality has on our emotions. For, as noted earlier, many non-fictional representations can elicit pleasure through, or along with, causing distress. Even as their contents cause feelings of distress, pity, and disgust, we sometimes enjoy reading of such things as historical narratives of violent battles, tabloid reports of gruesome deaths, and seeing beautiful or otherwise compelling photographs of abject and suffering individuals, natural disasters, cities in ruins, and other subjects we would not take pleasure in seeing face-to-face. Perhaps the distancing model must dispense with the distinction between fictions and nonfictions, and help itself instead to a different distinction, such as that between representational and confrontational contexts (Matravers 2014)[^matravers-2014]. Here, fictionality, as such, is not what explains our capacity to take pleasure in painful experiences, rather being fictional is only one of many ways in which a state of affairs can be something into which we cannot intervene and cannot be practically affected by.
    step1: |-
      对距离进路的另一种反对意见是：它不恰当地定位了虚构性对我们的情绪所具有的所谓改善效果的来源。因为，如前所述，许多非虚构再现可以在引起痛苦的同时、或通过引起痛苦来引起快乐。即便其内容引起痛苦、怜悯与厌恶，我们有时也喜欢读历史上惨烈战役的记述、小报上骇人死亡的报道，喜欢看赤贫受苦者、自然灾害、废墟城市以及其他我们不愿面对面看到的主体的美丽或引人入胜的照片。也许距离模型必须放弃虚构与非虚构的区分，转而借助另一种区分，比如再现语境与直面语境的区分（Matravers 2014）[^matravers-2014]。在这里，虚构性本身并不是解释我们何以能从痛苦体验中取乐的东西；倒不如说，“是虚构的”只是“一个事态可以是我们无法干预、也无法实际受其影响的东西”的众多方式之一。
