  - id: 11
    kind: body
    source: |-
      1. Properly appreciating *A* involves forming a mental state with a negative valence (*Appreciation Condition*)
      2. We do not take pleasure in forming a mental state with a negative valence (*Coordination Condition*)
      3. We take pleasure in properly appreciating *A* (*Response Condition*)
    step1: |-
      1. 适当地欣赏*A*，涉及形成具有负效价的心理状态（*欣赏条件*）
      2. 我们不会以形成具有负效价的心理状态为乐（*协调条件*）
      3. 我们以适当欣赏*A*为乐（*反应条件*）
    step2: |-
      1. 恰当地欣赏*A*，意味着形成带有负效价的心理状态（**欣赏条件**）
      2. 我们并不以形成带负效价的心理状态为乐（**协调条件**）
      3. 我们以恰当欣赏*A*为乐（**反应条件**）
  - id: 12
    kind: body
    source: |-
      Although conditions 1–3 capture the structure of the puzzle, we should note that in the gloss on the paradox earlier, it was natural to refer to different kinds of attitudes being implicated beyond that of taking pleasure, viz, *desiring* and *valuing*. This reflects that there may be different formulations of the paradox employing reference to different attitudes—affective, conative, evaluative—which are taken to be central and in need of explanation.
    step1: |-
