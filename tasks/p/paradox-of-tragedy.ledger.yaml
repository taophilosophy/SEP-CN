  - id: 5
    kind: body
    source: |-
      At first glance, it shouldn’t be puzzling that works of art can elicit both pleasure and pain, for that conjunction arises in a wide range of ordinary non-aesthetic contexts. Frozen fingers, e.g., often come with playing in the snow. Hume’s enigma is that in certain artistic engagements our pleasure seems to be internally related to our distress. Pain is not merely a regrettable feature of the experience, the elimination of which, insofar as the pleasure remained, would be favored (Neill 1992: 153)[^neill-1992]. Rather, for Hume, one would not derive certain characteristic pleasures from tragic dramas if they did not provoke their characteristic kinds of negative emotions *qua* negative emotions. It is the experience of negative emotions, not something that happens to cause or be caused by their elicitation, that matters for our pleasure. As he notes, audiences are “pleased in proportion as they are afflicted” (1757 [1987: 217]). Although we will refer to this conundrum as *the paradox of tragedy*, the condition it describes is instantiated in many different modes of artistic experience beyond the theater.
    step1: |-
      初看之下，艺术作品既能引起快乐又能引起痛苦，这不该令人困惑，因为这种结合在广泛的日常非审美语境中都会出现。例如，冻僵的手指常常与在雪中玩耍相伴。休谟的谜题在于：在某些艺术活动中，我们的快乐似乎与我们的痛苦有内在关联。痛苦不只是体验中一个令人遗憾的特征——只要快乐还在，人们就希望消除它（Neill 1992: 153）[^neill-1992]。而是，在休谟看来，如果悲剧戏剧不激起其特有的那类负面情绪（*qua* 负面情绪），人们就不会从中获得某些特有的快乐。对我们的快乐来说，要紧的是负面情绪的体验本身，而不是碰巧引起这些情绪或被这些情绪引起的东西。如他所说，观众“受折磨的程度与他们愉悦的程度成正比”（1757 [1987: 217]）。虽然我们将把这一难题称为**悲剧悖论**，但它所描述的状况在剧场之外的许多不同艺术体验样式中都有实例。
    step2: |-
      乍看之下，艺术作品能同时引起快乐和痛苦，这并不值得大惊小怪：这种结合在大量日常的非审美场景中都会出现，比如在雪地里玩耍常伴着冻僵的手指。休谟的谜题在于：在某些艺术活动中，我们的快乐似乎与痛苦有着内在联系。痛苦并非体验中一个令人遗憾、只要快乐不受损便愿除去的成分（Neill 1992: 153）[^neill-1992]；在休谟看来，悲剧戏剧若不激起那类特有的负面情绪、且是 *qua* 负面情绪来激起，人们就得不到某些特有的快乐。对我们的快乐而言，要紧的正是负面情绪的体验本身，而不是碰巧引起它、或由它引起的东西。用他的话说，观众“受折磨越深，愉悦也越深”（1757 [1987: 217]）。下文虽把这一难题称为 **悲剧悖论**，但它所描述的情形在剧场之外的许多艺术体验样式中同样存在。
  - id: 6
    kind: body
    source: |-
      Thus, on the one hand, we often pursue and take pleasure in works of art in ways that are ostensibly explained by their elicitation of disagreeable feelings: fear of a movie’s monster, disgust over the simulated viscera in a painting, shock in playing a video game, cringing embarrassment for a television comedy’s heedless characters, alienation through punk rock, grief in listening to a threnody, disorientation entering into an installation, trauma in witnessing certain modes of performance art, and even boredom or acedia that, for example, are intentionally elicited in Andy Warhol’s eight-hour continuous footage of the Empire State Building filmed from a static point of view (Gilmore 2020: 157–158)[^gilmore-2020]. On the other hand, such engagements do not conform to the *prima facie* plausible assumption that we tend not to pursue experiences for the distress, pain, annoyance, or other aversive feelings they engender, and that when we must undergo such experiences we do not positively value or take pleasure in those disagreeable dimensions. Indeed, it might be proposed to be an analytic truth that we don’t take pleasure in something in virtue of what makes it displeasing to us.
    step1: |-
      因此，一方面，我们常常以表面上可由其引起不快感来解释的方式，追求并享受艺术作品：对电影怪物的恐惧，对画中模拟内脏的厌恶，玩电子游戏时的震撼，为电视喜剧中漫不经心的人物难堪地皱眉，通过朋克摇滚感到的疏离，听挽歌时的悲伤，进入装置艺术时的迷失，目睹某些行为艺术时的创伤，甚至包括无聊或灵性倦怠——例如安迪·沃霍尔以固定视角拍摄帝国大厦八小时连续影像时有意引起的那些感受（Gilmore 2020: 157–158）[^gilmore-2020]。另一方面，这类活动并不符合一个*初显*可信的假定：我们通常不会为了痛苦、不适、烦恼或其他令人反感的感受去追求体验；而当我们不得不经历这类体验时，也不会正面评价或享受那些令人不快的方面。其实，有人可能提出，“我们不会因某物令我们不快之处而享受它”是一条分析真理。
    step2: |-
      于是，一方面，我们追求并享受艺术作品，而这些追求表面上可以用作品激起的不快感来解释。比方说：对电影怪物的恐惧，对画中模拟内脏的厌恶，打电子游戏时的惊悸，为电视喜剧里没心没肺的角色而难堪皱眉，被朋克摇滚唤起的疏离感，听挽歌时的悲恸，走进装置作品时的迷失，目睹某些行为艺术时的创伤。甚至还有无聊或灵性倦怠（*acedia*）：安迪·沃霍尔（Andy Warhol）以固定机位连拍八小时帝国大厦的影像，就刻意激起这类感受（Gilmore 2020: 157–158）[^gilmore-2020]。另一方面，这类活动又不符合一个 **初显** 可信的假定：我们通常不会为着其带来的痛苦、疼痛、烦恼或其他令人反感的感受而去追求某种体验；即便不得不经历这类体验，我们也不会正面评价或享受其中令人不适的方面。其实还可以主张，“我们不会因其物令我们不快之处而享受它”是一条分析真理。
  - id: 7
    kind: body
    source: |-
      Before we consider alternative construals of the paradox, it is important to register that at least in Hume’s version the pains and pleasures of these kinds of artistic experiences aren’t easily accommodated in a *pro tanto* fashion. It seems right to say that in an ordinary case such as playing in the snow, we take pleasure in the experience *insofar as* it is diverting, an opportunity to be with friends, etc. and we feel discomfort in the experience *insofar as* our fingers begin to freeze and we shiver. No paradox would arise in our experience of tragic drama from its eliciting painful and pleasurable emotions that, analogously, are directed at respectively different objects (Ridley 2003)[^ridley-2003]. Some descriptions of the phenomenon thus eliminate its paradoxical air by identifying the distinct objects of pain and pleasure that have been unwittingly treated as one. By contrast, in Hume’s version of the puzzle, we do not disvalue tragedy insofar as it causes us pain and value it insofar as it gives us pleasure. Rather, the pain or distress a tragedy elicits seems itself positively valued (“unaccountably” so [1757: first line]). Further, that pain and pleasure seem to directly covary: at least within a restricted range, an increase in the former brings an increase in the latter.
    step1: |-
      在考虑这一悖论的其他解释之前，重要的是要指出：至少在休谟的版本中，这类艺术体验的痛苦与快乐并不容易按*就某一方面而言*（pro tanto）的方式加以安置。似乎可以说，在雪中玩耍这样的平常情形里，我们享受这一体验，*就其*消遣、是与朋友相处的机会等而言；我们在这体验中感到不适，*就*手指开始冻僵、我们发抖而言。如果悲剧戏剧引起的痛苦与快乐情绪类似地分别指向不同的对象，那么我们的悲剧体验就不会产生悖论（Ridley 2003）[^ridley-2003]。于是，有些对现象的描述通过辨识出被不自觉地当作一个的痛苦对象与快乐对象，取消了它的悖论气息。相比之下，在休谟版本的谜题中，我们并不是“就悲剧引起痛苦而言”贬低它、“就它给予快乐而言”珍视它。相反，悲剧所引起的痛苦或苦楚本身似乎得到了正面评价（“无从解释地”如此 [1757: 第一行]）。进一步说，那种痛苦与快乐似乎直接共变：至少在有限范围内，前者的增加带来后者的增加。
    step2: |-
      在考察这一悖论的其他解读之前，须先指出一点：至少在休谟的版本里，这类艺术体验中的痛苦与快乐难以按 **就某一方面而言**（*pro tanto*）的方式分别安置。在雪地里玩耍这类寻常情形中，我们享受这一体验，是因为它消遣、是和朋友相处的机会等等；我们感到不适，是因为手指开始冻僵、人打哆嗦。倘若悲剧戏剧所激起的痛苦与快乐情绪同样分别指向不同对象，悲剧体验就不会生出什么悖论（Ridley 2003）[^ridley-2003]。有些现象描述正是靠辨认出被无意间混为一谈的苦、乐对象，消去了悖论的气味。休谟版本的谜题不然：我们并不因悲剧带来痛苦而贬低它、因它给予快乐而推崇它；相反，悲剧所激起的痛苦或苦楚本身似乎就被正面评价（“无从解释地”如此 [1757: 第一行]）。再者，痛苦与快乐似乎直接共变：至少在有限幅度内，前者增加，后者也随之增加。
  - id: 8
    kind: body
    source: |-
      Of course, mere covariance of pain and pleasure in some experience doesn’t always pose a conundrum. Suppose that as it gets colder, the quality of the snow in which children play improves. There, the pleasure of throwing snowballs and the pain of frozen digits bear a direct relationship, but only because they share a common condition or cause. Here, if the pain could be diminished without a loss in pleasure, that would be something participants desire. By contrast, Hume’s enigma is that we seem to want to suffer: we undergo some sort of positive emotion that is explained by our distress, not just by the circumstances by which the distress is caused. It is that dynamic that would make it odd to agree with the “Positive Opera Company”, in an April Fools Day parody aired on National Public Radio, that audiences are better off when tragic operas such as *Don Giovanni* and *La Bohème* are rewritten to provide happy endings (broadcast 1 April 2006). Or, in a genuine example, it would be a dubious claim that audiences have reason to prefer Nahum Tate’s 1681 version of *King Lear* over Shakespeare’s insofar as the revision eliminates the destruction of Lear and Cordelia that makes the original so distressing.
    step1: |-
      当然，某些体验中痛苦与快乐的单纯共变并不总是构成难题。设想天越冷，孩子们玩耍的雪质就越好。在那里，扔雪球的快乐与冻僵手指的痛苦有直接关系，但这只是因为它们共享一个共同条件或原因。在此，如果痛苦能在快乐不减的情况下减少，那正是参与者所希望的。相比之下，休谟的谜题在于：我们似乎想要受苦——我们经历的某种正面情绪由我们的痛苦来解释，而不只是由造成痛苦的环境来解释。正是这种动态，使得赞同“正面歌剧团”（Positive Opera Company）会显得奇怪——那是全国公共广播电台播出的一档愚人节戏仿节目，主张若把《唐璜》和《波希米亚人》这类悲剧歌剧改写成大团圆结局，观众会过得更好（2006 年 4 月 1 日播出）。或者举一个真实的例子：说观众有理由更喜欢纳胡姆·泰特 1681 年版的《李尔王》而非莎士比亚的版本，因为该改写删去了使原作如此令人痛苦的李尔与考狄利娅之死，这将是一个可疑的主张。
    step2: |-
      当然，痛苦与快乐在某一体验中仅仅共变，未必构成难题。设想天越冷，孩子们玩耍的雪质越好：扔雪球的快乐与冻僵的手指之痛确有关系，但那只是因为二者共享同一条件或原因。在这种情况下，若痛苦能在快乐不减的前提下减轻，参与者求之不得。休谟的谜题却相反：我们似乎想要受苦——我们体验到某种正面情绪，其解释在于我们的痛苦本身，而不只是造成痛苦的外在处境。正是这一动态，让人难以苟同“正面歌剧团”（Positive Opera Company）的立场。那是全国公共广播电台（NPR）愚人节戏仿节目中的一个虚构团体，声称把《唐璜》《波希米亚人》这类悲剧歌剧改成大团圆结局，观众会更受用（2006 年 4 月 1 日播出）。再举一个真实的例子。有人主张，观众有理由偏爱纳胡姆·泰特（Nahum Tate）1681 年的《李尔王》改写本而非莎士比亚原作，理由是改写删掉了令原作如此痛苦的李尔与考狄利娅之死。这个主张同样可疑。
  - id: 9
    kind: body
    source: |-
      As we will see, the cases we wish to understand are highly variable: they, and the responses they elicit, may not fall into any natural class (Neill 1999: 124)[^neill-1999]. Furthermore, one may wish to abjure references to *pain* and other constitutively embodied responses in contexts in which the distress is primarily constituted by psychological not somatic states (for a common concept of pain, see Raja et al. 2020)[^raja-2020]. And to say that we *suffer* from a voluntary diversion such as attending the theater or streaming a film on tv can sound rather grandiose, at least when compared to real suffering people undergo in relation to non-imagined states of affairs. Allowing for those cavils, we can offer at least a preliminary attempt at a general characterization of the paradox, by saying that an experience has a negative affective *valence* in part or whole if it is one in which we feel pain or some other disagreeable emotion or feeling. And an experience has a positive affective valence if it is one in part or whole in which we feel pleasure or some agreeable emotion or feeling. The paradox can thus be stated as the conjunction of three individually plausible but jointly inconsistent propositions.
    step1: |-
      我们将会看到，我们想理解的情形变化多端：它们及其引起的反应可能不属于任何自然的类别（Neill 1999: 124）[^neill-1999]。此外，在痛苦主要由心理而非躯体状态构成的情境中，人们可能希望避免提及*疼痛*及其他本质上涉及身体的反应（关于疼痛的一个常见概念，见 Raja et al. 2020）[^raja-2020]。而且，说我们*受苦*于看戏或在线看电影这类自愿消遣，听起来相当夸张，至少与人们在面对非想象的事态时所经历的真实苦难相比是如此。考虑到这些挑剔，我们至少可以先尝试对悖论作一般性的刻画：若一个体验全部或部分地是我们感到疼痛或其他令人不快的情感或感受，则该体验具有负面的情感**效价**；若一个体验全部或部分地是我们感到快乐或某种令人愉快的情感或感受，则该体验具有正面的情感效价。于是，悖论可以表述为三个各自可信、但合起来不一致的命题的合取。
    step2: |-
      后面将会看到，我们想理解的情形千差万别：这些情形及其引发的反应，恐怕不属于任何自然的类别（Neill 1999: 124）[^neill-1999]。再者，当痛苦主要由心理状态而非躯体状态构成时，人们也许不愿再提 **疼痛** 和其他本质上涉及身体的反应（关于疼痛的通行概念，见 Raja et al. 2020）[^raja-2020]。而且，说我们为看戏、在线看电影这类自愿消遣而 **受苦**，未免有些夸张——至少与人们面对非想象事态时的真实苦难相比是如此。撇开这些苛细之处，我们仍可先对悖论作一个初步的一般刻画：一个体验若全部或部分地包含我们感到的疼痛，或其他令人不快的情感、感受，它就具有负面的情感 **效价**；若全部或部分地包含我们感到的快乐，或某种令人愉快的情感、感受，它就具有正面的情感效价。这样，悖论便可表述为三个各自可信、合则不一致的命题之合取。
