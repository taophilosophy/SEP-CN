      Theorists who propose that a control condition operates in our experience of tragic drama stress the greater degree of power we have over the pain caused by works of art than over the pain caused by ordinary experience (see Eaton 1982; Morreall 1985)[^eaton-1982][^morreall-1985]. Specifically, we can enjoy tragic and other sorts of aversive works of art when we are aware we can direct our thoughts and actions *vis-à-vis* the work in question. Theorists argue that such control limits or changes the character of the putative painfulness of some works of art, such that the pain at issue doesn’t generate the paradox that a desire for, or valuing of, ordinary pain would. One way such control is manifested is in our awareness, when experiencing negative affect *vis-à-vis* art, that the story belongs to a genre in which it is typical for all things to work out in the end. One may also simply infer a happy ending from what one knows about a work, as one’s sadness over the life-threatening illness of a television character is made tolerable by one’s knowledge that a series wouldn’t kill them off so soon. Feelings of anxiety or fear are therefore accommodated through modes of affective regulation that rely on our familiarity with the artform in question.
    step1: |-
      主张控制条件在我们观看悲剧戏剧的体验中起作用的理论家强调：我们对艺术作品引起的痛苦所拥有的支配力，要大于对日常体验引起的痛苦的支配力（见 Eaton 1982; Morreall 1985）[^eaton-1982][^morreall-1985]。具体说，当我们意识到自己能够针对所论作品引导自己的思想与行动时，我们就能享受悲剧及其他令人反感的艺术作品。理论家论证说，这种控制限制或改变了某些艺术作品所谓痛苦性的性质，从而使所论痛苦不产生那种“欲求或看重日常痛苦”会产生的悖论。这种控制的一种表现方式是：在体验针对艺术的负面情感时，我们意识到故事属于那种一切到最后通常会得到解决的体裁。人们也可能仅仅从自己对一部作品的了解中推断出大团圆结局：例如，对电视角色身患威胁生命的疾病的悲伤，会因知道剧集不会这么快把角色写死而变得可以忍受。因此，焦虑或恐惧的感受，便通过依赖我们对相关艺术形式之熟悉的情感调节方式而得到容纳。
    step2: |-
      主张控制条件在我们观看悲剧的体验中起作用的理论家强调：对艺术作品造成的痛苦，我们的掌控程度高于对日常体验造成的痛苦（见 Eaton 1982; Morreall 1985）[^eaton-1982][^morreall-1985]。具体说，只要我们意识到自己能针对所看的作品引导思想与行动，就能享受悲剧之类的反感艺术。理论家认为，这种控制限制或改变了某些作品所谓痛苦性的性质，于是那痛苦不会生出“欲求或看重日常痛苦”才会有的悖论。这种控制的一种表现是：在体验针对艺术的负面情感时，我们心里有数——这故事属于那种一切到头来通常会有着落的体裁。也可能只是从对作品的了解里推出大团圆：对电视角色罹患绝症的悲伤，因为知道剧集不会这么快把角色写死，便变得可以忍受。于是，焦虑或恐惧就靠情感调节的方式被容纳下来，而这种调节依赖我们对相关艺术形式的熟悉。
