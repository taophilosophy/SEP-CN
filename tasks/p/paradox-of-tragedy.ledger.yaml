      One such benefit that could render the experience of disagreeable dimensions of an art form worthwhile is aesthetic pleasure. Thus a common approach, motivated by Hume’s essay, is that we suffer in response to the *content* of the tragic representation but feel pleasure in response to its *formal* features (Yanal 1991: 76; Eaton 1989)[^eaton-1989][^yanal-1991]. The thought behind such *hedonic compensatory theories* is that I feel pain in imaginatively representing the contents of a play, but pleasure in such things as the play’s plot, language, scenery, costuming, and the actors’ performances. That pleasure is provided in a sufficient quantity or degree to justify undergoing that pain. This solution thus treats the proper appreciation of a work of art as comprised of two distinct affective experiences, each with its own object: the represented content, and the medium or mode of representation. Our experience of that content—e.g., through imagining that the represented state of affairs is real—is posited to cause us pain. At the same time, our experience of the work’s medium or mode of representation—e.g., through seeing its beauty or evaluating its plot—is said to give us pleasure. Thus, noting the pleasure elicited by a painter’s achievement of verisimilitude, Aristotle remarks that “objects which in themselves we view with pain, we delight to contemplate when reproduced with minute fidelity” (Poetics IV). Although intuitively compelling, the problem with this approach is that it is exceedingly difficult to speak of our experience of form or content as separable from the other in a way that is consistent with artistic appreciation.
    step1: |-
      能使艺术形式中令人不适方面的体验变得值得的一种益处，是审美快乐。因此，一种由休谟文章激发的常见进路是：我们对悲剧再现的*内容*作出痛苦的反应，但对其*形式*特征感到快乐（Yanal 1991: 76; Eaton 1989）[^eaton-1989][^yanal-1991]。这类*享乐补偿理论*背后的想法是：我在想象地再现一部剧作的内容时感到痛苦，但在剧作的情节、语言、布景、服装和演员表演等事物中感到快乐。那种快乐被提供到足够的量或程度，足以证成承受那种痛苦。于是，这一解答把对艺术作品的适当欣赏视为由两个不同的情感体验构成，各有其对象：所再现的内容，以及再现的媒介或方式。我们对那种内容的体验——例如，通过想象所再现的事态是真实的——被设定为引起我们的痛苦。与此同时，我们对作品媒介或再现方式的体验——例如，通过看到它的美或评价其情节——据说给予我们快乐。因此，亚里士多德在谈到画家达到逼真性所引起的快乐时评论说，“我们本来就以之为苦的对象，一旦被精确地再现出来，我们就乐于观看”（《诗学》第四章）。尽管这个进路直觉上很有说服力，问题在于：要以与艺术欣赏相容的方式谈论我们对形式或内容的体验彼此可分离，是极其困难的。
    step2: |-
      能让艺术形式中令人不适的方面变得值得体验的一种益处，是审美快乐。于是有一种常见进路（其动因来自休谟的文章）：我们对悲剧再现的 **内容** 感到痛苦，却对其 **形式** 特征感到快乐（Yanal 1991: 76; Eaton 1989）[^eaton-1989][^yanal-1991]。这类 **享乐补偿理论** 的想法是：我在想象地再现一出戏的内容时感到痛苦，却在情节、语言、布景、服装、演员表演这些东西上感到快乐；快乐的分量或程度足以证成我们承受那份痛苦。这一解答因此把对艺术作品的恰当欣赏看成两个不同的情感体验，各有各的对象：被再现的内容，以及再现的媒介或方式。对内容的体验——比如想象所再现的事态是真的——被设定为引起痛苦；对作品媒介或再现方式的体验——比如看到它的美、品评它的情节——则据说带来快乐。亚里士多德正是注意到画家达到逼真性所带来的快乐，才说“我们本来就以之为苦的对象，一经精确再现，我们就乐于观看”（《诗学》第四章）。这一进路直觉上颇能服人，但麻烦在于：要把我们对形式或内容的体验说成彼此可分离、又不违背艺术欣赏的实际，实在极其困难。
