      Some explanations of the paradox suggest that in our experience of painful art, the content is rendered in such a way so as to “convert” its distressing elements, as a kind of raw material, into a pleasurable form. Hume’s account lends itself to this interpretation (Yanal 1991)[^yanal-1991]. It is not only, he writes, that the “melancholy passions” are overcome by “something stronger of the opposite kind” but that those passions are “converted into pleasure” (1757 [1987: 220]). Here, Hume stresses that the negative emotions aroused by the distressing events must be of a sufficiently high intensity for the accompanying or consequent pleasure furnished by the conversion of those passions to be as substantial as it is. So, for example, Cicero’s eloquence applied to ordinary events would not result in a pleasure with as great a magnitude as when it’s applied to awful ones.
    step1: |-
      有些对悖论的解释提出：在我们对痛苦艺术的体验中，内容被呈现的方式把其致苦元素“转化”为一种令人愉快的形式，就像把一种原料加工成品。休谟的论述适合这一解读（Yanal 1991）[^yanal-1991]。他写道，不仅是“忧郁激情”被“某种更强、性质相反的东西”克服，而且那些激情“被转化为快乐”（1757 [1987: 220]）。在这里，休谟强调：由致苦事件唤起的负面情绪必须具有足够高的强度，那些激情之转化所提供的伴随的或后续的快乐才会如其所示那样充实。因此，例如，西塞罗的雄辩施于平常事件，所产生的快乐不会像施于可怕事件时那样巨大。
    step2: |-
      有些解释认为，我们在体验痛苦艺术时，内容被处理成某种样子，把其中致苦的成分当作原料，“转化”为令人愉快的形式。休谟的论述正可作此解读（Yanal 1991）[^yanal-1991]。他写道，不仅是“忧郁激情”被“某种更强、性质相反的东西”克服，而且那些激情“被转化为快乐”（1757 [1987: 220]）。休谟在此强调：致苦事件唤起的负面情绪，强度必须足够高，激情转化所带来的伴随或后续快乐才会那样丰厚。所以，西塞罗的雄辩若施于平常事件，产生的快乐就不会像施于可怕事件时那样大。
