      Even when we restrict the operative attitude to one kind (whether emotions, desires, or appraisals) two such attitudes toward the same object can coherently disagree, as we saw above, in virtue of being *pro tanto*, or directed at the object from a different perspective. Taking pleasure in one’s child leaving for college isn’t inconsistent with feeling sadness over her departure from home. Mixed emotions and incompatible desires are a common feature of affective experience (Greenspan 1980; Larsen & McGraw 2014)[^greenspan-1980][^larsen-2014]. Note, however, it would be too quick to assume any pairing of attitudes that belong to different kinds is thereby rationally benign; for that would prejudge the question of whether a given attitude-kind imposes rational or psychological constraints on another. Some philosophers argue, for example, that a desire for *x* presents *x* as valuable or “good” (e.g., Stampe 1987)[^stampe-1987]. Some psychological theories of the emotions construe at least some of them as expressions of desires (Green 1992; Gordon 1987)[^gordon-1987][^green-1992]. And, finally, emotions themselves have characteristic somatic, cognitive, expressive, behavioral, and phenomenological dimensions that can make particular emotional pairings psychologically and physically difficult to sustain (Cowen & Keltner 2017)[^cowen-2017].
    step1: |-
      即便把起作用的态度限定为一种（无论是情绪、欲求还是评价），指向同一对象的两个此类态度也可以合理地不一致——如我们上面所见——因为它们*就某一方面而言*，或从不同视角指向该对象。为孩子离家上大学而高兴，与为她离开家而悲伤并不矛盾。混合情绪与不相容的欲求是情感体验的常见特征（Greenspan 1980; Larsen & McGraw 2014）[^greenspan-1980][^larsen-2014]。然而要注意：认为凡属不同种类的态度配对因而在理性上都是无害的，那就太快了；因为这会预先断定某一态度种类是否对另一态度种类施加理性或心理约束。例如，有些哲学家主张，对*x*的欲求把*x*呈现为有价值的或“好的”（如 Stampe 1987）[^stampe-1987]。有些情绪心理学理论把至少某些情绪解释为欲求的表达（Green 1992; Gordon 1987）[^gordon-1987][^green-1992]。最后，情绪本身具有特征性的躯体、认知、表达、行为与现象学维度，这会使某些情绪配对在心理上和身体上难以维持（Cowen & Keltner 2017）[^cowen-2017]。
    step2: |-
      即便把起作用的态度限定为同一类（无论是情绪、欲求还是评价），指向同一对象的两个此类态度也完全可以合理地不一致。如上文所见，它们只是 **就某一方面而言** 成立，或从不同视角指向同一对象。为孩子离家上大学而高兴，与为她离开家而难过，并不矛盾。混合情绪与彼此冲突的欲求本就是情感体验的常态（Greenspan 1980; Larsen & McGraw 2014）[^greenspan-1980][^larsen-2014]。不过要注意：不能草率地认为，不同种类的态度一旦配对就必然在理性上相安无事——那会预判某个态度种类是否对另一态度种类构成理性或心理约束。例如，有些哲学家主张，对*x*的欲求即把*x*呈现为有价值的或“好的”（如 Stampe 1987）[^stampe-1987]；有些情绪心理学理论把至少一部分情绪看作欲求的表达（Green 1992; Gordon 1987）[^gordon-1987][^green-1992]。再者，情绪本身带有特征性的躯体、认知、表达、行为与现象学维度，某些情绪配对因此在心理和生理上都难以维持（Cowen & Keltner 2017）[^cowen-2017]。
