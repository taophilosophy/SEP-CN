      Solutions to the paradox based on control face two major objections. One is that already lodged against distance theories: the control theorist argues that the typical negative valence of a given emotion is ameliorated or eliminated when our experience of it is one over which we have some power. The problem here is assuming that thus separated from its displeasing or aversive dimension via a sense of control, the negative emotion is the same emotion it would otherwise be. Theories of emotions that hold that the valence of an emotion is an intrinsic quality of it would disagree. For them, a solution to the paradox based on the control condition doesn’t explain how we can take pleasure in a displeasing emotion, it just implicitly denies that we experience the displeasing emotion in question. The second objection is that the control condition seems false to experience: one can feel fully in control over whether or not one attends to a horrifying, disgusting, or tragic state of affairs in a fictional film without that sense of control making attending to those elements any less displeasing (Gaut 1993: 338)[^gaut-1993]. Attending to a fictional representation of such events might be less distressing than actually witnessing such events. However, it is not clear that whether control is given or withheld over attending to the fictional representation of awful circumstances makes a difference in the aversive feelings it causes.
    step1: |-
      基于控制的悖论解答面临两大反对意见。其一是已经针对距离理论提出的：控制理论家论证说，当一个既定情绪的典型负效价，在我们的体验是某种我们对其拥有权力之事时，便被减轻或消除。这里的问题在于假定：这样通过控制感与情绪令人不快或令人反感的维度相分离之后，负面情绪仍是它本来会是的那种情绪。主张情绪效价是情绪内在性质的情绪理论会不同意。对它们来说，基于控制条件的悖论解答没有解释我们如何能从令人不快的情绪中获得快乐，它只是暗中否认我们体验到了所论的令人不快的情绪。第二个反对意见是：控制条件似乎与经验不符：一个人可以完全感到自己掌控着是否去注意一部虚构电影中骇人、恶心或悲剧性的事态，而这种控制感并不会使注意那些元素变得不那么令人不快（Gaut 1993: 338）[^gaut-1993]。注意此类事件的虚构再现，也许比实际目睹此类事件更少令人痛苦。然而，对于注意可怕情境的虚构再现，控制是给予还是收回，是否对其引起的反感情绪有所影响，并不清楚。
    step2: |-
      基于控制的解答面临两大反对。第一个已针对距离理论提出过：控制理论家说，当一个情绪的典型负效价处在我们的掌控之下时，它就被减轻或消除了。问题在于假定：靠控制感让负面情绪与它令人不快、令人反感的维度这样分离之后，它还是原来那个情绪。认为效价是情绪内在性质的情绪理论不会同意。在它们看来，基于控制条件的解答根本没有解释我们如何能从令人不快的情绪里得乐，只是暗中否认了我们体验到了那个令人不快的情绪。第二个反对是：控制条件与经验不符。一个人完全可以感到，是否去注意一部虚构影片里骇人、恶心或悲惨的事态，全在自己掌控，可这份掌控感并不会让注意那些内容少一分不快（Gaut 1993: 338）[^gaut-1993]。注意此类事件的虚构再现，也许比真的目睹这些事件轻些。但是，对注意可怕情境的虚构再现这件事，控制是给还是不给，是否真会影响它引起的反感，却并不清楚。
