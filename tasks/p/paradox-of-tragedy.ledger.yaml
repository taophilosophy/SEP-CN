      Thus, the sorrow one feels for a fictional character need not be in itself a disagreeable or negatively-valenced experience; it is undesirable by virtue of the undesirable situation that it registers an evaluation of (Neill 1992: 62)[^neill-1992]. This approach treats the negativity of a negative emotion as, at least sometimes, a relational property of the event or state of affairs the emotion is a response to. Only secondarily, and only sometimes, does the disvalue of the state of affairs prompt an unpleasantness in the phenomenology of undergoing the emotion elicited by awareness of that state of affairs.
