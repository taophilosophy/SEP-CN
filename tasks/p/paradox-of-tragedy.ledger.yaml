      所论观点的支持者于是可能回应说：引起我们快乐的不仅是悲剧的形式，而且是它作为内容被再现的东西。我们并不以单纯的内容为乐：例如，不以“李尔抱着被谋杀的考狄利娅”为乐，而是以剧作（演员、舞台调度等）再现那一事件的特定方式为乐。但如果这种“被赋予形式的内容”被用来解释我们的快乐，那么又用什么解释我们的痛苦？不可能是内容本身，因为我们无法触及内容，除非它被某种既定形式所浸染。类似的问题也困扰着另一种尝试：把我们痛苦与快乐的不同对象分别当作悲剧的悲伤内容与它的*艺术性*——因为对一部作品艺术性的任何完整描述，都要提到那内容是什么，即作品再现了哪些事件与事态。充其量可以说，悲剧的某些形式特征本身提供快乐，与它们在“构成悲剧内容再现方式”中的角色无关。灯光、服装、舞台布景、音乐、动作、声音等方面本身可能令人愉快，也许由此补偿情节造成的不快。然而，这一进路留下如下问题：为什么观众常常宁愿看悲剧戏剧，而不看那些不含悲剧致苦内容的其他戏剧作品？即便喜剧提供同样的形式回报，人们也并不总是选择喜剧而非悲剧。我们将在下面考虑补偿快乐说的其他版本与反对意见之后，再回到这个问题。
