      Whether the emotions we feel for the contents of fictions are continuous with those we have for what is represented by our beliefs and other truth-apt attitudes is a substantial question addressed in discussions of the so-called paradox of fictions. Reasons to doubt that such emotions felt for the objects of imaginings are of the same kind as “real world” emotions, include: asymmetries in their phenomenology, differences in their functional roles, the cognitive or evaluative content of each affective state, and the direct-objects of each state (Gilmore 2013; Stecker 2011)[^gilmore-2013][^stecker-2011].
    step1: |-
      我们对虚构内容所感的情绪，是否与我们对由信念及其他可适真态度所表征之物所感的情绪连续一致，是所谓“虚构悖论”讨论中处理的一个实质性问题。怀疑对想象对象的此类情绪与“真实世界”情绪同属一种的理由包括：它们现象学上的不对称、功能角色的差异、每种情感状态的认知或评价内容，以及每种状态的直接对象（Gilmore 2013; Stecker 2011）[^gilmore-2013][^stecker-2011]。
