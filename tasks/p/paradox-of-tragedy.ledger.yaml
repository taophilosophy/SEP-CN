      The exceptions are compensatory approaches (what Levinson [2014b: xii] calls “organicist”) in which the connection between the negative and positive dimensions of the experience is tighter and the latter is directly dependent on the former (presumably only within certain ranges). Earlier, we saw an objection to solutions to the paradox that say that, in a *pro tanto* manner, we take pleasure in the formal or aesthetic dimensions of a tragedy and feel pain about its content. The objection was that this implies that if we could experience the formal aspects of tragedy in a work that caused us no pain, we would prefer that to the tragedy. While this is of course sometimes the case, it is implausible to posit it as a general rule. We do often choose tragedies over comedies, without assuming the latter is deficient in its formal values. A rejoinder here is the proposal that the pain that tragic drama causes possesses a particular character, making the experience of *that* pain a precondition for realizing tragedy’s particular compensatory good. That good, in other words, cannot be furnished by a work without tragedy’s distressing dimension. In one such proposal, for example, it is only in and through the suffering elicited by tragedy that we contemplate our vulnerability to loss. In another proposal certain aesthetic or *experiential* values can be realized only in our encounters with such works (Budd 1995)[^budd-1995]. The suffering we experience in watching a tragedy might, for example, have cognitive value both in the familiar sense in that it allows us to learn about the suffering of others, or to enhance our capacity for empathy, and the more interesting sense in which certain insights may be available to us only through our suffering. Sadness might, for example impose an otherwise inaccessible pattern of saliency on what we see and on our relation to it.
    step1: |-
      例外是那些（Levinson [2014b: xii] 称为“有机论的”）补偿进路：在其中，体验的负面与正面维度之间的联系更紧密，后者直接依赖于前者（想必只在某些范围内）。前面我们看到一个对悖论解答的反对意见：这些解答说，我们以*就某一方面而言*的方式，从悲剧的形式或审美维度获得快乐，而对其内容感到痛苦。反对意见是：这蕴含，如果我们能在不引起痛苦的作品中体验悲剧的形式方面，我们会宁愿要那个作品而不要悲剧。虽然这当然有时成立，但把它当作普遍规则并不可信。我们确实常常选择悲剧而非喜剧，同时并不认为后者在形式价值上有欠缺。对此的一个回应是这一提议：悲剧戏剧所引起的痛苦具有一种特殊品格，使得对*那种*痛苦的体验成为实现悲剧特有补偿善的前提条件。换言之，那种善无法由一部没有悲剧致苦维度的作品提供。例如，在一种此类提议中，只有凭借并经由悲剧所激起的受苦，我们才沉思自己对丧失的脆弱性。在另一种提议中，某些审美价值或*体验*价值只能在我们与这类作品的相遇中实现（Budd 1995）[^budd-1995]。例如，我们观看悲剧时所经历的受苦可能具有认知价值：既在熟悉的意义上——它让我们了解他人的苦难，或增强我们的共情能力；也在更有趣的意义上——某些洞见也许只能通过我们的受苦而为我们所得。例如，悲伤可能对我们所见之物以及我们与它的关系，施加一种否则无法获得的显著性格局。
