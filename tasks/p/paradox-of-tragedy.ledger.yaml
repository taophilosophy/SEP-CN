      Furthermore, the statements of the paradox carry an implicit assumption that negative and positive valences exist on a single continuum, such that the more *positively* valenced an experience is, the less *negatively* valenced it must be. But there are empirical reasons to suspect that this relation does not hold, at least in the case of the valence of pleasure. Rather, some work in the psychology of affective experience suggests that the two measures are orthogonal to one another (Norris et al. 2010)[^norris-2010]. If this is so, it would render the co-presence of the two responses less curious. But it would then raise the question of why, if Hume is right, the two independent responses seem to covary (assuming there is no common cause)—“The more they are touched and affected, the more are they delighted with the spectacle” (1757 [1987: 216]).
    step1: |-
      此外，悖论的陈述带有一种隐含假定：负效价与正效价存在于同一条连续统上，以至于一个体验的*正*效价越高，它的*负*效价就必然越低。但有经验理由怀疑这一关系并不成立，至少就快乐的效价而言如此。相反，情感体验心理学的一些工作提示，这两个量度彼此正交（Norris et al. 2010）[^norris-2010]。如果确实如此，两种反应的同时出现就不那么奇怪了。但这样一来又会提出一个问题：如果休谟是对的，这两种独立的反应为何似乎共变（假定没有共同原因）——“他们越是受到触动和影响，就越是对这景象感到愉悦”（1757 [1987: 216]）。
    step2: |-
      此外，悖论的种种表述还暗含一个假定：负效价与正效价处在同一条连续统上，因此一个体验的 **正效价** 越高，其 **负效价** 就必然越低。但经验研究让人怀疑这一关系并不成立，至少就快乐的效价而言是如此。情感体验心理学的一些成果反而提示，这两个量度相互正交（Norris et al. 2010）[^norris-2010]。若果真如此，两种反应同时出现就不那么奇怪了；但接着又要问：如果休谟说对了，这两种彼此独立的反应为什么看起来会共变（假定并无共同原因）——“他们越是受其触动、为其所感，便越是对眼前的景象感到愉悦”（1757 [1987: 216]）。
