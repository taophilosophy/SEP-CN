      相关解释在通过艺术追求负面情绪中设定某些功能，人通常对此并不自知。例如，Mar 与 Oatley（2008）把虚构描述为具有社会模拟的功能。也许确实如此：恐怖虚构在对我们的情绪与身体产生效果时，似乎依赖与真实体验相同的心理架构。而且，令人反感的虚构或许引起或促成了通过模拟从真正的威胁、损失以及其他妨害我们利益之事中学习并应对它们的能力——但这并不解释我们为什么以之为乐或追求它。我们还需要在这里设定另一个解释因素，说明我们（无意识地？）欲求去做那些增强我们能力的事，例如应对使我们受苦之事的能力。这里的“功能”只在演化意义上使用——即：拥有这类体验（从痛苦或恐惧中获得快乐）的心理倾向之所以被获得，部分是因为它有助于产生像我们这样的存在者。另类解释则倾向于诉诸“扩展适应”（exaptation）。诉诸演化只回答了我们的认知与情感构成如何使这类体验成为可能，而没有回答为什么在当下、在今天，我们应当欲求这些体验。
