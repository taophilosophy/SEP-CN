      让我们以一部文学虚构作品为例。原则上，我们可以只谈其内容的方面——作品中在虚构上为真的东西，或它如何把世界再现为如此这般。并且，原则上，我们可以只谈其形式的方面——注意其语调、语言风格、人物名字、情节结构等等。然而，即便对作品内容的最低限度的体验，也会受到作品形式的影响。之所以如此，是因为文学虚构作品的内容部分地由它们*如何*被再现所构成。例如，Peter Lamarque（2007: 121; 2014）指出，狄更斯（Charles Dickens）在《我们共同的朋友》中以“维尼林一家”之名所唤起的浅薄与炫耀特征，本身就是那些人物的内在品质。在此，人们对作品内容（虚构人物）的体验受到作品形式（他们的名字以及描述他们的语调）的影响。当然，特别是悲剧戏剧的文本，在剧作被演出之前就已存在。然而，即便在那里，我们也可以说表演所再现的内容受到其形式的影响，比如比较一位演员的哈姆雷特与另一位的，或比较该剧以传统服装还是当代服装上演。错误在于假定形式与内容指的是我们欣赏对象的两个不同*体验*。但对艺术作品的体验只有一个：对*内容被赋予形式*的体验。
