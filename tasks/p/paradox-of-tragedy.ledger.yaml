      When construed in a descriptive fashion, the puzzle arising from our engagement with tragic works of art assumes that they call for a response that *contrasts* with that which we tend to exhibit in a class of normal cases. However, the wider the range is of relevantly similar experiences such as those surveyed above, the more dubious is the premise that initially gives rise to the puzzle: viz., our finding value in some experiences in virtue of the negative feelings they evoke is so *unlike* our other sorts of attitudes and behavior that it requires some distinctive explanation. However, if it is true that we have that response in many contexts outside of our engagement with tragedy, then its paradoxical air is difficult to sustain. We might still want to know what gives us pleasure in tragedy but there would be no special *paradox* of tragedy calling for a solution (Gilmore 2020: 159–60)[^gilmore-2020]. Indeed, we may contrast those sorts of socially acceptable pursuits in which one takes satisfaction in one’s distress with other sorts that *do* call for a special explanation, such as some practices of deliberate self-harm.
