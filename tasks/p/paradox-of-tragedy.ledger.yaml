      Other goods relate to the cognitive benefits, broadly understood, of the experience of tragic drama. Thus, it has been proposed (most famously in association with the obscure notion of “catharsis”) that tragedies offer spectators an opportunity to clarify their emotions. On interpretations of Aristotle’s notion of catharsis, see Nehamas (1994); on the ambiguity of the concept, see K. Bennett (1981) and Lear (1988). The proper understanding and existence of catharsis is controversial (Shelley 2003)[^shelley-2003]. But a plausible construction of the idea is that we come to learn about some of our emotions when their expression is elicited by highly affecting works of art, in the case of tragedies specifically by the “release” of the negative emotions of fear and pity that comes with the narrative resolution of the plot. There, the expression of our emotions does not leave them unchanged; rather, they are exposed, fine-tuned, and given a salient form when arising in conformity to a work of tragedy’s prescriptions for how to feel. For the view that emotions can be brought into perspicuity through their expression, see Collingwood (1938: 109–11) and Gilmore (2011). Another cognitive benefit is an intrinsically valuable enlightenment about the nature of suffering. Flint Schier (1989) thus discusses how an artistic representation may allow us a more objective understanding of such things as distress and pain, and more broadly, the nature of our and other’s human predicament, than would our witnessing actual distress. For example, in the case of an actual event, our concern for our own safety might obscure our understanding of the depth and character of the suffering of others. Schier argues that we desire such knowledge because it is intrinsically valuable, and thus take pleasure in acquiring it (see also Shelley 2003)[^shelley-2003]. Relatedly, Kames proposes that tragedy helps to enhances our sympathy and (thereby) strengthens our virtues (1751: Essay i, 49–50). Hutcheson, by contrast, notes the satisfaction we take in morally approving the virtuous dispositions of characters in a tragedy in response to the struggles they face (1725: ii, 6.7, 240–241).
    step1: |-
      另一些善与悲剧戏剧体验在广义上的认知益处有关。因此，有人提出（最著名的是与“宣泄”这一含混概念相联系）：悲剧为观众提供了澄清其情绪的机会。关于亚里士多德宣泄概念的解释，见 Nehamas (1994)；关于该概念的含混性，见 K. Bennett (1981) 与 Lear (1988)。宣泄的正确理解及其是否存在仍有争议（Shelley 2003）[^shelley-2003]。但对这一观念的一种可信构造是：当我们的情绪表达被高度动人的艺术作品引发时，我们得以了解自己的某些情绪——就悲剧而言，具体是通过情节的叙事解决所带来的恐惧与怜悯这两种负面情绪的“释放”。在那里，我们情绪的表达并不使情绪保持不变；相反，当情绪依照悲剧作品所规定的感受方式升起时，它们被暴露、被微调，并获得一种显著的形式。关于情绪可通过其表达而变得清晰的观点，见 Collingwood (1938: 109–11) 与 Gilmore (2011)。另一种认知益处，是对苦难本性的一种具有内在价值的启明。Flint Schier（1989）因此讨论了艺术再现如何能让我们对痛苦与疼痛之类事物、以及更广泛地对我们与他人的人类处境之本性，获得比目睹实际痛苦更客观的理解。例如，在实际事件的情形中，我们对自身安全的关切可能遮蔽我们对他人苦难之深度与性质的理解。Schier 主张，我们欲求这类知识，因为它具有内在价值，因而在获得它时感到快乐（另见 Shelley 2003）[^shelley-2003]。与此相关，Kames 提出悲剧有助于增强我们的同情，并（由此）强化我们的德性（1751: 随笔 i, 49–50）。相比之下，Hutcheson 指出，我们因在道德上赞许悲剧人物面对挣扎时所表现出的有德倾向而感到满足（1725: ii, 6.7, 240–241）。
