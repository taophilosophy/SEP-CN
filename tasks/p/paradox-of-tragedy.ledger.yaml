      One explanation of the phenomenon Hume describes appeals to a difference between an initial painful or distressing experience of a stimulus and the experience of that stimulus in light of one’s awareness that it poses no threat of injury or harm to one’s well-being. In this connection, Paul Rozin coined the term “benign masochism” to refer to the enjoyment of “initially negative experiences that the body (brain) falsely interprets as threatening”. This realization that the pain poses no real danger, Rozin and his colleagues write, “leads to pleasure derived from ‘mind over body.’” (2013: 439).[^note-1] Even assuming that the psychological description is correct, the phenomenon described may not exemplify a “conversion” of an emotion, but rather a replacement of one emotion with another, the latter constituted by a different cognitive base, e.g., from a belief or perception to an imagining. On cognitive bases of emotions, see Deonna and Teroni (2008 [2012]) and Gilmore (2020: 45). Of course, distinguishing here between conversion and replacement may be construed as only a verbal dispute.
    step1: |-
      对休谟所描述现象的一种解释，诉诸刺激的最初痛苦或致苦体验，与在意识到它不构成伤害或损害福祉的威胁之后对该刺激的体验之间的差异。在这方面，Paul Rozin 创造了“良性受虐”一词，指对“身体（大脑）错误地将其解释为威胁的最初负面体验”的享受。Rozin 及其同事写道，这种“痛苦并不构成真正危险”的认识，“引向源自‘心胜于身’的快乐”（2013: 439）。[^note-1] 即便假定心理学描述是正确的，所描述的现象也许并不体现情绪的“转化”，而是一种情绪被另一种情绪替换，后者由不同的认知基础构成，例如从信念或知觉转为想象。关于情绪的认知基础，见 Deonna and Teroni (2008 [2012]) 与 Gilmore (2020: 45)。当然，此处对转化与替换的区分，也许可以被视为只是字面之争。
    step2: |-
      解释休谟所述现象的一种思路，是诉诸这样一层差别：刺激最初带来的痛苦、致苦体验，与在意识到它不会伤害自己、不威胁自身福祉之后对该刺激的体验。Paul Rozin 为此造了“良性受虐”（benign masochism）一词，指享受“身体（大脑）误判为威胁的最初负面体验”。Rozin 及其同事写道，一旦认识到这痛苦并无真正危险，便“引出了源于‘心胜于身’的快乐”（2013: 439）。[^note-1] 就算这套心理学描述没错，所述现象也未必是情绪的“转化”，而更像是用一种情绪替换另一种：后者建立在不同的认知基础上，比如从信念或知觉换成想象。关于情绪的认知基础，见 Deonna and Teroni（2008 [2012]）与 Gilmore（2020: 45）。当然，转化与替换之分，也许只是字面之争。
