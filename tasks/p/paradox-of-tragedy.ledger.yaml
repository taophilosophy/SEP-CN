      Finally, the distancing approach attributes a mental state to audiences that is at odds with the mental state briefly referred to in Section 2.2 that at least *prima facie* appears to be a precondition of a fiction causing intense feelings: imaginative immersion. Sometimes called *absorption* or *fictional transportation*, imaginative immersion describes an engagement with the contents of a fictional representation typified by several dimensions: *inter alia,* selective and sustained attention; a fluency in access to and processing of information supplied by one’s attention; cognitive, affective, and behavioral responses that are experienced as endogenously elicited by the contents of the representation, rather than by the representational vehicle itself; and, a diminished self-consciousness or meta-reflective attention to those responses (Gerrig 1993; Green & Brock 2002; Mazzocco et al. 2010)[^gerrig-1993][^green-2002][^mazzocco-2010].
    step1: |-
      最后，距离进路把一种心理状态归于观众，而这种状态与 2.2 节简要提到的、至少*初显*地像是虚构引起强烈情感之前提条件的心理状态相冲突：想象性沉浸。想象性沉浸有时被称为*专注*或*虚构运送*，它描述一种与虚构再现内容的接触，具有若干典型维度：除其他方面外，有选择性的持续注意；对注意所提供信息的顺畅获取与加工；被体验为由再现内容而非再现载体本身内源性地引起的认知、情感与行为反应；以及对那些反应的自我意识或元反思性注意的减弱（Gerrig 1993; Green & Brock 2002; Mazzocco et al. 2010）[^gerrig-1993][^green-2002][^mazzocco-2010]。
