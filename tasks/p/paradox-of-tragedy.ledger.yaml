      For it is plausibly the case that in order to experientially *imagine* feeling sad over the death of a fictional character, one has to experience the most central, or even constitutive, aspect of sadness—its negative valence. Without that, why say one is (experientially) imagining feeling sad, rather than merely imagining that one occupies the perceptual and other dimensions that accompany feeling sad, without feeling sad? Also, it might be suggested that, aside from the negative evaluations they represent of their targets, what fiction-directed sadness and ordinary sadness have in common such that we treat them as intimately related is that they *feel bad*. In other words, any plausible interpretation of the role of quasi-emotions in our engagements with fictions must allow the possibility that they carry with them similar bodily, affective, and other phenomenological dimensions as their counterpart ordinary emotions. They may, as in one interpretation, lack the dimension of belief, or commitment to a proposition, about their object being real, and lack any motivation or reason for action (as one can’t intervene in a fictional world) but their being identified as quasi-emotions of particular type may depend upon their having a similar phenomenology to the real-world-directed prototypes. So even allowing that it is a quasi-emotion that we experience when we engage with aversive art forms (quasi-disgust, quasi-horror, quasi-sadness) we still need to explain how our pleasure in undergoing such feelings is consistent with our tendency (per *the coordination condition*) not to take pleasure in, and to avoid where possible, experiences with negative valences (Friend 2007)[^friend-2007]. Whether the emotions we have for tragic dramas are real or pretend, they carry feelings of pain and distress; why we choose to engage in an activity that causes those feelings—perhaps even for the realization of those feelings—remains a puzzle.
    step1: |-
      因为可信的是：为了在体验上*想象*为虚构人物之死感到悲伤，人必须体验悲伤最核心、甚至构成性的方面——它的负效价。没有这一点，为什么说一个人在（在体验上）想象感到悲伤，而不是仅仅想象自己占据着伴随感到悲伤的知觉维度与其他维度、却没有感到悲伤？此外，也许可以提出：除了它们对目标所表征的负面评价之外，导向虚构的悲伤与平常的悲伤之所以有共同之处、使我们把它们视为密切相连，是因为它们*感觉糟糕*。换言之，对“准情绪”在与虚构接触中的作用所作的任何可信解释，都必须容许一种可能：准情绪带有与它们对应的平常情绪相似的躯体、情感与其他现象学维度。它们也许——如一种解释所说——缺乏关于其对象为真实的信念维度或命题承诺维度，也缺乏任何行动动机或理由（因为人无法干预虚构世界），但它们被认定为特定类型的准情绪，也许就取决于它们具有与指向真实世界的原型相似的现象学。所以，即便承认我们接触反感艺术形式时所体验的是准情绪（准厌恶、准恐惧、准悲伤），我们仍然需要解释：我们承受这些感受时的快乐，如何与我们不以负效价体验为乐、并尽可能回避它们的倾向（按*协调条件*）相一致（Friend 2007）[^friend-2007]。无论我们对悲剧戏剧所怀的情绪是真实的还是假装的，它们都带有痛苦与苦楚的感受；我们为什么选择从事一种引起这些感受的活动——也许甚至是为了实现这些感受——仍然是个谜。
    step2: |-
      因为说得通的是：要在体验上 **想象** 为虚构人物之死而悲伤，人就得体验到悲伤最核心、甚至构成性的那一面——它的负效价。少了这一点，凭什么说你是在（在体验上）想象感到悲伤，而不是仅仅想象自己占据了伴随悲伤的知觉等维度、却并没有感到悲伤？还可以说：导向虚构的悲伤与平常的悲伤都表征出对目标的负面评价；除此之外，它们还让人觉得密切相连，因为它们 **都难受**。换句话说，任何对“准情绪”在虚构接触中所作的可信解释，都得容许：准情绪带有与对应的平常情绪相似的躯体、情感与其他现象学维度。它们也许如某种解释所说，缺少“对象是真的”这一信念维度或命题承诺，也缺少行动动机或理由（人无法干预虚构世界）；但它们之被认定为某一类型的准情绪，也许正取决于它们与指向真实世界的原型具有相似的现象学。所以，即便承认接触反感艺术时体验的是准情绪（准厌恶、准恐惧、准悲伤），仍要解释一点。承受这些感受时的快乐，怎样与一种倾向相容——按 **协调条件**，我们并不以负效价体验为乐，且尽量回避它们（Friend 2007）[^friend-2007]。对悲剧戏剧所怀的情绪，无论是真是假，都带着痛苦与苦楚；我们为什么偏要去碰一种会带来这些感受的活动——甚至也许就是为了得到这些感受——仍然是个谜。
