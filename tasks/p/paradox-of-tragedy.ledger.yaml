      以描述性方式理解时，我们与悲剧艺术作品接触所产生的谜题假定：它们要求一种与我们在一类正常情形中通常表现出的反应*形成对照*的反应。然而，上述类似体验的范围越广，最初产生谜题的那个前提就越可疑：即“我们因某些体验所唤起的负面感受而在这些体验中发现价值，这与我们其他种类的态度与行为如此*不相像*，以至于需要某种独特的解释”。然而，如果我们确实在与悲剧接触之外的许多语境中有那种反应，那么它的悖论气息就难以维持。我们可能仍想知道悲剧中什么给予我们快乐，但就不会有一种特殊的*悲剧悖论*需要解答（Gilmore 2020: 159–60）[^gilmore-2020]。确实，我们可以把那些人们在自己的痛苦中获得满足、且社会可接受的追求，与另一些*确实*需要特殊解释的追求相对照，比如某些故意自残的做法。
