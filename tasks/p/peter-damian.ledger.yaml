      Damian’s view is blurry when it comes to the validity of the principle of non-contradiction for evil things. He states that a contradictory state of affairs cannot be realized through some evil thing’s being and not being at the same time. However, he supports this statement by pointing out that the being of evil things is apparent and not real: they cannot both “be” and “not be” at the same time because they never have the kind of “being” (*esse*) that good things have (610B–C). This leaves open the possibility that some evil thing could have and not have its quasi-being at the same moment of time (cf. Resnick 1992, 110–111)[^resnick-1992]. It is not clear whether this is an intended feature of Damian’s view or not. In any case, the issue is not relevant for Damian’s discussion about the power of God because God gives being in an unequivocal manner.
    step1: |-
      当涉及不矛盾律对恶物的有效性时，达弥盎的观点是模糊的。他声称，矛盾的事态不可能通过某个恶物在同一时刻既存在又不存在而实现。然而，他支持这一说法的方式是指出：恶物的存在是表面的而非真实的——它们不能同时“存在”又“不存在”，因为它们从来不具有善物所具有的那种“存在”（*esse*）（610B–C）。这就留下了一种可能性：某个恶物可以在同一时刻既具有又不具有其准存在（参见 Resnick 1992, 110–111）[^resnick-1992]。不清楚这是否是达弥盎观点的有意特征。无论如何，这一问题与达弥盎关于上帝能力的讨论无关，因为上帝是以明确无歧义的方式给予存在的。
