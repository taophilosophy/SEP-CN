      Damian does not tell us how the question about the consequence of necessity and impossibility can be resolved. It is possible that he was familiar with the kind of solution that one can find in *Cur deus homo* II.17 (see Holopainen 1999, 227–232; Holopainen 2006, 116–119)[^holopainen-1999][^holopainen-2006]. At any rate, Damian takes it for granted that the question can be solved in a manner which does not restrain omnipotence for he rejects the question as irrelevant to a discussion about divine power (604A–B; cf. 609A and 615A–B). In the same context, Damian also makes a comment about applying dialectic to theology: when dialectic and other branches of human knowledge are applied to the investigation of theological matters, they must serve as a maid (*ancilla*) serves her mistress; they must not try to adopt the leading position. Damian also accuses his discussion companions of being incompetent in the field of their art: they do not yet know the rudiments of dialectic, but nevertheless they try to apply it to theological issues (603B–D).
