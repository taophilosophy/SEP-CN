      Another contemporary source with information about the question is the discussion in *Cur deus homo* II.17 by Anselm of Canterbury, some thirty years later. Anselm makes a distinction between two kinds of necessity: there is preceding necessity (*necessitas praecedens*) and there is subsequent necessity (*necessitas sequens*). Preceding necessity is an efficient kind of necessity, and it is the cause of a thing’s being the case. The subsequent necessity does not cause anything, but is caused by a thing’s being the case. The necessity which follows from any true singular statement in any tense is subsequent necessity. Anselm’s discussion implies that the question about the consequence of necessity and impossibility arises from the failure to keep the two kinds of necessity separate (Knuuttila 1993, 74; Knuuttila 2004, 122–124; Marenbon 1996, 12–16; Holopainen 1999; Binini 2017, 251–253; Binini 2022, 41–44)[^binini-2017][^binini-2022][^holopainen-1999][^knuuttila-1993][^knuuttila-2004][^marenbon-1996].
    step1: |-
      另一个包含该问题相关信息的当代文献，是约三十年后坎特伯雷的安瑟伦在《上帝何以成人》II.17 中的讨论。安瑟伦区分了两种必然性：有在先必然性（*necessitas praecedens*），也有在后必然性（*necessitas sequens*）。在先必然性是一种动力性的必然性，是某物如此这般的原因。在后必然性不引起任何东西，而是由某物如此这般所引起的。从任何时态的任何真单称陈述推出的必然性，都是在后必然性。安瑟伦的讨论意味着：关于必然性与不可能性之后承的问题，源于未能把两种必然性分开（Knuuttila 1993, 74；Knuuttila 2004, 122–124；Marenbon 1996, 12–16；Holopainen 1999；Binini 2017, 251–253；Binini 2022, 41–44）[^binini-2017][^binini-2022][^holopainen-1999][^knuuttila-1993][^knuuttila-2004][^marenbon-1996]。
    step2: |-
      另一份涉及此问题的当代文献，是约三十年后坎特伯雷的安瑟伦在《上帝何以成人》II.17 的讨论。安瑟伦区分两种必然性：在先必然性（*necessitas praecedens*）与在后必然性（*necessitas sequens*）。在先必然性是动力性的，是某物如此的原因；在后必然性不引起什么，倒是由某物如此所引起。从任何时态的真单称陈述推出的必然性，都是后一种。安瑟伦的讨论意味着：“必然性与不可能性之后承”这一难题，源于未把两种必然性分开（Knuuttila 1993, 74；Knuuttila 2004, 122–124；Marenbon 1996, 12–16；Holopainen 1999；Binini 2017, 251–253；Binini 2022, 41–44）[^binini-2017][^binini-2022][^holopainen-1999][^knuuttila-1993][^knuuttila-2004][^marenbon-1996]。
