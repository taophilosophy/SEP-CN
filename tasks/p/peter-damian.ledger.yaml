      Damian’s reputation as a thinker who denies the universal validity of the principle of non-contradiction goes back to a series of studies that the German scholar J.A. Endres published early in the twentieth century (Endres 1906, Endres 1910, and some others)[^endres-1906][^endres-1910]. This notion is one of the central pieces in Endres’s more comprehensive thesis about a controversy between “dialecticians” and “anti-dialecticians” in the eleventh century — “dialecticians” being thinkers with a rational tendency while “anti-dialecticians” are suspicious of or hostile towards use of secular arts in discussions related to Christian faith. Peter Damian is Endres’s prime representative of the anti-dialectical attitude. Endres’s interpretation of Damian’s position ultimately depends on a single passage in *De divina omnipotentia*, passage 612A–B (in the Migne edition). To better understand that passage, some preliminary remarks about the content and aim of *De divina omnipotentia* should be made. (However, see also Section 6.)
    step1: |-
      达弥盎作为否认不矛盾律普遍有效性之思想家的名声，可追溯到德国学者 J.A. Endres 在二十世纪初发表的一系列研究（Endres 1906、Endres 1910 等）[^endres-1906][^endres-1910]。这一看法是 Endres 一个更宏大论题的核心部分：该论题主张十一世纪存在一场“辩证法家”与“反辩证法家”之间的争论——“辩证法家”是倾向理性的思想家，而“反辩证法家”则对在与基督教信仰相关的讨论中使用世俗技艺持怀疑或敌视态度。彼得·达弥盎是 Endres 所举的反辩证法态度的首要代表。Endres 对达弥盎立场的解释，最终依赖于《论神圣全能》中的单一穿插段落，即（米涅版中的）612A–B 段。为更好理解该段落，应先就《论神圣全能》的内容与目的作若干预备说明。（不过，也请参见第 6 节。）
    step2: |-
      达弥盎之所以背上“否认不矛盾律普遍有效”的名声，可追溯到德国学者 J.A. Endres 二十世纪初的一组研究（Endres 1906、Endres 1910 等）[^endres-1906][^endres-1910]。这一说法是 Endres 一个更大论题的核心：他主张十一世纪曾有“辩证法家”与“反辩证法家”之争——前者倾心理性，后者则怀疑甚至敌视在与基督教信仰相关的讨论中运用世俗技艺。Endres 把彼得·达弥盎树为反辩证法态度的头号代表。而他对达弥盎立场的解释，最终只系于《论神圣全能》中的一段，即（米涅版）612A–B。为理解这一段，先需对《论神圣全能》的内容与旨趣略作交代。（另见第 6 节。）
