      Passage 612A–B (or 611D–612B) appears to be connected to this issue. The beginning of the passage shows that Damian intends to make a point about the relation (or unrelatedness) of the two questions in *De divina omnipotentia*. (By “impious question” Damian means the question about undoing the done.) From 612B onwards, Damian discusses God’s power to reverse the laws of nature and arrives at the conclusion that God can restore virginity through a miracle within some present moment of time (cf. Section 4). As for Damian’s claim about “this impossibility” (*haec … inpossibilitas*), which applies to nature but not to God, it is not clear whether he refers to the impossibility of bringing about something that violates the principle of non-contradiction or the impossibility of restoring virginity. If he refers to the latter, his point would be to say that God can restore virginity even though it is not possible to undo the done (Holopainen 1996, 36–39)[^holopainen-1996].
    step1: |-
      612A–B 段（或 611D–612B 段）似乎与这一问题相关。该段开头表明，达弥盎意在就《论神圣全能》中两个问题的关系（或无关系）提出一个观点。（达弥盎所说的“不虔敬的问题”，指取消已成之事的问题。）从 612B 开始，达弥盎讨论上帝逆转自然法则的能力，并得出结论：上帝能通过某个当下时刻内的奇迹恢复贞洁（参见第 4 节）。至于达弥盎关于“这种不可能”（*haec … inpossibilitas*）的说法——它适用于自然而不适用于上帝——不清楚他指的是造成违反不矛盾律之事的不可能性，还是恢复贞洁的不可能性。如果指后者，他的要点就是：即使不可能取消已成之事，上帝仍能恢复贞洁（Holopainen 1996, 36–39）[^holopainen-1996]。
