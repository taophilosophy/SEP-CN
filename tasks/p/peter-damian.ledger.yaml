      In some passages, Damian assumes that divine omnipotence can be characterized as God’s ability to bring about anything that he can will. Because God can will anything that is good, and he cannot will anything that is evil, this amounts to the same as the characterization of omnipotence as God’s ability to bring about anything that is good (cf. 596C–597B, 599A, 600A–B). However, the characterization of omnipotence as God’s ability to bring about anything that he can will reveals an important aspect in Damian’s view of divine power, viz. divine freedom. Damian is very emphatic about God’s freedom in his creative activity. In his omnipotence, God can do anything that is good, but he need not do everything that is good — he need not do anything at all (600B, 605C, 607A; for the Augustinian background, see Knuuttila 1993, 66–70)[^knuuttila-1993].
    step1: |-
      在一些段落中，达弥盎假定：神圣全能可以刻画为上帝使其所能愿者实现的能力。因为上帝能愿一切善事，且不能愿任何恶事，这等同于把全能刻画为上帝使一切善事实现的能力（参见 596C–597B、599A、600A–B）。然而，把全能刻画为上帝使其所能愿者实现的能力，揭示了达弥盎神圣能力观中的一个重要方面，即神圣自由。达弥盎非常强调上帝在其创造活动中的自由。在其全能的范围内，上帝能做任何善事，但他不必做一切善事——他根本不必做任何事（600B、605C、607A；奥古斯丁背景见 Knuuttila 1993, 66–70）[^knuuttila-1993]。
    step2: |-
      有些段落中，达弥盎假定：神圣全能可刻画为上帝成就其所愿之善的能力。上帝能愿一切善，不能愿任何恶，因此这等于说，全能就是上帝成就任何善事的能力（参见 596C–597B、599A、600A–B）。但这一刻画揭示了达弥盎神圣能力观的重要一面——神圣自由。达弥盎极强调上帝在创造活动中的自由：凭其全能，上帝能做任何善事，却不必做尽一切善事——甚至可以什么都不做（600B、605C、607A；奥古斯丁背景见 Knuuttila 1993, 66–70）[^knuuttila-1993]。
