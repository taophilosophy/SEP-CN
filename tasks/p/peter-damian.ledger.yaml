      What should one think of the necessity and impossibility which follow from any true singular statement? Does it follow that everything happens of necessity (so that not even God can do anything about it)? There was a disputed question in the dialectic of Damian’s time which dealt with these kinds of queries. The root of the question is Aristotle’s discussion of singular future statements in *De interpretatione* 9 which the eleventh-century dialecticians read in Boethius’s Latin translation. They also knew what Boethius said about the theme in his two commentaries to *De interpretatione* and in *Philosophiae consolatio*. These works provide the background for the question that Damian refers to, but the formulation which Damian knows appears to be of early medieval invention (see Holopainen 1999, 230–232; Holopainen 2006)[^holopainen-1999][^holopainen-2006]. Damian himself says that the question is an old question from the liberal arts which has newly been taken up again. However, the contemporary discussion is different from the ancient one in that the ancients discussed the question purely as a question of dialectic, whereas the contemporary writers have turned it into a quasi-theological question that has bearing on divine power (604A).
    step1: |-
      应当如何看待从任何真的单称陈述推出的必然性与不可能性？是否由此推出：一切都必然发生（以致连上帝也无法改变）？达弥盎时代的辩证法中有一个争论未决的问题，处理的正是这类追问。该问题的根源是亚里士多德《解释篇》第 9 章关于单称未来陈述的讨论；十一世纪的辩证法家读的是波爱修斯的拉丁译本。他们也了解波爱修斯在其两部《解释篇》注疏以及《哲学的慰藉》中对这一主题的说法。这些著作为达弥盎所提到的问题提供了背景，但达弥盎所知道的那个表述似乎是中世纪早期的发明（见 Holopainen 1999, 230–232；Holopainen 2006）[^holopainen-1999][^holopainen-2006]。达弥盎本人说，这是一个来自自由技艺的旧问题，新近又被重新提起。然而，当代的讨论与古代的讨论不同：古人纯粹把它当作辩证法问题来讨论，而当代作者把它变成了一个与神圣能力相关的准神学问题（604A）。
    step2: |-
      由任何真的单称陈述推出的必然性与不可能性，究竟该怎么看？是否就意味着一切都必然发生，连上帝也无可奈何？达弥盎时代的辩证法中，正有一个争论未决的问题处理这类追问。其根源是亚里士多德《解释篇》第 9 章关于单称未来陈述的讨论——十一世纪辩证法家读的是波爱修斯的拉丁译本，也熟悉波爱修斯两部《解释篇》注疏和《哲学的慰藉》中的相关说法。这些著作为达弥盎所提问题提供了背景，但他所知的那个表述似乎是中世纪早期的新造（见 Holopainen 1999, 230–232；Holopainen 2006）[^holopainen-1999][^holopainen-2006]。达弥盎自己说，这是自由技艺中的老问题、新近又被拾起。不过古今有别：古人纯以辩证法问题视之，今人却把它变成一个关涉神圣能力的准神学问题（604A）。
