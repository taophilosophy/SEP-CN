      Towards the end of this passage, Damian appears to be saying that God can restore virginity and undo what has been done even if it requires that the principle of non-contradiction is violated. At least this is how Endres interpreted the passage. According to Endres, Damian counts the principle of non-contradiction among the laws of nature; as such, it belongs to the sphere of the contingent and cannot restrict the agency of God Almighty. Because of this passage, the critique of dialectic and other secular arts that Damian presents elsewhere (see, e.g., 603C–604A, 610D–611D) acquires a new significance. Damian was not satisfied with simply criticizing the misplaced and mistaken use of dialectic in theology; he aimed at denying the possibility of science existing independent of theology (Endres 1906, 30–31; 1910, 23–30)[^endres-1906].
    step1: |-
      在这段的末尾，达弥盎似乎是在说：即使恢复贞洁与取消已做之事需要违反不矛盾律，上帝也能做到。至少 Endres 是这样解读这段话的。按 Endres 的看法，达弥盎把不矛盾律算作自然法则之一；因此它属于偶然性的领域，不能限制全能上帝的行动。由于这一段，达弥盎在其他地方对辩证法及其他世俗技艺的批评（见 603C–604A、610D–611D 等）获得了新的意义。达弥盎并不满足于批评辩证法在神学中的误用与错置；他意在否认科学独立于神学存在的可能性（Endres 1906, 30–31；1910, 23–30）[^endres-1906]。
