      In his additional approach, Damian purposefully put forward ideas that he knew were problematic. For if it is true that God cannot undo what has been done, there must be something wrong in any argument that seems to prove that he can. To save the faithful among the readers from too much bewilderment, Damian suggests that the additional consideration that he presents is principally of a grammatical nature. Namely, he points out that when we speak about God’s ability to bring it about that what has been done, has not been done, the expression “He can (*potest*) do it” is appropriate for speaking of the eternal God; from our temporal point of view, “He could have (*potuit*) done it” is the appropriate way of expressing it (619A–C). If we follow this lead, the statement that God can undo what has been done collapses into the statement that God could have chosen to make the past different from what it actually was (Remnant 1978; Moonan 1980; Holopainen 1996, 42)[^holopainen-1996][^moonan-1980][^remnant-1978]. Of course, this is not changing the past properly speaking. What Damian assumes here is that God could have chosen a different providential plan, not that God could make changes in the providential plan that he has actually chosen.
    step1: |-
      在其补充进路中，达弥盎有意提出一些他知道有问题的想法。因为如果上帝确实不能取消已成之事，那么任何似乎证明他能取消的论证就必定有毛病。为使读者中的信众免于过度困惑，达弥盎暗示：他所提出的补充性考虑主要是语法性质的。也就是说，他指出：当我们谈论上帝使已做之事成为未曾做过的能力时，“他能（*potest*）做到”这一表达适用于谈论永恒的上帝；而从我们时间性的观点看，“他本可以（*potuit*）做到”才是恰当的表达方式（619A–C）。若循此线索，则“上帝能取消已成之事”这一陈述就化为“上帝本可以选择使过去不同于其实际所是”（Remnant 1978；Moonan 1980；Holopainen 1996, 42）[^holopainen-1996][^moonan-1980][^remnant-1978]。当然，严格说来这并不是改变过去。达弥盎在此假定的是：上帝本可以选择一个不同的神意计划，而不是上帝能对他实际选定的神意计划作出改变。
    step2: |-
      补充进路中，达弥盎有意提出一些他明知有问题的想法。因为若上帝确实不能取消已成之事，那么任何看似证明他能取消的论证必有破绽。为使信众读者免于过分困惑，达弥盎暗示：他所提的补充性考虑主要是语法上的。也就是说，谈上帝使已做之事成为未曾做过的能力时，“他能（*potest*）做到”适用于谈论永恒的上帝；而从我们时间性的观点看，恰当的说法是“他本可以（*potuit*）做到”（619A–C）。循此线索，“上帝能取消已成之事”便化为“上帝本可选择让过去不同于其实际所是”（Remnant 1978；Moonan 1980；Holopainen 1996, 42）[^holopainen-1996][^moonan-1980][^remnant-1978]。当然，严格说这并不是改变过去。达弥盎在此假定的是：上帝本可选择另一套神意计划，而不是说他能更改自己实际选定的那套计划。
