      伯多禄·达弥盎（Petrus Damianus 或 Petrus Damiani）约生于 1007 年，出生地是意大利的拉文纳。他因其兄达米安努斯（Damianus）而得名为达米安努斯或达弥盎——这位兄长在他年少时照料过他。彼得在拉文纳、法恩扎与帕尔马学习自由技艺与法律，并以修辞学教师之名获得声誉。约 1035 年，达弥盎经历了一次宗教皈依，进入古比奥附近的方特阿韦拉纳修道院。由于其热忱的虔敬与学识，达弥盎很快在本院与其他修道院受托承担行政与教学任务。1043 年，他成为方特阿韦拉纳的院长，并带领修道院走向新的繁荣。达弥盎成长为他那个时代教会中最有影响的人物之一；他通过著作与私人交往，力图推动修道改革与教会改革。1057 年，达弥盎违背自己的意愿被任命为奥斯提亚枢机主教；几年后，他至少被免去了与该职位相关的部分职责。由于达弥盎的修辞才能与对教会法的知识，教皇多次派他担任使节。1072 年 2 月 22 日或 23 日，达弥盎在从一次此类使命返回途中于法恩扎去世。
