      ## 1. Philosophical Issues Raised by Prophecy
    step1: |-
      ## 1 预言引发的哲学问题
    step2: |-
      ## 1 预言引发的哲学问题
  - id: 3
    kind: body
    source: |-
      It is often assumed that the primary purpose of prophecy is to foretell the future, but this is not always the case. In the great monotheistic religious traditions (Judaism, Christianity, and Islam), for instance, a prophet is taken to be a person who makes God’s will particularly clear, whether or not this involves making predictions about the future. As William Hasker says, in these traditions, prophets are usually involved in “witnessing to the people concerning God’s purposes and requirements and seeking to recall them to obedience” (Hasker 1989, 194)[^hasker-1989]. There are fascinating debates in these religious traditions, especially in the medieval period, debates that we will not discuss here (see Kreisel 2001, Shatz 1998, Rahman 2011, Lorch 2016, López-Farjeat 2014, and the entries in this encyclopedia concerning the key figures discussed in those sources)[^lópez-farjeat-2014][^lorch-2016][^rahman-2011]. Related questions about how a human person might come to know God’s will through some kind of revelation are also discussed elsewhere in this encyclopedia, for example in the entries on the epistemology of religion and philosophy and Christian theology.
    step1: |-
      人们常假定预言的主要目的是预知未来，但情况并不总是如此。例如，在伟大的诸一神教传统（犹太教、基督教与伊斯兰教）中，先知被认为是这样一种人：他使上帝的旨意变得格外清楚，无论这是否涉及对未来的预测。正如 William Hasker 所说，在这些传统中，先知通常参与的是“向民众见证上帝的旨意与要求，并力图把他们唤回顺从”（Hasker 1989, 194）[^hasker-1989]。这些宗教传统中有许多引人入胜的争论，尤其是在中世纪，我们在此不讨论这些争论（见 Kreisel 2001、Shatz 1998、Rahman 2011、Lorch 2016、López-Farjeat 2014，以及本百科全书中讨论这些文献所论关键人物的诸词条）[^lópez-farjeat-2014][^lorch-2016][^rahman-2011]。关于人如何可能通过某种启示而认识上帝旨意的相关问题，本百科全书他处亦有讨论，例如“宗教认识论”以及“哲学与基督教神学”词条。
    step2: |-
      人们常以为预言的主要目的是预知未来，其实未必。以三大一神教传统（犹太教、基督教、伊斯兰教）为例，先知被视为使上帝旨意格外清楚的人，至于是否涉及预测未来，倒在其次。用 William Hasker 的话说，在这些传统里，先知通常做的是“向民众见证上帝的旨意与要求，设法把他们唤回顺从”（Hasker 1989, 194）[^hasker-1989]。这些传统（尤其在中世纪）有不少引人入胜的争论，本文不拟涉及（见 Kreisel 2001、Shatz 1998、Rahman 2011、Lorch 2016、López-Farjeat 2014，以及本百科全书中讨论这些文献所涉关键人物的词条）[^lópez-farjeat-2014][^lorch-2016][^rahman-2011]。至于人如何可能借某种启示认识上帝旨意，本百科全书别处亦有讨论，如“宗教认识论”与“哲学与基督教神学”词条。
  - id: 4
    kind: body
    source: |-
      When philosophers discuss prophecy, they are typically interested in prophecies concerning the contingent future, so that will be the focus in the remainder of this article. What special philosophical issues are raised by this kind of prophecy?
    step1: |-
      当哲学家讨论预言时，他们通常关注关于偶然未来的预言，因此这将是本文余下部分的焦点。这类预言引发了哪些特殊的哲学问题？
    step2: |-
      哲学家讨论预言，通常关注关于偶然未来的预言；本文余下部分也以此为重点。这类预言究竟引出哪些特殊的哲学问题？
  - id: 5
    kind: body
    source: |-
      Let’s say that a future event is contingent if and only if it is not determined that it will happen and also not determined that it will not happen. (For more on the notion of determinism, see the entry on causal determinism.) Now suppose that based upon the revelation of an infallible God, a person prophecies that some future contingent event will occur. Since God cannot be wrong, does it follow that the future contingent event must occur? And if it must occur, how can it be a contingent event?
    step1: |-
      我们不妨说：一个未来事件是偶然的，当且仅当既未确定它会发生，也未确定它不会发生。（关于决定论概念的更多讨论，见“因果决定论”词条。）现在假设，某人基于一位不会出错的上帝的启示，预言某个未来偶然事件将会发生。既然上帝不可能出错，是否就可推出该未来偶然事件必然发生？而如果它必然发生，它又怎么可能是偶然事件？
    step2: |-
      不妨说：一个未来事件是偶然的，当且仅当既未确定它会发生，也未确定它不会发生。（关于决定论，见“因果决定论”词条。）现假设某人依据一位不会出错的上帝的启示，预言某个未来偶然事件将会发生。上帝既不可能出错，是否就该推出该事件必然发生？若它必然发生，又怎能还算偶然事件？
  - id: 6
    kind: body
    source: |-
      An especially vivid example of this kind of situation comes from the Christian tradition. Jesus reportedly prophesied that his disciple Peter would deny him three times before the cock crowed (see Matthew 26:34). Typically, we would think of Peter’s denial as a free act, and hence it is a future contingent event at the time of Jesus’s prophecy. (For more on this connection, see the entries on compatibilism, free will, and causal determinism.) But since Jesus cannot be mistaken (according to Christian theology), how are Peter’s later denials free? Once Jesus’ words become part of the unalterable past, don’t they guarantee a particular future, whether or not Peter is willing to cooperate?
    step1: |-
      这类情形有一个格外生动的例子，来自基督教传统。据说耶稣曾预言，他的门徒彼得会在鸡叫之前三次不认他（见《马太福音》26:34）。通常，我们会把彼得的否认看作自由行为，因此在耶稣预言之时，它是一个未来偶然事件。（关于这一联系的更多讨论，见“相容论”“自由意志”与“因果决定论”词条。）但既然耶稣不可能出错（按基督教神学），彼得后来的否认怎么可能是自由的？一旦耶稣的话成为不可更改的过去的一部分，它们不就保证了某个特定的未来吗——无论彼得是否愿意配合？
    step2: |-
      基督教传统里有一个格外生动的例子。据说耶稣预言：门徒彼得会在鸡叫之前三次不认他（见《马太福音》26:34）。我们通常把彼得的否认看作自由行为，所以在耶稣预言之时，它属于未来偶然事件。（详见“相容论”“自由意志”“因果决定论”词条。）可按基督教神学，耶稣不可能出错——那么彼得后来的否认怎么还谈得上自由？耶稣的话一旦成为不可更改的过去，岂不就锁定了某个特定的未来，无论彼得愿不愿意配合？
  - id: 7
    kind: body
    source: |-
      This problem is an especially interesting instance of the more general problem of the compatibility of God’s complete foreknowledge with the existence of future contingent events (for more on this general problem, see the entry on divine foreknowledge and human freedom). Whereas the more general question about God’s foreknowledge typically involves just God’s knowledge and the future contingent event, the problem of prophecy involves a third element, namely, the prophecy itself, which becomes a part of the past history of the world as soon as it is made. This additional element adds an interesting twist to the general problem, making it more difficult to solve.
    step1: |-
      这个问题是更一般问题的一个格外有趣的实例：上帝的完整预知与未来偶然事件的存在是否相容（关于这一更一般的问题，见“预知与自由意志”词条）。关于上帝预知的更一般问题通常只涉及上帝的知识与未来偶然事件，而预言问题还涉及第三个要素，即预言本身——它一经作出，就成为世界过去历史的一部分。这一额外要素给一般问题增添了有趣的转折，使其更难解决。
    step2: |-
      这是更一般问题的一个格外有趣的实例：上帝的完整预知与未来偶然事件能否相容（详见“预知与自由意志”词条）。一般问题通常只涉及上帝的知识与未来偶然事件；预言问题却多出第三个要素——预言本身。预言一经作出，便成为世界过去历史的一部分。这一额外要素给一般问题添了一层转折，也更难化解。
  - id: 8
    kind: body
