      William Ockham (c.1285–1347), a highly influential Christian philosopher and theologian from the medieval period, suggested an interesting way of accounting for God’s knowledge of the contingent future and resolving the problem of prophecy. (For more detailed presentations of Ockham’s views, see the introduction to Ockham 1983 by Adams and the introduction to Molina 1988 by Freddoso.)[^molina-1988][^ockham-1983] Ockham claims that what a prophet has truly revealed about the contingent future “could have been and can be false” (Ockham *Predestination*, 44), even though the existence of the prophecy in the past is “ever afterwards necessary” (Ockham *Predestination*, 44). As Calvin Normore puts it, “After God has revealed a future contingency it is necessary that the physical or mental things he used to reveal it have existed, but what is revealed is not necessary” (Normore 1982, 373)[^normore-1982]. In terms of our example involving Jesus’ prophecy concerning Peter’s denial, Ockham’s idea is that were Peter to choose freely not to deny Jesus instead, then Jesus would never have prophesied that Peter would deny him. (Some philosophers like to call this kind of proposition a “back-tracking counterfactual”, because it is a subjunctive conditional statement whose consequent refers to an earlier time than its antecedent.) In other words, if a person were about to choose freely to do something, then God would have known about it from eternity, and hence would have acted accordingly.
    step1: |-
      中世纪极具影响力的基督教哲学家与神学家奥卡姆的威廉（William Ockham，约 1285–1347）提出了一种有趣的方式，来说明上帝对偶然未来的知识并化解预言问题。（关于奥卡姆观点更详细的阐述，见 Adams 为 Ockham 1983 所写的导言与 Freddoso 为 Molina 1988 所写的导言。）[^molina-1988][^ockham-1983] 奥卡姆主张，先知就偶然未来所真实启示的内容“本可以是、也可以是假的”（Ockham *Predestination*, 44），尽管预言在过去的存在“此后永远是必然的”（Ockham *Predestination*, 44）。正如 Calvin Normore 所说：“在上帝启示了一个未来偶然事件之后，他用来启示它的那些物理或心理事物必然已经存在，但被启示的内容并非必然”（Normore 1982, 373）[^normore-1982]。就耶稣关于彼得不认主的预言这一例子而言，奥卡姆的想法是：假如彼得自由地选择不否认耶稣，那么耶稣就绝不会预言彼得会不认他。（一些哲学家喜欢把这类命题称为“回溯式反事实条件句”，因为它是一个虚拟条件陈述，其后件所指的时间早于前件。）换言之，如果一个人将要自由地选择做某事，那么上帝就会从永恒中知道这件事，并相应地行动。
