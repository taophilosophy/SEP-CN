      A very different approach to explaining God’s knowledge of the contingent future involves suggesting that God exists outside of time altogether. This would mean that God does not foreknow the future, strictly speaking, since foreknowledge is knowledge of an event that is possessed at a moment in time that occurs earlier than the moment in time at which the foreknown event occurs. Instead, the idea is that God knows all events from the perspective of timeless eternity. (For further elaboration and defense of this view, see Stump and Kretzmann 1987, Helm 1988, and Leftow 1991.)[^helm-1988][^leftow-1991][^stump-1987] Many theists have adopted this view throughout the centuries, including the highly influential medieval theologian St. Thomas Aquinas (1225–1274). One of the earliest Christian theologians to defend this approach was Boethius (480–524 C.E.), who wrote in *The Consolation of Philosophy* that “[Since] God has a condition of ever-present eternity, His knowledge, which passes over every change of time, embracing infinite lengths of past and future, views in its own direct comprehension everything as though it were taking place in the present” (Boethius *Consolation*, 117).
    step1: |-
      另一种极不相同的进路，用来解释上帝对偶然未来的知识，是主张上帝完全存在于时间之外。这将意味着，严格说来上帝并不预知未来，因为预知是在一个时间点上拥有的、关于某个事件的知识，而该时间点早于被预知事件发生的时间点。相反，这种观点是：上帝从超时间永恒的视角知道一切事件。（关于这一观点的进一步阐发与辩护，见 Stump 与 Kretzmann 1987、Helm 1988、Leftow 1991。）[^helm-1988][^leftow-1991][^stump-1987] 许多有神论者在几个世纪中采纳了这一观点，包括极具影响的中世纪神学家圣托马斯·阿奎那（1225–1274）。最早为这一进路辩护的基督教神学家之一是波爱修斯（Boethius，480–524），他在《哲学的慰藉》中写道：“[既然]上帝拥有永在的永恒之境，他的知识越过时间的一切变化，囊括过去与未来的无限长度，以其自身的直接领会，把一切事物都看作仿佛正在当前发生”（Boethius *Consolation*, 117）。
    step2: |-
      还有一条大不相同的进路：上帝完全存在于时间之外。这样一来，严格说上帝并不“预知”未来——预知是在某个时间点上拥有关于某事件的知识，而该时间点早于事件发生之时。按此说，上帝是从超时间永恒的视角知道一切事件。（关于此说的进一步阐发与辩护，见 Stump 与 Kretzmann 1987、Helm 1988、Leftow 1991。）[^helm-1988][^leftow-1991][^stump-1987] 几个世纪以来，许多有神论者采纳此说，包括极具影响的中世纪神学家圣托马斯·阿奎那（1225–1274）。最早为此辩护的基督教神学家之一是波爱修斯（Boethius，480–524），他在《哲学的慰藉》中写道：“[既然]上帝拥有永在的永恒之境，他的知识越过时间的一切变化，囊括过去与未来的无限绵延，以其直接领会，把万事都看作仿佛正在当前发生”（Boethius *Consolation*, 117）。
