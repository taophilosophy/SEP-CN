      Eleonore Stump and Norman Kretzmann, probably the most prominent advocates of the atemporal eternity view, have defended the atemporal eternity approach to prophecy against Widerker’s objection (see Stump and Kretzmann 1991)[^stump-1991]. They point out that most prophecies are conditional or vague, so that they leave “room” for different ways in which they might be fulfilled (400–401). If a prophecy were to be very specific, then it might actually render the action in question inevitable, they admit, but they also insist that rendering an action inevitable is not the same as making it unfree. This is because they distinguish freedom of action from freedom of will, and argue that “it is possible for an action to be inevitable and yet a free action” (403), as (for instance) when “the agent himself has a powerful desire to do the action, his will is not causally determined by anything external to him or by pathological factors within him, and the inaccessible alternatives to his inevitable action are alternatives the agent has no desire to do or even some desire not to do” (403). Trying to resolve the dispute between Widerker and Stump and Kretzmann would go beyond the scope of this article, though, so instead we will turn to the final remaining solution that has been proposed for the problem of prophecy.
    step1: |-
      Eleonore Stump 与 Norman Kretzmann——大概是超时间永恒观点最突出的倡导者——针对 Widerker 的反驳，为处理预言的超时间永恒进路作了辩护（见 Stump 与 Kretzmann 1991）[^stump-1991]。他们指出，大多数预言是有条件的或含糊的，因而为它们可能以不同方式应验留下了“余地”（400–401）。他们承认，如果预言非常具体，它实际上可能使所论行动成为不可避免的；但他们也坚持，使一个行动成为不可避免并不等于使它不自由。这是因为他们区分行动的自由与意志的自由，并主张“一个行动可能既不可避免又是自由行动”（403），例如当“行动者本人有强烈的欲望去做该行动，他的意志未被任何外在于他的东西或他内部病理性因素因果决定，而对他不可避免的行动来说那些不可及的其他选项，是行动者没有欲望去做、甚至有某种欲望不去做的选项”（403）时。不过，试图裁断 Widerker 与 Stump、Kretzmann 之间的争论会超出本文范围，因此我们转而讨论为预言问题提出的最后一种尚存的解决方案。
    step2: |-
      Eleonore Stump 与 Norman Kretzmann 大概是超时间永恒说最突出的倡导者，他们针对 Widerker 的反驳为这一进路作了辩护（见 Stump 与 Kretzmann 1991）[^stump-1991]。他们指出，多数预言或是有条件的，或是含糊的，因而为不同的应验方式留了“余地”（400–401）。他们承认，若预言极为具体，确实可能使所论行动成为不可避免；但他们坚持，使行动不可避免并不等于使行动不自由。理由是他们区分行动的自由与意志的自由，并主张“行动可以既不可避免，又是自由行动”（403）。例如当“行动者本人极想做该行动，其意志并非由任何外在之物、也非由自身的病理性因素因果决定，而他那不可避免的行动所对应的不可及选项，又是他无意去做、甚至有些不愿去做的选项”（403）时，便是如此。不过，裁断 Widerker 与 Stump、Kretzmann 的争执会超出本文范围；下面转向预言问题的最后一种方案。
