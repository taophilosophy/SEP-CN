      中世纪极具影响的基督教哲学家兼神学家奥卡姆的威廉（William Ockham，约 1285–1347）为说明上帝对偶然未来的知识、化解预言问题，提出了一条有趣的思路。（奥卡姆观点的详述，见 Adams 为 Ockham 1983 写的导言与 Freddoso 为 Molina 1988 写的导言。）[^molina-1988][^ockham-1983] 奥卡姆主张，先知就偶然未来真实启示的内容“本可以是假的、如今也可以是假的”（Ockham *Predestination*, 44），尽管预言在过去的存在“此后永远是必然的”（Ockham *Predestination*, 44）。Calvin Normore 概括道：“上帝启示了某个未来偶然事件之后，他用来启示它的那些物理或心理事物必然已经存在，但被启示者并非必然”（Normore 1982, 373）[^normore-1982]。回到耶稣预言彼得不认主的例子，奥卡姆的想法是：假如彼得自由地选择不否认耶稣，耶稣就绝不会预言彼得会不认他。（有些哲学家把这类命题称作“回溯式反事实条件句”：它是一个虚拟条件陈述，后件所指的时间早于前件。）换言之，人若将要自由地做某事，上帝就会自永恒知道此事，并相应行动。
