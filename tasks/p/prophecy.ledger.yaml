      Thomas P. Flint argues that Hasker’s attempt to solve the problem of prophecy from within the constraints imposed by open theism is inadequate. Flint argues that if people are truly free in a sense that implies future contingency, then not even God could know very much about the future based upon present trends and tendencies alone. This is because the probability of a particular future contingent event is very low (when it is identified in some detail), so low that God would not have much justification for believing that it would occur specifically (see Flint 1998, 102–5)[^flint-1998]. As an example, Flint points to John 6:64, which seems to imply that Jesus knew that Judas would betray him. How could this be, Flint wonders, when the probability that Judas would betray Jesus was so low? He also points out that Hasker faces a dilemma here that other open theists share, namely, that if they insist that the probabilities of future contingent events are high enough to justify God in making predictions about the future, then God actually doesn’t take much of a risk in creating the world. This is problematic for some open theists, who claim that their view has the virtue that God takes certain risks in creating the world; see Flint 1998, 104–6.)
    step1: |-
      Thomas P. Flint 主张，Hasker 在开放神论所设约束之内解决预言问题的尝试并不充分。Flint 主张，如果人真正自由，而这种自由蕴含未来的偶然性，那么即使是上帝也无法仅凭现存的趋向与倾向而对未来知道得很多。这是因为，某个特定的未来偶然事件的概率非常低（当它被相当详细地确定时），低到上帝没有多少理由相信它会具体发生（见 Flint 1998, 102–5）[^flint-1998]。作为例子，Flint 指出《约翰福音》6:64，它似乎暗示耶稣知道犹大会出卖他。Flint 想知道：犹大出卖耶稣的概率如此之低，这怎么可能？他还指出，Hasker 在此面临其他开放神论者同样面临的两难：如果他们坚持未来偶然事件的概率高到足以使上帝有理由对未来作出预测，那么上帝创造世界实际上就没有冒多大风险。这对某些开放神论者是个问题，因为他们宣称其观点的美德在于：上帝在创造世界时确实冒了一定的风险（见 Flint 1998, 104–6）。
