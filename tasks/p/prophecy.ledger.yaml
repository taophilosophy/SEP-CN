      If this is right, then Ockham’s idea seems to imply that we have the ability to do something now such that if we were to do it, then the past would have been different (because God would known what we would do differently and hence would have acted differently in the past). Some philosophers refer to this kind of ability as “counterfactual power over the past.” Alvin Plantinga has this idea in mind in his defense of Ockham’s account of God’s foreknowledge of the contingent future when he says that “it is possible that there is an action such that it is within your power to perform it and such that if you were to perform it, then God would not have created Abraham” (Plantinga 1986, 257)[^plantinga-1986]. Along the same lines, Edward Wierenga suggests that according to Ockham, Peter has the power to do something such that if he were to do it, then Jesus would not have intended what he said about Peter’s future denials as a prophecy (Wierenga 1991, 440)[^wierenga-1991]. In other words, Jesus uttered words that actually did constitute a prophecy, but those same words would not have been a prophecy had Peter chosen otherwise (Wierenga 1991, 440)[^wierenga-1991].
    step1: |-
      如果这一点成立，那么奥卡姆的想法似乎蕴含：我们有能力现在做某件事，使得假如我们做了它，过去就会有所不同（因为上帝本来会知道我们将做出不同的选择，从而在过去有不同的行动）。一些哲学家把这种能力称为“对过去的反事实能力”。Alvin Plantinga 在为奥卡姆关于上帝对偶然未来的预知的说明作辩护时，心中所想的就是这种能力，他说：“可能存在这样一个行动，它在你能力之内，而且假如你实施了它，上帝就不会创造亚伯拉罕”（Plantinga 1986, 257）[^plantinga-1986]。沿着同样的思路，Edward Wierenga 认为，按奥卡姆的观点，彼得有能力做某件事，使得假如他做了，耶稣就不会把他关于彼得未来否认所说的话当作预言（Wierenga 1991, 440）[^wierenga-1991]。换言之，耶稣说出的话实际上构成了预言，但如果彼得作出别的选择，同样的话就不会是预言（Wierenga 1991, 440）[^wierenga-1991]。
