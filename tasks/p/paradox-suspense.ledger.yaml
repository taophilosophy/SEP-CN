      A further problem with Gerrig’s theory is that it cannot account for a common phenomenon of repeated viewing, namely that with knowledge of the outcome of a story we are able to notice things that we might otherwise find unexceptional. Take Hitchcock’s *Shadow of a Doubt* (1943) as an example. Early in the film, aspects of Uncle Charlie’s behavior that might otherwise go unnoticed seem like obvious evidence of his murderous past on repeated viewings. This common experience requires the same kind of recall abilities that Gerrig thinks are necessarily retarded. If there were, as Gerrig suggests, “a systematic failure of memory processes to produce relevant knowledge as the narrative unfolds” then our ability when informed by knowledge of the narrative outcome to notice new clues upon a reviewing is utterly mysterious (Gerrig 1997, 172)[^gerrig-1997]. Since the moment-by-moment forgetting theory implies that one cannot both feel suspense on a reviewing of *Shadow of a Doubt* and notice new clues during the same scenes, it appears to conflict with the evidence.
    step1: |-
      Gerrig 理论的又一个问题在于，它无法解释反复观看的一个常见现象：凭借对故事结局的知识，我们能够注意到一些否则会觉得平淡无奇的东西。以希区柯克的《辣手摧花》（*Shadow of a Doubt*，1943）为例。影片早期，Uncle Charlie 行为的某些方面本来可能不被注意，但在反复观看时，它们看起来就是他杀人过往的明显证据。这一常见经验所需要的，正是 Gerrig 认为必然受阻碍的那种回忆能力。如果真如 Gerrig 所说，存在“记忆过程在叙事展开时系统性地未能产生相关知识”的情况，那么我们凭借对叙事结局的知识、在重看时注意到新线索的能力就完全无法解释了（Gerrig 1997, 172）[^gerrig-1997]。由于逐刻遗忘论蕴含一个人不可能既在重看《辣手摧花》时感到悬念、又在同一场景中注意到新线索，它似乎与证据相冲突。
