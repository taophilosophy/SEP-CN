    source: |-
      Noël Carroll qualifies the first claim of the paradox; he argues that suspense merely requires *entertained* uncertainty, not *actual* uncertainty (Carroll 2001)[^carroll-2001]. In “The Paradox of Suspense,” Carroll offers a persuasive account of how we might dissolve this paradox. He argues that even if we know that a film will end a certain way, we can still imagine while watching it, that it will not end that way. He argues that merely imagining that an event’s outcome is uncertain is enough to create suspense, thereby qualifying the first premise of the paradox—only entertained uncertainty is necessary for suspense.
    step1: |-
      Noël Carroll 对悖论的第一条主张作了限定；他主张，悬念只需要*设想的*不确定性，而不需要*实际的*不确定性（Carroll 2001）[^carroll-2001]。在《悬念悖论》一文中，Carroll 对如何消解这一悖论给出了有说服力的说明。他主张，即使我们知道一部电影将以某种方式结束，我们在观看时仍能想象它不会那样结束。他认为，仅仅想象一个事件的结局不确定，就足以制造悬念，从而限定了悖论的第一个前提——只有设想的不确定性才是悬念所必需的。
    step2: |-
      Noël Carroll 对悖论的第一条主张加以限定：悬念只需要*设想的*不确定性，而非*实际的*不确定性（Carroll 2001）[^carroll-2001]。在《悬念悖论》一文中，Carroll 为消解这一悖论给出了颇有说服力的说明。他认为，即便我们知道某部电影将如何收场，观看时仍能想象它不会那样收场；仅仅想象事件结局不确定，就足以产生悬念。这样便限定了悖论的第一个前提：唯有设想的不确定性才是悬念所必需的。
  - id: 14
    kind: body
    source: |-
      Narrative, according to Carroll, is something akin to guided imagination, a process he describes as entertaining thoughts or holding propositions non-assertively (Carroll 1990)[^carroll-1990]. People can work themselves into a variety of emotional states by merely imagining situations that they know are untrue, such as being passed over for a promotion, cheated on by one’s spouse, or having one’s child kidnapped. The *thought theory* of emotional response is the theory that fiction taps this power of the imagination for its energy to produce emotional reactions. This seems to solve the paradox of suspense, since we can know that the hero will not die, but still fear the outcome simply by imagining that he might. On this view, suspense does not require genuine uncertainty, only entertained uncertainty. Although we cannot be genuinely uncertain about the outcome of a familiar narrative, we can willfully entertain uncertainty. And we can entertain uncertainty on any number of encounters with the same story.
    step1: |-
      按照 Carroll 的看法，叙事近似于有引导的想象，他把这一过程描述为设想思想或非断言地持有命题（Carroll 1990）[^carroll-1990]。人们仅仅通过想象自己所知为不真的事情，就能使自己进入各种情绪状态，例如被跳过升职、被配偶出轨、孩子遭绑架。情绪反应的*思想理论*主张，虚构正是借取想象力的这种力量来产生情绪反应。这似乎解决了悬念悖论：我们可以知道主人公不会死，却仍然仅仅通过想象他可能死而恐惧结局。按这种观点，悬念不需要真正的不确定性，只需要设想的不确定性。虽然我们无法对熟悉叙事的结局真正感到不确定，但我们可以有意地设想不确定性；而且无论同一故事接触多少次，我们都能设想不确定性。
    step2: |-
      Carroll 认为，叙事近乎有引导的想象；他称这一过程为设想思想，或非断言地持有命题（Carroll 1990）[^carroll-1990]。人只要想象自己明知不实的情景，就能进入各种情绪状态，比如想象自己升职被跳过、配偶出轨、孩子遭绑架。情绪反应的*思想理论*主张，虚构正是借想象力的这种力量来激起情绪反应。这似乎化解了悬念悖论：我们明知主人公不会死，却仍可仅凭想象他可能死而恐惧结局。照此观点，悬念无需真正的不确定性，只需设想的不确定性；我们对熟悉叙事的结局固然无法真正不确定，却可以有意设想不确定，而且同一故事无论接触多少次都能这样做。
