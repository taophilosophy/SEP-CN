      尽管 Carroll 的思想理论似乎解释了为什么对熟悉叙事感到悬念是可能的，它并没有解释悬念逐渐减弱这一典型情形。如果只需设想的不确定性（外加未言明的其他促成因素），为什么有些虚构作品会对许多观众失去效力？一个完全愿意的观众可能会热切地坐下来重看一部悬念片，却感受不到初看时那样的悬念。这种情形——（对同一叙事）收益递减——不仅可能，而且常见。这表明，设想的不确定性不足以解释重看者的悬念——即对熟悉叙事感到的悬念。或许设想的不确定性理论的辩护者可以这样回应：只需为该理论补充一种说明，解释为什么观众对故事越熟悉，就越难或越不可能把叙事结局设想为不确定的。
