      A number of people have tried to conduct statistical studies to determine whether or not petitionary prayer is effective. These studies try to measure the differences between groups of people, one of which is the subject of petitionary prayers, and the other of which is not. Although some earlier studies suggested a positive correlation between patient recovery and petitionary prayer (see Byrd 1998; Harris, *et al*. 1999; and Leibovici 2001)[^leibovici-2001], more recent studies have suggested that the offering of petitionary prayer (and the knowledge that such prayers were offered) is not positively correlated with patient recovery (see Benson *et al*. 2006)[^benson-2006].
    step1: |-
      不少人尝试进行统计研究，以确定祈求式祷告是否有效。这些研究试图测量不同人群之间的差异：一组是祈求式祷告的对象，另一组则不是。尽管一些较早的研究提示病人康复与祈求式祷告之间存在正相关（见 Byrd 1998；Harris 等 1999；Leibovici 2001）[^leibovici-2001]，较新的研究则提示，献上祈求式祷告（以及知道曾有这样的祷告）与病人康复并不正相关（见 Benson 等 2006）[^benson-2006]。
    step2: |-
      不少人试图用统计研究判定祈求式祷告是否有效。这类研究比较两组人：一组是祷告的对象，一组不是。较早的一些研究报告病人康复与祈求式祷告呈正相关（见 Byrd 1998；Harris 等 1999；Leibovici 2001）[^leibovici-2001]；较新的研究则显示，献上祈求式祷告（以及知道有人如此祷告）与病人康复并无正相关（见 Benson 等 2006）[^benson-2006]。
  - id: 32
    kind: body
    source: |-
      Some have suggested, though, that these kinds of studies are flawed from the outset (see Brümmer 2008 and Davison 2017, chapter 5)[^brümmer-2008][^davison-2017]. It would be difficult to to ensure that some group of people is the subject of no petitionary prayers, for instance, since it is impossible to prevent people from praying for those whom they know. Also, God is typically assumed to be a free person, not a natural force that acts automatically in all similar cases, so we cannot assume that God will simply ignore those people for whom petitionary prayers have not been offered. This means that even if a study showed some statistically significant difference between the two groups of people, we could not be sure that it was due to the offering of petitionary prayers alone, as opposed to some other factor or factors.
    step1: |-
      不过，有人指出这类研究从一开始就有缺陷（见 Brümmer 2008 与 Davison 2017 第 5 章）[^brümmer-2008][^davison-2017]。例如，很难确保某一群人完全不是任何祈求式祷告的对象，因为无法阻止人们为自己认识的人祷告。此外，通常假定上帝是一位自由的人格，而不是在所有类似情形中都自动行动的自然力，因此我们不能假定上帝会干脆无视那些无人为其献上祈求式祷告的人。这意味着，即使研究显示两组人之间存在某种统计上显著的差异，我们也无法确定这一差异仅仅源于祈求式祷告的献上，而不是源于某个或某些其他因素。
    step2: |-
      不过也有人指出，这类研究从一开始就有缺陷（见 Brümmer 2008、Davison 2017 第 5 章）[^brümmer-2008][^davison-2017]。比如，很难保证某一群人完全不是任何祷告的对象——谁也无法阻止人们为自己认识的人祷告。再者，上帝通常被设想为一位自由的人格，而非在所有类似情形中都自动行动的自然力，所以我们不能假定他会干脆无视那些无人代求的人。这意味着，即便研究显示两组人之间有统计上显著的差异，也无法确定这一差异仅仅来自祈求式祷告，而不是另有其他因素。
