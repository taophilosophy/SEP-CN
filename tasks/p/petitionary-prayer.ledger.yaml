      It is also worth noting, in this section, that some philosophers have argued that not only does it make sense to pray for the future if God exists, but also it makes sense to pray for the past as well—such prayers could be effective, depending on the extent of God’s knowledge. For example, given the way we have described effective petitionary prayer, it could be possible for a prayer for something to have happened yesterday to be effective, as long as the thing in question actually did happen yesterday. This is because God could know that I would offer the prayer in the future, and could have taken this into account yesterday, as long as God can know the future. So defenders of middle knowledge and timeless eternity can say that prayers for the past might be effective (but open theists, it seems, cannot say this: for more on this question, see Timpe 2005 and Mawson 2007)[^mawson-2007][^timpe-2005].
    step1: |-
      本节还值得注意的是，一些哲学家主张：如果上帝存在，那么不仅为未来祷告说得通，为过去祷告也说得通——这类祷告可以是有效的，取决于上帝知识的范围。例如，按照我们对有效祈求式祷告的刻画，只要所论之事昨天确实发生了，那么一条“求某事昨天已经发生”的祷告就有可能是有效的。这是因为，只要上帝能知道未来，上帝就能知道我将来会献上这条祷告，并且昨天就可以把它考虑在内。因此，中知识论与超时间永恒论的拥护者可以说，为过去祷告可能是有效的（但开放神论者似乎不能这样说：关于这一问题的更多讨论，见 Timpe 2005 与 Mawson 2007）[^mawson-2007][^timpe-2005]。
