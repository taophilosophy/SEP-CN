    source: |-
      ## 1. The Concept of Answered Prayer
    step1: |-
      ## 1 蒙应允的祷告之概念
    step2: |-
      ## 1 蒙应允的祷告之概念
  - id: 4
    kind: body
    source: |-
      What would it mean to say that a petitionary prayer to God had been answered? Petitionary prayers often make many differences to those who offer them, whether positive or negative (see Phillips 1981 and Brümmer 2008)[^brümmer-2008][^phillips-1981], but the more philosophically difficult question is whether or not such prayers make a difference to God. And the question is not whether God simply hears or notices such prayers—after all, we have assumed that God knows everything that happens in the world and is perfectly good. Typically, when philosophers discuss the effectiveness of petitionary prayer, they wonder whether petitionary prayers ever move God to act in some way. Is that possible?
    step1: |-
      说一条向上帝发出的祈求式祷告“蒙应允了”，这意味着什么？祈求式祷告往往给祷告者本人带来诸多改变，无论积极还是消极（见 Phillips 1981 与 Brümmer 2008）[^brümmer-2008][^phillips-1981]；但哲学上更困难的问题是：这类祷告是否对上帝造成差别。问题不在于上帝是否仅仅垂听或注意到这些祷告——毕竟我们已经假定，上帝知道世界上发生的一切，且至善。通常，当哲学家讨论祈求式祷告的有效性时，他们想知道的是：祈求式祷告能否促使上帝以某种方式行动。这可能吗？
    step2: |-
      说一条向上帝发出的祈求式祷告“蒙应允了”，究竟指什么？祈求式祷告常常给祷告者本人带来诸多改变，有好有坏（见 Phillips 1981 与 Brümmer 2008）[^brümmer-2008][^phillips-1981]；但哲学上更棘手的问题是：这类祷告是否对上帝造成了差别。要注意，问题不是上帝有没有垂听或留意这些祷告——毕竟我们已经假定上帝全知世上诸事、且至善。哲学家讨论祷告有效性时，真正想知道的是：祈求式祷告能否促使上帝以某种方式行动。这可能吗？
  - id: 5
    kind: body
    source: |-
      Philosophers usually assume that a prayer is answered if and only if God brings about the thing requested in part because of the offering of the prayer, so that had the prayer not been offered, the thing in question would not have occurred. If you pray to God for rain tomorrow and it does rain tomorrow, this all by itself is not enough to say that your prayer for rain was answered—it must also be the case that God actually brought about the rain at least in part because of your prayer. If it would have rained anyway, without your prayer for rain, then it doesn’t seem that your prayer for rain was answered. So most philosophers would say that an answered prayer would be a prayer that made a difference by influencing God to act; in the remainder of this entry, I will refer to this idea of answered prayer by using the expression “effective.”
    step1: |-
      哲学家通常假定：一条祷告蒙应允，当且仅当上帝部分地因为该祷告的献上而促成所求之事，也就是说，倘若没有献上祷告，所论之事就不会发生。如果你向上帝求明天下雨，而明天确实下了雨，仅凭这一点还不足以说你的求雨祷告蒙了应允——还必须是：上帝促成这场雨至少部分地是因为你的祷告。即使你不求雨，雨也会下，那么你的求雨祷告似乎就没有蒙应允。因此，多数哲学家会说：蒙应允的祷告是通过促使上帝行动而造成了差别的祷告；在本词条余下的部分，我将用“有效”一词来指这种蒙应允的祷告观念。
    step2: |-
      哲学家通常假定：一条祷告蒙应允，当且仅当上帝促成所求之事时，至少部分地是因为这条祷告被献上——倘若不曾祷告，所论之事便不会发生。你向上帝求明天下雨，明天果然下雨，仅此不足以说你的求雨祷告蒙了应允；还必须是上帝促成这场雨时，至少部分地考虑了你的祷告。若不求雨雨照下，你的祷告便算不上蒙应允。所以多数哲学家会说：蒙应允的祷告，就是通过促使上帝行动而造成差别的祷告。本词条余下部分用“有效”一词指称这种蒙应允的观念。
  - id: 6
    kind: body
    source: |-
      Other philosophers reject this difference-making approach to the concept of answered prayer. They argue that whether or not we should count a prayer as answered depends on our interests in the question, so that we should not require that a prayer be effective (as explained above) in order to count it as answered (see Johnson 2020)[^johnson-2020]. According to this approach, if we just want to be associated with God, and don’t care whether our petitionary prayers “tip the scales” in terms of God’s action in the world, we might count our petitionary prayers as answered even if they played no role in God’s reasons for acting in the world. (For more on the question of what should be counted as an answered prayer, see Flint 1998, chapter 10, Davison 2017, chapter 2, Pruss 2013, Kleinschmidt 2018, Johnson 2020, and Davison 2022, chapter 3.)[^davison-2017][^davison-2022][^flint-1998][^johnson-2020][^kleinschmidt-2018][^pruss-2013]
    step1: |-
      另一些哲学家拒斥这种以造成差别来理解蒙应允之概念的进路。他们主张，一条祷告是否应算作蒙应允，取决于我们在这个问题上的关注点，因此不应要求祷告必须有效（如上所述）才算蒙应允（见 Johnson 2020）[^johnson-2020]。按照这一进路，如果我们只是想与上帝相连，而不在乎我们的祈求式祷告是否就上帝在世界中的行动“左右了天平”，那么即使这些祷告在上帝行动于世界的理由中没有起任何作用，我们也可以把它们算作蒙应允。（关于什么应算作蒙应允的祷告的更多讨论，见 Flint 1998，第 10 章；Davison 2017，第 2 章；Pruss 2013；Kleinschmidt 2018；Johnson 2020；以及 Davison 2022，第 3 章。）[^davison-2017][^davison-2022][^flint-1998][^johnson-2020][^kleinschmidt-2018][^pruss-2013]
    step2: |-
      另一些哲学家拒斥这种“造成差别”式的蒙应允概念。他们认为，一条祷告算不算蒙应允，取决于我们对问题的关注点，因此不必要求祷告必须有效（如上所述）才能算数（见 Johnson 2020）[^johnson-2020]。照这种看法，倘若我们只想与上帝相连，并不在意祷告有没有就上帝在世界中的行动“左右天平”，那么即便这些祷告在上帝行事的理由中毫无作用，也可算作蒙应允。（关于什么应算作蒙应允的祷告，详见 Flint 1998 第 10 章、Davison 2017 第 2 章、Pruss 2013、Kleinschmidt 2018、Johnson 2020、Davison 2022 第 3 章。）[^davison-2017][^davison-2022][^flint-1998][^johnson-2020][^kleinschmidt-2018][^pruss-2013]
  - id: 7
    kind: body
    source: |-
      ## 2. Divine Immutability and Impassibility
    step1: |-
      ## 2 神圣的不变性与不动情性
    step2: |-
      ## 2 神圣的不变性与不动情性
  - id: 8
    kind: body
    source: |-
      As mentioned above, traditional theists believe that God is immutable (cannot change) and impassible (cannot be affected by anything external). These ideas are related to one another, but not identical: if God is immutable, then God is impassible. But just because God is impassible, it does not follow that God is immutable—God might be able to change without being affected by any external source. If God is both immutable and impassible, then it seems that no petitionary prayers are effective.
    step1: |-
      如上所述，传统有神论者相信上帝是不变的（不能改变）且不动情的（不能被任何外部事物影响）。这两种观念相互关联，但并不等同：如果上帝是不变的，那么上帝是不动情的。但仅仅因为上帝是不动情的，并不能推出上帝是不变的——上帝也许能够改变而不受任何外部来源的影响。如果上帝既不变又不动情，那么似乎没有任何祈求式祷告是有效的。
    step2: |-
      如上所述，传统有神论者相信上帝不变（不能改变）且不动情（不受任何外物影响）。两个观念相关却并不等同：上帝若不变，则必不动情；但上帝不动情，未必就不变——他也许能够改变，而不受任何外部来源影响。若上帝既不变又不动情，那么似乎任何祈求式祷告都不会有效。
  - id: 9
    kind: body
    source: |-
      A number of responses are open to traditional theists at this point. Some theists have argued that there are independent reasons for saying that God is neither immutable nor impassible. For example, many people have argued that God is both compassionate and forgiving. But to be compassionate or forgiving seems to require being responsive to the actions of others, so perhaps we should not say that God is immutable or impassible after all (see the entry on God and other ultimates).
    step1: |-
      传统有神论者在此有若干回应可选。一些有神论者主张，有独立的理由说明上帝既非不变亦非不动情。例如，许多人主张上帝既有怜悯又有赦免。但有怜悯或有赦免似乎要求对他人的行动有所回应，所以也许我们终究不该说上帝是不变的或不动情的（见“上帝与其他终极存在”词条）。
    step2: |-
      面对这一谜题，传统有神论者有若干回应可走。一些有神论者主张，独立地看，就有理由说上帝既非不变、亦非不动情。例如，许多人主张上帝既有怜悯又肯赦免；而有怜悯、肯赦免，似乎就要求对他人的行动有所回应。这样看来，也许我们终究不该说上帝不变或不动情（见“上帝与其他终极存在”词条）。
  - id: 10
    kind: body
    source: |-
      A different response to the puzzle here would involve characterizing the concepts of divine immutability and impassibility so that they apply to God in a way that does not rule out the effectiveness of petitionary prayers. This is an interesting philosophical project in its own right (see the discussions in Creel 1985 and the entries on God and other ultimates and immutability)[^creel-1985], but its prospects for success fall beyond the scope of this article.
    step1: |-
      对这一谜题的另一种回应，是重新刻画神圣不变性与不动情性的概念，使其以不排除祈求式祷告有效性的方式适用于上帝。这本身就是一个有趣的哲学工程（见 Creel 1985 中的讨论，以及“上帝与其他终极存在”与“不变性”词条）[^creel-1985]，但其能否成功超出了本文的范围。
    step2: |-
      对这一谜题的另一种回应，是重新刻画神圣不变性与不动情性概念，使它们以不排除祈求式祷告有效的方式适用于上帝。这本身就是一项有趣的哲学工程（见 Creel 1985 的讨论，以及“上帝与其他终极存在”“不变性”词条）[^creel-1985]，但其成败超出了本文范围。
  - id: 11
    kind: body
    source: |-
      Finally, a third response would involve claiming that in cases of apparently effective prayer, God is not really responding to the prayer but instead bringing about events as part of a providential plan, a plan that includes both the prayer and the apparent answer to it. Such a position is suggested by the following remark from St. Thomas Aquinas: “We pray not in order to change the divine disposition but for the sake of acquiring by petitionary prayer what God has disposed to be achieved by prayer (quoted and discussed at length in Stump 1979)[^stump-1979].” Given the way that we have characterized effective prayer above, though, this approach seems to deny that petitionary prayers are effective, so it would not solve the problem at hand.
    step1: |-
      最后，第三种回应主张：在看似有效的祷告情形中，上帝其实并非在回应祷告，而是在实现一项神意计划——该计划同时包括祷告本身与祷告表面上的应允。圣托马斯·阿奎那的下述话暗示了这种立场：“我们祷告，不是为了改变神圣的安排，而是为了借祈求式祷告获得上帝已安排要通过祷告来成就的东西（转引与详论见 Stump 1979）[^stump-1979]。”不过，鉴于上文对有效祷告的刻画，这种进路似乎否认祈求式祷告是有效的，因此并不能解决手头的问题。
    step2: |-
      最后，第三种回应主张：那些看似有效的祷告，其实并非上帝在回应祷告，而是上帝按一项神意计划促成诸事件——该计划既包含祷告本身，也包含祷告表面上的应允。圣托马斯·阿奎那的一句话暗示了这种立场：“我们祷告，不是为了改变神圣的安排，而是为了借祈求式祷告，获得上帝已安排要借祷告成就的东西（转引与详论见 Stump 1979）[^stump-1979]。”但按上文对有效祷告的刻画，这一进路似乎等于否认祈求式祷告有效，因而解决不了手头的问题。
  - id: 12
    kind: body
    source: |-
      ## 3. Divine Omniscience
    step1: |-
      ## 3 神圣全知
    step2: |-
      ## 3 神圣全知
  - id: 13
    kind: body
    source: |-
      A different puzzle concerning the effectiveness of petitionary prayer arises in connection with divine omniscience, the idea that God knows everything that can be known. If God already knows the future, for instance, then how can petitionary prayer make a difference? The future, after all, is just the set of things that will happen. If God knows the future in all of its detail, then it seems that there is no room for petitionary prayers to be effective: either the thing requested in prayer is something that God already knows will be done, or it isn’t, and either way, it looks like the prayer can make no difference. Like many other questions in theology, this puzzle raises an interesting question about the limits of God’s knowledge. Is it possible for anyone, including God, to know the future in all of its detail? Philosophers disagree sharply about this. Here we will explore briefly three possible answers to this question. (For more on this, see Borland 2006 (Other Internet Resources) and the entries on omniscience and prophecy.)
    step1: |-
      另一个关于祈求式祷告有效性的谜题与神圣全知有关，即上帝知道一切可知者这一观念。例如，如果上帝已经知道未来，祈求式祷告怎么可能造成差别？未来毕竟就是将要发生的事情的集合。如果上帝在其全部细节上知道未来，那么似乎就没有祈求式祷告有效的余地：祷告所求之事要么是上帝已经知道将会做成的事，要么不是；无论哪种情况，祷告看起来都无法造成差别。与神学中的许多其他问题一样，这一谜题提出了一个关于上帝知识界限的有趣问题：任何人——包括上帝——可能在其全部细节上知道未来吗？哲学家对此分歧极大。这里我们将简要探讨对这一问题的三种可能回答。（更多内容见 Borland 2006（其他网络资源），以及“全知”与“预言”词条。）
    step2: |-
      另一个关乎祷告有效性的谜题来自神圣全知——即“上帝知道一切可知者”这一观念。如果上帝已经知道未来，祈求式祷告还怎么可能造成差别？未来无非是将要发生之事的总和。若上帝在其全部细节上知道未来，祷告似乎就没有发挥作用的余地：祷告所求之事，要么是上帝已知会成就的，要么不是；无论哪种情形，祷告都谈不上造成差别。与神学的许多问题一样，这个谜题牵出一个关于上帝知识界限的有趣问题：任何人（包括上帝）能在全部细节上知道未来吗？哲学家对此分歧极大。本节简要考察三种可能的回答。（详见 Borland 2006（其他网络资源），以及“全知”“预言”词条。）
  - id: 14
    kind: body
    source: |-
      First, according to the view known as “open theism,” God cannot know those parts of the future that are yet to be determined, such as the future free actions of human beings, either because there are no truths to be known yet or because there is no way for anyone, including God, to know them (see Hasker 1989, Davison 1991, Rissler 2006, the entry on process theism, Other Internet Resources)[^davison-1991][^hasker-1989]. This does not mean the God is not omniscient, because God still knows everything that can be known (and that is what it means to be omniscient, according to open theists). So open theists have a way to defuse the puzzle for petitionary prayer involving omniscience concerning the future: if our prayers are free, or God’s decision whether or not to answer them is free (or both), then those things cannot be part of a determined future and God cannot know about them in advance. But open theism is controversial because (among other things: see Rissler 2006) it appears to deny something that theists have affirmed traditionally, namely, that God knows the future in all of its detail.
    step1: |-
      第一，按照所谓“开放神论”，上帝无法知道未来中尚待确定的部分，例如人类未来的自由行动；原因要么是尚无真理可知，要么是任何人（包括上帝）都无从知道它们（见 Hasker 1989、Davison 1991、Rissler 2006、“过程神学”词条，以及其他网络资源）[^davison-1991][^hasker-1989]。这并不意味着上帝不是全知的，因为上帝仍然知道一切可知者（而按开放神论者的理解，全知正是这个意思）。于是，开放神论者有了化解“涉及对未来的全知的祈求式祷告谜题”的办法：如果我们的祷告是自由的，或者上帝应允与否的决定是自由的（或两者皆是），那么这些事情就不能属于已确定的未来，上帝也就无法预先知道它们。但开放神论是有争议的，原因之一是（见 Rissler 2006）：它似乎否认了有神论者传统上肯定的东西，即上帝在其全部细节上知道未来。
    step2: |-
      第一，按所谓“开放神论”（open theism），上帝无法知道未来尚待确定的部分，比如人类未来的自由行动——要么因为尚无真理可知，要么因为包括上帝在内的任何存在者都无从知晓（见 Hasker 1989、Davison 1991、Rissler 2006、“过程神学”词条及其他网络资源）[^davison-1991][^hasker-1989]。这并不等于上帝不全知：上帝仍然知道一切可知者（开放神论者认为，全知本就是这个意思）。于是开放神论者得以化解涉及未来全知的祷告谜题：倘若我们的祷告是自由的，或上帝应允与否的决定是自由的（或两者皆是），这些事便不属于已确定的未来，上帝也就无法预知。但开放神论争议很大，原因之一（见 Rissler 2006）在于：它似乎否认了有神论者传统上坚持的一点——上帝在其全部细节上知道未来。
