      Theists have traditionally recognized a number of limits on God’s actions. For instance, it is common to insist that God’s omnipotence does not imply that God can do impossible things, such as create a stone that would be too heavy for even God to lift. It is also common to insist that God cannot do anything intrinsically evil, if there are such things, because God is morally perfect. (For a discussion of petitionary prayers for bad things, see Smilansky 2012.)[^smilansky-2012] God’s power plus God’s goodness together seem to imply that God is provident in some sense, so one might also suspect that God would not answer petitionary prayers for things that would interfere with God’s providential plans for the world, whatever those are. Within these limits, one might wonder whether there is enough room among the space of God’s reasons for petitionary prayers to make a difference, and what kinds of reasons such prayers could provide for God.
    step1: |-
      传统上，有神论者承认上帝的作为有若干限制。例如，人们常坚持：上帝的全能并不意味着上帝能做不可能的事，例如造出一块连上帝自己也举不起来的石头。人们也常坚持：如果存在本身为恶的事情，上帝不能做这种事，因为上帝道德完善。（关于为坏事祈求的祷告的讨论，见 Smilansky 2012。）[^smilansky-2012] 上帝的能力加上上帝的善，似乎共同蕴含上帝在某种意义上具有神意，因此人们也可能怀疑：上帝不会应允那些会干扰上帝对世界的神意计划的祈求式祷告，无论那些计划是什么。在这些限制之内，人们可能想知道：在上帝的理由空间中，是否有足够的余地让祈求式祷告造成差别，以及这类祷告能为上帝提供何种理由。
