      Would it ever be possible to know or reasonably believe that God has answered a particular petitionary prayer? As one might expect, philosophers disagree about this question. Some theists think that for all we know, for any particular event that happens, God may have had independent reasons for bringing that event about, so we cannot know whether or not God brought it about because of a prayer (as opposed to bringing it about for other reasons—for more on this argument, see Basinger 2004, Davison 2017, chapter 4, Choi 2016, and Davison 2022, chapter 4)[^basinger-2004][^choi-2016][^davison-2017][^davison-2022]. This line of thought is especially interesting in light of the recent popularity of so-called skeptical theism, which responds to the problem of evil by claiming that we can never know exactly how particular events are connected with each other and with good or bad consequences, some of which may be beyond our understanding (see McBrayer 2010, Other Internet Resources). Others argue that as long as people are justified in believing, in general terms, that God sometimes answers prayers, then it is possible to believe reasonably that one’s petitionary prayer has been answered when one knows that the thing requested has come to pass (see Murray and Meyers 1994, Murray 2004, and Choi 2016)[^choi-2016][^murray-1994][^murray-2004].
    step1: |-
      我们是否可能知道或有理由相信，上帝应允了某条特定的祈求式祷告？正如人们所料，哲学家对此意见不一。一些有神论者认为，就我们所知，对任何发生的特定事件，上帝都可能拥有促成该事件的独立理由，因此我们无法知道上帝是否因为某条祷告而促成了它（而不是因其他理由促成它——关于这一论证的更多讨论，见 Basinger 2004、Davison 2017 第 4 章、Choi 2016、Davison 2022 第 4 章）[^basinger-2004][^choi-2016][^davison-2017][^davison-2022]。鉴于近来所谓怀疑论神学的流行，这一思路尤其有趣：怀疑论神学回应恶的问题时主张，我们永远无法确切知道特定事件之间、以及它们与好或坏后果之间是如何联系的，其中有些可能超出我们的理解（见 McBrayer 2010，其他网络资源）。另一些人主张，只要人们在一般意义上相信上帝有时应允祷告是有理的，那么当人知道所求之事已经发生时，就有可能合理地相信自己的祈求式祷告已蒙应允（见 Murray 与 Meyers 1994、Murray 2004、Choi 2016）[^choi-2016][^murray-1994][^murray-2004]。
    step2: |-
      我们能否知道，或有理由相信，上帝应允了某条特定的祈求式祷告？哲学家照例意见不一。一些有神论者认为，就我们所知，任何发生的事件，上帝都可能另有理由促成它，因此我们无法判断上帝究竟是因为某条祷告才促成它，还是出于别的理由（关于这一论证，详见 Basinger 2004、Davison 2017 第 4 章、Choi 2016、Davison 2022 第 4 章）[^basinger-2004][^choi-2016][^davison-2017][^davison-2022]。近来“怀疑论神学”颇为流行，使这条思路格外有趣：怀疑论神学回应恶的问题时说，我们永远无法确知特定事件彼此之间、以及它们与好坏后果之间究竟如何关联，其中有些可能超出我们的理解（见 McBrayer 2010，其他网络资源）。另一些人主张：只要人们在一般意义上相信“上帝有时应允祷告”是有理的，那么当知道所求之事已经发生，就有理由相信自己的祈求已蒙应允（见 Murray 与 Meyers 1994、Murray 2004、Choi 2016）[^choi-2016][^murray-1994][^murray-2004]。
