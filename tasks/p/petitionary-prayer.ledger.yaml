      According to the proponents of middle knowledge, petitionary prayer can make a difference because God can take into account those prayers that will be offered in the future when God plans how to create the world. So the proponents of middle knowledge have a way to answer the puzzle concerning omniscience. But the theory of middle knowledge is very controversial; critics wonder whether there are truths about what everyone and everything would do in every situation, and even if there were, how God could know such things (see the entry on prophecy, Davison 1991, and Zagzebski 2011)[^davison-1991][^zagzebski-2011].
    step1: |-
      按照中知识论的拥护者，祈求式祷告可以造成差别，因为上帝在计划如何创造世界时，可以把将来会被献上的那些祷告考虑在内。因此，中知识论的拥护者有办法回答关于全知的谜题。但中知识理论极具争议；批评者想知道，关于每个人与每件事物在每种处境中会做什么，究竟有没有这样的真理；即便有，上帝又如何能知道这些事情（见“预言”词条、Davison 1991 与 Zagzebski 2011）[^davison-1991][^zagzebski-2011]。
