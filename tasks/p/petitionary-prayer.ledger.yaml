      Finally, some philosophers (for example, Basinger 2004)[^basinger-2004] note that there are a number of ways to understand God’s obligations toward created persons, only some of which suggest that God’s goodness would be compromised if God withheld things because petitionary prayers were not offered. So there are a number of puzzles that stem from divine moral perfection, and a number of moves that theists can make in respond to themn. (For more on this general question, see Davison 2017, chapter 6, and Davison 2022, chapter 4.)[^davison-2017][^davison-2022]
    step1: |-
      最后，一些哲学家（例如 Basinger 2004）[^basinger-2004] 指出，理解上帝对受造者的义务有若干方式，其中只有一些方式意味着：如果上帝因为没有人献上祈求式祷告而扣留某些事物，上帝的善就会受损。因此，由神圣道德完善产生了若干谜题，也有若干有神论者可用的应对举措。（关于这一总体问题的更多讨论，见 Davison 2017，第 6 章；Davison 2022，第 4 章。）[^davison-2017][^davison-2022]
    step2: |-
      最后，一些哲学家（如 Basinger 2004）[^basinger-2004] 指出，对上帝向受造者所负义务可以有多种理解，其中只有一部分理解意味着：上帝若因无人祈求而扣留某些事物，其善便会受损。可见，神圣道德完善引出的谜题不少，有神论者可以回应的招数也不少。（关于这一总体问题，详见 Davison 2017 第 6 章、Davison 2022 第 4 章。）[^davison-2017][^davison-2022]
