      Still others have appealed to divine goodness to generate new challenges to petitionary prayer. For example, Alison Thornton asks you to imagine that you have broken your arm; should you pray to God for healing? If you knew that your recovery would be part of every future that God regards as sufficiently worthy of creation (she calls these “satisficing futures”), then your prayer for healing would be superfluous. If you knew instead that your recovery would be part of no future that God regards as worthy of creation, then you should not want to recover and you should not ask for this. Finally, if your recovery is part of some futures that God regards as worthy of creation, but not others, then you should not try to influence God’s choice – for example, if God is neutral about your recovery, then you should be neutral, too. So you have no relevant reason, based on the value of the target of your petitionary prayer, to try to influence God’s preferences (see Thornton 2022; see also Kleinschmidt 2018 for more about the value of the target of petitionary prayers)[^kleinschmidt-2018][^thornton-2022].
    step1: |-
      还有一些人诉诸上帝的善，以对祈求式祷告提出新的挑战。例如，Alison Thornton 请你设想自己摔断了胳膊；你应该向上帝祈求痊愈吗？如果你知道你的康复会属于上帝认为足够值得创造的每一个未来（她称之为“满意化未来”），那么你求痊愈的祷告就是多余的。反之，如果你知道你的康复不会属于上帝认为值得创造的任何未来，那么你就不应该想要康复，也不应该求这个。最后，如果你的康复属于上帝认为值得创造的某些未来而不属于另一些未来，那么你就不应试图影响上帝的选择——例如，如果上帝对你的康复持中立态度，那么你也应该持中立态度。因此，基于你所祈求之事本身的价值，你并没有相关的理由去试图影响上帝的偏好（见 Thornton 2022；关于祈求式祷告之对象价值的更多讨论，另见 Kleinschmidt 2018）[^kleinschmidt-2018][^thornton-2022]。
    step2: |-
      另一些人则借上帝的善，对祈求式祷告提出新挑战。比如 Alison Thornton 让你设想自己摔断了胳膊：该不该求上帝医治？若你知道，你的康复会出现在上帝认为足够值得创造的每一个未来里（她称之为“满意化未来”），那么求医治就是多余的。若你知道，你的康复不在上帝认为值得创造的任何未来里，那你就不该盼望康复，也不该开口去求。最后，若你的康复只在上帝认为值得创造的某些未来里、不在另一些里，你就不该试图左右上帝的选择——比如上帝对你的康复持中立，你也该持中立。所以，单凭祈求对象的价值，你并没有相关理由去影响上帝的偏好（见 Thornton 2022；关于祈求对象价值的更多讨论，另见 Kleinschmidt 2018）[^kleinschmidt-2018][^thornton-2022]。
