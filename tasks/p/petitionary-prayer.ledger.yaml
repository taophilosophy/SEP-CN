      Second, there is something called the “middle knowledge” view. This position holds that God knows the future in all of its detail as a result of knowing both (1) what everyone and everything would do in any possible situation (this is called divine “middle knowledge,” which is knowledge of things that are contingent but not up to God) and (2) which situations everyone and everything will be placed in actually (this is part of divine “free knowledge,” which is knowledge of things that are contingent and up to God) (see Molina 1588 and Flint 1998; the third category of divine knowledge is called “natural knowledge,” which is knowledge of things that are necessary and not up to God)[^flint-1998]. According to this picture, God knows the future in all of its detail, but what God knows about the future free choices of human beings depends on what they would choose—and that is something that is up to the human beings in question, not up to God. Even though God knows what you will do in the future, according to this picture, it is still up to you. In fact, when you make a free choice, you have the ability to do something such that were you to do it, God would have always known something different from what he knows in fact. (This is sometimes described in terms of having so-called “counterfactual power” with respect to God’s knowledge: see Flint 1998.)[^flint-1998]
    step1: |-
      第二，有一种所谓“中知识”观点。这一立场主张：上帝之所以在其全部细节上知道未来，是因为它同时知道 (1) 每个人与每件事物在任何可能处境中会做什么（这被称为神圣的“中知识”，即关于偶然但又不取决于上帝之事的知识），以及 (2) 每个人与每件事物实际上会被置于哪些处境（这是神圣“自由知识”的一部分，即关于偶然且取决于上帝之事的知识）（见 Molina 1588 与 Flint 1998；神圣知识的第三个类别称为“自然知识”，即关于必然且不取决于上帝之事的知识）[^flint-1998]。按照这幅图景，上帝在其全部细节上知道未来，但上帝关于人类未来自由选择所知道的内容，取决于他们会作何选择——而这是取决于当事人而不取决于上帝的。按照这幅图景，即使上帝知道你将来会做什么，这仍取决于你。实际上，当你作出自由选择时，你有能力做某件事，使得如果你做了这件事，上帝就会一直知道某种与它实际上所知道者不同的东西。（这一点有时被描述为对上帝的知识拥有所谓“反事实能力”：见 Flint 1998。）[^flint-1998]
    step2: |-
      第二，是所谓“中知识”（middle knowledge）观点。按此说，上帝之所以能在全部细节上知道未来，靠的是同时知道两件事：(1) 每个人与每件事物在任何可能处境中会怎么做（此即神圣的“中知识”——关于偶然而不取决于上帝之事的知识）；(2) 每个人与每件事物实际上会被置于何种处境（此为神圣“自由知识”的一部分——关于偶然且取决于上帝之事的知识）（见 Molina 1588 与 Flint 1998；第三类神圣知识称为“自然知识”，即关于必然而不取决于上帝之事的知识）[^flint-1998]。在这幅图景下，上帝固然在全部细节上知道未来，但他关于人类未来自由选择所知道的内容，取决于人们会怎么选——而那是取决于当事人、不取决于上帝的。即使上帝知道你将来会做什么，做什么仍由你决定。实际上，当你作自由选择时，你有能力做某件事，而一旦你做了，上帝就会一直知道某个与他实际所知不同的东西。（这有时被描述为对上帝的知识拥有所谓“反事实能力”：见 Flint 1998。）[^flint-1998]
