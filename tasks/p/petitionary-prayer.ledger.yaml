      A fourth view, called “theological determinism,” says that God determines everything in detail, and so God knows the past, present, and future completely. Although theological determinism raises other questions about creaturely responsibility and the problem of evil, it certainly explains how God could know about future prayers in a way that permits God to answer them, since it implies that God both determines which prayers will be offered and which of those prayers will be answered. (For more on these questions, see Hasker 1989, Timpe and Speak 2016, White 2019, and Furlong 2019.)[^furlong-2019][^hasker-1989][^timpe-2016][^white-2019]
    step1: |-
      第四种观点称为“神学决定论”，它主张上帝在细节上决定一切，因此上帝完全知道过去、现在与未来。尽管神学决定论引发了关于受造者责任与恶的问题的其他问题，它确实解释了上帝如何能以允许上帝应允祷告的方式知道未来的祷告，因为该观点蕴含：上帝既决定哪些祷告会被献上，也决定其中哪些祷告会蒙应允。（关于这些问题的更多讨论，见 Hasker 1989、Timpe 与 Speak 2016、White 2019 与 Furlong 2019。）[^furlong-2019][^hasker-1989][^timpe-2016][^white-2019]
    step2: |-
      第四种观点叫“神学决定论”（theological determinism）：上帝在细节上决定一切，因而完全知道过去、现在和未来。神学决定论固然会引出受造者责任、恶的问题等其他难题，但它确实解释了上帝如何能知道未来的祷告、并因此得以应允祷告——因为它意味着，哪些祷告会被献上、其中哪些会蒙应允，都由上帝决定。（详见 Hasker 1989、Timpe 与 Speak 2016、White 2019、Furlong 2019。）[^furlong-2019][^hasker-1989][^timpe-2016][^white-2019]
