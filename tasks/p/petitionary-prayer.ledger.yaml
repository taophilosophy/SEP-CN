      In response to this worry, a number of authors have suggested that it would be better, in some cases, for God to bring certain things about in response to petitionary prayers than to bring about those same things independently of any such requests. Eleonore Stump argues that in some cases, God waits for us to ask for something before granting it in order to avoid spoiling or overwhelming us. We could be spoiled by God if God answered all of our prayers automatically, and we could be overwhelmed by God if God provided everything good for us without waiting for us to ask first (Stump 1979)[^stump-1979]. In a similar vein, Michael Murray and Kurt Meyers argue that by making the provision of certain things dependent on petitionary prayer, God helps us to avoid idolatry, which is a sense of complete self-sufficiency that fails to recognize God as the source of all good things. They add that if God makes the provision of certain things for others dependent on our prayers for them, then this can help to build interdependence and community (Murray and Meyers 1994)[^murray-1994].
    step1: |-
      针对这一担忧，若干作者提出：在某些情况下，上帝因祈求式祷告而促成某些事，比不依赖任何此类请求而促成同样的事更好。Eleonore Stump 主张，在某些情况下，上帝等我们开口求某物之后再赐予，是为了避免宠坏我们或压垮我们。如果上帝自动应允我们所有的祷告，我们可能被上帝宠坏；如果上帝不等我们先开口就为我们提供一切好东西，我们可能被上帝压垮（Stump 1979）[^stump-1979]。与此类似，Michael Murray 与 Kurt Meyers 主张，通过使某些事物的供给取决于祈求式祷告，上帝帮助我们避免偶像崇拜——即一种完全的自我满足感，不承认上帝是一切好物的源头。他们还补充说，如果上帝使为他人提供某些事物取决于我们为他们的祷告，那么这有助于建立相互依存与共同体（Murray 与 Meyers 1994）[^murray-1994]。
    step2: |-
      面对这一担忧，不少作者提出：在某些情形下，上帝因祈求式祷告而促成某些事，比撇开请求径直促成同样的事更好。Eleonore Stump 认为，上帝有时等我们开口相求才赐予，是为了不宠坏我们，也不压垮我们。若上帝自动应允我们一切祷告，我们会被他宠坏；若不等我们开口就供给一切好东西，我们又会被他压垮（Stump 1979）[^stump-1979]。Michael Murray 与 Kurt Meyers 思路相近：上帝让某些事物的供给取决于祈求式祷告，是帮我们避免偶像崇拜——那种自以为全然自足、不承认上帝是一切好物之源的心态。他们还补充，若上帝把为他人供给某些事物系于我们为他们的祷告，便能促成相互依存与共同体（Murray 与 Meyers 1994）[^murray-1994]。
