      By contrast, Richard Swinburne and Daniel and Frances Howard-Snyder argue that by requiring petitionary prayers in some cases, God gives us more responsibility for the well-being of ourselves and others than we would enjoy otherwise (Swinburne 1998, Howard-Snyder and Howard-Snyder 2011)[^howard-snyder-2011][^swinburne-1998]. Critics of this approach have wondered whether this involves God using others as a means to an end (Basinger 1983)[^basinger-1983] or whether this really extends our responsibility for others to a significant degree (Davison 2017, chapter 7)[^davison-2017].
    step1: |-
      相比之下，Richard Swinburne 以及 Daniel 与 Frances Howard-Snyder 主张：通过在某些情况下要求祈求式祷告，上帝赋予我们对自己与他人福祉的责任，比我们本来享有的更多（Swinburne 1998；Howard-Snyder 与 Howard-Snyder 2011）[^howard-snyder-2011][^swinburne-1998]。这一进路的批评者想知道：这是否意味着上帝把他人当作达到目的的手段（Basinger 1983）[^basinger-1983]；或者，这是否真的在显著程度上扩展了我们对他人所负的责任（Davison 2017，第 7 章）[^davison-2017]。
    step2: |-
      相比之下，Richard Swinburne 与 Daniel、Frances Howard-Snyder 主张：上帝在某些情形下要求祈求式祷告，是把我们对自己和他人福祉的责任交给我们，比原本享有的更多（Swinburne 1998；Howard-Snyder 与 Howard-Snyder 2011）[^howard-snyder-2011][^swinburne-1998]。批评者则问：这是否让上帝把他人当成了达到目的的手段（Basinger 1983）[^basinger-1983]？或者，我们对他人所负的责任是否真因此显著扩大（Davison 2017，第 7 章）[^davison-2017]？
  - id: 25
    kind: body
    source: |-
      Others argue that by requiring petitionary prayers before providing certain things, God would be responding appropriately to the value of requests in general (see Howard-Snyder and Howard-Snyder 2010a, Pruss 2013, Cohoe 2014 and 2018, Parker and Rettler 2017, and Di Muzio 2018)[^cohoe-2014][^parker-2017][^pruss-2013]. Such an arrangement might also generate the valuable mediation of a good agent (Taliaferro 2007)[^taliaferro-2007] and produce different manifestations of divine goodness (Cohoe 2014)[^cohoe-2014]. Closer to Stump’s argument, many have argued that such an arrangement is a necessary part of a healthy, interactive divine-human relationship or partnership (Brümmer 2008, Smith and Yip 2010, Cohoe 2014 and 2018, Choi 2016, and Embry 2018)[^brümmer-2008][^choi-2016][^cohoe-2014][^embry-2018][^smith-2010].
    step1: |-
      另一些人主张，通过在提供某些事物之前要求祈求式祷告，上帝是在恰当地回应请求本身的价值（见 Howard-Snyder 与 Howard-Snyder 2010a、Pruss 2013、Cohoe 2014 与 2018、Parker 与 Rettler 2017、Di Muzio 2018）[^cohoe-2014][^parker-2017][^pruss-2013]。这种安排还可能产生一位善的能动者所作的有价值的调解（Taliaferro 2007）[^taliaferro-2007]，并产生神圣之善的不同显现（Cohoe 2014）[^cohoe-2014]。与 Stump 的论证更接近的是，许多人主张这种安排是健康的、互动性的神人关系或伙伴关系所必需的一部分（Brümmer 2008、Smith 与 Yip 2010、Cohoe 2014 与 2018、Choi 2016、Embry 2018）[^brümmer-2008][^choi-2016][^cohoe-2014][^embry-2018][^smith-2010]。
    step2: |-
      另一些人主张：上帝在赐予某些事物之前要求祈求式祷告，是在恰当回应“请求”本身的价值（见 Howard-Snyder 与 Howard-Snyder 2010a、Pruss 2013、Cohoe 2014 与 2018、Parker 与 Rettler 2017、Di Muzio 2018）[^cohoe-2014][^parker-2017][^pruss-2013]。这种安排还可能促成一位善的能动者所做的宝贵中介（Taliaferro 2007）[^taliaferro-2007]，并带来神圣之善的不同显现（Cohoe 2014）[^cohoe-2014]。更接近 Stump 论证的是：许多人主张，这种安排是健康而互动的神人关系或伙伴关系不可或缺的一环（Brümmer 2008、Smith 与 Yip 2010、Cohoe 2014 与 2018、Choi 2016、Embry 2018）[^brümmer-2008][^choi-2016][^cohoe-2014][^embry-2018][^smith-2010]。
