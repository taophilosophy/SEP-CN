    source: |-
      The arguments just mentioned all appeal to the value of some good consequences that could be realized if God provided things to people only in response to their requests in petitionary prayer. But a different kind of argument claims instead that God’s doing so represents a kind of right and proper distribution; such approaches emphasize the fact that some people deserve to have things they have sincerely requested (Hill 2018)[^hill-2018], that petitionary prayers express praiseworthy attitudes (whereas the lack of petitionary prayers expresses morally culpable attitudes: Choi 2016)[^choi-2016], or that divine respect for human freedom often requires something like creaturely permission before providing some good things (following one way of reading Stump: see Davison 2017, chapter 8)[^davison-2017].
    step1: |-
      刚才提到的论证都诉诸某些好后果的价值，即如果上帝只应人们的祈求式祷告请求而向他们提供事物，就可能实现的好后果。但另一类论证主张，上帝这样做代表一种正当而恰当的分配；这类进路强调：有些人理应得到他们真诚请求的东西（Hill 2018）[^hill-2018]；祈求式祷告表达值得称赞的态度（而缺乏祈求式祷告则表达在道德上应受谴责的态度：Choi 2016）[^choi-2016]；或者，上帝对人类自由的尊重往往要求在提供某些好东西之前取得类似受造者许可的东西（依 Stump 的一种读法：见 Davison 2017，第 8 章）[^davison-2017]。
    step2: |-
      上述论证都诉诸好后果的价值：若上帝只在人祈求之后才供给，就可能实现这些好后果。但另一类论证另有说法：上帝这样做体现了一种正当而恰当的分配。这类进路强调：有些人理应得到自己真诚请求之物（Hill 2018）[^hill-2018]；祈求式祷告表达值得赞许的态度，缺少祈求则表达道德上可咎的态度（Choi 2016）[^choi-2016]；或者，上帝对人类自由的尊重，往往要求在赐予某些好东西之前取得类似受造者许可的环节（依 Stump 的一种读法：见 Davison 2017 第 8 章）[^davison-2017]。
