      Defenders of a view called “timeless eternity” hold that God knows all of history at once, from a point of view outside of time altogether (see the entry on eternity.) Like the proponents of middle knowledge, the defenders of timeless eternity will say that just because God knows the future, this does not mean that God determines it. They will also say that God’s single act of creation from outside of time has many effects in time, including answers to prayers that God anticipates from the point of view of eternity. In this way, the defenders of timeless eternity can answer the puzzle concerning omniscience. But like open theism and the theory of middle knowledge, the idea that God is timelessly eternal is controversial too; for one thing, if God can tell from the point of view of eternity what people will pray in the future, God should also be able to tell what God will do (if anything) in that same future, so it is hard to see how such knowledge could inform divine choices: the future is whatever will happen, so knowledge of the future seems to presuppose that the future is already settled (see Hasker 1989, Flint 1998, Pruss 2007, Hunt 2009, and Zagzebski 2011)[^flint-1998][^hasker-1989][^hunt-2009][^pruss-2007][^zagzebski-2011].
    step1: |-
      一种称为“超时间的永恒”的观点的拥护者主张，上帝从一个完全在时间之外的视角，一下子知道全部历史（见“永恒”词条）。与中知识论的拥护者一样，超时间永恒的拥护者会说：仅仅因为上帝知道未来，并不意味着上帝决定未来。他们还会说，上帝从时间之外作出的单一创造行动在时间中产生许多效果，包括对祷告的应允——而上帝从永恒的视角早已预期这些祷告。这样，超时间永恒的拥护者便能回答关于全知的谜题。但与开放神论和中知识理论一样，“上帝是超时间地永恒的”这一观念也有争议；首先，如果上帝能从永恒的视角看出人们将来会祷告什么，那么上帝也应该能看出上帝自己在同一个未来中会做什么（如果有什么可做的话）；如此一来，这种知识如何能为神圣选择提供依据就很难看清：未来就是将要发生的一切，因此关于未来的知识似乎预设未来已经确定（见 Hasker 1989、Flint 1998、Pruss 2007、Hunt 2009 与 Zagzebski 2011）[^flint-1998][^hasker-1989][^hunt-2009][^pruss-2007][^zagzebski-2011]。
    step2: |-
      “超时间的永恒”论者主张：上帝从完全处于时间之外的视角，一举知道全部历史（见“永恒”词条）。与中知识论者一样，他们也会说：上帝知道未来，并不意味着上帝决定未来。他们还说，上帝自时间之外那一次创造行动，在时间中产生出许多效果，包括对祷告的应允——上帝从永恒视角早已预期这些祷告。如此，超时间永恒论者便能解答全知谜题。但与开放神论、中知识论一样，“上帝超时间地永恒”同样有争议。首先，若上帝能从永恒视角看出人将来会祷告什么，他理应也能看出自己在同一个未来里会做什么（若有什么可做的话）；这样便很难看清这种知识如何为神圣选择提供依据：未来就是将要发生的一切，知道未来似乎就预设了未来早已确定（见 Hasker 1989、Flint 1998、Pruss 2007、Hunt 2009 与 Zagzebski 2011）[^flint-1998][^hasker-1989][^hunt-2009][^pruss-2007][^zagzebski-2011]。
