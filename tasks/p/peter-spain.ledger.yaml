    source: |-
      The first main part of the *Tractatus* divides into five tracts. The first tract, *De introductionibus* (On introductory topics), explains the concepts used in traditional logic—*nomen* (noun), *verbum* (verb), *oratio* (phrase), *propositio* (proposition)—and presents the divisions of and the (logical) relationships between propositions. The second tract, *De predicabilibus* (On the predicables), covers matters dealt with in Boethius’s accounts of Porphyry’s *Isagoge*. It gives an account of the concept *predicabile* and the five predicables—*genus*, *species*, *differentia*, *proprium*, *accidens*—i.e., the common features of and differences between the predicables, as well as of the terms ‘*predicatio*’ and ‘*denominativum*’. Tract three, *De predicamentis* (On the categories), discusses the ten Aristotelian categories, as well as some items already dealt with in the previous treatise. The fourth tract, *De sillogismis* (On syllogisms), mainly goes back to Boethius’s *De syllogismis categoricis* (On categorical syllogisms). It gives an explanation of the basic element of the syllogism, i.e., *propositio*, and of the syllogism, and then goes into mood and figure, the proper forms of syllogisms, and briefly deals with what are called paralogisms. The fifth tract, *De locis* (On topical relationships), is derived from Boethius’s *De topicis differentiis* (On different topical relationships) I and II. This tract starts off with an explanation of the notions *argumentum* and *argumentatio*, and then proceeds to deal with the species of argumentation: syllogism, induction, enthymeme, and example. Next, it gives a definition of *locus* (the Latin translation of the Greek *topos*): a *locus* is the seat of an argument (i.e., the *locus* is supposed to warrant the inference by bringing it under some generic rule.) The intrinsic *loci* (= the kinds of *locus* that occurs when the argument is derived from the substance of the thing involved) are covered first, followed by the extrinsic *loci* (= the kinds of *locus* that occur when the argument is derived from something that is completely separate from the substance of the thing involved) and intermediary *loci* (= the kinds of *locus* that occur when the argument is taken from the things that partly share in the terms of the problem and partly differ from it). Examples are: intrinsic—the *locus* “from definition”: ‘a rational animal is running; therefore a man is running’; extrinsic—the *locus* “from opposites”: ‘Socrates is black; therefore he is not white’; intermediary—‘the just is good; therefore justice is good’.
    step1: |-
      《逻辑纲要》的第一大部分分为五个论说。第一论说《导论》（*De introductionibus*，论导论性主题）解释传统逻辑所用的概念——名词（*nomen*）、动词（*verbum*）、短语（*oratio*）、命题（*propositio*）——并给出命题的划分以及命题之间的（逻辑）关系。第二论说《论谓词》（*De predicabilibus*）涵盖波爱修斯对波菲利《导论》所作阐述中的内容；它说明谓词（*predicabile*）概念与五个谓词——属（*genus*）、种（*species*）、种差（*differentia*）、固有属性（*proprium*）、偶性（*accidens*）——即诸谓词的共同特征与差异，以及“谓述”（*predicatio*）与“限定词”（*denominativum*）这两个词项。第三论说《论范畴》（*De predicamentis*）讨论十个亚里士多德范畴，以及前一篇论著已处理过的若干事项。第四论说《论三段论》（*De sillogismis*）主要上溯到波爱修斯的《论直言三段论》（*De syllogismis categoricis*）；它解释三段论的基本要素即命题以及三段论本身，进而论及式与格——三段论的正当形式——并简要处理所谓的谬误推理。第五论说《论论题》（*De locis*，论论题关系）派生自波爱修斯《论题种差》（*De topicis differentiis*）第一、二卷。这一论说从解释论证（*argumentum*）与论证过程（*argumentatio*）两个概念开始，进而处理论证的种类：三段论、归纳、省略三段论与例证。接着它给出论题位（*locus*，希腊文 *topos* 的拉丁译名）的定义：论题位是论证的席位（即论题位被设想为通过把推理置于某个一般规则之下而为其作保）。内在的论题位（即论证取自所涉事物之实体时的论题位）首先得到讨论，随后是外在的论题位（即论证取自与所涉事物之实体完全分离的东西时的论题位）与居间的论题位（即论证部分地取自与问题的诸词项相同、部分地与之不同的东西时的论题位）。例如：内在的——“来自定义”的论题位：“一个理性动物在跑；所以一个人在跑”；外在的——“来自对立者”的论题位：“苏格拉底是黑的；所以他不是白的”；居间的——“正义者是善的；所以正义是善的”。
