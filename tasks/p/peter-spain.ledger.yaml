      Besides *suppositio naturalis*, Peter’s (and other medievals’) conception of *suppositio simplex* also seems to hover between connotation and denotation. In the expression *homo est species* the term *homo* has *suppositio simplex*, but this is precisely too what the term *homo* signifies. So there scarcely seems reason to separate signification from supposition on this score. The specific use of *suppositio simplex* found in Peter of Spain and other medieval authors, as the representation of a universal nature, is rejected later on by authors such as William of Ockham. For the latter, the term *homo* in the example just given has *suppositio simplex* (for Ockham a special case of *suppositio materialis*) in that it stands for the mental concept of man (Kneale & Kneale 1978, pp. 268–269)[^kneale-1978].
    step1: |-
      除自然指代外，彼得（以及其他中世纪学者）的简单指代概念似乎也徘徊于内涵与外延之间。在 *homo est species*（“人是种”）这一表达中，“人”一词具有简单指代，但这恰恰也是“人”一词所意谓的东西。因此，在这一问题上，几乎没有理由把意谓与指代分开。西班牙的彼得与其他中世纪作者所特有的简单指代用法——作为普遍本性的表征——后来被奥卡姆的威廉等作者所拒斥。对后者来说，刚才例子中的“人”一词具有简单指代（对奥卡姆而言是质料指代的一个特例），因为它代表人的心灵概念（Kneale & Kneale 1978, pp. 268–269）[^kneale-1978]。
