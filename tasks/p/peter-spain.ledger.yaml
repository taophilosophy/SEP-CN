  - id: 3
    kind: body
    source: |-
      Peter of Spain has been established as the medieval author of a work that became widely known as *Summule logicales magistri Petri Hispani* (Collection of Logic Matters of Master Peter of Spain). The great number of manuscripts and printed editions is evidence of the enormous success this work met with throughout European universities well into the seventeenth century. An interpolated version of his *Tractatus*, by then known as the *Summulae logicales*, was used by John Buridan as a basic text to comment upon. But finding out the true identity of the author of this influential *Tractatus* has proved to be a difficult task. For a long time it was assumed that he was a Portuguese who became Pope in 1276, under the name of John XXI. There is also another, earlier tradition, according to which the author of the *Tractatus* was regarded as Spanish, and a member of the Dominican order. Yet another attribution, dating from the fifteenth century, was to a Petrus Ferrandi Hispanus, who died between 1254 and 1259; this attribution would be consistent with the idea that Peter’s works on logic originated from the first half of the thirteenth century. According to still another attribution, the *Summule* was compiled by a Black Friar no earlier than in the late thirteenth or early fourteenth century.
    step1: |-
      西班牙的彼得已被确认为一部中世纪著作的作者，该著作广为人知的书名是《逻辑小全·西班牙的彼得大师》（*Summule logicales magistri Petri Hispani*，即《西班牙的彼得大师的逻辑辑要》）。大量手抄本与印本证明，这部作品直到十七世纪仍在欧洲各大学取得巨大成功。该书的一个增补本——当时称为《逻辑小全》（*Summulae logicales*）——被让·布里丹用作评注的基础文本。但要查明这部有影响的《论说集》作者的真正身份，却证明是一项困难的任务。长期以来，人们假定他是一位葡萄牙人，于 1276 年以若望二十一世的名号成为教皇。还有一种更早的传统，认为《论说集》的作者是西班牙人，且是多明我会会士。另有十五世纪的一种归属，归于一位佩德鲁斯·费兰迪·希斯帕努斯（Petrus Ferrandi Hispanus），他卒于 1254 至 1259 年之间；这一归属与“彼得的逻辑著作源于十三世纪上半叶”的想法相一致。按仍另一种归属，《逻辑小全》是由一位黑衣修士编纂的，时间不早于十三世纪末或十四世纪初。
    step2: |-
      西班牙的彼得已被认定是一部中世纪著作的作者，该书通称《西班牙的彼得大师逻辑辑要》（*Summule logicales magistri Petri Hispani*）。手抄本与印本数量之巨，说明此书直到十七世纪仍在欧洲各大学极为成功。该书的一个增补本——当时称《逻辑小全》（*Summulae logicales*）——曾被让·布里丹用作评注的底本。然而，要查明这部影响深远的《逻辑纲要》作者究竟是谁，却绝非易事。长期以来，人们以为他是葡萄牙人，1276 年以若望二十一世之名登教皇位。另有一种更早的传统，认为《逻辑纲要》的作者是西班牙人，属多明我会。还有一条十五世纪的归属，指其为佩德鲁斯·费兰迪·希斯帕努斯（Petrus Ferrandi Hispanus），卒于 1254 至 1259 年间；此说与“彼得的逻辑著作成于十三世纪上半叶”相符。再有一种归属则称，《逻辑小全》出自一位黑衣修士之手，成书不早于十三世纪末或十四世纪初。
