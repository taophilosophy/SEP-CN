      The theory of properties of terms shows a radical inconsistency, which has been explained as “the persistent hesitation of medieval logicians between the domains of connotation (universals) and denotation (individuals)” (De Rijk 1982, pp. 167–168)[^rijk-1982]. This inconsistency runs throughout Peter’s account of supposition, and comes to the fore most prominently in what he says about natural supposition (*suppositio naturalis*). The main problem is in what way the property of natural supposition is related to a term’s *significatio*, which was defined as the acceptance of a word for a thing (*res*). By this definition, the *significatio* of the term ‘man’ covers both its intension and extension, i.e., the universal nature of man and the individuals that have this nature in common. *Suppositio naturalis*, on the other hand, is described as “the acceptance of a common term for all those things that can share in a common universal nature”; for example, the term ‘man’ taken by itself by its very nature stands for all the individuals that fall under it, whether they existed in the past, exist in the present or will exist in the future. From this definition and the example just presented it appears that the extensional features of *significatio* and *suppositio naturalis* overlap. The latter kind of *suppositio* has been explained by interpreters as the natural capacity of a significative word to stand for something.
    step1: |-
      词项属性理论显示出一种根本的不融贯，它被解释为“中世纪逻辑学家在内涵（共相）领域与外延（个体）领域之间持续不断的犹豫”（De Rijk 1982, pp. 167–168）[^rijk-1982]。这种不融贯贯穿彼得关于指代的说明，并在他关于自然指代（*suppositio naturalis*）的论述中最为突出。主要问题在于：自然指代这一属性与词项的意谓是以何种方式相关联的——意谓被定义为词为某物（*res*）而被接受。按这一定义，“人”这一词项的意谓同时涵盖其内涵与外延，即人的普遍本性以及共同具有这一本性的个体。另一方面，自然指代被描述为“一个共同词项为所有能够分有共同普遍本性的事物而被接受”；例如“人”这个词就其自身、按其本性而言，代表所有落入其下的个体，无论它们过去存在、现在存在还是将来存在。从这一定义与刚才的例子来看，意谓与自然指代在外延方面的特征是重叠的。后一种指代被解释者解释为一个有意义的词代表某物的自然能力。
    step2: |-
      词项属性理论暴露出一种根本的不融贯，有人把它解释为“中世纪逻辑学家在内涵领域（共相）与外延领域（个体）之间长久摇摆”（De Rijk 1982, pp. 167–168）[^rijk-1982]。这种不融贯贯穿彼得对指代的整个说明，尤以自然指代（*suppositio naturalis*）的论述最为显眼。主要问题是：自然指代与词项的意谓究竟如何关联？意谓被定义为词为某物（*res*）而被接受。按此定义，“人”的意谓兼含内涵与外延，即人的普遍本性以及共有此本性的个体。自然指代则被描述为“共同词项为所有能分有共同普遍本性之物而被接受”；例如“人”就其自身、按本性代表其下一切个体，无论过去、现在、将来存在与否。由这一定义与例子看，意谓与自然指代在外延上确有重叠。解释者把后者称为一个有意义的词代表某物的自然能力。
