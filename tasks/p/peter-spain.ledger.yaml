  - id: 5
    kind: body
    source: |-
      1. The general view that Peter of Spain, author of the *Tractatus*, is someone who belonged to Order of Black Friars,
      2. The more specific view that the author of the *Tractatus* was a frater Petrus Alfonsi Hispanus O.P.,
      3. Another specific view that the Peter of Spain who created the *Tractatus* was the same Peter of Spain as the one who wrote the *Legenda sancti Dominici* and the Office of the Saint’s Feast, namely Petrus Ferrandi Hispanus O.P., who died in the 1250s.
    step1: |-
      1. 一般观点：作为《论说集》作者的西班牙的彼得，属于黑衣修士会。
      2. 更具体的观点：《论说集》的作者是多明我会会士 frater Petrus Alfonsi Hispanus O.P.（佩特鲁斯·阿尔方西·希斯帕努斯）。
      3. 另一种具体观点：创作《论说集》的西班牙的彼得，就是撰写《圣多明我传》（*Legenda sancti Dominici*）与圣人庆日礼仪的那位西班牙的彼得，即多明我会会士佩德鲁斯·费兰迪·希斯帕努斯，卒于 1250 年代。
    step2: |-
      1. 一般观点：作为《逻辑纲要》作者的西班牙的彼得，是黑衣修士会会士。
      2. 更具体的观点：《逻辑纲要》的作者是多明我会会士 frater Petrus Alfonsi Hispanus O.P.（佩特鲁斯·阿尔方西·希斯帕努斯）。
      3. 另一种具体观点：写《逻辑纲要》的西班牙的彼得，就是写《圣多明我传》（*Legenda sancti Dominici*）与圣人庆日礼仪的那位，即多明我会会士佩德鲁斯·费兰迪·希斯帕努斯，卒于 1250 年代。
  - id: 6
    kind: body
    source: |-
      Current research on the identity of Peter of Spain has once again taken up the idea that he must have been a member of the Dominican Order instead of Pope John XXI (D’Ors 1997, 2001, 2003)[^ors-1997]. However, we are still in the dark about the true identity of Peter of Spain. The most recent information we have on this score is that a number of the Dominican candidates recently suggested as the author of the *Tractatus* can be deleted from the list (Tugwell 1999, 2006)[^tugwell-1999]. The lack of further information also makes it difficult to establish the dates and specifics of his carreer.
    step1: |-
      当前关于西班牙的彼得身份的研究，再次接受了这样的看法：他必定是多明我会会士，而不是教皇若望二十一世（D'Ors 1997, 2001, 2003）[^ors-1997]。然而，我们对西班牙的彼得的真实身份仍然一无所知。我们在这个问题上掌握的最新信息是：近来被提名为《论说集》作者的若干多明我会候选人，可以从名单上删去（Tugwell 1999, 2006）[^tugwell-1999]。由于缺乏进一步的信息，要确定其生涯的年代与细节也很困难。
    step2: |-
      近年关于西班牙的彼得身份的研究，又重新采纳了“他必是多明我会士、而非教皇若望二十一世”的看法（D'Ors 1997, 2001, 2003）[^ors-1997]。但他的真实身份至今仍笼罩在黑暗里。就目前所知的最新消息是：近来被提名为《逻辑纲要》作者的几位多明我会候选人，可以逐一从名单上划掉（Tugwell 1999, 2006）[^tugwell-1999]。资料不足，其生平的年代与细节也难以确定。
  - id: 7
    kind: body
    source: |-
      It is still not possible to establish the date of origin of the *Tractatus*, the work that has enjoyed such enormous success. Recent scholarship suggests that it could have been written any time between the 1220s and the 1250s (Ebbessen 2013, 68–69). It has universally been recognised as a work by Peter of Spain. Another work that has been identified as Peter of Spain’s is a *Syncategoreumata* (Treatise on Syncategorematic Words), which was probably written some years after the *Tractatus*. Considering the fact that in all the thirteenth-century manuscripts the *Syncategoreumata* directly follows the *Tractatus*, and given the number of similarities between doctrinal aspects of these two works on logic, it is almost certain that they were written by the same author. Both works seem to have originated from Southern France or Northern Spain, the region where we also find the earliest commentaries on these treatises.
    step1: |-
      《论说集》——这部享有如此巨大成功的作品——的成书年代仍无法确定。晚近研究提示，它可能写于 1220 年代至 1250 年代之间的任何时间（Ebbessen 2013, 68–69）。它被普遍承认为西班牙的彼得的著作。另一部被认定为西班牙的彼得之作的，是《助范畴词》（*Syncategoreumata*，论助范畴词的著作），它很可能写于《论说集》之后若干年。考虑到在十三世纪的所有手抄本中《助范畴词》都紧接《论说集》之后，且鉴于这两部逻辑著作在学说方面的相似之处甚多，几乎可以肯定它们出自同一作者。两部作品似乎都源于法国南部或西班牙北部——我们也在那里发现这些论著最早的评注。
    step2: |-
      《逻辑纲要》这部大获成功的作品，成书年代至今无法确定。晚近研究提示，它可能写于 1220 至 1250 年代之间的任何时候（Ebbessen 2013, 68–69）。学界普遍承认它是西班牙的彼得之作。另一部被认定为彼得的著作，是《助范畴词》（*Syncategoreumata*，论助范畴词之书），很可能成于《逻辑纲要》之后数年。十三世纪的所有抄本中，《助范畴词》都紧接《逻辑纲要》；两书在学说上又有诸多相似，因此几乎可以肯定出自同一作者。两部作品似乎都源于法国南部或西班牙北部，那也是两书最早评注出现的地方。
  - id: 8
    kind: body
    source: |-
      An extensive list of writings ascribed to an author by the name of Petrus Hispanus is provided by Meirinhos (2018). Besides the two works on logic, the Petrus Hispanus in the *papa*-tradition is the supposed author of a famous medical work *Thesaurus pauperum*, as well as fourteen other works on medicine. Writings by (a) Peter of Spain in the field of natural philosophy include a *Scientia libri de anima*, and commentaries on Aristotle’s *De anima*, *De morte et vita*, *De sensu et sensato*, *De animalibus*, and theological works include commentaries on works by pseudo-Denys the Areopagite as well as a collection of sermons. As yet there is no certainty about whether the author of these treatises also wrote the *Tractatus* and the *Syncategoreumata*, or about the dates of their origin.
    step1: |-
      Meirinhos（2018）提供了一份归于“彼得·希斯帕努斯”名下的著作的广泛清单。除两部逻辑著作外，属于“教皇传统”的彼得·希斯帕努斯还被推定为一著名医学著作《穷人宝鉴》（*Thesaurus pauperum*）以及另外十四部医学作品的作者。归于（a）西班牙的彼得名下的自然哲学著作包括《论灵魂之书的知识》（*Scientia libri de anima*），以及对亚里士多德《论灵魂》《论死与生》《论感觉与被感觉者》《论动物》的注疏；神学著作则包括对伪丢尼修（Areopagite）作品的注疏以及一部布道集。至于这些论著的作者是否也写了《论说集》与《助范畴词》，或者它们的成书年代如何，目前尚无定论。
    step2: |-
      Meirinhos（2018）列出归在“彼得·希斯帕努斯”名下的一份长书单。除两部逻辑书外，属于“教皇传统”的这位彼得·希斯帕努斯，还被推定为医学名著《穷人宝鉴》（*Thesaurus pauperum*）及另外十四部医学作品的作者。归于（a）西班牙的彼得名下的自然哲学著作，有《论灵魂之书的知识》（*Scientia libri de anima*），以及亚里士多德《论灵魂》《论死与生》《论感觉与被感觉者》《论动物》的注疏；神学著作则有伪丢尼修（pseudo-Denys the Areopagite）作品注疏与一部布道集。这些论著的作者是否即《逻辑纲要》《助范畴词》的作者，成书又在何时，目前都无定论。
  - id: 9
    kind: body
    source: |-
      Another Petrus Hispanus, referred to as *Petrus Hispanus non-papa*, has been identified as the author of the *Summa ‘Absoluta cuiuslibet’*, a late twelfth-century handbook on syntax closely linked with Priscian’s *Institutiones grammatice, libb.* XVII and XVIII, which became very popular later in the Middle Ages under the name *Priscianus minor* (Kneepkens 1987)[^kneepkens-1987]. The chronology of this work seems to rule out that this Peter of Spain is the same author as the author of the *Tractatus*.
    step1: |-
      另一位彼得·希斯帕努斯，被称为 *Petrus Hispanus non-papa*（非教皇的彼得·希斯帕努斯），已被确认为《任何东西的绝对大全》（*Summa 'Absoluta cuiuslibet'*）的作者；这是一部十二世纪末的句法手册，与普里西安《语法原理》第 17、18 卷密切相关，后来在中世纪以《小普里西安》（*Priscianus minor*）之名大受欢迎（Kneepkens 1987）[^kneepkens-1987]。这部作品的年代似乎排除了这位西班牙的彼得就是《论说集》作者的可能。
    step2: |-
      另有一位彼得·希斯帕努斯，称 *Petrus Hispanus non-papa*（非教皇的彼得·希斯帕努斯），被认定为《任何东西的绝对大全》（*Summa 'Absoluta cuiuslibet'*）的作者。这是一部十二世纪末的句法手册，与普里西安《语法原理》第 17、18 卷关系密切，中世纪后期以《小普里西安》（*Priscianus minor*）之名风行一时（Kneepkens 1987）[^kneepkens-1987]。从年代看，这位西班牙的彼得似乎不可能是《逻辑纲要》的作者。
