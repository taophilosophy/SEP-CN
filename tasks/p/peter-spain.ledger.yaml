      The third division, *suppositio accidentalis*, is divided into *suppositio simplex* (simple supposition) and *suppositio personalis* (personal supposition). *Suppositio simplex* is the acceptance of a term for the universal ‘thing’ it signifies, as in *homo est species* (‘Man is a species’, *animal est genus* (‘Animal is a genus’), in which the substantive terms *homo* and *animal* stand for the universal man and animal, and not for any one of their particulars. *Suppositio simplex* can occur both in the subject- and in the predicate-term—e.g., *homo est species* (‘Man is a species’) and *omnis homo est animal* (‘Every man is an animal’) respectively. *Suppositio personalis* is the acceptance of a common term for one or more of its particulars, as in *homo currit* (‘A man is running’).
    step1: |-
      第三个划分，偶性指代，分为简单指代（*suppositio simplex*）与人称指代（*suppositio personalis*）。简单指代是一个词项为它所指意的普遍“事物”而被接受，如 *homo est species*（“人是种”）、*animal est genus*（“动物是属”），其中实体词“人”与“动物”代表普遍的人与动物，而非其任何一个殊例。简单指代既可以出现在主词项中，也可以出现在谓词项中——例如 *homo est species*（“人是种”）与 *omnis homo est animal*（“每个人都是动物”）分别如此。人称指代是一个共同词项为其一个或多个殊例而被接受，如 *homo currit*（“有人在跑”）。
    step2: |-
      第三层划分把偶性指代分为简单指代（*suppositio simplex*）与人称指代（*suppositio personalis*）。简单指代是词项为它所指意的那个普遍“事物”而被接受，如 *homo est species*（“人是种”）、*animal est genus*（“动物是属”）：实体词“人”“动物”在此代表普遍的人、普遍的动物，而非其中任何殊例。简单指代既可出现在主词项，也可出现在谓词项——*homo est species*（“人是种”）与 *omnis homo est animal*（“每个人都是动物”）即分别如此。人称指代则是共同词项为其一个或多个殊例而被接受，如 *homo currit*（“有人在跑”）。
