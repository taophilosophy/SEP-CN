  - id: 11
    kind: body
    source: |-
      Peter’s logic seems to have its origin in the continental tradition. Evidence of the educational carreer of the *Tractatus* appears from two commentaries (see De Rijk 1968, pp. 23–34 and De Rijk (ed.) 1972, Introduction, pp. LXXff.), which contain short lemmata and a number of questions (*questiones*) together with their solutions. The tracts as contained in these texts are very similar to the ones in the *Tractatus.* The *Tractatus* has features that are typical of the Paris tradition, such as the separate treatment of ampliation, restriction and distribution, as well as several other doctrinal elements (see De Rijk (ed.) 1972, pp. LXXXIV–LXXXVIII). We do not know whether Peter had any connection with Paris, nor can we say anything definitive about the identity of his teachers. Earlier sources for Peter’s works on logic can be traced back to Boethian-Aristotelian logic, and authorities in the field of grammar such as Priscian and Donatus.
    step1: |-
      彼得的逻辑似乎源于欧陆传统。两部评注（见 De Rijk 1968, pp. 23–34 与 De Rijk 编 1972, 导言, pp. LXXff.）显示了《论说集》在教育事业中的历程，它们包含简短的引文与若干问题（*questiones*）及其解答。这些文本所含的论说与《论说集》中的论说非常相似。《论说集》具有巴黎传统的典型特征，例如对扩展、限制与分配的分别处理，以及若干其他学说要素（见 De Rijk 编 1972, pp. LXXXIV–LXXXVIII）。我们不知道彼得与巴黎是否有过关联，对他的老师的身份也无从断言。彼得逻辑著作更早的源头，可以追溯到波爱修斯-亚里士多德逻辑，以及普里西安与多纳图斯等语法权威。
    step2: |-
      彼得的逻辑似乎源自欧陆传统。两部评注（见 De Rijk 1968, pp. 23–34；De Rijk 编 1972, 导言, pp. LXXff.）透露了《逻辑纲要》在教学上的流传，其中包含简短引文与若干问题（*questiones*）及解答，所收各论说与《逻辑纲要》十分接近。《逻辑纲要》带有巴黎传统的典型特征，如把扩展、限制与分配分别处理，还有其他一些学说要素（见 De Rijk 编 1972, pp. LXXXIV–LXXXVIII）。彼得与巴黎有无关联、其师承何人，我们均无从断言。其逻辑著作更早的源头，可上溯至波爱修斯-亚里士多德逻辑，以及普里西安、多纳图斯等语法权威。
  - id: 12
