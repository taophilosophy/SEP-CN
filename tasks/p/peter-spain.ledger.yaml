      In the opening of his *Syncategoreumata*, Peter presents his rationale for this investigation, viz. that there is a close link between the use of these kinds of words in sentences and their truth-value. His idea is that the *syncategoreumata* must have some sort of signification, but not the same as the categorematic words. For this special kind of signification he uses the words *consignificatio* and *dispositio*.
    step1: |-
      在《助范畴词》的开头，彼得陈述了他进行这项考察的理据，即这类词在句子中的使用与其真值之间存在紧密联系。他的想法是：助范畴词必定具有某种意谓，但这种意谓不同于范畴词的意谓。对于这种特殊的意谓，他使用“共意谓”（*consignificatio*）与“配置”（*dispositio*）二词。
    step2: |-
      《助范畴词》开篇，彼得交代了这项考察的理据：这类词在句中的用法与句子的真值密切相关。他认为，助范畴词必有其种意谓，但不同于范畴词的意谓。对这种特殊意谓，他用“共意谓”（*consignificatio*）与“配置”（*dispositio*）来称呼。
  - id: 30
    kind: body
    source: |-
      The first two separate chapters of the *Syncategoreumata* are devoted to the words *est* and *non* respectively, which are said to be implied in all other syncategorematic words. Peter’s account of the first word focuses on the notion of *compositio* (composition), which is explained in great detail, by looking into the signification of nouns and verbs (signifying a composition of a quality with a substance, and that of an act with a substance respectively). Considerable attention is given to the composition featuring in the verb ‘is’, in the form of the question of whether the composition involved can be counted among beings or not, considering the fact that it can be used to express different kinds of states of affairs. The chapter on negation introduces the important distinction between an act as conceived of or in the manner of a concept (*ut concepta sive per modum conceptus*) and an act as carried out (*ut exercita*) (see Nuchelmans 1988)[^nuchelmans-1988]. Among the former type we acts as expressed by the noun ‘negation’ and the verb ‘to deny, whereas an act of the latter type is what is expressed by the negative particle ‘not’. The remainder of this chapter deals with the function of the negation, which is to remove the composition found in whatever it covers, and discusses some well-known sophisma-sentences which turn on the specific function of negation.
    step1: |-
      《助范畴词》的头两个独立章节分别处理 *est*（是）与 *non*（不）二词，据说它们蕴含在所有其他助范畴词之中。彼得对第一个词的说明聚焦于组合（*compositio*）概念，并做了极为详细的解释：他考察名词与动词的意谓（分别意谓性质与实体的组合、行动与实体的组合）。他相当注意动词“is”所具有的组合，其形式是这样一个问题：考虑到它可以用来表达不同种类的事态，这种组合能否被算入存在者之中。论否定的章节引入了一个重要区分：作为被设想者或以概念方式（*ut concepta sive per modum conceptus*）的行动，与作为被实施者（*ut exercita*）的行动（见 Nuchelmans 1988）[^nuchelmans-1988]。前一类行动包括名词“否定”与动词“否认”所表达的行动，后一类行动则由否定小品词“不”所表达。本章余下部分处理否定的功能，即移除它所涵盖的任何东西中的组合，并讨论一些著名诡辩句，它们取决于否定的特定功能。
    step2: |-
      《助范畴词》开头两个独立章节，分别讨论 *est*（是）与 *non*（不）；据说这两个词蕴含在所有其他助范畴词中。彼得对 *est* 的说明围绕组合（*compositio*）概念展开，极为细致：他考察名词与动词的意谓（前者意谓性质与实体的组合，后者意谓行动与实体的组合）。他尤其关注动词“is”所包含的组合，并追问：既然它能表达不同种类的事态，这种组合能否算作存在者？论否定一章引入一个重要区分：作为被设想者、以概念方式存在的行动（*ut concepta sive per modum conceptus*），与作为被实施者的行动（*ut exercita*）（见 Nuchelmans 1988）[^nuchelmans-1988]。名词“否定”、动词“否认”所表达的属前者；否定小品词“不”所表达的属后者。本章其余部分讨论否定的功能——移除其所及内容中的组合——并讨论若干著名诡辩句，其疑难正系于否定的这一特定功能。
  - id: 31
    kind: body
    source: |-
      The third chapter of the *Syncategoreumata* discusses the exclusive words *solus* and *tantum*. They are called exclusives because they carry out an exclusion, not because they signify one. An exclusion, furthermore, requires four things, namely, what is excluded, what is excluded from, the respect in which it is excluded, and the act of exclusion. The kinds of exclusion are divided into general and specific: the former involves an exclusion from something generic, whereas the latter from something specific. Questions that come up in this section have to do with the results of adding an exclusive term to different kinds of words, such as to a term falling under the category of Substance: does it exclude only other substances, or does it also exclude from things listed under another category? And what if it is added to a term listed under the category of Accident (such as colour, quantity, and so on)? The next question deals with the sorts of terms that can be meaningfully associated with an exclusion. For example, is it possible to exclude something from ‘being’ (as in ‘Only being is, therefore nothing other than being is’)? The tract proceeds with the kinds of things that can qualify for an exclusion. The fourth chapter, which deals with exceptive words, is compiled in a similar manner.
    step1: |-
      《助范畴词》第三章讨论排除词 *solus* 与 *tantum*。它们被称为排除词，是因为它们执行排除，而不是因为它们意谓排除。此外，一次排除需要四样东西：被排除者、被排除所从者、排除所依据的方面，以及排除的行为。排除的种类分为一般与特殊：前者是从某种属的东西中排除，后者是从某种种的东西中排除。本节出现的问题关乎把排除词加到不同种类的词上会产生什么结果，例如加到一个属于实体范畴的词上：它只排除其他实体，还是也从列在另一范畴下的东西中排除？如果把它加到一个列在偶性范畴下的词（如颜色、量等）上，又会如何？下一个问题处理的是，哪些种类的词可以有意义地与排除相关联。例如，是否可能从“存在”中排除什么（如“只有存在者存在，所以除存在者外无物存在”）？该论说接着讨论哪些种类的东西有资格成为排除的对象。第四章处理除外词，编纂方式类似。
    step2: |-
      《助范畴词》第三章讨论排除词 *solus* 与 *tantum*。称它们为“排除词”，是因为它们执行排除，而非意谓排除。一次排除需要四样东西：被排除者、所从排除者、排除所依据的方面、排除的行为。排除分为一般与特殊：前者从属类之物中排除，后者从种类之物中排除。本节的问题是：把排除词加到各类词上会有什么结果？例如加在实体范畴的词上，它只排除其他实体，还是也从其他范畴下的东西中排除？若加在偶性范畴的词（如颜色、量）上又如何？接下来的问题关涉哪些词可以有意义地参与排除，比如能否从“存在”中排除什么（如“只有存在者存在，所以除存在者外无物存在”）？该篇随后讨论哪些东西有资格成为排除对象。第四章论除外词，编纂方式相仿。
