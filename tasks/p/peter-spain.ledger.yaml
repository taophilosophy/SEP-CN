      “组合”概念在彼得语义学中地位显赫。论“是”之前，他先考察名词与动词所含的组合（*compositiones*）。至于“是”的使用所含的组合，他说明的起点是：在“S 是 P”形式的命题中，“是”是否蕴含组合的“存在”？这取决于我们如何看待组合。若谈的是任何一种组合——用他的话说，一般意义上的组合——它可无差别地关联于存在者与非存在者。因为我们可以用同样的肯定命题谈论存在之物与不存在之物。于是“S 是 P”所表达的任何东西，都是某种意义上（*quodammodo*）的存在者。这里所说的组合类型，是某个肯定判断的心灵内容，只在某种程度上存在。然而一般意义上的组合，即这类表达所涉的事态，首要地关联于存在而非非存在。只有谈到非存在者（如喀迈拉）时，某种意义的存在才再次出场。于是有绝对意义上的存在者（*ens simpliciter*）与某种意义上的存在者（*ens quodammodo*）之别。两类存在的区别，可由两类推理见出：从“人是动物”（所含组合为绝对意义的存在者），可推出“所以人存在”；从“喀迈拉是非存在者”（其中组合只是某种意义的存在者），不能推出“所以喀迈拉存在”。
