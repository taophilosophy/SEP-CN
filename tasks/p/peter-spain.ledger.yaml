      A fusion of the domains of language and reality also turns up in Peter’s account of the consecutive ‘if’, which he explains as signifying causality. Like his contemporaries he looks into the question whether from something impossible anything follows. In his account, the notion of ‘impossibility’ can be taken in two ways, viz. impossibility as such (or absolute impossibility), which amounts to nothing, or some impossible state of affairs, that is a combination of notions that do have a real foundation but are incompatible. From the latter type of impossibility, such as ‘A man is an ass’, something, but not anything can follow, e.g., ‘Therefore a man is an animal’. From impossibilities as such, e.g., ‘You know that you are a stone’, nothing can follow. The fundamental idea is that in order for something to follow from an antecedent, the antecedent in the consecutive relationship must be a something (*res*) of some sort (see Spruyt 1993, pp. 161–193)[^spruyt-1993].
    step1: |-
      语言领域与实在领域的融合，也出现在彼得对连续词“如果”的说明中——他把它解释为意谓因果性。与他同时代的人一样，他考察从不可能的东西是否能推出任何东西这一问题。在他的说明中，“不可能性”概念可以有两种理解：不可能性本身（或绝对不可能性），它等于无；或某种不可能的事态，即由确实具有实在基础但彼此不相容的概念构成的组合。从后一类不可能性（如“人是驴”）可以推出某些东西，但不是任何东西，例如“所以人是动物”。从不可能性本身（如“你知道你是石头”）则推不出任何东西。基本想法是：要使某物从前件推出，连续关系中的前件必须是某种东西（*res*）（见 Spruyt 1993, pp. 161–193）[^spruyt-1993]。
    step2: |-
      语言领域与实在领域的融合，也见于彼得对连续词“如果”的说明——他把它解释为意谓因果性。他与同代人一样追问：从不可能的东西能否推出什么？“不可能性”可作两解：一是不可能性本身（绝对不可能性），等于无；二是某种不可能的事态，即由有实在基础却互不相容的概念组成的结合。从后一类不可能性（如“人是驴”）可推出某些东西，但非任何东西，例如“所以人是动物”；从绝对不可能性（如“你知道你是石头”）则推不出任何东西。基本想法是：某物要能从前件推出，连续关系中的前件必须是某种东西（*res*）（见 Spruyt 1993, pp. 161–193）[^spruyt-1993]。
