    source: |-
      Peter’s treatise on syncategorematic words forms part of a separate genre that developed from the beginning of the thirteenth century. The term *syncategorema* comes from a famous passage in Priscian’s *Institutiones grammatice* II, 15, which introduces two types of wordclasses (*partes orationis*) distinguished by logicians, viz. nouns and verbs on the one hand, and *syncategoremata*, or *consignificantia*, on the other. The latter are defined as words that do not have a definitive meaning on their own, but acquire one only in combination with other, categorematic words.
    step1: |-
      彼得论助范畴词的著作，属于十三世纪初发展起来的一个独立文类。“助范畴词”（*syncategorema*）一词来自普里西安《语法原理》II, 15 的一段著名文字，其中引出逻辑学家所区分的两类词类（*partes orationis*）：一方面是名词与动词，另一方面是助范畴词（*syncategoremata*）或共意谓词（*consignificantia*）。后者被定义为：本身没有确定意谓，只在与其他范畴词结合时才获得意谓的词。
    step2: |-
      彼得论助范畴词的著作，属于十三世纪初兴起的一个独立文类。“助范畴词”（*syncategorema*）一语出自普里西安《语法原理》II, 15 一段名言：那里引出逻辑学家区分的两类词类（*partes orationis*）——一方是名词与动词，另一方是助范畴词（*syncategoremata*）或共意谓词（*consignificantia*）。后者被定义为：自身没有确定意谓，只有与其他范畴词结合才获得意谓的词。
  - id: 27
    kind: body
    source: |-
      Like the treatises of the *Tractatus* kind, the *Syncategoreumata* were developed from the (twelfth-century) theories on fallacies, as well as from grammatical doctrines (from the same period). From the second half of the twelfth century, there was a growing interest in the linguistic elements that are considered to lie at the basis of ambiguity and fallacious reasoning. Hence the increase of treatises presenting a systematic account of these terms. The connection between these treatises and Priscian’s grammar can be gathered from the attention different authors pay to the *signa quantitatis* (or quantifiers) and their interest in the meaning and function of syncategorematic terms.
    step1: |-
      与《论说集》一类论著一样，《助范畴词》也是从（十二世纪的）谬误理论以及（同一时期的）语法学说发展出来的。自十二世纪下半叶起，人们对被认为构成歧义与谬误推理之基础的语言要素越来越感兴趣。因此，系统论述这些词项的论著增多。这些论著与普里西安语法的联系，可以从不同作者对量符号（*signa quantitatis*，即量词）的注意、以及他们对助范畴词之意谓与功能的兴趣中看出。
    step2: |-
      与《逻辑纲要》一类论著相同，《助范畴词》也从十二世纪的谬误理论与当时的语法学说中发展而来。十二世纪后半叶起，人们对被视为歧义与谬误推理之根源的语言要素兴趣渐浓，系统论述这类词项的论著随之增多。这些论著与普里西安语法的关联，可从各家对量符号（*signa quantitatis*，即量词）的重视、以及对助范畴词意谓与功能的关注中见出。
