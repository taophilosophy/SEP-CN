    source: |-
      Like the *Tractatus*, the *Syncategoreumata* also displays a continental origin. It appears to have continued along the lines of a similar work by Johannes Pagus. This work, which has been dated between 1225 and 1235, was later on further developed by Nicholas of Paris, who wrote his *Syncategoreumata* between 1240 and 1250 (see Braakhuis 1979, Vol. I, p. 248)[^braakhuis-1979].
    step1: |-
      与《论说集》一样，《助范畴词》也显示出欧陆渊源。它似乎沿续了约翰内斯·帕古斯一部类似作品的路线。该著作的年代被定在 1225 至 1235 年之间，后来又由巴黎的尼古拉进一步发展，他于 1240 至 1250 年间写出了自己的《助范畴词》（见 Braakhuis 1979, Vol. I, p. 248）[^braakhuis-1979]。
    step2: |-
      《助范畴词》与《逻辑纲要》一样，也出自欧陆传统。它似乎沿续了约翰内斯·帕古斯一部类似作品的路线；此书定年在 1225 至 1235 年间，后来由巴黎的尼古拉进一步发展，后者于 1240 至 1250 年间写出自己的《助范畴词》（见 Braakhuis 1979, Vol. I, p. 248）[^braakhuis-1979]。
