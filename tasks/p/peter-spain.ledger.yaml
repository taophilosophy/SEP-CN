    source: |-
      The *Tractatus* can be divided into two main parts. One part deals with doctrines found in the so-called *logica antiquorum*—i.e., the *logica vetus* (old logic) and *logica nova* (new logic)—and the other contains doctrines covered by the *logica modernorum*—viz. the tracts that discuss the *proprietates terminorum* (properties of terms).
    step1: |-
      《逻辑纲要》可分为两大部分。一部分处理所谓“古人逻辑”（*logica antiquorum*）——即旧逻辑（*logica vetus*）与新逻辑（*logica nova*）——中的学说；另一部分包含“现代人逻辑”（*logica modernorum*）所涵盖的学说，即讨论词项属性（*proprietates terminorum*）的那些论说。
    step2: |-
      《逻辑纲要》可分两大部分。一部分处理所谓“古人逻辑”（*logica antiquorum*）——旧逻辑（*logica vetus*）与新逻辑（*logica nova*）——的学说；另一部分则涵盖“现代人逻辑”（*logica modernorum*）的内容，即讨论词项属性（*proprietates terminorum*）的各篇论说。
