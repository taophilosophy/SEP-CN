      One of the most important elements in Peter’s logic concerns the doctrine of supposition. The theory of supposition has its origins in the twelfth century, when the medievals showed a growing interest in the ways in which words function in different contexts. This way of dealing with the semantics of terms has been dubbed the “contextual approach” (see de Rijk 1962–67, Vol. II, Part I, pp. 113–117)[^rijk-1962].
