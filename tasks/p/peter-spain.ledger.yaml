      与彼得关于组合的讨论相对应的，是论否定的部分。彼得专门探讨否定所否定的是什么这一问题。用他的话说，否定移除组合。与此相关的组合被等同于被肯定的事态（*res affirmata*）。否定所移除的不是事态，而是伴随事态的肯定。组合与否定的基础原来是同一个事态，即某种在心灵中被形成的东西；我们可以对它表示同意，或否认它是如此。
