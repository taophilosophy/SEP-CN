    kind: body
    source: |-
      The ninth, tenth, eleventh, and twelfth tracts of the *Tractatus*, i.e., the short tracts *De ampliationibus* (On ampliation), *De appellationibus* (On appellation), *De restrictionibus* (On restriction) and *De distributionibus* (On distribution), are in fact elaborations of the theory of supposition. Ampliation is an extension of the supposition of a term. It occurs when an expression is combined with a modal term—e.g. *homo potest esse Antichristus* (‘A man can be the Antichrist’), and *homo necessario est animal* (‘A man is necessarily an animal’)—in which case the supposition of the term ‘man’ is extended to more than just individuals existing in the present. The tract on *appellationes* is very short: appellation is considered no more than a special case of restriction, i.e., the restricted supposition brought about by a present-tense verb. In this tract the rules of appellation are in fact specific kinds of rules of restriction. The subject of restriction in general is discussed in the eleventh tract. The rules of restriction are the same ones as were presented in the early Parisian textbooks on logic (see de Libera 1982, pp. 176–177)[^libera-1982]. The final tract, on distribution, deals with the multiplication of common terms as a result of their being combined with universal signs. These universal signs are either distributive of substance (such as *omnis*, *nullus*), or of accidents (such as *qualiscumque*, *quantuscumque*). In this description ‘substance’ is defined as substistent modes of being, and ‘accident’ as accidental modes of being. Separate attention is given to the universal sign *omnis* (‘all’ or ‘every’) along with a discussion of the common rule that the use of *omnis* requires three *appellata* (particular things). The most frequently cited example in these discussions in the thirteenth century was the sophisma *omnis phenix est* (‘Every phoenix is’). According to Peter of Spain, the use of *omnis* does not call for at least three *appellata*; an exception to this rule is found in cases in which there is only one *appellatum*, as is the phoenix-case. The tract also pays attention to a number of tongue-twisting sophisma-sentences.
    step1: |-
      《论说集》的第九、十、十一、十二论说，即短篇《论扩展》（*De ampliationibus*）、《论称谓》（*De appellationibus*）、《论限制》（*De restrictionibus*）与《论分配》（*De distributionibus*），实际上是对指代理论的展开。扩展是对一个词项指代的延伸。当表达式与模态词结合时，就出现扩展——例如 *homo potest esse Antichristus*（“一个人可能是敌基督”）与 *homo necessario est animal*（“人必然是动物”）——在此情形中，“人”一词的指代被扩展到不仅限于当下存在的个体。论称谓的一篇很短：称谓被视为限制的一个特例，即由现在时动词带来的受限制的指代。在这一篇中，称谓规则实际上是限制规则的特殊种类。限制的一般主题在第十一论说中讨论。限制规则与早期巴黎逻辑教科书所呈现的规则相同（见 de Libera 1982, pp. 176–177）[^libera-1982]。最后一论说论分配，处理共同词项因与全称符号结合而产生的倍增。这些全称符号要么分配实体（如 *omnis*、*nullus*），要么分配偶性（如 *qualiscumque*、*quantuscumque*）。在这一描述中，“实体”被定义为自存的生存样态，“偶性”被定义为偶性的生存样态。对全称符号 *omnis*（“所有”或“每个”）另作专门考察，并讨论一条通行规则：使用 *omnis* 需要三个 *appellata*（特殊事物）。十三世纪这些讨论中最常引用的例子是诡辩句 *omnis phenix est*（“每只凤凰都存在”）。按西班牙的彼得，使用 *omnis* 并不要求至少三个 *appellata*；这条规则有一个例外，即只有一个 *appellatum* 的情形，凤凰之例即是。该论说还注意若干拗口的诡辩句。
    step2: |-
      《逻辑纲要》第九至第十二篇——短篇《论扩展》（*De ampliationibus*）、《论称谓》（*De appellationibus*）、《论限制》（*De restrictionibus*）、《论分配》（*De distributionibus*）——其实都是指代理论的展开。扩展是对词项指代的延伸：当表达式与模态词结合时便发生，例如 *homo potest esse Antichristus*（“一个人可能是敌基督”）、*homo necessario est animal*（“人必然是动物”），此时“人”的指代被扩展到当下存在的个体之外。论称谓一篇极短：称谓不过是限制的特例，即由现在时动词造成的受限指代；篇中的称谓规则实为限制规则的特殊类型。限制的一般问题在第十一篇讨论，其规则与早期巴黎逻辑教科书相同（见 de Libera 1982, pp. 176–177）[^libera-1982]。末篇论分配，讲共同词项因与全称符号结合而倍增。全称符号或分配实体（如 *omnis*、*nullus*），或分配偶性（如 *qualiscumque*、*quantuscumque*）；文中“实体”指自存的生存样态，“偶性”指偶性的生存样态。此外专门考察全称符号 *omnis*（“所有”“每个”），并讨论一条通行规则：用 *omnis* 需有三个 *appellata*（特殊事物）。十三世纪此类讨论最常引的例证是诡辩句 *omnis phenix est*（“每只凤凰都存在”）。彼得认为，用 *omnis* 并不要求至少三个 *appellata*；只有一个 *appellatum* 时（如凤凰之例）便有例外。该篇还留意若干拗口的诡辩句。
