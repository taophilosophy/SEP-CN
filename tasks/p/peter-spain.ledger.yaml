      There is a more telling difference between *significatio* and *suppositio naturalis*, however. *Significatio* is the natural property of any significative term to represent things, owing to its original imposition, whereas a term’s supposition only enters the scene when it is used. The expression “taken by itself” (*per se sumptus*) found in Peter’s account of *suppositio naturalis*, does not mean that no context is required, as is the case in *significatio*, but it merely indicates that for the moment the actual context is being disregarded. The link between *significatio* and *suppositio* is the following. When some word has acquired a signification by an *impositor* (= someone who bestows a meaning upon a word), then it connotes a univeral nature or essence, and acquires a natural capacity to stand for all the actual and possible individuals that share in this common nature; it owes this capacity to its *significatio*. If, however, we disregard for a moment the actual context in which the term in question is used and look upon the term as taken by itself (*per se sumptus*), then its supposition covers its entire extension. If we take the factual context in which the term is used into consideration, then its extension becomes limited, owing to the context. The context, or more precisely, the added significative term, can be of three kinds: the added significative term can be a predicate of a proposition in which the term at issue occurs, the added significative term can be an adjective, or the context can be of a social nature (see de Rijk 1971 and de Rijk 1985, pp. 183–203)[^rijk-1971][^rijk-1985].
    step1: |-
      不过，意谓与自然指代之间还有一个更能说明问题的区别。意谓是任何有意义的词项由于其原初赋义而具有的代表事物的自然属性，而词项的指代只有在其被使用时才登场。彼得对自然指代的说明中出现的“就其自身而被取用”（*per se sumptus*）这一说法，并不意味着像意谓那样不需要任何语境，而只是表示当下不顾及实际语境。意谓与指代之间的联系如下：当某个词经由赋义者（*impositor*，即赋予词以意义者）而获得意谓时，它就意涵某种普遍本性或本质，并获得代表分有这一共同本性的一切实际与可能个体的自然能力；它把这种能力归功于其意谓。然而，如果我们暂时不顾所论词项被使用的实际语境，而把该词项看作就其自身而被取用（*per se sumptus*），那么它的指代就覆盖其整个外延。如果我们考虑该词被使用的事实语境，那么它的外延就因语境而受到限制。语境——更确切地说，附加的有意谓词项——可以是三类：附加的有意谓词项可以是所论词项出现于其中的命题的谓词；附加的有意谓词项可以是形容词；或者语境可以具有社会性质（见 de Rijk 1971 与 de Rijk 1985, pp. 183–203）[^rijk-1971][^rijk-1985]。
