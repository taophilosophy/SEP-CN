      “组合”概念在彼得的语义学中扮演突出角色。在进入“是”一词的具体讨论之前，他先考察名词与动词所涉及的组合（*compositiones*）。至于使用“是”时所涉及的组合，他说明的起点是这样一个问题：在“S 是 P”形式的命题中，“是”这一表达式是否蕴含组合的“存在”。它是否如此，取决于我们如何考虑组合。如果我们谈论的是任何组合——用他的话说，一般意义上的组合——那么组合可以不加区分地与存在者和非存在者相联系。这是因为，我们可以用同样的肯定命题谈论存在的东西与不存在的东西。因此，“S 是 P”形式的命题所表达的任何东西，都是某种意义上的存在者（*ens quodammodo*）。他在这里所指的组合类型，是某个肯定判断的心灵内容，而这种东西只在某种程度上有存在。然而，一般意义上的组合，即这类表达所涉及的事态，首要地与存在而非非存在相联系。只有当我们谈论非存在者（如喀迈拉）时，某种意义上的存在才再次登场。因此就有了对所涉及的存在类型、或肯定命题所涉及的组合类型的区分：绝对意义上的存在者（*ens simpliciter*）与某种意义上的存在者（*ens quodammodo*）。这两类存在的区别，由两类推理的区别来说明：从“人是动物”（其中所涉及的组合是绝对意义上的存在者），可以推出“所以人存在”；但从“喀迈拉是非存在者”（其中组合只是某种意义上的存在者），不能推出“所以喀迈拉存在”。
