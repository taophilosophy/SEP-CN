      The list of words to be included among the *syncategoreumata* was not always the same. Generally speaking it comprised exclusive words *tantum* (only), *solus* (alone), exceptive words such as *preter* (except), *nisi* (unless), consecutive words such as *si* (if) and *nisi* (if not), the words *incipit* (begins) and *desinit* (ceases), the modal terms *necessario* (necessarily) and *contingenter* (contingently), the conjunctives *an* (or), *et* (and), *nisi* (unless), *in eo quod* (in that), and *quin* (that not). In Peter’s work we also find a discussion of the terms *quanto* (‘how much’ or ‘as much as’) *quam* (‘than’ or ‘as’) and *quicquid* (whatever). Unlike that of some other authors (such as William of Sherwood and Robert Bacon), his list does not include the word *omnis*.
    step1: |-
      被列入助范畴词的词表并不总是一样。一般说来，它包括排除词 *tantum*（仅）、*solus*（独自），除外词如 *preter*（除……之外）、*nisi*（除非），连续词如 *si*（如果）与 *nisi*（如果不），词 *incipit*（开始）与 *desinit*（停止），模态词 *necessario*（必然地）与 *contingenter*（偶然地），连接词 *an*（或）、*et*（和）、*nisi*（除非）、*in eo quod*（就……而言）与 *quin*（并非不）。在彼得的著作中，我们还看到对 *quanto*（“多少”或“与……一样多”）、*quam*（“比”或“与……一样”）与 *quicquid*（无论什么）的讨论。与另一些作者（如 William of Sherwood 与 Robert Bacon）不同，他的词表不包括 *omnis* 一词。
    step2: |-
      列入助范畴词的词表并不固定。大体包括：排除词 *tantum*（仅）、*solus*（独自）；除外词如 *preter*（除……之外）、*nisi*（除非）；连续词如 *si*（如果）、*nisi*（如果不）；以及 *incipit*（开始）、*desinit*（停止）；模态词 *necessario*（必然地）、*contingenter*（偶然地）；连接词 *an*（或）、*et*（和）、*nisi*（除非）、*in eo quod*（就……而言）、*quin*（并非不）。彼得的书中还讨论了 *quanto*（“多少”“与……一样多”）、*quam*（“比”“与……一样”）与 *quicquid*（无论什么）。与 William of Sherwood、Robert Bacon 等作者不同，他的词表不含 *omnis*。
