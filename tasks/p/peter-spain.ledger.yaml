      The counterpart of Peter’s discussion of composition is the section on negation. Peter specifically goes into the question of what it is the negation denies. In his words, the negation removes the composition. The composition in this connection is identified with the affirmed state of affairs (*res affirmata*). What the negation removes is not the state of affairs, but the affirmation that goes along with it. The basis of both composition and negation turns out to be the same state of affairs, i.e., something that is formulated in the mind, to which we can assent or which we can deny to be the case.
