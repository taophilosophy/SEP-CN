  - id: 3
    kind: body
    source: |-
      Ben-Yami (2006) also argues against Malament’s requirement of invariance under temporal reflections, but for different reasons than those of Sarkar and Stachel. Ben-Yami (2006, 461) takes his fundamental causal relation to be the following: “If event *e*₁ is a cause of event *e*₂, then *e*₂ does not precede *e*₁.” He thus allows events to be simultaneous with their causes, and consequently the range of Reichenbach’s ε is extended to include both 0 and 1. Ben-Yami’s causal relation is not time-symmetric, which is his reason for rejecting the requirement of invariance under temporal reflections. He concludes (Ben-Yami 2006, 469-470) that, with his modified causal relation, there are “infinitely many possible simultaneity relations: any space-like or light-like conic hypersurface of an event on *O* defines a simultaneity relation for that event relative to *O*, and then, by translations, for any event on *O*.” However he then goes on to argue against the assumption that an observer, represented by *O*, would remain inertial forever, and ultimately concludes not only that standard simultaneity cannot be defined but that the only two simultaneity relations that can be defined relative to an event are those determined by its future and past light cones.
    step1: |-
      Ben-Yami（2006）也反对马拉门特的时间反演不变性要求，但理由与 Sarkar 和 Stachel 不同。Ben-Yami（2006, 461）把基本因果关系取为：“若事件 *e*₁ 是事件 *e*₂ 的原因，则 *e*₂ 不先于 *e*₁。”这样他就允许事件与其原因同时，于是赖欣巴哈 ε 的取值范围扩大到包含 0 与 1。Ben-Yami 的因果关系不是时间对称的，这正是他拒斥时间反演不变性要求的理由。他的结论是（Ben-Yami 2006, 469-470）：在其修正的因果关系下，“可能的同时性关系有无穷多：*O* 上一个事件的任何类空或类光锥形超曲面，都定义该事件相对于 *O* 的一个同时性关系；再经平移，就得到 *O* 上任何事件的同时性关系。”不过他接着又反驳“由 *O* 代表的观察者会永远保持惯性”这一假设。他最终不仅断定标准同时性无法定义，还断定：相对于一个事件，能定义的只有两个同时性关系——由它的未来与过去光锥所确定的两个。
    step2: |-
      Ben-Yami（2006）也反对马拉门特的时间反演不变性要求，但理由与 Sarkar 和 Stachel 不同。Ben-Yami（2006, 461）把基本因果关系取为：“若事件 *e*₁ 是事件 *e*₂ 的原因，则 *e*₂ 不先于 *e*₁。”这样他就允许事件与其原因同时，于是赖欣巴哈 ε 的取值范围扩大到包含 0 与 1。Ben-Yami 的因果关系不是时间对称的，这正是他拒斥时间反演不变性要求的理由。他的结论是（Ben-Yami 2006, 469-470）：在其修正的因果关系下，“可能的同时性关系有无穷多：*O* 上一个事件的任何类空或类光锥形超曲面，都定义该事件相对于 *O* 的一个同时性关系；再经平移，就得到 *O* 上任何事件的同时性关系。”不过他接着又反驳“由 *O* 代表的观察者会永远保持惯性”这一假设。他最终不仅断定标准同时性无法定义，还断定：相对于一个事件，能定义的只有两个同时性关系——由它的未来与过去光锥所确定的两个。
  - id: 4
    kind: body
    source: |-
      Giulini (2001, 653) argues that it is too strong a requirement to ask that a simultaneity relation be invariant under causal transformations (such as scale transformations) that are not physical symmetries, which Malament as well as Sarkar and Stachel do. Using “*Aut*” to refer to the appropriate invariance group and “nontrivial” to refer to an equivalence relation on spacetime that is neither one in which all points are in the same equivalence class nor one in which each point is in a different equivalence class, Giulini (2001, 657–658) defines two types of simultaneity: Absolute simultaneity is a nontrivial *Aut*-invariant equivalence relation on spacetime such that each equivalence class intersects any physically realizable timelike trajectory in at most one point, and simultaneity relative to some structure *X* in spacetime (for Malament, *X* is the world line of an inertial observer) is a nontrivial *Aut*_{*X*}-invariant equivalence relation on spacetime such that each equivalence class intersects any physically realizable timelike trajectory in at most one point, where *Aut*_{X} is the subgroup of *Aut* that preserves *X*. First taking *Aut* to be the inhomogeneous (i.e., including translations) Galilean transformations, Giulini (2001, 660–662) shows that standard Galilean (i.e., pre-relativistic) simultaneity is the unique absolute simultaneity relation. Then taking *Aut* to be the inhomogeneous Lorentz transformations (also known as the Poincaré transformations), Giulini (2001, 664–666) shows that there is no absolute simultaneity relation and that standard Einsteinian synchrony is the unique relative simultaneity when *X* is taken to be a foliation of spacetime by straight lines (thus, like Malament, singling out a specific inertial frame, but in a way that is different from Malament’s choice of *X*).
    step1: |-
      Giulini（2001, 653）论证说，要求同时性关系在并非物理对称的因果变换（例如标度变换）下不变，这个要求太强；而马拉门特以及 Sarkar 与 Stachel 恰恰提出了这一要求。Giulini（2001, 657–658）用“*Aut*”指称适当的不变群；“非平凡”则指这样一种时空等价关系——既非所有点同属一个等价类，亦非每点各属一类。他定义了两类同时性。绝对同时性：时空上的非平凡 *Aut* 不变等价关系，使每个等价类与任何物理可实现的类时轨迹至多交于一点。相对同时性：相对于时空某个结构 *X*（对马拉门特而言，*X* 是惯性观察者的世界线）。它是时空上的非平凡 *Aut*_{*X*} 不变等价关系，使每个等价类与任何物理可实现的类时轨迹至多交于一点；这里 *Aut*_{X} 是 *Aut* 中保持 *X* 的子群。Giulini（2001, 660–662）先取 *Aut* 为非齐次伽利略变换（含平移），证明通常的伽利略同时性（前相对论情形）是唯一的绝对同时性关系。然后取 *Aut* 为非齐次洛伦兹变换（又称庞加莱变换），证明不存在绝对同时性关系；而当 *X* 取时空的直线叶状剖分时，标准爱因斯坦同步就是唯一的相对同时性。这样，与马拉门特一样挑出了一个特定惯性系，但选取 *X* 的方式不同于马拉门特。
    step2: |-
      Giulini（2001, 653）论证说，要求同时性关系在并非物理对称的因果变换（例如标度变换）下不变，这个要求太强；而马拉门特以及 Sarkar 与 Stachel 恰恰提出了这一要求。Giulini（2001, 657–658）用“*Aut*”指称适当的不变群；“非平凡”则指这样一种时空等价关系——既非所有点同属一个等价类，亦非每点各属一类。他定义了两类同时性。绝对同时性：时空上的非平凡 *Aut* 不变等价关系，使每个等价类与任何物理可实现的类时轨迹至多交于一点。相对同时性：相对于时空某个结构 *X*（对马拉门特而言，*X* 是惯性观察者的世界线）。它是时空上的非平凡 *Aut*_{*X*} 不变等价关系，使每个等价类与任何物理可实现的类时轨迹至多交于一点；这里 *Aut*_{X} 是 *Aut* 中保持 *X* 的子群。Giulini（2001, 660–662）先取 *Aut* 为非齐次伽利略变换（含平移），证明通常的伽利略同时性（前相对论情形）是唯一的绝对同时性关系。然后取 *Aut* 为非齐次洛伦兹变换（又称庞加莱变换），证明不存在绝对同时性关系；而当 *X* 取时空的直线叶状剖分时，标准爱因斯坦同步就是唯一的相对同时性。这样，与马拉门特一样挑出了一个特定惯性系，但选取 *X* 的方式不同于马拉门特。
