      While there has been much theoretical interest in cases in which reference is disambiguated by loci, this is usually an option, not an obligation. In ASL, for instance, it is often possible to realize pronouns by pointing towards a neutral locus that need not be introduced explicitly by nominal antecedents, and in fact several antecedents can be associated with this default locus. This gives rise to instances of referential ambiguity that are similar to those found in English in (2)–(3) above (see Frederiksen & Mayberry 2022; for an account that treats loci as corresponding to entire regions of signing space, and also allows for sign language pronouns without locus specification, see Steinbach & Onea 2016)[^frederiksen-2022][^steinbach-2016].
    step1: |-
      尽管理论上对位点消歧指称的情形兴趣浓厚，这通常是一种选择而非义务。例如在 ASL 中，常常可以通过指向一个中立位点来实现代词，该位点无须由名词先行语显性引入，而且事实上多个先行语可以关联到这一默认位点。这会产生与上文 (2)–(3) 中英语类似的指称歧义（见 Frederiksen & Mayberry 2022；一种把位点当作对应手势空间整个区域、并允许手语代词不带位点标定的处理，见 Steinbach & Onea 2016）。
    step2: |-
      尽管位点消歧指称的情形在理论上备受关注，这通常是一种选择而非义务。例如在 ASL 中，代词常可指向一个中立位点来实现，该位点无须由名词先行语显性引入；事实上多个先行语都可关联到这一默认位点。由此产生的指称歧义与上文 (2)–(3) 中英语的情形类似（见 Frederiksen & Mayberry 2022；把位点当作对应手势空间整个区域、并允许手语代词不带位点标定的处理，见 Steinbach & Onea 2016）。
