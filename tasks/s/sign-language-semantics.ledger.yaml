      ### 3.1 象似调制
  - id: 113
    kind: body
    source: |-
      As in spoken language, it is possible to modulate some conventional words in an iconic fashion. In English, *the talk was looong* suggests that the talk wasn’t just long but *very* long. Similarly, the conventional verb *GROW* in ASL can be realized more quickly to evoke a faster growth, and with broader endpoints to suggest a larger growth, as is illustrated below (Schlenker 2018b)[^schlenker-2018b]. There are multiple potential levels of speed and endpoint breadth, which suggests that a rule is genuinely at work in this case.
    step1: |-
      与口语一样，某些约定词可以按象似方式调制。英语中 *the talk was looong* 暗示讲座不只是长，而是*很长*。类似地，ASL 的约定动词 *GROW* 可以打得更快，以唤起更快的生长；也可以打的端点更宽，以暗示更大的生长，如下图所示（Schlenker 2018b）。速度与端点宽度有多个潜在等级，这提示此处确实有一条规则在起作用。
    step2: |-
      与口语一样，某些约定词可按象似方式调制。英语 *the talk was loooong* 暗示讲座不只是长，而是*很长*。类似地，ASL 的约定动词 *GROW* 可打得更快，以唤起更快的生长；也可使端点更宽，以暗示更大的生长，如下图所示（Schlenker 2018b）。速度与端点宽度有多个潜在等级，提示此处确有一条规则在起作用。
