      a. Co-speech: His enemy, Asterix won’t ![slapping gesture](../assets/sign-language-semantics/image027-black.png) _punish. $\Rightarrow$ if Asterix were to punish his enemy, slapping would be involved
    step1: TBD
    step2: TBD
