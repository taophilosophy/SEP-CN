  - id: 94
    kind: body
    source: |-
      In the classic analysis of indexicals developed by Kaplan (1989), the value of an indexical (words like *I*, *here*, and *now*) is determined by a context parameter that crucially doesn’t interact with time and world operators (in other words, the context parameter is not shiftable). The empirical force of this idea can be illustrated by the distinction between *I*, an indexical, and *the person speaking*, which is indexical-free. *The speaker is always late* may, on one reading, refer to different speakers in different situations because *speaker* can be evaluated relative to a time quantified by *always*. Similarly, *The speaker must be late* can be uttered even if one has no idea who the speaker is supposed to be; this is because *speaker* can be evaluated relative to a world quantified by *must*. By contrast, *I am always late* and *I must be late* disallow such a dependency because *I* is dependent on the context parameter alone, not on time and world quantification. This analysis raises a question: are there any operators that can manipulate the context of evaluation of indexicals? While such operators can be defined for a formal language, Kaplan famously argued that they do not exist in natural language and called them, for this reason, ‘monsters’.
    step1: |-
      在 Kaplan (1989) 提出的经典指示词分析中，指示词（*I*、*here*、*now* 这类词）的值由语境参数决定，而语境参数关键地不与时间算子与世界算子互动（换言之，语境参数不可移位）。这一观念的经验力量可由 *I*（一个指示词）与 *the person speaking*（不含指示词）之间的区分来说明。*The speaker is always late* 在一种读法上可以指不同情境中的不同说话者，因为 *speaker* 可以相对于 *always* 所量化的时间得到求值。类似地，即使人们完全不知道说话者应该是谁，也可以说出 *The speaker must be late*；这是因为 *speaker* 可以相对于 *must* 所量化的世界得到求值。相反，*I am always late* 与 *I must be late* 不允许这种依赖，因为 *I* 只依赖语境参数，不依赖时间量化与世界量化。这一分析提出一个问题：是否存在能够操纵指示词求值语境的算子？虽然这种算子可以为形式语言定义，Kaplan 却著名地论证自然语言中不存在，并因此称之为“怪物”（monsters）。
    step2: |-
      在 Kaplan (1989) 的经典指示词分析中，指示词（*I*、*here*、*now* 一类词）的值由语境参数决定，而语境参数关键地不与时间算子、世界算子互动（换言之，语境参数不可移位）。这一观念的经验力量可由 *I*（指示词）与 *the person speaking*（不含指示词）之别说明。*The speaker is always late* 在一种读法上可指不同情境中的不同说话者，因为 *speaker* 可相对于 *always* 量化的时间求值。类似地，即使完全不知说话者是谁，也可说出 *The speaker must be late*；这是因为 *speaker* 可相对于 *must* 量化的世界求值。相反，*I am always late* 与 *I must be late* 不允许这种依赖，因为 *I* 只依赖语境参数，不依赖时间量化与世界量化。此分析引出一个问题：是否存在能操纵指示词求值语境的算子？这种算子虽可为形式语言定义，Kaplan 却著名地论证自然语言中并无此类算子，并因此称之为“怪物”（monsters）。
  - id: 95
    kind: body
    source: |-
      Against this claim, an operator of ‘context shift’ (a Kaplanian monster) has been argued to exist in several spoken languages (including Amharic and Zazaki). The key observation was that some indexicals can be shifted in the scope of some attitude verbs, and in the absence of quotation (e.g., Anand & Nevins 2004; Anand 2006; Deal 2020)[^anand-2004][^anand-2006][^deal-2020]. Schematically, in such languages, *Ann says that I am a hero* can mean that Ann says that she herself is a hero, with *I* interpreted from Ann’s perspective. Several researchers have argued that context shift can be overt in sign language, and realized by an operation called ‘Role Shift’, whereby the signer rotates her body to adopt the perspective of another character (Quer 2005, 2013; Schlenker 2018a)[^quer-2005][^schlenker-2018a].
    step1: |-
      针对这一主张，有论证认为“语境移位”算子（一种 Kaplan 式怪物）存在于若干口语中（包括阿姆哈拉语与扎扎其语）。关键观察是：某些指示词可以在某些态度动词的辖域内、且在没有引号的情况下发生移位（如 Anand & Nevins 2004; Anand 2006; Deal 2020）。示意地说，在这类语言中，*Ann says that I am a hero* 可以表示 Ann 说她自己是个英雄，其中 *I* 从 Ann 的视角解释。若干研究者论证，语境移位在手语中可以是显性的，并由一种称为“角色转换”（Role Shift）的操作实现：手语者转动身体，采取另一人物的视角（Quer 2005, 2013; Schlenker 2018a）。
    step2: |-
      针对此主张，有论证认为“语境移位”算子（一种 Kaplan 式怪物）存在于若干口语中（包括阿姆哈拉语与扎扎其语）。关键观察是：某些指示词可在某些态度动词辖域内、且无引号的情况下发生移位（如 Anand & Nevins 2004; Anand 2006; Deal 2020）。示意地说，在这类语言中，*Ann says that I am a hero* 可表示 Ann 说她自己是个英雄，其中 *I* 从 Ann 的视角解释。若干研究者论证，语境移位在手语中可以是显性的，并由称为“角色转换”（Role Shift）的操作实现：手语者转动身体，采取另一人物的视角（Quer 2005, 2013; Schlenker 2018a）。
