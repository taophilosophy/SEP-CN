    source: |-
      Formally, *SOMETIMES* can be seen as an existential quantifier over temporal situations, so the first sentence is semantically existential: *there are situations in which I win*. The pointing sign thus displays cross-sentential anaphora, depending on a temporal existential quantifier that appears in a preceding sentence. A further point made by Chinese Sign Language (but not by the ASL example above) is that loci may be ordered on a temporal line, with the result that not just the loci but also their ordering can be made visible (Lin et al. 2021)[^lin-2021].
    step1: |-
      形式上，*SOMETIMES* 可视为对时间情境的存在量化，因此第一句在语义上是存在性的：*存在我获胜的情境*。指点手势由此呈现跨句回指，依赖前一句中出现的时间存在量词。中国手语（而非上述 ASL 例子）进一步表明，位点可以排布在一条时间线上，其结果是不仅位点本身、连位点的次序也可以显性化（Lin et al. 2021）。
    step2: |-
      形式上，*SOMETIMES* 可视为对时间情境的存在量化，故第一句在语义上是存在性的：*存在我获胜的情境*。指点手势由此呈现跨句回指，依赖前句出现的时间存在量词。中国手语（而非上述 ASL 例）进一步表明：位点可排布在一条时间线上，从而不仅位点本身，连其次序也可显性化（Lin et al. 2021）。
