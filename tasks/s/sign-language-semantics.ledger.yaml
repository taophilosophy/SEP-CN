      In sum, some constructions of LIS provide evidence for the existence of degree-denoting pronouns in sign language, which in turn suggests that natural language is sometimes committed to the existence of degrees. And if one grants that loci are the realization of variables, one obtains the further conclusion that natural language has at least some degree-denoting variables. (It is a separate question whether all languages *avail* themselves of degree variables; see Beck et al. 2009 for the hypothesis that this is a parameter of semantic variation.)[^beck-2009]
    step1: |-
      总之，LIS 的某些构造为手语中存在指称程度的代词提供了证据，这反过来提示自然语言有时承诺程度的存在。若再承认位点是变量的实现，便可进一步得出结论：自然语言至少有一些指称程度的变量。（是否所有语言都*利用*程度变量，是另一个问题；关于这构成语义变异的一个参数这一假设，见 Beck et al. 2009。）
    step2: |-
      总之，LIS 的某些构造为手语中程度代词的存在提供了证据，进而提示自然语言有时承诺程度的存在。若再承认位点是变量的实现，便可进一步得出：自然语言至少有一些程度变量。（是否所有语言都*利用*程度变量是另一个问题；关于这构成语义变异的一个参数这一假设，见 Beck et al. 2009。）
