    source: |-
      Sign languages (in the plural: there are many) arise naturally as soon as groups of deaf people have to communicate with each other. Sign languages became institutionally established starting in the late eighteenth century, when schools using sign languages were founded in France, and spread across different countries, gradually leading to a golden age of Deaf culture (we capitalize *Deaf* when talking about members of a cultural group, and use *deaf* for the audiological status). This came to a partial halt in 1880, when the Milan Congress declared that oral education was superior to sign language education (Lane 1984)[^lane-1984]—a view that is amply refuted by research (Napoli et al. 2015)[^napoli-2015]. While sign languages continued to be used in Deaf education in some countries (e.g., the United States), it was only in the 1970s that a Deaf Awakening gave renewed prominence to sign languages in the western world (see Lane 1984 for a broader history)[^lane-1984].
    step1: |-
      手语（要说复数：手语有很多种）在失聪群体不得不相互交流时便自然产生。手语自 18 世纪晚期起获得建制性地位：法国创办了以手语授课的学校，随后传布各国，逐渐迎来聋人文化的黄金时代（谈论文化群体的成员时我们把 *Deaf* 大写，谈论听力学状态时则用 *deaf*）。这一进程在 1880 年部分中断：米兰会议宣布口语教育优于手语教育（Lane 1984）[^lane-1984]——这一看法已被研究充分驳倒（Napoli et al. 2015）[^napoli-2015]。尽管在若干国家（如美国）的聋人教育中手语仍被使用，但直到 1970 年代，一场“聋人觉醒”才使手语在西方世界重新占据显要地位（更宏观的历史见 Lane 1984）[^lane-1984]。
    step2: |-
      手语（复数言之：手语有很多种）在失聪群体不得不相互交流时便自然产生。18 世纪晚期起，法国创办以手语授课的学校，手语由此获得建制性地位，继而传布各国，逐渐迎来聋人文化的黄金时代（谈文化群体成员时 *Deaf* 大写，谈听力学状态则用 *deaf*）。此进程在 1880 年部分中断：米兰会议宣布口语教育优于手语教育（Lane 1984）[^lane-1984]——此说已被研究充分驳倒（Napoli et al. 2015）[^napoli-2015]。尽管在若干国家（如美国）的聋人教育中手语仍在使用，但直到 1970 年代，一场“聋人觉醒”才使手语在西方世界重占显要地位（更宏观的历史见 Lane 1984）[^lane-1984]。
  - id: 2
    kind: body
    source: |-
      Besides their essential role in Deaf culture and education, sign languages have a key role to play for linguistics in general and for semantics in particular. Despite earlier misconceptions that denied them the status of full-fledged languages, their grammar, their expressive possibilities, and their brain implementation are overall strikingly similar to those of spoken languages (Sandler & Lillo-Martin 2006; MacSweeney et al. 2008)[^macsweeney-2008][^sandler-2006]. In other words, human language exists in two modalities, signed and spoken, and any general theory must account for both, a view that is accepted in all areas of linguistics.
    step1: |-
      除在聋人文化与教育中的核心地位外，手语对一般语言学、对语义学尤其也有关键作用。尽管早先的误解曾否认它们是完备的语言，但它们的语法、表达可能性与大脑实现方式，总体上与口语惊人地相似（Sandler & Lillo-Martin 2006; MacSweeney et al. 2008）[^macsweeney-2008][^sandler-2006]。换言之，人类语言存在于两种模态——手语模态与口语模态——任何一般理论都必须同时说明二者；这一观点为语言学所有领域所接受。
    step2: |-
      除在聋人文化与教育中的核心地位外，手语对一般语言学、对语义学尤其也有关键作用。早先的误解曾否认其为完备语言，但它们的语法、表达可能性与大脑实现方式，总体上与口语惊人地相似（Sandler & Lillo-Martin 2006; MacSweeney et al. 2008）[^macsweeney-2008][^sandler-2006]。换言之，人类语言存在于两种模态——手语与口语——任何一般理论都必须兼摄二者；此点已为语言学所有领域接受。
  - id: 3
    kind: body
    source: |-
      Cross-linguistic semantics is thus naturally concerned with sign languages. In addition, sign languages (or ‘sign’ for short) raise several foundational questions. These include cases of ‘Logical Visibility’, cases of iconicity, and the potential universal accessibility of certain properties of the sign modality.
    step1: |-
      跨语言语义学于是自然地关涉手语。此外，手语（或简作“sign”）还提出若干基础性问题，包括“逻辑可见性”诸案例、象似性诸案例，以及手语模态某些性质潜在地普适可及的问题。
    step2: |-
      跨语言语义学于是自然地关涉手语。此外，手语（或简作“sign”）还提出若干基础性问题：如“逻辑可见性”诸案例、象似性诸案例，以及手语模态某些性质是否潜在普适可及。
  - id: 4
    kind: body
    source: |-
      Historically, a number of notable early works in sign language semantics have taken a similar argumentative form, proposing that certain key components of Logical Forms that are covert in speech sometimes have an overt reflex in sign (‘Logical Visibility’). Such arguments have been formulated for diverse phenomena such as variables, context shift, and telicity. Their semantic import is clear: if a logical element is indeed overtly realized, it has ramifications for the inventory of the logical vocabulary of human language, and indirectly for the types of entities that must be postulated in semantic models (‘natural language ontology’, Moltmann 2017)[^moltmann-2017]. Moreover, when a given element has an overt reflex, one can directly manipulate it in order to investigate its interaction with other parts of the grammar.
    step1: |-
      历史上，手语语义学的若干著名早期作品采用了类似的论证形式：提出某些在口语中隐而不显的逻辑形式（Logical Form）关键成分，在手语中有显性的对应物（“逻辑可见性”）。这类论证已被就变量、语境移位、终结性等不同现象提出。其语义蕴涵清楚：若某逻辑成分确实显性实现，则这对人类语言的逻辑词库构成影响，也间接影响语义模型中必须假设的实体类型（“自然语言本体论”，Moltmann 2017）[^moltmann-2017]。而且，当某一成分有显性对应物时，人们可以直接操纵它，以考察它与语法其他部分的互动。
    step2: |-
      历史上，手语语义学的若干著名早期作品取了类似论证形式：某些在口语中隐而不显的逻辑形式关键成分，在手语中有显性对应物（“逻辑可见性”）。变量、语境移位、终结性等不同现象上都曾提出此类论证。其语义分量是清楚的：若某逻辑成分确实显性实现，便牵动人类语言的逻辑词库，也间接牵动语义模型中须假设的实体类型（“自然语言本体论”，Moltmann 2017）[^moltmann-2017]。且当某成分有显性对应物时，人们可直接操纵它，考察它与语法其他部分的互动。
  - id: 5
    kind: body
    source: |-
      Arguments based on Logical Visibility are certainly not unique to sign language (e.g., see for instance Matthewson 2001 and Cable 2011 (see Other Internet Resources) for the importance of semantic fieldwork for spoken languages), nor do they entail that sign languages as a class will make visible the same set of logical elements. Nevertheless, a notable finding from cross-linguistic work on sign languages is that a number of the logical elements implicated in these discussions do indeed appear with a similar morphological expression across a large number of historically unrelated sign languages. Such observations invite deeper speculation about what it is about the signed modality that makes certain logical elements likely to appear in a given form.
    step1: |-
      基于逻辑可见性的论证当然并非手语所独有（例如 Matthewson 2001 与 Cable 2011（见其他网络资源）就口语中语义田野工作的重要性所论），也不意味着手语作为一类都会使同一组逻辑成分可见。尽管如此，手语跨语言研究的一个显著发现是：这些讨论所涉的若干逻辑成分，确实在大量历史上无关的手语中以相似的形态表现出现。这类观察引人深思：究竟是手语模态的什么特质，使某些逻辑成分容易以特定形式出现。
    step2: |-
      基于逻辑可见性的论证当然非手语独有（例如 Matthewson 2001 与 Cable 2011（见其他网络资源）论口语语义田野工作之重要），也不蕴含手语作为一类皆使同一组逻辑成分可见。尽管如此，手语跨语言研究的一个显著发现是：这些讨论所涉的若干逻辑成分，确实在大量历史上无关的手语中以相似形态出现。这类观察引人深思：手语模态的何种特质，使某些逻辑成分易以特定形式出现。
  - id: 6
    kind: body
    source: |-
      A second thread of semantically-relevant research relates to the observation that sign languages make rich use of iconicity (Liddell 2003; Taub 2001; Cuxac & Sallandre 2007)[^cuxac-2007][^liddell-2003][^taub-2001], the property by which a symbol resembles its denotation by preserving some its structural properties. Sign language iconicity raises three foundational questions. First, some of the same semantic elements that are implicated in arguments for Logical Visibility turn out to be employed and manipulated in the expression of concrete or abstract iconic relations (e.g., pictorial uses of individual-denoting expressions; scalar structure; mereological structure), thus suggesting that logical and iconic notions are intertwined at the core of sign language. Second, sign languages have designated conventional words (‘classifier predicates’) whose position or movement must be interpreted iconically; this calls for an integration of techniques from pictorial semantics into natural language semantics (Schlenker 2018a; Schlenker & Lamberton forthcoming)[^schlenker-2018a]. Finally, this high degree of iconicity raises questions about the comparison between speech and sign, with the possibility that, along iconic dimensions, the latter is expressively richer (Goldin-Meadow & Brentari 2017; Schlenker 2018a)[^goldin-meadow-2017][^schlenker-2018a].
    step1: |-
      与语义相关的第二条研究线索，关涉这一观察：手语大量使用象似性（iconicity）（Liddell 2003; Taub 2001; Cuxac & Sallandre 2007）[^cuxac-2007][^liddell-2003][^taub-2001]——即符号通过保留其指称对象某些结构属性而与之相似的特性。手语的象似性提出三个基础性问题。其一，支持逻辑可见性论证的某些语义成分，原来也用于表达具体或抽象的象似关系，并被加以操纵（例如以指称个体的表达式作图画式使用；标量结构；部分—整体结构），这提示逻辑概念与象似概念在手语核心处相互交织。其二，手语有专门的约定词（“类标记谓语”），其位置或移动必须作象似解释；这要求把图画语义学的技术整合进自然语言语义学（Schlenker 2018a; Schlenker & Lamberton forthcoming）[^schlenker-2018a]。最后，如此高的象似程度引出关于口语与手语之比较的问题：沿着象似这一维度，后者在表达上可能更为丰富（Goldin-Meadow & Brentari 2017; Schlenker 2018a）[^goldin-meadow-2017][^schlenker-2018a]。
    step2: |-
      与语义相关的第二条线索，关涉如下观察：手语大量运用象似性（iconicity）（Liddell 2003; Taub 2001; Cuxac & Sallandre 2007）[^cuxac-2007][^liddell-2003][^taub-2001]——符号保留其指称对象的某些结构属性，因而与之相似。手语象似性引出三个基础问题。其一，支持逻辑可见性论证的某些语义成分，原来也用于表达具体或抽象的象似关系并受操纵（如指称个体表达式的图画式用法、标量结构、部分—整体结构），可见逻辑概念与象似概念在手语核心处交织。其二，手语有专门的约定词（“类标记谓语”），其位置或移动须作象似解释；这要求把图画语义学的技术并入自然语言语义学（Schlenker 2018a; Schlenker & Lamberton forthcoming）[^schlenker-2018a]。最后，象似程度如此之高，引出比较口语与手语的问题：沿象似维度，后者表达或更丰富（Goldin-Meadow & Brentari 2017; Schlenker 2018a）[^goldin-meadow-2017][^schlenker-2018a]。
  - id: 7
    kind: body
    source: |-
      Possibly due in part to the above factors, sign languages—even when historically unrelated—behave as a coherent language family, with several semantic properties in common that are not generally shared with spoken languages (Sandler & Lillo-Martin 2006)[^sandler-2006]. Furthermore, some of these properties occasionally seem to be ‘known’ by individuals that do not have access to sign language; these include hearing non-signers and also deaf homesigners (i.e., deaf individuals that are not in contact with a Deaf community and thus have to invent signs to communicate with their hearing environment). Explaining this convergence is a key theoretical challenge.
    step1: |-
      部分由于上述因素，手语——即便历史上彼此无关——表现得像一个连贯的语系，共享若干一般不与口语共享的语义性质（Sandler & Lillo-Martin 2006）[^sandler-2006]。此外，其中一些性质有时似乎被无法接触手语的个体所“知晓”：这些个体包括听力正常的非手语者，也包括失聪的家庭手语者（即未与聋人社群接触、因而不得不自创手势与听人环境交流的失聪者）。解释这种趋同是一项关键的理论挑战。
    step2: |-
      部分缘于上述因素，手语——即便历史上彼此无关——仍表现得像一个连贯语系，共享若干通常不为口语所有的语义性质（Sandler & Lillo-Martin 2006）[^sandler-2006]。此外，其中某些性质有时似被无法接触手语者所“知”：此类个体既有听力正常的非手语者，也有失聪的家庭手语者（未与聋人社群接触、只得自创手势与听人环境交流的失聪者）。解释这一趋同，是关键的理论难题。
  - id: 8
    kind: body
    source: |-
      Besides semantics proper, sign raises important questions for the analysis of information structure, notably topic and focus. These are often realized by way of facial articulators, including raised eyebrows, which have sometimes been taken to play the same role as some intonational properties of speech (e.g., Dachkovsky & Sandler 2009)[^dachkovsky-2009]. For reasons of space, we leave these issues aside in what follows.
    step1: |-
      除语义学本身之外，手语还对信息结构的分析提出重要问题，尤其是话题与焦点。这些往往通过面部发音器官实现，包括扬眉；有人曾认为它们与口语的某些语调性质起相同作用（如 Dachkovsky & Sandler 2009）[^dachkovsky-2009]。因篇幅所限，下文将这些问题搁置。
    step2: |-
      除语义学本身，手语于信息结构分析亦提出重要问题，尤以话题与焦点为著。二者常借面部发音器官实现（如扬眉），有人以为它们与口语的某些语调性质同功（Dachkovsky & Sandler 2009）[^dachkovsky-2009]。篇幅所限，下文从略。
