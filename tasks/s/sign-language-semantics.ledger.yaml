      ![small oval containing 'Sublocus a: students that came to class'; larger oval containing the small oval and also the the text 'Complement locus b: students that didn't come'; text outside both 'Large locus ab: (relevant) students'.](../assets/sign-language-semantics/image020.svg)
    step1: TBD
