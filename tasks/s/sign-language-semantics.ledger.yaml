      In light of these data, the claim of Logical Visibility is that sign language loci (when used—for they need not be) are an overt realization of logical variables.
    step1: |-
      依据这些数据，逻辑可见性主张是：手语位点（在使用时，因为它们并非必须使用）是逻辑变量的一种显性实现。
    step2: |-
      就此类数据而言，逻辑可见性主张是：手语位点（在使用时，它们并非必须使用）是逻辑变量的显性实现。
  - id: 44
    kind: body
    source: |-
      One potential objection is that pointing in sign might be very different from pronouns in speech: after all, one points when speaking, but pointing gestures are not pronouns. However this objection has little plausibility in view of formal constraints that are shared between pointing signs and spoken language pronouns. For example, pronouns in speech are known to follow grammatical constraints that determine which terms can be used in which environments (e.g., the non-reflexive pronoun *her* when the antecedent is ‘far enough’ vs. the reflexive pronoun *herself* when the antecedent is ‘close enough’). Pointing signs obey similar rules, and enter into an established typology of cross-linguistic variation. For instance, the ASL reflexive displays the same kinds of constraints as the Mandarin reflexive pronoun in terms of what counts as ‘close enough’ (see Wilbur 1996; Koulidobrova 2009; Kuhn 2021)[^koulidobrova-2009][^kuhn-2021][^wilbur-1996].
    step1: |-
      一个潜在的异议是，手语中的指点可能与口语中的代词大不相同：毕竟人们说话时也会指点，但指点手势并不是代词。然而，鉴于指点手势与口语代词共享形式约束，这一异议没什么说服力。例如，口语代词遵循语法约束，决定哪些词项可用于哪些环境（如先行语“足够远”时用非反身代词 *her*，“足够近”时用反身代词 *herself*）。指点手势服从类似规则，并进入一个既定的跨语言变异类型学。例如，ASL 的反身形式在何谓“足够近”方面与汉语普通话的反身代词呈现相同类型的约束（见 Wilbur 1996; Koulidobrova 2009; Kuhn 2021）。
    step2: |-
      一种潜在异议认为，手语中的指点或许与口语代词大不相同：说话时人也会指点，但指点手势并不是代词。然而，指点手势与口语代词共享形式约束，此异议因此难以成立。口语代词遵循语法约束，决定哪些词项可用于哪些环境（如先行语“足够远”时用非反身代词 *her*，“足够近”时用反身代词 *herself*）。指点手势服从类似规则，并进入既定的跨语言变异类型学。例如，在何谓“足够近”上，ASL 反身式与汉语普通话反身代词呈现同类约束（见 Wilbur 1996; Koulidobrova 2009; Kuhn 2021）。
