    kind: body
    source: |-
      A second refinement pertains to the syntax. Across sign languages, classifier constructions have been shown to sometimes override the basic word order of the language; for instance, ASL normally has the default word order SVO (Subject Verb Object), but classifier predicates usually prefer preverbal objects instead. One possible explanation is that the non-standard syntax of classifiers arises at least in part from their iconic semantics; we revisit this point in Section 5.3.
    step1: TBD
    step2: TBD
  - id: 191
    kind: body
    source: |-
      ## 5. Sign with Iconicity versus Speech with Gestures
    step1: TBD
    step2: TBD
  - id: 192
    kind: body
    source: |-
      ### 5.1 Reintegrating gestures in the sign/speech comparison
    step1: TBD
    step2: TBD
  - id: 193
    kind: body
    source: |-
      The iconic contributions discussed above are to some extent different from those found in speech. Iconic modulations exist in speech (e.g., *looong* means ‘very long’) but are probably less diverse than those found in sign. Repetition-based plurals and pluractionals exist in speech (Rubino 2013)[^rubino-2013], and it has been argued for pluractional ideophones in some languages, that the number of repetitions can reflect the number of denoted events (Henderson 2016)[^henderson-2016]. But sign language repetitions can iconically convey a particularly rich amount of information, including through their punctuated or unpunctuated nature, and sometimes their arrangement in space (Schlenker & Lamberton 2022)[^schlenker-2022]. As for iconic pronouns and classifier predicates, they simply have no clear counterparts in speech. From this perspective, speech appears to be ‘iconically deficient’ relative to sign.
    step1: TBD
    step2: TBD
  - id: 194
    kind: body
    source: |-
      But Goldin-Meadow and Brentari (2017) have argued that a typological comparison between sign language and spoken language makes little sense if it does not take gestures into account: sign with iconicity should be compared to speech with gestures rather than to speech alone, since gestures are the main exponent of iconic enrichments in spoken language. This raises a question: From a semantic perspective, does speech with gesture have the same expressive effect and the same grammatical integration as sign with iconicity?
    step1: TBD
    step2: TBD
  - id: 195
    kind: body
    source: |-
      ### 5.2 Typology of iconic contributions in speech and in sign
    step1: TBD
    step2: TBD
  - id: 196
    kind: body
    source: |-
      This question has motivated a systematic study of iconic enrichments across sign and speech, and has led to the discovery of fine-grained differences (Schlenker 2018b)[^schlenker-2018b]. The key issue pertains to the place of different iconic contributions in the typology of inferences, which includes at-issue contributions and non-at-issue ones, notably presuppositions and supplements (the latter are the semantic contributions of appositive relative clauses).
    step1: TBD
    step2: TBD
  - id: 197
    kind: body
    source: |-
      While detailed work is still limited, several iconic constructions in sign language have been argued to make at-issue contributions (sometimes alongside non-at-issue ones). This is the case of iconic modulations of verbs, as for *GROW* in (18), of repetition-based plurals and pluractionals, and of classifier predicates.
    step1: TBD
    step2: TBD
  - id: 198
    kind: body
    source: |-
      By contrast, gestures that accompany spoken words have been argued in several studies (starting with the pioneering one by Ebert & Ebert 2014 – see Other Internet Resources) to make primarily non-at-issue contributions. Recent typologies (e.g., Schlenker 2018b; Barnes & Ebert 2023)[^barnes-2023][^schlenker-2018b] distinguish between co-speech gestures, which co-occur with the spoken words they modify (a slapping gesture co-occurs with *punish* in (31a); post-speech gestures, which follow the words they modify (the gesture follows *punish* in (31b); and pro-speech gestures, which fully replace some words (the slapping gestures has the function of a verb in (31c).
    step1: TBD
    step2: TBD
  - id: 199
    kind: body
    source: |-
      **(31)**
    step1: TBD
    step2: TBD
  - id: 200
    kind: body
    source: |-
      a. Co-speech: His enemy, Asterix will ![slapping gesture](../assets/sign-language-semantics/image027-black.png) _punish.
    step1: TBD
    step2: TBD
  - id: 201
    kind: body
    source: |-
      **b.**
    step1: TBD
    step2: TBD
  - id: 202
    kind: body
    source: |-
      Post-speech: His enemy, Asterix will punish— ![slapping gesture](../assets/sign-language-semantics/image027-black.png) .
    step1: TBD
    step2: TBD
  - id: 203
    kind: body
    source: |-
      **c.**
    step1: TBD
    step2: TBD
  - id: 204
    kind: body
    source: |-
      Pro-speech His enemy, Asterix will ![slapping gesture](../assets/sign-language-semantics/image027-black.png) .
    step1: TBD
    step2: TBD
  - id: 205
    kind: body
    source: |-
      When different tests are applied, such as embedding under negation, these three types display different semantic behaviors. Co-speech gestures have been argued to trigger conditionalized presuppositions, as in (32a). Post-speech gestures have been argued to display the behavior of appositive relative clauses, and in particular to be deviant in some negative environments, as illustrated in (32b)–(32b′); in addition, post-speech gestures, just like appositive relative clauses, usually make non-at-issue contributions.
    step1: TBD
    step2: TBD
  - id: 206
    kind: body
    source: |-
      **(32)**
    step1: TBD
