      In the analysis of temporal and modal constructions in speech, there are two broad directions. One goes back to quantified tense logic and modal logic, and takes temporal and modal expressions of natural language to be fundamentally different from individual-denoting expressions: the latter involve the full power of variables and quantifiers, whereas no variables exist in the temporal and modal domain, although operators manipulate implicit parameters. The opposite view is that natural language has in essence the same logical vocabulary across the individual, the temporal and the modal domains, with variables (which may take different forms across different domains) and quantifiers that may bind them (see for instance von Stechow 2004)[^stechow-2004]. This second tradition was forcefully articulated by Partee (1973) for tense and Stone (1997) for mood. Partee’s and Stone’s argument was in essence that tense and mood have virtually all the uses that pronouns do. This suggests, theory-neutrally, that pronouns, tenses and moods have a common semantic core. With the additional assumption that pronouns should be associated with variables, this suggests that tenses and moods should be associated with variables as well, perhaps with time- and world-denoting variables, or with a more general category of situation-denoting variables.
    step1: |-
      在口语中时间构造与模态构造的分析里，有两个大致的方向。一个可追溯到量化时态逻辑与模态逻辑，认为自然语言的时间与模态表达式根本上有别于指称个体的表达式：后者动用变量与量词的全部能力，而时间与模态域中不存在变量，尽管算子操纵着隐含参数。相反的观点认为，自然语言在个体域、时间域与模态域中使用本质上相同的逻辑词库，即变量（在不同域中形式可以不同）与可约束它们的量词（例如见 von Stechow 2004）。第二种传统由 Partee (1973) 就时态、Stone (1997) 就语气作了有力阐述。Partee 与 Stone 的论证实质是：时态与语气几乎具备代词的一切用法。这提示（理论中立地）：代词、时态与语气有一个共同的语义内核。再补充“代词应与变量关联”这一假设，则时态与语气也应与变量关联，或许是时间变量与世界变量，或更一般的情境变量。
    step2: |-
      口语中时间构造与模态构造的分析有两大方向。其一可上溯量化时态逻辑与模态逻辑：自然语言的时间与模态表达式根本上不同于指称个体的表达式，后者动用变量与量词的全部能力，而时间与模态域中并无变量，只有算子操纵隐含参数。相反的观点认为，自然语言在个体域、时间域与模态域使用本质上相同的逻辑词库，即变量（在各域形态可以不同）与约束它们的量词（例如 von Stechow 2004）。第二种传统由 Partee (1973) 论时态、Stone (1997) 论语气作出有力阐述。其论证实质是：时态与语气几乎具备代词的一切用法。这（以理论中立的方式）提示：代词、时态与语气共享一个语义内核。若再加“代词应与变量关联”的假设，则时态与语气也应与变量关联，或是时间变量与世界变量，或是更一般的情境变量。
