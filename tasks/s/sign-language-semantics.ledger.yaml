    source: |-
      Loci often make it possible to disambiguate pronominal reference. For instance, the ambiguity of the example in (2) can be removed in LSF, where the sentence comes in two versions. In both, Sarkozy is assigned a locus on the signer’s left (by way of the index of the left hand held upright, ‘👆_{left}’ below), and Obama a locus on the right (using the index of the right hand held upright, ‘👆_{right}’ below). The verb *tell* in *he (Sarkozy) tells him (Obama)* is realized as a single sign linking the Sarkozy locus on the left to the Obama locus on the right (unlike the ASL version, which just displays object agreement, the LSF version displays both subject and object agreement: ‘_{left}TELL_{right}’ indicates that the sign moves from the Sarkozy locus on the left to the Obama locus on the right). If *he* refers to Sarkozy, the signer points towards the Sarkozy locus on the left (‘👉_{left}’); if *he* refers to Obama, the signer points towards the Obama locus on the right (‘👉_{right}’).
    step1: |-
      位点常常使代词指称的消歧成为可能。例如，(2) 例的歧义在 LSF 中可以消除：该句在 LSF 中有两个版本。两个版本都把左手手语者左侧的一个位点指派给 Sarkozy（用竖起的左手食指，下文记作 ‘👆_{left}’），把右侧的一个位点指派给 Obama（用竖起的右手食指，下文记作 ‘👆_{right}’）。*他（Sarkozy）告诉他（Obama）* 中的动词 *tell* 实现为单个手势，把左侧的 Sarkozy 位点与右侧的 Obama 位点连结起来（与只显示宾语一致的 ASL 版本不同，LSF 版本同时显示主语与宾语一致：‘_{left}TELL_{right}’ 表示该手势从左侧 Sarkozy 位点移动到右侧 Obama 位点）。若 *he* 指 Sarkozy，手语者指向左侧 Sarkozy 位点（‘👉_{left}’）；若 *he* 指 Obama，手语者指向右侧 Obama 位点（‘👉_{right}’）。
    step2: |-
      位点常可消解代词指称的歧义。例如 (2) 的歧义在 LSF 中即可消除：该句在 LSF 中有两个版本。二者都为 Sarkozy 指派手语者左侧一个位点（以竖起的左手食指，下文记 ‘👆_{left}’），为 Obama 指派右侧一个位点（以竖起的右手食指，下文记 ‘👆_{right}’）。*他（Sarkozy）告诉他（Obama）* 中的动词 *tell* 实现为单个手势，把左侧 Sarkozy 位点与右侧 Obama 位点连结起来（ASL 版本只显示宾语一致，LSF 版本则同时显示主语与宾语一致：‘_{left}TELL_{right}’ 表示该手势从左侧 Sarkozy 位点移向右侧 Obama 位点）。若 *he* 指 Sarkozy，手语者指向左侧 Sarkozy 位点（‘👉_{left}’）；若 *he* 指 Obama，则指向右侧 Obama 位点（‘👉_{right}’）。
