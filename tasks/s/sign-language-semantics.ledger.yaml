      **Hypothesis: Logical Visibility** Sign languages can make overt parts of the logical/grammatical vocabulary which (i) have been posited in the analysis of the Logical Form of spoken language sentences, but (ii) are not morphologically realized in spoken languages.
    step1: |-
      **假设：逻辑可见性** 手语能够把逻辑／语法词库的某些部分显性化，这些部分（i）在口语语句逻辑形式的分析中被设定，（ii）在口语中却没有形态实现。
    step2: |-
      **假设：逻辑可见性** 手语可将逻辑／语法词库的某些部分显性呈现出来；这些部分（i）在口语语句逻辑形式的分析中已被设定，（ii）在口语中并无形态实现。
  - id: 13
    kind: body
    source: |-
      Claims of Logical Visibility have been made for logical variables associated with syntactic indices (Lillo-Martin & Klima 1990; Schlenker 2018a)[^lillo-martin-1990][^schlenker-2018a], for context shift operators (Quer 2005, 2013; Schlenker 2018a)[^quer-2005][^schlenker-2018a], and for verbal morphemes relevant to telicity (Wilbur 2003, 2008; Wilbur & Malaia 2008)[^wilbur-2003][^wilbur-2008][^wilbur-2008-2]. In each case, the claim of Logical Visibility has been debated, and many questions remain open.
    step1: |-
      人们曾就与句法索引相关联的逻辑变量（Lillo-Martin & Klima 1990; Schlenker 2018a）、语境移位算子（Quer 2005, 2013; Schlenker 2018a），以及与终结性有关的动词词素（Wilbur 2003, 2008; Wilbur & Malaia 2008）提出逻辑可见性主张。每一情形中，逻辑可见性主张都曾引起争论，许多问题仍悬而未决。
    step2: |-
      逻辑可见性主张曾分别针对句法索引所关联的逻辑变量（Lillo-Martin & Klima 1990; Schlenker 2018a）、语境移位算子（Quer 2005, 2013; Schlenker 2018a）以及与终结性相关的动词词素（Wilbur 2003, 2008; Wilbur & Malaia 2008）提出。每一情形中，此主张均有争议，许多问题至今悬而未决。
