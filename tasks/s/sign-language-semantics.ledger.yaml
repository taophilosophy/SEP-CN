  - id: 116
    kind: body
    source: |-
      In English, iconic modulations can arguably be at-issue and thus interpreted in the scope of grammatical operators. An example is the following sentence: *If the talk is loooong*, *I’ll leave before the end*. This means that if the talk is very long, I’ll leave before the end (but if it’s only moderately long, maybe not); here, the iconic contribution is interpreted in the scope of the *if-*clause, just like normal at-issue contributions. The iconic modulation of *GROW* has similarly been argued to be at-issue (Schlenker 2018b)[^schlenker-2018b]. (See Section 5.2 for further discussion on the at-issue vs. non-at-issue semantic contributions.)
    step1: |-
      在英语中，有论证认为象似调制可以是断言内容（at-issue），因而在语法算子的辖域内得到解释。下句是一例：*If the talk is loooong*, *I’ll leave before the end*. 这意思是：若讲座很长，我会在结束前离开（但若只是中等长，也许不会）；这里象似贡献在 *if* 从句的辖域内得到解释，正如正常的断言内容贡献。*GROW* 的象似调制同样被论证为断言内容（Schlenker 2018b）。（关于断言内容与非断言内容语义贡献的进一步讨论，见 5.2 节。）
    step2: |-
      在英语中，有论证认为象似调制可以是断言内容（at-issue），因而在语法算子辖域内得到解释。下句是一例：*If the talk is loooong*, *I’ll leave before the end*. 意思是：若讲座很长，我会在结束前离开（但若只是中等长，也许不会）；此处象似贡献在 *if* 从句辖域内得到解释，正如正常的断言内容贡献。*GROW* 的象似调制同样被论证为断言内容（Schlenker 2018b）。（断言内容与非断言内容语义贡献的进一步讨论，见 5.2 节。）
  - id: 117
    kind: body
    source: |-
      While conceptually similar to iconic modulations in English, the sign language versions are arguably richer and more pervasive than their spoken language counterparts.
    step1: |-
      虽然概念上类似英语的象似调制，手语版本可以说比其口语对应物更丰富、更普遍。
    step2: |-
      手语版本在概念上类似英语的象似调制，却可以说比口语对应物更丰富、更普遍。
  - id: 118
    kind: body
    source: |-
      ### 3.2 Event structure
    step1: |-
      ### 3.2 事件结构
    step2: |-
      ### 3.2 事件结构
  - id: 119
    kind: body
    source: |-
      Iconic modulation interacts with the marking of telicity noticed by Wilbur (Section 2.1). *GROW*, discussed in the preceding sub-section, is an (atelic) degree achievement; the iconic modifications above indicate the final degree reached and the time it took to reach that degree. Similarly, for telic verbs, the speed and manner in which the phonological movement reaches its endpoint can indicate the speed and manner in which the result state is reached. For example, if LSF *UNDERSTAND* is realized slowly and then quickly, the resulting meaning is that there was a difficult beginning, and then an easier conclusion. Atelic verbs that don’t involve degrees can also be iconically modulated; for instance, if LSF *REFLECT* is signed slowly and then quickly, the resulting meaning is that the person’s reflection intensified. Here too, the iconic contribution has been argued to be at-issue (Schlenker 2018b)[^schlenker-2018b].
    step1: |-
      象似调制与 Wilbur 注意到的终结性标记互动（2.1 节）。上一小节讨论的 *GROW* 是一个（非终结性的）程度达成动词；上述象似修改指示最终达到的程度以及达到该程度所需的时间。类似地，对于终结性动词，音系动作到达终点的速度与方式，可以指示结果状态达到的速度与方式。例如，若 LSF 的 *UNDERSTAND* 先慢后快打出，所得意义是：开头困难，随后结论较易。不涉及程度的非终结性动词也可以作象似调制；例如，若 LSF 的 *REFLECT* 先慢后快打出，所得意义是此人的反思加强了。这里同样有论证认为象似贡献是断言内容（Schlenker 2018b）。
    step2: |-
      象似调制与 Wilbur 注意到的终结性标记互动（2.1 节）。上一小节讨论的 *GROW* 是一个（非终结性的）程度达成动词；上述象似修改指示最终达到的程度以及达到该程度所需的时间。类似地，对于终结性动词，音系动作到达终点的速度与方式可指示结果状态达到的速度与方式。例如，若 LSF 的 *UNDERSTAND* 先慢后快打出，所得意义是：开头困难，随后结论较易。不涉及程度的非终结性动词也可作象似调制；例如，若 LSF 的 *REFLECT* 先慢后快打出，所得意义是此人的反思加强了。这里同样有论证认为象似贡献是断言内容（Schlenker 2018b）。
  - id: 120
    kind: body
    source: |-
      There are also cases in which the event structure is not just specified but radically altered by a modulation, as in the case of incompletive forms (also called unrealized inceptive, Liddell 1984; Wilbur 2008)[^liddell-1984][^wilbur-2008][^wilbur-2008-2]. ASL *DIE*, a telic verb, is expressed by turning the dominant hand palm-down to palm-up as shown below (the non-dominant hand turns palm-up to palm-down). If the hands only turn partially, the sign is roughly interpreted as ‘almost die’.
    step1: |-
      也有案例中，事件结构不只是被指定，而是被调制彻底改变，如不完整体形式（亦称未实现起始体，Liddell 1984; Wilbur 2008）。ASL 的 *DIE*（终结性动词）以惯用手掌心由下转上的方式表达，如下图所示（非惯用手掌心由上转下）。若双手只转动一部分，该手势大致解释为‘差点死’。
    step2: |-
      也有案例中，事件结构不只是被指定，而是被调制彻底改变，如不完整体形式（亦称未实现起始体，Liddell 1984; Wilbur 2008）。ASL 的 *DIE*（终结性动词）以惯用手掌心由下转上的方式表达，如下图所示（非惯用手掌心由上转下）。若双手只转动一部分，该手势大致解释为‘差点死’。
