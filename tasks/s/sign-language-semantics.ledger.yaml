      ## 4. Iconicity II: Classifier Predicates
    step1: TBD
    step2: TBD
  - id: 153
    kind: body
    source: |-
      ### 4.1 The demonstrative analysis of classifier predicates
    step1: TBD
    step2: TBD
  - id: 154
    kind: body
    source: |-
      A special construction type, classifier predicates (‘classifiers’ for short), has raised difficult conceptual questions because they involve a combination of conventional and iconic meaning. Classifier predicates are lexical expressions that refer to classes of animate or inanimate entities that share some physical characteristics—e.g., objects with a flat surface, cylindrical objects, upright individuals, sitting individuals, etc. Their form is conventional; for instance, the ASL ‘three’ handshape, depicted below, represents a vehicle. But their position, orientation and movement in signing space is interpreted iconically and gradiently (Emmorey & Herzig 2003)[^emmorey-2003], as illustrated in the translation of the example below.
    step1: TBD
    step2: TBD
  - id: 155
    kind: body
    source: |-
      **(24)**
    step1: TBD
    step2: TBD
  - id: 156
    kind: body
    source: |-
      CAR CL-vehicle-DRIVE-BY. (ASL, Valli and Lucas 2000) ![right hand with thumb, index, and middle fingers extended moves right to left across the chest](../assets/sign-language-semantics/image022.png) ‘A car drove by [with a movement resembling that of the hand]
    step1: TBD
    step2: TBD
  - id: 157
    kind: body
    source: |-
      These constructions have on several occasions been compared to gestures in spoken language, especially to gestures that fully replace some words, as in: *This airplane is about to FLY-take-off*, with the verb replaced with a a hand gesture representing an airplane taking off. But there is an essential difference: classifier predicates are stable parts of the lexicon, gestures are not.
    step1: TBD
    step2: TBD
  - id: 158
    kind: body
    source: |-
      Early semantic analyses, notably by Zucchi 2011 and Davidson 2015, took classifier predicates to have a self-referential demonstrative component, with the result that the moving vehicle classifier in (24) means in essence ‘move like this’, where ‘this’ makes reference to the very form of the classifier movement. As mentioned in Section 2.2, this analysis has been extended to Role Shift by Davidson (Davidson 2015)[^davidson-2015], who took the classifier to be in this case the signer’s rotated body.
    step1: TBD
    step2: TBD
  - id: 159
    kind: body
    source: |-
      ### 4.2 The pictorial analysis of classifier predicates
    step1: TBD
    step2: TBD
  - id: 160
    kind: body
    source: |-
      The demonstrative analysis of classifier predicates as stated has two general drawbacks. First, it establishes a natural class containing classifiers and demonstratives (like English *this*), but the two phenomena possibly display different behaviors. Notably, while demonstratives behave roughly like free variables that can pick up their referent from any of a number of contextual sources, the iconic component of classifiers can only refer to the position/movement and configuration of the hand (any demonstrative variable is thus immediately saturated). Second, the demonstrative analysis currently relegates the iconic component to a black box. Without any interpretive principles on what it means for an event to be ‘like’ the demonstrated representation, one cannot provide any truth conditions for the sentence as a whole.
    step1: TBD
    step2: TBD
  - id: 161
    kind: body
    source: |-
      Any complete analysis must thus develop an explicit semantics for the iconic component. This is more generally necessary to derive explicit truth conditions from other iconic constructions in sign language, such as the repetition-based plurals discussed in Section 3.3. above: in the metalanguage, the condition *[a certain expression] iconically represents [a certain object]* was in need of explication.
    step1: TBD
    step2: TBD
  - id: 162
    kind: body
    source: |-
      A recent model has been offered by formal pictorial semantics, developed by Greenberg and Abusch (e.g., Greenberg 2013, 2021; Abusch 2020)[^abusch-2020][^greenberg-2013]. The basic idea is that a picture obtained by a given projection rule (for instance, perspective projection) is true of precisely those situations that can project onto the picture. Greenberg has further extended this analysis with the notion of an object projecting onto a picture part (in addition to a situation projecting onto a whole picture). This notion proves useful for sign language applications because they usually involve partial iconic representations, with one iconic element representing a single object or event in a larger situation. To illustrate, below, the picture in (25a) is true of the situation in (25b), and the left-most shape in the picture in (25a) denotes the top cube in the situation in (25b).
    step1: TBD
    step2: TBD
  - id: 163
    kind: body
    source: |-
      **(25)**
    step1: TBD
    step2: TBD
  - id: 164
    kind: body
    source: |-
      Illustration of a projection rule relating (parts of) a picture to (objects in) a world. (*Credits:* Gabriel Greenberg) ![Drawing of two cubes with the left (and front) one partially obscuring the back one.](../assets/sign-language-semantics/picture-world-1.svg) (a) Picture ![a two dimensional view of (a) from above labeled 'world w'. On the left is a point labeled 'viewpoint v' on the right are three squares with the top (and left) one corresponding to the left block of (a), a bottom square, and to the right of both a small square. From viewpoint v, two lines extend to the top and bottom corners to the top left square which indicate that part of the bottom square and all of the small square are obscured.](../assets/sign-language-semantics/picture-world-2.svg) (b) Situation
    step1: TBD
    step2: TBD
  - id: 165
    kind: body
    source: |-
      The full account makes reference to a notion of viewpoint relative to which perspective projection is assessed, and a picture plane, both represented in (25b). This makes it possible to say that the top cube (top-cube) projects onto the left-hand shape (left-shape) relative to the viewpoint (call it π), at the time *t* and in the world *w* in which the projection is assessed. In brief:

      $$ \textrm{proj}(\textrm{top-cube}, \pi, t, w) = \textrm{left-shape}. $$
    step1: TBD
    step2: TBD
  - id: 166
    kind: body
    source: |-
      Classifier predicates (as well as other iconic constructions, such as repetition-based plurals) may be analyzed with a version of pictorial semantics to explicate the truth-conditional contribution of iconic elements.
    step1: TBD
    step2: TBD
  - id: 167
    kind: body
    source: |-
      To illustrate, consider a pair of minimally different words in ASL that can be translated as ‘airplane’: one is a normal noun, glossed as *PLANE*, and the other is a classifier predicate, glossed below as *PLANE-cl*. Both forms involve the handshape in (26), but the normal noun includes a tiny repetition (different from that of plurals) which is characteristic of some nominals in ASL. As we will see, the position of the classifier version is interpreted iconically (‘an airplane in position such and such’), whereas the nominal version need not be.
    step1: TBD
    step2: TBD
  - id: 168
    kind: body
    source: |-
      **(26)**
    step1: TBD
    step2: TBD
  - id: 169
    kind: body
    source: |-
      Handshape for both (i) ASL *PLANE* (= nominal version) and (ii) ASL *PLANE-cl* (= classifier predicate version). (*Credits:* J. Kuhn) ![hand with thumb, index, and little fingers extended and other two not.](../assets/sign-language-semantics/image026.png)
    step1: TBD
    step2: TBD
  - id: 170
    kind: body
    source: |-
      Semantically, the difference between the two forms is that only the classifier generates obligatory iconic inferences about the plane’s configuration and movement. This has clear semantic consequences when several classifier predicates occur in the same sentence. In (27b), two tokens of *PLANE-cl* appear in positions *a* and *b*, and as the video makes clear, the two classifiers are signed close to each other and in parallel. As a result, the sentence only makes an assertion about cases in which two airplanes take off next to each other or side by side. In contrast, with a normal noun in (27a), the assertion is that there is danger whenever two airplanes take off at the same time, irrespective of how close the two airplanes are, or how they are oriented relative to each other.
    step1: TBD
    step2: TBD
