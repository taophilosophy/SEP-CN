  - id: 99
    kind: body
    source: |-
      Role Shift exists in several languages, and in some cases (notably in Catalan and German sign languages [Quer 2005; Herrmann & Steinbach 2012])[^herrmann-2012][^quer-2005], it has been argued not to involve mere quotation. On the context-shifting analysis of Role Shift (e.g., Quer 2005, 2013)[^quer-2005], the point at which the signer rotates her body corresponds to the insertion of a context-shifting operator C, yielding the representation: WIFE SAY C [**IX-2 FINE**]. The boldfaced words are signed in rotated position and are taken to be interpreted in the scope of C.
    step1: |-
      角色转换存在于若干语言中，在某些情形下（尤其是加泰罗尼亚手语与德国手语 [Quer 2005; Herrmann & Steinbach 2012]），有论证认为它并不只是引用。按角色转换的语境移位分析（如 Quer 2005, 2013），手语者转动身体的时点对应语境移位算子 C 的插入，得到表示：WIFE SAY C [**IX-2 FINE**]。粗体词以转动后的位置打出，并被解释为处于 C 的辖域内。
    step2: |-
      角色转换存在于若干语言中，在某些情形下（尤其是加泰罗尼亚手语与德国手语 [Quer 2005; Herrmann & Steinbach 2012]），有论证认为它并不只是引用。按角色转换的语境移位分析（如 Quer 2005, 2013），手语者转动身体的时点对应语境移位算子 C 的插入，得到表示：WIFE SAY C [**IX-2 FINE**]。粗体词以转动后的位置打出，解释为处于 C 的辖域内。
