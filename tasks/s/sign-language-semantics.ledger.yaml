      ### 2.1 Telicity
    step1: |-
      ### 2.1 终结性
    step2: |-
      ### 2.1 终结性
  - id: 78
    kind: body
    source: |-
      Semanticists traditionally classify event descriptions as *telic* if they apply to events that have a natural endpoint determined by that description, and they call them *atelic* otherwise. *Ann arrived* and *Mary understood* have such a natural endpoint, e.g., the point at which Ann reached her destination, and that at which Mary saw the light, so to speak: *arrive* and *understand* are telic. By contrast, *Ann waited* and *Mary thought* lack such natural endpoints: *wait* and *think* are atelic. As a standard test (e.g., Rothstein 2004)[^rothstein-2004], a temporal modifier of the form *in X time* modifies telic VPs while *for X time* modifies atelic VPs (e.g., *Ann arrived in five minutes* vs. *Ann waited for five minutes*, *Mary understood in a second* vs. *Mary thought for a second*).
    step1: |-
      语义学传统上把事件描述分为*终结性*（telic）：若其适用于具有由该描述所决定的自然终点的事件；否则称为*非终结性*（atelic）。*Ann arrived* 与 *Mary understood* 有这种自然终点，例如 Ann 到达目的地的时点、Mary 恍然大悟的时点：*arrive* 与 *understand* 是终结性的。相反，*Ann waited* 与 *Mary thought* 缺少这种自然终点：*wait* 与 *think* 是非终结性的。作为标准测试（如 Rothstein 2004），*in X time* 形式的时间修饰语修饰终结性 VP，而 *for X time* 修饰非终结性 VP（如 *Ann arrived in five minutes* 对 *Ann waited for five minutes*，*Mary understood in a second* 对 *Mary thought for a second*）。
    step2: |-
      语义学传统上把事件描述分为*终结性*（telic）：若其适用于具有由该描述所决定的自然终点的事件；否则称为*非终结性*（atelic）。*Ann arrived* 与 *Mary understood* 有这种自然终点，即 Ann 到达目的地的时点、Mary 恍然大悟的时点：*arrive* 与 *understand* 是终结性的。相反，*Ann waited* 与 *Mary thought* 缺少此类终点：*wait* 与 *think* 是非终结性的。标准测试是（如 Rothstein 2004）：*in X time* 形式的时间修饰语修饰终结性 VP，*for X time* 则修饰非终结性 VP（如 *Ann arrived in five minutes* 对 *Ann waited for five minutes*，*Mary understood in a second* 对 *Mary thought for a second*）。
  - id: 79
    kind: body
    source: |-
      Telicity is a property of predicates (i.e., verbs complete with arguments and modifiers), not of verbs themselves. Whether a predicate is telic or atelic may thus result from a variety of different factors; these include adverbial modifiers that explicitly identify an endpoint—*run 10 kilometers (in an hour)* is telic, but *run back and forth (for an hour)* is atelic—and properties of the nominal arguments—*eat an apple (in two minutes)* is telic whereas *eat lentil soup (for two minutes)* is atelic. But telicity also depends on properties of the lexical semantics of the verb itself, as illustrated by the intransitive verbs above, as well as transitive examples like *found a solution (in an hour)* versus *look for a solution (for an hour)*. In work on spoken language, some theorists have posited that these lexical factors can be explained by a morphological decomposition of the verb, and that inherently telic verbs like *arrive* or *find* include a morpheme that specifies the endstate resulting from a process (Pustejovsky 1991; Ramchand 2008)[^pustejovsky-1991][^ramchand-2008]. This morpheme has been called various things in the literature, including ‘EndState’ (Wilbur 2003)[^wilbur-2003] and ‘Res’ (Ramchand 2008)[^ramchand-2008].
    step1: |-
      终结性是谓语（即动词连同论元与修饰语）的性质，而非动词本身的性质。因此，一个谓语是终结性还是非终结性，可能由多种不同因素造成；其中包括明确标出终点的状语修饰语（*run 10 kilometers (in an hour)* 是终结性的，而 *run back and forth (for an hour)* 是非终结性的），以及名词论元的性质（*eat an apple (in two minutes)* 是终结性的，而 *eat lentil soup (for two minutes)* 是非终结性的）。但终结性也取决于动词本身词汇语义的性质，如上文的不及物动词所示，也如 *found a solution (in an hour)* 对 *look for a solution (for an hour)* 这类及物例子所示。在口语研究中，一些理论家设定：这些词汇因素可以由动词的形态分解来解释，而 *arrive* 或 *find* 这类固有终结性动词包含一个词素，用来指定过程所致的结果状态（Pustejovsky 1991; Ramchand 2008）。这个词素在文献中有不同名称，包括‘EndState’（Wilbur 2003）与‘Res’（Ramchand 2008）。
    step2: |-
      终结性是谓语（动词连同论元与修饰语）的性质，而非动词本身的性质。一个谓语是终结性还是非终结性，可能缘于多种因素：明确标出终点的状语修饰语（*run 10 kilometers (in an hour)* 是终结性的，*run back and forth (for an hour)* 是非终结性的），名词论元的性质（*eat an apple (in two minutes)* 是终结性的，*eat lentil soup (for two minutes)* 是非终结性的），以及动词本身词汇语义的性质，如上文不及物动词所示，也如 *found a solution (in an hour)* 对 *look for a solution (for an hour)* 这类及物例子所示。在口语研究中，一些理论家设定：这些词汇因素可由动词的形态分解来解释，*arrive* 或 *find* 这类固有终结性动词包含一个词素，用以指定过程所致的结果状态（Pustejovsky 1991; Ramchand 2008）。此词素在文献中名称不一，包括‘EndState’（Wilbur 2003）与‘Res’（Ramchand 2008）。
  - id: 80
    kind: body
    source: |-
      In influential work, Wilbur (2003, 2008; Wilbur & Malaia 2008)[^wilbur-2008][^wilbur-2008-2] has argued that the lexical factors related to telicity are often realized overtly in the phonology of several sign languages: inherently telic verbs tend to be realized with sharp sign boundaries; inherently atelic verbs are realized without them (Wilbur 2003, 2008; Wilbur & Malaia 2008)[^wilbur-2003][^wilbur-2008][^wilbur-2008-2]. For instance, the ASL sign *ARRIVE* involves a sharp deceleration, as one hand makes contact with the other, as shown in (13).
    step1: |-
      在有影响的研究中，Wilbur（2003, 2008; Wilbur & Malaia 2008）论证：与终结性相关的词汇因素，常在若干手语的音系中显性实现：固有终结性动词倾向于以鲜明的手势边界实现；固有非终结性动词则没有这种边界（Wilbur 2003, 2008; Wilbur & Malaia 2008）。例如，ASL 手势 *ARRIVE* 包含一次鲜明的减速，即一只手与另一只手接触，如 (13) 所示。
    step2: |-
      在有影响的研究中，Wilbur（2003, 2008; Wilbur & Malaia 2008）论证：与终结性相关的词汇因素，常在若干手语的音系中显性实现：固有终结性动词倾向于以鲜明的手势边界实现，固有非终结性动词则没有这种边界（Wilbur 2003, 2008; Wilbur & Malaia 2008）。例如 ASL 手势 *ARRIVE* 包含一次鲜明减速，一只手与另一只手接触，如 (13) 所示。
