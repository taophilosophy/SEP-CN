      Wilbur (2008) posits that in ASL and other sign languages, this phonological cue, the “rapid deceleration of the movement to a complete stop”, is an overt manifestation of the morpheme EndState, yielding inherently telic lexical predicates. If Wilbur’s analysis is correct, this is another possible instance of visibility of an abstract component of Logical Forms that is not usually overt in spoken languages. An alternative is that an abstract version of iconicity is responsible for this observation (Kuhn 2015)[^kuhn-2015], as we will see in Section 3.2.
    step1: |-
      Wilbur (2008) 设定：在 ASL 及其他手语中，这一音系线索，即“动作迅速减速至完全停止”，是词素 EndState 的显性表现，产生固有终结性的词汇谓语。若 Wilbur 的分析正确，这又是一个可能的实例：逻辑形式的抽象成分在口语中通常不显性，而在手语中可见。另一种可能是，象似性的一种抽象版本解释了这一观察（Kuhn 2015），我们将在 3.2 节看到。
    step2: |-
      Wilbur (2008) 设定：在 ASL 等手语中，这一音系线索（“动作迅速减速至完全停止”）是词素 EndState 的显性表现，产生固有终结性的词汇谓语。若 Wilbur 分析正确，这又是一个可能实例：逻辑形式的抽象成分在口语中通常不显性，却在手语中可见。另一种可能是，象似性的一种抽象版本解释了这一观察（Kuhn 2015），详见 3.2 节。
