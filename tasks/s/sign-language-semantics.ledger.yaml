  - id: 10
    kind: body
    source: |-
      In several cases of foundational interest, sign languages don’t just have the same types of Logical Forms as spoken languages; they may make overt key parts of the logical vocabulary that are usually covert in spoken language. These have been called instances of ‘Logical Visibility’ (Schlenker 2018a; following the literature, we use the term ‘logical’ loosely, to refer to primitive distinctions that play a key role in a semantic analysis)[^schlenker-2018a].
    step1: |-
      在若干具有基础性意义的案例中，手语不仅拥有与口语相同类型的逻辑形式，还可能把口语中通常隐而不显的逻辑词库关键部分显性化。这类现象被称为“逻辑可见性”的实例（Schlenker 2018a；依照文献惯例，我们宽泛地使用“逻辑”一词，指语义分析中起关键作用的原始区分）。
    step2: |-
      在若干具有基础意义的案例中，手语不仅与口语共享同一类逻辑形式，还会把口语中通常隐而不显的逻辑词库关键成分显性化。此类现象即所谓“逻辑可见性”实例（Schlenker 2018a；依文献惯例，“逻辑”一词取其宽泛义，指语义分析中起关键作用的原始区分）。
