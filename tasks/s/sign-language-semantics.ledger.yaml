      Here *1-WALK-AWAY* is a first person version of ‘walk away’, but the overall meaning is just that the angry person associated with locus *a* walked away. By performing a body shift and adopting that person’s position to sign *1-WALK-AWAY*, the signer arguably makes the description more vivid.
    step1: |-
      这里 *1-WALK-AWAY* 是“walk away”的第一人称版本，但整体意义只是：与位点 *a* 关联的愤怒男子走开了。通过转动身体、采取那个人的位置来打出 *1-WALK-AWAY*，手语者可以说使描述更生动。
    step2: |-
      这里 *1-WALK-AWAY* 是“walk away”的第一人称版本，整体意义却只是：与位点 *a* 关联的愤怒男子走开了。通过转动身体、采取那个人的位置来打出 *1-WALK-AWAY*，手语者可使描述更生动。
  - id: 104
    kind: body
    source: |-
      Importantly, in ASL and LSF, Role Shift interacts with iconicity. Attitude Role Shift has, at a minimum, a strong quotational component. For instance, angry facial expressions under Role Shift must be attributed to the attitude holder, not to the signer (Schlenker 2018a)[^schlenker-2018a]. This observation extends to ASL and LSF Action Role Shift: disgusted facial expressions under Action Role Shift are attributed to the agent rather than to the signer.
    step1: |-
      重要的是，在 ASL 与 LSF 中，角色转换与象似性互动。态度角色转换至少有一个很强的引用成分。例如，角色转换下的愤怒面部表情必须归于态度持有者，而非手语者（Schlenker 2018a）。这一观察延伸到 ASL 与 LSF 的行动角色转换：行动角色转换下的厌恶面部表情归于施事，而非手语者。
    step2: |-
      重要的是，在 ASL 与 LSF 中，角色转换与象似性互动。态度角色转换至少有一个很强的引用成分。例如，角色转换下的愤怒面部表情必须归于态度持有者，而非手语者（Schlenker 2018a）。这一观察同样适用于 ASL 与 LSF 的行动角色转换：行动角色转换下的厌恶表情归于施事，而非手语者。
  - id: 105
    kind: body
    source: |-
      As in other cases of purported Logical Visibility, the claim that Role Shift is the visible reflex of an operation that is covert in speech has been challenged. In the analysis of Davidson (2015, following Supalla 1982)[^supalla-1982], Role Shift falls under the category of classifier predicates, specific constructions of sign language that are interpreted in a highly iconic fashion (we discuss them in Section 4). What is special about Role Shift is that the classifier is not signed with a hand (as other classifiers are), but with the signer’s own body. The iconic nature of this classifier means that properties of role-shifted expressions that can be iconically assigned to the described situation must be. For Attitude Role Shift, the analysis essentially derives a quotational reading via a demonstration—for our example above, something like: *My wife said this, “You are fine”*. Cases of Attitude Role Shift that have been argued not to involve standard quotation ( in Catalan and German sign language) require refinements of the analysis. For Action Role Shift, the operation has the effect of demonstrating those parts of signs that are not conventional, yielding in essence: *He walked away like this,* where *this* refers to all iconically interpretable components of the role-shifted construction (including the signer’s angry expression, if applicable).
    step1: |-
      正如其他所谓的逻辑可见性案例，“角色转换是口语中隐性操作的可见反映”这一主张也受到挑战。按 Davidson (2015，沿 Supalla 1982) 的分析，角色转换属于类标记谓语，即手语中以高度象似方式解释的特定构造（我们在第 4 节讨论）。角色转换的特殊之处在于，类标记不是用手（如其他类标记那样）打出，而是用手语者自己的身体打出。这个类标记的象似本性意味着：角色转换表达式中那些可以象似地归属所描述情境的性质，必须如此归属。对于态度角色转换，该分析实质上通过示范导出一个引用读法；就上文例子而言，大致是：*我妻子这样说：“你没事。”* 有论证认为不涉及标准引用的态度角色转换案例（加泰罗尼亚手语与德国手语）需要对该分析作修正。对于行动角色转换，该操作的效果是示范手势中非约定的部分，实质上得到：*他这样走开了*，其中 *this* 指角色转换构造中所有可作象似解释的成分（若适用，包括手语者的愤怒表情）。
    step2: |-
      正如其他所谓的逻辑可见性案例，“角色转换是口语中隐性操作的可见反映”这一主张也受到挑战。按 Davidson (2015，沿 Supalla 1982) 的分析，角色转换属于类标记谓语，即手语中以高度象似方式解释的特定构造（第 4 节讨论）。角色转换的特殊之处在于，类标记不是用手（如其他类标记那样）打出，而是用手语者自己的身体打出。这个类标记的象似本性意味着：角色转换表达式中那些可以象似地归属所描述情境的性质，必须如此归属。对于态度角色转换，该分析实质上通过示范导出一个引用读法；就上文例子而言，大致是：*我妻子这样说：“你没事。”* 有论证认为不涉及标准引用的态度角色转换案例（加泰罗尼亚手语与德国手语）需要修正该分析。对于行动角色转换，该操作的效果是示范手势中非约定的部分，实质上得到：*他这样走开了*，其中 *this* 指角色转换构造中所有可作象似解释的成分（若适用，包括手语者的愤怒表情）。
  - id: 106
    kind: body
    source: |-
      Debates about Role Shift have two possible implications. On one view, Role Shift provides overt evidence for context shift, and extends the typology of Kaplanian monsters beyond spoken languages and beyond attitude operators (due to the existence of Action Role Shift alongside Attitude Role Shift). On the alternative view developed by Davidson, Role Shift suggests that some instances of quotation should be tightly connected to a broader analysis of iconicity owing to the similarity between Attitude Role Shift an Action Shift.
    step1: |-
      关于角色转换的争论有两个可能的意涵。一种观点认为，角色转换为语境移位提供了显性证据，并把 Kaplan 式怪物的类型学扩展到口语之外、态度算子之外（因为行动角色转换与态度角色转换并存）。Davidson 提出的另一种观点认为，由于态度角色转换与行动角色转换的相似性，角色转换提示某些引用实例应与更广泛的象似性分析紧密联系。
    step2: |-
      关于角色转换的争论有两个可能意涵。一种观点认为，角色转换为语境移位提供了显性证据，并把 Kaplan 式怪物的类型学扩展到口语之外、态度算子之外（因为行动角色转换与态度角色转换并存）。Davidson 提出的另一种观点认为，由于态度角色转换与行动角色转换相似，角色转换提示某些引用实例应与更广泛的象似性分析紧密联系。
  - id: 107
    kind: body
    source: |-
      In sum, it has been argued that telicity and context shift can be overtly marked in sign language, hence instances of Logical Visibility beyond loci, but alternative accounts exist as well. Let us add that there are cases of Logical *non*-visibility, in which logical elements that are often overt in speech can be covert in sign. See the [supplement on Coordination](sign-language-semantics.coordination.md) for the case of an ASL construction ambiguous between conjunction and disjunction.
    step1: |-
      总之，有论证认为终结性与语境移位可以在手语中显性标记，因而是位点之外的逻辑可见性实例；但也存在替代解释。还要补充：存在逻辑*不可见性*的案例，即某些在口语中常显性的逻辑成分在手语中可以是隐性的。关于 ASL 一种在合取与析取之间有歧义的构造，见[并列补充材料](sign-language-semantics.coordination.md)。
    step2: |-
      总之，有论证认为终结性与语境移位可在手语中显性标记，因而是位点之外的逻辑可见性实例；但也存在替代解释。还需补充：存在逻辑*不可见性*的案例，某些在口语中常显性的逻辑成分在手语中可以是隐性的。关于 ASL 一种在合取与析取之间有歧义的构造，见[并列补充材料](sign-language-semantics.coordination.md)。
