      While strong, these arguments are indirect because the *form* of tense and mood looks nothing like pronouns. In several sign languages, including at least ASL (Schlenker 2018a)[^schlenker-2018a] and Chinese Sign Language (Lin et al. 2021)[^lin-2021], loci provide a more direct argument because in carefully constructed examples, pointing to loci can be used not just to refer to individuals, but also to temporal and modal situations, with a meaning akin to that of the word *then* in English. It follows that the logical system underlying the ASL pronominal system (e.g., as variables) extends to temporal and modal situations.
    step1: |-
      这些论证虽有力，却是间接的，因为时态与语气的*形式*看起来完全不像代词。在包括至少 ASL（Schlenker 2018a）与中国手语（Lin et al. 2021）在内的若干手语中，位点提供了更直接的论证：在精心构造的例子里，指向位点不仅可用于指称个体，还可用于指称时间与模态情境，其意义类似英语中的 *then*。由此可知，ASL 代词系统底层的逻辑系统（如作为变量）扩展到时间与模态情境。
    step2: |-
      这些论证虽有力，却是间接的：时态与语气的*形式*看起来完全不像代词。在至少包括 ASL（Schlenker 2018a）与中国手语（Lin et al. 2021）在内的若干手语中，位点提供了更直接的论证：在精心构造的例子里，指向位点不仅可指称个体，还可指称时间与模态情境，意义类似英语的 *then*。由此可知，ASL 代词系统底层的逻辑系统（如作为变量）延伸到时间与模态情境。
