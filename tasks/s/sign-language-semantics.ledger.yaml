    kind: body
    source: |-
      As it turns out, sign language loci seem to share some properties with logical variables, and some properties with grammatical features. On the one hand, the flexibility with which loci can be used seems closer to the nature of logical variables than to grammatical features. First, gender features are normally drawn from a finite inventory, whereas there seems to be no upper bound to the number of loci used except for reasons of performance. Second, gender features have a fixed form, whereas loci can be created ‘on the fly’ in various parts of signing space. On the other hand, loci may sometimes be disregarded in ways that resemble gender features. A large part of the debate has focused on sign language versions of sentences such as: *Only Ann did her homework*. This has a salient (‘bound variable’) reading that entails that Bill didn’t do **his** homework. In order to derive this reading, linguists have proposed that the gender features of the pronoun *her* must be disregarded, possibly because they are the result of grammatical agreement. Loci can be disregarded in the very same kind of context, suggesting that they are features, not logical variables (Kuhn 2016)[^kuhn-2016]. In light of this theoretical tension, a possible synthesis is that loci are a visible realization of logical variables, but mediated by a featural level (Schlenker 2018a)[^schlenker-2018a]. The debate continues to be relatively open.
    step1: |-
      事实上，手语位点似乎既与逻辑变量共享某些性质，也与语法特征共享某些性质。一方面，位点使用的灵活性似乎更接近逻辑变量的本性而非语法特征。首先，性特征通常取自有限清单，而位点数目似乎除表现因素外没有上限。其次，性特征有固定形式，而位点可以在手势空间各处“即时”创设。另一方面，位点有时可以像性特征那样被忽略。争论的很大一部分集中在类似 *Only Ann did her homework* 这样的手语句上。这个句子有一个显著的（“约束变量”）读法，蕴含 Bill 没做**他的**作业。为导出这一读法，语言学家提出，代词 *her* 的性特征必须被忽略，可能因为它们是语法一致的结果。位点在完全相同类型的语境中也可以被忽略，这提示它们是特征而非逻辑变量（Kuhn 2016）。在这一理论张力下，一种可能的综合是：位点是逻辑变量的可见实现，但经由特征层面中介（Schlenker 2018a）。争论仍相对开放。
    step2: |-
      实际上，手语位点似乎既与逻辑变量共享某些性质，也与语法特征共享某些性质。一方面，位点使用的灵活性更近于逻辑变量的本性，而非语法特征：性特征通常取自有限清单，位点数目则除表现因素外似无上限；性特征形式固定，位点则可在手势空间各处“即时”创设。另一方面，位点有时可像性特征一样被忽略。争论很大部分聚焦于 *Only Ann did her homework* 一类手语句。此句有一个显著的（“约束变量”）读法，蕴含 Bill 没做**他的**作业。为导出该读法，语言学家提出代词 *her* 的性特征必须被忽略，可能因为它们源自语法一致。位点在完全同类语境中亦可被忽略，提示它们是特征而非逻辑变量（Kuhn 2016）。在此理论张力下，一种可能的综合是：位点是逻辑变量的可见实现，但经特征层面中介（Schlenker 2018a）。争论仍相对开放。
