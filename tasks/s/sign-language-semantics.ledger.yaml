      In sum, loci have been argued to be the overt realization of individual, time, world, and degree variables. If one grants this point, it follows that sign language is ontologically committed to these object types. But the debate is still ongoing, with alternatives that take loci to be similar to features rather than to variables. Let us add that the loci-as-variable analysis has offered a new argument in favor of dynamic semantics, where a variable can depend on a quantifier without being in its syntactic scope; see the [supplement on Dynamic Loci](sign-language-semantics.dynamic-loci.md).
    step1: |-
      总之，有论证认为位点是个体变量、时间变量、世界变量与程度变量的显性实现。若承认这一点，则手语在本体论上承诺了这些对象类型。但争论仍在继续，另有立场把位点视为类似特征而非变量。还要补充：位点即变量的分析为动态语义学提供了新论证，其中变量可以依赖量词而不在其句法辖域内；见[动态位点补充材料](sign-language-semantics.dynamic-loci.md)。
    step2: |-
      总之，有论证认为位点是个体变量、时间变量、世界变量与程度变量的显性实现。若承认这一点，手语便在本体论上承诺了这些对象类型。但争论仍在继续，另有立场把位点视为类似特征而非变量。还需补充：位点即变量的分析为动态语义学提供了新论证，其中变量可以依赖量词而不在其句法辖域内；见[动态位点补充材料](sign-language-semantics.dynamic-loci.md)。
