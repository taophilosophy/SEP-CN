      It is thus generally agreed that pronouns in sign are part of the same abstract system as pronouns in speech. It is also apparent that loci play a similar function to logical variables, disambiguating antecedents and tracking reference. This being said, the claim that loci are a direct morphological spell-out of logical variables requires a more systematic evaluation of the extent to which sign language loci have the formal properties of logical variables. As a concrete counterpoint, one observes that gender features in English *also* play a similar function, disambiguating antecedents and tracking reference. For instance, *Joe Biden told Kamala Harris that he would be elected* has a rather unambiguous reading (*he* = *Biden),* while *Joe Biden told Kamala Harris that she would be elected* has a different one (*she* = *Harris*). Such parallels have led some linguists to propose that loci should best be viewed as grammatical features akin to gender features (Neidle et al. 2000; Kuhn 2016)[^kuhn-2016][^neidle-2000].
    step1: |-
      人们由此普遍同意：手语代词与口语代词同属一个抽象系统。同样明显的是，位点发挥与逻辑变量相似的功能，即消歧先行语并追踪指称。尽管如此，“位点是逻辑变量的直接形态实现”这一主张，需要对手语位点在多大程度上具有逻辑变量的形式性质作更系统的评估。作为一个具体的对照，人们观察到英语中的性特征*也*发挥类似功能：消歧先行语、追踪指称。例如 *Joe Biden told Kamala Harris that he would be elected* 的读法相当无歧义（*he* = *Biden*），而 *Joe Biden told Kamala Harris that she would be elected* 则有另一种读法（*she* = *Harris*）。这类平行促使一些语言学家提出：最好把位点看作类似于性特征的语法特征（Neidle et al. 2000; Kuhn 2016）。
    step2: |-
      由此人们普遍同意：手语代词与口语代词同属一个抽象系统；位点也与逻辑变量功能相似，消歧先行语并追踪指称。尽管如此，“位点直接在形态上实现逻辑变量”这一主张，仍须系统评估手语位点在多大程度上具备逻辑变量的形式性质。一个具体的对照是：英语的性特征*也*有类似功能，消歧先行语并追踪指称。如 *Joe Biden told Kamala Harris that he would be elected* 的读法相当确定（*he* = *Biden*），而 *Joe Biden told Kamala Harris that she would be elected* 则不同（*she* = *Harris*）。这类平行促使一些语言学家主张：位点宜视为类似性特征的语法特征（Neidle et al. 2000; Kuhn 2016）。
