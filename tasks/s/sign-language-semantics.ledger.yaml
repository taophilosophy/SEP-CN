      Pro-speech His enemy, Asterix won’t ![slapping gesture](../assets/sign-language-semantics/image027-black.png) . $\Rightarrow$ Asterix won’t slap his enemy
    step1: TBD
    step2: TBD
  - id: 214
    kind: body
    source: |-
      Only pro-speech gestures, as in (32c), make at-issue contributions by default (possibly in addition to other contributions). In this respect, they ‘match’ the behavior of iconic modulations, iconic plurals and pluractionals, and classifier predicates. But unlike these, pro-speech gestures are not words and are correspondingly expressively limited. For instance, abstract psychological verbs *UNDERSTAND* (=(15a)) and especially *REFLECT* (=(15b)) can be modulated in rich iconic ways in LSF—e.g., if the hand movement of *REFLECT* starts slow and ends fast, this conveys that the reflection intensified (Schlenker 2018a)[^schlenker-2018a]. But there are no clear pro-speech gestures with the same abstract meanings, and thus one cannot hope to emulate with pro-speech gestures the contributions of *UNDERSTAND* and *REFLECT*, including when they are enriched by iconic modulations.
    step1: TBD
    step2: TBD
  - id: 215
    kind: body
    source: |-
      In sum, while the reintegration of gestures into the study of speech opens new avenues of comparison between sign with iconicity and speech with gestures, one shouldn’t jump to the conclusion that these enriched objects display precisely the same semantic behavior.
    step1: TBD
    step2: TBD
  - id: 216
    kind: body
    source: |-
      ### 5.3 Classifier predicates and pro-speech gestures
    step1: TBD
    step2: TBD
  - id: 217
    kind: body
    source: |-
      Unlike gestures in general and pro-speech gestures in particular, classifier predicates have a conventional form (only the position, orientation, and movement are iconically interpreted, accompanied in limited cases by aspects of the handshape). But there are still striking similarities between pro-speech gestures and classifier predicates.
    step1: TBD
    step2: TBD
  - id: 218
    kind: body
    source: |-
      First, on a semantic level, the iconic semantics sketched for classifier predicates in Section 4.2 seems useful for pro-speech gestures as well, sometimes down to the details—for instance, it has been argued that the dependency between viewpoints and quantifiers illustrated in (30) has a counterpart with pro-speech gestures (Schlenker & Lamberton forthcoming).
    step1: TBD
    step2: TBD
  - id: 219
    kind: body
    source: |-
      Second, on a syntactic level, classifier predicates often display a different word order from other constructions, something that has been found across languages (Pavlič 2016)[^pavlič-2016]. In ASL, the basic word order is SVO, but preverbal objects are usually preferred if the verb is a classifier predicate, for instance one that represents a crocodile moving and eating up a ball (as is standard in syntax, the ‘basic’ or underlying word order may be modified on independent grounds by further operations, for instance ones that involve topics and focus; we are not talking about such modifications of the word order here).
    step1: TBD
    step2: TBD
  - id: 220
    kind: body
    source: |-
      It has been proposed that the non-standard word order is directly related to the iconic properties of classifier predicates. The idea is that these create a visual animation of an action, and preferably take their argument in the order in which their denotations are visible (Schlenker, Bonnet et al. 2024; see also Napoli, Spence, and Müller 2017). One would typically see a ball and a crocodile before seeing the eating, hence the preference for preverbal objects (note that the subject is preverbal anyway in ASL). A key argument for this idea is that when one considers a minimally different sentence involving a crocodile spitting out a ball it had previously ingested, SVO order is regained, in accordance with the fact that an observer would see the object after the action in this case.
    step1: TBD
    step2: TBD
  - id: 221
    kind: body
    source: |-
      Strikingly, these findings carry over to pro-speech gestures. Goldin-Meadow et al. (2008) famously noted that when speakers of languages with diverse word orders are asked to use pantomime to describe an event with an agent and a patient, they tend to go with SOV order, including if this goes against the basic word order of their language (as is the case in English). Similarly, pre-verbal objects are preferred in sequences of pro-speech gestures in French (despite the fact that the basic word order of the language is SVO); this is for instance the case for a sequence of pro-speech gestures that means that a crocodile ate up a ball. Remarkably, with spit-out-type gestural predicates, an SVO order is regained, just as is the case with ASL classifier predicates (Schlenker, Bonnet, et al. 2024, following in part by Christensen, Fusaroli, & Tylén 2016; Napoli, Mellon, et al. 2017; Schouwstra & de Swart 2014)[^schouwstra-2014]. This suggests that iconicity, an obvious commonality between the two constructions, might indeed be responsible for the non-standard word order.
    step1: TBD
    step2: TBD
  - id: 222
    kind: body
    source: |-
      ## 6. Universal Properties of the Signed Modality
    step1: TBD
    step2: TBD
  - id: 223
    kind: body
    source: |-
      ### 6.1 Sign language typology and sign language emergence
    step1: TBD
    step2: TBD
  - id: 224
    kind: body
    source: |-
      Properties discussed above include: (i) the use of loci to realize anaphora, (ii) the overt marking of telicity and (possibly) context shift, (iii) the presence of rich iconic modulations interacting with event structure, plurals and pluractionals, and anaphora, (iv) the existence of classifier predicates, which have both a conventional and an iconic dimension. Although the examples above involve a relatively small number of languages, it turns out that these properties exist in several and probably many sign languages. Historically unrelated sign languages are thus routinely treated as a ‘language family’ because they share numerous properties that are not shared by spoken languages (Sandler & Lillo-Martin 2006)[^sandler-2006]. Of course, this still allows for considerable variation across sign languages, for instance with respect to word order (e.g., ASL is SVO, LIS is SOV).
    step1: TBD
    step2: TBD
  - id: 225
    kind: body
    source: |-
      Cases of convergence also exist in language emergence. Homesigners are deaf individuals who are not in contact with an established sign language and thus develop their own gesture systems to communicate with their families. While homesigners do not invent a sign language, they sometimes discover on their own certain properties of mature sign languages. Loci and repetition-based plurals are cases in point (Coppola & So 2006; Coppola et al. 2013)[^coppola-2006][^coppola-2013]. Strikingly, Coppola and colleagues (2013) showed in a production experiment that a group of homesigners from Nicaragua used both punctuated and unpunctuated repetitions, with the kinds of semantic distinctions found in mature sign language. Coppola et al. further
    step1: TBD
    step2: TBD
  - id: 226
    kind: body
    source: |-
      > examined a child homesigner and his hearing mother, and found that the child’s number gestures displayed all of the properties found in the adult homesigners’ gestures, but his mother’s gestures did not. (Coppola, Spaepen, & Goldin-Meadow 2013: abstract)
    step1: TBD
    step2: TBD
  - id: 227
    kind: body
    source: |-
      This provided clear evidence that this homesigner had invented this strategy of plural-marking.
    step1: TBD
    step2: TBD
  - id: 228
    kind: body
    source: |-
      In sum, there is striking typological convergence among historically unrelated sign languages, and homesigners can in some cases discover grammatical devices found in mature sign languages.
    step1: TBD
    step2: TBD
  - id: 229
    kind: body
    source: |-
      ### 6.2 Sign language grammar and gestural grammar
    step1: TBD
    step2: TBD
  - id: 230
    kind: body
    source: |-
      It is arguably possible to have non-signers discover on the fly certain non-trivial properties of sign languages (Strickland et al. 2015; Schlenker 2020)[^schlenker-2020][^strickland-2015]. One procedure involves hybrids of words and gestures. We saw a version of this in Section 5.3, when we discussed similarities between pro-speech gestures and classifier predicates. The result was that along several dimensions, notably word order preferences and associated meanings, pro-speech gestures resemble ASL classifier predicates (they also differ from them in not having lexical forms).
    step1: TBD
    step2: TBD
  - id: 231
    kind: body
    source: |-
      More generally, hybrid sequences of words and gestures suggest that non-signers sometimes have access to a gestural grammar somewhat reminiscent of sign languages. (It goes without saying that there is no claim whatsoever that non-signers know the sophisticated grammars of sign languages, any more than a naive monolingual English speaker knows the grammar of Mandarin or Hebrew.) In one experimental study (summarized in Schlenker 2020)[^schlenker-2020], gestures with a verbal meaning, such as ‘send kisses’, targeted different positions, corresponding to the addressee or some third person, as illustrated below.
    step1: TBD
    step2: TBD
  - id: 232
    kind: body
    source: |-
      **(33)**
    step1: TBD
    step2: TBD
  - id: 233
    kind: body
    source: |-
      A gesture for ‘send kisses to’ oriented towards the addressee or some third person position ![face with mouth in a kiss and a hand gesturing forward with face facing front](../assets/sign-language-semantics/image028.png) a. send kisses to you ![face with mouth in a kiss and a hand gesturing forward but the whole oriented to the side](../assets/sign-language-semantics/image029.png) b. send kisses to him/her *Credits*: J. Kuhn
    step1: TBD
    step2: TBD
  - id: 234
    kind: body
    source: |-
      The conditions in which these two forms can be used turn out to be reminiscent of the behavior of the agreement verb *TELL* in ASL: in (5), the verb could target the addressee position to mean *I tell you*, or some position to the side to mean *I tell him/her*. The study showed that non-signers immediately perceived a distinction between the second person object form and the third person object form of the gestural verb, despite the fact that English, unlike ASL, has no object agreement markers. In other words, non-signers seemed to treat the directionality of the gestural verb as a kind of agreement marker. More fine-grained properties of the ASL object agreement construction were tested with gestures, again with positive results.
    step1: TBD
    step2: TBD
  - id: 235
    kind: body
    source: |-
      More broadly, it has been argued that aspects of gestural grammar resemble the grammar of ASL in designated cases involving loci, repetition-based plurals and pluractionals, Role Shift, and telicity marking (e.g., Schlenker 2020 and references therein)[^schlenker-2020]. These findings have yet to be confirmed with experimental means, but if they are correct, the question is why.
    step1: TBD
    step2: TBD
  - id: 236
    kind: body
    source: |-
      ### 6.3 Why convergence?
    step1: TBD
    step2: TBD
  - id: 237
    kind: body
    source: |-
      We have seen three cases of convergence in the visual modality: typological convergence among unrelated sign languages, homesigners’ ability to discover designated aspects of sign language grammar, and possibly the existence of a gestural grammar somewhat reminiscent of sign language in designated cases. None of these cases should be exaggerated. While typologically they belong to a language family, sign languages are very diverse, varying on all levels of linguistic structure. As for homesigners, the gestural systems they develop compensate for the *lack* of access to a sign language; indeed, homesigners bear consequences of lack of access to a native language (see for instance Morford & Hänel-Faulhaber 2011; Gagne & Coppola 2017)[^gagne-2017][^morford-2011]. Finally, non-signers cannot guess anything about sign languages apart from a few designated properties.
    step1: TBD
    step2: TBD
  - id: 238
    kind: body
    source: |-
      Still, these cases of convergence should be explained. There are at least three conceivable directions, which might have different areas of applicability. Chomsky famously argued that there exists an innate Universal Grammar (UG) that underlies all human languages (see for instance Chomsky 1965, Pinker 1994)[^chomsky-1965][^pinker-1994]. One possibility is that UG doesn’t just specify abstracts features and rules (as is usually assumed), but also certain form-to-meaning mappings in the visual modality, for instance the fact that pronouns are realized by way of pointing. A second possibility is that the iconic component of sign language—possibly in more abstract forms than is usually assumed—is responsible for some of the convergence. An example was discussed in Section 5.3 in relation to the word order differences between classifier predicates and normal signs, and between gesture sequences and normal words. A third possibility is that, for reasons that have yet to be determined, the visual modality sometimes makes it possible to realize in a more uniform fashion some deeper cognitive properties of linguistic expressions.
    step1: TBD
    step2: TBD
  - id: 239
    kind: body
    source: |-
      ## 7. Future Issues
    step1: TBD
    step2: TBD
  - id: 240
    kind: body
    source: |-
      On a practical level, future research will have to find the optimal balance between fine-grained studies and robust methods of data collection (e.g., what are the best methods to collect fine-grained data from a small number of consultants? how can large-scale experiments be set up for sign language semantics?). A second issue pertains to the involvement of native signers and Deaf researchers, who should obviously play a central role in this entire research.
    step1: TBD
    step2: TBD
  - id: 241
    kind: body
    source: |-
      On a theoretical level, the traditional view of human language as a discrete system with iconicity at the margins is hard to maintain in view of the analysis of sign with iconicity (and possibly also of speech with gestures). Rather, human language is a hybrid system with a discrete/logical component and an iconic component. But there are multiple open issues. First, cases of Logical Visibility will no doubt give rise to further debates. Second, a formal iconic semantics appropriate for sign language has yet to be fully developed. Third, the interaction between the discrete/logical component and the iconic component must be investigated in greater detail. Fourth, the formal semantics of sign language should be extended with an equally formal pragmatics to investigate, among others, information structure, and the rich typology of inferences that has been unearthed for spoken languages (including implicatures, presuppositions, supplements, expressives, etc.). Importantly, this formal pragmatics will have to explore both the discrete/logical and the iconic component of sign language. Fifth, consequences of the iconic component for the syntax will have to be further explored, especially in view of the hypothesis that classifier predicates display a non-standard syntax because they have an iconic semantics. Last, but not least, the philosophy of language should take sign languages into account. For the moment, it almost never does so.
    step1: TBD
    step2: TBD
