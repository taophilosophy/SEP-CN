      To say that one *can* analyze the meaning in terms of reference to degrees doesn’t entail that one must (for discussion, see Klein 1980)[^klein-1980]. And even if one posits quantification over degrees, a further question is whether natural language has counterparts of pronouns that refer to degrees—if so, one would have an argument that natural language is committed to degrees. Importantly, this debate is logically independent from that about the existence of time- and world-denoting pronominals, as one may consistently believe that there are pronominals in one domain but not in the other. The question must be asked anew, and here too sign language brings important insights.
    step1: |-
      说人们*可以*按指称程度来分析意义，并不蕴含必须如此（讨论见 Klein 1980）。即便设定对程度的量化，进一步的问题是：自然语言是否有指称程度的代词对应物？若有，人们就有论证说自然语言承诺了程度的存在。重要的是，这场争论在逻辑上独立于关于时间与世界指称代词存在的争论，因为人们可以一致地相信某个域有代词而另一个域没有。这个问题必须重新提出，而手语在此同样带来重要洞见。
    step2: |-
      说人们*可以*按指称程度分析意义，并不蕴含必须如此（讨论见 Klein 1980）。即便设定对程度的量化，仍有进一步问题：自然语言是否有指称程度的代词对应物？若有，便可论证自然语言承诺了程度的存在。要紧的是，这场争论在逻辑上独立于时间与世界指称代词之争，因为人们可以一致地相信一个域有代词而另一个域没有。此问题须重新提出，手语在此同样带来重要洞见。
