      Degree-denoting pronouns exist in some constructions of Italian Sign Language (LIS; Aristodemo 2017)[^aristodemo-2017]. In (12), the movement of the sign *TALL* ends at a particular location on the vertical axis (which we call α, to avoid confusion with the Latin characters used for individual loci in the horizontal plane), which intuitively represents Gianni’s degree of height. In the second sentence, the pronoun points towards this degree-denoting locus, and the rest of the sentence characterizes this degree of height.
    step1: |-
      指称程度的代词存在于意大利手语的某些构造中（LIS；Aristodemo 2017）。在 (12) 中，手势 *TALL* 的移动终止于竖直轴上的某一位置（我们称之为 α，以免与用于水平面上个体位点的拉丁字母混淆），直觉上它代表 Gianni 的身高程度。第二句中，代词指向这个指称程度的位点，句子其余部分则刻画这一身高程度。
