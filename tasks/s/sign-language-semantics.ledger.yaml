      ### 3.3 Plurals and pluractionals
    step1: TBD
    step2: TBD
  - id: 126
    kind: body
    source: |-
      The logical notion of plurality is expressed overtly in some way in many of the world’s languages: pluralizing operations may apply to nouns or verbs to indicate a plurality of objects or events (for nouns: ‘plurals’; for verbs: ‘pluractionals’). Historically, arguments of Logical Visibility have not been made for plurals in sign languages, since—while overt plural marking certainly exists in sign language—plural morphemes also appear overtly in spoken languages (e.g., English singular *horse* vs. plural *horses*).
    step1: TBD
    step2: TBD
  - id: 127
    kind: body
    source: |-
      Nevertheless, mirroring areas of language in which arguments of Logical Visibility *do* apply, plural formation in sign language shows a number of unique and revealing properties. First, the morphological expression of this logical concept is similar for both nouns and verbs across a large number of unrelated sign languages: for both plural nouns (Pfau & Steinbach 2006)[^pfau-2006] and pluractional verbs (Kuhn & Aristodemo 2017)[^aristodemo-2017][^kuhn-2017], plurality is expressed by repetition. We note that repetition-based plurals and pluractionals also exist in speech (Sapir 1921: 79)[^sapir-1921].
    step1: TBD
    step2: TBD
  - id: 128
    kind: body
    source: |-
      Second, in sign language, these repeated plural forms have been shown to feed iconic processes. Modifications of the way in which the sign is repeated may indicate the number of objects or events, or may indicate the arrangement of these pluralities in space or time. Relatedly, so-called ‘punctuated’ repetitions (with clear breaks between the iterations) refer to precise plural quantities (e.g., three objects or events for three iterations), while ‘unpunctuated’ repetitions (without clear breaks between the iterations) refer to plural quantities with vague thresholds, and often ‘at least’ readings (Pfau & Steinbach 2006; Schlenker & Lamberton 2022)[^pfau-2006][^schlenker-2022].
    step1: TBD
    step2: TBD
  - id: 129
    kind: body
    source: |-
      In the nominal domain, the number of repetitions may provide an indication of the number of objects, and the arrangement of the repetitions in signing space can provide a pictorial representation of the arrangement of the denotations in real space (Schlenker & Lamberton 2022)[^schlenker-2022]. For instance, the word *TROPHY* can be iterated three times on a straight line to refer to a group of trophies that are horizontally arranged; or the three iterations can be arranged as a triangle to refer to trophies arranged in a triangular fashion. A larger number of iterations serves to refer to larger groups. Here too, the iconic contribution can be at-issue and thus be interpreted in the scope of logical operators such as *if*-clauses.
    step1: TBD
    step2: TBD
  - id: 130
    kind: body
    source: |-
      **(20)**
    step1: TBD
    step2: TBD
  - id: 131
    kind: body
    source: |-
      a. *TROPHY* in ASL, repetition on a line: ![The TROPHY sign repeated to the signer's upper left, upper front, and upper right.](../assets/sign-language-semantics/image017.png)
    step1: TBD
    step2: TBD
  - id: 132
    kind: body
    source: |-
      **b.**
    step1: TBD
    step2: TBD
  - id: 133
    kind: body
    source: |-
      *TROPHY* in ASL, repetition as a triangle: ![The TROPHY sign repeated to the signer's middle left, upper front, and middle right](../assets/sign-language-semantics/image018.png)
    step1: TBD
    step2: TBD
  - id: 134
    kind: body
    source: |-
      Punctuated (= easy to count) repetitions yield meanings with precise thresholds (often with an ‘exactly’ reading, e.g., ‘exactly three trophies’ for three punctuated iterations); unpunctuated repetitions yield vague thresholds and often ‘at least’ readings (e.g., ‘several trophies’ for three unpunctuated iterations). While one may take the distinction to be conventional, it might have an iconic source. In essence, unpunctuated iterations result in a kind of pictorial vagueness on which the threshold is hard to discern; deriving the full range of ‘exactly’ and ‘at least’ readings is non-trivial, however (Schlenker & Lamberton 2022)[^schlenker-2022].
    step1: TBD
    step2: TBD
  - id: 135
    kind: body
    source: |-
      In the verbal domain, pluractionals (referring to pluralities of events) can be created by repeating a verb, for instance in LSF and ASL. A complete analysis seems to require both conventionalized grammatical components and iconic components. The form of reduplication—as identical reduplication or as alternating two-handed reduplication—appears to conventionally communicate the distribution of events with respect to either time or to participants. But a productive iconic rule also appears to be involved, as the number and speed of the repetitions gives an idea of the number and speed of the denoted events (Kuhn & Aristodemo 2017)[^aristodemo-2017][^kuhn-2017]; again, the iconic contribution can be at-issue.
    step1: TBD
    step2: TBD
  - id: 136
    kind: body
    source: |-
      Iconic plurals and pluractionals alike are now treated by way of mixed lexical entries that include a grammatical/logical component and an iconic component. For instance, if *N* is a (singular) noun denoting a set of entities *S*, then the iconic plural *N*-rep denotes the set of entities *x* such that:
    step1: TBD
    step2: TBD
  - id: 137
    kind: body
    source: |-
      1. *x* is the sum of atomic elements in *S* (i.e., $x \in *S$), and
      2. the form of *N*-rep iconically represents *x*.
    step1: TBD
    step2: TBD
  - id: 138
    kind: body
    source: |-
      Condition (i) is the standard definition of a plural; condition (ii) is the iconic part, which is itself in need of an elucidation using general tools of pictorial semantics (see Section 4).
    step1: TBD
    step2: TBD
  - id: 139
    kind: body
    source: |-
      ### 3.4 Iconic loci
    step1: TBD
    step2: TBD
  - id: 140
    kind: body
    source: |-
      Loci, which have been hypothesized to be (sometimes) the overt realization of variables, can lead a dual life as iconic representations. Singular loci may (but need not) be simplified pictures of their denotations: if so, a person-denoting locus is a structured area *I*, and pronouns are directed towards a point *i* that corresponds to the upper part of the body. In ASL, when the person is tall, one can thus point upwards (there are also metaphorical cases in which one points upwards because the person is powerful or important). When a person is understood to be in a rotated position, the direction of the pronoun correspondingly changes, as seen in (21) for a person standing upright or hanging upside down (Schlenker 2018a; see also Liddell 2003)[^liddell-2003][^schlenker-2018a].
    step1: TBD
    step2: TBD
  - id: 141
    kind: body
    source: |-
      **(21)**
    step1: TBD
    step2: TBD
  - id: 142
    kind: body
    source: |-
      An iconic locus schematically representing an upright person (left) or upside down person (right) ![](../assets/sign-language-semantics/image019.png)
    step1: TBD
    step2: TBD
  - id: 143
    kind: body
    source: |-
      Iconic mappings involving loci may also preserve abstract structural relations that have been posited to exist for various kinds of ontological objects, including mereological relations, total orderings, and domains of quantification.
    step1: TBD
    step2: TBD
  - id: 144
    kind: body
    source: |-
      First, two plural loci—indexed over areas of space—may (but need not) express mereological relations diagrammatically, with a locus *a* embedded in a locus *b* if the denotation of *a* is a mereological part of the denotation of *b* (Schlenker 2018a)[^schlenker-2018a]. For example, in (22), the ASL expression *POSS-1 STUDENT* (‘my students’) introduces a large locus (glossed as *ab* to make it clear that it contains subloci *a* and *b*—but initially just a large locus). *MOST* introduces a sublocus *a* within this large locus because the plurality denoted by *a* is a proper part of that denoted by *ab*. And critically, diagrammatic reasoning also makes available a third discourse referent: when a plural pronoun points towards *b*—the complement of the sublocus *a* within the large locus *ab*—the sentence is acceptable, and *b* is understood to refer to the students who did *not* come to class.
    step1: TBD
    step2: TBD
  - id: 145
    kind: body
    source: |-
      **(22)**
    step1: TBD
    step2: TBD
  - id: 146
    kind: body
    source: |-
      POSS-1 STUDENT IX-arc-*ab* MOST IX-arc-*a* *a*-COME CLASS. IX-arc-*b* *b*-STAY HOME. ‘Most of my students came to class. They stayed home.’ (ASL, 8, 196)
    step1: TBD
    step2: TBD
  - id: 147
