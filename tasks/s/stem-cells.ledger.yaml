      One response to this line of argument has been to claim that embryos possess a kind of potential that somatic cells and HESCs lack. An embryo has potential in the sense of having an “active disposition” and “intrinsic power” to develop into a mature human being (Lee & George 2006)[^lee-2006]. An embryo can mature on its own in the absence of interference with its development. A somatic cell, on the other hand, does not have the inherent capacity or disposition to grow into a mature human being. However, some question whether this distinction is viable, especially in the HESC research context. While it is true that somatic cells can realize their potential only with the assistance of outside interventions, an embryo’s development also requires that numerous conditions external to it are satisfied. In the case of embryos that are naturally conceived, they must implant, receive nourishment, and avoid exposure to dangerous substances *in utero*. In the case of spare embryos created through in vitro fertilization—which are presently the source of HESCs for research—the embryos must be thawed and transferred to a willing woman’s uterus. Given the role that external factors—including technological interventions—play in an embryo’s realizing its potential, one can question whether there is a morally relevant distinction between an embryo’s and somatic cell’s potential and thus raise doubts about potentiality as a foundation for the right to life (Devolder & Harris 2007)[^devolder-2007].
    step1: |-
      对这一论证路线的一种回应是主张：胚胎具有一种体细胞与 HESC 所缺乏的潜能。胚胎有潜能，意思是它具有发育为成熟的人的“主动倾向”与“内在力量”（Lee & George 2006）[^lee-2006]。胚胎可以在不受干扰的情况下自行成熟。另一方面，体细胞并不具有长成成熟的人的固有能力或倾向。然而，有人质疑这一区分是否站得住，尤其是在 HESC 研究的语境中。体细胞确实只有在外来干预的协助下才能实现其潜能，但胚胎的发育同样要求它之外的众多条件得到满足。就自然受孕的胚胎而言，它们必须着床、获得营养，并避免在 *in utero* 接触危险物质。就通过体外受精创造的剩余胚胎而言（它们目前是研究用 HESC 的来源），胚胎必须被解冻并移植到一位愿意的女性子宫内。鉴于外部因素——包括技术干预——在胚胎实现其潜能中所起的作用，人们可以质疑胚胎的潜能与体细胞的潜能之间是否存在道德上相关的区别，从而对以潜能作为生命权的基础表示怀疑（Devolder & Harris 2007）[^devolder-2007]。
    step2: |-
      面对这一路论证，有人回应说：胚胎有一种体细胞与 HESC 都没有的潜能。说胚胎有潜能，意思是它有发育为成熟的人的“主动倾向”与“内在力量”（Lee & George 2006）[^lee-2006]。胚胎在发育不受干扰时可以自行成熟；体细胞则没有长成成熟的人的固有能力或倾向。但有人怀疑这一区分能否成立，在 HESC 研究的语境里尤其如此。体细胞确实只有靠外来干预才能实现潜能，可胚胎发育同样要求外部许多条件得到满足。自然受孕的胚胎必须着床、获得营养，还要避免在 *in utero* 接触危险物质。体外受精造成的剩余胚胎（目前研究用 HESC 正来源于此）则必须解冻，再移入一位愿意的女性的子宫。既然外部因素——包括技术干预——在胚胎实现潜能中起着作用，人们就可以追问：胚胎的潜能与体细胞的潜能之间，是否真有道德上相关的区别？从而对“以潜能作为生命权基础”表示怀疑（Devolder & Harris 2007）[^devolder-2007]。
