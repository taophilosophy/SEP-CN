      ### 1.1 When does a human being begin to exist?
    step1: |-
      ### 1.1 人从何时开始存在？
    step2: |-
      ### 1.1 人从何时开始存在？
  - id: 9
    kind: body
    source: |-
      A premise of the argument against killing embryos is that human embryos are human beings. The issue of when a human being begins to exist is, however, a contested one. The standard view of those who oppose HESC research is that a human being begins to exist with the emergence of the one-cell zygote at fertilization. At this stage, human embryos are said to be “whole living member[s] of the species homo sapiens … [which] possess the epigenetic primordia for self-directed growth into adulthood, with their determinateness and identity fully intact” (George & Gomez-Lobo 2002, 258)[^george-2002]. This view is sometimes challenged on the grounds that monozygotic twinning is possible until around days 14–15 of an embryo’s development (Smith & Brogaard 2003)[^smith-2003]. An individual who is an identical twin cannot be numerically identical to the one-cell zygote, since both twins bear the same relationship to the zygote, and numerical identity must satisfy transitivity. That is, if the zygote, A, divides into two genetically identical cell groups that give rise to identical twins B and C, B and C cannot be the same individual as A because they are not numerically identical with each other. This shows that not all persons can correctly assert that they began their life as a zygote. However, it does not follow that the zygote is not a human being, or that it has not individuated. This would follow only if one held that a condition of an entity’s status as an individual human being is that it be impossible for it to cease to exist by dividing into two or more entities. But this seems implausible. Consider cases in which we imagine adult humans undergoing fission (for example, along the lines of Parfit’s thought experiments, where each half of the brain is implanted into a different body) (Parfit 1984)[^parfit-1984]. The prospect of our going out of existence through fission does not pose a threat to our current status as distinct human persons. Likewise, one might argue, the fact that a zygote may divide does not create problems for the view that the zygote is a distinct human being.
    step1: |-
      反对杀死胚胎的论证有一个前提：人类胚胎是人。然而，人从何时开始存在，是一个有争议的问题。反对 HESC 研究者的标准看法是：人随着受精时单细胞受精卵的出现而开始存在。在这个阶段，人类胚胎被说成是“homo sapiens 物种的完整活成员……〔它〕拥有自我导向地成长为成人的表观遗传原基，其确定性与同一性完全无损”（George & Gomez-Lobo 2002, 258）[^george-2002]。这一看法有时受到挑战，理由是：胚胎发育到约 14—15 天之前，同卵孪生都有可能（Smith & Brogaard 2003）[^smith-2003]。一个同卵双生子不可能与单细胞受精卵数值同一，因为两个双生子与受精卵的关系相同，而数值同一必须满足传递性。也就是说，如果受精卵 A 分裂为两个基因上相同的细胞群，进而长成同卵双生子 B 和 C，那么 B 和 C 不可能是与 A 相同的个体，因为二者彼此并不数值同一。这表明，并非所有人都能正确断言自己以受精卵的形态开始了生命。然而，由此推不出受精卵不是人，也推不出它尚未个体化。只有当我们认定“实体成为个体的人”的条件之一是它不可能靠分裂为两个或更多实体而停止存在，上述结论才推得出来。但这似乎不可信。试想成年人经历分裂的情形。帕菲特设想把大脑的两半分别植入不同的身体，我们可以照此设想（Parfit 1984）[^parfit-1984]。我们有可能通过分裂而不再存在，这一前景并不威胁我们当下作为彼此不同的人的地位。同样，人们可以论证，受精卵可能分裂这一事实，并不给“受精卵是一个独立的人”这一看法造成麻烦。
    step2: |-
      反对杀死胚胎的论证有一个前提：人类胚胎是人。可是，人从何时开始存在，本身就有争议。反对 HESC 研究的人通常认为，人随着受精时单细胞受精卵的出现而开始存在。他们说，此时的人类胚胎是“homo sapiens 物种的完整活成员……〔它〕拥有自我导向地长成人的表观遗传原基，其确定性与同一性完全无损”（George & Gomez-Lobo 2002, 258）[^george-2002]。这一看法有时遭到反驳：胚胎发育到 14—15 天左右之前，同卵孪生仍有可能（Smith & Brogaard 2003）[^smith-2003]。同卵双生子之一不可能与那个单细胞受精卵数值同一。两个双生子与受精卵的关系完全对等，而数值同一必须满足传递性。也就是说，若受精卵 A 分裂成两个基因上相同的细胞群，长成同卵双生子 B 与 C，那么 B、C 都不可能是 A 这个个体，因为二者彼此并不数值同一。可见，并非所有人都能如实说自己是从一个受精卵开始的。但这推不出受精卵不是人，也推不出它还没有个体化。只有当我们认定“实体成为个体的人”的条件之一是它不可能靠分裂成两个或更多实体而停止存在，上述结论才推得出来。而这似乎不可信。想想成年人经历分裂的情形：帕菲特设想过把大脑的两半分别植入不同的身体（Parfit 1984）[^parfit-1984]。我们有可能因分裂而不再存在，这一前景并不威胁我们当下作为彼此不同的人的地位。同样可以论证：受精卵可能分裂，并不妨碍“受精卵是一个独立的人”这一看法。
  - id: 10
    kind: body
    source: |-
      There are, however, other grounds on which some have sought to reject that the early human embryo is a human being. According to one view, the cells that comprise the early embryo are a bundle of homogeneous cells that exist in the same membrane but do not form a human organism because the cells do not function in a coordinated way to regulate and preserve a single life (Smith & Brogaard 2003, McMahan 2002)[^mcmahan-2002][^smith-2003]. While each of the cells is alive, they only become parts of a human organism when there is substantial cell differentiation and coordination, which occurs around day-16 after fertilization. Thus, on this account, disaggregating the cells of the 5-day embryo to derive HESCs does not entail the destruction of a human being.
    step1: |-
      然而，有些人还从别的根据出发，试图否认早期人类胚胎是人。按一种看法，构成早期胚胎的细胞是一束同质的细胞，它们存在于同一层膜之内，却不构成一个人类有机体，因为这些细胞并未以协调的方式运作，以调节并维持一个单一的生命（Smith & Brogaard 2003, McMahan 2002）[^mcmahan-2002][^smith-2003]。虽然每一个细胞都是有生命的，但只有在出现实质性的细胞分化与协调之后，它们才成为人类有机体的各个部分；而这种分化与协调大约出现在受精后第 16 天。因此，按这一说法，把 5 天胚胎的细胞解离以获取 HESC，并不等于毁灭一个人。
    step2: |-
      不过，也有人从别的根据出发，试图否认早期人类胚胎是人。一种看法是：早期胚胎的细胞不过是一束同质细胞，它们同处一层膜内，却不构成人类有机体——因为这些细胞并不协同运作去调节、维持同一个生命（Smith & Brogaard 2003, McMahan 2002）[^mcmahan-2002][^smith-2003]。每个细胞都活着，但只有在细胞出现实质分化并彼此协调之后，它们才成为人类有机体的组成部分；这大约是受精后第 16 天的事。所以按这一说法，把 5 天胚胎的细胞解离、据以获取 HESC，并不是毁灭一个人。
  - id: 11
    kind: body
    source: |-
      This account is subject to dispute on empirical grounds. That there is some intercellular coordination in the zygote is revealed by the fact that the development of the early embryo requires that some cells become part of the trophoblast while others become part of the inner cell mass. Without some coordination between the cells, there would be nothing to prevent all cells from differentiating in the same direction (Damschen, Gomez-Lobo and Schonecker 2006). The question remains, though, whether this degree of cellular interaction is sufficient to render the early human embryo a human being. Just how much intercellular coordination must exist for a group of cells to constitute a human organism cannot be resolved by scientific facts about the embryo, but is instead an open metaphysical question (McMahan 2007a)[^mcmahan-2007a].
    step1: |-
      这一说法在经验层面有争议。受精卵中确实存在某种细胞间的协调，这从下述事实可以看出：早期胚胎的发育要求一部分细胞成为滋养层的一部分，另一部分细胞成为内细胞团的一部分。若细胞之间全无协调，就没有任何东西能阻止所有细胞朝同一方向分化（Damschen, Gomez-Lobo and Schonecker 2006）。然而问题仍未解决：这种程度的细胞相互作用是否足以使早期人类胚胎成为人？一组细胞要构成人类有机体，究竟需要多少细胞间协调，这无法由关于胚胎的科学事实来解决，而是一个悬而未决的形而上学问题（McMahan 2007a）[^mcmahan-2007a]。
    step2: |-
