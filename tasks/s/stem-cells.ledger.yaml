      Researchers using HESCs are clearly implicated in the destruction of embryos where they derive the cells themselves or enlist others to derive the cells. However, most investigators who conduct research with HESCs obtain them from an existing pool of cell lines and play no role in their derivation. One view is that we cannot assign causal or moral responsibility to investigators for the destruction of embryos from which the HESCs they use are derived where their “research plans had no effect on whether the original immoral derivation occurred.” (Robertson 1999)[^robertson-1999]. This view requires qualification. There may be cases in which HESCs are derived for the express purpose of making them widely available to HESC investigators. In such instances, it may be that no individual researcher’s plans motivated the derivation of the cells. Nonetheless, one might argue that investigators who use these cells are complicit in the destruction of the embryos from which the cells were derived because they are participants in a research enterprise that creates a demand for HESCs. For these investigators to avoid the charge of complicity in the destruction of embryos, it must be the case that the researchers who derived the HESCs would have performed the derivation in the absence of external demand for the cells (Siegel 2004)[^siegel-2004].
    step1: |-
      使用 HESC 的研究者，如果自己获取细胞，或招募他人获取细胞，显然就卷入了销毁胚胎一事。然而，从事 HESC 研究的研究者大多从现有的细胞系库中取得细胞，在其获取过程中不起任何作用。有一种看法是：当研究者的“研究计划对最初那次不道德的获取是否发生并无影响”时，我们无法就其所用 HESC 所由来的胚胎被销毁，追究其因果责任或道德责任（Robertson 1999）[^robertson-1999]。这一看法需要加以限定。可能存在这样的情况：获取 HESC 就是为了让它们广泛地提供给 HESC 研究者。在这种情形下，可能并没有哪个研究者的计划促成了细胞的获取。尽管如此，人们仍可论证：使用这些细胞的研究者在胚胎被销毁一事上构成共谋，因为他们参与了一个制造 HESC 需求的研究事业。这些研究者若要避开销毁胚胎的共谋指控，就必须是这样的情形：获取 HESC 的研究者即使没有外界对这些细胞的需求，也会进行获取（Siegel 2004）[^siegel-2004]。
    step2: |-
      使用 HESC 的研究者，若自己获取细胞，或请别人去获取，显然卷入了胚胎销毁。但多数研究者用的是现成的细胞系库，在获取环节没有角色。有一种看法：如果研究者的“研究计划对最初那次不道德的获取是否发生并无影响”，就不能要他为所用 HESC 所由来的那些胚胎的销毁承担因果或道德责任（Robertson 1999）[^robertson-1999]。这一看法需要限定。有些情形下，获取 HESC 正是为了让它们广泛供应给 HESC 研究者。此时可能并没有哪位研究者的计划促成了细胞获取。但人们仍可主张：使用这些细胞的研究者参与了销毁胚胎，因为他们置身于一个制造 HESC 需求的研究事业之中。这些研究者若要避开共谋指控，前提是：获取 HESC 的研究者即使没有外界对这些细胞的需求，也照样会去获取（Siegel 2004）[^siegel-2004]。
