      Some claim that we can reconcile the ascription of a right to life to all humans with the view that higher order mental capacities ground the right to life by distinguishing between two senses of mental capacities: “immediately exercisable” capacities and “basic natural” capacities. (George and Gomez-Lobo 2002, 260)[^george-2002]. According to this view, an individual’s immediately exercisable capacity for higher mental functions is the actualization of natural capacities for higher mental functions that exist at the embryonic stage of life. Human embryos have a “rational nature,” but that nature is not fully realized until individuals are able to exercise their capacity to reason. The difference between these types of capacity is said to be a difference between degrees of development along a continuum. There is merely a quantitative difference between the mental capacities of embryos, fetuses, infants, children, and adults (as well as among infants, children, and adults). And this difference, so the argument runs, cannot justify treating some of these individuals with moral respect while denying it to others.
    step1: |-
      有人主张，我们可以把“赋予所有人类生命权”与“高阶心智能力为生命权提供根据”这两种看法调和起来，办法是区分心智能力的两种意义：“可直接运用的”能力与“基本自然的”能力（George and Gomez-Lobo 2002, 260）[^george-2002]。按这一看法，个体对高阶心智功能的可直接运用能力，是生命胚胎阶段就已存在的高阶心智功能自然能力的现实化。人类胚胎具有“理性本性”，但这一本性要等到个体能够运用其推理能力时才完全实现。据说，这些类型的能力之间的差别，是同一连续统上发育程度的差别。胚胎、胎儿、婴儿、儿童与成人的心智能力之间只有量的差别（婴儿、儿童与成人之间也一样）。而据论证，这一差别无法证成如下做法：对其中一些个体给予道德尊重，却否认另一些个体应得此种尊重。
    step2: |-
      有人主张，“所有人都有生命权”与“高阶心智能力为生命权奠基”可以调和，办法是区分心智能力的两种含义：“可直接运用的”能力与“基本自然的”能力（George and Gomez-Lobo 2002, 260）[^george-2002]。照此说法，个体对高阶心智功能的“可直接运用”能力，其实是胚胎阶段就已具备的高阶心智功能自然能力的现实化。人类胚胎有“理性本性”，但这一本性要等个体真能运用推理能力时才完全实现。两类能力的差别，据说只是同一连续统上发育程度的差别。胚胎、胎儿、婴儿、儿童与成人的心智能力只有量的差别，婴儿、儿童、成人之间亦然。而据论证，这样的差别无法证成一种做法：对上述个体中的一些给予道德尊重，对另一些则不予尊重。
