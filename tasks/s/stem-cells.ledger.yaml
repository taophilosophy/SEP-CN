      One response is that a researcher who benefits from the destruction of embryos need not sanction the act any more than the transplant surgeon who uses the organs of a murder or drunken driving victim sanctions the homicidal act (Curzer 2004)[^curzer-2004]. But this response is unlikely to be satisfactory to opponents of HESC research. There is arguably an important difference between the transplant case and HESC research insofar as the moral wrong associated with the latter (a) systematically devalues a particular class of human beings and (b) is largely socially accepted and legally permitted. Opponents of HESC research might suggest that the HESC research case is more analogous to the following kind of case: Imagine a society in which the practice of killing members of a particular racial or ethnic group is legally permitted and generally accepted. Suppose that biological materials obtained from these individuals subsequent to their deaths are made available for research uses. Could researchers use these materials while appropriately distancing themselves from the wrongful practice? Arguably, they could not. There is a heightened need to protest moral wrongs where those wrongs are socially and legally accepted. Attempts to benefit from the moral wrong in these circumstances may be incompatible with mounting a proper protest (Siegel 2003)[^siegel-2003].
    step1: |-
      一种回应是：从胚胎被销毁中受益的研究者，并不因此就认可这一行为，正如使用谋杀或醉酒驾驶受害者器官的移植外科医生并不认可杀人行为一样（Curzer 2004）[^curzer-2004]。但这一回应不大可能令反对 HESC 研究者满意。可以说，移植案例与 HESC 研究之间有一个重要差别，因为与后者相关的道德过错 (a) 系统地贬低某一类人，(b) 在很大程度上被社会接受并被法律允许。反对 HESC 研究的人可能提出，HESC 研究的情形更类似于下面这类情形：设想有一个社会，杀死某个种族或族裔群体成员的做法被法律允许并普遍接受。假定从这些人死后取得的生物材料可供研究使用。研究者能否在适当与这一过错做法保持距离的同时使用这些材料？可以说不能。在过错为社会与法律所接受的情况下，抗议道德过错的必要性反而更高。在此类情形下试图从道德过错中受益，可能与提出正当抗议不相容（Siegel 2003）[^siegel-2003]。
    step2: |-
      一种回应是：研究者从胚胎被销毁中受益，并不等于认可这一行为；就像移植外科医生使用凶杀或醉驾受害者的器官，并不等于认可杀人（Curzer 2004）[^curzer-2004]。但反对 HESC 研究的人多半不会满意。移植案例与 HESC 研究之间，可以说有个重要差别：HESC 研究牵涉的道德过错 (a) 系统地贬低某一类人，(b) 大体上为社会所接受、为法律所允许。反对者可能说，HESC 研究的情形更像这样：设想某个社会，法律允许并且普遍接受杀死某个种族或族裔群体的成员。再假定从这些人死后取得的生物材料可供研究使用。研究者能不能一边使用这些材料，一边与那过错做法适当保持距离？恐怕不能。过错愈是为社会与法律所接受，抗议它的必要就愈迫切。在此情形下试图从过错中获益，也许与正当的抗议无法相容（Siegel 2003）[^siegel-2003]。
