      Some grant that human embryos lack the properties essential to a right to life, but hold that they possess an intrinsic value that calls for a measure of respect and places at least some moral constraints on their use: “The life of a single human organism commands respect and protection … no matter in what form or shape, because of the complex creative investment it represents and because of our wonder at the divine or evolutionary processes that produce new lives from old ones.” (Dworkin l992, 84). There are, however, divergent views about the level of respect embryos command and what limits exist on their use. Some opponents of HESC research hold that the treatment of human embryos as mere research tools always fails to manifest proper respect for them. Other opponents take a less absolutist view. Some, for example, deem embryos less valuable than more mature human beings but argue that the benefits of HESC research are too speculative to warrant the destruction of embryos, and that the benefits might, in any case, be achieved through the use of noncontroversial sources of stem cells (e.g., adult stem cells) (Holm 2003)[^holm-2003].
    step1: |-
      有些人承认人类胚胎缺乏生命权所必需的属性，但主张它具有一种内在价值，这种价值要求一定程度的尊重，并对其使用构成至少某些道德约束：“单一人类有机体的生命要求尊重与保护……无论它处于何种形式或形状，因为它代表了复杂的创造性投入，也因为我们惊叹于从旧生命中产生新生命的神圣或演化过程。”（Dworkin l992, 84）然而，关于胚胎所要求的尊重程度以及对其使用有何限制，看法颇有分歧。一些反对 HESC 研究的人认为，把人类胚胎当作单纯的研究工具，总是未能表现出对它们的适当尊重。另一些反对者的观点不那么绝对。例如，有人认定胚胎的价值低于更成熟的人，但主张 HESC 研究的收益过于推测性，不足以证成销毁胚胎，而且无论如何，这些收益或许可以通过使用无争议的干细胞来源（如成体干细胞）来获得（Holm 2003）[^holm-2003]。
    step2: |-
      也有人承认人类胚胎缺少生命权所必需的属性，但认为它有一种内在价值，值得给予一定尊重，其使用也因此受到至少某些道德约束：“单一人类有机体的生命要求尊重与保护……无论形貌如何，因为它代表着复杂的创造性投入，也因为我们惊叹于那从旧生命生出新生命的神圣或演化过程。”（Dworkin l992, 84）不过，胚胎究竟要求多少尊重、对其使用有哪些限制，看法并不一致。有些反对 HESC 研究的人认为，把人类胚胎当纯粹的研究工具，永远算不上给予它应有的尊重。另一些反对者没那么绝对。例如有人认定胚胎的价值低于更成熟的人，但认为 HESC 研究的收益太过推测，不足以证成销毁胚胎；何况这些收益或许能靠无争议的干细胞来源（如成体干细胞）取得（Holm 2003）[^holm-2003]。
