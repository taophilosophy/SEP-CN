    source: |-
      Human embryonic stem cell (HESC) research offers much hope for alleviating the human suffering brought on by the ravages of disease and injury. HESCs are characterized by their capacity for self-renewal and their ability to differentiate into all types of cells of the body. The main goal of HESC research is to identify the mechanisms that govern cell differentiation and to turn HESCs into specific cell types that can be used for treating debilitating and life-threatening diseases and injuries.
    step1: |-
      人类胚胎干细胞（HESC）研究为减轻疾病与损伤之破坏所带来的人类苦难提供了很大希望。HESC 的特征在于其自我更新的能力，以及分化成身体所有类型细胞的能力。HESC 研究的主要目标是找出控制细胞分化的机制，并把 HESC 转变成可用于治疗致衰弱与威胁生命的疾病和损伤的特定细胞类型。
    step2: |-
      人类胚胎干细胞（HESC）研究给人类带来很大希望：疾病与损伤的破坏造成种种苦难，这项研究有望加以缓解。HESC 的特点是能够自我更新，并能分化成人体各类细胞。HESC 研究的主要目标，是找出支配细胞分化的机制，把 HESC 变成特定的细胞类型，用以治疗那些使人衰弱、危及生命的疾病与损伤。
  - id: 2
    kind: body
    source: |-
      Despite the tremendous therapeutic promise of HESC research, the research has met with heated opposition because the harvesting of HESCs involves the destruction of the human embryo. HESCs are derived *in vitro* around the fifth day of the embryo’s development (Thomson *et al*. 1998)[^thomson-1998]. A typical day-5 human embryo consists of 200–250 cells, most of which comprise the trophoblast, which is the outermost layer of the blastocyst. HESCs are harvested from the inner cell mass of the blastocyst, which consists of 30–34 cells. The derivation of HESC cultures requires the removal of the trophoblast. This process of disaggregating the blastocyst’s cells eliminates its potential for further development. Opponents of HESC research argue that the research is morally impermissible because it involves the unjust killing of innocent human beings.
    step1: |-
      尽管 HESC 研究有着巨大的治疗前景，这项研究却遭到激烈反对，因为采集 HESC 涉及销毁人类胚胎。HESC 是在胚胎发育第五天前后 *in vitro* 获取的（Thomson *et al*. 1998）[^thomson-1998]。一个典型的第 5 天人类胚胎由 200–250 个细胞构成，其中大多数组成滋养层，滋养层是囊胚的最外层。HESC 是从囊胚的内细胞团采集的，内细胞团由 30–34 个细胞构成。建立 HESC 培养系需要去除滋养层。这一解离囊胚细胞的过程消除了它继续发育的潜能。反对 HESC 研究的人主张，这项研究在道德上不可允许，因为它涉及不义地杀死无辜的人。
    step2: |-
      尽管 HESC 研究的治疗前景极为可观，它却遭到激烈反对：采集 HESC 要销毁人类胚胎。HESC 取自胚胎发育第五天前后的 *in vitro* 培养物（Thomson *et al*. 1998）[^thomson-1998]。典型的第 5 天人类胚胎含 200–250 个细胞，其中大多构成滋养层，即囊胚的最外层。HESC 则取自囊胚的内细胞团，那里只有 30–34 个细胞。建立 HESC 细胞系须去除滋养层；把囊胚的细胞解离，胚胎便失去了继续发育的潜能。反对者因此主张，这项研究在道德上不可允许：它不义地杀死了无辜的人。
  - id: 3
    kind: body
    source: |-
      Scientists recently succeeded in converting adult human skin cells into cells that appear to have the properties of HESCs by activating four genes in the adult cells (Takahashi *et al*. 2007; Yu *et al*. 2007)[^takahashi-2007]. The reprogrammed cells—“induced pluripotent stem cells” (iPSCs)—could ultimately eliminate the need for HESCs. However, at present, the consensus in the scientific community is that both HESC and iPSC research should be pursued, as we do not yet know whether iPSCs have the same potential as HESCs or whether it is safe to transplant them into humans. Thus, the controversies around HESC research will continue, at least in the near-term.
    step1: |-
      科学家最近成功地把成年人类皮肤细胞转化为看来具有 HESC 特性的细胞，办法是激活成年细胞中的四个基因（Takahashi *et al*. 2007; Yu *et al*. 2007）[^takahashi-2007]。这些被重编程的细胞——“诱导多能干细胞”（iPSC）——最终可能消除对 HESC 的需要。然而，目前科学界的共识是，HESC 研究与 iPSC 研究都应继续推进，因为我们尚不知道 iPSC 是否具有与 HESC 相同的潜能，也不知道把它们移植到人体是否安全。因此，围绕 HESC 研究的争议将会继续，至少在近期如此。
    step2: |-
      科学家最近做成了一件事：激活成年细胞中的四个基因，把成人的皮肤细胞转化成看似具有 HESC 特性的细胞（Takahashi *et al*. 2007; Yu *et al*. 2007）[^takahashi-2007]。这些重编程后的细胞即“诱导多能干细胞”（iPSC），最终或许能让 HESC 变得不必要。不过，科学界目前的共识是两条线都要走：iPSC 是否与 HESC 潜能相当、移植到人体是否安全，眼下都还没有答案。因此围绕 HESC 研究的争议仍将持续，至少近期如此。
  - id: 4
    kind: body
    source: |-
      While the principal source of the controversy surrounding HESC research lies in competing views about the value of human embryonic life, the scope of ethical issues in HESC research is broader than the question of the ethics of destroying human embryos. It also encompasses questions about, among other things, whether researchers who use but do not derive HESCs are complicit in the destruction of embryos, whether there is a moral distinction between creating embryos for research purposes and creating them for reproductive ends, the permissibility of cloning human embryos to harvest HESCs, and the ethics of creating human/non-human chimeras. This entry provides an overview of all but the last two issues just listed; cloning and human-non-human chimeras are addressed in separate entries.
    step1: |-
      虽然围绕 HESC 研究的争议主要源于关于人类胚胎生命价值的分歧看法，HESC 研究中的伦理问题范围却比销毁人类胚胎的伦理问题更广。它还涵盖如下问题：使用但不获取 HESC 的研究者是否在销毁胚胎一事上有共谋；为研究目的创造胚胎与为生殖目的创造胚胎之间是否有道德区别；克隆人类胚胎以采集 HESC 是否可允许；以及创造人与非人嵌合体是否合乎伦理。本词条概述上述问题中除最后两个之外的全部问题；克隆与人与非人嵌合体另有专条讨论。
    step2: |-
      围绕 HESC 研究的争议，主要源头在于人们对人类胚胎生命价值看法不一；但 HESC 研究涉及的伦理问题远不止“销毁人类胚胎是否合乎伦理”。它还牵涉以下问题：只使用 HESC 而不获取 HESC 的研究者，是否在销毁胚胎一事上负有共谋；为研究创造胚胎与为生殖创造胚胎之间有无道德区别；克隆人类胚胎以采集 HESC 是否可允许；以及创造人与非人嵌合体是否合乎伦理。本词条讨论上述问题，唯最后两项除外——克隆与人与非人嵌合体另有专条。
