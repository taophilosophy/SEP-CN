      Some accept that the human embryo is a human being but argue that the human embryo does not have the moral status requisite for a right to life. There is reason to think that species membership is not the property that determines a being’s moral status. We have all been presented with the relevant thought experiments, courtesy of Disney, Orwell, Kafka, and countless science fiction works. The results seem clear: we regard mice, pigs, insects, aliens, and so on, as having the moral status of persons in those possible worlds in which they exhibit the psychological and cognitive traits that we normally associate with mature human beings. This suggests that it is some higher-order mental capacity (or capacities) that grounds the right to life. While there is no consensus about the capacities that are necessary for the right to life, some of the capacities that have been proposed include reasoning, self-awareness, and agency (Kuhse & Singer 1992, Tooley 1983, Warren 1973)[^kuhse-1992][^tooley-1983][^warren-1973].
    step1: |-
      有些人接受人类胚胎是人，但主张人类胚胎不具有生命权所要求的道德地位。有理由认为，物种成员身份并不是决定一个存在者道德地位的属性。我们都见过相关的思想实验——多亏了迪士尼、奥威尔、卡夫卡以及无数科幻作品。结论似乎很清楚：在那些老鼠、猪、昆虫、外星人等等表现出我们通常与成熟的人相联系的心理与认知特征的可能世界中，我们把它们视为具有人的道德地位。这表明，为生命权提供根据的是某种（或某些）高阶心智能力。虽然对于哪些能力是生命权所必需的尚无共识，但已被提出的能力包括推理、自我意识与能动性（Kuhse & Singer 1992, Tooley 1983, Warren 1973）[^kuhse-1992][^tooley-1983][^warren-1973]。
    step2: |-
      也有人承认人类胚胎是人，但主张它并不具备生命权所需的那种道德地位。有理由认为，决定一个存在者道德地位的，并不是它属于哪个物种。我们都见识过相关思想实验——这要归功于迪士尼、奥威尔、卡夫卡和无数科幻作品。结论似乎很清楚：在老鼠、猪、昆虫、外星人等等表现出我们通常只在成熟的人身上见到的那些心理与认知特征的可能世界里，我们认为它们具有人的道德地位。这就提示，为生命权奠基的是某种或某些高阶心智能力。哪些能力为生命权所必需，学界尚无共识，但已被提出的有推理能力、自我意识与能动性（Kuhse & Singer 1992, Tooley 1983, Warren 1973）[^kuhse-1992][^tooley-1983][^warren-1973]。
