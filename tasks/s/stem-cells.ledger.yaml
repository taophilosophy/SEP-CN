    source: |-
      Most HESCs are derived from embryos that were created for infertility treatment but that were in excess of what the infertile individual(s) ultimately needed to achieve a pregnancy. The HESCs derived from these leftover embryos offer investigators a powerful tool for understanding the mechanisms controlling cell differentiation. However, there are scientific and therapeutic reasons not to rely entirely on leftover embryos. From a research standpoint, creating embryos through cloning technologies with cells that are known to have particular genetic mutations would allow researchers to study the underpinnings of genetic diseases *in vitro*. From a therapeutic standpoint, the HESCs obtained from leftover IVF embryos are not genetically diverse enough to address the problem of immune rejection by recipients of stem cell transplants. (Induced pluripotent stem cells may ultimately prove sufficient for these research and therapeutic ends, since the cells can (a) be selected for specific genetic mutations and (b) provide an exact genetic match for stem cell recipients.) At present, the best way to address the therapeutic problem is through the creation of a public stem cell bank that represents a genetically diverse pool of stem cell lines (Faden *et al*. 2003, Lott & Savulescu 2007)[^faden-2003][^lott-2007]. This kind of stem cell bank would require the creation of embryos from gamete donors who share the same HLA-types (i.e., similar versions of the genes that mediate immune recognition and rejection).
    step1: |-
      大多数 HESC 取自为不育治疗而创造、但超出不育个体最终实现妊娠所需数量的胚胎。取自这些剩余胚胎的 HESC 为研究者提供了理解控制细胞分化机制的有力工具。然而，无论从科学还是从治疗的角度，都有理由不完全依赖剩余胚胎。从研究角度看，用已知带有特定基因突变的细胞通过克隆技术创造胚胎，可以让研究者在 *in vitro* 研究遗传疾病的根基。从治疗角度看，取自剩余 IVF 胚胎的 HESC 在遗传上不够多样，无法解决干细胞移植受者的免疫排斥问题。（诱导多能干细胞最终或许足以满足这些研究与治疗目的，因为这些细胞 (a) 可以针对特定基因突变加以筛选，(b) 可以为干细胞受者提供精确的遗传匹配。）目前，解决治疗问题的最好办法是建立一个公共干细胞库，它代表一个遗传上多样的干细胞系池（Faden *et al*. 2003, Lott & Savulescu 2007）[^faden-2003][^lott-2007]。这类干细胞库需要从具有相同 HLA 型（即介导免疫识别与排斥的基因的相似版本）的配子捐赠者那里创造胚胎。
    step2: |-
      多数 HESC 来自这样的胚胎：它们本是为不育治疗而创造，数量却超出了不育者最终实现妊娠所需。这些剩余胚胎所提供的 HESC，是研究者理解细胞分化控制机制的有力工具。不过，无论从科学还是从治疗上看，都有理由不完全依赖剩余胚胎。研究上，用已知带特定基因突变的细胞经克隆技术造出胚胎，研究者便能在 *in vitro* 考察遗传疾病的根底。治疗上，取自剩余 IVF 胚胎的 HESC 遗传多样性不足，解决不了干细胞移植受者的免疫排斥问题。（诱导多能干细胞最终或许够用：这些细胞 (a) 可针对特定基因突变加以筛选，(b) 能与受者精确匹配。）目前解决治疗问题的最好办法，是建立一个公共干细胞库，代表一个遗传多样的干细胞系池（Faden *et al*. 2003, Lott & Savulescu 2007）[^faden-2003][^lott-2007]。这类干细胞库需要从 HLA 型相同的配子捐赠者（即介导免疫识别与排斥的基因版本相近者）创造胚胎。
