      ## 5. Stem Cell-Derived Organoids, Gastruloids, and Synthetic Embryos
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      There have been a number of recent scientific studies in which stem cells have, under certain *in vitro* culture conditions, self-organized into three-dimensional structures that resemble and recapitulate some of the functions of human organs (Lancaster & Knoblich 2014; Clevers 2016)[^clevers-2016][^lancaster-2014]. These “organoids” have been established with human stem cells for a variety of organs, including, among others, the kidney, liver, gut, pancreas, retina, and brain. In addition to organoids, stem cells have been shown to self-organize into embryo-like structures *in vitro*. Human embryonic stem cells have formed structures – referred to as “gastruloids” – that bear some resemblance to embryos during gastrulation, which is the stage several days after implantation where the body plan and some tissues tissue types, including the central nervous system, start to develop (Warmflash et al. 2014; Deglincerti *et al*. 2016; Shahbazi 2016)[^deglincerti-2016][^shahbazi-2016][^warmflash-2014]. Researchers have also combined mouse embryonic stem cells and trophoblast stem cells to create “synthetic embryos,” which have a structure akin to pre-implantation embryos (Rivron *et al*. 2018)[^rivron-2018]. Synthetic embryos have been shown to implant into the mouse uterus, though their potential to develop to term has not been demonstrated.
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      While these scientific advances offer promising avenues for better understanding human development and disease, they also raise some novel and challenging ethical issues. In the case of organoids, cerebral organoids raise the most vexing issues. Researchers have produced cerebral organoids with a degree of development similar to that of a few-months-old embryo, and have already used them to study how the Zika virus causes microcephaly in fetuses (Garcez *et al*. 2016). At present, there is some evidence that cerebral organoids may be able to receive afferent stimulations that produce simple sensations (Quadrato *et al*. 2017)[^quadrato-2017]. However, they currently lack the kind of mature neural networks and sensory inputs and outputs essential to the development of cognition. If, through bioengineering, human cerebral organoids were to develop the capacity for cognition, that would provide grounds for ascribing an elevated moral status to them, and it would raise concomitant issues about our moral obligations towards them. In the nearer term, it is more likely that cerebral organoids will develop some degree of consciousness Assuming we have a shared understanding of consciousness (e.g., phenomenal consciousness), one challenge is to identify means of measuring the presence of consciousness, since a cerebral organoid cannot communicate its internal states (Lavazza & Massimini 2018)[^lavazza-2018]. But even if we can verify that an organoid is conscious, there remains the question of the moral significance of consciousness (Shepherd 2018)[^shepherd-2018]. There is debate over whether consciousness has intrinsic value (Lee 2018)[^lee-2018], and whether in some cases it is better for a conscious being to not possess it (Kahane & Savulescu 2009)[^kahane-2009]. Those who reject the intrinsic value and moral significance of consciousness might find the case of a conscious entity that has led a solely disembodied existence, emerges and persists in the absence of any social or cultural nexus, and lacks beliefs and desires, to be a paradigmatic case where the value of consciousness is doubtful.
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      With respect to gastruloids and synthetic embryos (if the latter are successfully produced with human stem cells), the central question is whether these entities are sufficiently like human embryos in their structure and functions to give rise to moral concerns about their use in research. Gastruloids do not possess all the characteristics of an embryo, as they do not form all of the embryonic tissues (e.g., they do not have the trophectoderm, which mediates the attachment to the uterus). At the same time, gastruloids may, with extra-embryonic tissues, achieve a developmental stage in which they manifest a whole body plan. Recall that one argument (discussed in Section 1.1 above) for rejecting that human embryos are human beings is that the cells that comprise the early embryo do not function in a coordinated way to regulate and preserve a single organism. Gastruloids can in principle operate with this higher level of coordination. While one may still reject that this characteristic of gastruloids confers human rights on them, their more advanced stage of development might ground reasonable claims for according them greater respect than embryos at an earlier stage. In the case of both gastruloids and human synthetic embryos, the possibility that they ultimately lack the potential to develop into mature human beings may be of significance in morally distinguishing them from normal human embryos. As noted previously (in section 1.2 above), one argument for ascribing a high moral status to human embryos and for distinguishing the potential of human embryos from the potential of somatic cells and embryonic stem cells is that embryos have an “active disposition” and “intrinsic power” to develop into mature humans on their own. If synthetic embryos and gastruloids do not possess this disposition and power, then those who oppose some forms of human embryo research might not object to the creation and use of human gastruloids and synthetic embryos for research.
