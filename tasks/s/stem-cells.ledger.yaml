      Assume for the sake of argument that it is morally impermissible to destroy human embryos. It does not follow that all research with HESCs is impermissible, as it is sometimes permissible to benefit from moral wrongs. For example, there is nothing objectionable about transplant surgeons and patients benefiting from the organs of murder and drunken driving victims (Robertson 1988)[^robertson-1988]. If there are conditions under which a researcher may use HESCs without being complicit in the destruction of embryos, then those who oppose the destruction of embryos could support research with HESCs under certain circumstances.
    step1: |-
      为了论证起见，假定销毁人类胚胎在道德上不可允许。这并不推出所有使用 HESC 的研究都不可允许，因为有时从道德过错中受益是可允许的。例如，移植外科医生与病人从谋杀与醉酒驾驶受害者的器官中受益，并没有什么可反对的（Robertson 1988）[^robertson-1988]。如果在某些条件下研究者可以使用 HESC 而不在销毁胚胎一事上构成共谋，那么反对销毁胚胎的人在特定情形下就可以支持 HESC 研究。
    step2: |-
      姑且假定销毁人类胚胎在道德上不可允许。这并不推出一切使用 HESC 的研究都不可允许——从道德过错中受益，有时是可允许的。比如移植外科医生与病人使用凶杀或醉驾受害者的器官，没人觉得有什么不妥（Robertson 1988）[^robertson-1988]。只要存在某些条件，使研究者能在不与销毁胚胎构成共谋的前提下使用 HESC，那么反对销毁胚胎的人在特定情形下也就可以支持 HESC 研究。
