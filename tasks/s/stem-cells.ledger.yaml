      When spare embryos exist after fertility treatment, the individuals for whom the embryos were created typically have the option of storing for them for future reproductive use, donating them to other infertile couples, donating them to research, or discarding them. Some argue that as long as the decision to donate embryos for research is made after the decision to discard them, it is morally permissible to use them in HESC research even if we assume that they have the moral status of persons. The claim takes two different forms. One is that it is morally permissible to kill an individual who is about to be killed by someone else where killing that individual will help others (Curzer, H. 2004). The other is that researchers who derive HESCs from embryos that were slated for destruction do not cause their death. Instead, the decision to discard the embryos causes their death; research just causes the manner of their death (Green 2002)[^green-2002].
    step1: |-
      生育治疗之后存在剩余胚胎时，为这些胚胎而被创造出来的个体通常有以下选择：把它们储存起来供日后生殖使用、把它们捐给其他不育夫妇、捐给研究，或者丢弃。有人认为，只要捐献胚胎供研究之用的决定是在决定丢弃之后作出的，那么在 HESC 研究中使用它们在道德上就是可允许的，即便我们假定它们具有人的道德地位。这一主张有两种不同形式。一种形式是：在杀死某个个体能帮助他人的情况下，杀死一个即将被他人杀死的个体，在道德上是可允许的（Curzer, H. 2004）。另一种形式是：从预定要被销毁的胚胎中获取 HESC 的研究者并不导致这些胚胎死亡。导致它们死亡的是丢弃胚胎的决定；研究只决定它们死亡的方式（Green 2002）[^green-2002]。
    step2: |-
      生育治疗之后若还有剩余胚胎，为它们而被造出来的个体通常有几种选择：储存起来供日后生育之用，捐给其他不育夫妇，捐给研究，或者丢弃。有人认为：只要决定捐献胚胎供研究之用发生在决定丢弃之后，把它们用于 HESC 研究就道德上可允许——即便我们假定胚胎具有人的道德地位。这一主张有两种形式。其一：若杀死某个个体能帮助他人，而此人本就即将被他人杀死，那么杀死他在道德上可允许（Curzer, H. 2004）。其二：从预定销毁的胚胎中获取 HESC 的研究者并不造成胚胎死亡。造成死亡的是丢弃胚胎的决定，研究只决定它们怎样死（Green 2002）[^green-2002]。
