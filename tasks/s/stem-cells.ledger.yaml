      ## 4. Stem Cell-Derived Gametes
    step1: TBD
    step2: TBD
  - id: 38
    kind: body
    source: |-
      Recent scientific work suggests it is possible to derive gametes from human pluripotent stem cells. Researchers have generated sperm and eggs from mouse ESCs and iPSCs and have used these stem cell-derived gametes to produce offspring (Hayashi 2011; Hayashi 2012)[^hayashi-2011][^hayashi-2012]. While it may take several years before researchers succeed in deriving gametes from human stem cells, the research holds much promise for basic science and clinical application. For example, the research could provide important insights into the fundamental processes of gamete biology, assist in the understanding of genetic disorders, and provide otherwise infertile individuals a means of creating genetically related children. The ability to derive gametes from human stem cells could also reduce or eliminate the need for egg donors and thus help overcome concerns about exploitation of donors and the risks involved in egg retrieval. Nonetheless, the research gives rise to some controversial issues related to embryos, genetics, and assisted reproductive technologies (D. Mathews *et al*. 2009)[^mathews-2009].
    step1: TBD
    step2: TBD
  - id: 39
    kind: body
    source: |-
      One issue arises from the fact that some research on stem cell-derived gametes requires the creation of embryos, regardless of whether one is using ESCs or iPSCs. To establish that a particular technique for deriving human gametes from stem cells produces functional sperm and eggs, it is necessary to demonstrate that the cells can produce an embryo. This entails the creation of embryos through in vitro fertilization. Since it would not be safe to implant embryos created during the early stages of the research, the likely disposition of the embryos is that they would be destroyed. In such instances, the research would implicate all of the moral issues surrounding the creation and destruction of embryos for research. However, the creation of embryos for research in this situation would not necessitate the destruction of the embryos, as it does when embryos are created to derive stem cell lines. One could in principle store them indefinitely rather than destroy them. This would still leave one subject to the objection that life is being created for instrumental purposes. But the force of the objection is questionable since it is not clear that this instrumental use is any more objectionable than the routine and widely accepted practice of creating excess IVF embryos in the reproductive context to increase the probability of generating a sufficient number of viable ones to produce a pregnancy.
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      Further issues emerge with the prospect of being able to produce large quantities of eggs from stem cells. As the capacity to identify disease and non-disease related alleles through preimplantation genetic diagnosis (PGD) expands, the ability to create large numbers of embryos would substantially increase the chances of finding an embryo that possesses most or all of the traits one wishes to select. This would be beneficial in preventing the birth of children with genetic diseases. But matters would become morally contentious if it were possible to select for non-disease characteristics, such as sexual orientation, height, superior intelligence, memory, and musical ability. One common argument against using PGD in this way is that it could devalue the lives of those who do not exhibit the chosen characteristics. Another concern is that employing PGD to select for non-disease traits would fail to acknowledge the “giftedness of life” by treating children as “objects of our design or products of our will or instruments of our ambition” rather accepting them as they are given to us (Sandel 2004, 56)[^sandel-2004]. There is additionally a concern about advances in genetics heightening inequalities where certain traits confer social and economic advantages and only the well-off have the resources to access the technology (Buchanan 1995)[^buchanan-1995]. Of course, one can question whether the selection of non-disease traits would in fact lead to devaluing other characteristics, whether it would alter the nature of parental love, or whether it is distinct enough from currently permitted methods of gaining social and economic advantage to justify regulating the practice. Nonetheless, the capacity to produce human stem cell-derived gametes would make these issues more pressing.
    step1: TBD
    step2: TBD
