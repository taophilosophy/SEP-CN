      支持为 HESC 研究使用人类胚胎的人，即使不是大多数，也有许多大概会同意反对者的说法：在某些情形下，使用人类胚胎会表现出对人类生命缺乏适当尊重，例如把胚胎提供给真人秀竞赛的参赛者食用，或为生产化妆品而销毁胚胎。但这项研究的支持者主张，人类胚胎的价值还没有大到足以限制可能带来重大治疗收益的研究。研究的支持者还常常质疑：大多数反对者是否在赋予人类胚胎高价值这一点上前后一致，因为反对者通常对如下事实漠不关心：为生育治疗创造的许多胚胎都被丢弃了。
