      Researchers using HESCs are clearly implicated in the destruction of embryos where they derive the cells themselves or enlist others to derive the cells. However, most investigators who conduct research with HESCs obtain them from an existing pool of cell lines and play no role in their derivation. One view is that we cannot assign causal or moral responsibility to investigators for the destruction of embryos from which the HESCs they use are derived where their “research plans had no effect on whether the original immoral derivation occurred.” (Robertson 1999)[^robertson-1999]. This view requires qualification. There may be cases in which HESCs are derived for the express purpose of making them widely available to HESC investigators. In such instances, it may be that no individual researcher’s plans motivated the derivation of the cells. Nonetheless, one might argue that investigators who use these cells are complicit in the destruction of the embryos from which the cells were derived because they are participants in a research enterprise that creates a demand for HESCs. For these investigators to avoid the charge of complicity in the destruction of embryos, it must be the case that the researchers who derived the HESCs would have performed the derivation in the absence of external demand for the cells (Siegel 2004)[^siegel-2004].
    step1: TBD
    step2: TBD
  - id: 27
    kind: body
    source: |-
      The issue about complicity goes beyond the question of an HESC researcher’s role in the destruction of the particular human embryo(s) from which the cells he or she uses are derived. There is a further concern that research with existing HESCs will result in the future destruction of embryos: “[I]f this research leads to possible treatments, private investment in such efforts will increase greatly and the demand for many thousands of cell lines with different genetic profiles will be difficult to resist.” (U.S. Conference of Catholic Bishops 2001). This objection faces two difficulties. First, it appears to be too sweeping: research with adult stem cells and non-human animal stem cells, as well as general research in genetics, embryology, and cell biology could be implicated, since all of this research might advance our understanding of HESCs and result in increased demand for them. Yet, no one, including those who oppose HESC research, argues that we should not support these areas of research. Second, the claim about future demand for HESCs is speculative. Indeed, current HESC research could ultimately reduce or eliminate demand for the cells by providing insights into cell biology that enable the use of alternative sources of cells (Siegel 2004)[^siegel-2004].
    step1: TBD
    step2: TBD
  - id: 28
    kind: body
    source: |-
      While it might thus be possible for a researcher to use HESCs without being morally responsible for the destruction of human embryos, that does not end the inquiry into complicity. Some argue that agents can be complicit in wrongful acts for which they are not morally responsible. One such form of complicity arises from an association with wrongdoing that symbolizes acquiescence in the wrongdoing (Burtchaell 1989)[^burtchaell-1989]. The failure to take appropriate measures to distance oneself from moral wrongs may give rise to “metaphysical guilt,” which produces a moral taint and for which shame is the appropriate response (May 1992)[^may-1992]. The following question thus arises: Assuming it is morally wrongful to destroy human embryos, are HESC researchers who are not morally responsible for the destruction of embryos complicit in the sense of symbolically aligning themselves with a wrongful act?
    step1: TBD
    step2: TBD
  - id: 29
    kind: body
    source: |-
      One response is that a researcher who benefits from the destruction of embryos need not sanction the act any more than the transplant surgeon who uses the organs of a murder or drunken driving victim sanctions the homicidal act (Curzer 2004)[^curzer-2004]. But this response is unlikely to be satisfactory to opponents of HESC research. There is arguably an important difference between the transplant case and HESC research insofar as the moral wrong associated with the latter (a) systematically devalues a particular class of human beings and (b) is largely socially accepted and legally permitted. Opponents of HESC research might suggest that the HESC research case is more analogous to the following kind of case: Imagine a society in which the practice of killing members of a particular racial or ethnic group is legally permitted and generally accepted. Suppose that biological materials obtained from these individuals subsequent to their deaths are made available for research uses. Could researchers use these materials while appropriately distancing themselves from the wrongful practice? Arguably, they could not. There is a heightened need to protest moral wrongs where those wrongs are socially and legally accepted. Attempts to benefit from the moral wrong in these circumstances may be incompatible with mounting a proper protest (Siegel 2003)[^siegel-2003].
    step1: TBD
    step2: TBD
  - id: 30
    kind: body
    source: |-
      But even if we assume that HESC researchers cannot avoid the taint of metaphysical guilt, it is not clear that researchers who bear no moral responsibility for the destruction of embryos are morally obligated not to use HESCs. One might argue that there is a prima facie duty to avoid moral taint, but that this duty may be overridden for the sake of a noble cause.
    step1: TBD
    step2: TBD
