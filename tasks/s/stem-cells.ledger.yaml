      The main difficulty for those who appeal to such mental capacities as the touchstone for the right to life is that early human infants lack these capacities, and do so to a greater degree than many of the nonhuman animals that most deem it acceptable to kill (Marquis 2002)[^marquis-2002]. This presents a challenge for those who hold that the non-consequentialist constraints on killing human children and adults apply to early human infants. Some reject that these constraints apply to infants, and allow that there may be circumstances where it is permissible to sacrifice infants for the greater good (McMahan 2007b)[^mcmahan-2007b]. Others argue that, while infants do not have the intrinsic properties that ground a right to life, we should nonetheless treat them as if they have a right to life in order to promote love and concern towards them, as these attitudes have good consequences for the persons they will become (Benn 1973, Strong 1997)[^benn-1973][^strong-1997].
    step1: |-
      对于那些把此类心智能力当作生命权试金石的人来说，主要困难在于：早期人类婴儿缺乏这些能力，而且缺乏的程度超过许多多数人认为可以杀死的非人动物（Marquis 2002）[^marquis-2002]。这对那些主张禁止杀死人类儿童与成人的非后果主义约束适用于早期人类婴儿的人，构成了挑战。有些人否认这些约束适用于婴儿，并允许在某些情形下为更大的善而牺牲婴儿（McMahan 2007b）[^mcmahan-2007b]。另一些人则论证说，虽然婴儿不具有为生命权提供根据的内在属性，我们仍应把它们当作拥有生命权来对待，以促进对它们的爱与关怀，因为这些态度对它们日后成为的人有好的后果（Benn 1973, Strong 1997）[^benn-1973][^strong-1997]。
    step2: |-
      把此类心智能力当作生命权试金石的人，最大的麻烦是：早期人类婴儿恰恰缺少这些能力，而且缺得比许多非人动物还厉害——多数人却认为杀死那些动物并无不可（Marquis 2002）[^marquis-2002]。这就难住了那些主张“禁止杀死人类儿童与成人”的非后果主义约束也适用于早期人类婴儿的人。有人索性否认这些约束适用于婴儿，容许在某些情形下为更大的善牺牲婴儿（McMahan 2007b）[^mcmahan-2007b]。也有人认为，婴儿虽不具备为生命权奠基的内在属性，我们仍应把它们当作有生命权者来对待，以培养对它们的爱与关怀。理由是：这些态度对它们日后长成的人会有好结果（Benn 1973, Strong 1997）[^benn-1973][^strong-1997]。
