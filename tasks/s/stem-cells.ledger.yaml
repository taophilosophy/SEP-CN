      Given that a human embryo cannot reason at all, the claim that it has a rational nature has struck some as tantamount to asserting that it has the potential to become an individual that can engage in reasoning (Sagan & Singer 2007)[^sagan-2007]. But an entity’s having this potential does not logically entail that it has the same status as beings that have realized some or all of their potential (Feinberg 1986)[^feinberg-1986]. Moreover, with the advent of cloning technologies, the range of entities that we can now identify as potential persons arguably creates problems for those who place great moral weight on the embryo’s potential. A single somatic cell or HESC can in principle (though not yet in practice) develop into a mature human being under the right conditions—that is, where the cell’s nucleus is transferred into an enucleated egg, the new egg is electrically stimulated to create an embryo, and the embryo is transferred to a woman’s uterus and brought to term. If the basis for protecting embryos is that they have the potential to become reasoning beings, then, some argue, we have reason to ascribe a high moral status to the trillions of cells that share this potential and to assist as many of these cells as we reasonably can to realize their potential (Sagan & Singer 2007, Savulescu 1999)[^sagan-2007][^savulescu-1999]. Because this is a stance that we can expect nearly everyone to reject, it’s not clear that opponents of HESC research can effectively ground their position in the human embryo’s potential.
    step1: |-
      鉴于人类胚胎完全不能推理，有人认为，“人类胚胎具有理性本性”这一主张无异于断言它具有成为一个能进行推理的个体的潜能（Sagan & Singer 2007）[^sagan-2007]。但一个实体具有这种潜能，在逻辑上并不蕴涵它与已经实现其部分或全部潜能的存在者地位相同（Feinberg 1986）[^feinberg-1986]。此外，随着克隆技术的出现，我们如今能认定为潜在的人的存在者范围扩大了，这可以说给那些极为看重胚胎潜能的人造成了麻烦。单个体细胞或 HESC 在原则上（尽管在实践中尚不可能）可以在适当条件下发育为成熟的人——也就是说，把该细胞的细胞核移入去核卵，对新卵施以电刺激使之成为胚胎，再把胚胎移入女性子宫并孕育至足月。如果保护胚胎的根据在于它们有成为理性存在者的潜能，那么有人主张，我们就有理由赋予共有这一潜能的数万亿个细胞以很高的道德地位，并尽力帮助其中尽可能多的细胞实现其潜能（Sagan & Singer 2007, Savulescu 1999）[^sagan-2007][^savulescu-1999]。由于这种立场几乎人人都不会接受，反对 HESC 研究的人能否有效地把立场建立在人类胚胎的潜能之上，并不清楚。
    step2: |-
      人类胚胎完全不会推理，因此在有些人看来，“胚胎具有理性本性”这话等于说：它有潜能成为一个会推理的个体（Sagan & Singer 2007）[^sagan-2007]。可是，一个实体有这种潜能，逻辑上并不蕴涵它与那些已实现部分或全部潜能的存在者地位相同（Feinberg 1986）[^feinberg-1986]。何况克隆技术出现之后，我们如今能称为潜在的人的存在者范围宽了许多，这给极看重胚胎潜能的人添了麻烦。单个体细胞或 HESC，原则上（实践上还不行）也能在适当条件下长成成熟的人。路径是：把它的细胞核移入去核卵，电刺激新卵使之成为胚胎，再把胚胎移入女性子宫、孕育至足月。有人因此说，若保护胚胎的根据是它有成为理性存在者的潜能，那我们就有理由赋予同样具备这一潜能的数万亿个细胞以很高的道德地位，并尽力帮助其中尽可能多的细胞实现潜能（Sagan & Singer 2007, Savulescu 1999）[^sagan-2007][^savulescu-1999]。但这种立场几乎人人都不会接受，所以反对 HESC 研究的人能否靠人类胚胎的潜能站稳立场，还很可疑。
