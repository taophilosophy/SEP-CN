      ## 3. The Ethics of Creating Embryos for Stem Cell Research and Therapy
    step1: TBD
    step2: TBD
  - id: 32
    kind: body
    source: |-
      Most HESCs are derived from embryos that were created for infertility treatment but that were in excess of what the infertile individual(s) ultimately needed to achieve a pregnancy. The HESCs derived from these leftover embryos offer investigators a powerful tool for understanding the mechanisms controlling cell differentiation. However, there are scientific and therapeutic reasons not to rely entirely on leftover embryos. From a research standpoint, creating embryos through cloning technologies with cells that are known to have particular genetic mutations would allow researchers to study the underpinnings of genetic diseases *in vitro*. From a therapeutic standpoint, the HESCs obtained from leftover IVF embryos are not genetically diverse enough to address the problem of immune rejection by recipients of stem cell transplants. (Induced pluripotent stem cells may ultimately prove sufficient for these research and therapeutic ends, since the cells can (a) be selected for specific genetic mutations and (b) provide an exact genetic match for stem cell recipients.) At present, the best way to address the therapeutic problem is through the creation of a public stem cell bank that represents a genetically diverse pool of stem cell lines (Faden *et al*. 2003, Lott & Savulescu 2007)[^faden-2003][^lott-2007]. This kind of stem cell bank would require the creation of embryos from gamete donors who share the same HLA-types (i.e., similar versions of the genes that mediate immune recognition and rejection).
    step1: TBD
    step2: TBD
  - id: 33
    kind: body
    source: |-
      Each of these enterprises has its own set of ethical issues. In the case of research cloning, some raise concerns, for example, that the perfection of cloning techniques for research purposes will enable the pursuit of reproductive cloning, and that efforts to obtain the thousands of eggs required for the production of cloned embryos will result in the exploitation of women who provide the eggs (President’s Council on Bioethics 2002, Norsigian 2005)[^norsigian-2005]. With respect to stem cell banks, it is not practically possible to create a bank of HESCs that will provide a close immunological match for all recipients. This gives rise to the challenge of determining who will have biological access to stem cell therapies. We might construct the bank so that it provides matches for the greatest number of people in the population, gives everyone an equal chance of finding a match, or ensures that all ancestral/ethnic groups are fairly represented in the bank (Faden *et al*. 2003, Bok, Schill, & Faden 2004, Greene 2006)[^faden-2003][^greene-2006].
    step1: TBD
    step2: TBD
  - id: 34
    kind: body
    source: |-
      There are, however, more general challenges to the creation of embryos for research and therapeutic purposes. Some argue that the creation of embryos for non-reproductive ends is morally problematic, regardless of whether they are created through cloning or in vitro fertilization. There are two related arguments that have been advanced to morally distinguish the creation of embryos for reproductive purposes from the creation of embryos for research and therapeutic purposes. First, each embryo created for procreative purposes is originally viewed as a potential child in the sense that each is a candidate for implantation and development into a mature human. In contrast, embryos created for research or therapies are viewed as mere tools from the outset (Annas, Caplan & Elias 1996, President’s Council on Bioethics 2002). Second, while embryos created for research and therapy are produced with the intent to destroy them, the destruction of embryos created for reproduction is a foreseeable but unintended consequence of their creation (FitzPatrick 2003)[^fitzpatrick-2003].
    step1: TBD
    step2: TBD
  - id: 35
    kind: body
    source: |-
      One response to the first argument has been to suggest that we could, under certain conditions, view all research embryos as potential children in the relevant sense. If all research embryos were included in a lottery in which some of them were donated to individuals for reproductive purposes, all research embryos would have a chance at developing into mature humans (Devander 2005). Since those who oppose creating embryos for research would likely maintain their opposition in the research embryo lottery case, it is arguably irrelevant whether embryos are viewed as potential children when they are created. Of course, research embryos in the lottery case would be viewed as both potential children and potential research tools. But this is also true in the case of embryos created for reproductive purposes where patients are open to donating spare embryos to research.
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      As to the second argument, the distinction between intending and merely foreseeing harms is one to which many people attach moral significance, and it is central to the Doctrine of Double Effect. But even if one holds that this is a morally significant distinction, it is not clear that it is felicitous to characterize the destruction of spare embryos as an unintended but foreseeable side-effect of creating embryos for fertility treatment. Fertility clinics do not merely foresee that some embryos will be destroyed, as they choose to offer patients the option of discarding embryos and carry out the disposal of embryos when patients request it. Patients who elect that their embryos be discarded also do not merely foresee the embryos’ destruction; their election of that option manifests their intention that the embryos be destroyed. There is thus reason to doubt that there is a moral distinction between creating embryos for research and creating them for reproductive purposes, at least given current fertility clinic practices.
    step1: TBD
    step2: TBD
  - id: 37
    kind: body
