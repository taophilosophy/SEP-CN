      假设 5 天人类胚胎是人。按反对 HESC 研究的标准论证，属于 *Homo sapiens* 这一物种，就赋予胚胎一项不被杀死的权利。这一看法的根据是一个假设：人在其生命的各个阶段具有相同的道德地位（至少就拥有这项权利而言）。
