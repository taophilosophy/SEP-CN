      During the mid 1930s, Stebbing engaged increasingly with a general or even popular, as opposed to an exclusively philosophical or academic, audience. That is, she was active in what has recently become known as ‘public philosophy’. This development in her work was driven by her belief that the structures and principles of formal logic need not be seen as a closed, isolated system, but rather could profitably be applied to the problems and issues of modern life. This was coupled with a commitment to the practical analysis of the texts in which these problems were presented and discussed, in order to identify any illogical, flawed or misleading thinking. In *Logic in Practice* (1934) she had already aimed at a more general readership, including more overt political commentary than in *A Modern Introduction to Logic*, offering examples drawn from political speeches and newspaper reports to demonstrate examples of muddled argument and biased description. In *Philosophy and the Physicists* (1937), her focus was on the language used by scientists to explain their ideas—particularly by scientists who proposed to present these ideas in a way that was palatable, and indeed entertaining, to a popular audience. Stebbing worried that imprecise, impressionistic or sensational uses of language obscured the nature of recent scientific advances and, worse still, encouraged unjustified inferences and beliefs to be drawn from them.
    step1: |-
      1930 年代中期，斯泰宾越来越多地面向一般读者甚至大众读者，而不限于哲学或学术圈。也就是说，她活跃于近年所称的“公共哲学”。她工作上这一转向，源于她相信形式逻辑的结构与原则不必被视为封闭孤立的系统，而可以有益地应用于现代生活的问题与议题。与此相伴的，是对承载并讨论这些问题的文本作实际分析，以辨识任何不合逻辑、有缺陷或误导性的思维。在《逻辑在实践中》（1934）里，她已面向更广泛的读者，政治评论也比《逻辑学现代导论》更为直露，举出政治演说与报纸报道中的例子，以展示混乱论证与偏见描述。在《哲学与物理学家》（1937）里，她关注的是科学家解释其观念时所用的语言——尤其是那些打算以通俗甚至有趣的方式向大众呈现这些观念的科学家。斯泰宾担心，含混、印象式或耸动地使用语言，会遮蔽晚近科学进展的性质；更糟的是，会鼓励人们从中引出没有根据的推论与信念。
