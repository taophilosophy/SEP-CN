      Recent years have seen a resurgence of interest in Stebbing’s work, including her writings on logic and analysis, her relationship to the ideas and some of the individual members of the Vienna Circle, her philosophy of science and her popular publications on language and politics (see Secondary Sources, below). This new scholarship is characterised by a growing emphasis on the originality and importance of Stebbing’s ideas. 2022 saw the republication by Routledge of *Thinking to Some Purpose*, which had long been out of print and also a new monograph on Stebbing (Janssen-Lauret 2022b)[^janssen-lauret-2022b]. An edited selection of Stebbing’s papers was published by Oxford University Press in 2025, and there are two new collections of essays on her work (Coliva and Doulas 2025; Chapman 2026a)[^chapman-2026a][^coliva-2025][^coliva-2025-2][^doulas-2025].
