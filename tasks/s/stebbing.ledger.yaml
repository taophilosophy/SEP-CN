      Subsequent developments in how language has been studied and discussed in both philosophy and linguistics, however, suggest other ways of evaluating Stebbing’s legacy and her significance. She combined her commitment to formal logic with a belief in the importance of practical analysis of everyday texts and as a result in the necessity of public engagement by philosophers, in a manner which was at the time rare in academia. These aspects of her work drew attention in relation to subsequent developments in what has become known as ‘critical thinking’. For instance, Max Black, in his 1946 book by that title, offered an excerpt from *Thinking to Some Purpose* as the basis for a discussion exercise in his chapter on ‘Arguments Involving Alternatives’. Stebbing saw no discrepancy between the rigours of logical argument and the requirements of practical problem solving, and stressed the need for clarity and transparency in language use. In this, she championed the importance to philosophers of paying attention to ordinary language and the varieties of its everyday use somewhat in advance of the rise of “ordinary language philosophy” in Oxford after the Second World War.
