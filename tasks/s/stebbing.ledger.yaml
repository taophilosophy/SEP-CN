      There is room for argument, then, as to what the “metaphysical” analysis of a proposition such as (1) is; and in the early 1930s members of the Cambridge School did indeed debate the issue of the analysis of a whole range of types of proposition in great detail. Stebbing was at the centre of this debate. She drew a distinction between logical and metaphysical analysis in just the way we have outlined: logical analysis was intended to give an “unambiguous” formulation and metaphysical analysis was intended to uncover the “basic facts” on which the meaning or truth of the proposition to be analysed was grounded. Logical analysis was alternatively described as “same-level” analysis and metaphysical analysis as “new-level” or “reductive” or “directional” analysis.
    step1: |-
      于是，对于像（1）这样的命题的“形而上学”分析究竟是什么，尚有争论余地；而在 1930 年代初，剑桥学派成员确实曾围绕一整系列命题类型的分析问题进行过极为详细的辩论。斯泰宾正处于这场辩论的中心。她以我们刚才勾画的方式区分逻辑分析与形而上学分析：逻辑分析意在给出“无歧义”的表述，形而上学分析意在揭示“基本事实”，即所要分析命题的意义或真之所系。逻辑分析又被描述为“同层”分析，形而上学分析则被描述为“新层”分析、“还原”分析或“有方向的”分析。
