      The first, which she characterizes as logical, she defends by appealing to the distinction, which she attributes to Moore, between understanding a proposition and knowing its analysis, making explicit the presupposition that if one can understand a proposition, then there must be some unambiguous formulation of it. The second, which she describes as metaphysical (though it is also epistemological), expresses the further assumption that any process of analysis must take it as granted that the proposition we are seeking to analyse can be known to be true. Stebbing here merely states that the assumption is plausible and that she has no reasons to reject it (1932: 92).
    step1: |-
      第一条，她称之为逻辑的假设；其辩护诉诸她归给摩尔的一个区别，即理解一个命题与知道对它的分析之别，并明示其中的预设：如果一个人能理解一个命题，那么必定有该命题的某种无歧义表述。第二条，她描述为形而上学的（尽管它也是认识论的）；它表达进一步的假设：任何分析过程都必须把我们所要分析的命题可以知道为真这一点视为当然。斯泰宾在此只是陈述说，这一假设是合理的，她没有理由拒斥它（1932: 92）。
    step2: |-
      第一条，她称之为逻辑假设，其辩护诉诸她归给摩尔的一个区别——理解一个命题与知道对它的分析之别。这预设了一点：若能理解一个命题，则必有该命题的某种无歧义表述。第二条，她称之为形而上学假设（尽管它也是认识论的）；它表达进一步的假设：任何分析过程都必须把“我们所要分析的命题可以知道为真”视为当然。斯泰宾在此只是说，这一假设是合理的，她没有理由拒斥它（1932: 92）。
