      1. If $p$ [standing for any proposition] is to be analysed, then $p$ must be understood. It follows that there is at least one expression which unambiguously expresses $p$.
      2. If $p$ is to be analysed, then it is not always the case that $p$ is known to be false, and it is sometimes the case that $p$ is known to be true.
      3. Directional analysis is possible.
    step1: |-
      1. 如果 $p$［代表任何命题］要被分析，那么 $p$ 必须被理解。由此可推出：至少存在一个无歧义地表达 $p$ 的表达式。
      2. 如果 $p$ 要被分析，那么并非总是 $p$ 已知为假，而有时 $p$ 已知为真。
      3. 有方向的（directional）分析是可能的。
    step2: |-
