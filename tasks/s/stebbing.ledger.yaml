      In 1932 Stebbing read a paper to the Aristotelian Society entitled “The Method of Analysis in Metaphysics”, in which she sought to spell out and justify the presuppositions of the conception of analysis of the Cambridge School. She identifies three main assumptions, which she formulates as follows (1932: 85):
    step1: |-
      1932 年，斯泰宾向亚里士多德学会宣读了题为《形而上学中的分析方法》的论文，试图阐明并辩护剑桥学派分析观的各项预设。她识别出三条主要假设，并表述如下（1932: 85）：
    step2: |-
      1932 年，斯泰宾向亚里士多德学会宣读了题为《形而上学中的分析方法》的论文，试图阐明并辩护剑桥学派分析观的各项预设。她识别出三条主要假设，表述如下（1932: 85）：
  - id: 16
