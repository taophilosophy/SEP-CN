      What Stebbing found attractive in logical positivism was its respect for science and the value it placed on logic. What she rejected was its repudiation of metaphysics. (She endorsed the “logical” and “empiricism” but not the “positivism”, in other words, of the movement for which both “logical empiricism” and “logical positivism” are used as names, more or less interchangeably.) We can see her 1932 paper, “The Method of Analysis in Metaphysics”, as seeking to defend the conception of metaphysical analysis of the Cambridge School in response to the logical positivists’ critique of metaphysics. But it is in a paper she read to the British Academy in March 1933, “Logical Positivism and Analysis”, that she attempts to engage directly with logical positivism and say what she finds objectionable about it. She takes “logical positivism” to include the views of Wittgenstein, as filtered through the reports and writings of various members of the Vienna Circle such as Schlick, Carnap, and Friedrich Waismann. Focusing especially on Carnap, she criticizes his conception of “logically constructed systems” (as found in his *Aufbau* of 1928, for example) for being too abstract. However useful such a system may be in showing what can be constructed with the fewest possible assumptions and primitive terms, she argues, the world itself is not such a system. She also attacks Carnap’s “methodological solipsism” on what she calls (in Moorean vein) “the best of grounds … namely, that I *know* it to be false” (1933a: 77).
    step1: |-
      斯泰宾觉得逻辑实证主义可取之处，是它尊重科学、重视逻辑；她拒绝的是它对形而上学的否弃。（换言之，她认同这一运动的“逻辑”与“经验论”，但不认同其“实证主义”——这一运动有“逻辑经验论”与“逻辑实证主义”两个名称，大体可以互换。）她 1932 年的论文《形而上学中的分析方法》，可看作是在逻辑实证主义者对形而上学的批评面前，为剑桥学派的形而上学分析观作辩护。但真正试图与逻辑实证主义正面交锋、并说出自己究竟反对它什么，是在她 1933 年 3 月向英国学术院宣读的论文《逻辑实证主义与分析》中。她所谓的“逻辑实证主义”，包括经维也纳学派成员（如石里克、卡尔纳普、弗里德里希·魏斯曼）的转述与著作过滤后的维特根斯坦观点。她特别集中于卡尔纳普，批评其“逻辑构造系统”（如 1928 年《构造》一书中的构想）过于抽象。她论证说，无论这种系统在展示“以尽可能少的假设与初始词项能构造出什么”方面多么有用，世界本身并不是这样一个系统。她还攻击卡尔纳普的“方法论唯我论”，理由用她的话说（穆尔式的口吻）是“最好的理由……即我*知道*它是假的”（1933a: 77）。
