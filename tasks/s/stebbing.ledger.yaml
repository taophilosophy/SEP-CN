      In numerous other examples in *Thinking to Some Purpose*, Stebbing drew attention to the ways in which speakers and writers can potentially have a strong influence on the beliefs and actions of their audiences, not just through what they literally say but through how their choice of words introduces ideological assumptions or disguises necessary steps in an argument. (For more on Stebbing’s work in public philosophy, see Duran 2019; West 2022a and 2024; Dunning 2026; Egerton 2025; Körber and Tuboly 2026.)[^dunning-2026][^duran-2019][^egerton-2025][^körber-2026][^west-2022a][^west-2024]
