  - id: 7
    kind: body
    source: |-
      Stebbing’s first significant work, which established her reputation, was *A Modern Introduction to Logic*. First published in 1930, it was revised in 1933, and might justly be regarded as the first textbook of analytic philosophy: it went through several editions and was still being reprinted in the early 1960s. Its main aim was to introduce readers to the developments in logic that had taken place over the previous five decades, though she leads into this through discussion of traditional Aristotelian logic. Its title was “A Modern Introduction to Logic”, not “An Introduction to Modern Logic”. Divided into three parts, the first deals with topics that are now familiar in analytic philosophy, such as names and descriptions, logical form, the theory of descriptions, inference and implication, as well as offering an account of syllogistic theory. The second deals with scientific methodology, covering induction and causality, in particular. The third discusses definition, abstraction, and the nature and historical development of logic.
    step1: |-
      斯泰宾的第一部重要著作、也是为她确立声誉的著作，是《逻辑学现代导论》。该书 1930 年初版，1933 年修订，完全可以正当地被视为分析哲学的第一部教科书：它经历了若干版次，直到 1960 年代初仍在重印。它的主要目的是向读者介绍过去五十年间逻辑学的发展，尽管她是通过讨论传统亚里士多德逻辑来引入这些发展的。它的标题是“逻辑学现代导论”，而不是“现代逻辑学导论”。全书分三部分，第一部分讨论今天分析哲学中已属常见的话题，如名称与摹状词、逻辑形式、摹状词理论、推论与蕴涵，并阐述三段论理论。第二部分讨论科学方法论，尤其涵盖归纳与因果性。第三部分讨论定义、抽象以及逻辑学的性质与历史发展。
    step2: |-
      斯泰宾第一部重要著作、也是为她赢得声誉的著作，是《逻辑学现代导论》。该书 1930 年初版，1933 年修订，堪称分析哲学的第一部教科书：它出过好几版，直到 1960 年代初仍在重印。它的主旨是向读者介绍此前五十年间逻辑学的发展，不过她是通过讨论传统的亚里士多德逻辑来引入这一主题的。书名叫“逻辑学现代导论”，而不是“现代逻辑学导论”。全书分三编：第一编讨论如今分析哲学中已属常见的话题，如名称与摹状词、逻辑形式、摹状词理论、推论与蕴涵，并阐述三段论理论；第二编讨论科学方法论，尤其涉及归纳与因果性；第三编讨论定义、抽象以及逻辑学的性质与历史发展。
  - id: 8
    kind: body
    source: |-
      Stebbing’s conception of logic is made clear in the first and last two chapters of the book. Logical thinking is “directed” thinking, aimed at answering a question or solving a problem. As such it involves *reasoning*: identifying and articulating the premises by means of which, by valid argumentation, to arrive at relevant conclusions. Reasoning proceeds in accord with certain rules and exhibits certain forms of inference, and one of the tasks of logical theory is to articulate these rules and make explicit these forms of inference—as Aristotle first did in developing his theory of the syllogism. One reason that Stebbing included discussion of syllogistic theory was that the rules and forms are relatively simple, so that the dependence of the validity of an inference on its logical form, for example, could be more easily ascertained and elucidated. But she was also concerned to introduce modern logic. She explains the basic symbolism of Whitehead and Russell’s *Principia Mathematica* in chapter 8, for example, and the theory of relations in chapter 10. She does not give any systematic presentation of the predicate calculus, however. In keeping with her conception of directed thinking, her concern is primarily with explaining the various concepts and doctrines, such as the concept of a proposition and Russell’s theory of descriptions, which help us in understanding logical thinking and logical theory.
    step1: |-
      斯泰宾的逻辑观在本书第一章和最后两章中说得很清楚。逻辑思维是“有指向的”思维，旨在回答一个问题或解决一个难题。因此它涉及*推理*：找出并表述前提，凭有效论证由此抵达相关结论。推理按照一定规则进行，并呈现一定推论形式；逻辑理论的任务之一，就是把这些规则表述出来、把这些推论形式明示出来——亚里士多德在发展三段论理论时首先这样做了。斯泰宾之所以把三段论理论的讨论包括进来，一个原因是这些规则与形式相对简单，因而例如“一个推论的有效性依赖于其逻辑形式”这一点，可以更容易地确定和阐明。但她也关心引介现代逻辑。例如，她在第 8 章解释怀特海与罗素《数学原理》（*Principia Mathematica*）的基本符号系统，在第 10 章解释关系理论。不过，她并未对谓词演算作任何系统陈述。与她的“有指向的思维”观念一致，她主要关心的是解释各种概念与学说，如命题概念和罗素的摹状词理论，它们有助于我们理解逻辑思维与逻辑理论。
    step2: |-
      斯泰宾的逻辑观在本书第一章和最后两章中说得很清楚。逻辑思维是“有指向的”思维，旨在回答一个问题或解决一个难题。因此它涉及*推理*：找出并表述前提，再借有效论证抵达相关结论。推理遵循一定规则、呈现一定推论形式；逻辑理论的任务之一，就是把这些规则表述出来、把这些推论形式明示出来——亚里士多德在发展其三段论理论时首开此例。斯泰宾之所以讨论三段论理论，原因之一在于：其规则与形式相对简单，因而像“推论的可靠性取决于其逻辑形式”这样的依赖关系，更容易确定和阐明。但她同时也想引介现代逻辑。例如，她在第 8 章讲解怀特海与罗素《数学原理》（*Principia Mathematica*）的基本符号系统，在第 10 章讲解关系理论。不过，她并未系统讲述谓词演算。与“有指向的思维”这一观念相应，她主要关心的是阐明各种概念与学说——如命题概念、罗素的摹状词理论——它们有助于我们理解逻辑思维与逻辑理论。
  - id: 9
    kind: body
    source: |-
      Logic, according to Stebbing, is not an art, understood as “a set of rules the learning of which may fit some one to do something”, but a science—the science of possible forms (1933b: 473–4). Insofar as the logical forms that the science of logic discovers are *norms* of thinking, logic can be described as a normative science. But its normativity is not its distinguishing feature, she argues, but is merely a by-product of the fact that norms are what are discovered in logic. In recognizing (or ‘discovering’) the form of inference ‘*p*, if *p* then *q*, therefore *q*’, for example, we recognize the rule of modus ponens, which directs us in our thinking. Stebbing offers an account of the development of logic as the science of form in the final chapter of the book, tracing it from its roots in Aristotle’s *Prior Analytics* to Whitehead and Russell’s *Principia Mathematica*, in which it is finally shown, she claims, that “Demonstration as such is purely formal” (1933b: 488).
    step1: |-
      按照斯泰宾，逻辑学不是一门技艺——即不是“一套规则，学会它或许就能使某人做成某事”——而是一门科学，即可能形式的科学（1933b: 473–4）。就逻辑学所发现的逻辑形式是思维的*规范*而言，逻辑学可以被称为规范科学。但她论证说，它的规范性并不是它的区别性特征，而只是“规范正是逻辑学所发现的东西”这一事实的副产品。例如，在识别（或“发现”）推论形式“*p*，如果 *p* 则 *q*，所以 *q*”时，我们也就识别出肯定前件式这一规则，它指导我们的思维。斯泰宾在本书最后一章阐述逻辑学作为形式科学的发展，从它在亚里士多德《前分析篇》中的根源，一直追溯到怀特海与罗素的《数学原理》；她声称，后者最终表明“证明本身纯粹是形式的”（1933b: 488）。
    step2: |-
