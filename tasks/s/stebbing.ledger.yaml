      苏珊·斯泰宾是两次世界大战之间英国哲学界的领军人物。她对分析传统的形成厥功至伟：既在制度层面为它奠基，也示范了如何把它的观念与技术施用于广泛的领域。她早年治逻辑，生前主要以《逻辑学现代导论》（*A Modern Introduction to Logic*，1930）享誉学界；此书既讲传统的亚里士多德逻辑，也讲尤其与罗素、怀特海相关的新数理逻辑。此后，她既是所谓剑桥分析学派的领军人物，也是力主逻辑与日常问题相关的重要倡导者。在早期的逻辑研究中，以及后期越来越多地关于思维与推理的研究中，她强调语言在日常交流中被使用和被误用的种种情形，主张哲学家必须留意这些使用与误用。斯泰宾日益感到有责任介入当下的实际问题，并面向更广大的公众写作。《哲学与物理学家》（*Philosophy and the Physicists*，1937）与《有的放矢地思考》（*Thinking to Some Purpose*，1939）分别批评了科学普及中以及政治演说、广告、报纸社论等日常文体中的语言用法。晚年，她对逻辑与语言的关切愈发转向社会并具政治参与色彩。斯泰宾的工作预示了哲学与语言学此后的一些重要发展。
