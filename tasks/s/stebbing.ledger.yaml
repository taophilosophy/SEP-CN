      斯泰宾的名字是“莉齐·苏珊”。她不喜欢“莉齐”，一生中人人都称她“苏珊”。在写作和专业工作中，她一般只用姓名缩写，至少起初发表时署“L. S. 斯泰宾”。有位朋友推测，斯泰宾不愿哲学讨论被名字或头衔所暗示的性别、身份之类细节带偏。（关于其生平的更详尽叙述，见 Chapman 2013）[^chapman-2013]。
