      Once this distinction is drawn, it becomes possible to reject metaphysical analysis without rejecting analysis altogether. We can allow logical analysis to provide us with “unambiguous”—or at least clearer—formulations of the proposition we want to analyse. This may be sufficient to elucidate its logical form or to remove certain confusions to which it may give rise. This is what Max Black (1933), for example, advocated in a reply to Stebbing that he also read to the Aristotelian Society a few months later (see Beaney 2003)[^beaney-2003]. We can also allow “partial” metaphysical analyses. We might “reduce” propositions about the decisions of committees, for example, to propositions about the activities of its constituent members, which may be enough to explain the decisions that were made without having to further analyse what it is to be a member of a committee or indeed what it is to be a person (rational or otherwise). The correctness or usefulness of an analysis is relative to our purposes in seeking it. This purpose-relative approach to analysis was the one that Stebbing herself came to adopt. (For more on the debates about analysis in the 1930s, see Baldwin 2013; Beaney 2003, 2016. For further discussion of Stebbing’s thinking about metaphysical analysis, see Janssen-Lauret 2022a and 2026; Coliva 2021 and 2025.)[^baldwin-2013][^beaney-2003][^coliva-2021][^coliva-2025][^coliva-2025-2][^janssen-lauret-2022a][^janssen-lauret-2026]
    step1: |-
      一旦作出这一区分，就有可能拒斥形而上学分析而不必把分析整个儿拒斥掉。我们可以让逻辑分析为我们所要分析的命题提供“无歧义”的——至少是更清楚的——表述。这或许足以阐明其逻辑形式，或消除它可能引起的某些混淆。例如，马克斯·布莱克（1933）在几个月后也向亚里士多德学会宣读的一篇回应斯泰宾的文章中，就主张这样做（见 Beaney 2003）[^beaney-2003]。我们也可以允许“部分的”形而上学分析。例如，我们可以把关于委员会决定的命题“还原”为关于其成员活动的命题；这或许足以说明决定缘何如此，而不必进一步分析身为委员会成员是怎么回事，甚至也不必分析身为一个人（无论理性与否）是怎么回事。分析是否正确或有用，取决于我们寻求分析的目的。这种目的相关的分析进路，正是斯泰宾本人后来所采纳的。（关于 1930 年代分析之争的更多内容，见 Baldwin 2013；Beaney 2003, 2016。关于斯泰宾形而上学分析思想的进一步讨论，见 Janssen-Lauret 2022a 与 2026；Coliva 2021 与 2025。）[^baldwin-2013][^beaney-2003][^coliva-2021][^coliva-2025][^coliva-2025-2][^janssen-lauret-2022a][^janssen-lauret-2026]
