    source: |-
      Stebbing lived through some remarkably turbulent decades, in terms both of social and political upheavals and of philosophical developments, and these are reflected in the direction and development of her work. She was born in 1885 in North London, the youngest of six surviving children of a fish merchant. She went up to Girton College Cambridge in 1904, a time at which University study for women was very much the exception and long before Cambridge awarded degrees or even full University membership to women. Apparently her first interest was to study science, but this was deemed by her family to be too demanding for her on the grounds of her delicate health, so she matriculated in History. Whether or not it was a legitimate bar to scientific study, it is true that Stebbing suffered from ill health throughout her life. In particular, she was afflicted with Menière’s disease, a disorder of the inner ear which caused her fits of vertigo, severe headaches, and forced prolonged periods of bed rest. In later life, this condition led to hearing impairment and decreased mobility.
    step1: |-
      斯泰宾度过了一些极为动荡的几十年——无论社会与政治的剧变，还是哲学的发展——这些都在她工作的方向与发展中有所反映。她于 1885 年生于伦敦北部，是一个鱼商六个存活子女中最年幼者。她于 1904 年升入剑桥大学格顿学院；那时女子上大学还很罕见，而剑桥授予女子学位、甚至给予女子正式大学成员资格，更是很久以后的事。据说她最初的兴趣是学习科学，但家人以她身体孱弱为由，认为这对她过于吃力，于是她注册攻读历史。无论这是否构成阻止她学习科学的正当理由，斯泰宾终身健康不佳确是事实。尤其是，她患有梅尼埃病——一种内耳疾患，会引起眩晕发作、剧烈头痛，并迫使她长期卧床。晚年，这一病症导致她听力受损、行动能力下降。
