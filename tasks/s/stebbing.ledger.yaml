      > CDA aims to make its users aware of, and able to describe and deconstruct, vectors and effects in texts and semiotic materials generally which might otherwise remain to wield power uncritiqued. In these respects CDA may be a kind of wake-up call, or consciousness-raising, about the coercive or anti-democratizing effects of the discourses we live by (Toolan 2002: xxii)[^toolan-2002].
    step1: |-
      > CDA 旨在让使用者意识到、并能够描述与解构文本及一般符号材料中的向量与效果——这些力量否则可能一直不受批判地施展权力。就此而言，CDA 或许是一种警醒，或意识提升，针对我们所赖以生活的各种话语的强制或反民主化效果（Toolan 2002: xxii）[^toolan-2002]。
    step2: |-
      > CDA 旨在让使用者意识到文本及一般符号材料中的种种向量与效果，并能描述、解构这些力量——否则它们可能一直不受批判地施展下去。就此而言，CDA 或许是一记警钟，或一种意识提升，针对我们所赖以生活的话语之强制或反民主化效果（Toolan 2002: xxii）[^toolan-2002]。
