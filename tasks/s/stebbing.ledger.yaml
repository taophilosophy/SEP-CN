      *Logic in Practice* is intended to help people reason correctly, with stress laid on “the importance of considering language, which is an instrument of our thinking and is imperfect, as are all human creations” (1934a: viii). This marks a transition in Stebbing’s work: from the mid 1930s onwards she becomes more concerned with what would now be described as critical thinking (see Beaney 2017, ch.5)[^beaney-2017].
    step1: |-
