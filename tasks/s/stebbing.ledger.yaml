      Stebbing’s assertion of what she *knows* is hardly likely to be seen as a knockdown argument against any form of solipsism. She goes on to accuse Wittgenstein, and the logical positivists who were influenced by him, of confusing “direct experience” and “content”, but no evidence is offered for saddling Wittgenstein with the views she claims he had. However, in the last quarter of the paper, she makes clear that what is really at issue, in her view, is a conflict between two different conceptions of analysis, which she calls “directional analysis” and “postulational analysis”. Directional analysis is the form of analysis that she had attempted to defend in her 1932 paper. Postulational analysis is what is used “in the construction of a deductive system” (1933a: 80). Axioms are stipulated and everything else in the system is derived by the rules of inference.
    step1: |-
      斯泰宾对她所*知道*之事的断言，恐怕很难被视为对任何形式唯我论的决定性反驳。她接着指责维特根斯坦以及受其影响的逻辑实证主义者混淆了“直接经验”与“内容”，但并无证据表明她把那些观点安到维特根斯坦头上是站得住的。不过，在论文最后四分之一，她表明：在她看来，真正的问题在于两种分析观之间的冲突——她称之为“定向分析”与“公设式分析”。定向分析是她在 1932 年论文中试图辩护的分析形式。公设式分析则是“在演绎系统的构造中”所用的分析（1933a: 80）：公理被设定，系统中其余一切由推理规则推出。
