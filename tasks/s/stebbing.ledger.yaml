      然而，此后哲学与语言学中语言研究的发展，提示了评价斯泰宾遗产与意义的其他方式。她把对形式逻辑的投入与对日常文本作实际分析之重要性的信念结合起来，并因此相信哲学家必须参与公共生活——这在当时的学术界颇为罕见。她工作的这些方面，因后来所谓“批判性思维”的发展而受到注意。例如，马克斯·布莱克在 1946 年同名著作中，就摘录《思维要有目的》一段，作为其“涉及取舍的论证”一章的讨论练习。斯泰宾认为逻辑论证的严格与解决实际问题的要求并不矛盾，并强调语言使用须清晰透明。在这一点上，她倡导哲学家注意日常语言及其种种日常用法，这比二战后牛津“日常语言哲学”的兴起还要早一些。
