      苏珊·斯泰宾是第一次与第二次世界大战之间英国哲学界的领军人物。她对分析传统的发展作出了重要贡献，既在制度上确立这一传统，也展示了它的观念与技术如何能够应用于广泛的领域。她早期的研究集中于逻辑学，生前主要以《逻辑学现代导论》（*A Modern Introduction to Logic*，1930）著称；该书既论述传统的亚里士多德逻辑，也论述尤其与罗素和怀特海的工作相关联的新数理逻辑。她后来既成为所谓剑桥分析学派的领军人物，也成为逻辑与日常问题之相关性的重要倡导者。在她早期的逻辑研究中，以及越来越多地在她后期关于思维与推理的研究中，她强调语言在日常交流中被使用与被误用的方式，并主张哲学家必须注意这些使用与误用。斯泰宾越来越感到有必要介入当代的实际问题，并面向更广泛的公众。*Philosophy and the Physicists*（1937）与*Thinking to Some Purpose*（1939）分别批判了通俗科学传播中使用的语言，以及政治演说、广告和报纸社论等日常文体中使用的语言。到她生命的晚年，她对逻辑与语言的兴趣越来越具有社会指向和政治参与性。斯泰宾的工作预示了后来在哲学本身和语言学中的若干重要发展。
