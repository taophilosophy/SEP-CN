      于是，对于像（1）这样的命题的“形而上学”分析究竟是什么，尚有争论余地；而在 1930 年代初，剑桥学派成员确实曾围绕一整系列命题类型的分析问题进行过极为详细的辩论。斯泰宾正处于这场辩论的中心。她以我们刚才勾画的方式区分逻辑分析与形而上学分析：逻辑分析意在给出“无歧义”的表述，形而上学分析意在揭示“基本事实”，即所要分析命题的意义或真之所系。逻辑分析又被描述为“同层”分析，形而上学分析则被描述为“新层”分析、“还原”分析或“有方向的”分析。
