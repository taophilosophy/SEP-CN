    source: |-
      What emerges from the two papers that Stebbing wrote on analysis in 1932 and 1933? As she admitted herself, some of her arguments might well seem unconvincing or inconclusive. On the one hand, she confesses that she can find no justification for the presuppositions of directional analysis, her favoured form of analysis, at least as far as the commitment to “basic facts” is concerned. On the other hand, her objection to postulational analysis seems to amount, at times, to no more than the charge that it is not directional analysis. (For a fuller account of her critique of logical positivism, see Beaney 2016; Jannsen-Lauret 2017.)[^beaney-2016] In attempting to clarify both directional analysis and postulational analysis, and to defend the former and criticise the latter, however, she helped sharpen the issues in dispute between the Cambridge School and logical positivism. Furthermore, by encouraging dialogue between the two, in both her writings and her organizational activities, she also helped foster that critical engagement between the “ordinary language” and “ideal language” wings of analytic philosophy, as they later came to be called, which has continued to this day. In short, what she promoted, above all, was critical reflection on the nature of analysis and hence of the essential characteristics of the two main schools of thought that were to come together under the heading of “analytic philosophy”.
