      Stebbing’s given names were “Lizzie Susan”. She disliked the “Lizzie” and was universally known throughout her life as “Susan”. In her writing and professional work, she generally preferred to use just initials, and at least to begin with, she published as “L. S. Stebbing”. One friend suggested that Stebbing preferred philosophical debates not to become side-tracked by details of gender or status that might be indicated by first names or titles. (For a fuller account of her life, see Chapman 2013)[^chapman-2013].
