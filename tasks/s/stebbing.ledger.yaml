      ## 4. Logical Positivism
    step1: TBD
    step2: TBD
  - id: 33
    kind: body
    source: |-
      Stebbing played a major role in introducing logical positivism into Britain. She first met Moritz Schlick in Oxford in 1930 when they spoke in a panel together at the Seventh International Congress of Philosophy, and Schlick came to England again in 1932 to lecture at King’s College London. In 1934 she invited Rudolf Carnap to give a series of three lectures (later published as *Philosophy and Logical Syntax*) in London, where Carnap met Russell and A. J. Ayer for the first time. She was on the organization committee for the International Congress for the Unity of Science, which was held in Paris in 1935 and in Cambridge in 1938.
    step1: TBD
    step2: TBD
  - id: 34
    kind: body
    source: |-
      What Stebbing found attractive in logical positivism was its respect for science and the value it placed on logic. What she rejected was its repudiation of metaphysics. (She endorsed the “logical” and “empiricism” but not the “positivism”, in other words, of the movement for which both “logical empiricism” and “logical positivism” are used as names, more or less interchangeably.) We can see her 1932 paper, “The Method of Analysis in Metaphysics”, as seeking to defend the conception of metaphysical analysis of the Cambridge School in response to the logical positivists’ critique of metaphysics. But it is in a paper she read to the British Academy in March 1933, “Logical Positivism and Analysis”, that she attempts to engage directly with logical positivism and say what she finds objectionable about it. She takes “logical positivism” to include the views of Wittgenstein, as filtered through the reports and writings of various members of the Vienna Circle such as Schlick, Carnap, and Friedrich Waismann. Focusing especially on Carnap, she criticizes his conception of “logically constructed systems” (as found in his *Aufbau* of 1928, for example) for being too abstract. However useful such a system may be in showing what can be constructed with the fewest possible assumptions and primitive terms, she argues, the world itself is not such a system. She also attacks Carnap’s “methodological solipsism” on what she calls (in Moorean vein) “the best of grounds … namely, that I *know* it to be false” (1933a: 77).
    step1: TBD
    step2: TBD
  - id: 35
    kind: body
    source: |-
      Stebbing’s assertion of what she *knows* is hardly likely to be seen as a knockdown argument against any form of solipsism. She goes on to accuse Wittgenstein, and the logical positivists who were influenced by him, of confusing “direct experience” and “content”, but no evidence is offered for saddling Wittgenstein with the views she claims he had. However, in the last quarter of the paper, she makes clear that what is really at issue, in her view, is a conflict between two different conceptions of analysis, which she calls “directional analysis” and “postulational analysis”. Directional analysis is the form of analysis that she had attempted to defend in her 1932 paper. Postulational analysis is what is used “in the construction of a deductive system” (1933a: 80). Axioms are stipulated and everything else in the system is derived by the rules of inference.
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      What Stebbing means by a constructed system here is a system that is postulated as a *replacement* for a conceptual system used in our everyday life—in the way that set theory might be seen as postulating a replacement for our ordinary system of arithmetic. On this view, our everyday concepts and propositions are vague and need to be replaced—or “explicated”, to use Carnap’s later term—by precisely defined concepts, clearly stated axioms and logically derived propositions. Stebbing’s fundamental objection to this conception of postulational or explicatory analysis is that it misunderstands the role of analysis, which is “to understand something more clearly” (1933a: 81). Simply replacing our ordinary vague concepts by precise ones does not genuinely show what it was we understood. Consider, for example, the “replacement” of our ordinary concepts of colour by concepts scientifically defined in terms of the wavelengths of light, etc. Arguably, this can never do justice to what it is we experience when we see colours and describe them in the ordinary ways we do: it does not capture the phenomenology of our experience. In the same way, we might question whether defining numbers as sets genuinely shows what we “really mean” by number terms.
    step1: TBD
    step2: TBD
  - id: 37
    kind: body
    source: |-
      According to Stebbing, the logical positivists—and she specifically mentions Schlick in this regard—put “the pursuit of meaning” before the determination of the truth-value of propositions (1933a: 83). But this gets things precisely the wrong way around, on Stebbing’s view: we *begin* with propositions that we understand (in some sense) and can *know* to be true, and in seeking an analysis of these propositions, we aim to clarify that understanding by identifying the facts that make them true or false. This is precisely the conception of analysis that she had attempted to articulate and defend in her 1932 paper. On the explicatory conception (as Stebbing seems to construe it), on the other hand, we *postulate* something with a meaning that is intended to be clear once and for all, with the aim of thereby guiding or constraining our subsequent determinations of the truth-value of the relevant propositions.
    step1: TBD
    step2: TBD
