      Stebbing was an early proponent of what we now know as analytic philosophy. In *A Modern Introduction to Logic,* she emphasised the difference between the logical form of a proposition and the grammatical form in which that proposition might be expressed, and also the distinction between understanding a proposition and knowing its analysis. G. E. Moore had appealed to this latter distinction in arguing in “A Defence of Common Sense” (1925), for example, that one can know, with certainty, that various “common sense” propositions, such as that one exists, has a body, is a human being, and so on, are true even if one cannot give the analysis of them. All that is necessary to know that these propositions are true is to understand them (understand their meaning, as Moore put it). Indeed, Moore argued, one could not even raise the question of its correct analysis (or judge the correctness of any analysis that was offered) if one did not understand the proposition in the first place. This distinction is also fundamental to Wittgenstein’s *Tractatus*, though whether it was Wittgenstein who influenced Moore or Moore (in earlier thinking) who influenced Wittgenstein cannot be discussed here. Whatever their mutual influence, however, the distinction became central to the conception of analysis that was characteristic of what came to be known as the Cambridge School of Analysis, whose members included John Wisdom and Austin Duncan-Jones as well as Moore and Stebbing. It also included, or at least was influenced by the ideas of, Bertrand Russell, Frank P. Ramsey and C. D. Broad. (For further details, see Baldwin 2013.)[^baldwin-2013] Stebbing corresponded with Moore throughout her career and on several occasions recorded her thanks for his criticisms of her work. Early commentators tended to emphasise Moore as an influence on Stebbing’s thinking (see, for instance, Wisdom in Aristotelian Society 1948)[^aristotelian-1948]. More recent scholarship, however, has questioned the extent of such influence, highlighting the independence and originality of Stebbing’s ideas about analysis, and the extent to which she both differed from and challenged Moore (see, for instance Coliva 2021; Jannsen-Lauret 2022b; Chapman 2026b)[^chapman-2026b][^coliva-2021].
    step1: |-
      斯泰宾是今天我们所知的分析哲学的早期倡导者。在《逻辑学现代导论》中，她强调命题的逻辑形式与该命题可能被表达的语法形式之间的区别，也强调理解一个命题与知道对它的分析之间的区别。例如，G. E. 摩尔在《为常识辩护》（1925）中论证时曾诉诸后一区别：人们可以确定地知道各种“常识”命题——如某物存在、有身体、是人等等——为真，即使不能给出对它们的分析。要知道这些命题为真，所需的一切就是理解它们（用摩尔的说法，理解它们的意义）。摩尔还论证说，一个人若首先不理解该命题，甚至根本无法提出关于其正确分析的问题（也无法判断所提出的任何分析是否正确）。这一区别对维特根斯坦的《逻辑哲学论》也是根本性的，尽管究竟是维特根斯坦影响了摩尔，还是摩尔（在其更早的思想中）影响了维特根斯坦，此处无法讨论。然而，无论他们相互影响如何，这一区别都成为所谓剑桥分析学派所特有的分析观的核心；该学派成员包括约翰·威兹德姆与奥斯汀·邓肯-琼斯，以及摩尔和斯泰宾。它也包括伯特兰·罗素、弗兰克·P. 拉姆齐与 C. D. 布罗德，或至少受到他们观念的影响。（详见 Baldwin 2013。）[^baldwin-2013] 斯泰宾在全部学术生涯中与摩尔通信，并多次记录对她著作所受其批评的感谢。早期评论者倾向于强调摩尔对斯泰宾思想的影响（例如见 Wisdom，收于 Aristotelian Society 1948）[^aristotelian-1948]。然而，较新的研究质疑这种影响的程度，强调斯泰宾关于分析的观念具有独立性与原创性，并强调她与摩尔的分歧及对摩尔的挑战之大（例如见 Coliva 2021；Jannsen-Lauret 2022b；Chapman 2026b）[^chapman-2026b][^coliva-2021]。
    step2: |-
      斯泰宾是今天我们所知的分析哲学的早期倡导者。在《逻辑学现代导论》中，她强调命题的逻辑形式与该命题可能被表达的语法形式之别，也强调理解一个命题与知道对它的分析之别。例如，G. E. 摩尔在《为常识辩护》（1925）中论证时曾诉诸后一区别：人们可以确定地知道各种“常识”命题——如自己存在、有身体、是人等等——为真，即使无法给出对它们的分析。要知道这些命题为真，所需的一切就是理解它们（用摩尔的说法，理解它们的意义）。摩尔还论证说，一个人若首先不理解该命题，甚至根本无法提出关于其正确分析的问题（也无从判断所提出的任何分析是否正确）。这一区别对维特根斯坦的《逻辑哲学论》同样根本；不过，究竟是维特根斯坦影响了摩尔，还是摩尔（在其更早的思想中）影响了维特根斯坦，此处无法讨论。然而，无论相互影响如何，这一区别都成为所谓剑桥分析学派之分析观的核心；该学派成员包括约翰·威兹德姆与奥斯汀·邓肯-琼斯，以及摩尔和斯泰宾。伯特兰·罗素、弗兰克·P. 拉姆齐与 C. D. 布罗德也属其中，或至少受过他们观念的影响。（详见 Baldwin 2013。）[^baldwin-2013] 斯泰宾终其学术生涯与摩尔通信，并多次感谢摩尔对其著作的批评。早期评论者倾向于强调摩尔对斯泰宾思想的影响（例如见 Wisdom，收于 Aristotelian Society 1948）[^aristotelian-1948]。但较新的研究质疑这种影响的程度，强调斯泰宾关于分析的观念自有其独立性与原创性，也强调她与摩尔的分歧之深、挑战之大（例如见 Coliva 2021；Jannsen-Lauret 2022b；Chapman 2026b）[^chapman-2026b][^coliva-2021]。
