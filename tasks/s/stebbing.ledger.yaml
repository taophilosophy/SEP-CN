    source: |-
      While at Cambridge, Stebbing developed an interest in philosophy, apparently after happening on a copy of F. H. Bradley’s *Appearance and Reality* (1893). After completing her studies in History, she took the first part of the Moral Sciences Tripos at Cambridge and then moved to King’s College London to take an MA in Moral Science, graduating in 1912. After various short-term and part-time posts teaching in schools and universities, she was appointed to a lectureship at Bedford College for women, in the University of London, in 1920. In 1933 she made the national newspapers when she became the first woman in the UK to be appointed to a full professorship in philosophy, again at Bedford College. (Bedford College became coeducational in the 1960s but was merged with Royal Holloway College in 1985, though the philosophers there moved to King’s College London, which now has an established chair of philosophy named after Stebbing.) During the late 1930s and early 1940s she knew, or worked or corresponded with, many of the major figures in mid-twentieth century philosophy. She also devoted a great deal of time, influence, and personal income, to securing the safety of refugees from Germany and Nazi occupied countries: both exiled scholars and orphaned or fugitive children. However, her health continued to deteriorate. She suffered and apparently recovered from one bout of cancer, but the cancer returned and she died in 1943 at the age of 57.
    step1: |-
      在剑桥时，斯泰宾对哲学产生了兴趣，看来是在偶然看到 F. H. 布拉德雷《现象与实在》（*Appearance and Reality*，1893）一册之后。修完历史学业后，她在剑桥参加道德科学荣誉学位考试第一部分，然后转到伦敦国王学院攻读道德科学硕士，1912 年毕业。在若干学校和大学的短期与兼职教职之后，她于 1920 年获聘为伦敦大学贝德福德学院（女子学院）讲师。1933 年，她成为英国第一位获哲学正教授职位的女性，此事登上全国报纸；任职的仍是贝德福德学院。（贝德福德学院于 1960 年代开始男女同校，1985 年与皇家霍洛威学院合并，不过其哲学教师转到伦敦国王学院；国王学院现设有一个以斯泰宾命名的哲学讲席。）在 1930 年代末和 1940 年代初，她认识二十世纪中期哲学的许多重要人物，或与他们共事、通信。她还投入大量时间、影响力和个人收入，帮助来自德国和纳粹占领国家的难民获得安全：既有流亡学者，也有孤儿或逃亡儿童。然而她的健康继续恶化。她患过一次癌症，看来已经康复，但癌症复发，她于 1943 年去世，享年 57 岁。
    step2: |-
      在剑桥期间，斯泰宾对哲学产生了兴趣——据说是偶然读到 F. H. 布拉德雷的《现象与实在》（*Appearance and Reality*，1893）之后。修完历史学业后，她参加了剑桥道德科学荣誉学位考试的第一部分，随后转到伦敦国王学院攻读道德科学硕士，1912 年毕业。她先后在学校和大学担任过若干短期与兼职教职，1920 年获聘为伦敦大学贝德福德学院（女子学院）讲师。1933 年，她成为英国首位获哲学正教授职位的女性——任职的仍是贝德福德学院——此事登上了全国报纸。（贝德福德学院于 1960 年代开始招收男生，1985 年并入皇家霍洛威学院，其哲学系教师则转入伦敦国王学院；国王学院现设有以斯泰宾命名的哲学讲席。）1930 年代末至 1940 年代初，她结识、共事或通信于二十世纪中期哲学的许多重要人物。她还投入大量时间、影响力与个人收入，帮助来自德国及纳粹占领国家的难民获得安全——既有流亡学者，也有孤儿或逃亡儿童。然而她的健康持续恶化。她患过一场癌症，看似痊愈，癌症却复发，1943 年她去世，享年 57 岁。
