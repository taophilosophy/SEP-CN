      According to Stebbing, the logical positivists—and she specifically mentions Schlick in this regard—put “the pursuit of meaning” before the determination of the truth-value of propositions (1933a: 83). But this gets things precisely the wrong way around, on Stebbing’s view: we *begin* with propositions that we understand (in some sense) and can *know* to be true, and in seeking an analysis of these propositions, we aim to clarify that understanding by identifying the facts that make them true or false. This is precisely the conception of analysis that she had attempted to articulate and defend in her 1932 paper. On the explicatory conception (as Stebbing seems to construe it), on the other hand, we *postulate* something with a meaning that is intended to be clear once and for all, with the aim of thereby guiding or constraining our subsequent determinations of the truth-value of the relevant propositions.
