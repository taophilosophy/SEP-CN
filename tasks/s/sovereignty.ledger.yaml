      第二次世界大战以来政治哲学家对主权最突出的两次攻击，出自 1950 年代的贝特朗·德·茹弗内尔与雅克·马里坦。茹弗内尔在其 1957 年的重要著作《主权：对政治善的探究》中承认，主权是现代政治权威的一项重要属性，为平息国家之内的争端、为在抵御外人的防卫中集结合作所必需。但他严厉谴责现代的主权概念，因为它造就了一个凌驾于规则之上的权力，一个仅仅因为其法令出自其意志便应被视为正当的权力。对茹弗内尔而言，主权在霍布斯那里达到顶峰：在霍布斯的“可怖构想中，一切都归结为强制手段，这些手段使主权者得以随心所欲地颁发权利、口授法律。但这些强制手段本身不过是集中于主权者手中的社会力量的一小部分”（197）。尽管洛克、普芬道夫与卢梭等后来的思想家在主权的位置与形式上与霍布斯有别，他们“都要感受到这一机械般完美的构造的诱惑”（198）。茹弗内尔写道，这是“*主权本身*的时刻”，此后“几乎没有人还会有胆量否认”它的存在（198）。
