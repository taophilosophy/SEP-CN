      Sovereignty can also be absolute or non-absolute. How is it possible that sovereignty might be non-absolute if it is also supreme? After all, scholars like Alan James argue that sovereignty can only be either present or absent, and cannot exist partially (James 1999, 462–4)[^james-1999]. But here, absoluteness refers not to the extent or character of sovereignty, which must always be supreme, but rather to the scope of matters over which a holder of authority is sovereign. Bodin and Hobbes envisioned sovereignty as absolute, extending to all matters within the territory, unconditionally. It is possible for an authority to be sovereign over some matters within a territory, but not all. Today, many European Union (EU) member states exhibit non-absoluteness. They are sovereign in governing defense, but not in governing their currencies, trade policies, and many social welfare policies, which they administer in cooperation with EU authorities as set forth in EU law. Absolute sovereignty is quintessential modern sovereignty. But in recent decades, it has begun to be circumscribed by institutions like the EU, the UN’s practices of sanctioning intervention, and the international criminal court.
    step1: |-
      主权也可以是绝对的或非绝对的。如果主权是最高权威，它又怎么可能不是绝对的？毕竟，艾伦·詹姆斯等学者论证说，主权只能有或无，而不能部分地存在（James 1999, 462–4）[^james-1999]。但此处的绝对性所指的不是主权的程度或性质——主权必须始终是最高的——而是权威持有者在其上拥有主权的事务范围。博丹与霍布斯设想的主权是绝对的，无条件地延伸到领土之内的一切事务。一个权威可以只在领土内的某些事务上拥有主权，而非全部。今天，许多欧洲联盟（EU）成员国就表现出非绝对性：它们在治理国防方面拥有主权，在治理货币、贸易政策与许多社会福利政策方面则没有——依欧盟法律的规定，这些事务它们与欧盟机构合作管理。绝对主权是典型的现代主权。但近几十年来，它已开始受到欧盟、联合国核准干预的做法以及国际刑事法院等制度的限缩。
