      A final pair of adjectives that define sovereignty is “internal” and “external.” In this case, the words do not describe exclusive sorts of sovereignty, but different aspects of sovereignty that are coexistent and omnipresent. Sovereign authority is exercised within borders, but also, by definition, with respect to outsiders, who may not interfere with the sovereign’s governance. The state has been the chief holder of external sovereignty since the Peace of Westphalia in 1648, after which interference in other states’ governing prerogatives became illegitimate. The concept of sovereignty in international law most often connotes external sovereignty. Alan James similarly conceives of external sovereignty as constitutional independence — a state’s freedom from outside influence upon its basic prerogatives (James 1999, 460–462)[^james-1999]. Significantly, external sovereignty depends on recognition by outsiders. To states, this recognition is what a no-trespassing law is to private property — a set of mutual understandings that give property, or the state, immunity from outside interference. It is also external sovereignty that establishes the basic condition of international relations — anarchy, meaning the lack of a higher authority that makes claims on lower authorities. An assemblage of states, both internally and externally sovereign, makes up an international system, where sovereign entities ally, trade, make war, and make peace.
    step1: |-
      界定主权的最后一对形容词是“对内的”与“对外的”。在这里，这两个词描述的不是互斥的主权类型，而是共存且无处不在的主权的不同面向。主权的权威在边界之内行使，但按定义也及于外部人——他们不得干涉主权者的治理。自 1648 年威斯特伐利亚和会以来，国家一直是对外主权的主要持有者；自那时起，干涉他国的治理特权成为不正当。国际法中的主权概念最常指对外主权。艾伦·詹姆斯同样把对外主权构想为宪制独立——国家不受外来影响侵犯其基本特权的自由（James 1999, 460–462）[^james-1999]。值得注意的是，对外主权依赖于外部人的承认。对国家而言，这种承认之于国家，正如禁止擅入之法之于私有财产——一套使财产或国家免受外来干涉的共同谅解。对外主权还确立了国际关系的基本条件——无政府状态，即不存在对下位权威提出要求的更高权威。诸国家既对内也对外拥有主权，它们的聚合便构成一个国际体系，在这个体系中，各个主权实体结盟、贸易、开战与媾和。
