      In the fourth part of the work (pp. 68–84), Sharpe sets out in detail his theory of universals. He begins by stating that he admits the existence of universals both *in meant* and *extra mentem*. The following are mental universals: first and second intentions, and the acts of cognition (*intellectiones*) themselves. Extramental universals are the written and spoken terms and the universal forms existing in things. After discussing this assertion and presenting some possible objections with answers to them, Sharpe puts forward three conclusions, which he discusses in the same way as the previous general thesis. The three conclusions are: (1) the transcendentals (i.e. *ens*, *aliquid*, *res*, etc.) are common to each existent, but are not properly universals (pp. 74–80); (2) the universal forms are of five different kinds: genera, species, differences, *propria* and accidents, according to the different ways in which the singular substances participate in them (pp. 81–82); (3) there are no real universals that correspond to accidental concrete terms, such as ‘*album*’ (‘white’), ‘*dulce*’ (‘sweet’), etc. (pp. 83–84).
    step1: |-
      在著作的第四部分（68–84 页），夏普详细展开他的共相理论。他首先声明，他既承认共相存在于 *in mente*，也承认其存在于 *extra mentem*。心智的共相是：第一意向与第二意向，以及认知活动（*intellectiones*）本身。心外的共相是书写词项与口头词项，以及存在于事物中的普遍形式。在讨论这一断言并提出若干可能的反对意见及回答之后，夏普提出三个结论，并用与前述总论题相同的方式加以讨论。三个结论是：(1) 超越者（即 *ens*、*aliquid*、*res* 等）为每个存在者所共有，但并不严格地是共相（74–80 页）；(2) 普遍形式有五种：属、种、种差、固有属性与偶性，其区分依据是个体实体参与它们的方式不同（81–82 页）；(3) 不存在与偶性具体词项（如“*album*”，“白”、“*dulce*”，“甜”等）相对应的实在共相（83–84 页）。
    step2: |-
