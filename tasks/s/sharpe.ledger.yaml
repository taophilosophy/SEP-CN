      The fourth kind of general term deserves particular attention, since it is connected with Sharpe’s solution to the question of the semantic and ontological status of terms of second intention like ‘individual’ or ‘singular. This was a highly controversial question in Oxford at the end of the 14ᵗʰ century. The most common explanation was that proposed by Robert Alyngton, a fellow of Queen’s College in the 1380s. According to Alyngton, terms like ‘individual’ have to be considered singular expressions; more precisely they are “range-narrowed” expressions, like ‘this man’, because they identify a singular referent as a member of a given set of individuals. In fact, a term like ‘individual’ presupposes a general concept (that of being), the range of which is narrowed to a unique object among beings by an act of our intellect – to one object that is not common. Sharpe, however, argues that Alyngton’s answer goes against linguistic usage as well as an established fact: if Alyngton were right, then the following argument (which everybody will admit) would be formally incorrect:
