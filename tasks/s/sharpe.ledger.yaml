      As is evident from his formulations, Sharpe does not explicitly divide formal predication into formal essential and formal accidental predication, and offers two different readings of the distinction between formal predication and predication by essence. According to the common view, predication by essence is more general than formal predication. As a consequence, in the standard theory of the Oxford realists, formal predication is a sub-type of predication by essence. Sharpe introduces another interpretation, according to which the two kinds of predication at issue are complementary and mutually exclusive. This happens when predication by essence excludes the form connoted by the predicate-term being directly present in the essence signified by the subject-term (*ibid*., p. 91). Although, according to the latter reading, formal predication is not a kind of predication by essence, this reading nevertheless implies an interpretation of the ‘is’ of predication in terms of identity and, therefore, a new definition of the pair of antonymous notions of identity and difference (or distinction).
    step1: |-
      从他的表述可以看出，夏普并未明确把形式谓述分为形式本质谓述与形式偶性谓述，且对形式谓述与本质述谓之区分给出两种不同读法。按通常看法，本质述谓比形式谓述更普遍。因此，在牛津实在论者的标准理论中，形式谓述是本质述谓的一个子类型。夏普引入了另一种解释：所论的两种谓述是互补且互斥的。这种情况出现在本质述谓排除谓词项所内涵的形式直接存在于主词项所意谓的本质之中时（*ibid*., p. 91）。尽管按后一读法，形式谓述不是一种本质述谓，这一读法却蕴含以同一性来解释谓述之“是”，因而蕴含对同一与差异（或区分）这对反义概念的新定义。
    step2: |-
      由上可见，夏普并未明确把形式谓述分为形式本质谓述与形式偶性谓述；对形式谓述与本质述谓之别，他给出两种读法。通常的看法是：本质述谓比形式谓述更普遍，因此在牛津实在论者的标准理论中，形式谓述是本质述谓的子类型。夏普另立一解：两种谓述互补而互斥——只要本质述谓排除谓词项所内涵的形式直接存在于主词项所意谓的本质中，便是如此（*ibid*., p. 91）。按后一读法，形式谓述虽不是本质述谓之一种，该读法却蕴含以同一性解释谓述之“是”，从而蕴含对同一与差异（区分）这对反义概念的新定义。
