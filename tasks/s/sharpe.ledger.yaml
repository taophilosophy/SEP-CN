      1. We can count the following entities as universal: (1.1) those causes that have a multiplicity of effects; (1.2) ideas in God; (1.3) the universal quantifier (*syncategorema universaliter distributivum*); (1.4) universal propositions, both affirmative and negative; (1.5) universal forms, or real universals ; and (1.6) universal signs, both mental and spoken (or written) (*QsU*., pp. 49–50).
      2. Real universals are naturally apt to be present in many things as their main metaphysical components.
      3. Real universals exist *in actu* outside the mind, since their being is the same as the being of individuals, which is actual.
