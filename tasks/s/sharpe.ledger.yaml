  - id: 11
    kind: body
    source: |-
      Sharpe’s *Quaestio super universalia* aspires to be a veritable *summa* of the discussion on universals and related topics that developed during the 14th century. This explains its size and the particular arrangement of its subject matter. The work can be divided into five main parts.
    step1: |-
      夏普的 *Quaestio super universalia* 力图成为 14 世纪发展起来的关于共相及相关主题之讨论的真正大全。这解释了它的篇幅与其题材的特殊安排。该书可分为五个主要部分。
    step2: |-
      夏普的《共相问题》（*Quaestio super universalia*）想要成为 14 世纪共相及相关问题讨论的一部真正大全（*summa*）。这也解释了它何以篇幅庞大、题材安排又别具一格。全书可分为五个主要部分。
  - id: 12
    kind: body
    source: |-
      The first part (pp. 3–24) lists twenty-one arguments in support of the nominalist thesis that the existence of universals in re should not be postulated. These arguments are disparate and not systematically arranged. Thirteen of them can also be found in treatises on universals by other fourteenth-century realist authors, specifically in the treatises by Burley, Penbygull and Whelpdale. Eight, however, do not seem to be found in other authors, and therefore they can be considered original.
    step1: |-
      第一部分（第 3–24 页）列出二十一条支持唯名论论题的论证，该论题是：不应设定共相存在于实在之中（*in re*）。这些论证彼此杂异，且未系统编排。其中十三条也见于其他 14 世纪实在论者的共相论著，具体见于伯利、彭比格尔与惠尔普代尔的论著。另有八条似乎不见于其他作者，因而可视为原创。
    step2: |-
