      The *Quaestio super universalia* is, therefore, a well-structured and original work in its basic approach and in many of the theses it supports, since Sharpe, unlike other realist authors of the second half of the 14th century, tackles the problem of universals from a purely semantic point of view. This attitude leads him to place the question of universals in the wider context of the problem of meaning and to treat it in relation to the latter. Hence, he frequently rejects as worthless certain solutions typical of the realism of the period. In other ways, however, the *Quaestio* is also a ‘school’ product, as it represents one of the most interesting results of the process of revision of the principles and theses of realism by their most open-minded and intelligent supporters – a process of revision begun in the early years of the 14th century due to Ockham’s devastating criticisms of traditional realist strategies. There are also evident similarities between Sharpe’s doctrine and those of Alyngton, Whelpdale, Penbygull, Milverley, and Tarteys, with whom he shares a certain dependence on Wyclif, whose theory of universals and predication appears to be the main point of reference for the metaphysics of these thinkers. However, for Sharpe, unlike other Oxonian thinkers who were his contemporaries, Wyclif’s *Tractatus de universalibus* and, in general, his writings on logic and metaphysics, are a point of reference in theory only – this despite the fact that he is clearly familiar with Wyclif, discussing and criticizing his views elsewhere. Although many of the arguments he lists *quod sic* and *quod non* are to be found in other 14th and early 15th century authors (though in linguistically quite different forms), we have no positive evidence that Sharpe had their works in front of him when he wrote his *Quaestio super universalia*. It seems rather that he draws on a whole repertoire of arguments, examples, questions, and opinions on universals that were in general circulation at Oxford during the time and which appears to have been largely drawn from the works of the most famous English masters of the 14th century: Scotus, Ockham, Burley, and Wyclif himself.
    step1: |-
      因此，*Quaestio super universalia* 在基本进路与它所支持的许多论题上都是一部结构良好且有原创性的著作，因为夏普与 14 世纪后半叶其他实在论作者不同，是从纯粹语义学的角度处理共相问题的。这一态度使他将共相问题置于意义问题的更广阔语境中，并使之与后者相关联。因此，他常常把当时实在论特有的某些解决方案斥为无价值。然而在其他方面，*Quaestio* 也是一部“学派”产物，因为它代表着实在论原则与论题修正过程中最有趣的成果之一，而这一修正是由实在论者中最开明、最聪明的支持者完成的——这一修正过程始于 14 世纪初，因奥卡姆对传统实在论策略的毁灭性批评而起。夏普的学说与阿林顿、惠尔普代尔、彭比格尔、米尔弗利与塔泰斯的学说之间也有明显的相似之处；他与他们一样在某种程度上依赖威克里夫，而后者的共相理论与谓述理论似乎是这些思想家形而上学的主要参照点。然而，与同时代其他牛津思想家不同，对夏普而言，威克里夫的 *Tractatus de universalibus* 以及一般而言他在逻辑学与形而上学方面的著作，只是理论上的参照点——尽管他显然熟悉威克里夫，并在别处讨论和批评过他的观点。虽然他 *quod sic* 与 *quod non* 所列的许多论证也见于其他 14 世纪与 15 世纪初的作者（尽管语言形式差别颇大），我们并无正面证据表明夏普在撰写 *Quaestio super universalia* 时手边有他们的著作。看起来他更多是利用了一整套当时在牛津流通的关于共相的论证、例证、问题与意见，而这些似乎主要取自 14 世纪最著名的英国大师——司各脱、奥卡姆、伯利以及威克里夫本人——的著作。
    step2: |-
      由此可见，《共相问题》在基本进路与所支持的许多论题上都结构良好、富有原创性。与 14 世纪后半叶其他实在论作者不同，夏普是从纯粹语义学的角度处理共相问题的。这一态度使他把它放到意义问题的更大语境里与之关联起来讨论；因此他常把当时实在论特有的某些解决方案斥为一文不值。但另一方面，《共相问题》又是一部“学派”之作：它代表着实在论原则与论题修订过程中最有趣的成果之一——那场修订由实在论阵营中最开明、最聪明的支持者推动，起于 14 世纪初，缘于奥卡姆对传统实在论策略的毁灭性批评。夏普的学说与阿林顿、惠尔普代尔、彭比格尔、米尔弗利、塔泰斯的学说明显相近；他们都在某种程度上依赖威克里夫的共相理论与谓述理论，那似乎是这批思想家形而上学的首要参照。不过，与同时代的其他牛津思想家不同，威克里夫的《共相论》（*Tractatus de universalibus*）乃至其逻辑学与形而上学著作，对夏普只是理论上的参照——尽管他显然熟悉威克里夫，并在别处讨论、批评过其观点。他 *quod sic* 与 *quod non* 所列的许多论证虽也见于 14 世纪及 15 世纪初的其他作者（语言形式差别颇大），却没有正面证据表明他写《共相问题》时手边摊着这些人的著作。他更像是动用了一整套当时在牛津流传的共相论证、例证、问题与意见，其来源大体是 14 世纪最负盛名的英国大师——司各特、奥卡姆、伯利与威克里夫本人。
