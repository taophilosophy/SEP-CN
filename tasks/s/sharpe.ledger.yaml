    kind: body
    source: |-
      Sharpe rejects the standard realist criteria for the generality (or universality, according to his terminology) of terms, and substantially accepts the sense of nominalist criticisms. In his opinion, to be matched by a common nature really existing in the world is no longer the necessary and sufficient condition for being a general term. Rather, signifying universally (that is, signifying a unitary concept that in turn refers to a multiplicity of things displaying at least a similar mode of being [*QsU*, pp. 129–30]) is a condition for semantic universality of equal importance. He thinks that those terms which signify universally have to be viewed as common, as well as those signifying a common nature existing outside the intellect (*ibid.*, p. 69). Thus, according to Sharpe, there are six different kinds of general expressions, both spoken and written:
    step1: TBD
    step2: TBD
  - id: 21
    kind: body
    source: |-
      1. those that universally signify a common nature really existing in the world (*in re*), like the term ‘humanity’;
      2. those that universally connote a common nature really existing in the world, without directly signifying it, like the term ‘white’ (‘*album*’), which refers to white things and connotes the form of whiteness;
      3. those that do not refer to anything really existing in the world, but are somehow correlated with a universal concept, like the terms ‘void’ and ‘chimaera’;
      4. those to which no common nature really existing in the world corresponds, but rather a common transcategorial negative concept, under which a multiplicity of things can be collected, like the term ‘individual’ (the negative concept involved here is the concept of *incommunicabilitas*, or impossibility-of-being-common, which characterizes individuals);
      5. equivocal terms as such, since they are connected with a multiplicity of different notions;
      6. demonstrative pronouns, like ‘this (one)’ (‘*hoc*’), when used to supposit for (refer to) a common nature, even though they can signify in a singular manner (*discrete*) only (*ibid.*, pp. 69–71).
    step1: TBD
    step2: TBD
