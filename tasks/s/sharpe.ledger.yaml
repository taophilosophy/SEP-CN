      In the second part (pp. 24–49) twenty arguments in favour of the realist thesis are presented. From the very beginning of this section Sharpe declares his adherence to the realist thesis with regard to universals. Five of the arguments in this section seem to come from the prologue of Walter Burley’s commentary on *Physics*, where universals are discussed (cf. Burley, *Expositio in libros octo Physicorum Aristotelis*, *prologus*, Venice 1501, fols. 8vb–9ra) and one from Burley’s treatise on universals. Sharpe, however, freely reworks this material and often enriches it with long deductive chains, with which he attempts to prove the two premises of the main syllogism and/or show the correctness of the *consequentia*. Two other arguments seem to be inspired by similar arguments of Scotus (*Ordinatio*, I, d. 2, p. 2, qq. 1–4 n. 398: ed. Vat., II, pp. 354 ff.), taken up and refuted by Ockham in his *Summa logicae* (p. I, c. 17: *O.Ph*., I, pp. 57 and 59). In the remaining twelve arguments, however, Sharpe probably uses more recent material, as the points of contact with Penbygull’s *De universalibus* and Alyngton’s commentary on the *Categories* show.
