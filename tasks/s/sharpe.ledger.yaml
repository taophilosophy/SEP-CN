      夏普形而上学的核心在于他的共相理论。他是实在论者，因为他为共相的心智外存在辩护（*ibid*., p. 68）；但他对唯名论持开放态度，因为他认为语言的要素与结构同世界的要素与结构之间并无紧密对应。他对整个问题的进路可界定为“分析的”，因为他似乎相信：(i) 任何本体论都必须参照语义问题的解决来建构；(ii) 任何对实在的哲学解释都必须先有对我们语言之功能的语义解释。
