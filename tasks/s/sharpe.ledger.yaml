    source: |-
      Johannes Sharpe (Scharp, Scharpe) was from the diocese of Münster in Westphalia, where he was born presumably around 1360. He received his Bachelor of Arts from the University of Prague in 1379, but spent the greatest part of his academic life in Oxford, where he was fellow at Queen’s College from 1391 to 1403, and where he became a Master of Arts and a Doctor of Theology. In 1415 he was *lector ordinarius* in Lüneburg (Saxony) (see Conti 1990, p. xvii)[^conti-1990]. The date of his death is unknown.
    step1: |-
      约翰内斯·夏普（Scharp，Scharpe）来自威斯特法伦的明斯特教区，大概约 1360 年生于此地。他 1379 年在布拉格大学获得文学学士学位，但其学术生涯的大部分时间是在牛津度过的：1391 年至 1403 年他是王后学院的研究员，并在那里成为文学硕士与神学博士。1415 年他在吕讷堡（萨克森）任 *lector ordinarius*（见 Conti 1990, p. xvii）[^conti-1990]。其卒年不详。
    step2: |-
      约翰内斯·夏普（亦作 Scharp、Scharpe）出身威斯特法伦的明斯特教区，约 1360 年生于此。1379 年他在布拉格大学取得文学学士学位，但学术生涯的大部分时光是在牛津度过的：1391 至 1403 年为王后学院研究员，并在那里先后取得文学硕士与神学博士学位。1415 年他在（萨克森的）吕讷堡任 *lector ordinarius*（见 Conti 1990, p. xvii）[^conti-1990]。卒年不详。
