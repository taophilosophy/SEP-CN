      Given the importance Schlegel attaches within his romantic poetics to the novel and to the novel which gives itself its own criterion, critics have often examined Schlegel’s own novelistic efforts in light of his theoretical stance. The scandalous and unfinished *Lucinde*, subtitled “Confessions of a Blunderer,” was, according to Schlegel, an attempt at “shaped, artistic chaos,” a work that was meant to be “chaotic and yet systematic.” Part of the achievement of its “shaped chaos” is that *Lucinde* presents, within the form of a novelistic work itself , a romantic ‘contest’ of competing novelistic possibilities (see, for example, the interpretation of the famous chapter on the “Allegory of Impudence” in Behler 1993)[^behler-1993].
    step1: |-
      鉴于施莱格尔在其浪漫诗学中赋予小说、以及赋予那种自己给自己提供标准的小说以重要地位，批评家们常常依据他的理论立场来考察施莱格尔自己的小说创作。那部引起丑闻且未完成的《卢清德》，副标题为“一个笨拙者的忏悔”，据施莱格尔说，是一次对“成形的、艺术的混沌”的尝试，一部意在“混沌而又有系统”的作品。其“成形的混沌”的成就之一在于，《卢清德》在一部小说作品的形式内部，呈现了各种相互竞争的小说可能性之间的浪漫“竞赛”（例如参见 Behler 1993 对论“无耻的寓言”那一著名章节的解释）[^behler-1993]。
    step2: |-
      施莱格尔在浪漫诗学中赋予小说——尤其是那种自己给自己立标准的小说——以重要地位，批评家因此常依其理论立场来审视他自己的小说创作。《卢清德》丑闻缠身，且未完成，副题作“一个笨拙者的忏悔”。据施莱格尔自述，此书意在“成形的、艺术的混沌”，要写成一部“混沌而又有系统”的作品。其“成形的混沌”之所以有所成就，部分在于《卢清德》在小说作品自身的形式之内，演出了一场浪漫的“竞赛”，让种种互相竞争的小说可能性同台亮相（例如参见 Behler 1993 对论“无耻的寓言”那一著名章节的解读）[^behler-1993]。
