      施莱格尔的思想传记始于通常被解释为“古典主义”的阶段。在其早期《研究》论文中，施莱格尔声称希腊诗歌是“美的”，而现代诗歌只是“有趣的”（*interessant*）：古代诗歌追求一种理想，是“客观的”；现代诗歌则是“特征的”，追求一种“个体的”或“矫饰的”原创性。（正如许多批评家所指出的，类似的区分可见于席勒同时期的著作《论素朴的诗与感伤的诗》。施莱格尔显然独立地得出了他的区分，尽管当他确实读到席勒的文章时，这促使他重新考虑自己对待更当代文学的态度：参见 Eichner 1970 第 2 章，以及施莱格尔后来为《研究》论文所写的序言。）
