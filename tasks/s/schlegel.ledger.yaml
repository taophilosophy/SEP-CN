      In all of Schlegel’s writing about literary and artistic modes and genres, there is also a powerful return to formative questions about the relations art bears to its sometimes rivals in philosophy and religion. Schlegel of course revived questions about the philosophical shape of literature and the literary shape of philosophy that ultimately run back to Plato’s “ancient quarrel” (Lacoue-Labarthe and Nancy 1978)[^lacoue-labarthe-1978]. And, like his fellow Romantics Novalis and Schleiermacher, he also closely linked art and religion in ways that picked up fundamental issues in the religious discourse of his time (see Ziolkowski 1990, Smith 2019 and Hampton 2019)[^hampton-2019][^smith-2019][^ziolkowski-1990]: the relation of the infinite and finite (‘only he can be an artist who has his own religion, an original perspective on the infinite’ [KFSA 2.257]) and the notions of symbol and myth and their connection to an increasingly pluralistic religious world (Dieckmann 1959, Speight 2019)[^dieckmann-1959][^speight-2019].
    step1: |-
      在施莱格尔所有关于文学与艺术方式及文类的写作中，还有一种向形成性问题的有力回归：艺术与它在哲学和宗教中的有时是竞争者的东西之间有何关系。施莱格尔当然重新提出了关于文学的哲学形态与哲学的文学形态的问题，这些问题最终可追溯到柏拉图的“古老争吵”（Lacoue-Labarthe and Nancy 1978）[^lacoue-labarthe-1978]。而且，像他的浪漫派同道诺瓦利斯与施莱尔马赫一样，他也以多种方式把艺术与宗教紧密联系起来，这些方式接续了他那个时代宗教话语中的根本问题（参见 Ziolkowski 1990、Smith 2019 与 Hampton 2019）[^hampton-2019][^smith-2019][^ziolkowski-1990]：无限与有限的关系（“只有拥有自己的宗教、对无限有原创性视野的人，才能成为艺术家”〔KFSA 2.257〕），以及象征与神话的观念及其与一个日益多元的宗教世界的联系（Dieckmann 1959、Speight 2019）[^dieckmann-1959][^speight-2019]。
