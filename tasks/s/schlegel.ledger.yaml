      The Schlegelian philosophy that results from this engagement with idealism is non-foundationalist, holistic and historical (see Beiser 2003, 123–26)[^beiser-2003]. Schlegel himself describes his philosophical approach as resembling both a circle and epic poetry because it must forever “begin in the middle”: “Philosophy must have at its basis not only an alternating proof [*Wechselbeweis*] but also an alternating concept [*Wechselbegriff*]. In the case of every concept, as in the case of every proof, one can in turn ask for a concept and a proof of the same. For this reason, philosophy, like an epic poem, must start in the middle, and it is impossible to pursue philosophy piece by piece starting from a first piece which is grounded and explained completely in and through itself. It is a whole, and thus the path to recognizing it is no straight line but a circle” (*KA* XVIII, 518).
    step1: |-
      由这种与观念论的交锋所产生的施莱格尔式哲学，是非基础主义的、整体论的和历史性的（参见 Beiser 2003, 123–26）[^beiser-2003]。施莱格尔本人把他的哲学进路描述为既像圆圈又像史诗，因为它必须永远“从中间开始”：“哲学不仅必须以交替证明〔*Wechselbeweis*〕为基础，还必须以交替概念〔*Wechselbegriff*〕为基础。就每个概念、正如就每个证明一样，人们都可以反过来要求关于它的概念和证明。因此，哲学像一部史诗，必须从中间开始；不可能从一个自身之内、并通过自身得到完全奠基与解释的第一块开始，一块一块地推进哲学。它是一个整体，因此认识它的道路不是一条直线，而是一个圆圈”（*KA* XVIII, 518）。
    step2: |-
      如此与观念论交锋而成的施莱格尔哲学，是非基础主义的、整体论的、历史性的（参见 Beiser 2003, 123–26）[^beiser-2003]。施莱格尔自述其哲学进路既像圆圈，又像史诗，因为它永远必须“从中间开始”：“哲学不仅须以交替证明〔*Wechselbeweis*〕为基，还须以交替概念〔*Wechselbegriff*〕为基。对每个概念、如同对每个证明，人们都可以反过来追索它的概念与证明。职是之故，哲学一如史诗，必须自中间起笔；不可能从一块自身之内、借自身而完全奠基并解释清楚的第一块砖出发，一块一块地推进哲学。它是一个整体，故认识它的道路并非直线，而是一个圆圈”（*KA* XVIII, 518）。
