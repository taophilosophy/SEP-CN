      施莱格尔对第一原理哲学的批判，与诺瓦利斯一样，植根于对绝对者、无条件者不可把握的感受。（诺瓦利斯《花粉》第一条有言：“我们处处寻求无条件者〔*das Unbedingte*〕，所得却只是事物〔*Dinge*〕。”）更具体地说，施莱格尔针对赖因霍尔德与费希特主张：“不存在普遍适用〔*zweckmässig*〕、堪作真理伴侣与向导的第一原理”（*KA* XVIII.518, #13）；即便是“自明”命题也可加以怀疑，因而需要证明——这就开启了无穷回溯；而且任何命题都能以“无限”多种方式得到证明。在施莱格尔看来，“任何证明皆可无限完善”（*KA* XVIII, 518, #9）；哲学的任务不是去寻觅一条无条件的第一原理，而是投入一种（本质为融贯论的）无限进展与逼近。
