  - id: 3
    kind: body
    source: |-
      The youngest of five sons, Schlegel was born in Hanover into a distinguished and culturally prominent literary family. His father, Johann Adolf Schlegel, was both a clergyman and literary figure; his uncle, Johann Elias, was a dramatist and aesthetic theorist; and his elder brother by five years, August Wilhelm, was to become the great German translator of Shakespeare and one of the most prominent literary critics of the time.
    step1: |-
      施莱格尔是五个儿子中最年幼的，生于汉诺威一个显赫且文化上颇为突出的文学世家。他的父亲约翰·阿道夫·施莱格尔既是牧师，也是文学人物；叔父约翰·埃利亚斯是剧作家与美学理论家；比他年长五岁的兄长奥古斯特·威廉后来成为伟大的德语莎士比亚译者，也是当时最杰出的文学批评家之一。
    step2: |-
      施莱格尔是五兄弟中最年幼者，生于汉诺威一个声名显赫、文风鼎盛的文学世家。父亲约翰·阿道夫·施莱格尔既是牧师，又是文人；叔父约翰·埃利亚斯是剧作家兼美学理论家；长他五岁的兄长奥古斯特·威廉，日后成为伟大的德语莎士比亚译者，也是当时最负盛名的文学批评家之一。
  - id: 4
    kind: body
    source: |-
      Schlegel attended the universities of Göttingen and Leipzig, originally to study law, but his intellectual interests began to widen, centering especially on classical literature, and he turned after 1793 to a life of literary freelancing. In the succeeding couple of years, he wrote several early essays on Greek literature amid plans for a history of classical poetry. Only one volume of the intended larger study was published, in 1798, as *Geschichte der Poesie der Griechen und Römer*, but the essay “On the Study of Greek Poetry” (*Über das Studium der griechischen Poesie*, finished 1795, but not published until January 1797 [English translation in Schlegel 2001]), with its sharp distinction between ancient and modern modes of literature, is taken to be representative of this early, “classicist” phase of Schlegel’s intellectual life.
    step1: |-
      施莱格尔就读于哥廷根与莱比锡大学，起初学习法律，但学术兴趣渐趋开阔，尤其集中于古典文学，1793 年后转向以文学为业的自由写作生涯。此后数年间，他撰写了几篇论希腊文学的早期文章，同时筹划一部古典诗歌史。原计划的大型研究只有一卷于 1798 年出版，题为《希腊人与罗马人的诗歌史》（*Geschichte der Poesie der Griechen und Römer*）；但《论希腊诗歌研究》（*Über das Studium der griechischen Poesie*，1795 年完成，迟至 1797 年 1 月才刊行〔英译见 Schlegel 2001〕）以古今文学方式的鲜明区分，被视为施莱格尔思想生涯这一早期“古典主义”阶段的代表。
    step2: |-
      施莱格尔先后就读于哥廷根与莱比锡大学，初习法律，其后兴趣渐宽，尤以古典文学为念，1793 年后便转而以文为业，作一名自由撰稿人。此后数年间，他一边筹划一部古典诗歌史，一边写下数篇论希腊文学的早期文章。那部原拟宏大的研究只有第一卷于 1798 年问世，题为《希腊人与罗马人的诗歌史》（*Geschichte der Poesie der Griechen und Römer*）；而《论希腊诗歌研究》（*Über das Studium der griechischen Poesie*，1795 年完稿，迟至 1797 年 1 月刊行〔英译见 Schlegel 2001〕）以古今文学方式之判然有别，被看作施莱格尔思想生涯中这一“古典主义”早期的代表作。
  - id: 5
    kind: body
    source: |-
      An important influence on the young Schlegel was Caroline Böhmer, future wife of his brother (and ultimately of F. W. J. Schelling). Schlegel met her initially in 1794 in Dresden, and her life experience—the daughter of a famous Göttingen professor, she had become pregnant by a French officer in occupied Mainz and been imprisoned as a revolutionary—had a particular effect on the awakening of his interest in political and social issues. In the summer of 1796, Schlegel moved to join his brother and new wife in Jena, the city which, since Fichte’s momentous arrival two years prior, had become perhaps the liveliest intellectual scene in all of Germany. Schlegel remained in Jena for almost a year, but then moved to Berlin, where he became a regular visitor to the salons of Henriette Herz and Rahel Levin and established contact with several important figures of the Romantic movement. Among them were Friedrich Schleiermacher, who became Schlegel’s roommate and collaborator on a number of intended projects, including the translation of Plato’s dialogues (a project that in the end only Schleiermacher would actually carry out); the writers Ludwig Tieck and Wilhelm Heinrich Wackenroder; and the poet Friedrich von Hardenberg (Novalis), who had been a fellow student with Schlegel in Leipzig and who was partly responsible for opening up the philosophical problems of Fichtean idealism to the young Schlegel.
    step1: |-
      对年轻的施莱格尔产生重要影响的是卡罗琳·伯默，她后来成为他兄长的妻子（最终又成为 F. W. J. 谢林的妻子）。施莱格尔最初于 1794 年在德累斯顿与她相识；她的生活经历——她是哥廷根一位著名教授的女儿，在被占领的美因茨怀上了一个法国军官的孩子，并作为革命者被囚禁——对他政治与社会问题兴趣的觉醒产生了特别的影响。1796 年夏天，施莱格尔迁往耶拿，与兄长及其新婚妻子会合；自从两年前费希特意义重大的到来之后，耶拿也许已成为全德国最活跃的思想舞台。施莱格尔在耶拿待了将近一年，随后迁往柏林，在那里成为亨丽埃特·赫茨与拉赫尔·莱温沙龙的常客，并与浪漫主义运动的几位重要人物建立了联系。他们当中有弗里德里希·施莱尔马赫——他成了施莱格尔的室友，并在若干拟议项目中与他合作，包括翻译柏拉图对话（这一项目最终只有施莱尔马赫真正完成）；有作家路德维希·蒂克与威廉·海因里希·瓦肯罗德；还有诗人弗里德里希·冯·哈登贝格（诺瓦利斯）——他曾在莱比锡与施莱格尔同学，并且部分地促成了费希特观念论的哲学问题向年轻的施莱格尔敞开。
    step2: |-
      对青年施莱格尔影响甚大的是卡罗琳·伯默——她后来嫁给他的兄长，最终又成为 F. W. J. 谢林的妻子。两人初识于 1794 年的德累斯顿。她的身世颇不寻常：身为哥廷根名教授之女，却在被法军占领的美因茨怀上一名法国军官的孩子，又作为革命者身陷囹圄。这番经历对施莱格尔政治与社会关怀的觉醒，别有触动。1796 年夏，施莱格尔迁往耶拿，与兄长夫妇会合。自两年前费希特轰轰烈烈地到来之后，耶拿已是全德意志思想生活最活跃的地方。他在耶拿住了将近一年，随后移居柏林，成为亨丽埃特·赫茨与拉赫尔·莱温两家沙龙的常客，并与浪漫主义运动的几位要人结识。其中有弗里德里希·施莱尔马赫——他做了施莱格尔的室友，并在若干拟议项目中与之合作，包括翻译柏拉图对话（此项目最终只有施莱尔马赫真正完成）；有作家路德维希·蒂克与威廉·海因里希·瓦肯罗德；还有诗人弗里德里希·冯·哈登贝格（诺瓦利斯）。诺瓦利斯昔日在莱比锡与施莱格尔同窗，后来也部分地促成了费希特观念论的哲学问题向青年施莱格尔敞开。
