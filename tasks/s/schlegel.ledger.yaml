      In the years following the *Studium* essay, Schlegel moved not only to a distinction between the classical and the romantic, as opposed to that between the ancient and modern, but moreover began distinctly to privilege the romantic. What Schlegel meant by the term “romantic” (*romantisch*) and its apparent cognate *Roman* (usually translated as “novel,” but having among the Romantics a much wider sense) has long been disputed. Perhaps under the influence of Herder (see Eichner 1956)[^eichner-1956], Schlegel saw the historical origins of “the romantic” in the wide mixture of forms and genres that characterized medieval literature and took it as the point of departure for a genre-transcending notion that allows even Shakespeare’s plays or Dante’s *Commedia* to be classified as *Romane*. Seen from this historical perspective, the *Roman* becomes the central dividing line between ancient literature and the literature of the current age: Greek poetry, he claimed in 1800, “began with and finally again converged in epic; our poetry began with and finally again will converge in the *Roman*.”
    step1: |-
      在《研究》论文之后的几年里，施莱格尔不仅转向古典与浪漫之间的区分——以取代古代与现代之间的区分——而且开始明显地把优先地位给予浪漫。施莱格尔所谓“浪漫的”（*romantisch*）一词及其表面上同源的 *Roman*（通常译作“小说”，但在浪漫派那里含义要宽泛得多）究竟何所指，长期存在争议。也许是在赫尔德的影响下（参见 Eichner 1956）[^eichner-1956]，施莱格尔在中世纪文学所特有的形式与文类的广泛混合中，看到了“浪漫的”历史起源，并以此为一个超越文类的概念出发点；这一概念甚至使莎士比亚的剧作或但丁的《神曲》都可被归入 *Romane*。从这一历史视角看，*Roman* 成为古代文学与当前时代文学之间的核心分界线：他在 1800 年声称，希腊诗歌“以史诗开始，最终又重新汇聚于史诗；我们的诗歌以 *Roman* 开始，最终也将重新汇聚于 *Roman*”。
    step2: |-
      《研究》论文之后数年，施莱格尔不只把“古代与现代”之别换成了“古典与浪漫”之别，还开始明显偏袒浪漫一方。他所谓“浪漫的”（*romantisch*），以及表面上与之同源的 *Roman*（通常译作“小说”，但在浪漫派笔下含义宽泛得多），究竟何所指，历来聚讼不已。或许受赫尔德影响（参见 Eichner 1956）[^eichner-1956]，施莱格尔把“浪漫的”历史源头追溯到中世纪文学那种形式与文类的广泛混杂，并以此为起点，提出一个超乎文类之上的概念，甚至连莎士比亚的剧作或但丁的《神曲》都可归入 *Romane*。由此历史眼光看去，*Roman* 便成了古代文学与当今文学之间的分水岭：他在 1800 年宣称，希腊诗歌“以史诗始，终又复归于史诗；我们的诗歌则以 *Roman* 始，终亦将复归于 *Roman*”。
