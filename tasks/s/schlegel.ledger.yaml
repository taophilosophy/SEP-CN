      Although Schlegel’s importance for ethical, social and political philosophy has often been ignored or unjustly criticized, recent interpreters have shown how Schlegel took himself as offering a response to a number of key challenges in the philosophical ethics of his era, from Jacobian worries about nihilism (Gorodeisky 2011)[^gorodeisky-2011] to Kantian rigorism and dualism (Crowe 2010)[^crowe-2010]. For the young Schlegel, consideration of ethical and political matters was never far removed from consideration of the aesthetic. Like Schleiermacher and the young Hegel, Schlegel puts a strong emphasis in his early ethical writings on the notion of love. In his essay “On the Limits of the Beautiful” (*Über die Grenzen des Schönen*, 1794), he argues that love is the highest form of aesthetic enjoyment and can only be realized between free and equal beings (Beiser 1992, 248)[^beiser-1992]. Part of Schlegel’s larger political animus lay always (in early as well as late phases of his career) in a refashioning of the relationship between the sexes. In his early phase, Schlegel shared with other Romantics a sense of the political and social importance of the revolutionary period. In his “Essay on the Concept of Republicanism occasioned by the Kantian Tract *Perpetual Peace*” (*Versuch über den Begriff des Republikanismus*, 1797), a commentary on sections of Kant’s *Perpetual Peace*, Schlegel moves to a far more democratic view of politics than Kant defended: Schlegel advocates not only the “necessarily democratic” nature of republicanism and the “majesty” of the people as expressed in a majority, as well as the “political imperative” of making all nations republican, but—especially decisive against Kant’s restrictions on political activism—argued that insurrection was legitimate in certain cases. Schlegel’s political radicalism in this period comes much closer to Fichte than Kant and, in fact, rivals the claims for universal extension of suffrage advocated by Herder and Georg Forster.
    step1: |-
      尽管施莱格尔对伦理、社会与政治哲学的重要性常被忽视或不公正地批评，晚近的阐释者却表明，施莱格尔自认为是在回应他那个时代哲学伦理学中的若干关键挑战，从雅可比式的虚无主义忧虑（Gorodeisky 2011）[^gorodeisky-2011] 到康德式的严格主义与二元论（Crowe 2010）[^crowe-2010]。对年轻的施莱格尔来说，对伦理与政治事务的考虑从未远离对审美事务的考虑。像施莱尔马赫与青年黑格尔一样，施莱格尔在其早期伦理著作中大力强调爱的观念。在其《论美的界限》（*Über die Grenzen des Schönen*，1794）一文中，他主张爱是审美享受的最高形式，只能在自由而平等的存在者之间实现（Beiser 1992, 248）[^beiser-1992]。施莱格尔更大的政治动力始终（在其生涯的早期与晚期皆然）部分地在于重新塑造两性关系。在其早期阶段，施莱格尔与其他浪漫派一样，感受到革命时期在政治与社会上的重要性。在其《因康德〈永久和平论〉而作的共和主义概念文稿》（*Versuch über den Begriff des Republikanismus*，1797）中——该文是对康德《永久和平论》若干部分的评注——施莱格尔转向一种远比康德所辩护的更为民主的政治观：他不仅主张共和主义的“必然民主的”性质、人民在多数中表达的“尊严”，以及使一切民族共和化的“政治命令”，而且——尤其针对康德对政治行动主义的限制具有决定性——主张在某些情况下起义是正当的。施莱格尔这一时期的政治激进主义远比康德接近费希特，事实上可与赫尔德与格奥尔格·福斯特所主张的选举权普遍扩展相匹敌。
    step2: |-
      施莱格尔在伦理、社会与政治哲学上的重要性，常遭忽视或不公之评；晚近的阐释者却表明，他自视在回应当时哲学伦理学的若干关键挑战：既有雅可比式的虚无主义之忧（Gorodeisky 2011）[^gorodeisky-2011]，也有康德式的严格主义与二元论（Crowe 2010）[^crowe-2010]。对青年施莱格尔而言，伦理与政治之思从未远离审美之思。他与施莱尔马赫、青年黑格尔一样，在早期伦理文字中力主爱这一观念。《论美的界限》（*Über die Grenzen des Schönen*，1794）一文主张，爱是审美享受的最高形式，唯在自由而平等者之间方能实现（Beiser 1992, 248）[^beiser-1992]。施莱格尔更深一层的政治冲动——无论早期晚期——始终有一部分在于重塑两性关系。早年他与别的浪漫派一样，深感革命时期在政治与社会上的分量。其《因康德〈永久和平论〉而作的共和主义概念文稿》（*Versuch über den Begriff des Republikanismus*，1797）评注康德《永久和平论》若干段落，却转向远比康德激进民主的政治观：他不仅主张共和主义“必然是民主的”、人民以多数表达的“尊严”、以及使万邦皆共和的“政治命令”，更在若干情形下主张起义为正当——此点与康德对政治行动主义的限制针锋相对，尤为关键。施莱格尔此期的政治激进主义，比康德更近费希特，实际上也可与赫尔德、格奥尔格·福斯特普遍扩大选举权的主张相颉颃。
