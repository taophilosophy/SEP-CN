      除对文学方式的这种别具一格的挪用外，施莱格尔还提出了一套文类理论；此说在他兼顾形式的历史发展、尤其是现代小说兴起的过程中，屡经修订。他从启蒙式的实用分类，转向一种以哲学为纲的文类理论：早先他认为戏剧（“客观—主观的”）由（“客观的”）史诗与（“主观的”）抒情诗发展而来，后来则主张史诗实际上统摄了另外两种古典方式（Szondi 1986, 85–86）[^szondi-1986]。对史诗的这番新强调，与他将 *Roman*、即小说视为超越传统文类的“现代史诗”之感相呼应，也与他那种流动的文类观相合：“人们完全可以说存在 *无限多*〔文类〕，也同样可以说只存在 *一个* 渐进的 *诗性文类*。”
