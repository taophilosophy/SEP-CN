      There is, to be sure, a rather different style and tone evident in many of Schlegel’s later writings and lectures. In some of the lecture series, there is a good deal of repetition and argumentative flaccidity of a sort the young Schlegel would no doubt have sharply criticized. But it is far from clear that Vienna represented simply a phase of ossification in Schlegel’s intellectual life or even a turn away from the most important philosophical and literary concerns of the young romantic. The literary lectures reveal interesting shifts in his treatment of the literary genres (Eichner 1970, 117–23)[^eichner-1970], the philosophy of life pleads not unconvincingly for a “modest” conception of philosophizing that avoids the excesses of merely abstract or empirical points of departure (Schlegel 1847), and the philosophy of language insists upon the essentially dialogical character of human thought and expression (Schlegel 1847).
    step1: |-
      诚然，在施莱格尔后期的许多著作与讲演中，可以看到颇为不同的风格与语调。在某些讲演系列中，有大量重复与论证上的松软，年轻的施莱格尔无疑会对此严加批评。但远不能确定的是，维也纳仅仅代表施莱格尔思想生命中的一个僵化阶段，或者甚至代表对青年浪漫派最重要的哲学与文学关切的背离。文学讲演显示出他处理文学文类时的有趣转变（Eichner 1970, 117–23）[^eichner-1970]；生命哲学以一种并非没有说服力的方式，为一种避免纯抽象或纯经验出发点的过度的“谦逊的”哲学思考观辩护（Schlegel 1847）；语言哲学则坚持人类思想与表达本质上的对话性质（Schlegel 1847）。
    step2: |-
      诚然，施莱格尔后期不少著作与讲演中，风格与语调确已大不相同。有些讲演系列重复甚多，论证松软，青年施莱格尔若见，必定严词批评。然而，说维也纳时期只是施莱格尔思想生命的僵化阶段，甚至说他背离了青年浪漫派最要紧的哲学与文学关切，却远非定论。文学讲演显示，他处理文学文类时已有耐人寻味的转变（Eichner 1970, 117–23）[^eichner-1970]；生命哲学为一种“谦逊的”哲学思考观申辩，力避纯抽象或纯经验出发点的偏激，其说并非没有说服力（Schlegel 1847）；语言哲学则坚执人类思想与表达在本质上的对话性（Schlegel 1847）。
