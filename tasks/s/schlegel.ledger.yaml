      施莱格尔对第一原理哲学的批判，根植于（与诺瓦利斯一样）对绝对者或无条件者之不可把握的感受。（正如诺瓦利斯在其“花粉”断片第一条中所说：“我们处处寻找无条件者〔*das Unbedingte*〕，却只找到事物〔*Dinge*〕。”）更具体地说，施莱格尔反对赖因霍尔德与费希特，主张“不存在普遍适用的〔*zweckmässig*〕、作为真理之伴侣与向导的第一原理”（*KA* XVIII.518, #13）：即便“自明的”命题也可以被怀疑，因而需要证明（由此开启无穷回溯），而且任何命题都可以用“无限”多种方式得到证明。对施莱格尔来说，“任何证明都是无限可完善的”（*KA* XVIII, 518, #9），哲学的任务不是寻找一个无条件的第一原理，而是投入一种（本质上是融贯论的）无限进展与逼近的过程。
