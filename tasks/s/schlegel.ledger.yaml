      “哲学是反讽的真正家园，反讽或可被界定为逻辑之美，”施莱格尔在《吕克昂断片》第 42 条中写道：“因为凡人们在口头或书面对话中进行哲学思考之处，只要他们并非完全系统化，反讽就应当被产生出来并被悬设。”文学作品在反讽方面的任务，是在呈现一个本质上有限的视野的同时，开启其他视野之无限的可能性：“反讽仿佛是无限、普遍性、对宇宙之感受的展示〔*epideixis*〕”（KA 18.128）；反讽是“对永恒敏捷性、对一个无限涌流的混沌的清晰意识”（《理念》第 69 条）。文学作品能做到这一点，一如施莱格尔的《卢清德》所做的那样，办法是在其范围内呈现一系列可能的情节替代方案，或模仿 *parabasis*（喜剧诗人把自己插入戏剧本身之中），或模仿意大利 *buffo*（丑角）的角色（《吕克昂断片》第 42 条）——后者打断观众的叙事幻觉。（在施莱格尔同时代文学同道的作品中，这类反讽性插入时刻更引人注目的例子，可见于蒂克的喜剧——正如 Szondi（1986）所论，在那里“走出”其惯常角色的，不只是演员或剧作家，在某种意义上还有角色本身。）
