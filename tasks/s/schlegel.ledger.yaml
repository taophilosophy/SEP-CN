      除了对文学方式的这种略带特异性的挪用之外，施莱格尔还提出了一种文学文类理论；这一理论在他试图同时顾及形式的历史发展、特别是现代小说的兴起时，经历了相当大的修订。施莱格尔从启蒙运动的实用分类法走向一种以哲学为导向的文类理论：他原先认为戏剧（作为“客观—主观的”）从（“客观的”）史诗与（“主观的”）抒情诗发展而来，后来则转为认为史诗实际上统一了另外两种古典方式（Szondi 1986, 85–86）[^szondi-1986]。对史诗文类的这种新强调，与他把 *Roman* 或小说看作超越传统文类的“现代史诗”之感相合，也与一种流动的文类划分感相合：“人们完全可以说存在 *无限多* 〔文类〕，也同样可以说只存在 *一个* 渐进的 *诗性文类*。”
