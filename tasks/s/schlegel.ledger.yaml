      If a literary form like the fragment opens up the question of the relation between finite and infinite, so do the literary modes of allegory, wit and irony—allegory as a finite opening toward the infinite (“every allegory means God”), wit as the “fragmentary geniality” or “selective flashing” in which a unity can momentarily be seen, and irony as their synthesis (see Frank 2004 [1997], 216). Although impressed with the Socratic notion of irony (playful and serious, frank and deeply hidden, it is the freest of all licenses, since through it one rises above one’s own self, Schlegel says in *Lyceumfragment* 108), Schlegel nonetheless employs it in a way perhaps more reminiscent of the oscillations of Fichtean selfhood. Irony is at once, as he says in *Lyceumfragment* 37, self-creation, self-limitation, and self-destruction.
    step1: |-
      如果断片这样的文学形式开启了有限与无限之关系的问题，那么寓言、机智与反讽这些文学方式也是如此——寓言是有限者向无限者的开启（“每个寓言都意谓上帝”），机智是“断片式的天才”或“选择性的闪光”，在其中统一性可以瞬间被看见，反讽则是二者的综合（参见 Frank 2004 [1997], 216）。尽管施莱格尔对苏格拉底式的反讽观念印象深刻（它既游戏又严肃，既坦率又深藏不露；它是一切特许中最自由的，因为通过它人得以超越自身，施莱格尔在《吕克昂断片》第 108 条中说），但他运用反讽的方式，或许更令人想到费希特式自我的振荡。正如他在《吕克昂断片》第 37 条中所说，反讽同时是自我创造、自我限制与自我毁灭。
