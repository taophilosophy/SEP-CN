      The shift between Schlegel’s classicist and romantic phases presents an interpretive challenge that is frequently discussed in the literature. On the one hand, scholars have stressed that what Schlegel now commends in romantic poetry are the very same facets he had previously condemned (for example, Eichner 1970, 49, who lists here the tendency toward the purely imaginative; the mixing of genres; the trend toward didacticism, irony and parody; the fusion of poetry and philosophy)[^eichner-1970]. On the other hand, many have noticed that there are seeds in the *Studium* essay of the later view—Schlegel’s praise of poets like Dante, Goethe and Shakespeare often seems at odds with the essay’s valorization of ancient poetry.
    step1: |-
      施莱格尔古典主义阶段与浪漫阶段之间的转变，提出了一个文献中经常讨论的解释难题。一方面，学者们强调，施莱格尔现在在浪漫诗歌中所赞扬的，恰恰是他此前所贬斥的那些方面（例如 Eichner 1970, 49，此处列举了趋向纯粹想象、文类混合、说教、反讽与戏仿的倾向、诗歌与哲学的融合）[^eichner-1970]。另一方面，许多人注意到，《研究》论文中已有后来观点的种子——施莱格尔对但丁、歌德与莎士比亚等诗人的赞扬，往往与该文对古代诗歌的推崇显得并不协调。
    step2: |-
      施莱格尔由古典主义转向浪漫主义，留下一个解释上的难题，文献中屡有讨论。一方面，学者们强调：施莱格尔如今在浪漫诗歌里称许的，正是他先前所贬斥的那些面向（例如 Eichner 1970, 49 所列：倾心纯粹想象、混杂文类、趋向说教、反讽与戏仿，以及诗与哲学的融合）[^eichner-1970]。另一方面，不少人也注意到，《研究》论文中已埋下后来观点的种子——施莱格尔对但丁、歌德、莎士比亚等诗人的称赏，与该文对古代诗歌的推尊，往往显得格格不入。
