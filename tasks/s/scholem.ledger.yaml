      Building on this narrative, Scholem developed a broader account of the entire Kabbalah in lectures published as *Major Trends of Jewish Mysticism* in 1941. These lectures, especially after their publication in English, had an enormous impact. Later, he wrote a major biography of Shabbetai Zvi and the Sabbatean movement and devoted considerable research to its afterlife, e.g., in the writings of the Jewish nihilist Jacob Franck or several underground writers in freemason and revolutionary circles all of whom he considered a trajectory from Sabbatianism to enlightenment and Jewish emancipation. After the war, he also talked more broadly about the Kabbalah in the context of comparative religion. He joined the Arcona-Circle where a younger generation of scholars of religion met in Switzerland (Wasserstrom 1999)[^wasserstrom-1999]. There he presented the Kabbalah as one form of religious symbolism:
    step1: |-
