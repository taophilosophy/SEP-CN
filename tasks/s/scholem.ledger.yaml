      Together with other thinkers of the late nineteenth century—e.g., Jakob Burkhardt, Franz Overbeck, Friedrich Nietzsche, or Ernst Troeltsch—Scholem knows the conditions of modern culture to be essentially historical, but also deeply ambivalent and aporetic, in particular for a minority position such as Judaism in a secularized Christian culture. His historical account of the Kabbalah and its role in Jewish life is therefore a decided “counter-history” that aims at a revision of the dominant account of historical progress and progressive rationalization that liberal historians developed in the nineteenth century (see Biale 1979 [1982])[^biale-1979]. He therefore also vehemently criticized his forerunners of the “Science of Judaism” for their antiquarian tendencies which aim at a “decent burial” of the Jewish past and for their deliberate ignorance of those irrational and primitive tendencies that would question their image of a rational and progressive Judaism, the most important of those tendencies being the Kabbalah that, e.g., in the account of Heinrich Graetz, is nothing but a symptom of the decay of Judaism.
    step1: |-
      与十九世纪晚期其他思想家——如雅各布·布克哈特、弗朗茨·奥弗贝克、弗里德里希·尼采或恩斯特·特洛尔奇——一道，朔勒姆认识到现代文化的状况本质上是历史性的，但也是深刻的矛盾与困厄的，对于犹太教这样一个身处世俗化基督教文化中的少数派立场而言尤为如此。因此，他对卡巴拉及其在犹太生活中之角色的历史叙述，是一种决然的“反历史”，其目标是修正自由派史学家在十九世纪发展出来的关于历史进步与渐进理性化的主导叙述（见 Biale 1979 [1982]）[^biale-1979]。因此他也猛烈批判“犹太学”的先驱者们：他们的好古倾向意在给犹太过去办一场“体面的葬礼”；他们对那些会质疑其理性而进步的犹太教形象的非理性与原始倾向蓄意无知——这些倾向中最重要的就是卡巴拉，例如在海因里希·格雷茨的叙述中，卡巴拉不过是犹太教衰败的一个症状。
