      Scholem’s work on Kabbalah started in the realm of philology: His dissertation comprised a critical edition and commentary of the book of Bahir, and throughout his lifetime he would spend much work on recovering and collating manuscript sources and producing critical editions of major Kabbalistic texts. This includes also the discussion of critical questions of authorship, dating and attribution, e.g., of the *Zohar*, the main source of medieval Kabbalah, which the young Scholem considered a collection of authentic ancient traditions, before he had to concede it, in fact, to be a pseudepigraphic product of Moses de Leon, written in the twelfth century (see Dan 1987)[^dan-1987]. Quite early, Scholem also decided the Kabbalah has to be seen not as part of, e.g., the history of philosophy—as nineteenth century researchers like Adolphe Frank had argued—but as part of the “history of religion”, referring to the “history of religion school”, a scholarly paradigm of German biblical studies represented by such scholars as Hermann Gunkel and Wilhelm Bousset (see E. Hamacher 1999; Weidner 2003 [2022: ch. 14])[^hamacher-1999][^weidner-2003], from whom Scholem adopted important concepts.
    step1: |-
      朔勒姆的卡巴拉研究始于语文学领域：他的博士论文包含对《巴希尔之书》（Bahir）的校勘本与注释；终其一生，他在搜集与校勘抄本、编订主要卡巴拉文本的校勘本上花了大量功夫。其中也包括对作者、年代与归属等批判性问题的讨论，例如中世纪卡巴拉的主要文献《光辉之书》（*Zohar*）——年轻的朔勒姆曾认为它是真实的古代传统之汇集，后来才不得不承认它实为摩西·德·莱昂的伪托之作，写于十二世纪（译注：原文如此；学界通说《光辉之书》成书于十三世纪的西班牙。）（见 Dan 1987）[^dan-1987]。很早，朔勒姆还断定：卡巴拉不应被视为哲学史之类的组成部分——如阿道夫·弗兰克等十九世纪研究者所主张的——而应被视为“宗教史”的组成部分。这里指的是“宗教史学派”，德国圣经研究的一个学术范式，其代表学者有赫尔曼·贡克尔与威廉·布塞（见 E. Hamacher 1999；Weidner 2003 [2022: ch. 14]）[^hamacher-1999][^weidner-2003]；朔勒姆从中采纳了若干重要概念。
