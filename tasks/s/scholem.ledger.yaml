      Lament represents, according to Scholem, language at the limit of silence which is therefore paradigmatic for language as such (see Ferber & Schwebel 2014)[^ferber-2014]: In the book of Lamentation, the loss of language in exile—when God seemingly has withdrawn from Israel, and does not answer any more—is poetically transformed into an address to God. In Prophecy, and in the book of Jonah in particular, the limits of human language are ironically demonstrated: Jonah erroneously takes prophecy for prediction, whereas it is actually rather about the possibility that different times, past and future, might be transformed into each other. In Job, namely in the speeches of God that overwhelm Job rather than answer his questions, the idea of revelation manifests itself, since in Judaism, the “word of God” is not a specific message, but rather a “medium”, thus: “the absolute, that which gives meaning but is in itself meaningless” or the “interpretable, which only lays itself out in the continuous relationship to time, in tradition” (Br I, 469–470). Thus, despite being a concrete communication to the people of Israel, Revelation also implies all other meanings tradition will be able to attribute to it, it is semantically open, but also performatively forceful and thus inherently dangerous.
    step1: |-
      据朔勒姆，哀歌代表处于沉默边界的语言，因此对语言本身具有范式意义（见 Ferber & Schwebel 2014）[^ferber-2014]：在《哀歌》中，流亡中语言的丧失——上帝似乎已从以色列撤回，不再应答——被诗意地转化为对上帝的呼告。在预言中，尤其在《约拿书》中，人类语言的界限以反讽的方式得到展示：约拿错误地把预言当作预测，而预言实际关乎的倒是不同时间——过去与未来——彼此转化的可能。在《约伯记》中，即上帝那些压倒约伯而非回答其问题的言说中，启示的观念显现出来，因为在犹太教中，“上帝之言”不是一个具体的讯息，而是一个“媒介”，即：“那绝对者，给出意义而自身无意义者”，或“可解释者，它只在与传统对时间的连续关系中展开自身”（Br I, 469–470）。因此，尽管是对以色列人民的具体传达，启示也蕴含着传统所能赋予它的所有其他意义；它在语义上是开放的，但在施行上也是有力的，因而本质上危险。
    step2: |-
      在朔勒姆看来，哀歌代表站在沉默边界的语言，因而对语言本身具有范型意义（见 Ferber & Schwebel 2014）[^ferber-2014]。《哀歌》里，流亡中语言的丧失——上帝似乎已从以色列隐退，不再应答——被诗意地转化为对上帝的呼告。在预言中，尤其在《约拿书》里，人类语言的界限以反讽的方式显形：约拿误把预言当作预测，而预言真正关乎的，倒是不同的时间——过去与未来——彼此转化的可能。在《约伯记》里，上帝的言说压倒了约伯，却不回答他的问题，启示的观念就在其中显现。因为在犹太教里，“上帝之言”不是一条具体的讯息，而是一个“媒介”：亦即“那绝对者——它给出意义，自身却无意义”，或“那可解释者——它只在同时间、同传统的连续关系中铺展自身”（Br I, 469–470）。因此，启示虽然是对以色列民的一次具体传达，却同时蕴含着传统日后能赋予它的一切意义：它在语义上是开放的，在施行上却强劲有力，因而本质上是危险的。
