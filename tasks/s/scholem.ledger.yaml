      有时，朔勒姆把弥赛亚观念与历史的这种悖论关系阐发为一条普遍规则：一种历史—政治的历史“辩证法”既在他的史学中运作，也表达他与锡安主义的政治经验。它关涉观念与历史实在的关系，不描述任何规则的进步，而描述一种未预期效果的悖论逻辑。在其沙巴泰·茨维著作的一份草拟导言中，他把这种关系称为“真理的辩证法”。真理只有在抽象而一般时才是单纯的：
