      History—at least the history of ideas—thus never progresses along straight lines, but always in detours and always through moments of crisis and rupture.
    step1: |-
      因此，历史——至少观念的历史——从不沿直线前进，而总是经由迂回，总是经过危机与断裂的时刻。
