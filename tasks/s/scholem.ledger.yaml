      Scholem’s own aliyah in 1923 did not fully resolve these tensions. Like many other immigrants from Western Europe, it wasn’t easy for him to integrate into the culture of the Yishuv. Both skeptical about socialism and—even more so—critical towards the nationalism of the emerging revisionist movement, Scholem experienced moments of disappointment he expressed in melancholic poems, letters, and private notes (see N. Zadoff 2015 [2018: ch. 1]; Weidner 2003 [2022: ch. 5])[^weidner-2003][^zadoff-2015], blaming the political and public success of Zionism for the failure of its spiritual aim to renew Judaism. He also realized that the political association of Zionism with the British colonial powers would compromise it and lead to severe conflict with the Arab population. He became engaged in the Brit Shalom movement that tried to establish a cooperation with the Palestinian Arabs but turned away after the riots of 1929. Especially after World War II and the destruction of European Judaism, Scholem seemed to have lost most of his utopian hopes for the restoration of Judaism. Nonetheless, he continued to call himself a Zionist and to defend Zionism against its critics, e.g., against Hannah Arendt whose Eichmann-Book he strongly disapproved of (see Engel 2017: chapter 6)[^engel-2017]. He now described Zionism as the necessary and legitimate attempt of Jewish self-determination, i.e., as a political movement the religious “overtones” of which should rather be held at bay: “The redemption of the Jewish people, which as a Zionist I desire, is in no way identical with the religious redemption I hope for in the future” (JJC 44).
    step1: |-
      朔勒姆 1923 年的阿利亚并没有完全化解这些张力。像许多来自西欧的移民一样，他很难融入伊舒夫（Yishuv，巴勒斯坦犹太社群）的文化。他对社会主义既怀疑，对新兴修正主义运动的民族主义则批评更甚，他也经历了一些失望的时刻，并以忧郁的诗、书信和私人笔记表达出来（见 N. Zadoff 2015 [2018: ch. 1]；Weidner 2003 [2022: ch. 5]）[^weidner-2003][^zadoff-2015]，他把这些归咎于锡安主义政治与公共上的成功，认为是这种成功导致其更新犹太教这一属灵目标的失败。他还认识到，锡安主义与英国殖民势力的政治联合将使它受损，并导致与阿拉伯居民的严重冲突。他参与了布里特沙洛姆（Brit Shalom）运动，该运动试图与巴勒斯坦阿拉伯人建立合作，但他在 1929 年骚乱之后转身离去。尤其是在二战和欧洲犹太教被毁灭之后，朔勒姆似乎失去了他对复兴犹太教的大部分乌托邦希望。尽管如此，他继续自称锡安主义者，并为锡安主义辩护以回应其批评者，例如回击汉娜·阿伦特——他极不赞成她那本论艾希曼的书（见 Engel 2017: chapter 6）[^engel-2017]。他此时把锡安主义描述为犹太民族自决的必要而正当的尝试，即一场政治运动，其宗教“泛音”倒应当受到节制：“我作为锡安主义者所期愿的犹太民族的救赎，与我盼望在将来出现的宗教救赎，绝不是一回事”（JJC 44）。
    step2: |-
      1923 年，朔勒姆实行了自己的阿利亚，但这些张力并未因此化解。与许多西欧移民一样，他很难融入伊舒夫（Yishuv，巴勒斯坦犹太社群）的文化。他对社会主义心存怀疑，对新兴修正主义运动的民族主义批评更甚；失望之际，他以忧郁的诗、书信和私人笔记自遣（见 N. Zadoff 2015 [2018: ch. 1]；Weidner 2003 [2022: ch. 5]）[^weidner-2003][^zadoff-2015]，并将其更新犹太教这一属灵目标的落空，归咎于锡安主义在政治与公共领域的成功。他还看出，锡安主义与英国殖民势力结盟将使它受损，并将招致与阿拉伯居民的严重冲突。他一度投身布里特沙洛姆（Brit Shalom）运动——该运动谋求与巴勒斯坦阿拉伯人合作——1929 年骚乱后却转身离去。尤其在二战与欧洲犹太教之毁灭过后，朔勒姆对复兴犹太教的乌托邦希望似乎大半泯灭。尽管如此，他仍自称锡安主义者，仍为锡安主义辩护，回击批评者——例如汉娜·阿伦特：他极不赞成她那本论艾希曼的书（见 Engel 2017: chapter 6）[^engel-2017]。此时他把锡安主义描述为犹太民族自决的必要而正当的尝试，即一场政治运动，其宗教“泛音”理应有所节制。他写道：“我作为锡安主义者所期愿的犹太民族的救赎，与我盼望在将来出现的宗教救赎，绝不是一回事”（JJC 44）。
