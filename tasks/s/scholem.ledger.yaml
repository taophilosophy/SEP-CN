      In Judaism, the role of myth is mainly played by Gnosticism, a dualist revision of the biblical story which confronts the (evil) God of creation with a second redeeming savior which is yet hidden. Gnosticism, too became prominent in the “history of religion” school, especially in Wilhelm Bousset and Hans Jonas (see Wasserstrom 1999)[^wasserstrom-1999]. For Scholem, it is Gnosticism that infuses the Kabbalah with an anarchic and antinomian energy essential to its history and meaning. This force renders the history of Kabbalah a “counter-history” that not only undercuts the official representations of Judaism as a rational religion but is driven by constant inner tension and conflict (see Biale 1979 [1982])[^biale-1979].
    step1: |-
      在犹太教中，神话的角色主要由诺斯替主义扮演——它是对圣经故事的一种二元论改写，以第二位尚且隐匿的救赎救主来对抗（邪恶的）创世之神。诺斯替主义同样在“宗教史”学派中地位显赫，尤其在威廉·布塞与汉斯·约纳斯那里（见 Wasserstrom 1999）[^wasserstrom-1999]。在朔勒姆看来，正是诺斯替主义把一种无政府与反律法的能量注入卡巴拉，这种能量对卡巴拉的历史与意义至关重要。这一力量使卡巴拉的历史成为一部“反历史”：它不仅颠覆把犹太教描绘为理性宗教的官方叙事，而且为持续的内在紧张与冲突所驱动（见 Biale 1979 [1982]）[^biale-1979]。
    step2: |-
      在犹太教里，神话的角色主要由诺斯替主义扮演：它二元论式地改写了圣经故事，以第二位尚且隐匿的救赎主来对抗（邪恶的）创世之神。诺斯替主义在“宗教史”学派中同样声势显赫，威廉·布塞与汉斯·约纳斯尤为突出（见 Wasserstrom 1999）[^wasserstrom-1999]。在朔勒姆看来，正是诺斯替主义把无政府与反律法的能量注入卡巴拉——对卡巴拉的历史与意义而言，这种能量至关重要。它使卡巴拉的历史成为一部“反历史”：既颠覆了把犹太教描绘成理性宗教的官方图景，又为绵延不断的内在紧张与冲突所驱动（见 Biale 1979 [1982]）[^biale-1979]。
