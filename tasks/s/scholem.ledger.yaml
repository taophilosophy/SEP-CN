      Scholem’s fame is reflected in the remarkable research devoted to his work, including a number of monographs. In 1979, David Biale provided the first introduction to Scholem with *Gershom Scholem: Kabbalah and Counter-History*, which focuses on the antagonistic and anarchistic impulse which shaped Scholem’s youthful Zionist rebellion as well as his later attempt to counter the bourgeois histories of liberal Judaism by writing the history of mysticism. Daniel Weidner (*Gershom Scholem. Politisches, esoterisches und historiographisches Schreiben*, 2003, translated as: *The father of Jewish Mysticism. The writing of Gershom Scholem*, 2022) focuses on the early years of Scholem, namely the laboratory of ideas of his early diaries and the formation of his academic approach to the history of religion. Amir Engel (*Gershom Scholem: An Intellectual Biography*, 2017) argues that Scholem’s emigration to Palestine induced a profound crisis in Scholem’s self-understanding, expressed in his engagement with Sabbatianism, and it was only after the Holocaust that Scholem identified more and more strongly with Israel. Noam Zadoff (*Gershom Scholem: From Berlin to Jerusalem and Back*, 2015 [2018]) focuses on the postwar period after which he oriented himself increasingly toward Europe and Germany. And Biale published another Study (*Gershom Scholem: Master of the Kabbalah*, 2018), emphasizing that it is precisely Scholem’s contradictoriness that makes him so interesting today.
    step1: |-
      朔勒姆的名声反映在其著作所催生的可观研究上，包括多部专著。1979 年，戴维·比亚莱以《格肖姆·朔勒姆：卡巴拉与反历史》（*Gershom Scholem: Kabbalah and Counter-History*）提供了第一本朔勒姆导论，聚焦于那种敌对与无政府主义的冲动——它塑造了朔勒姆青年时代的锡安主义反叛，也塑造了他后来通过书写神秘主义史来对抗自由派犹太教的资产阶级史学的尝试。丹尼尔·魏德纳（《格肖姆·朔勒姆：政治的、秘传的与史学的书写》（*Gershom Scholem. Politisches, esoterisches und historiographisches Schreiben*，2003；英译 *The father of Jewish Mysticism. The writing of Gershom Scholem*，2022））聚焦朔勒姆的早年岁月，即其早期日记的观念实验室及其宗教史学进路的形成。阿米尔·恩格尔（《格肖姆·朔勒姆：一部思想传记》（*Gershom Scholem: An Intellectual Biography*，2017））论证：朔勒姆移民巴勒斯坦在其自我理解中引发了一场深刻的危机，这一危机表达于他同沙巴泰主义的纠缠；只是在纳粹大屠杀之后，朔勒姆才越来越强烈地认同以色列。诺姆·扎多夫（《格肖姆·朔勒姆：从柏林到耶路撒冷再回来》（*Gershom Scholem: From Berlin to Jerusalem and Back*，2015 [2018]））聚焦战后岁月——此后他越来越把自己朝向欧洲与德国。比亚莱又出版了另一部研究（《格肖姆·朔勒姆：卡巴拉大师》（*Gershom Scholem: Master of the Kabbalah*，2018）），强调恰恰是朔勒姆的矛盾性使他今天如此有趣。
    step2: |-
      朔勒姆的名声，也体现在其著作所催生的可观研究上，其中包括多部专著。1979 年，戴维·比亚莱以《格肖姆·朔勒姆：卡巴拉与反历史》（*Gershom Scholem: Kabbalah and Counter-History*）写出第一部朔勒姆导论：它聚焦那种对抗性与无政府主义的冲动——既塑造了朔勒姆青年时代的锡安主义反叛，也塑造了他后来以神秘主义史对抗自由派犹太教之资产阶级史学的尝试。丹尼尔·魏德纳的《格肖姆·朔勒姆：政治的、秘传的与史学的书写》（*Gershom Scholem. Politisches, esoterisches und historiographisches Schreiben*，2003；英译 *The father of Jewish Mysticism. The writing of Gershom Scholem*，2022）聚焦朔勒姆的早年岁月：早期日记这座观念实验室，以及他宗教史学进路的形成。阿米尔·恩格尔的《格肖姆·朔勒姆：一部思想传记》（*Gershom Scholem: An Intellectual Biography*，2017）论证：移民巴勒斯坦在朔勒姆的自我理解中引发深刻危机，危机表达为他与沙巴泰主义的纠缠；直到纳粹大屠杀之后，朔勒姆才越来越强烈地认同以色列。诺姆·扎多夫的《格肖姆·朔勒姆：从柏林到耶路撒冷再回来》（*Gershom Scholem: From Berlin to Jerusalem and Back*，2015 [2018]）聚焦战后岁月——此后他的取向日益转向欧洲与德国。比亚莱后来又出一部研究，《格肖姆·朔勒姆：卡巴拉大师》（*Gershom Scholem: Master of the Kabbalah*，2018），强调恰恰是朔勒姆的矛盾性，使他今天仍如此引人入胜。
