      In the beginning of the 1930s Münster still stood in the shadow of Göttingen as a center of research on logic. After the National Socialists’ seizure of power, most of German language logicians lost their positions and were forced into emigration. Only Münster survived as a place for research on logic and foundations. Scholz was successful in resisting the attacks from the side of the so-called “Deutsche Mathematik”, a National-Socialist racist movement emphasizing the mathematical work of German “national comrades” (*Volksgenossen*). The Munich mathematician Max Steck (1907–1971) was particularly hostile. Steck’s book, *Das Hauptproblem der Mathematik* (1942)*,* is directed against logicism, the axiomatic method, and metamathematics, as proposed by logicians and mathematicians close to David Hilbert and his school. Steck labeled Hilbert’s formalism as a “simply catastrophic” mental one-sidedness, a “decadence” from the perspective of intellectual history (Steck 1942, p. 205)[^steck-1942]. In several places Scholz is attacked as Hilbert’s spokesman. Steck calls Scholz’s Münster School a “transplantation of the earlier so-called Vienna Circle to Münster in Westphalia” (p. 176).
    step1: |-
      20 世纪 30 年代初，明斯特作为逻辑研究中心仍处在哥廷根的阴影之下。纳粹党人夺取政权后，大多数德语逻辑学家失去职位，被迫流亡。只有明斯特作为逻辑与基础研究之地存续下来。肖尔兹成功地抵御了所谓“德意志数学”（“Deutsche Mathematik”）方面的攻击；这是一个纳粹种族主义运动，强调德国“民族同胞”（*Volksgenossen*）的数学工作。慕尼黑数学家 Max Steck（1907—1971）尤为敌视。Steck 的《数学的主要问题》（*Das Hauptproblem der Mathematik*，1942）一书，矛头指向逻辑主义、公理方法与元数学，而这些正是与大卫·希尔伯特及其学派关系密切的逻辑学家和数学家所主张的。Steck 把希尔伯特的形式主义斥为“简直灾难性的”精神偏狭，从思想史视角看则是一种“颓废”（Steck 1942, p. 205）[^steck-1942]。书中多处把肖尔兹当作希尔伯特的代言人加以攻击。Steck 把肖尔兹的明斯特学派称作“把早先所谓的维也纳学派移植到威斯特法伦的明斯特”（p. 176）。
