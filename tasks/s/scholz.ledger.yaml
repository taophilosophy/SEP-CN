      The “Memorandum about the New Mathematical Logic and Foundational Research” written for the Reichs- und Preußischen Minister für Wissenschaft, Erziehung und Volksbildung (Imperial and Prussian Secretary for Science, Education and National Instruction) on January 15, 1938 (Scholz 1938)[^scholz-1938] shows that for Scholz this new subject went beyond symbolic or mathematical logic, but further included applications of logical analysis to foundational problems in general. According to Scholz, the new subject was prepared by Gottfried Wilhelm Leibniz (1646–1716), created by Gottlob Frege (1848–1925), and taken up by David Hilbert (1862–1943) who, adopting Bertrand Russell’s (1872–1970) elaboration of Frege’s creation, made it the subject of deep investigations aiming, e.g., “at a consistency proof for classical logic”, and with this, of classical mathematics (presupposing the logicist reduction of mathematics to logic). This new approach was, according to Scholz, directed against Kant’s opinion that “foundational questions of any kind in principle cannot be treated with mathematical methods and with mathematical means of construction and research questions”. Its task was a deepening and clarifying of foundations by combining structural investigations and the analysis of the context of application.
    step1: |-
      1938 年 1 月 15 日为帝国与普鲁士科学、教育与国民教育部长（Reichs- und Preußischen Minister für Wissenschaft, Erziehung und Volksbildung）撰写的《关于新数理逻辑与基础研究的备忘录》（Scholz 1938）[^scholz-1938] 表明，对肖尔兹来说，这一新学科超出了符号逻辑或数理逻辑，还进一步包括把逻辑分析应用于一般的基础问题。按照肖尔兹的说法，这一新学科由戈特弗里德·威廉·莱布尼茨（1646—1716）预备，由戈特洛布·弗雷格（1848—1925）创立，并由大卫·希尔伯特（1862—1943）承接；希尔伯特采纳伯特兰·罗素（1872—1970）对弗雷格创制的阐发，使该学科成为深入研究的对象，其目标例如“古典逻辑的一致性证明”，并由此及于古典数学（预设了把数学归约为逻辑的逻辑主义还原）。按照肖尔兹，这一新进路针对的是康德的如下意见：“任何种类的基础问题，原则上都不能用数学方法、用数学的建构手段与研究手段来处理”。它的任务是通过结合结构研究与对应用语境的分析，来深化并澄清基础。
    step2: |-
      1938 年 1 月 15 日，肖尔兹为帝国与普鲁士科学、教育与国民教育部长（Reichs- und Preußischen Minister für Wissenschaft, Erziehung und Volksbildung）撰写了《关于新数理逻辑与基础研究的备忘录》（Scholz 1938）[^scholz-1938]。这份备忘录表明，在肖尔兹看来，这门新学科不止于符号逻辑或数理逻辑，还涵盖把逻辑分析施用于一般基础问题。据其所述，这门新学科由戈特弗里德·威廉·莱布尼茨（1646—1716）开其端绪，戈特洛布·弗雷格（1848—1925）创立之，大卫·希尔伯特（1862—1943）承其绪；希尔伯特采纳伯特兰·罗素（1872—1970）对弗雷格学说的阐发，将这门学科引向深入研究，其目标例如“古典逻辑的一致性证明”，并进而及于古典数学（这里预设了把数学归约为逻辑的逻辑主义还原）。肖尔兹认为，这一新进路所针对的，正是康德的如下意见：“任何种类的基础问题，原则上都不能用数学方法、用数学的建构手段与研究手段来处理”。新进路的任务，是把结构研究与应用语境分析结合起来，从而深化并澄清基础。
