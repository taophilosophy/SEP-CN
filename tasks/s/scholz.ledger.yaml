      Heinrich Scholz was important as an integrating figure in the development of logic in the first half of the 20ᵗʰ century. He kept Mathematical Logic in touch with Philosophy. With his focus on semantics he set the agenda for the development after World War II. Important academics of German postwar logic, including Gisbert Hasenjaeger and Hans Hermes, were his students.
    step1: |-
      海因里希·肖尔兹作为 20 世纪上半叶逻辑发展的整合性人物而重要。他使数理逻辑与哲学保持接触。以其对语义学的专注，他为第二次世界大战之后的发展设定了议程。德国战后逻辑的重要学者，包括 Gisbert Hasenjaeger 与 Hans Hermes，都是他的学生。
    step2: |-
      海因里希·肖尔兹的重要性，在于他是 20 世纪上半叶逻辑发展中一位起整合作用的人物。他让数理逻辑与哲学始终声气相通；又以其对语义学的专注，为第二次世界大战之后的发展定下议程。德国战后逻辑的重要学者，如 Gisbert Hasenjaeger 与 Hans Hermes，皆出自其门下。
