    source: |-
      Heinrich Scholz was born on December 17, 1884 in Berlin. His father was a Protestant parson (on Scholz’s biography and his work cf. Elstrodt and Schmitz 2013; Hermes 1958; Meschkowski 1984; Molendijk 1991; Molendijk 2005; Peckhaus 2008; Ritter, Hermes and Kambartel 1961; Wernick 1944)[^elstrodt-2013][^hermes-1958][^meschkowski-1984][^molendijk-1991][^molendijk-2005][^peckhaus-2008][^wernick-1944]. He studied Protestant Theology and Philosophy in Berlin. Among his teachers were the Prussian Protestant theologian Adolf von Harnack (1851–1930), the neo-Kantian philosopher Alois Riehl (1844–1924) and the neo-idealist philosopher Friedrich Paulsen (1846–1908). In 1911 he completed his *Habilitation* in the Philosophy of Religion and Systematic Theology. He obtained an additional doctoral degree in Philosophy at the University of Erlangen in 1913. In 1917 he was appointed to a full professorship in the Philosophy of Religion and Systematic Theology at the University of Breslau in Silesia, today Wrocław, Poland. He also received an honorary doctorate from the Theological Faculty of the University of Berlin. Four years later, in 1921, he was appointed to the chair for Philosophy in Kiel, before finally accepting the offer of a professorial chair at the University of Münster in 1928. There he first served as professor of Philosophy. He developed a close relationship with Karl Barth, one of the main representatives of kerygmatic and dialectic theology, who taught protestant theology in Münster from 1925 on (cf. Molendijk 1991, ch. 3)[^molendijk-1991]. Scholz changed his main research area to mathematical logic and foundational research, and officially taught the subject from 1936 on. In 1943 the denomination of his chair was changed to *Mathematical Logic and Foundational Research*. The institute of this name was founded in 1950. Scholz retired in 1952. He died in Münster on December 30, 1956.
    step1: |-
      海因里希·肖尔兹于 1884 年 12 月 17 日生于柏林。他的父亲是一位新教牧师（关于肖尔兹的生平与著作，参见 Elstrodt and Schmitz 2013；Hermes 1958；Meschkowski 1984；Molendijk 1991；Molendijk 2005；Peckhaus 2008；Ritter, Hermes and Kambartel 1961；Wernick 1944）[^elstrodt-2013][^hermes-1958][^meschkowski-1984][^molendijk-1991][^molendijk-2005][^peckhaus-2008][^wernick-1944]。他在柏林研习新教神学与哲学。他的老师包括普鲁士新教神学家阿道夫·冯·哈纳克（Adolf von Harnack，1851—1930）、新康德主义哲学家阿洛伊斯·里尔（Alois Riehl，1844—1924）与新观念论哲学家弗里德里希·保尔森（Friedrich Paulsen，1846—1908）。1911 年，他在宗教哲学与系统神学领域完成教授资格论文（*Habilitation*）。1913 年，他又在埃尔朗根大学取得哲学博士学位。1917 年，他被任命为西里西亚布雷斯劳大学（今波兰弗罗茨瓦夫）宗教哲学与系统神学正教授。他还获得柏林大学神学院授予的荣誉博士学位。四年后的 1921 年，他被任命为基尔大学哲学教席教授，最终于 1928 年接受明斯特大学教授教席的聘约。在那里，他起初担任哲学教授。他与卡尔·巴特（Karl Barth）交往密切；巴特是宣道神学与辩证神学的主要代表人物之一，自 1925 年起在明斯特讲授新教神学（参见 Molendijk 1991，第 3 章）[^molendijk-1991]。肖尔兹把主要研究领域转向数理逻辑与基础研究，并从 1936 年起正式讲授该学科。1943 年，他的教席名称改为 *数理逻辑与基础研究*。同名研究所于 1950 年成立。肖尔兹于 1952 年退休，1956 年 12 月 30 日在明斯特去世。
    step2: |-
      海因里希·肖尔兹 1884 年 12 月 17 日生于柏林，父亲是新教牧师（关于肖尔兹的生平与著作，参见 Elstrodt and Schmitz 2013；Hermes 1958；Meschkowski 1984；Molendijk 1991；Molendijk 2005；Peckhaus 2008；Ritter, Hermes and Kambartel 1961；Wernick 1944）[^elstrodt-2013][^hermes-1958][^meschkowski-1984][^molendijk-1991][^molendijk-2005][^peckhaus-2008][^wernick-1944]。他在柏林研习新教神学与哲学，师从普鲁士新教神学家阿道夫·冯·哈纳克（Adolf von Harnack，1851—1930）、新康德主义哲学家阿洛伊斯·里尔（Alois Riehl，1844—1924）与新观念论哲学家弗里德里希·保尔森（Friedrich Paulsen，1846—1908）。1911 年，他在宗教哲学与系统神学领域取得教授资格（*Habilitation*）；1913 年又在埃尔朗根大学取得哲学博士学位。1917 年，他获聘西里西亚布雷斯劳大学（今波兰弗罗茨瓦夫）宗教哲学与系统神学正教授，并获柏林大学神学院荣誉博士学位。四年后的 1921 年，他转任基尔大学哲学教席，最终于 1928 年接受明斯特大学的教授教席聘约。到任之初，他担任哲学教授，并与卡尔·巴特（Karl Barth）结下密切交谊；巴特是宣道神学与辩证神学的主要代表人物之一，自 1925 年起在明斯特讲授新教神学（参见 Molendijk 1991，第 3 章）[^molendijk-1991]。此后肖尔兹将主攻方向转为数理逻辑与基础研究，自 1936 年起正式开课讲授。1943 年，他的教席更名为 *数理逻辑与基础研究*；同名研究所于 1950 年成立。肖尔兹 1952 年退休，1956 年 12 月 30 日卒于明斯特。
