      In 1952 Scholz published together with Hans Hermes the section “Mathematische Logik” in the *Enzyklopädie der Mathematischen Wissenschaften* (Hermes and Scholz 1952)[^hermes-1952], a comprehensive survey of classical, bivalent and decidable logic. They focused on sentential logic based on the notion of universal validity (*Allgemeingültigkeit*). They argued for the priority of semantical over syntactical considerations.
    step1: |-
      1952 年，肖尔兹与 Hans Hermes 合撰《数学科学百科全书》（*Enzyklopädie der Mathematischen Wissenschaften*）中的“数理逻辑”一节（Hermes and Scholz 1952）[^hermes-1952]，对古典的、二值的与可判定的逻辑作了全面综述。他们聚焦于以普遍有效性（*Allgemeingültigkeit*）概念为基础的语句逻辑。他们主张语义考虑优先于句法考虑。
    step2: |-
      1952 年，肖尔兹与 Hans Hermes 在《数学科学百科全书》（*Enzyklopädie der Mathematischen Wissenschaften*）中合撰“数理逻辑”一节（Hermes and Scholz 1952）[^hermes-1952]，对古典的、二值的与可判定的逻辑作了通盘综述。两人聚焦于以普遍有效性（*Allgemeingültigkeit*）概念为基石的语句逻辑，主张语义考虑优先于句法考虑。
