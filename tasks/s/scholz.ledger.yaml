      Scholz and his followers adopted the scientific world view as advocated by the philosophers of the neo-positivistic movement, in particular of the Vienna Circle and the Berlin Society for Scientific Philosophy. However, contrary to this movement, he even applied the scientific world view to metaphysics. This was observed with reservations. Otto Neurath, e.g., mentioned Scholz and the Münster Group as having contributed much of value, but Scholz “represents nevertheless a full-blown metaphysics” (Neurath 1937, reprint Neurath 1981, pp. 804–805)[^neurath-1937][^neurath-1981] which has to be rejected. The relation between Neurath and Scholz remained ambivalent. At least, they met at the First International Congress for Unity of Science at Paris in September 1935. The congress saw the establishment of a committee for the standardization of logical symbolism with members of the Vienna Circle, the Hilbert School, and the Münster Group. The initiative had come from Scholz and his school. The results of the committee’s negotiations were presented at the Forth International Congress for the Unity of Science at Cambridge (England) in July 1938 (cf. Peckhaus 2008, pp. 78–80; Behmann et al. 1937/38)[^behmann-1937][^peckhaus-2008].
    step1: |-
      肖尔兹及其追随者采纳了新实证主义运动、尤其是维也纳学派与柏林科学哲学学会的哲学家所倡导的科学世界观。然而，与该运动相反，他甚至把科学世界观应用于形而上学。这一点被人带着保留地看待。例如，奥托·纽拉特提到肖尔兹与明斯特小组贡献了许多有价值的东西，但肖尔兹“毕竟代表一种彻头彻尾的形而上学”（Neurath 1937, reprint Neurath 1981, pp. 804–805）[^neurath-1937][^neurath-1981]，而这必须加以拒斥。纽拉特与肖尔兹的关系始终矛盾。至少，他们于 1935 年 9 月在巴黎第一届国际科学统一大会上相遇。该大会成立了逻辑符号标准化委员会，成员来自维也纳学派、希尔伯特学派与明斯特小组。倡议出自肖尔兹及其学派。委员会谈判的结果于 1938 年 7 月在剑桥（英格兰）第四届国际科学统一大会上公布（参见 Peckhaus 2008, pp. 78–80；Behmann et al. 1937/38）[^behmann-1937][^peckhaus-2008]。
    step2: |-
      肖尔兹及其追随者接受了新实证主义运动所倡导的科学世界观，尤其是维也纳学派与柏林科学哲学学会的哲学家。然而与这一运动不同，他甚至把科学世界观施用于形而上学。时人对此时有保留。例如奥托·纽拉特虽承认肖尔兹与明斯特小组贡献良多，却认为肖尔兹“毕竟代表一种彻头彻尾的形而上学”（Neurath 1937, reprint Neurath 1981, pp. 804–805）[^neurath-1937][^neurath-1981]，而这是必须拒斥的。纽拉特与肖尔兹的关系始终若即若离。两人总算在 1935 年 9 月巴黎第一届国际科学统一大会上碰了面。该大会设立了逻辑符号标准化委员会，成员来自维也纳学派、希尔伯特学派与明斯特小组，而倡议正出自肖尔兹及其学派。委员会磋商的结果，于 1938 年 7 月在剑桥（英格兰）召开的第四届国际科学统一大会上公布（参见 Peckhaus 2008, pp. 78–80；Behmann et al. 1937/38）[^behmann-1937][^peckhaus-2008]。
