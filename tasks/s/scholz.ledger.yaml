      20 世纪 30 年代初，明斯特在逻辑研究上仍笼罩在哥廷根的阴影里。纳粹党人夺权之后，大多数德语逻辑学家失去职位，被迫流亡；唯有明斯特作为逻辑与基础研究的重镇延续下来。面对所谓“德意志数学”（“Deutsche Mathematik”）的攻讦，肖尔兹成功顶住了压力。那是一场纳粹种族主义运动，标榜德国“民族同胞”（*Volksgenossen*）的数学成就。慕尼黑数学家 Max Steck（1907—1971）攻击尤力。其《数学的主要问题》（*Das Hauptproblem der Mathematik*，1942）一书，矛头直指逻辑主义、公理方法与元数学——这些正是大卫·希尔伯特及其学派周围的逻辑学家和数学家所主张的。Steck 把希尔伯特的形式主义斥为“简直灾难性的”精神偏狭，从思想史的眼光看则是一种“颓废”（Steck 1942, p. 205）[^steck-1942]。书中数处把肖尔兹当作希尔伯特的代言人加以攻击，并把肖尔兹的明斯特学派称作“把早先所谓的维也纳学派移植到威斯特法伦的明斯特”（p. 176）。
