      第三帝国期间，肖尔兹扮演着信息中间人的角色，为流亡者与留守者牵线联络。他设法支援波兰友人，例如 1940 年协助 Jan Salamucha（1903—1944）脱离萨克森豪森集中营——德国当局为此曾威胁要撤销他的教授教席。他支援已移居美国的阿尔弗雷德·塔尔斯基（1901—1983），与塔尔斯基仍住华沙的妻儿保持联系。他还资助扬·卢卡西维茨（1878—1956）夫妇，最终帮助他们离开波兰、藏身德国。他们担心，红军一旦征服波兰，自己便性命难保（参见 Bolewski and Pierzchała 1989、Schreiber 1999、Peckhaus 1998–1999、Schmidt am Busch and Wehmeier 2005b）[^bolewski-1989][^peckhaus-1998][^schmidt-2005b][^schreiber-1999]。
