    source: |-
      Scholz’s most important contributions to the development of logic can be seen in his contributions to the historiography of logic. He stressed the value of the contributions of Gottfried Wilhelm Leibniz (1646–1716) and Bernard Bolzano (1781–1848) for the emergence of modern logic. He applied the method of logical analysis to classical philosophical texts, reconsidering, e. g., Anselm’s proof of the existence of God (Scholz 1950/51)[^scholz-1950], Descartes’s *cogito* argument (Scholz 1931b)[^scholz-1931b], and Kant’s transcendental deduction (Scholz 1943/44)[^scholz-1943]. He devoted considerable efforts to the study of Gottlob Frege’s work (cf. Sundholm 2005)[^sundholm-2005] and promoted David Hilbert’s metamathematics (Scholz 1942)[^scholz-1942]. With his *Geschichte der Logik* (1931a) Heinrich Scholz was a pioneer in the historiography of modern logic. Scholz restricted his presentation to formal logic or logistics. He reconstructs its development starting with Aristotle’s logic, discussing the Stoic modifications, medieval and early modern variations, arriving at Franz Brentano’s (1838–1917) contributions, whom he called the “only original figure among the German formal logicians [in philosophy] of the 19ᵗʰ century after *Bolzano* and prior to *Husserl*” (pp. 46–47). For Scholz, the modern shape of logic starts with Leibniz: “We speak of a sunrise mentioning the great name of *Leibniz*. With him a new life of Aristotelian logic begins, which finds its most beautiful manifestation in our days in the modern exact logic in the form of logistics” (p. 48). He highlighted Gottlob Frege as “the greatest genius of the new logic in the 19ᵗʰ century” (p. 57). According to Scholz he did more than any other logician for the interpretation of fundamental mathematical concepts with the help of fundamental concepts of logic operating on the basis of exactly defined principles. With this he raised the logical calculus to a level which made the Leibnizian “game with signs” possible.
    step1: |-
      肖尔兹对逻辑发展最重要的贡献，可以看作他对逻辑史编纂学的贡献。他强调了戈特弗里德·威廉·莱布尼茨（1646—1716）与伯纳德·鲍尔查诺（1781—1848）对现代逻辑兴起的贡献的价值。他把逻辑分析的方法应用于古典哲学文本，例如重新考察安瑟伦关于上帝存在的证明（Scholz 1950/51）[^scholz-1950]、笛卡尔的 *我思* 论证（Scholz 1931b）[^scholz-1931b] 与康德的先验演绎（Scholz 1943/44）[^scholz-1943]。他投入相当大的精力研究戈特洛布·弗雷格的著作（参见 Sundholm 2005）[^sundholm-2005]，并推广大卫·希尔伯特的元数学（Scholz 1942）[^scholz-1942]。以其《逻辑史》（1931a），海因里希·肖尔兹成为现代逻辑史编纂学的先驱。肖尔兹把叙述限制在形式逻辑或逻辑斯蒂。他从亚里士多德逻辑出发重构其发展，讨论斯多亚派的修改、中世纪与近代早期的变体，最后到达弗朗兹·布伦塔诺（1838—1917）的贡献；他称布伦塔诺是“19 世纪继 *鲍尔查诺* 之后、*胡塞尔* 之前德国〔哲学界的〕形式逻辑学家中唯一具有原创性的人物”（pp. 46–47）。在肖尔兹看来，逻辑的现代形态始于莱布尼茨：“我们提到 *莱布尼茨* 这一伟大名字时，说的是一个日出。随着他，亚里士多德逻辑的新生命开始了，而它在今天最美妙的体现，就是逻辑斯蒂形式的现代精确逻辑”（p. 48）。他把戈特洛布·弗雷格推举为“19 世纪新逻辑最伟大的天才”（p. 57）。按照肖尔兹，弗雷格在借助逻辑基本概念、依据精确规定原则来阐释数学基本概念方面，比任何其他逻辑学家做得都多。由此，他把逻辑演算提升到一个水平，使莱布尼茨式的“符号游戏”成为可能。
    step2: |-
      肖尔兹对逻辑发展最重要的贡献，可以说是在逻辑史编纂学方面。他着重指出戈特弗里德·威廉·莱布尼茨（1646—1716）与伯纳德·鲍尔查诺（1781—1848）对现代逻辑兴起所作的贡献。他把逻辑分析方法施用于古典哲学文本，重新考察了安瑟伦的上帝存在证明（Scholz 1950/51）[^scholz-1950]、笛卡尔的 *我思* 论证（Scholz 1931b）[^scholz-1931b] 与康德的先验演绎（Scholz 1943/44）[^scholz-1943]。他倾注大量心力研究戈特洛布·弗雷格的著作（参见 Sundholm 2005）[^sundholm-2005]，并推广大卫·希尔伯特的元数学（Scholz 1942）[^scholz-1942]。凭借《逻辑史》（1931a），海因里希·肖尔兹成为现代逻辑史编纂学的先驱。他把叙述限制在形式逻辑或逻辑斯蒂之内，从亚里士多德逻辑起笔，经斯多亚派的修改、中世纪与近代早期的种种变体，一路讲到弗朗兹·布伦塔诺（1838—1917）的贡献；他称布伦塔诺为“19 世纪继 *鲍尔查诺* 之后、*胡塞尔* 之前德国〔哲学界的〕形式逻辑学家中唯一具有原创性的人物”（pp. 46–47）。在肖尔兹看来，逻辑的现代形态自莱布尼茨始：“我们提到 *莱布尼茨* 这一伟大名字时，说的是一个日出。随着他，亚里士多德逻辑的新生命开始了，而它在今天最美妙的体现，就是逻辑斯蒂形式的现代精确逻辑”（p. 48）。他推举戈特洛布·弗雷格为“19 世纪新逻辑最伟大的天才”（p. 57）。据肖尔兹之见，弗雷格借助依据精确规定原则运作的逻辑基本概念，对数学基本概念作出了比任何其他逻辑学家都多的阐释；由此，他把逻辑演算提升到足以让莱布尼茨式“符号游戏”成为可能的水平。
