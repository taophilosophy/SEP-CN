      Scholz analyzed classical metaphysical doctrines with his logical tool of a predicate calculus with identity. His considerations are based on a special variation of a Platonic ontology combined with Leibniz’s notion of possible worlds, the Frege-Russell mathematical logic, Hilbert’s axiomatic method, and Tarski’s semantics. This approach found its final expression in the influential textbook *Grundzüge der mathematischen Logik* which was elaborated, co-authored, and published by Gisbert Hasenjaeger after Scholz’s death (Scholz and Hasenjaeger 1961)[^scholz-1961][^scholz-1961-2]. Hasenjaeger later called its philosophical background “discrete ontology”, a realistic position: “The world of concrete (or also abstract) things *consists* just *of things* which have some features and do not have others; between them some relations are given, others not” (Hasenjaeger 1962, pp. 30–31)[^hasenjaeger-1962].
    step1: |-
      肖尔兹以带等词的谓词演算这一逻辑工具分析古典形而上学学说。他的思考基于一种特殊变体的柏拉图本体论，并结合莱布尼茨的可能世界概念、弗雷格—罗素的数理逻辑、希尔伯特的公理方法与塔尔斯基的语义学。这一进路最终体现在影响深远的教科书《数理逻辑纲要》（*Grundzüge der mathematischen Logik*）中；该书在肖尔兹去世后由 Gisbert Hasenjaeger 加工、合著并出版（Scholz and Hasenjaeger 1961）[^scholz-1961][^scholz-1961-2]。Hasenjaeger 后来把该书的哲学背景称为“离散本体论”，一种实在论立场：“具体（或也包括抽象）事物的世界 *恰恰由* 那些具有某些特征而不具有另一些特征的事物 *构成*；它们之间，有些关系成立，有些则不成立”（Hasenjaeger 1962, pp. 30–31）[^hasenjaeger-1962]。
    step2: |-
      肖尔兹以带等词的谓词演算为逻辑工具，剖析古典形而上学学说。其思考依托于一种特殊形态的柏拉图本体论，并糅合莱布尼茨的可能世界概念、弗雷格—罗素的数理逻辑、希尔伯特的公理方法与塔尔斯基的语义学。这一进路的最终结晶，是影响深远的教科书《数理逻辑纲要》（*Grundzüge der mathematischen Logik*）；肖尔兹身后，该书由 Gisbert Hasenjaeger 加工、合著并出版（Scholz and Hasenjaeger 1961）[^scholz-1961][^scholz-1961-2]。Hasenjaeger 后来把该书的哲学背景称作“离散本体论”，一种实在论立场：“具体（或也包括抽象）事物的世界 *恰恰由* 那些具有某些特征而不具有另一些特征的事物 *构成*；它们之间，有些关系成立，有些则不成立”（Hasenjaeger 1962, pp. 30–31）[^hasenjaeger-1962]。
