      Scholz dedicated his *Religionsphilosophie* (1921) to his teachers Adolf von Harnack and Alois Riehl (on Scholz’s philosophy of religion cf. Molendijk 1991, Ratschow 1958, Stock 1987, Wimmer 2005)[^molendijk-1991][^ratschow-1958][^stock-1987][^wimmer-2005]. According to Scholz philosophy of religion does not deal with religion as such, but with its possibility, based on the fact of its reality in the sense of Kant’s critical philosophy (p. VIII). Religion becomes, thus, a philosophical problem. Scholz defines philosophy of religion in the widest sense as the application of philosophical means and presupposition of reasoning to the fact of religion (pp. 1–2). Religion is understood as part of culture being the epitome of creations of the human mind, the existence of which is preferred to their non-existence (p. 14). The object of analysis is empirical religion, i.e. religion as it is practiced in real life or as it is tangible. With this he deviates from constructive types of the philosophy of religion as they can be found, e.g., in the work of Immanuel Kant. In conclusion, he determines that philosophy of religion has an integrating function in a philosophy of cultural values. It consists in philosophical reflection on tangible (*erlebbare*) religion as it is practiced and, in particular, in reflection on expressions of religious consciousness whose truth is subject to reason. Therefore religion has never ceased to be a philosophical problem.
    step1: |-
      肖尔兹把他的《宗教哲学》（1921）献给他的老师阿道夫·冯·哈纳克与阿洛伊斯·里尔（关于肖尔兹的宗教哲学，参见 Molendijk 1991、Ratschow 1958、Stock 1987、Wimmer 2005）[^molendijk-1991][^ratschow-1958][^stock-1987][^wimmer-2005]。按照肖尔兹，宗教哲学并不处理宗教本身，而是处理宗教的可能性，其依据是宗教在康德批判哲学意义上的现实性这一事实（p. VIII）。于是，宗教成为一个哲学问题。肖尔兹把最广义的宗教哲学界定为：把哲学的手段与推理的前提应用于宗教这一事实（pp. 1–2）。宗教被理解为文化的一部分，是人的心智创造物的总汇，而其存在比其不存在更可取（p. 14）。分析的对象是经验性的宗教，即在现实生活中被实践的、或可触知的宗教。由此，他偏离了建构型的宗教哲学，例如在伊曼努尔·康德的著作中所见的那种。最后，他断定宗教哲学在文化价值哲学中具有整合功能。它在于对可体验的（*erlebbare*）被实践宗教作哲学反思，尤其在于对宗教意识的表现作反思，而这些表现的真理性须服从理性。因此，宗教从未停止成为一个哲学问题。
    step2: |-
      肖尔兹把《宗教哲学》（1921）题献给自己的老师阿道夫·冯·哈纳克与阿洛伊斯·里尔（关于肖尔兹的宗教哲学，参见 Molendijk 1991、Ratschow 1958、Stock 1987、Wimmer 2005）[^molendijk-1991][^ratschow-1958][^stock-1987][^wimmer-2005]。依肖尔兹之见，宗教哲学所处理的不是宗教本身，而是宗教的可能性，其依据则是宗教在康德批判哲学意义上的现实性这一事实（p. VIII）。于是，宗教便成了一个哲学问题。肖尔兹把最广义的宗教哲学界定为：将哲学的手段与推理的前提施用于宗教这一事实（pp. 1–2）。宗教被看作文化的一部分，是人的心智创造物之总汇，而其存在较其不存在更为可取（p. 14）。分析的对象是经验性的宗教，即在现实生活中实际践行、或可切实把握的宗教。就此而言，他偏离了建构型的宗教哲学，例如伊曼努尔·康德著作中的那种。最后他断定，宗教哲学在文化价值哲学中担负整合功能：对实际践行的、可体验的（*erlebbare*）宗教作哲学反思，尤其对宗教意识的表现作反思，而这些表现的真理性须服从理性。是故，宗教从未不再是哲学问题。
