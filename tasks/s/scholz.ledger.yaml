      In trying to establish a world-leading center of mathematical logic and foundational research at Münster, he was able to obtain Frege’s *Nachlass* for his chair in Münster in 1935. Later, he added to this collection the papers of the German algebraist of logic, Ernst Schröder (1841–1902), which he had obtained from the library of the Technical University of Karlsruhe. It is one of the tragic effects of World War II that Frege’s and Schröder’s papers were lost, perhaps destroyed during the bomb attacks on Münster in March 1945 (cf. Peckhaus 1993; Wehmeier and Schmidt am Busch 2000)[^peckhaus-1993][^wehmeier-2000]. Scholz had intended to publish a three-volume edition of Frege’s posthumous work and correspondence. Most of the typewritten copies Scholz had made of the original material were saved (on the Frege papers cf. Scholz and Bachmann 1936)[^scholz-1936].
    step1: |-
      为了在明斯特建立世界领先的数理逻辑与基础研究中心，他于 1935 年为其明斯特教席取得了弗雷格的遗稿（*Nachlass*）。后来，他又把从卡尔斯鲁厄工业大学图书馆得到的德国逻辑代数学家恩斯特·施罗德（Ernst Schröder，1841—1902）的文稿并入该收藏。弗雷格与施罗德的文稿后来散失，或许毁于 1945 年 3 月对明斯特的轰炸，这是第二次世界大战的悲剧性后果之一（参见 Peckhaus 1993；Wehmeier and Schmidt am Busch 2000）[^peckhaus-1993][^wehmeier-2000]。肖尔兹曾打算出版三卷本的弗雷格遗著与书信集。肖尔兹据原始材料所作的打字副本大多保存了下来（关于弗雷格文稿，参见 Scholz and Bachmann 1936）[^scholz-1936]。
    step2: |-
      为把明斯特建成世界领先的数理逻辑与基础研究中心，肖尔兹于 1935 年为自己的明斯特教席购得弗雷格的遗稿（*Nachlass*）。后来他又把从卡尔斯鲁厄工业大学图书馆取得的德国逻辑代数学家恩斯特·施罗德（Ernst Schröder，1841—1902）文稿并入这批收藏。弗雷格与施罗德的文稿后竟散失，或已毁于 1945 年 3 月对明斯特的轰炸，这是第二次世界大战造成的悲剧性损失之一（参见 Peckhaus 1993；Wehmeier and Schmidt am Busch 2000）[^peckhaus-1993][^wehmeier-2000]。肖尔兹原计划出版三卷本的弗雷格遗著与书信集；所幸他据原始材料打出的副本大多留存下来（关于弗雷格文稿，参见 Scholz and Bachmann 1936）[^scholz-1936]。
