      Scholz was also politically effective in promoting his field. He assembled the “Gruppe von Münster” (later “Schule von Münster”) and encouraged a number of his students to undertake studies in logic and foundational research, placing some of them in academic positions. They obtained important results in the theory of the predicate calculus, the theory of axiomatic systems, metamathematics, semantics and abstraction theory. Among them were Friedrich Bachmann (1909–1982), Albrecht Becker-Freyseng (1907–1976), Gisbert Hasenjaeger (1919–2006), Hans Hermes (1912–2003), Walter Kinder (1909–1998), Karl Schröter (1905–1977), and Hermann Schweitzer (1909–2002). For the publication of this school’s results and related investigations Scholz founded the series *Forschungen zur Logik und zur Grundlegung der exakten Wissenschaften* (eight issues 1937–1943, n.s. reprinted as Scholz, ed. 1970). Among them is the outstanding book by Heinrich Scholz and Hermann Schweitzer *Die sogenannten Definitionen durch Abstraktion* with its elaboration of modern abstraction theory using equivalence classes (Scholz and Schweitzer 1935)[^scholz-1935].
    step1: |-
      肖尔兹在政治上也卓有成效地推动了自己的领域。他聚集起“明斯特小组”（“Gruppe von Münster”，后称“明斯特学派”），鼓励一批学生从事逻辑与基础研究，并把其中一些人安排到学术职位上。他们在谓词演算理论、公理系统理论、元数学、语义学与抽象理论方面取得了重要成果。他们当中有 Friedrich Bachmann（1909—1982）、Albrecht Becker-Freyseng（1907—1976）、Gisbert Hasenjaeger（1919—2006）、Hans Hermes（1912—2003）、Walter Kinder（1909—1998）、Karl Schröter（1905—1977）与 Hermann Schweitzer（1909—2002）。为了出版该学派成果及相关研究，肖尔兹创办了丛书《逻辑与精确科学基础研究》（*Forschungen zur Logik und zur Grundlegung der exakten Wissenschaften*；八期，1937—1943，新辑重印为 Scholz, ed. 1970）。其中有海因里希·肖尔兹与 Hermann Schweitzer 合著的杰出著作《所谓通过抽象的定义》（*Die sogenannten Definitionen durch Abstraktion*），该书以等价类阐发了现代抽象理论（Scholz and Schweitzer 1935）[^scholz-1935]。
    step2: |-
      肖尔兹在政治上也颇有手腕，善于为自己的领域开路。他聚集起“明斯特小组”（“Gruppe von Münster”，后称“明斯特学派”），鼓励一批学生研治逻辑与基础研究，并把其中一些人安插到学术岗位上。这些人在谓词演算理论、公理系统理论、元数学、语义学与抽象理论上均有重要建树，包括 Friedrich Bachmann（1909—1982）、Albrecht Becker-Freyseng（1907—1976）、Gisbert Hasenjaeger（1919—2006）、Hans Hermes（1912—2003）、Walter Kinder（1909—1998）、Karl Schröter（1905—1977）与 Hermann Schweitzer（1909—2002）。为刊布本学派成果及相关研究，肖尔兹创办了丛书《逻辑与精确科学基础研究》（*Forschungen zur Logik und zur Grundlegung der exakten Wissenschaften*；共八期，1937—1943，新辑重印为 Scholz, ed. 1970）。其中一部杰作是海因里希·肖尔兹与 Hermann Schweitzer 合著的《所谓通过抽象的定义》（*Die sogenannten Definitionen durch Abstraktion*），该书以等价类阐发现代抽象理论（Scholz and Schweitzer 1935）[^scholz-1935]。
