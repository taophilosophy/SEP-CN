      The year 1921 marks a big change in Scholz’s focus of philosophical research. He himself tells the story that he discovered his love for mathematical logic by accidentally coming across Whitehead’s and Russell’s *Principia Mathematica* (Whitehead and Russell 1910–13, cf. Peckhaus 2005)[^peckhaus-2005][^whitehead-1910] in the library of the University of Kiel. This work convinced Scholz of the significance of mathematics, although he had no deeper knowledge of this subject at that time. As a full professor of philosophy he decided to begin formal university studies of mathematics and theoretical physics. After having moved to Münster, Scholz focused his research on mathematical logic and foundations.
    step1: |-
      1921 年标志着肖尔兹哲学研究重点的重大转变。他本人讲过这样一个故事：他在基尔大学图书馆偶然翻到怀特海与罗素的《数学原理》（Whitehead and Russell 1910–13，参见 Peckhaus 2005）[^peckhaus-2005][^whitehead-1910]，由此发现自己对数理逻辑的热爱。这部著作使肖尔兹确信数学的重要性，尽管他当时对这门学科并无更深入的了解。作为哲学正教授，他决定正式开始在大学研习数学与理论物理学。迁往明斯特之后，肖尔兹把研究集中于数理逻辑与基础。
    step2: |-
      1921 年是肖尔兹哲学研究重心的一大转折。据他自述，他是在基尔大学图书馆里偶然翻到怀特海与罗素的《数学原理》（Whitehead and Russell 1910–13，参见 Peckhaus 2005）[^peckhaus-2005][^whitehead-1910]，才发觉自己对数理逻辑的热爱。这部书让肖尔兹确信数学的重要性，尽管他当时对数学尚无更深的了解。身为哲学正教授，他决心正式进入大学研习数学与理论物理学。迁居明斯特之后，肖尔兹便把研究集中到数理逻辑与基础上。
