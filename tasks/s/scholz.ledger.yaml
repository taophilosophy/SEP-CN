      Heinrich Scholz (1884–1956) was a German Protestant theologian, philosopher, and logician who supported the neo-positivistic scientific world view, applying it, however, to a scientific metaphysics as well. He helped to establish the academic field “Mathematical Logic and Foundational Research”, claiming the priority of language construction and semantics in order to solve foundational problems even outside mathematics. He was also the driving force behind the institutionalization of mathematical logic and foundational research in Germany and a pioneer in the historiography of logic.
    step1: |-
      海因里希·肖尔兹（Heinrich Scholz，1884—1956）是一位德国新教神学家、哲学家和逻辑学家，他支持新实证主义的科学世界观，不过也把它应用于一种科学的形而上学。他帮助确立了“数理逻辑与基础研究”这一学术领域，主张语言建构与语义学的优先性，以便解决甚至数学之外的基础问题。他也是德国数理逻辑与基础研究建制化的推动力量，并且是逻辑史编纂学的先驱。
