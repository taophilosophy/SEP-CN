      In Münster, Scholz taught right from the beginning to a large extent on logic, in particular “logistic”, as the new, i.e., formal, symbolic, algebraic, algorithmic or mathematical logic was called since the Second International Congress for Philosophy at Geneva in 1904 (cf. Couturat 1904; Scholz 1931a, 57)[^scholz-1931a][^couturat-1904]. In April 1936 he received an official extension of his philosophical appointment to “Logistic Logic and Foundational Research”. In the same year, “Section B” (consisting of Scholz’s chair and the academic and non-academic staff attached to it) of the Philosophical Seminar was renamed “Logistic Section”. The next step was taken in 1938 when this “section” became a “seminar” of its own. The denomination of Scholz’s chair was changed to “Philosophy of Mathematics and Science with Special Consideration of the New Logic and Foundational Research”. In 1943 the denomination was changed again to “Mathematical Logic and Foundational Research”. The “Logistic Seminar” was renamed “Seminar for Mathematical Logic and Foundational Research” in 1946, and finally, in 1950, it was renamed again, and elevated in its organizational status, to “Institute for Mathematical Logic and Foundational Research” (cf. Schmidt am Busch & Wehmeier 2005a)[^schmidt-2005a].
    step1: |-
      在明斯特，肖尔兹一开始就主要讲授逻辑，尤其是“逻辑斯蒂”（logistic）——自 1904 年日内瓦第二届国际哲学大会以来，人们这样称呼新的、即形式的、符号的、代数的、算法的或数学的逻辑（参见 Couturat 1904；Scholz 1931a, 57）[^scholz-1931a][^couturat-1904]。1936 年 4 月，他的哲学教职获得正式扩展，改为“逻辑斯蒂逻辑与基础研究”。同年，哲学研讨班的“B 组”（由肖尔兹的教席及附属于它的学术与非学术人员组成）更名为“逻辑斯蒂组”。下一步发生在 1938 年，这个“组”成为独立的“研讨班”。肖尔兹的教席名称改为“数学与科学哲学，特别顾及新逻辑与基础研究”。1943 年，名称再次改为“数理逻辑与基础研究”。“逻辑斯蒂研讨班”于 1946 年更名为“数理逻辑与基础研究研讨班”，最后于 1950 年再次更名，并在组织层级上升格为“数理逻辑与基础研究所”（参见 Schmidt am Busch & Wehmeier 2005a）[^schmidt-2005a]。
    step2: |-
      在明斯特，肖尔兹从一开始就以逻辑、尤其是“逻辑斯蒂”（logistic）为主要讲授内容。1904 年日内瓦第二届国际哲学大会以来，人们便用这个名称称呼新的逻辑，即形式的、符号的、代数的、算法的或数学的逻辑（参见 Couturat 1904；Scholz 1931a, 57）[^scholz-1931a][^couturat-1904]。1936 年 4 月，他的哲学教职正式扩为“逻辑斯蒂逻辑与基础研究”。同年，哲学研讨班的“B 组”（由肖尔兹的教席及其附属的学术与非学术人员组成）更名为“逻辑斯蒂组”。1938 年再进一步，这个“组”成为独立的“研讨班”。肖尔兹的教席名称改为“数学与科学哲学，特别顾及新逻辑与基础研究”，1943 年又改为“数理逻辑与基础研究”。“逻辑斯蒂研讨班”1946 年更名为“数理逻辑与基础研究研讨班”，1950 年再度更名，并在组织层级上升格为“数理逻辑与基础研究所”（参见 Schmidt am Busch & Wehmeier 2005a）[^schmidt-2005a]。
