      He worked particularly on the borderline between mathematics and philosophy, motivated by the problem of distinguishing logical calculi from general calculi. He supported David Hilbert’s foundational program having led to metamathematics and proof theory, but focused on language and semantics. Language is necessary to present logical systems. He suggests a formalized language with a degree of exactness even exceeding the exactness of mathematical languages. He calls this language “Leibniz language” *L* (cf. Scholz 1944)[^scholz-1944]. Leibniz languages are symbolic languages with exactly defined means of expression. Each expression is a finite string of characters using a given symbolism according to well-determined rules. If the means of expression are restricted in such a way that (1) these expressions always have sense, and (2) it is decidable whether the produced expressions are true in all possible worlds (universally valid, *allgemeingültig*), then *L* is called a “Universal Leibniz Language”. A universally valid fundamental expression is called a Leibniz Theorem. A logic calculus is defined as a set of truths presentable by a Leibniz theorem over *L*.
    step1: |-
      他尤其工作在数学与哲学的边界上，其动力来自区分逻辑演算与一般演算的问题。他支持大卫·希尔伯特导向元数学与证明论的基础纲领，但把重点放在语言与语义学上。语言是呈现逻辑系统所必需的。他提出一种形式化语言，其精确程度甚至超过数学语言的精确程度。他把这种语言称为“莱布尼茨语言” *L*（参见 Scholz 1944）[^scholz-1944]。莱布尼茨语言是表达手段得到精确规定的符号语言。每个表达式都是使用给定符号系统、依照明确确定的规则构成的有穷字符串。若表达手段受到如下限制：(1) 这些表达式总有意义；(2) 可判定所产生的表达式是否在所有可能世界中为真（普遍有效，*allgemeingültig*），则 *L* 称为“普遍莱布尼茨语言”。普遍有效的基本表达式称为莱布尼茨定理。逻辑演算被定义为可由 *L* 上的莱布尼茨定理表述的真之集合。
    step2: |-
      他主要工作在数学与哲学的交界处，由区分逻辑演算与一般演算的问题所驱动。他支持大卫·希尔伯特那条通向元数学与证明论的基础纲领，但着眼点在语言与语义学。呈现逻辑系统离不开语言。他提出一种形式化语言，其精确程度甚至超过数学语言。他称之为“莱布尼茨语言” *L*（参见 Scholz 1944）[^scholz-1944]。莱布尼茨语言是表达手段有精确规定的符号语言：每个表达式都是依既定规则、使用给定符号系统构成的有穷字符串。倘若表达手段受到如下限制——(1) 这些表达式总有意义；(2) 可判定所生成的表达式是否在所有可能世界中为真（普遍有效，*allgemeingültig*）——那么 *L* 便称为“普遍莱布尼茨语言”。普遍有效的基本表达式称为莱布尼茨定理。所谓逻辑演算，则定义为可由 *L* 上的莱布尼茨定理表述的真之集合。
