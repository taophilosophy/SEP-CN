      Heinrich Scholz (1884–1956), German Protestant theologian, philosopher, and logician, began his academic career as a protestant systematic theologian at the University of Breslau. He then moved to the University of Kiel and in 1928 to the University of Münster in Westphalia. His *Religionsphilosophie* (Scholz 1921)[^scholz-1921] became particularly influential in protestant theology. Inspired by Alfred North Whitehead’s and Bertrand Russell’s *Principia Mathematica* (Whitehead and Russell 1910–1913)[^whitehead-1910] he changed his research area to mathematical logic and foundational research. He was successful in establishing the “*Schule von Münster*” (“Münster School”) of logicians and in founding the first academic department for mathematical logic in Germany, the “*Institut für Mathematische Logik und Grundlagenforschung*” (“Institute for Mathematical Logic and Foundational Research”) in Münster, which is still in existence today. Scholz combined research on logical calculi with an epistemological Platonism and openness for metaphysical approaches. Nevertheless, he felt close to the scientific world view of Logical Empiricism. Furthermore, with his *Geschichte der Logik* (Scholz 1931a)[^scholz-1931a] Heinrich Scholz was a pioneer in the historiography of logic.
    step1: |-
      海因里希·肖尔兹（1884—1956），德国新教神学家、哲学家和逻辑学家，以布雷斯劳大学的新教系统神学家身份开始其学术生涯。他随后转到基尔大学，并于 1928 年转到威斯特法伦的明斯特大学。他的《宗教哲学》（*Religionsphilosophie*，Scholz 1921）[^scholz-1921] 在新教神学中特别有影响。受阿尔弗雷德·诺思·怀特海与伯特兰·罗素的《数学原理》（*Principia Mathematica*，Whitehead and Russell 1910–1913）[^whitehead-1910] 启发，他把研究领域转向数理逻辑与基础研究。他成功地建立了逻辑学家的“明斯特学派”（“*Schule von Münster*”），并在德国创立了第一个数理逻辑学术部门，即明斯特的“数理逻辑与基础研究所”（“*Institut für Mathematische Logik und Grundlagenforschung*”），该所至今仍然存在。肖尔兹把逻辑演算的研究与一种认识论上的柏拉图主义以及对形而上学进路的开放态度结合起来。尽管如此，他仍感到自己接近逻辑经验主义的科学世界观。此外，以其《逻辑史》（*Geschichte der Logik*，Scholz 1931a）[^scholz-1931a]，海因里希·肖尔兹成为逻辑史编纂学的先驱。
    step2: |-
      海因里希·肖尔兹（Heinrich Scholz，1884—1956）是德国新教神学家、哲学家与逻辑学家，学术生涯始于布雷斯劳大学，任新教系统神学教授。此后他转赴基尔大学，1928 年又转到威斯特法伦的明斯特大学。他的《宗教哲学》（*Religionsphilosophie*，Scholz 1921）[^scholz-1921] 在新教神学中影响尤大。受阿尔弗雷德·诺思·怀特海与伯特兰·罗素的《数学原理》（*Principia Mathematica*，Whitehead and Russell 1910–1913）[^whitehead-1910] 启发，他改治数理逻辑与基础研究。他成功凝聚起逻辑学家中的“明斯特学派”（“*Schule von Münster*”），并在德国创办了第一个数理逻辑学术机构——明斯特的“数理逻辑与基础研究所”（“*Institut für Mathematische Logik und Grundlagenforschung*”），该所存续至今。肖尔兹把逻辑演算研究与认识论上的柏拉图主义、以及对形而上学进路的开放态度熔于一炉。即便如此，他仍自认亲近逻辑经验主义的科学世界观。此外，凭借《逻辑史》（*Geschichte der Logik*，Scholz 1931a）[^scholz-1931a]，海因里希·肖尔兹成为逻辑史编纂学的先驱。
