      During the Third Reich Scholz served as a kind of information broker, mediating contacts between émigrés and those who stayed behind. He was able to support his Polish friends, helping, e.g., to rescue Jan Salamucha (1903–1944) from the concentration camp in Sachsenhausen in 1940 (an action for which German authorities threatened him with removal from his professorial chair). He supported Alfred Tarski (1901–1983), who had emigrated to the U.S.A., by maintaining contact with his wife and his two children, who still lived in Warsaw. He supported Jan Łukasiewicz (1878–1956) and his wife financially and was eventually able to help them to leave Poland and to hide in Germany. They feared for their lives in case the Red Army would conquer Poland (cf. Bolewski and Pierzchała 1989, Schreiber 1999, Peckhaus 1998–1999, Schmidt am Busch and Wehmeier 2005b)[^bolewski-1989][^peckhaus-1998][^schmidt-2005b][^schreiber-1999].
    step1: |-
      在第三帝国时期，肖尔兹充当某种信息中间人，为流亡者与留在国内的人牵线搭桥。他得以支援波兰友人，例如帮助 Jan Salamucha（1903—1944）于 1940 年脱离萨克森豪森集中营（德国当局为此曾威胁要解除他的教授教席）。他支援已移居美国的阿尔弗雷德·塔尔斯基（1901—1983），与其仍住在华沙的妻子和两个孩子保持联系。他资助扬·卢卡西维茨（1878—1956）夫妇，最终帮助他们离开波兰并藏身德国。他们担心，一旦红军征服波兰，自己便性命难保（参见 Bolewski and Pierzchała 1989、Schreiber 1999、Peckhaus 1998–1999、Schmidt am Busch and Wehmeier 2005b）[^bolewski-1989][^peckhaus-1998][^schmidt-2005b][^schreiber-1999]。
