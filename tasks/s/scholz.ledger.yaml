      The close relation between logic and metaphysics is the topic of Scholz’s book *Metaphysik als strenge Wissenschaft* (Scholz 1941)[^scholz-1941]. In this book metaphysics is dealt with as an ontology in the sense of a theory comprising the entirety of truths. It can be linguistically expressed and deals with things which can be understood as individuals. These truths are not restricted to particular domains, but are valid for all non-empty domains in all possible worlds (pp. 13–14). Metaphysics as a rigorous science implies the construction of a formalized “precision language”. In this book Scholz uses the language of first order predicate calculus with identity. A central notion is “universal validity” (*Allgemeingültigkeit*), understood as a metaphysical notion (validity in all possible worlds). This notion is applied to an axiomatized theory of identity and difference.
    step1: |-
      逻辑与形而上学的密切关系，是肖尔兹《作为严格科学的形而上学》（*Metaphysik als strenge Wissenschaft*，Scholz 1941）[^scholz-1941] 一书的主题。书中把形而上学当作本体论来处理，即当作一种囊括全部真理的理论。它可以得到语言表达，所处理的是可理解为个体的东西。这些真理不限于特定领域，而是在所有可能世界中对所有非空领域都有效（pp. 13–14）。作为严格科学的形而上学意味着建构一种形式化的“精确语言”。书中肖尔兹使用带等词的一阶谓词演算语言。一个核心概念是“普遍有效性”（*Allgemeingültigkeit*），它被理解为形而上学概念（在所有可能世界中的有效性）。这一概念被应用于一种公理化了的同异理论。
    step2: |-
      逻辑与形而上学的密切关联，正是肖尔兹《作为严格科学的形而上学》（*Metaphysik als strenge Wissenschaft*，Scholz 1941）[^scholz-1941] 的主题。书中把形而上学作为本体论来处理，即作为一种囊括全部真理的理论。它能以语言表达，所处理的是可理解为个体的东西。这些真理不囿于特定领域，而是在一切可能世界中对一切非空领域皆有效（pp. 13–14）。形而上学若要成为严格科学，便须建构一种形式化的“精确语言”。书中肖尔兹采用带等词的一阶谓词演算语言，核心概念是“普遍有效性”（*Allgemeingültigkeit*），被理解为形而上学概念（在所有可能世界中的有效性）。这一概念被施用于一种公理化了的同异理论。
