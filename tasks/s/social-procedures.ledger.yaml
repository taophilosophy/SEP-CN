    source: |-
      Algorithms come in many forms and flavors, for example, sequential and parallel ones. For interesting introductions to algorithms in computer science, see Harel & Feldman (2004) and Miller & Boxer (2012). In a similar manner as these algorithms, social procedures can be analyzed with the formal tools of logic and theoretical computer science.[^note-2]
    step1: |-
      算法有诸多形式与风格，例如串行的与并行的。关于计算机科学中算法的有趣导论，见 Harel & Feldman（2004）与 Miller & Boxer（2012）。与这些算法类似，社会程序也可以用逻辑与理论计算机科学的形式工具来分析。[^note-2]
    step2: |-
      算法的形态与路数很多，串行的、并行的都有。若想要计算机科学中有趣的算法导论，可看 Harel & Feldman（2004）与 Miller & Boxer（2012）。社会程序亦可循同样的路数，用逻辑与理论计算机科学的形式工具来分析。[^note-2]
  - id: 10
    kind: body
    source: |-
      It appears that most amenable to a formal approach are those social procedures for which one wants to guarantee that given certain starting conditions, the procedure preserves or creates specific desired properties. Examples are social procedures for fair division (Section 2), matching (Section 3), communication (Section 4). Finally, the formal perspective is useful for situations requiring participants’ strategic reasoning (Section 5). A common element is that in all these situations, agents’ knowledge and lack of knowledge of other agents’ mental states play an important role. As a counterpart to the examples in the current article, Van Benthem (2018) provides an intriguing overview about the current roles of social perspectives in computer science itself, highlighting social agency and information.
    step1: |-
      看来最适合形式化进路的，是那些人们想要保证：在给定某些起始条件下，程序保持或创造出特定期望性质的社会程序。例子有公平分配（第 2 节）、匹配（第 3 节）、通信（第 4 节）的社会程序。最后，形式视角对于需要参与者策略性推理的情境（第 5 节）也有用。一个共同要素是，在所有这些情境中，智能体对他人心理状态的知晓与不知晓都起着重要作用。作为本文诸例的对应物，Van Benthem（2018）就社会视角在计算机科学自身中当前扮演的角色，提供了一份引人入胜的概览，突出了社会能动性与信息。
    step2: |-
      最适合形式化进路的，看来是那些人们希望加以保证的社会程序：给定某些起始条件，程序能保持或创造出特定的期望性质。公平分配（第 2 节）、匹配（第 3 节）、通信（第 4 节）即是其例。最后，形式视角对需要参与者作策略推理的情境（第 5 节）也有用。这些情境有一个共同点：智能体对他人心理状态知道什么、不知道什么，都举足轻重。作为本文诸例的对照，Van Benthem（2018）就社会视角如今在计算机科学内部所占的位置提供了一份引人入胜的概览，突出了社会能动性与信息。
