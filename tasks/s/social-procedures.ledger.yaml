    source: |-
      Many social procedures are designed to create common knowledge (Lewis 1969; van Ditmarsch et al. 2009; and entry on common knowledge)[^ditmarsch-2009][^lewis-1969]. The old-fashioned ritual that takes place when you withdraw a large amount of money from your bank account and have it paid out to you in cash by the cashier is an example.
    step1: |-
      许多社会程序设计来创造共同知识（Lewis 1969; van Ditmarsch et al. 2009; 并见“共同知识”词条）[^ditmarsch-2009][^lewis-1969]。当你从银行账户取出大笔钱、由出纳以现金付给你时发生的老式仪式，即为一例。
    step2: |-
      许多社会程序，其设计目的就在创造共同知识（Lewis 1969; van Ditmarsch et al. 2009; 并见“共同知识”词条）[^ditmarsch-2009][^lewis-1969]。你从银行账户取出大笔款项、由出纳点现金付给你时的那套老式仪式，便是一例。
  - id: 75
    kind: body
    source: |-
      How and whether common knowledge can be achieved depends on available communication facilities. Public announcement or publicly observable ritual (the cashier ritual mentioned above) can create common knowledge. But, as Halpern and Moses (1984) proved, message exchange in a distributed environment, where there is no guarantee that messages get delivered, cannot. Halpern and Moses use the example of two generals who are planning a coordinated attack on a city. The generals are on two hills on opposite sides of the city, each with their own army, and they know that they can only succeed in capturing the city if their two armies attack at the same time. But the valley that separates the two hills is in enemy hands, and any messengers that are sent from one army base to the other run a severe risk to get captured. The generals have agreed on a joint attack, but still have to settle the time. So the generals start sending messages, for example, “Let’s attack at 9:00 AM”. But they cannot be sure that the messengers succeed in delivering their message. And if they get through, there is no guarantee that the message of acknowledgement will get delivered. And so on.
    step1: |-
      共同知识能否达成、以及如何达成，取决于可用的通信设施。公开宣告或可公开观察的仪式（上述出纳仪式）可以创造共同知识。但正如哈尔彭与摩西（1984）所证明的，在分布式环境中，若不能保证消息送达，消息交换则不能创造共同知识。哈尔彭与摩西用两位将军计划协同进攻一座城市的例子。两位将军位于城市两侧的两座山丘上，各率自己的军队，他们知道只有两支军队同时进攻才能成功夺取该城。但分隔两座山丘的山谷在敌人手中，任何从一个军营派往另一个军营的信使都有被俘的严重风险。将军们已商定联合进攻，但还须确定时间。于是将军们开始发送消息，例如“我们上午 9:00 进攻”。但他们无法确定信使能成功送达消息。而即使送达，也不能保证确认消息会被送达。如此等等。
    step2: |-
      共同知识能否达成、如何达成，取决于可用的通信设施。公开宣告，或可公开观察的仪式（即上述出纳仪式），能创造共同知识。但哈尔彭与摩西（1984）证明：在分布式环境中，若消息送达并无保证，单靠交换消息则创造不出共同知识。他们举了两位将军谋划合攻一城的例子。两位将军分驻城两侧的两座山头，各领一军；他们知道，唯有两军同时进攻，才能拿下此城。可隔开两山的山谷在敌手，从一处营地派往另一处的信使，随时有被擒的危险。将军们已约定合攻，只差定下时辰。于是他们互发消息，譬如“上午 9:00 进攻”。然而信使能否送到，他们无从确定；即便送到，确认的回信能否送到，也同样没有保证。如此循环不已。
  - id: 76
    kind: body
    source: |-
      Even if common knowledge is sometimes hard to achieve in practice, it serves as necessary presumption in regulating society. Roman lawgivers found out long ago that if citizens within their jurisdiction could plead innocence because of being unaware of the law, no offender could ever get convicted. So they invented principles like *Ignorantia legis neminem excusat*, “ignorance of the law excuses no one”. Societies that abide by the rule of law have to be organized in such a way that citizens *in principle* are in a position to know the law. The laws have to be properly published and distributed, for example, by being printed in a government gazette to which every citizen has access.
    step1: |-
      即使共同知识有时在实践中难以达成，它仍充当规制社会的必要预设。罗马的立法者早就发现，若其辖区内的公民可以因不知法而申辩无辜，则任何罪犯都无法被定罪。于是他们发明了 *Ignorantia legis neminem excusat*（不知法不免责）这样的原则。遵守法治的社会，必须以这样的方式组织：公民 *原则上* 处于能够知道法律的位置。法律必须妥善公布与分发，例如印在每位公民都能查阅的政府公报上。
    step2: |-
      共同知识虽在实践中有时难以达成，却是规制社会不可或缺的预设。罗马的立法者早已看出：若辖内公民能以不知法为由自辩无辜，则任何罪犯都无从定罪。于是他们立下 *Ignorantia legis neminem excusat*（不知法不免责）之类的原则。奉行法治的社会，其组织必须使公民 *原则上* 有能力知晓法律。法律须妥为公布、分发，例如刊印于人人可得而阅的政府公报。
  - id: 77
    kind: body
    source: |-
      In his book “Rational Ritual” (2001), Michael Suk-Young Chwe points out the importance of the *size* of groups for which common knowledge gets established. A brand name that is common knowledge in a large group is worth a lot of money. Chwe analyzes the example of advertisements broadcasted during the American football Super Bowl. He compares the enormous cost of making something common knowledge by means of such advertisements to the obvious benefits. Part of the benefit is in the fact that the advertisements create common knowledge. An important consideration when deciding to buy a smartphone of a particular brand, for example, is the knowledge that others are going to buy the same model too.
    step1: |-
      Michael Suk-Young Chwe 在《理性的仪式》（2001）一书中指出，共同知识得以确立的群体 *规模* 很重要。一个在大群体中成为共同知识的品牌名称价值连城。Chwe 分析了美式橄榄球超级碗期间播出的广告这一例子。他把通过此类广告使某事成为共同知识的巨大成本，与明显的收益相比较。收益的一部分就在于这样一个事实：广告创造了共同知识。例如，在决定购买某一品牌的智能手机时，一项重要的考虑是别人也会买同一型号。
    step2: |-
      Michael Suk-Young Chwe 在《理性的仪式》（2001）一书中指出，共同知识得以确立的群体 *规模* 甚为要紧。一个品牌若在大群体中成为共同知识，便价值不菲。Chwe 剖析了美式橄榄球超级碗期间播出广告的例子，把借这类广告使某事成为共同知识的巨额花费，同显而易见的收益两相对照。收益之一端，恰在于广告创造了共同知识：譬如决定买某一品牌的智能手机时，一项要紧的考量便是别人也会买同一型号。
  - id: 78
    kind: body
    source: |-
      Of course in many social situations, you may want to *prevent* common knowledge from arising, for example, if you want to keep a secret from certain others. There are also more interesting cases where everybody knows some fact, for example that a particular country possesses nuclear weapons, but where it would lead to political problems to make this fact common knowledge by making a public announcement. For a number of such social situations where maintaining privacy and ignorance are crucial, see van Eijck and Verbrugge (2009). An interesting recent development is the study of dynamic-epistemic logic-based *epistemic planning*, which enables us to synthesize communication protocols in order to create certain exact configurations of levels of higher-order knowledge within a group (Bolander and Andersen 2011, Löwe, Pacuit, and Witzel 2011)[^bolander-2011].
    step1: |-
      当然，在许多社会情境中，你可能想要 *阻止* 共同知识产生，例如当你想对某些人保密时。还有一些更有趣的情形：人人都知道某个事实，例如某个国家拥有核武器，但若通过公开宣告使这一事实成为共同知识，就会导致政治问题。关于若干维持隐私与不知情至关重要的此类社会情境，见 van Eijck 与 Verbrugge（2009）。近来一项有趣的发展，是基于动态认知逻辑的 *认知规划* 研究，它使我们能够合成通信协议，以便在群体内创造出高阶知识层级的某些精确配置（Bolander and Andersen 2011, Löwe, Pacuit, and Witzel 2011）[^bolander-2011]。
    step2: |-
      当然，在许多社会情境里，你反倒想 *阻止* 共同知识生成，比如要对某些人保守秘密时。还有更耐人寻味的情形：某个人人皆知的事实——例如某国拥有核武器——若经公开宣告成为共同知识，却会招致政治麻烦。关于若干以维持隐私与不知情为要务的社会情境，见 van Eijck 与 Verbrugge（2009）。晚近一项有意思的进展，是基于动态认知逻辑的 *认知规划* 研究：它可以合成通信协议，在群体内造出高阶知识层级的特定精确配置（Bolander and Andersen 2011, Löwe, Pacuit, and Witzel 2011）[^bolander-2011]。
