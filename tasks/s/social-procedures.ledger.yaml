      A related recent trend in game theory that is relevant for social software, is to step away from solution concepts such as the Nash equilibrium and instead to focus on the process of rational deliberation: the “theory of play” (see van Benthem, Pacuit and Roy, 2011, as well as the entry logics for analyzing games). This type of research delineates both the normative principles guiding the players’ strategic reasoning, and the psychological phenomena explaining the differences between predicted and observed behavior in games (Camerer 2003; Ghosh and Verbrugge 2018; Pacuit 2015; Meijering et al. 2012, 2014; Top et al. 2018)[^camerer-2003][^ghosh-2018][^meijering-2012][^pacuit-2015][^top-2018].
    step1: |-
      博弈论中一个与社会软件相关的新近趋势，是离开纳什均衡之类的解概念，转而关注理性慎思的过程：“对局理论”（见 van Benthem, Pacuit and Roy, 2011，以及“分析博弈的逻辑”词条）。这类研究既勾勒指导参与者策略推理的规范性原则，也刻画解释博弈中预测行为与观察行为之差异的心理现象（Camerer 2003; Ghosh and Verbrugge 2018; Pacuit 2015; Meijering et al. 2012, 2014; Top et al. 2018）[^camerer-2003][^ghosh-2018][^meijering-2012][^pacuit-2015][^top-2018]。
    step2: |-
      博弈论中有一新近动向与社会软件相关：不再倚重纳什均衡这类解概念，转而着眼于理性慎思的过程，即“对局理论”（见 van Benthem, Pacuit and Roy, 2011，以及“分析博弈的逻辑”词条）。此类研究一面勾勒引导参与者作策略推理的规范原则，一面刻画用以解释博弈中预测行为与实际行为何以不同的心理现象（Camerer 2003; Ghosh and Verbrugge 2018; Pacuit 2015; Meijering et al. 2012, 2014; Top et al. 2018）[^camerer-2003][^ghosh-2018][^meijering-2012][^pacuit-2015][^top-2018]。
