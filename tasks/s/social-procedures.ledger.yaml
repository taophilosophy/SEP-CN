      In contrast, another fascinating area of research, evolutionary game theory (see entry on evolutionary game theory), investigates how features like altruism, social norms, moral behavior and cooperation could actually have evolved. This area combines both normative and descriptive work (Axelrod 1984; Bowles and Gintis 2011; Sigmund 2010)[^axelrod-1984][^bowles-2011][^sigmund-2010]. As a particular social software contribution to this area, Gärdenfors (2012) characterized how much cognition and communication are required for several kinds of cooperation, from simple flocking behavior, through reciprocal altruism (“I’ll scratch your back if you scratch mine”), up to fully fledged teamwork.
    step1: |-
      相比之下，另一个引人入胜的研究领域——演化博弈论（见“演化博弈论”词条）——考察利他、社会规范、道德行为与合作这类特征实际上是如何演化出来的。这一领域兼含规范性与描述性工作（Axelrod 1984; Bowles and Gintis 2011; Sigmund 2010）[^axelrod-1984][^bowles-2011][^sigmund-2010]。作为社会软件对这一领域的一项特殊贡献，加登福斯（2012）刻画了几种合作所需认知与通信之多寡，从简单的群集行为，经互惠利他（“你替我搔背，我也替你搔背”），直到完全成熟的团队协作。
    step2: |-
      与此相对，另一个引人入胜的研究领域是演化博弈论（见“演化博弈论”词条），它考察利他、社会规范、道德行为与合作这类特征究竟是如何演化出来的。该领域兼有规范性与描述性两项工作（Axelrod 1984; Bowles and Gintis 2011; Sigmund 2010）[^axelrod-1984][^bowles-2011][^sigmund-2010]。作为社会软件对该领域的一项独特贡献，加登福斯（2012）刻画了若干种合作各自所需的认知与通信多寡：从简单的群集行为，经互惠利他（“你替我搔背，我便替你搔背”），直至完全成熟的团队协作。
