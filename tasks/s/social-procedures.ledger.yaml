      Solomon’s handling of the situation can be turned into a social procedure that is repeatable, as follows. Solomon does not call for a sword, but instead explains to the two women the following procedure. First he is going to ask the first woman if she is willing to give up the child. If the answer is “yes”, the dispute is resolved, with no further questions asked. Otherwise he will ask the other woman if she is willing to give up the child. Again, if the answer is “yes” the dispute is resolved. If they both refuse, then the child is his, and then he will allow one of the women to buy it back, at a price that is to be determined as follows. They will both write an amount of money on a sheet of paper, without their names. If the two bids are $A$ and $B$, then the price of the child is set at $\frac{A + B}{2}$, and fate will determine which woman is going to get the child at that price, where the other woman has to pay a small fine. If the two women are rational, one of them will give up the child when being first asked (see Moore 1992 and Pauly 2005; for philosophical discussions of rationality, see the entries on practical reason & game theory and ethics)[^moore-1992][^pauly-2005].
    step1: |-
      所罗门对情势的处理，可以变成一个可重复的社会程序，如下。所罗门不叫取剑，而是向两位妇人说明如下程序。首先他问第一位妇人，是否愿意放弃孩子。若答“是”，争讼即解决，不再多问。否则他再问另一位妇人是否愿意放弃孩子。同样，若答“是”，争讼即解决。若两人都拒绝，那么孩子归他，然后他允许其中一位妇人赎回孩子，价格按如下方式确定。两人各在纸上写一个金额，不署名。若两个出价为 $A$ 与 $B$，则孩子的价格定为 $\frac{A + B}{2}$，由命运决定哪位妇人以此价格得到孩子，另一位须付一小笔罚金。若两位妇人是理性的，其中一人会在被首先问到时就放弃孩子（见 Moore 1992 与 Pauly 2005；关于理性的哲学讨论，见“实践理性与博弈论”及“伦理学”词条）[^moore-1992][^pauly-2005]。
    step2: |-
      所罗门处理此事的方式，可以改造为一个可重复使用的社会程序。办法是：所罗门不取剑，而是把下面的程序讲给两位妇人听。他先问第一位妇人是否愿意放弃孩子；答“愿意”即了结此案，不再追问。否则就问另一位是否愿意放弃；答“愿意”同样了结。若两人都拒绝，孩子便归他所有，然后准许其中一位赎回孩子，价格这样定：两人各在纸上写一个数目，不署姓名。设两个出价为 $A$ 与 $B$，孩子的价格即定作 $\frac{A + B}{2}$，由命运决定哪一位以此价得子，另一位须缴一小笔罚金。两位妇人若是理性的，其中一位在被问及时就会放弃（见 Moore 1992 与 Pauly 2005；理性的哲学讨论见“实践理性与博弈论”“伦理学”词条）[^moore-1992][^pauly-2005]。
  - id: 35
    kind: body
    source: |-
      Both Moore (1992) and Pauly (2005) discuss the importance of reasoning about common knowledge and ignorance in the King Solomon cases. For example, King Solomon is ignorant of who is the real mother, but both women commonly know from the start who is the true mother, and that the true mother will therefore bid much higher than the other one. This makes the procedure safe. Again, epistemic logic and in particular common knowledge help to shed light on a tricky social procedure. For a more traditionally philosophical introduction to the fair division problem, including more extensive explanations of fairness, manipulability and envy-freeness, see the entry on economics [normative] and economic justice.
    step1: |-
      摩尔（1992）与保利（2005）都讨论了在所罗门诸案中推理共同知识与不知情的重要性。例如，所罗门王不知谁是真正的母亲，但两位妇人都从一开始就共同知道谁是真正的母亲，也知道真正的母亲因此会出价远高于另一位。这使该程序变得安全。再次，认知逻辑、尤其是共同知识，有助于阐明一个棘手的社会程序。若想要对公平分配问题更传统的哲学导引，包括对公平、可操纵性与无嫉妒性更详尽的解释，见“经济学［规范性］与经济正义”词条。
    step2: |-
      摩尔（1992）与保利（2005）都谈到，在所罗门这类案子里，就共同知识与不知情作推理何其重要。比如：所罗门王并不知道谁是生母，而两位妇人对谁是真母亲却自始共同知晓，也因此知道真母亲出价必远高于对方。程序正因如此才安全。可见认知逻辑、尤其是共同知识，能照亮这样一个棘手的社会程序。若想读更传统的哲学导引，包括对公平、可操纵性与无嫉妒性的更详尽解释，见“经济学［规范性］与经济正义”词条。
  - id: 36
    kind: body
    source: |-
      The next section shows that the perspective of social software can also shed light on social matching problems. These range from marriages to the assignment of resident doctors to hospitals, college admission procedures, and the assignment of students to housing.
