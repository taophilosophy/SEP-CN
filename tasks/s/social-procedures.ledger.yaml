      Suppose $r$ stands for the action of trimming a piece of cake and putting it back with the main part of the cake, according to the Banach-Knaster algorithm, and suppose $F(m,k)$ is the proposition that the main part of the cake is large enough for $k$ people. Then surely $F(m,n)$ holds at the beginning: the whole cake is large enough for the whole group to begin with. Moreover, Parikh (1983, 2002) uses his game logic to prove that $F(m,k)$ is invariant under the action $r$: If $F(m,k)$ is true before $r$, then it will still be true after $r$ has occurred. Clearly, if one can show that $F(m,k)$ continues to hold through the algorithm, for $k$ running through $n, \ldots, 1$, then this establishes that the division is fair.[^note-3]
    step1: |-
      设 $r$ 代表按巴拿赫—克纳斯特算法切下一块蛋糕并把它放回蛋糕主体的动作，设 $F(m,k)$ 是命题：蛋糕主体对 $k$ 个人足够大。那么起初 $F(m,n)$ 无疑成立：整个蛋糕对整组人一开始就足够大。此外，帕里克（1983, 2002）用他的博弈逻辑证明，$F(m,k)$ 在动作 $r$ 下不变：若 $F(m,k)$ 在 $r$ 之前为真，则 $r$ 发生后它仍为真。显然，若能表明 $F(m,k)$ 贯穿算法持续成立，其中 $k$ 遍历 $n, \ldots, 1$，那么这就确立了分配是公平的。[^note-3]
    step2: |-
      设 $r$ 表示按巴拿赫—克纳斯特算法切下一块蛋糕、再把它放回蛋糕主体的动作；设 $F(m,k)$ 是“蛋糕主体足够 $k$ 人分”这一命题。那么一开始 $F(m,n)$ 当然成立：整只蛋糕对整组人本已够大。再者，帕里克（1983, 2002）用其博弈逻辑证明：$F(m,k)$ 在动作 $r$ 下保持不变——若 $F(m,k)$ 在 $r$ 之前为真，则 $r$ 发生之后仍为真。显然，若能证明 $F(m,k)$ 在整个算法中一路成立，$k$ 依次取 $n, \ldots, 1$，分配之公平便由此确立。[^note-3]
