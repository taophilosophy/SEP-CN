    source: |-
      Social procedures that have algorithmic aspects can often be improved by redesign. This holds for voting and other peaceful decision making procedures, for match-making, for auctioning, for fair division of estates, and for many procedures of distributive justice. The algorithmic aspects can be analyzed with formal methods. The term “social software” was coined by Rohit Parikh (2002) for the emerging interdisciplinary enterprise that is concerned with the design and analysis of algorithms that regulate social processes. Such analysis and (re-)design uses methods from logic, game theory and theoretical computer science.[^note-1] The goals of research in formal approaches to social procedures are modeling social situations, developing theories of correctness, and (re-)designing social procedures, ideally leading to new social behavior.
    step1: |-
      具有算法面向的社会程序，往往可以通过重新设计而得到改进。这对投票及其他和平的决策程序、对婚配、对拍卖、对遗产的公平分配，以及对分配正义的许多程序都成立。算法面向可以用形式化方法来分析。“社会软件”一词由罗希特·帕里克（2002）创制，用来指那门正在兴起的跨学科事业：它关注规制社会过程的算法的设计与分析。这样的分析与（重新）设计使用逻辑、博弈论与理论计算机科学的方法。[^note-1] 社会程序的形式化进路，其研究目标是：为社会情境建模、发展正确性理论，以及（重新）设计社会程序，理想情况下引出新的社会行为。
    step2: |-
      具有算法面向的社会程序，往往能通过重新设计而得到改进。投票及其他和平的决策程序如此，婚配、拍卖、遗产的公平分配，以及分配正义的许多程序亦然。这些算法面向可用形式化方法加以分析。“社会软件”一词由罗希特·帕里克（2002）创制，用以指称那门新兴的跨学科事业：它致力于设计并分析规制社会过程的算法。这类分析与（重新）设计，所凭借的是逻辑、博弈论与理论计算机科学的方法。[^note-1] 社会程序形式化进路的研究目标有三：为社会情境建模、发展正确性理论、重新设计社会程序，理想情况下还引出新的社会行为。
  - id: 2
    kind: body
    source: |-
      Logic, game theory and computer science are not the only disciplines that have something to say about social mechanisms. Such mechanisms are also an object of study in voting theory, in auction theory, in social choice theory, in social epistemology, in mechanism design theory, and in algorithmic game theory. Multi-agent interaction at a more abstract level is studied in artificial intelligence and distributed computing, so all these disciplines have something to say about the formal analysis of social interaction.
    step1: |-
      逻辑、博弈论与计算机科学并不是对社会机制有所言说的唯一学科。这类机制也是投票理论、拍卖理论、社会选择理论、社会认识论、机制设计理论与算法博弈论的研究对象。更抽象层面的多智能体互动，则在人工智能与分布式计算中得到研究，因此所有这些学科都对社会互动的形式分析有所言说。
    step2: |-
      对社会机制有所言说的，并不只有逻辑、博弈论与计算机科学。投票理论、拍卖理论、社会选择理论、社会认识论、机制设计理论、算法博弈论，也都把这类机制当作研究对象；更抽象层面的多智能体互动，则由人工智能与分布式计算来研究。因此，上述学科都对社会互动的形式分析各有一得。
