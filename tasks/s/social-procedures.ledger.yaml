    source: |-
      Both Moore (1992) and Pauly (2005) discuss the importance of reasoning about common knowledge and ignorance in the King Solomon cases. For example, King Solomon is ignorant of who is the real mother, but both women commonly know from the start who is the true mother, and that the true mother will therefore bid much higher than the other one. This makes the procedure safe. Again, epistemic logic and in particular common knowledge help to shed light on a tricky social procedure. For a more traditionally philosophical introduction to the fair division problem, including more extensive explanations of fairness, manipulability and envy-freeness, see the entry on economics [normative] and economic justice.
    step1: |-
      摩尔（1992）与保利（2005）都讨论了在所罗门诸案中推理共同知识与不知情的重要性。例如，所罗门王不知谁是真正的母亲，但两位妇人都从一开始就共同知道谁是真正的母亲，也知道真正的母亲因此会出价远高于另一位。这使该程序变得安全。再次，认知逻辑、尤其是共同知识，有助于阐明一个棘手的社会程序。若想要对公平分配问题更传统的哲学导引，包括对公平、可操纵性与无嫉妒性更详尽的解释，见“经济学［规范性］与经济正义”词条。
    step2: |-
      摩尔（1992）与保利（2005）都谈到，在所罗门这类案子里，就共同知识与不知情作推理何其重要。比如：所罗门王并不知道谁是生母，而两位妇人对谁是真母亲却自始共同知晓，也因此知道真母亲出价必远高于对方。程序正因如此才安全。可见认知逻辑、尤其是共同知识，能照亮这样一个棘手的社会程序。若想读更传统的哲学导引，包括对公平、可操纵性与无嫉妒性的更详尽解释，见“经济学［规范性］与经济正义”词条。
