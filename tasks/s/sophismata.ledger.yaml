      > *Omne animal preter hominem est irrationale.* (Every animal but man is irrational.)
    step1: |-
      > *Omne animal preter hominem est irrationale.*（除人以外的一切动物都是非理性的。）
    step2: |-
      > *Omne animal preter hominem est irrationale.*（除人以外，一切动物都是非理性的。）
