      In general, a *sophisma* provided a good opportunity to discuss problems related to a specific theoretical issue. For example, the *sophisma* ‘*Album fuit disputaturum*’ (‘The white [thing] was about to dispute’) in thirteenth-century Parisian literature elicited discussions of problems connected with the theory of reference in tensed contexts, and also provided an opportunity to refute the positions others held on this very controversial subject. This is why Pinborg 1977 (p. xv) says, with reference to the body of literature devoted to discussions of *sophismata*, that at Paris in the thirteenth century, “the *sophismata* seem — within the faculty of arts — to play a role analogous to the *Quaestiones quodlibetales* [quodlibetal questions] in the faculty of theology.” The *Catalogue of 13th Century Sophismata* (Ebbesen and Goubier 2010)[^ebbesen-2010] provides an extensive list of logical problems and distinctions that were brought up under the guise of a *sophisma*. Again, many grammatical problems were also dealt with in this way.
    step1: |-
      一般说来，一个 *sophisma* 提供了讨论与特定理论议题相关问题的好机会。例如，十三世纪巴黎文献中的 *sophisma*“*Album fuit disputaturum*”（“那个白的东西将要争论”）引发了关于时态语境中指称理论相关问题的讨论，也提供了驳斥他人在这一极具争议的主题上所持立场的机会。这就是为什么 Pinborg 1977（p. xv）在谈及专门讨论 *sophismata* 的文献整体时说，在十三世纪的巴黎，“*sophismata* 似乎在文学院内扮演着类似于神学院中《随意问题集》（*Quaestiones quodlibetales*，即 quodlibetal questions）的角色”。《十三世纪诡辩句目录》（*Catalogue of 13th Century Sophismata*，Ebbesen and Goubier 2010）[^ebbesen-2010] 提供了在 *sophisma* 名义下提出的逻辑问题与区分的详尽清单。同样，许多语法问题也以这种方式处理。
    step2: |-
      一般说来，诡辩句是讨论特定理论议题的好由头。例如十三世纪巴黎文献中的诡辩句“*Album fuit disputaturum*”（“那个白的东西将要争论”），既引发了对时态语境中指称理论诸问题的讨论，也提供了驳斥他人在这一争议话题上所持立场的机会。正因如此，Pinborg 1977（p. xv）在论及专论诡辩句的那一大批文献时说，十三世纪巴黎“在文学院内，*sophismata* 所扮演的角色，似乎相当于神学院中的 *Quaestiones quodlibetales*〔随意问答〕”。《十三世纪诡辩句目录》（*Catalogue of 13th Century Sophismata*，Ebbesen and Goubier 2010）[^ebbesen-2010] 详尽列出了借诡辩句之名提出的逻辑问题与区分。语法问题同样有许多是以这种方式处理的。
