      In the Introduction of the *Catalogue* (Ebbesen and Goubier 2010, vol. I)[^ebbesen-2010], we find an elaborate description of the medieval genre of *sophismata.* This genre was based on disputational practices in medieval universities. In its most basic form, it included the discussion of a problematic proposition, beginning with the presentation of the proposition, followed by a proof, a disproof, and a solution, sometimes accompanied by a response to the opposing arguments (see our section 2.2). The joint discsussion of these steps was known as *corpus sophismatis*. A respondent’s solution to the *sophisma* could be followed by an attack, leading to yet another exchange of arguments. In other instances the discussion of the *sophisma* could continue with a discussion of related problems, the first of which was often dealt with in an elaborate way. These kinds of *sophismata* are quite long.
    step1: |-
      在《目录》（*Catalogue*，Ebbesen and Goubier 2010, vol. I）[^ebbesen-2010] 的导言中，我们可看到对中世纪 *sophismata* 文类的详尽描述。这一文类建立在中世纪大学的辩论实践之上。在最基本的形态中，它包括对一个疑难命题的讨论，从呈现该命题开始，继之以一个证明、一个反证和一个解决，有时还附有对相反论证的回应（见我们的第 2.2 节）。这些步骤的合并讨论被称为 *corpus sophismatis*（诡辩句主体）。答辩者对 *sophisma* 的解答之后可能有攻击，导致又一轮论证交锋。在其他情况下，对 *sophisma* 的讨论可以继续讨论相关问题，其中第一个问题往往以详尽的方式处理。这类 *sophismata* 相当长。
    step2: |-
      《目录》（*Catalogue*，Ebbesen and Goubier 2010, vol. I）[^ebbesen-2010] 的导言对诡辩句这一中世纪文类作了缜密描述。该文类植根于中世纪大学的辩论实践。其最朴素的形态，是从呈现一个疑难命题起手的讨论，随后依次为证明、反证、解答，有时还附对相反论证的回应（参见本文第 2.2 节）。数步合观，即所谓 *corpus sophismatis*（诡辩句正文）。答辩者的解答之后往往有质难相继，再掀一轮论证交锋；有时对诡辩句的讨论还会延展到相关问题，且首个问题每每详加剖判。这类诡辩句篇幅颇长。
  - id: 60
    kind: body
    source: |-
      *Sophismata* are found in a variety of texts, which scholars have categorized into different kinds. *Abstractiones* treatises are collections of *sophismata* arranged by a type of syncategorematic word (e.g., exceptive words, exclusive words, conditional words, disjunctive words, and so on), or sometimes by the distinction that is used to solve them. The material covered in each *sophisma* is mostly confined to a *corpus*. *Syncategoremata* are treatises devoted to syncategorematic words; in these treatises *sophismata* are used to illustrate or to give more refined explanations of the logical behaviour of the different syncategorematic words (or kinds of syncategorematic words). In *Distinctiones* treatises, the starting points are distinctions or logical rules connected with sentences that contain a syncategorematic word. The material in these treatises is usually organized around the type of syncategorematic word at issue. Besides these different kinds of treatises (the boundaries of which, however, are not very clear), we also find collections of *sophismata* that seem to be (fictional or faithful) reports of oral disputations. These collections can contain grammatical *sophismata*, but the latter are also found in separate, rather loosely-organized, treatises. *Sophismata* also play an important role in general manuals of logic, and in other works — often written by the same authors, or by different authors working in the same milieu as the former collections — with titles such as *On Exponibles*, *On Consequences*, *Sophistry*, etc.
    step1: |-
      *Sophismata* 见于各种文本，学者已将其分为不同类型。*Abstractiones*（抽象集）论著是按某一类助范畴词（例如除外词、排除词、条件词、析取词等）编排的 *sophismata* 合集，有时也按用于解决它们的区分来编排。每个 *sophisma* 所涉及的材料大多限于一个 *corpus*。*Syncategoremata*（助范畴词论）是专门讨论助范畴词的论著；在这些论著中，*sophismata* 用于例示或更精细地解释不同助范畴词（或各类助范畴词）的逻辑行为。在 *Distinctiones*（区分集）论著中，出发点是与会含助范畴词的句子相关的区分或逻辑规则。这些论著中的材料通常围绕所讨论的助范畴词类型组织。除这些不同类型的论著（然而其界限并不十分清楚）外，我们还见到似乎是口头辩论的（虚构或忠实的）记录性质的 *sophismata* 合集。这些合集可含语法 *sophismata*，但后者也见于各自独立、组织较为松散的论著。*Sophismata* 在一般逻辑手册以及别的一些著作中也扮演重要角色——这些著作往往出自同一批作者，或出自与前一类合集同一环境中的不同作者——其标题如《论可展开句》（*On Exponibles*）、《论后承》（*On Consequences*）、《诡辩论》（*Sophistry*）等。
    step2: |-
      诡辩句散见于各类文本，学者已将其分门别类。*Abstractiones*（抽象集）是按某类助范畴词（除外词、排除词、条件词、析取词云云）编排的诡辩句汇编，有时也按解答所用的区分编排，每一诡辩句所涉材料大多限于一个 *corpus* 之内。*Syncategoremata*（助范畴词论）专论助范畴词，其中诡辩句用以例示、或更细密地阐明各类助范畴词的逻辑行为。*Distinctiones*（区分集）则以含助范畴词的句子所牵涉的区分或逻辑规则为出发点，材料通常围绕所论助范畴词的类型组织。除上述诸类论著（其界域却颇模糊）外，另有一种诡辩句汇编，看似口头辩论的记录，或出虚构，或近实录。此类汇编可收语法诡辩句，而语法诡辩句亦另见于体例松散的单行论著。诡辩句在通行的逻辑手册及若干别种著作中同样吃重——后者往往出自同一批作者，或出自与前一类汇编同气相求的作者之手，其名如 *On Exponibles*（论可展开句）、*On Consequences*（论后承）、*Sophistry*（诡辩论）等。
  - id: 61
    kind: body
    source: |-
      Even if there are technical distinctions among these types of treatises, all of them play the same roles mentioned above: they provide students with logical skills that can be applied to any subject whatsoever.
    step1: |-
      即使在这些论著类型之间存在技术性的区分，它们全都扮演上文提到的相同角色：它们为学生提供可应用于任何学科的逻辑技能。
    step2: |-
      纵有体用上的技术分别，这些论著发挥的作用却一仍上文所述：为学生养成一套可施于任何学科的逻辑功夫。
