      我们的第一个例子来自西班牙的彼得的《助范畴词》（*Syncategoreumata*）第 4 章。这个 *sophisma* 是：
    step2: |-
      第一个例子取自西班牙的彼得的《助范畴词》（*Syncategoreumata*）第 4 章，其诡辩句为：
