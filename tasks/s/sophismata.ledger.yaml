      Ebbesen has identified one *sophisma* that deserves the label ‘theological’ (in the sense, that is, of an “exception to the general rule that the *sophism* is not a theological genre” (Ebbesen 1997, pp. 151–152)[^ebbesen-1997][^ebbesen-1997-2]. The *sophisma* in question runs ‘*Deus est eodem modo in dyabolo sicud fuit in beata virgine*’(‘God is in the same way in the devil as he was in the Blessed Virgin’). The reason why this could count as a theological *sophisma* is that the question that is raised in it, about how God is present in creatures, is theological in nature. Another theological *sophisma* investigated by Ebbesen is the sentence, ‘*Deus scit quicquid scivit*’ (‘God knows whatever he has known’), which was widely discussed in the standard *sophismata* literature. The sentence elicits questions pertaining not only to the logical behaviour of the verb ‘*scire*’ (‘to know’), but also to the specifically theological issue of the object of God’s knowledge (Ebbesen 1997, p. 154ff.)[^ebbesen-1997][^ebbesen-1997-2].
    step1: |-
      Ebbesen 认定一个配得上“神学”标签的 *sophisma*（就其是“总规则‘*sophism* 不是一种神学文类’的例外”而言）（Ebbesen 1997, pp. 151–152）[^ebbesen-1997][^ebbesen-1997-2]。所讨论的 *sophisma* 作“*Deus est eodem modo in dyabolo sicud fuit in beata virgine*”（“上帝以与他在童贞女马利亚中相同的方式在魔鬼中”）。它之所以可算作神学 *sophisma*，是因为其中提出的问题——上帝如何临在于受造物中——性质上属于神学。Ebbesen 考察的另一个神学 *sophisma* 是句子“*Deus scit quicquid scivit*”（“上帝知道他所知道的一切”），它在标准 *sophismata* 文献中被广泛讨论。这个句子引出的问题，不仅涉及动词“*scire*”（知道）的逻辑行为，还涉及上帝知识的对象这一特有的神学议题（Ebbesen 1997, p. 154ff.）[^ebbesen-1997][^ebbesen-1997-2]。
    step2: |-
      Ebbesen 指认出一个堪称“神学”的诡辩句，视之为“诡辩句非神学文类”这一通则的例外（Ebbesen 1997, pp. 151–152）[^ebbesen-1997][^ebbesen-1997-2]。其文为“*Deus est eodem modo in dyabolo sicud fuit in beata virgine*”（“上帝在魔鬼中，与祂昔日在童贞马利亚中一般无二”）。它所以可算神学诡辩句，是因为其中所提的问题——上帝如何临在于受造物——本属神学性质。Ebbesen 考察的另一例是“*Deus scit quicquid scivit*”（“上帝知祂所知的一切”），在标准诡辩句集中广为讨论。此句牵出的问题，既有动词“*scire*”（知道）的逻辑行为，也有上帝知识的对象这一神学专有的议题（Ebbesen 1997, p. 154ff.）[^ebbesen-1997][^ebbesen-1997-2]。
