    source: |-
      An example of such a distinction is the following. The *sophisma* ‘Only God being God is necessary’ (‘*Tantum deum esse deum est necessarium*’) contains the syncategorematic word ‘only’ (‘*tantum*’). The *sophisma* is solved by making a distinction between two different functions of the word ‘only’, in that the exclusion it makes can pertain to the expression ‘God’, or to the entire phrase ‘God being God’. In the former case the sentence is true, but in the latter it is false (Ebbesen and Goubier 2010, vol. I, p. 122)[^ebbesen-2010]. Another example of a problematic sentence containing the disjunctive expression ‘or’ is the *sophisma* ‘Every proposition or its contradictory opposite is true’. Some authors considered this proposition as true, but others thought it was ambiguous. In one way, the distribution of ‘every’ could be taken as ranging over the disjunction, in which case the proposition reads ‘Any proposition or its contradictory is true’, which is true. In another way, the disjunction could be taken to cover the distribution, in which case the proposition reads ‘Every proposition is true or every contradictory opposite is true’, which is false. A final example of a distinction concerns the *sophisma* ‘The white can be black’ (an awkward translation of the sentence ‘*Album potest esse nigrum*’), which can be taken to mean either ‘The thing that is white can be black’, which is true, or ‘It can be the case that the white thing is black’ (at the same time, that is), which is false. The truth or falsity of the proposition then depends on a scope distinction regarding the expression ‘can be’.
    step1: |-
      这种区分的一个例子如下。“只有上帝是上帝是必然的”（“*Tantum deum esse deum est necessarium*”）这一 *sophisma* 含有助范畴词“only”（“*tantum*”，只有）。解决这个 *sophisma* 的办法，是区分“only”一词的两种不同功能：它所作的排除可以针对“上帝”这一表达式，也可以针对“上帝是上帝”整个短语。在前一种情况下句子为真，在后一种情况下则为假（Ebbesen and Goubier 2010, vol. I, p. 122）[^ebbesen-2010]。另一个含有析取表达式“or”（或者）的疑难句例子，是 *sophisma*“每个命题或其矛盾对立面都是真的”。有些作者认为这个命题为真，另一些人则认为它有歧义。一种方式是，“every”的分配范围可被理解为覆盖整个析取，此时该命题读作“任何命题或其矛盾面都是真的”，这是真的。另一种方式是，析取可被理解为覆盖分配，此时该命题读作“每个命题都是真的，或者每个矛盾对立面都是真的”，这是假的。最后一个区分例子涉及 *sophisma*“白的东西可以是黑的”（句子“*Album potest esse nigrum*”的一种笨拙译法），它可以被理解为“那个白的东西可以是黑的”（为真），也可以被理解为“白的东西是黑的，这是可能的”（也就是说，同时为黑，为假）。因此，该命题的真假取决于“can be”（可以是）这一表达式的辖域区分。
    step2: |-
      此类区分的一例如下。“只有上帝是上帝是必然的”（“*Tantum deum esse deum est necessarium*”）这一诡辩句含有助范畴词“only”（“*tantum*”，只有）。解答之道，是区分“only”的两种功能：它所作的排除，或针对“上帝”这一表达式，或针对“上帝是上帝”整个短语。前者句真，后者句假（Ebbesen and Goubier 2010, vol. I, p. 122）[^ebbesen-2010]。另一个含析取表达式“or”（或者）的疑难句例子，是诡辩句“每个命题或其矛盾对立面都是真的”。有的作者以之为真，有的则以为有歧义。一种读法是，“every”的分配范围覆盖整个析取，此时命题读作“任一命题或其矛盾面都是真的”，为真。另一种读法是析取覆盖分配，此时命题读作“每个命题都是真的，或者每个矛盾对立面都是真的”，为假。最后一个区分例子涉及诡辩句“白的东西可以是黑的”（对“*Album potest esse nigrum*”一语的生硬译法）：它可解作“那个白的东西可以是黑的”，为真；也可解作“白的东西是黑的，这是可能的”（也就是说，同时为黑），为假。命题的真假，遂取决于“can be”（可以是）这一表达式的辖域区分。
