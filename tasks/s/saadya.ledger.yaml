    step1: |-
      此外，除了这种向先知启示的“受造之言”听觉现象之外，萨阿迪亚的预言学说还涉及“受造荣耀”——预言的一种视觉要素，萨阿迪亚尤其把它描述为先知的验证机制。正是在看见受造荣耀之时，先知才知道他的预言遭遇为真（不过如上所述，萨阿迪亚暗示摩西的预言缺乏这一视觉面向，仅由与受造之言的相遇构成）。
