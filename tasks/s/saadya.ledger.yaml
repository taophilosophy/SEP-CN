    source: |-
      It is this commitment to upholding the importance of reason — and its fruits, knowledge and certainty — that lies at the core of Saadya's  main philosophical text, the *Kitâb al-Amânât wal-'I‘tiqâdât*, or *The Book of Doctrines and Beliefs* (known in Samuel Ibn Tibbon's Hebrew translation as *Sefer ha-'Emûnôt ve-ha-Deôt*). In what follows, we will refer to this text as the *Amânât*. In this magnum opus, Saadya aims to move people beyond the various epistemological and existential paralyses through which they are consigned to living always and only in the shadows of error and doubt. Concerned to help cure this distinctive human ill, Saadya hopes to provide people instead with truth and certainty — the grounds for right living. And so, following upon an opening passage of epistemological praise to “the Lord, the God of Israel, to whom the truth is known with absolute certainty,” Saadya begins the *Amânât*, with a statement of his work's epistemological purpose:
    step1: |-
      正是这种对维护理性之重要性的执着——连同其果实，即知识与确定性——构成了萨阿迪亚主要哲学文本《教义与信仰之书》（*Kitâb al-Amânât wal-'I‘tiqâdât*，即 *The Book of Doctrines and Beliefs*；在塞缪尔·伊本·提本的希伯来语译本中名为 *Sefer ha-'Emûnôt ve-ha-Deôt*）的核心。下文我们将简称此书为《阿玛纳特》（*Amânât*）。在这部巨著中，萨阿迪亚意在把人们从各种知识论与生存上的瘫痪状态中带出来——正是这些状态使他们被判定永远只能在错误与怀疑的阴影中生活。萨阿迪亚关切于医治这一人类特有的病症，希望代之以真理与确定性——即正当生活的根据。于是，在一段向“主、以色列的上帝——真理以绝对的确定性为祂所知”献上知识论赞美的开场文字之后，萨阿迪亚以陈述其著作的知识论目的开始《阿玛纳特》：
    step2: |-
      萨阿迪亚主要哲学文本的核心，正是这份对理性之重要性的持守——连同它的果实：知识与确定性。此书即《教义与信仰之书》（*Kitâb al-Amânât wal-'I‘tiqâdât*，或称 *The Book of Doctrines and Beliefs*；塞缪尔·伊本·提本的希伯来语译本作 *Sefer ha-'Emûnôt ve-ha-Deôt*），下文简称《阿玛纳特》（*Amânât*）。在这部巨著里，萨阿迪亚想把人从种种知识论与生存上的瘫痪中带出来：正因这些瘫痪，人被注定永远只在错误与怀疑的阴影下度日。他要医治这种人类特有的痼疾，转而给人以真理与确定性——也就是正当生活的根据。因此，在一段向“主、以色列的上帝——真理以绝对的确定性为祂所知”致敬的知识论开场颂词之后，萨阿迪亚开宗明义，陈述全书的知识论目的：
  - id: 8
    kind: body
    source: |-
      > …I will begin this book, which it is my intention to write, with an exposition of the reason why men, in their search for Truth, become involved in errors, and how these errors can be removed so that the objects of their investigations may be fully attained; moreover, why some of these errors have such a powerful hold on some people that they affirm them as the truth, deluding themselves that they know something… (Altmann, 27)[^note-1]
    step1: |-
      > ……我将开始撰写这部我有意写成的书，先说明人们为何在寻求真理时陷入种种错误，以及这些错误如何能够被清除，以便他们的探究对象得以充分达成；再者，为何其中一些错误对某些人有如此强大的支配力，以至于他们把这些错误当作真理来肯定，自欺说他们知道些什么……（Altmann, 27）[^note-1]
    step2: |-
      > ……我打算写的这部书，开篇先要说明：人们寻求真理时为何会陷入种种错误；这些错误如何才能清除，好让他们的探究得以圆满达成；此外，为何其中一些错误紧紧攫住某些人，以致他们将其奉为真理，自以为知道了什么……（Altmann, 27）[^note-1]
