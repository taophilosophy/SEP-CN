      Along these lines, it might be noted that in an influential study of the prophetic phenomenon in Saadya, Altmann sees Saadya's commitment to created glory as a commitment in particular to some sort of an hypostasized entity; in fact, it is precisely on the basis of this hypostasizing view that Altmann argues for distinguishing Saadya's theory of prophecy from the Mu‘tâzilite view.[^note-2] All this said, though, the exact nature of the created glory in Saadya is somewhat ambiguous, and, as such, it seems *at least plausible* to deny that this element of Saadya's prophetic view is intended in a strictly reified sense. What is clear, in any case, is that it is through his descriptions and analyses of created word and created glory that Saadya strives to unambiguously ground the legitimacy and objectivity of prophecy, and hence, of tradition itself.
    step1: |-
      循着这一思路可以指出：在对萨阿迪亚预言现象的一项有影响的研究中，Altmann 把萨阿迪亚对受造荣耀的执着视为对某种实体化存在者的执着；事实上，Altmann 正是以这一实体化的观点为根据，主张把萨阿迪亚的预言理论与穆尔太齐赖派的观点区分开来。[^note-2]尽管如此，萨阿迪亚那里受造荣耀的确切本性仍有些含混；因此，断言萨阿迪亚预言观中的这一要素并不意在严格实在化的意义上，似乎*至少是可信的*。无论如何，清楚的是：萨阿迪亚正是通过对受造之言与受造荣耀的描述与分析，力求毫不含糊地奠定预言——从而也是传统本身——的合法性与客观性。
    step2: |-
      循此思路还可指出：在关于萨阿迪亚预言现象的一项有影响的研究里，Altmann 把萨阿迪亚对受造荣耀的持守，看作是对某种实体化存在者的持守；而他主张把萨阿迪亚的预言理论与穆尔太齐赖派区分开来，依据的正是这一实体化观点。[^note-2]话虽如此，受造荣耀在萨阿迪亚那里的确切本性仍有些含混；就此而言，要否认萨阿迪亚预言观的这一要素意在严格实在化的意义上，*至少是讲得通的*。无论如何，有一点是清楚的：萨阿迪亚正是借着对受造之言与受造荣耀的描述与分析，力求毫无含糊地奠定预言——从而也是传统本身——的合法性与客观性。
