      讨论传统时，萨阿迪亚用的词是 *kabar*；如前所见，它含有“传述”之意（也含“知道”）。不过就“传统即传闻”这一点，还值得再考虑另一个阿拉伯语词根 *sami‘a*（听）。这个词根本身只表示“听”，但它与“传闻”在概念上相通，道理很简单：接受一份传闻，多半要经过听见。于是在阿拉伯语里，“听”与萨阿迪亚的传统概念（*kabar*，即“传闻”）之间便有一条概念上的连线。事实上，“听”这个阿拉伯语词根有一个派生形式 *samâ‘î*，字面直义就是“传统的”或“得自传统的”。可见在萨阿迪亚的阿拉伯语语言与概念空间中，听与传统之间这条连线，对于我们恰当地“找回”其“启示”概念的实质颇为要紧。拉丁语源的“revelation”（启示）字面意为“重新遮盖”（出自拉丁语 *vêô*“遮盖”，故“to reveal”字面即“to recover”）；萨阿迪亚著作中被译作“启示”的阿拉伯语词，根基却是阿拉伯语词根“听”。这里尤须注意他对一类圣经诫命的讨论——这类诫命常译作“启示律法”。把律法分为两类，拉比文献已有此说；萨阿迪亚则是第一个在犹太哲学文本中对此详加申说的人。他要我们注意：希伯来圣经中有两类律法，最常译作“理性律法”与“启示律法”。说到“理性律法”，他用的是 *‘aqliyyât*，出自 *‘aql*（字面义：智性能力）：这些律法就是“可由人类智性认识者”，或者说“至少在理论上可经人类理性达到者”。至于“启示律法”，他这里用的是 *sam‘iyyât*，出自词根 *sami‘a*“听”：这些律法字面上就是“被听见者”。要紧的是认清一点：在“理性律法”与“启示律法”这一区分中，被译作“启示”的那个词，其阿拉伯语词根把“被听见”明明白白写在袖口上；因此它同“传统”这一概念（作为〔被听见的〕传闻）的关联，比拉丁语源的“启示”直接得多。
