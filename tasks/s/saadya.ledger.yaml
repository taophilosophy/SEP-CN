      讨论传统时，萨阿迪亚用的词是 *kabar*——我们已经看到它含有“传述”之意（也含有“知道”之意）；不过就“传统即传闻”这一问题而言，还值得再考虑另一个阿拉伯语词根 *sami‘a*（听）。这个词根本身只表示“听”，但我们可以指出，它与“传闻”这一概念在概念上相关，道理很简单：接受一份传闻，多半涉及听见。因此在阿拉伯语里，“听”与萨阿迪亚的传统概念（*kabar*，即“传闻”）之间存在一条概念上的联系。事实上，“听”这个阿拉伯语词根有一个派生形式 *samâ‘î*，其字面直义就是“传统的”或“得自传统的”。于是在萨阿迪亚的阿拉伯语语言与概念空间中，听与传统这两个概念之间的这条联系，对于我们恰当地“恢复”萨阿迪亚“启示”概念的实质颇为要紧。拉丁语源的“revelation”（启示）字面意为“重新遮盖”（出自拉丁语 *vêô*，遮盖，故“to reveal”字面即“to recover”）；与此相反，在萨阿迪亚著作中被译作“启示”的阿拉伯语词，其根基是阿拉伯语词根“听”。请尤须注意萨阿迪亚对一类圣经诫命的重要讨论，这类诫命常被译作“启示律法”。萨阿迪亚承续了拉比文献中已经作出的一个区分，但他是第一个在犹太哲学文本中对这一区分作扩展讨论的人；他要我们注意：希伯来圣经中存在两类律法，最常被译作“理性律法”与“启示律法”。对于“理性律法”，萨阿迪亚使用的词是 *‘aqliyyât*，出自 *‘aql*（字面义：智性能力）；因此我们可以说，这些律法就是“那些（能够）由人类智性认识者”，或“那些（至少在理论上能够）经由人类理性达到者”。至于“启示律法”，萨阿迪亚在这里用的是 *sam‘iyyât*，出自词根 *sami‘a*，“听”；因此这些律法字面上就是“那些被听见者”。要点在于要意识到：在“理性律法”与“启示律法”的区分中，被译作“启示”的那个词的阿拉伯语词根，在语言上把“被听见”这一观念挂在袖口上，因而与“传统”（作为〔被听见的〕传闻）这一概念的关联，比拉丁语源的“启示”更为直接。
