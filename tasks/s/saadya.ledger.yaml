      The prophetic air in question is described by Saadya as “second” precisely in the sense that it is anterior to, as well as subtler and more powerful than, regular elemental air (which he calls “manifest air”). In other words, from the human vantage point, regular breathable air is “first”, and “prophetic air” is “second.” If we take this in some spatial sense, the idea would seem to be that this 2ⁿᵈ more subtle, refined variety of air lies *midway* between the regular human realm and the divine realm. This reading would suggest that created glory is not only a source for prophecy, but is, at least *prima facie*, a cosmic intermediary, playing an intermediating role in the prophetic encounter. Futhermore, thus seeing the 2ⁿᵈ air as a ‘cosmic intermediary’ might seem to suggest that it is an hypostasized reality, a point which seems further supported by Saadya's own description of this 2ⁿᵈ air as a ‘*shay makhlûq*’ (‘a created *thing*’).
    step1: |-
      萨阿迪亚把这种预言性的气描述为“第二”，其确切含义是：它先于日常的元素之气，也比它更精微、更有力量（他把后者称为“显现之气”）。换句话说，从人类的位置看，日常可呼吸的气是“第一”，而“预言之气”是“第二”。如果我们从某种空间意义来理解，这个观念似乎是说：这种更精微、更纯粹的气位于日常人类领域与神圣领域*之间*。这一读法暗示，受造荣耀不仅是预言的一个来源，而且至少*表面上*是一个宇宙中介，在预言遭遇中起中介作用。再者，把第二气看作一种“宇宙中介”，似乎暗示它是一个实体化的实在；萨阿迪亚本人把这种第二气描述为“*shay makhlûq*”（“一个受造的*事物*”），这一点似乎进一步支持了上述看法。
    step2: |-
      萨阿迪亚之所以把这种预言之气称作“第二”，是因为它先于日常的元素之气，也更精微、更有力量（他称后者为“显现之气”）。换句话说，站在人的位置看，日常可呼吸的气是“第一”，“预言之气”则是“第二”。若从某种空间意义上去理解，这意思似乎是：这种更精微、更纯净的气，正处于日常人类领域与神圣领域*之间*。照这一读法，受造荣耀就不只是预言的来源，它至少*乍看之下*还是个宇宙中介，在预言遭遇中扮演中介的角色。再者，如此把第二气看作“宇宙中介”，似乎暗示它是个实体化的实在；萨阿迪亚自己把这种第二气称作“*shay makhlûq*”（“一个受造的*事物*”），似乎进一步支持了这一点。
