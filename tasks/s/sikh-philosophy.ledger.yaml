      与游方的乌达西派不同，尼尔马拉派不仅围绕锡克核心圣典的哲学注疏生产了大量文献，还在北印度各地建立了高等学府（*akhāṛās*）。尼尔马拉学者大多精通印度哲学，尤其是不二吠檀多；后者不仅被用作其宗教—哲学论辩（*goṣtī*）与口头注疏（*viākhiā*）的理论框架，也被用作使锡克概念与古典印度哲学相衔接的手段。重要的尼尔马拉学者包括潘迪特·古拉布·辛格，其主要著作有《解脱之道》（*Mōkh Panth*，1778），是对 *gurmat* 概念与瑜伽、正理、弥曼差及吠檀多所作的比较研究；另一部是《不死性之本性》（*Bhāvarasamrit*，1778），论离执与实在之本性。19 世纪初最著名的尼尔马拉学者，大概要数诗人桑托克·辛格（Kavi Santokh Singh），以《古鲁荣耀之日》（*Gurpartap Suraj*）与《那纳克古鲁之光》（*Guru Nanak Prakash*，1823）等著作知名。他还撰有颇具影响的注疏《降伏我慢注》（*Garbganjani Tīkā*），以回应阿南德甘早先之作。到 19 世纪末，尼尔马拉学者经常写出明确具有哲学性质的著作，但教义色彩更浓。佳例是潘迪特·塔拉·辛格·纳罗塔姆的《古鲁教法决断海》（*Sri Gurmat Nirnai Sāgar*，1877——“论古鲁教法之本性”）。此书作于英国统治下印度教徒、穆斯林与锡克人之间政治张力加剧之时，书名本身即表明其努力：在锡克各阐释学派之间的哲学与宗教争论中重新定位 *gurmat* 一词，更在于帮助划定并巩固锡克人与印度教徒之间的社会—政治边界。纳罗塔姆的著作，是从传统印度不二论立场出发扩展锡克古鲁基本概念（*gurmat*）的一次重大尝试。
