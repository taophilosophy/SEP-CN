      Arguably the first sustained and systematic work of modern Sikh philosophy is Sher Singh’s *Philosophy of Sikhism* (Sher Singh 1944)[^singh-1944]. Sher Singh’s book is also the first to bring Sikh ideas into a comparative framework (Sher Singh 1944)[^singh-1944]. Writing in the mid- to late 1930’s the author is acutely aware of breaking new ground as can be noted in his somewhat nervous attempt to justify the use of “philosophy” in the title of his book: “What justifies the title of my work is the angle, the viewpoint, from which I have approached Sikhism” (Sher Singh: i). This new perspective, he argues, is one based on “rational conviction” and “impassionate criticism” which alone can succeed “in exercising a rational check on biased opinions issuing from …. [t]he fact of my being a Sikh by birth” (Sher Singh: i). Equally noteworthy in this preface is Sher Singh’s apology for “indulging in comparisons between concepts held by the Guru and those held by some Western thinkers” (Sher Singh: i). “I realize” he goes on “that this was not very necessary and could be safely avoided. I have done so in the hope that *such a comparison may render an Eastern concept more intelligible* to the Western or non-Sikh reader” (Sher Singh: i, *emphasis mine*).
    step1: |-
      现代锡克哲学第一部有持续性、成系统的著作，可以说是谢尔·辛格的《锡克教哲学》（Sher Singh 1944）[^singh-1944]。该书也首次把锡克观念置入比较框架（Sher Singh 1944）[^singh-1944]。作者写作于 1930 年代中后期，清楚地意识到自己在开垦新地；这一点可以从他略带不安地为书名中“哲学”一词辩护的尝试中看出：“为我这部书之题名辩护的，是我进入锡克教的角度、视点”（Sher Singh: i）。他论证说，这一新视角基于“理性信念”与“不动情的批评”；唯有它们才能“对出于……〔t〕我生而为锡克人这一事实的偏颇意见，施加理性的检核”（Sher Singh: i）。序言中同样值得注意的是谢尔·辛格对“把古鲁们所持概念与某些西方思想家所持概念相比较”的辩解（Sher Singh: i）。“我意识到，”他接着说，“这并非十分必要，本可稳妥地避免。我这样做，是希望*这种比较或可使东方概念对西方或非锡克读者更为易解*”（Sher Singh: i，*着重为我所加*）。
