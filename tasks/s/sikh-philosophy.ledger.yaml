      Two important questions arise here. First, if the true nature of reality is oneness, and if the nature of this oneness is infinitely expansive, unchanging, measureless, etc., why are we not aware of this oneness during the course of daily life? What prevents us from realising this in the world that we live in, or in the social contexts we inhabit? (Mandair 2022: 80)[^mandair-2022]
    step1: |-
      这里产生两个重要问题。第一，如果实在的本性是太一，且这种太一的本性无限展开、不变、不可测度等等，那为什么在日常生活中我们觉察不到这种太一？在我们生活于其中的世界、所栖居的社会语境中，是什么阻碍了我们实现这一点？（Mandair 2022: 80）[^mandair-2022]
    step2: |-
      由此产生两个重要问题。其一：若实在的本性是太一，而此太一无限展开、不变、不可测度等等，为何日常生活中我们觉察不到它？在我们所生活的世界、所栖身的社会语境中，是什么阻碍我们实现这一点？（Mandair 2022: 80）[^mandair-2022]
