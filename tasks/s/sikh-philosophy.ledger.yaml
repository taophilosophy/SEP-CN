      Almost all commentaries on *gurmat* and modern works on Sikh thought tend to agree that the cornerstone of Sikh philosophy is a conceptual practice of oneness indicated by the symbol ੴ (*ik oankār*) which stands at the beginning of Sikh scripture, is repeatedly invoked in the canonical texts, and is treated as a mnemo-praxical sermon by all Sikhs.[^note-7] The broad sense of ੴ (*ik oankār*) emerging from these commentaries can be summarized as: One (*ik*), whose fundamental resonant vibration (*oan-kār*) expresses itself in the same way in being and beings, sustaining the ongoing creative process; this resonant oneness thereby expresses the true nature of reality (*satnām*). Based on this definition it is possible to trace a metaphysics whose broad contours can be summarized in the statement that oneness is *absolute -* about which there is broad agreement amongst Sikh philosophers, although what they mean by absolute is described in different ways. For example, Nirbhai Singh uses the term ‘absolute’ to emphasize the “metaphysical necessity for Guru Nanak to develop a dynamic system which could restore the reality of action in historical time” (Nirbhai Singh: p. 65). Himat Singh deploys the term “Trans-Aesthetic” to shift discussion of the absolute nature of oneness towards the vibrational ontology of *śabad* (Himat Singh 1985: 21)[^singh-1985]. Likewise Nikky Singh speaks of Guru Nanak’s transcendental aesthetic to depict a oneness that is simultaneously sensuous and non-sensuous, corporeal and incorporeal (Nikky Singh 2025).
    step1: |-
      几乎所有对 *gurmat* 的注疏与现代锡克思想著作都倾向于同意：锡克哲学的基石是一种以符号 ੴ（*ik oankār*）标示的太一概念实践；该符号立于锡克圣典开篇，在正典文本中屡被召唤，并被所有锡克人视为一种记忆—实践式的布道。[^note-7] 从这些注疏中浮现的 ੴ（*ik oankār*）之广义，可概括为：太一（*ik*），其根本的共振振动（*oan-kār*）以同一方式在存在与存在者中显发，维系着进行中的创造过程；这一共振的太一由此显发实在的本真之名（*satnām*）。基于此定义，可以勾勒一种形而上学，其大致轮廓可概括为：太一是*绝对的*——对此锡克哲学家有广泛共识，尽管他们对“绝对”的表述各有不同。例如，尼尔拜·辛格用“绝对”一词强调“形而上学的必然性：那纳克古鲁必须发展出一个动态体系，以在历史时间中恢复行动的实在性”（Nirbhai Singh: p. 65）。希马特·辛格则用“超美学”一词，把关于太一之绝对性的讨论转向 *śabad* 的振动存在论（Himat Singh 1985: 21）[^singh-1985]。同样，尼基·辛格谈“那纳克古鲁的超越美学”，以刻画一种同时是感性的与非感性的、有身的与无身的太一（Nikky Singh 2025）。
    step2: |-
      几乎一切 *gurmat* 注疏与现代锡克思想著作都倾向于同意：锡克哲学的基石，是一种以符号 ੴ（*ik oankār*）标示的太一概念实践。此符号立于锡克圣典开篇，在正典文本中屡被召唤，所有锡克人都把它当作一种记忆—实践式的布道。[^note-7] 从这些注疏中浮现的 ੴ（*ik oankār*）广义如下：太一（*ik*）的根本共振振动（*oan-kār*），以同一方式在存在与存在者中显发，维系着持续进行的创造过程；这一共振的太一，由此显发实在的本真之名（*satnām*）。据此可勾勒一种形而上学，其大致轮廓是：太一是*绝对的*——锡克哲学家于此有广泛共识，只是“绝对”所指，各家表述不一。例如尼尔拜·辛格用“绝对”强调“形而上学的必然性：那纳克古鲁必须发展出一个动态体系，以在历史时间中恢复行动的实在性”（Nirbhai Singh: p. 65）；希马特·辛格用“超美学”把太一之绝对性的讨论转向 *śabad* 的振动存在论（Himat Singh 1985: 21）[^singh-1985]；尼基·辛格则谈“那纳克古鲁的超越美学”，刻画一种同时感性而非感性、有身而无身的太一（Nikky Singh 2025）。
