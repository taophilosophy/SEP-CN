      It is only in the 1980s and 1990s that a new wave of publications with an overtly philosophical orientation begin to emerge. English language works exemplifying this new approach include Avtar Singh’s *Ethics of the Sikhs* (1983), Gurnām Kaur’s *Reason and Revelation* (1990), Nirbhai Singh’s *Philosophy of Sikhīsm* (1990), Himat Singh’s *Philosophical Conception of Śabad* (1985), Jasbir Singh Ahluwalia’s *Sovereignty of the Sikh Doctrine* (1983/2005), and Nikky Guninder Kaur Singh’s *Physics and Metaphysics of the Guru Granth Sahib* (1987). Notable Punjabi language works focusing on Sikh thought include Harinder Singh Mahboob’s *Sahaje Rachio Khālsā* (1988) and Jasbir Singh Ahluwalia’s *Sikh Falsafe dī Bhumikā* (Preface to a Sikh Philosophy) and his *Sikh Chintan: Darśanak ate Sansthāmik Vikās* (Sikh Thought: Philosophical Vision and Systematic Development).[^note-6] Also important here are the works of the Sikh postmodernist thinker and literary critic Gurbhagat Singh, notably his *Vishwa Chintan ate Punjabi Sahit* (World Thought and Punjabi Literature), *Sikhīsm and Postmodern Thought* and *Western Poetics and Eastern Thought*, the title of which playfully reverses the Indian philosopher Sarvapalli Radhakrishan’s classic text: *Eastern Religions and Western Thought*. Recent additions to this list include *Sikh Philosophy: Exploring Gurmat Concepts in a Decolonizing Age* (Mandair: 2022)[^mandair-2022], and *Guru Nanak’s Transcendent Aesthetics* (2024) by Nikky Guninder Kaur Singh.
    step1: |-
      直到 1980 与 1990 年代，一批具有鲜明哲学取向的新出版物才出现。体现这一新进路的英文著作包括：阿夫塔尔·辛格《锡克教伦理学》（1983）、古尔南·考尔《理性与启示》（1990）、尼尔拜·辛格《锡克教哲学》（1990）、希马特·辛格《Śabad 的哲学构想》（1985）、贾斯比尔·辛格·阿卢瓦利亚《锡克教义的主权》（1983/2005），以及尼基·古尼德尔·考尔·辛格《古鲁·格兰特·萨希卜的物理学与形而上学》（1987）。以旁遮普语写作、聚焦锡克思想的要著，有哈林德尔·辛格·马布布的《本然成就卡尔萨》（*Sahaje Rachio Khālsā*，1988），贾斯比尔·辛格·阿卢瓦利亚的《锡克哲学序论》（*Sikh Falsafe dī Bhumikā*）与《锡克思想：哲学愿景与系统发展》（*Sikh Chintan: Darśanak ate Sansthāmik Vikās*）。[^note-6] 同样重要的是锡克后现代思想家、文学批评家古尔巴加特·辛格的著作，尤其是《世界思想与旁遮普文学》（*Vishwa Chintan ate Punjabi Sahit*）、《锡克教与后现代思想》与《西方诗学与东方思想》——最后这部书名戏仿印度哲学家萨尔瓦帕利·拉德哈克里希南的名著《东方宗教与西方思想》。这一清单的近作有：《锡克哲学：去殖民时代的古鲁教法概念探析》（Mandair 2022）[^mandair-2022]，与尼基·古尼德尔·考尔·辛格的《那纳克古鲁的超越美学》（2024）。
    step2: |-
      直到 1980 与 1990 年代，一批哲学取向鲜明的新出版物才渐次出现。体现这一新进路的英文著作有下述几种：阿夫塔尔·辛格《锡克教伦理学》（1983）；古尔南·考尔《理性与启示》（1990）；尼尔拜·辛格《锡克教哲学》（1990）；希马特·辛格《*Śabad* 的哲学构想》（1985）；贾斯比尔·辛格·阿卢瓦利亚《锡克教义的主权》（1983/2005）；尼基·古尼德尔·考尔·辛格《古鲁·格兰特·萨希卜的物理学与形而上学》（1987）。以旁遮普语写作、聚焦锡克思想的要著有：哈林德尔·辛格·马布布《本然成就卡尔萨》（*Sahaje Rachio Khālsā*，1988）；贾斯比尔·辛格·阿卢瓦利亚《锡克哲学序论》（*Sikh Falsafe dī Bhumikā*）、《锡克思想：哲学愿景与系统发展》（*Sikh Chintan: Darśanak ate Sansthāmik Vikās*）。[^note-6] 同样要紧的是锡克后现代思想家兼文学批评家古尔巴加特·辛格。其著作有《世界思想与旁遮普文学》（*Vishwa Chintan ate Punjabi Sahit*）、《锡克教与后现代思想》、《西方诗学与东方思想》——末一种书名戏仿印度哲学家萨尔瓦帕利·拉德哈克里希南的名著《东方宗教与西方思想》。近年又添两种：《锡克哲学：去殖民时代的古鲁教法概念探析》（Mandair 2022）[^mandair-2022]，与尼基·古尼德尔·考尔·辛格《那纳克古鲁的超越美学》（2024）。
