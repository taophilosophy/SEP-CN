      In an era of rising nationalist sentiment between the major communities of Punjab (Hindu, Muslim, Sikh) Trumpp’s ‘Sketch’ polarized readers and sparked a series of rebuttals of Western interpretations in the form of philosophical-theological commentaries. The first attempted rebuttal was the *Farīdkōt Tīkā* written by multiple authors belonging to different Sikh schools of interpretation, but under the overall charge of the Nirmala scholar Giānī Badan Singh. Although the *Farīdkōt Tīkā* project was undertaken as a response to Trumpp’s English translation and introduction to the teachings of the Sikh Gurus, it did not have the intended impact for several reasons (Mandair 2022: 31-33)[^mandair-2022]. First, the lateness of its publication in 1905 ensured that the *Farīdkōt Tīkā* was superseded and made irrelevant by the modernist literature of the Lahore Singh Sabhā. Second, its idiom emulated Braj literature, rendering it inaccessible to a wider Sikh readership. More importantly, however, it continued the trend within Nirmala schools of self-consciously framing the hermeneutics of the *Farīdkōt Tīkā* within the Hindu orthodox tradition of *sanātana dharma* whose Vedic-Brahmanical heritage of exegesis was governed by the theological paradigm of “eternal Sanskrit” (Deshpande 1993: 53-73). This appropriation of *gurmat* into the Vedic-Brahmanic paradigm was vigorously contested especially by modernist Sikh thinkers.
    step1: |-
      在旁遮普诸大社群（印度教、穆斯林、锡克）民族主义情绪高涨的年代，特鲁姆普的“概述”使读者两极分化，并引发一系列以哲学—神学注疏形式出现的对西方解释的反驳。第一次尝试性反驳是《法里德科特注》，由分属不同锡克阐释学派的作者们合写，而在尼尔马拉学者智识者巴丹·辛格总其成。尽管《法里德科特注》项目是作为对特鲁姆普英译及其对锡克古鲁教说导论之回应而展开的，它却没有达到预期影响，原因有几（Mandair 2022: 31-33）[^mandair-2022]。第一，1905 年方才问世，时已太迟，拉合尔辛格大会的现代主义文献使它过时且无关紧要。第二，其语体仿效布拉吉文学，广大锡克读者难以接近。更重要的是，它延续了尼尔马拉诸派的倾向：自觉地把《法里德科特注》的解释学纳入 *sanātana dharma* 的印度教正统传统之内，而后者的吠陀—婆罗门注疏遗产，受“永恒梵语”的神学范式支配（Deshpande 1993: 53-73）。把 *gurmat* 收编进吠陀—婆罗门范式的做法，尤其遭到现代主义锡克思想家的激烈反驳。
