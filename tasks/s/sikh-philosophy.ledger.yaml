      ## 4. Ethics
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      For guidance on ethics and morals, Sikhs look to a variety of sources which fall into several different categories: scripture, hagiographical literature (*janāmsakhi*) and codes of conduct (*rahit maryada*). While scriptural teachings in texts such as the Guru Granth Sahib and the Dasam Granth tend towards a universal messaging and guidance, the *janamsakhi* and Rahit literature address a specific community and cultural framework. The Rahit literature, for example, provides basic life-rules, organisational duties or codes of conduct for how a Sikh ought to live. Its moral teaching can be traced to the sixteenth century writings of Bhai Gurdas, who provided the earliest interpretation of the Nanakian system, translating it into the very basic codes of living that helped guide and consolidate the early Sikh community (see Gill 2016; Darshan Singh 1986)[^gill-2016][^singh-1986]. The Rahit texts were reformulated into a formal document first published in 1954 called the *Sikh Rahit Maryada* (SRM or Sikh Code of Conduct).
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      Although the code outlined in the *SRM* continues to strongly influence the conduct of Sikhs, its limitations are becoming all too evident. The conceptual framing of the *SRM* belongs to the colonial period, where the preservation of religious identities took precedence over other considerations. This conceptual framing is proving to be increasingly inadequate for contemporary life in the major metropolises of India and in the Western diasporas where Punjabi tradition and lifestyle directly encounter post-secular politics, technology, environmental concerns and pluralism on a scale not seen before. To provide answers befitting the increasingly complex ethical dilemmas and social contexts from which they arise, Sikhs are beginning to bypass the SRM and engage directly with primary source literatures, especially the Guru Granth Sahib, in an effort to ascertain whether there is a ‘pluriversal’ touchstone for morals and morality.
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      Texts such as the Guru Granth Sahib, however, present a different kind of challenge with their lack of a rigid ideological framework and categorical imperatives. But this does not necessarily mean the absence of a system of moral thinking in the teachings of the Sikh Gurus (*gurmat*). According to the ethicist Avtar Singh, Nanak identifies a moral standard in relation to a self-realised person (*sachiārā*), someone who has struggled to remain faithful to the truth of an experience of oneness whose manifestation is egoloss, and to one who acts and lives in accordance with the sovereign imperative (*hukam rajai chalana*) that is ontologically before any social law (Avtar Singh 1983)[^singh-1983]. The touchstone for morality is not grounded (contra the *SRM*) in a belief system or a standpoint. Rather, it is better understood as a general principle or sovereign imperative (*hukam*) which enjoins that whatever the duties or discipline entailed by one’s station (*rajai/raza*), these ought to be performed in such a way that in each act performed or duty fulfilled, one imbibe the sovereign imperative (*hukam*) inscribed into life itself, indeed into all existence (SGGS: 1). Because *hukam* is immanent within life (*hukmai andar sab koe, bahar hukam na koe* – SGGS: 1), it replaces the need for a transcendental ground, be that a deity or otherwise. In other words, because of the immanence of *hukam*, life is revalued for itself and not as a supplement to the divine. Life itself is sovereign and cannot be captured within metaphysical distinctions such as sacred versus profane, sacred versus secular and so on.
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
    source: |-
      Inscribed into all life, *hukam* is the imperative to negate the ego, which says ‘I am’. If left untended, the sense of ‘I am’-ness becomes a disease engendered by the five propensities also referred to as the ‘five enemies’ or ‘five thieves’: (i) *kām* (concupiscence, lust or simply craving), (ii) *krōdh* (anger or wrath), (iii) *lōbh* (covetousness or the desire to possess what belongs to others), (iv) *mōh* (attachment or delusion) and (v) *ahankār* (egotistical pride) (Avtar Singh 1983: 53)[^singh-1983]. These ‘five enemies’ are psychic propensities of the self that either attract the person towards something (for example, an object or an action) or repel the person away from what is wholesome. They are not biological or primitive urges or instincts but learned dispositions or habitual frames of mind that can take on a life of their own. If left unchecked, these propensities keep the individual in a state of restlessness (Jodh Singh 1932: 250-64)[^singh-1932][^singh-1932-2].
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      However, as Guru Nanak reminds us in the first stanzas of his Japji, the ‘five enemies’ cannot be controlled through ascetic practices, ritual cleansing or by reflection alone. Rather, they must be regulated by inculcating and actively practising virtues such as wisdom (*giān*), truthfulness (*sach*), justice (*niaon*), temperance (*sanjam*), courage (*niḍar*), humility (*garībī, nimarta*) and contentment (*santōkh*) (Avtar Singh 1983: 53-7)[^singh-1983]. Those who actively appropriate such virtues are able to inscribe *hukam* into their very being as egoloss. They actively resist saying ‘I am’ and instead balance this egotistical propensity by being able to say ‘I am not’, and thereby elevate themselves beyond the self-willed rationalist morality of societal norms (*manmukh*). Appropriating *hukam* (the sovereign imperative that resists being rationalised into a system of knowledge) forces the individual to think and act almost like an aesthete or artist. Such a person who is freed and empowered to challenge existing values, freed to create new values rather than blindly following social rules, is known as *gurmukh*.
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      Clearly, Guru Nanak’s moral standard of egoloss, the *gurmukh*, takes us beyond socially sanctioned oppositional norms such as good versus evil, wrong versus right and violence versus peace. It questions the very frameworks in which we operate, even as it allows us to make deliberate, conscious choices in both mundane challenges of everyday life and the more extraordinary quandaries that face human beings today. Consequently, the Gurus’ teachings are entirely practical and applicable to all life situations, actual or possible. They allow the person to determine how best to live from day to day in an ever-changing world.
