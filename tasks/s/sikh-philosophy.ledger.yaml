      The notable exception is Jodh Singh’s *Gurmati Nirnai*, which because of its succinctness (single volume as opposed to the multi-volume nature of other Singh Sabha works), its conceptual and schematic organization (other Singh Sabha works were straightforward textual exegeses) and its accessible style (it reads like a transcript of public lectures), can be regarded as the prototype for properly philosophical works on Sikh philosophy that would appear later in the twentieth century. One of the striking things about *Gurmati Nirnai* is its broad schematic arrangement which appears simply to have transplanted the Kantian ontotheological schema of God-World-Man for organizing the main chapters in the following way: (Chapter 1) God (*akāl purakh*), (Chapter 2) World (*sristī rachnā*), (Chapter 3) Man (*manukh*), (Chapter 4) the Guru (*Guru*)…… (Chapter 9) Word (*śabad*)… (Bhai Jodh Singh 1932)[^singh-1932][^singh-1932-2]. The first chapter is essentially an extended argument for the need to comprehend the existence of God in terms of a static immutable One. The crux of his argument is to demonstrate the transcendental nature of the One, which allows him not only to reproduce an intellectual separation between God/World/Man in the early chapters but, by the time he comes to discuss the nature of community in chapter 14, to use ontological separation as a basis for establishing an epistemological distinction between Sikh and non-Sikh world-views (Mandair 2022, 38)[^mandair-2022]. In many ways, *Gurmat Nirnai* was the bridge to the next generation of Sikh thinkers, particularly those writing in English, and more specifically those scholars who used its readily accessible schema to materialize a ‘Sikh Philosophy’ based on a modernized interpretation of *gurmat*. It was, in other words, the bridge that created the appearance of a faithful and unhindered passage of meaning akin to what Talal Asad calls a “secular translation” (Asad 2018)[^asad-2018] from *gurmat* to ‘Sikh Philosophy’, giving the impression that the two are exactly the same.
    step1: |-
      显著的例外是乔德·辛格的《古鲁教法决断》：它篇幅精炼（单卷本，不同于辛格大会其他多卷本著作）、概念与图式化组织（其他著作是直接的文本注疏）、文风平易（读起来像公开讲演的记录），因此可视为 20 世纪后半叶出现的锡克哲学的真正哲学著作之原型。《古鲁教法决断》引人注目之处，是其宽泛的图式安排：它似乎径直移植了康德式的“上帝—世界—人”存在神论图式来组织主要章节：（第 1 章）上帝（*akāl purakh*）、（第 2 章）世界（*sristī rachnā*）、（第 3 章）人（*manukh*）、（第 4 章）古鲁（*Guru*）……（第 9 章）圣言（*śabad*）……（巴伊·乔德·辛格 1932）[^singh-1932][^singh-1932-2]。第一章实质上是一个扩展论证，主张必须把上帝的存在理解为一个静止不变的“太一”。其论证的关键，在于证明太一的超越本性：这使他不但在前几章复制了上帝／世界／人的智识分离，而且到第 14 章讨论共同体本性时，能把本体论分离用作确立锡克与非锡克世界观之认识论区分的基础（Mandair 2022, 38）[^mandair-2022]。在许多方面，《古鲁教法决断》是通向下一代锡克思想家的桥梁，尤其是用英文写作的那些人——更确切说，是那些利用其平易图式、把以现代化方式阐释的 *gurmat* 落实为“锡克哲学”的学者。换句话说，正是这座桥，制造了从 *gurmat* 到“锡克哲学”的意义忠实而畅通的通道之表象，近乎塔拉勒·阿萨德所谓“世俗翻译”（Asad 2018）[^asad-2018]——给人的印象是：二者全然相同。
    step2: |-
      显著的例外是乔德·辛格的《古鲁教法决断》。它篇幅精炼（单卷本，不同于辛格大会其他多卷之作），组织概念化、图式化（其余著作是直接的文本注疏），文风平易（读来如公开讲演的记录）。故可视为 20 世纪后半叶陆续出现的、真正哲学性的锡克哲学著作之原型。《古鲁教法决断》最惹眼的，是其宽泛的图式安排。它似乎径直移植了康德式“上帝—世界—人”的存在神论图式来安排主要章节：（第 1 章）上帝（*akāl purakh*）、（第 2 章）世界（*sristī rachnā*）、（第 3 章）人（*manukh*）、（第 4 章）古鲁（*Guru*）……（第 9 章）圣言（*śabad*）……（巴伊·乔德·辛格 1932）[^singh-1932][^singh-1932-2]。第一章实质是一个扩展论证：必须把上帝的存在理解为一个静止不变的“太一”。论证的枢纽在于证明太一的超越性。这使他不但在前几章复制了上帝／世界／人的智识分离，到第 14 章讨论共同体本性时，还能把本体论分离用作确立“锡克世界观／非锡克世界观”认识论区分的基础（Mandair 2022, 38）[^mandair-2022]。在许多方面，《古鲁教法决断》是通向下一代锡克思想家的桥梁，尤其对用英文写作的人——更确切说，对那些借其平易图式、把现代化阐释的 *gurmat* 落实为“锡克哲学”的学者而言。换句话说，正是这座桥制造了一种表象：从 *gurmat* 到“锡克哲学”的意义通行无阻、忠实可靠，一如塔拉勒·阿萨德所谓“世俗翻译”（Asad 2018）[^asad-2018]——仿佛二者全然相同。
