      The importance of the Giānī *prnālī* (also known as the Giani *Sampardai*) is that its authors and their scholarship not only imbibed premodern and modern influences, but equally complicated the premodern/modern distinction. The term *giānī* is a Punjabi derivation of the Sanskrit *jñāna* or *jñāna mārg* or path of high learning or deep wisdom. The Giānī *prnālī* originated with Bhāī Mani Singh and Babā Deep Singh, both of whom were under the tutelage of the tenth Sikh Guru, Gobind Singh, during his stay at Damdamā Sahib (Taran Singh 1996: 77)[^singh-1996]. Mani Singh later founded a *taksāl* or centre of higher learning, where he developed the art of *kathā* – the delivery of oral discourses expounding the teachings of the Sikh Gurus based on close exegesis of a given *śabad* or verse from the Guru Granth Sahib. *Kathā* is now regarded as integral to the practice of *gurmat* and is specifically tied to the Giānī school. Baba Deep Singh remained at Damdamā, where he founded a similar *taksāl*. Both of these institutions gave rise to influential lineages of scriptural scholarship and oral discourse, which in turn were instrumental for disseminating the philosophical aspects of *gurmat*. A very particular form of their expertise consisted in combining philosophical explanations of the Guru Granth Sahib with biographical narratives (*sākhīan*) of the Sikh Gurus. Examples of scholarship that weave expertise in metaphysical philosophy with the art of storytelling can be found in works such as *Sikhan dī Bhāgat Mālā* and *Giān Ratnāvalī* (Bhāī Mani Singh), *Prayai Guru Granth Sahib* (Bhāī Chandā Singh), *Sri Guru Granth Kōsh* (Bhai Hazarā Singh), *Gurbāṇī Vyākaran* (Bhai Bhagvan Singh), *Tawārikh Guru Khālsā* and *Giān Prabōdh* (Giānī Giān Singh).
    step1: |-
      智识传承（*Giānī prnālī*，亦称 Giani *Sampardai*）的重要性在于：其作者与学术不仅吸纳了前现代与现代的影响，也把前现代／现代的区分本身复杂化了。*giānī* 一词是梵语 *jñāna*（或 *jñāna mārg*，即高深学问或深邃智慧之道）的旁遮普语派生。智识传承始于巴伊·马尼·辛格与巴巴·迪普·辛格，二人都在第十位锡克古鲁戈宾德·辛格驻于达姆达马·萨希卜期间受其教导（Taran Singh 1996: 77）[^singh-1996]。马尼·辛格后来创建了一所 *taksāl*（高等学府），在那里发展出 *kathā* 的技艺——即基于对《古鲁·格兰特·萨希卜》中某一 *śabad* 或诗节的细致注疏，口头讲说锡克古鲁的教说。*kathā* 如今被视为 *gurmat* 实践的组成部分，且与智识派特别相关。巴巴·迪普·辛格留在达姆达马，也创建了一所类似的 *taksāl*。这两所机构催生了颇有影响的圣典学术与口头讲说谱系，这些谱系又反过来推动了 *gurmat* 哲学面向的传播。其专长的一种很特别的形式，是把对《古鲁·格兰特·萨希卜》的哲学解释同锡克古鲁的生平叙事（*sākhīan*）结合起来。把形而上学哲学专长与叙事技艺交织在一起的学术范例，可见于以下著作：《锡克虔信花环》（*Sikhan dī Bhāgat Mālā*）与《智慧宝串》（*Giān Ratnāvalī*，巴伊·马尼·辛格）、《普拉亚伊古鲁·格兰特·萨希卜》（*Prayai Guru Granth Sahib*，巴伊·昌达·辛格）、《室利·古鲁·格兰特词典》（*Sri Guru Granth Kōsh*，巴伊·哈扎拉·辛格）、《古鲁之言语法》（*Gurbāṇī Vyākaran*，巴伊·巴格万·辛格）、《卡尔萨古鲁史》（*Tawārikh Guru Khālsā*）与《智慧启明》（*Giān Prabōdh*，智识者吉安·辛格）。
    step2: |-
      智识传承（*Giānī prnālī*，亦称 Giani *Sampardai*）之重要，在于其作者与学术既吸纳前现代与现代影响，又把前现代／现代的区分本身弄复杂了。*giānī* 是梵语 *jñāna*（或 *jñāna mārg*，高深学问或深邃智慧之道）的旁遮普语派生词。此系始于巴伊·马尼·辛格与巴巴·迪普·辛格，二人均在第十位锡克古鲁戈宾德·辛格驻于达姆达马·萨希卜期间从其受教（Taran Singh 1996: 77）[^singh-1996]。马尼·辛格后来创建 *taksāl*（高等学府），在那里发展出 *kathā* 之艺：就《古鲁·格兰特·萨希卜》某一 *śabad* 或诗节细加注疏，口头讲说锡克古鲁的教说。*kathā* 今被视为 *gurmat* 实践的组成部分，与智识派尤为相关。巴巴·迪普·辛格则留在达姆达马，另建一所同类 *taksāl*。两所机构各催生有影响的圣典学术与口头讲说谱系，转而推动了 *gurmat* 哲学面向的传播。其专长有一种很特别的形式：把对《古鲁·格兰特·萨希卜》的哲学解释同锡克古鲁的生平叙事（*sākhīan*）结合。兼擅形而上学哲学与叙事之艺的学术范例，可见《锡克虔信花环》（*Sikhan dī Bhāgat Mālā*）、《智慧宝串》（*Giān Ratnāvalī*，巴伊·马尼·辛格）、《普拉亚伊古鲁·格兰特·萨希卜》（*Prayai Guru Granth Sahib*，巴伊·昌达·辛格）、《室利·古鲁·格兰特词典》（*Sri Guru Granth Kōsh*，巴伊·哈扎拉·辛格）、《古鲁之言语法》（*Gurbāṇī Vyākaran*，巴伊·巴格万·辛格）、《卡尔萨古鲁史》（*Tawārikh Guru Khālsā*）、《智慧启明》（*Giān Prabōdh*，智识者吉安·辛格）。
