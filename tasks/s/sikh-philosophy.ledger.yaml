      For guidance on ethics and morals, Sikhs look to a variety of sources which fall into several different categories: scripture, hagiographical literature (*janāmsakhi*) and codes of conduct (*rahit maryada*). While scriptural teachings in texts such as the Guru Granth Sahib and the Dasam Granth tend towards a universal messaging and guidance, the *janamsakhi* and Rahit literature address a specific community and cultural framework. The Rahit literature, for example, provides basic life-rules, organisational duties or codes of conduct for how a Sikh ought to live. Its moral teaching can be traced to the sixteenth century writings of Bhai Gurdas, who provided the earliest interpretation of the Nanakian system, translating it into the very basic codes of living that helped guide and consolidate the early Sikh community (see Gill 2016; Darshan Singh 1986)[^gill-2016][^singh-1986]. The Rahit texts were reformulated into a formal document first published in 1954 called the *Sikh Rahit Maryada* (SRM or Sikh Code of Conduct).
    step1: |-
      关于伦理与道德的指导，锡克人诉诸多种来源，可分为几类：圣典、圣徒传文献（*janāmsakhi*）与行为准则（*rahit maryada*）。《古鲁·格兰特·萨希卜》与《达萨姆·格兰特》等文本中的圣典教说倾向于普世性的讯息与指导，而 *janamsakhi* 与拉希特（Rahit）文献则针对特定社群与文化框架。例如，拉希特文献提供基本的生活规则、组织职责或锡克人应如何生活的行为准则。其道德教说可追溯至巴伊·古尔达斯 16 世纪的著作——他最早解释了那纳克体系，把它转化为指导并巩固早期锡克社群的基本生活准则（见 Gill 2016; Darshan Singh 1986）[^gill-2016][^singh-1986]。拉希特文本后被重新整理为一份正式文件，1954 年首次出版，名为《锡克行为准则》（*Sikh Rahit Maryada*，SRM）。
