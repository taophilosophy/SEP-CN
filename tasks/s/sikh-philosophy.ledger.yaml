      Custodianship of philosophical exegesis and ecclesiastic affairs fell to Udāsī and Nirmala sects.[^note-5] Because of their intellectual proximity to the orthodox Hindu *Śāstras* or schools of philosophy, these sects are also referred to as *Śāstric prnalis* (Taran Singh 1980: 93-118)[^singh-1980]. The Udāsī school is associated with the sect of itinerant ascetics founded by Sri Chand, the elder of Nanak’s two sons. Although much of the discourse of this school is limited to oral exegesis, an early written record of this school of thought can be found in Sadhu Anandghan’s *ṭīkā* (exegetical commentary) on compositions by the Sikh Gurus. Most likely composed between 1795 and 1802, when Anandghan was receiving his training at Kashi (Varanasi), the center of Hindu orthodoxy, the tenor of these *ṭīkās* reflects a desire to integrate *sikhī* into the broader Hindu fold by implementing a reductive technique that frames Nanak’s teachings (*gurmat*) as a variant of *sanātana dharma*, a form of orthodox Hinduism that gravitates around a belief in ‘eternal law’ specified by the Veda. This *sanātanist* mode of reduction became a common feature of commentaries in the nineteenth century, carrying on into the work of the Nirmala school.
    step1: |-
      哲学注疏与教会事务的守护之责，落在乌达西派与尼尔马拉派肩上。[^note-5] 由于它们在思想上接近正统印度教 *Śāstras* 或哲学诸派，这两派也被称为 *Śāstric prnalis*（Taran Singh 1980: 93-118）[^singh-1980]。乌达西派与室利·昌德所创的游方苦修派相关；昌德是那纳克两个儿子中的长子。尽管该派话语大多限于口头注疏，其早期书面记录可见于沙杜·阿南德甘（Sadhu Anandghan）对锡克古鲁作品的 *ṭīkā*（注疏）。这些 *ṭīkā* 很可能作于 1795 至 1802 年间——当时阿南德甘正在印度教正统中心迦尸（瓦拉纳西）受训。其基调反映出一种愿望：通过一种化约手法把 *sikhī* 纳入更广的印度教怀抱，即把那纳克的教说（*gurmat*）框定为 *sanātana dharma* 的一个变体——后者是正统印度教的一种形态，围绕对吠陀所规定的“永恒之法”的信仰。这种 *sanātanist*（永恒法本位）的化约方式，成为 19 世纪注疏的常见特征，并延续到尼尔马拉派的工作中。
    step2: |-
      哲学注疏与教会事务的守护之责，落在乌达西派与尼尔马拉派肩上。[^note-5] 因其思想接近正统印度教 *Śāstras* 或哲学诸派，这两派又称 *Śāstric prnalis*（Taran Singh 1980: 93-118）[^singh-1980]。乌达西派与室利·昌德所创的游方苦修派相系——昌德是那纳克两子中的长子。该派话语大多限于口头注疏，其早期书面记录见沙杜·阿南德甘（Sadhu Anandghan）为锡克古鲁作品所作 *ṭīkā*（注疏）。这些 *ṭīkā* 很可能作于 1795–1802 年间，其时阿南德甘正在印度教正统中心迦尸（瓦拉纳西）受训。其基调透出一种愿望：以化约手法把 *sikhī* 纳入更广的印度教怀抱，即把那纳克教说（*gurmat*）框定为 *sanātana dharma* 的变体——后者是正统印度教的一种形态，围绕吠陀所定“永恒之法”的信仰。这种 *sanātanist*（永恒法本位）化约，成了 19 世纪注疏的常见特征，并延续到尼尔马拉派。
