      ### 3.2 *Gian* – Modes of Operation
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      If *giān* is a process for perfecting knowledge rather than a faculty in itself, this raises the question as to how knowledge is actually synthesised during the development process. What are the components of *giān* as a system for synthesising the contents of knowledge? Scholars have discerned three different modes of operation encompassed by *giān*: (i) Praxis; (ii) Cognition/Perception; (iii) Thought. Strictly speaking, however, these processes are part of a single overall process.
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      #### 3.2.1 Praxis
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      As a practice, *giān* is centred around processes that interiorize the contents of empirical cognition produced through encounters with the world around us. Some essential parameters of *giān* are elaborated in Nanak’s most important composition, the Japji, whose repetition constitutes a cornerstone of Sikh praxis (SGGS: p.1). A literal translation of Japji is “The Meditation” signifying a memorializing technique in which words enunciated externally are simultaneously interiorized into spontaneous or intuitive memory.
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      #### 3.2.2 Cognition/Perception
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      According to Stanzas 6-7 of Japji, the contents of empirical cognition are initially collected by the sensory faculties before being synthesised by the interiorizing faculties that comprise the mind (or *mn*). In Japji, the interiorizing process is treated as three-fold, beginning with *vēkhaṇā* (visual perception), *sunṇaṇā* (lit. listening or auditory perception), and *munaṇa* (initial process of interiorizing the contents of sensory perception into contemplative thought or concepts), ending with *dhyāna* (meditative-intuitive state of embodied knowing) (Kaur 1990: 130-142)[^kaur-1990].
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      #### 3.2.3 Contemplative Thought (*dhyān*)
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      Mediating the ‘transition’ from cognition and perception (*vekhaṇa/suṇananā*) to interiorizing/minding (*munnai*) is *vichār*, which ordinarily means to think, to reflect, to ponder, to contemplate, to rationalise. According to Gurnam Kaur *vichār* is a mode of rationalisation with broad functionality starting with mundane reasoning (*soch*), hair-splitting forms of discursive reasoning (*tark, bādi)*, leading to a deeper internal searching (*khoji*), and culminating in the attainment of practical wisdom (*aql, siānap*) (Kaur 1990: 103-112)[^kaur-1990]. These various modes of reasoning - *sōch, bādi, tark, khoji, aql, siāṇap* – are co-imbricated with *vichār* but remain at the level of *manmukh* individuality limited by ego, indicating that *vichār* itself represents a progressive continuum in which thought goes through degrees of refinement as one learns to discriminate and judge at increasingly deeper levels. The highest level of discriminative thinking and judgement happens when *vichār* becomes *bibēk vichār* or ‘awakened reasoning’[^note-12] - a level of thought where the mind discerns things without falling back into corrupting dualisms (*kubuddhi*).[^note-13] For the final stage in the synthesis of knowledge, Nanak uses the term *dhyān*, which can be described as meditative focus in which being and knowing enter into an intuitive unity. Elsewhere in his writings, Nanak likens *dhyān* to the ripening or flowering of knowledge.[^note-14] The floral metaphor points to the higher awareness of the *gurmukh* state, where the process of psychic individuation flowers into a state of perfection.
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      In light of the above, it is more helpful to understand *giān* as an onto-epistemology rather than epistemology in the strict sense, which is oriented towards objectivity of knowledge (Himat Singh 1985: 3-9)[^singh-1985]. *Giān* is a subjective process that mediates between individual consciousness and the world, ironically by rupturing the limits of the individual ego. The essential tool that enables this process is *śabad*. The question that arises here is how consciousness interacts with materiality? How does consciousness become contracted prior to undergoing expansion? Nanak directly attributes this role to three main faculties: *matt(i)* (practical wisdom), *mn* (mind/memory) and *buddhī* (intellect) (SGGS: Japji: Pauri 36-7).
