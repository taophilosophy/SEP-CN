      在成为一门自主的锡克思想学派之前，辛格大会起初是一场带有明显政治底色的社会与宗教改革运动。哲学上，它的目标是凸显 *gurmat* 的概念语言，以之作为抵抗更有影响力的基督教、印度教与穆斯林思想领域的工具。同时，辛格大会思想又须保持开放，与现代西方的批判推理与哲学思辨方式对话。这一进路见于辛格大会知识分子的早期著作，如卡恩·辛格·纳巴、巴伊·维尔·辛格与特贾·辛格。1890 年代，卡恩·辛格·纳巴出版两部重要著作：《古鲁教法启蒙》（*Gurmat Prabhakar*）与《古鲁教法精粹》（*Gurmat Suddhakar*）；两书皆按字母顺序列出锡克古鲁的核心概念，并配以大量经文引证。1931 年，纳巴完成其巨著《古鲁词汇大词典》（*Gurshabad Ratnakar Mahānkōsh*），至今仍是锡克哲学与神学研究不可或缺之作。
