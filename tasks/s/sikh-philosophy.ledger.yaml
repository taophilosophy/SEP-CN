  - id: 9
    kind: body
    source: |-
      Elsewhere, Kahn Singh Nabha traces the etymology of the two terms comprising *gurmat*, namely *gur(u)* and *mat(i)* (Nabha 1981: see p. 945 and p. 415)[^nabha-1981].[^note-2] The centrality of mind/self/individuation to the nature of *gurmat* is underscored in one of Nanak’s own compositions, the *Siddh Gōst(i)* (or “Dialogue With the Siddhas”), where he emphatically points to the source of his authority. In this dialogue, Nanak is being questioned by the Siddhas, the great spiritual adepts of the time. At one point in the conversation, the Siddhas pointedly ask Nanak about the source of his authority to teach: “Tell us, Nanak, who is your Guru, of whom are you the disciple?”. To which Nanak provides an equally pointed reply: “*Śabad* is Guru, that consciousness attuned to it is the disciple” (Siddh Gōst(i): SGGS. pp 938-46).
    step1: |-
      在别处，卡恩·辛格·纳巴追溯了构成 *gurmat* 的两个词——*gur(u)* 与 *mat(i)*——的词源（Nabha 1981: 见第 945 页与第 415 页）[^nabha-1981]。[^note-2] 心／自我／个体化对 *gurmat* 之本性的中心地位，在那纳克本人的一篇作品《悉陀问答》（*Siddh Gōst(i)*）中得到凸显；他在其中着重指出自己权威的来源。在这篇对话中，悉陀——当时伟大的精神成就者——向那纳克发问。谈话中，悉陀们尖锐地问那纳克其教导权威的来源：“告诉我们，那纳克，你的古鲁是谁，你又是谁的弟子？”那纳克给出同样尖锐的回答：“*Śabad* 是古鲁，与它相契的觉知是弟子。”（Siddh Gōst(i): SGGS. pp 938-46）
    step2: |-
      别处，卡恩·辛格·纳巴还追溯了 *gurmat* 一词两个构件的词源，即 *gur(u)* 与 *mat(i)*（Nabha 1981: 见第 945、415 页）[^nabha-1981]。[^note-2] 心、自我、个体化对 *gurmat* 之本性何等要紧，那纳克本人的《悉陀问答》（*Siddh Gōst(i)*）可作印证：他在其中着力点明自己权威的来源。对话里，当时的大成就者悉陀们向那纳克发问，且问得尖锐：“告诉我们，那纳克，你的古鲁是谁？你又是谁的弟子？”那纳克的回答同样尖锐：“*Śabad* 是古鲁，与它相契的觉知便是弟子。”（Siddh Gōst(i): SGGS. pp 938-46）
  - id: 10
    kind: body
    source: |-
      As articulated below, this principle of *śabad-as-guru* or simply *śabad-guru* is repeatedly stressed throughout the primary sources to the extent that it becomes synonymous with the meaning and end of *gurmat* itself. It is in this sense that the core of the discourse of *gurmat –* its *siddhāntic* nature *- is* the theory, practice, and technique of *śabad* as a tool for overcoming a debased self-nature and transitioning towards an elevated self. From this perspective, the nature of *gurmat* can be more usefully envisaged as a paradoxical anti-doctrinal doctrine[^note-3], whose meaning incorporates, but is not limited to: the Guru’s instruction, the wisdom of the Guru, the Gurus’ system or logic; the Gurus’ philosophy of life as a whole; the teachings of the Guru. Only as an anti-doctrinal doctrine can *gurmat* be considered an ordering category that serves to both differentiate and connect Nanak’s system of thought-practice from other major systems extant at the time, including but not limited to the Hindu *śāstras*, Buddhism, Islamic thought (especially Sufism), Kashmir Śaivism, the system of Gorakhnath and Vaishnavism. As is evident from the literature, an inevitable implication of Nanak’s establishment of *gurmat* as theory-practice and his investing supreme authority in the principle of *śabad-guru*, is that it was contested particularly by groups and systems that regarded Veda as the supreme authority. As we see below, these contestations continued well into the modern period and are alive and well today.
    step1: |-
      如下文所述，*śabad-as-guru*（或径称 *śabad-guru*）这一原则在原始资料中被反复强调，以致与 *gurmat* 自身的含义与目的同义。正是在这个意义上，*gurmat* 话语的核心——其 *siddhāntic* 本性——就是 *śabad* 的理论、实践与技术，即用以克服卑下的自我本性、转向更高自我的工具。由此看，*gurmat* 的本性更宜设想为一种悖论性的反教义之教义[^note-3]：其含义包含但不限于：古鲁的教导、古鲁的智慧、古鲁们的体系或逻辑、古鲁们整全的生活哲学、古鲁的教说。唯有作为反教义的教义，*gurmat* 才可视为一个排序范畴：它既把那纳克的思想—实践体系与当时其他主要体系区分开来，又把它们联系起来——这些体系包括但不限于印度教 *śāstras*、佛教、伊斯兰思想（尤其是苏非主义）、克什米尔湿婆派、戈拉克纳特体系与毗湿奴派。从文献可见，那纳克把 *gurmat* 立为理论—实践、并把最高权威赋予 *śabad-guru* 原则，其不可避免的一个后果是：它尤其遭到那些以吠陀为最高权威的群体与体系的争辩。如下文所示，这些争辩一直延续到现代，至今仍活跃。
    step2: |-
