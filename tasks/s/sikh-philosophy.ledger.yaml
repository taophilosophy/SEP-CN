      The principal source of inspiration for Sikh philosophers and theologians is the Guru Granth Sahib, or as it is commonly referred to by Sikhs, the Sri Guru Granth Sahib (SGGS). This is the body of Sikh scripture compiled and canonised by Nanak’s fifth successor, Guru Arjan, in 1604.[^note-4] A large volume of 1431 pages whose various sections are aesthetically organised under musical measures (or *raga*), the SGGS includes compositions by Hindu and Muslim mystics, including Jaidev, Nāmdev, Kabir, and Sheikh Farid. The foundational nature of the SGGS for Sikh thought and practice is reflected in the appellations *gurbanī* (lit. utterance of the Guru) or *dhur-ki-bāṇī*. Often translated as ‘revealed’ *dhur-ki-bāṇī can* be more usefully rendered as utterances from the far-side, a reference to the widely held belief that these compositions are not mere literature or poetry but come from beyond the limit of human imaginary through deep spiritual experience.
    step1: |-
      锡克哲学家与神学家的首要灵感来源是《古鲁·格兰特·萨希卜》——锡克人通常称之为《室利·古鲁·格兰特·萨希卜》（SGGS）。这是由那纳克的第五位继承者阿尔詹古鲁于 1604 年编纂并定为正典的锡克圣典。[^note-4] 这部 1431 页的大书，各部分按音乐调式（*raga*）作美学编排，其中收录了印度教与伊斯兰教神秘主义者的作品，包括贾伊德夫、纳姆德夫、卡比尔与谢赫·法里德。SGGS 对锡克思想与实践的奠基性，体现在 *gurbanī*（字面义：古鲁的言辞）或 *dhur-ki-bāṇī* 这些称谓上。*dhur-ki-bāṇī* 常译作“启示的”，但更确切的译法是“来自彼岸的言辞”——这指向一种广泛持有的信念：这些作品并非单纯的文学或诗歌，而是经由深层精神体验、出自人类想象界限之外。
    step2: |-
      锡克哲学家与神学家的首要灵感来源，是《古鲁·格兰特·萨希卜》，锡克人通常称之为《室利·古鲁·格兰特·萨希卜》（SGGS）。这部锡克圣典由那纳克的第五位继承者阿尔詹古鲁于 1604 年编纂并定为正典。[^note-4] 全书 1431 页，各部分按音乐调式（*raga*）作美学编排，收录了印度教与伊斯兰教神秘主义者的作品，包括贾伊德夫、纳姆德夫、卡比尔与谢赫·法里德。SGGS 对锡克思想与实践的奠基性，见于 *gurbanī*（字面义：古鲁的言辞）或 *dhur-ki-bāṇī* 这些称谓。*dhur-ki-bāṇī* 常译作“启示的”，其实更宜译作“来自彼岸的言辞”：此说指向一种广泛信念——这些作品并非单纯的文学或诗歌，而是出自人类想象界限之外，得自深层精神体验。
