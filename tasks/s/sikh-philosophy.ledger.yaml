      However, as Guru Nanak reminds us in the first stanzas of his Japji, the ‘five enemies’ cannot be controlled through ascetic practices, ritual cleansing or by reflection alone. Rather, they must be regulated by inculcating and actively practising virtues such as wisdom (*giān*), truthfulness (*sach*), justice (*niaon*), temperance (*sanjam*), courage (*niḍar*), humility (*garībī, nimarta*) and contentment (*santōkh*) (Avtar Singh 1983: 53-7)[^singh-1983]. Those who actively appropriate such virtues are able to inscribe *hukam* into their very being as egoloss. They actively resist saying ‘I am’ and instead balance this egotistical propensity by being able to say ‘I am not’, and thereby elevate themselves beyond the self-willed rationalist morality of societal norms (*manmukh*). Appropriating *hukam* (the sovereign imperative that resists being rationalised into a system of knowledge) forces the individual to think and act almost like an aesthete or artist. Such a person who is freed and empowered to challenge existing values, freed to create new values rather than blindly following social rules, is known as *gurmukh*.
    step1: |-
      然而，正如那纳克古鲁在《贾普吉》开篇诸颂中提醒我们的，“五敌”不能靠苦行、仪式净化或单纯反思来控制。它们须靠灌输并积极践行诸德来调节：智慧（*giān*）、真实（*sach*）、正义（*niaon*）、节制（*sanjam*）、勇气（*niḍar*）、谦卑（*garībī, nimarta*）与知足（*santōkh*）（Avtar Singh 1983: 53-7）[^singh-1983]。积极涵养这些德性的人，能把 *hukam* 作为自我丧失铭刻进自身存在。他们积极抵制说“我在”，并以能说“我不在”来平衡这一自我倾向，从而把自己提升到社会规范（*manmukh*）那种自以为是的理性主义道德之上。吸纳 *hukam*（这一抵制被理性化为知识体系的至高命令）迫使个体几乎像审美家或艺术家那样思考与行动。这种被解放、被赋权去挑战既有价值、被解放去创造新价值而非盲从社会规则的人，称为 *gurmukh*。
    step2: |-
