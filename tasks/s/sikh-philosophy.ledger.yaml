      Elsewhere in the same texts, Guru Angad (the second ‘Nanak’) comments that to attain its primal state of immediacy, the *mn* must get its energy from within itself, not from outside. Mind, in other words, is self-enlightened; it shines from within and cannot derive its radiance from an external source. In further references, Nanak describes this non-reflective or pure mind as: *mn bairagi* (self-detached mind) or *ghar vasai* (resides in its own home); *mn nirmal* (pure, unsullied mind); *mn churai* …. *mn piara kartar* ……… *mn tu jōt sarūp hai* (celestial mind); or simply beloved mind (*mn har*) (Tatlay 1998: Vol. 6 29-36)[^tatlay-1998]. For this state of mind, Nanak uses imagery overflowing with the emotional intensity of lovers separated from each other in time and place, pining for each other’s embrace. This aspect of the mind is referred to as a state in which lover and beloved, self and other, I and not-I are separated even as they touch and fuse together. Even in the lovers’ tightest embrace, they are forever separating – an allusion to the effect of time, so that one needs to constantly repeat the gesture of fusion-love over and over again to stave off the separating effect of time. Nanak’s term for this aspect of time is *birhā* – a state that is simultaneously painful and blissful, in which separation and union occur at the same time and are felt as the same (Tatlay 1998: Vol. 6 365-7)[^tatlay-1998]. To speak of this paradoxical state, Nanak invokes the intensely painful longing of two lovers pining to be reunited. Though fused as one, yet even in this joined state, their union is tinged with the anticipation of imminent separation (SGGS: 1256). Unlike ego-mind, the mind in the state of *birhā* is described as an immediate and intense experience as opposed to the mediated, reflective and therefore hollow experience of ego-mind. As the references to lover/Beloved illustrate, the immediacy of this experience arises from being in direct touch with feelings experienced as unique each time (pain, pleasure, agony, joy, sadness, bliss). Feelings associated with the lovers’ embrace or separation are never experienced as the same again. Hence the intensity of pain and joy….. What is felt, or how the mind is affected, is a qualitative change that cannot be measured except through one’s aesthetic sensibility. This is why it can only be felt as an intensity but never quantitatively fixed and calculated, because the element in which it takes place is time and life itself. What is slipping away is life as/and time, the time of one’s life, which is my beloved life (*mn jindaṛī*) … As Farid states:
