      In *gurmat* philosophy, *śabad* possesses corporeal and incorporeal aspects. As corporeal, *śabad* (lit. word, sound, language = *nād* or *dhun*) serves as a tool for linguistic communication and provides mediated knowledge (Tatlay 1998: Vol. 2 13-16)[^tatlay-1998]. Thus, the *giān* of a manifest object is acquired through written letters (*akhar*) or through sounds and speech (*nād*), which are brought together to constitute meaningful statements (*kathani*), which in turn transmit *giān*. The corporeal aspect of *śabad* or *nād* is formed and transmitted in pulsed or linear time (*kāl*) and provides knowledge that is known discursively and discerned through conventional forms of reasoning such as *aql, siāṇap, sōch, vichār, khōj, bādi* (Kaur 1990: 83-95)[^kaur-1990].
    step1: |-
      在 *gurmat* 哲学中，*śabad* 兼有有形与无形两面。作为有形者，*śabad*（字面义：言、声、语言＝*nād* 或 *dhun*）充当语言交流的工具，提供间接知识（Tatlay 1998: Vol. 2 13-16）[^tatlay-1998]。因此，关于一个显在对象的 *giān*，经由书写的字母（*akhar*）或声音与言语（*nād*）获得；二者结合构成有意义的语句（*kathani*），语句又传递 *giān*。*śabad* 或 *nād* 的有形面在脉动的、线性的时间（*kāl*）中形成并传递，其知识是推论地认识的、并通过 *aql*、*siāṇap*、*sōch*、*vichār*、*khōj*、*bādi* 等常规推理形式辨察（Kaur 1990: 83-95）[^kaur-1990]。
    step2: |-
      在 *gurmat* 哲学中，*śabad* 兼有有形与无形两面。作为有形者，*śabad*（字面义：言、声、语言＝*nād* 或 *dhun*）是语言交流的工具，提供间接知识（Tatlay 1998: Vol. 2 13-16）[^tatlay-1998]。关于显在对象的 *giān*，由此经由书写的字母（*akhar*）或声音与言语（*nād*）获得；二者结合构成有意义的语句（*kathani*），语句再传递 *giān*。*śabad* 或 *nād* 的有形面在脉动、线性的时间（*kāl*）中形成并传递，其知识是推论地认识的，须以 *aql*、*siāṇap*、*sōch*、*vichār*、*khōj*、*bādi* 等常规推理形式辨察（Kaur 1990: 83-95）[^kaur-1990]。
