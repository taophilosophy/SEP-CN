      In *Gursabad Ratnakar Mahan Kosh*, Kahn Singh Nabha explicates the meaning of *matt(i)* as an operation of mind encompassing several overlapping functions. In the broadest sense *matt(i)* refers to a practice and logic encompassing four other essential faculties: *mn*, *buddhī*, *chitt* and *ahamkār* (Nabha 1931: 34, 944). *Mn* is the faculty for concept creation (*sankalp*) and making determinate choices (*vikalap*). The term *buddhi* refers to the faculty of reflection or thought. *Chitt* is a faculty of memory that synthesizes past/present/future. *Ahamkār* is individuation of the type where the self learns to distinguish between itself and other entities (Nabha 1981: 34)[^nabha-1981]. According to Nabha, *matt(i)* is identifiable with *ahamkār*, which involves the process of synthesising the other three into a unified function of individuation and self-making. *Matt(i)* in this sense is essentially linked to practice and the development of technique(s) for self-making by receiving and processing empirical knowledge of one’s milieu through the sense organs (*giān indriān*). By itself *matt(i)* is an unstable faculty that requires shaping through the filters of linguistic, social and cultural conventions which help channel sensory information into pure ego production (*haumai / ahamkāra*). This view finds support in the final section of Japji, where Nanak compares the function of *mat(i)* to an anvil (*ahruṇ*) for fashioning the self with the practical tools of wisdom (*vedu hathiār*) (SGGS: Japji: Pauri 38 8). The tool that actually sculpts the self is *śabad* which works by mediating the contact between consciousness and the external world in a way that avoids the extremes of detachment and attachment to the world.
    step1: |-
      在《古鲁词汇大词典》中，卡恩·辛格·纳巴把 *matt(i)* 解为一种心智运作，涵盖若干交叠的功能。最广义上，*matt(i)* 指一种实践与逻辑，包含另外四种本质官能：*mn*、*buddhī*、*chitt* 与 *ahamkār*（Nabha 1931: 34, 944）。*Mn* 是概念创造（*sankalp*）与作出确定选择（*vikalap*）的官能。*buddhi* 指反思或思想的官能。*Chitt* 是综合过去／现在／未来的记忆官能。*Ahamkār* 是自我学会区分自身与其他实体的那种个体化（Nabha 1981: 34）[^nabha-1981]。按纳巴，*matt(i)* 可与 *ahamkār* 相等同，后者涉及把另外三者综合为个体化与自我成就的统一功能。在此意义上，*matt(i)* 本质上与实践相连，也与自我成就的技术发展相连：它经由感官（*giān indriān*）接受并加工关于自身环境的经验知识。*matt(i)* 本身是一种不稳定的官能，须经语言、社会与文化惯例的过滤来塑造；这些过滤帮助把感官信息导入纯粹的自我生产（*haumai / ahamkāra*）。此说在《贾普吉》末节得到支持：那纳克把 *mat(i)* 的功能比作铁砧（*ahruṇ*），以智慧之工具（*vedu hathiār*）锻造自我（SGGS: Japji: Pauri 38 8）。真正塑造自我的工具是 *śabad*：它中介意识与外部世界的接触，其方式避开了对世界的离执与执取两个极端。
    step2: |-
