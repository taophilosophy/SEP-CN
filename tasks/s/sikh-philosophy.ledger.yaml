      Modernist scholarship in Sikh studies has tended to translate *akāl* in theological terms as a divine attribute: immortality, eternity, immutability (see McLeod 1968: Ch. 5; Jodh Singh 1969)[^mcleod-1968][^singh-1969]. As argued elsewhere, theological interpretations by and large followed trends in Christian thought in reducing *akāl* (infinite, immeasurable, timeless time) to *kāl* (chronological, spatialized, human time). *Akāl* is therefore not an objectifiable mode of time, but an experiential awareness of oneness in which there is no oppositionality, no enmity, no distance between self and other, subject and object. From this perspective, reality is one and many at the same time, and can be ‘known’ only intuitively or affectively.
    step1: |-
      锡克研究中的现代主义学术倾向把 *akāl* 译作神学属性：不朽、永恒、不灭（见 McLeod 1968: Ch. 5; Jodh Singh 1969）[^mcleod-1968][^singh-1969]。如他处所论，神学解释大体沿袭基督教思想之势，把 *akāl*（无限、不可测、无时间的时间）化约为 *kāl*（编年的、空间化的、人的时间）。因此 *akāl* 不是一种可对象化的时间模式，而是一种对太一的经验性觉知：其中没有对立，没有敌意，自我与他者、主体与对象之间没有距离。由此看，实在同时是一与多，只能直觉地或感性地“认识”。
    step2: |-
      锡克研究的现代主义学术惯于把 *akāl* 译作神学属性：不朽、永恒、不灭（见 McLeod 1968: Ch. 5; Jodh Singh 1969）[^mcleod-1968][^singh-1969]。如他处所论，这类神学解释大体沿袭基督教思想之势，把 *akāl*（无限、不可测、无时间的时间）化约为 *kāl*（编年、空间化的人的时间）。*akāl* 因此不是可对象化的时间模式，而是一种对太一的经验性觉知：其中无对立，无敌意，自我与他者、主体与对象之间没有距离。由此看，实在同时是一与多，只能凭直觉或感受去“认识”。
