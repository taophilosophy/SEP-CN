      This is a narratological genre depicting the lives of Sikh Gurus, especially Nanak. The earliest *janamsākhī* texts can be dated to around 1658 and different cycles evolved into the mid-seventeenth century. As a genre it is more commonly associated with devotional piety than philosophical thought because of its hagiographical style. However, recent research on this genre shows that this view requires rectification as the *janamsākhī* weave in verses from *gurbanī* into their life-narratives, the aim being to harness emotion and affect to extract moral concepts of *gurmat* in order to contextualize them within human life (Grewal 2023: 68)[^grewal-2023]. In this way, *janamsākhī* also provide important clues about the motivational impulses behind Nanak’s engagement with the world and the nature of self-transformation that is central to his writings.
    step1: |-
      这是一种叙述体文类，记述锡克古鲁（尤其是那纳克）的生平。最早的 *janamsākhī* 文本可定年至 1658 年前后，不同的传本系列一直演变到 17 世纪中叶。由于带有圣徒传风格，这一文类通常更多与虔敬信仰而非哲学思想相联系。然而，晚近对这一文类的研究表明，此看法需要修正：*janamsākhī* 把 *gurbanī* 的诗句织入生平叙事，意在借情感与感发来提取 *gurmat* 的道德概念，使之在人类生活中获得语境（Grewal 2023: 68）[^grewal-2023]。由此，*janamsākhī* 也为理解那纳克介入世界的动机冲动、以及其著述核心的自我转化之性质，提供了重要线索。
    step2: |-
      这一文类以叙事体记述锡克古鲁（尤其那纳克）的生平。最早的 *janamsākhī* 可定年至 1658 年前后，各传本系列演变至 17 世纪中叶。因带圣徒传色彩，它通常更多与虔敬信仰相连，而非哲学思想。但晚近研究表明此说须修正：*janamsākhī* 把 *gurbanī* 的诗句织入生平叙事，意在借情感与感发提取 *gurmat* 的道德概念，使之落回人类生活的语境（Grewal 2023: 68）[^grewal-2023]。由此，*janamsākhī* 也为理解那纳克介入世界的动机，以及其著述核心的自我转化，提供了重要线索。
