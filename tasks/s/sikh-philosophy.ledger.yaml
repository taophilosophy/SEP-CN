      [^note-3]: My use of the term ‘anti-doctrinal doctrine’ serves to complicate the facile rendering of the category of *gurmat* both as ‘doctrine’ and as equivalent to ‘Sikh philosophy’. Two points need to be noted here. First, neither *gurmat* nor ‘Sikh philosophy’ are reducible to doctrine as such, particularly if doctrine is conceived either in the theological or secular humanist sense. As argued in sections 2 and 3, the underpinning logic of *gurmat* is dynamic with a proclivity for adapting to different milieus rather than being a static once-and-for-all worldview. This dynamic and adaptive tendency of *gurmat* stems from the fact that it nature is *siddhant(ic)* which, in the Sikh context, refers to a logic, teaching or way of life that simultaneously encompasses the ability to experiment with practical techniques according to different milieus, and a conceptuality that combines different forms of reasoning with intuition . Thus, while it may be the case that at certain periods in certain periods and historical contexts *gurmat* gives the impression of ‘orthodoxy’, or ‘doctrine’ (see section-2 below), because the underpinning logic of *gurmat* is geared towards creative individuation deriving from the vibrational-rhythmic ontology of *śabad*/*nām* which in turn enables Sikh thinkers and practitioners to synthesize new and productive connections within changing contexts. From this perspective, and as outlined in section-3, the modern category ‘Sikh philosophy’ cannot be reduced to doctrine or to ideology because its core impulse derives from the vibrational ontology of *śabad* and *nām* rather than a static worldview.
    step1: |-
      [^note-3]: 我使用“反教义的教义”一词，是为了让 *gurmat* 这个范畴的两种轻易译法——既作“教义”又等同于“锡克哲学”——变得复杂起来。这里须注意两点。第一，*gurmat* 与“锡克哲学”都不能化约为严格意义的教义，尤其当教义按神学或世俗人文主义的方式被构想时。如第 2、3 节所论，*gurmat* 的底层逻辑是动态的，倾向于适应不同环境，而非一劳永逸的静态世界观。*gurmat* 的这种动态与适应倾向，源于其本性是 *siddhant(ic)* 的：在锡克语境中，这指一种逻辑、教说或生活方式，它同时包含按不同环境试验实践技术的能力，以及把不同推理形式与直觉相结合的概念性。因此，尽管在某些时期与历史语境中，*gurmat* 会给人“正统”或“教义”的印象（见下文第 2 节），其底层逻辑却指向创造性的个体化——它出自 *śabad*／*nām* 的振动—节奏存在论，后者又使锡克思想家与修行者能够在变动语境中综合出新的、富有生产力的连接。由此看，且如第 3 节所述，现代范畴“锡克哲学”不能化约为教义或意识形态，因为其核心冲动源自 *śabad* 与 *nām* 的振动存在论，而非静态世界观。
    step2: |-
      [^note-3]: 用“反教义的教义”一词，是要让 *gurmat* 这个范畴的两种轻易译法——既作“教义”又等同于“锡克哲学”——变得复杂。这里须注意两点。其一，*gurmat* 与“锡克哲学”都不能化约为严格意义的教义，尤其当教义按神学或世俗人文主义方式被构想时。如第 2、3 节所论，*gurmat* 的底层逻辑是动态的，倾向适应不同环境，而非一劳永逸的静态世界观。这一动态与适应的倾向，源于 *gurmat* 的本性是 *siddhant(ic)* 的：在锡克语境中，它指一种逻辑、教说或生活方式，同时兼具按环境试验实践技术的能力，以及把不同推理形式与直觉相结合的概念性。因此，尽管在某些时期与历史语境中 *gurmat* 会给人“正统”“教义”的印象（见下文第 2 节），其底层逻辑仍指向创造性的个体化——出自 *śabad*／*nām* 的振动—节奏存在论，这使锡克思想家与修行者能在变动语境中综合出新的、富有生产力的连接。由此，且如第 3 节所述，现代范畴“锡克哲学”不能化约为教义或意识形态：其核心冲动源自 *śabad* 与 *nām* 的振动存在论，而非静态世界观。
