      If *mn* is the faculty that receives sensory-impressions and organises them into percepts and concepts, *buddhī* works through the interiorizing function (*antahkaran*) (Nabha 1931: 113, 948) to determine the nature of percepts and concepts, categorising them, and ultimately, welding them into concepts. The role of *buddhī* “is to bring about certainty and definitiveness in knowledge. Definitive apprehension might spur action. Thus it is *buddhī* which resolves to act and then guides the ensuing action” (Neki 1986 Vol. 1: 405)[^neki-1986]. Thus, *buddhī* corresponds to the higher, non-reflective aspect of *mn*, which judges, discriminates and discerns contents presented to *mn* in the form of concepts (*sankalap*) which are then deployed by the self for practical purposes that might include, for example, carrying out an activity, or thinking in general. In this way, *buddhi* effectively determines the individual’s conceptual world view, the nature of a person’s thought, speech and actions. Responsible for the self’s day-to-day functioning, *buddhi* can develop different orientations. On the one hand, it can develop into ego-centric thought and action (*hau-buddhi*), leading to the *manmukh* state.[^note-15] On the other hand, if it can become attuned to *śabdic* rhythms and *nām* vibration, *buddhi* can transform or evolve into enlightened self-awareness, also known as *bibek buddhi*.[^note-16] To realise this transformation, however, *buddhi* has to struggle with the so-called five demons (*panj dutt*) which steal the individual’s mental well-being. Kabir further emphasises that *buddhi* undergoes a climactic transformation into a self-luminous mode of knowing-being (*suddhi*), which translates literally as perfection or becoming pure.[^note-17] This transformation describes the process whereby the self returns to its ground-state, a natural and spontaneous psychic state called *sahaj avasth*ā, where the unity of *giān* can be realised (Nirbhai Singh 1990: 186)[^singh-1990].
    step1: |-
      如果说 *mn* 是接受感官印象并将其组织为知觉与概念的官能，那么 *buddhī* 则经由内化功能（*antahkaran*）运作（Nabha 1931: 113, 948），以确定知觉与概念的本性，对之加以范畴化，最终把它们熔铸为概念。*buddhī* 的作用“是使知识获得确定性与决定性。决定性的把握可能激发行动。因此，正是 *buddhī* 决意行动，并引导随后的行动”（Neki 1986 Vol. 1: 405）[^neki-1986]。因此，*buddhī* 对应于 *mn* 较高的、非反思的方面：它判断、辨别并辨察以概念（*sankalap*）形式呈现给 *mn* 的内容，这些概念随后被自我用于实践目的，例如开展一项活动，或一般地思考。这样，*buddhi* 实际上决定了个体的概念世界观，决定了一个人思想、言语与行动的本性。*buddhi* 负责自我的日常运作，可发展出不同取向。一方面，它可发展为自我中心的思维与行动（*hau-buddhi*），导致 *manmukh* 状态。[^note-15] 另一方面，若它能调准于 *śabdic* 节奏与 *nām* 振动，*buddhi* 便可转变或进化为开悟的自我意识，亦称 *bibek buddhi*。[^note-16] 然而，要实现这一转变，*buddhi* 须与所谓“五魔”（*panj dutt*）搏斗——它们窃取个体的精神福祉。卡比尔进一步强调，*buddhi* 经历一次顶点式的转变，成为自明的知—在模式（*suddhi*），其字面义为完善或变得纯净。[^note-17] 这一转变描述自我回归其基态的过程：一种自然、自发的心灵状态，称为 *sahaj avasth*ā，在此可以实现 *giān* 的统一（Nirbhai Singh 1990: 186）[^singh-1990]。
    step2: |-
      若说 *mn* 是接受感官印象、整理成知觉与概念的官能，那么 *buddhī* 便经由内化功能（*antahkaran*）运作（Nabha 1931: 113, 948），以判定知觉与概念的本性，为之范畴化，最终熔铸为概念。*buddhī* 的作用“是让知识获得确定性与决定性。决定性的把握可激发行动；故决意行动、并引导后续行动者，正是 *buddhī*”（Neki 1986 Vol. 1: 405）[^neki-1986]。因此 *buddhī* 对应 *mn* 较高而非反思的一面：它判断、辨别、辨察以概念（*sankalap*）形式呈现给 *mn* 的内容，这些概念随后被自我派作实践之用，如开展一项活动，或一般地思考。*buddhi* 由此实际决定个体的概念世界观，决定一个人思想、言语、行动的本性。它掌管自我的日常运作，可发展出不同取向：一方面可化为自我中心的思维与行动（*hau-buddhi*），导致 *manmukh* 状态；[^note-15] 另一方面，若能调准于 *śabdic* 节奏与 *nām* 振动，它便可转变为开悟的自我意识，亦称 *bibek buddhi*。[^note-16] 但要实现这一转变，*buddhi* 须与所谓“五魔”（*panj dutt*）搏斗——它们窃取个体的精神福祉。卡比尔进一步强调，*buddhi* 会经一次顶点式转变，成为自明的知—在模式（*suddhi*），字面义即完善、变得纯净。[^note-17] 这一转变描述自我回归基态的过程：一种自然自发的心灵状态，称 *sahaj avasth*ā，*giān* 的统一可在此实现（Nirbhai Singh 1990: 186）[^singh-1990]。
