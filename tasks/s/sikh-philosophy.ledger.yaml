      Inscribed into all life, *hukam* is the imperative to negate the ego, which says ‘I am’. If left untended, the sense of ‘I am’-ness becomes a disease engendered by the five propensities also referred to as the ‘five enemies’ or ‘five thieves’: (i) *kām* (concupiscence, lust or simply craving), (ii) *krōdh* (anger or wrath), (iii) *lōbh* (covetousness or the desire to possess what belongs to others), (iv) *mōh* (attachment or delusion) and (v) *ahankār* (egotistical pride) (Avtar Singh 1983: 53)[^singh-1983]. These ‘five enemies’ are psychic propensities of the self that either attract the person towards something (for example, an object or an action) or repel the person away from what is wholesome. They are not biological or primitive urges or instincts but learned dispositions or habitual frames of mind that can take on a life of their own. If left unchecked, these propensities keep the individual in a state of restlessness (Jodh Singh 1932: 250-64)[^singh-1932][^singh-1932-2].
    step1: |-
      *hukam* 铭刻于一切生命之中，是“否定说‘我在’的自我”的命令。若任其不管，“我在”之感会变成一种由五种倾向所致的疾病，这五种倾向亦称“五敌”或“五贼”：(i) *kām*（欲念、色欲，或径称贪求）；(ii) *krōdh*（愤怒、暴怒）；(iii) *lōbh*（贪财，或欲占有他人之物）；(iv) *mōh*（执取或迷妄）；(v) *ahankār*（自我傲慢）（Avtar Singh 1983: 53）[^singh-1983]。这“五敌”是自我的心灵倾向：它们或把人吸引向某物（如一个对象或一种行动），或把人推离有益之物。它们不是生物的或原始的冲动本能，而是习得的禀性或习惯性的心态，可以自行其是、自成一格。若不加约束，这些倾向使个体处于不安状态（Jodh Singh 1932: 250-64）[^singh-1932][^singh-1932-2]。
    step2: |-
      *hukam* 铭刻于一切生命，是“否定说‘我在’之自我”的命令。若放任不管，“我在”之感便成一种由五种倾向所致的病，五者亦称“五敌”“五贼”：*kām*（欲念、色欲，或径称贪求）、*krōdh*（愤怒、暴怒）、*lōbh*（贪财，或欲占有他人之物）、*mōh*（执取或迷妄）、*ahankār*（自我傲慢）（Avtar Singh 1983: 53）[^singh-1983]。这“五敌”是自我的心灵倾向：或把人吸向某物（一个对象、一种行动），或把人推离有益之物。它们不是生物的、原始的本能冲动，而是习得的禀性或习惯性心态，可自成一格。若不加约束，这些倾向便使个体陷于不安（Jodh Singh 1932: 250-64）[^singh-1932][^singh-1932-2]。
