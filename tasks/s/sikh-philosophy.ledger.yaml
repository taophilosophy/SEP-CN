      显著的例外是乔德·辛格的《古鲁教法决断》。它篇幅精炼（单卷本，不同于辛格大会其他多卷之作）、组织概念化、图式化（其余著作是直接的文本注疏）、文风平易（读来如公开讲演的记录），故可视为 20 世纪后半叶陆续出现的、真正哲学性的锡克哲学著作之原型。《古鲁教法决断》最惹眼的是其宽泛的图式安排：它似乎径直移植了康德式“上帝—世界—人”的存在神论图式来安排主要章节：（第 1 章）上帝（*akāl purakh*）、（第 2 章）世界（*sristī rachnā*）、（第 3 章）人（*manukh*）、（第 4 章）古鲁（*Guru*）……（第 9 章）圣言（*śabad*）……（巴伊·乔德·辛格 1932）[^singh-1932][^singh-1932-2]。第一章实质是一个扩展论证：必须把上帝的存在理解为一个静止不变的“太一”。论证的枢纽，在于证明太一的超越性——这使他不但在前几章复制了上帝／世界／人的智识分离，到第 14 章讨论共同体本性时，还能把本体论分离用作确立“锡克世界观／非锡克世界观”认识论区分的基础（Mandair 2022, 38）[^mandair-2022]。在许多方面，《古鲁教法决断》是通向下一代锡克思想家的桥梁，尤其对用英文写作的人——更确切说，对那些借其平易图式、把现代化阐释的 *gurmat* 落实为“锡克哲学”的学者而言。换句话说，正是这座桥制造了一种表象：从 *gurmat* 到“锡克哲学”的意义通行无阻、忠实可靠，一如塔拉勒·阿萨德所谓“世俗翻译”（Asad 2018）[^asad-2018]——仿佛二者全然相同。
