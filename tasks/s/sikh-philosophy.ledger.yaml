      The answer, according to Nanak, lies in the way that our ego has been structured and conditioned by society since birth, but especially since the acquisition of language.[^note-9] This social-symbolic conditioning limits the function and potential of the ego by impelling it to separate itself from itself, through a mode of individuation that takes identity as the condition for difference. In other words, its sense of reality begins with self-affirmation (*haumai*: lit. I am myself) that fundamentally denies its own otherness. The functionality of *haumai* has been understood in various ways in recent works of Sikh philosophy. Nirbhai Singh interprets *haumai* negatively as the “evil of individuation” (Nirbhai Singh 1990: 158)[^singh-1990]. In Gurnam Kaur’s treatment, *haumai* stems from the disease or a poison stemming ultimately from ignorance. However, Sher Singh reads *haumai* as the “cause of our personal individuality”, yet the individual self is no more than a “temporary partition caused by our individualism” (Sher Singh 1944: 227-229)[^singh-1944]. As a “partitioning element” *haumai* may be a disease, an obstacle to the yearning within us to become one with *nām*, but at the same time, Sher Singh also highlights Nanak’s own refusal to denounce *haumai* as simply negative. For Nanak, the cure to *haumai* lies within *haumai* itself, suggesting that individuation is a more complex process in which self-making has be balanced with self-unmaking. A more helpful way to think about the mechanism of individuation proper to *haumai* is to regard it as a psychic entity that becomes stuck in a recursive feedback loop that generates self-sameness or identity shorn of difference. From within the limited *kāl*-centric time-frame that we inhabit, we are conditioned in such a way as to create a split within the field of consciousness by jettisoning what we deem to be not-self or other. This conventional form of individuation (*manmukh* = mind-facing individuality), which we believe constitutes normality, can interact with the world, with other selves, only via the split or oppositional binary. From here on, what the conventional self understands as oneness is actually a form of individuation based on a drive toward self-identity.
    step1: |-
      那纳克的回答是：症结在于我们的自我（ego）自出生以来——尤其是习得语言以来——被社会结构化与条件化的方式。[^note-9] 这种社会—符号条件化限制了自我的功能与潜能：它迫使自我与自身分离，采用一种以同一为差异之条件的个体化模式。换言之，其现实感始于自我肯定（*haumai*：字面义“我即我自己”），而后者从根本上否认自身的他者性。晚近锡克哲学著作对 *haumai* 的功能有不同理解。尼尔拜·辛格负面地把 *haumai* 解释为“个体化之恶”（Nirbhai Singh 1990: 158）[^singh-1990]。在古尔南·考尔的处理中，*haumai* 是一种疾病，或最终源自无明的毒。而谢尔·辛格把 *haumai* 读作“我们个人个体性之原因”，但个体自我不过是“我们的个体主义造成的一个临时隔间”（Sher Singh 1944: 227-229）[^singh-1944]。作为“分隔要素”，*haumai* 可以是一种疾病、一种障碍，阻碍我们渴望与 *nām* 合一；但同时，谢尔·辛格也强调那纳克本人拒绝把 *haumai* 斥为单纯的否定之物。对那纳克而言，*haumai* 的药方就在 *haumai* 自身之中——这提示个体化是一个更复杂的过程：自我的成就必须与自我的消解相平衡。思考 *haumai* 所固有个体化机制的更有益方式，是把它视为一个陷入递归反馈回路的心灵实体：该回路生成无差异的自我同一或同一性。从我们栖居的、以 *kāl* 为中心的时间框架内部，我们被条件化为：在意识场中制造分裂，把我们认为非我或他者的东西抛出去。这种常规的个体化（*manmukh*＝面朝心智的个体性）——我们相信它构成常态——只能经由分裂或对立二元与世界、与其他自我互动。从这里开始，常规自我所理解的太一，实际上是一种以自我同一之驱力为基础的个体化形式。
    step2: |-
