      However, the more important aspect of *śabad* is vested in its incorporeal or vibrational aspect. Through different techniques and stages of meditative practice *śabad* is internalized and transformed into its incorporeal aspect, referred to in *gurbanī* as *anhad śabad* or *anhad nād*. The qualifying term *anhad* refers to unpulsed word/sound/vibration that cannot be measured because its vibrational frequency goes beyond the limits of conventional linear time and rational comprehension (Tatlay 1998: 183)[^tatlay-1998]. The transition from the corporeal, pulsed, limited (*hadh*) to incorporeal, unpulsed, unlimited (*anhad*) takes place through an internal event, a process which ruptures the boundaries or limits of the ego, also referred to as the killing of ego (*haumai māraṇā*) or simply ego-death.
    step1: |-
      不过，*śabad* 更重要的方面系于其无形或振动的一面。经由冥想修习的不同技术与阶段，*śabad* 被内化并转变为它的无形面，即 *gurbanī* 所谓 *anhad śabad* 或 *anhad nād*。限定词 *anhad* 指“无脉动的言／声／振动”：其振动频率超出常规线性时间与理性理解的界限，因而不可测度（Tatlay 1998: 183）[^tatlay-1998]。从有形、脉动、有界限者（*hadh*）到无形、无脉动、无界限者（*anhad*）的转变，经由一个内部事件发生：这一过程冲破自我的边界或界限，也称为杀死自我（*haumai māraṇā*），或径称自我之死。
    step2: |-
      不过，*śabad* 更要紧的方面在其无形或振动的一面。经由冥想修习的不同技术与阶段，*śabad* 被内化并转为其无形面，即 *gurbanī* 所谓 *anhad śabad* 或 *anhad nād*。限定词 *anhad* 指“无脉动的言／声／振动”：其振动频率超出常规线性时间与理性理解的界限，故不可测度（Tatlay 1998: 183）[^tatlay-1998]。从有形、脉动、有界限者（*hadh*）到无形、无脉动、无界限者（*anhad*），这一转变经由一个内部事件发生：它冲破自我边界，也称杀死自我（*haumai māraṇā*），或径称自我之死。
