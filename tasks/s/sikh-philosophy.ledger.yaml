      ### 2.4 *Śabad* and *Nām*
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      In Sikh philosophy, the clearest indication of this psychic transformation of desire is registered through new and creative modes of aesthetic symbolization expressed variously through language and poetics, music, dance and thought. The agent of this transformation is *śabad*, which literally means ‘word’ or ‘language’, but, in the context of Sikh philosophy, refers to any and all kinds of resonant vibration (Himat Singh 1985)[^singh-1985]. According to Himat Singh, vibration or resonance refers to the work done by *śabad* to enfold the experience in vitality and the expression-in-vitality”. In other words *śabad* provides an ontology of vibration that enables the self to simultaneously *experience* the “thing-in-action” and at the same time enables expressivity in, and connectivity to, the world, to other selves, beginning with a re-linking of the self to its own self (or individuation). For Himat Singh *śabad* is a “trans-aesthetic” tool par excellence which closes the split introduced by conventional social symbolization. Though rarely considered in this way, the idea of resonant vibration offers insight into the practical ends of Sikh thought, namely, the achievement of liberation in the stream of life (*jivanmukti*), which in fact is simply a way of saying that the event of ego transformation described above liberates the self not from the self, or from the world, but rather liberates it to make new and more creative connections to the world (Himat Singh 1985)[^singh-1985]. The key point to remember here is that *śabad* exerts an impersonal, unmediated agency, one that does not arise from a humanly engendered mediation, but rather arises spontaneously when individuals follow the imperative (*hukam*) within all existence and all non-existence and in all life. The imperative (*hukam*) can be tapped when the self dies to the word, in other words, sacrifices itself to the word.
