      #### 3.4.2 *Mn* (Mind/Memory)
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      An ubiquitous term in the *gurmat* lexicon, *mn* refers to the totality of psychic experience before being split in the process of encountering the world. *Mn* is an ‘organ’ that generates duality even as it projects the appearance of unity via personalized self-imagery. *Mn* can be described as an evolute (*jiu*) of five gross elements (*panj tatt*) (Nirbhai Singh 1990)[^singh-1990]. As such *mn* is a dynamic energy (*shakti*) with two opposing tendencies: *dhatu* and *liv*. The *dhatu* tendency attaches mind to materiality, whereas the *liv* tendency orients towards oneness. In practice *mn* fluctuates between these two tendencies giving rise to qualitatively different but overlapping forms of individuation: *manmukh* or ego-mind possessing a reflective dualizing consciousness, and *gurmukh* or non-egoic, non-oppositional consciousness (SGGS: M3 955).
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      Nānak depicts the *dhatu* aspect of *mn* in various ways: *mn-chanchal* lit. clever mind that calculates and discriminates for personal gain; *mn-bhoola*: forgetful or amnesiac mind; *mn-ārshī* mind like a mirror of the world; *mn-mughad*: dull, stupid mind; *mn-maighal*: wavering, unreliable mind; *mn-khutar*: handicapped mind; *mn-pardesī*: mind estranged from its home or mind in its everyday sense of a self that conforms to everyday conventions of which the most pervasive is socially sanctioned language use (*manmukh* speech or simply ego-speech) that generates self-centredness (*haumai*) (Tatlay 1998: Vol. 6 26-35)[^tatlay-1998]. Ever restless, ego-mind is likened to a dull-witted elephant roaming aimlessly through the jungle, constantly seduced by the charms of various plants (representing the social world), always under pressure from death, never able to find its way home. It is afflicted by a chronic sickness the disease of self-attachment (I am myself – *haumai*), and poisons its relations to the world, to things and persons. This aspect of mind that plots, calculates, measures, manipulates, flares up in anger and wallows in negative emotion (Shackle and Mandair 2005: Sect. 4.3, 4.5)[^shackle-2005]. Ego-mind is described as a stranger to itself, always estranged from its true home or natural state. It asserts its existence on the basis of an individuation that fragments and fixes experience by positing an absolute correspondence between its belief in its oneness and its own-ness (its permanence as an I), which itself stems from self-attachment. This correspondence between I-ness and 1-ness, which reproduces itself as an identity, sets the self in opposition to all that is not itself, including, firstly, its own self-difference (I as not-I). Nānak likens this mode of self-relating to delusion (*bharam*) (Tatlay 1998: Vol.5 429-30)[^tatlay-1998]. In short ego-mind is a superficial self that merely conforms to the pressures of socially sanctioned language and a conventional social imaginary.
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      A similar depiction of *mn* as an organ that splits reality into two can be found in the following verse by other contributors to *gurbanī*. For example, Kabir writes *ēhu mn shaktī ēhu mn siu*: this very mind, is both force (*shaktī*) and self-luminosity (*siu*); this very mind subsists in sensory forms (*ehu mn panch tat kō jīu*); attuned to cosmic unity, this very mind resides as no-mind (*ēhu mn le jau unmn rahai*)) (SGGS: Kabir 342). From this state of unity (where *mn* and *un-mn* are the same) this very mind can account for the three worlds (*tau tinī lōk kī bātu kahai*). In other words, the central attribute of mind or consciousness in its natural state, when it is at ‘home’ with itself, is unity. Echoing this view, Guru Amardas, the third ‘Nānak’, writes, in its natural state mind is self-enlightened or self-luminous, it exists between life and death (*eha shaktī sivai ghar āvai, jivdia mari rahai:*) (SGGS: Malar M3 1257). The key characteristic of mind as self-luminous, self-enlightened is also highlighted in the *mūl mantar*, where Nānak uses the word *saibhang* (self-enlightened/self-surveying/self-enjoying). It refers to a state in which mind is directly conscious of itself – hence self-luminous. It needs no mediation; it is not split from itself. Mind possesses itself absolutely and subsists in a state of absolute unity – a unity that is not mediated by an externalising agency such as ego which serves to merely reflect the light. This primordial state mind can be described as immediacy; it has a child-like tendency to merge into a state of oneness in which all anxieties are removed (*gurprasādi ekō jānai cukai moh andesā*) (SGGS: M3 1252).
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      Nanak contrasts the immediacy of this form of consciousness with a very different state of mind, which exists as a purely reflective consciousness, always through mediation of an external agent. This mind is like a bird that constantly flies from its ethereal home (*pankhi akasi*), is subject to delusions (*māyā*), exists in a state of doubt (*bharam*), and becomes unstable (*dhaiā*): *mn mayā mn dhaiā mn pankhi akāsi* (SGGS: M1 1330). In short this is a mind that constantly separates from itself, never possesses itself, never undergoes ‘self-enjoyment’ in its ground-state (*ghar*).
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      Elsewhere in the same texts, Guru Angad (the second ‘Nanak’) comments that to attain its primal state of immediacy, the *mn* must get its energy from within itself, not from outside. Mind, in other words, is self-enlightened; it shines from within and cannot derive its radiance from an external source. In further references, Nanak describes this non-reflective or pure mind as: *mn bairagi* (self-detached mind) or *ghar vasai* (resides in its own home); *mn nirmal* (pure, unsullied mind); *mn churai* …. *mn piara kartar* ……… *mn tu jōt sarūp hai* (celestial mind); or simply beloved mind (*mn har*) (Tatlay 1998: Vol. 6 29-36)[^tatlay-1998]. For this state of mind, Nanak uses imagery overflowing with the emotional intensity of lovers separated from each other in time and place, pining for each other’s embrace. This aspect of the mind is referred to as a state in which lover and beloved, self and other, I and not-I are separated even as they touch and fuse together. Even in the lovers’ tightest embrace, they are forever separating – an allusion to the effect of time, so that one needs to constantly repeat the gesture of fusion-love over and over again to stave off the separating effect of time. Nanak’s term for this aspect of time is *birhā* – a state that is simultaneously painful and blissful, in which separation and union occur at the same time and are felt as the same (Tatlay 1998: Vol. 6 365-7)[^tatlay-1998]. To speak of this paradoxical state, Nanak invokes the intensely painful longing of two lovers pining to be reunited. Though fused as one, yet even in this joined state, their union is tinged with the anticipation of imminent separation (SGGS: 1256). Unlike ego-mind, the mind in the state of *birhā* is described as an immediate and intense experience as opposed to the mediated, reflective and therefore hollow experience of ego-mind. As the references to lover/Beloved illustrate, the immediacy of this experience arises from being in direct touch with feelings experienced as unique each time (pain, pleasure, agony, joy, sadness, bliss). Feelings associated with the lovers’ embrace or separation are never experienced as the same again. Hence the intensity of pain and joy….. What is felt, or how the mind is affected, is a qualitative change that cannot be measured except through one’s aesthetic sensibility. This is why it can only be felt as an intensity but never quantitatively fixed and calculated, because the element in which it takes place is time and life itself. What is slipping away is life as/and time, the time of one’s life, which is my beloved life (*mn jindaṛī*) … As Farid states:
