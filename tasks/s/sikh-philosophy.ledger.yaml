    kind: body
    source: |-
      Sikh philosophy is generally considered to be a distinct tradition of thought-practice indigenous to South Asia that emerged in the fifteenth century from the writings of one of India’s major spiritual figures, Guru Nanak, better known as the founder of the spiritual path known as *sikhī* (lit. the path of learning) or ‘Sikh*ism*’ as it is designated in the modern knowledge system. While not incorrect, such appeals to South Asian indigeneity belie the fact that Sikh philosophy is a composite term first appearing in the context of colonial encounters and through subsequent interactions between categories and concepts of Sikh and Western thought (Mandair 2022: 14)[^mandair-2022]. More specifically, Sikh philosophy emerged as a consequence of, and in relation to, the translation and reconfiguration of a foundational term in Nanak’s teaching, namely, *gurmat* (lit. the logic or teaching of the Guru) into the European knowledge system. It is therefore more helpful to think of Sikh philosophy as an ‘assemblage’ rather than a strictly indigenous thought-form.[^note-1]
    step1: |-
      锡克哲学通常被视为南亚本土的一种独特思想—实践传统，它于 15 世纪从那纳克古鲁（Guru Nanak）的著述中兴起；那纳克是印度重要精神人物之一，更以 *sikhī*（字面义：学习之道）这一精神道路的创立者而知名——在现代知识体系中，这条道路被称作“锡克教”（Sikh*ism*）。这种对南亚本土性的诉求虽不算错，却掩盖了一个事实：锡克哲学是一个复合术语，最早出现于殖民相遇的语境，并在此后锡克思想与西方思想的范畴与概念之间的互动中形成（Mandair 2022: 14）[^mandair-2022]。更具体地说，锡克哲学的产生，源于那纳克教说中的一个奠基性术语——*gurmat*（字面义：古鲁的逻辑或教说）——被译入并重构进欧洲知识体系，且与之相关。因此，把锡克哲学理解为一种“装配体”（assemblage），比理解为严格本土的思想形态更有帮助。[^note-1]
    step2: |-
      锡克哲学通常被视为南亚本土的一种独特思想—实践传统，15 世纪从那纳克古鲁（Guru Nanak）的著述中兴起。那纳克是印度重要的精神人物，更以创立 *sikhī*（字面义：学习之道）这一精神道路闻名——现代知识体系称之为“锡克教”（Sikh*ism*）。这种“南亚本土”之说并不算错，却掩盖了一件事：锡克哲学是个复合术语，最早出现于殖民相遇的语境，此后又在锡克思想与西方思想的范畴、概念互动中形成（Mandair 2022: 14）[^mandair-2022]。更具体说，它是那纳克教说中的奠基术语 *gurmat*（字面义：古鲁的逻辑或教说）被译入欧洲知识体系并受其重构的结果。因此，与其把锡克哲学看作严格本土的思想形态，不如把它理解为一种“装配体”（assemblage）。[^note-1]
  - id: 2
    kind: body
    source: |-
      The fact that the colonial knowledge system initially categorised terms such as *gurmat* or *sikhī* as religion or religious (hence Sikhism), implying that they were lacking in philosophical thought, can be attributed to a combination of secular statecraft and colonial epistemic technology deployed in the governance of colonised populations. An important consequence of classifying *gurmat* as ‘strictly religious’ (McLeod 1998: 12)[^mcleod-1998] was that it legitimated the transfer of political and “epistemic sovereignty” (Hallaq 2018: 98)[^hallaq-2018] from the Sikh lifeworld to the modern Western knowledge system as indigenous categories *sikhī* and *gurmat* were now placed into a colonial cartography of ‘world religions’ whose underpinning logic was characterized by a transcendental metaphysics peculiar to both Christian theology and secular humanist philosophy (Masuzawa 2005; Mandair 2006)[^mandair-2006].
    step1: |-
      殖民知识体系最初把 *gurmat* 或 *sikhī* 这类术语归为“宗教”或“宗教性的”（故有 Sikhism 之称），暗示它们缺乏哲学思想；这可以归因于治理被殖民人口时并用的世俗治国术与殖民认识技术。把 *gurmat* 归为“严格宗教性的”（McLeod 1998: 12）[^mcleod-1998] 有一个重要后果：它使政治主权与“认识主权”（Hallaq 2018: 98）[^hallaq-2018] 从锡克生活世界转移到现代西方知识体系，因为本土范畴 *sikhī* 与 *gurmat* 此时被安置进“世界宗教”的殖民地图，而这张地图的底层逻辑以基督教神学与世俗人文主义哲学所特有的超越形而上学为特征（Masuzawa 2005; Mandair 2006）[^mandair-2006]。
    step2: |-
      殖民知识体系起初把 *gurmat*、*sikhī* 这类术语归入“宗教”或“宗教性的”（故有 Sikhism 之名），暗示其中缺乏哲学思想。这要归因于治理被殖民人口时并用的世俗治国术与殖民认识技术。把 *gurmat* 定为“严格宗教性的”（McLeod 1998: 12）[^mcleod-1998]，有个重要后果：政治主权与“认识主权”（Hallaq 2018: 98）[^hallaq-2018] 由此从锡克生活世界转入现代西方知识体系——本土范畴 *sikhī* 与 *gurmat* 被安置进“世界宗教”的殖民地图，而这张地图的底层逻辑，以基督教神学与世俗人文主义哲学所特有的超越形而上学为特征（Masuzawa 2005; Mandair 2006）[^mandair-2006]。
  - id: 3
    kind: body
    source: |-
      Although Sikh elites internalised this classification of ‘gurmat as religion’ during the late nineteenth and early twentieth centuries, their interpretive efforts nevertheless managed to keep alive indigenous traditions of reflective thought-praxis, such as *gurmat vichār* (lit. contemplative reflection on the concepts and practice of the Guru’s teaching) *gurbanī vichār* (contemplative reflection on the utterances of the Guru), as well as mnemo-praxial techniques such as *nām simaran* (practice of meditating on the primordial vibration or *nām*). By the early decades of the twentieth century Sikh scholars began to recontextualize interpretations of the key Sikh concepts and contemplative practices in relation to the framework of European philosophy. As a result, the two distinct knowledge formations – the Indic ‘gurmat’ and European ‘philosophy’ – were synthesized into a new intellectual discourse known as ‘Sikh Philosophy’ (also referred to as ‘Philosophy of Sikhism’) with a rich and variegated body of literature composed in various languages: English, modern standard Punjabi, pre-modern or classical Punjabi, Persian and Brij.
    step1: |-
      尽管锡克精英在 19 世纪末 20 世纪初内化了“gurmat 即宗教”这一分类，他们的阐释努力仍设法延续了本土的反思性思想—实践传统，如 *gurmat vichār*（字面义：对古鲁教说之概念与实践的沉思反思）、*gurbanī vichār*（对古鲁言辞的沉思反思），以及 *nām simaran*（对原初振动即 *nām* 的冥想修习）一类记忆—实践技术。到 20 世纪最初几十年，锡克学者开始参照欧洲哲学框架，重新语境化对锡克核心概念与沉思修习的阐释。结果，两种不同的知识构成——印度的“gurmat”与欧洲的“哲学”——综合为一种新的智识话语，即“锡克哲学”（亦称“锡克教哲学”）。其文献丰富多样，以英语、现代标准旁遮普语、前现代或古典旁遮普语、波斯语与布拉吉语等多种语言写成。
    step2: |-
      锡克精英在 19 世纪末 20 世纪初虽内化了“gurmat 即宗教”的分类，其阐释努力却仍让本土的反思性思想—实践传统活了下来。*gurmat vichār*（对古鲁教说之概念与实践的沉思反思）、*gurbanī vichār*（对古鲁言辞的沉思反思），以及 *nām simaran*（对原初振动 *nām* 的冥想修习）这类记忆—实践技术皆是。到 20 世纪最初几十年，锡克学者开始参照欧洲哲学框架，重新阐释锡克核心概念与沉思修习。两种知识构成——印度“gurmat”与欧洲“哲学”——于是综合为一种新话语，即“锡克哲学”（亦称“锡克教哲学”）。其文献丰富，以英语、现代标准旁遮普语、前现代（古典）旁遮普语、波斯语与布拉吉语写成。
