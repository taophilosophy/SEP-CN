      Descriptive variations notwithstanding, contemporary Sikh philosophers seem to agree on the following implications of Nanak’s notion of oneness. First, that this oneness does not brook oppositions or dualisms such as one/many, matter/consciousness, form/formlessness, time/timelessness, conditioned/unconditioned, transcendence/immanence, corporeal/incorporeal, finite/infinite, dark/light, good/evil, to name but a few. Second, it follows that this oneness cannot be represented; to represent it is to enter into dualism. To comply with this imperative logic of non-oppositional oneness, Nanak resorts to the language of aesthetics.[^note-8] Indeed, all of Nanak’s compositions and those of his successor Gurus are expressed in poetic form set to musical measures.
    step1: |-
      尽管表述各异，当代锡克哲学家对那纳克太一概念的以下含义似乎有共识。第一，这一太一不容对立或二元，如一／多、物质／意识、形／无形、时间／无时间、有条件／无条件、超越／内在、有身／无身、有限／无限、暗／明、善／恶，仅举其要。第二，由此推出：太一不可表象；表象它即是进入二元。为遵循这种非对立太一的命令式逻辑，那纳克诉诸美学的语言。[^note-8] 事实上，那纳克及其继承古鲁的全部作品，都以配乐调式的诗体写成。
    step2: |-
      表述虽异，当代锡克哲学家对那纳克太一概念似有如下共识。其一，这一太一不容对立或二元：一／多、物质／意识、形／无形、时间／无时间、有条件／无条件、超越／内在、有身／无身、有限／无限、暗／明、善／恶，仅举其要。其二，由此可知太一不可表象——表象它即堕入二元。为遵循这种非对立太一的命令式逻辑，那纳克诉诸美学的语言。[^note-8] 事实上，那纳克及其继承古鲁的全部作品，都以配乐调式的诗体写成。
