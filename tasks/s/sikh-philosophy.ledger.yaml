    source: |-
      Although the absolute primacy of *gurbanī* is attested to by almost all contributing authors to the SGGS, the notion itself is canonised in the writings of Bhai Gurdas (1540-1630 AD), the scribe responsible for producing the first physical copy of the SGGS under the close guidance of Guru Arjan. Bhai Gurdas was a key member of the early Sikh community. His own poetic compositions include the *Vārān, Kabits* and *Swayyas*, which represent the first, and arguably, most authoritative commentary on the SGGS. Composed in lucid style, his main purpose was to interpret the key teachings of the house of Nanak for the early Sikh community. In addition to providing commentary, his compositions develop the first philosophical and theological expositions of Nanak’s key ideas, forging them into a loose but relatively systematic doctrinal interpretation of *gurmat*, which was essential for establishing the patterns of Sikh thought-practice. As a result, Bhai Gurdas’ works are regarded as a key or *kunji* for unlocking the deeper insights of the SGGS and is therefore treated as a primary literature for research in Sikh philosophy (Gill 2016; Grewal 2023: 61-72)[^gill-2016][^grewal-2023].
    step1: |-
      尽管 *gurbanī* 的绝对首要性几乎得到 SGGS 所有作者的印证，这一观念本身却是在巴伊·古尔达斯（Bhai Gurdas，公元 1540–1630）的著作中被正典化的。古尔达斯是在阿尔詹古鲁密切指导下制作 SGGS 第一部实体抄本的书记。他是早期锡克社群的关键成员。他自己的诗作包括《瓦兰》《卡比特》与《斯瓦亚》，它们是对 SGGS 最早、也堪称最具权威的注释。其作风格清朗，主要目的是为早期锡克社群阐释那纳克之家的核心教说。除注释之外，他的作品还对那纳克的核心观念作了最早的哲学与神学阐发，把它们熔铸为对 *gurmat* 的一种松散却相对系统的教义解释——这对确立锡克思想—实践的范式至关重要。因此，巴伊·古尔达斯的作品被视为开启 SGGS 深层洞见的钥匙（*kunji*），也被当作锡克哲学研究的一手文献（Gill 2016; Grewal 2023: 61-72）[^gill-2016][^grewal-2023]。
    step2: |-
      尽管 SGGS 几乎所有作者都印证了 *gurbanī* 的绝对首要性，这一观念却是在巴伊·古尔达斯（Bhai Gurdas，1540–1630）的著作中被正典化的。古尔达斯正是奉阿尔詹古鲁之命、在其密切指导下制作 SGGS 第一部实体抄本的书记，也是早期锡克社群的关键成员。他的诗作包括《瓦兰》《卡比特》《斯瓦亚》，是对 SGGS 最早、也可谓最具权威的注释。其文风清朗，主旨是为早期锡克社群阐释那纳克之家的核心教说。除注释外，他还最早对那纳克的核心观念作了哲学与神学阐发，把这些观念熔铸为对 *gurmat* 的一种松散却相对系统的教义解释——确立锡克思想—实践范式，此点至关重要。因此，巴伊·古尔达斯之作被视为开启 SGGS 深层洞见的钥匙（*kunji*），也是锡克哲学研究的一手文献（Gill 2016; Grewal 2023: 61-72）[^gill-2016][^grewal-2023]。
