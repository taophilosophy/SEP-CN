      Aesthetics in Sikh philosophy therefore, has less to do with a theory of form or beauty than with sensibility, that is, the degree of sensitivity of an individual to experiencing subject and object, self and world, immediately and as a fundamental unity. For Sher Singh, this fundamental unity is a “feeling-state” which Guru Nanak describes as “*vismād*” or the “aesthetic feeling of wonder” experienced directly as an “enjoyment” of an “indescribable intensity” that can only be tasted (*suād*). Nikky Singh also emphasises taste as a central component to aesthetic in Sikh philosophy (Nikky Singh: 2025). For Himat Singh, this fundamental unity central to the aesthetic is encapsulated by the term *śabad*, which in its explanatory function acts a “trans-aesthetic” principle (Himat Singh: 1985: 203-22; 2025: 15-29)[^singh-1985]. All three of these thinkers appear to agree, however, that aesthetics describes a sensibility in which “the experiencer and experienced is one linked unity” (Sher Singh: 238). It comes back to a oneness that is not quantifiable, but is qualitative, a state of being in which multiplicity is always already fused with oneness from the outset. This non-oppositional logic of the one-many (*ek-anek*) is the axial principle underpinning all existence and non-existence, all matter and consciousness, and therefore all life, in such a way that matter and consciousness are part of a continuum of oneness. Oneness incorporates both simultaneously. To say ‘simultaneously’ suggests a mode of time specific to non-oppositional logic required to experience oneness. It suggests that the difference between the one and the many is not only the same as its identity, but that coexistence of opposites, that is, coexistence of differences, is logically consistent only if we assume that the nature of time is not identical to itself. Which is to say that time cannot be reduced to the passage of identical moments, which, in Sikh philosophy, is ordinary or everyday, or time as it is constructed by the human mind – *kāl* (Nirbhai Singh 1990: 113-114; Mandair 2022: 57-59)[^mandair-2022][^singh-1990]. Rather, the true nature of time is more complicated and more usefully considered as an internal proliferation of difference. Time is a constantly ongoing self-differentiation. According to *gurmat*, this infinitely expansive, measureless time, which is untimely in its essence, is referred to as *akāl* (Nirbhai Singh 113-114; Mandair 2022: 55-59, 136-37)[^mandair-2022].
    step1: |-
      因此，锡克哲学中的美学，与其说关乎形式或美的理论，不如说关乎感受力：即个体对经验主体与对象、自我与世界——直接地、作为根本统一体——的敏感程度。在谢尔·辛格看来，这一根本统一体是一种“感受状态”，那纳克古鲁称之为 *vismād*，即“惊异的美感”——被直接经验为对一种“不可言喻的强度”的“享受”，这种强度只能被“品尝”（*suād*）。尼基·辛格同样强调“味”是锡克哲学美学的核心成分（Nikky Singh: 2025）。在希马特·辛格看来，美学所系的这一根本统一体，由 *śabad* 一词概括；其在解释功能上充当一种“超美学”原则（Himat Singh: 1985: 203-22; 2025: 15-29）[^singh-1985]。不过，这三位思想家似乎都同意：美学描述的是这样一种感受力——“经验者与被经验者是一个相连的统一体”（Sher Singh: 238）。它回到一种不可量化、只能定性的太一：一种多自始即已与太一融合的存在状态。这种一多（*ek-anek*）的非对立逻辑，是一切存在与非存在、一切物质与意识、因而一切生命所系的轴心原则；物质与意识由此成为太一连续体的一部分。太一同时涵纳二者。说“同时”，便暗示一种时间模式——它是经验太一所要求的非对立逻辑所特有的时间。它暗示：一与多之间的差异不仅同一于其同一性，而且对立的共存——即差异的共存——只在假设时间之本性不与自身同一时才逻辑上自洽。也就是说，时间不能还原为诸相同时刻的相继；在锡克哲学中，那是寻常的、日常的时间，即人类心智构造的时间——*kāl*（Nirbhai Singh 1990: 113-114; Mandair 2022: 57-59）[^mandair-2022][^singh-1990]。毋宁说，时间的真正本性更为复杂，更宜看作一种差异的内在增殖。时间是一场不断的自我分化。按 *gurmat* 之说，这种无限展开、无法测度、本质上不合时宜的时间，称为 *akāl*（Nirbhai Singh 113-114; Mandair 2022: 55-59, 136-37）[^mandair-2022]。
    step2: |-
      因此，锡克哲学的美学，与其说关乎形式或美的理论，不如说关乎感受力：即个体对经验主体与对象、自我与世界——直接地、作为根本统一体——的敏感程度。谢尔·辛格认为，这一根本统一体是一种“感受状态”，那纳克古鲁称之为 *vismād*，即“惊异的美感”：人直接经验它为对一种“不可言喻的强度”的“享受”，而这种强度只能去“品尝”（*suād*）。尼基·辛格同样强调“味”是锡克哲学美学的核心成分（Nikky Singh: 2025）。希马特·辛格则认为，美学所系的这一根本统一体由 *śabad* 一词概括：它在解释功能上充当“超美学”原则（Himat Singh: 1985: 203-22; 2025: 15-29）[^singh-1985]。不过三家似乎都同意：美学描述的是这样一种感受力——“经验者与被经验者是一个相连的统一体”（Sher Singh: 238）。它回到一种不可量化、只能定性的太一：多自始即已与太一融合的存在状态。这种一多（*ek-anek*）的非对立逻辑，是一切存在与非存在、一切物质与意识、因而一切生命所系的轴心原则；物质与意识由此同属太一的连续体，太一同时涵纳二者。说“同时”，便暗示一种时间模式——经验太一所要求的非对立逻辑所特有的时间。它暗示：一与多的差异不仅同一于其同一性，而且对立的共存（即差异的共存）只有在假设时间之本性不与自身同一时才逻辑自洽。也就是说，时间不能还原为诸相同时刻的相继；在锡克哲学中，那类时间是人心的寻常构造——日常时间 *kāl*（Nirbhai Singh 1990: 113-114; Mandair 2022: 57-59）[^mandair-2022][^singh-1990]。毋宁说，时间的真正本性更为复杂，更宜视为差异的内在增殖：时间是一场不断的自我分化。按 *gurmat* 之说，这种无限展开、无法测度、本质上不合时宜的时间，称为 *akāl*（Nirbhai Singh 113-114; Mandair 2022: 55-59, 136-37）[^mandair-2022]。
