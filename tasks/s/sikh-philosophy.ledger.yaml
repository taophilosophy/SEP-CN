      Nānak depicts the *dhatu* aspect of *mn* in various ways: *mn-chanchal* lit. clever mind that calculates and discriminates for personal gain; *mn-bhoola*: forgetful or amnesiac mind; *mn-ārshī* mind like a mirror of the world; *mn-mughad*: dull, stupid mind; *mn-maighal*: wavering, unreliable mind; *mn-khutar*: handicapped mind; *mn-pardesī*: mind estranged from its home or mind in its everyday sense of a self that conforms to everyday conventions of which the most pervasive is socially sanctioned language use (*manmukh* speech or simply ego-speech) that generates self-centredness (*haumai*) (Tatlay 1998: Vol. 6 26-35)[^tatlay-1998]. Ever restless, ego-mind is likened to a dull-witted elephant roaming aimlessly through the jungle, constantly seduced by the charms of various plants (representing the social world), always under pressure from death, never able to find its way home. It is afflicted by a chronic sickness the disease of self-attachment (I am myself – *haumai*), and poisons its relations to the world, to things and persons. This aspect of mind that plots, calculates, measures, manipulates, flares up in anger and wallows in negative emotion (Shackle and Mandair 2005: Sect. 4.3, 4.5)[^shackle-2005]. Ego-mind is described as a stranger to itself, always estranged from its true home or natural state. It asserts its existence on the basis of an individuation that fragments and fixes experience by positing an absolute correspondence between its belief in its oneness and its own-ness (its permanence as an I), which itself stems from self-attachment. This correspondence between I-ness and 1-ness, which reproduces itself as an identity, sets the self in opposition to all that is not itself, including, firstly, its own self-difference (I as not-I). Nānak likens this mode of self-relating to delusion (*bharam*) (Tatlay 1998: Vol.5 429-30)[^tatlay-1998]. In short ego-mind is a superficial self that merely conforms to the pressures of socially sanctioned language and a conventional social imaginary.
    step1: |-
      那纳克以多种方式描绘 *mn* 的 *dhatu* 面向：*mn-chanchal*，字面义“机巧的心智”，为私利而算计与判别；*mn-bhoola*：健忘或失忆的心智；*mn-ārshī*：如世界之镜的心智；*mn-mughad*：迟钝愚蠢的心智；*mn-maighal*：摇摆不可靠的心智；*mn-khutar*：有残疾的心智；*mn-pardesī*：疏离其家园的心智，或日常意义上的心智——一个服从日常惯例的自我，其中最普遍的惯例是社会认可的语言使用（*manmukh* 言语，或径称自我言语），它生成自我中心（*haumai*）（Tatlay 1998: Vol. 6 26-35）[^tatlay-1998]。自我的心智永不安宁，被比作一头迟钝的大象在丛林里盲目游荡：不断被各种植物（代表社会世界）的魅力所诱，始终处在死亡的压力之下，永远找不到回家的路。它受一种慢性病的折磨——自我执取之病（我即我自己——*haumai*），并毒害它同世界、同事物与人的关系。心智的这一面向精于盘算、算计、衡量、操纵，动辄发怒，沉溺于负面情绪（Shackle and Mandair 2005: Sect. 4.3, 4.5）[^shackle-2005]。自我的心智被描述为自身的陌生人，永远疏离于其真正的家或本然状态。它依据一种个体化来断言自己的存在：该个体化把经验碎裂并固定下来，办法是在“它相信自己的太一”与“它自己的属己性（它作为‘我’的恒常性）”之间设定绝对对应；而这种对应本身出自自我执取。这种“我性”与“一性”之间的对应，把自己再生产为一种同一性，从而使自我与一切非自身者对立——首先是与自身的自我差异（我作为非我）对立。那纳克把这种自我关联模式比作迷妄（*bharam*）（Tatlay 1998: Vol.5 429-30）[^tatlay-1998]。简言之，自我的心智是一个肤浅的自我，只服从社会认可的语言，以及常规社会想象的压力。
    step2: |-
