      4.1 Sources of *giān*: In the *gurmat* system, the function of epistemology is encompassed by the term *giān*, a Punjabi cognate of the Sanskrit term *jñāna*. *Giān* signifies not only the nature of knowledge, its direct or mediated attainment through intuition (*anubhāva* or *anubhau prakash*) and perception/reasoning respectively, but equally its modes of operation vis-à-vis practice/discipline, thought and faculties (Sher Singh 1944: 152)[^singh-1944]. Between direct unmediated knowledge attained through intuition and referred to as *tat giān* (pure knowing), and mediated knowledge (*partakh giān*) gained through perception and intellect, there is no strict hierarchy or qualitative difference (Nirbhai Singh 1990: 169)[^singh-1990]. Any distinction between them lies in the variable attunements towards the fundamental vibration of reality (*nām*) characterised by a state of absolute unity. While some individuals have innate focus (*dhiān*) finely tuned towards attaining *gian* directly, also referred to as *giān dhiān*[^note-10] , the vast majority of individuals must learn to sharpen and perfect their faculties of sense perception and intellection (*vichār*) until perception/senses and the subject become one with the object of knowledge (*giān vichār*).[^note-11] In this way, the epistemology of *gurmat* does not distinguish qualitatively between different sources (*pramāṇas*) of knowledge as does Indian philosophy. That said, Sikh philosophers unanimously agree that the principal source of valid knowledge – the one that innervates others – is *śabad* (Balbir Singh 1972: 27)[^singh-1972].
