      Such references to sacrifice, surrender, and dying are not mere metaphors. In fact, they have a practical counterpart in the performative meditative mnemo-praxis called *nām simaran*, a form of mindful practice that Sikhs are encouraged to imbibe into their daily lives. Although *nām simaran* is often literally translated as remembering or recalling *nām* by repeating the ‘Names of God’, there is a wider sense in which it refers to any process that helps transform the mind’s negative repetition-compulsions into a positive mode of repetition which enables it to actualise (or channel) *nām* within and through the body–mind complex. In Sikh philosophy, the favoured techniques of simaran include vocalised rhythmic repetition and especially singing to the accompaniment of prescribed musical measures (*ragas*). The term *nām* refers to the vibration that underpins the eternal oneness of all existence and non-existence. If this vibration-resonance is indicative of process or becoming exemplified by the opening of subjectivity to the world, the very same process is objectified by theology, which solidifies *nām* into the Name of an eminent deity, e.g. ‘God (Mandair 2022: 52-58)[^mandair-2022]. The meditative mnemo-praxis of *nām simaran* works against this objectifying tendency by symbolically performing a death of the self in the very act of recalling or remembering *nām*. Through this mindful technique, one simultaneously surrenders, annihilates, and converts *haumai* (or individuation as self-attachment) into individuation as other-attachment.
    step1: |-
      这些关于献祭、顺服与死亡的提法并非仅是隐喻。实际上，它们在一种被称为 *nām simaran* 的修行性冥想记忆—实践中有其实践对应物：这是锡克人被鼓励融入日常生活的正念修习。*nām simaran* 虽常被直译为通过重复“神之名”来忆念或回想 *nām*，但它还有更广的含义：指任何能把心灵的负面重复强迫转变为正面重复模式的过程——该模式使心灵得以在身—心复合体之内并经由它来实现（或导引）*nām*。在锡克哲学中，*simaran* 的主要技术包括出声的节奏性重复，尤其是伴随规定音乐调式（*ragas*）的歌唱。*nām* 一词指一切存在与非存在之永恒太一所系的振动。如果说这种振动—共振标志着一种过程或生成——即主体性向世界的敞开——那么同一过程也由神学对象化：神学把 *nām* 固化为一位崇高神祇的“名”，例如“上帝”（Mandair 2022: 52-58）[^mandair-2022]。*nām simaran* 的冥想记忆—实践对抗这种对象化倾向：在忆念 *nām* 的行为本身之中，象征性地实行一次自我的死亡。经由这一正念技术，人同时顺服、消灭并把 *haumai*（作为自我执取的个体化）转化为作为他者执取的个体化。
    step2: |-
      献祭、顺服、死亡云云并非仅是隐喻。它们在一种叫 *nām simaran* 的修行性冥想记忆—实践中有其实践对应物——锡克人被鼓励把这一正念修习融入日常生活。*nām simaran* 常被直译为重复“神之名”以忆念 *nām*。它还有更广的含义：任何能把心灵的负面重复强迫转为正面重复模式的过程——该模式使心灵得以在身—心复合体之内并经由它实现（导引）*nām*。锡克哲学中 *simaran* 的主要技术，包括出声的节奏性重复，尤以伴随规定调式（*ragas*）的歌唱为重。*nām* 指一切存在与非存在之永恒太一所系的振动。若说这种振动—共振标示一种过程或生成——主体性向世界敞开——同一过程也被神学对象化：神学把 *nām* 固化为崇高神祇的“名”，例如“上帝”（Mandair 2022: 52-58）[^mandair-2022]。*nām simaran* 的冥想记忆—实践对抗这种对象化：在忆念 *nām* 的行为本身中，象征性地实行一次自我的死亡。经此正念技术，人同时顺服、消灭 *haumai*（作为自我执取的个体化），并把它转化为作为他者执取的个体化。
