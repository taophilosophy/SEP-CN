      This brings us to the second question. How is oneness to be realised, brought into effect? (SGGS: Japji 1; Avtar Singh 1983)[^singh-1983] Here, Sikh philosophy departs even more radically from humanism. According to Sikh philosophy, the conventional ego needs to be radically transformed. Like other spiritual traditions *gurmat* talks about transforming the conventional self-conscious ego by annihilating it and replacing it with a different psychic structure. References to killing the ego are not merely metaphorical. They refer to the self-effort required to tap into a reservoir of force immanent within life, tapping which it becomes possible to transform conventional processes of ego formation (*haumai*), not by literally killing the ego, but by re-orienting the desire that makes it crave for the contracted egocentric state of consciousness, which society has conditioned us to desire in the first place (see McLeod 1968: Ch. 7; Nikky Singh 2005)[^mcleod-1968][^singh-2005]. This ordinary, socially conditioned state is called *manmukh*. Terms such as ‘annihilation’ or ‘killing’ thus refer to the self-overcoming required to break our attachment to convention. And this self-overcoming is required to shift the axis of desire toward the aspect of the psyche that society forced it to split off and ultimately repress, namely, the non-ego, the outside world, the other, or the infinitely expanded reality of oneness.
