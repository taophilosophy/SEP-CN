      [^note-6]: Cases of causation by omission are cases in which, to put the matter intuitively, the non-occurrence of some event causes an outcome, as when a doctor’s failure to provide medical help causes the death of his patient. In such cases, there is no transfer of energy or momentum from cause to effect and no natural candidate for a connecting process. Some writers (e.g., Dowe 2000)[^dowe-2000] conclude on these grounds that causation by omission is not real or literal causation, although it possesses some features that makes it similar to cases of real causation. If omissions can be causes or figure in causal explanations, this presents an obvious prima facie problem for causal process theories like Salmon’s. Cases of causation by *C* of *E* by double prevention or disconnection are cases in which *C* prevents or interferes with the operation of a second factor *D* which if operative would block the occurrence of *E*. By removing the preventer *D* of *E*, *C* causes *E* to occur. Examples are common in biological contexts—see Schaffer (2000), Woodward (2002), and for more general discussion of this phenomenon, see Hall (2004) and Lewis (2000). Again, if it is accepted that citing a disconnecting cause provides a (scientific) explanation, this is a difficulty for causal process theories, at least as formulated by Salmon.
