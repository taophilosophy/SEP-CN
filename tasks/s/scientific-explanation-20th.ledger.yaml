      In unificationist accounts of explanation developed by philosophers, scientific explanation is a matter of providing a unified account of a range of different phenomena.[^note-9] This idea is unquestionably intuitively appealing. Successful unification may exhibit connections or relationships between phenomena previously thought to be unrelated and this seems to be something that we expect good explanations to do. Moreover, theory unification has clearly played an important role in science. Paradigmatic examples include Newton’s unification of terrestrial and celestial theories of motion and Maxwell’s unification of electricity and magnetism. The key question, however, is whether (and which) intuitive notions of unification can be made more precise in a way that allows us to recover the features that we think that good explanations should possess.
    step1: |-
      在哲学家发展出的统一论解释说明中，科学解释在于对一系列不同现象提供统一的说明。[^note-9] 这一想法无疑在直觉上有吸引力。成功的统一可以显示先前被认为无关的现象之间的联系或关系，而这似乎正是我们对好解释的期待。而且，理论统一显然在科学中起过重要作用。典范例子包括牛顿对地上与天上运动理论的统一，以及麦克斯韦对电与磁的统一。然而关键问题是：统一的直觉概念（以及哪些概念）能否被精确化，其方式能让我们找回我们认为好解释应有的特征。
    step2: |-
      哲学家发展的统一论说明认为：科学解释在于对一系列不同现象给出统一的说明。[^note-9] 此想直觉上颇可取。成功的统一可显出先前被视为无关的现象之间的联系，而这正是我们对好解释的期待。理论统一在科学中的作用亦显而易见：牛顿统一地上与天上的运动理论，麦克斯韦统一电与磁，皆为范例。关键问题却是：统一的直觉概念（以及其中哪些）能否精确化，使我们得以找回好解释应有的特征。
