      ### 7.2 A Single Model of Explanation?
    step1: |-
      ### 7.2 单一的解释模型？
    step2: |-
      ### 7.2 单一的解释模型？
  - id: 158
    kind: body
    source: |-
      All of the accounts surveyed above are “monistic” in the sense that they assume that it is possible to construct a single model of explanation which captures all varieties of this notion and which holds for explanations across the various sciences, as well as (it is often assumed) ordinary life contexts.
    step1: |-
      上文考察的所有说明都是“一元论”的，其含义是：它们假定有可能构造一个单一的解释模型，把握这一概念的所有变种，并适用于各门科学的解释，以及（常被假定）日常生活的语境。
    step2: |-
      上文所考诸说皆“一元”：假定可构造单一解释模型，兼摄此概念诸变体，横贯诸科学之解释，乃至（常被假定）日常生活语境。
  - id: 159
    kind: body
    source: |-
      As noted above, one way in which the attempt to develop a single general model of explanation might fail is that we might conclude that there are causal and non-causal forms of explanation that have little in common. But even putting this possibility aside, another possibility, not well addressed in the accounts surveyed above, is that explanation differs across different areas of science in a way that precludes the development of a single, general model. It is, after all, uncontroversial that explanatory practice—what is accepted as an explanation, how explanatory goals interact with others, what sort of explanatory information is thought to be achievable, discoverable, testable etc.—varies in significant ways across different disciplines. Nonetheless, all of the models of explanation surveyed above are “universalist” in aspiration—they claim that a single, “one size” model of explanation fits all areas of inquiry in so far as these have a legitimate claim to explain. Although the extreme position that explanation in biology or history has nothing interesting in common with explanation in physics seems unappealing, one obvious response to the accounts described above is to develop accounts of explanation that are more sensitive to disciplinary and subject matter differences. Ideally, such models would reveal commonalities across disciplines, but they should also enable us to see why explanatory practice varies as it does across different disciplines and the significance of such variation. For example, biologists, in contrast to physicists, often describe their explanatory goals as the discovery of causal systems that are functional and mechanisms rather than the discovery of laws and in fact a very substantial body of post 2000 work has focused on the elucidation of the concept of a mechanism—again see the entry on causal approaches to scientific explanation.
    step1: |-
      如上所述，发展单一一般解释模型的尝试可能失败的一种方式是：我们可能得出结论：存在几乎无共同之处的因果与非因果解释形式。但即便撇开这种可能，还有一种可能——上文所考察的诸说明未好好处理——是：解释在不同科学领域中彼此不同，其程度排除了单一一般模型的发展。毕竟，无可争议的是：解释实践——什么被接受为解释、解释目标如何与其他目标互动、什么样的解释信息被认为可达成、可发现、可检验等等——在不同学科之间以重要方式变动。尽管如此，上文考察的所有解释模型在志向上一概是“普遍主义”的：它们声称单一、“一刀切”的解释模型适用于一切有其正当解释主张的探究领域。“生物学或历史中的解释与物理学中的解释毫无有趣共同点”这一极端立场似乎不可取，但对上述诸说明的一个显然回应，是发展对学科与题材差异更敏感的解释说明。理想情况下，这类模型会揭示跨学科的共同点，但它们也应使我们能够看出：解释实践为何在不同学科间如此变动，以及这种变动的意义。例如，与物理学家不同，生物学家常把其解释目标描述为发现功能性的因果系统与机制，而非发现律；事实上，2000 年后有一大批工作聚焦于阐明“机制”概念——同样参见「科学解释的因果进路」条目。
    step2: |-
      如上所说，单一一般解释模型可能失败的一种方式是：我们或会断言，存在几乎无共同点的因果与非因果解释。但撇开此点，还有一种可能——上文诸说未及细究：解释在各科学领域间彼此不同，以至于单一一般模型无从建立。毕竟无可争议：解释实践——何者被接受为解释、解释目标如何与其他目标互动、何种解释信息被视为可达成、可发现、可检验——在诸学科间差异显著。然而上文诸说一概以“普遍主义”自期：声称单一“一刀切”模型适用于一切有正当解释主张的探究领域。“生物学或历史中的解释与物理学全无相通之处”这一极端立场固不可取，但一个显然回应是：发展对学科与题材差异更敏感的解释说明。理想者既能显出跨学科共同点，也能说明解释实践为何因学科而异、其异意义何在。例如，与物理学家不同，生物学家常把解释目标说成发现功能性的因果系统与机制，而非发现律；2000 年后确有一大批工作聚焦“机制”概念——仍参见「科学解释的因果进路」条目。
  - id: 160
    kind: body
    source: |-
      A closely related point is that at least some of the models described above impose requirements on explanation that may be satisfiable in some domains of inquiry but are either unachievable (in any practically interesting sense) in other domains or, to the extent that they may be achievable, bear no discernible relationship to generally accepted goals of inquiry in those domains. For example, we noted above that many scientists and philosophers hold that there are few if any laws to be discovered in biology and the social and behavioral sciences. If so, models of explanation that assign a central role to laws may not be very illuminating regarding how explanation works in these disciplines. As another example, even if we suppose that the partition into objectively homogeneous reference classes recommended by the *SR* model is an achievable goal in connection with certain quantum mechanical phenomena, it may be that (as suggested above) it is simply not a goal that can be achieved in a non-trivial way in economics and sociology, disciplines in which causal inference from statistics also figures prominently. In such disciplines, it may be that additional statistically relevant partitions of any population or subpopulation of interest will virtually always be possible, so that the activity of finding such partitions is limited only by the costs of gathering additional information. A similar assessment may hold for most applications of the *CM* model to the social sciences.
    step1: |-
      一个紧密相关的要点是：上文所述诸模型中，至少有一些对解释施加的要求，可能在某些探究领域中可以满足，但在其他领域中无法实现（就任何实践上有意味的意义而言），或者即便可实现，也与这些领域中公认的一般探究目标没有可辨认的关系。例如，上文提到，许多科学家与哲学家认为，生物学与社会科学、行为科学中几乎没有可发现的律。若如此，把律置于中心地位的解释模型，对于这些学科中解释如何运作，可能启发不多。又如，即便我们假定 *SR* 模型所推荐的、客观齐一的参照类划分在特定量子力学现象上是一个可实现的目标，它也可能（如上文所示）根本不是一个能在经济学与社会学中以非平凡方式实现的目标——而这两个学科中，从统计作因果推断同样居于显要地位。在这些学科中，对任何一个感兴趣的总体或子总体作出额外的统计相关划分，可能几乎总是可能的，故寻找这类划分的活动只受收集额外信息之成本的限制。对 *CM* 模型在社会科学中的大多数应用，或许也可作类似评估。
    step2: |-
      密切相关的另一要点：上文诸模型中至少有一些对解释施加的要求，或可在某些领域满足，而在另一些领域无法（就任何实践上有意味的意义）实现；纵或可实现，也与该领域公认探究目标无可辨关系。例如上文说过，许多科学家与哲学家认为生物学与社会科学、行为科学中几乎无可发现之律；若然，以律为中心的解释模型对这些学科中解释如何运作便启发有限。又例如，即便假定 *SR* 模型所荐的客观齐一参照类划分在特定量子现象上是可实现的目标，它也可能（如上文所示）根本无法在经济学与社会学中以非平凡方式实现——而统计因果推断在这两门学科同样居显要。在这些学科中，对任何感兴趣的总体或子总体，额外的统计相关划分几乎总可作出，故寻找划分的活动只受收集额外信息的成本限制。*CM* 模型在社会科学的大多数应用，或可作类似评估。
