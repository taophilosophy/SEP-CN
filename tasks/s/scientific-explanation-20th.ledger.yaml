      ## 1 背景与导论
  - id: 4
    kind: body
    source: |-
      As will become apparent, “scientific explanation” is a topic that raises a number of interrelated issues. Some background orientation will be useful before turning to the details of competing models. A presupposition of most recent discussion has been that science sometimes provides explanations (rather than something that falls short of explanation—e.g., “mere description”) and that the task of a “theory” or “model” of scientific explanation is to characterize the structure of such explanations. It is thus assumed that there is (at some suitably abstract and general level of description) a single kind or form of explanation that is “scientific”. In fact, the notion of “scientific explanation” suggests at least two contrasts—first, a contrast between those “explanations” that are characteristic of “science” and those explanations that are not, and, second, a contrast between “explanation” and something else. However, with respect to the first contrast, much of the recent philosophical literature assumes that there is substantial continuity between explanations found in science and some forms of explanation found in ordinary, non-scientific contexts. It is further assumed that it is the task of a theory of explanation to capture what is common to both scientific and some ordinary, non-scientific forms of explanation. These assumptions help to explain (what may otherwise strike the reader as curious) why, as this entry will illustrate, discussions of scientific explanation often move back and forth between examples drawn from bona-fide science (e.g., explanations of the trajectories of the planets that appeal to Newtonian mechanics) and more homey examples (e.g., the tipping over of inkwells).
    step1: |-
      下文将显示，“科学解释”是一个牵涉若干相互关联问题的论题。在进入各家模型的细节之前，先作背景定向是有益的。晚近讨论的一个预设是：科学有时提供解释（而非某种够不上解释的东西——例如“单纯描述”）；而“科学解释”的“理论”或“模型”的任务，就是刻画这类解释的结构。于是人们假定：在某种适当抽象、一般的描述层面上，存在单一一种“科学的”解释类型或形式。事实上，“科学解释”这一说法至少暗示两种对照：其一，“科学”所特有的那些“解释”与并非如此的“解释”之间的对照；其二，“解释”与别的东西之间的对照。然而，就第一种对照而言，晚近哲学文献大多假定：科学中的解释与日常非科学语境中的某些解释形式之间，存在实质连续性。人们进一步假定：解释理论的任务，就是把握科学解释与某些日常非科学解释形式的共同之处。这些假定有助于解释（否则读者可能觉得奇怪）：为什么如本条目所示，关于科学解释的讨论常在取自真正科学的例子（例如以牛顿力学解释行星轨道）与更家常的例子（例如墨水瓶打翻）之间来回摆动。
    step2: |-
      下文将显示，“科学解释”牵涉若干相互关联的问题。进入各家模型细节之前，先作背景定向有益。晚近讨论有一预设：科学有时确实提供解释（而非某种够不上解释的东西，如“单纯描述”）；而“科学解释”之“理论”或“模型”的任务，就是刻画这类解释的结构。于是人们假定：在足够抽象、一般的描述层面上，存在单一一种“科学的”解释类型或形式。“科学解释”这一说法至少暗示两种对照：一，“科学”特有的“解释”与并非如此的“解释”之别；二，“解释”与别的东西之别。就第一种对照而言，晚近文献大多假定：科学中的解释与日常非科学语境中的某些解释形式之间有实质连续性；并进一步假定，解释理论的任务是把握二者共同之处。这一假定有助于说明（否则读者会觉得奇怪）：为什么本条目所见的讨论，常在取自真正科学的例子（如以牛顿力学解释行星轨道）与更家常的例子（如墨水瓶打翻）之间来回摆动。
  - id: 5
    kind: body
    source: |-
      With respect to the second contrast, most models of explanation assume that it is possible for a set of claims to be true, accurate, supported by evidence, and so on and yet unexplanatory. For example, all of the accounts of scientific explanation described below would agree that an account of the appearance of a particular species of bird of the sort found in a bird guidebook is, however accurate, not an explanation of anything of interest to biologists (such as the development, characteristic features, or behavior of that species). Instead, such an account is “merely descriptive”. However, different models of explanation provide different accounts of what the contrast between the explanatory and merely descriptive consists in.
    step1: |-
      就第二种对照而言，多数解释模型都假定：一组主张可以是真的、准确的、有证据支持的等等，却仍不是解释。例如，下文描述的各种科学解释理论都会同意：鸟类图鉴中关于某类鸟之外观的那种记述，无论多么准确，都不是生物学家所关心的任何东西（如该物种的发育、特征或行为）的解释；它只是“单纯描述”。然而，不同解释模型对“解释性的”与“单纯描述性的”之别究竟何在，给出了不同说法。
    step2: |-
      就第二种对照而言，多数解释模型假定：一组主张可以真、可以准确、可以有证据支持，却仍不构成解释。例如，下文各理论都会同意：鸟类图鉴中关于某类鸟外观的记述，不论多么准确，都不是生物学家所关心之物（该物种的发育、特征或行为）的解释，而只是“单纯描述”。但“解释性的”与“单纯描述性的”之别究竟何在，各家说法不同。
  - id: 6
    kind: body
    source: |-
      A related point is that, while most theorists of scientific explanation have proposed models that are intended to cover at least some cases of explanation that we would not think of as part of science, they have nonetheless assumed some implicit restriction on the kinds of explanation they have sought to reconstruct. It has often been noted that the word “explanation” is used in a wide variety of ways in ordinary English—we speak of explaining the meaning of a word, explaining how to bake a pie, explaining why one made a certain decision (where this is to offer a justification) and so on. Although the various models discussed below have sometimes been criticized for their failure to capture all of these forms of “explanation” (see, e.g., Scriven 1959)[^scriven-1959], it is clear that they were never intended to do this. Instead, their intended *explicandum* is, very roughly, explanations of *why* things happen, where the “things” in question can be either particular events or something more general—e.g., regularities or repeatable patterns in nature. Paradigms of this sort of explanation include: the explanation for the advance in the perihelion of mercury provided by General Relativity, the explanation of the extinction of the dinosaurs in terms of the impact of a large asteroid at the end of the Cretaceous period, the explanation provided by the police for why a traffic accident occurred (the driver was speeding and there was ice on the road), and the standard explanation provided in economics textbooks for why monopolies will, in comparison with firms in perfectly competitive markets, raise prices and reduce output.
    step1: |-
      与此相关的一点是：多数科学解释理论家所提出的模型，虽意在涵盖至少某些我们不会视为科学之一部分的解释，却都对他们要重构的解释种类作了某种隐含限制。“解释”一词在日常英语中用法繁多——我们说解释一个词的含义、解释如何烤馅饼、解释某人为何作某决定（这里是给出正当理由），等等。尽管下文各模型有时因未能涵盖所有这些“解释”形式而受批评（例如见 Scriven 1959）[^scriven-1959]，但很清楚，它们从来无意如此。它们所要阐释的（*explicandum*），粗略说来，是对*为何*事情发生的解释——其中“事情”可以是特定事件，也可以是更一般的东西，如自然中的规则性或可重复模式。这类解释的范例包括：广义相对论对水星近日点进动的解释；以白垩纪末一颗大行星撞击来解释恐龙的灭绝；警方对一起交通事故为何发生的解释（司机超速，路面有冰）；以及经济学教科书对垄断者为何相对于完全竞争市场中的企业提价减产的标准解释。
    step2: |-
      与此相关：多数科学解释理论家所提模型，虽意在涵盖某些我们并不视为科学之一部分的解释，却都对所要重构的解释种类设了隐含限制。“解释”在日常英语中用法极多——解释词义、解释如何烤馅饼、解释某人为何作某决定（即给出正当理由），等等。下文各模型常因未涵盖所有这些“解释”形式而受批评（如见 Scriven 1959）[^scriven-1959]，但它们显然从未打算如此。其意中的*阐释对象*（*explicandum*）粗略说来是对*为何*事情发生的解释——“事情”可以是特定事件，也可以是更一般者，如自然中的规则性或可重复模式。范例包括：广义相对论对水星近日点进动的解释；以白垩纪末大行星撞击解释恐龙灭绝；警方对一起交通事故的解释（司机超速，路面有冰）；经济学教科书对垄断者何以相对完全竞争企业提价减产的标准解释。
