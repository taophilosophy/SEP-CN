      While this example may seem clear enough, what exactly is it that distinguishes true accidental generalizations from laws? This has been the subject of a great deal of philosophical discussion, most of which must be beyond the scope of this entry.[^note-2] For reasons explained in Section 1, Hempel assumes that an adequate account must explain the notion of law in terms of notions that lie outside the modal family.[^note-3] He considers (1965b) a number of familiar proposals having this character[^note-4] and finds them all wanting, remarking that the problem of characterizing the notion of law has proved “highly recalcitrant” (1965b: 338). It seems fair to say, however, that his underlying assumption is that, at bottom, laws are just exceptionless generalizations describing regularities that meet certain additional distinguishing conditions that he is not at present able to formulate. In subsequent decades, a variety of criteria for lawhood have been proposed. Of these the so-called best systems analysis (Lewis 1973)[^lewis-1973] is probably the most popular, but no single account has won general acceptance. Finding an adequate characterization of lawhood is thus an ongoing issue for the *DN* model.
    step1: |-
      此例看似足够清楚，但究竟是什么把真的偶然概括与律区分开来？这曾是大量哲学讨论的主题，其中大部分只能超出本条目范围。[^note-2] 出于第 1 节说明的理由，亨佩尔假定：充分的说明必须用模态家族之外的概念来解释“律”。[^note-3] 他在（1965b）中考察了若干具有这一特征的常见方案[^note-4]，发现它们都不足，并说“刻画律这一概念”的问题已被证明“极难驯服”（1965b: 338）。不过可以说，他的底层假定是：律归根结底不过是描述规则性、且满足某些他目前尚无法表述的进一步区分条件的无例外概括。此后数十年间，人们提出了多种律性标准。其中所谓“最佳系统分析”（Lewis 1973）[^lewis-1973] 大概最流行，但没有一种说明获得普遍接受。因此，为律性找到充分刻画，仍是 *DN* 模型悬而未决的问题。
