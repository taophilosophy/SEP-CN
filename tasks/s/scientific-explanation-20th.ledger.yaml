      As the billiard example illustrates, the *CM* model takes as its paradigms of causal interaction examples such as collisions in which there is “action by contact” and no spatio-temporal gaps in the transmission of causal influence. There is little doubt that explanations in which there are no such gaps (no “action at a distance”) often strike us as particularly satisfying. However, as Christopher Hitchcock shows in an illuminating paper (Hitchcock 1995)[^hitchcock-1995], even here the *CM* model leaves out something important. Consider the usual elementary textbook “scientific explanation” of the motion of the balls in the above example following their collision. This explanation proceeds by deriving that motion from information about their masses and velocity before the collision, the assumption that the collision is perfectly elastic, and the law of the conservation of linear momentum. We usually think of the information conveyed by this derivation as showing that it is the mass and velocity of the balls, rather than, say, the scratches on their surface or chalk that may be transmitted by the cue stick that is explanatorily relevant to their subsequent motion. However, it is hard to see what in the *CM* model allows us to pick out the linear momentum of the balls, as opposed to these other features, as explanatorily relevant. Part of the difficulty is that to express such relatively fine-grained judgments of explanatory relevance (that it is linear momentum rather than chalk marks that matters) we need to talk about relationships between properties or magnitudes and it is not clear how to express such judgments purely in terms of facts about causal processes and interactions. Both the linear momentum and the chalk mark communicated to the cue ball by the cue stick are marks transmitted by the spatio-temporally continuous causal process consisting of the motion of the cue ball.
    step1: |-
      如台球之例所示，*CM* 模型把诸如此类的碰撞——“接触致动”、且因果影响的传递没有时空间隙——作为因果相互作用的范式。毫无疑问，没有这类间隙（无“超距作用”）的解释常令我们觉得格外令人满意。然而，正如克里斯托弗·希区柯克在一篇富于启发的论文中所表明的（Hitchcock 1995）[^hitchcock-1995]，即便在此，*CM* 模型也遗漏了某种重要的东西。考虑上例中两球相撞之后运动的通常教科书式“科学解释”：该解释由碰撞前两球的质量与速度的信息、碰撞完全弹性的假定、以及线动量守恒律，推导出该运动。我们通常认为这一推导所传达的信息表明：对两球随后运动具有解释相关性的，是它们的质量与速度，而不是（比如）其表面的划痕或可能由球杆传递的巧粉。然而，很难看出 *CM* 模型中有何物能让我们挑出两球的线动量（而非这些其他特征）作为解释上相关者。部分困难在于：要表达这类较为精细的解释相关性判断（重要的是线动量而非巧粉痕迹），我们需要谈论属性或量值之间的关系，而如何纯以因果过程与相互作用之事实来表达这类判断，并不清楚。由球杆传给母球的线动量与巧粉痕迹，二者都是由母球运动这一时空连续的因果过程所传递的标记。
    step2: |-
      如台球之例所示，*CM* 模型以碰撞这类“接触致动”、因果影响传递无时空间隙的例子为因果相互作用之范式。无疑，没有这类间隙（无“超距作用”）的解释常令我们觉得格外令人满意。然而克里斯托弗·希区柯克在一篇富于启发的论文中（Hitchcock 1995）[^hitchcock-1995] 表明：即便在此，*CM* 模型仍遗漏了要紧之物。试看上例中两球相撞后运动的通行教科书式“科学解释”：由碰撞前两球的质量与速度、碰撞完全弹性的假定、线动量守恒律推出该运动。我们通常认为，此推导所示者是：对两球随后运动解释上相关者，为其质量与速度，而非表面划痕或球杆传来的巧粉之类。可是很难看出 *CM* 模型中何者使我们能挑出两球的线动量——而非这些其他特征——为解释上相关者。困难之一在于：要表达这类较精细的解释相关性判断（要紧的是线动量而非巧粉痕迹），须谈属性或量值间的关系；而如何纯以因果过程与相互作用之事实表达这类判断，并不清楚。球杆传给母球的线动量与巧粉痕迹，皆由母球运动这一时空连续因果过程所传递。
