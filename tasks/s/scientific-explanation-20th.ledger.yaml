      Does this mean that a focus on causation should entirely replace the project of developing models of explanation or that philosophers should stop talking about explanation and instead talk just about causation? Despite the apparent centrality of causation to many explanations, it is arguable that completely subsuming the latter into the former loses connections with some important issues. For one thing, causal claims themselves seem to vary greatly in the extent to which they are explanatorily deep or illuminating. Causal claims found in Newtonian mechanics seem deeper or more satisfying from the point of view of explanation than causal claims of “the rock broke the window” variety. It is usually supposed that such differences are connected to other features—for example to how general, stable, and coherent with background knowledge a causal claim is. However, notions like “generality” are vague and not all forms of generality seem to be connected to explanatory goodness. So even if one focuses only on causal explanation, there remains the important project of trying to understand better what sorts of distinctions among causal claims matter for goodness in explanation. To the extent this is so, the kinds of concerns that have animated traditional treatments of explanation don’t seem to be entirely subsumable into standard accounts of causation, which have tended to focus largely on the project of distinguishing causal from non-causal relationships rather than on the features that make causal relationships “good” for purposes of explanation.
    step1: |-
      这是否意味着对因果的关注应完全取代发展解释模型的工程，或哲学家应停止谈论解释而只谈因果？尽管因果对许多解释具有显见的中心地位，但可以说，把后者完全归入前者会失去与某些重要问题的联系。一方面，因果主张本身在解释深度或启发性上的差异似乎很大。牛顿力学中的因果主张，从解释的观点看，似乎比“石头打碎了窗户”那类因果主张更深、更令人满意。人们通常假定，这类差别与其他特征相连——例如一个因果主张有多一般、多稳定、与背景知识多一致。然而，“一般性”这类概念是含糊的，且并非一切形式的一般性都与解释的好坏相连。因此，即便只关注因果解释，仍有一个重要工程：更好地理解因果主张之间的哪些区分关乎解释之好坏。就此而言，曾经驱动传统解释处理的那些关切，似乎并不能完全归入标准的因果说明——后者大抵聚焦于区分因果与非因果关系这一工程，而非聚焦于使因果关系在解释上“好”的那些特征。
    step2: |-
      这是否意味着对因果的关注应全然取代解释建模，或哲学家不再谈解释、只谈因果？因果对许多解释固然居显要位置，但可以说：以后者全然并入前者，会失去与若干重要问题的联系。一方面，因果主张本身在解释深度、启发性上差异甚大：牛顿力学中的因果主张，看来比“石头打碎了窗户”一类更深、更令人满意。人们通常假定此类差别系于其他特征——如主张有多一般、多稳定、与背景知识多相合。然而“一般性”这类概念含糊，且并非一切一般性都与解释之好坏相连。故即便只论因果解释，仍有一项要务：弄清因果主张间的哪些区分关乎解释之好坏。就此而言，驱动传统解释处理的关切，并不能尽归入标准因果说明——后者大抵只管区分因果与非因果，而少问什么使因果关系在解释上“好”。
  - id: 155
    kind: body
    source: |-
      Another important question, motivated by the above observations about the role of causation in explanation, has to do with whether there are forms of why-explanation that are non-causal. If so, how important are these are in science and what is their structure? Hempel seems to have thought of causal explanations simply as those DN explanations that appeal to causal laws which he regarded as a proper subset of all laws. Thus, on his view, causal and non-causal explanations share a common structure and although there are non-causal explanations in the sense of explanations that do not appeal to causal laws, there is no need for a distinct account of non-causal explanation. Kitcher’s unificationist model was also intended to apply to both causal and non-causal explanations such as unifying argument patterns in linguistics. More recently, there has been a great upsurge of interest in whether there are non-causal forms of explanation, with some claiming they are ubiquitous in science (e.g., Lange 2017, Reutlinger & Saatsi 2018, Ross 2025)[^lange-2017][^reutlinger-2018][^ross-2025]. If there are such explanations, this raises the issue of what distinguishes them from causal explanations and whether there is some overarching theory that subsumes both causal and non-causal explanations.
    step1: |-
      由上面对因果在解释中作用的观察引发另一个重要问题：是否存在非因果形式的“为何”解释？若有，它们在科学中有多重要、结构如何？亨佩尔似乎把因果解释仅仅看作那些诉诸因果律的 *DN* 解释——他把因果律视为一切律的一个真子集。因此，按他的看法，因果解释与非因果解释共享同一结构；虽然存在不诉诸因果律的意义上的非因果解释，却无需一个关于非因果解释的专门说明。基切尔的统一论模型也意在同时适用于因果与非因果解释，如语言学中的统一论证模式。较晚近，对是否存在非因果解释形式的兴趣大为高涨，有人声称它们在科学中无处不在（如 Lange 2017, Reutlinger & Saatsi 2018, Ross 2025）[^lange-2017][^reutlinger-2018][^ross-2025]。若有这类解释，便提出这样的问题：它们与因果解释如何区分？是否存在某个包摄因果与非因果解释的总括理论？
    step2: |-
      上面对因果作用的观察引发另一要问：有无非因果形式的“为何”解释？若有，其在科学中地位如何、结构如何？亨佩尔似乎把因果解释仅视作诉诸因果律的 *DN* 解释——因果律被看作一切律的真子集。故依他，因果与非因果解释同构；虽有不诉诸因果律的非因果解释，却无需为非因果解释另立一说。基切尔的统一论模型亦兼适用于因果与非因果解释（如语言学中的统一论证模式）。晚近，非因果解释之有无顿成显学，有人称其在科学中无处不在（Lange 2017, Reutlinger & Saatsi 2018, Ross 2025）[^lange-2017][^reutlinger-2018][^ross-2025]。若有此类解释，便须问：其与因果解释如何相分？有无一个兼摄二者的总括理论？
  - id: 156
    kind: body
    source: |-
      Put differently the focus on the role of causation suggested by some of the limitations in the accounts described has engendered two quite different responses in recent work on explanation. One is that more satisfactory accounts of explanation require a better understanding of causation. The other, which can be thought of as a sort of reaction to this emphasis on causation, is that a focus on non-causal forms of explanation is a promising direction of research. Both of these have been pursued vigorously in post-twentieth-century work on explanation.
    step1: |-
      换句话说，上文诸说明的某些局限所提示的对因果作用的关注，在晚近解释研究中引起了两种颇不相同的回应。其一是：更令人满意的解释说明需要对因果有更好的理解。其二可以看作对这一因果强调的某种反动：聚焦于非因果解释形式是一个有前景的研究方向。二者在 20 世纪之后的解释研究中都得到了有力的推进。
    step2: |-
      换言之，上文诸说明的局限所提示的因果关注，在晚近解释研究中引出两种迥异回应：一曰，更满意的解释说明须更懂因果；二曰——可视作对此因果强调之反动——非因果解释是有前景的方向。二者在 20 世纪后的解释研究中皆获大力推进。
  - id: 157
