      Finally, a few words about the broader epistemological and methodological background to the models described below. Many philosophers think of concepts like “explanation”, “law”, “cause”, and “support for counterfactuals” as part of an interrelated family of concepts that are “modal” in character. For familiar “empiricist” reasons, Hempel and many other early defenders of the *DN* model regarded these concepts as not well understood, at least prior to analysis. It was assumed that it would be “circular” to explain one concept from this family in terms of others from the same family and that they must instead be explicated in terms of other concepts from outside the modal family—concepts that more obviously satisfied (what were taken to be) empiricist standards of intelligibility and testability. For example, in Hempel’s version of the *DN* model, the notion of a “law” plays a key role in explicating the concept of “explanation”, and his assumption is that laws are just regularities that meet certain further conditions that are also acceptable to empiricists. As we shall see, these empiricist standards (and an accompanying unwillingness to employ modal concepts as primitives) have continued to play a central role in the models of explanation developed subsequent to the *DN* model.
    step1: |-
      最后，就下文各模型的更广认识论与方法论背景略作数语。许多哲学家把“解释”“律”“原因”“反事实支持”这类概念视为一个相互关联的概念家族，其性质是“模态的”。出于熟悉的“经验主义”理由，亨佩尔与许多 *DN* 模型的早期捍卫者认为，这些概念至少在被分析之前并未得到很好的理解。他们假定：用这一家族中的某些概念去解释同家族的其他概念会是“循环的”；必须转而用模态家族之外的其他概念来阐释它们——那些更显然满足（他们所理解的）经验主义可理解性与可检验性标准的概念。例如，在亨佩尔的 *DN* 模型版本中，“律”这一概念在阐释“解释”概念时起关键作用；他的假定是：律不过是满足某些进一步条件、且这些条件也为经验主义者接受的规则性。我们将看到，这些经验主义标准（连同不愿把模态概念当作初始概念的态度），在 *DN* 模型之后发展出的解释模型中继续扮演核心角色。
    step2: |-
      最后略说下文各模型的更广认识论与方法论背景。许多哲学家视“解释”“律”“原因”“反事实支持”为一个相互关联的概念家族，其性质是“模态的”。出于熟悉的“经验主义”理由，亨佩尔与许多 *DN* 模型早期捍卫者认为，这些概念至少在被分析之前未获良好理解。他们假定：用同家族概念互释会“循环”，故须用模态家族之外的概念来阐释——那些更显然符合（他们所理解的）经验主义可理解性与可检验性标准者。例如在亨佩尔的 *DN* 版本中，“律”在阐释“解释”时居关键地位；他假定律不过是满足某些进一步条件、且这些条件亦为经验主义者接受的规则性。我们将看到，这些经验主义标准（连同不愿以模态概念为初始项的态度），在 *DN* 之后的解释模型中继续居核心地位。
  - id: 8
    kind: body
    source: |-
      A related issue has to do with whether all scientific explanations are causal and if not, what distinguishes causal from non-causal explanations. Hempel recognized both causal and non-causal forms of explanation but held that both were captured by the *DN* model—in his view, causal explanations are simply *DN* explanations that cite causal laws (which he regarded as a proper subset of all laws). Many but not all of the accounts discussed below in effect assume that many of the problems with the DN model can be traced to its commitment to an inadequate account of causation; thus that getting clearer about causal notions would lead to more adequate accounts of explanation. By contrast, a substantial amount of recent discussion of explanation has moved away from this focus on causation and instead explores the possibility of non-causal forms of explanation.[^note-1]
    step1: |-
      一个相关问题关涉：是否一切科学解释都是因果的；若非如此，因果解释与非因果解释之别何在。亨佩尔承认因果与非因果两种解释形式，但认为二者都被 *DN* 模型所涵盖——在他看来，因果解释不过是引述因果律（他视之为一切律的一个真子类）的 *DN* 解释。下文所论的许多（虽非全部）理论，实际上假定：*DN* 模型的许多问题可追溯到它对因果关系作了不充分的说明；因此，把因果概念弄清楚，会带来更充分的解释理论。相反，晚近大量关于解释的讨论已离开对因果的关注，转而探索非因果解释形式的可能性。[^note-1]
    step2: |-
      与此相关的问题是：是否一切科学解释都是因果的？若否，因果解释与非因果解释之别何在？亨佩尔兼认因果与非因果两种形式，但认为二者均被 *DN* 模型涵盖——在他看来，因果解释不过是引述因果律（他视之为一切律的真子类）的 *DN* 解释。下文许多（非全部）理论实际假定：*DN* 的许多问题可溯至其对因果的不充分说明，故厘清因果概念将带来更充分的解释理论。相反，晚近大量讨论已离开因果，转而探索非因果解释的可能。[^note-1]
