      [^note-14]: A closely related point is that a characterization that “relativizes” some feature of an explanation to a context sometimes can, so to speak, be “de-relativized” by making it explicit how the feature in question depends on context—in other words, the apparent contextuality may be just a reflection of the fact that some relevant feature has not been made explicit. For example, an explanandum for which the contrast class is left implicit may seem to support a context-relative picture of explanation (for example, that different explanations of why the conductor is bent will be appropriate depending on context) but at least sometimes this appearance may be removed by making the intended contrast class explicit. It might be argued that once it is made explicit that what is of interest is why this conductor is bent while others are straight, it is an “objective” matter whether some candidate explanans accounts for this contrast. For this reason, it seems that we should regard a thorough-going pragmatic theory as one that claims that explanations have a contextual element that can’t be removed (in a way that satisfies objectivist constraints) by making the context explicit.
