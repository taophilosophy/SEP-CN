      A final point that is suggested by van Fraassen’s theory is this: In considering pragmatic theories, it matters a great deal exactly where the “pragmatic” elements are claimed to enter into the account of explanation. One point at which such considerations seem clearly to enter is in the selection or characterization of what an audience wants explained. This is reflected in van Fraassen’s theory in the choice of a $P_k$ and an associated contrast class $X$. Obviously, whether we are looking for an explanation of why, say, this particular conductor is now bent when it was previously straight or whether instead we want to know why this conductor is bent while some other conductor is straight is a matter that depends on our interests. However, this particular sort of “interest relativity” (and associated phenomena having to do with the role of contrastive focus in the characterization of explananda, which really just serve to specify more exactly which particular explananda we want explained) seems something that can be readily acknowledged by traditional theories.[^note-14] After all, it is not a threat to the *DN* or other models with similar traditional aspirations that one audience may be interested in an explanation of the photoelectric effect but not the deflection of starlight by the sun and another audience may have the opposite interests. What would be a threat to the *DN* and similar models would be an argument that once some explanandum *E* is fully specified, whether explanans *M* explains *E* (that is, whether there is an explanatory relation between *M* and *E*) is itself “interest-relative”. It is natural to interpret van Fraassen as making this latter claim, both in connection with explanatory asymmetries and more generally.
    step1: |-
      范弗拉森的理论还提示最后一点：在考察语用理论时，“语用”成分究竟被声称在何处进入解释说明，关系重大。此类考量看似清楚进入的一处，是对听众想要解释之物的选择或刻画。这在范弗拉森的理论中反映为对 $P_k$ 及相伴随的对照类 $X$ 的选择。显然，我们是在寻求“为何这根特定导线如今弯了而先前是直的”这一解释，还是想知道“为何这根导线弯了而另一根是直的”，取决于我们的兴趣。然而，这种特殊的“兴趣相对性”（以及与之相关的、在对被解释项的刻画中对比焦点所起作用等现象——它们其实只是更确切地指明我们想要解释的是哪些特定被解释项）似乎是传统理论不难承认的。毕竟，一个听众可能对光电效应感兴趣而不对太阳偏折星光感兴趣，另一个听众兴趣正相反——这对 *DN* 或其他有类似传统志向的模型并不构成威胁。对 *DN* 与类似模型构成威胁的，将是这样一种论证：一旦某个被解释项 *E* 被完全规定，解释项 *M* 是否解释 *E*（即 *M* 与 *E* 之间是否存在解释关系）这件事本身是否“兴趣相对”的。把范弗拉森理解为在后一意义上作此主张，无论是就解释不对称性还是就一般情形而言，都是自然的。
    step2: |-
      范氏理论另提示末节：考察语用理论时，“语用”成分被声称于何处进入解释说明，关系甚大。看似清楚进入的一处，是选择或刻画听众想要解释什么——在范氏理论中即选定 $P_k$ 及其对照类 $X$。显然，我们要的是“为何此导线今弯而昔直”，还是“为何此导线弯而彼导线直”，确依我们的兴趣而定。然而，这一种“兴趣相对性”（连同对比焦点在刻画被解释项时的作用——那其实只是更确切地指明所欲解释者为何）传统理论不难承认。[^note-14]毕竟，一听众或求光电效应之解而不求星光偏折之解，另一听众正相反，此于 *DN* 及同类传统志向之模型无所威胁。真正构成威胁者，是论证：一旦 *E* 被完全规定，*M* 是否解释 *E*（二者间有无解释关系）本身即“兴趣相对”。无论从解释不对称看还是一般而论，把范氏解作后一主张，皆是自然的。
