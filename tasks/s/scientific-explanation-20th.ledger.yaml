      In more recent work (especially, Salmon 1984)[^salmon-1984] Salmon abandoned the attempt to characterize explanation or causal relationships in purely statistical terms. Instead, he developed a new account which he called the Causal Mechanical (*CM*) model of explanation—an account which is similar in both content and spirit to so-called *causal* *process* theories of causation of the sort defended by philosophers like Philip Dowe (2000). We may think of the *CM* model as an attempt to capture the “something more” involved in causal and explanatory relationships over and above facts about statistical relevance, again while attempting to remain within a broadly Humean framework.
    step1: |-
      在较晚近的工作中（尤其是 Salmon 1984）[^salmon-1984]，萨蒙放弃了用纯统计术语刻画解释或因果关系的尝试。他转而提出一种新说明，称之为解释的因果机制（*CM*）模型——该说明在内容与精神上都类似于 Philip Dowe（2000）等哲学家所主张的所谓*因果* *过程*理论。我们可以把 *CM* 模型视为试图捕捉超出统计相关性事实之上的、因果与解释关系中的“更多东西”，且仍力求留在宽泛的休谟式框架之内。
    step2: |-
      在较晚近的工作中（尤其 Salmon 1984）[^salmon-1984]，萨蒙放弃以纯统计术语刻画解释或因果关系，转而提出解释的因果机制（*CM*）模型——其内容与精神近于 Philip Dowe（2000）等所主张的*因果* *过程*理论。*CM* 模型可视为力图捕捉统计相关性事实之外、因果与解释关系所含的“更多东西”，而又仍置身宽泛的休谟式框架之内。
