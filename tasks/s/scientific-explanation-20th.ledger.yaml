      [^note-10]: We are not aware of any systematic historical exploration of the origins of this particular use of “pragmatic” in connection with accounts of explanation. However, one conjecture (and it is only a conjecture) is that it derives, at least in significant part, from linguistics and, in particular, from the contrast between, on the one hand, syntax and semantics, (often thought to be “objective” and appropriate objects of general, systematic study) and “pragmatics” understood as having to do with the use of language by particular speakers directed toward particular audiences in particular contexts to achieve particular ends. This notion of “pragmatic” does suggest a connection with what is idiosyncratic to the psychology of particular language users and contexts and contrasts with projects that are regarded as providing a “syntax” or “semantics” of explanation.
