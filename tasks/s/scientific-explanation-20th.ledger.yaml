      In more recent work (e.g., Salmon 1994)[^salmon-1994], prompted in part by a desire to avoid certain counterexamples advanced by Philip Kitcher (1989) to his characterization of mark transmission, Salmon attempted to fashion a theory of causal explanation that completely avoids any appeal to counterfactuals. In this new theory which is influenced by the conserved process theory of causation of Dowe (2000), Salmon defined a causal process as a process that transmits a non-zero amount of a *conserved quantity* at each moment in its history. Conserved quantities are quantities so characterized in physics—linear momentum, angular momentum, charge, and so on. A causal interaction is an intersection of world lines associated with causal processes involving exchange of a conserved quantity. Finally, a process transmits a conserved quantity from *A* to *B* if it possesses that quantity at every stage without any interactions that involve an exchange of that quantity in the half-open interval $(A,B]$.[^note-8]
    step1: |-
      在更晚近的工作中（如 Salmon 1994）[^salmon-1994]，部分出于避免菲利普·基切尔（1989）针对其标记传递刻画所提某些反例的愿望，萨蒙试图打造一种完全避免诉诸反事实的因果解释理论。在这一受 Dowe（2000）守恒过程因果理论影响的新理论中，萨蒙把因果过程定义为在其历史的每一时刻都传递非零量的*守恒量*的过程。守恒量是物理学中如此刻画的各种量：线动量、角动量、电荷等等。因果相互作用是与因果过程相联系的世界线的交叉，涉及守恒量的交换。最后，一个过程若在半开区间 $(A,B]$ 内的每一阶段都拥有某守恒量、且无任何涉及该量交换的相互作用，则它从 *A* 到 *B* 传递该守恒量。[^note-8]
