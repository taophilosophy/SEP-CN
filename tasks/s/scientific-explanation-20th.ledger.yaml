      按演绎—律则模型，科学解释有两个主要“构件”：*被解释项*（*explanandum*），即“描述待解释现象”的语句；*解释项*（*explanans*），即“为说明该现象而援引的那类语句”（Hempel & Oppenheim 1948 [1965: 247]）[^hempel-1948]。解释项要成功解释被解释项，须满足若干条件。其一，“被解释项必须是解释项的逻辑后承”，且“构成解释项的语句必须为真”（Hempel 1948 [1965: 248]）[^hempel-1948]。也就是说，解释须采取可靠演绎论证的形式：被解释项作为结论，由解释项中的前提推出。此为模型的“演绎”成分。其二，解释项须至少含一条“自然律”，且该前提在推导中必须是*本质性的*——去掉它，推导即不成立。此为“律则”成分；“律则的”（nomological）是哲学专门术语，略去细节，大意即“合乎律的”。在最一般的表述中，*DN* 模型既适用于“一般规则性”或“律”的解释（如亨佩尔与奥本海姆之例：光为何遵循折射定律），也适用于特定事件的解释（设想发生于特定时空的事件：如某次观看时，划艇没入水中的桨何以显得弯折）。作为 *DN* 解释特定事件的又一例，试由牛顿运动定律、支配引力的平方反比定律，以及太阳与火星的质量、二者当前位置与速度，推导火星未来某时刻的位置：各条牛顿定律作为本质前提，与初始条件信息一起，经演绎有效的论证推出被解释项（火星的未来位置），*DN* 标准由此满足。
