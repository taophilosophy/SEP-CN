      As an illustration, suppose that a mole of gas is confined to a container of volume $V_1,$ at pressure $P_1,$ and temperature $T_1$. The gas is then allowed to expand isothermally into a larger container of volume $V_2$. One standard way of explaining the behavior of the gas—its rate of diffusion and its subsequent equilibrium pressure $P_2$—appeals to the generalizations of phenomenological thermodynamics—e.g., the ideal gas law, Graham’s law of diffusion, and so on. Salmon appears to regard putative explanations based on at least the first of these generalizations as not explanatory because they do not trace continuous causal processes—he thinks of the individual molecules as causal processes but not the gas as a whole.[^note-7] However, it is plainly impossible to trace the causal processes and interactions represented by each of the $6 \times 10^{23}$ molecules making up the gas and the successive interactions (collisions) it undergoes with every other molecule. Even the usual statistical mechanical treatment, which Salmon presumably would regard as explanatory, does not attempt to do this. Instead, it makes certain general assumptions about the distribution of molecular velocities and the forces involved in molecular collisions and then uses these, in conjunction with the laws of mechanics, to derive and solve a differential equation (the Boltzmann transport equation) describing the overall behavior of the gas. This treatment abstracts radically from the details of the causal processes involving particular individual molecules and instead focuses on identifying higher level variables that aggregate over many individual causal processes and that figure in general patterns that govern the behavior of the gas.
    step1: |-
      举例来说，设一摩尔气体封闭于容积为 $V_1,$ 压强为 $P_1,$ 温度为 $T_1$ 的容器中，然后使其等温膨胀入容积为 $V_2$ 的更大容器。解释该气体行为——其扩散速率及其后的平衡压强 $P_2$——的一种标准方式，诉诸现象学热力学的诸概括，如理想气体定律、格雷姆扩散定律等。萨蒙似乎认为：基于至少其中第一种概括的所谓解释不具解释力，因为它们没有追溯连续的因果过程——他把个别分子视为因果过程，而不把气体整体视为因果过程。[^note-7] 然而，要逐一追溯组成气体的 $6 \times 10^{23}$ 个分子各自所代表的因果过程与相互作用（碰撞），显然不可能。即便是通常的统计力学处理——萨蒙大概会视之为有解释力——也不试图这样做。相反，它对分子速度的分布与分子碰撞所涉及的力作出某些一般假定，然后结合力学诸律，导出并求解一个微分方程（玻尔兹曼输运方程），以描述气体的总体行为。这一处理极大程度地抽象掉涉及特定个别分子的因果过程的细节，转而聚焦于识别那些对众多个别因果过程进行聚合、并出现在支配气体行为的一般模式中的较高层级变量。
    step2: |-
      举例言之：设一摩尔气体封于容积 $V_1,$ 压强 $P_1,$ 温度 $T_1$ 的容器，后使之等温膨胀入容积 $V_2$ 的更大容器。解释气体行为——其扩散速率与随后的平衡压强 $P_2$——的一种标准方式，诉诸现象学热力学诸概括，如理想气体定律、格雷姆扩散定律等。萨蒙似认为：至少基于第一种概括的所谓解释不具解释力，因其不追溯连续因果过程——他视个别分子为因果过程，而不视气体整体为因果过程。[^note-7] 然而，逐一追溯 $6 \times 10^{23}$ 个分子各自的因果过程、以及它与其余每个分子的相继相互作用（碰撞），显然不可能。连通常的统计力学处理——萨蒙大概会认其有解释力——也不如此尝试。它毋宁对分子速度分布与分子碰撞所涉之力作某些一般假定，再结合力学诸律导出并求解微分方程（玻尔兹曼输运方程），以描述气体总体行为。此处理极大抽象掉特定个别分子的因果过程细节，转而识别聚合众多个别因果过程、且现身于支配气体行为之一般模式的高层级变量。
