      As an illustration, suppose that in the birth control pills example (5) the original population *T* includes both sexes. Then

      $$\begin{align} P(\text{Pregnancy} \mid T.&\text{Male.Takes birth control pills})\\ & {} = P(\text{Pregnancy} \mid T.\text{Male})\\ & {} = 0 \end{align} $$
    step1: TBD
    step2: TBD
