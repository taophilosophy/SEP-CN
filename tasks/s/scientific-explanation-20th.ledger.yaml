      One obvious response to this claim, made by several critics (e.g., Kitcher & Salmon 1987: 317)[^kitcher-1987], is that the example does not really involve a case in which, depending on context, *H* causally explains *S* and *S* causally explains *H*. Instead, although *H* does causally explain *S*, it is (something like) the *desire* for a shadow of length *S* (rather than *S* itself) that explains (or at least causally explains) the height (or the choice of height) for the tower. Or, if one prefers, in the latter case we are given something like a functional explanation (but not a causal explanation) for the height of the tower, in the sense that we are told what the intended function of that choice of height is. On either of these diagnoses, this will not be a case in which whether *H* provides a causal explanation of *S* or whether instead *S* provides a causal explanation of *H* shifts depending on factors having to do with the interests of the speaker or audience or other contextual factors. If so, the story about the tower does not show that the asymmetry present in the flagpole example must be accounted for in terms of pragmatic factors. It may be accounted for in some other way. In fact, although discussion must be beyond the scope of this entry, a number of possible candidates for such a non-pragmatic account of causal asymmetries have been proposed, both in philosophy and outside of it (for example, in the machine learning literature[^note-13]).
    step1: |-
      对这一主张，若干批评者（如 Kitcher & Salmon 1987: 317）[^kitcher-1987] 作出一个显见的回应：该例实际上并不涉及这样一种情形——依语境不同，*H* 因果地解释 *S*，而 *S* 因果地解释 *H*。相反，尽管 *H* 确实因果地解释 *S*，在那里解释（或至少因果地解释）塔高（或对塔高的选择）的，是（大致）对长度为 *S* 的影子之*欲望*，而非 *S* 本身。或者，若愿意这样说：在后一情形中我们得到的是关于塔高的大致功能性解释（而非因果解释），即有人告诉我们这一高度选择的意图功能是什么。按这两种诊断中的任何一种，这都不是这样的情形：究竟是 *H* 提供对 *S* 的因果解释、还是 *S* 提供对 *H* 的因果解释，会随言说者或听众的兴趣及其他语境因素而变。若如此，关于塔的故事就没有表明旗杆一例中的不对称必须以语用因素来说明。它或许能以别的方式说明。事实上，尽管讨论必须超出本条目范围，在哲学之内与之外（例如在机器学习文献中[^note-13]）都已提出若干这类非语用说明因果不对称的可能候选。
    step2: |-
      若干批评者（如 Kitcher & Salmon 1987: 317）[^kitcher-1987] 对此有一显见回应：此例并非“依语境而 *H* 因果解释 *S*、*S* 亦因果解释 *H*”之情形。实则 *H* 确因果解释 *S*，而后者中解释（至少因果解释）塔高（或其选择）者，乃对长度为 *S* 之影子的*欲望*（而非 *S* 本身）。或可另说：后一情形所得是塔高的功能性解释（非因果解释），即告以此高度选择之意图功能。无论取哪种诊断，这都不是“*H* 是否因果解释 *S*（或反之）随言说者、听众兴趣及其他语境因素而变”的情形。若然，塔的故事便未表明旗杆例中的不对称须以语用因素说明——它或可以他种方式说明。事实上，虽讨论超出本条目范围，哲学内外（如机器学习文献[^note-13]）已提出若干非语用说明因果不对称的候选。
