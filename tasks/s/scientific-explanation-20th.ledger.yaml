      A second, closely related point is that the *SR* model departs from the *IS* model in abandoning the idea that a statistical explanation of an outcome must provide information from which it follows the outcome occurred with high probability. As the reader may check, the statement of the *SR* model above imposes no such high probability requirement; instead, even very unlikely outcomes will be explained as long as the criteria for *SR* explanation are met. Suppose that, in the above example, the probability of quick recovery from strep, given treatment and the presence of a non-resistant strain, is rather low (e.g., 0.2). Nonetheless, if the criteria (i)–(iii) above—a homogeneous partition with correct probability values for each cell in the partition—are satisfied, we may use this information to explain why *x*, who had a non-resistant strain of strep and was treated, recovered quickly. Indeed, according to the *SR* model, we may explain why some *x* which is *A* is *B*, even if the conditional probability of *B* given *A* and the cell $C_i$ to which *x* belongs $(p_i = P(B\mid A.C_i))$ is *less* than the prior probability $(p = P(B\mid A))$ of *B* in *A*. For example, if the prior probability of quick recovery among all those with any form of strep is 0.5 and the probability of quick recovery of those with a resistant strain who are untreated is 0.1, we may nonetheless explain why *y*, who meets these last conditions $({-T}.R),$ recovered quickly (assuming he did) by citing the cell to which he belongs, the probability of recovery given that he falls in this cell, and the other sort of information described above. More generally, what matters on the *SR* model is not whether the value of the probability of the explanandum-outcome is high or low (or even high or low in comparison with its prior probability) but rather whether the putative explanans cites all and only statistically relevant factors and whether the probabilities it invokes are correct. One consequence of this, which Salmon endorses while acknowledging that many will regard it as unintuitive, is that on the *SR* model, the same explanans *E* may explain both an explanandum *M* and explananda that are inconsistent with *M*, such as $-M$. For example, the same explanans will explain both why a subject with strep and certain other properties (e.g., *T* and $-R$) recovers quickly, if he does, and also why he does not recover if he does not. By contrast, on the *DN* or *IS* models, if *E* explains *M,* *E* cannot also explain $-M$.
    step1: |-
      第二个紧密相关的要点是：*SR* 模型放弃了这一想法——对一个结果的统计解释必须提供由之可推出该结果以高概率发生的信息——从而偏离 *IS* 模型。读者可以核验：上述 *SR* 模型的陈述没有施加这种高概率要求；相反，只要满足 *SR* 解释的标准，即便极不可能的结果也会得到解释。假定在上例中，给定治疗且存在非抗药株时链球菌快速康复的概率相当低（如 0.2）。即便如此，若上述标准 (i)–(iii)——各单元概率值正确的齐一划分——得到满足，我们仍可用这些信息解释：为何患非抗药株链球菌且接受治疗的 *x* 快速康复了。确实，按 *SR* 模型，我们可以解释某个为 *A* 的 *x* 为何是 *B*，即使给定 *A* 与 *x* 所属单元 $C_i$ 时 *B* 的条件概率 $(p_i = P(B\mid A.C_i))$ *小于* *B* 在 *A* 中的先验概率 $(p = P(B\mid A))$。例如，若所有链球菌感染者快速康复的先验概率为 0.5，而患抗药株且未治疗者快速康复的概率为 0.1，我们仍可解释为何满足最后这些条件 $({-T}.R),$ 的 *y* 快速康复了（假定他确实康复了）：引述他所属的单元、给定他落入该单元时的康复概率，以及上文描述的其他信息。更一般地说，按 *SR* 模型，要紧的不是被解释项结果的概率值高或低（甚至相对于其先验概率的高或低），而是所谓的解释项是否引述了全部且仅统计相关的因素，以及它所援引的概率是否正确。这一点的后果之一——萨蒙认可它，同时承认许多人会视之为反直觉——是：按 *SR* 模型，同一解释项 *E* 可以既解释被解释项 *M*，也解释与 *M* 不一致的被解释项，如 $-M$。例如，同一解释项将既解释患链球菌且具某些其他属性（如 *T* 与 $-R$）的受试者为何（若他确实如此）快速康复，也解释他为何（若他确实未康复）不康复。相反，按 *DN* 或 *IS* 模型，若 *E* 解释 *M*，*E* 便不能也解释 $-M$。
    step2: |-
      第二点与之紧密相关：*SR* 模型放弃了“统计解释必须提供可推出结果以高概率发生之信息”的想法，从而有别于 *IS* 模型。读者可自核：上述 *SR* 陈述并无高概率要求；只要满足 *SR* 解释标准，再不可能的结果也得到解释。设上例中，受治且非抗药株条件下链球菌快速康复的概率很低（如 0.2）；只要标准 (i)–(iii)——各单元概率值正确的齐一划分——满足，我们仍可解释：患非抗药株且受治的 *x* 何以快速康复。确实，按 *SR* 模型，可解释 *A* 之 *x* 何以是 *B*，即便给定 *A* 与 *x* 所属单元 $C_i$ 时 *B* 的条件概率 $(p_i = P(B\mid A.C_i))$ *低于* *B* 在 *A* 中的先验概率 $(p = P(B\mid A))$。例如：全体链球菌感染者快速康复的先验概率为 0.5，抗药株未治者快速康复的概率为 0.1；我们仍可解释满足 $({-T}.R),$ 诸条件的 *y*（假定他康复了）何以快速康复——引述其所属单元、落入该单元条件下的康复概率，以及上述其他信息。更一般地说，按 *SR* 模型，要紧的不是被解释项结果的概率高低（乃至相对于先验概率的高低），而是所谓解释项是否引述了全部且仅统计相关的因素、所援引的概率是否正确。其后果之一（萨蒙认可，亦承认许多人视为反直觉）：同一解释项 *E* 可既解释被解释项 *M*，又解释与 *M* 不一致者如 $-M$。例如，同一解释项既解释患链球菌且具其他属性（如 *T* 与 $-R$）的受试者何以（若确实如此）快速康复，也解释其何以（若确实不然）不康复。相反，按 *DN* 或 *IS*，若 *E* 解释 *M*，*E* 便不能又解释 $-M$。
