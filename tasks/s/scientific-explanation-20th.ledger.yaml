      ## 7. Conclusions and Stock-Taking
    step1: TBD
    step2: TBD
  - id: 149
    kind: body
    source: |-
      What can we conclude from this recounting of some of the more prominent attempts to construct models of scientific explanation in the period from about 1940 to 2000?
    step1: TBD
    step2: TBD
  - id: 150
    kind: body
    source: |-
      Of course, any effort at stock-taking will reflect a particular point of view, but with this caveat in mind, several observations seem plausible, even if not completely uncontroversial.
    step1: TBD
    step2: TBD
  - id: 151
    kind: body
    source: |-
      ### 7.1 The Role of Causation
    step1: TBD
    step2: TBD
  - id: 152
    kind: body
    source: |-
      One issue concerns the role of causal information in scientific explanation. All of the traditional models considered above attempt to capture causal explanations, although some attempt to capture non-causal explanations as well. It is a natural thought (endorsed by many) that many of the difficulties faced by the models described above derive at least in part from their reliance on inadequate treatments of causation.^{[}[^note-15]^{]} The problems of explanatory asymmetries and explanatory irrelevance described in Section 2.5 seem to show that the holding of a law between *C* and *E* is not sufficient for *C* to cause *E*; hence not a sufficient condition for *C* to figure in an explanation of *E*. If the argument of section 3.3 is correct, a fundamental problem with the *SR* model is that statistical relevance information is insufficient to fully capture causal information in the sense that different causal structures can be consistent with the same information about statistical relevance relationships. Similarly, the *CM* model faces the difficulty that information about causal processes and interactions is also insufficient to fully capture causal relevance relations and that there is a range of cases in which causal relationships hold between *C* and *E* (and hence in which *C* figures in an explanation of *E*) although there is no connecting causal process between *C* and *E*. Finally, a fundamental problem with unificationist models is that the content of our causal judgments does not seem to fall out of our efforts at unification, at least when unification is understood along the lines advocated by Kitcher. For example, as discussed above, considerations having to do with unification do not by themselves explain why it is appropriate to explain effects in terms of their causes rather than vice-versa.
    step1: TBD
    step2: TBD
  - id: 153
    kind: body
    source: |-
      These observations suggest that insofar as we are interested in causal forms of scientific explanation, progress may require more attention to the notion of causation and a more thorough-going integration of discussions of explanation with the burgeoning literature on causation, both within and outside of philosophy.[^note-16] As recounted in the entry on causal approaches to scientific explanation, a good deal of more recent work has moved in this direction.
    step1: TBD
    step2: TBD
  - id: 154
    kind: body
    source: |-
      Does this mean that a focus on causation should entirely replace the project of developing models of explanation or that philosophers should stop talking about explanation and instead talk just about causation? Despite the apparent centrality of causation to many explanations, it is arguable that completely subsuming the latter into the former loses connections with some important issues. For one thing, causal claims themselves seem to vary greatly in the extent to which they are explanatorily deep or illuminating. Causal claims found in Newtonian mechanics seem deeper or more satisfying from the point of view of explanation than causal claims of “the rock broke the window” variety. It is usually supposed that such differences are connected to other features—for example to how general, stable, and coherent with background knowledge a causal claim is. However, notions like “generality” are vague and not all forms of generality seem to be connected to explanatory goodness. So even if one focuses only on causal explanation, there remains the important project of trying to understand better what sorts of distinctions among causal claims matter for goodness in explanation. To the extent this is so, the kinds of concerns that have animated traditional treatments of explanation don’t seem to be entirely subsumable into standard accounts of causation, which have tended to focus largely on the project of distinguishing causal from non-causal relationships rather than on the features that make causal relationships “good” for purposes of explanation.
    step1: TBD
    step2: TBD
  - id: 155
    kind: body
    source: |-
      Another important question, motivated by the above observations about the role of causation in explanation, has to do with whether there are forms of why-explanation that are non-causal. If so, how important are these are in science and what is their structure? Hempel seems to have thought of causal explanations simply as those DN explanations that appeal to causal laws which he regarded as a proper subset of all laws. Thus, on his view, causal and non-causal explanations share a common structure and although there are non-causal explanations in the sense of explanations that do not appeal to causal laws, there is no need for a distinct account of non-causal explanation. Kitcher’s unificationist model was also intended to apply to both causal and non-causal explanations such as unifying argument patterns in linguistics. More recently, there has been a great upsurge of interest in whether there are non-causal forms of explanation, with some claiming they are ubiquitous in science (e.g., Lange 2017, Reutlinger & Saatsi 2018, Ross 2025)[^lange-2017][^reutlinger-2018][^ross-2025]. If there are such explanations, this raises the issue of what distinguishes them from causal explanations and whether there is some overarching theory that subsumes both causal and non-causal explanations.
    step1: TBD
    step2: TBD
  - id: 156
    kind: body
    source: |-
      Put differently the focus on the role of causation suggested by some of the limitations in the accounts described has engendered two quite different responses in recent work on explanation. One is that more satisfactory accounts of explanation require a better understanding of causation. The other, which can be thought of as a sort of reaction to this emphasis on causation, is that a focus on non-causal forms of explanation is a promising direction of research. Both of these have been pursued vigorously in post-twentieth-century work on explanation.
    step1: TBD
    step2: TBD
  - id: 157
    kind: body
    source: |-
      ### 7.2 A Single Model of Explanation?
    step1: TBD
    step2: TBD
  - id: 158
    kind: body
    source: |-
      All of the accounts surveyed above are “monistic” in the sense that they assume that it is possible to construct a single model of explanation which captures all varieties of this notion and which holds for explanations across the various sciences, as well as (it is often assumed) ordinary life contexts.
    step1: TBD
    step2: TBD
  - id: 159
    kind: body
    source: |-
      As noted above, one way in which the attempt to develop a single general model of explanation might fail is that we might conclude that there are causal and non-causal forms of explanation that have little in common. But even putting this possibility aside, another possibility, not well addressed in the accounts surveyed above, is that explanation differs across different areas of science in a way that precludes the development of a single, general model. It is, after all, uncontroversial that explanatory practice—what is accepted as an explanation, how explanatory goals interact with others, what sort of explanatory information is thought to be achievable, discoverable, testable etc.—varies in significant ways across different disciplines. Nonetheless, all of the models of explanation surveyed above are “universalist” in aspiration—they claim that a single, “one size” model of explanation fits all areas of inquiry in so far as these have a legitimate claim to explain. Although the extreme position that explanation in biology or history has nothing interesting in common with explanation in physics seems unappealing, one obvious response to the accounts described above is to develop accounts of explanation that are more sensitive to disciplinary and subject matter differences. Ideally, such models would reveal commonalities across disciplines, but they should also enable us to see why explanatory practice varies as it does across different disciplines and the significance of such variation. For example, biologists, in contrast to physicists, often describe their explanatory goals as the discovery of causal systems that are functional and mechanisms rather than the discovery of laws and in fact a very substantial body of post 2000 work has focused on the elucidation of the concept of a mechanism—again see the entry on causal approaches to scientific explanation.
    step1: TBD
    step2: TBD
  - id: 160
    kind: body
    source: |-
      A closely related point is that at least some of the models described above impose requirements on explanation that may be satisfiable in some domains of inquiry but are either unachievable (in any practically interesting sense) in other domains or, to the extent that they may be achievable, bear no discernible relationship to generally accepted goals of inquiry in those domains. For example, we noted above that many scientists and philosophers hold that there are few if any laws to be discovered in biology and the social and behavioral sciences. If so, models of explanation that assign a central role to laws may not be very illuminating regarding how explanation works in these disciplines. As another example, even if we suppose that the partition into objectively homogeneous reference classes recommended by the *SR* model is an achievable goal in connection with certain quantum mechanical phenomena, it may be that (as suggested above) it is simply not a goal that can be achieved in a non-trivial way in economics and sociology, disciplines in which causal inference from statistics also figures prominently. In such disciplines, it may be that additional statistically relevant partitions of any population or subpopulation of interest will virtually always be possible, so that the activity of finding such partitions is limited only by the costs of gathering additional information. A similar assessment may hold for most applications of the *CM* model to the social sciences.
    step1: TBD
    step2: TBD
