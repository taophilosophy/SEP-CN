      Finally, as emphasized above, a concern with the pragmatics of explanation naturally connects with an interest in the “psychology” of explanation and this in turn suggests the relevance of empirical studies of sorts of information that various subjects (ordinary folks, scientists) find explanatory, treat as providing “understanding”, the distinctions subjects make among explanations and so on. Although there is a growing literature in this area, the most prominent philosophical advocates of pragmatic approaches to explanation have so far tended not to make use of it. In this connection, it is worth pointing out that this psychological literature goes well beyond the truisms found in philosophical discussion about different people finding different sorts of information explanatory depending on their interests. In particular, psychologists have been very interested in exploring general features or structural patterns present in information that various subjects find explanatory. For example, Lombrozo (2010) finds evidence that subjects prefer explanations that appeal to relationships that are relatively stable (in the sense of continuing to hold across changing circumstances)[^note-11] and Lien and Cheng (2000) present evidence that in cases in which the *explanandum* $E$ has a single candidate cause $C$, subjects prefer levels of explanation/causal description that maximize $\Delta p = \Pr(E\mid C) - \Pr(E \mid \text{not-}C)$.
    step1: |-
      最后，如上所述，对解释之语用的关切，自然与对解释“心理学”的兴趣相连；这又提示了经验研究的相关性——各类主体（普通人、科学家）觉得哪些信息有解释力、视之为提供“理解”、在解释之间作何区分，等等。尽管这一领域的文献正在增长，语用进路最著名的哲学倡导者迄今往往未加利用。就此值得一提的是：这片心理学文献早已超出哲学讨论中的老生常谈——不同人依其兴趣而觉得不同信息有解释力。尤其，心理学家极有兴趣探究各类主体觉得有解释力的信息中存在的通泛特征或结构模式。例如，Lombrozo（2010）发现证据表明：主体偏好诉诸相对稳定关系（即在变动情境中继续成立）的解释；[^note-11] Lien 与 Cheng（2000）则提出证据：在被解释项 $E$ 只有单一候选原因 $C$ 的情形中，主体偏好使 $\Delta p = \Pr(E\mid C) - \Pr(E \mid \text{not-}C)$ 最大化的解释／因果描述层级。
    step2: |-
      末了，如上所述，关切解释之语用，自然连着对解释“心理学”的兴趣，进而提示经验研究的相关性——各类主体（常人、科学家）以何种信息为有解释力、何者提供“理解”、如何在解释间作区分，等等。此域文献虽渐多，语用进路最著名的哲学倡导者迄今往往未予利用。值得一提的是：心理学文献早已超出哲学中的老生常谈（人各因其兴趣而以不同信息为解释）。尤其，心理学家甚愿探究诸主体视为有解释力的信息中所含的通泛特征或结构模式。例如 Lombrozo（2010）取证谓：主体偏好诉诸相对稳定（于变动情境中仍成立）之关系的解释；[^note-11] Lien 与 Cheng（2000）则取证谓：当被解释项 $E$ 仅有单一候选原因 $C$ 时，主体偏好使 $\Delta p = \Pr(E\mid C) - \Pr(E \mid \text{not-}C)$ 最大化的解释／因果描述层级。
