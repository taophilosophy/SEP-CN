    source: |-
      Issues concerning scientific explanation have been a focus of philosophical attention from Pre-Socratic times through the modern period. However, modern discussion really begins with the development of the Deductive-Nomological (*DN*) model. This model has had many advocates (including Popper 1959, Braithwaite 1953, Gardiner, 1959, Nagel 1961)[^braithwaite-1953][^nagel-1961][^popper-1959] but unquestionably the most detailed and influential statement is due to Carl Hempel (1942, 1965a, and Hempel & Oppenheim 1948)[^hempel-1948]. These papers and the reaction to them have structured subsequent discussion concerning scientific explanation to an extraordinary degree. After some general remarks by way of background and orientation (Section 1), this entry describes the *DN* model and its extensions, and then turns to some well-known objections (Section 2). It next describes a variety of subsequent attempts to develop alternative models of explanation, including Wesley Salmon’s *Statistical Relevance* (Section 3) and *Causal Mechanical* (Section 4) models, *Unificationist* models due to Michael Friedman and Philip Kitcher (Section 5), and *Pragmatic* theories found in the work of van Fraassen (Section 6). Section 7 provides a summary and briefly discusses the impact on more recent work. This entry thus discusses treatments of scientific explanation up to the end of the twentieth century. For a discussion of more recent work on scientific explanation, see the entry on causal approaches to scientific explanation.
    step1: |-
      自前苏格拉底时代直至现代，科学解释问题一直是哲学关注的焦点。不过，现代讨论真正始于演绎—律则（Deductive-Nomological，*DN*）模型的发展。该模型有许多拥护者（包括 Popper 1959, Braithwaite 1953, Gardiner 1959, Nagel 1961）[^braithwaite-1953][^nagel-1961][^popper-1959]，但无疑以卡尔·亨佩尔（Carl Hempel，1942, 1965a，及 Hempel & Oppenheim 1948）的表述最为详尽、最具影响[^hempel-1948]。这些论文及对它们的回应，在极大程度上塑造了此后关于科学解释的讨论。本条目先作若干背景与定向的一般说明（第 1 节），继而描述 *DN* 模型及其扩展，然后转向若干著名反驳（第 2 节）。接下来描述此后发展替代性解释模型的各种尝试，包括韦斯利·萨蒙的*统计相关性*模型（第 3 节）与*因果机制*模型（第 4 节）、迈克尔·弗里德曼与菲利普·基切尔提出的*统一论*模型（第 5 节），以及范弗拉森著作中的*语用*理论（第 6 节）。第 7 节作总结，并简要讨论其对晚近研究的影响。因此，本条目讨论的是截至 20 世纪末的科学解释研究。关于晚近科学解释工作的讨论，见「科学解释的因果进路」条目。
