      There is considerable disagreement over whether such generalizations are laws. Some philosophers (e.g., Woodward 2000)[^woodward-2000] suggest that such generalizations satisfy too few of the standard criteria to count as laws but can nevertheless figure in explanations; if so, it apparently follows that we must abandon the *DN* requirement that all explanations must appeal to laws. Others (e. g., Mitchell 1997)[^mitchell-1997], emphasizing different criteria for lawfulness, conclude instead that generalizations like (M) are laws and hence no threat to the requirement that explanations must invoke laws. In the absence of a more principled account of laws, it is hard to evaluate these competing claims and hence hard to assess the implications of the *DN* model for the special sciences. At the very least, providing such an account is an important item of unfinished business for advocates of the *DN* model.
