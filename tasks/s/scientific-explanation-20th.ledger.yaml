      In a more recent paper (Salmon 1997)[^salmon-1997], Salmon conceded this point. He agreed that the notion of a causal process cannot by itself capture the notion of causal and explanatory relevance. He suggested, however, that this notion can be adequately captured by appealing to the notion of a causal process *and* information about statistical relevance relationships (that is, information about conditional and unconditional (in)dependence relationships), with the latter capturing the element of causal or explanatory dependence that was missing from his previous account:
