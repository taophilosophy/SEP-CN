      A second set of worries has to do with the application of the *CM* model to systems which depart in various respects from simple physical paradigms such as the collision described above. There are a number of examples of such systems. First, there are theories like Newtonian gravitational theory which involve “action at a distance” in a physically interesting sense. Second, there are a number of examples from the literature on causation that do not involve physically interesting forms of action at a distance but which arguably involve causal interactions without intervening spatio-temporally continuous processes or transfer of energy and momentum from cause to effect. These include cases of causation by omission and causation by “double prevention” or “disconnection.”[^note-6] In all these cases, a literal application of the *CM* model seems to yield the judgment that no explanation has been provided—that Newtonian gravitational theory is unexplanatory and so on. Many philosophers have been reluctant to accept this assessment.
    step1: |-
      第二类担忧关涉 *CM* 模型应用于在诸方面偏离上述简单物理范式的系统。这样的系统例子甚多。其一，有牛顿引力理论之类在物理上有意味的意义上涉及“超距作用”的理论。其二，因果文献中有一批例子，并不涉及物理上有意味的超距作用形式，却可论证地包含没有中介的时空连续过程、或没有从因到果的能量与动量传递的因果相互作用，包括遗漏所致的因果性（causation by omission）与“双重阻止”或“断连”所致的因果性。[^note-6] 在所有这些情形中，照字面应用 *CM* 模型似乎会得出这样的判断：没有提供任何解释——牛顿引力理论是无解释力的，等等。许多哲学家不愿接受这一评估。
    step2: |-
      第二类担忧关涉 *CM* 模型对复杂系统的应用——这些系统在诸方面偏离上述简单物理范式。其例甚多。其一，牛顿引力理论之类在物理上有意味的意义上涉及“超距作用”。其二，因果文献中一批例子并不涉及物理上有意味的超距作用，却可论证地含有无中介时空连续过程、无能量动量自因向果传递的因果相互作用，如遗漏之因果、“双重阻止”或“断连”之因果。[^note-6] 凡此种种，照字面应用 *CM* 模型似乎都得出：没有提供解释——牛顿引力理论无解释力，等等。许多哲学家不肯接受这一评估。
