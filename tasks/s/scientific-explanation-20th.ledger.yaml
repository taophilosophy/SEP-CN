      To characterize the *SR* model more precisely we need the notion of a *homogenous partition.* A homogenous partition of $A$ is a set of subclasses or cells $C_i$ of $A$ that are mutually exclusive and exhaustive, where $P(B\mid A.C_i) \ne P(B\mid A.C_j)$ for all $C_i \ne C_j$ and where no further statistically relevant partition of any of the cells $A$, $C_i$ can be made with respect to $B$—that is, there are no additional attributes $D_k$ in $A$ such that

      $$P(B\mid A.C_i) \ne P(B\mid A.C_i.D_k).$$
    step1: |-
      要更精确地刻画 *SR* 模型，需要*齐一划分*这一概念。$A$ 的一个齐一划分是 $A$ 的一组互斥且穷尽的子类或单元 $C_i$，对所有 $C_i \ne C_j$ 满足 $P(B\mid A.C_i) \ne P(B\mid A.C_j)$，且就 $B$ 而言，不能再对单元 $A$、$C_i$ 中的任何一个作出统计相关的进一步划分——也就是说，$A$ 中不存在额外的属性 $D_k$ 使得 $$P(B\mid A.C_i) \ne P(B\mid A.C_i.D_k).$$
    step2: |-
