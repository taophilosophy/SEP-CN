      In the context of theories of explanation, however, the label “pragmatic” is usually intended to suggest a somewhat different set of associations. In particular, as noted above, “pragmatic” is typically used to characterize considerations having to do with facts about the psychology (interests, beliefs etc.) of those involved in providing or receiving explanations and/or to characterize considerations involving the local context, often with the suggestion that both sets of considerations may vary in complex and idiosyncratic ways that resist incorporation into the sort of general theory sought by traditional models.[^note-10] Call this set of associations “pragmatic₂”. Neither Hempel’s nor Woodward’s theory is pragmatic₂. In particular, as the example of the *DN* model illustrates, the fact that a theory is pragmatic₁ in the sense that it appeals to facts about goals generally shared by human beings (such as prediction) to help to motivate a model of explanation does *not* preclude attempting to construct models of explanation satisfying traditional goals and does not require commitment to the idea that explanation must be understood as a pragmatic₂ notion. We need to be careful to distinguish these two different ways of thinking about the “pragmatic” dimension of explanation.
    step1: |-
      然而，在解释理论的语境中，“语用”这个标签通常意在唤起一组稍有不同的联想。尤其，如上所述，“语用”通常用来刻画与解释的提供者或接受者之心理事实（兴趣、信念等）有关的考量，和／或用来刻画涉及局部语境的考量，且往往带有这样的暗示：两组考量都可能以复杂而各自特有的方式变动，抗拒被纳入传统模型所寻求的那种一般理论。[^note-10] 称这组联想为“语用₂”。亨佩尔与伍德沃德的理论都不是语用₂。尤其，如 *DN* 模型之例所示：一个理论是语用₁的——即诉诸人类普遍共享的目标（如预测）方面的事实来帮助动机化一个解释模型——这一事实*并不*排斥构造满足传统目标的解释模型之尝试，也*并不*要求承诺解释必须被理解为语用₂概念。我们需要小心区分思考解释“语用”维度的这两种不同方式。
    step2: |-
      但在解释理论中，“语用”标签通常意在唤起另一组联想。如上所述，它多用来刻画与解释提供者或接受者的心理事实（兴趣、信念等）有关的考量，和／或涉及局部语境的考量，且往往暗含：两组考量皆可能以复杂而各异的方式变动，抗拒纳入传统模型所求的一般理论。[^note-10] 此组联想可称“语用₂”。亨佩尔与伍德沃德的理论皆非语用₂。如 *DN* 模型所示：一理论之为语用₁——诉诸人同此心的目标（如预测）以动机化解释模型——*并不*排斥构造合乎传统目标的模型，亦*不*要求承诺解释须作语用₂理解。思及解释的“语用”维度，须分辨此二路。
