      A second issue concerns an important ambiguity in the notion of “pragmatic”. On one natural understanding of this notion, a pragmatic consideration is one that has to do with utility or usefulness in the service of some goal connected to human interests, where these interests are in some relevant sense “practical”. Call this notion “pragmatic₁”. On this construal, Hempel’s *DN* model might be correctly characterized as a pragmatic₁ theory since it links explanatory information closely to the provision of information that is useful for purposes of prediction and prediction certainly qualifies as a pragmatic goal. For similar reasons, Woodward’s (2003) theory of explanation might also be counted as a pragmatic₁ theory since it connects explanation with the provision of information that is useful for manipulation and control—unquestionably useful goals. As these examples suggest, models of explanation that aspire to traditional goals can be pragmatic₁ theories.
    step1: |-
      第二个问题关乎“语用”概念的一个重要歧义。对这个概念的一种自然理解是：语用考量是关乎效用或有用性的考量，服务于与人类利益相连的某个目标，而这些利益在相关意义上是“实践的”。称这一概念为“语用₁”。照此理解，亨佩尔的 *DN* 模型或许可以被正确地刻画为语用₁理论，因为它把解释性信息与对预测有用的信息紧密联系起来，而预测当然算得一个实践目标。出于类似理由，伍德沃德（2003）的解释理论也可算作语用₁理论，因为它把解释与对操控和控制有用的信息联系起来——这无疑是有益的目标。这些例子提示：以传统目标自期的解释模型，可以是语用₁理论。
    step2: |-
      第二问题关乎“语用”一词的重要歧义。依一种自然理解，语用考量即关乎效用或有用性的考量，服务于与人类利益相连之目标，而这些利益在相关意义上是“实践的”。此概念可称“语用₁”。照此，亨佩尔的 *DN* 模型不妨正确地表为语用₁理论：它把解释性信息与对预测有用的信息紧相连，而预测自是实践目标。同理，Woodward（2003）之理论亦可算语用₁理论，因为它把解释与对操控、控制有用的信息相联——此无疑为有益目标。由这些例子可见：以传统目标自期的解释模型，不妨是语用₁理论。
