      It is arguable that (*L*) meets the criteria for lawfulness imposed by Hempel and many other writers. (If one wants to deny that (*L*) is a law one needs some principled, generally accepted basis for this judgment and, as explained above, it is unclear what this basis is.) Moreover, (5) is certainly a sound deductive argument in which (*L*) occurs as an essential premise. Nonetheless, most people judge that (*L*) and (*K*) are no explanation of (*E*). There are many other similar illustrations. For example (Kyburg 1965)[^kyburg-1965], it is presumably a law (or at least an exceptionless, counterfactual supporting generalization) that all samples of table salt that have been hexed by being touched with the wand of a witch dissolve when placed in water. One may use this generalization as a premise in a *DN* derivation which has as its conclusion that some particular hexed sample of salt has dissolved in water. But again the hexing is irrelevant to the dissolving and such a derivation is no explanation.
    step1: |-
      可以说，(*L*) 满足亨佩尔与许多其他论者所设定的律性标准。（若有人想否认 (*L*) 是律，就需要某种有原则且被普遍接受的根据；而上文已经说明，这一根据何在并不清楚。）此外，(5) 显然是一个可靠的演绎论证，其中 (*L*) 作为本质前提出现。然而多数人判断：(*L*) 与 (*K*) 并不是 (*E*) 的解释。类似的例证还有很多。例如（Kyburg 1965）[^kyburg-1965]，这大概是一条律（或至少是一条无例外、支持反事实的概括）：一切被女巫以魔杖触碰而“施法”过的食盐样品，放入水中都会溶解。人们可以用这一概括作前提，在一个 *DN* 推导中得出结论：某个特定的被施法盐样品已在水中溶解。但同样，施法与溶解无关，这样的推导不是解释。
