      Much of the subsequent literature on explanation has been motivated by attempts to capture the features of causal or explanatory relevance that appear to be left out of examples like (4) and (5), typically within the empiricist constraints described above. Wesley Salmon’s statistical relevance (or *SR*) model (Salmon 1971a)[^salmon-1971a] is a very influential attempt to capture these features in terms of the notion of statistical relevance or conditional dependence relationships. Given some class or population $A$, an attribute $C$ will be *statistically relevant* to another attribute $B$ if and only if $P(B\mid A.C) \ne P(B\mid A)$—that is, if and only if the probability of $B$ conditional on $A$ and $C$ is different from the probability of $B$ conditional on $A$ alone. The intuition underlying the *SR* model is that statistically relevant properties (or information about statistically relevant relationships) are explanatory and statistically irrelevant properties are not. In other words, the notion of a property making a difference for an explanandum is unpacked in terms of statistical relevance relationships.
    step1: |-
      此后解释文献的很大一部分，其动机是试图捕捉 (4)(5) 这类例子所遗漏的因果或解释相关性特征，且通常是在上述经验主义限制之内。韦斯利·萨蒙的统计相关性（*SR*）模型（Salmon 1971a）[^salmon-1971a] 是极有影响的一次尝试，它用统计相关性或条件依赖关系来刻画这些特征。给定某个类或总体 $A$，属性 $C$ 对另一属性 $B$ *统计相关*，当且仅当 $P(B\mid A.C) \ne P(B\mid A)$——也就是说，当且仅当在 $A$ 与 $C$ 条件下 $B$ 的概率不同于仅在 $A$ 条件下 $B$ 的概率。*SR* 模型底层的直觉是：统计相关的属性（或关于统计相关关系的信息）是解释性的，统计不相关的属性则否。换言之，“某属性对被解释项有影响”这一观念，用统计相关性关系来阐释。
    step2: |-
      此后解释文献的很大一部分，动机正在于捕捉 (4)(5) 这类例子遗漏的因果或解释相关性，且通常不越上述经验主义限制。韦斯利·萨蒙的统计相关性（*SR*）模型（Salmon 1971a）[^salmon-1971a] 是极有影响的一次尝试，以统计相关性、条件依赖关系刻画这些特征。给定某个类或总体 $A$：属性 $C$ 对另一属性 $B$ *统计相关*，当且仅当 $P(B\mid A.C) \ne P(B\mid A)$——即在 $A$ 与 $C$ 之下 $B$ 的概率，不同于仅在 $A$ 之下 $B$ 的概率。*SR* 模型的直觉是：统计相关的属性（或此类关系的信息）具解释性，统计不相关者则否。换言之，“属性对被解释项有影响”一语，即以统计相关性关系阐释。
