      ### 2.1 基本观念
  - id: 12
    kind: body
    source: |-
      According to the Deductive-Nomological Model, a scientific explanation consists of two major “constituents”: an *explanandum*, which is a sentence “describing the phenomenon to be explained” and an *explanans*, “the class of those sentences which are adduced to account for the phenomenon” (Hempel & Oppenheim 1948 [1965: 247])[^hempel-1948]. For the explanans to successfully explain the explanandum several conditions must be met. First, “the explanandum must be a logical consequence of the explanans” and “the sentences constituting the explanans must be true” (Hempel 1948 [1965: 248])[^hempel-1948]. That is, the explanation should take the form of a sound deductive argument in which the explanandum follows as a conclusion from the premises in the explanans. This is the “deductive” component of the model. Second, the explanans must contain at least one “law of nature” and this must be an *essential* premise in the derivation in the sense that the derivation of the explanandum would not be valid if this premise were removed. This is the “nomological” component of the model—“nomological” being a philosophical term of art which, suppressing some niceties, means (roughly) “lawful”. In its most general formulation, the *DN* model is meant to apply both to the explanation of “general regularities” or “laws” such as (to use Hempel and Oppenheim’s examples) why light conforms to the law of refraction and also to the explanation of particular events, conceived as occurring at a particular time and place, such as the bent appearance of the partially submerged oars of a rowboat on a particular occasion of viewing. As an additional illustration of a *DN* explanation of a particular event, consider a derivation of the position of Mars at some future time from Newton’s laws of motion, the Newtonian inverse square law governing gravity, and information about the mass of the sun, the mass of Mars and the present position and velocity of each. In this derivation the various Newtonian laws figure as essential premises and they are used, in conjunction with appropriate information about initial conditions (the masses of Mars and the sun and so on), to derive the explanandum (the future position of Mars) via a deductively valid argument. The *DN* criteria are thus satisfied.
    step1: |-
      按演绎—律则模型，一个科学解释由两个主要“构件”组成：*被解释项*（*explanandum*），即“描述待解释现象”的语句；以及*解释项*（*explanans*），即“为说明该现象而援引的那类语句”（Hempel & Oppenheim 1948 [1965: 247]）[^hempel-1948]。解释项要成功解释被解释项，须满足若干条件。第一，“被解释项必须是解释项的逻辑后承”，且“构成解释项的语句必须为真”（Hempel 1948 [1965: 248]）[^hempel-1948]。也就是说，解释应采取可靠演绎论证的形式：被解释项作为结论从解释项中的前提推出。这是该模型的“演绎”成分。第二，解释项必须至少含有一条“自然律”，且该前提在推导中必须是*本质性的*——即若去掉该前提，对被解释项的推导便不成立。这是该模型的“律则”成分——“律则的”（nomological）是个哲学专门术语，略去若干细节，大意是“合乎律的”。在其最一般的表述中，*DN* 模型意在同时适用于“一般规则性”或“律”的解释（用亨佩尔与奥本海姆的例子：光为何遵循折射定律），以及特定事件的解释（设想发生于特定时间地点的事件：例如某次观看时，划艇部分没入水中的桨为何显得弯折）。作为 *DN* 解释特定事件的又一例证，试看由牛顿运动定律、支配引力的牛顿平方反比定律，以及关于太阳质量、火星质量及二者当前位置与速度的信息，推导火星在未来某时刻的位置。在此推导中，各条牛顿定律作为本质性前提，与关于初始条件的适当信息（火星与太阳的质量等）一起，经由演绎有效的论证推出被解释项（火星的未来位置）。*DN* 标准由此得到满足。
