      诸家说明——亨佩尔（此处只论 *DN* 而不论 *IS*）、萨蒙、基切尔等——虽差异甚多，却大体共享一个总括构想（解释理论工程当包含什么），并在相当程度上共享其成功标准。解释的“语用”理论在紧要处背离这一共识。所谓理论含“语用”成分，指：(i) 依该理论，此成分须不可化约地诉诸解释的提供者或接受者之兴趣、信念等心理特征的事实；且／或 (ii) 须不可化约地诉诸解释所在的“语境”（其意见下文）。上列诸家虽同意语用成分在解释活动中有一定作用，仍假定解释概念有一非语用的核心，而理论的中心任务即把握之。亦即：此核心可不诉诸解释者或听众的心理特征而加以规定，且所诉诸的是足够一般、抽象、“结构性的”非语境特征——在不同内容、不同语境的各种解释之间一律成立。演绎后承、统计相关性一类关系，便是这类“结构性”关系的候选。此外，他们视理论目标为把握*正确*解释，而非某解释是否被某听众认作解释（后者大概取决于听众是否懂所用词项）。就此而言，“正确”至少要求解释项为真或“充分确证”，并与被解释项处于正确关系。最后，如导言所说，此传统的理论家*并未*以穷尽英语 explanation 一词的诸用法为目标，而只关注一类远为受限的例子：有意思的是解释某结果或普遍现象*为何*发生，而非解释词义或如何解微分方程。如此限定的理由只是一个判断：限此范围，更可能得出有意义且不平凡的理论。为便引用，称之为解释理论任务的“传统”构想。
