      One issue concerns the role of causal information in scientific explanation. All of the traditional models considered above attempt to capture causal explanations, although some attempt to capture non-causal explanations as well. It is a natural thought (endorsed by many) that many of the difficulties faced by the models described above derive at least in part from their reliance on inadequate treatments of causation.^{[}[^note-15]^{]} The problems of explanatory asymmetries and explanatory irrelevance described in Section 2.5 seem to show that the holding of a law between *C* and *E* is not sufficient for *C* to cause *E*; hence not a sufficient condition for *C* to figure in an explanation of *E*. If the argument of section 3.3 is correct, a fundamental problem with the *SR* model is that statistical relevance information is insufficient to fully capture causal information in the sense that different causal structures can be consistent with the same information about statistical relevance relationships. Similarly, the *CM* model faces the difficulty that information about causal processes and interactions is also insufficient to fully capture causal relevance relations and that there is a range of cases in which causal relationships hold between *C* and *E* (and hence in which *C* figures in an explanation of *E*) although there is no connecting causal process between *C* and *E*. Finally, a fundamental problem with unificationist models is that the content of our causal judgments does not seem to fall out of our efforts at unification, at least when unification is understood along the lines advocated by Kitcher. For example, as discussed above, considerations having to do with unification do not by themselves explain why it is appropriate to explain effects in terms of their causes rather than vice-versa.
    step1: |-
      一个问题关涉因果信息在科学解释中的作用。上文考察的所有传统模型都试图捕捉因果解释，尽管其中一些也试图捕捉非因果解释。一个自然的想法（许多人赞同）是：上述模型面临的许多困难，至少部分源于它们依赖对因果的不充分处理。^{[}[^note-15]^{]} 第 2.5 节所述的解释不对称与解释不相关问题似乎表明：*C* 与 *E* 之间存在律，并不足以使 *C* 引起 *E*；故也不是 *C* 出现在对 *E* 的解释中的充分条件。若第 3.3 节的论证正确，*SR* 模型的一个根本问题是：统计相关性信息不足以完全捕捉因果信息——不同因果结构可以与同一组统计相关性关系信息相容。类似地，*CM* 模型面临的困难是：关于因果过程与相互作用的信息同样不足以完全捕捉因果相关性关系；且存在一大批情形，其中 *C* 与 *E* 之间有因果关系（故 *C* 出现在对 *E* 的解释中），尽管 *C* 与 *E* 之间没有联结性因果过程。最后，统一论模型的一个根本问题是：我们因果判断的内容似乎并不从统一努力中掉出，至少当统一按基切尔所主张的路线来理解时如此。例如，如上所述，与统一有关的考量本身并不能解释：为何用原因解释结果是恰当的，而非相反。
