      关于这类概括是否为律，存在相当大的分歧。有些哲学家（如 Woodward 2000）[^woodward-2000] 认为，这类概括满足的标准太少，不足以算作律，但仍可出现在解释中；若如此，显然我们就必须放弃 *DN* 模型“一切解释都必须诉诸律”的要求。另一些人（如 Mitchell 1997）[^mitchell-1997] 强调不同的律性标准，反而断定像（M）这样的概括就是律，因而对“解释必须援引律”的要求不构成威胁。在缺乏更有原则的律理论的情况下，很难评价这些相互竞争的主张，因而也很难评估 *DN* 模型对特殊科学的意涵。至少可以说，提供这样一种理论，是 *DN* 模型拥护者一项重要的未竟事业。
