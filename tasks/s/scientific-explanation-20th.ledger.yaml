      One of the most influential recent pragmatic accounts of explanation is associated with constructive empiricism.[^note-12] This is the thesis, defended by Bas van Fraassen in his 1980 book, *The Scientific Image*, that the aim of science (or at least “pure” science) is the construction of theories that are “empirically adequate” (that is, that yield a true or correct description of observables) and not, as scientific realists suppose, theories that aim to tell literally true stories about unobservables. Relatedly, “acceptance” of a theory involves only the belief that it is empirically adequate (van Fraassen 1980: 12)[^fraassen-1980]. van Fraassen’s account of explanation, which is laid out in several articles and, most fully, in Chapter Six of his book, is meant to fit with this overall conception of science: it is a conception according to which explanation per se is not an epistemic aim of “pure” science (empirical adequacy is the only such aim), but rather a “pragmatic” virtue, having to do with the “application” of science. (Note that the application of science is arguably a matter of pragmatics₁. However, the idea that explanation has to do with the application of science is used to motivate the adoption of a pragmatic₂ theory of explanation. We thus have an elision of the two notions of “pragmatic” distinguished above.) According to van Fraassen, because explanation is a merely pragmatic virtue, a concern with explanation is not something that can require scientists to move beyond belief in the empirical adequacy of their theories to belief in the literal truth of claims about unobservable entities.
    step1: |-
      晚近最有影响的语用解释说明之一，与建构经验主义相连。[^note-12] 这是巴斯·范弗拉森在其 1980 年著作《科学的形象》（*The Scientific Image*）中捍卫的论题：科学（或至少“纯粹”科学）的目标是构造“经验上充足”的理论（即对可观察者给出真实或正确的描述），而非如科学实在论者所设想的、旨在关于不可观察者说出字面上为真的故事。相关地，“接受”一个理论仅涉及相信它经验上充足（van Fraassen 1980: 12）[^fraassen-1980]。范弗拉森的解释说明见于数篇文章，并在该书第六章中得到最充分的陈述，意在契合这一关于科学的总构想：依此构想，解释本身并非“纯粹”科学的认识论目标（经验充足性是唯一此类目标），而是一种“语用”美德，关乎科学的“应用”。（注意：科学之应用可以说是语用₁之事。然而，“解释关乎科学之应用”这一想法被用来动机化对语用₂解释理论的采纳。于是我们对上文区分的两个“语用”概念作了一次滑转。）据范弗拉森，既然解释只是语用美德，对解释的关切就不能要求科学家越过对其理论经验充足性的信念，去相信关于不可观察实体之主张的字面为真。
