    step1: |-
      然而，正如 John Longeway 在本词条的早先版本中所指出的，西蒙对此改变了主意。这一改变体现在他第二部《后分析篇》注释的第 49 问中，他在那里处理存在是否为添加于本质之上的某物这一问题。在这里，西蒙以如下论证反对阿奎那“存在是添加于本质之上的某物”的主张：
    step2: |-
      不过，正如 John Longeway 在本词条早先版本中所指出的，西蒙后来改变了看法。这一转变见于他第二部《后分析篇》注释的第 49 问——他在这里追问：存在是否是添加于本质之上的某物。西蒙用下述论证反驳阿奎那“存在是添加于本质之上的某物”一说：
  - id: 67
    kind: body
    source: |-
      1. If added existence is something real, then it is actual.
      2. So, it is either a first or a second actuality.
      3. Not a first, because a first actuality is not different from the essence.
      4. Not a second, because a second actuality is an operation that presupposes actual existence.
      5. Moreover, it cannot be a third actuality, because this is contrary to Aristotelian doctrine (furthermore, it would lead to an infinite regress, as Radulphus Brito would point out).
      6. Therefore, added existence is not something real. (Longeway 2000: 7–8)[^longeway-2000]
    step1: |-
      1. 若添加的存在是某种实在的东西，那么它就是现实的。
      2. 因此，它要么是第一现实性，要么是第二现实性。
      3. 不是第一现实性，因为第一现实性与本质并无不同。
      4. 不是第二现实性，因为第二现实性是一种以现实存在为前提的活动。
      5. 此外，它也不可能是第三现实性，因为这违背亚里士多德学说（而且，正如拉杜尔夫·布里托会指出的，这会导向无穷倒退）。
      6. 因此，添加的存在不是某种实在的东西。（Longeway 2000: 7–8）[^longeway-2000]
    step2: |-
      1. 添加的存在若是某种实在之物，便是现实的。
      2. 于是它要么是第一现实性，要么是第二现实性。
      3. 不会是第一现实性：第一现实性与本质并无分别。
      4. 不会是第二现实性：第二现实性是一种以现实存在为前提的活动。
      5. 它也不可能是第三现实性——这违背亚里士多德学说（况且，正如拉杜尔夫·布里托会指出的，这会陷入无穷倒退）。
      6. 因此，添加的存在并非某种实在之物。（Longeway 2000: 7–8）[^longeway-2000]
  - id: 68
    kind: body
    source: |-
      Even so, Simon still holds that existence is something added to created beings. But how, if not as something real? Since we can understand what a thing is without considering its possible modes of existence (i.e., actual, mental etc.), it seems that there is indeed a distinction between essence and existence (cf. Longeway 2000: 9)[^longeway-2000]. So, the distinction is either notional or real. It is not real, as was shown with the argument above. Therefore, the distinction must be notional: since the definition of an essence does not include existence at all, existence must be a notion added to the essential definition, a notion that refers to the relation of a substance to its cause (cf. Longeway 2000: 10–11)[^longeway-2000]. Hence, we can think of a substance as some kind of thing (e.g., a man) according to its essence (*esse essentiae*), but we can also think of it as something that exists in a causally ordered reality, according to its being in an effect (*esse in effectu*) (cf. Longeway 2000: 13)[^longeway-2000].
    step1: |-
      即便如此，西蒙仍主张存在是添加于受造存在者之上的某物。但若非作为实在之物，又如何可能？既然无需考虑事物可能如何存在（现实地、心灵地等等）就能理解一物是什么，本质与存在之间似乎确实有区分（参 Longeway 2000: 9）[^longeway-2000]。因此，这一区分要么是概念性的，要么是实在的。它不是实在的，正如上述论证所表明。所以，这一区分必是概念性的：既然本质的定义根本不包含存在，存在就必是添加于本质定义之上的一个概念，它指涉实体与其原因的关系（参 Longeway 2000: 10–11）[^longeway-2000]。因此，我们可以按其本质（*esse essentiae*）把实体思考为某种东西（例如一个人），也可以按其在一个结果中的存在（*esse in effectu*）把它思考为存在于一个因果有序的实在中的某物（参 Longeway 2000: 13）[^longeway-2000]。
    step2: |-
      即便如此，西蒙仍认为存在是添加于受造存在者之上的某物。可若不是实在之物，又当如何？既然无需考虑事物可能如何存在（现实地、心灵地等等）就能理解一物是什么，本质与存在之间似乎确有区分（参 Longeway 2000: 9）[^longeway-2000]。那么，这一区分要么是概念性的，要么是实在的。它并非实在的——上述论证已表明此点。因此，区分只能是概念性的：本质的定义全然不含存在，所以存在必是添加于本质定义之上的一个概念，指涉实体与其原因的关系（参 Longeway 2000: 10–11）[^longeway-2000]。于是，我们可以按本质（*esse essentiae*）把实体想成某种东西（例如一个人），也可以按其在结果中的存在（*esse in effectu*）把它想成存在于一个因果有序的实在之中的某物（参 Longeway 2000: 13）[^longeway-2000]。
