    source: |-
      Simon of Faversham († 1306) was a thirteenth-century British scholar, mainly known as a commentator on Aristotle’s logic and natural philosophy. He is considered a modist, among other things because of his use of the notions of *modi praedicandi* and *modi essendi* in his commentary on Aristotle’s *Categories* (cf. Marmo 1999)[^marmo-1999]. Simon’s work as an Aristotelian commentator heavily relies on Albert the Great’s paraphrases on the Aristotelian corpus. His question-commentaries sometimes portray key medieval discussions in a somewhat undeveloped state, but also offer uniquely developed discussions, for instance his discussion of the Meno paradox in his commentaries on *Posterior Analytics* and his treatment of empty reference. In the places where his discussions are well developed, he exhibits good philosophical analysis and resourcefulness. Simon’s works are also of great historical interest because they represent an important stage in the development of thirteenth-century philosophical ideas. His corpus is relatively unexplored, and although an important part of it is extant, a large part is also unedited.
    step1: |-
      法弗舍姆的西蒙（Simon of Faversham，† 1306）是十三世纪的英国学者，主要以亚里士多德逻辑学与自然哲学的注释者而知名。他被视为一位模态主义者（modist），原因之一在于他在注释亚里士多德《范畴篇》时使用了 *modi praedicandi*（述谓样式）与 *modi essendi*（存在样式）两个概念（参 Marmo 1999）[^marmo-1999]。西蒙作为亚里士多德注释者的工作，严重依赖大阿尔伯特对亚里士多德全集的释义。他的问题集注释有时把中世纪的关键讨论呈现为某种尚未充分发展的状态，但也提供了独特地得到发展的讨论，例如他在《后分析篇》注释中对美诺悖论的讨论，以及他对空指称的处理。在他的讨论得到充分发展之处，他表现出良好的哲学分析与智巧。西蒙的著作还具有极大的历史意义，因为它们代表了十三世纪哲学观念发展中的重要阶段。他的著作群相对未经探索，虽然其中重要的一部分存世，但很大一部分也尚未校订。
    step2: |-
      法弗舍姆的西蒙（Simon of Faversham，† 1306）是十三世纪的英国学者，主要以亚里士多德逻辑学与自然哲学的注释者而知名。他被视为模态主义者（modist），原因之一，是他在注释亚里士多德《范畴篇》时使用了 *modi praedicandi*（述谓样式）与 *modi essendi*（存在样式）这两个概念（参 Marmo 1999）[^marmo-1999]。作为亚里士多德注释者，西蒙的工作大量倚仗大阿尔伯特对亚里士多德全集的释义。他的问题集注释有时把中世纪的关键讨论呈现为尚未充分展开的形态，却也提供了独到的展开，例如他在《后分析篇》诸注释中对美诺悖论的讨论，以及他对空指称的处理。凡讨论得到充分展开之处，他都显出良好的哲学分析与巧思。西蒙的著作还具有极大的历史意义：它们代表了十三世纪哲学观念发展中的一个重要阶段。他的著作群相对而言未经充分研究；其中重要的一部分虽已存世，很大一部分却仍未校订。
