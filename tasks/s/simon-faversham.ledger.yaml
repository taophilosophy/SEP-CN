      ### 3.3 Truth and Empty Reference
    step1: TBD
    step2: TBD
  - id: 29
    kind: body
    source: |-
      Simon also discusses whether truth is a property of thoughts or of things. He gives a solution typical of the period, according to which truth is above all a property of the knowing subject who is in possession of a true belief (*In Perih.*: q.6).
    step1: TBD
    step2: TBD
  - id: 30
    kind: body
    source: |-
      Simon accepts the common medieval definition of a true belief as one that is adequate (*adequatio*) with the way things are. However, unlike other thirteenth-century masters of arts (e.g., Robert Kilwardby and Radulphus Brito), Simon maintains that this adequation concerns the second, and composite, operation of the intellect—composition and division—as well as the first, and simple, one—the apprehension of essences (*In Perih*.: q.6). Hence, while other masters hold that adequation can only obtain between composite items (i.e., composite thoughts and composite things), Simon holds that, since the intellectual grasping of an essence is naturally in agreement with this essence, it is also susceptible of truth (*In Perih*.: q.6). Regarding the truth of composite items, however, Simon’s position is remarkably elegant, as is evident in his discussion of empty reference in the commentary on the *Prior Analytics*.
    step1: TBD
    step2: TBD
  - id: 31
    kind: body
    source: |-
      Simon’s position as regards empty reference is crucially different from the one held by modists such as Boethius of Dacia and Radulphus Brito, who claim that the truth-makers of essential predications, such as ‘the human is an animal’, are real things in the external world, so that ‘the human is an animal’ would be false if no human existed.[^note-7] Simon, by contrast, claims that it is true, supporting his claim with an elegant account of truth-determination. According to him, for an essential predication such as ‘the human is an animal’ to be true, it suffices that the essences expressed by the subject and the predicate are conceptualized and signified. They must be conceptualized because ‘the human is an animal’ expresses the mental composition of the concepts of human and animal, which evidently requires the human and the animal essences to be conceptualized (Ebbesen 1987: 159)[^ebbesen-1987]. They must also be signified because otherwise, ‘the human is an animal’ would have no semantic content at all. However, ‘human’ and ‘animal’ do not need to refer to or signify anything real in the external world.
    step1: TBD
    step2: TBD
  - id: 32
    kind: body
    source: |-
      The latter claim is shown as follows: assertions of the form ‘*S* is *P*’[^note-8] involve the relevant mode of being of the significate of the predicate (henceforth ‘of the predicate’). In assertions where real accidents are predicated (e.g., being white, running, etc.), the relevant mode of being of the predicate is actual existence; therefore, their truth-makers must be things in the external world (Ebbesen 1987: 160)[^ebbesen-1987]. Likewise, in assertions where logical intentions are predicated (e.g., being a species or a genus), the relevant mode of being of the predicate is mental existence; therefore, their truth-makers are concepts. But in essential predication, the relevant mode of being is neither actual nor mental existence because essences are independent of any sort of existence; therefore, the truth-makers are simply the essences conceptualized and subsequently signified by the subject and predicate (Ebbesen 1987: 160)[^ebbesen-1987]. Therefore, ‘the human is an animal’ is true even when no human exists, simply because being an animal is a definitional part of being human, that is, being an animal is a part of the human essence.
    step1: TBD
    step2: TBD
  - id: 33
    kind: body
