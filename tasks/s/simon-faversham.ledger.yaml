      Dreams with their origin in celestial bodies give rise to the possibility of divination in dreams. Such dreams originate from an influx the human body receives from the celestial bodies. The *phantasia* forms images in agreement with the influx and sends them to the common sense. When the organ of the common sense is affected by those images, the common sense produces likenesses of the things that will happen. Thus, thanks to this influx from celestial bodies, humans are able to foresee the future in dreams, for instance, future wars or bountiful harvests. According to Simon, who follows in Averroes’s footsteps, this sort of dream is divinely given to humans because they lack cognitive access to future events that are useful or harmful. The premonitory dream, however, does not provide an exact indication of the future event. In fact, the diviner must interpret her dream in order to judge what the dream is supposed to foresee. Since divination is part of astrology, a good interpretation requires that one properly understand both the mechanisms of dreams and of celestial bodies (Ebbesen 2013: 144)[^ebbesen-2013]. When properly interpreted, divination in dreams provides accurate information about the future:
    step1: |-
      源自天体的梦，使梦中占卜成为可能。这类梦源于人体从天体接受的一种流入（influx）。*phantasia* 形成与流入相合的影像，并把它们送给共同感。当共同感的器官受这些影像影响时，共同感便产生将要发生之物的相似形象。于是，借助这种来自天体的流入，人能在梦中预见未来，例如未来的战争或丰收。西蒙追随阿威罗伊，认为这类梦是神赐予人的，因为人对有用或有害的未来事件缺乏认知通道。然而，预警之梦并不提供未来事件的精确指示。事实上，占卜者必须解释自己的梦，才能判断该梦应当预见什么。由于占卜是占星术的一部分，解释要得当，就得同时正确理解梦与天体各自的机制（Ebbesen 2013: 144）[^ebbesen-2013]。经过正确解释时，梦中占卜能提供关于未来的准确信息：
    step2: |-
      源自天体的梦，使梦中占卜成为可能。这类梦起于人体从天体接受的一种流入（influx）：*phantasia* 形成与流入相合的影像并送交共同感；共同感的器官受这些影像影响，便产生将要发生之物的相似形象。于是，凭借天体的这种流入，人能在梦里预见未来，例如未来的战争或丰收。西蒙追随阿威罗伊，认为这类梦是神赐给人的，因为人对有用或有害的未来之事缺乏认知途径。不过，预警之梦并不精确指明未来事件；占卜者还得解释自己的梦，才能判断此梦所要预见的是什么。占卜既属占星术，解释要得当，就得同时正确理解梦与天体各自的机制（Ebbesen 2013: 144）[^ebbesen-2013]。解释得当，梦中占卜就能提供关于未来的准确信息：
