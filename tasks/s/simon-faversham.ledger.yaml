      Since Simon’s commentary on the *Parva naturalia* does not contain commentaries on *De sensu* and *De memoria*, the best place to reconstruct his views on the physiological and psychological mechanisms of sensory cognition is his commentary on *De somno et vigilia*, which also covers *De insomniis* and *De divinatione per somnum*. Question 13* of this commentary provides broad accounts of the physiological and psychological mechanisms of dreams and divination in dreams (ed. Ebbesen 2013)[^ebbesen-2013].
    step1: |-
      西蒙对《自然诸短篇》的注释不包含对《论感觉》与《论记忆》的注释。要重构其感觉认知之生理与心理机制观点，最佳去处是他对《论睡与醒》的注释，该注释还涵盖《论梦》与《论梦中占卜》。这部注释的第 13 问对梦以及梦中占卜的生理与心理机制作了广泛说明（Ebbesen 2013 校订本）[^ebbesen-2013]。
    step2: |-
      西蒙对《自然诸短篇》的注释不含《论感觉》与《论记忆》的注释。因此，要重构他关于感觉认知之生理与心理机制的看法，最好去看他对《论睡与醒》的注释——其中还涵盖《论梦》与《论梦中占卜》。这部注释的第 13 问，对梦以及梦中占卜的生理与心理机制作了相当全面的说明（Ebbesen 2013 校订本）[^ebbesen-2013]。
