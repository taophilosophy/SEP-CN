      ## 1 生平
  - id: 3
    kind: body
    source: |-
      Simon of Faversham was born circa 1260 in Faversham, a seaport town in Kent, England.[^note-1] He became master of arts at the University of Oxford, but then taught at the Arts faculty of the University of Paris in the 1280s, where probably most of his works were produced, even if he may have revised some of them after his return to Oxford in 1289. Later in life, Simon became a Doctor of Theology at the University of Oxford. After his return to England, he held several clerical offices: sub-deacon at Croydon in 1289, and deacon at Bocking and rector of Preston in 1290. Simon became chancellor of the University of Oxford in 1304. In 1305, archbishop Winchelsey named him archdeacon of Canterbury, the highest ecclesiastical appointment in England for non-priests. After giving up this post, Simon was named rector of Reculver, but soon after he lost his appointment to the candidate of the Papal curia. Simon died in 1306 in a trip to the Papal curia, where he was going to fight the loss of his appointment.
    step1: |-
      法弗舍姆的西蒙约 1260 年生于英格兰肯特郡的海港市镇法弗舍姆。[^note-1] 他在牛津大学成为文学硕士，但随后在 1280 年代于巴黎大学艺学院任教，其著作可能大多在那里产生，即使其中一些在他 1289 年返回牛津后可能经过修订。晚年，西蒙在牛津大学成为神学博士。返回英格兰后，他担任过若干教会职务：1289 年任克罗伊登的副执事，1290 年任博金的执事与普雷斯顿的堂区主任。西蒙于 1304 年成为牛津大学校长。1305 年，温切尔西尔大主教任命他为坎特伯雷总执事，这是英格兰非神职人员所能得到的最高教会任命。放弃这一职位后，西蒙改任雷卡尔弗堂区主任，但不久教廷的候选人夺走了这一任命。西蒙于 1306 年在前往教廷的旅途中去世，此行正是为了就失去任命一事抗争。
    step2: |-
