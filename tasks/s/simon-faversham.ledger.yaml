      As regards the division of logic, which is more precisely a division of the syllogism, Simon’s commentary is noteworthy in one regard: following in the footsteps of Giles of Rome and the Arabic logical tradition, Simon considers rhetoric and poetics to be parts of logic, i.e., to function by way of syllogisms. Different types of syllogism are demarcated based on the varying degrees of certainty of the premises (*In Isag*.: prologue). Hence, if the premises are accepted as mere suspicion (*suspicio),*[^note-5] the syllogism is rhetorical and the conclusion will also be accepted as mere suspicion (a syllogism dealt with in the *Rhetoric*). If it “proceeds from fictitious premises that portray horror or pleasure” (*In Isag*.: prologue), the syllogism is poetic and the conclusion will be accepted as an estimation (*aestimatio*) (a syllogism dealt with in the *Poetics*). If the syllogism proceeds from acceptable premises, the syllogism is dialectical and the conclusion will be an acceptable belief (a syllogism dealt with in the *Topics*). If it proceeds from the indubitable indemonstrable principles proper to a given science, the syllogism is demonstrative and the conclusion will be certain and infallible knowledge (a syllogism dealt with in the *Posterior Analytics*). Finally, if it proceeds from knowledge that seems acceptable, but is not, the syllogism is sophistical and the conclusion will be an error (*deceptio*) (a syllogism dealt with in the *Sophistical Refutations*).
    step1: |-
      至于逻辑的划分——更确切地说是三段论的划分——西蒙的注释有一点值得注意。他追随罗马的吉莱斯与阿拉伯逻辑传统，认为修辞学与诗学是逻辑的部分，即以三段论方式运作。不同类型的三段论依前提确定性的不同程度而划界（*In Isag.*：序言）。因此，若前提只算疑念（*suspicio*）[^note-5]，三段论就是修辞式的，结论也将只算疑念（见《修辞学》）。若它“从描绘恐怖或快乐的虚构前提推出”（*In Isag.*：序言），三段论就是诗学的，结论将作为估计（*aestimatio*）得到接受（见《诗学》）。若三段论从可接受的前提推出，它就是辩证式的；结论将是可接受的信念（见《论题篇》）。若它从某一门科学所固有而不可怀疑的不可证明原理推出，三段论就是证明式的；结论将是确定而无误的知识（见《后分析篇》）。最后，若它从看来可接受而其实并非如此的知识推出，三段论就是诡辩式的；结论将是错误（*deceptio*）（见《辩谬篇》）。
    step2: |-
      至于逻辑的划分——更确切地说，是三段论的划分——西蒙的注释有一点值得注意。他追随罗马的吉莱斯与阿拉伯逻辑传统，把修辞学与诗学也算作逻辑的部分，认为二者以三段论方式运作。不同类型的三段论，依前提确定性的高低而划界（*In Isag.*：序言）。所以，若前提只算疑念（*suspicio*）[^note-5]，三段论便是修辞式的，结论也只算疑念（见《修辞学》）。它若“从描绘恐怖或快乐的虚构前提推出”（*In Isag.*：序言），三段论便是诗学的，结论作为估计（*aestimatio*）得到接受（见《诗学》）。三段论若从可接受的前提推出，便是辩证式的；结论成为可接受的信念（见《论题篇》）。它若从某门科学固有而不可怀疑的不可证明原理推出，三段论便是证明式的；结论成为确定无误的知识（见《后分析篇》）。最后，它若从看来可接受、实则并非如此的知识推出，三段论便是诡辩式的；结论成为错误（*deceptio*）（见《辩谬篇》）。
