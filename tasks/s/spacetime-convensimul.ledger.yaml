      A vigorous defense of conventionality has been offered by Rynasiewicz (2012). He argues that his approach “has the merit of nailing the exact sense in which simultaneity is conventional. It is conventional in precisely the same sense in which the gauge freedom that arises in the general theory of relativity makes the choice between diffeomorphically related models conventional.” He begins by showing that any choice of a simultaneity relation is equivalent to a choice of a velocity in the equation for local time in H.A. Lorentz’s *Versuch* theory (Lorentz 1895)[^lorentz-1895]. Then, beginning with Minkowski space with the standard Minkowski metric, he introduces a diffeomorphism in which each point is mapped to a point with the same spatial coordinates, but the temporal coordinate is that of a Lorentzian local time expressed in terms of the velocity as a parameter. This mapping is not an isometry, for the light cones are tilted, which corresponds to anisotropic light propagation. He proceeds to argue, using the hole argument (see, for example, Earman and Norton 1987)[^earman-1987] as an analogy, that this parametric freedom is just like the gauge freedom of general relativity. As the tilting of the light cones, if projected into a single spatial dimension, would be equivalent to a choice of Reichenbach’s ε, it seems that Rynasiewicz’s argument is a generalization and more completely argued version of the argument given by Janis that is mentioned above in the third paragraph of Section 3.
    step1: |-
      Rynasiewicz（2012）为约定性提供了有力的辩护。他论证说，他的进路“可取之处在于钉死了同时性在何种确切意义上是约定的。正是在与下述情形完全相同的意义上，它是约定的：广义相对论中出现的规范自由度，使得在微分同胚相关的模型之间作选择成为约定”。他首先表明，同时性关系的任何选择，都等价于在 H. A. 洛伦兹《尝试》理论的地方时方程中选取一个速度（Lorentz 1895）[^lorentz-1895]。然后，从带标准闵可夫斯基度规的闵可夫斯基空间出发，他引入一个微分同胚，把每个点映到具有相同空间坐标的点，但时间坐标是洛伦兹地方时的坐标，以速度为参数表出。这个映射不是等距映射，因为光锥倾斜了，这对应于光传播的各向异性。他接着以空穴论证为例（例如 Earman and Norton 1987）[^earman-1987] 论证说，这一参数自由正如同广义相对论的规范自由。既然光锥的倾斜若投影到单一空间维度，就等价于赖欣巴哈 ε 的一个选择，看来 Rynasiewicz 的论证是上文第三节第三段提到的 Janis 论证的推广和论证更完备的版本。
    step2: |-
      Rynasiewicz（2012）为约定性提供了有力的辩护。他论证说，他的进路“可取之处在于钉死了同时性在何种确切意义上是约定的。它之为约定，与下述情形意义完全相同：广义相对论中出现的规范自由度，使微分同胚相连的模型之间的选择成为约定”。他首先表明，同时性关系的任何选择，都等价于在 H. A. 洛伦兹《尝试》（*Versuch*）理论的地方时方程中选取一个速度（Lorentz 1895）[^lorentz-1895]。然后，从带标准闵可夫斯基度规的闵可夫斯基空间出发，他引入一个微分同胚，把每个点映到具有相同空间坐标的点，但时间坐标取洛伦兹地方时，以速度为参数表出。这个映射不是等距映射，因为光锥倾斜了，这对应于光传播的各向异性。他接着以空穴论证为类比（例如 Earman and Norton 1987）[^earman-1987] 论证说，这一参数自由正像广义相对论的规范自由一样。既然把光锥的倾斜投影到单一空间维度，就等价于赖欣巴哈 ε 的一个选择，看来 Rynasiewicz 的论证是上文第三节第三段提到的 Janis 论证的推广，而且论证得更完备。
