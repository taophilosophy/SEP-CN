      It has been argued (see, for example, Janis 1983, 103–105, and Norton 1986, 119)[^janis-1983][^norton-1986] that all such schemes for establishing convention-free synchrony must fail. The argument can be summarized as follows: Suppose that clocks are set in standard synchrony, and consider the detailed space-time description of the proposed synchronization procedure that would be obtained with the use of such clocks. Next suppose that the clocks are reset in some nonstandard fashion (consistent with the causal order of events), and consider the description of the same sequence of events that would be obtained with the use of the reset clocks. In such a description, familiar laws may take unfamiliar forms, as in the case of the law of conservation of momentum in the example mentioned above. Indeed, all of special relativity has been reformulated (in an unfamiliar form) in terms of nonstandard synchronies (Winnie 1970a and 1970b)[^winnie-1970a][^winnie-1970b]. Since the proposed synchronization procedure can itself be described in terms of a nonstandard synchrony, the scheme cannot describe a sequence of events that is incompatible with nonstandard synchrony. A comparison of the two descriptions makes clear what hidden assumptions in the scheme are equivalent to standard synchrony. Nevertheless, editors of respected journals continue to accept, from time to time, papers purporting to measure one-way light speeds; see, for example, Greaves *et al*. (2009). Application of the procedure just described shows where their errors lie.
    step1: |-
      有人论证过（例如 Janis 1983, 103–105，以及 Norton 1986, 119）[^janis-1983][^norton-1986]：一切这类确立无约定同步的方案都必定失败。论证可以概括如下：先设诸钟按标准同步设定，用这种钟给出所提同步程序的细致时空描述；再设诸钟按某种非标准的方式重设（与事件的因果次序相容），用重设后的钟对同一事件序列给出描述。在这种描述里，熟悉的定律可能呈现陌生的形式；上文动量守恒定律的例子就是如此。实际上，全部狭义相对论都已经按非标准同步（以陌生的形式）重新表述过（Winnie 1970a and 1970b）[^winnie-1970a][^winnie-1970b]。既然所提的同步程序本身也能按非标准同步来描述，该方案就不可能描述一个与非标准同步不相容的事件序列。把两种描述一比较，就能看清方案中哪些隐含假设等价于标准同步。尽管如此，有声望的期刊的编辑们仍不时接受自称测得了单向光速的论文；例如 Greaves *et al*. (2009)。用刚才描述的程序一检验，就能看出他们的错在哪里。
    step2: |-
