      Since the conventionality thesis rests upon the existence of a fastest causal signal, the existence of arbitrarily fast causal signals would undermine the thesis. If we leave aside the question of causality, for the moment, the possibility of particles (called tachyons) moving with arbitrarily high velocities is consistent with the mathematical formalism of special relativity (see, for example, Feinberg 1967)[^feinberg-1967]. Just as the speed of light in vacuum is an upper limit to the possible speeds of ordinary particles (sometimes called bradyons), it would be a lower limit to the speeds of tachyons. When a transformation is made to a different inertial frame of reference, the speeds of both bradyons and tachyons change (the speed of light in vacuum being the only invariant speed). At any instant, the speed of a bradyon can be transformed to zero and the speed of a tachyon can be transformed to an infinite value. The statement that a bradyon is moving forward in time remains true in every inertial frame (if it is true in one), but this is not so for tachyons. Feinberg (1967) argues that this does not lead to violations of causality through the exchange of tachyons between two uniformly moving observers because of ambiguities in the interpretation of the behavior of tachyon emitters and absorbers, whose roles can change from one to the other under the transformation between inertial frames. He claims to resolve putative causal anomalies by adopting the convention that each observer describes the motion of each tachyon interacting with that observer’s apparatus in such a way as to make the tachyon move forward in time. However, all of Feinberg’s examples involve motion in only one spatial dimension. Pirani (1970) has given an explicit two-dimensional example in which Feinberg’s convention is satisfied but a tachyon signal is emitted by an observer and returned to that observer at an earlier time, thus leading to possible causal anomalies.
    step1: |-
      既然约定性论题依赖最快因果信号的存在，任意快的因果信号若存在，就会动摇这一论题。姑且把因果性问题放在一边：粒子可以以任意高的速度运动——这类粒子称为快子（tachyons）——这种可能性与狭义相对论的数学形式体系相容（例如 Feinberg 1967）[^feinberg-1967]。正如真空光速是普通粒子（有时称为慢子，bradyons）可能速度的上限，它也会是快子速度的下限。变换到别的惯性参照系时，慢子与快子的速度都会改变（真空光速是唯一不变的速度）。任一时刻，慢子的速度可以变换成零，快子的速度可以变换成无穷大。“慢子在时间中向前运动”这一命题在每个惯性系里都保持为真（只要它在一个系里为真），但对快子并非如此。Feinberg（1967）论证说，这并不会经由两个匀速运动观察者之间交换快子而导致因果性违反，因为快子发射体与吸收体的行为在诠释上有歧义，在惯性系变换下两者的角色可以互换。他声称，通过采纳这样一个约定——每个观察者在描述与自己的仪器相互作用的每个快子的运动时，都把它描述成在时间中向前运动——可以消解所谓的因果佯谬。然而，Feinberg 的全部例子都只涉及一个空间维度中的运动。Pirani（1970）给出了一个明确的双维例子：Feinberg 的约定得到满足，但一个观察者发出的快子信号却回到了发出时刻之前的该观察者那里，从而可能导致因果佯谬。
    step2: |-
      既然约定性论题依赖最快因果信号的存在，任意快的因果信号若存在，就会动摇这一论题。姑且把因果性问题放在一边：粒子可以以任意高的速度运动——这类粒子称为快子（tachyons）——这种可能性与狭义相对论的数学形式体系相容（例如 Feinberg 1967）[^feinberg-1967]。正如真空光速是普通粒子（有时称为慢子，bradyons）可能速度的上限，它也会是快子速度的下限。变换到别的惯性参照系时，慢子与快子的速度都会改变（真空光速是唯一不变的速度）。任一时刻，慢子的速度可以变换成零，快子的速度可以变换成无穷大。“慢子在时间中向前运动”这一命题，在每个惯性系里都保持为真（只要它在一个系里为真），但对快子并非如此。Feinberg（1967）论证说，这并不会经由两个匀速运动观察者之间交换快子而违反因果性；因为快子发射体与吸收体的行为在诠释上有歧义，在惯性系变换下两者的角色可以互换。他声称，只要采纳这样一个约定——每个观察者描述与自己仪器发生相互作用的每个快子时，都把它描述成在时间中向前运动——就能消解所谓的因果佯谬。然而，Feinberg 的全部例子都只涉及一个空间维度中的运动。Pirani（1970）给出了一个明确的双维例子：Feinberg 的约定得到满足，但一个观察者发出的快子信号，却回到了发出时刻之前的该观察者那里，从而可能导致因果佯谬。
