    kind: body
    source: |-
      The thesis that the choice of standard synchrony is a convention, rather than one necessitated by facts about the physical universe (within the framework of the special theory of relativity), has been argued particularly by Reichenbach (see, for example, Reichenbach 1958, 123–135)[^reichenbach-1958] and Grünbaum (see, for example, Grünbaum 1973, 342–368)[^grünbaum-1973]. They argue that the only nonconventional basis for claiming that two distinct events are not simultaneous would be the possibility of a causal influence connecting the events. In the pre-Einsteinian view of the universe, there was no reason to rule out the possibility of arbitrarily fast causal influences, which would then be able to single out a unique event at *A* that would be simultaneous with *E*. In an Einsteinian universe, however, no causal influence can travel faster than the speed of light in vacuum, so from the point of view of Reichenbach and Grünbaum, any event at *A* whose time of occurrence is in the open interval between *t*₁ and *t*₂ could be defined to be simultaneous with *E*. In terms of the ε-notation introduced by Reichenbach, any event at *A* occurring at a time *t*₁ + ε(*t*₂ − *t*₁), where 0 < ε < 1, could be simultaneous with *E*. That is, the conventionality thesis asserts that any particular choice of ε within its stated range is a matter of convention, including the choice ε=1/2 (which corresponds to standard synchrony). If ε differs from 1/2, the one-way speeds of a light ray would differ (in an ε-dependent fashion) on the two segments of its round-trip journey between *A* and *B*. If, more generally, we consider light traveling on an arbitrary closed path in three-dimensional space, then (as shown by Minguzzi 2002, 155–156)[^minguzzi-2002] the freedom of choice in the one-way speeds of light amounts to the choice of an arbitrary scalar field (although two scalar fields that differ only by an additive constant would give the same assignment of one-way speeds).
    step1: |-
      标准同步的选择是一种约定、而非由物理宇宙的事实所迫（在狭义相对论框架内）——这一论题的主要论证者是赖欣巴哈（Hans Reichenbach）（例如 Reichenbach 1958, 123–135）[^reichenbach-1958] 与格吕恩鲍姆（Adolf Grünbaum）（例如 Grünbaum 1973, 342–368）[^grünbaum-1973]。他们的论证是：要断定两个不同事件并不同时，唯一不靠约定的根据，是有因果影响联系两者。在前爱因斯坦的宇宙观里，没有理由排除任意快的因果影响的可能性；若存在这种影响，就能在 *A* 处挑出与 *E* 同时的唯一事件。然而在爱因斯坦式的宇宙里，任何因果影响都不能快过真空中的光速，所以在赖欣巴哈与格吕恩鲍姆看来，*A* 处发生的时刻落在 *t*₁ 与 *t*₂ 之间的开区间内的任何事件，都可以被定义为与 *E* 同时。用赖欣巴哈引入的 ε 记号来说，*A* 处发生在时刻 *t*₁ + ε(*t*₂ − *t*₁) 的任何事件（其中 0 < ε < 1）都可能同时于 *E*。也就是说，约定性论题断言：在给定范围内选取任何特定的 ε 值都是约定问题，包括 ε=1/2 的选择（它对应标准同步）。若 ε 不同于 1/2，光线在 *A* 与 *B* 之间往返的两段路程上的单向速度就会不同（以依赖 ε 的方式不同）。更一般地，若考虑光在三维空间中沿任意闭合路径行进，则（正如 Minguzzi 2002, 155–156 所证明的）[^minguzzi-2002] 单向光速的选择自由相当于选择一个任意标量场（不过仅相差一个可加常数的两个标量场会给出相同的单向速度分配）。
    step2: |-
      标准同步的选择是一种约定，而非由物理宇宙的事实所迫（在狭义相对论框架内）——这一论题的主要论证者是赖欣巴哈（Hans Reichenbach；例如 Reichenbach 1958, 123–135）[^reichenbach-1958] 与格吕恩鲍姆（Adolf Grünbaum；例如 Grünbaum 1973, 342–368）[^grünbaum-1973]。他们的论证是：要断定两个不同事件并不同时，唯一不靠约定的根据，是有因果影响联系两者。在前爱因斯坦的宇宙观里，没有理由排除任意快的因果影响；若存在这种影响，就能在 *A* 处挑出与 *E* 同时的唯一事件。然而在爱因斯坦式的宇宙里，任何因果影响都不能快过真空中的光速。因此在赖欣巴哈与格吕恩鲍姆看来，*A* 处发生时刻落在 *t*₁ 与 *t*₂ 之间开区间内的任何事件，都可以定义为与 *E* 同时。用赖欣巴哈引入的 ε 记号来说，*A* 处发生在时刻 *t*₁ + ε(*t*₂ − *t*₁) 的任何事件（其中 0 < ε < 1）都可能同时于 *E*。也就是说，约定性论题断言：在给定范围内选取任何特定的 ε 值都是约定问题，包括 ε=1/2 的选择（它对应标准同步）。若 ε 不同于 1/2，光线在 *A* 与 *B* 之间往返的两段路程上的单向速度就会不同（以依赖 ε 的方式不同）。更一般地，若考虑光在三维空间中沿任意闭合路径行进，则单向光速的选择自由相当于选择一个任意标量场（正如 Minguzzi 2002, 155–156 所证明的）[^minguzzi-2002]；不过，仅相差一个可加常数的两个标量场，会给出相同的单向速度分配。
