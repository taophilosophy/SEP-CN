      ## 1 约定性论题
  - id: 3
    kind: body
    source: |-
      The debate about the conventionality of simultaneity is usually carried on within the framework of the special theory of relativity. Even prior to the advent of that theory, however, questions had been raised (see, e.g., Poincaré 1898)[^poincaré-1898] as to whether simultaneity was absolute; i.e., whether there was a unique event at location A that was simultaneous with a given event at location B. In his first paper on relativity, Einstein (1905) asserted that it was necessary to make an assumption in order to be able to compare the times of occurrence of events at spatially separated locations (Einstein 1905, 38–40 of the Dover translation or 125–127 of the Princeton translation; but note Scribner 1963, for correction of an error in the Dover translation)[^einstein-1905][^scribner-1963]. His assumption, which defined what is usually called standard synchrony, can be described in terms of the following idealized thought experiment, where the spatial locations *A* and *B* are fixed locations in some particular, but arbitrary, inertial (i.e., unaccelerated) frame of reference: Let a light ray, traveling in vacuum, leave *A* at time *t*₁ (as measured by a clock at rest there), and arrive at *B* coincident with the event *E* at *B*. Let the ray be instantaneously reflected back to *A*, arriving at time *t*₂. Then standard synchrony is defined by saying that *E* is simultaneous with the event at *A* that occurred at time (*t*₁ + *t*₂)/2. This definition is equivalent to the requirement that the one-way speeds of the ray be the same on the two segments of its round-trip journey between *A* and *B*.
    step1: |-
      关于同时性的约定性的争论，通常是在狭义相对论的框架内进行的。不过，早在这一理论出现之前，就已经有人提出同时性是否绝对的问题（参见 Poincaré 1898）[^poincaré-1898]，也就是说，在位置 A 是否有唯一的事件与位置 B 的给定事件同时。爱因斯坦（1905）在其第一篇相对论论文中断言，必须作出一个假设，才能比较空间上分隔开的各处事件的发生时刻（Einstein 1905, 38–40 of the Dover translation or 125–127 of the Princeton translation; but note Scribner 1963, for correction of an error in the Dover translation）[^einstein-1905][^scribner-1963]。他的假设定义了通常所说的标准同步（standard synchrony），可以用下面这个理想化的思想实验来描述，其中空间位置 *A* 和 *B* 是某个特定但任取的惯性（即无加速）参照系中的固定位置：设一条光线在真空中于时刻 *t*₁（由静止于该处的钟测量）离开 *A*，到达 *B* 时恰好与 *B* 处的事件 *E* 重合。再设该光线被瞬时反射回 *A*，于时刻 *t*₂ 到达。于是标准同步就定义为：*E* 与 *A* 处发生在时刻 (*t*₁ + *t*₂)/2 的事件同时。这个定义等价于如下要求：光线在 *A* 与 *B* 之间往返的两段路程上，单向速度相同。
    step2: |-
      关于同时性约定性的争论，通常在狭义相对论的框架内进行。不过，早在这一理论出现之前，就已经有人提出同时性是否绝对的问题（参见 Poincaré 1898）[^poincaré-1898]——也就是说，在位置 A 处，是否有唯一的事件与位置 B 的给定事件同时。爱因斯坦（1905）在其第一篇相对论论文中断言，必须作出一个假设，才能比较空间上分隔开的各处事件的发生时刻（Einstein 1905, 38–40 of the Dover translation or 125–127 of the Princeton translation; but note Scribner 1963, for correction of an error in the Dover translation）[^einstein-1905][^scribner-1963]。他的假设定义了通常所说的标准同步（standard synchrony），可以用下面这个理想化的思想实验来描述，其中空间位置 *A* 和 *B* 是某个特定但任取的惯性（即无加速）参照系中的固定位置：设一条光线在真空中于时刻 *t*₁（由静止于该处的钟测量）离开 *A*，到达 *B* 时恰好与 *B* 处的事件 *E* 重合。再设该光线被瞬时反射回 *A*，于时刻 *t*₂ 到达。于是标准同步就定义为：*E* 与 *A* 处发生在时刻 (*t*₁ + *t*₂)/2 的事件同时。这个定义等价于如下要求：光线在 *A* 与 *B* 之间往返的两段路程上，单向速度相同。
