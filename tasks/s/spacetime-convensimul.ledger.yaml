      Some commentators have taken Malament’s theorem to have settled the debate on the side of nonconventionality. For example, Torretti (1983, 229) says, “Malament proved that simultaneity by standard synchronism in an inertial frame *F* is the *only* non-universal equivalence between events at different points of *F* that is definable (‘in any sense of “definable” no matter how weak’) in terms of causal connectibility alone, for a given *F*”; and Norton (Salmon *et al*. 1992, 222)[^salmon-1992] says, “Contrary to most expectations, [Malament] was able to prove that the central claim about simultaneity of the causal theorists of time was false. He showed that the standard simultaneity relation was the only nontrivial simultaneity relation definable in terms of the causal structure of a Minkowski spacetime of special relativity.”
    step1: |-
      有些评论者认为马拉门特定理已经替非约定性一方解决了争论。例如，托雷蒂（1983, 229）说：“马拉门特证明，在给定惯性系 *F* 中按标准同步来的同时性，是仅凭因果可联接性就能（‘以无论多么弱的“可定义”义’）定义出来的、*F* 中不同点上的事件之间 *唯一* 的非普适等价关系”；诺顿（Salmon *et al*. 1992, 222）[^salmon-1992] 则说：“与多数人的预期相反，[马拉门特]得以证明，时间因果论者关于同时性的中心主张是假的。他表明，标准同时性关系是唯一非平凡的同时性关系，可仅凭狭义相对论闵可夫斯基时空的因果结构来定义。”
    step2: |-
      有些评论者认为，马拉门特定理已经替非约定性一方解决了争论。例如，托雷蒂（Roberto Torretti；1983, 229）说：“马拉门特证明：在惯性系 *F* 中，按标准同步的同时性，是仅凭因果可联接性就能定义的等价关系——‘可定义’无论取多么弱的意义；而且对给定的 *F*，它是 *F* 中不同点上的事件之间 *唯一* 的非普适等价。”；Norton（Salmon *et al*. 1992, 222）[^salmon-1992] 则说：“与多数人的预期相反，[马拉门特]得以证明，时间因果论者关于同时性的中心主张是假的。他表明，标准同时性关系是唯一非平凡的同时性关系，可仅凭狭义相对论闵可夫斯基时空的因果结构来定义。”
