      [^note-56]: Almogi (2009: 299ff) lays out three positions on the existence of gnosis at the stage of a buddha based on Rong zom Chos kyi bzang po’s (c. eleventh century) discourses, and identifies Indian authors who maintain the following three positions: (i) the *dharmadhātu* is the sole constituent of buddhahood, which excludes gnosis or cognition of any kind; (ii) a buddha additionally has nonconceptual gnosis; and (iii) a buddha additionally possesses pure mundane gnosis, or conceptual gnosis. Śrīgupta is the only Indian author that Almogi identifies who defends the third view.
