      [^note-43]: *Arthakriyā* might be translated as “causal efficacy” or “practical efficacy,” referring to something’s ability to fulfill its purpose (*artha*), or to the property possessed by objects on account of which one can accomplish one’s aim/objective (*artha*). Still, that aim, objective, or purpose is presumably achieved through causal processes. Aside from serving as the basis on which one may achieve practical human aims (*puruṣārtha*), another paradigmatic way in which Dharmakīrti speaks of this criterion is as *x’s capacity to serve as a cause for a perception of x*, since, in his system, the ultimate reals that possess this property are also distinguished by being the exclusive objects of perception. Dharmakīrti uses this same expression in defining a source of knowledge or knowledge-event (two meanings of *pramāṇa*), insofar as a knowledge-event is a cognition on the basis of which one may engage in successful action, or the accomplishment of some objective (PV 2.1abc). Arnold (2005: 99) suggests that *arthakriyā* is best translated as “causal efficacy” in the ontological context, and as “pragmatic efficacy” in the epistemological context.
