      Nāgārjuna applies this argument to entities from both a spatial and temporal perspective, rejecting spatially partless particles as well as temporally partless moments. These lines of reasoning are based on the thought that spatially partless particles and temporally partless moments would necessarily be unextended, point-like entities, and ordinary spatially and/or temporally extended objects could not be constituted by unextended, point-like building blocks. He reasons that, just as each fundamental material building block of an ordinary object—regardless of how small—necessarily has a right side that occupies a spatially distinct locus from its left side in order to constitute a spatially extended object, so too each fundamental temporal building block—no matter how brief—necessarily has a beginning that occupies a temporally distinct locus from its end in order to collectively yield temporal extension (RĀ 1.69–70).
    step1: TBD
    step2: TBD
  - id: 31
    kind: body
    source: |-
      Śrīgupta develops this line of reasoning by formalizing it in the standard inference structure of the Dignāga-Dharmakīrti tradition of logic and epistemology and defending the argument’s soundness. He advances a sustained argument in support of the second premise above: that *there is nothing that lacks proper parts*, i.e., there are no true unities of any kind, whether material, mental, or otherwise. Śrīgupta also spells out how Nāgārjuna’s line of reasoning can be used to establish universal emptiness, relying on the inference-warranting relation (*vyāpti*) that: *whatever is neither truly unitary nor truly multiple lacks an intrinsic nature*.
    step1: TBD
    step2: TBD
  - id: 32
    kind: body
    source: |-
      The central inference of Śrīgupta’s neither-one-nor-many argument is laid out in the opening stanza of the *Introduction to Reality*:
    step1: TBD
    step2: TBD
  - id: 33
    kind: body
    source: |-
      > In reality, [*s*] everything that exists externally and internally [*p*] does not have intrinsic nature, [*r*] due to lacking an intrinsic nature that is either unitary or non-unitary, [*e*] like a reflection.[^note-10] [TA 1]
    step1: TBD
    step2: TBD
  - id: 34
    kind: body
    source: |-
      Here, [*s*] denotes the subject (*pakṣa, dharmin*) of the inference, [*p*] denotes the predicate, or property to be proved (*sādhyadharma*) of the subject, [*r*] denotes the reason (*hetu*), or proving property (*sādhanadharma*), and [*e*] denotes the example (*dṛṣṭānta*) in which the co-presence of the property to be proved and the proving property is instantiated. Formulated in the standard three-part inference, the argument in TA 1 runs as follows:
    step1: TBD
    step2: TBD
  - id: 35
    kind: body
    source: |-
      - Thesis (*pratijñā*): *All that exists externally and internally does not have an intrinsic nature.*
      - Major premise: Entailment relation *(vyāpti)* between the reason property and the property to be proved: *Whatever is neither one nor many does not have an intrinsic nature.*
      - Minor premise: Predication of the reason property of the subject (*pakṣadharmatā*): *All that exists externally and internally is neither one nor many.*
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      Although the inferential subject of Śrīgupta’s neither-one-nor-many argument may be translated as “all that *exists* externally and internally,” the term “exists” (*gnas*) here is ontologically innocent, merely signifying existence simpliciter, such that the subject might be paraphrased as “whatever there is internally and externally”. After all, the property to be proved of the subject—the absence of an intrinsic nature—is an ontological status. To exist with an intrinsic nature is to exist “ultimately” (*paramārthena*). So, if “exists” in the statement of the inferential subject *were* ontologically loaded, then the inference would either be contradictory (if it meant “exists *ultimately*”) or question-begging (if it meant “exists *conventionally*”). Instead, as Śrīgupta clarifies, the inferential subject is determined based on “conventional assessment” (*tha snyad ’jal ba*), i.e., whatever appearing objects are determined to exist by conventionally trustworthy sources of knowledge (TAV *ad* TA 17).[^note-11]
    step1: TBD
    step2: TBD
  - id: 37
    kind: body
    source: |-
      This argument turns on three features of the one-or-many disjunctive predicate pair, all of which were alluded to in Nāgārjuna’s *Precious Garland*. These features clarify the meaning of the major premise (*whatever is neither one nor many lacks an intrinsic nature*) while also helping to explain Śrīgupta’s strategy for establishing the minor premise (*all things are neither one nor many*).
    step1: TBD
    step2: TBD
  - id: 38
    kind: body
    source: |-
      First, the terms translated as “one” and “many”—*eka* and *aneka*—are perhaps more precisely translated as “unity” and “non-unity” insofar as they are taken to be mutually exclusive and exhaustive, conforming to the logical, conceptual, and grammatical structure *F* and not-*F*.[^note-12] If something existed with an intrinsic nature, it must be a unity or a non-unity, with no third alternative.
    step1: TBD
    step2: TBD
  - id: 39
    kind: body
    source: |-
      Moreover, use of the qualifier “in reality” (**tattvatas*, yang dag tu) in the central inference signals that this line of reasoning is inquiring into the final nature of things, assessing whether anything lays claim to the status of being a *true* unity or a *true* multiplicity. As discussed above, the defining criterion for being a true unity is to lack proper parts, i.e., to be a mereological simple. And, as Nāgārjuna made clear in his *Precious Garland*, anything that can be physically or even *conceptually* divided is regarded as partite. In this intellectual tradition, mereology is topic-neutral,[^note-13] meaning that it applies to all sorts of things. The parthood relation is not restricted to material things. Anything that can be conceptually or analytically divided into more basic units possesses proper parts. For instance, just as a material object might be conceptually divided into subregions, like a right side, a left side, a top, and a bottom, so too might a mental representation of that object. And just as a moment of consciousness might be conceptually divided into its beginning, middle, and end, similarly, an abstract syllogism might be divided into its premises and conclusion.[^note-14] So: *x* is conceptually divisible in the mereological sense just in case there are conceptually isolatable proper parts (*y*s) that compose *x*, such that *x* is the sum of *y*s. While a true unity is anything that *lacks* proper parts, a true multiplicity is anything that *has* proper parts, the most basic of which are themselves true unities.
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      Finally, unity and multiplicity stand in an asymmetrical metaphysical priority relation since the existence of a multiplicity presupposes the existence of some unities. As it turns out, then, a multiplicity isn’t a proper candidate for being ontologically independent, and thus for possessing an intrinsic nature: one can’t say of a multiplicity that it both exists and is the kind of thing that it is independently of the unities that constitute it. Since the existence of a true multiplicity is impossible in the absence of any true unities, the argument reduces to a rejection of true unity.
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      The structure of Śrīgupta’s argument in support of the minor premise, *all things are neither one nor many*, is opponent-relative, meaning that it is driven by targeting the entities that his opponents take to be ultimately real, with his principal targets being Yogācāra idealist theories of the mind and the non-Buddhist Vaiśeṣika ontology. The argument begins by rejecting material simples, thereby precluding composites of fundamental particles as well as any entities purportedly founded in fundamental particles or composites of them (TA 2–3) (see §1.1). He next turns to mental entities (TA 4–7ab), rejecting mental simples and any account of truly unified consciousness, which in turn precludes any account of a well-founded composite mental entity (see §1.2). After that, he takes aim at the dichotomy of momentary and enduring things (TA 7cd–9ab, TAV AŚ 5–7)[^note-15] (see §1.3), and he concludes his neither-one-nor-many argument by critically analyzing omnipresent and localized entities (TA 9cd–10; see §1.4).
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      ### 1.1 Material objects are neither one nor many
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      Śrīgupta’s argument against material simples is a concise line of reasoning that gestures to a long history of anti-atomist arguments, bearing notable resemblances to those found in Āryadeva’s *Four Hundred Stanzas* (*Catuḥśataka*, CŚ 9.15–17) and Vasubandhu’s (fourth–fifth century) *Autocommentary on the Treasury of Abhidharma* (*Abhidharmakośabhāṣya*, AKBh *ad* AK 1.43d) as well as his *Twenty Verses* (*Viṃśikā*, Vś 11–15) (see the entries on ancient atomism and naturalism in Classical Indian Philosophy). All the external world realists in Śrīgupta’s intellectual context were atomists of one kind or another, who supposed that the material world is founded in and constituted by simple fundamental particles. There were broadly three live views on how fundamental particles constitute a composite:
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      1. Conjoined View: Each fundamental particle is in contact with adjacent fundamental particles (e.g., Nyāya and Vaiśeṣika).
      2. Intervening Space View: Fundamental particles are not in contact with adjacent particles, but have intervening space between them (e.g., the Kāśmīri Sarvāstivāda-Vaibhāṣika, Saṅghabhadra, c. fourth–fifth century).
      3. Spatially Continuous View: Fundamental particles are spatially continuous, without being in contact with one another and without intervening space (e.g., Vasumitra, c. second century CE, and Vasubandhu in the AKBh).
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      The common case against the Conjoined View runs as follows: each fundamental particle in a composite is in contact with neighboring particles either wholly or partially. If, in the first case, the entirety of a particle were in contact with each adjacent particle, then all the particles would merge with one another and the composite would collapse into the size of a single particle.[^note-16] In other words, no quantity of point-like, unextended particles could ever conjoin to yield an extended composite. On the other hand, if a particle were only partially in contact with adjacent particles—e.g., if particle *x* were in contact with particle *y* on its left side at a locus $l_1$ and in contact with particle *z* on its right side at $l_2$—then it follows that particle *x* would have spatially distinct parts, and would fail the simplicity criterion for being a fundamental particle.
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      Śrīgupta’s argument echoes this line of reasoning, but it might be read as targeting all three views surveyed above since it does not explicitly center on the point of *contact* between particles, but rather on the point at which a given particle is facing (**adhimukha*, *mngon par phyogs pa*) neighboring particles:
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      > A particle could not be unitary because a composite of [true unities] is impossible. [TA 2a]
      >
      > A fundamental particle could not be a [true] unity because an [extended] composite [of such particles] is impossible, since if it had a [truly] unitary nature [and thus lacked spatially distinct parts], then it would [absurdly] face [all adjacent particles] at the same location. Nor is it the case that [a fundamental particle] could possess some other nature by means of which it could face [adjacent particles at distinct locations], since in that case it would absurdly follow that [each fundamental particle] would be a multiplicity.[^note-17]
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      To paraphrase the argument as a destructive dilemma:
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      - *Dilemma:* If material objects are constituted by fundamental particles, those fundamental particles either have spatially distinct sides or they do not.
      - *Unextended Lemma:* If fundamental particles did *not* have spatially distinct sides, then they would face each adjacent particle at the same location.
      - *Extended Lemma:* If fundamental particles *did* have spatially distinct sides, then they could not meet the simplicity criterion for being fundamental.
      - *Conclusion:* Material objects are not constituted by fundamental particles.
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      Like other anti-atomist arguments in this tradition, Śrīgupta’s line of reasoning turns on the question of whether or not fundamental particles are differentiable into spatially distinct loci, or sides (*digbhāgabheda*). In other words, fundamental particles are either spatially extended or unextended.[^note-18] If fundamental particle *x* did *not* have spatially distinct sides—and were thus spatially unextended—then the point at which *x* faces particle *y* on its left side would absurdly be identical to the point at which it faces particle *z* on its right side, and likewise those above and below it. On the other hand, if fundamental particles *did* have spatially distinct sides—and were thus spatially extended—then, being at least analytically or conceptually divisible into proper parts (e.g., a right side and a left side, a top and a bottom, and a front and a back), they could not meet the simplicity criterion for being a fundamental particle, and each of the purportedly truly unitary, basic building blocks of the material world would absurdly be a multiplicity. Śrīgupta concludes that if there are no material true unities, then neither can there be a material true multiplicity, which, by definition, is a plurality of true unities. Being neither truly one nor truly many, material objects thus lack an intrinsic nature.
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      Śrīgupta takes this argument to rule out both simple and composite material substances, including the Vaiśeṣika category of material wholes (*avayavin*), which exist over and above their basic parts—fundamental particles—on which they both ontologically and causally depend.[^note-19] Moreover, he argues, all other sorts of entities that are thought to be founded in material substances are also precluded, such as the Vaiśeṣika ontological categories of properties (*guṇa*), motion/action (*karma*), universals (*sāmānya*), individuating factors (*viśeṣa*), and the inherence relation (*samavāya*).
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      ### 1.2 Mental entities are neither one nor many
    step1: TBD
