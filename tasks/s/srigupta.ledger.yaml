      There is a true multiplicity only if there are some true unities.
    step1: TBD
    step2: TBD
  - id: 19
    kind: body
    source: |-
      In these arguments, one (*eka*) and many (*aneka*) are understood as a unity and a multiplicity in a strong sense, denoted in the premises above by “*true* unity” and “*true* multiplicity”. As Nāgārjuna implies in RĀ 1.71, a true unity is anything that does not have multiple distinct spatial or temporal loci (*pradeśa*), which amount to proper parts. Nāgārjuna is thus equating being a true unity with being mereologically simple. And a true multiplicity is just a plurality of true unities. True unities are thus metaphysically prior to a true multiplicity such that the existence of a true multiplicity presupposes the existence of some true unities, in the same way that the existence of a forest presupposes the existence of some trees.[^note-9] So, from the first two premises—P1: *to be a true unity is to lack proper parts* and P2: *there is nothing that lacks proper parts*—Nāgārjuna infers that there are no true unities. And from this conclusion taken together with the third premise—P3: *there is a true multiplicity only if there are some true unities*—he concludes that there is no true multiplicity either. Nāgārjuna’s argument might thus be reconstructed as follows:
    step1: TBD
    step2: TBD
