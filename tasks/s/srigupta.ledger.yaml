      [^note-21]: *Satyākāravāda and *Alīkākāravāda are not attested labels in extant Indic doxographies, which instead feature the Sākāravāda-Nirākāravāda distinction, referring, respectively, to the theories on which consciousness is or is not endowed with a mental representation. Tibetan doxographers commonly classified Yogācāra Sākāravādins as realists about representations and Yogācāra Nirākāravādins as antirealists about representations. While these labels were imposed onto diverse sets of thinkers in contriving subschools of Yogācāra, they are nonetheless useful for understanding the structure of Śrīgupta’s argument and the range of positions he is targeting. See Almogi (2010) for a survey of these categorizations in late Indian Buddhist and early Tibetan doxographical writings. The Sākāravāda-Nirākāravāda distinction in the context of Yogācāra should be distinguished from the use of this same pair of terms to refer to external world realists who endorse, respectively, representationalist theories of perception (e.g., Sautrāntika) and direct realist theories of perception (e.g., Vaibhāṣika and Nyāya). Indeed, when transitioning from the external world realist to the Yogācāra context, the very meaning of “representation” (*ākāra*) changes insofar as Yogācārins admit of no corresponding extramental object that is “represented”. Instead, here a representation refers merely to the content of a cognition, i.e., what the cognition is about.
