      The individual allocation scenarios just described are powerful “intuition pumps” (Dennett 2013)[^dennett-2013] because they emphasize a direct competition between two individuals over the same required health resource. Yet if the only lesson we can draw from the life-saving and health improvement scenarios is that our intuitions about whether disability matters are clearer the starker the contrast in benefit or cost, this does not seem to advance the debate very much. Given that there is already a concern about the unrealistic simplicity of the individual cases, perhaps we can get a better result by asking whether, and in what way, disability is a relevant ethical consideration as a general social policy or allocation strategy that will be consistently and neutrally applied to everyone, without exception.
    step1: |-
      刚刚描述的个体分配场景是强有力的“直觉泵”（Dennett 2013）[^dennett-2013]，因为它们强调两个人为同一必需医疗资源而直接竞争。然而，若从救命与健康改善场景中只能得出这样的教训——收益或成本的对比越鲜明，我们关于失能是否重要的直觉就越清楚——这似乎并不能把争论推进多少。既然已经有人担心个体案例不切实际地简单，我们或许可以问：失能作为一项将被一致而无例外地适用于所有人（无一例外）的普遍社会政策或分配策略，是否以及在何种方式上构成相关的伦理考量。如此或可获得更好的结果。
    step2: |-
