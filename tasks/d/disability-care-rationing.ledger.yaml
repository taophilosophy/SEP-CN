      Some disability advocates argue that there is no real dilemma here since “capacity to benefit” is merely a cloak for the prejudice that the life of disabled person, like that of the elderly, is of intrinsically less value and deserving of less effort to preserve or improve (Asch 2001)[^asch-2001]. These advocates have a point since precisely this view can be seen in the pronouncements of respectable bioethicists who do assert that the “disabled life” is fundamentally inferior (Kuhse & Singer 1985; Singer 1983; McKie et al. 1998)[^kuhse-1985][^mckie-1998][^singer-1983]. In the case of disability, for some writers, lower capacity to benefit is not an empirical conclusion, but an *a priori* assumption (Veach 1986; Harris 1986; Anand & Hanson 1997; Arneson & Nord 1999; Rock 2000; Koch 2000)[^anand-1997][^arneson-1999][^harris-1986][^koch-2000][^nord-1999][^rock-2000][^veach-1986]. CEA systematically disadvantages people with disabilities because it is intrinsically discriminatory.
    step1: |-
      一些失能倡导者认为此处并无真正的两难，因为“受益能力”不过是偏见的遮羞布——这种偏见认为失能者的生命（如同老年人的生命）本身价值较低、不值得为保全或改善它付出那么多努力（Asch 2001）[^asch-2001]。此议并非无的放矢：恰恰可在可敬的生命伦理学家的言论中见到这种看法，他们确实主张“失能的生命”从根本上低劣（Kuhse & Singer 1985; Singer 1983; McKie et al. 1998）[^kuhse-1985][^mckie-1998][^singer-1983]。就失能而言，在某些作者那里，受益能力较低并不是经验结论，而是 *a priori* 假定（Veach 1986; Harris 1986; Anand & Hanson 1997; Arneson & Nord 1999; Rock 2000; Koch 2000）[^anand-1997][^arneson-1999][^harris-1986][^koch-2000][^nord-1999][^rock-2000][^veach-1986]。CEA 系统性地不利于失能者，因为它本身带有歧视性。
    step2: |-
      一些失能权利倡导者认为，两难其实并不存在：所谓“受益能力”不过是偏见的遮羞布，这种偏见认为失能者的生命（如同老年人的生命）本身价值较低，不值得为保全或改善它付出那么多努力（Asch 2001）[^asch-2001]。这些倡导者并非无的放矢：在可敬的生命伦理学家们的言论中，恰恰可以看到这种看法，他们确实主张“失能的生命”从根本上低劣（Kuhse & Singer 1985; Singer 1983; McKie et al. 1998）[^kuhse-1985][^mckie-1998][^singer-1983]。就失能而言，某些作者所说的受益能力较低并不是经验结论，而是 *a priori* 假定（Veach 1986; Harris 1986; Anand & Hanson 1997; Arneson & Nord 1999; Rock 2000; Koch 2000）[^anand-1997][^arneson-1999][^harris-1986][^koch-2000][^nord-1999][^rock-2000][^veach-1986]。CEA 之所以系统性地不利于失能者，是因为它本身就带有歧视性。
