      One of the apparent ethical advantages of CEA is its commitment to equality and impartiality: everyone’s health needs are considered equally, irrespective of race, gender, or income level. But as the aggregation problem suggests, we intuitively believe that saving a person’s life is ethically more important than improving their appearance. More generally, it is an open ethical question whether we should skew our distribution of health resources towards those who are worst off or whose health needs are more significant or urgent; and if we do so, it is not clear how much extra weight these considerations should have in our assessment. An additional open question, to which we will return below, is whether the “worst off” should be defined in terms of health state or some other disadvantage as well. One version of the underlying intuition at work here is the often cited “rule of rescue”: since saving a life is arguably of infinite or at least indefinite benefit, we should always rank allocations that save a life the highest. For example, if a community spends a substantial part of its yearly health care budget on rescuing a small child who has fallen down a well, this is ethically justifiable, according to the rule of rescue, although patently inefficient (see the debates in Hadorn 1992; Jonson 1986; Cookson & Dolan 1999: Nord 1999; and Ubel 2000)[^cookson-1999][^hadorn-1992][^nord-1999][^ubel-2000].
    step1: |-
            CEA 表面上的一项伦理优势，是它对平等与公正的承诺：每个人的健康需要都得到平等考量，不问种族、性别或收入水平。但正如加总问题所提示，我们直觉上相信救一个人的命在伦理上比改善其容貌更重要。更一般地说，我们是否应把医疗资源的分配偏向境况最差者、或健康需要更重大更急迫者，这是一个悬而未决的伦理问题；而即便这样做，这些考量在我们的评估中应占多少额外权重也不清楚。另一个悬而未决的问题是（下文将回到）：所谓“境况最差”应依健康状态来界定，还是也依某种其他不利来界定。此处起作用的一种底层直觉版本，是常被引用的“救助规则”：既然救一条命可以说具有无限或至少不确定的收益，我们就应始终把救命的分配排到最高。例如，如果一个社区把年度医疗预算的相当部分用于营救一个掉进井里的小孩，按救助规则这在伦理上可辩护，尽管显然低效（相关争论见 Hadorn 1992; Jonson 1986; Cookson & Dolan 1999: Nord 1999; Ubel 2000）[^cookson-1999][^hadorn-1992][^nord-1999][^ubel-2000]。
    step2: |-
      CEA 表面上的一项伦理优势，是它对平等与公正的承诺：每个人的健康需要都得到平等考量，不问种族、性别、收入。但正如加总问题所示，我们直觉上相信救人性命在伦理上重于改善一个人的容貌。更一般地说，是否应当把医疗资源分配偏向境况最差的人、或健康需要更重大更急迫的人，仍是悬而未决的伦理问题；即便如此，这些考量在评估中应占多少额外权重也不清楚。另一个未决问题（下文再论）是：“境况最差”应当按健康状态界定，还是兼按其他不利来界定。这里所倚仗的一种底层直觉，就是常被引用的“救助规则”：救人性命既然具有无限、或至少不确定的收益，就应当始终把救命分配排到最高。例如某个社区把年度医疗预算的相当一部分用于营救掉进井里的小孩，按救助规则这在伦理上可辩护，尽管显然低效（争论见 Hadorn 1992; Jonson 1986; Cookson & Dolan 1999; Nord 1999; Ubel 2000）[^cookson-1999][^hadorn-1992][^nord-1999][^ubel-2000]。
