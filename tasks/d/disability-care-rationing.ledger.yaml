      At least as compared to pure politics or the “free market”, using CEA with a metric such as QALY for rationing the use of health resources has the strongest claim to rationality. But what of its ethical acceptability? Even strong advocates of using CEA to ration health resources acknowledge that it suffers from at least five fundamental (and interconnected) ethical concerns. Some of these concerns only make sense at the population level of meso-allocations, but all affect, directly or indirectly, allocation decisions at the individual level (Daniels 1993, 1994, 1998; Brock 1995, 1998; Brock & Wikler 2006)[^brock-1995][^brock-2006][^daniels-1993].
    step1: |-
            至少与纯政治或“自由市场”相比，用 CEA 配合 QALY 之类度量来配给医疗资源的使用，最有资格主张理性。但其伦理可接受性如何？即便强烈主张以 CEA 配给医疗资源的人，也承认它至少有五项根本（且相互关联）的伦理关切。其中有些关切只在宏观分配的人口层面才说得通，但全都直接或间接影响个体层面的分配决策（Daniels 1993, 1994, 1998; Brock 1995, 1998; Brock & Wikler 2006）[^brock-1995][^brock-2006][^daniels-1993]。
    step2: |-
      至少与纯政治或“自由市场”相比，以 CEA 配合 QALY 之类度量来配给医疗资源，最有资格主张自己是理性的。但它的伦理可接受性如何？即便强烈主张此道的人，也承认它至少有五项根本而相互关联的伦理关切；有些只在宏观分配的人口层面才说得通，但全都直接或间接影响个体层面的决策（Daniels 1993, 1994, 1998; Brock 1995, 1998; Brock & Wikler 2006）[^brock-1995][^brock-2006][^daniels-1993]。
