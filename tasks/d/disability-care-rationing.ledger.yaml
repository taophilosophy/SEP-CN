      The priority problem need not be characterized in terms of who is worst off so much as who most deserves the resource. For example, should it matter, all things being equal, whether a resource is provided to an elderly person who will not benefit as much from the resource as a younger person? In general, should the age of the recipient matter? CEA tends to favor highly efficient resource users, who will normally be younger, and some non-utilitarian philosophers have argued that as long as we ensure everyone a normal lifespan—or “fair innings” as Williams (1997) calls it—then ranking older recipients lower is not unfair. Alternatively, it has been strongly argued that, benefit notwithstanding, people who live unhealthy lives and are responsible for their health needs should be downgraded or lose their priority (Moss & Siegler 1991; Wikler 2002; Cappelen & Norheim 2006)[^cappelen-2006][^moss-1991][^wikler-2002]. (Although the examples used for this argument tend to be drug addicts, smokers, drinkers, and other discreditable risk takers, the argument, if successful, would also apply to athletes and heroes who risk their lives.)
    step1: |-
            优先问题不必以谁境况最差来刻画，而可以谁最该得该资源来刻画。例如，在其他条件相同的情况下，把资源给一位从中获益不如年轻人多的老年人，这重要吗？一般来说，受助者的年龄应否重要？CEA 倾向于偏向高效的资源使用者，而他们通常更年轻；一些非功利主义哲学家主张，只要我们确保每个人都能有正常寿命——或如 Williams（1997）所称的“公平的一份”——那么把年长受助者排在后面并不不公。另一种有强论证的立场是：不论收益如何，过不健康生活、对自己的健康需要负有责任者应被降级或取消优先（Moss & Siegler 1991; Wikler 2002; Cappelen & Norheim 2006）[^cappelen-2006][^moss-1991][^wikler-2002]。（尽管支持这一论证的例子往往是吸毒者、吸烟者、饮酒者及其他名声不佳的冒险者，但该论证若成立，也会适用于冒生命危险的运动员与英雄。）
    step2: |-
      优先问题也可以不必以“谁境况最差”、而以“谁最该得该资源”来刻画。例如，在其他条件相同时，把资源给予一位获益不如年轻人多的老年人，这重要吗？受助者的年龄一般应否重要？CEA 倾向于偏向高效使用者，而这些人通常更年轻；一些非功利主义哲学家主张，只要确保人人都有正常寿命——或如 Williams（1997）所说的“公平的一份”——把年长者排在后面便无不公。另一个有强论证的立场是：不论收益如何，过不健康生活、并应对自身健康需要负责的人，应被降级或取消优先（Moss & Siegler 1991; Wikler 2002; Cappelen & Norheim 2006）[^cappelen-2006][^moss-1991][^wikler-2002]。（例子多为吸毒者、吸烟者、饮酒者等名声不佳的冒险者；但这个论证如果真的成立，也适用于冒生命危险的运动员与英雄。）
