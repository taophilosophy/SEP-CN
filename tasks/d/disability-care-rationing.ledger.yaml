      Even if this debate about how QALYs should be developed is resolved, this may have little impact on the dilemma mentioned. If disability objectively reduces quality of life, then the expected overall benefit of a health resource will tend to be adversely affected and CEA will disadvantage persons with disabilities; but on the other hand, if not, and disability does not impact on the capacity to benefit from a health resource, then people with disabilities will be disadvantaged by the provision of these resources that do not take their disabilities into account. As Amaryta Sen helpfully explains the point, the value of any resource is not constant across a population since some differences between people affect their ability to “convert” the resource into what is value, either objectively, or to them alone (Sen 1999; Ruger 2010)[^ruger-2010][^sen-1999]. There are differences between people that make a difference to the value extracted from the same resource, and disability is perhaps the clearest example of such a difference.
    step1: |-
      即便关于 QALY 应如何建构的争论得以解决，对前述两难也可能影响甚微。若失能客观地降低生活质量，则一项医疗资源的预期总体收益便往往受到不利影响，CEA 也将使失能者处于不利地位；但另一方面，若并非如此，失能并不影响从医疗资源中受益的能力，那么使失能者处于不利地位的，反倒是那些不考虑其失能而供给的资源。阿马蒂亚·森（Amartya Sen）对此有一有帮助的说明：任何资源的价值在一个群体中并非恒定，因为人与人之间的某些差别会影响其把资源“转换”为有价值之物（客观上，或仅对其本人而言）的能力（Sen 1999; Ruger 2010）[^ruger-2010][^sen-1999]。人与人之间存在差别，这些差别使同一资源所提取的价值有所不同，而失能也许是这类差别最清楚的例子。
