      Suppose we are asked to decide between a person in a wheelchair and someone without a severe disability. If the issue is framed crudely in term of “lives worth living” and we decide on stereotypical and ungrounded assumptions about the abject misery of living in a wheelchair, *ex ante*, then a case could be made that our decision to favor the person without a disability was irrational, unfair, and discriminatory. By contrast, suppose we cast the situation as one in which unavoidable scarcity necessitates a choice that, however it goes, will be regrettable and unfortunate (sometimes called a “tragic choice”: see Calabresi & Bobbitt 1978 and Nussbaum 2000)[^calabresi-1978][^nussbaum-2000]. So framed, we might seem far more ethically justified in appealing to disability, or indeed any other real difference between the two individuals that is, at least in principle, relevant to our judgment. Disability, as we have seen, is an *a priori* relevant consideration to health care allocation. We might argue that, after all, we have no option but to choose someone (choosing no one would be both wasteful and unfair to both). Against this it might be argued that fairness in such a circumstance can only be achieved by a purely random choice.
    step1: |-
      假设要我们在一位坐轮椅者与一位无严重失能者之间作决定。若问题以“值得过的生命”之类粗陋措辞表述，且我们依循关于坐轮椅生活之凄惨的刻板而无据的假定（从事前看），便可主张：我们偏向无失能者的决定是非理性的、不公的、歧视性的。反之，假设我们把情境表述为：不可避免的稀缺迫使作出一个无论怎样都令人遗憾、不幸的选择（有时称为“悲剧性选择”，见 Calabresi & Bobbitt 1978 与 Nussbaum 2000）[^calabresi-1978][^nussbaum-2000]。如此表述，我们诉诸失能——或诉诸两人之间任何其他真实差别，只要它至少在原则上与判断相关——似乎就在伦理上正当得多。如我们所见，失能是医疗分配中一个 *a priori* 相关的考量。我们或许会论证：毕竟我们别无选择，只能选一个人（谁都不选既浪费，又对两人都不公）。对此可反驳说：此种情形下的公平，只能通过纯随机选择实现。
    step2: |-
      假设要我们在一个坐轮椅的人和一个没有严重失能的人之间作选择。如果问题被粗暴地表述为“什么样的生命值得过”，而我们对坐轮椅的生活又抱刻板而毫无根据的凄惨想象，那么从 *ex ante* 看，偏向没有失能者的决定就是非理性的、不公平的、歧视性的。反过来，假设我们把情形表述为：不可避免的稀缺逼着我们作一个无论如何都会令人遗憾、令人难过的选择（有时称为“悲剧性选择”，见 Calabresi & Bobbitt 1978 与 Nussbaum 2000）[^calabresi-1978][^nussbaum-2000]。这样表述之后，我们援引失能——或者两位个体之间任何其他真实的差别，只要它至少在原则上与判断相关——似乎就在伦理上正当得多。如我们所见，失能是医疗分配中一个 *a priori* 相关的考量。我们或许会说，毕竟我们别无选择，只能选一个人（谁都不选既浪费，又对两人都不公平）。对此也可以反驳说：在这种情形下，公平只能靠纯随机的选择来实现。
