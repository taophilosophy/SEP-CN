      To calculate the effectiveness of care resource utilization at the population level requires both resource costs and quality of life benefits to be aggregated in terms of the expected number of uses of each resource. A low-cost and low-benefit, but widely used resource will tend to rank as more efficient than a high-cost and high-benefit, but rarely used resource. This can lead to counter-intuitive results. For example, when the Oregon government tried to put into place a plan to lower Medicaid costs using CEA and QALY they began by identifying treatment/condition pairs—that is, types of treatments provided to patients with different kinds of health conditions—and from these created a rationing priority list in terms of expected QALY benefits from treatment. One of the consequences of the plan was that the treatment of capping teeth was far higher on the priority list than appendectomy, even though no one would die from uncapped teeth while untreated appendicitis could be lethal. The reason was obvious: you could pay for many hundred instances of teeth capping for the price of a single appendectomy, and adding up all of the small but non-zero QALY benefits from the capping would trump the QALY benefits of the appendectomy. This result was widely viewed as profoundly counterintuitive (although some argued that our intuitions are not always as clearly opposed to favoring aggregated benefits [Kamm 1993; Nord 1999])[^kamm-1993][^nord-1999].
    step1: |-
            要在人口层面计算照护资源使用的有效性，就需要按每项资源的预期使用次数把资源成本与生活质量收益一并加总。一种低成本、低收益但被广泛使用的资源，其效率排名往往高于高成本、高收益但罕被使用的资源。这可能导致反直觉的结果。例如，俄勒冈政府试图以 CEA 与 QALY 落实一项降低 Medicaid 成本的计划时，先是识别治疗/病症配对——即为不同类型健康状况的病人提供的各类治疗——再据此按预期 QALY 收益制定配给优先清单。该计划的后果之一是：补牙在优先清单上的排位远高于阑尾切除术，尽管没有人会因未补牙而死，而未治疗的阑尾炎可能致命。原因显而易见：一次阑尾切除术的价钱可支付数百例补牙，把补牙所有微小但非零的 QALY 收益加起来，就会盖过阑尾切除术的 QALY 收益。这一结果被广泛视为极度反直觉（尽管有人主张，我们的直觉并不总是如此明确地反对偏向加总收益〔Kamm 1993; Nord 1999〕）[^kamm-1993][^nord-1999]。
    step2: |-
      要在人口层面计算照护资源使用的有效性，就必须按每项资源的预期使用次数，加总资源成本与生活质量收益。低成本、低收益而广泛使用的资源，效率排名往往高于高成本、高收益而罕用的资源，由此导致反直觉的结果。例如俄勒冈州政府想用 CEA 与 QALY 压低 Medicaid 成本，先识别治疗/病症配对（即对不同健康状况者提供的各类治疗），再根据预期 QALY 收益定出配给优先清单；后果之一是补牙的排位远高于阑尾切除术——尽管没有人因为没补牙而死，未治的阑尾炎却可能致命。原因显而易见：一次阑尾切除术的费用可以支付数百例补牙，把补牙所有微小而可能为正的 QALY 收益加总，就盖过了阑尾切除术的收益。这一结果被广泛视为极度反直觉（不过也有人主张，我们的直觉并不总是如此明确地反对偏向加总收益〔Kamm 1993; Nord 1999〕）[^kamm-1993][^nord-1999]。
