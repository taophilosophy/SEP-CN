      Another reason for the stalemate is the aggregation problem as applied to the “benefit” side of the CEA calculation. Some have argued that we should abandon the QALY and DALY, summary health measure technology entirely (Anand & Wailoo 2000)[^anand-2000], while most agree with Dan Brock that health care prioritization without any reference to quality of life is a non-starter (Brock 1995)[^brock-1995]. There have been some attempts at finding a workable multi-criteria approach in which health benefits are disaggregated into separate components (Baltussen & Niessen 2006)[^baltussen-2006], but such suggestions open the door to the so-called “indexing problem” (discussed later in the context of disability) of trying to sum up disparate and incommensurable benefits (income, happiness, social productivity, creativity) in a way that would allow us to compare two health outcomes. Attempts at direct head-to-head comparisons between health outcomes require the dubious methodological assumption that health is *unidimensional*: walking out of the hospital with one surviving hand is obviously better than with none; but is being left partially sighted better, or worse, than ending up in a wheelchair? How do we compare various domains of human functioning that, together, make up the state of health?
    step1: |-
            僵局另一个原因，是加总问题在 CEA 计算“收益”一侧的适用。有人主张我们应彻底放弃 QALY 与 DALY 这类汇总健康度量技术（Anand & Wailoo 2000）[^anand-2000]；而多数人同意 Dan Brock 的看法：不涉及生活质量谈医疗优先排序根本行不通（Brock 1995）[^brock-1995]。已有一些尝试寻求可行的多标准进路，把健康收益拆解为彼此独立的成分（Baltussen & Niessen 2006）[^baltussen-2006]，但此类建议又敞开了所谓“标引问题”（下文在失能语境中讨论）之门——即试图把彼此不同且不可通约的收益（收入、幸福、社会生产力、创造力）加总，以便我们能比较两种健康结局。直接对健康结局作正面比较的尝试，要求一个可疑的方法论假定：健康是*单维的*。带着一只幸存的手走出医院显然好过一只手都没有；但只剩部分视力比最终坐上轮椅更好还是更坏？我们如何比较共同构成健康状态的人的诸功能领域？
    step2: |-
