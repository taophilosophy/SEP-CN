      At the level of meso-allocation—the distribution of health care resources across a single institution, such as a hospital or clinic—much of what is called “rationing at the bedside” is disguised as standard clinical practice (Ubel 2000)[^ubel-2000]. If a physician—whether motivated by pressures from hospital administrators, managed care organization or insurance company, or merely excising her or his professional expertise—decides to forego live-saving treatment for a patient on the grounds that the health benefits would not warrant the use of the resource, then the judgment clearly reflects, rough and ready, intuitive application of CEA. Or if a treatment is not provided because it is judged “medically futile”, that judgment is in effect a cost-benefit analysis. Treatments are said to be “futile” when in the physician’s judgment the expected health benefits do not sufficiently outweigh the costs of providing the care (Crossley 1995; Batavia 2002)[^batavia-2002][^crossley-1995]. Similarly, “Do Not Resuscitate” or DNR orders, while they may be equally motivated by futility or even compassion, are essentially CEA rationing techniques, although here the judgment is that the resource would have no benefit at all.
    step1: |-
            在中观分配层面——即医疗资源在单一机构（如医院或诊所）内部的分配——“床边配给”有相当一部分被伪装成标准临床实践（Ubel 2000）[^ubel-2000]。如果一位医生——无论出于医院管理者、管理式医疗组织或保险公司的压力，还是仅仅凭其专业判断——决定不予某位病人救生治疗，理由是健康收益不足以证成该资源的使用，那么这个判断显然反映了对 CEA 粗略而现成的直觉应用。或者，如果某项治疗因被判定“医学上无益”而不予提供，该判断实际上就是一种成本—收益分析。当医生判断预期健康收益不足以为提供该照护的成本辩护时，治疗便被称为“无益”（Crossley 1995; Batavia 2002）[^batavia-2002][^crossley-1995]。同样，“不予心肺复苏”（DNR）医嘱，虽可能同样出于无益乃至同情，本质上也是 CEA 配给技术，尽管此处的判断是该资源根本不会有任何收益。
    step2: |-
      中观分配层面——资源在单一机构（如医院或诊所）内部的分配——“床边配给”有相当一部分被伪装成标准临床实践（Ubel 2000）[^ubel-2000]。医生不论是出于院方、管理式医疗组织或保险公司的压力，还是仅凭专业判断，都可能以“健康收益不足以证成资源使用”为由放弃救生治疗。这种判断显然反映了对 CEA 粗略而现成的直觉应用；如果某项治疗因“医学上无益”的判决而不予提供，这一判断实际就是成本—收益分析——医生判断预期收益不足以抵偿照护成本时，治疗便称作“无益”（Crossley 1995; Batavia 2002）[^batavia-2002][^crossley-1995]。同样，“不予心肺复苏”（DNR）医嘱虽然也可能出于无益乃至同情，本质上仍是 CEA 配给技术，只是这里判断为该资源全无收益。
