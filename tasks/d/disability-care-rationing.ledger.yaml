      Yet it was not clear how a renewed emphasis on “fair chances” helps to resolve the dilemma that CEA purportedly creates. Even if a purely “best outcome” approach disadvantages people with disabilities, focusing on “fair outcomes” would not mean that we ignored differences in costs and capacity to benefit created by disability. One might argue that, as abstracted individuals, everyone should have an equal opportunity to benefit from health care resources, *ceteris paribus*. Yet, as it is irrational to ignore issues of cost and benefit, it is clear that disability is just the paradigm example of a consideration that disrupts the *ceteris paribus* assumption. People with disabilities cannot fairly be denied the opportunity to benefit from health care, but on rational and relevant grounds of cost and prospect of benefit, they can fairly be denied health care, at least on a case by case basis. Brock came to realize that the move to egalitarian equality of opportunity could not resolve the dilemma posed by the relevance of disability in health care rationing. After nearly three decades of work he acknowledged that the problem of seemingly justifiable disability discrimination “represents a deep and unresolved problem for resource prioritization” (Brock 2002)[^brock-2002] and “there is much work still to be done” (Brock 2009)[^brock-2009].
    step1: |-
      然而，重新强调“公平机会”如何有助于化解 CEA 据称造成的两难，并不清楚。即便纯粹“最佳结果”进路不利于失能者，聚焦“公平结果”也不意味着无视失能造成的成本与受益能力差异。有人可能论证，作为抽象个体，在 *ceteris paribus* 之下，人人应有平等机会从医疗资源中受益。但既以无视成本与收益问题为不理性，则显然，失能正是扰乱 *ceteris paribus* 假定的考量的典型例子。失能者不能被公平地剥夺从医疗中受益的机会，但基于成本与受益前景这类理性而相关的理由，他们可以被公平地拒绝给予某项医疗——至少可逐案如此。Brock 后来认识到，转向平等主义的机会平等并不能化解失能在医疗配给中的相关性所提出的两难。经近三十年工作，他承认这一看似可辩护的失能歧视问题“是资源优先排序中一个深刻而尚未解决的问题”（Brock 2002）[^brock-2002]，并且“还有许多工作要做”（Brock 2009）[^brock-2009]。
