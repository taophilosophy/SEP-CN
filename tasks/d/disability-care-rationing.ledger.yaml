      On the other side, the egalitarian “fair chances” approach can hardly be the whole story since the only allocation strategy that fits a purely egalitarian approach is random allocation or a lottery. A lottery is vaguely fair when the two potential beneficiaries incur the same costs and benefits, but not when the benefits accrued from a resource are hugely different, or when other considerations, such as urgency, enter into the calculation. Some egalitarians have backtracked from pure randomness of a lottery (so that the asthmatic in the above example would have a somewhat lower chance of being successful—see Brock 1988; Broome 1988, 2004)[^brock-1988][^broome-1988]. Others have argued that considerations like urgency, the level of overall health need, or age should affect the proportional chances of success (Kamm 1993)[^kamm-1993]. Yet others have insisted that the asthmatic has already lost the “natural lottery” by having a serious health condition, so there is no need to run another lottery (Menzel 1989)[^menzel-1989]. These attempts aside, the lottery approach is not greatly favored, except as a last resort.
    step1: |-
            另一方面，平等主义的“公平机会”进路也远非全貌，因为唯一符合纯平等主义进路的分配策略是随机分配或抽签。当两位潜在受益者所承担的成本与收益相同时，抽签是模糊意义上的公平；但当一项资源所积累的收益相差悬殊，或当紧迫性等其他考量进入计算时，就不是了。一些平等主义者已从抽签的纯粹随机性上后退（于是上例中的哮喘者会有略低一些的成功机会——见 Brock 1988; Broome 1988, 2004）[^brock-1988][^broome-1988]。另一些人主张，紧迫性、总体健康需要水平或年龄等考量应影响按比例的成功机会（Kamm 1993）[^kamm-1993]。还有人坚持，哮喘者既已因患有严重健康状况而在“自然抽签”中失手，就不必再抽一次（Menzel 1989）[^menzel-1989]。撇开这些尝试，抽签进路并不太受青睐，除非作为最后手段。
    step2: |-
      另一方面，平等主义的“公平机会”进路也远非全貌：唯一符合纯平等主义进路的策略是随机分配或抽签。两位潜在受益者的成本与收益相同时，抽签在模糊的意义上是公平的；当收益悬殊、或紧迫性等其他考量进入计算时，就不再如此。一些平等主义者已经从纯粹随机性上后退（于是上例中的哮喘者成功机会略低——见 Brock 1988; Broome 1988, 2004）[^brock-1988][^broome-1988]；另一些人主张紧迫性、总体健康需要或年龄应影响按比例的成功机会（Kamm 1993）[^kamm-1993]；还有人坚持，哮喘者既然已经在“自然抽签”中失手，就无须再抽（Menzel 1989）[^menzel-1989]。撇开这些尝试不谈，抽签进路并不可取，只能作最后手段。
