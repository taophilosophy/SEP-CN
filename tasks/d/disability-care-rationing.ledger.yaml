      Thus some philosophers have argued that the debate needs to be infused with the basic egalitarian principle of equal concern and respect, a principle that may from time to time trump CEA considerations. Sometimes, that is, “best outcomes” needs to be moderated by “fair chances”. Dan Brock, who was the first to raise the question of how disability impacts on health care allocation, argued that the best way forward is to structure health resource allocation to secure, to the greatest extent, equality of opportunity for all (Brock 1995)[^brock-1995]. Relocating the center of gravity of health care allocation to equality of opportunity was extremely appealing since it accorded with the a prominent view about the nature of health, and the value of health care, most clearly articulated by Norman Daniels (1985, and further developed in Daniels 2008)[^daniels-2008]. Health, Daniels argued, has a special moral significance for us because it facilitates and enhances our full range of opportunities in life, so ensuring that equality of health care is one of society’s most effective means of ensuring equality of opportunity across the board.
    step1: |-
      于是有些哲学家论证，这场争论需要注入平等关怀与尊重这一基本平等主义原则，该原则有时可压倒 CEA 考量。也就是说，“最佳结果”有时须由“公平机会”节制。Dan Brock 最早提出失能如何影响医疗分配的问题，他论证最佳出路是把医疗资源分配设计成尽可能保障所有人的机会平等（Brock 1995）[^brock-1995]。把医疗分配的重心移至机会平等极具吸引力，因为它契合一种关于健康本性与医疗价值的显要观点，该观点由 Norman Daniels 表达得最清楚（1985，并在 Daniels 2008 中进一步发展）[^daniels-2008]。Daniels 论证，健康对我们有特殊道德意义，因为它促成并增进我们生活中的全部机会；因此，确保医疗平等是社会确保全面机会平等最有效的手段之一。
