      Recently, Greg Bognar, recalling a version of “luck egalitarianism” (see Arneson 2000)[^arneson-2000] has suggested another tactic that might avoid this tangle (Bognar 2010, 2011)[^bognar-2010]. Trading on the distinction between the value of a life and its moral worth, he has argued that we are uncomfortable with the quality of life measure, not because it is irrelevant to the capacity to benefit from a health resource, but because it tells us nothing about whether the individual deserves or merits the scarce resource. He suggests that in general we should ignore disability in the allocation of health resources. Disability is only relevant, he claims, when it diminishes the capacity to benefit from the health resource and the individual is responsible for the disability. Thus, while it would be unjust to deny a person a hip and knee replacement just because he or she is blind because of bad luck, it would not seem to be unjust if the person was voluntarily obese: being overweight contributed to the need for the replacement surgery in the first place, and would in any event reduce the benefit that the person would receive from the surgery.
    step1: |-
      最近，Greg Bognar 重提一种“运气平等主义”（见 Arneson 2000）[^arneson-2000]，提出另一可能避开这团乱麻的策略（Bognar 2010, 2011）[^bognar-2010]。他借生命价值与其道德价值之分论证：我们对生活质量度量感到不安，并非因为它与从医疗资源受益的能力无关，而是因为它在个人是否应得或配得该稀缺资源上什么也没告诉我们。他主张，一般而言，在医疗资源分配中应无视失能。他声称，只有当失能削弱了从该医疗资源受益的能力、且个人对失能负有责任时，失能才相关。因此，仅因运气不好而失明就拒绝给一个人做髋膝关节置换，会是不公正的；但若此人系自愿肥胖，拒绝似乎就不算不公：超重首先促成了置换手术的需要，而且无论如何会减少此人从手术中所得的收益。
