      Although the most commonly used in health resource prioritization, the QALY is not the only health benefit summary measure. The disability-adjusted life year or DALY operates similarly to the QALY, although conversely in terms of the burden of living with a disability, measured in life-years (see Murray 1996)[^murray-1996]. Here 0 is again death and 1 full health and a DALY score measures a health state as a function of life-years lost to disability. To compare the two measures, if the quality-adjusted factor associated with a health state like spinal cord injury (SCI) is 0.4, then the quality of each year of life post-injury is 0.4 of a year lived in full health. If one is expected to live another 30 years, then the overall QALY is 12 years. DALYs work the same way, only in reverse: the person with the SCI would have the overall life burden of 0.6 times 30 years or 18 disability-adjusted life years. (There are other differences between the two measures that are more technical in nature and can be ignored in this discussion.)
    step1: |-
            尽管在医疗资源优先排序中最常用，QALY 并非唯一的健康收益汇总度量。失能调整生命年即 DALY 的运作与 QALY 类似，只是反过来以带失能生活的负担来计量，单位仍是寿命年（见 Murray 1996）[^murray-1996]。此处 0 同样表示死亡、1 表示完全健康，而 DALY 分数按因失能而损失的寿命年来度量一个健康状态。为比较这两种度量：若脊髓损伤（SCI）之类健康状态的质量调整因子为 0.4，则伤后每一年的生活质量相当于在完全健康中活 0.4 年。若预期再活 30 年，则总体 QALY 为 12 年。DALY 的运作方式相同，只是方向相反：SCI 者的总体生命负担为 0.6 乘 30 年，即 18 个失能调整生命年。（两种度量之间还有性质上更技术性的其他差异，本讨论可忽略。）
    step2: |-
      QALY 虽然在医疗资源优先排序中最常用，却不是唯一的收益汇总度量。失能调整生命年即 DALY 运作方式类似，只是反过来以带失能生活的负担来计量，单位仍是寿命年（见 Murray 1996）[^murray-1996]：0 同样表示死亡，1 表示完全健康，DALY 分数按因失能损失的寿命年来度量健康状态。试比较二者：若脊髓损伤（SCI）这类状态的质量调整因子为 0.4，则伤后每一年的生活质量相当于完全健康中的 0.4 年；若预期再活 30 年，总体 QALY 为 12 年。DALY 同理而方向相反：SCI 者的总体生命负担为 0.6 × 30 年，即 18 个失能调整生命年。（二者还有更技术性的差异，本讨论可以略过。）
