      《公约》明确主张，其所有具体实质性权利——医疗、教育、就业等等——都植根于对平等（或禁止歧视）与人的尊严的保护。这似乎意味着：若医疗资源分配对失能者有偏见或歧视，那就是明显侵犯人权。无论失能者是直接、个别地在“床边分配”中处于不利，还是因适用在其他方面对失能中立的私立或公立医疗筹资安排、或医疗分配政策与策略而间接受损，这一判断都成立。
