      While QALYs are most commonly used as measure of the benefit from health resources for CEA in health allocation strategies (e.g., UK’s National Institute for Health and Care Excellence (NICE) uses QALYs for quality of care determinations), DALYs have been extensively used by the World Health Organization and the World Bank—and the Institute of Health Metrics and Evaluation in Seattle, Washington—to determine the population burden of disease and injuries, primarily for public health applications, including especially national priority setting (Jamison et al. 2006, updated in Das & Samarasekera 2012)[^das-2012][^jamison-2006].
    step1: |-
            QALY 最常被用作 CEA 中医疗资源收益的度量以服务于医疗分配策略（例如英国国家卫生与临床优化研究所（NICE）用 QALY 作医疗质量判定），而 DALY 则被世界卫生组织与世界杯银行——以及华盛顿州西雅图的健康指标与评估研究所——广泛用于确定疾病与损伤的人群负担，主要用于公共卫生应用，尤其包括国家优先事项的设定（Jamison et al. 2006，更新于 Das & Samarasekera 2012）[^das-2012][^jamison-2006]。
    step2: |-
      QALY 最常用作 CEA 中医疗资源收益的度量，服务于分配策略（如英国国家卫生与临床优化研究所〔NICE〕就以 QALY 作医疗质量判定）；DALY 则被世界卫生组织、世界银行以及西雅图的健康指标与评估研究所广泛用于确定疾病与损伤的人群负担，主要施于公共卫生应用，尤其是国家优先事项的设定（Jamison et al. 2006，更新于 Das & Samarasekera 2012）[^das-2012][^jamison-2006]。
