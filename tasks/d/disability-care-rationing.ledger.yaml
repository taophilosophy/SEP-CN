      为寻找一种可能避开两难的平等主义分配原则，有些哲学家回到前面提到的优先性问题，指出视失能严重程度而定，失能者对医疗资源的需要可能大于无失能者，或医疗资源对保障失能者的机会平等可能作用更深。以“谁处境最差”为分配立论，反映的是称为优先主义的平等主义版本（见 Parfit 1997; Arneson 2000）[^arneson-2000][^parfit-1997]：资源分配受这样一种直觉引导——处境最差者有更多可获之益，应当优先，不是因为像功利主义那样看福利收益更大，而是因为需要更大。
