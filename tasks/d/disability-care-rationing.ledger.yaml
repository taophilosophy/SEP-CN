      The situation of persons with disabilities is a special ethical concern for health care allocation because disability is not just any human difference—like age, gender or ethnicity—or any social disadvantage—like poverty, gender discrimination, or minority marginalization. Disability is both a difference and a disadvantage that is *conceptually linked* to a person’s health state, and therefore health needs. All disability theorists these days agree that the physical, social and attitudinal environment in which a person with a health problem or functional impairment lives will make a huge difference to their perceived “disability” the person will experience (WHO 2001)[^who-2001]. Although there are a few hold-outs of the so-called “social model” that insist that disability is a pure “social construction” that has nothing to do with the state of a person’s health (see Oliver 1990)[^oliver-1990], the Consensus is that disability is conceptually linked to health: without an underlying health problem or impairment there is no disability.
    step1: |-
            失能者的处境之所以是医疗分配的特别伦理关切，是因为失能不只是人的任何一种差异（如年龄、性别或族裔），也不只是任何一种社会不利（如贫困、性别歧视或少数群体边缘化）。失能既是一种差异，又是一种不利，而它在*概念上*与一个人的健康状况、因而与健康需要*相联系*。如今所有失能理论家都同意，一个有健康问题或功能损伤的人所生活的物理、社会与态度环境，将对其所感受到的“失能”造成巨大差别（WHO 2001）[^who-2001]。尽管仍有少数所谓“社会模型”的坚持者主张失能纯粹是“社会建构”，与一个人的健康状况无关（见 Oliver 1990）[^oliver-1990]，共识仍是：失能在概念上与健康相联系——没有底层的健康问题或损伤，就没有失能。
    step2: |-
      失能者的处境之所以构成医疗分配的特别伦理关切，是因为失能既不是人的任一差异（年龄、性别、族裔），也不是任一社会不利（贫困、性别歧视、少数群体边缘化）。它既是差异又是不利，而且在概念上与健康状况、因而与健康需要相联。如今失能理论家一致同意：有健康问题或功能损伤的人所处的物理、社会与态度环境，对其所体验的“失能”影响巨大（WHO 2001）[^who-2001]。虽有少数“社会模型”坚持者主张失能纯属“社会建构”、与健康状况无关（见 Oliver 1990）[^oliver-1990]，共识仍是：失能在概念上与健康相系——没有底层的健康问题或损伤，就没有失能。
