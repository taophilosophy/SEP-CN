      Effectiveness, as we saw, is both a matter of the costs of using a health resource and the benefits accrued. At the policy level it is far more important to be clear about what range of costs are relevant (should we include indirect and lost opportunity cost?) as well as what constitutes a relevant benefit (should we include enhanced employment prospects, a more financially secure family situation, and so on?). The cost side of the equation is rarely considered by bioethicists, which is a clear gap in the debate. The benefit side has been considered, as noted above, by Brock and others under the wider rubric of the “separate spheres” problem (Brock 2003; Broome 2004)[^brock-2003][^broome-2004]. We can ignore these complications in what follows and restrict the issue of effectiveness, as is usually done in this literature, to a single criterion: the *capacity to benefit directly* from a health resource.
    step1: |-
      如我们所见，有效性既关乎使用医疗资源的成本，也关乎累积的收益。在政策层面，更紧要的是弄清哪些成本范围算相关（是否应计入间接成本与机会损失？），以及什么算相关收益（是否应计入更好的就业前景、更有经济保障的家庭状况等？）。方程的成本一侧，生命伦理学家很少考虑，这是争论中明显的缺口。收益一侧，如上所述，Brock 等人已在“分离领域”问题这一更宽的名目下讨论过（Brock 2003; Broome 2004）[^brock-2003][^broome-2004]。下文可忽略这些复杂之处，按本文献通常做法，把有效性问题收窄为单一标准：*直接受益能力*（the *capacity to benefit directly*）。
    step2: |-
      如我们所见，有效性既涉及使用某种医疗资源的成本，也涉及由此得到的收益。在政策层面，更要紧的是弄清哪些成本范围算相关（要不要把间接成本和机会损失计入？），以及什么算相关收益（要不要把更好的就业前景、更有经济保障的家庭状况等算进来？）。方程的成本一侧，生命伦理学家很少考虑，这是争论中一个明显的缺口。收益一侧，如上所述，布罗克（Dan Brock）等人在“分离领域问题”这一更宽的名目下已作讨论（Brock 2003; Broome 2004）[^brock-2003][^broome-2004]。下文可以忽略这些复杂之处，按本文献通常的做法，把有效性问题收窄为一个标准：直接受益能力（capacity to benefit directly）。
