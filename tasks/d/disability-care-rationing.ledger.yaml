      There are two perspectives in which these intuitions can be tested: at the level of individual, head-to-head allocation contests and at the level of social policies or strategies about health care allocation across the population. In the first case we presume a head-to-head comparison between a person with and another without a disability, both of whom require the medical treatment or resource that, for whatever reason, can only be available to one of them. We will have occasion below to question the philosophical value of head-to-head allocation scenarios, but there is no doubt they have emotional power and put the impact of disability into stark relief. Interestingly, although the impact of disability on rationing was initially raised legally in terms of rationing policy (the Oregon rationing experiment mentioned above), despite creative legal academic discussions (Garvey 1992; Peters 1995; Orentlicher 1996; and Crossley 2000)[^crossley-2000][^garvey-1992][^orentlicher-1996][^peters-1995], United States courts were reluctant to move from the individual case to the policy level in the rationing debate because they were impressed by the argument that prioritization of health resources was simply unavoidable and so not discriminatory as a general policy. We return to this point below in the context of human rights and the impact of disability.
    step1: |-
            检验这些直觉有两条视角：个体层面正面对决的分配竞争，以及关于全人口医疗分配的社会政策或策略层面。在第一种情形，我们设想一位失能者与一位非失能者之间的正面比较，二者都需要同一医疗治疗或资源，而该资源因某种原因只能给其中一人。下文我们会质疑这种正面对决分配情境的哲学价值，但无疑它们具有情感力量，并把失能的影响置于刺眼的聚光灯下。有趣的是，尽管失能对配给的影响最初是以配给政策的法律形式（上文提到的俄勒冈配给实验）提出的，而且有富有创造性的法学讨论（Garvey 1992; Peters 1995; Orentlicher 1996; Crossley 2000）[^crossley-2000][^garvey-1992][^orentlicher-1996][^peters-1995]，美国法院却不愿在配给争论中从个案层面上升到政策层面，因为它们被这样一条论证打动：医疗资源的优先排序根本不可避免，故作为一般政策并不构成歧视。此点下文在人权与失能影响的语境中再议。
