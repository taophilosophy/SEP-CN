      Francis Kamm has relied almost exclusively on individual head-to-head examples such as these to explore intuitions about the ethical significance of disability in allocation decisions (Kamm 1993, 2004, 2009a and b)[^kamm-1993]. Although her examples are vivid and the discussions often ethically illuminating, at the end of the day, one is left with the sense that relying on our intuitions about these scenarios (and their infinite variations) is a troublingly and indeterminate exercise. The unrealistic simplicity of the cases might create skepticism about how the debate has been framed. Surely, no health care decision, at the individual level, would ever be this stark and devoid of uncertainties. We are never completely sure whether our treatments will improve functioning, even save lives, or whether unintended side effects will end up making the outcome worse. In addition, measuring benefit in terms of QALYs is not an exact science, and the measurement of cost is extremely difficult, especially if, in addition to the direct costs from the provision of the resource, we add indirect costs and opportunity costs. Although the method of testing our intuitions on artificial scenarios, making increasingly nuanced changes in the case to highlight salient considerations, is philosophical illuminating, it may arguably be somewhat artificial.
    step1: |-
      弗朗西斯·卡姆（Francis Kamm）几乎仅凭此类个体层面的正面比较案例，探讨失能在分配决策中的伦理意义所引发的直觉（Kamm 1993, 2004, 2009a and b）[^kamm-1993]。其案例生动，讨论亦常在伦理上富有启发，但归根结底，人会觉得依靠我们对这些场景（及其无穷变体）的直觉，乃是一项令人不安且得不出定论的工作。案例不切实际的简单性，或使人怀疑争论的框架本身。个体层面的医疗决策，当然从不会如此干脆，也从不会没有不确定性。我们从来不能完全确定：治疗是否会改善功能、甚至挽救生命，或意外副作用是否终将把结局弄得更好。此外，以 QALY 衡量收益并非精确科学，成本衡量亦极其困难，尤其在资源供给的直接成本之外再加间接成本与机会成本之时。把直觉放到人为场景上检验、并在案例中作出日益细致的改动以凸显关键考量，这一方法固然有哲学启发，却也可以说有些人为。
    step2: |-
      弗朗西斯·卡姆（Francis Kamm）几乎只依靠这类个体层面的正面比较例子，来探讨失能在分配决策中的伦理意义所引发的直觉（Kamm 1993, 2004, 2009a and b）[^kamm-1993]。她的例子很生动，讨论也常常在伦理上富有启发，但归根到底，人会感到：依靠我们对这些场景（以及它们无穷无尽的变体）的直觉，是一项令人不安、又得不出确定结论的工作。案例那种不现实的简单化，可能会让人怀疑这场争论的框架本身。个体层面的医疗决策，肯定从来不会如此干脆，也从来不会没有不确定性。我们从来不能完全确定：治疗会不会改善功能，甚至能不能保住性命；或者意外的副作用会不会反而让结果更糟。此外，用 QALY 衡量收益并不是一门精确的科学，成本的衡量也极其困难——尤其是当我们除了资源供给的直接成本之外，再加上间接成本和机会成本的时候。把直觉放到人为构造的场景上检验，并在案例中不断作更细致的改动以凸显关键考量，这一方法固然有哲学上的启发，但也可以说有些做作。
