    source: |-
      In the 1990s philosophers, in particular bioethicists, debated the broad question of the justice of health care resource allocation, and in particular the ethical pros and cons of the dominant rationing strategy based on cost effectiveness analysis (CEA) with benefit characterized in terms of “quality of life”. A dominant theme in this literature was whether a pre-existing health state, or resulting health outcome, should be taken into account when allocating health resources. More specifically, the debate centered on whether a person’s disability should be taken into account, or whether doing so would be discriminatory or unfair. As Dan Brock explained it, this concern was raised because of the confluence of two events—the then recent (1990) passage of the *Americans with Disabilities Act* (ADA), prohibiting discrimination on the basis of disability, and the 1992 Oregon Medicaid proposal for rationing services, which used both CEA and a quality of life outcome measure to prioritize treatments for persons with specific health conditions and which arguably systematically disadvantaged people with pre-existing disabilities (Brock 1995, 1999, 2004)[^brock-1995].
    step1: |-
            1990 年代，哲学家、尤其是生命伦理学家就医疗资源分配的正义性这一宽泛问题展开了争论，特别是围绕以成本效果分析（CEA）为基础、以“生活质量”刻画收益的主流配给策略的伦理利弊。这一文献的主导论题是：在分配医疗资源时，是否应当考虑既存的健康状况或由此产生的健康结局。更具体地说，争论集中在：一个人的失能是否应被纳入考量，抑或这样做会构成歧视或不公。正如 Dan Brock 所解释的，这一关切之所以被提出，是因为两件事的汇合：一是当时新近（1990 年）通过的《美国残疾人法》（ADA）禁止基于失能的歧视；二是 1992 年俄勒冈州医疗补助（Medicaid）的配给服务提案，该提案同时使用 CEA 与一种生活质量结局指标来为特定健康状况者的治疗排定优先次序，而可以说系统性地不利于有既存失能的人（Brock 1995, 1999, 2004）[^brock-1995]。
    step2: |-
      1990 年代，哲学家——尤其是生命伦理学家——围绕医疗资源分配的正义性展开了广泛争论，焦点是以成本效果分析（CEA）为基础、用“生活质量”来刻画收益的主流配给策略在伦理上有何利弊。这一文献的核心问题是：分配医疗资源时，是否应当考虑既存的健康状况或由此产生的健康结局；更具体地说，争论集中在个人的失能是否应纳入考量，还是说这样做构成歧视或不公。据丹·布罗克（Dan Brock）解释，这一关切之所以被提出，源于两件事的汇合：一是当时新近（1990 年）通过的《美国残疾人法》（ADA），禁止基于失能的歧视；二是 1992 年俄勒冈州医疗补助（Medicaid）的配给服务提案——该提案同时使用 CEA 和一种生活质量结局指标，为有特定健康状况者的治疗排定优先，而可以说系统性地不利于有既存失能的人（Brock 1995, 1999, 2004）[^brock-1995]。
  - id: 2
    kind: body
    source: |-
      The ethics of health care allocation or rationing raises a raft of issues that are not directly dependent on the potential discriminatory impact on persons with disabilities. Yet, since it is difficult to clearly separate the general ethical issues from those raised by the focus on disability, we begin in Section 1 by surveying, first, general ethical concerns in health care rationing, and then the specific issues raised by CEA and quality of life as a metric of the “benefit” that health care resources provide. We then turn in Section 2 to review why it has been argued that disability poses a special set of ethical issues in health care rationing. The ethical issues of health resource rationing (or “prioritization” as it is sometimes called) can be exemplified either at the individual level of specific allocation decisions “at the bedside”, or more generally as a social policy of health care rationing. The ethical issues at the individual level are reviewed in Section 2, and social policy issues are considered in Section 3, including whether it makes any difference if access to health care is viewed as a human right. We conclude in Section 4 with the unsatisfactory result that we remain in a dilemma: refusing to consider disability in health care allocation seems irrational and unfair, but taking disability into account raises a range of, apparently, irresolvable philosophical issues.
    step1: |-
            医疗资源分配或配给的伦理涉及一大串问题，它们并不直接取决于对失能者可能造成的歧视性影响。然而，既然很难把一般伦理问题与聚焦失能所引出的问题清楚分开，我们在第 1 节先综述医疗配给中的一般伦理关切，再讨论以 CEA 与生活质量作为“收益”度量所引出的具体问题。随后在第 2 节回顾：为何有人论证失能在医疗配给中带来一组特殊的伦理问题。医疗资源配给（有时也称“优先排序”）的伦理问题，既可以在“床边”具体分配决策的个体层面示例，也可以更一般地作为医疗配给的社会政策示例。个体层面的伦理问题在第 2 节评述，社会政策问题在第 3 节讨论，其中包括：把医疗服务可及性视为一项人权是否会有任何不同。第 4 节以不令人满意的结论收尾：我们仍陷于两难——拒绝在医疗分配中考量失能似乎不理性且不公，但把失能计入考量又引出一系列显然无解的哲学问题。
    step2: |-
      医疗资源分配或配给涉及的伦理问题一大串，它们并不直接取决于对失能者可能的歧视性影响。但一般伦理问题与聚焦失能所引出的问题既难清楚分开，第 1 节就先综述医疗配给的一般伦理关切，再讨论以 CEA 与生活质量来度量“收益”所引出的具体问题；第 2 节回顾为什么有人主张失能在医疗配给中带来一组特殊的伦理问题。医疗资源配给（有时也称“优先排序”）的伦理问题，既可以在“床边”具体分配决策的个体层面示例，也可以更一般地作为社会政策来示例。个体层面的伦理问题在第 2 节评述，社会政策问题在第 3 节讨论，其中包括把医疗服务可及性视为人权是否有所不同。第 4 节以一个不令人满意的结论收尾：我们仍陷在两难之中——拒绝在医疗分配中考量失能，似乎既不理性也不公平；把失能计入考量，却又引出一系列显然无解的哲学问题。
