      Against this it might be argued that whether or not a person with a disability is in an epistemically-privileged position concerning the experience of disability, this privilege need not extend to an objective assessment of the actual physical and other burdens of living with the disability (Brock 1995)[^brock-1995]. Quite the contrary, because of the psychological dynamics of adaptation and adjustment, especially after a traumatic injury, a person with a disability may well be in a worse position to assess his or her life objectively. Once adjusted, the disabled person may grossly overestimate the value of living with the disability, which, while perhaps not a bad thing, in this context has the effect of distorting the individual’s health and social needs (Murray 1996; Menzel et al. 2002)[^menzel-2002][^murray-1996].
    step1: |-
      对此可反驳说：无论失能者在失能体验上是否处于认识论上的优越位置，这种优越都不必延伸到对带失能生活的实际身体负担及其他负担的客观评估（Brock 1995）[^brock-1995]。恰恰相反，由于适应与调适的心理机制——尤其在创伤性损伤之后——失能者评估自己生活是否客观，位置可能反而更差。一旦调适完成，失能者可能大幅高估带失能生活的价值；这也许不是坏事，但在本语境中，其效果是扭曲了个人的健康与社会需要（Murray 1996; Menzel et al. 2002）[^menzel-2002][^murray-1996]。
