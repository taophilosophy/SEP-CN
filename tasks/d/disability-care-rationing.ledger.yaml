      Searching for an egalitarian allocation principle that might avoid the dilemma, some philosophers have gone back to the priority problem mentioned above and noted that, depending on the severity of the disability, a person with disabilities may have a greater need for health resources than a non-disabled individual, or that the health resource may have a more profound impact on securing equality of opportunity for the disabled person. Making the case for allocation in terms of who is “worst off” reflects the version of egalitarianism called prioritarianism (see Parfit 1997; Arneson 2000)[^arneson-2000][^parfit-1997] in which the distribution of a resource is guided by the intuition that the worst off have more to gain and should be given priority, not, like in the utilitarian approach in terms of great welfare benefit, but because of greater need.
