      The Oregon prioritization scheme based its QALY evaluations on a general resident’s survey in order, it was claimed, to capture “community values”. But why should these values determine which treatments are funded, since (as was demonstrable in the actual rankings that resulted) these values may reflect cultural or racial biases or just profound misunderstandings about health problems and what it is like to live with a disability (Asch 2001; Doyal 1998)[^asch-2001][^doyal-1998]? On the other hand, it is the public who pays for these health resources so why should some group of elites, however knowledgeable, pre-empt majoritarian decisions (Brock 2002)[^brock-2002]?
    step1: |-
            俄勒冈的优先排序方案把 QALY 评估建立在普通居民调查之上，据称是为了捕捉“社群价值”。但这些价值凭什么决定哪些治疗获得资助？因为（如实际得出的排名所明示）这些价值可能反映文化或种族偏见，或只是对健康问题、以及对带着失能生活是什么样子有深刻误解（Asch 2001; Doyal 1998）[^asch-2001][^doyal-1998]。另一方面，支付这些医疗资源的正是公众，那么凭什么让某一群精英——无论多么博学——抢先作出多数人的决定（Brock 2002）[^brock-2002]？
