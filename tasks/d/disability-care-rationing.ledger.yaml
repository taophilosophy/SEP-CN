  - id: 4
    kind: body
    source: |-
      ### 1.1 Rationing health resources
    step1: |-
            ### 1.1 配给医疗资源
    step2: |-
      ### 1.1 配给医疗资源
  - id: 5
    kind: body
    source: |-
      What are the principal ethical concerns involved in how we allocate scarce medical resources to people who can benefit from them? Health care resources (broadly construed to include treatments or interventions, medications, medical and rehabilitative devices, health care services and service providers, health care systems, clinics and other settings, and so on) are by their nature scarce resources. They are scarce both as a consequence of societal, macro-allocative decisions about how much social resources are put into health care (rather than, say, into education, scientific research or fighting foreign wars), and because some of these resources, such as transplantable organs, are intrinsically scarce.
    step1: |-
            在我们把稀缺医疗资源分配给能够从中获益者时，涉及哪些主要的伦理关切？医疗资源（广义包括治疗或干预、药物、医疗与康复器械、医疗服务与服务提供者、医疗系统、诊所及其他场景等）按其本性即是稀缺资源。其稀缺既源于关于把多少社会资源投入医疗（而非投入教育、科研或对外战争）的社会性宏观分配决策，也因为这些资源中有些（如可移植器官）内在稀缺。
    step2: |-
      把稀缺的医疗资源分配给能从中获益的人，涉及哪些主要伦理关切？医疗资源（广义上包括治疗或干预、药物、医疗与康复器械、服务与提供者、医疗系统、诊所等）按其本性就是稀缺资源。它之稀缺，既因为社会要在宏观上决定把多少资源投入医疗（而不是投入教育、科研或对外战争），也因为其中有些资源（如可移植器官）本身就有内在的稀缺。
  - id: 6
    kind: body
    source: |-
      Scarcity entails that health resource demands will always overwhelm supply, which in turn entails that some method of constrained allocation must take place. Rationing is the generic name for this and it comes in many forms: implicit or explicit, case-by-case or systematic, rational and fair or the opposite, overt, transparent and professionally-sanctioned, or hidden, unexamined and rationalized as something other than rationing. The key point is that rationing is unavoidable and always occurs. As health economists insist, since rationing of health care resources is inevitable, best it be open, transparently justified and understandable, based on good evidence and argument (Ubel 2000)[^ubel-2000]. The ethicist agrees, but adds the consideration of fairness.
    step1: |-
            稀缺意味着医疗资源需求总会压倒供给，这又意味着必定发生某种受约束的分配。配给（rationing）是这一点的通称，且形态繁多：隐性的或显性的，逐案的或系统化的，理性公平的或其反面，公开、透明且经专业认可的，或隐藏、未经审视而被合理化为配给之外别的什么。要点在于：配给不可避免且总在发生。正如卫生经济学家所坚持的，既然医疗资源配给不可避免，最好让它公开、有可透明辩护的理由且可理解，并建立在良好证据与论证之上（Ubel 2000）[^ubel-2000]。伦理学家同意这一点，但补充了公平这一考量。
    step2: |-
      稀缺意味着医疗资源的需求总会压倒供给，所以必然发生某种受约束的分配。配给（rationing）就是这类分配的统称，形态繁多：或者隐性，或者显性；或者逐案处理，或者系统化；或者理性公平，或者恰恰相反；或者公开透明并获专业认可，或者被隐藏起来，未经审视就合理化成“配给之外的东西”。要点在于：配给不可避免，而且总在发生。卫生经济学家因此坚持，既然配给不可避免，最好让它公开、有可透明辩护的理由、可以理解，并且建立在良好证据与论证之上（Ubel 2000）[^ubel-2000]。伦理学家同意这一点，但要补上公平这一考量。
  - id: 7
    kind: body
    source: |-
      A persuasive criterion of rationality in rationing is efficiency: since supply is not infinite we must ensure that every allocated resource is used to achieve the maximum benefit it can provide. While in some domains the nature of a “benefit” is controversial, here it is obvious: health resources produce health benefits, either incremental improvements in health or the prevention of worsening health and premature death. Understanding death (or premature death) as the worst health outcome, life-saving or life-prolonging is (usually) a clear health benefit. But so is improving bodily functioning, mitigating or ameliorating functional problems or preventing functional decline. Although death is not preventable, disease, injuries, and other challenges to an individual’s health can either be prevented or their impact lessened, either indefinitely or for some period of time. Health outcomes, in short, are either quantitative (number of years lost to a health challenge) or qualitative (extent of functioning lost).
    step1: |-
            配给中一个颇具说服力的理性判准是效率：既然供给并非无限，我们就必须确保每一份已分配的资源都被用来取得它所能提供的最大收益。在某些领域“收益”的性质尚有争议，但在此处它显而易见：医疗资源产生健康收益，或使健康有增量改善，或防止健康恶化与过早死亡。把死亡（或过早死亡）理解为最坏的健康结局，那么救命或延长生命（通常）就是明确的健康收益。但改善身体功能、缓解或减轻功能问题、防止功能衰退，同样是健康收益。死亡虽不可防，但疾病、损伤及其他对个人健康的挑战，或可预防，或其影响可被减轻，或无限期或一段时间。简言之，健康结局或是量化的（因健康挑战而损失的寿命年数），或是质性的（功能丧失的程度）。
    step2: |-
      配给中一个颇具说服力的理性判准是效率：供给既然不是无限的，就必须确保每一份已分配的资源都取得它所能提供的最大收益。在某些领域，“收益”是什么还有争议，这里却显而易见——医疗资源产生的是健康收益：或者是健康的增量改善，或者是防止健康恶化与过早死亡。如果把死亡（或过早死亡）当作最坏的健康结局，那么救命或延长生命（通常）就是明确的健康收益；改善身体功能、缓解或减轻功能问题、防止功能衰退，同样是健康收益。死亡虽然无法防止，疾病、损伤及其他健康挑战却可以预防，或其影响可以被减轻——无限期地，或在一段时间内。简言之，健康结局或者可以量化（因健康挑战而损失的寿命年数），或者可以定性（功能丧失的程度）。
  - id: 8
    kind: body
    source: |-
      If we define a “health need” as any decrement in health (either years to live or a less-than-optimal level of bodily functioning), health resource efficiency is a matter of using health resources to minimize ill-health in a manner that does not waste health care resources. In the case of a single individual, there is no issue: give the person the resources he or she actually requires and nothing more. But resource allocation is only an issue when there is more than one claimant to the same, scarce, resource. Resource allocation is a problem of fairness across populations. This leads us to the question of distributional fairness where, as we shall see below, there are various competing options besides CEA. At first glance, however, the general efficiency requirement that scarce health resources be used to maximize benefit or minimize need seems strongly intuitive.
    step1: |-
            如果我们把“健康需要”界定为健康的任何减损（或可活年数，或低于最佳水平的身体功能），那么医疗资源效率就是用医疗资源以不浪费的方式把不健康降到最低。就单个个人而言没有问题：给此人他或她实际所需，不多给。但资源分配只在同一稀缺资源有不止一个索求者时才成问题。资源分配是一个跨人群的公平问题。这引向分配公平问题；如下文所见，除 CEA 之外还有多种相互竞争的选项。然而初看之下，“稀缺医疗资源须用于最大化收益或最小化需要”这一一般效率要求似乎具有很强的直觉力量。
    step2: |-
      如果把“健康需要”界定为健康的任何减损（或者可活的年数，或者低于最佳状态的身体功能），医疗资源的效率就是以不浪费的方式把不健康降到最低。单个个人身上并无问题：给他或她实际所需，不多给。资源分配只在同一稀缺资源有不止一个索求者时才成问题——它是跨人群的公平问题。这就引向分配公平；下文将会看到，除 CEA 之外还有多种竞争选项。不过初看之下，“稀缺医疗资源必须用于最大化收益或最小化需要”这一效率要求，似乎颇有直觉上的说服力。
  - id: 9
    kind: body
    source: |-
      The intuitive plausibility of the efficiency requirement is the motivation for the rationing strategy based on cost-effectiveness analysis (CEA). The health resource is a cost, the health improvement a benefit, and intuitively we should try to get as much benefit from the cost as possible. Alternatively put, CEA mandates that the lower the cost per unit of health improvement the more effective the use of the associated health resource. Although this strategy can in principle be applied to health resource usage at the individual level, CEA, reflecting its intellectual heritage as a form of utilitarianism, is standardly viewed as a societal strategy in which costs and benefits are aggregated over the population.
    step1: |-
            效率要求这种直觉上的可信性，正是以成本效果分析（CEA）为基础的配给策略之动机。医疗资源是成本，健康改善是收益，直觉上我们应尽量从成本中取得更多收益。换个说法，CEA 要求每单位健康改善的成本越低，相关医疗资源的使用就越有效。这一策略原则上可施于个体层面的医疗资源使用，但 CEA 承袭功利主义的智识遗产，通常被视为一种社会性策略，其中成本与收益在人口总体上被加总。
    step2: |-
      效率要求在直觉上的可信性，正是以成本效果分析（CEA）为基础的配给策略的动机：医疗资源是成本，健康改善是收益，直觉上应当尽量从成本中多取收益。换句话说，CEA 要求每单位健康改善的成本越低，相关资源的使用就越有效。这一策略原则上也可以施于个体层面，但 CEA 既继承了功利主义的智识遗产，通常被视为一种社会性策略——成本与收益在人口总体上加总计算。
  - id: 10
    kind: body
    source: |-
      In practice, though, cost-effectiveness analysis in health care allocation faces a substantial methodological hurdle: there is a vast array of incommensurable health improvements—lowering pain levels in arthritis, improving muscle strength or respiration efficiency, controlling high blood pressure, adding a year to life, postponing the onset of dementia. Since CEA requires health improvements to be comparable between individuals and across the population, an underlying health improvement metric—what statisticians call a “latent trait”—needs to be identified that is (at least) ordinal and comparable, if not precisely measurable. We need to identify, in short, what every health improvement shares in common. That is the measure of a health improvement, and the benefit that factors into the CEA calculation.
    step1: |-
            然而在实践中，医疗分配中的成本效果分析面临一道实质性的方法论难关：健康改善种类繁多而不可通约——降低关节炎的疼痛程度、改善肌力或呼吸效率、控制高血压、延长一年寿命、推迟痴呆发作。既然 CEA 要求健康改善在个体之间与人群之中可比，就必须找出一个底层的健康改善度量——统计学家称之为“潜在特质”——它至少是序数的、可比的，纵非精确可测。简言之，我们需要找出一切健康改善共同具有的东西。那就是健康改善的度量，也就是进入 CEA 计算的收益。
    step2: |-
      在实践中，医疗分配的成本效果分析面临一道实质性的方法论难关。健康改善种类繁多而且不可通约——或者降低关节炎疼痛，或者改善肌力与呼吸效率，或者控制高血压，或者延寿一年，或者推迟痴呆发作。CEA 既然要求健康改善在个体之间、人群之间可比，就必须找出一个底层度量——统计学家称之为“潜在特质”——它至少能作序数比较，哪怕不能精确测量。简言之，必须找出一切健康改善所共有的东西：那就是健康改善的度量，也就是进入 CEA 计算的收益。
  - id: 11
    kind: body
    source: |-
      The most commonly used metric is called “quality of life”—every health improvement, whatever else it accomplishes, incrementally improves the individual’s quality of life. Given that a health improvement is potentially either quantitative or qualitative (extending life or improving life), it is necessary to bring these two facets into a single measure (called, generically, a summary health measure). A common way of doing this is in terms of the econometric concept of quality-adjusted life year or QALY. Every health improvement produces a health state with an expected longevity (the number of years left to live) and level of functioning (the quality of living in that health state). These can be metrically joined into a single score by using the common metric of years lives and discounting the value of a year lived in a particular health state by the quality of life value of living in that state. If full health is represented by the value of 1, death by 0, then the quality of life values of all possible states of health a human can experience can be assigned a number between 1 and 0, and that number determines the quality of life impact of the health state on a person, in terms of some proportion of a full life year. The values for each state can be generated by a population ranking exercise (as was done in the Oregon example), by expert consensus, or by means of a variety of econometric “preference elicitation techniques” such as “standard gamble”, “willingness to pay” or “person trade off” (see Nord 1999 for the details of these techniques in the health domain)[^nord-1999].
    step1: |-
            最常用的度量叫“生活质量”——每一项健康改善，无论还成就了什么，都增量地提升了个人生活质量。既然健康改善可能是量化的或质性的（延长生命或改善生命），就必须把这两面并入单一度量（通称汇总健康度量）。一种常见的做法是借助质量调整生命年即 QALY 这一计量经济学概念。每项健康改善都产生一个健康状态，具有预期寿命（余下可活年数）与功能水平（在该健康状态中生活的质量）。二者可用“寿命年”这一共同度量合并为单一分数，办法是按在该状态中生活的生命质量值对在该状态中活一年的价值加以折扣。若以数值 1 表示完全健康、以 0 表示死亡，则人可能经验的一切健康状态的生命质量值都可赋予 1 与 0 之间的一个数字，该数字按某个完整生命年的比例决定了健康状态对一个人生活质量的影响。各状态的值可以通过人群排序练习生成（如俄勒冈之例所做）、通过专家共识生成，或借助多种计量经济学“偏好引出技术”生成，如“标准博弈”“支付意愿”或“人员取舍”（这些技术在健康领域的细节见 Nord 1999）[^nord-1999]。
