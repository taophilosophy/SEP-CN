    source: |-
      Currently, the dilemma posed by whether, and how, disability should be taken into account for health allocation remains unsolved, although it frequently appears in the distributive justice literature as a test case for some variant of egalitarianism or a refined version of CEA. Even if the dilemma is resolved, additional problems arise. If we decide that disability is always a relevant allocation consideration, then on the way to tackling the larger question of what the impact of disability should be the question of comparability of varieties of disability looms larger. It has recently been suggested that the so-called “indexing problem” created by the incommensurable components of human disadvantage (Woff and De-Shalit 2007), which prevents any meaningful comparison between people experiencing very different forms of social disadvantage is compounded when trying to compare people with different disabilities. Comparing lower body paralysis with deafness is hard enough, but two people both of whom are paraplegic may experience it in vastly different ways depending on the availability of wheelchairs and accommodations such as accessible public buildings (Riddle 2014)[^riddle-2014]. If we decide that disability should never matter, then it is difficult to see why any consideration of either cost or benefit, unrelated to disability, could also be justified. If so, then the only survivable allocation procedure would be random allocation, which is highly counter-intuitive as a solution to head-to-head individual allocation decisions, let alone a general allocation policy.
    step1: |-
      目前，失能是否应当在医疗分配中被纳入考量、以及如何纳入，这一两难仍未解决；不过它频繁出现在分配正义文献中，作为检验某种平等主义变体或精细化 CEA 的测试案例。即便两难得以化解，还有别的问题冒出来。如果我们判定失能始终是相关的分配考量，那么在着手处理“失能的影响应当为何”这一更大问题的路上，各类失能之间的可比较性问题会愈发突出。近来有人指出，人类不利处境各成分不可通约所造成的所谓“标引问题”（Woff and De-Shalit 2007），本就使经历极为不同社会不利处境的人之间无法作有意义的比较；在试图比较有不同失能的人时，这一问题更加严重。把下肢瘫痪与失聪相比较已经够难，但两个同为截瘫的人，其体验可能因轮椅与无障碍公共建筑等便利之有无而大相径庭（Riddle 2014）[^riddle-2014]。如果我们判定失能永远不应要紧，那就很难看出，任何与失能无关的成本或收益考量又如何能站得住。若真如此，唯一还能存活的分配程序就是随机分配——作为个体间正面分配决策的解决办法，这已极违直觉，更不用说作为一般分配政策了。
