      One of the most robust defenses of how the CEA approach deals with disability comes in the form of Michael Stein’s general defense of utilitarianism against forms of resource egalitarianism (Stein 2006)[^stein-2006]. Stein argues that only utilitarianism, by relying on the greater benefit criterion of distributive justice, can handle our intuitions about disability when it comes to health care allocation. He acknowledges that disability is conceptually related to ill-health or functional decrement (impairment), and, as a utilitarian takes that to mean that disability also reduces welfare—and proportionately: the more severe the disability, the greater the welfare loss. Because of this relationship, he argues that the utilitarian can precisely determine—in welfare terms—the impact of a health benefit and this makes utilitarianism, overall, a far better decision-making method for health care allocations. Unfortunately, on his own utilitarian terms, Stein’s argument is flawed. For, as we have said, as long as welfare is a subjective notion, there is no reason to think that there is a strict correlation between health and welfare deficit. Moreover, for a utilitarian consequentialist, there is no *a priori* reason to think that a person without a disability always experiences less welfare benefit than a person with disability—since there are domains other than health that impact welfare. On the other hand, if we are concerned about maximizing welfare, rather than health, then we need to take into account all consequential welfare advances that are linked to health improvements (opportunity to develop talents, better job prospects, or a more stable family life) and once that door is open, there is no reason to think that disability will matter since these benefits may, overall, greatly overwhelm the negative impact of disability (Bickenbach 2008)[^bickenbach-2008].
    step1: |-
      对 CEA 进路处理失能方式的最有力辩护之一，是 Michael Stein 针对各种资源平等主义所作的功利主义一般辩护（Stein 2006）[^stein-2006]。Stein 论证，只有功利主义凭借分配正义的更大收益标准，才能处理我们关于失能在医疗分配上的直觉。他承认失能在概念上与健康不佳或功能缺损（损伤）相关，并作为功利主义者认为这意味着失能也降低福利——且成比例：失能越严重，福利损失越大。正因这一关系，他论证功利主义者能（以福利术语）精确确定一项健康收益的影响，这使功利主义总体上成为远为更好的医疗分配决策方法。不幸的是，按 Stein 自己的功利主义标准，其论证有缺陷。因为如我们所说，只要福利是主观概念，就没有理由认为健康与福利亏缺之间存在严格相关。而且，对功利主义后果论者而言，也没有 *a priori* 理由认为无失能者总比失能者得到更少福利收益——因为影响福利的领域不止健康。另一方面，若我们关心的是最大化福利而非健康，便须把与健康改善相关的全部后果性福利进展（发展才能的机会、更好的就业前景、更稳定的家庭生活）纳入考量；而一旦打开这扇门，就没有理由认为失能还有何要紧，因为这些收益总体上可能大大盖过失能的负面影响（Bickenbach 2008）[^bickenbach-2008]。
    step2: |-
      为 CEA 处理失能方式作的最有力辩护之一，是迈克尔·斯坦（Michael Stein）对功利主义的总体辩护，用以对抗各种资源平等主义（Stein 2006）[^stein-2006]。斯坦论证，只有功利主义依靠分配正义的更大收益标准，才能在医疗分配上处理我们关于失能的直觉。他承认失能在概念上与健康不佳或功能缺损（损伤）相关，并作为功利主义者认为这意味着失能也降低福利——而且是成比例的：失能越严重，福利损失越大。正因为这一关系，他论证功利主义者能（以福利术语）精确确定一项健康收益的影响，这使功利主义总体上是远为更好的医疗分配决策方法。遗憾的是，按斯坦自己的功利主义标准，其论证是有缺陷的。因为如我们所说，只要福利是主观概念，就没有理由认为健康与福利亏缺之间存在严格相关。而且，对功利主义后果论者而言，也没有 *a priori* 理由认为无失能者总是比失能者获得更少福利收益——因为除健康之外还有别的领域影响福利。另一方面，如果我们关心的是最大化福利而非健康，就必须把与健康改善相关的全部后果性福利进展（发展才能的机会、更好的就业前景，或更稳定的家庭生活）纳入考量；而一旦打开这扇门，就没有理由认为失能还会有什么要紧，因为这些收益总体上可能大大盖过失能的负面影响（Bickenbach 2008）[^bickenbach-2008]。
