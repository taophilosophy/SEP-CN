      Since CEA weighs benefits against costs, it is natural to ask whether benefits should be restricted to health benefits alone, or should include other, more indirect benefits such as the economic benefit to the individual from returning to work or the financial benefits to employers from reducing lost work time due to employee illness (Brock 2003)[^brock-2003]. Economists would favor the broader conception of benefit since it provides a better calculation of the societal value of a health care prioritization scheme. More finely-gained benefit assessment would also allow us to make more ethically sensitive judgments about where money should be spent: e.g., it would be ethically justifiable to favor the health of mothers of children who need their care. On the other side, not only is it extremely difficult to quantify these benefits, it has also been argued that it is unfair to prioritize health care resources to favor patients whose improved health has greater indirect benefits to themselves or society since that is to treat people and their health as means to social ends. Economic or other benefits and health improvements are in “separate spheres” and merging them will make our health prioritization strategy both ethically compromised, and practically unworkable (Brock 2003)[^brock-2003].
    step1: |-
            既然 CEA 把收益与成本相权衡，自然要问：收益是否应限于健康收益，还是也应包括其他更间接的收益，例如个人重返工作带来的经济收益，或减少雇员病假工时给雇主带来的财务收益（Brock 2003）[^brock-2003]。经济学家会偏好更宽的收益概念，因为它能更好地计算医疗优先排序方案的社会价值。更精细的收益评估还使我们能作出在伦理上更敏感的支出判断：例如，偏向需要其照护的孩子的母亲们的健康，在伦理上是可辩护的。另一方面，不仅这些收益极难量化，而且有人论证：把医疗资源偏向那些健康改善对其自身或社会有更大间接收益的病人是不公平的，因为那是把人及其健康当作达成社会目的的手段。经济或其他收益与健康改善处于“分离的领域”，把它们合并会使我们的医疗优先排序策略在伦理上受损，在实践中也不可行（Brock 2003）[^brock-2003]。
    step2: |-
      CEA 既然权衡收益与成本，便自然要问：收益应当限于健康收益，还是也应包含更间接的收益——比如个人重返工作的经济收益，或减少雇员病假给雇主带来的财务收益（Brock 2003）[^brock-2003]？经济学家会偏好更宽的收益概念，因为它能更好地计算优先排序方案的社会价值；更精细的评估也使伦理上更敏感的支出判断成为可能：例如把资源偏向需要其照护的孩子的母亲们的健康，这在伦理上可辩护。另一方面，这些收益极难量化；而且有人论证，把资源偏向“健康改善对自身或社会有更大间接收益”的人并不公平，因为那是把人及其健康当作达成社会目的的手段。经济与其他收益、健康改善各处于“分离的领域”，合并二者将使优先排序策略既在伦理上受损，又在实践上不可行（Brock 2003）[^brock-2003]。
