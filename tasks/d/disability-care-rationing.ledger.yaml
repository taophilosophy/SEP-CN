      The QALY metric, however, is problematic for another reason. When evaluators are asked to rank the impact of a disability on quality of life they are asked to consider the overall “burden” of living with that decrement in health or functioning. Undoubtedly, part of that burden is the result of the social stigma, discrimination and lack of opportunities that characterizes the disabled life, in all cultures. People with disabilities typically have as a group the lowest employment and education participation rates of any sub-population (WHO 2011, Chapter 8)[^who-2011], a fact that profoundly affects their quality of life, but which has as much to do with failed policy to combat stigma and lack of accommodation as it does with the underlying health condition. Yet the fact that the burden of living with a disability is caused as much by the social environment suggests that the QALY metric, even if it accurately describes the burden of disability, is unfair as a basis for resource allocation (Wasserman, Asch, Bickenbach 2008)[^bickenbach-2008]. In effect we are saying to the person with a disability that because stigma and failed policy make your life less valuable, we are not going to improve your life by giving you access to needed resources.
    step1: |-
      然而，QALY 度量还因另一理由而问题重重。当评估者被要求对失能于生活质量的影响排序时，他们被要求考虑带着那种健康或功能缺损生活的总体“负担”。毫无疑问，这种负担有一部分来自社会污名、歧视与机会匮乏——所有文化中的失能生活皆以之为特征。作为群体，失能者的就业与教育参与率通常在所有亚人群中最低（WHO 2011, Chapter 8）[^who-2011]，这一事实深刻影响其生活质量，但它既同未能对抗污名、缺乏无障碍便利的失败政策有关，也同样同底层健康状况有关。然而，带失能生活的负担如此大程度地由社会环境造成，这一事实表明：QALY 度量即便准确描述了失能的负担，作为资源分配的基础也不公平（Wasserman, Asch, Bickenbach 2008）[^bickenbach-2008]。实际上，我们等于在对失能者说：既然污名与失败的政策使你的生命价值更低，我们就不打算让你获得所需资源来改善生活。
