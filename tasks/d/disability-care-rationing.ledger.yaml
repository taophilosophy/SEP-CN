      Although Asch and others are certainly not attacking a straw person position, the response might be that there is an empirical basis for the claim that disability adversely affects the capacity to benefit from a health resource, namely the evidence that people with disabilities tend to enjoy less quality of life improvement from these resources than those without disabilities. The strength of this rejoinder, however, depends very much on what is meant by “quality of life”. If understood as a subjective assessment or evaluation of one’s life—now more often called “subjective well-being” (Kahneman, Diener & Schwarz 1999)—then there is good empirical evidence that disability **does not** negatively affect capacity to benefit. People with disabilities tend to be happier, and assess their lives to be of considerably higher value than would be objectively assumed—a phenomenon called the “disability paradox” (Albrecht & Devlieger 1999)[^albrecht-1999].
    step1: |-
      Asch 等人的批评当然不是在打稻草人；但回应者可以说，失能不利于从医疗资源中受益这一主张有经验依据，即证据表明失能者从这些资源获得的生活质量改善往往少于无失能者。然而，这一反驳的分量很大程度上取决于“生活质量”所指为何。若把它理解为主观评估或对自身生活的评价——如今更多称为“主观幸福”（Kahneman, Diener & Schwarz 1999）——则有充分经验证据表明，失能 **并不** 对受益能力产生负面影响。失能者往往更快乐，对自己生活的评价远高于客观推断所及——这一现象称为“失能悖论”（Albrecht & Devlieger 1999）[^albrecht-1999]。
    step2: |-
      阿施（Asch）等人的批评当然不是打稻草人；但回应者可以说，失能会不利于从医疗资源中受益，这一主张有经验依据：有证据表明，失能者从这些资源中获得的生活质量改善往往少于无失能者。不过，这一反驳有多大分量，很大程度上取决于“生活质量”指什么。如果把它理解为对自己生活的主观评估或评价——如今更多称为“主观幸福”（Kahneman, Diener & Schwarz 1999）——那么有充分经验证据表明，失能 **并不** 对受益能力产生负面影响。失能者往往更快乐，对自己生活的评价也远高于旁人客观推断的水平——这一现象被称为“失能悖论”（Albrecht & Devlieger 1999）[^albrecht-1999]。
