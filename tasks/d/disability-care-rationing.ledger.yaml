      It is important to note, however, that disability is not conceptually linked to (lower) quality of life. Unfortunately, there is good evidence that it is commonly believed that people with disabilities suffer from a lower quality of life associated with their level of functioning or premature mortality, and that *ex ante* decrement in quality of life may not be fundamentally altered by the health resource (Albrecht & Devlieger 1999)[^albrecht-1999]. This empirical fact is the source of the democracy problem as it applies to disability since if the general public is laboring under a general prejudice about what it means to live with a disability, then they will be more easily persuaded that disability is an additional cost, or limits the benefit received (or both).
    step1: |-
            然而必须注意，失能在概念上并不与（较低的）生活质量相联。不幸的是，有充分证据表明，人们普遍相信失能者因其功能水平或过早死亡而生活质量较低，而这种*分配之前*生活质量的减损可能不会被医疗资源根本改变（Albrecht & Devlieger 1999）[^albrecht-1999]。这一经验事实正是民主问题在失能语境中的根源：如果一般公众对带失能生活意味着什么抱有普遍偏见，他们便更容易被说服认为失能是一项额外成本，或限制了所获收益（或二者兼有）。
    step2: |-
      然而须注意：失能在概念上并不与（较低的）生活质量相联。不幸的是，有充分证据表明，人们普遍相信失能者因功能水平或过早死亡而生活质量较低，而且这一“分配之前”的生活质量减损或许不会被资源根本改变（Albrecht & Devlieger 1999）[^albrecht-1999]。这一经验事实正是民主问题在失能语境中的根源：公众如果对带失能生活怀有普遍偏见，就更容易被说服，认为失能意味着额外成本，或限制了所能获得的收益（或二者兼有）。
