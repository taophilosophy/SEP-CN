      It might seem that this account, and indeed Howard and Aas’s, implies that there could be no disability in a just society. Though this is a classic claim of the traditional British social model of disability (UPIAS 1976)[^upias-1976], some find it implausible. Note, however, that neither of these views in fact implies the impossibility of disability in a just society (even if their language sometimes suggests it). For neither view, in itself, implies that the social responses that constitute most disabled people as such are *necessarily* unjust (though surely all four authors would agree that in the actual world, they usually are). If it is morally legitimate to set society up in a way that is designed for the functioning of most but not all its members—and it may well be, given how costly it would be to get anywhere near complete and comprehensive inclusion (Barclay 2018)[^barclay-2018]—then some forms of functioning could be marginalized or be a source of disadvantage, even in a just society. And, thus, those that function in those marginalized ways, could be disabled.
    step1: |-
      这似乎意味着，这一说明——以及 Howard 与 Aas 的说明——蕴含：在一个正义社会中不可能存在残疾。尽管这是传统英国残疾社会模型的经典主张（UPIAS 1976）[^upias-1976]，有些人仍觉得它不可信。然而请注意，这两种看法实际上都不蕴含正义社会中不可能有残疾（即便它们的措辞有时暗示如此）。因为这两种看法本身都不蕴含：那些使多数残疾人成为残疾人的社会回应是*必然*不义的（尽管四位作者想必都会同意，在现实世界中，这些回应通常确实不义）。如果以适合大多数成员、而非全体成员功能运作的方式来安排社会在道德上是正当的——考虑到要实现接近完全而全面的包容代价何其高昂（Barclay 2018）[^barclay-2018]，这很可能确实正当——那么即便在正义社会中，某些功能运作方式也可能被边缘化，或成为不利的来源。因此，以这些边缘化方式运作的人，也可能成为残疾人。
