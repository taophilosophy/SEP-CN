      Until relatively recently, there was little independent philosophical discussion of definitions of disability. Instead, philosophers focused primarily on developing and interpreting legal and regulatory definitions needed to implement disability policy. The legal definitions, in turn, were heavily influenced by the two-part “anatomy”—impairment and social response—of the social model of disability, which was developed by activists seeking to influence legislation and policy.
