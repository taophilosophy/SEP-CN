      有人可能主张，日常用法是意识形态性的，由未能意识到社会模型与交互模型的洞见所塑造。但大致依照日常用法来定义“残疾”，几乎不意味着其指称对象由生物医学标准选出，更不意味着被选出的特征导致了其承载者所面临的不利、或规定了应对这些不利的恰当社会回应。相反，这一关于“残疾”与“残疾人”指称什么的看法，与关于这些指称对象如何被挑出的多种立场都相容：例如由生物医学标准挑出；由民权运动的规则挑出；由主流意识形态关于身体功能失调的假定挑出；或由正义的要求挑出。什么算残疾、谁算残疾人，在多大程度上随语境而变，取决于所采纳的说明：在生物医学说明中，“残疾”的外延会像人类生物学一样稳定；在其他说明中，它会随社会规范、经济需要或政治发展而变化。此外，在某些说明中，指称对象会有可通过检视辨认出的共同特征；在另一些说明中，它们的共同之处只能凭某种意识形态或正义理论来理解。
