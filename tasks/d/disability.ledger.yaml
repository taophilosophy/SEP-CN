      In other ways, however, it seems to be significantly out of step with both the letter and the spirit of social models of disability. On this definition, a condition which is *only* harmful in virtue of social prejudice would not be a disability. Even the softer social model implicit in the Americans with Disabilities Act allows that *some* people are disabled solely in virtue of being “regarded as” impaired; those in that group who experience discrimination as a result would still not be “disabled” on Kahane and Savulescu’s view. Just how out of step this judgment is with the usual commitments of the social model, may depend on the relative importance it places on prejudice as compared to other factors in producing disability disadvantage. A social model that cleaves closely to a “minority group” understanding of ableist injustice may find that this definition excludes the paradigm cases of disability, people who experience gross or net reductions in advantage due to prejudicial phenomena like stigma and intentional exclusion. A “human variation” account of most disability disadvantage would see more possibility for people to be disadvantaged by non-prejudicial mismatches between atypical bodies and societies built for typicality, since this account will say that many of the welfare costs experienced by people with atypical bodies are not a result of prejudicial attitudes *per se*, even if they often reflect structurally unjust failures of inclusion.
    step1: |-
      然而在其他方面，它似乎与社会模型残疾观的字面与精神都明显不合。按这一定义，仅因社会偏见而有害的状况就不算残疾。即便是《美国残疾人法》所隐含的较温和社会模型，也允许某些人仅因被“视为”有损伤而成为残疾人；而在卡哈内与萨武列斯库看来，该群体中因此遭受歧视的人仍然不算“残疾人”。这一判断与公认的社会模型承诺有多大出入，可能取决于它把偏见相对于其他因素在造成残疾不利中的重要性看得多重。紧贴“少数群体”式能力主义不义理解的社会模型，可能会认为这一定义把残疾的典型情形排除在外——因污名与蓄意排斥这类偏见现象而在优势上遭受严重或净损失的人。而“人类变异”式说明在多数残疾不利上，会看到更多可能性：人们因非典型的身体与为典型性建造的社会之间的不匹配而处于不利——因为这种说明会认为，非典型身体者所体验的许多福利代价并非源于偏见态度本身，即便它们常反映结构上不公正的包容失败。
