      Some are not convinced by this last reply. For it can seem to give too much weight to judgments of the actual disability rights movement. As Jenkins and Webster point out, “rigidifying” to the actual world in this way means that imagining a world with a different disability rights movement isn’t imagining a world with different disabled people. But what if the disability rights movement is different there because social conditions are different, warranting a different set of rules for determining which people with pathologized bodily difference to seek justice for? And indeed isn’t there a sense in which “there” could be “here”? That is, couldn’t the disability right movement as it actually is, use rules that even when consistently applied lead it to seek justice for the wrong people (Wasserman 2018; Howard & Aas 2018; Lim 2018)[^howard-2018][^lim-2018][^wasserman-2018]?
    step1: |-
      有些人并不信服这最后一条回应。因为它似乎过于看重实际的残疾权利运动所作的判断。正如 Jenkins 与 Webster 所指出的，以这种方式向实际世界“固化”，意味着设想一个有着不同残疾权利运动的世界，并不是在设想一个有着不同残疾人的世界。但如果那里的残疾权利运动之所以不同，是因为社会条件不同，从而理当有一套不同的规则，来判定应当为哪些被病理化的身体差异者争取正义呢？而且，难道不存在一种意义，使“那里”可能就是“这里”吗？也就是说，实际的残疾权利运动难道不会采用这样的规则——即便一贯地适用，它们也会导致该运动为错误的人争取正义（Wasserman 2018; Howard & Aas 2018; Lim 2018）[^howard-2018][^lim-2018][^wasserman-2018]？
    step2: |-
      这最后一条回应并未说服所有人。因为它似乎过高估计了实际残疾权利运动所作判断的分量。正如 Jenkins 与 Webster 所指出的，以这种方式向现实世界“固化”，意味着设想一个残疾权利运动有所不同的世界，并不是在设想一个残疾人有所不同的世界。可是，如果那里的残疾权利运动之所以不同，是因为社会条件不同，因而理当另有一套规则，来判定该为哪些被病理化的身体差异者争取正义呢？而且，难道不存在某种意义，使“那里”可能就是“这里”吗？换句话说，实际存在的残疾权利运动，难道不会采用这样的规则——即便一以贯之地适用，也仍然使它为错误的人争取正义（Wasserman 2018; Howard & Aas 2018; Lim 2018）[^howard-2018][^lim-2018][^wasserman-2018]？
