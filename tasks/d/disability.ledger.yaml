      In contrast, the *social model* explains the characteristic features of disability in terms of a relation between an individual and her social environment: the exclusion of people with certain physical and mental characteristics, or “impairments”, from major domains of social life. Their exclusion is manifested not only in deliberate segregation, but in a built environment and organized social activity that preclude or restrict the participation of people seen or labeled as having disabilities. A variety of social models are embraced by disability scholars and activists in and outside of philosophy. The “British social model” associated with the Union of the Physically Impaired against Segregation (UPIAS 1976)[^upias-1976] appears to deny any causal role to impairment in disability:
    step1: |-
      相反，社会模型用个体与其社会环境之间的关系来解释残疾的特征性方面：具有某些身体与心理特征（即“损伤”）的人被排斥在社会生活的主要领域之外。这种排斥不仅表现为蓄意的隔离，也表现在建成环境与有组织的社会活动之中——它们阻止或限制那些被视为或被标为残疾的人参与。哲学内外，残疾学者与行动者拥护多种社会模型。与“身体损伤者反隔离联盟”（UPIAS 1976）[^upias-1976] 相联系的“英国社会模型”，似乎否认损伤在残疾中有任何因果作用：
