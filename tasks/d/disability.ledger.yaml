  - id: 14
    kind: body
    source: |-
      Implicit in the UPIAS understanding of disability are two ways that society imposes limitations on disabled people, corresponding to two distinct strands that might be a part of any social model. When the UPIAS claims that society “excludes” people with impairments, this suggests the *minority group model*, which sees people with impairments as a minority population subject to stigmatization and exclusion. On this view, the main reason people with disabilities encounter hardship is because they suffer discrimination along the same lines as racial or ethnic minorities. Accordingly, civil rights protections and anti-discrimination laws are the proper responses to disability (e.g., Hahn 1987 [1997] and Oliver 1990)[^hahn-1987][^oliver-1990]. Perhaps the most familiar expression of the minority-group model is found in the preamble to the Americans with Disabilities Act (ADA), which describes people with disabilities as “a discrete and insular minority”—an explicit invocation of the legal characterization of racial minorities.
    step1: |-
      UPIAS 对残疾的理解隐含了社会对残疾人施加限制的两种方式，它们对应任何社会模型都可能包含的两条不同脉络。UPIAS 主张社会“排斥”有损伤者时，指向的是少数群体模型——它把有损伤者视为遭受污名与排斥的少数人群。照这种看法，残疾人遭遇困苦的主要原因，是他们像种族或族裔少数那样受到歧视。因此，民权保护与反歧视法是应对残疾的正当手段（如 Hahn 1987 [1997] 与 Oliver 1990）[^hahn-1987][^oliver-1990]。少数群体模型最熟悉的表达，也许见于《美国残疾人法》（ADA）的序言：它把残疾人描述为“一个离散而孤立的少数群体”——明确援用了对种族少数的法律定性。
