      MF2 solves the problem of temporary conditions by stipulation. This may or may not be good enough here, depending on whether we think temporary conditions (e.g., post-concussion syndrome or pregnancy) can be disabilities. MF3 faces some of the same problems as other social-model-inspired definitions—particularly, that it seems to define disability in terms of a kind of oppression, and therefore in terms of something bad, something that is therefore (arguably) difficult to be proud of or happy about. Further, by requiring that oppression be caused by functioning that *actually* fails to fit going norms and expectations, it does not clearly classify as disabled people who are disadvantaged by *false* perceptions regarding their bodily differences—again, failing to follow the ADA in its well-considered inclusion of people “regarded as”, but not, impaired, in its definition of disability (Francis 2018)[^francis-2018]. It remains to be seen whether the advantages of this definition are great enough to justify excluding such “regarded” as people as disabled.
    step1: |-
      MF2 以约定方式解决了暂时状况的问题。这在这里是否足够好，取决于我们是否认为暂时状况（例如脑震荡后综合征或妊娠）可以成为残疾。MF3 面临一些与其他受社会模型启发的定义相同的问题——尤其是：它似乎以某种压迫来定义残疾，因而以某种坏的东西来定义残疾，而坏的东西（可以说）难以令人骄傲或快乐。此外，由于它要求压迫由*实际*不符合现行规范与期待的功能运作所引起，它没有清楚地把那些因关于其身体差异的*虚假*知觉而处于不利的人归类为残疾人——这再次未能遵循 ADA 在其残疾定义中对“被视为”有损伤、但实际并无损伤者的审慎纳入（Francis 2018）[^francis-2018]。这种定义的优点是否大到足以证成把这类“被视为”者排除在残疾人之外，仍有待观察。
