      That said, few philosophers seem inclined to defend this way of defining disability. Many philosophers are skeptical of the analytic division between facts about bodily function and social and ethical norms, arguing that there is no way to define disease or pathology independent of “normative” considerations (Wakefield 1992; Kingma 2007; entry on concepts of health and disease)[^kingma-2007][^wakefield-1992]. Those sympathetic to the claims of the disability may have more specific qualms, as well. Those attracted to the “human variation” version of the social model may be skeptical that all of the bodily difference that make for disability are statistically atypical in the required way, e.g., very common or universal conditions like age-related hearing loss or atherosclerosis. Those who tend more to a “minority group” model will tend to see the bodily differences that matter to disability as *perceived* or represented difference, rather than actual difference. And anyone with any sympathy to the social model at all will tend to think that, as-so-far stated, this definition puts its philosophical precision in the wrong place: that it is at least as important to understand what social, moral, and legal effects characterize disability as to understand which sorts of causes these effects must have to count as “disabling”.
    step1: |-
      话虽如此，似乎没有多少哲学家愿意为这种定义残疾的方式辩护。许多哲学家怀疑关于身体功能的事实与社会及伦理规范之间的分析性划分，认为无法独立于“规范性”考量来定义疾病或病理（Wakefield 1992; Kingma 2007; 见“健康与疾病的概念”词条）[^kingma-2007][^wakefield-1992]。同情残疾主张的人可能还有更具体的疑虑。被社会模型“人类变异”版本吸引的人可能怀疑：造成残疾的身体差异是否都以所需方式在统计上非典型，例如与年龄相关的听力损失或动脉硬化这类非常常见或普遍的状况。更倾向“少数群体”模型的人，则倾向于把与残疾相关的身体差异看作被感知或被表征的差异，而非实际差异。而任何对社会模型有丝毫同情的人都会倾向于认为，如目前所述，这一定义把哲学上的精确性放错了地方：理解哪些社会、道德与法律效果刻画残疾，至少与理解这些效果必须有何种原因才算“致残”，同样重要。
