      Elizabeth Barnes’ critique of definitional claims implicit in the social model has been a signal moment in the recent debate. Barnes is concerned that thinking of disability as a stigmatizing, oppressive, and exclusionary response to bodily difference does not distinguish disability from other properties grounded in responses to the body, like (on many accounts) race, gender, and sexual orientation identities.
