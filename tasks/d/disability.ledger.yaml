      Although the social model, in one version or another, is now the dominant legislative, social-science, and humanities paradigm for understanding disability, stronger versions of it – particularly the British Social Model exemplified by UPIAS – have been subject to extensive criticism. Some argue that an adequate conceptualization of disability requires a recognition of impairments as an objective basis for classification, to distinguish disability discrimination from other types of discrimination (Bickenbach 1993)[^bickenbach-1993]. Several critics argue that extreme versions of the model implausibly deny or understate the role of impairment itself as a source of disadvantage (Anastasiou & Kauffman 2013; Terzi 2004, 2009; Shakespeare 2006)[^anastasiou-2013][^shakespeare-2006][^terzi-2004]. Others, however, contend that this criticism is misplaced, because the British Social Model does not deny the importance of impairments but rather seeks to restrict the application of the term “disability” to social exclusion and oppression (Beaudry 2016)[^beaudry-2016].
    step1: |-
      尽管社会模型——不论哪个版本——如今是理解残疾的主导性立法、社会科学与人文学科范式，其较强版本（尤其是以 UPIAS 为典范的英国社会模型）却受到广泛批评。有人认为，要充分地概念化残疾，就必须承认损伤是分类的客观基础，以便把残疾歧视与其他类型的歧视区分开（Bickenbach 1993）[^bickenbach-1993]。数位批评者主张，极端版本的模型难以置信地否认或低估了损伤本身作为不利来源的作用（Anastasiou & Kauffman 2013; Terzi 2004, 2009; Shakespeare 2006）[^anastasiou-2013][^shakespeare-2006][^terzi-2004]。然而另一些人认为，这种批评打错了靶子，因为英国社会模型并不否认损伤的重要性，而只是想将“残疾”一词的适用范围限制在社会排斥与压迫上（Beaudry 2016）[^beaudry-2016]。
