      It should be even more clear that the *affirmational* model of disability is in substantial tension with this harm-requiring definition of disability. Granted, affirmation of disability may not be formally inconsistent with defining it in terms of harm, since it is possible in principle to take pride in or otherwise be glad about something that leads to a reduction in our well-being (since there are things in life that matter, besides our own well-being). But affirmational models generally hold that being disabled is not always or in general a cost to our well-being (Swain & French 2000; Barnes 2016)[^barnes-2016][^swain-2000]. This would be a conceptual falsehood, on the welfarist view: something which is not a cost to well-being in *some* context is simply not a disability.
