      Two sorts of skeptical responses have greeted the effort to define disabilities as individual traits, conditions, or functions, selected by some set of rules or criteria. The first critique is inspired by the work of Michael Foucault on biopower as a form of control exercised by modern states over the bodies of their populations (Tremain 2017)[^tremain-2017]. This critique argues that to focus on individual characteristics in defining disability is to miss the forest for the trees. “Disability” refers not to a set of individual characteristics, or to a concept that encompasses such a set, but to a mechanism that identifies various types of individual characteristics for the purpose of social control. Notably, Shelley Tremain analyzes disability as a mechanism constructed and maintained by laws, informal norms, cultural understandings and other exercises of biopower. Impairments and disabilities only exist within this culturally and historically contingent apparatus that arose in part as a means for people who saw themselves as “normal” to regulate those they labeled as “deviants”.
    step1: |-
      把残疾定义为由某套规则或标准挑选出来的个体特征、状况或功能，这一努力招来了两类怀疑性回应。第一种批评受米歇尔·福柯关于生命权力的工作启发——生命权力是现代国家对人口身体实施控制的一种形式（Tremain 2017）[^tremain-2017]。这一批评主张：在定义残疾时聚焦于个体特征，是只见树木不见森林。“残疾”所指的并不是一组个体特征，也不是涵盖这样一组特征的概念，而是一种为了社会控制而识别各种类型个体特征的机制。值得注意的是，Shelley Tremain 把残疾分析为由法律、非正式规范、文化理解及其他生命权力运作所建构并维持的机制。损伤与残疾只存在于这个在文化与历史上具有偶然性的装置之中；该装置部分地是作为让那些自视为“正常”的人规制他们标记为“偏差者”之人的手段而出现的。
