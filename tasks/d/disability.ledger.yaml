      ## 2. Definitions of Disability
    step1: TBD
    step2: TBD
  - id: 30
    kind: body
    source: |-
      Until relatively recently, there was little independent philosophical discussion of definitions of disability. Instead, philosophers focused primarily on developing and interpreting legal and regulatory definitions needed to implement disability policy. The legal definitions, in turn, were heavily influenced by the two-part “anatomy”—impairment and social response—of the social model of disability, which was developed by activists seeking to influence legislation and policy.
    step1: TBD
    step2: TBD
  - id: 31
    kind: body
    source: |-
      ### 2.1 Philosophical discussion of Official Definitions of Disability
    step1: TBD
    step2: TBD
  - id: 32
    kind: body
    source: |-
      Thus, two familiar features are shared by most official definitions of disability, such as those in the World Health Organization (1980, 2001), the Disability Discrimination Act (UK), and the Americans with Disabilities Act (United States): (i) a physical or mental characteristic labeled or perceived as an impairment or dysfunction and (ii) some personal or social limitation associated with that impairment. Impairments are generally seen as *traits* of the individual that he or she cannot readily alter. Just what makes a condition a trait or attribute of an individual is obscure and debatable, but there seems to be agreement on clear cases. Thus, poverty is not seen as an impairment, however disabling it may be, nor is tasteless clothing, even if it is a manifestation of impaired fashion-sense rather than scarce income. On the other hand, diseases are generally classified as impairments, even though they are often neither permanent nor static conditions. Diseases that are especially transient, however, such as the flu and the measles, do not normally count as impairments.
    step1: TBD
    step2: TBD
  - id: 33
    kind: body
    source: |-
      As in early philosophical debates about competing models, the most controversial issue in defining disability is the relationship between these two features. At one extreme are definitions that imply, or are read to imply, that biological impairments are the sole causes of limitation. The definitions in the World Health Organization’s 1980 International Classification of Impairment, Disability, and Handicap, and the Disability Discrimination Act (UK) have been interpreted this way. At the other extreme are definitions that restrict the limitations faced by disabled people (as such) solely to “contemporary social organization”, such as the definition given by the Union of the Physically Impaired Against Segregation (UPIAS 1976)[^upias-1976]. In between are definitions which assert that individual impairment and the social environment are *jointly* sufficient causes of limitation. Perhaps the best-known example is the WHO’s International Classification of Functioning, Disability and Health (World Health Organization 2001, referred to as ICF)[^world-2001], which emphasizes that disability is a “dynamic interaction between health conditions and environmental and personal factors”.
    step1: TBD
    step2: TBD
  - id: 34
    kind: body
    source: |-
      Through much of the first two decades of this century, philosophers were largely content with this definitional approach to disability as a relationship or interaction, disagreeing primarily on the comparative contribution of the two elements and the policy relevance of their contributions. As noted in the last section, dissenters mainly focused on the characterization of one or both elements, as, e.g., on the first as social vs. biological, rather than on the “anatomy” itself. More recently, however, there has been some movement away from reliance on these two-part approaches to defining disability (e.g., Barnes 2016, and much of the literature responding)[^barnes-2016]. One reason may be that in most settings, we do not think of or refer to disabilities as relationships or interactions, but as individual somatic or psychic traits, states or conditions (including absences and deficiencies). These commonsense referents are hard to find in, for example, the multifactorial charts by which the ICF illustrates its definition of disability as a complex interaction of health conditions with environmental, social, and personal factors.
    step1: TBD
    step2: TBD
  - id: 35
    kind: body
    source: |-
      Some might argue that ordinary usage is ideological, shaped by false failure to be conscious of the insights of social and interactionist models. But defining “disability” in rough conformity to ordinary usage hardly implies that its referents are selected by biomedical criteria, let alone that the traits selected cause the disadvantages faced by their bearers or dictate the appropriate social response to those disadvantages. Rather, this view on what “disability” and “people with disabilities” refer to is compatible with a wide variety of positions on how those referents are picked out: e.g., by biomedical criteria; by the rules of a civil-rights movement; by the assumptions of the dominant ideology about bodily dysfunction; or by the demands of justice. The extent to which what counts as a disability, or a person with a disability, varies with context and will depend on the account adopted; on biomedical accounts, the extension of “disability” will be as stable as human biology; on other accounts, it will change with changing social norms, economic needs, or political developments. Further, on some accounts, the referents will have common features, identifiable by inspection; on others, what they have in common can only be understood in terms of an ideology or a theory of justice.
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      After discussing several types of accounts, we will address the claim, inspired by the diversity of traits and conditions they pick out, that “disability” has no core meaning, and that it may be futile and distracting to search for one.
    step1: TBD
