      This view of disabilities as the result of human variations is closely related to the view that disability is a universal human condition (Zola 1989)[^zola-1989] or shared human identity (L. Davis 2002: Ch. 1)[^davis-2002]. The claim that disability is universal can be taken as nothing more than a prediction that we will all acquire familiar disabilities at some point in our lives. But that claim is better construed as one about the nature of disability; as maintaining that all human beings have physical or mental variations that can become a source of vulnerability or disadvantage in some settings.
    step1: TBD
    step2: TBD
  - id: 18
    kind: body
    source: |-
      These two versions of the social model are not incompatible, differing mainly in emphasis. The discrimination stressed by the minority group model generally leads to, and is expressed in, the societal failure to accommodate people with various differences. In some contexts, it is appropriate to analogize people with disabilities to racial or other minorities; in others, it is important to reject a dichotomy between disability and normality and treat impairments as continuous variations. If one goal of social policy is to remove discrimination and its enduring disadvantages, another is to encompass the full range of human variation in the design of the physical environment and social practices.
    step1: TBD
    step2: TBD
  - id: 19
    kind: body
    source: |-
      Although the social model, in one version or another, is now the dominant legislative, social-science, and humanities paradigm for understanding disability, stronger versions of it – particularly the British Social Model exemplified by UPIAS – have been subject to extensive criticism. Some argue that an adequate conceptualization of disability requires a recognition of impairments as an objective basis for classification, to distinguish disability discrimination from other types of discrimination (Bickenbach 1993)[^bickenbach-1993]. Several critics argue that extreme versions of the model implausibly deny or understate the role of impairment itself as a source of disadvantage (Anastasiou & Kauffman 2013; Terzi 2004, 2009; Shakespeare 2006)[^anastasiou-2013][^shakespeare-2006][^terzi-2004]. Others, however, contend that this criticism is misplaced, because the British Social Model does not deny the importance of impairments but rather seeks to restrict the application of the term “disability” to social exclusion and oppression (Beaudry 2016)[^beaudry-2016].
    step1: TBD
    step2: TBD
  - id: 20
    kind: body
    source: |-
      Another objection is that the social as well as the medical model both rest on a false dichotomy between biological impairments and social limitations. There are two versions of this objection. One maintains that disability is a complex phenomenon, in which biological impairment and social exclusion are deeply interwoven and difficult to tease apart (Martiny 2015; Anastasiou & Kauffman 2013)[^anastasiou-2013][^martiny-2015]. The other version of this objection rejects the treatment of impairment as a (strictly) biological phenomenon. “Impairment”, the argument goes, is no less a social construction than the barriers faced by people so classified (more on this below). Claims that there is a stable biomedical basis for classifying a variation as an impairment are called into question by shifting classifications; by the “medicalization” of some conditions (shyness) and “demedicalization” of others (homosexuality). Moreover, the social environment appears to play a significant role in identifying and, arguably, in constituting some impairments (dyslexia) (Cole 2007; Shakespeare 2006; L. Davis 2002: Ch 1; Tremain 2001, 2017; Amundson 2000)[^amundson-2000][^cole-2007][^davis-2002][^shakespeare-2006][^tremain-2001]. What counts as an impairment may depend on which variations appear to be disadvantageous in familiar or salient environments, or on which variations are subject to social prejudice: Less-than-average height may be more readily classified as an impairment than greater-than-average height because the former is more often disadvantageous in environments designed for people of average height, or because it is generally seen as less desirable. For such reasons, it is difficult to establish the objectivity of the impairment classification by appeal to a clear and undisputed biomedical norm. Amundson (2000), indeed, goes so far as to deny that there is any biological basis for a concept of functional normality—a claim emphatically rejected by Boorse (2010).
    step1: TBD
    step2: TBD
