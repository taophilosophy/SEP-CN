  - id: 2
    kind: body
    source: |-
      The lack of attention to “disability” or the related concept of “impairment” may have a simple explanation: there were no such concepts to attend to until nineteenth century scientific thinking put variations in human function and form into categories of abnormality and deviance. Once such categories were established, it became possible to talk, and generalize, about (first) “the disabled”, and (then) “their impairments”, and philosophers have done so for various purposes [Hacking, 1990; L. Davis, 2002: Ch. 4]). The resurgent political philosophy of the second half of the last century, preoccupied with eliminating or reducing unearned disadvantages, tended to treat disability as a primary source of those disadvantages, to be addressed with medical correction or government compensation (Cohen 1993; Sen 1993)[^cohen-1993][^sen-1993]. Somewhat later, social philosophers began to see disability as a source both of discrimination and oppression, and of group identity, akin to race or gender in these respects. And biomedical and other practical applied ethicists have been concerned to help policy-makers construct and interpret new legal and regulatory frameworks making central reference to “disability” and related concepts.
    step1: |-
      对“残疾”或相关概念“损伤”缺乏关注，也许有一个简单的解释：在十九世纪科学思想把人类功能与形态的变异归入异常与偏差范畴之前，并没有这样的概念可供关注。这类范畴一旦建立，就有可能谈论并概括（先是）“残疾人”，然后（再是）“他们的损伤”；哲学家出于各种目的这样做了（Hacking, 1990; L. Davis, 2002: Ch. 4）。上世纪后半叶复兴的政治哲学专注于消除或减少非应得的不利，倾向于把残疾视为这些不利的主要来源，须以医学矫正或政府补偿来处理（Cohen 1993; Sen 1993）[^cohen-1993][^sen-1993]。稍后，社会哲学家开始把残疾既看作歧视与压迫的来源，也看作群体认同的来源，在这些方面与种族或性别相似。生物医学及其他实践应用伦理学家则关心帮助政策制定者建构并解释新的法律与监管框架——这些框架核心地援引“残疾”及相关概念。
