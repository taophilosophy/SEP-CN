      This makes who is disabled a social construction—dependent on the attitudes and commitments of a particular, self-identified group of people in contemporary society, the “disability rights movement”, composed of self-identified disabled and nondisabled members. It thus raises the concern that a disability movement might seek justice for the wrong people. Couldn’t some of those people complain that they should be included in the aims of that movement, precisely, because they are disabled? Barnes responds in two ways. The first is to note that she appeals to the *rules* for judgment-making, rather than judgments themselves; some people might not *actually* be included in the disability rights movement—say, because of internal prejudices on the part of those within the movement—but if this is inconsistent with the reasons for including others, then the excluded people will count as disabled too, on Barnes’ account. Still one might ask, what if the rules themselves were bad rules, wrongly but consistently excluding some people from the ambit of the struggle against ableism? Barnes, in response to this, rigidifies, insisting that we judge disability relative to the rules of the *actual* disability movement, even when we are imagining situations where that movement should use different rules than it actually does.
    step1: |-
      这使谁是残疾人成为一种社会建构——取决于当代社会中一个特定的、自我认同的人群的态度与承诺，即由自我认同的残疾与非残疾成员组成的“残疾权利运动”。由此引出一个担忧：残疾运动可能为错误的人寻求正义。难道其中某些人不能抱怨说，他们恰恰因为身有残疾而应当被纳入该运动的目标？巴恩斯以两种方式回应。第一，她求助于作出判断的规则，而非判断本身；某些人也许并未实际被纳入残疾权利运动——比如说，因为运动内部人员的内在偏见——但如果这与纳入其他人的理由不一致，那么按巴恩斯的说法，被排除的人也照样算作残疾人。人们仍可能问：如果规则本身就是坏规则，虽然始终如一却错误地把某些人排除在对抗能力主义的斗争之外呢？对此，巴恩斯采取了僵硬立场，坚持我们相对于实际的残疾权利运动的规则来判断残疾，即便在我们设想该运动本应采用不同规则的情形中也是如此。
