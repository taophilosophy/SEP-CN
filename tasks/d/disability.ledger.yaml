  - id: 6
    kind: body
    source: |-
      Disabilities like these have been objects of study in sociology, medicine, and policy debates for much longer than they have been subjects of sustained interest in philosophy. These discourses do not tend to define “disability” by way of the sort of rigorous necessary and sufficient conditions philosophers often prefer. But they have been centrally concerned with broadly definitional issues, often discussed under the heading of “models” of disability—that is, general theoretical perspectives concerned to say what in the world social scientists are investigating when they investigate disability. These models generally pick out, both (1) a set of phenomena as what needs explaining, when we explain disability, phenomena typically but not necessarily characterized as *disadvantages*; and (2) an explanation of these phenomena—again, typically, but not solely, an explanation of why disabled people experience the disadvantages they do.
    step1: |-
      这类残疾成为社会学、医学与政策争论的研究对象，远早于它们成为哲学持续关注的主题。这些话语并不倾向于用哲学家常偏爱的那种严格的充要条件来定义“残疾”。但它们一直核心地关涉广义的定义问题，通常放在残疾“模型”的标题下讨论——也就是一些一般性的理论视角，意在说明社会科学家研究残疾时究竟在研究世界上的什么。这些模型一般会挑出两样东西：(1) 一组需要解释的现象——我们解释残疾时所要解释的现象，通常但不必然被刻画为*不利*；(2) 对这些现象的解释——同样通常但不只是在解释为什么残疾人会经历他们所经历的那些不利。
