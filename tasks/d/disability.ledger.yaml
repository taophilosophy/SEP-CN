      ### 2.2 Philosophical Definitions of Disability
    step1: TBD
    step2: TBD
  - id: 38
    kind: body
    source: |-
      Outside of legal and policy interpretation, philosophers have made a number of claims about the definition of “disability”—at first, mostly only in passing, during discussion of other matters, like “disease” and “health”; later as an increasingly important philosophical topic in its own right.
    step1: TBD
    step2: TBD
  - id: 39
    kind: body
    source: |-
      #### 2.2.1 Normal-Function Views
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      Given the pervasiveness of medical models of disability in the culture, one would think that at least some recent philosophers would defend a view of disability on which it is defined in terms of *pathology* or departure from normal functioning (see entry on concepts of health and disease). So far we can tell, however, no one has done so explicitly, in print. Christopher Boorse, perhaps, comes closest, when he says:
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      > at first sight, one expects *disability* […] to consist of a pathological condition severe enough to have certain morally and legally important effects. (Boorse 2010: 60–61)[^boorse-2010]
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      Though Boorse only broaches the possibility of such a definition, without defending, his broader views about health and disease may seem to support this approach. If, as Boorse argues there is a good naturalistic sense of “pathology” as (statistically) downward departure from species-typical functioning, then that notion can be inputted into our moral and political thinking to produce a definition of disability on the following pattern:
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      *S* is disabled, in a context *C*, iff
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      1. *S* has a pathology—that is, some part of their body performs its normal function at statistically subtypical levels,
      2. In *C*, that pathology causes effects that make a difference, of kind *D*, to how *S* ought legally or morally to be treated
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      To fully develop this view, of course, one would need to say what sort of moral/legal difference pathology is supposed to make—not just any difference will do, since it would not follow from the fact, say, that everyone has a legal or moral right to treatment for transient injuries or diseases that all these conditions are disabilities. Note also that, though this view mentions the medical concept of pathology, as a *definition* of disability it does not entail a medical model, or indeed even the denial of the affirmational model. The medical/social debate will turn on the extent to which it is pathology *itself* that makes a moral difference, rather than pathology in combination with social factors. The affirmational model debate will turn on just which effects are definitive of disability; if these are all negative or harmful, it will be harder to understand disability as something to be proud of. But the bare fact that disability arises from pathology, on this definition, does not necessarily preclude pride in it, given Boorse’s normatively neutral definition of pathology.
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      That said, few philosophers seem inclined to defend this way of defining disability. Many philosophers are skeptical of the analytic division between facts about bodily function and social and ethical norms, arguing that there is no way to define disease or pathology independent of “normative” considerations (Wakefield 1992; Kingma 2007; entry on concepts of health and disease)[^kingma-2007][^wakefield-1992]. Those sympathetic to the claims of the disability may have more specific qualms, as well. Those attracted to the “human variation” version of the social model may be skeptical that all of the bodily difference that make for disability are statistically atypical in the required way, e.g., very common or universal conditions like age-related hearing loss or atherosclerosis. Those who tend more to a “minority group” model will tend to see the bodily differences that matter to disability as *perceived* or represented difference, rather than actual difference. And anyone with any sympathy to the social model at all will tend to think that, as-so-far stated, this definition puts its philosophical precision in the wrong place: that it is at least as important to understand what social, moral, and legal effects characterize disability as to understand which sorts of causes these effects must have to count as “disabling”.
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      #### 2.2.2 The Welfarist View
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      Kahane and Savulescu (2009; Savulescu & Kahane 2011)[^savulescu-2011] propose a reformed definition of disability that promises to avoid potentially problematic references to pathology. Their basic idea is that a disability is a (broadly) bodily condition that makes its bearer worse off. To wit:
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      > “disability” should refer to any stable physical or psychological property of subject *S* that leads to a significant reduction of *S*’s level of wellbeing in circumstances *C*, *excluding* the effect that this condition has on wellbeing that is due to prejudice against *S* by members of *S*’s society. (Savulescu & Kahane 2011: 45)[^savulescu-2011]
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      This view adopts certain insights of the social model: in particular in holding that disability is relative to circumstance and in downplaying the role of pathology or biological abnormality in defining disability (note there is no reference to “impairment”, not even records or appearance of impairment).
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      In other ways, however, it seems to be significantly out of step with both the letter and the spirit of social models of disability. On this definition, a condition which is *only* harmful in virtue of social prejudice would not be a disability. Even the softer social model implicit in the Americans with Disabilities Act allows that *some* people are disabled solely in virtue of being “regarded as” impaired; those in that group who experience discrimination as a result would still not be “disabled” on Kahane and Savulescu’s view. Just how out of step this judgment is with the usual commitments of the social model, may depend on the relative importance it places on prejudice as compared to other factors in producing disability disadvantage. A social model that cleaves closely to a “minority group” understanding of ableist injustice may find that this definition excludes the paradigm cases of disability, people who experience gross or net reductions in advantage due to prejudicial phenomena like stigma and intentional exclusion. A “human variation” account of most disability disadvantage would see more possibility for people to be disadvantaged by non-prejudicial mismatches between atypical bodies and societies built for typicality, since this account will say that many of the welfare costs experienced by people with atypical bodies are not a result of prejudicial attitudes *per se*, even if they often reflect structurally unjust failures of inclusion.
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      It should be even more clear that the *affirmational* model of disability is in substantial tension with this harm-requiring definition of disability. Granted, affirmation of disability may not be formally inconsistent with defining it in terms of harm, since it is possible in principle to take pride in or otherwise be glad about something that leads to a reduction in our well-being (since there are things in life that matter, besides our own well-being). But affirmational models generally hold that being disabled is not always or in general a cost to our well-being (Swain & French 2000; Barnes 2016)[^barnes-2016][^swain-2000]. This would be a conceptual falsehood, on the welfarist view: something which is not a cost to well-being in *some* context is simply not a disability.
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      Are these decisive problems for defining disability in terms of welfare? Much depends here on what we intend to do with definitions of disability. If the goal is to capture ordinary usage, a welfarist view may be on the right track. It might account, for instance, for the broad appeal of slogans like “deafness is not a disability” and euphemisms like “differently abled”; these expressions, on this view, would be ways of emphasizing some of the substantive evaluative intuitions behind the affirmative model, that most conditions we call disabilities are not so bad absent prejudice. That said, disability scholars and activists have tended to be skeptical of such expressions, on the grounds that they undermine efforts to see disabled people as a politically salient group with similar experience of ableism and strong reason to work together for justice, rather than to simply commiserate. If a definition of disability should advocate in favor of usages that produce a better or more just world, this might be a reason to reject Kahane and Savulescu’s view, in favor of one that allows people to be disabled due to prejudice and/or in the absence of harms to well-being. Or at least, this will be so if the social and/or affirmational models of disability have the moral and political advantages proponents advertise for them.
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      #### 2.2.3 Social Constructionisms
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      Most philosophers who have considered the definition of disability in recent years have written in sympathy with either or both of the social or affirmational model of disability.
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      Elizabeth Barnes’ critique of definitional claims implicit in the social model has been a signal moment in the recent debate. Barnes is concerned that thinking of disability as a stigmatizing, oppressive, and exclusionary response to bodily difference does not distinguish disability from other properties grounded in responses to the body, like (on many accounts) race, gender, and sexual orientation identities.
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      Barnes develops an alternative view which still defines disability as a social property—but in a way that fits the affirmational model better than the definitions suggested by classic social models, doing away with the distinction between disability and impairment and making no direct reference whatsoever to injustice or disadvantage. Barnes (2016) proposes to define disability in terms of the judgments of disabled people themselves, not society as a whole. To wit, *S* is (physically) disabled if and only if:
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      1. *S* is in some bodily state *x*; [such that]
      2. The rules for making judgments about solidarity employed by the disability rights movement classify *x* in context *C* as among the physical conditions that they are seeking to promote justice for.
    step1: TBD
    step2: TBD
