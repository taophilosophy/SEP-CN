      In their extreme forms, the *medical* and *social* models serve to chart the space of possible relationships between bodily difference and functional limitation more than to reflect the actual views of individuals or institutions. (A variety of more formal models, described in Altman 2001, graphically represent the causal complexity of disability.)[^altman-2001]
    step1: |-
      在其极端形态中，医学模型与社会模型更多是用来勾画身体差异与功能限制之间可能的关系空间，而不是反映个人或机构的实际观点。（Altman 2001 描述了多种更形式化的模型，以图形表示残疾的因果复杂性。）[^altman-2001]
    step2: |-
