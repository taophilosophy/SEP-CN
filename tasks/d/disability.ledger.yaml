      > 许多关于残疾的哲学分歧只是忽略了一个事实：争论者谈的是不同现象（损伤对压迫；关怀对正义；法律义务对法外义务，等等）。其中一些分歧，更富成效的表述方式是：它们是关于如何处理残疾一词多义性的分歧。（Beaudry 2020: 5; 亦见 Beaudry 2016）[^beaudry-2016][^beaudry-2020]。
    step2: |-
      > 许多关于残疾的哲学分歧，恰恰忽略了一个事实：争论各方谈论的是不同的现象（损伤对压迫；关怀对正义；法律义务对法外义务，等等）。其中有些分歧，若能表述为关于“如何处理残疾一词的多义性”的分歧，会更有成效。（Beaudry 2020: 5; 亦见 Beaudry 2016）[^beaudry-2016][^beaudry-2020]。
  - id: 105
    kind: body
    source: |-
      Though certain ethical or political contexts might call for specifying or stipulating a definition, this view holds that we have little reason to think we can find, or should seek, a definition of “disability” as a general matter. We are unlikely to find one because these different definitions will have conceptual and practical advantages in different contexts; we should not seek one because adopting a canonical definition would foreclose our recognition of other characteristics and phenomena with moral and practical affinities to what we have decided to call “disabilities”. An open-ended approach, in contrast, “can create avenues for new kinds of emancipatory self-understandings” (Beaudry 2020: 13)[^beaudry-2020].
    step1: |-
      尽管某些伦理或政治语境可能要求对定义作出具体说明或约定，这种看法仍主张：我们几乎没有理由认为，我们能够找到、或应当寻求一个作为一般事务的“残疾”定义。我们不太可能找到这样一个定义，因为这些不同定义在不同语境中各有概念上与实践上的优势；我们也不应当寻求它，因为采用一个正典定义会封闭我们对其他特性与现象的认识——这些特性与现象在道德与实践上与我们已经决定称之为“残疾”的东西相近。相比之下，一种开放式的进路“可以为新型的解放性自我理解开辟道路”（Beaudry 2020: 13）[^beaudry-2020]。
    step2: |-
      某些伦理或政治语境或许需要把定义说清楚或作出约定，但按这种看法，我们几乎没有理由相信能够找到、或应当去寻找一个一般意义上的“残疾”定义。我们不太可能找到它，因为这些不同定义在不同语境中各有概念上与实践上的长处；我们也不该去找它，因为一旦采用某个正典定义，就会封闭我们对其他特性与现象的认识——而这些特性与现象，在道德与实践上同我们已决定称为“残疾”的东西相近。相反，一种开放式的进路“可以为新型的解放性自我理解开辟道路”（Beaudry 2020: 13）[^beaudry-2020]。
  - id: 106
    kind: body
    source: |-
      Beaudry acknowledges that even open-ended approaches have evidentiary constraints, but these constraints are far looser than any which a single definition, however nuanced and complex, would impose:
    step1: |-
      Beaudry 承认，即使开放式进路也有证据上的约束，但这些约束远比任何单一定义（无论多么细致复杂）会施加的约束宽松：
    step2: |-
      Beaudry 承认为，即便是开放式进路也受证据约束，只是这些约束远比任何单一定义（无论多么细致、复杂）所强加的约束要宽松得多：
  - id: 107
    kind: body
    source: |-
      > Disability remains a term that at least denotes or connotes “abnormal embodiments”, including phenomena entirely external to the bodies of “disabled persons” (such as prejudices directed at imagined abnormal embodiments or strictly cultural artifacts). It is a useful commonality between a constellation of discourses that relate to objects that are at least united by this family resemblance and may overlap or interact with each other, even though it is unlikely that a “master theory” would neatly choreograph all such interactions. (Beaudry 2020: 17)[^beaudry-2020]
    step1: |-
      > 残疾仍然是一个至少指称或蕴涵“异常身体体现”的术语，其中包括完全外在于“残疾人”身体的现象（例如针对想象出的异常身体体现的偏见，或严格意义上的文化人造物）。它是一组话语之间有用的共同点，这些话语所涉及的对象至少由这种家族相似性联合起来，并可能彼此重叠或相互作用——尽管不太可能有一个“总括理论”会整齐地编排所有这些相互作用。（Beaudry 2020: 17）[^beaudry-2020]
    step2: |-
      > 残疾仍是一个至少指称或暗含“异常身体体现”的术语，其中也包括完全外在于“残疾人”身体的现象（比如针对想象出来的异常身体体现的偏见，或严格意义上的文化人造物）。它是一组彼此相关的话语之间有用的共同点：这些话语的对象至少因这种家族相似性而相连，并且可能相互重叠、相互作用——尽管未必会有什么“总括理论”把所有这些相互作用编排得井井有条。（Beaudry 2020: 17）[^beaudry-2020]
  - id: 108
    kind: body
    source: |-
      This deflationary pluralism, however, arguably overlooks the value of continuing to seek a single unified or core definition of disability, however unlikely we are to agree on one. Most philosophers who have taken this tack do so not on the supposition that “disability” or even “impairment” are natural kinds—objective properties that legal and regulatory definitions ought to track. Rather, they are largely motivated by a belief that there is a set of personal experiences and social responses that people with disabilities have in common, and that ways of precisifying the meaning of “disability” and “impairment” are likely to work better than others for purposes of framing policies and building political movements to address, as a group, the moral and political needs and claims of individuals sharing such personal experiences.
    step1: |-
      然而，这种紧缩式多元主义可以说忽略了继续寻求单一统一或核心残疾定义的价值——无论我们多么不可能就此达成一致。多数采取这一路线的哲学家，并不是假定“残疾”甚至“损伤”是自然种类——即法律与监管定义应当追踪的客观属性。相反，他们的动机很大程度上来自一个信念：存在一组残疾人共同拥有的个人经验与社会回应，并且，为了制定政策、建立政治运动，以群体方式回应共享此类个人经验的个体的道德与政治需要及主张，把“残疾”与“损伤”的含义精确化的某些方式，很可能比其他方式更管用。
    step2: |-
      然而，这种紧缩式多元主义可以说忽略了另一件事的价值：继续寻求一个单一而统一的、或核心的残疾定义——尽管我们极不可能就某个定义达成一致。采取这条路线的大多数哲学家，其出发点并不是假定“残疾”、甚至“损伤”属于自然种类，即法律与监管定义应当追踪的客观属性。相反，他们的动机主要来自一个信念：存在一组残疾人所共有的个人经验与社会回应；而且，为了制定政策、建立政治运动，以群体的方式回应共享这类个人经验的个体的道德与政治需要及主张，把“残疾”与“损伤”的含义加以精确化的某些做法，很可能比其他做法更管用。
  - id: 109
    kind: body
    source: |-
      Whether and to what extent the practical aims these various models of disability seek to serve are best accomplished by many separate contextual definitions, or one sophisticated one is, in the final analysis itself likely to be a difficult ethical, even political, question. Proponents of social constructionist, ameliorative views of disability, like proponents of similar views of race and gender, have tended to think that there are good practical reasons to define these notions broadly, to draw attention to forms of injustice that many experience, together, as a means for building larger and thus more powerful coalition to push for positive change. And they have, or anyway could, argue that the flexibility and inclusiveness pluralists call for can be accommodated by an open-minded and sensitive debate over just what this one solidaristic definition should or should not include. They might be right, or they might be wrong, but if they are wrong, it is not because the philosophical and political project of offering a unifying definition is *a priori* misguided.
    step1: |-
      这些形形色色的残疾模型所要服务的实践目标，究竟在多大程度上最好由许多分开的语境化定义来实现，还是由一个精巧的定义来实现——归根结底，这本身很可能就是一个困难的伦理问题，甚至是政治问题。残疾的社会建构论式改良观的支持者，如同种族与性别类似观点的支持者，往往认为有良好的实践理由把这些概念宽泛地定义，以引起人们对许多人共同经历的不义形式的注意，借此建立更大、因而更有力的联盟，推动积极变革。而且他们已经——或无论如何可以——论证：多元主义者所要求的灵活性与包容性，可以通过一场开明而敏感的辩论来容纳，辩论的主题正是这一个团结性定义应当或不应当包含什么。他们可能是对的，也可能是错的；但若他们错了，并不是因为提供统一定义的哲学与政治事业*先验地*就错了。
    step2: |-
      这些各色残疾模型所要服务的实践目标，究竟在多大程度上最好由许多各自独立的语境化定义来实现，还是由一个精致的定义来实现——归根结底，这本身很可能就是一个困难的伦理问题，甚至政治问题。主张残疾的社会建构论式改良观的人，就像主张种族与性别类似观点的人一样，往往认为有充分的实践理由把这些概念宽泛地界定下来，以便引起人们对许多人共同经历的不义形式的注意，从而建立更大、也更有力的联盟去推动积极变革。他们也已经——或至少可以——论证：多元主义者所要求的灵活性与包容性，完全可以由一场开明而敏感的辩论来容纳，而辩论的主题正是这一个团结性定义应当或不应当包含什么。他们可能对，也可能错；但即便错了，也不是因为提供统一定义的哲学与政治事业*先验地*就误入歧途。
