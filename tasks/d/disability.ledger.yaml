      Through much of the first two decades of this century, philosophers were largely content with this definitional approach to disability as a relationship or interaction, disagreeing primarily on the comparative contribution of the two elements and the policy relevance of their contributions. As noted in the last section, dissenters mainly focused on the characterization of one or both elements, as, e.g., on the first as social vs. biological, rather than on the “anatomy” itself. More recently, however, there has been some movement away from reliance on these two-part approaches to defining disability (e.g., Barnes 2016, and much of the literature responding)[^barnes-2016]. One reason may be that in most settings, we do not think of or refer to disabilities as relationships or interactions, but as individual somatic or psychic traits, states or conditions (including absences and deficiencies). These commonsense referents are hard to find in, for example, the multifactorial charts by which the ICF illustrates its definition of disability as a complex interaction of health conditions with environmental, social, and personal factors.
    step1: |-
      本世纪头二十年的大部分时间里，哲学家大体满足于这种把残疾定义为一种关系或交互作用的进路，主要分歧在于两个要素的相对贡献以及这些贡献的政策相关性。如上一节所述，异议者主要关注一个或两个要素的刻画（例如把第一个要素刻画为社会性的还是生物性的），而不是“解剖学”本身。然而晚近以来，出现了一些远离依赖这种两分进路来定义残疾的动向（如 Barnes 2016 及大量回应文献）[^barnes-2016]。一个原因也许是：在多数场合，我们并不把残疾想成或说成关系或交互作用，而想成个体的身体或心理特征、状态或状况（包括缺失与不足）。这些常识性的指称对象，很难在例如 ICF 用来图解其残疾定义的多因素图表中找到——该定义把残疾说成健康状况与环境、社会及个人因素的复杂交互作用。
