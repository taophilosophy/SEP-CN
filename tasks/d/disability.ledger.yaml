      Another objection is that the social as well as the medical model both rest on a false dichotomy between biological impairments and social limitations. There are two versions of this objection. One maintains that disability is a complex phenomenon, in which biological impairment and social exclusion are deeply interwoven and difficult to tease apart (Martiny 2015; Anastasiou & Kauffman 2013)[^anastasiou-2013][^martiny-2015]. The other version of this objection rejects the treatment of impairment as a (strictly) biological phenomenon. “Impairment”, the argument goes, is no less a social construction than the barriers faced by people so classified (more on this below). Claims that there is a stable biomedical basis for classifying a variation as an impairment are called into question by shifting classifications; by the “medicalization” of some conditions (shyness) and “demedicalization” of others (homosexuality). Moreover, the social environment appears to play a significant role in identifying and, arguably, in constituting some impairments (dyslexia) (Cole 2007; Shakespeare 2006; L. Davis 2002: Ch 1; Tremain 2001, 2017; Amundson 2000)[^amundson-2000][^cole-2007][^davis-2002][^shakespeare-2006][^tremain-2001]. What counts as an impairment may depend on which variations appear to be disadvantageous in familiar or salient environments, or on which variations are subject to social prejudice: Less-than-average height may be more readily classified as an impairment than greater-than-average height because the former is more often disadvantageous in environments designed for people of average height, or because it is generally seen as less desirable. For such reasons, it is difficult to establish the objectivity of the impairment classification by appeal to a clear and undisputed biomedical norm. Amundson (2000), indeed, goes so far as to deny that there is any biological basis for a concept of functional normality—a claim emphatically rejected by Boorse (2010).
    step1: |-
      另一个反对意见是：社会模型与医学模型都建立在生物损伤与社会限制之间的虚假二分之上。这一反对意见有两个版本。一个版本主张，残疾是复杂的现象，生物损伤与社会排斥在其中深度交织，难以拆开（Martiny 2015; Anastasiou & Kauffman 2013）[^anastasiou-2013][^martiny-2015]。另一个版本反对把损伤当作（严格意义上的）生物现象。“损伤”这一说法，并不比被如此归类的人所面临的障碍更少社会建构（详见后文）。把某种变异归类为损伤有稳定的生物医学基础吗？这种主张受到质疑：分类本身在变；某些状况（羞怯）被“医学化”，另一些（同性恋）被“去医学化”。此外，社会环境似乎在识别、并且可以说在构成某些损伤（阅读障碍）方面起重要作用（Cole 2007; Shakespeare 2006; L. Davis 2002: Ch 1; Tremain 2001, 2017; Amundson 2000）[^amundson-2000][^cole-2007][^davis-2002][^shakespeare-2006][^tremain-2001]。什么算损伤，可能取决于哪些变异在熟悉或显著的环境中显得不利，或者取决于哪些变异遭到社会偏见：低于平均的身高比高于平均的身高更容易被归为损伤，因为前者在按平均身高设计的环境中更常带来不利，或者因为前者一般被认为不那么可取。由于这些原因，很难诉诸清晰而无争议的生物医学规范来确立损伤分类的客观性。事实上，阿蒙森（Amundson 2000）走得如此之远，以至于否认功能正常性概念有任何生物学基础——伯尔斯（Boorse 2010）断然拒绝了这一主张。
