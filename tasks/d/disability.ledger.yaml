      ### 1.2 An Affirmative Model?
    step1: TBD
    step2: TBD
  - id: 22
    kind: body
    source: |-
      The debate between the medical and social model about the source of the disadvantages disabled people experience has dominated academic discourse about disability since the 1970s. More recently, however, disability activists and disabled scholars have questioned the apparent shared assumption of both models, that disability is fundamentally a matter of disadvantage, exclusion, or functional limitation. This is to take a (partly) different view on what an account of disability should explain; a view consistent in principle with either a more medical or more social view of what does the explaining. The *affirmative model* of disability and impairment, as articulated by John Swain and Sally French (2000), holds that disability is not in the first instance a problem—not simply or solely a “personal tragedy”, and implicitly, not simply or solely a social injustice either. Rather, disability is a different way of living in and experiencing the world, one not characterized by its disadvantages any more than its advantages.
    step1: TBD
    step2: TBD
  - id: 23
    kind: body
    source: |-
      Note that this is not a claim about what causally explains disability; rather, it is a claim about what aspects of the phenomenon of disability should serve as the object of explanation in social scientific theories of disability. As such, the affirmational model is *prima facie* consistent with either the medical or the social model, and indeed tends to draw on considerations from both. The diverse mix of advantages and disadvantages that characterize life with disability can derive from biological factors, social factors, or interactions between the two. On the side of advantage, a person with a disability like blindness might celebrate the increased attention sightlessness saves for hearing and other senses as well as the solidarity they experience with other disabled people as they fight together against ableism and for social justice. On the side of disadvantage, the affirmational model will point to the considerations some would regard as personal tragedies as, instead, a combination of purely functional challenges to be overcome, and conditions of social exclusion that can make life harder without thereby making it any less valuable or worth living.
    step1: TBD
    step2: TBD
  - id: 24
    kind: body
    source: |-
      Still, though logically independent of claims about the evaluative import of disability, the medical and social models suggest different views about the impact of disability on well-being, and different views about how disability is relevant to reproductive decisions, medical interventions, and social policy. The affirmational model is likely to be more in sympathy with social than medical models here. Those who accept a social model of disability regard the association between disability and well-being as highly contingent, mediated by a variety of environmental and social factors (Campbell & Stramondo 2017)[^campbell-2017]. They also tend to question conceptions of well-being that give a central role to the possession or exercise of the standard array of physical and mental functions, as those conceptions imply, or are often taken to imply, that well-being is precluded or diminished merely by the absence or limitation of those functions (see entry disability and well-being). As a result, they generally see the disadvantages of disability not only as externally caused, but as less formidable than they appear to people who view disability in largely biomedical terms. These differences are reflected in the conflicting assessments of life with disabilities found in the bioethics and public policy literature on the one hand, and disability scholarship on the other (contrast Brock 2005 with Goering 2008)[^brock-2005][^goering-2008].
    step1: TBD
    step2: TBD
  - id: 25
    kind: body
    source: |-
      ### 1.3 Models, Decisions, and Policies
    step1: TBD
    step2: TBD
  - id: 26
    kind: body
    source: |-
      The different models of disability—and particularly, the medical and social models—have always been interpreted as favoring different responses to disability. The medical model appears to support the correction of the biological condition (or some form of compensation when that is impractical); the minority group model appears to favor measures to eliminate exclusionary practices or at least recognize their injustice; the human variation model appears to favor reconstruction of the physical and social environment to take into account a wider range of differences in human structure and function (measures that could in turn make the social environment less exclusionary).
    step1: TBD
    step2: TBD
  - id: 27
    kind: body
    source: |-
      But claims about the causal explanation of disadvantage do not always yield straightforward prescriptions for their remediation (Wasserman 2001; Samaha 2007; Barclay 2018)[^barclay-2018][^samaha-2007][^wasserman-2001]. In some cases, medical or surgical “correction” may be the most effective way to escape discrimination; if correction is not appropriate, that is because it reinforces discriminatory attitudes and practices, not because it is discriminatory *per se*. Even an affirmational model does not straightforwardly imply that we should change society rather than disabled bodies: that disabled people have reason to be proud of their disabilities and/or impairments does not immediately entail claims in justice on the rest of us to incur the costs of accommodating these differences. This is to be expected: the proper response to the disadvantages associated with disability depends not only on causal attributions and prudential evaluations, the domains of the three “models”, but also on moral judgments about responsibility, respect, and justice.
    step1: TBD
    step2: TBD
  - id: 28
    kind: body
    source: |-
      This is not to say that these causal attributions, much less prudential judgments, are morally irrelevant: to the extent that social causation of disability disadvantage makes social institutions *morally responsible* for the limitations disabled people face, it may be unfair and disrespectful for society to ask disabled people to change themselves rather than changing itself to be more inclusive (Aas 2020)[^aas-2020]. Moreover, “correcting” disability may (as the affirmational model reminds us) involve destroying valuable forms of life and reducing the vibrant diversity of human embodiment; or it may not do enough to counterbalance the benefits of uniformity (Garland-Thomson 2012)[^garland-thomson-2012]. *Contra* the sense that the social, medical, and affirmational models each come bundled with obvious policy consequences, it seems clear on reflection that there is much yet to do to understand just what these different explanations of disability imply as to how we should respond to it.
    step1: TBD
    step2: TBD
