      Modal logic is the second topic where we have evidence about the positions of Philo and Diodorus and their influence on the Stoics (Kneale and Kneale 1962, 117–28; Bobzien 1993; de Harven 2016)[^bobzien-1993][^harven-2016][^kneale-1962]. Although the modalities were generally discussed under the heading of ‘On things possible’, the Hellenistic modal systems were each built on a set of four modalities: possibility, impossibility, necessity and non-necessity. The matter of dispute was which system was the right one; that is, which one adequately described the modalities inherent in the world. In connection with this, an extra-logical concern provided additional fuel to the debate: the belief that if propositions stating future events that will not happen all turn out to be impossible, the freedom and choices of individuals would be curtailed. This is a variation on the problem of logical determinism which is known from Aristotle’s *On Interpretation* 9. Several of the arguments devised and discussed by the Dialectical School touch upon this issue — the Reaper Argument, the Lazy Argument (Bobzien 1998, 78–81, 180–233)[^bobzien-1998], and the Master Argument.
    step1: |-
      模态逻辑是我们拥有关于菲洛与狄奥多罗斯立场及其对斯多亚派影响之证据的第二个论题（Kneale and Kneale 1962, 117–28; Bobzien 1993; de Harven 2016）[^bobzien-1993][^harven-2016][^kneale-1962]。虽然诸模态一般都在“论可能的事物”这一标题下讨论，希腊化的诸模态系统各自都建立在一组四个模态之上：可能性、不可能性、必然性与非必然性。争端在于哪个系统是正确的系统；也就是说，哪一个恰当地描述了世界固有的诸模态。与此相关，一个逻辑之外的关切为争论添了柴：人们相信，如果陈述不会发生之未来事件的命题全都被证明是不可能的，个人的自由与选择就会受到削减。这是源自亚里士多德《解释篇》第9章的逻辑决定论问题的一个变体。辩证学派设想并讨论过的若干论证触及这个问题——收割者论证、懒惰论证（Bobzien 1998, 78–81, 180–233）[^bobzien-1998]，以及主论证。
    step2: |-
      模态逻辑是第二个论题：我们拥有关于菲洛与狄奥多罗斯的立场及其对斯多亚派影响的证据（Kneale and Kneale 1962, 117–28; Bobzien 1993; de Harven 2016）[^bobzien-1993][^harven-2016][^kneale-1962]。诸模态虽一般在“论可能的事物”这一标题下讨论，但希腊化的诸模态系统各自都建立在一组四个模态之上：可能性、不可能性、必然性与非必然性。争端在于：哪个系统是正确的系统——也就是说，哪一个恰当地描述了世界固有的诸模态。与此相关，一个逻辑之外的关切为争论添了柴：人们相信，倘若陈述不发生之未来事件的命题全被证明为不可能，个人的自由与选择就会遭到削减。这是逻辑决定论问题的一个变体，问题本身见于亚里士多德《解释篇》第9章。辩证学派设想并讨论过的若干论证触及这个问题——收割者论证、懒惰论证（Bobzien 1998, 78–81, 180–233）[^bobzien-1998]，以及主论证。
