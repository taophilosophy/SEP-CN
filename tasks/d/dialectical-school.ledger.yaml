      The literature on the Reaper argument is not large. Sedley suggests that the Reaper is ‘aimed at showing that it is never logically correct to say “perhaps”’ (Sedley 1977, 98)[^sedley-1977]. For Sedley, the Reaper aims to demonstrate some fact about linguistic usage, namely that one cannot use ‘perhaps’ in a future directed way. Sedley goes on to explain that it seems self-contradictory to say ‘If you will reap, perhaps you will reap and perhaps you will not reap’, but equally self-contradictory to say ‘If you will not reap, perhaps you will reap and perhaps you will not reap’. But bivalence commits you to one or other antecedent. The only way out of the bind would be to abandon the use of ‘perhaps’, at least in a sense that expresses future-directed uncertainty.
    step1: |-
      关于收割者论证的文献并不算多。塞德利提示，收割者论证“旨在表明：说‘也许’在逻辑上永远是不恰当的”（Sedley 1977, 98）[^sedley-1977]。对塞德利而言，收割者论证旨在证明关于语言用法的某个事实，即人们不能以面向未来的方式使用“也许”。塞德利接着解释说，说“如果你将收割，那么也许你将收割、也许你将不收割”似乎自相矛盾，但说“如果你将不收割，那么也许你将收割、也许你将不收割”同样自相矛盾。但二值原则使你必定接受两个前件之一。走出这一困境的唯一办法就是放弃“也许”的使用，至少是在表达面向未来的不确定性的那种意义上。
    step2: |-
      关于收割者论证的文献并不多。塞德利提示：收割者论证“旨在表明，说‘也许’在逻辑上永远是不恰当的”（Sedley 1977, 98）[^sedley-1977]。在塞德利看来，收割者论证意在证明一个关于语言用法的事实：人们不能以面向未来的方式使用“也许”。他接着解释：说“如果你将收割，那么也许你将收割、也许你将不收割”似乎自相矛盾，而说“如果你将不收割，那么也许你将收割、也许你将不收割”同样自相矛盾；但二值原则使你必居两个前件之一。走出这一困境的唯一办法，是放弃“也许”的使用——至少在表达面向未来的不确定性这一意义上。
