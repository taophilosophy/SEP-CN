      At the time of Diodorus and Philo, a distinction between simple and non-simple propositions was in circulation among the minor Greek Socratic philosophical sects (Sextus Empiricus [SE] *Against the Logicians* 2.93–95). There is some dispute over whether this reference is to the Dialectical School, or merely to dialecticians in general (Ebert 1991; Barnes 1993)[^barnes-1993][^ebert-1991]. Following the Dialecticians, the Stoics divided simple propositions into affirmations and negations (DL 7.68; SE, *Against the Logicians* 2.93–95). Among non-simple propositions, which were thought to be composed of simple ones, conditionals, disjunctions and conjunctions were distinguished. Disjunctions or conditionals featured as premises in many of the logical paradoxes and sophisms which members of the Dialectical School discussed. It is likely that Diodorus and Philo examined the truth-conditions of all three kinds of non-simple propositions; however, we know their views only for the case of the conditional (see below Section 3).
    step1: |-
      在狄奥多罗斯与菲洛的时代，简单命题与非简单命题的区分已流行于次要的希腊苏格拉底哲学宗派之间（塞克斯都·恩披里柯 [SE]《驳逻辑学家》2.93–95）。关于这一所指是否为辩证学派、还是仅泛指辩证家，存在一些争议（Ebert 1991; Barnes 1993）[^barnes-1993][^ebert-1991]。追随辩证家，斯多亚派把简单命题分为肯定与否定（DL 7.68；SE《驳逻辑学家》2.93–95）。在非简单命题——它们被认为由简单命题构成——之中，又区分出条件句、析取式与合取式。析取式或条件句作为前提出现在辩证学派成员讨论的许多逻辑悖论与诡辩之中。狄奥多罗斯与菲洛很可能考察过全部三类非简单命题的真值条件；然而，我们对他们观点的了解仅限于条件句情形（见下文第3节）。
    step2: |-
      狄奥多罗斯与菲洛的时代，简单命题与非简单命题之分已流行于各次要的希腊苏格拉底哲学宗派之间（塞克斯都·恩披里柯 [SE]《驳逻辑学家》2.93–95）。至于这一所指是辩证学派、还是仅泛指辩证家，尚有争议（Ebert 1991; Barnes 1993）[^barnes-1993][^ebert-1991]。斯多亚派追随辩证家，把简单命题分为肯定与否定（DL 7.68；SE《驳逻辑学家》2.93–95）。非简单命题被认为由简单命题构成；在其中，又区分出条件句、析取式与合取式。辩证学派成员讨论的许多逻辑悖论与诡辩，都以析取式或条件句为前提。狄奥多罗斯与菲洛很可能考察过全部三类非简单命题的真值条件；然而我们对其观点的了解，仅限于条件句情形（见下文第3节）。
