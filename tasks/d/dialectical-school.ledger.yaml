  - id: 6
    kind: body
    source: |-
      1. We should distinguish a ‘lineage’ (*diadoche*) from a ‘sect’ (*hairesis*), which are the two main ways ancient historiographers grouped philosophers. The first is the genealogy of a philosopher in terms of teacher-student relationships. The second is a ‘school’ in the sense of set of philosophers with a shared core of doctrines, and some institutional connection, for example a series of scholarchs. Everyone agrees that Diodorus and Philo are in the lineage of Euclides of Megara.
      2. There was a Megaric Sect, which included at least Euclides and Stilpo of Megara.
      3. There was a Dialectical Sect, identified by 4th and 3rd century contemporaries, which was not just a phase of or part of the Megaric sect. It included Diodorus and Philo.
      4. The Dialectical Sect was one of the ten ethical sects identified by Diogenes Laertius (DL 1.19).
    step1: |-
      1. 我们应当区分“师承”（*diadoche*）与“宗派”（*hairesis*），这是古代史家编组哲学家的两种主要方式。前者就师生关系给出一位哲学家的谱系。后者则是“学派”在如下意义上的用法：一群拥有共同核心学说的哲学家，再加上某种制度性关联，例如一脉相承的历任学长（scholarch）。所有人都同意，狄奥多罗斯与菲洛属于麦加拉的欧克里德的师承。
    step2: |-
      1. 应当区分“师承”（*diadoche*）与“宗派”（*hairesis*）——这是古代史家编组哲学家的两种主要方式。前者依师生关系给出一位哲学家的谱系；后者则是在如下意义上的“学派”：一群拥有共同核心学说的哲学家，并带有某种制度性关联，例如一脉相承的历任学长（scholarch）。狄奥多罗斯与菲洛属于麦加拉的欧克里德的师承——这一点人人同意。
