      Philo’s criterion for the truth of a conditional is truth-functional. Later in antiquity, it was generally accepted as a minimal condition for the truth of a conditional. Philo maintained that a conditional is false when and only when its antecedent is true and its consequent false, and true in the three remaining cases: whenever the antecedent is false, and when both antecedent and consequent are true (SE, *Against the Logicians* 2.113–114). Thus, the Philonian conditional is false only in cases like ‘if it is day, it is night’, since when it is day, ‘it is day is true, but ‘it is night’ is false (SE *Against the logicians* 2.115).Thus this notion of a conditional comes very close to that of modern material implication (Hurst 1935, 485; Heal 2022)[^heal-2022][^hurst-1935]. (It is not the same, since truth for Hellenistic philosophers is relativized to times.) Philo’s suggestion is remarkable in that it deviates noticeably from the ordinary language understanding of conditional sentences and requires abstraction on the basis of a concept of truth-functionality.
    step1: |-
      菲洛关于条件句为真的判准是真值函项性的。在古代晚期，它被普遍接受为条件句为真的最低条件。菲洛主张：一个条件句为假，当且仅当其前件为真而后件为假；在其余三种情形下为真：前件为假时，以及前件与后件都为真时（SE《驳逻辑学家》2.113–114）。因此，菲洛式条件句只在诸如“如果现在是白天，那么现在是夜晚”这类情形下为假，因为白天时，“现在是白天”为真，而“现在是夜晚”为假（SE《驳逻辑学家》2.115）。于是，这种条件句概念与现代实质蕴涵非常接近（Hurst 1935, 485; Heal 2022）[^heal-2022][^hurst-1935]。（二者并不相同，因为希腊化哲学家的真值是相对于时间的。）菲洛的构想之引人注目在于：它明显偏离了对条件句的日常语言理解，并且要求基于真值函项性概念进行抽象。
