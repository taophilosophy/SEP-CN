    source: |-
      Like the Master Argument, the Reaper Argument emerged from the Dialectical School and appears to argue against future contingencies. Unlike the Master Argument, we have good evidence for how the argument was formulated. Our main source for the detail of the Reaper argument is Ammonius’ commentary on Aristotle’s *De Interpretatione* 9, in the 5th century of our era. But the Reaper argument had a long history. Zeno of Citium, the founder of Stoicism, paid good money for seven versions of the argument (DL 7.25 (part)= LS 31M=*SVF* 1.279). Zeno learned the argument from an unnamed dialectician. Usually scholars take it this to be a member of the Dialectical School. DL 7.44 lists the Reaper alongside the Veiled Man, the Horned Man and the No Man, and DL 2.111 gives Diodorus as the author of the Veiled and Horned arguments. Aside from school affiliation and the tenuous connection in DL, the content of the argument has suggested that Diodorus may have authored, or at least deployed, the Reaper as a companion to the Master Argument (Sedley 1977, 98; Seel 1993, 317–18; Bobzien 1998, 79–86; Sorabji 2014, 4–5)[^bobzien-1998][^sedley-1977][^seel-1993][^sorabji-2014].
    step1: |-
      与主论证一样，收割者论证出自辩证学派，并且似乎论证反对未来的偶然性。与主论证不同，我们对该论证如何陈述有充分的证据。关于收割者论证细节的主要文献是阿莫尼俄斯于公元5世纪对亚里士多德《解释篇》第9章的注疏。但收割者论证有着漫长的历史。斯多亚学派的创始人、基提翁的塞诺曾出好价钱买下该论证的七个版本（DL 7.25（部分）= LS 31M = *SVF* 1.279）。塞诺从一位无名辩证家那里学得该论证。学者们通常认为此人即辩证学派的一名成员。DL 7.44 将收割者论证与蒙面人论证、有角人论证和无人论证并列，DL 2.111 则把蒙面人论证与有角人论证的作者归于狄奥多罗斯。除了学派归属与 DL 中那条微弱的联系之外，论证的内容本身也提示：狄奥多罗斯可能创作了收割者论证，或至少把它当作主论证的同伴加以部署（Sedley 1977, 98; Seel 1993, 317–18; Bobzien 1998, 79–86; Sorabji 2014, 4–5）[^bobzien-1998][^sedley-1977][^seel-1993][^sorabji-2014]。
    step2: |-
      与主论证一样，收割者论证出自辩证学派，且似乎旨在反驳未来的偶然性。与主论证不同，我们对该论证如何陈述握有充分的证据：其细节的主要文献是阿莫尼俄斯于公元5世纪所作的亚里士多德《解释篇》第9章注疏。但收割者论证源远流长——斯多亚学派的创始人、基提翁的塞诺曾出好价钱买下该论证的七个版本（DL 7.25（部分）= LS 31M = *SVF* 1.279）。塞诺从一位无名辩证家处学得该论证；学者们通常认为此人即辩证学派的一员。DL 7.44 把收割者论证与蒙面人论证、有角人论证、无人论证并列；DL 2.111 则把蒙面人与有角人两论证的作者归于狄奥多罗斯。除学派归属与 DL 中那条微弱的联系之外，论证的内容本身也提示：狄奥多罗斯可能创作了收割者论证，或至少把它当作主论证的同伴加以部署（Sedley 1977, 98; Seel 1993, 317–18; Bobzien 1998, 79–86; Sorabji 2014, 4–5）[^bobzien-1998][^sedley-1977][^seel-1993][^sorabji-2014]。
