  - id: 3
    kind: body
    source: |-
      The name ‘Dialectical School’ is used for a group of philosophers active from the later 4th to the mid 3rd centuries BC who are referred to as members of the Dialectic sect (*hairesis*) or as dialecticians (*dialektikoi*) in some later ancient sources (Diogenes Laertius [DL] 1.19). Together with the Megarics, Cyrenaics and Cynics, the Dialecticians count among the minor Socratic schools. Their main philosophical interest was in dialectical skill and accomplishment, including the development and resolution of logical paradoxes. They also made several important positive contributions to the development of propositional logic.
    step1: |-
      “辩证学派”这一名称用于指称活跃于公元前4世纪晚期至公元前3世纪中叶的一群哲学家；在一些较晚的古代文献中，他们被称为辩证宗派（*hairesis*）的成员，或被称为辩证家（*dialektikoi*）（第欧根尼·拉尔修 [DL] 1.19）。与麦加拉学派、昔勒尼学派和犬儒派一道，辩证家们属于次要的苏格拉底学派。他们主要的哲学兴趣在于论辩的技艺与成就，包括逻辑悖论的发展与解决。他们还为命题逻辑的发展做出了若干重要的积极贡献。
    step2: |-
      “辩证学派”这一名称用于指称活跃于公元前4世纪晚期至公元前3世纪中叶的一群哲学家；在一些较晚的古代文献中，他们或被称为辩证宗派（*hairesis*）的成员，或被称为辩证家（*dialektikoi*）（第欧根尼·拉尔修 [DL] 1.19）。与麦加拉学派、昔勒尼学派、犬儒派一道，辩证家属于次要的苏格拉底学派之列。其主要的哲学兴趣在论辩的技艺与成就，包括逻辑悖论的构造与化解。他们还为命题逻辑的发展做出了若干重要的积极贡献。
  - id: 4
    kind: body
    source: |-
      The Dialecticians were traditionally counted among the philosophers of the Megaric School, founded by Euclides of Megara, author of Socratic dialogues (Grote 1885, 1:140; M. Kneale 1937; Mates 1953; Prior 1955; W. C. Kneale and Kneale 1962, 117)[^grote-1885][^kneale-1937][^kneale-1962][^mates-1953][^prior-1955]. In antiquity, the best-known figure from the Megaric School was Stilpo, who, like Euclides, was a native of Megara. For reasons that will become clear, scholars now typically use ‘Mergaric’ as the adjective describing a philosophical grouping or position, while reserving ‘Megarian’ as an adjective describing an origin in city of Megara (the same distinction is marked in Ancient Greek). More recent scholarship has placed Diodorus and Philo in a Dialectical School, separate from the Megaric School (Sedley 1977, 75 followed by Bobzien 2011; Algra 1999, 47; Ebert 1991; Ebert 2008)[^algra-1999][^ebert-1991][^ebert-2008][^sedley-1977]. In fact, disagreement over the existence of a Dialectical Sect went back to antiquity. Diogenes Laertius holds that the Dialecticians are a separate ‘ethical’ sect, founded by Clinomachus, but tells us that an earlier historian, Hippobotus, does not think the Dialectical is a separate sect (DL 1.19).
    step1: |-
      在传统上，辩证家们被归入麦加拉学派的哲学家之列；该学派由麦加拉的欧克里德（Euclides of Megara）创立，后者是苏格拉底式对话的作者（Grote 1885, 1:140; M. Kneale 1937; Mates 1953; Prior 1955; W. C. Kneale and Kneale 1962, 117）[^grote-1885][^kneale-1937][^kneale-1962][^mates-1953][^prior-1955]。在古代，麦加拉学派最著名的人物是斯提尔波（Stilpo），他与欧克里德一样是麦加拉人。其中的缘由下文自明：学者们如今通常以“Megaric（麦加拉派）”一词作形容词，指哲学上的群体或立场，而以“Megarian（麦加拉的）”专指出身于麦加拉城者（古希腊语中同样标示这一区分）。较晚近的研究则将狄奥多罗斯与菲洛置于一个独立于麦加拉学派的辩证学派之中（Sedley 1977, 75，Bobzien 2011 随后采纳；Algra 1999, 47; Ebert 1991; Ebert 2008）[^algra-1999][^ebert-1991][^ebert-2008][^sedley-1977]。事实上，关于辩证宗派是否存在的分歧可以追溯到古代。第欧根尼·拉尔修认为，辩证家是一个单独的“伦理”宗派，由克利诺马科斯（Clinomachus）创立；但他同时告诉我们，更早的历史家希波博图斯（Hippobotus）并不认为辩证派是一个单独的宗派（DL 1.19）。
    step2: |-
      传统上，辩证家被归入麦加拉学派的哲学家之列。该学派由麦加拉的欧克里德（Euclides of Megara）创立，此人是苏格拉底式对话的作者（Grote 1885, 1:140; M. Kneale 1937; Mates 1953; Prior 1955; W. C. Kneale and Kneale 1962, 117）[^grote-1885][^kneale-1937][^kneale-1962][^mates-1953][^prior-1955]。古代麦加拉学派中最著名的人物是斯提尔波（Stilpo），与欧克里德一样，他也是麦加拉人。个中缘由下文自明：如今的学者通常用“Megaric（麦加拉派）”作形容词，指哲学上的群体或立场，而把“Megarian（麦加拉的）”留给指出身麦加拉城者的形容词（古希腊语同样标示这一区分）。较晚近的研究则把狄奥多罗斯与菲洛安置在一个独立于麦加拉学派的辩证学派里（Sedley 1977, 75，Bobzien 2011 随后采纳；Algra 1999, 47; Ebert 1991; Ebert 2008）[^algra-1999][^ebert-1991][^ebert-2008][^sedley-1977]。事实上，辩证宗派是否存在的分歧可上溯至古代。第欧根尼·拉尔修认为辩证家是一个单独的“伦理”宗派，由克利诺马科斯（Clinomachus）创立；但他同时告诉我们：更早的历史家希波博图斯（Hippobotus）并不认为辩证派是单独的宗派（DL 1.19）。
