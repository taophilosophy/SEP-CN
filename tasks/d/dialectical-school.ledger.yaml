      Philo’s notion of possibility is often thought to be a broad notion of logical possibility (de Harven 2016, 3–4)[^harven-2016] with the only constraint on a proposition being possible being that it is a matter of logical consistency. Sometimes our sources seem to ground this consistency in the intrinsic features of the subject of that proposition. For example, according to Philo ‘this piece of wood burns at the bottom of the ocean’ is possible, since the intrinsic features of the wood give it the power to burn (Alexander *On Aristotle’s Prior Analytics* 184.7–9; Simplicius *On Aristotle’s Categories* 195,30–196, 3), and, presumably, there is no logical contradiction in saying ‘this piece of wood burns at the bottom of the ocean’. It is just that the extrinsic circumstances of being in the ocean prevent the wood from burning (Bobzien 1993, 77)[^bobzien-1993]. However, it is unclear whether this explanation is wholly adequate, since ‘preventing’ is itself a modal notion, so this explanation of the evidence risks circularity.
    step1: |-
      菲洛的可能性概念常被认为是一种宽的逻辑可能性概念（de Harven 2016, 3–4）[^harven-2016]，一个命题是可能的，其唯一约束条件是它在逻辑上融贯。有时我们的文献似乎把这种融贯性奠定于该命题的主项的内在特征之中。例如，按菲洛，“这块木头在海底燃烧”是可能的，因为木头的内在特征赋予它燃烧的能力（亚历山大《亚里士多德〈前分析篇〉注》184.7–9；辛普里丘《亚里士多德〈范畴篇〉注》195,30–196,3），而且，大概说来，说“这块木头在海底燃烧”并无逻辑矛盾。只不过处在海洋之中这一外在环境阻止了木头燃烧（Bobzien 1993, 77）[^bobzien-1993]。然而，这一解释是否完全恰当并不清楚，因为“阻止”本身就是一个模态概念，所以这种对证据的解释有循环之虞。
