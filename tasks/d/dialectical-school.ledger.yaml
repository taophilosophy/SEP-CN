      Diodorus’ criterion bears some resemblance to the modern concept of strict implication, although the exact relation between Diodorean and strict conditionals is controversial (see Hurst 1935; Mates 1949; Hájek 2009)[^hájek-2009][^hurst-1935][^mates-1949]. What is clear is that Diodorean conditionals share some disadvantages of strict conditionals, in that we encounter a parallel to the ‘paradoxes of strict implication’ (Lemmon 1965, 153–4)[^lemmon-1965]. As in Philo’s case, no connection of content is required between antecedent and consequent. This time, whenever either the antecedent is impossible or the consequent necessary, the conditional will be true, regardless of whether there is any relevant connection between the two constituent propositions. So for instance ‘If the earth flies, Axiothea philosophizes’ would be true for Diodorus, since the antecedent was considered impossible (DL 7.75), while ‘If Axiothena philosophizes, virtue is beneficial’ would be a true Diodorean conditional, since the consequent was considered necessary (DL 7.75) One example given of a Diodorean-true conditional, ‘If it is not the case that there are indivisible elements of things, then there are indivisible elements of things’ (SE, *Outlines of Pyrrhonism* 2.111), suggests that there was some awareness of these paradoxes in antiquity. In any event, the Stoic Chrysippus developed a system of relevance logic in which neither the ‘paradoxes of material implication’ nor the ‘paradoxes of strict implication’ occur.
    step1: |-
      狄奥多罗斯的判准与现代严格蕴涵概念有某些相似之处，尽管狄奥多罗斯式条件句与严格条件句之间的确切关系存在争议（见 Hurst 1935; Mates 1949; Hájek 2009）[^hájek-2009][^hurst-1935][^mates-1949]。清楚的是：狄奥多罗斯式条件句分享严格条件句的某些缺点，我们会遇到与“严格蕴涵悖论”平行的情况（Lemmon 1965, 153–4）[^lemmon-1965]。与菲洛的情形一样，前件与后件之间不要求任何内容关联。这一次，只要前件是不可能的、或后件是必然的，条件句就为真，无论两个组成命题之间是否存在任何相干联系。例如，“如果地球会飞，阿克西奥特亚就在做哲学”对狄奥多罗斯来说会是真的，因为前件被认为是不可能的（DL 7.75）；而“如果阿克西奥特亚在做哲学，那么德性是有益的”会是一个狄奥多罗斯式为真的条件句，因为后件被认为是必然的（DL 7.75）。被举出的一个狄奥多罗斯式为真条件句的例子——“如果事物没有不可分的元素，那么事物有不可分的元素”（SE《皮浪学说概要》2.111）——表明古代对这类悖论已有某种意识。无论如何，斯多亚派的克吕西波发展了一个相干逻辑系统，在其中“实质蕴涵悖论”与“严格蕴涵悖论”都不出现。
    step2: |-
