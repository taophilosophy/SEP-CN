      This statement is based on the idea that if a proposition presently neither is nor will be true, and you step back in time, as it were, then the formerly present ‘not being true’ turns into a future ‘not going to be true’, so that from the point of view of the past, the proposition will never be true, and the corresponding state of affairs will never be the case. (This is assumed to hold at least for the past moment that immediately precedes the present.) This principle has some plausibility to it. There is some evidence that it may have been discussed in antiquity (Becker 1961, 253–5)[^becker-1961].
    step1: |-
      这一陈述基于如下想法：如果一个命题现在既不真也不将真，而你——可以说——向过去退一步，那么先前的“不真”就变成了将来的“将不会真”，于是从过去的观点看，该命题永远不会为真，相应的事态永远不会成立。（这被假定至少对紧邻现在的那个过去时刻成立。）这一原则有某种可信性。有一些证据表明它在古代可能被讨论过（Becker 1961, 253–5）[^becker-1961]。
