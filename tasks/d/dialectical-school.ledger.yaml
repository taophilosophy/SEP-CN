      This is usually understood as implying that the argument was grounded on statements (I) and (II), and had (IV), which is the contradictory of (III), as conclusion; and this is about as far as the passages lead us. But how did the argument run? There is a large and technical literature on the Master Argument and this entry can only offer an orientation to it. We can divide approaches into four groups along two axes, an approach suggested by (Uckelman 2023, 246 [Other Internet Resources]) and (Foster 2008, 21)[^foster-2008]. The first axis is whether the propositions in question are temporally definite or temporally indefinite, particularly in premise (I). The second axis is whether the ‘follows’ relation is a temporal succession relation or a logical consequence relation, particularly in (II). Temporally indefinite propositions are tensed propositions which can change their truth value over time, such as ‘it is day’, a proposition that is true once and false once in each twenty-four hour period. The truth-value of the proposition depends on the time of the valuation. Temporally definite propositions are such that there is an explicit or implicit indexing to a particular time, such as ‘it is day at noon on 31st October 2022’. Such a proposition is, as it were, always true (or false): the truth-value does not depend on the time of evaluation. In terms of ‘follows’, we might interpret (II) as a principle that the passage of time does not affect whether something is possible: once something is possible, it will not become impossible. (Rescher 1966)[^rescher-1966] and (Zeller 1882)[^zeller-1882] take this line. The alternative is to take ‘follows’ as a logical consequence relation. In that case, (II) amounts to the claim that there is not logical entailment from a possible proposition to an impossible one.
    step1: |-
      这通常被理解为暗示：该论证奠基于陈述 (I) 与 (II)，并以 (IV)——(III) 的矛盾命题——为结论；文献段落所能告诉我们的也大致到此为止。但论证究竟是如何进行的？关于主论证已有大量技术性文献，本词条只能提供一个导引。我们可以沿两条轴线把各种进路分为四组，这一分法由 (Uckelman 2023, 246 [其他网络资源]) 与 (Foster 2008, 21) 提出[^foster-2008]。第一条轴线是：相关命题是时间确定的还是时间不定的，尤其在前提 (I) 中。第二条轴线是：“推出”关系是时间相继关系还是逻辑后承关系，尤其在 (II) 中。时间不定命题是时态化命题，可以随时间改变真值，如“现在是白天”——一个在每二十四小时周期内各真一次、各假一次的命题。其真值依赖于赋值的时间。时间确定命题则带有对特定时间的显式或隐式索引，如“2022年10月31日正午是白天”。这种命题可以说是永远为真（或为假）的：其真值不依赖于求值的时间。至于“推出”，我们可以把 (II) 解释为如下原则：时间的流逝不影响某物是否可能：一物一旦可能，就不会变为不可能。（Rescher 1966）[^rescher-1966] 与（Zeller 1882）[^zeller-1882] 采取这条路线。另一种选择是把“推出”当作逻辑后承关系。在那种情况下，(II) 相当于主张：从一个可能命题到不可能命题之间不存在逻辑蕴涵。
    step2: |-
      这通常被理解为暗示：该论证奠基于陈述 (I) 与 (II)，以 (IV)——即 (III) 的矛盾命题——为结论；文献段落所能告诉我们的，也大致到此为止。可论证究竟如何进行？关于主论证已有大量技术性文献，本词条只能提供导引。我们可以沿两条轴线把各种进路分为四组；这一分法见于 (Uckelman 2023, 246 [其他网络资源]) 与 (Foster 2008, 21)[^foster-2008]。第一条轴线：相关命题是时间确定的还是时间不定的，尤其在前提 (I) 中。第二条轴线：“推出”关系是时间相继关系还是逻辑后承关系，尤其在 (II) 中。时间不定命题是时态化命题，可随时间改变真值，如“现在是白天”——在每二十四小时周期内各真一次、各假一次的命题；其真值依赖于赋值的时间。时间确定命题则带有对特定时间的显式或隐式索引，如“2022年10月31日正午是白天”；这种命题可以说永远为真（或为假）：其真值不依赖于求值的时间。至于“推出”，我们可以把 (II) 解释为如下原则：时间的流逝不影响某物是否可能——一物一旦可能，就不会变为不可能。（Rescher 1966）[^rescher-1966] 与（Zeller 1882）[^zeller-1882] 采取这条路线。另一种选择是把“推出”当作逻辑后承关系；在那种情况下，(II) 相当于主张：从可能命题到不可能命题之间不存在逻辑蕴涵。
