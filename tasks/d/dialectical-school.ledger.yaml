      Those later reports give Clinomachus of Thurii, a pupil of Eubulides of Miletus, as founder of the school, but may have been given this title only in hindsight (DL 1.19 and 2.112, Sedley 1977 n.16)[^sedley-1977]. Euphantus of Olyntus, another pupil of Eubulides, probably born before 349 BC, may have been the earliest member of the school. The name ‘Dialectical School’ is reported to have been introduced by its member Dionysius of Chalcedon, active around 320 BC because of the practice of putting arguments in question and answer form (DL 2.106; Castagnoli 2010, 157)[^castagnoli-2010].
    step1: |-
      这些较晚的报道把图里伊的克利诺马科斯（Clinomachus of Thurii）——米利都的欧布里德的门生——当作学派的创立者，但这一头衔可能只是事后追认的（DL 1.19 与 2.112；Sedley 1977 n.16）[^sedley-1977]。奥林托斯的欧凡托斯（Euphantus of Olyntus）是欧布里德的另一名门生，可能生于公元前349年之前，或许是该学派最早的成员。据报道，“辩证学派”这一名称由其成员卡尔克顿的狄奥尼修斯（Dionysius of Chalcedon）引入；他活跃于公元前320年前后，缘由是以问答形式提出论证的做法（DL 2.106；Castagnoli 2010, 157）[^castagnoli-2010]。
    step2: |-
      后世报道把图里伊的克利诺马科斯（Clinomachus of Thurii）——米利都的欧布里德的门生——当作学派创立者；但这一头衔可能只是事后追认（DL 1.19 与 2.112；Sedley 1977 n.16）[^sedley-1977]。欧布里德的另一名门生、奥林托斯的欧凡托斯（Euphantus of Olyntus）可能生于公元前349年之前，或许是学派最早的成员。据报道，“辩证学派”之名由学派成员卡尔克顿的狄奥尼修斯（Dionysius of Chalcedon）引入；此人活跃于公元前320年前后，得名之由是以问答形式提出论证的做法（DL 2.106；Castagnoli 2010, 157）[^castagnoli-2010]。
  - id: 10
    kind: body
    source: |-
      The most important philosopher of the sect is Dionysius’ contemporary, Diodorus Cronus, who taught in Athens and Alexandria around 315–284 BC. He left no writings but is the most influential member of the Dialectical School. Diodorus’ most famous pupil is Zeno of Citium, founder Stoicism. The dialectician Aristides belongs to the same generation as Diodorus Cronus. Alexinus (c. 339–265) may have belonged to the sect. The second important philosopher of the Dialectical School is the logician Philo (sometimes referred to as Philo of Megara, although we do not know his city of origin); he studied with Diodorus. He wrote a dialogue *Menexenos* and possibly a work *On Signs* and a work *On Schemata*. All of these are lost. Diodorus Cronus’ five daughters Menexene, Argeia, Theognis, Artemisia and Pantacleia are all said to have been logicians, and thus may have belonged to the school. Finally, the dialectician Panthoides flourished c.280–275 BC, and the dialecticians Aristoteles and Artemidorus can be dated around 250 BC.
    step1: |-
