      The Reaper Argument certainly originated from within the Dialectical School and argued for fatalism, but was Diodorus himself was the author? Seel suggests that Diodorus was (Seel 1993, 137–38)[^seel-1993]. One difficulty with this attribution is that the notion of contingency in the Reaper argument differs from what we know of Diodorus’ modalities from other sources. For Diodorus, a contingent proposition is one that is true at some future time and false at some future time, so each contingent will be realised. But the Reaper seems to entertain contingents that are never realised. Premises (I) and (II) of the Reaper both commit to the unrealised possibility that you will do something. In the case of premise (I), if you will reap, then it is not the case that perhaps you will reap and perhaps you will not: you will reap anyway. So, the possibility that you will not reap will never be realised. Likewise, premise (II) entertains the possibility that reaping will never be realised. So the Reaper argument seems to operate with a non-Diodorean notion of contingency.
    step1: |-
      收割者论证确实出自辩证学派内部，并为宿命论辩护，但作者是否就是狄奥多罗斯本人？塞尔提示是（Seel 1993, 137–38）[^seel-1993]。这一归属的一个困难在于：收割者论证中的偶然性概念，不同于我们从其他文献中得知的狄奥多罗斯的模态。对狄奥多罗斯而言，一个偶然命题是在未来某时为真且在未来某时为假的命题，因此每个偶然者都会实现。但收割者论证似乎容纳永不实现的偶然者。收割者论证的前提 (I) 与 (II) 都承诺了“你将做某事”这一不会实现的可能性。就前提 (I) 而言，如果你将收割，那么并非也许你将收割、也许你将不收割：你反正都会收割。于是，你将不收割的可能性永远不会实现。同样，前提 (II) 容纳收割永不实现的可能性。所以收割者论证似乎是用一个非狄奥多罗斯式的偶然性概念来运作的。
    step2: |-
      收割者论证确实出自辩证学派内部，并为宿命论辩护；但其作者是否就是狄奥多罗斯本人？塞尔提示是（Seel 1993, 137–38）[^seel-1993]。这一归属有一个困难：收割者论证的偶然性概念，不同于我们从其他文献得知的狄奥多罗斯模态。对狄奥多罗斯而言，偶然命题是在未来某时为真且在未来某时为假的命题，故每个偶然者都会实现；但收割者论证似乎容纳永不实现的偶然者。其前提 (I) 与 (II) 都承诺了“你将做某事”这一不会实现的可能性：就前提 (I) 而言，你若将收割，那么并非也许你将收割、也许你将不收割——你反正都会收割；于是“你将不收割”的可能性永远不会实现。同样，前提 (II) 容纳收割永不实现的可能性。所以收割者论证似乎以一个非狄奥多罗斯式的偶然性概念运作。
