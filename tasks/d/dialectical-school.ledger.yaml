    source: |-
      (3) is the important claim for establishing that there was a separate Dialectical School. Sedley defends (3) with the following argument: Stilpo won over three students ‘from the Dialecticians’ (DL 2.114). Since Stilpo was a member of the Megaric School this must mean that the ‘Dialecticians’ were a separate, and rival, group from Stilpo’s Megaric sect (Sedley 1977, 75–76)[^sedley-1977].
    step1: |-
      (3) 是确立存在一个单独的辩证学派的关键主张。塞德利（Sedley）以下列论证为 (3) 辩护：斯提尔波从辩证家们那里“争取到”三名学生（DL 2.114）。既然斯提尔波属于麦加拉学派，这就必定意味着：“辩证家们”是一个独立于、且与斯提尔波的麦加拉宗派相抗衡的群体（Sedley 1977, 75–76）[^sedley-1977]。
    step2: |-
      (3) 是确立“存在一个单独的辩证学派”的关键主张。塞德利（Sedley）以下列论证为 (3) 辩护：斯提尔波曾从辩证家们那里“争取到”三名学生（DL 2.114）。既然斯提尔波属于麦加拉学派，这就必定意味着“辩证家们”是一个单独的群体，与斯提尔波的麦加拉宗派相抗衡（Sedley 1977, 75–76）[^sedley-1977]。
  - id: 8
    kind: body
    source: |-
      Some try to reject Sedley’s conclusion by admitting that the Dialecticians were a group that was identified in antiquity as separate from the Megaric sect, but the Dialectical group was not, strictly, a sect in the technical sense used by ancient historiographers. The is because the Dialectical group lacked the required institutional framework, such as a succession of scholarchs or core set of doctrines (DL 1.20; Döring 1989, 309; cf. Allen 2018, 44–46)[^allen-2018][^döring-1989]. But, of course, the Megarics also lacked such a structure. On (4), the evidence that the Dialectical group is identical to the Dialecticians mentioned at (DL 1.19), or even that there was such a sect, is weak. Diogenes places the Dialectical sect in a set of ethical sects, but no evidence attributes to any putative member of the sect any ethical views (unless one holds that fatalism is an ethical view). We can safely call Diodorus and Philo Dialecticians in the sense of belonging to a distinctive philosophical group, rival to Stilpo’s circle, but sharing a philosophical genealogy with it. Whether this group was the Dialectical Sect, or a sect at all, in the sense used by ancient historiographers, is less certain because we do not know whether the members of the Dialectical School were connected by an institution comparable to other ancient philosophical schools, or whether their union under one name in later reports was based more loosely on their common philosophical interest in dialectic.
    step1: |-
      有些人试图拒绝塞德利的结论。他们承认，辩证家们在古代被识别为一个独立于麦加拉宗派的群体，但认为辩证群体严格说并非古代史家所用技术意义上的宗派。理由在于：辩证群体缺少所需的制度框架，例如相继承任的学长或一套核心学说（DL 1.20; Döring 1989, 309; 参 Allen 2018, 44–46）[^allen-2018][^döring-1989]。但当然，麦加拉派同样缺少这种结构。至于 (4)，认为辩证群体就是 (DL 1.19) 所提辩证家的同一群体、甚至认为存在这样一个宗派的证据都很薄弱。第欧根尼将辩证宗派置于一组伦理宗派之中，但没有任何证据把任何伦理观点归于该宗派的任何假定成员（除非有人认为宿命论是一种伦理观点）。我们可以稳妥地把狄奥多罗斯与菲洛称作辩证家，就他们属于一个独特的哲学群体而言——这个群体与斯提尔波的圈子相抗衡，但与之共享哲学师承。至于这个群体是否就是古代史家所用意义上的辩证宗派、或究竟是不是一个宗派，就不那么确定了：因为我们不知道辩证学派的成员是否由一种可比于其他古代哲学学派的制度联结在一起，也不知道后来报道中他们在同一名称下的联合，是否只是更松散地基于他们对论辩的共同哲学兴趣。
    step2: |-
      有些人试图拒斥塞德利的结论：他们承认辩证家在古代就被识别为一个独立于麦加拉宗派的群体，但主张辩证群体严格说并非古代史家所用技术意义上的宗派。理由是：辩证群体缺少所需的制度框架，例如相继承任的学长或一套核心学说（DL 1.20; Döring 1989, 309; 参 Allen 2018, 44–46）[^allen-2018][^döring-1989]。可当然，麦加拉派同样缺少这种结构。至于 (4)：认为辩证群体就是 (DL 1.19) 所提辩证家的同一群体、甚至认为存在这样一个宗派的证据都很薄弱。第欧根尼把辩证宗派置于一组伦理宗派之中，却没有任何证据把任何伦理观点归于该宗派的任何假定成员（除非有人把宿命论算作一种伦理观点）。我们尽可稳妥地把狄奥多罗斯与菲洛称作辩证家——就他们属于一个独特的哲学群体而言；这个群体与斯提尔波的圈子相抗衡，又与之共享哲学师承。至于这个群体是否就是古代史家所用意义上的辩证宗派、或究竟是不是一个宗派，则不那么确定：我们既不知道辩证学派的成员是否由一种可比于其他古代哲学学派的制度联结起来，也不知道后世报道把他们统摄在同一名称之下，是否只是更松散地基于他们对论辩的共同哲学兴趣。
