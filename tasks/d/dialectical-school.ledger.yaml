      We do not know what motivated Diodorus to introduce his modal notions.[^note-1]. But we know that Hellenistic philosophers generally regarded Diodorus’ modal notions as jeopardizing freedom, since they rule out the possibility that something that never happens, or is never true, is nonetheless possible. Thus, if ‘Dio goes to Corinth’ is and will be false, then ‘Dio goes to Corinth’ is impossible, and then, or so the thought went, it is impossible for Dio to go to Corinth. In this context it becomes plain why our sources stress the fact that something can be Philonian possible without ever being true or obtaining.This is the relevant difference from Diodorus with respect to logical determinism, the point being that Philo’s modalities, unlike Diodorus’, do not unduly limit the scope of contingency.
    step1: |-
      我们不知道是什么促使狄奥多罗斯引入他的模态概念。[^note-1] 但我们知道，希腊化哲学家普遍认为狄奥多罗斯的模态概念危及自由，因为它们排除了这样一种可能性：某事从不发生、或从不为真，却仍然是可能的。于是，如果“狄翁去科林斯”现在且将永远为假，那么“狄翁去科林斯”就是不可能的，而由此——当时的想法如此——狄翁去科林斯就是不可能的了。在这种语境下，我们的文献为什么强调某物可以是菲洛式可能的、却从不为真或从不成立，就变得清楚了。这正是菲洛与狄奥多罗斯在逻辑决定论问题上的相关差异，要点在于：菲洛的模态不同于狄奥多罗斯的模态，不会不适当地限制偶然性的范围。
    step2: |-
      我们不知道是什么促使狄奥多罗斯引入其模态概念。[^note-1] 但我们知道：希腊化哲学家普遍认为狄奥多罗斯的模态概念危及自由，因为它们排除了这样一种可能——某事从不发生、从不为真，却仍然是可能的。于是，若“狄翁去科林斯”现在且永远为假，“狄翁去科林斯”便是不可能的；而由此——当时的想法如此——狄翁去科林斯便是不可能之事。在这种语境下，我们的文献为何强调某物可以是菲洛式可能的、却从不为真或从不成立，就变得清楚了。这正是菲洛与狄奥多罗斯在逻辑决定论问题上的相关差异，要点在于：菲洛的模态不同于狄奥多罗斯的模态，不会不适当地限制偶然性的范围。
