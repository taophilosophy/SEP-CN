      除了种种逻辑谜题与诡辩之外，只有两个论题我们可以确信辩证学派成员对逻辑做出了积极贡献。这就是狄奥多罗斯与菲洛在条件句理论和模态逻辑上的立场。这两个论题都涉及出了名的困难，且被希腊化逻辑学家广泛而热烈地讨论过，以至于相关争论成了当时知识界通识的一部分（SE《驳语法学家》309–10）。此外，模态理论曾被认为对哲学的其他领域有深远的结果。
