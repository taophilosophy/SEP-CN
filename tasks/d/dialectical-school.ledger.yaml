      Because of these historical constraints, most writers hold that the Master Argument concerns temporally indefinite propositions and that the ‘follows’ relation is a logical consequence relation. This sort of approach was pioneered by Arthur Prior. (Prior 1955)[^prior-1955]. Prior’s reflections on Diodorus’ Master Argument go back to his unpublished manuscript *The Craft of Formal Logic* (Markoska-Cubrinovska 2018)[^markoska-cubrinovska-2018]. For an interesting recent comparison of how Prior and Mates reconstruct the Master Argument see Corpina and Øhrstrøm 2018).
    step1: |-
      由于这些历史约束，大多数作者认为主论证涉及的是时间不定命题，而“推出”关系是逻辑后承关系。这类进路由阿瑟·普赖尔开创（Prior 1955）[^prior-1955]。普赖尔对狄奥多罗斯主论证的思考可以追溯到其未刊稿《形式逻辑的技艺》（Markoska-Cubrinovska 2018）[^markoska-cubrinovska-2018]。关于普赖尔与梅特斯如何重构主论证的有趣的近期比较，见 Corpina and Øhrstrøm 2018）。
