      Where does the argument go wrong? The ancients went in for criticizing (I) and (II), and one may indeed wonder whether (I) covers cases of the kind to which it has been applied above. But there are also a couple of things questionable with (V) and (VI). With a certain continuum theory of time, it turns out that (VI) does not hold for those cases in which the proposition at issue has started to be false only at the present moment (Denyer 1981, 43 and 45)[^denyer-1981]. More importantly, (V) and its variants seem to smuggle in a deterministic assumption. On one or another of these grounds, then, one may attempt to hold the Master Argument unsound, and so to reject Diodorus’ own account of the possible as what either is or will be true.
    step1: |-
      论证在哪里出错了？古人致力于批评 (I) 与 (II)，人们也的确可以追问 (I) 是否涵盖上文应用它的那类情形。但 (V) 与 (VI) 也有几处可疑之处。依据某种连续统时间理论，结果表明 (VI) 对下述情形不成立：所论命题只是在当前这一刻才开始为假（Denyer 1981, 43 与 45）[^denyer-1981]。更重要的是，(V) 及其变体似乎偷偷引入了一个决定论假定。于是，基于这样或那样的理由，人们可以尝试认定主论证不健全，从而拒绝狄奥多罗斯自己关于可能者即或者现在是或者将是真者的说明。
    step2: |-
      论证在哪里出了错？古人致力于批评 (I) 与 (II)；人们也的确可以追问：(I) 是否涵盖上文应用它的那类情形。但 (V) 与 (VI) 同样有可疑之处。依据某种连续统时间理论，结果表明 (VI) 对如下情形不成立：所论命题只是在当前这一刻才开始为假（Denyer 1981, 43 与 45）[^denyer-1981]。更重要的是，(V) 及其变体似乎偷偷引入了决定论假定。于是，基于这样或那样的理由，人们可以尝试认定主论证不健全，从而拒斥狄奥多罗斯自己关于可能者——即或者现在是、或者将是真者——的说明。
