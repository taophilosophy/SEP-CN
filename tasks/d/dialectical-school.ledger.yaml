      We do not know whether Diodorus had his own modal notions in mind when talking about possibility in his criterion, or just some pre-technical, general concept of possibility, or whether he perhaps intended to cover both (Denyer 1981, 39–41; Sedley 1977, 101–2)[^denyer-1981][^sedley-1977]. (The verb used here for being possible, *endechesthai* differs from the word used for possibility in Diodorus’ modal theory, which is *dunaton*.) If one assumes that he had his own modal notions in view when giving this account (see Section 4.2 below), his truth-criterion for the conditional stands in the following relation to Philo’s: a conditional is Diodorean true now if and only if it is Philonian true at all times. Diodorus has, as it were, quantified the Philonian criterion over time. The conditional ‘If I walk, I move’ is now true because at no time is the antecedent true and the consequent false. Thus for Diodorus, a conditional cannot change its truth-value. If it is true (false) at one time, it is true (false) at all times. If on the other hand one assumes that Diodorus had some unspecified general notion of possibility in mind when producing his account, the criterion will be correspondingly less specific. However, it would presumably still be a minimal requirement that it is never the case that the antecedent is true and the consequent false.
    step1: |-
      我们不知道狄奥多罗斯在判准中谈到可能性时，心里想的是否是他自己的那套模态概念，抑或只是某种前技术的、一般的可能性概念，又或者他也许意在两者兼顾（Denyer 1981, 39–41; Sedley 1977, 101–2）[^denyer-1981][^sedley-1977]。（此处用于“可能”的动词 *endechesthai* 不同于狄奥多罗斯模态理论中表示可能性的用词 *dunaton*。）如果假定他在给出这一说明时心里想的是自己的模态概念（见下文4.2节），那么他的条件句真值判准与菲洛的判准处于如下关系之中：一个条件句现在是狄奥多罗斯式为真的，当且仅当它在所有时刻都是菲洛式为真的。狄奥多罗斯可以说就是把菲洛的判准对时间作了量化。条件句“如果我在走，那么我在动”现在为真，因为不存在任何时刻使前件为真而后件为假。因此对狄奥多罗斯来说，一个条件句不能改变其真值。如果它在某一时刻为真（假），它就在所有时刻为真（假）。另一方面，如果假定狄奥多罗斯在提出其说明时心里所想的是某种未特别规定的一般可能性概念，那么该判准也会相应地不那么特定。不过，以下这点大概仍是最低要求：绝不存在前件为真而后件为假的情形。
