      Sedley’s suggestion is interesting, but Ammonius is clear that the argument is supposed to rule out contingents, specifically, future contingents, rather than make a point about linguistic usage. The most in depth discussion of the sources and argument is (Seel 1993)[^seel-1993]. Seel does take the argument to be an attempt to demonstrate fatalism. He takes the conclusion of the argument to be ‘it is not the case that it is now contingent that you will reap and now contingent that you will not reap’. Even if Seel’s reconstruction of the argument is correct, it is not obvious that fatalism results. On Seel’s reading, the conclusion is equivalent to ‘it is now necessary that you will reap or you will not reap’. But that leaves open which of the two options I will take: ‘necessarily (p or not-p)’ does not entail ‘(necessarily *p* or necessarily not-*p*)’.
    step1: |-
      塞德利的提议很有意思，但阿莫尼俄斯明确表示：该论证意在排除偶然者，特别是未来的偶然者，而不是就语言用法提出一个论点。对文献与论证最深入的讨论是（Seel 1993）[^seel-1993]。塞尔确实把该论证当作证明宿命论的一个尝试。他把论证的结论当作“现在你将收割并非是偶然的、现在你将不收割也并非是偶然的”。即便塞尔对该论证的重构是正确的，宿命论也并不明显随之而来。按塞尔的读法，结论等值于“现在必然地：你要么将收割，要么将不收割”。但这仍然留有我将采取两个选项中哪一个是开放的：“必然地（p 或非 p）”并不蕴涵“（必然地 p 或必然地非 p）”。
    step2: |-
      塞德利的提议很有意思，但阿莫尼俄斯说得明白：该论证意在排除偶然者——特别是未来的偶然者——而非就语言用法立论。对文献与论证最深入的讨论是（Seel 1993）[^seel-1993]。塞尔确实把该论证当作证明宿命论的尝试，把结论读作“现在你将收割并非偶然，现在你将不收割也并非偶然”。即便塞尔的重构正确，宿命论也并不明显随之而来：按他的读法，结论等值于“现在必然地，你要么将收割要么将不收割”；但这仍然留有我将采取两个选项中哪一个是开放的——“必然地（p 或非 p）”并不蕴涵“（必然地 p 或必然地非 p）”。
