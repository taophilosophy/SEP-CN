      这里邀请读者查阅那些也许不被称作“哲学”而被称作别的什么——例如宗教研究、民族志、文化人类学与口述历史——的文献，特别是在哲学与宗教学术相互交织的传统中（如伊斯兰哲学以及东亚与印度哲学的某些形式），或者历史与价值以口头而非书面方式传递的传统中（土著与原住民哲学的情形往往如此）。在并不传统地享有西方哲学正典成员资格的群体与人民的文学、诗歌与歌曲中，也有许多值得注意的东西。而且近年来，学术出版物中关于西方与非西方的通俗或社会舞蹈形式的讨论日益增多。
