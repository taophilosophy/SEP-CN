      To wit, dance critic Marcia Siegel famously wrote that dance “exists at a perpetual vanishing point” which, for Siegel, means that dance exists in “an event that disappears in the very act of materializing” (1972: 1). She posits that artistic dance escaped the mass marketing of the industrial revolution “precisely because it doesn’t lend itself to any reproduction…” (1972: 5). The most conservative ontological interpretation of Siegel’s claims might be that dance *performances* are one-time, transient events (Conroy 2012)[^conroy-2012]. This, however, would not be a philosophically consquential reading because it is (relatively) uncontroversial that all theatrical performances are events and all events are transient. Hence, what seems to be at stake in describing dance art as ineluctably ephemeral is the idea that its fleetingness is *more significant appreciatively* than is the transience characteristic of the other performing arts, such as music and theater. If this is true, then it will be crucial for every full-blooded philosophical account of dance to address the nature and aesthetic-artistic importance of its fragility.
    step1: |-
      具体而言，舞蹈评论家 Marcia Siegel 有一句名言：舞蹈“存在于一个永恒的消逝点上”，对她来说，这意味着舞蹈存在于“一个在物质化的行动中消失的事件”之中（1972: 1）。她提出，艺术舞蹈之所以逃脱了工业革命的大规模市场营销，“恰恰因为它不容许任何复制……”（1972: 5）。对 Siegel 论断最保守的本体论解读或许是：舞蹈*表演*是一次性的、短暂的事件（Conroy 2012）[^conroy-2012]。然而，这不是一个有哲学意义的读法，因为下述观点（相对而言）没有争议：所有剧场表演都是事件，所有事件都是短暂的。因此，把舞蹈艺术描述为不可避免地短暂，其中利害似乎在于这样一种观念：舞蹈的转瞬即逝比起音乐、戏剧等其他表演艺术所特有的短暂性，在欣赏层面上*更重要*。如果这一点为真，那么任何一种充分的舞蹈哲学说明都必须处理舞蹈之脆弱性的本性与审美-艺术重要性。
