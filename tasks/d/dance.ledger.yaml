      Philosophers of dance frame questions about action and agency in markedly different ways, though most embrace the basic view that dancing is an activity and, therefore, not something that can be done accidentally (see McFee 1992, 2011b, and 2018). Those with an interest in dance as a form of expert action (akin to sports) tend to center their analyses on technical and athletic prowess, as well as on artistic skills like moving with expressivity or grace, and to focus on dance as art (see Montero 2016)[^montero-2016]. Others with an interest in vernacular or communal dance forms explore puzzles that can arise when movers coalesce into temporary dancing communities that seem, for the duration of the dance event, to have an agential component that exceeds, and is distinct from, that of any particular dancer in the group (see Kronsted 2021 and 2023)[^kronsted-2021][^kronsted-2023]. The presumption that dance is not mere physical movement opens up a number of roles for intentional action to play in any philosophical treatment of dance as art or social activity.
    step1: |-
      舞蹈哲学家以显著不同的方式提出关于行动与能动性的问题，尽管大多数人接受这样一个基本观点：跳舞是一种活动，因而不是可以偶然做出的东西（见 McFee 1992, 2011b, and 2018）。那些对舞蹈作为专家行动形式（类似于体育）感兴趣的人，往往把他们的分析集中在技术与运动才能上，以及富有表现力或优雅地运动这类艺术技能上，并把焦点放在作为艺术的舞蹈上（见 Montero 2016）[^montero-2016]。另一些对通俗或共同体舞蹈形式感兴趣的人，则探讨当运动者聚合成临时的舞蹈共同体时可能出现的难题——这些共同体似乎在舞蹈事件的持续期间，拥有一种超出且不同于群体中任何特定舞者的能动性成分（见 Kronsted 2021 and 2023）[^kronsted-2021][^kronsted-2023]。舞蹈不只是单纯的身体运动，这一预设为有意行动在任何把舞蹈作为艺术或社会活动的哲学处理中发挥作用开辟了许多位置。
    step2: |-
      舞蹈哲学家提出行动与能动性问题的方式差别很大，但多数人接受一个基本判断：跳舞是一种活动，因而不是可以偶然做成的事（见 McFee 1992, 2011b, and 2018）。把舞蹈当作专家型行动（类似体育）来关心的人，往往聚焦技术与运动上的造诣，以及富有表现力、优雅移动之类的艺术技能，并把舞蹈作为艺术来研究（见 Montero 2016）[^montero-2016]。另一些关心通俗或社群舞蹈形式的人，则探讨运动者聚成临时舞蹈共同体时出现的难题：在舞蹈事件持续期间，这些共同体似乎拥有一种超出群体中任何单个舞者、也不同于任何单个舞者的能动性成分（见 Kronsted 2021 and 2023）[^kronsted-2021][^kronsted-2023]。“舞蹈不只是单纯的身体运动”这一预设，为有意行动在舞蹈的哲学处理——无论是作为艺术还是作为社会活动——中发挥作用，开辟了广阔空间。
