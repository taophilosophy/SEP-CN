      It is helpful to keep in mind that three disctinct, though not mutually exclusive, kinds of agency are often explored in connection with dance performers. First, there is a “thin” sense of agency that simply distinguishes dancing persons from, say, Boston Dynamic robots on the grounds that the former, but not the latter, execute movements under intentional descriptions (McFee 2018)[^mcfee-2018]. Second, there is a “thicker” sense of agency that tracks the degree to which dancers are afforded various kinds of opportunities to make free decisions that express their intentionality, and unique personalities, as they perform (Bresnahan 2014a)[^bresnahan-2014a]. Third, there is a phenomenon one might call “mixed” agency that refers to cases in which dancers have the conflicted experience of being both the authors of their movements and of losing executive control to a partner or larger group (Kronsted 2021 and 2023)[^kronsted-2021][^kronsted-2023].
    step1: |-
      牢记下述内容是有帮助的：与舞蹈表演者相关，人们常探讨三种彼此不同（尽管并非互斥）的能动性。第一，有一种“薄的”能动性含义，它仅仅把跳舞的人与比如说波士顿动力机器人区分开来，理由是前者而非后者是在有意描述下执行运动的（McFee 2018）[^mcfee-2018]。第二，有一种“较厚的”能动性含义，它追踪舞者在表演时被给予各种机会、以作出表达其意图性与独特个性的自由决定的程度（Bresnahan 2014a）[^bresnahan-2014a]。第三，有一种或可称为“混合的”能动性的现象，指舞者既是其运动的作者、又对一个舞伴或更大群体失去执行控制而体验冲突的那些情形（Kronsted 2021 and 2023）[^kronsted-2021][^kronsted-2023]。
    step2: |-
      有益的做法是记住：围绕舞蹈表演者，人们常探讨三种能动性，它们彼此不同，但并不互斥。第一种是“薄的”（thin）能动性：它只是把跳舞的人与比方说波士顿动力的机器人区分开来——前者在有意的描述下执行运动，后者则不然（McFee 2018）[^mcfee-2018]。第二种是“较厚的”能动性：它追踪的是，舞者在表演中被给予多大程度的机会，去作出那些表达其意图性与独特个性的自由决定（Bresnahan 2014a）[^bresnahan-2014a]。第三种或可称为“混合的”（mixed）能动性：指舞者既是自身运动的作者、又对一个舞伴或更大群体失去执行控制，从而体验到内在冲突的情形（Kronsted 2021 and 2023）[^kronsted-2021][^kronsted-2023]。
