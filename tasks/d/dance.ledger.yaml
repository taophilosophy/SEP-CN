      A contrary approach takes the ephemeral character of dance to be one of its good-making features. On this positive view, we ought to appreciate, rather than decry, dance’s ever-changing and disappearing nature (Jollimore 2019)[^jollimore-2019]. Defenders of this view often note that ephemerality is a key attribute that makes a performance of a dance into a *vital experience* for both the dance performers and the audience. The positive proposal celebrates the live nature of the dance event and aims to explain why kinesthetic responses to dance art performances could be both appreciatively relevant and viscerally powerful. It also suggests that ephemerality might serve an important aesthetic role for dance insofar as it provides a uniquely robust “you had to be there” theatrical experience. (See Bresnahan 2014a for an account of improvisational artistry in live dance performance consistent with this perspective.)[^bresnahan-2014a] Depending on how it is cashed out, this interpretation of the idea that dance “exists at a perpetual vanishing point” might or might not be tension with contemporary theoretical approaches that regard dance art as in a new era of “post-ephemerality” (Franko 2018b)[^franko-2018b].
    step1: |-
      一种相反的进路把舞蹈的短暂品格当作其优良特征之一。在这种肯定性观点看来，我们应当欣赏而非哀叹舞蹈不断变化与消逝的本性（Jollimore 2019）[^jollimore-2019]。这一观点的辩护者常常指出，短暂性是一个关键属性，它使一场舞蹈表演对舞者与观众都成为一种*鲜活的体验*。这一肯定性主张赞颂舞蹈事件的现场性，并旨在说明为何对舞蹈艺术表演的动觉回应既与欣赏相关，又具有直击脏腑的力量。它还暗示，短暂性或许在审美上对舞蹈发挥重要作用，因为它提供了一种无比真切的“你必须亲临现场”的剧场体验。（关于一种与此视角相一致的现场舞蹈表演即兴技艺的说明，见 Bresnahan 2014a。）[^bresnahan-2014a]取决于如何落实，对舞蹈“存在于一个永恒的消逝点上”这一观念的这种解读，可能与当代一些把舞蹈艺术视为进入“后短暂性”（post-ephemerality）新时期的理论进路相容，也可能不相容（Franko 2018b）[^franko-2018b]。
    step2: |-
      相反的进路则把舞蹈的短暂品格视为其优点之一。在这种肯定性观点看来，对舞蹈不断变化、不断消逝的本性，我们应当欣赏而非哀叹（Jollimore 2019）[^jollimore-2019]。持此观点的人常指出：短暂性正是一个关键属性，它使一场舞蹈表演对舞者与观众都成为一次*鲜活的体验*。这一肯定性主张礼赞舞蹈事件的现场性，并力图说明，为何观众对舞蹈艺术表演的动觉回应既与欣赏相关，又有直击脏腑的力量。它还暗示：短暂性或许在审美上对舞蹈有着重要作用——它提供了一种无可替代的、“你必须亲临现场”（you had to be there）的剧场体验。（与这一视角相容的现场舞蹈即兴技艺说明，见 Bresnahan 2014a。）[^bresnahan-2014a]对舞蹈“存在于一个永恒的消逝点上”这一观念的解读最终如何落实，决定它与当代理论是否相容——有些进路认为舞蹈艺术已进入“后短暂性”（post-ephemerality）的新时期（Franko 2018b）[^franko-2018b]。
