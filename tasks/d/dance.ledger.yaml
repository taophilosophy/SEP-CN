      人们可能查阅的其他来源包括：Fiona Bannon 关于舞蹈与伦理的专著（2018）（其中利用了斯宾诺莎与马丁·布伯的道德理论）；Karen Bond 内容全面、视野多面的书（2019），《舞蹈与生活质量》（其中讨论舞蹈如何促成对人类有益的东西）；Bresnahan and Deckard（2019）与 Hall（2018）论残障与舞蹈；DeFrantz 关于黑人舞蹈与美学的工作（2005, 2019, 2021）；Eva Kit Wah Man 关于中国的身体、美学与政治的书（2019）（并非专门讨论舞蹈）；Royona Mitra 关于 Akram Khan 的舞蹈与编舞风格作为跨文化主义形式的工作（2015 and 2018）；Melpignano（2023）论作为政治表达形式的舞蹈；Eric Mullis（2021）论舞蹈与政治权力；Halifu Osumare 的回忆录《在黑色中起舞》（2018）及其姊妹篇《舞出非洲未来》（2024）；以及 Sherman（2018）论舞者、士兵与情感卷入。另见 Bresnahan, Katan-Schmid, and Houston（2020）关于舞蹈作为具身伦理的三部曲文章。
