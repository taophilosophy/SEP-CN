      This suggestion is opposed by McFee (2011b, 2013c and 2018), who argues that works of dance art are *authored* by choreographers but *embodied* by dancers to render the dancemaker’s creative choices visible to audiences. (See also Chris Challis 1999.)[^challis-1999] On the choreographer-as-sole-dancework-creator view, the dancer’s role is both instrumental and subsidiary to the dancemaker’s vision. Furthermore, on this account, a dancer’s area of expertise qua embodier is the activity of dancing, not dance-art-making. It follows from this that, while dancers contribute the raw material for dance performances, they are more like skilled technicians or artisans than author-artists.
    step1: |-
      这一建议受到 McFee（2011b, 2013c and 2018）的反对，他主张舞蹈艺术作品由编舞者*署名创作*（authored），由舞者*具身化*（embodied），以使舞蹈制作者的创作选择对观众可见。（另见 Chris Challis 1999。）[^challis-1999]按照编舞者作为舞蹈作品唯一创造者的观点，舞者的角色既是工具性的，又从属于舞蹈制作者的构想。此外，按照这一说明，舞者作为具身化者的专长领域是跳舞的活动，而非舞蹈艺术制作。由此推知，虽然舞者为舞蹈表演提供原材料，但他们更像熟练的技术人员或工匠，而不是作者-艺术家。
    step2: |-
      这一主张遭到 McFee（2011b, 2013c and 2018）的反对。他主张：舞蹈艺术作品由编舞者*署名创作*（authored），由舞者*具身化*（embodied），后者使舞蹈制作者的创作选择向观众显现。（另见 Chris Challis 1999。）[^challis-1999]按这种“编舞者作为舞蹈作品唯一创造者”的观点，舞者的角色既是工具性的，又从属于舞蹈制作者的构想。而且在这套说明下，舞者作为具身化者的专长领域是跳舞这一活动，而非舞蹈艺术制作。由此可以推出：舞者虽然为舞蹈表演提供原材料，但他们更接近熟练的技术人员或工匠，而非作者型艺术家。
