    source: |-
      Dance philosophers defend a range of views about the significance of felt bodily responses to dance art appreciation. Some authors presume they are important, but do not elucidate why or in what manner kinaesthetics might contribute to engaging works of dance art aptly. Others are “appreciative optimists” (here modifying D. Davies 2013, see Section 4)[^davies-2013] who argue that viewers’ bodily responses might be valuable, or even necessary, for *identifying correctly* some of a dance work’s artistic properties, such as the gracefulness of an arm movement or the beauty of an extended physical line (see Montero 2006a and 2006b; cf. Seeley 2020)[^montero-2006a][^montero-2006b][^seeley-2020]. At the opposite end of the argumentive spectrum are “appreciative pessimists” who deny that a viewer’s felt somatic reaction to a dance art performance can ever be relevant to grasping the artistic features of the dance qua artwork (see McFee 1992, 2011b, 2018).
    step1: |-
      舞蹈哲学家就被感受到的身体回应之于舞蹈艺术欣赏的意义捍卫一系列观点。一些作者假定它们是重要的，但不阐明动觉学可能以何种方式、在何种程度上有助于恰当地投入舞蹈艺术作品。另一些人是“欣赏乐观论者”（此处修改自 D. Davies 2013，见第 4 节）[^davies-2013]，他们主张观众的身体回应对于*正确识别*舞蹈艺术作品的某些艺术性质——例如一个手臂动作的优雅，或一条延展的身体线条之美——可能是有价值的，甚至是必要的（见 Montero 2006a and 2006b；参较 Seeley 2020）[^montero-2006a][^montero-2006b][^seeley-2020]。在论证光谱的另一端是“欣赏悲观论者”，他们否认观众对舞蹈艺术表演的被感受到的躯体反应能够与把握舞蹈作为艺术作品的艺术特征相关（见 McFee 1992, 2011b, 2018）。
    step2: |-
      对于被感受到的身体回应在舞蹈艺术欣赏中的意义，舞蹈哲学家持有一系列立场。一些作者假定它们重要，却不曾阐明动觉学以何种方式、在何种程度上有助于恰当地投入舞蹈艺术作品。另一些人是“欣赏乐观论者”（appreciative optimists，此处化用 D. Davies 2013，见第 4 节）[^davies-2013]：他们主张，观众的身体回应对于*正确识别*舞蹈作品的某些艺术性质——比如一个手臂动作的优雅、一条延展身体线条的美——可能有用，甚至必不可少（见 Montero 2006a and 2006b；参较 Seeley 2020）[^montero-2006a][^montero-2006b][^seeley-2020]。论证光谱的另一端是“欣赏悲观论者”：他们否认观众对舞蹈艺术表演的躯体感受能够关系到对舞蹈之为艺术作品之艺术特征的把握（见 McFee 1992, 2011b, 2018）。
