    kind: body
    source: |-
      > a rigorous mode of making oneself ready for a range of potential situations…an incessant preparation, grounded in the present while open to the next moment’s possible actions and constraints. (2010: 142)
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      Susan Leigh Foster (2003) shares Goldman’s view that it is the moment immediately *before* an actual dance movement occurs that lends a distinctive aesthetic quality to dance improvisation when used in art-presentational contexts. “[I]t is,” she claims,“this suspense-filled plenitude of the not-quite-known that gives live performance its special brilliance” (2003: 4). She also offers a phenomenological account of the kind of agency involved in dance improvisation, equating the lived experience of improvising with the use of a “middle voice” in which a dancer finds herself in a flow of movement that occupies an intermediate position between deliberative choice-making and passive direction.
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      Dance philosophers have identified other forms of dance improvisation that do not fit neatly into Carter’s three categories. Kent de Spain (2003), for example, draws attention to a kind of improvisation practiced by dancers to achieve a movement-based somatic state. Somatic improvisation, or the results of such improvisational exercises, may be included in a theater performance for an audience, but need not be. Constance Valis Hill (2003) includes “challenge dance” performances, stemming from the African-American tradition of dance “battles”, where the goal is to win an ever-escalating competition of skill and style. Like somatic improvisation, challenge dance improvisation can be offered for audience appreciation in a concert context, but need not be—it often takes place in social and street settings for pure entertainment or socio-political purposes. In addition, Aili Bresnahan (2014a) defends the claim that *all* live dance performance involves improvisational artistry, and argues that the ineluctably improvisatory nature of artistic dancing can be regarded as a form of embodied and extended agency (continuous with 4-E accounts advanced in the philosophy of mind, esp. Clark 2011)[^clark-2011].
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      For more on improvisation in dance, see Albright and Gere 2003; Clemente 1990; De Spain 1993, 2014, and 2019; Kloppenberg 2010; Matheson 2005; Novack 1990 and 1988 [2010]; Pallant 2006; Paxton 1975 and 1981; Zaporah 2003; and *The Oxford Handbook of Improvisation in Dance* (Midgelow 2019)[^midgelow-2019]. For more on improvisation in the arts, see the *Journal of Aesthetics and Art Criticism* special issue on Improvisation in the Arts, Spring, 2000 (Hagberg 2000)[^hagberg-2000]; Alperson 1984, 1998, and 2010; Bresnahan 2015; Brown 1996; Hagberg 1998; G. Lewis 2014; the *Oxford Handbook of Critical Improvisation Studies* (2 volumes, Lewis and Piekut 2016/Piekut and Lewis 2016)[^lewis-2016][^piekut-2016]; and Sawyer 2000. Cf. Symposium, 2010, “Musical Improvisation” in *The Journal of Aesthetics and Art Criticism*. For recent discussion of improvisation in vernacular dance forms, particularly those that often include dance battles, see Kronsted 2021 and 2023.
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      ## 3. Dance, Lived Experience, and Kinaesthetics
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      There are fields of philosophy, particularly in the Continental, pragmatic, and non-Western traditions, that treat art as both an activity and an experiential phenomenon. These approaches regard lived experience, including its bodily and somatic aspects, as something that can provide legitimate descriptive or causal evidence for philosophical claims. Richard Shusterman has developed a distinctive phenomenological theory, “somaesthetics”, to explain our embodied engagement with all art, including dance, in a way that includes various kinds of bodily awareness (see 2008, 2009, 2011a, 2011b, 2011c, 2012, and 2019). A commitment common to such thinkers is that understanding dance, in all its forms, requires us to look beyond the information provided by the projective sense modalities of sight and hearing and to consider what, how, and why dance experiences make us feel.
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      For more on these general topics, see Dewey 1934; Merleau-Ponty 1945 and 1964; along with Berleant 1991; Bresnahan 2014b; Foultier and Roos 2013 (Other Internet Resources); Johnson 2007; Katan 2016; Lakoff and Johnson 1999; and Merritt 2015. For more on phenomenological approaches to dance, see Albright 2011; Fraleigh 1996 (which also contains material on the history of dance in aesthetics), 2000, and 2018; Franko 2011b; and Sheets-Johnstone 1966 and 2015. Cf. Ness 2011 for an account of a shift in dance away from phenomenology with Foucault. For more on dance and somatics, see Eddy 2002; Fraleigh 2015; Weber 2019; and Williamson et al. 2014. See also LaMothe 2009; Pakes 2003, 2017a, and 2019; and Parvainen 2002 for work on the related field of dance, the body, and epistemology.
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      ### 3.1 The Primacy of Practice
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      Philosophers who treat lived experience as legitimate evidence for theory are firmly committed to the validity of practice in the philosophy of dance. Thinkers at home in analytic aesthetics, however, often find it necessary to explicate or defend their philosophical recourse to what transpires in the “dirt and mess” of studio rehearsals, is understood collectively during polished stage performances, and is articulated individually in critical notices. David Davies (2009 and 2024), for example, urges that ontologies of art should operate under a “pragmatic constraint” that tethers abstract metaphysical claims to relevant features of the artistic practice under consideration. Barbara Montero (2012, 2013, and 2016) argues, instead, that there is strong empirical evidence to support the idea that practitioners are *experts* in their domains; hence, their specially informed perspectives should be given due theoretical weight, if not pride of place.
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      Other philosophers also argue that analytic dance aesthetics should be more thoughtful about, and attentive to, actual danceworld practices. Julie Van Camp has proposed
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      > that the identity of works of art [including dance] be understood pragmatically as ways of talking and acting by the various communities of the art world. (2006: 42)
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      Renee Conroy (2013b), by contrast, defends three “minimal desiderata” for an adequate account of dancework identity, two of which require that any metaphysical theory be responsive to the complex socio-artistic matrix of the dance artworld. Despite their differences, all four of these broadly analytic thinkers place a premium on ensuring that philosophical treatments of dance remain respectful of danceworld conventions, values, and norms.
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      It should be noted, however, that this shared goal can be accomplished in different ways and these approaches are not methodologically equivalent. For some, commitment to the primacy of practice is a *reflective* one that allows the results of good theory to be revisionist with respect to our core beliefs about works of dance art and, hence, to potentially alter some danceworld practices. For others, philosophical treatment of dance should begin with danceworld norms and customs and develop accounts that elucidate, or highlight the complexities of, extant dance art practices while leaving the beliefs and behaviors they support largely intact.
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      For more on the relationship between dance practice and dance philosophy, see Pakes 2020. For an account of dance practice as research, see Pakes 2003 and 2017a. For more on dance expertise and its relevance to philosophical theory, see Bresnahan 2017b and 2019a, He and Ravn 2018; Melrose 2017; Montero 2013 and 2016; Vass-Rhee 2018; and Washburn et al. 2014.
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      ### 3.2 Bodily Responses
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      There is sustained controversy in dance philosophy about how to construe the felt, bodily responses that audience members can experience while watching a dance performance. These somatic reactions are often called “kinaesthetic” (or “kinesthetic”), combining the reference to movement in “kinetic” with the sense of “aesthetic” often associated with grace and beauty. Two central questions surrounding kineasthesia are: (1) What is the causal process by which kinaesthetic responses are generated? and (2) To what extent, if any, does this process inform a proper understanding of dance qua art?
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      With respect to the first question, it is generally acknowledged that the causal processes that might explain kinaesthetic responses to watching a live dance performance are not well understood. It is not clear, for example, how “empathy”, taken in the broad sense as the ability to feel something based on what we perceive to be another person’s physical or emotional state, plays a role in viewers’ kinaesthetic reactions to what they witness at a dance event.
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      With regard to the second query, some contemporary philosophers of dance (e.g., Montero 2006a, 2006b, 2012, and 2013)[^montero-2006a] appeal to research in cognitive and neuroscience to help explain *why* audience members report having kineaesthetic experiences, such as a quickening heart rate, a dropping stomach, and various muscular tensions, while they watch dancers in action. Recent discussions also highlight the relationship between felt bodily responses in audience members and various uses of the imagination, drawing on Kendall Walton’s highly influential *Mimesis as Make-Believe: On the Foundations of the Representational Arts* (1990) (see Conroy 2020; cf. Heckman 2023)[^conroy-2020][^heckman-2023]. The scope of concern about kineasthesia and dance appreciation has also been expanded to include analysis of the kinds of “frissons”, or bodily thrills, a dance art performance might be designed intentionally to inspire in audience members (Nanay 2023)[^nanay-2023].
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      Dance philosophers defend a range of views about the significance of felt bodily responses to dance art appreciation. Some authors presume they are important, but do not elucidate why or in what manner kinaesthetics might contribute to engaging works of dance art aptly. Others are “appreciative optimists” (here modifying D. Davies 2013, see Section 4)[^davies-2013] who argue that viewers’ bodily responses might be valuable, or even necessary, for *identifying correctly* some of a dance work’s artistic properties, such as the gracefulness of an arm movement or the beauty of an extended physical line (see Montero 2006a and 2006b; cf. Seeley 2020)[^montero-2006a][^montero-2006b][^seeley-2020]. At the opposite end of the argumentive spectrum are “appreciative pessimists” who deny that a viewer’s felt somatic reaction to a dance art performance can ever be relevant to grasping the artistic features of the dance qua artwork (see McFee 1992, 2011b, 2018).
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      Those who occupy a middle position in this debate contend that while bodily responses can bear on the appreciative understanding of a dance art creation, and contribute to our regard for some of its art-relevant features, kinaesthetic reactions do not register the work’s fine-grained artistic properties reliably (see Conroy 2013a and 2020)[^conroy-2013a][^conroy-2020]. All of these positions are *conceptually distinct* from those defended in the debate over the value of utilizing scientific data and empirical studies as elements of dance philosophy (see Section 4). They do, nonetheless, tend to track optimism and pessimism about this discrete methodological issue.
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      For more on empathy and the kinaesthetic aspects of performance, see Foster 2008 and 2011. For more on kinaesthetic responses to dance, see Bresnahan 2017b; Montero 2021; Reason and Reynolds 2010; Sklar 2008; and Smyth 1984.
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      ## 4. Dance and Cognitive Science
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      The number of dance philosophers who appeal to scientific research to advance understanding of the physical aspects of making and appreciating dance art is large and growing. For example, Maxine Sheets-Johnstone’s extensive body of dance writing incorporates so much content from the cognitive and other sciences that it would require another entry to list all the relevant references (see this entry’s bibliography for “Sheets-Johnstone” as a start). Several important lines of thought have, however, introduced the topic of empirical research into on-going discussions of dance philosophers who work within broadly analytic traditions.
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      For example, Montero argues that proprioception (the innate capacity that apprises persons of their bodily position in space) might be construed as an aesthetic sense and appeals to scientific research on mirror neurons to defend this view (Montero 2006a, 2006b, 2013, 2016, and 2021)[^montero-2006a]. Carroll expands Montero’s argumentative project to consider how dance and music can work together to affect our kinaesthetic responses (Carroll and Moore 2011)[^carroll-2011] and to explore how experimental results in neuroscience could bolster dance critic John Martin’s theory of “metakinetic transfer” (Carroll and Seeley 2013)[^carr-2013][^carroll-2013][^seeley-2013].
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      As noted above, writers who support the use of empirical research on kinaesthetic responses to dance also tend to hold that the felt bodily resonances engendered by watching a live dance performance can be relevant to *appreciation* of dance qua art. To this end, Carroll and Seeley (2013) argue that one central feature of understanding dance well is grasping the nature of the experience in all its aspects, including both cognitive and kinaesthetic elements. They maintain, therefore, that connecting common phenomenological reports with robust scientific explanations of them can be elucidating and is appropriate to generating comprehensive understanding of the dance-appreciative experience. This can be called the “moderately optimistic (methodological) view” (following D. Davies 2013)[^davies-2013].
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      By contrast, some philosophers adopt a stance that is “moderately pessimistic” (D. Davies 2013)[^davies-2013]. These thinkers regard some questions central to dance aesthetics as simply unanswerable by science. Normative issues such as, “What counts as *proper* appreciation of a work of art?” are, they argue, such that the tools utilized in empirical study fail to engage them helpfully, if at all. Thus, the moderate methodological pessimist maintains that, *if* empirical research is to be used by dance philosophers and others with an interest in the performing arts, then it must be applied very carefully to the right set of questions (D. Davies 2011a, 2013, 2014, and 2024)[^davies-2011a].
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      Being only “moderate”, however, this kind of pessimist can argue that philosophy ought not partition itself off entirely from science and other disciplines that could inform our best overall thinking about the world. We would do well, on this view, to follow the Quinean injunction that philosophy should be cognizant of, and responsive to, current science so we can assess how our philosophic positions fit into our broader web of beliefs. A moderate pessimist might also be sympathetic to the idea that, at a minimum, empirical research can help us avoid false assumptions about the arts based on simple empirical misunderstandings about human beings (Seeley 2011)[^seeley-2011].
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      An “extreme (methodological) pessimist”, by contrast, will deny that causal or scientific explanations can ever be relevant to a philosophical treatment of issues pertaining to dance as an artform (see McFee 2011a, 2013b and 2018)[^mcfee-2011a]. One common argumentative defense of this position emphasizes the fact that artistic appreciation happens at the level of *a person who appreciates* under various normative constraints, not at the level of neurobiology. While optimists concede that kinaesthetic responses cannot alone generate a full, artistically sensitive apprehension of dance, they do think neurobiologic studies of them can contribute to our wider understanding of human responses to perceived movement, including dance art. Optimists and moderate pessimists, therefore, both maintain that scientific data has some legitimate place in dance philosophy, precisely the claim the extreme pessimist rejects.
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      For more dance philosophical writing that includes appeal to the cognitive and neuroscience, see Bläsing et al. 2012 and Bläsing et al. 2019; Bresnahan 2014a; Cross and Ticini 2012; Hagendoorn 2012; Katan 2016; Kronsted 2021 and 2023**;** Jang and Pollick 2011; He and Ravn 2018; Jola, Ehrenberg, and Reynolds 2012; Legrand and Ravn 2009; McKechnie and Stevens 2009; Merritt 2015; Montero 2006a, 2006b, 2010, 2012, and 2013; Seeley 2011, 2013 and 2020; Vass-Rhee 2018. See also Bresnahan 2017a for an account of how dance training affects our temporal experience, and Bresnahan 2019a for the view that expert dance movements are often experienced and perceived via subconscious processes before they are fully cognized. For more on Martin’s theory of “metakinetic transfer”, which he attributes to a natural human capacity for “muscular sympathy” and “inner mimicry”, see Martin 1939 and Franko 1996. For an additional discussion of various optimisms and pessimisms in this domain, see Bullot et al. 2017. For more on the relationship between music and dance, see Aasen 2021; Olsson 2024; and Van Camp 2021b.
    step1: TBD
    step2: TBD
