      For more on the general question, “What is dance?”, see D. Carr 1987; Carroll 2003, Copeland and Cohen 1983; McFee 1998a and 2013a; Pakes 2019b; Sparshott 1988; and Van Camp 1981. For more on meaning, expression, authenticity and communication as central or definitive aspects of dance art, see D. Carr 1997; Best 1974; Franko 2014b; Hanna 1983 and 1979 [1987]; Martin 1933a, 1939, and 1946; and Van Camp 1996b. For an extended treatment of the dance art appreciative practices to which an ontological account might aim to be responsive, see D. Davies 2024. See also Meskin 1999 for an alternative view of dancework ontology that holds that dance audiences experience *three* works of art: a choreographic-work, a production-work, and a performance-interpretation work; cf. Thom 2019. For discussion of "dance as text" and a replete history of this idea, see Franko 1993, 2011a, and 2011b; cf. Pakes 2020.
    step1: |-
      关于“什么是舞蹈？”这一一般问题的更多内容，见 D. Carr 1987；Carroll 2003, Copeland and Cohen 1983；McFee 1998a and 2013a；Pakes 2019b；Sparshott 1988；以及 Van Camp 1981。关于意义、表现、本真性与传达作为舞蹈艺术之核心或界定性方面的更多内容，见 D. Carr 1997；Best 1974；Franko 2014b；Hanna 1983 and 1979 [1987]；Martin 1933a, 1939, and 1946；以及 Van Camp 1996b。关于本体论学说可能力求回应的舞蹈艺术欣赏实践的扩展讨论，见 D. Davies 2024。另见 Meskin 1999，其对舞蹈作品本体论提出一种另类观点，认为舞蹈观众体验到的是*三部*艺术作品：一部编舞作品、一部制作作品与一部表演-诠释作品；参较 Thom 2019。关于“作为文本的舞蹈”及这一思想的完整历史，见 Franko 1993, 2011a, and 2011b；参较 Pakes 2020。
    step2: |-
      关于“什么是舞蹈？”这一总的问题，参见 D. Carr 1987；Carroll 2003, Copeland and Cohen 1983；McFee 1998a and 2013a；Pakes 2019b；Sparshott 1988；以及 Van Camp 1981。关于意义、表现、本真性与传达如何成为舞蹈艺术的核心或界定性方面，参见 D. Carr 1997；Best 1974；Franko 2014b；Hanna 1983 and 1979 [1987]；Martin 1933a, 1939, and 1946；以及 Van Camp 1996b。想深入了解本体论学说所应回应的舞蹈艺术欣赏实践，参见 D. Davies 2024。另参 Meskin 1999：该文对舞蹈作品本体论另立一说，认为舞蹈观众体验到的其实是*三部*艺术作品——编舞作品、制作作品与表演-诠释作品；参较 Thom 2019。关于“作为文本的舞蹈”及这一观念的完整历史，参见 Franko 1993, 2011a, and 2011b；参较 Pakes 2020。
