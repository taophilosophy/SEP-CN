      Another set of concerns about action in dance relates more readily to the ontological question (see Section 1). For instance, Anna Pakes’ view of dance works as indicated or initiated action-types appeals to action to articulate what kind of things such artworks *are* at the most fundamental metaphysical level (Pakes 2020)[^pakes-2020]. Pakes agrees that action is a necessary feature of dance in general (2013) and, with Aaron Meskin (1999), urges that the embodiment of dance in physical, intentional events renders works of dance art better construed as created action-structures than eternal types or Platonic Forms. Considerations about the embodied nature of dancing also incline Pakes to be wary of the idea that there could be such a thing as purely “conceptual dance”, i.e., a dance artwork in which the actions that constitute the dancing are merely a means to some further artistic-intellectual end (Pakes 2019a)[^pakes-2019a]. A distinct, but obliquely related, topic in this domain is how to understand the *normativity* embedded in dance art as the product of intentional actions undertaken in the appropriate contexts, issuing from the right kind of psychological states (McFee 2021b)[^mcfee-2021b].
    step1: |-
      关于舞蹈中行动的另一组关切与本体论问题（见第 1 节）的关联更为直接。例如，Anna Pakes 把舞蹈作品视为被指示或被发起的行动类型的观点，诉诸行动来阐明这些艺术作品在最基本的形而上学层面上*是*哪一类东西（Pakes 2020）[^pakes-2020]。Pakes 同意行动一般而言是舞蹈的必要特征（2013），并与 Aaron Meskin（1999）一道主张，舞蹈在身体性的、有意图的事件中的具身化，使舞蹈艺术作品更宜被理解为被创造出来的行动结构，而不是永恒的类型或柏拉图式理念。关于跳舞之具身性质的考量，也使 Pakes 警惕纯粹“概念舞蹈”的可能性，即其中的行动仅仅是通往某种更远的艺术-智识目的之手段的舞蹈艺术作品（Pakes 2019a）[^pakes-2019a]。这一领域中一个不同但间接相关的论题，是如何理解舞蹈艺术中嵌入的*规范性*，后者是那些在适当语境中发端于恰当心理状态的、有意图的行动的产物（McFee 2021b）[^mcfee-2021b]。
    step2: |-
      关于舞蹈中行动的另一组关切，与本体论问题（见第 1 节）的关联更直接。例如，Anna Pakes 把舞蹈作品看作被指示或被发起的行动类型（indicated or initiated action-types），并诉诸行动来阐明这类艺术作品在最基本的形而上学层面上*是*什么（Pakes 2020）[^pakes-2020]。Pakes 同意行动是舞蹈的必要特征（2013），并与 Aaron Meskin（1999）一道主张：舞蹈具身于身体性的、有意图的事件之中，因此把舞蹈艺术作品理解为被创造的行动结构，比理解为永恒的类型或柏拉图式理念更恰当。跳舞的具身性质也促使 Pakes 对“纯粹概念舞蹈”的可能性保持警惕——那是指这样一种舞蹈艺术作品：构成舞蹈的行动只是通往某种更远的艺术-智识目的的手段（Pakes 2019a）[^pakes-2019a]。这个领域还有一个不同但间接相关的论题：舞蹈艺术中嵌入的*规范性*（normativity）——作为在适当语境中、从恰当心理状态出发的有意行动的产物——该如何理解（McFee 2021b）[^mcfee-2021b]。
