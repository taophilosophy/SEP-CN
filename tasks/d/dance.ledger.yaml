      Despite their differences, all such approaches are united insofar as they stand in contrast to those adopted by dance philosophers who think that the art-relevant focus of dance might be something other than the structure of the dance “work” construed as some kind of artistic *object*. Such thinkers tend to observe that dance art creations typically lack supplementary texts and are often developed without the use of any written plan (see Franko 1989, 2011a, and 2017; and Pakes 2017)[^franko-1989]. They also note that even when there is a notated score, it is not always used as an “essentialist recipe” for generating future performances as it may, instead, serve as inspiration for a novel theatrical presentation (see Franko 1989)[^franko-1989]. Furthermore, standardized dance notation systems are controversial, and none is used or accepted universally (see Franko 2011a and Van Camp 1998)[^franko-2011a][^van-1998]. Finally, many philosophers begin their theorizing from the belief that what makes dance art *special*, and, therefore, worthy of focused philosophical attention, lies in dance’s bodily, tactile, dynamic, felt, perceived or intuited aspects (sometimes referred to as its kinaesthetic or somatic elements). For these theorists, the central foci of theory and appreciation should be features of performance events and evolving danceworld experiences, rather than static scores or underlying abstract structures. (See Sections 2 and 3.)
    step1: |-
      尽管彼此有别，所有这类进路的共同点在于：它们与另一些舞蹈哲学家的立场形成对照，后者认为舞蹈的与艺术相关的焦点可能不是被构想为某种艺术*对象*的舞蹈“作品”的结构。这类思想家往往观察到，舞蹈艺术创作通常缺少补充性文本，且常常在没有使用任何书面计划的情况下发展出来（见 Franko 1989, 2011a, and 2017；以及 Pakes 2017）[^franko-1989]。他们还注意到，即便存在记谱的舞谱，它也并不总是被用作生成未来表演的“本质主义配方”，而可能反而作为一次新颖剧场呈现的灵感来源（见 Franko 1989）[^franko-1989]。此外，标准化的舞蹈记谱体系有争议，没有一个被普遍使用或接受（见 Franko 2011a 与 Van Camp 1998）[^franko-2011a][^van-1998]。最后，许多哲学家从如下信念开始其理论化：使舞蹈艺术*特殊*、因而值得集中哲学关注的，是舞蹈的身体性、触觉性、动态性、被感受到的、被知觉的或被直觉到的方面（有时被称为其动觉或身体的要素）。对这些理论家来说，理论与欣赏的核心焦点应当是表演事件与不断演化的舞蹈界经验的特征，而不是静态的舞谱或背后的抽象结构。（见第 2 节与第 3 节。）
    step2: |-
      学说彼此有别，但共同点是：它们都对立于另一部分舞蹈哲学家的立场——后者认为，舞蹈与艺术相关的焦点，也许根本不在于把舞蹈“作品”当作某种艺术*对象*来看待的那种结构。持后一种立场的人往往指出：舞蹈艺术创作通常缺少附加文本，也常常在没有书面计划的情况下发展成形（见 Franko 1989, 2011a, and 2017；以及 Pakes 2017）[^franko-1989]；即使存在记谱舞谱，它也未必被当作生成未来表演的“本质主义配方”，反倒可能只是某次新颖剧场呈现的灵感来源（见 Franko 1989）[^franko-1989]；何况标准化的舞蹈记谱体系本身就有争议，没有任何一种得到普遍使用或接受（见 Franko 2011a 与 Van Camp 1998）[^franko-2011a][^van-1998]。此外，许多哲学家的理论化出发点是这样一个信念：舞蹈艺术之所以*特殊*、值得哲学集中关注，正在于舞蹈那些身体的、触觉的、动态的、被感受到的、被知觉到的或被直觉到的方面（有时称为其动觉或身体要素）。对这些理论家而言，理论与欣赏的核心焦点应当是表演事件和不断演化的舞蹈界经验，而非静态舞谱或背后的抽象结构。（见第 2 节与第 3 节。）
