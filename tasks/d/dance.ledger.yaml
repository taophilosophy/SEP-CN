      ## 1 舞蹈作为艺术的分析进路
  - id: 6
    kind: body
    source: |-
      Although many dance-related topics have been treated by philosophers of a broadly analytic persuasion, thinkers in this intellectual community have had an overriding interest in dance qua artform. Hence, they have attended primarily to concert or theater dance, and have given sustained thought to three central questions: What is the difference between a movement event that is dance and one that is non-dance? (The definitional question.) What kind of thing is a work of dance art? (The ontological question.) What conditions must be satisfied for the same work of dance art to be performed on multiple occasions? (The identity question.)
    step1: |-
      尽管许多与舞蹈相关的论题已被持广义分析倾向的哲学家处理过，这一智识共同体中的思想家最突出的兴趣在于舞蹈之为艺术形式。因此，他们主要关注剧场舞蹈，并对三个核心问题给予了持续思考：一个运动事件是舞蹈而另一个是非舞蹈，其间的差别是什么？（定义问题。）舞蹈艺术作品是哪一类东西？（本体论问题。）同一舞蹈艺术作品在多个场合被表演，必须满足什么条件？（同一性问题。）
    step2: |-
      许多与舞蹈相关的论题早已进入广义分析取向哲学家的视野，但这一智识共同体最持久的兴趣在于舞蹈之为艺术形式（dance qua artform）本身。因此他们主要关注剧场舞蹈，并围绕三个核心问题持续思考：一个运动事件何以是舞蹈，另一运动事件何以是非舞蹈？（定义问题。）舞蹈艺术作品是哪一类存在物？（本体论问题。）同一件舞蹈艺术作品要在不同场合上演，须满足哪些条件？（同一性问题。）
  - id: 7
    kind: body
    source: |-
      The definitional question preoccupied a number of early contributors to the field of dance philosophy from roughly the 1950s to the 1990s. Their shared goal was to offer an account that could distinguish the dancing in concert performances from other kinds of movement that might be seen on stage and, thereby, to indicate what makes dance, as a form of human moving, special. Well-known suggestions highlighted, among other things, the expressive qualities of the movements performed (Beardsley 1982)[^beardsley-1982], the symbolic potential of the movement performance (Langer 1953a and b; cf. Conroy 2015)[^conroy-2015][^langer-1953a], or the performance’s relationship to artistic institutions and dance art practices (Carroll and Banes 1982)[^carroll-1982]. (See Section 2.) Several influential philosophers of dance, however, resisted the definitional project, arguing that it must suffer from underinclusivity given the wide array of extant dance styles and forms (Sparshott 1988; cf. Sparshott 1995)[^sparshott-1988][^sparshott-1995] or urging that the attempt to offer essentialist definitions is futile (McFee 2021b)[^mcfee-2021b]. In recent decades, attention in so-called “analytic aesthetics” has shifted away from various attempts to define dance and toward explorations that highlight its distinctiveness by emphasizing metaphysical and appreciative issues.
    step1: |-
      从大约 1950 年代到 1990 年代，定义问题占据着舞蹈哲学领域早期一批贡献者的心思。他们共同的目标是给出一种说明，能够把剧场表演中的舞蹈与其他可能在舞台上看到的运动区分开来，从而指明舞蹈作为人类运动的一种形式何以为特殊。几种著名的建议各自强调：所表演运动的表现性质（Beardsley 1982）[^beardsley-1982]、运动表演的符号潜能（Langer 1953a and b；参较 Conroy 2015）[^conroy-2015][^langer-1953a]，或表演与艺术建制及舞蹈艺术实践的关系（Carroll and Banes 1982）[^carroll-1982]。（见第 2 节。）然而，一些有影响的舞蹈哲学家抵制这一定义工程，认为鉴于现存舞蹈风格与形式之广泛，定义必定失之过窄（Sparshott 1988；参较 Sparshott 1995）[^sparshott-1988][^sparshott-1995]，或主张给出本质主义定义的尝试是徒劳的（McFee 2021b）[^mcfee-2021b]。近几十年来，所谓“分析美学”中的注意力已从各种定义舞蹈的尝试，转向通过强调形而上学与欣赏问题来凸显舞蹈独特性的探究。
    step2: |-
      大致从 20 世纪 50 年代到 90 年代，定义问题占据着舞蹈哲学早期一批贡献者的心思。他们共同的追求，是给出一种能把剧场表演中的舞蹈与其他舞台运动区分开来的说明，进而指明舞蹈作为人类运动的一种形式何以为特殊。几种著名主张分别强调：所表演之运动的表现性质（Beardsley 1982）[^beardsley-1982]、运动表演的符号潜能（Langer 1953a and b；参较 Conroy 2015）[^conroy-2015][^langer-1953a]，或表演同艺术建制及舞蹈艺术实践之间的关系（Carroll and Banes 1982）[^carroll-1982]。（见第 2 节。）不过，几位有影响力的舞蹈哲学家抵制这一定义工程：有人认为，现存舞蹈风格与形式过于多样，定义必定失之偏狭（Sparshott 1988；参较 Sparshott 1995）[^sparshott-1988][^sparshott-1995]；有人则干脆断言，一切本质主义定义的尝试注定徒劳（McFee 2021b）[^mcfee-2021b]。近几十年来，所谓“分析美学”的关注点已从各种定义舞蹈的尝试，转向以形而上学与欣赏议题凸显舞蹈之独特性的探究。
  - id: 8
    kind: body
    source: |-
      Those projects that address the ontological question introduced above center on identifying *what kind of thing* the product of dance art-making is—an object, an abstract entity, an event, a more fluid process, or something else. It should be noted, however, that philosophers differ with regard to which aspects of dance as art should be given primacy of place for the purposes of pursuing ontology. Dance art practices recognize an array of metaphysically relevant features that one might aim to accommodate, including the seemingly “commonsense facts” that many works of dance art are repeatable (they can be performed on more than one occasion), underdetermined (they permit of performances that differ qualitatively from one another), created by humans at a certain time in history (they are not eternally existing Forms), and potentially modally flexible (the original dancemaker could have chosen some different intrinsic or identity-constitutive features) (see Carroll 2019; D. Davies 2011 and 2024; McFee 1992, 2011, and 2018; Pakes 2020)[^carroll-2019][^davies-2024][^pakes-2020].
    step1: |-
      处理上文引入的本体论问题的那些工程，集中在识别舞蹈艺术制作的产物是*哪一类东西*——一个对象、一个抽象实体、一个事件、一个更流动的过程，还是别的什么。但应当注意，哲学家们对于在追求本体论时舞蹈之为艺术的哪些方面应当占据首位，意见并不一致。舞蹈艺术实践承认一系列形而上学上相关的特征，人们或许力图容纳它们，包括那些看似“常识性的事实”：许多舞蹈艺术作品是可重复的（它们可以在不止一个场合被表演）、欠决定的（它们允许在质上彼此不同的表演）、由人类在历史上某个时刻创造（它们不是永恒存在的型相），并且在模态上潜在可变（原初的舞蹈制作者本可以选择某些不同的内在或构成同一性的特征）（见 Carroll 2019；D. Davies 2011 and 2024；McFee 1992, 2011, and 2018；Pakes 2020）[^carroll-2019][^davies-2024][^pakes-2020]。
    step2: |-
      处理上述本体论问题的工程，其核心是识别舞蹈艺术创作的产物属于*哪一类东西*：一个对象？一个抽象实体？一个事件？一个更流动的过程？还是别的什么？不过应当注意，就追求本体论时应当优先考虑舞蹈之为艺术的哪些方面而言，哲学家之间并不一致。舞蹈艺术实践呈现出一系列形而上学上相关的特征，理论者可能想要容纳它们，其中包括一些看似“常识性的事实”：许多舞蹈艺术作品是可重复的（可以在不止一个场合上演）、欠决定的（容许彼此在性质上有所不同的表演）、由人类在历史上某个时刻创造（并非永恒存在的理念），并在模态上潜在可变（舞蹈的原创者本可以选择另一些内在的或构成同一性的特征）（见 Carroll 2019；D. Davies 2011 and 2024；McFee 1992, 2011, and 2018；Pakes 2020）[^carroll-2019][^davies-2024][^pakes-2020]。
  - id: 9
    kind: body
    source: |-
      With considerations such as these in mind, several widely debated ontological accounts of dance qua art have emphasized repeatable choreographic structures. For Nelson Goodman, such structures are typically described as being anchored metaphysically in an actual score for the dance work that specifies its essential features (Goodman 1976; cf. McFee 2012, Pakes 2020, and Van Camp 2019a)[^goodman-1976][^mcfee-2012][^pakes-2020][^van-2019a]. A competing structure-based approach, defended by Graham McFee, argues that works of dance art are types that can be tokened in live performance, where the parameters of the type that constitutes any particular dance artwork are established by an in principle possible score or a work “recipe” (McFee 1992b, 2011b, and 2018)[^mcfee-1992b]. Several more recent accounts depart from the details of McFee’s view, but embrace his core insight that works of dance art are fundamentally “performables” that are also typically multiples, i.e., they are works of art made for performance that can have more than one correct instance. For example, Noël Carroll recasts the ontological question to ask, “What makes something a dance-art-work?” and suggests that the answer lies in the “constitutive purposes” of the choreography as these would be appropriately understood by someone embedded in the particular community for whom the dancemaker creates (Carroll 2019: 74)[^carroll-2019]. Other more metaphysically complex alternatives include accounts that construe dance artworks as indicated action-types answerable to both contemporary danceworld norms and historical considerations (Pakes 2020)[^pakes-2020] or as “Wollheimian types” grounded in dance art appreciative practices (D. Davies 2024)[^davies-2024].
    step1: |-
      考虑到这类因素，若干被广泛讨论的舞蹈之为艺术的本体论学说强调可重复的编舞结构。对纳尔逊·古德曼而言，这类结构通常被描述为在形而上学上锚定于舞蹈作品的实际舞谱，该舞谱规定了作品的本质特征（Goodman 1976；参较 McFee 2012、Pakes 2020 与 Van Camp 2019a）[^goodman-1976][^mcfee-2012][^pakes-2020][^van-2019a]。一种由 Graham McFee 捍卫的竞争性基于结构的进路主张，舞蹈艺术作品是这样一些类型，它们可以在现场表演中获得殊例，而构成任何特定舞蹈艺术作品的类型之诸参数，由一份原则上可能的舞谱或一部作品“配方”确立（McFee 1992b, 2011b, and 2018）[^mcfee-1992b]。晚近的几种学说背离了 McFee 观点的细节，但接受其核心洞见，即舞蹈艺术作品根本上是“可表演之物”（performables），而且通常是可多例化的（multiples），即它们是为表演而制作的艺术作品，可以拥有不止一个正确事例。例如，Noël Carroll 重塑了本体论问题，问“什么使某物成为一件舞蹈艺术作品？”，并暗示答案在于编舞的“构成性目的”（constitutive purposes），正如那些内嵌于舞蹈制作者为之创作的特定共同体中的人所恰当理解的那样（Carroll 2019: 74）[^carroll-2019]。其他形而上学上更复杂的备选方案包括：把舞蹈艺术作品构想为被指示的行动类型（indicated action-types），它们既对当代舞蹈界规范负责，也对历史性考量负责（Pakes 2020）[^pakes-2020]，或构想为奠基于舞蹈艺术欣赏实践的“沃尔海姆式类型”（D. Davies 2024）[^davies-2024]。
    step2: |-
      基于这类考量，若干广受讨论的舞蹈本体论学说都强调可重复的编舞结构。在纳尔逊·古德曼那里，这类结构在形而上学上被锚定于舞蹈作品的实际舞谱，由舞谱规定作品的本质特征（Goodman 1976；参较 McFee 2012、Pakes 2020 与 Van Camp 2019a）[^goodman-1976][^mcfee-2012][^pakes-2020][^van-2019a]。Graham McFee 捍卫了另一种基于结构的竞争性进路：舞蹈艺术作品是类型，可以在现场表演中获得殊例，而构成任何特定舞蹈艺术作品的那个类型，其参数由一份原则上可能的舞谱或一部作品“配方”来确立（McFee 1992b, 2011b, and 2018）[^mcfee-1992b]。若干较晚近的学说虽在细节上不同于 McFee，却接受他的核心洞见：舞蹈艺术作品根本上是“可表演之物”（performables），且通常是可多例化的（multiples）——即为表演而造的艺术作品，可以有不止一个正确实例。例如，Noël Carroll 把本体论问题重述为“什么使某物成为一件舞蹈艺术作品？”，并主张答案在于编舞的“构成性目的”（constitutive purposes），而这要由内嵌于特定共同体——舞蹈制作者正是为其而创作——的人来恰当地理解（Carroll 2019: 74）[^carroll-2019]。其余形而上学上更复杂的备选方案，包括把舞蹈艺术作品理解为被指示的行动类型（indicated action-types）——它们既须对当代舞蹈界的规范负责，也须对历史性考量负责（Pakes 2020）[^pakes-2020]——或理解为奠基于舞蹈艺术欣赏实践的“沃尔海姆式类型”（D. Davies 2024）[^davies-2024]。
