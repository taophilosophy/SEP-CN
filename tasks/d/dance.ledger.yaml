      Those who occupy a middle position in this debate contend that while bodily responses can bear on the appreciative understanding of a dance art creation, and contribute to our regard for some of its art-relevant features, kinaesthetic reactions do not register the work’s fine-grained artistic properties reliably (see Conroy 2013a and 2020)[^conroy-2013a][^conroy-2020]. All of these positions are *conceptually distinct* from those defended in the debate over the value of utilizing scientific data and empirical studies as elements of dance philosophy (see Section 4). They do, nonetheless, tend to track optimism and pessimism about this discrete methodological issue.
    step1: |-
      那些在这场争论中持中间立场的人主张，虽然身体回应可以关涉对一件舞蹈艺术创作的欣赏性理解，并促成我们对它某些与艺术相关特征的重视，但动觉反应并不能可靠地记录作品那些细微的艺术性质（见 Conroy 2013a and 2020）[^conroy-2013a][^conroy-2020]。所有这些立场都与关于把科学数据与经验研究用作舞蹈哲学之要素的价值的争论中所捍卫的立场*在概念上彼此区分*（见第 4 节）。尽管如此，它们确实倾向于追踪对这一独立方法论问题的乐观与悲观。
