      In this multi-faceted area of inquiry, it is important to mark a distinction between Screendance (a hybrid art genre of dance and film), dances made for screen (such as a sanctioned recording of a performance designed to be viewed in movie theaters or on television), and dance on screen (video traces of past live dance events). Current philosophical debates emphasize questions such as: When we view a dance performance through a mediated format, do we have genuine commerce with the work of dance art? (D. Davies 2019 and 2021; McFee 2018)[^davies-2019][^davies-2021][^davies-2021-2][^mcfee-2018] Are substantive aesthetic-artistic experiences, or opportunities for meaningful kineasthetic engagement, compromised when we watch dance on screen? (Berleant 2021; Heckman 2021)[^berleant-2021][^heckman-2021] How does the use of video recording or other digital tools to generate new works of dance art, or create dance scores, affect our best accounts about what *kind of things* dance works are? (Blades 2015b; Pakes 2020)[^blades-2015b][^pakes-2020]
    step1: |-
      在这一多面向的探究领域中，区分银幕舞蹈（舞蹈与电影的混合艺术门类）、为银幕制作的舞蹈（如一场旨在供电影院或电视观看的经授权的表演录制）与银幕上的舞蹈（过去现场舞蹈事件的视频痕迹）是重要的。当前的哲学争论强调的问题有：当我们经由中介格式观看一场舞蹈表演时，我们是否与舞蹈艺术作品有真正的交往？（D. Davies 2019 and 2021；McFee 2018）[^davies-2019][^davies-2021][^davies-2021-2][^mcfee-2018]当我们在银幕上观看舞蹈时，实质性的审美-艺术体验或 meaningful 的动觉交涉的机会是否受到损害？（Berleant 2021；Heckman 2021）[^berleant-2021][^heckman-2021]使用录像或其他数字工具来生成新的舞蹈艺术作品或创造舞蹈舞谱，如何影响我们关于舞蹈作品是*哪一类东西*的最佳说明？（Blades 2015b；Pakes 2020）[^blades-2015b][^pakes-2020]
    step2: |-
      在这一多面向的探究领域，有一组区分值得注意：银幕舞蹈（screendance，舞蹈与电影的混合艺术门类）、为银幕而制的舞蹈（如一场经授权、旨在供影院或电视观看的表演录制）、与银幕之上的舞蹈（过往现场舞蹈事件的视频痕迹）。当前的哲学争论强调这些问题：当我们经由中介形态观看一场舞蹈表演时，我们是否在与舞蹈艺术作品发生真正的交涉？（D. Davies 2019 and 2021；McFee 2018）[^davies-2019][^davies-2021][^davies-2021-2][^mcfee-2018]当我们在银幕上观看舞蹈时，实质性的审美-艺术体验、或有意义的动觉交涉的机会，是否受到损害？（Berleant 2021；Heckman 2021）[^berleant-2021][^heckman-2021]用录像或其他数字工具生成新的舞蹈艺术作品或创造舞蹈舞谱，会如何影响我们关于舞蹈作品是*哪一类东西*的最佳说明？（Blades 2015b；Pakes 2020）[^blades-2015b][^pakes-2020]
