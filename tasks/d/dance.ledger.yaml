      For example, Montero argues that proprioception (the innate capacity that apprises persons of their bodily position in space) might be construed as an aesthetic sense and appeals to scientific research on mirror neurons to defend this view (Montero 2006a, 2006b, 2013, 2016, and 2021)[^montero-2006a]. Carroll expands Montero’s argumentative project to consider how dance and music can work together to affect our kinaesthetic responses (Carroll and Moore 2011)[^carroll-2011] and to explore how experimental results in neuroscience could bolster dance critic John Martin’s theory of “metakinetic transfer” (Carroll and Seeley 2013)[^carr-2013][^carroll-2013][^seeley-2013].
    step1: |-
      例如，Montero 论证，本体感觉（使人知悉其身体在空间中之位置的先天能力）或许可以被构想为一种审美感官，并诉诸镜像神经元的科学研究来为这一观点辩护（Montero 2006a, 2006b, 2013, 2016, and 2021）[^montero-2006a]。Carroll 扩展 Montero 的论证工程，考虑舞蹈与音乐如何能协同影响我们的动觉回应（Carroll and Moore 2011）[^carroll-2011]，并探讨神经科学中的实验结果如何能支持舞蹈评论家 John Martin 的“元动能传递”理论（Carroll and Seeley 2013）[^carr-2013][^carroll-2013][^seeley-2013]。
    step2: |-
      例如，Montero 论证：本体感觉（proprioception，即让人知悉自身身体在空间中位置的先天能力）或许可以视为一种审美感官，并援引镜像神经元的科学研究来辩护这一观点（Montero 2006a, 2006b, 2013, 2016, and 2021）[^montero-2006a]。Carroll 把 Montero 的论证工程向前推进：考察舞蹈与音乐如何协同影响我们的动觉回应（Carroll and Moore 2011）[^carroll-2011]，并探讨神经科学的实验结果如何能支持舞蹈评论家 John Martin 的“元动能传递”（metakinetic transfer）理论（Carroll and Seeley 2013）[^carr-2013][^carroll-2013][^seeley-2013]。
  - id: 63
