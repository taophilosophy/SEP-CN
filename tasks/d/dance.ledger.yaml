      “Improvisation” in dance often refers to the agency and intentional action of dance-makers and performers (who might or might not be the same people) rather than to the *result* of their activity. Three kinds of improvisation in theater dance, as articulated by Curtis Carter, are often discussed (Carter 2000: 182)[^carter-2000]: (1) embellishments where set choreography persists, (2) improvisation as spontaneous free movement for use in established choreography, and (3) improvisation for its own sake brought to a high level of performance. An example of (1) is a case in which a dance performer is allowed to amplify existing movements (doing a triple pirouette in place of a double, for example) or permitted to add a stylistic flourish (such as an extra flick of the wrist or tilt of the head). An example of (2) is a sitution in which no choreography has been provided for eight bars of music and the dancers are instructed to move as they wish in this compositional gap. Finally, (3) covers cases of what D. Davies (2011b) calls a “work performance”, that is, situations in which a dance work is choreographed by the dancers *while* dancing. It also includes cases where either the whole performance, or a substantial part of it, is improvised from start to finish. Dances comprised of Steve Paxton’s “contact improvisation”, for example, could count as improvisation in this third sense (see Paxton 1975 and 1981)[^paxton-1975][^paxton-1981].
    step1: |-
      舞蹈中的“即兴”常常指舞蹈制作者与表演者（他们可能是也可能不是同一批人）的能动性与有意行动，而非其活动的*结果*。Curtis Carter 阐明的剧场舞蹈中的三种即兴常被讨论（Carter 2000: 182）[^carter-2000]：（1）在既定编舞持续存在时的装饰性发挥；（2）作为自发的自由运动的即兴，用于既定编舞之中；（3）为即兴本身而做的即兴，达到高度的表演水平。（1）的一个例子是：允许舞蹈表演者放大既有的运动（例如以三圈单足旋转替代两圈），或允许其添加风格性的花饰（例如手腕多抖一下或头部多倾一下）。（2）的一个例子是：八小节的音乐没有提供编舞，舞者被指示在这个创作空档中随意运动。最后，（3）涵盖 D. Davies（2011b）所称“作品表演”的情形，即舞蹈作品由舞者在*跳舞的同时*加以编舞的情形。它还包括整场表演或其中相当一部分从头到尾即兴的情形。例如，由 Steve Paxton 的“接触即兴”构成的舞蹈可以算作这第三种意义上的即兴（见 Paxton 1975 and 1981）[^paxton-1975][^paxton-1981]。
