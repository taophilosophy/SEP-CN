      ### 1.1 Problems of Identity and “Re”-Activities
    step1: TBD
    step2: TBD
  - id: 13
    kind: body
    source: |-
      The ontological question is pressing for many philosophers because it bears directly on a number of other important issues pertaining to dance preservation and dance art appreciation. As mentioned briefly above, there are many potential “problems of identity” for dance that arise in analytic aesthetics, where these are all related to the basic issue of how the numerical identity of any given work is secured across different performances (cf. Fraleigh 2004 for an alternative usage of the word “identity” for dance)[^fraleigh-2004]. One concern is that, as a matter of practice, the occasion on which a dance is composed does not “fix” the creative product for all time. Although dance works are usually known by the name and date of their first performance, subsequent iterations and casts can change structural and qualitative features of the inaugural presentation, sometimes substantially. A related concern is that many dance art creations simply have no notated score. Even for those that are preserved via video or other form of tangible fixation, later performances may still deviate from these frameworks in significant ways.
    step1: TBD
    step2: TBD
  - id: 14
    kind: body
    source: |-
      There are additional complications to consider. For example, in those relatively rare cases where there is a score from which dance artists work (roughly, as an architect builds from a blueprint), following notated instructions might not produce performances that are *experientially* identifiable as the “same” work of art. Furthermore, a dance notation might function as the jumping-off point from which to make a radically new kind of dance, rather than as a limitation on innovation that constrains future choreographers and dancers. There is also the issue that what a dance “is” in practice, or for purposes of public appreciation, may not be identical to what a dance “is” for purposes of numerical identity and historical preservation. In this way dance is not unlike music (for more on this see S. Davies 1991)[^davies-1991].
    step1: TBD
    step2: TBD
  - id: 15
    kind: body
    source: |-
      Another complication arises from the fact that there are different kinds of “re”-activities commonly undertaken in dance, and the distinctions between them are not clear from the way language is used by members of the danceworld. Philosophers of dance, dance studies scholars, and practitioners, for instance, recognize the possibility of re-performing a dance art creation, reviving one that has languished but not fallen prey to the vicissitudes of time and memory, reconstructing a “lost” piece of dance art history from scholarly resources and personal interviews, and reenacting historically important dance moments or ideas by mounting performances that re-visit them in a new way. The possibility of returning to our dance art past under these various descriptions raises a number of questions. Is it desirable to attempt to reconstruct a work, or is it more profitable to reenact important elements of a choreographer’s *oeuvre*? If historical reconstruction aims to recover a forgotten piece of dance history, must it thereby be understood as an enterprise that aims to preserve the numerical identity of the reconstructed work? What is the difference (if any) between revival and reconstruction, and why should dance insiders pursue either of these “re”-activities rather than creating new works of dance art? Can reenactment provide historical knowledge about our dance pasts?
    step1: TBD
    step2: TBD
  - id: 16
    kind: body
    source: |-
      For detailed treatment of these issues by multiple authors (who are both theorists and practitioners), see anthologies edited by Jordan 2000, Franko 2017, and Main 2017**.** For more on various issues surrounding dance work identity and “re”-activities, see D. Carr 1997; Cohen 1982; Conroy 2013b; Franko 1989 and 2017b; McFee 1994, 1998a, and 2011b; Pakes 2017 and 2020; Rubidge 2000; Sparshott 1988 and 1995; Thomas 2018; and Van Camp 1981 and 2019a. For more on the role of scores in dance, see Armelagos and Sirridge 1978; D. Davies 2011b; Goodman 1976; McFee 2011b and 2018.
    step1: TBD
    step2: TBD
