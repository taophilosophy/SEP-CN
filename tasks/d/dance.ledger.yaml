      One family of philosophical interests is responsive to the definitional question mentioned in Section 1. To this end, one could characterize dance as an artform that involves “action” in a specific way in virtue of its expressive character. Dance historian Selma Jean Cohen (1962) claims that expressiveness is present in all dance, inspiring Monroe C. Beardsley (1982) to argue that this might be a necessary, if not sufficient, condition for dance as art. Borrowing explicitly from action theory, Beardsley notes that one bodily action can, under the right circumstances, *sortally generate* another kind of action. Thus, the act of running can, if conditions are right, become artistically expressive and, thereby, be part of the performance of a dance art creation (see Beardlsey 1982 and Van Camp 1981; cf. Khatchadourian 1978, who argues that dance movements are *not* actions)[^khatchadourian-1978][^van-1981].
    step1: |-
      有一族哲学兴趣回应第 1 节提到的定义问题。为此，人们可以把舞蹈刻画为一种因其表现性格而以特定方式涉及“行动”的艺术形式。舞蹈史学家 Selma Jean Cohen（1962）主张，表现性存在于一切舞蹈之中，这促使 Monroe C. Beardsley（1982）论证，这可能是舞蹈作为艺术的一个必要条件，即使不是充分条件。Beardsley 明显借用行动理论指出，一个身体行动在适当的环境下可以*按种类生成*另一类行动。因此，跑步的行动在条件合适时可以变得在艺术上有表现力，从而成为舞蹈艺术作品表演的一部分（见 Beardlsey 1982 与 Van Camp 1981；参较 Khatchadourian 1978，后者主张舞蹈运动*不是*行动）[^khatchadourian-1978][^van-1981]。
    step2: |-
      有一族哲学关切直接回应第 1 节的定义问题。沿着这条线，可以把舞蹈刻画为一种艺术形式：它凭其表现性格，以特定方式涉及“行动”。舞蹈史学家 Selma Jean Cohen（1962）主张一切舞蹈都有表现性；Monroe C. Beardsley（1982）受此启发，论证这可能是舞蹈之为艺术的必要条件——即便不充分。Beardsley 明确借用行动理论指出：一个身体行动在合适的环境下可以*按种类生成*另一类行动。于是，跑步这一行动在条件合适时可以在艺术上变得富有表现力，从而成为舞蹈艺术作品表演的一部分（见 Beardlsey 1982 与 Van Camp 1981；参较 Khatchadourian 1978——后者主张舞蹈运动*不是*行动）[^khatchadourian-1978][^van-1981]。
