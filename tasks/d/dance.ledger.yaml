      A famous alternative that also addresses definition, broadly construed, is offered by Susanne K. Langer (1953b), who holds that dance as art is a symbol-making endeavor. For Langer, dance’s symbolic character, or “primary illusion”, is what she calls “virtual power” or gesture, in contrast to virtual time (for music), virtual space (for the plastic arts) or the illusion of life (for some poetry and some drama). This semiotic theory implicates action in both the creation and performance of dance artworks and suggests that dance art is constituted of much more intentionally rich ingredients than mere movements or strings of choreographic sequences. Sondra Horton Fraleigh (1996) offers a different conceptual approach, but maintains with other authors considered in this section that dance is necessarily expressive and transitive *action*. (See Meskin 1999 for more on dances as action sequences rather than mere movements. See Carroll and Banes 1982 for a critique of Beardsley’s theory of dance as expressive action.)[^carroll-1982][^meskin-1999]
    step1: |-
      一个也处理广义定义的著名替代方案由 Susanne K. Langer（1953b）提出，她认为舞蹈作为艺术是一种制造符号的事业。对 Langer 来说，舞蹈的符号性格或“基本幻象”，是她所称的“虚拟力”或姿态，相对于（音乐的）虚拟时间、（造型艺术的）虚拟空间或生命幻象（某些诗歌与某些戏剧）。这一符号学理论把行动牵涉进舞蹈艺术作品的创作与表演之中，并暗示舞蹈艺术由比单纯运动或编舞序列的串接远为富有意图的成分构成。Sondra Horton Fraleigh（1996）提供了一种不同的概念进路，但与本节考虑的其他作者一道，坚持舞蹈是必然有表现力的、传递性的*行动*。（关于舞蹈作为行动序列而非单纯运动的更多内容，见 Meskin 1999。关于对 Beardsley 表现性行动舞蹈理论的批评，见 Carroll and Banes 1982。）[^carroll-1982][^meskin-1999]
    step2: |-
      一个同样回应广义定义问题的著名替代方案来自 Susanne K. Langer（1953b）：舞蹈作为艺术是一种制造符号的事业。在 Langer 看来，舞蹈的符号性格亦即其“基本幻象”（primary illusion），是她所说的“虚拟力”（virtual power）或姿态——与音乐的虚拟时间、造型艺术的虚拟空间、某些诗歌与戏剧的生命幻象相对。这套符号学理论把行动牵入舞蹈艺术作品的创作与表演两方，并暗示：构成舞蹈艺术的成分，远比单纯的运动或编舞序列的串接更富于意图。Sondra Horton Fraleigh（1996）提供了另一种概念进路，但与本节讨论的其他作者一样坚持：舞蹈必然是具有表现性的、及物的*行动*。（关于舞蹈作为行动序列而非单纯运动的进一步讨论，见 Meskin 1999。对 Beardsley 表现性行动舞蹈理论的批评，见 Carroll and Banes 1982。）[^carroll-1982][^meskin-1999]
