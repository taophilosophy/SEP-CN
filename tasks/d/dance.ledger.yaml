      There are additional complications to consider. For example, in those relatively rare cases where there is a score from which dance artists work (roughly, as an architect builds from a blueprint), following notated instructions might not produce performances that are *experientially* identifiable as the “same” work of art. Furthermore, a dance notation might function as the jumping-off point from which to make a radically new kind of dance, rather than as a limitation on innovation that constrains future choreographers and dancers. There is also the issue that what a dance “is” in practice, or for purposes of public appreciation, may not be identical to what a dance “is” for purposes of numerical identity and historical preservation. In this way dance is not unlike music (for more on this see S. Davies 1991)[^davies-1991].
    step1: |-
      还有其他复杂性需要考虑。例如，在那些相对罕见的、有舞谱可供舞蹈艺术家依据（大致如建筑师依据蓝图建造）的情形中，遵循记谱指示可能产生不出在*体验上*可识别为“同一”艺术作品的表演。此外，舞蹈舞谱可能起到跳板的作用，从中做出一种全新类型的舞蹈，而不是作为一种限制来约束未来的编舞者与舞者。还有一个问题是，舞蹈在实践中“是”什么，或者就公共欣赏而言“是”什么，可能不同于就数字同一性与历史保存而言舞蹈“是”什么。在这一点上，舞蹈与音乐并无不同（关于这一点详见 S. Davies 1991）[^davies-1991]。
    step2: |-
      还有别的复杂情形。例如，在相对罕见地存在舞谱、舞蹈艺术家据以工作（大致如同建筑师依据蓝图建造）的情况下，遵循记谱指示未必能产生出在*体验上*仍可识别为“同一件”艺术作品的表演。舞谱还可能充当跳板——据此发展出一种全新类型的舞蹈——而不是一种束缚未来编舞者与舞者创新的限制。此外还有一个问题：舞蹈在实践意义上“是”什么，或者就公共欣赏而言“是”什么，未必等同于就数字同一性与历史保存而言舞蹈“是”什么。在这一点上，舞蹈与音乐颇为相似（关于这一点详见 S. Davies 1991）[^davies-1991]。
