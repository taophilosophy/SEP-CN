      舞蹈作为表演艺术有一个常被提及的特征，它加深了为同一性问题给出哲学回答的难度：无论在任何给定表演的进程中还是随时间推移，舞蹈都在运动与变化。概括这种无常——它反映出这一艺术领域中缺乏完全稳定的艺术对象——的笼统说法是：“舞蹈是一门短暂的艺术。”这一惯用语容许不同的解释（见 Conroy 2012；Copeland and Cohen 1983；Copeland 1993；Jollimore 2019；以及 Pakes 2020）[^conroy-2012][^copeland-1993][^copeland-1983][^jollimore-2019][^pakes-2020]，但无论取哪种解释，都不应把它理解为舞蹈艺术空洞或不严肃。它标示的是：舞蹈中有什么至关重要的东西*正当*舞者表演的同时消逝；人们使用这一说法，往往正是想促使哲学家把这看作舞蹈之为艺术形式的显著乃至核心特征。
