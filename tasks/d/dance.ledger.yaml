      One feature of dance as a performing art that is often noted, and contributes to the challenge of offering a philosophical answer to the identity question, is that it moves and changes, both during the course of any given performance and over time. A catchall phrase for this sort of impermanence—reflecting the lack of entirely stable art objects in this artistic milieu—is that “dance is an ephemeral art.” While it admits of alternative interpretations (see Conroy 2012; Copeland and Cohen 1983; Copeland 1993; Jollimore 2019; and Pakes 2020)[^conroy-2012][^copeland-1993][^copeland-1983][^jollimore-2019][^pakes-2020], in no case should this common locution be taken to imply that dance art is insubstantial or unserious. Instead, it signals that there is something vital about dance that disappears *as* the dancers perform, and its use is often meant to encourage philosophers to regard this as a significant, or even central, feature of dance qua artform.
