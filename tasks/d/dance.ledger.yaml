      This view has been criticized in various ways for neglecting the artistic significance of the performers’ role in making and performing dances (see Alpert 2016; Bresnahan 2013; and Pakes 2020)[^alpert-2016][^bresnahan-2013][^pakes-2020]. It has also been suggested that the dancer might be rightly regarded as a co-author (with the choreographer) of a different kind of artistic product, the “performed work”, a concatenation of the performable crafted by the dancemaker and the performance interpretation created by the dancers (see Thom 2019)[^thom-2019]. McFee (2018) bolsters his controversial account with the idea that *authorship* of dance artworks is, and should be, attributable only to those who bear both generative and artistic responsibility for them. This comes close to, yet stops short of, equating authorial credit for dances with intellectual property rights. It is worth noting, therefore, that it is by no means the case (particularly in the U.S.) that those who create works of dance art are the persons given public credit for, or granted legal copyright over, them.
    step1: |-
      这一观点因忽视表演者在制作与表演舞蹈中的艺术重要性而受到各种批评（见 Alpert 2016；Bresnahan 2013；以及 Pakes 2020）[^alpert-2016][^bresnahan-2013][^pakes-2020]。也有人提出，舞者或许可以被恰当地视为另一种艺术产品——“被表演的作品”——的共同作者（与编舞者一道），后者是舞蹈制作者制作的可表演之物与舞者创造的表演诠释的串接（见 Thom 2019）[^thom-2019]。McFee（2018）以如下观念强化其有争议的说明：舞蹈艺术作品的*作者身份*属于、且应当只属于那些对作品同时负有生成性责任与艺术性责任的人。这一说法接近于把舞蹈的作者性功劳等同于知识产权，但又止步于此。因此值得指出的是：创作舞蹈艺术作品的人恰恰就是被给予公开功劳或被授予法律版权的人，这种情况绝非必然（尤其在美国）。
    step2: |-
      这一观点因忽视表演者在舞蹈创作与表演中的艺术意义而受到多方面批评（见 Alpert 2016；Bresnahan 2013；以及 Pakes 2020）[^alpert-2016][^bresnahan-2013][^pakes-2020]。也有人建议：舞者或许可以被恰当地当作另一种艺术产品——“被表演的作品”（performed work）——的共同作者（与编舞者并列）；这种产品是舞蹈制作者制作的可表演之物与舞者创造的表演诠释的串接（见 Thom 2019）[^thom-2019]。McFee（2018）用如下观念来加固他那有争议的立场：舞蹈艺术作品的*作者身份*（authorship）属于、且应当只属于那些对作品同时承担生成性责任与艺术性责任的人。这个说法与“把舞蹈的作者功劳等同于知识产权”仅一步之遥，但终究止步于此。因此值得指出：舞蹈艺术作品的创作者与获得公开署名或法定版权的人未必是同一批人——在美国尤其如此。
