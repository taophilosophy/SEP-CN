      ### 1.2 Dance as an Ephemeral Artform
    step1: TBD
    step2: TBD
  - id: 18
    kind: body
    source: |-
      One feature of dance as a performing art that is often noted, and contributes to the challenge of offering a philosophical answer to the identity question, is that it moves and changes, both during the course of any given performance and over time. A catchall phrase for this sort of impermanence—reflecting the lack of entirely stable art objects in this artistic milieu—is that “dance is an ephemeral art.” While it admits of alternative interpretations (see Conroy 2012; Copeland and Cohen 1983; Copeland 1993; Jollimore 2019; and Pakes 2020)[^conroy-2012][^copeland-1993][^copeland-1983][^jollimore-2019][^pakes-2020], in no case should this common locution be taken to imply that dance art is insubstantial or unserious. Instead, it signals that there is something vital about dance that disappears *as* the dancers perform, and its use is often meant to encourage philosophers to regard this as a significant, or even central, feature of dance qua artform.
    step1: TBD
    step2: TBD
  - id: 19
    kind: body
    source: |-
      To wit, dance critic Marcia Siegel famously wrote that dance “exists at a perpetual vanishing point” which, for Siegel, means that dance exists in “an event that disappears in the very act of materializing” (1972: 1). She posits that artistic dance escaped the mass marketing of the industrial revolution “precisely because it doesn’t lend itself to any reproduction…” (1972: 5). The most conservative ontological interpretation of Siegel’s claims might be that dance *performances* are one-time, transient events (Conroy 2012)[^conroy-2012]. This, however, would not be a philosophically consquential reading because it is (relatively) uncontroversial that all theatrical performances are events and all events are transient. Hence, what seems to be at stake in describing dance art as ineluctably ephemeral is the idea that its fleetingness is *more significant appreciatively* than is the transience characteristic of the other performing arts, such as music and theater. If this is true, then it will be crucial for every full-blooded philosophical account of dance to address the nature and aesthetic-artistic importance of its fragility.
    step1: TBD
    step2: TBD
  - id: 20
    kind: body
    source: |-
      One way to address this challenge is to adopt a negative view of the ephemerality of dance art. To this end, one might argue that dance’s natural tendency to “evaporate” in real time threatens the possibility of presenting the same dance artwork on multiple occasions and, thereby, puts pressure on the idea that dance falls under the “classical paradigm” discussed by D. Davies (2011b) and upheld by Goodman (1976) and McFee (2011b and 2018). Another tactic is to emphasize facts about the practical realities of life in the dance art community. Because dance artists do not trade in writing scores or scripts, and dance practitioners are highly tolerant of making adjustments for both artistic and pragmatic reasons, many dance art creations simply do not survive for very long unless they continue to be performed consistently.
    step1: TBD
    step2: TBD
  - id: 21
    kind: body
    source: |-
      A contrary approach takes the ephemeral character of dance to be one of its good-making features. On this positive view, we ought to appreciate, rather than decry, dance’s ever-changing and disappearing nature (Jollimore 2019)[^jollimore-2019]. Defenders of this view often note that ephemerality is a key attribute that makes a performance of a dance into a *vital experience* for both the dance performers and the audience. The positive proposal celebrates the live nature of the dance event and aims to explain why kinesthetic responses to dance art performances could be both appreciatively relevant and viscerally powerful. It also suggests that ephemerality might serve an important aesthetic role for dance insofar as it provides a uniquely robust “you had to be there” theatrical experience. (See Bresnahan 2014a for an account of improvisational artistry in live dance performance consistent with this perspective.)[^bresnahan-2014a] Depending on how it is cashed out, this interpretation of the idea that dance “exists at a perpetual vanishing point” might or might not be tension with contemporary theoretical approaches that regard dance art as in a new era of “post-ephemerality” (Franko 2018b)[^franko-2018b].
    step1: TBD
    step2: TBD
  - id: 22
    kind: body
    source: |-
      ## 2. Dance, Action, and Agency
    step1: TBD
    step2: TBD
  - id: 23
    kind: body
    source: |-
      Philosophers of dance frame questions about action and agency in markedly different ways, though most embrace the basic view that dancing is an activity and, therefore, not something that can be done accidentally (see McFee 1992, 2011b, and 2018). Those with an interest in dance as a form of expert action (akin to sports) tend to center their analyses on technical and athletic prowess, as well as on artistic skills like moving with expressivity or grace, and to focus on dance as art (see Montero 2016)[^montero-2016]. Others with an interest in vernacular or communal dance forms explore puzzles that can arise when movers coalesce into temporary dancing communities that seem, for the duration of the dance event, to have an agential component that exceeds, and is distinct from, that of any particular dancer in the group (see Kronsted 2021 and 2023)[^kronsted-2021][^kronsted-2023]. The presumption that dance is not mere physical movement opens up a number of roles for intentional action to play in any philosophical treatment of dance as art or social activity.
    step1: TBD
    step2: TBD
  - id: 24
    kind: body
    source: |-
      One family of philosophical interests is responsive to the definitional question mentioned in Section 1. To this end, one could characterize dance as an artform that involves “action” in a specific way in virtue of its expressive character. Dance historian Selma Jean Cohen (1962) claims that expressiveness is present in all dance, inspiring Monroe C. Beardsley (1982) to argue that this might be a necessary, if not sufficient, condition for dance as art. Borrowing explicitly from action theory, Beardsley notes that one bodily action can, under the right circumstances, *sortally generate* another kind of action. Thus, the act of running can, if conditions are right, become artistically expressive and, thereby, be part of the performance of a dance art creation (see Beardlsey 1982 and Van Camp 1981; cf. Khatchadourian 1978, who argues that dance movements are *not* actions)[^khatchadourian-1978][^van-1981].
    step1: TBD
    step2: TBD
  - id: 25
    kind: body
    source: |-
      A famous alternative that also addresses definition, broadly construed, is offered by Susanne K. Langer (1953b), who holds that dance as art is a symbol-making endeavor. For Langer, dance’s symbolic character, or “primary illusion”, is what she calls “virtual power” or gesture, in contrast to virtual time (for music), virtual space (for the plastic arts) or the illusion of life (for some poetry and some drama). This semiotic theory implicates action in both the creation and performance of dance artworks and suggests that dance art is constituted of much more intentionally rich ingredients than mere movements or strings of choreographic sequences. Sondra Horton Fraleigh (1996) offers a different conceptual approach, but maintains with other authors considered in this section that dance is necessarily expressive and transitive *action*. (See Meskin 1999 for more on dances as action sequences rather than mere movements. See Carroll and Banes 1982 for a critique of Beardsley’s theory of dance as expressive action.)[^carroll-1982][^meskin-1999]
    step1: TBD
    step2: TBD
  - id: 26
    kind: body
    source: |-
      Another set of concerns about action in dance relates more readily to the ontological question (see Section 1). For instance, Anna Pakes’ view of dance works as indicated or initiated action-types appeals to action to articulate what kind of things such artworks *are* at the most fundamental metaphysical level (Pakes 2020)[^pakes-2020]. Pakes agrees that action is a necessary feature of dance in general (2013) and, with Aaron Meskin (1999), urges that the embodiment of dance in physical, intentional events renders works of dance art better construed as created action-structures than eternal types or Platonic Forms. Considerations about the embodied nature of dancing also incline Pakes to be wary of the idea that there could be such a thing as purely “conceptual dance”, i.e., a dance artwork in which the actions that constitute the dancing are merely a means to some further artistic-intellectual end (Pakes 2019a)[^pakes-2019a]. A distinct, but obliquely related, topic in this domain is how to understand the *normativity* embedded in dance art as the product of intentional actions undertaken in the appropriate contexts, issuing from the right kind of psychological states (McFee 2021b)[^mcfee-2021b].
    step1: TBD
    step2: TBD
  - id: 27
    kind: body
    source: |-
      Other contemporary dance philosophers regard the minded *agency* involved in creating choreography, performing dance, or both, as a primary area of philosophical interest. Often their accounts are connected to normative, epistemic and ontological commitments about what dance is and why it matters. Many such theorists (including Bresnahan 2014a, 2017a, and 2019b; Kronsted 2020 and 2023; Merritt 2015; and Montero 2016)[^bresnahan-2014a][^kronsted-2023][^merritt-2015][^montero-2016] utilize tools from both analytic and phenomenological traditions, coupled with insights from research in the cognitive sciences. (See Section 4.) Some attend to the activities and agency of audience members qua appreciators, but most focus on the intentional and embodied activities of dancers.
    step1: TBD
    step2: TBD
  - id: 28
    kind: body
    source: |-
      It is helpful to keep in mind that three disctinct, though not mutually exclusive, kinds of agency are often explored in connection with dance performers. First, there is a “thin” sense of agency that simply distinguishes dancing persons from, say, Boston Dynamic robots on the grounds that the former, but not the latter, execute movements under intentional descriptions (McFee 2018)[^mcfee-2018]. Second, there is a “thicker” sense of agency that tracks the degree to which dancers are afforded various kinds of opportunities to make free decisions that express their intentionality, and unique personalities, as they perform (Bresnahan 2014a)[^bresnahan-2014a]. Third, there is a phenomenon one might call “mixed” agency that refers to cases in which dancers have the conflicted experience of being both the authors of their movements and of losing executive control to a partner or larger group (Kronsted 2021 and 2023)[^kronsted-2021][^kronsted-2023].
    step1: TBD
    step2: TBD
  - id: 29
    kind: body
    source: |-
      For more on dance agency and intentional action see Bunker, Pakes and Rowell 2013; D. Carr 1987; J. Carr 2013; Conroy 2021; Noland 2009; and Sheets-Johnstone 1981, 1999, 2011, and 2012.
    step1: TBD
    step2: TBD
