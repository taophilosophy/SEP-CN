      The alternative to reifying, evidently, is not to reify, and the most obvious way of doing so is to go down a modal route. Instead of cashing out provability by means of proof-existence, deductivists could take provability to be a modal primitive. Logical possibility and necessity are these days typically understood model-theoretically: a statement is logically possible or consistent just when it is true in some model; and necessary just when it is true in all models. The deductivist must abjure this account of consistency (which she equates with logical possibility), on pain of re-introducing mathematics in the metatheory. Against the prevailing model-theoretic account, she must take “it is logically possible that” as a primitive notion, and forgo its analysis in terms of models (Putnam 1967b)[^putnam-1967b]. In so doing, she is in the same boat as all anti-platonists who cannot help themselves to model theory or set theory in the metatheory. This particular boat is a crowded one: it holds not just eliminative structuralists, but also formalists of various stripes and nominalists as well. Nominalists, for example, do not believe in abstract objects. Hence they face the same predicament—they cannot appeal to the existence of models in the metatheory. Hartry Field (1991) develops a nominalist logic that takes the notion of logical consistency as primitive, which we may symbolise as $\diamond$, with the associated notion of logical necessity being $\square$. In particular, $\diamond T$ is the claim that the theory $T$ is logically consistent, and claims of logical implication are conditionals prefaced by $\square$.[^note-12] The non-reifying deductivist can avail themself of these resources and thereby construe $G \vdash p$ as $\square(\wedge G \rightarrow p)$.
    step1: |-
      显然，实体化的替代方案就是不实体化，而最明显的做法是走模态路线。演绎主义者可以不以证明之存在来兑现可证性，而把可证性当作一个模态原始项。如今，逻辑可能性与必然性通常按模型论来理解：一个语句是逻辑可能的或一致的，当且仅当它在某个模型中为真；是必然的，当且仅当它在一切模型中为真。演绎主义者必须放弃这种一致性（她将其等同于逻辑可能性）说明，否则就要在元理论中重新引入数学。面对盛行的模型论说明，她必须把“逻辑上可能的是”当作原始概念，并放弃以模型来分析它（Putnam 1967b）[^putnam-1967b]。这样一来，她与一切无法在元理论中倚仗模型论或集合论的反柏拉图主义者同舟。这条船上人满为患：船上不只有消除式结构主义者，还有形形色色的形式主义者与唯名论者。例如唯名论者不相信抽象对象，故面临同样困境——他们不能在元理论中诉诸模型之存在。Hartry Field（1991）发展了一种唯名论逻辑，把逻辑一致性概念当作原始项，我们可以 $\diamond$ 表示之，相应的逻辑必然性概念则为 $\square$。特别是，$\diamond T$ 即“理论 $T$ 在逻辑上一致”这一断言，而逻辑蕴涵的断言则是在前冠以 $\square$ 的条件句。[^note-12] 非实体化的演绎主义者可以动用这些资源，从而把 $G \vdash p$ 诠释为 $\square(\wedge G \rightarrow p)$。
