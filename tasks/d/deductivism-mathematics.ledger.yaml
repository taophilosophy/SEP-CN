      When we dig down into the details, however, some clear differences emerge. Deductivists take mathematical claims to be about sentences, whereas eliminative structuralists take them to be generalisations over structures. Unlike deductivists, eliminative structuralists therefore owe us an account of the metaphysics of structures. Eliminative structuralists also usually couple their account with the existential assertion that a structure of the right kind exists (or could exist), whereas deductivists often omit the corresponding claim that the axioms are consistent. One well-known version of eliminative structuralism, first articulated by Putnam (1967b) and developed by Hellman (1989), is modal, whereas deductivism is usually not modal. (Although see §5 for how to spell out deductivism in terms of a primitive modal operator.) Finally, eliminative structuralism is but one of the many forms of structuralism around today. Some, such as Hellman’s version, have much in common with the eliminative variety closest to deductivism; others, such as Shapiro’s ante rem structuralism (Shapiro 1997)[^shapiro-1997], less so.
    step1: |-
      然而，当我们深入细节，一些明显的差异便显现出来。演绎主义者认为数学断言关乎语句，消除式结构主义者则认为它们是对结构的一般化断言。因此，与演绎主义者不同，消除式结构主义者欠我们一个关于结构之形而上学的说明。消除式结构主义者通常还把其说明与“存在（或可能存在）一个适当类型的结构”这一存在性断言结合起来，而演绎主义者常常省略“公理是一致的”这一相应断言。消除式结构主义一个著名版本由 Putnam（1967b）首先表述、由 Hellman（1989）发展，是模态的；而演绎主义通常不是模态的。（不过，如何以原始模态算子来表述演绎主义，见第 5 节。）最后，消除式结构主义只是当今众多结构主义形态之一。有些形态（如 Hellman 的版本）与最接近演绎主义的消除式变体共通颇多；另一些（如 Shapiro 的先于实在的结构主义（Shapiro 1997）[^shapiro-1997]）则较少。
    step2: |-
      然而深入细节，一些明显差异便显现出来。演绎主义者认为数学断言关乎语句，消除式结构主义者则认为它们是对结构的一般化。因此与演绎主义者不同，后者欠我们一个关于结构之形而上学的说明。消除式结构主义者通常还把其说明与“存在（或可能存在）一个适当类型的结构”这一存在断言结合；演绎主义者则常省略“公理是一致的”这一相应断言。消除式结构主义有一著名版本，由 Putnam（1967b）首述、Hellman（1989）发展，是模态的；演绎主义通常不是。（不过，如何以原始模态算子表述演绎主义，见第 5 节。）最后，消除式结构主义只是当今众多结构主义形态之一：有些（如 Hellman 的版本）与最接近演绎主义的消除式变体共通甚多，另一些（如 Shapiro 的先于实在的结构主义，Shapiro 1997[^shapiro-1997]）则较少。
