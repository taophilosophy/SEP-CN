      [^note-19]: 要讲清一个语句在某种绝对意义上缺乏证明究竟意味着什么，是困难的。但此处我们只是在描述通常的态度，并非试图阐明它。哥德巴赫猜想说的是：每个大于 2 的偶数都是两个素数之和。
    step2: |-
      [^note-19]: 讲清“语句在某种绝对意义上缺乏证明”之含义颇难；此处仅描述通常态度，非试图阐明之。哥德巴赫猜想的表述是：每个大于 2 的偶数皆为两素数之和。
