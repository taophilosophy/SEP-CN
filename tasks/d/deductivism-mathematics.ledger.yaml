      Deductivism and eliminative structuralism share some general features. Roughly speaking, both understand a mathematical claim $p$ as “the axioms imply that $p$” (where “the axioms” may be understood as those of the germane branch of mathematics or otherwise—for different versions of deductivism, see §4). Deductivism understands the relevant implication deductively, eliminative structuralism semantically. For deductivists, the relevant notion of implication or consequence is the syntactic one which in logic is denoted by “$\vdash$”; to say that $\Gamma \vdash \delta$ is to say that the sentence $\delta$ is derivable from $\Gamma$ in some specified deductive system. For eliminative structuralists, the relevant notion of implication or consequence is instead the semantic one which in logic is denoted by “$\vDash$”. Eliminative structuralists, for example, construe “$2 + 2 = 4$” as a claim about what holds in any structure in which the axioms of arithmetic are satisfied.[^note-3]
    step1: |-
      演绎主义与消除式结构主义共享一些一般特征。粗略地说，二者都把数学断言 $p$ 理解为“公理蕴涵 $p$”（其中“公理”可理解为相关数学分支的公理，或别的什么——演绎主义的不同版本见第 4 节）。演绎主义把相关蕴涵理解为演绎的，消除式结构主义则理解为语义的。对演绎主义者而言，相关的蕴涵或后承概念是在逻辑中以“$\vdash$”表示的句法概念；说 $\Gamma \vdash \delta$，就是说语句 $\delta$ 在某个指定的演绎系统中可由 $\Gamma$ 导出。对消除式结构主义者而言，相关的蕴涵或后承概念则是逻辑中以“$\vDash$”表示的语义概念。例如，消除式结构主义者把“$2 + 2 = 4$”理解为关于“凡满足算术公理的结构中何者成立”的断言。[^note-3]
    step2: |-
      演绎主义与消除式结构主义共享若干一般特征：粗略地说，二者都把数学断言 $p$ 理解为“公理蕴涵 $p$”（“公理”可指相关数学分支的公理，亦可指别的——不同版本见第 4 节）。区别在于：演绎主义把相关蕴涵理解为演绎的，消除式结构主义则理解为语义的。对演绎主义者而言，相关的蕴涵或后承概念是逻辑中以“$\vdash$”表示的句法概念；说 $\Gamma \vdash \delta$，即语句 $\delta$ 可在某指定演绎系统中由 $\Gamma$ 导出。对消除式结构主义者而言，相关的蕴涵或后承概念则是逻辑中以“$\vDash$”表示的语义概念：例如他们把“$2 + 2 = 4$”理解为“凡满足算术公理的结构中何者成立”。[^note-3]
