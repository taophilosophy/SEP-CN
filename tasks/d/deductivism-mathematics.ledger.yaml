      The fourth challenge concerns applications. §2 mentioned that deductivism appears to provide a straightforward account of the applicability of mathematics: provided a physical system satisfies the axioms of a particular branch of mathematics, the branch’s theorems must apply to the physical system. But what exactly does it mean for a system to satisfy an axiom? The simplest account of applications is the mapping or isomorphism account. Given a physical set-up $P$, stipulate an isomorphism from $P$ to some mathematical structure $M$, deduce some facts about $M$, and then, applying the isomorphism in the reverse direction, read off the corresponding facts about $P$. Resnik (1980, 125), following Russell and Putnam, worries that this account is knee-deep in mathematics—for what is an isomorphism if not a mathematical object? More generally, a satisfactory account of mathematical applications will have to employ mathematics to explain how mathematics relates to the physical world.[^note-16]
    step1: |-
      第四项挑战关乎应用。第 2 节提到，演绎主义似乎为数学的可应用性提供了一个直截了当的说明：只要一个物理系统满足某数学分支的公理，该分支的定理就必定适用于该物理系统。但一个系统满足一条公理，究竟是什么意思？最简单的应用说明是映射或同构说明。给定一个物理装置 $P$，规定一个从 $P$ 到某数学结构 $M$ 的同构，推出关于 $M$ 的某些事实，然后反向运用该同构，读出关于 $P$ 的相应事实。Resnik（1980, 125）继罗素与 Putnam 之后，担心这一说明深陷于数学之中——因为同构若不是数学对象，又是什么？更一般地说，一个令人满意的数学应用说明将不得不动用数学来解释数学如何与物理世界相关。[^note-16]
    step2: |-
      第四项挑战关乎应用。第 2 节提到，演绎主义似为数学可应用性提供直截了当的说明：只要物理系统满足某数学分支的公理，该分支定理便必适用于它。但“系统满足一条公理”究竟何意？最简单的应用说明是映射或同构说明：给定物理装置 $P$，规定从 $P$ 到某数学结构 $M$ 的同构，推出关于 $M$ 的某些事实，再反向运用同构、读出关于 $P$ 的相应事实。Resnik（1980, 125）继罗素与 Putnam 之后担心：此说明深陷于数学——同构若非数学对象又是什么？更一般地说，令人满意的数学应用说明将不得不用数学来解释数学如何与物理世界相关。[^note-16]
