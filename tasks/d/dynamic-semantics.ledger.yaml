      On the assumption that examples like (10) should receive a dynamic treatment (see the earlier remark on alternative explanations and Nouwen, forthcoming, for discussion), the conclusion can only be that universal quantifiers should not be given a static interpretation. The next question is then what kind of interpretation is appropriate, and how this interpretation can distinguish the infelicitous case of anaphora in (9) from the case in (10). One option would be to distinguish between the values assigned to the variables that are bound by the quantifier in its scope and the value assigned to that variable outside the scope of the quantifier. (See, for instance, Kamp and Reyle 1993 for such a strategy and Nouwen 2007 for discussion.)[^kamp-1993][^nouwen-2007] In order to account for (10), one would have the variable occurrences bound by the quantifier in the first sentence of (10) range over individual boys, while that variable gets assigned the plurality of all boys outside the quantifier’s scope (i.e. in the second sentence). As van den Berg (1996) was the first to show, however, such a solution only gets there half-way. In discourse, pronouns do not just have access to pluralities associated to quantifiers, but also to the relations such quantifiers are engaged in. For instance, in the second sentence of (11) the pronoun $it$ covaries with the quantification over the boys in the subject in such a way that the second sentence is understood to mean that each boy submitted the paper that $he$ wrote (cf. van den Berg 1996; Krifka 1996; Nouwen 2003; Brasoveanu 2007, 2008)[^berg-1996][^brasoveanu-2007][^krifka-1996][^nouwen-2003].
    step1: |-
      假设像 (10) 这样的例子应得到动态处理（关于替代解释的先前评论与讨论，参见 Nouwen, forthcoming），结论只能是：不应给全称量词一个静态解释。下一个问题是：何种解释是恰当的，以及这种解释如何把 (9) 中不可接受的回指情形与 (10) 中的情形区分开来。一种选项是区分量化词在其辖域内约束的变元所取的值，与该变元在量化词辖域之外被指派的值。（例如参见 Kamp and Reyle 1993 的这种策略与 Nouwen 2007 的讨论。）[^kamp-1993][^nouwen-2007]为了解释 (10)，可以让 (10) 第一句中被量词约束的变元出现遍历个体的男孩，而该变元在量词辖域之外（即第二句中）被指派所有男孩的复数整体。然而，正如 van den Berg（1996）最早指出的，这样的解决方案只走了一半的路。在话语中，代词不仅能访问与量词相联系的复数整体，还能访问这些量词所牵涉的关系。例如，在 (11) 的第二句中，代词 $it$ 与主语中对男孩们的量化共变，使得第二句被理解为：每个男孩提交了他所写的那篇文章（参见 van den Berg 1996; Krifka 1996; Nouwen 2003; Brasoveanu 2007, 2008）[^berg-1996][^brasoveanu-2007][^krifka-1996][^nouwen-2003]。
    step2: |-
