      (16) 这类例子使人怀疑 (15) 这类增量解释图式是否有价值。此外，(15) 关于解释如何展开的假定也颇显武断：断言一个命题内容为 $p$ 的小句，并不自动使 $p$ 成为共同知识；这样的断言更应视为使 $p$ 成为共同知识的 **提议**，而 $p$ 是否成为共同基础，取决于其他对话者是否愿意接受该命题（例如不反对该断言）。换言之，(15) 似乎不适于刻画信息流（之动态）的语用学。
