      The upshot is that given a suitably structured notion of context, quantifiers can be given dynamic interpretations generally. An important consequence is that this kind of analysis extends to non-nominal quantifiers (Brasoveanu 2007)[^brasoveanu-2007]. Cases like (11) could be described as cases of quantificational subordination, and the structured context approach can be seen as designed to offer a window into the mechanism behind subordination. Cases of modal subordination (Roberts 1987, 1989)[^roberts-1987], like the famous (12), can receive a parallel treatment.
    step1: |-
      结论是：只要有一个结构恰当的语境概念，量词一般都能得到动态解释。一个重要推论是这类分析可以扩展到非名词性量词（Brasoveanu 2007）[^brasoveanu-2007]。像 (11) 这样的情形可以描述为量化从属的情形，而结构化语境进路可以看作旨在为从属背后的机制提供一扇窗口。情态从属的情形（Roberts 1987, 1989）[^roberts-1987]，如著名的 (12)，可以得到平行的处理。
    step2: |-
      结论是：只要语境概念结构得当，量词一般都能获得动态解释。一个重要推论是：这类分析能扩展到非名词性量词（Brasoveanu 2007）[^brasoveanu-2007]。像 (11) 这样的情形可描述为量化从属的情形；结构化语境进路可以看作旨在为从属背后的机制开一扇窗。至于情态从属的情形（Roberts 1987, 1989）[^roberts-1987]，如著名的 (12)，亦可获得平行处理。
