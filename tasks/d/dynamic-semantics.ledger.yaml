      ## 4. Encoding Dynamics in Typed Logic
    step1: TBD
    step2: TBD
  - id: 122
    kind: body
    source: |-
      Compositionality has always been an important concern in the use of logical systems in natural language semantics (see the entry on compositionality). Through the use of higher order logics (see the entries on second-order and higher-order logics and Church’s type theory), a thoroughly compositional account of, e.g., the quantificational system of natural language can be achieved, as is demonstrated in classical Montague grammar (Montague 1974a,b, 1973; compare the entry on logical form)[^montague-1974a]. We will review how the dynamic approach can be extended to higher order systems. The link between dynamic semantics and type theory is more like a liaison than a stable marriage: there is no intrinsic need for the connection. The connection is treated here to explain the historical influence of Montague grammar on dynamic semantics.
    step1: TBD
    step2: TBD
  - id: 123
    kind: body
    source: |-
      Most proposals for dynamic versions of Montague grammar develop what are in fact higher order versions of dynamic predicate logic (DPL). This holds for Groenendijk and Stokhof 1990; Chierchia 1992, 1995; Muskens 1994, 1995, 1996; Eijck 1997; Eijck and Kamp 1997; Kohlhase et al. 1996; and Kuschert 2000. These systems all inherit a feature (or bug) from the DPL approach: they make re-assignment destructive. DRT does not suffer from this problem: the discourse representation construction algorithms of Kamp 1981 and Kamp and Reyle 1993 are stated in terms of functions with finite domains, and carefully talk about “taking a fresh discourse referent” to extend the domain of a verifying function, for each new noun phrase to be processed.
    step1: TBD
    step2: TBD
