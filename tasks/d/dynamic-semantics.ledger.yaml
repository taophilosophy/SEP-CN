      > $\exists x\phi$ 在模型 $M$ 中相对于变量赋值 $\alpha$ 为真，当且仅当存在某个变量赋值 $\beta$，使得 $\beta$ 与 $\alpha$ 至多在赋予 $x$ 的值上不同，并且 $\phi$ 在 $M$ 中相对于赋值 $\beta$ 为真。
