      ### 1.2 Propositional Logic as an Update Logic
    step1: |-
      ### 1.2 作为更新逻辑的命题逻辑
    step2: |-
      ### 1.2 作为更新逻辑的命题逻辑
  - id: 13
    kind: body
    source: |-
      Propositional logic (the logic of negation, disjunction and conjunction) can be viewed as an update logic as follows. Consider the case where we have three basic propositions $p, q$ and $r$, and we know nothing about their truth. Then there are eight possibilities: $\{ \bar{p} \bar{q} \bar{r}, p \bar{q} \bar{r}, \bar{p} q \bar{r}, \bar{p} \bar{q} r, pq \bar{r}, p \bar{q} r, \bar{p} qr, pqr \}$ Here $\bar{p} \bar{q} \bar{r}$ should be read as: none of $p, q, r$ is true, $p \bar{q} \bar{r}$ as: $p$ is true but $q$ and $r$ are false, and so on. If now $\neg p$ (“not $p$”) is announced, four of these disappear, and we are left with $\{\bar{p} \bar{q} \bar{r}, \bar{p} q \bar{r}, \bar{p} \bar{q} r, \bar{p} qr\}$. If next $q \vee \neg r$ (“$q$ or not $r$”) is announced, the possibility $\bar{p} \bar{q} r$ gets ruled out, and we are left with $\{ \bar{p} \bar{q} \bar{r}, \bar{p} q \bar{r}, \bar{p} qr \}$. And so on. We can view the meaning of propositions like $\neg p$ and $q \vee \neg r$ as mappings from sets of possibilities to subsets thereof.
    step1: |-
      命题逻辑（否定、析取与合取的逻辑）可以按如下方式看作一种更新逻辑。考虑我们有三个基本命题 $p, q$ 和 $r$、对其真假一无所知的情形。此时有八种可能：$\{ \bar{p} \bar{q} \bar{r}, p \bar{q} \bar{r}, \bar{p} q \bar{r}, \bar{p} \bar{q} r, pq \bar{r}, p \bar{q} r, \bar{p} qr, pqr \}$ 其中 $\bar{p} \bar{q} \bar{r}$ 应读作：$p, q, r$ 均不为真，$p \bar{q} \bar{r}$ 读作：$p$ 为真而 $q$ 与 $r$ 为假，依此类推。现在宣告 $\neg p$（"非 $p$"），其中四种消失，剩下 $\{\bar{p} \bar{q} \bar{r}, \bar{p} q \bar{r}, \bar{p} \bar{q} r, \bar{p} qr\}$。接着宣告 $q \vee \neg r$（"$q$ 或非 $r$"），可能情形 $\bar{p} \bar{q} r$ 被排除，剩下 $\{ \bar{p} \bar{q} \bar{r}, \bar{p} q \bar{r}, \bar{p} qr \}$。如此继续。我们可以把 $\neg p$ 和 $q \vee \neg r$ 这类命题的意义看作从可能集到其子集的映射。
    step2: |-
      命题逻辑（否定、析取与合取的逻辑）可以按如下方式看作更新逻辑。设有三个基本命题 $p, q$ 与 $r$，对其真假一无所知，则共有八种可能：$\{ \bar{p} \bar{q} \bar{r}, p \bar{q} \bar{r}, \bar{p} q \bar{r}, \bar{p} \bar{q} r, pq \bar{r}, p \bar{q} r, \bar{p} qr, pqr \}$。其中 $\bar{p} \bar{q} \bar{r}$ 应读作：$p, q, r$ 皆不为真；$p \bar{q} \bar{r}$ 读作：$p$ 为真而 $q$ 与 $r$ 为假；依此类推。现在宣告 $\neg p$（"非 $p$"），八种可能中四种随之消失，剩下 $\{\bar{p} \bar{q} \bar{r}, \bar{p} q \bar{r}, \bar{p} \bar{q} r, \bar{p} qr\}$。再宣告 $q \vee \neg r$（"$q$ 或非 $r$"），可能情形 $\bar{p} \bar{q} r$ 遭到排除，剩下 $\{ \bar{p} \bar{q} \bar{r}, \bar{p} q \bar{r}, \bar{p} qr \}$。如此类推。$\neg p$ 与 $q \vee \neg r$ 这类命题的意义，便可看作从可能集到其子集的映射。
