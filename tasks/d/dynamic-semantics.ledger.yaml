    kind: body
    source: |-
      In extensional Montague grammar “a man” translates as:

      $$\lambda P\exists x(\textrm{man } x \wedge Px).$$
    step1: TBD
    step2: TBD
  - id: 125
    kind: body
    source: |-
      Here $P$, of type $e \rightarrow t$, is the variable for the VP slot: it is assumed that VPs denote sets of entities.
    step1: TBD
    step2: TBD
