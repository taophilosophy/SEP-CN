    source: |-
      Assuming a domain of entities, contexts are finite lists of entities. If $c$ is a context of length $n$, then we refer to its elements as $c[0]$, $\ldots ,c[n-1]$, and to its length as $\lvert c\rvert$. We will refer to the type of contexts of length $i$ as $[e]^i$. If $c$ is a context in $[e]^i$, then objects of type $\{0, \ldots ,i-1\}$ can serve as indices into $c$. If $c \in[e]^i$ and $j \in \{0, \ldots ,i-1\}$, then $c[j]$ is the object of type e that occurs at position $j$ in the context. A key operation on contexts is extension with an element. If $c :: [e]^i$ and $x :: e$ ($c$ is a context of length $i$ and $x$ is an entity) then $c\mcaret x$ is the context of length $i+1$ that has elements $c$[0], $\ldots ,c[i-1], x$. Thus $\mcaret$ is an operator of type $[e]^i \rightarrow e \rightarrow[e]^{i+1}$. Also note that types like $[e]^i$ are in fact polymorphic types, with $i$ acting as a type variable. See Milner 1978.
    step1: |-
      假设一个实体论域，语境是实体的有限列表。如果 $c$ 是长度为 $n$ 的语境，我们把它中的元素称为 $c[0]$, $\ldots ,c[n-1]$，把它的长度称为 $\lvert c\rvert$。我们把长度为 $i$ 的语境的类型称为 $[e]^i$。如果 $c$ 是 $[e]^i$ 中的语境，那么类型为 $\{0, \ldots ,i-1\}$ 的对象可以充当 $c$ 的索引。如果 $c \in[e]^i$ 且 $j \in \{0, \ldots ,i-1\}$，那么 $c[j]$ 是在语境中位置 $j$ 处出现的类型 e 的对象。语境上的一个关键操作是用一个元素扩展。如果 $c :: [e]^i$ 且 $x :: e$（$c$ 是长度为 $i$ 的语境，$x$ 是实体），那么 $c\mcaret x$ 是长度为 $i+1$ 的语境，其元素为 $c$[0], $\ldots ,c[i-1], x$。于是 $\mcaret$ 是类型为 $[e]^i \rightarrow e \rightarrow[e]^{i+1}$ 的算子。还要注意，像 $[e]^i$ 这样的类型实际上是多态类型，$i$ 起着类型变元的作用。参见 Milner 1978。
    step2: |-
      设定一个实体论域，语境便是实体的有限列表。若 $c$ 是长度为 $n$ 的语境，其元素记作 $c[0]$, $\ldots ,c[n-1]$，其长度记作 $\lvert c\rvert$。长度为 $i$ 的语境之类型记作 $[e]^i$。若 $c$ 是 $[e]^i$ 中的语境，则类型为 $\{0, \ldots ,i-1\}$ 的对象可充当 $c$ 的索引。若 $c \in[e]^i$ 且 $j \in \{0, \ldots ,i-1\}$，则 $c[j]$ 是语境中位置 $j$ 处那个类型为 e 的对象。语境上的一项关键操作是用元素作扩展：若 $c :: [e]^i$ 且 $x :: e$（$c$ 为长度 $i$ 的语境，$x$ 为实体），则 $c\mcaret x$ 是长度 $i+1$ 的语境，元素为 $c$[0], $\ldots ,c[i-1], x$。于是 $\mcaret$ 是类型为 $[e]^i \rightarrow e \rightarrow[e]^{i+1}$ 的算子。还要注意：像 $[e]^i$ 这样的类型实为多态类型，$i$ 起类型变元的作用。参见 Milner 1978。
