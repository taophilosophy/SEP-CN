      The ITL translation of “a man” has type $$(\{0, \ldots ,i\} \rightarrow[e]^{i+1} \rightarrow [e]^j \rightarrow t) \rightarrow [e]^i \rightarrow [e]^j \rightarrow t.$$ In $P\lvert c\rvert (c\mcaret x)c'$, the $P$ variable marks the slot for the VP interpretation; $\lvert c\rvert$ gives the length of the input context to $P$; it picks up the value $i$, which is the position of the next available slot when the context is extended. This slot is filled by an object $x$ denoting a man. Note that $c\mcaret x[\lvert c\rvert ] = c\mcaret x[i] = x$, so the index $i$ serves to pick out that man from the context.
    step1: |-
      "a man" 的 ITL 翻译具有类型 $$(\{0, \ldots ,i\} \rightarrow[e]^{i+1} \rightarrow [e]^j \rightarrow t) \rightarrow [e]^i \rightarrow [e]^j \rightarrow t.$$ 在 $P\lvert c\rvert (c\mcaret x)c'$ 中，变元 $P$ 标记 VP 解释的槽位；$\lvert c\rvert$ 把输入语境的长度交给 $P$；它拾取值 $i$，即语境扩展后下一个可用槽位的位置。这个槽位由一个指称男人的对象 $x$ 填充。注意 $c\mcaret x[\lvert c\rvert ] = c\mcaret x[i] = x$，所以索引 $i$ 用于从语境中挑出那个男人。
    step2: |-
      "a man" 的 ITL 翻译具有类型 $$(\{0, \ldots ,i\} \rightarrow[e]^{i+1} \rightarrow [e]^j \rightarrow t) \rightarrow [e]^i \rightarrow [e]^j \rightarrow t.$$ 在 $P\lvert c\rvert (c\mcaret x)c'$ 中，变元 $P$ 标记 VP 解释的槽位；$\lvert c\rvert$ 把输入语境的长度交给 $P$，拾取值 $i$——语境扩展时下一个可用槽位的位置。该槽位由一个指称男人的对象 $x$ 填充。注意 $c\mcaret x[\lvert c\rvert ] = c\mcaret x[i] = x$：索引 $i$ 正是从语境中挑出该男人的凭据。
