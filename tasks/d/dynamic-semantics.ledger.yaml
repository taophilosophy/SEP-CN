      若在该状态中执行语句 $z := x$，也就是对它作“解释”（C 语法中该语句写起来更简单：$z = x$），所得是一个新的机器状态：

      $$ \begin{array}{|c|c|}\hline x & 12 \\\hline y & 117 \\\hline z & 12 \\\hline \end{array} $$
