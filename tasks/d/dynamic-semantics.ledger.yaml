    source: |-
      Dynamic semantics is a perspective on natural language semantics that emphasizes the growth of information in time. It is an approach to meaning representation where pieces of text or discourse are viewed as instructions to update an existing context with new information, the result of which is an updated context. In a slogan: meaning is context change potential.
    step1: |-
      动态语义是对自然语言语义学的一种视角，它强调信息在时间中的增长。它是一种意义表示进路，其中文本或话语的片段被视为指令，用新信息更新一个既有语境，其结果是一个更新了的语境。用一句口号说：意义是语境变化潜能。
    step2: |-
      动态语义是自然语言语义学的一种视角，强调信息随时间的增长。作为一种意义表示进路，它把文本或话语的片段看作指令：用新信息更新既有语境，得到的结果就是更新后的语境。用一句口号概括：意义即语境变化潜能。
  - id: 2
    kind: body
    source: |-
      It is important to be aware of the abstractness of this perspective so as to guard against various non sequiturs. For one thing, one could easily think that dynamic semantics or update semantics is committed at least in part to an internalist idea of semantics since the information states are “internal”—in the sense that they are wholly contained in the individual mind/brain. In other words, one might think that the information states of dynamic semantics are what Putnam (1975) calls “states in the sense of methodological solipsism”. See the entries on scientific realism, computational theory of mind, externalism about mental content, and narrow mental content. However, the general framework says nothing about what the states are. The state could very well include the environment in which the interpreter is embedded and thus contain an “external” component.
    step1: |-
      重要的是要意识到这一视角的抽象性，以免作出各种不成立的推论。一方面，人们很容易以为动态语义或更新语义至少部分地承诺了一种内在主义的意义观，因为信息状态是“内在的”——意思是它们完全包含在个体的心智/大脑之内。换句话说，人们可能认为动态语义的信息状态就是普特南（Putnam 1975）所说的“方法论唯我论意义上的状态”。参见科学实在论、心灵的计算理论、关于心理内容的外在主义与狭义心理内容各词条。然而，这一一般框架对状态是什么不作任何说明。状态完全可以包含解释者所处的环境，从而含有一个“外在的”成分。
    step2: |-
      需要注意的是这一视角的抽象性，以防各种不当推论。其一，人们容易以为动态语义或更新语义至少部分地承诺了内在主义的意义观，因为信息状态是“内在的”——即完全包含在个体的心智/大脑之中。换言之，人们可能把动态语义的信息状态理解为普特南（Putnam 1975）所说的“方法论唯我论意义上的状态”。（参见科学实在论、心灵的计算理论、关于心理内容的外在主义、狭义心理内容各词条）然而，这一一般框架并未说明状态究竟是什么。状态完全可以包含解释者所处的环境，从而带有一个“外在”成分。
  - id: 3
    kind: body
    source: |-
      A second possible misunderstanding is that dynamic semantics or update semantics is in complete opposition to classical truth conditional semantics (compare the entries on classical logic and first-order model theory). In fact, as this entry will soon make clear, what dynamic semantics provides is a generalization of truth conditional semantics rather than a radically different alternative. The classical meanings become the *preconditions* for success of the discourse actions. Dynamic semanticists claim that *compositional meanings* have the nature of functions or relations and the classical meanings are recoverable from the relational dynamic meanings as *projections* onto their “input” coordinate.
    step1: |-
      第二种可能的误解是，动态语义或更新语义与古典真值条件语义学完全对立（比较古典逻辑与一阶模型论词条）。事实上，正如本词条很快会表明的，动态语义提供的是真值条件语义学的一种推广，而不是一种彻底不同的替代方案。古典意义成为话语行动成功的 **前提条件**（preconditions）。动态语义学家主张，**组合性意义**（compositional meanings）具有函数或关系的本性，而古典意义可以作为一种 **投影**（projections），即向“输入”坐标的投影，从关系性动态意义中恢复出来。
    step2: |-
      第二种可能的误解是：动态语义或更新语义与古典真值条件语义学截然对立（参“古典逻辑”“一阶模型论”词条）。事实上，本词条稍后说明：动态语义推广了真值条件语义学，而非提供彻底不同的替代方案——古典意义成为话语行动取得成功的*preconditions*（前提条件）。动态语义学家主张，*compositional meanings*（组合性意义）具有函数或关系的本性；古典意义则可以作为向“输入”坐标的*projections*（投影），从关系性动态意义中恢复出来。
  - id: 4
    kind: body
    source: |-
      The point of the use of an abstract framework is not to give empirical predictions. This is the task of specific realizations inside the framework. The framework of dynamic semantics (i) provides a direction of thinking and (ii) allows us to import methods from the mathematical study of the framework. It follows that the question whether natural language meaning is intrinsically dynamic does not have an empirical answer. Still, what can be said is that the study of interpretation as a linearly-ordered process has proven quite fruitful and rewarding.
    step1: |-
      使用抽象框架的目的不是给出经验预测。经验预测是框架内具体实现的任务。动态语义框架 (i) 提供一个思考方向，(ii) 允许我们从该框架的数学研究中引入方法。由此可知，“自然语言意义是否本质上是动态的”这一问题没有经验性的答案。尽管如此，仍可以说：把解释当作线性有序过程来研究，已被证明相当富有成果。
    step2: |-
      采用抽象框架的目的并不在于给出经验预测——那是框架内各项具体实现的任务。动态语义框架 (i) 提供一种思考方向，(ii) 使我们得以引入关于该框架的数学研究中的方法。由此可知，“自然语言意义是否在本质上动态”这个问题没有经验答案。不过仍可以说：把解释作为线性有序过程来研究，已被证明颇有成效。
  - id: 5
    kind: body
    source: |-
      Since dynamic semantics focuses on the discourse actions of sender and receiver, it is in a sense close to use-oriented approaches to meaning in philosophy such as the work of Wittgenstein and Dummett. However, easy identifications between dynamic semantics and these approaches are to be avoided. Dynamic semantics as an abstract framework is compatible with many philosophical ways of viewing meaning and interpretation. Dynamic semantics aims to *model* meaning and interpretation. You can do that without answering broader philosophical questions such as the question of what it is that makes it possible for the subject to be related to these meanings at all. For example, in dynamic predicate logic we take the meaning of *horse* as given without making any substantial claim about what it means for a subject to have the concept of *horse*; we just stipulate the subject has it. This is not to say such questions—which are at the center of the work of Wittgenstein and Dummett—should not ultimately be answered: it’s just that a model can be of interest even if it does not answer them. (Note that dynamic semantics tries to give a systematic and compositional account of meaning, which makes it markedly different in spirit from Wittgenstein’s later philosophy.)
    step1: |-
      由于动态语义关注发送者与接收者的话语行动，它在某种意义上接近哲学中以使用为导向的意义进路，如维特根斯坦与达米特的工作。但不应把动态语义与这些进路轻易等同。作为抽象框架，动态语义与许多观察意义与解释的哲学方式相容。动态语义旨在对意义与解释进行 **建模**。你可以在不回答更广泛的哲学问题（例如究竟是什么使主体能够与这些意义发生关联）的情况下这样做。例如，在动态谓词逻辑中，我们把 **马** 的意义视为给定的，而不对主体拥有 **马** 这一概念意味着什么作出实质主张；我们只是规定主体拥有它。这并不是说这类问题——它们处于维特根斯坦与达米特工作的中心——最终不应被回答：只是说，一个模型即便不回答它们，也可以是有意义的。（注意：动态语义试图给出关于意义的系统而组合性的说明，这使它在精神上明显不同于维特根斯坦后期哲学。）
    step2: |-
      动态语义关注发送者与接收者的话语行动，因此在一定意义上接近哲学中以使用为导向的意义进路，如维特根斯坦与达米特的工作。但不宜把二者轻易等同：作为抽象框架，动态语义与许多看待意义与解释的哲学方式相容，它旨在对意义与解释进行 **建模**。做这种建模，并不需要回答更宽泛的哲学问题，比如究竟是什么使主体得以与这些意义发生关联。例如在动态谓词逻辑中，我们把“马”的意义视为既定，并不实质断言主体拥有“马”这一概念意味着什么，只是规定主体拥有它。这并非说这类问题（它们居于维特根斯坦与达米特工作的中心）最终不必回答，而只是说：一个模型即便不回答它们，也可以有价值。（动态语义力图给出系统而组合性的意义说明，这使它在精神上明显不同于维特根斯坦后期哲学。）
  - id: 6
    kind: body
    source: |-
      One approach to dynamic semantics is *discourse representation theory* (DRT, Kamp 1981)[^kamp-1981]. (Closely related to Kamp’s approach is Irene Heim’s *file change semantics* (FCS, Heim 1983a)[^heim-1983a] and the discourse semantics of Seuren 1985). Meanings in DRT are so-called *discourse representation structures* (DRSs). These structures are a type of database that contains specific pieces of information. In and of itself a DRS is a static object, but DRT can be said to be a dynamic semantic framework because it allows us to understand the process of composing meanings as a process of *merging* discourse representation structures. In this way, information change becomes an integral part of the interpretation process.
    step1: |-
      动态语义的一种进路是 **话语表现理论**（DRT，Kamp 1981）[^kamp-1981]。（与坎普的进路密切相关的是艾琳·海姆的 **文件变化语义学**（FCS，Heim 1983a）[^heim-1983a] 以及 Seuren 1985 的话语语义学。）DRT 中的意义是所谓的 **话语表现结构**（DRSs）。这些结构是一种数据库，包含特定的信息片段。DRS 本身是一个静态对象，但 DRT 可以说是一个动态语义框架，因为它使我们能够把组合意义的过程理解为 **合并** 话语表现结构的过程。这样一来，信息变化就成为解释过程不可分割的一部分。
    step2: |-
      动态语义的第一种进路是 **话语表现理论**（discourse representation theory，DRT；Kamp 1981）[^kamp-1981]。与坎普的进路密切相关的是艾琳·海姆的 **文件变化语义学**（file change semantics，FCS；Heim 1983a）[^heim-1983a]，以及 Seuren 1985 的话语语义学。DRT 中的意义是所谓 **话语表现结构**（discourse representation structures，DRSs）：这类结构是一种数据库，含特定的信息片段。DRS 本身是静态对象，但 DRT 仍可称为动态语义框架——因为它使我们能把组合意义的过程理解为 **合并** 话语表现结构的过程，信息变化由此成为解释过程的组成部分。
  - id: 7
    kind: body
    source: |-
      Our main focus in this entry is a second approach to dynamic semantics, although we will compare things to DRT along the way. In this second approach, dynamic meanings are types of actions, things that are individuated by the changes they effect. This is the approach associated with *dynamic predicate logic* (DPL, Groenendijk and Stokhof 1991a)[^groenendijk-1991a]. According to this dynamic semantic tradition, a meaning is a specification of how a receiver’s information state would be modified. It could for instance be a function that maps an old information state to one which has been *updated* with the information that the meaning embodies. Alternatively, it could be a relation that expresses the kind of information change that the meaning brings about. (For early work in this tradition, see Groenendijk and Stokhof 1991a,b; Muskens 1991; Dekker 1993; Vermeulen 1993; van Eijck 1994; Vermeulen 1994; Krahmer 1995; van den Berg 1996; Groenendijk et al. 1996; Aloni 1997; Muskens et al. 1997)[^aloni-1997][^berg-1996][^dekker-1993][^eijck-1994][^groenendijk-1991a][^groenendijk-1996][^krahmer-1995][^muskens-1991][^muskens-1997][^vermeulen-1993][^vermeulen-1994].
    step1: |-
      本词条的主要焦点是动态语义的第二种进路，尽管我们会在途中与 DRT 作比较。在这一进路中，动态意义是行动的类型，即由其造成的变化来个体化的东西。这是与 **动态谓词逻辑**（DPL，Groenendijk and Stokhof 1991a）[^groenendijk-1991a] 相联系的进路。按这一动态语义传统，一个意义就是关于接收者的信息状态将如何被修改的说明。例如，它可以是一个函数，把旧的信息状态映射到用该意义所体现的信息 **更新** 过的状态。或者，它可以是一个关系，表达该意义所带来的那种信息变化。（这一传统的早期工作见 Groenendijk and Stokhof 1991a,b；Muskens 1991；Dekker 1993；Vermeulen 1993；van Eijck 1994；Vermeulen 1994；Krahmer 1995；van den Berg 1996；Groenendijk et al. 1996；Aloni 1997；Muskens et al. 1997）[^aloni-1997][^berg-1996][^dekker-1993][^eijck-1994][^groenendijk-1991a][^groenendijk-1996][^krahmer-1995][^muskens-1991][^muskens-1997][^vermeulen-1993][^vermeulen-1994]
    step2: |-
      本词条的主要焦点是第二种进路，途中也会与 DRT 比较。在这一进路中，动态意义是行动的类型——由其所造成的变化来个体化。这是与 **动态谓词逻辑**（dynamic predicate logic，DPL；Groenendijk and Stokhof 1991a）[^groenendijk-1991a] 相联系的进路。按这一传统，意义是对接收者信息状态将如何被修改的说明：它可以是一个函数，把旧信息状态映射为用该意义所含信息 **更新** 过的状态；也可以是一个关系，表达该意义所造成的那种信息变化。（早期工作见 Groenendijk and Stokhof 1991a,b；Muskens 1991；Dekker 1993；Vermeulen 1993；van Eijck 1994；Vermeulen 1994；Krahmer 1995；van den Berg 1996；Groenendijk et al. 1996；Aloni 1997；Muskens et al. 1997）[^aloni-1997][^berg-1996][^dekker-1993][^eijck-1994][^groenendijk-1991a][^groenendijk-1996][^krahmer-1995][^muskens-1991][^muskens-1997][^vermeulen-1993][^vermeulen-1994]
