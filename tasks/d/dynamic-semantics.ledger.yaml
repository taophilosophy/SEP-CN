      Compositionality has always been an important concern in the use of logical systems in natural language semantics (see the entry on compositionality). Through the use of higher order logics (see the entries on second-order and higher-order logics and Church’s type theory), a thoroughly compositional account of, e.g., the quantificational system of natural language can be achieved, as is demonstrated in classical Montague grammar (Montague 1974a,b, 1973; compare the entry on logical form)[^montague-1974a]. We will review how the dynamic approach can be extended to higher order systems. The link between dynamic semantics and type theory is more like a liaison than a stable marriage: there is no intrinsic need for the connection. The connection is treated here to explain the historical influence of Montague grammar on dynamic semantics.
    step1: |-
      组合性一直是自然语言语义学中使用逻辑系统时的一项重要关切（见组合性词条）。通过使用高阶逻辑（见二阶与高阶逻辑、丘奇类型论词条），可以对自然语言的量化系统等给出彻底组合性的说明，古典蒙塔古语法即已展示这一点（Montague 1974a,b, 1973；比较逻辑形式词条）[^montague-1974a]。我们将回顾动态进路如何扩展至高阶系统。动态语义与类型论之间的联系更像是联络而非稳固婚姻：二者之间没有内在的必然联系。此处处理这一联系，是为了说明蒙塔古语法对动态语义的历史影响。
    step2: |-
      组合性一直是自然语言语义学使用逻辑系统时的一项重要关切（见“组合性”词条）。借助高阶逻辑（见“二阶与高阶逻辑”“丘奇类型论”词条），可以对自然语言的量化系统等给出彻底组合性的说明，古典蒙塔古语法即已展示这一点（Montague 1974a,b, 1973；参“逻辑形式”词条）[^montague-1974a]。下面回顾动态进路如何扩展至高阶系统。动态语义与类型论之间的联系更像联络而非稳固婚姻：二者之间并无内在的必然联系；此处处理这一联系，是为说明蒙塔古语法对动态语义的历史影响。
