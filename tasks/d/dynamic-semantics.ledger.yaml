    kind: body
    source: |-
      Our main focus in this entry is a second approach to dynamic semantics, although we will compare things to DRT along the way. In this second approach, dynamic meanings are types of actions, things that are individuated by the changes they effect. This is the approach associated with *dynamic predicate logic* (DPL, Groenendijk and Stokhof 1991a)[^groenendijk-1991a]. According to this dynamic semantic tradition, a meaning is a specification of how a receiver’s information state would be modified. It could for instance be a function that maps an old information state to one which has been *updated* with the information that the meaning embodies. Alternatively, it could be a relation that expresses the kind of information change that the meaning brings about. (For early work in this tradition, see Groenendijk and Stokhof 1991a,b; Muskens 1991; Dekker 1993; Vermeulen 1993; van Eijck 1994; Vermeulen 1994; Krahmer 1995; van den Berg 1996; Groenendijk et al. 1996; Aloni 1997; Muskens et al. 1997)[^aloni-1997][^berg-1996][^dekker-1993][^eijck-1994][^groenendijk-1991a][^groenendijk-1996][^krahmer-1995][^muskens-1991][^muskens-1997][^vermeulen-1993][^vermeulen-1994].
    step1: |-
      本词条的主要关注点是动态语义的第二种进路，虽然途中我们会不时与 DRT 比较。在这第二种进路中，动态意义是行动的类型，即由其所引致的变化来个体化的东西。这是与*dynamic predicate logic*（动态谓词逻辑，DPL，Groenendijk and Stokhof 1991a）[^groenendijk-1991a]相联系的进路。按照这一动态语义传统，意义是对接收者信息状态将如何被修改的一种规定。它例如可以是一个函数，把旧信息状态映射到已被该意义所含信息*updated*（更新）后的状态。或者，它也可以是一个关系，表达该意义所带来的信息变化的种类。（关于这一传统的早期工作，参见 Groenendijk and Stokhof 1991a,b; Muskens 1991; Dekker 1993; Vermeulen 1993; van Eijck 1994; Vermeulen 1994; Krahmer 1995; van den Berg 1996; Groenendijk et al. 1996; Aloni 1997; Muskens et al. 1997）[^aloni-1997][^berg-1996][^dekker-1993][^eijck-1994][^groenendijk-1991a][^groenendijk-1996][^krahmer-1995][^muskens-1991][^muskens-1997][^vermeulen-1993][^vermeulen-1994]。
    step2: |-
      本词条的主要关注点是动态语义的第二种进路，途中我们会不时以 DRT 作参照。在这第二种进路中，动态意义是行动的类型——由其所引发的变化来个体化的东西。这是与"动态谓词逻辑"（*dynamic predicate logic*，DPL，Groenendijk and Stokhof 1991a）[^groenendijk-1991a]相联系的进路。按照这一动态语义传统，意义是对"接收者的信息状态将如何受到修改"的一种规定。例如，它可以是一个函数，把旧信息状态映射到一个已按该意义所含信息*updated*（更新）的状态；或者，它也可以是一个关系，表达该意义所带来的信息变化属于何种类型。（关于这一传统的早期工作，参见 Groenendijk and Stokhof 1991a,b; Muskens 1991; Dekker 1993; Vermeulen 1993; van Eijck 1994; Vermeulen 1994; Krahmer 1995; van den Berg 1996; Groenendijk et al. 1996; Aloni 1997; Muskens et al. 1997）[^aloni-1997][^berg-1996][^dekker-1993][^eijck-1994][^groenendijk-1991a][^groenendijk-1996][^krahmer-1995][^muskens-1991][^muskens-1997][^vermeulen-1993][^vermeulen-1994]。
