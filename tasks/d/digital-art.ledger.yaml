      单凭像素化，无论分辨率多高，都无法解释显示在 LCD 屏上的图像属于一个数字图式；作为图像的数字图像因而顽固地保持模拟。但对数字成像技术作更贴近的分析，或许能表明有限分立终究得到满足。当前的采样与例现光强的技术，把客观颜色归组到远低于现象分辨的水平。例如，在标准的“真彩色”系统中，一个显示像素有三个 8 位子像素，每个子像素以来自 256 个值之范围的光强发出一种不同的可见波长，产出逾 1600 万种客观颜色。如此大量的可得颜色给人以颜色连续统的印象，而实际上数字采样技术已被用来把客观颜色空间切分成一列不相交的波长光强。一方面，鉴于显示像素可以按介于相邻可分辨光强之间、且与后者不可分辨的光强点亮，似乎可以推出有限分立失败。另一方面，正因为数字技术包含用于颜色间现象阈下分辨的微技术与度量学，以数值表达的（比如真彩色系统中的）红-蓝-绿三元组之光强归组，可以比构成 resultant 图像图式的客观颜色类型更窄。关键在于把颜色、形状与大小这些本质上模拟的性质的变化保持在足够小的范围内，使它们无法累积到足以造成图像知觉差异的程度（Zeimbekis 2012）[^zeimbekis-2012]。数字图像图式中的类型，是同一些颜色、形状与大小经验的技术上被切分的传递性归组。切出一个传递性的量值子集，必须相对于系统使用者的需要来进行。就数字颜色而言，其类型是足以令正常人类知觉者产生相同颜色经验的光强之类（sufficient classes）。数字图像的可复制性，由人类视觉系统的分辨极限与数字采样技术的分辨极限之间的间隙而成为可能。
