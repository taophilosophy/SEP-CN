      It is important to reiterate that the strong interactivity just described is not restricted to the digital. Whilst interactivity is a standard feature of many contemporary digital works, and the responsiveness of such works is remarkable, non-digital appreciative categories can also exploit a similar degree of display variability. For example, literature, theater, and tabletop role-playing games can be strongly interactive in ways similar to many digital artworks. What is unique about all such works are the ways in which things like immersion, agency, identity, and fiction, to list a few features, are impacted by interactivity, due to the user’s role in the work (for more, see Robinson & Tavinor 2018; Patridge 2017; Meskin & Robson 2016)[^patridge-2017][^robson-2016].
