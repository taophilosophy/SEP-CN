      Both in his earlier and in his later work in aesthetics, Goodman commits to “a special relation” between the analog and the pictorial, one that is seen when we compare “the presystematic notions of description and picture in a given culture”. Given two schemes, *S* and *S′*, where *S* consists of all descriptions or predicates in a language such as English, and *S′* consists of all pictures, if we were told only of the structures of *S* and *S′*, we could distinguish the pictorial scheme by its being analog (Goodman and Elgin 1988: 130)[^goodman-1988]. The special relation remains, Goodman claims, despite the possibility of a digital sub-scheme made up of black and white grid patterns all of which happen to be pictures. In such a scheme, the differences between patterned types that matter for the scheme’s being digital do not include all of the differences that matter for distinguishing pictorial types. Pictures are distinguished by color, shape, and size, which vary continuously; any variation in color, shape, or size potentially results in a different picture. When we impose limits on the differences that matter for distinguishing one grid pattern in the scheme from another, we are not interpreting the grid patterns as pictures; if we were to do so, we would have to treat them as members of a syntactically dense, or analog, scheme.
    step1: |-
      无论在其早期还是晚期的美学工作中，古德曼都坚持模拟者与图像者之间的“一种特殊关系”，这一关系见于我们比较“一个给定文化中描述与图像的前系统概念”之时。给定两个图式 *S* 与 *S′*，其中 *S* 由一种语言（如英语）中的全部描述或谓词构成，*S′* 由全部图像构成：若只被告知 *S* 与 *S′* 的结构，我们便能凭其模拟性而认出图像图式（Goodman and Elgin 1988: 130）[^goodman-1988]。古德曼声称，尽管可以存在一个由黑白网格图案构成的数字子图式——这些图案恰好都是图像——这一特殊关系依然保持。在这样的图式中，对该图式之为数字要紧的图案类型之间的差异，并不包括对区分图像类型要紧的全部差异。图像以颜色、形状与大小相区分，三者连续变化；颜色、形状或大小的任何变化，都可能造成一幅不同的图像。当我们对图式中区分一个网格图案与另一个网格图案所要紧的差异施加限制时，我们并没有把这些网格图案当作图像来解释；倘若当真如此做，我们就得把它们当作句法上稠密的、即模拟的图式之成员来对待。
    step2: |-
      无论早期还是晚期的美学工作，古德曼都坚持模拟者与图像者之间的“一种特殊关系”；这一关系见于我们比较“一个给定文化中描述与图像的前系统概念”之时。给定两个图式 *S* 与 *S′*，其中 *S* 由一种语言（如英语）中的全部描述或谓词构成，*S′* 由全部图像构成：若仅被告知 *S* 与 *S′* 的结构，我们便能凭其模拟性认出图像图式（Goodman and Elgin 1988: 130）[^goodman-1988]。古德曼声称，纵使可以有一个由黑白网格图案构成的数字子图式——诸图案恰好皆为图像——这一特殊关系依然保持。在这样的图式里，对该图式之为数字要紧的图案类型差异，并不包括区分图像类型所要紧的全部差异。图像以颜色、形状与大小相区分，三者连续变化；颜色、形状或大小的任何变动，都可能生成一幅不同的图像。当我们对图式内区分此网格图案与彼网格图案所要紧的差异施加限制时，我们并未把网格图案当图像来解释；若当真如此，我们就得把它们当作句法上稠密的、即模拟的图式之成员来对待。
