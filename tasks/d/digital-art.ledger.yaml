      “Rock where People Gather” illustrates that interactive works permit us to appreciate both the work and the properties brought about by the interactions. To define these characteristics of interactive art, Dominic Lopes states, “A work of *art* is *interactive* just in case it prescribes that the *actions* of its *users* help *generate* its display” (Lopes 2010:36, original emphasis)[^lopes-2010]. The display is anything that is instanced in a work, or the perceptual properties that come about via interactivity. Users help generate these features making interactive works distinctive. However, at this point, one could imagine reading the chapters of, let us say, a digitized copy of *The Brothers Karamazov* in random order, thereby changing what properties get instanced from the original work. Does this example qualify as interactive art in the Lopesian sense? Although some stories, such as choose-your-own-adventure books, allow readers to shuffle the narrative arc, most traditional stories do not; if the randomized *Karamazov* example is interactive, it is only so in the weakest sense of the term because users are not *prescribed* to change the properties as described. Another way to think about these differences returns us to a work’s structure. Readers who decide to roguishly randomize a story merely change how they *access* a work’s structure simply because the medium does not prohibit it, whereas readers of choose-your-own-adventure books and other interactive works can change the work’s *structure* in a prescribed manner (Lopes 2001:68)[^lopes-2001].
    step1: |-
      《人聚之石》表明，交互作品使我们既能欣赏作品，也能欣赏交互所带来的属性。为界定交互艺术的这些特征，多米尼克·洛佩斯说：“一件*艺术作品*是*交互的*，当且仅当它规定其*使用者*的*行动*有助于*生成*其显示”（Lopes 2010:36，原文强调）。显示是在作品中被实例化的任何东西，或通过交互性产生的感知属性。使用者帮助生成这些特征，使交互作品具有独特性。然而，在这一点上，人们可以想象以随机顺序阅读例如《卡拉马佐夫兄弟》数字化副本的各章，从而改变从原作品中被实例化的属性。这个例子算得上洛佩斯意义上的交互艺术吗？尽管有些故事，如自选冒险故事书，允许读者打乱叙事弧线，但大多数传统故事不允许；如果随机化的《卡拉马佐夫兄弟》例子是交互的，那也只是最弱意义上的交互，因为使用者并未被*规定*去改变所述属性。思考这些差异的另一种方式回到作品的结构。决定顽皮地把故事随机化的读者，仅仅改变了他们*访问*作品结构的方式，因为媒介并不禁止这样做；而自选冒险故事书及其他交互作品的读者，则可以按规定方式改变作品的*结构*（Lopes 2001:68）。
    step2: |-
