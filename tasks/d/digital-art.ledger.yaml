      由此可简要推得如下情形：数字照片一类作品在本体论上近似于戏剧与音乐，因为它们由一种规定的显示类型构成。显示类型虽可容许多个显示（复本、演出、实例等），诸具体例记之间容有细微差异，但仍有一种正确显示应予维持或达成。《远程花园》《立方》这类例现一系列状态的作品，则由多种可能的显示类型构成，而在任一给定时刻只例现一种。《立方》之外，再把它与电子游戏一类呈现前述强程度显示变异性者相较。某些可重复作品既可从一次“通关”至下一次“通关”而以霄壤之别收场，便不存在唯一的、正确的显示。相反，这类作品既由多种显示类型、又由多个显示构成：用户每重复一次，便生成诸可能显示类型之一（及其显示）。
