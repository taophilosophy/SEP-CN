      The issue of the relation between ontology and interpretation is a complex and difficult one, but progress can be made on the issue through an examination of digital art practices. This is particularly in light of the high degree of self-consciousness with which many digital artists and digital art curators specify the features of digital art works. It is a common practice, for example, when archiving net art, to have artists fill out a questionnaire in order to specify which features of a work are crucial for its preservation—whether features of appearance, timing and motion, interactivity potentials and methods, linking to other sites, or hardware and software. When a work of net art is individuated by its imagery, say, the artist has chosen to make the inherent replicability of digital imagery part of the work. That this is a choice is suggested by the existence of singular works of digital visual art, like the examples discussed above. The question of whether the works by Kalpakjian, and Arcangel & Davis can function allographically requires further investigation (see D’Cruz and Magnus 2014)[^d’cruz-2014]. But if they can so function, the artist’s presentation instructions have a primary role to play in fixing, not just the art form (installation, movie, conceptual work, etc.) but the basic structure of the work – for example, in determining whether the work is singular and thus identical with a certain kind of physical display or multiple with no original display. Where interactive digital works are concerned, individuation is determined by a set of algorithms. An algorithmic account of interactive digital art suggests that, although the code is important for adequate instantiation of the work, it is the algorithm that specifies the crucial features of the work (Lopes 2010; Tavinor 2011; Moser 2018)[^lopes-2010][^moser-2018]. Since the code is, ontologically speaking, less relevant than the algorithm, this account makes allowances for the variability that may be found in the code when an instance of a program is run on different kinds of devices.
