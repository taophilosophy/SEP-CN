      The case of digital cinema is perhaps a useful starting point for work in the philosophy of digital art. Digital cinema is a multi-media art form, after all, involving 2D and 3D moving images as well as sound. It also has the potential for robust interactivity, whereby audiences select story events or otherwise modify a film screening in prescribed ways (Gaut 2010: 224–43)[^gaut-2010]. Many of the digital tools developed by the film and video game industries are now available more widely to artists interested in making other forms of digital art, including net art, digital sound installations, and virtual reality art (Grau 2003; Chalmers 2017; Tavinor 2019)[^chalmers-2017][^grau-2003][^tavinor-2019]. In terms of how the use of these tools affects proper appreciation, there are important continuities between the filmmaking context and the wider digital art world. In addition, the philosophy of film is a well-established subfield in aesthetics, one that engages with both film theory and cognitive science in order to explicate the nature of film as a mass art (Thomson-Jones 2014, Other Internet Resources). For many of the standard topics in the philosophy of film, interesting and important questions arise when we extend the discussion from analog to digital cinema. There is a question, for example, about the kinds and significance of realism that can be achieved with traditional celluloid film as compared with manipulated digital imagery (Gaut 2010: 60–97)[^gaut-2010]. The philosophy of film can provide some of the initial terms of analysis for artworks in a broad range of digital media. At the same time, it is important to approach each of the digital arts on their own terms under the assumption that the digital is an artistically significant category.
    step1: |-
      数字电影的情形，或许是数字艺术哲学工作的一个有益起点。数字电影终究是一种多媒体艺术形式，涉及二维与三维运动图像以及声音。它也具有强健交互性的潜能，观众据此按规程选择故事事件或以其他方式修改影片放映（Gaut 2010: 224–43）[^gaut-2010]。电影与电子游戏产业开发的许多数字工具，如今更广泛地可供有志于创作其他形式数字艺术的艺术家使用，包括网络艺术、数字声音装置与虚拟现实艺术（Grau 2003; Chalmers 2017; Tavinor 2019）[^chalmers-2017][^grau-2003][^tavinor-2019]。就这些工具的使用如何影响恰当欣赏而言，电影制作语境与更广的数字艺术世界之间有重要的连续性。此外，电影哲学是美学中一个确立已久的子领域，它与电影理论及认知科学都有交往，以阐明电影作为大众艺术的性质（Thomson-Jones 2014，其他网络资源）。对电影哲学中的许多标准主题，当我们把讨论从模拟电影扩展到数字电影时，便会出现有趣而重要的问题。例如，有一个问题关乎传统赛璐珞胶片相较被操弄的数字图像所能达到的实在论之种类与意义（Gaut 2010: 60–97）[^gaut-2010]。电影哲学能为广泛数字媒介中的艺术作品提供一些最初的分析术语。与此同时，重要的是按每一门数字艺术自身的条件去接近它，并假定数字是一个艺术上重要的范畴。
