      > For any technological device to be “aware” of its context—physical or otherwise—it has to be able to locate, classify, collect, store, and use “relevant” information, as well as to identify and discard or ignore “irrelevant” information (Galloway & Ward 2005)[^galloway-2005].
    step1: |-
      > 任何技术设备若要“意识到”其语境——物理的或其他方面的——它就必须能够定位、分类、收集、存储并使用“相关”信息，同时识别并丢弃或忽略“无关”信息（Galloway & Ward 2005）[^galloway-2005]。
    step2: |-
      > 任何技术设备若要“察觉”自身处境——物理的抑或其他——便须能定位、分类、收集、存储并运用“相关”信息，同时辨认并弃置或忽略“无关”信息（Galloway & Ward 2005）[^galloway-2005]。
