      ### 1.2 The Analog-Digital Distinction
    step1: |-
      ### 1.2 模拟-数字之分
    step2: |-
      ### 1.2 模拟-数字之分
  - id: 12
    kind: body
    source: |-
      The classical account of the analog-digital distinction is found in Nelson Goodman’s *Languages of Art* (1976). In fact Goodman’s account remains practically the only *general* account of the distinction. While David Lewis (1971)[^lewis-1971] raises a series of objections to Goodman, Lewis’ alternative account applies only to the representation of numbers. And while John Haugeland (1981)[^haugeland-1981] returns to the general distinction, he effectively qualifies and re-frames Goodman’s account in order to overcome Lewis’s and other potential objections. A few philosophers interested in clarifying the concepts employed by cognitive scientists have recognized the need for a general account of the analog-digital distinction (e.g., Dretske 1981; Blachowicz 1997; Katz 2008; Maley 2011)[^blachowicz-1997][^dretske-1981][^katz-2008][^maley-2011]. But in this context, as well, Goodman’s account is the essential point of reference. In some ways, this is surprising or at least striking: As Haugeland points out, the digital is a “mundane engineering notion” (1981: 217). Yet the philosophical context in which the notion receives its fullest analysis is that of aesthetics. As is well-known, Goodman’s interests in this context center on the role of musical notation in fixing the identity of musical works. But a musical notation is also a standard example of a digital system.
    step1: |-
      关于模拟-数字之分的经典论述见于纳尔逊·古德曼的《艺术语言》（1976）。事实上，古德曼的论述实际上仍是关于这一区分的唯一**一般**论述。虽然戴维·刘易斯（1971）对古德曼提出了一系列反对意见，但刘易斯的替代论述只适用于数的表征。而虽然约翰·豪格兰德（1981）回到了一般区分，他实际上限定并重构了古德曼的论述，以克服刘易斯及其他可能的反对意见。少数有兴趣澄清认知科学家所用概念的哲学家已经认识到，需要一种关于模拟-数字之分的一般论述（例如 Dretske 1981；Blachowicz 1997；Katz 2008；Maley 2011）。但同样在这一语境中，古德曼的论述是根本的参照点。在某些方面，这令人惊讶，或至少引人注目：正如豪格兰德指出的，数字是一个“平凡的工程学概念”（1981: 217）。然而，这一概念得到最充分分析的哲学语境是美学。众所周知，古德曼在此语境中的兴趣集中在音乐记谱法在确定音乐作品同一性方面的作用。但音乐记谱法也是数字系统的一个标准例子。
    step2: |-
      关于模拟-数字之分的经典论述见于纳尔逊·古德曼（Nelson Goodman）的《艺术语言》（*Languages of Art*，1976）。事实上，古德曼的论述至今仍是关于这一区分几乎唯一的 **一般** 论述。尽管戴维·刘易斯（David Lewis，1971）[^lewis-1971] 对古德曼提出了一系列异议，但刘易斯的替代论述只适用于数的表征。而尽管约翰·豪格兰德（John Haugeland，1981）[^haugeland-1981] 回到了一般区分，他实际上对古德曼的论述作了限定与重构，以克服刘易斯及其他潜在异议。少数关心澄清认知科学家所用概念的哲学家，已认识到需要一种关于模拟-数字之分的一般论述（例如 Dretske 1981；Blachowicz 1997；Katz 2008；Maley 2011）[^blachowicz-1997][^dretske-1981][^katz-2008][^maley-2011]。但即便在这一语境中，古德曼的论述仍是根本的参照点。在某种意义上，这令人惊讶，或至少引人注目：正如豪格兰德所指出的，数字是一个“平凡的工程学概念”（1981: 217）。然而，这一概念获得最充分分析的哲学语境却是美学。众所周知，古德曼在此语境中的兴趣集中于音乐记谱法在确定音乐作品同一性方面的作用。但音乐记谱法同时也是数字系统的标准例子。
  - id: 13
    kind: body
    source: |-
      On Goodman’s broad, structuralist way of thinking, representational systems in general consist of sets of possible physical objects that count as token representations. Objects are grouped under syntactic and semantic types, and interesting differences between kinds of representational system track differences in the way syntactic and semantic types relate to one another. Digital systems are distinguished by being *differentiated* as opposed to *dense*. The condition of *syntactic* differentiation is met when the differences between classes of token representations are limited such that it is possible for users of the system always to tell that a token belongs to at most one class. The condition of *semantic* differentiation is met when the extension of each type, or the class of referents corresponding to a class of token representations, differs in limited ways from the extension of any other type; so that users of the system can always tell that a referent belongs to at most one extension. Goodman provides the following example of a simple digital computer, a system that meets the conditions of both syntactic and semantic differentiation: Say we have an instrument reporting on the number of dimes dropped into a toy bank with a capacity for holding 50 dimes, where the count is reported by an Arabic numeral on a small display (Goodman 1976: 159)[^goodman-1976]. In this system, the syntactic types are just the numbers 0–50, which have as their instances the discrete displays, at different times, of the corresponding Arabic numerals. Both the conditions of syntactic and semantic differentiation are met because the relevant differences between instances of different numbers are both highly circumscribed and conspicuous. This means that users of the system can be expected to be able to read the display, or determine which number is instantiated on the display (syntactic differentiation) and which numerical value, or how many coins, is thereby being indicated (semantic differentiation).
    step1: |-
      在古德曼宽泛的结构主义思维方式中，表征系统一般由算作殊例表征的可能物理对象的集合组成。对象被归入句法类型和语义类型之下，而不同种类表征系统之间的有趣差异，追踪的是句法类型和语义类型相互关联方式的差异。数字系统的区别在于它是**分立的**，与**稠密的**相对。当殊例表征的类别之间的差异受到限制，使得系统的使用者总是能够判断一个殊例至多属于一个类别时，**句法** 分立的条件就得到满足。当一个类型的外延，或与一类殊例表征相对应的指称物类别，以有限的方式不同于任何其他类型的外延，使得系统的使用者总能判断一个指称物至多属于一个外延时，**语义** 分立的条件就得到满足。古德曼提供了以下一个简单数字计算机的例子，这个系统同时满足句法分立和语义分立的条件：假设我们有一台仪器，报告投入一个能容纳 50 枚一角硬币的玩具储蓄罐中的硬币数量，计数由小显示屏上的阿拉伯数字报告（Goodman 1976: 159）。在这个系统中，句法类型就是数 0—50，它们的实例是不同时刻相应阿拉伯数字的离散显示。句法分立和语义分立的条件都得到满足，因为不同数的实例之间的相关差异既高度受限又显而易见。这意味着，可以期待系统的使用者能够读出显示，或确定显示上实例化的是哪个数（句法分立），以及由此指示的是哪个数值，或多少枚硬币（语义分立）。
    step2: |-
      在古德曼宽泛的结构主义思路中，表征系统一般由若干可能物理对象的集合构成，这些对象可算作殊例表征。对象被归入句法类型与语义类型之下，而不同种类的表征系统之间的有趣差异，追踪的是句法类型与语义类型彼此关联方式的差异。数字系统的特征在于它是 **分立的**，而非 **稠密的**。当殊例表征的各个类别之间的差异受到限制，使得系统的使用者总能判断一个殊例至多属于一个类别时，**句法** 分立的条件便得到满足。当一个类型的外延——或与一类殊例表征相对应的指称物类别——以有限的方式区别于任何其他类型的外延，使得系统的使用者总能判断一个指称物至多属于一个外延时，**语义** 分立的条件便得到满足。古德曼给出了一个简单数字计算机的例子，这一系统同时满足句法分立与语义分立的条件：假设有一台仪器，报告投入一个可容纳 50 枚一角硬币的玩具储蓄罐中的硬币数量，计数由小显示屏上的阿拉伯数字报告（Goodman 1976: 159）[^goodman-1976]。在这一系统中，句法类型就是数 0—50，它们的实例是不同时刻相应阿拉伯数字的离散显示。句法分立与语义分立的条件都得到满足，因为不同数的实例之间的相关差异既高度受限又一目了然。这意味着，可以预期系统的使用者能够读出显示，或确定显示屏上实例化的是哪个数（句法分立），以及由此指示的是哪个数值、或多少枚硬币（语义分立）。
