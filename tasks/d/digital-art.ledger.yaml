    source: |-
      That users are responsible for generating certain features of an interactive work means that their displays, unlike those of non-interactive works, can occur in a couple of different ways (Lopes 2010: 37-38)[^lopes-2010]. The less standard of the two occurs when the displays of an interactive work are generated in a succession of states over a period of time, but where none of the displays can be revisited. One such example is *Telegarden*, a temporary work of computer art that users accessed from a networked computer. The work was comprised of a table with an attached mechanical arm that dispensed water and food for the plants via the users’ inputs. As one may imagine, the garden took shape in a variety of ways over the span of its exhibition, but each state of the garden, or its succession of display states, could not be repeated. Although not common, videogames can also exhibit this kind of display variability. Consider the experimental game, *Cube*. For a limited time, players could explore a large cube and its nested smaller cubes while racing to be the first to reach the center. As with *Telegarden*, players generated different properties of the game displays by interacting with it, but once a new display was generated, the previous ones were gone.
    step1: |-
      使用者负责生成交互作品的某些特征，这意味着他们的显示不同于非交互作品的显示，可以以几种不同方式发生（Lopes 2010: 37–38）。两种方式中较不标准的一种，是交互作品的显示在一段时间内以一系列状态生成，但任何显示都无法重访。一个例子是《远程花园》，一件临时的计算机艺术作品，用户从联网计算机访问。作品由一张桌子及附带的机械臂构成，机械臂根据用户输入为植物分配水和食物。可以想象，花园在展览期间以多种方式成形，但花园的每个状态、或其显示状态的序列，都无法重复。尽管不常见，电子游戏也可以表现出这种显示可变性。考虑实验性游戏《立方体》。在有限时间内，玩家可以探索一个大立方体及其嵌套的小立方体，同时竞相第一个到达中心。与《远程花园》一样，玩家通过与之交互生成游戏显示的不同属性，但一旦新显示生成，先前的显示便消失了。
