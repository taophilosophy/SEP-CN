      Reflection on the kinds and significance of choices available to an artist contributes to a full appreciation of the artist’s work. For any artwork, appreciation begins with recognition of its status as a *work*, the product of artistic activity of some kind, and thus something to be appreciated as the achievement of an artist or group of artists. Most commonly, this achievement is understood in terms of the aesthetically significant effects achieved by an artist with certain kinds of tools and materials and in light of certain appreciative conventions. In other words, the achievement is always relative to an artistic medium. Returning to the case of an artist choosing what to do about the inherent replicability of digital imagery, another way of thinking about this choice is in terms of the artist recognizing the limits and capacities of their chosen medium. Images conveyed digitally are always replicable and so when an artist aims to convey artistic content through digital imagery, they either have to accept the inevitable multiplicity of their works or resist the tendency of the medium and somehow specify the work’s singularity in presentation. At a more fine-grained level, our appreciation of particular effects—of color and composition, expression, narrative structure, and so on—depends on the effects themselves but also on background acknowledgment of their degree of difficulty or innovation in the relevant medium. The production of digital art relies on the computer automation of many of the tasks, both manual and cognitive, traditionally involved in making art. The effects achieved by computer automation cannot be assessed in the same way as those achieved by traditional “hands-on” artistic methods. The terms of our appreciation, therefore, need to be adjusted in the digital age. This is certainly compatible with the continued relevance of medium-based appreciation, as long as we can make sense of digital media as artistic media (Binkley 1998)[^binkley-1998]. But there is a strong tendency in film and media studies to assume that the medium has absolutely no role to play in the appreciation of digital art.
    step1: |-
      对艺术家可用的选择之种类和意义的反思，有助于完整欣赏艺术家的作品。对任何艺术作品，欣赏始于承认其作为 **作品** 的地位，即某种艺术活动的产物，因此是作为某位艺术家或艺术家群体的成就来欣赏的东西。最常见的是，这一成就被理解为艺术家用某些工具和材料、在特定欣赏惯例下取得的美学上显著的效果。换言之，成就总是相对于艺术媒介的。回到艺术家就数字影像的内在可复制性选择怎么做的情况，思考这一选择的另一种方式，是艺术家认识到所选媒介的限度和能力。以数字方式传达的影像总是可复制的，所以当艺术家旨在通过数字影像传达艺术内容时，他们要么必须接受作品不可避免的多重性，要么抵抗媒介的倾向，以某种方式在展示中指明作品的独一性。在更精细的层面上，我们对特定效果——颜色和构图、表现、叙事结构等——的欣赏取决于效果本身，但也取决于对它们在相关媒介中的难度或创新程度的背景承认。数字艺术的生产依赖计算机对传统上涉及艺术创作的许多任务（手工和认知的）的自动化。计算机自动化取得的效果不能像传统“动手”艺术方法取得的效果那样评估。因此，在数字时代，我们欣赏的术语需要调整。这当然与基于媒介的欣赏的持续相关性相容，只要我们能理解作为艺术媒介的数字媒介（Binkley 1998）。但在电影和媒介研究中，有一种强烈倾向，认为媒介在数字艺术欣赏中完全没有作用。
