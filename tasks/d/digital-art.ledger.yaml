      According to Katherine Thomson-Jones (2021)[^thomson-jones-2021], there is a problem with Preston’s claim that interactive artworks — at least ones that are digital — have multiple display types, as well as multiple displays. This is because the digital is inherently replicable and replicability requires a transmissible display — a single display type that can have multiple, interchangeable instances. This seems to introduce a problem of incompatibility: How can we have an image whose instances still count as instances of the same image-based work when those instances, in virtue of users’ actions, look very different from one another? There are various ways one might overcome this problem — for example, by distinguishing between the display of an image and the display of an artwork that incorporates the image in question. Preston’s distinction between display and display type can continue to play a role here. While the concept of interactivity with high variability is mostly applicable to videogames, one can imagine interactive digital installations, net art, and table-top roleplaying games to which it also applies.
    step1: |-
      据凯瑟琳·汤姆森-琼斯（2021），普雷斯顿的主张——交互艺术作品（至少是数字的交互艺术作品）既有多个显示类型，也有多个显示——存在一个问题。这是因为数字本质上是可复制的，而可复制性要求一个可传输的显示——一个可以有多个可互换实例的单一显示类型。这似乎引入了一个不相容问题：当这些实例凭借使用者的行动而彼此看起来非常不同时，我们如何能拥有一幅图像，其诸实例仍算作同一件基于图像作品的实例？人们可以通过各种方式克服这个问题——例如，区分图像的显示与纳入该图像的艺术作品的显示。普雷斯顿关于显示与显示类型的区分可以在此继续发挥作用。尽管高可变性交互性的概念主要适用于电子游戏，人们也可以想象它适用于交互数字装置、网络艺术与桌面角色扮演游戏。
    step2: |-
