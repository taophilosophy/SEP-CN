      There is already a robust debate about the nature of creativity as it occurs in many different areas of human activity (see, e.g., Gaut & Kieran, eds., 2018; Paul & Kaufman, eds., 2014)[^gaut-2018] There is a case to be made, however, that this debate can be enriched by drawing on work in the philosophy of AI. In everyday life, sophisticated AI systems are now being used for all kinds of purposes: We rely on these systems when we use Internet search engines, play strategic videogames, accept purchasing recommendations from online retailers, and check for viruses on our computers. In addition, we can use AI to generate new images and text, some of which can be incorporated into works of art. One can type a series of prompts into a chatbot like ChatGPT in order to generate a new screenplay in a certain genre. Similarly, one can assemble a set of images on which to train an “artbot” like MidJourney in order to generate paintings, drawings, or what look like photographs. It is common to attribute creative agency to the person who purposively initiates, and then monitors, the program used to generate the images or text that make up a work of AI art. A question remains, however, as to whether this should be the *sole* creative attribution when AI is involved. Some artists describe the AI system with which they work as a creative “partner”, and not just a sophisticated artistic tool. This is particularly the case with recent artworks that rely on “Deep Learning” (DL) to generate images or text in a remarkably independent way. Both chatbots and artbots rely on deep learning to categorize huge datasets (images or text) according to previously undetected patterns. To do this, a DL system must give itself new instructions — ones that depart from the initial instructions of the program — for the kind of image or text segment, and for the particular image or text segment, to be produced.
    step1: |-
      关于创造力在许多不同人类活动领域中发生时的本性，已经有一场活跃的争论（例如见 Gaut & Kieran 编，2018；Paul & Kaufman 编，2014）。然而，有理由认为，这场争论可以借助 AI 哲学的研究而得到丰富。在日常生活中，复杂的 AI 系统如今被用于各种目的：我们使用互联网搜索引擎、玩策略电子游戏、接受在线零售商的购买推荐、检查计算机病毒时，都依赖这些系统。此外，我们可以用 AI 生成新的图像与文本，其中一些可以被纳入艺术作品。人们可以在 ChatGPT 这样的聊天机器人中输入一系列提示，以生成某种类型的新剧本。同样，人们可以汇集一组图像来训练 MidJourney 这样的“艺术机器人”，以生成绘画、素描或看似照片的图像。通常，人们会把创造性能动性归于那位有目的地启动并随后监控程序的人，而该程序用于生成构成 AI 艺术作品的图像或文本。然而仍有一个问题：当涉及 AI 时，这是否应当是 **唯一** 的创造性归属？一些艺术家把他们与之合作的 AI 系统描述为创造性的“伙伴”，而不仅仅是复杂的艺术工具。对于近来依赖“深度学习”（DL）以极其独立的方式生成图像或文本的艺术作品，情况尤其如此。聊天机器人与艺术机器人都依赖深度学习，按照此前未被察觉的模式把庞大数据集（图像或文本）分类。为此，深度学习系统必须给自己新的指令——偏离程序初始指令的指令——以规定要生成的图像或文本片段的种类，以及特定的图像或文本片段。
