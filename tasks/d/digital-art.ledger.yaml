      程序是指令的清单，指令是数字串。现代数字计算机有组件用于在机器内部复制和存储程序，并按适当顺序向计算机的处理单元提供指令。系统的输出可以依赖于特定输入，常常与条件性 if-then 语句协同。这就是计算机执行条件分支指令所涉及的，使它能够监控并回应自己的中间计算状态，甚至根据自己的过程修改指令。这种修改由算法——程序的一组规则和操作——决定。正是数字计算机由于数字可编程性而具有的分支能力，使成像应用的使用和连续图像生成所涉及的那种更高层自动化成为可能。我们的艺术家卡尔帕克吉安以及阿坎杰尔与戴维斯，不必为计算机的每一项基本操作输入数字串，这些基本操作是描述和操纵图像所涉及的复杂操作的基础。如果他们不得不这样做，他们就永远无法完成作品。相反，艺术家可以依赖开源代码、库或商业软件，这些会自动且即时地提供执行其艺术决定所需的代码行。
