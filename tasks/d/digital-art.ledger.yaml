      > The Transborder Immigrant Tool, devised by Electronic Disturbance Theater 2.0/b.a.n.g. lab, was a mobile phone application intended to guide individuals who were making their way to the United States through the deserts of the U.S./Mexico borderlands to water. The application delivered poetry to its users in an effort to assist in their emotional and mental well-being while offering information about survival during the dangerous journey.
      >
      > The creators of The Transborder Immigrant Tool considered it to be a performance intervention that included the app itself, its API, public reactions, and an ensuing government investigation. By the time TBT was ready for distribution in 2011, the border crossing had become more dangerous, presenting the risk that carrying a TBT phone might put users in danger. While the project was never distributed to its intended users, it still succeeded in confounding systems of political control, creating a call to action that resonated internationally, and using poetry to “dissolve” the US-Mexico border (Electronic Disturbance Theater 2.0 et al 2007)[^electronic-2007].
    step1: |-
      > 《跨境移民工具》由电子干扰剧场 2.0／b.a.n.g. 实验室设计，是一款手机应用，旨在为穿越美墨边境沙漠前往美国的人指引水源。该应用向用户发送诗歌，以帮助其在危险旅程中的情感与心理健康，同时提供生存信息。
      >
      > 《跨境移民工具》的创作者认为它是一场表演干预，包括应用本身、其 API、公众反应以及随后的政府调查。到 2011 年 TBT 准备分发时，边境穿越已变得更加危险，携带 TBT 手机可能使用户陷入危险。尽管该项目从未分发给目标用户，它仍然扰乱了政治控制体系，引发了引起国际共鸣的行动号召，并用诗歌“消解”了美墨边境（Electronic Disturbance Theater 2.0 et al 2007）。
