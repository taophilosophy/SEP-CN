      旧金山现代艺术博物馆藏有卡尔帕克吉安作品《走廊》的原件；他们控制录像影像的访问。目前这件作品不可观看：它不能作为数字档案或收藏的一部分在线观看，目前也不在博物馆实体空间中展出。构成该作品的图像序列可以被多重实例化并广泛分发，但事实上并没有，也无意如此。阿坎杰尔与戴维斯的作品《风景研究 #4》同样如此：这件作品被描述为一件装置，意在实体画廊中与一组印刷剧照一起展出，并配有一台连接任天堂娱乐系统的电视机。同样，电视上显示的图像序列可以被多重实例化并广泛分发，但并没有，也无意如此。风景影像的片段与复制品可以在线获得，但这些并不实例化作品本身的部分。相比之下，网络艺术作品每当有人在线上访问时便被实例化。
