      数字图像只要作为数字的、因而有限分立的，就可以被复制。它们有限分立，因为它们依赖亚现象采样与显示技术。在实践中，复制依赖二进制代码的使用，尽管事实上并不是这一点使图像 **作为图像** 成为数字的。当然，二进制代码表征本身是数字图式的一部分。但二进制代码在图像实例化中的作用只是一致的保存；保存足够长时间以允许复制。尽管数字图像具有内在可复制性，似乎并不能自动推出涉及这些图像的艺术作品就是多件。
