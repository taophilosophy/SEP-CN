      应当重申，刚才描述的强交互性并不限于数字。虽然交互性是许多当代数字作品的标准特征，这类作品的可回应性也的确惊人，非数字的欣赏范畴同样能利用类似程度的显示变异性。例如，文学、戏剧与桌面角色扮演游戏也能像许多数字艺术作品那样，以类似方式强交互。凡此种种作品的独特之处，在于沉浸、能动性、身份与虚构（略举数端）这类特征因用户之于作品的参与而受交互性影响的方式（欲知更多，见 Robinson & Tavinor 2018; Patridge 2017; Meskin & Robson 2016）[^patridge-2017][^robson-2016]。
