      The two-stage process of digital projection, by which the moving image is created from a succession of static images that are themselves created by motion, draws attention to the metaphysical complexity of the question of how movies move. In particular, one is unlikely to determine the status of the impression of motion that makes possible the art of cinema unless one can determine the status of the imagery that is seen to move. Given that motion involves an object occupying contiguous spatial locations in successive moments of time, a moving object must be re-identifiable over time. A moving image in a film, arising as it does out of the rapid display of a succession of still images, is not obviously a persistent object that can be seen to move. Then again, perhaps it is enough that ordinary viewers identify an image—say of a moving train— as the same image, for the moving image to persist (Currie 1996)[^currie-1996]. Alternatively, the moving image could be thought to persist as a second-order physical entity constituted by a sequence of flashing lights (Ponech 2006)[^ponech-2006].
    step1: |-
      数字放映的两阶段过程——运动图像由一连串静态图像造成，而这些静态图像又由运动造成——让人注意到电影如何运动这一问题在形而上学上的复杂性。特别说来，除非人们能判定被看见在运动的那图像的身份，否则不太可能判定使电影艺术成为可能的那运动印象的身份。既然运动涉及一个对象在相继时刻占据连续的空间位置，一个运动的对象必须能够在时间中被再确认。电影中的运动图像，既出于一连串静止图像的快速显示，就未必显然是一个能被看见在运动的持存对象。然而，也许只要普通观看者把一幅图像——比如一列运动中的火车的图像——确认为同一幅图像，运动图像就足以持存了（Currie 1996）[^currie-1996]。又或者，运动图像可以被想作作为一个二阶物理实体而持存，该实体由一连串闪烁的光所构成（Ponech 2006）[^ponech-2006]。
    step2: |-
      数字放映的两阶段过程——运动图像由一连串静态图像造成，而静态图像本身又由运动造成——把人们的注意力引向“电影如何运动”这一问题的形而上学复杂性。要点在于：除非先判定被看见在运动的那图像是何身份，否则难以判定那使电影艺术成为可能的运动印象是何身份。运动既涉及对象在相继时刻占据连续的空间位置，运动的对象就必须能在时间中被再认。电影中的运动图像既出于一连串静止图像的快速显示，就未必显然是个能被看见在运动的持存对象。然而，或许只要普通观者把一幅图像——比如一列疾驰火车的图像——认作同一幅图像，运动图像便足以持存（Currie 1996）[^currie-1996]。又或者，运动图像可被想作一个二阶物理实体而持存，此实体由一连串闪光构成（Ponech 2006）[^ponech-2006]。
