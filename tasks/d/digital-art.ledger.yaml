      > “Rock where People Gather” is reproduced in a virtual three-dimensional space. Water is simulated to fall onto the rock, and the flow of the water draws the shape of the waterfall. The water is represented by a continuum of numerous water particles and the interaction between the particles is then calculated. Lines are drawn in relation to the behavior of the water particles. The lines are then “flattened” using what TeamLab considers to be “ultrasubjective” space.
      >
      > When a person stands on the rock or touches the waterfall, they too become like a rock that changes the flow of water. The flow of water continues to transform in real time due to the interaction of people. Previous visual states can never be replicated, and will never reoccur (TeamLab 2018).
    step1: |-
      > 《人群聚集之石》再现于一个虚拟三维空间。水被模拟为落到石上，水的流动画出瀑布的形状。水由无数水粒子的连续统来表征，粒子之间的交互随后被计算。线条依水粒子的行为绘制。这些线条随后用 TeamLab 视为“超主观”空间的方式被“压平”。
      >
      > 当一个人站上石头或触碰瀑布，他们也就成了一块改变水流的石头。由于人的交互，水流持续实时变形。先前的视觉状态永远无法被复制，也永远不会再出现（TeamLab 2018）。
