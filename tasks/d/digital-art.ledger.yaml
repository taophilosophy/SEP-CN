  - id: 1
    kind: body
    source: |-
      The philosophy of digital art is the philosophical study of art that crucially relies on computer processing in its production or presentation. There are many kinds of digital art, including digital cinema and video, digital photography and painting, electronic music, literary works generated by so-called “chatbots”, NFT art, net art, and video games. For the full range of digital art kinds, the aim is to identify their essential features, ground their proper appreciation, and situate our understanding of them in relation to pre-existing debates in aesthetics. This first-order inquiry cannot proceed without acknowledgment of the enormous interdisciplinary and popular interest in digital media. Claims are frequently made about fundamental shifts in the way we classify, evaluate, and engage with art now that computers seem to be involved in every kind of cultural production. The so-called “digital condition” (Kittler 1999)[^kittler-1999] is characterized by a loss of trust in the image, a new way of experiencing the world as indeterminate and fragmentary, and a breakdown of traditional boundaries between artist and audience, artwork and artistic process. If we are looking for evidence of the digital condition, we need to understand its conceptual structure. Here’s where the philosopher comes in.
    step1: |-
      数字艺术哲学是对在制作或展示中关键地依赖计算机处理的艺术的哲学研究。数字艺术有许多种类，包括数字电影与视频、数字摄影与绘画、电子音乐、由所谓“聊天机器人”生成的文学作品、NFT 艺术、网络艺术以及电子游戏。对于数字艺术种类的全部范围而言，目标是识别它们的本质特征，为它们恰当的欣赏奠定基础，并把我们对它们的理解置于与美学中既有争论的关系之中。这一第一阶探究不能不承认对数字媒介的巨大跨学科兴趣与公众兴趣。既然计算机似乎卷入每一种文化生产，人们便经常宣称我们分类、评价和参与艺术的方式发生了根本转变。所谓“数字状况”（Kittler 1999）[^kittler-1999] 的特征是：对图像失去信任，以一种不确定和碎片化的新方式经验世界，以及艺术家与观众、艺术作品与艺术过程之间传统界限的崩溃。如果我们要寻找数字状况的证据，就需要理解它的概念结构。哲学家的作用正在于此。
    step2: |-
      数字艺术哲学是对在制作或展示中关键性地依赖计算机处理的艺术所作的哲学研究。数字艺术种类繁多，包括数字电影与视频、数字摄影与数字绘画、电子音乐、由所谓“聊天机器人”生成的文学作品、NFT 艺术、网络艺术以及电子游戏。就数字艺术的全部分类而言，其目标是辨识它们的本质特征，为其恰当的欣赏奠定基础，并把我们对它们的理解置于美学中既有争论的脉络之中。这一第一阶探究若要推进，就不能不承认人们对数字媒介怀有巨大的跨学科兴趣与公众兴趣。既然计算机似乎已卷入每一种文化生产，人们便常常宣称：我们分类、评价与参与艺术的方式已发生根本转变。所谓“数字状况”（Kittler 1999）[^kittler-1999] 的特征是：对图像失去信任，以一种不确定、碎片化的新方式经验世界，以及艺术家与观众、艺术作品与艺术过程之间的传统界限崩塌。若要寻找数字状况的证据，我们就需要理解其概念结构。哲学家的用武之地正在于此。
  - id: 2
    kind: body
    source: |-
      Although technology-based art is viewed as the “final avant-garde of the twentieth-century” (Rush 2005)[^rush-2005], and digital art has been part of the mainstream art world since the late 1990s (Paul 2008)[^paul-2008], the philosophy of digital art is still an emerging subfield. Three seminal monographs, one on videogames (Tavinor 2009)[^tavinor-2009], one on digital cinema (Gaut 2010)[^gaut-2010], and one on computer art (Lopes 2010)[^lopes-2010], have been invaluable in laying the groundwork concerning philosophical questions about art and computer technology. Since these publications, further philosophical attention has been given to the digital arts, including the first published volume to focus on the aesthetics of videogames (see Robson & Tavinor, eds., 2018)[^robson-2018]. It can be challenging for philosophers to keep up with the rapid rate at which digital technology develops. But a number of recent articles on Artificial Intelligence (AI) in the arts show that philosophers are well aware of and ready to meet this challenge (Atencia-Linares and Artiga 2022; Millière 2022; Moruzzi 2022; Roberts and Krueger 2022)[^atencia-linares-2022][^millière-2022][^moruzzi-2022][^roberts-2022]. The body of philosophical work on AI art will no doubt continue to grow, as will bodies of work on virtual reality in art and Internet art. With this growth, we can expect to to learn a great deal more about the extent and character of the digital cultural revolution.
    step1: |-
      尽管基于技术的艺术被视为“20 世纪的最后先锋派”（Rush 2005）[^rush-2005]，而且数字艺术自 1990 年代末以来一直是主流艺术界的一部分（Paul 2008）[^paul-2008]，数字艺术哲学仍然是一个新兴的子领域。三部开创性专著——一部关于电子游戏（Tavinor 2009）[^tavinor-2009]，一部关于数字电影（Gaut 2010）[^gaut-2010]，一部关于计算机艺术（Lopes 2010）[^lopes-2010]——在奠定关于艺术与计算机技术的哲学问题的基础方面具有不可估量的价值。自这些著作出版以来，数字艺术得到了更多哲学关注，包括第一部聚焦电子游戏美学的已出版文集（见 Robson & Tavinor 编，2018）[^robson-2018]。哲学家要跟上数字技术发展的快速速度可能很有挑战性。但近来若干关于艺术中人工智能（AI）的文章表明，哲学家充分了解并准备迎接这一挑战（Atencia-Linares and Artiga 2022；Millière 2022；Moruzzi 2022；Roberts and Krueger 2022）[^atencia-linares-2022][^millière-2022][^moruzzi-2022][^roberts-2022]。关于 AI 艺术的哲学著作无疑会继续增长，关于艺术中的虚拟现实与互联网艺术的著作也会如此。随着这种增长，我们可以期待更多地了解数字文化革命的范围与特征。
    step2: |-
      尽管技术艺术被视为“20 世纪的最后先锋派”（Rush 2005）[^rush-2005]，且数字艺术自 1990 年代末以来已成为主流艺术界的一部分（Paul 2008）[^paul-2008]，但数字艺术哲学仍是一个新兴的分支领域。三部开创性专著——一部论电子游戏（Tavinor 2009）[^tavinor-2009]，一部论数字电影（Gaut 2010）[^gaut-2010]，一部论计算机艺术（Lopes 2010）[^lopes-2010]——为探讨艺术与计算机技术之哲学问题奠定了基础，其价值不可估量。自这些著作出版以来，数字艺术获得了更多哲学关注，其中包括第一部聚焦电子游戏美学的文集（见 Robson & Tavinor 编，2018）[^robson-2018]。数字技术的发展速度极快，哲学家要跟上并不容易。但近来若干讨论艺术中人工智能（AI）的文章表明，哲学家充分意识到并愿意迎接这一挑战（Atencia-Linares and Artiga 2022；Millière 2022；Moruzzi 2022；Roberts and Krueger 2022）[^atencia-linares-2022][^millière-2022][^moruzzi-2022][^roberts-2022]。关于 AI 艺术的哲学研究无疑会继续增长，关于艺术中的虚拟现实与互联网艺术的研究同样会增长。随着这种增长，我们可以期待学到更多，了解数字文化革命的广度与特征。
