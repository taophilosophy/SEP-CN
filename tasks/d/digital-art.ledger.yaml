      The first proposal, on which cinematic motion is a secondary quality, threatens to destroy the distinction between the apparent and the illusory. It suggests a way of reinterpreting any case of perceptual illusion as a case involving the ascription of secondary qualities. That is, unless it can be shown that there are independent means of checking that we are mistaken about genuine illusions. But even if this can be shown, a problem remains: While there may not be an independent check for the motion of an image, there is likewise no independent check for a genuine illusion of color. Given the contrived conditions of film viewing, there is more reason to think of cinematic motion as akin to an illusory, than to a genuine, experience of color. With the introduction of digital projection, the conditions are arguably even more contrived. For it is not just movement in the image but the image itself that is constituted by rapid flashes of light. And the technology involved is far less accessible than that of a traditional mechanical projector in the sense that one cannot, just by looking at the projection device, see (roughly) how it works. In this way, an analysis of digital movie projection serves to reinforce the traditional assumption that cinema is an art of illusion. In addition, however, the analysis suggests that the illusion at the heart of cinema is particularly impenetrable—akin to an illusion of color, and thus an illusion of a mere appearance that cannot be checked (Thomson-Jones 2013)[^thomson-jones-2013].
    step1: |-
      第一个提议认为电影运动是第二性质，这有可能摧毁显象与错觉的区分。它提示一种方式，把任何知觉错觉情形重新解释为涉及第二性质归赋的情形。也就是说，除非能表明存在独立手段核查我们对真正错觉判断有误。但即使能表明这一点，仍有一个问题：对于影像的运动也许没有独立核查；同样，对于真正的颜色错觉也没有独立核查。鉴于观影的人为条件，我们更有理由把电影运动看作类似于错觉的颜色经验，而不是真实的颜色经验。随着数字放映的引入，这些条件可以说更加人为。因为不仅影像中的运动，而且影像本身，都由快速闪光构成。并且所涉及的技术远比传统机械放映机难以接近：人们不能仅凭观看放映设备就（大致）看出它如何运作。这样，对数字电影放映的分析反而强化了电影是错觉艺术这一传统假定。此外，分析还表明，电影核心处的错觉特别不可穿透——类似于颜色错觉，因此是一种无法核查的纯显象的错觉（Thomson-Jones 2013）。
