  - id: 85
    kind: body
    source: |-
      > the data produced and used in smart cities should not necessarily be presented as a utility for citizens. It should be presented as a prop for play, as games but also as the source for toys and playgrounds. Data-rich cities can become playable cities, and, by becoming such, they can become more human, more inclusive spaces (Ackermann: 2016, 27)[^ackermann-2016].
    step1: |-
      > 智慧城市中生产与使用的数据，不一定要呈现为对市民的实用工具。它应当被呈现为游戏的道具，既作为游戏，也作为玩具与游乐场的来源。数据丰富的城市可以成为可玩的城市，而一旦如此，它们便可成为更具人情味、更具包容性的空间（Ackermann: 2016, 27）[^ackermann-2016]。
    step2: |-
      > 智慧城市所生产、所使用的数据，不必非要呈现为对市民的公用设施不可。它应当呈现为游戏的道具：既是游戏，也是玩具与游乐场之源头。数据丰饶的城市可以化为可玩的城市；一旦如此，它们便更有人情味、更具包容性（Ackermann: 2016, 27）[^ackermann-2016]。
  - id: 86
    kind: body
    source: |-
      Once again, the process-oriented and performative nature of locative works is central to appreciating the spaces they create. In connection with the playability of locative media, locative projects are also modifiable and typically intended to be hackable by the public in the communities where they are displayed. While the terms “hacker” and “hacking” may carry negative connotations, in its original conception, the practice of hacking was meant to improve upon existing computer programs, acknowledging the achievements of both the original creator and subsequent revisionists (Levy:1984)[^levy-1984]. It is in this vein that locative projects are usually intended to change and improve over time given how users “play” with the data and inputs. In other words, local communities can play with these projects and even modify them, making locative works as relevant and reflective of the community as possible.
    step1: |-
      再次，定位作品的过程导向与表演性，对于欣赏它们所创造的空间是核心的。与定位媒体的可玩性相联系，定位项目也是可修改的，且通常意在为展示所在社区的公众所黑客。虽然“黑客”与“黑入”这些词或许带有负面含义，但就其原初构想而言，黑客实践意在改进既有的计算机程序，承认原初创造者与后续修订者的成就（Levy:1984）[^levy-1984]。正是循此脉络，定位项目通常意在随着用户对数据与输入的“摆弄”而随时间改变与改进。换言之，本地社区可以摆弄这些项目甚至修改它们，使定位作品尽可能与社区相关并反映社区。
    step2: |-
      再次，定位作品的过程导向与表演性，对于欣赏其所创造的空间至关紧要。与定位媒体的可玩性相系，定位项目亦可修改，且通常意在被展示地社区的公众所黑客。虽说“黑客”与“黑入”或含贬义，但推其原初构想，黑客实践本意在改进既有的计算机程序，并承认原初创造者与后续修订者双方的成就（Levy:1984）[^levy-1984]。定位项目正是循此脉络，通常意在随用户对数据与输入的“摆弄”而历时演变、日渐改进。换言之，本地社区可以摆弄甚至修改这些项目，使定位作品尽可能地贴近社区、映现社区。
  - id: 87
    kind: body
    source: |-
      The above suggests that locative projects often have broader goals than mere entertainment. Although often intended to motivate play and playful attitudes, which, as indicated in the examples above can occur to varying degrees, the goal-oriented nature of locative works often makes the kind of play involved a “serious” kind. Serious play occurs when the enjoyment and pleasure that come from play do not just comprise entertainment but also serve some meritorious, real-world goal. A work can be said to support serious play even when users are not aware of the social or political goals of the work.
    step1: |-
      上述表明，定位项目往往有比单纯娱乐更广的目标。虽然它们常常意在激发游玩与游戏性的态度——如上文诸例所示，这可以在不同程度上发生——但定位作品的目标导向性，往往使所涉游玩成为一种“严肃”的游戏。严肃游戏发生于游玩带来的享受与愉悦不仅构成娱乐，还服务于某种值得称许的现世目标之时。即便用户并不知晓作品的社会或政治目标，一件作品仍可以被说成支持严肃游戏。
    step2: |-
      上述种种表明，定位项目往往有比单纯娱乐更宏阔的目标。它们固然常意在激发游玩与游戏性的态度——如上文诸例所示，程度不等——但定位作品的目标导向性，常令所涉游玩沦为“严肃”之游。所谓严肃游戏，即游玩的享受与愉悦不止于娱乐，而是另有值得称许的现世目标。纵使用户对作品的社会或政治目标浑然不觉，一件作品仍可说是在支持严肃游戏。
  - id: 88
