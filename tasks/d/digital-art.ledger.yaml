      > KlingKlangKlong serves as an experimental arrangement to explore the idea of playful (social) systems, a construction where human and virtual subsystems play with each other. In addition to the human participants, it therefore deploys a number of virtual players (»Virtuals«). Humans and Virtuals meet each other in mixed reality, a concept that was realized in early locative games. The commonly created soundtrack is the primary medium of communication between the players. Musical structures may temporarily arise through synchronized movements or be destroyed by any player’s intervention (Straeubig & Quack 2016)[^straeubig-2016].
    step1: |-
      > 《叮当咚》作为实验性安排，探索好玩的（社会）系统这一观念，即一种人类子系统与虚拟子系统彼此游戏的构造。因此，除了人类参与者，它还部署了一些虚拟玩家（“Virtuals”）。人类与虚拟玩家在混合现实中相遇，这一概念在早期的定位游戏中得到实现。共同创造的音轨是玩家之间主要的交流媒介。音乐结构可能通过同步运动暂时出现，也可能被任何玩家的干预破坏（Straeubig & Quack 2016）。
    step2: |-
      > 《叮当咚》作为实验性安排，探索好玩的（社会）系统这一观念，即一种人类子系统与虚拟子系统彼此游戏的构造。因此，除了人类参与者，它还部署了一些虚拟玩家（“Virtuals”）。人类与虚拟玩家在混合现实中相遇，这一概念在早期的定位游戏中得到实现。共同创造的音轨是玩家之间主要的交流媒介。音乐结构可能通过同步运动暂时出现，也可能被任何玩家的干预破坏（Straeubig & Quack 2016）[^straeubig-2016]。
