      Just as with a literary work, the preservation and transmission of digital works in different formats depends on the use of a common code, but a binary numeric code rather than a lexical one. As we have seen, words and their literary uses constitute the medium of literature. In the same way, binary code, along with the information it implements, and its artistic uses constitute the medium of digital art. This allows for the possibility that the digital medium contains various sub-media, or “nested” media (Gaut 2010)[^gaut-2010]. For instance, within the medium of digital art, the medium of digital visual art comprises artistic uses of computer code specifically to create images. In technical terms, such uses can be referred to as (artistic) “bitmapping”, given that a computer ultimately stores all images (2D and 3D vector) as bitmaps, which are code sequences specifying the integers assigned to light intensity measurements in a pixel grid. The medium of bitmapping is thus distinguished by a kind of digital technology, but the kind used to produce just those items belonging to the traditional medium of images.
    step1: |-
      正如文学作品，数字作品以不同格式保存和传输也依赖共同代码的使用，只不过是二进制数字代码而非词汇代码。正如我们所见，词语及其文学用法构成文学的媒介。同样，二进制代码连同它所实现的信息及其艺术用法，构成数字艺术的媒介。这允许数字媒介包含各种子媒介或“嵌套媒介”（Gaut 2010）。例如，在数字艺术的媒介之内，数字视觉艺术的媒介包括专门为创造图像而使用计算机代码的艺术用法。用技术术语说，这类用法可称为（艺术的）“位图化”，因为计算机最终把所有图像（二维和三维矢量）都存储为位图，而位图是指定像素网格中光强度测量所赋整数的代码序列。因此，位图化的媒介由一种数字技术来区分，但这种技术仅用于生产属于传统图像媒介的那些项目。
