      The second work involves imagery that was initially captured digitally. Arcangel & Davis began by taking 360-degree photographs of Buffalo, New York. They scanned and modified the photographs on their computer so that the images could be coded according to the graphics capabilities of the Nintendo gaming system, and in order to give the images the distinctive look and feel of the *Mario Bros.* game. Arcangel & Davis then programmed the landscape imagery to scroll continuously across a TV screen, as in the *Mario Bros.* game. Finally, Arcangel & Davis melted the chips in a *Super Mario* cartridge, replacing them with their self-manufactured chips so that their landscape “game” could be run on any Nintendo system. As well as all the ways in which Arcangel & Davis’s work relies on both the technology and aesthetics of videogames, there are clearly ways in which it deliberately removes or blocks certain key features or capacities of videogames, perhaps most notably their robust interactivity. Playing a videogame essentially involves the prescribed creation of new display instances of a work. But we do not “play” *Landscape Study #4*, and its imagery is fixed by the artist. The kind of interactivity typical of videogames can also be found in artworks made without computers (see Lopes 2010: 49)[^lopes-2010]. But this type of interactivity is most closely associated with digital art because complex interactivity is so much easier to achieve with the use of computers. This suggests a high degree of self-consciousness in Arcangel & Davis’s decision to block the interactivity of their reverse-engineered videogame. From the perspective of the philosophy of digital art, such a decision highlights the need for further discussion of the link between the nature of the digital and the nature of interactivity.
    step1: |-
      第二件作品涉及的影像最初是以数字方式捕获的。阿坎杰尔与戴维斯首先拍摄了纽约布法罗的 360 度照片。他们在计算机上扫描并修改照片，使图像能按照任天堂游戏系统的图形能力编码，并赋予图像《超级马里奥兄弟》游戏那种独特的外观和感觉。阿坎杰尔与戴维斯然后编写程序，让风景影像在电视屏幕上连续滚动，就像在《超级马里奥兄弟》游戏中那样。最后，阿坎杰尔与戴维斯熔化了《超级马里奥》卡带中的芯片，用他们自己制造的芯片替换，使他们制作的风景“游戏”可以在任何任天堂系统上运行。阿坎杰尔与戴维斯的作品在方方面面依赖电子游戏的技术和美学，同时也显然以某些方式刻意移除或阻断电子游戏的某些关键特征或能力，其中最引人注目的也许是电子游戏强大的交互性。玩电子游戏本质上涉及按规定创造作品的新显示实例。但我们并不“玩”《风景研究 #4》，其影像由艺术家固定。电子游戏典型的那类交互性也可以在没有计算机的情况下制作的艺术作品中找到（见 Lopes 2010: 49）。但这种交互性与数字艺术联系最紧密，因为复杂的交互性用计算机容易实现得多。这表明，阿坎杰尔与戴维斯阻断其逆向工程电子游戏交互性的决定具有高度的自我意识。从数字艺术哲学的角度看，这样的决定凸显出进一步讨论数字的本性与交互性的本性之间联系的必要。
