      A noteworthy point about the concepts presented above is that they are all conceived with the norms of traditional art and art practices in mind, meaning, works of art that are predominantly object-based. However, as described, interactive digital works can be said to have a “behavior” based on prescribed interactions. While traditional artworks typically emphasize a work that is complete prior to audience engagement, interactive works emphasize the moment-to-moment unfolding of the works by way of audience engagement. One recent approach to the ontology of art suggests that interactive works (among other kinds) are better conceived on a process-based, rather than on an object-based, model (Nguyen 2020)[^nguyen-2020]. A key difference between the two models is that the former focuses on the user’s actions and experiences or “inward aesthetics”, while the latter focuses on the “outward” aesthetic features of the self-contained object (Nguyen 2020: 25)[^nguyen-2020]. While a process-based account prioritizes the internalizability of a user’s actions, it does not completely give up the idea of an artistic object. Rather, it renders the object’s significance secondary insofar as any appreciation for a work’s objecthood is in service to the activities it permits (Nguyen 2020: 20)[^nguyen-2020].
    step1: |-
      关于上述概念，值得注意的一点是：它们都是本着传统艺术与艺术实践的规范构想的，也就是说，以客体为主的作品。然而如前所述，交互性数字作品可以说具有一种基于规定交互的“行为”。传统艺术作品通常强调在观众介入之前即已完成的作品，而交互性作品则强调借观众介入而逐步展开的作品。一种关于艺术本体论的晚近进路认为，交互性作品（以及其他种类的作品）更适合以过程为基础、而非以客体为基础的模型来构想（Nguyen 2020）[^nguyen-2020]。两个模型的一个关键差别是：前者聚焦于用户的行动与经验，即“内向美学”，而后者聚焦于自足客体的“外向”审美特征（Nguyen 2020: 25）[^nguyen-2020]。过程性说明虽优先考虑用户行动的可内化性，却并未完全放弃艺术客体的观念。毋宁说，它使客体的意义变得次要，因为对作品客体性的一切欣赏，都服务于它所能容许的活动（Nguyen 2020: 20）[^nguyen-2020]。
    step2: |-
      上述诸概念值得注意的一点是：它们都依传统艺术与艺术实践的规范而构想，也就是说，以客体为主的作品。然而如前所述，交互性数字作品可谓有一种基于规定交互的“行为”。传统艺术作品通常侧重在观众介入之前便已完成的作品，交互性作品则侧重借观众介入而逐刻展开的作品。晚近一种艺术本体论进路主张，交互性作品（以及别类作品）更宜按过程性模型、而非客体性模型来构想（Nguyen 2020）[^nguyen-2020]。两模型的关键差别在于：前者聚焦用户的行动与经验，即“内向美学”；后者聚焦自足客体的“外向”审美特征（Nguyen 2020: 25）[^nguyen-2020]。过程性说明虽以用户行动之可内化性为先，却未全然弃置艺术客体之观念；毋宁说，它令客体之意义退居次要——凡对作品客体性的欣赏，皆服务于它所能容许的活动（Nguyen 2020: 20）[^nguyen-2020]。
