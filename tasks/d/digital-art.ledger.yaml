      Pixellation alone, no matter the resolution, cannot account for images displayed on LCD screens belonging to a digital scheme; digital images *qua* images thus remain stubbornly analog. But perhaps a closer analysis of digital imaging technology can show that finite differentiation is met after all. Current technologies for sampling and instantiating light intensities group objective colors well below the level of phenomenal discrimination. For example, in the standard “Truecolor” system, a display pixel has three 8-bit subpixels, each of which emits a different visible wavelength with an intensity from a range of 256 values, yielding over 16 million objective colors. Such a large number of available colors gives the impression of a color continuum when, in fact, digital sampling technology has been used to carve up the objective color space into a disjoint series of wavelength intensities. On the one hand, from the fact that display pixels can be lit at intensities between and indiscriminable from adjacent discriminable intensities, it seems to follow that finite differentiation fails. On the other hand, precisely because digital technology involves microtechnology and metrology for subphenomenal discrimination between colors, the light intensity groupings that are expressed numerically as red-blue-green triplets (in, say, the Truecolor system) can be *narrower* than the objective color types that contribute to the resultant image scheme. The key is keeping the variations in the essentially analog properties of color, shape, and size small enough so that they cannot accumulate to the point of making a difference to image perception (Zeimbekis 2012)[^zeimbekis-2012]. The types in the scheme of digital images are technologically segmented, transitive groupings of the same color-, shape-, and size-experiences. The carving out of a transitive sub-set of magnitudes has to occur relative to the needs of the users of the system. In the case of digital color, the types are classes of light intensities *sufficient* to cause the same color experience for normal human perceivers. The replicability of digital images is made possible by the gap between the discriminatory limits of the human visual system and the discriminatory limits of digital sampling technology.
