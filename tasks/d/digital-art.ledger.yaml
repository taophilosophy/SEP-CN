      A digitally recorded image need not appear any less richly detailed or varied in color than an analog image. All the same, in the terms of D. N. Rodowick, whereas the analog photograph is an “isomorphic transcription” of its subject, a digital photograph is a “data-output”, with a symbolically-mediated link to its subject (Rodowick 2007: 117–8)[^rodowick-2007]. This ontological divide—described by William J. Mitchell as a “sudden and decisive rupture” in the history of photography (1994: 59), is then assumed to have aesthetic implications: Rodowick insists that the “discontinuities” in digital information “produce perceptual or aesthetic effects”. Despite this insistence, however, Rodowick goes on to acknowledge that, with enough resolution, “a digital photograph can simulate the look of a continuously produced analogical image”. This concession would seem to work against any attempt to identify the aesthetic effects of pixellation, even if “the pixel grid remains in the logical structure of the image” (Rodowick 2007: 119)[^rodowick-2007]. But if we are to interpret Rodowick charitably, he could be implying that ontology at least partly determines appropriate appreciation; even if a digital photograph can look just like an analog photograph, its (known) digital status affects which of its perceptible features are aesthetically relevant and how we appropriately engage with them.
    step1: |-
      数字记录的图像不必显得细节不如模拟图像丰富，或色彩不如模拟图像多变。尽管如此，用 D. N. 罗多维克的话说，模拟照片是其对象的“同构转录”，而数字照片是“数据输出”，与其对象有以符号为中介的联系（Rodowick 2007: 117–8）。这一本体论鸿沟——威廉·J. 米切尔称之为摄影史上的一次“突然而决定性的断裂”（1994: 59）——于是被假定具有美学含义：罗多维克坚持数字信息中的“不连续性”“产生感知或美学效果”。然而，尽管这样坚持，罗多维克接着承认，只要有足够的分辨率，“数字照片可以模拟连续产生的模拟图像的外观”。这一让步似乎不利于任何确认像素化美学效果的尝试，即使“像素网格仍留在图像的逻辑结构中”（Rodowick 2007: 119）。但如果我们善意地解读罗多维克，他可能是在暗示本体论至少部分决定恰当的欣赏；即使数字照片看起来与模拟照片一样，其（已知的）数字身份仍影响它的哪些可感知特征具有美学相关性，以及我们如何恰当地与之互动。
