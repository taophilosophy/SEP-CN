      Summing up this view, it supposedly follows from the fact that modern (digital) computers encode every kind of information in the same way—i.e., as a sequence of binary digits—that a digital artwork is no longer defined by its mode of presentation, whether in images, moving images, sound patterns, or text. A work’s display is rendered merely contingent by the fact that it is generated from a common code. By adding a particular instruction to the code sequence specifying a work, imagery associated with that work could be instantaneously converted into sounds or text, or just into different imagery. This possibility alone supposedly renders meaningless all talk of an artwork being in a particular medium and being properly appreciated in terms of that medium (Kittler 1999; Doane 2007)[^doane-2007][^kittler-1999].
    step1: |-
      总结这一观点：据说，从现代（数字）计算机以同一方式——即作为二进制数字序列——编码每一种信息这一事实，可以推出数字艺术作品不再由其展示方式（无论是图像、运动影像、声音图案还是文本）来界定。作品的展示之所以仅仅是偶然的，是因为它由共同代码生成。通过向规定作品的代码序列加入一条特定指令，与该作品相关的影像可以瞬时转换为声音或文本，或只转换为不同影像。据说仅此一种可能性就使一切关于艺术作品属于特定媒介并应依据该媒介恰当欣赏的说法变得毫无意义（Kittler 1999；Doane 2007）。
