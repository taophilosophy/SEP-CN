      Returning to the digital, some commentators have questioned whether Goodman’s condition of (syntactic and semantic) finite differentiation is sufficient to distinguish the kind of representation in question (Haugeland 1981; Lewis 1971)[^haugeland-1981][^lewis-1971]. John Haugeland, for example, argues that there can be differentiated schemes without the “copyability” feature that defines the practical significance of digital systems. Haugeland’s solution is to require the practical and not just the theoretical possibility of a system’s users determining type membership. In fact, however, Goodman himself would likely accept this modification. In a later work, Goodman explicitly states that finite differentiation must make it possible to determine type membership “by means available and appropriate to the given user of the given scheme” (Goodman and Elgin 1988: 125)[^goodman-1988].
    step1: |-
      回到数字，一些评论者曾质疑古德曼的（句法与语义）有限分立条件是否足以区分所论的那类表征（Haugeland 1981; Lewis 1971）[^haugeland-1981][^lewis-1971]。例如 John Haugeland 论证说，可以存在没有“可复制性”特征的分立图式，而正是这一特征界定了数字系统的实践意义。Haugeland 的解决办法是要求系统使用者判定类型归属具有实践的而不仅是理论的可能性。然而事实上，古德曼本人很可能接受这一修改。在一部后期著作中，古德曼明确表示，有限分立必须使类型归属的判定“借助于对该图式的该使用者来说可得的且适当的手段”成为可能（Goodman and Elgin 1988: 125）[^goodman-1988]。
    step2: |-
      回到数字一侧。一些论者曾质疑：古德曼的（句法与语义）有限分立条件，是否足以区分所论的那类表征（Haugeland 1981; Lewis 1971）[^haugeland-1981][^lewis-1971]。例如 John Haugeland 主张：可以存在不带“可复制性”特征的分立图式，而正是这一特征构成了数字系统之实践意义。Haugeland 的补救之道，是要求系统使用者判定类型归属不仅理论可能，而且实践可能。不过究其实，古德曼本人多半会接受这一修正：在一部后期著作中，他明言有限分立必须使类型归属的判定“借对该图式的该使用者而言可得且适当的手段”成为可能（Goodman and Elgin 1988: 125）[^goodman-1988]。
