      与其把一切数字作品当作得来太易、因而无趣之物打发掉，基于媒介的欣赏要求我们按数字自身的条件来思量它。这意味着须容许这样的可能：某些技术效率的提升会带来新的创作风险。例如，作出某些剪辑决定虽不致对胶片带造成不可逆改动，但得出这些决定，却须筛选并排除多得多的选项；此过程极易不堪重负，从而更易出错。恰当欣赏一部数字电影时，我们所需欣赏的一部分，正是任一场景或序列何以恰呈现为眼下这般——尽管它本可如此轻易地呈现为许多别的样子。同样，恰当欣赏一件交互性数字装置或电子游戏时，我们也在某种意义上欣赏输入-输出系统的某些表征、功能与能力，它们因数字媒介而成为可能。这无疑是基于媒介的欣赏之一形式，而我们所诉诸的媒介正是数字的。唯有把一部数字电影想作栖身于数字媒介之中，我们才能把它欣赏为对编码所引入之创作难题的一种特定回应——那个难题是：从海量同等且即时可得的选项中定夺取舍。
