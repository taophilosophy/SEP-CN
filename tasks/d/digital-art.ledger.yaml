      仅凭像素化，无论分辨率多高，都不能说明显示在 LCD 屏幕上的图像属于一个数字图式；因此数字图像 **作为图像** 仍然顽固地是模拟的。但也许对数字成像技术的更细致分析可以表明，有限分立毕竟得到满足。当前的采样与光强度实例化技术，把客观颜色分组到远低于现象分辨水平的层次。例如，在标准的“Truecolor”系统中，一个显示像素有三个 8 位子像素，每个子像素以 256 个值范围内的强度发射不同可见波长，产生超过 1,600 万种客观颜色。如此大量的可用颜色给人一种颜色连续统的印象，而事实上数字采样技术已被用来把客观颜色空间切分成一系列不相交的波长强度。一方面，从显示像素可以在相邻可分辨强度之间、且与相邻可分辨强度不可分辨的强度上被点亮这一事实，似乎可以推出有限分立失败。另一方面，恰恰因为数字技术涉及用于颜色间亚现象分辨的微技术和计量学，以红—蓝—绿三元组（例如在 Truecolor 系统中）数值表示的光强度分组，可以比构成所得图像图式的客观颜色类型 **更窄**。关键在于把颜色、形状和大小这些本质上模拟的属性的变化保持得足够小，使它们不能累积到对图像感知产生差异的程度（Zeimbekis 2012）。数字图像图式中的类型，是同一颜色、形状和大小经验的技术性分段、传递性分组。切分出一个传递性的量值子集，必须相对于系统使用者的需要进行。就数字颜色而言，类型是 **足以** 为正常人类感知者造成同一颜色经验的光强度类别。数字图像的可复制性，由人类视觉系统的分辨极限与数字采样技术的分辨极限之间的间隙所促成。
