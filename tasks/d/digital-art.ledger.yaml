      Not all digital works are interactive, and not all interactive works are digital. However, since computers are inherently interactive, much of the early philosophical literature on interactivity arose from the emergence of computer art (also see Smuts 2009; Lopes 2001; Saltz 1997)[^lopes-2001][^saltz-1997][^smuts-2009]. The distinctive character of interactive digital art is best considered in tandem with the work’s ontology.
