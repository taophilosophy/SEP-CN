      ### 1.2 The Analog-Digital Distinction
    step1: |-
      ### 1.2 The Analog-Digital Distinction
    step2: |-
      ### 1.2 模拟-数字之分
  - id: 12
    kind: body
    source: |-
      The classical account of the analog-digital distinction is found in Nelson Goodman’s *Languages of Art* (1976). In fact Goodman’s account remains practically the only *general* account of the distinction. While David Lewis (1971) raises a series of objections to Goodman, Lewis’ alternative account applies only to the representation of numbers. And while John Haugeland (1981) returns to the general distinction, he effectively qualifies and re-frames Goodman’s account in order to overcome Lewis’s and other potential objections. A few philosophers interested in clarifying the concepts employed by cognitive scientists have recognized the need for a general account of the analog-digital distinction (e.g., Dretske 1981; Blachowicz 1997; Katz 2008; Maley 2011)[^blachowicz-1997][^dretske-1981][^katz-2008][^maley-2011]. But in this context, as well, Goodman’s account is the essential point of reference. In some ways, this is surprising or at least striking: As Haugeland points out, the digital is a “mundane engineering notion” (1981: 217). Yet the philosophical context in which the notion receives its fullest analysis is that of aesthetics. As is well-known, Goodman’s interests in this context center on the role of musical notation in fixing the identity of musical works. But a musical notation is also a standard example of a digital system.
    step1: |-
      模拟-数字之分的经典说明见于纳尔逊·古德曼的《艺术语言》（1976）。事实上，古德曼的说明 practically 仍是关于这一区分的唯一一般性说明。虽然 David Lewis（1971）对古德曼提出了一系列反驳，Lewis 的替代说明却只适用于数的表征。而虽然 John Haugeland（1981）回到一般区分，他实际上是为了克服 Lewis 及其他潜在反驳而对古德曼的说明作了限定与重构。一些有兴趣澄清认知科学家所用的概念的哲学家，认识到需要一份关于模拟-数字之分的一般说明（例如 Dretske 1981; Blachowicz 1997; Katz 2008; Maley 2011）[^blachowicz-1997][^dretske-1981][^katz-2008][^maley-2011]。但在这个语境中，古德曼的说明同样是根本的参照点。从某些方面看，这是令人惊讶或至少引人注目的：正如 Haugeland 指出的，数字是一个“平凡的工程学概念”（1981: 217）。然而这一概念得到最充分分析的哲学语境，却是美学。众所周知，古德曼在此语境中的兴趣集中于音乐记谱在固定音乐作品同一性方面的作用。但音乐记谱同时也是一个数字系统的标准例子。
    step2: |-
      模拟-数字之分的经典说明，见于纳尔逊·古德曼的《艺术语言》（1976）。实言之，古德曼的说明至今仍是关于这一区分的唯一一份一般性说明。David Lewis（1971）虽对古德曼连番诘难，其替代说明却只适用于数的表征；John Haugeland（1981）虽回归一般区分，实则是在克服 Lewis 及其他潜在反驳的意图下，对古德曼的说明加以限定与重构。一些有志澄清认知科学家所用概念的哲学家，也认识到需要一份关于模拟-数字之分的一般说明（例如 Dretske 1981; Blachowicz 1997; Katz 2008; Maley 2011）[^blachowicz-1997][^dretske-1981][^katz-2008][^maley-2011]；但在此语境中，古德曼的说明依旧是最根本的参照点。这从某些方面看令人讶异，至少引人瞩目：Haugeland 有言，数字是个“平凡的工程学概念”（1981: 217）；然而此概念得到最充分分析的哲学语境，竟是美学。众所周知，古德曼在此语境中的兴趣，集中于音乐记谱在固定音乐作品同一性上的作用；而音乐记谱，恰又是一个数字系统的标准实例。
  - id: 13
    kind: body
    source: |-
      On Goodman’s broad, structuralist way of thinking, representational systems in general consist of sets of possible physical objects that count as token representations. Objects are grouped under syntactic and semantic types, and interesting differences between kinds of representational system track differences in the way syntactic and semantic types relate to one another. Digital systems are distinguished by being *differentiated* as opposed to *dense*. The condition of *syntactic* differentiation is met when the differences between classes of token representations are limited such that it is possible for users of the system always to tell that a token belongs to at most one class. The condition of *semantic* differentiation is met when the extension of each type, or the class of referents corresponding to a class of token representations, differs in limited ways from the extension of any other type; so that users of the system can always tell that a referent belongs to at most one extension. Goodman provides the following example of a simple digital computer, a system that meets the conditions of both syntactic and semantic differentiation: Say we have an instrument reporting on the number of dimes dropped into a toy bank with a capacity for holding 50 dimes, where the count is reported by an Arabic numeral on a small display (Goodman 1976: 159)[^goodman-1976]. In this system, the syntactic types are just the numbers 0–50, which have as their instances the discrete displays, at different times, of the corresponding Arabic numerals. Both the conditions of syntactic and semantic differentiation are met because the relevant differences between instances of different numbers are both highly circumscribed and conspicuous. This means that users of the system can be expected to be able to read the display, or determine which number is instantiated on the display (syntactic differentiation) and which numerical value, or how many coins, is thereby being indicated (semantic differentiation).
    step1: |-
      按古德曼宽泛的结构主义式思考，表征系统一般由扮演例记表征角色的可能物理对象之集合构成。对象被归入句法类型与语义类型，各类表征系统之间的有趣差别，则追踪句法类型与语义类型彼此关联方式上的差别。数字系统的特点在于它们是分立的（differentiated），而非稠密的（dense）。当例记表征诸类之间的差异受到限制，使得系统的使用者总有可能判定一个例记至多属于一类时，句法分立的条件便得到满足。当每一个类型的外延——即对应于一类例记表征的指称物之类——以有限的方式区别于任何其他类型的外延，使得系统的使用者总能判定一个指称物至多属于一个外延时，语义分立的条件便得到满足。古德曼给出了如下一个简单数字计算机的例子，一个同时满足句法分立与语义分立条件的系统：设想有一台仪器，报告投入一个容量为 50 枚一角硬币的玩具储蓄罐中的一角硬币数目，计数由小显示器上的阿拉伯数字报告（Goodman 1976: 159）[^goodman-1976]。在这个系统中，句法类型就是数字 0–50，它们的实例是不同时刻显示器上相应阿拉伯数字的离散显示。句法分立与语义分立两个条件都得到满足，因为不同数字的实例之间的相关差异，既是高度受限的，又是醒目的。这意味着可以预期该系统的使用者能够读出显示，或判定显示器上例现的是哪个数字（句法分立），从而判定所指示的是哪个数值、或多少枚硬币（语义分立）。
    step2: |-
      循古德曼宽泛的结构主义思路，表征系统一般由若干可能物理对象的集合构成，这些对象充当例记表征（token representations）。对象被归入句法类型与语义类型；诸表征系统之间的有趣差别，则追踪句法类型与语义类型彼此关联方式上的差别。数字系统之别于他者，在于它是分立（differentiated）的，而非稠密（dense）的。当例记表征诸类之间的差异受限，以致系统的使用者总有可能判定一个例记至多属于一类时，句法分立（syntactic differentiation）的条件即告满足。当每一类型的外延——即与一类例记表征相应的指称物之类——以有限的方式区别于任何其他类型的外延，以致系统的使用者总能判定一个指称物至多属于一个外延时，语义分立（semantic differentiation）的条件即告满足。古德曼举了一个简单数字计算机的例子，一个同时满足句法与语义分立条件的系统：设想一台仪器报告投入玩具储蓄罐的一角硬币数目，罐容量为 50 枚，计数由小显示器上的阿拉伯数字报出（Goodman 1976: 159）[^goodman-1976]。此系统中，句法类型就是数字 0–50，其实例是不同时刻显示器上相应阿拉伯数字的离散显示。句法分立与语义分立两条件皆得满足，因为不同数字的实例之间的相关差异既高度受限、又足够醒目。这意味着可以预期系统使用者能读出显示，或判定显示器上例现的是哪个数字（句法分立），进而判定由此指示的是哪个数值、多少枚硬币（语义分立）。
