      定位媒介的可定制本性，很好地契合许多定位艺术家的利他目标。然而，包容性、气候保护、社会变革以及定位项目任何其他期望效果，都要求特定社区拥有足够的资金、获取渠道以及关于数字定位技术的用户知识。这一关切也可以不仅从社区要求、而且从技术要求的方面来理解，以成就成功的定位艺术。一种说法如下：
