    source: |-
      The philosophy of digital art is the philosophical study of art that crucially relies on computer processing in its production or presentation. There are many kinds of digital art, including digital cinema and video, digital photography and painting, electronic music, literary works generated by so-called “chatbots”, NFT art, net art, and video games. For the full range of digital art kinds, the aim is to identify their essential features, ground their proper appreciation, and situate our understanding of them in relation to pre-existing debates in aesthetics. This first-order inquiry cannot proceed without acknowledgment of the enormous interdisciplinary and popular interest in digital media. Claims are frequently made about fundamental shifts in the way we classify, evaluate, and engage with art now that computers seem to be involved in every kind of cultural production. The so-called “digital condition” (Kittler 1999)[^kittler-1999] is characterized by a loss of trust in the image, a new way of experiencing the world as indeterminate and fragmentary, and a breakdown of traditional boundaries between artist and audience, artwork and artistic process. If we are looking for evidence of the digital condition, we need to understand its conceptual structure. Here’s where the philosopher comes in.
    step1: |-
      数字艺术的哲学，是对其制作或呈现关键地依赖计算机处理的艺术所做的哲学研究。数字艺术种类繁多，包括数字电影与录像、数字摄影与绘画、电子音乐、由所谓“聊天机器人”生成的文学作品、NFT 艺术、网络艺术与电子游戏。面对全部数字艺术门类，其目标是辨识它们的本质特征，为其恰当欣赏奠定基础，并把我们对它们的理解置于美学中既有争论的脉络之中。这一层级的探究若不承认数字媒体所引发的巨大跨学科兴趣与大众兴趣，便无法进行。人们常常宣称，既然计算机似乎已介入每一种文化生产，我们分类、评价和介入艺术的方式便发生了根本转变。所谓“数字状况”（Kittler 1999）[^kittler-1999]的特征是：对图像的信任之失落，一种把世界经验为不确定而破碎的新方式，以及艺术家与观众、艺术作品与艺术过程之间传统界限的瓦解。如果我们要寻找数字状况的证据，就需要理解它的概念结构。这正是哲学家登场之处。
    step2: |-
      数字艺术的哲学，研究的正是那些在其制作或呈现中关键地依赖计算机处理的艺术。数字艺术门类繁多：数字电影与录像、数字摄影与绘画、电子音乐、由所谓“聊天机器人”（chatbot）生成的文学作品、NFT 艺术、网络艺术、电子游戏，皆在其列。就全部这些门类而言，其目标在于辨识各自的本质特征，为其恰当欣赏奠定根基，并把我们对它们的理解安放到美学既有争论的脉络之中。这一层级的工作，若不正视数字媒体所激起的巨大跨学科兴趣与大众兴趣，便无从着手。人们频频宣称：既然计算机似乎已渗入每一种文化生产，我们分类、评价与介入艺术的方式便已发生根本转变。所谓“数字状况”（Kittler 1999）[^kittler-1999]，其特征是信任图像之心之失落，是把世界经验为不确定而破碎之物的全新方式，以及艺术家与观众、艺术作品与艺术过程之间传统界限的瓦解。要为数字状况寻找证据，就得先理解其概念结构——哲学家正是在此登场。
  - id: 2
    kind: body
    source: |-
      Although technology-based art is viewed as the “final avant-garde of the twentieth-century” (Rush 2005)[^rush-2005], and digital art has been part of the mainstream art world since the late 1990s (Paul 2008)[^paul-2008], the philosophy of digital art is still an emerging subfield. Three seminal monographs, one on videogames (Tavinor 2009)[^tavinor-2009], one on digital cinema (Gaut 2010)[^gaut-2010], and one on computer art (Lopes 2010)[^lopes-2010], have been invaluable in laying the groundwork concerning philosophical questions about art and computer technology. Since these publications, further philosophical attention has been given to the digital arts, including the first published volume to focus on the aesthetics of videogames (see Robson & Tavinor, eds., 2018). It can be challenging for philosophers to keep up with the rapid rate at which digital technology develops. But a number of recent articles on Artificial Intelligence (AI) in the arts show that philosophers are well aware of and ready to meet this challenge (Atencia-Linares and Artiga 2022; Millière 2022; Moruzzi 2022; Roberts and Krueger 2022)[^atencia-linares-2022][^millière-2022][^moruzzi-2022][^roberts-2022]. The body of philosophical work on AI art will no doubt continue to grow, as will bodies of work on virtual reality in art and Internet art. With this growth, we can expect to to learn a great deal more about the extent and character of the digital cultural revolution.
    step1: |-
      尽管以技术为基础的艺术被视为“二十世纪的最后一场前卫”（Rush 2005）[^rush-2005]，且数字艺术自二十世纪九十年代末以来已是主流艺术世界的一部分（Paul 2008）[^paul-2008]，数字艺术的哲学仍是一个新兴的子领域。三部开创性专著——一部论电子游戏（Tavinor 2009）[^tavinor-2009]，一部论数字电影（Gaut 2010）[^gaut-2010]，一部论计算机艺术（Lopes 2010）[^lopes-2010]——在奠定艺术与计算机技术的哲学问题的基础方面功不可没。自这些出版物问世以来，学界对数字艺术的哲学关注继续增长，包括第一部聚焦电子游戏美学的出版文集（见 Robson & Tavinor 编，2018）。哲学家要跟上数字技术发展的速度殊为不易。但近期多篇论艺术中人工智能（AI）的文章表明，哲学家清楚地意识到这一挑战并准备应对它（Atencia-Linares and Artiga 2022; Millière 2022; Moruzzi 2022; Roberts and Krueger 2022）[^atencia-linares-2022][^millière-2022][^moruzzi-2022][^roberts-2022]。关于 AI 艺术的哲学作品无疑会继续增长，关于艺术中虚拟现实与互联网艺术的作品群也会如此。随着这种增长，我们可以期待对数字文化革命的广度与性质了解更多。
    step2: |-
      尽管以技术为根基的艺术被视作“二十世纪的最后一场前卫”（Rush 2005）[^rush-2005]，数字艺术也自九十年代末起便已置身主流艺术世界（Paul 2008）[^paul-2008]，数字艺术的哲学仍是一个新兴子领域。三部奠基性专著——一部论电子游戏（Tavinor 2009）[^tavinor-2009]，一部论数字电影（Gaut 2010）[^gaut-2010]，一部论计算机艺术（Lopes 2010）[^lopes-2010]——为艺术与计算机技术的种种哲学问题奠定了不可估量的根基。自三者问世以来，数字艺术获得的哲学关注持续增长，第一部聚焦电子游戏美学的出版文集亦已面世（见 Robson & Tavinor 编，2018）。数字技术日新月异，哲学家常感追赶不易；但近期论艺术中人工智能（AI）的数篇文章表明，哲学家对这一挑战了然于心，且已有备而来（Atencia-Linares and Artiga 2022; Millière 2022; Moruzzi 2022; Roberts and Krueger 2022）[^atencia-linares-2022][^millière-2022][^moruzzi-2022][^roberts-2022]。论 AI 艺术的哲学作品无疑将继续增长，论艺术中虚拟现实与互联网艺术的作品群亦然。随着增长推进，对这场数字文化革命之广度与性质的认识，可望大为加深。
