      Given the considerable effects of digital technology on artistic production, it is perhaps understandable that some commentators are inclined toward a radical overhauling of art theoretical concepts. But their arguments in support of such an overhaul are, at best, incomplete. We see this once we cite some important continuities between ways of making and thinking about art in the analog age and in the digital age. It has always been the case, for example, that “any medium can be translated into any other” (Kittler 1999: 1)[^kittler-1999]: Without using a computer, someone could manually devise a set of rules (an algorithm) for the translation of image values, say, into sounds or text. Moreover, a common storage and transmission means for (moving) imagery and sound is not unique to digital technology: As Doron Galili points out (2011), electronic image transmission going back to the late nineteenth century—in other words, precursors of the TV—relies on the conversion of both images and sound into electronic pulses.
    step1: |-
      鉴于数字技术对艺术生产的巨大影响，一些评论者倾向于对艺术理论概念作彻底翻修，这或许可以理解。但他们支持这种翻修的论证，充其量是不完备的。一旦我们举出模拟时代与数字时代在艺术制作与思考方式之间的某些重要连续性，这一点便显而易见。例如，“任何媒介都可以被翻译成任何其他媒介”（Kittler 1999: 1）[^kittler-1999]这一情况一直如此：不用计算机，人也可以手工设计一套把图像值——比如说——翻译成声音或文本的规则（算法）。此外，（运动）图像与声音的共通存储与传输手段并非数字技术所独有：正如 Doron Galili 指出的（2011），可上溯到十九世纪末的电子图像传输——换言之，电视的前身——就依赖把图像与声音都转换为电子脉冲。
