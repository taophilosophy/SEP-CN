    source: |-
      At the most basic level, the myriad transistors in a computer are essentially tiny digital schemes, each with two types: the “on” and “off” settings of the transistor-capacitor switch. The settings are discrete and distinguishable, as are their compliance classes, of 1s and 0s. The ubiquity of binary code in computer processing is a consequence of the fact that a digital computer is essentially a vast collection of on-off switches. A particular sequence of 1s and 0s realized at a particular time in virtue of the requisite arrangement of transistors is a binary instance of a particular number, interchangeable with all other instances of the same number and not interchangeable with any instances of different numbers. The difference between instances of one number and instances of other numbers is strictly limited to the difference in the ordering of 1s and 0s. In other words, Goodman’s condition of finite differentiation is clearly met. In turn, the numbers can refer to other values, including the light-intensity values of an image. A computation simply involves the generation of output strings of binary digits from input strings, in accordance with a general rule that depends on the properties of the strings (Piccinini 2008)[^piccinini-2008]. The modern (digital) computer encodes both input data and assembly languages as sequences of binary digits, or bits, and allows for the internal storage of instructions. This makes the computer essentially programmable in the sense that it can be modified to compute new functions simply by being fed an appropriate arrangement of bits.
    step1: |-
      在最基本的层面上，计算机中无数的晶体管本质上都是微小的数字图式，各自只有两个类型：晶体管-电容开关的“开”与“关”设置。这些设置是离散而可分辨的，其顺应类——1 与 0——亦然。二进制码在计算机处理中的 ubiquity，是数字计算机本质上是一大堆开关阵列这一事实的后果。凭借晶体管的必要配置而在特定时刻实现的一串特定的 1 与 0，是某个特定数的一个二进制实例，它与同一数的所有其他实例可互换，而与任何不同数的实例不可互换。一个数的实例与其他数的实例之间的差异，严格限于 1 与 0 排序上的差异。换言之，古德曼的有限分立条件显然得到满足。这些数转而又能指涉其他值，包括图像的光强值。一次计算，不过是依据一条取决于字符串性质的一般规则，从输入串生成输出二进制数字串（Piccinini 2008）[^piccinini-2008]。现代（数字）计算机把输入数据与汇编语言都编码为二进制数字即比特的序列，并允许指令的内部存储。这使计算机本质上可编程，其含义是：只需馈入适当的比特配置，就能把它改造得去计算新的函数。
