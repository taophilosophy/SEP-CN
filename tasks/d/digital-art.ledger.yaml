      - KlingKlangKlong is played with smartphones that translate the players’ locations into sound. This is achieved in a straightforward manner: By moving through the physical space, the players simultaneously move on the surface of a virtual sequencer. One dimension (usually the latitude of the player) corresponds to pitch, the other dimension (longitude) is mapped to the time-position on the sequencer. The interface allows a manual switch to other audio parameters, although this feature is experimental. Each device receives the location and state changes of the currently active players almost instantly. The devices are connected by a central server, which also sets the boundaries of the playing field and manages the virtual players.
    step1: |-
      - KlingKlangKlong 用把玩家位置转译为声音的智能手机来玩。这以直截了当的方式达成：通过在物理空间中移动，玩家同时在虚拟音序器的表面上移动。一个维度（通常是玩家的纬度）对应音高，另一个维度（经度）映射到音序器上的时间位置。界面允许手动切换到其他音频参数，尽管该功能是实验性的。每台设备几乎即时接收当前活跃玩家的位置与状态变化。设备由一个中央服务器连接，该服务器也设定演奏场地的边界并管理虚拟玩家。
    step2: |-
      - KlingKlangKlong 借智能手机游玩，手机把玩家位置译为声音。此法直截了当：玩家在物理空间中穿行，同时也在虚拟音序器的表面上移动。一个维度（通常是玩家的纬度）对应音高，另一个维度（经度）映射到音序器上的时间位置。界面容许手动切换其他音频参数，唯此功能尚属实验。每台设备几乎即时接收当前活跃玩家的位置与状态变化；设备由一台中央服务器连接，服务器并划定演奏场地之边界、管理虚拟玩家。
  - id: 82
    kind: body
    source: |-
      > KlingKlangKlong serves as an experimental arrangement to explore the idea of playful (social) systems, a construction where human and virtual subsystems play with each other. In addition to the human participants, it therefore deploys a number of virtual players (»Virtuals«). Humans and Virtuals meet each other in mixed reality, a concept that was realized in early locative games. The commonly created soundtrack is the primary medium of communication between the players. Musical structures may temporarily arise through synchronized movements or be destroyed by any player’s intervention (Straeubig & Quack 2016)[^straeubig-2016].
    step1: |-
      > KlingKlangKlong 作为一个实验性安排，用以探索带游戏性的（社会）系统的理念，一种人类子系统与虚拟子系统相互游戏的构造。因此，除人类参与者之外，它还部署若干虚拟玩家（»Virtuals«）。人与 Virtuals 在混合现实中相会，这一概念早在定位游戏的萌芽中即已实现。共同创造的配乐是玩家之间交流的首要媒介。音乐结构可以借同步运动暂时形成，也可被任何玩家的介入所破坏（Straeubig & Quack 2016）[^straeubig-2016]。
    step2: |-
      > KlingKlangKlong 作为一种实验性安排，用以探索带游戏性的（社会）系统这一理念——一种人与虚拟子系统相互嬉戏的构造。因此，除人类参与者外，它还部署若干虚拟玩家（»Virtuals«）。人与 Virtuals 在混合现实中相遇，此概念早在定位游戏的萌芽阶段即已实现。共同营造的配乐是玩家之间交流的首要媒介。音乐结构可借同步运动暂现，亦可因任一玩家的介入而崩解（Straeubig & Quack 2016）[^straeubig-2016]。
