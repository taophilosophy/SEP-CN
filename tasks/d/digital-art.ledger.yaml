      On the question of whether artworks are all the same kind of thing or many different kinds of things, ontological pluralism is often taken to be implied by the primary role of the artist in “sanctioning” features of their work (Irvin 2005, 2008; Thomasson 2010)[^irvin-2005][^irvin-2008][^thomasson-2010]. A sanction can consist simply in, say, the painting of a canvas by a self-professed artist and the subsequent display of the work in a gallery. The artist has sanctioned those features of the work that make it a traditional painting. But what was once largely implicit is now often explicit: many contemporary works of art are defined by a set of instructions for their presentation (e.g., aspect ratio, resolution). We can find plenty of examples of non-digital works that are defined by a set of instructions, such as Felix Gonzalez-Torres’ *Untitled (Portrait of Ross in L.A.)* (1991). This work is given to a gallery to display by way of nothing more than a set of instructions for constructing and maintaining a pile of candies. Whether non-digital or digital, the instructions determine what is part of the work and what is not, and whether the work is singular or multiply instantiable. As a result, the instructions guide appropriate interpretation of the work. On this view, ontology precedes interpretation: we cannot properly and fully appreciate a work, for the work that it is, without a prior determination of what it comprises. This is a matter of contention, however. On another way of thinking, artworks just are objects of interpretation, and there is no artwork whose boundaries can be identified before we begin interpretation (Davies 2004)[^davies-2004].
    step1: |-
      关于艺术作品是同一种东西还是许多不同种类的东西这一问题，本体论多元论常被认为由艺术家在“认可”其作品特征方面的首要作用所蕴含（Irvin 2005, 2008；Thomasson 2010）。认可可以仅仅在于，比如说，一位自称艺术家的人在画布上作画，随后在画廊中展示该作品。艺术家已经认可那些使作品成为传统绘画的特征。但曾经很大程度上隐含的东西如今常常是明确的：许多当代艺术作品由一套展示说明来界定（例如宽高比、分辨率）。我们可以找到大量由一套说明界定的非数字作品，例如费利克斯·冈萨雷斯-托雷斯的《无题（罗斯在洛杉矶的肖像）》（1991）。这件作品交给画廊展示，凭借的不过是一套构造与维护一堆糖果的说明。无论非数字还是数字，说明都决定什么是作品的一部分、什么不是，以及作品是单件还是可多重实例化的。因此，说明指导对作品的恰当解释。在这种观点看来，本体论先于解释：若不先确定作品由什么构成，我们就不能恰当而完整地欣赏作为该作品的作品。然而这一点仍有争议。另一种思路认为，艺术作品就是解释的对象，没有任何作品的边界能在我们开始解释之前被确定（Davies 2004）。
