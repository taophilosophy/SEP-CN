      On the question of whether artworks are all the same kind of thing or many different kinds of things, ontological pluralism is often taken to be implied by the primary role of the artist in “sanctioning” features of their work (Irvin 2005, 2008; Thomasson 2010)[^irvin-2005][^thomasson-2010]. A sanction can consist simply in, say, the painting of a canvas by a self-professed artist and the subsequent display of the work in a gallery. The artist has sanctioned those features of the work that make it a traditional painting. But what was once largely implicit is now often explicit: many contemporary works of art are defined by a set of instructions for their presentation (e.g., aspect ratio, resolution). We can find plenty of examples of non-digital works that are defined by a set of instructions, such as Felix Gonzalez-Torres’ *Untitled (Portrait of Ross in L.A.)* (1991). This work is given to a gallery to display by way of nothing more than a set of instructions for constructing and maintaining a pile of candies. Whether non-digital or digital, the instructions determine what is part of the work and what is not, and whether the work is singular or multiply instantiable. As a result, the instructions guide appropriate interpretation of the work. On this view, ontology precedes interpretation: we cannot properly and fully appreciate a work, for the work that it is, without a prior determination of what it comprises. This is a matter of contention, however. On another way of thinking, artworks just are objects of interpretation, and there is no artwork whose boundaries can be identified before we begin interpretation (Davies 2004)[^davies-2004].
    step1: TBD
    step2: TBD
