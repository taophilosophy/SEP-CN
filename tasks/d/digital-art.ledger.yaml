      Digital media can also be used for the purpose of connecting physical locations to virtual ones by using locative media. The phrase “locative art” is traced to Karlis Kalnins who applied the phrase to experimental projects coming from Locative Media Lab, a collective of international researchers and practitioners working with locative media. (Galloway & Ward 2005 )[^galloway-2005]. Since the term “locative” is connected to location, site-specificity plays a significant role in our appreciation of locative works. Unlike with non-digital cases, however, site-specificity in locative art is both physical and virtual. The general concept is this: locative-specific media connect physical spaces with virtual ones, the perceptual features of which are generated from a digital device by human interactions. We often experience locative media in our ordinary and daily lives through navigation systems like Google Maps or Waze, and also creatively through augmented reality apps like Pokemon Go, AR graffiti (an app that allows users to visualize what their graffiti will look like *in situ*), architectural simulators, and more. These are location-based works, often called locative projects or locative art, that use locative media. While locative technology has been around for decades, it is a relatively new subcategory to be recognized within the arts. Even so, locative art is more broadly acknowledged in the fields of technology, games, and sociology.
    step1: |-
      数字媒介也可以用于借助定位媒介把物理位置与虚拟位置连接起来。“定位艺术”一词可追溯到卡利斯·卡尔宁斯，他把这一说法用于定位媒介实验室的实验项目，该实验室是一个由研究者和实践者组成的国际集体，从事定位媒介工作（Galloway & Ward 2005）。由于“定位的”一词与位置相关，特定场域性在我们对定位作品的欣赏中扮演重要角色。然而，与非数字情形不同，定位艺术中的特定场域性既是物理的又是虚拟的。一般概念是这样的：定位特定媒介把物理空间与虚拟空间连接起来，后者的感知特征由数字设备通过人的交互生成。我们在日常生活中经常通过 Google Maps 或 Waze 这样的导航系统体验定位媒介，也通过 Pokemon Go、AR 涂鸦（一种让用户可视化其涂鸦在现场看起来如何的应用）、建筑模拟器等增强现实应用创造性地体验。这些都是基于位置的作品，常被称为定位项目或定位艺术，它们使用定位媒介。尽管定位技术已存在数十年，它仍是艺术界相对较新的子范畴。即便如此，定位艺术在技术、游戏与社会学领域得到更广泛的承认。
