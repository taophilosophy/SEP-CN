      ### 4.3 The ‘Third Dogma’ of Empiricism
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      Davidson’s rejection of the idea of an untranslatable language (and the associated idea, also common to many forms of conceptual relativism, of a radically different, and so ‘incommensurable’ system of belief) is part of a more general argument that he advances (notably in ‘On the Very Idea of a Conceptual Scheme’) against the so-called ‘third dogma’ of empiricism. The first two dogmas are those famously identified by Quine in ‘Two Dogmas of Empiricism’ (first published in the *Philosophical Review*, in 1951). The first is that of reductionism (the idea that, for any meaningful statement, it can be recast in the language of pure sensory experience, or, at least, in terms of a set of confirmatory instances), while the second is the analytic-synthetic distinction (the idea that, with respect to all meaningful statements, one can distinguish between statements that are true in virtue of their meaning and those that are true in virtue of both their meanings and some fact or facts about the world). The rejection of both these dogmas can be seen as an important element throughout Davidson’s thinking. The third dogma, which Davidson claims can still be discerned in Quine’s work (and so can survive the rejection even of the analytic-synthetic distinction), consists in the idea that one can distinguish within knowledge or experience between a conceptual component (the ‘conceptual scheme’) and an empirical component (the ‘empirical content’) – the former is often taken to derive from language and the later from experience, nature or some form of ‘sensory input’. While there are difficulties in even arriving at a clear formulation of this distinction (particularly so far as the nature of the relation between the two components is concerned), such a distinction depends on being able to distinguish, at some basic level, between a ‘subjective’ contribution to knowledge that comes from us and an ‘objective’ contribution that comes from the world. What the Davidsonian account of knowledge and interpretation demonstrates, however, is that no such distinction can be drawn. Attitudes are already interconnected with objects and events in the world (causally, semantically and epistemically), whilst knowledge of self and others already presupposes knowledge of the world. The very idea of a conceptual scheme is thus rejected by Davidson along with the idea of any strong form of conceptual relativism. To possess attitudes and be capable of speech is already to be capable of interpreting others and to be open to interpretation by them.
