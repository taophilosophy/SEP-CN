      ### 2.1 理由作为原因
  - id: 8
    kind: body
    source: |-
      Much of Davidson’s early work was in decision theory (see *Decision-Making: An Experimental Approach* [1957]), and it was not until the early 1960s that the work for which he is best known began to appear in print. Indeed, Davidson’s first major philosophical publication was the seminal paper ‘Actions, Reasons and Causes’ (1963). In that paper Davidson sets out to defend the view that the explanation of action by reference to reasons (something we do, for instance, when we refer to an agent’s intentions or motives in acting) is also a form of causal explanation. Indeed, he argues that reasons explain actions just inasmuch as they are the causes of those actions. This approach was in clear opposition to the Wittgensteinian orthodoxy of the time. On this latter account causal explanation was viewed as essentially a matter of showing the event to be explained as an instance of some law-like regularity (as we might explain the whistling of a kettle by reference to certain laws involving, among other things, the behaviour of gases under pressure). Since rational explanation was held, in general, not to involve any such reference to laws, but rather required showing how the action fitted into some larger pattern of rational behaviour, explanation by reference to reasons was held to be distinct from and independent of explanation by reference to causes.
    step1: |-
      戴维森早期的大量工作在决策理论领域（见《决策制定：一种实验进路》[*Decision-Making: An Experimental Approach*, 1957]）；直到二十世纪六十年代初，他最负盛名的工作才开始印行。事实上，戴维森第一部重要的哲学作品是那篇开创性的论文《行动、理由与原因》（1963）。在该文中，戴维森着力辩护这样一个论点：通过诉诸理由来解释行动（例如当我们援引一个行动者的意图或动机来解释其行动时，我们做的就是这样一件事）也是一种因果解释。他进而主张，理由之所以能解释行动，正在于它们是那些行动的原因。这一立场与当时维特根斯坦派的正统观点形成鲜明对立。按照后一种看法，因果解释在本质上就是把有待解释的事件显示为某种类定律规律性的一个实例（正如我们借助涉及受压气体行为等的定律来解释水壶的鸣响）。由于一般认为理性解释并不涉及任何此类对定律的援引，而是要求说明行动如何嵌入更大的理性行为模式之中，所以诉诸理由的解释被认为有别于且独立于诉诸原因的解释。
    step2: |-
      戴维森早期的大量工作属于决策理论（见《决策制定：一种实验进路》[*Decision-Making: An Experimental Approach*, 1957]）；直到六十年代初，他后来最负盛名的那批工作方始刊布。的确，戴维森首部重要的哲学论著就是那篇开山之作《行动、理由与原因》（1963）。文中，戴维森力主：以理由解释行动（例如当我们援引行动者的意图或动机来说明其行动时，我们所作的正是这件事）同样是一种因果解释；他甚至主张，理由之能解释行动，恰在于理由就是这些行动的原因。这一立场公然抗拒当时维特根斯坦主义的正统。依后者之见，因果解释本质上就是把待解释事件呈现为某种类定律规律性的一例（好比我们援引涉及压力之下气体行为的定律来解释水壶的啸鸣）。既然一般认为理性解释并不指涉任何这样的定律，而是要求展示行动如何嵌入更宏大的理性行为图式，诉诸理由的解释便被看作既区别于、又独立于诉诸原因的解释。
  - id: 9
    kind: body
    source: |-
      Although directed against the Wittgensteinian-inspired view that reasons cannot be causes, Davidson’s argument nevertheless effectively redeploys several Wittgensteinian ideas (see Stoutland, in Malpas 2011: 297–324, for a sympathetic, but not uncritical, examination of the Davidsonian view of action from a largely Wittgensteinian perspective)[^malpas-2011]. Two ideas play an especially significant role in the Davidsonian account – ideas that are also, in one form or another, important in Davidson’s thinking elsewhere. The first of these ideas is the notion of a ‘primary reason’ – the pairing of a belief and a desire (or ‘pro-attitude’) in the light of which an action is explained. Thus, my action of flipping the light switch can be explained by reference to my having the *belief* that flipping the switch turns on the light in combination with my having the *desire* to turn on the light (for most explanations explicit reference to both the belief and the desire is unnecessary). An action is thereby rendered intelligible through being embedded in a broader system of attitudes attributable to the agent – through being embedded, that is, in a broader framework of *rationality*. The second idea is that of action ‘under a description’ (a phrase originally appearing in G. E. M. Anscombe’s *Intention*, published in 1959). As with the concept of a primary reason, the idea here is simple enough: one and the same action is always amenable to more than one correct description. This idea is especially important, however, as it provides a means by which the same item of behaviour can be understood as intentional under some descriptions but not under others. Thus, my action of flipping the light switch can be redescribed as the act of turning on the light (under which it is intentional) and also as the act of alerting the prowler who, unbeknown to me, is lurking in the bushes outside (under which it is unintentional). Generalising this point, we can say that the same event can be referred to under quite disparate descriptions: the event of alerting the prowler is the same event as my flipping the light switch which is the same event as my moving of my body (or a part of my body) in a certain way.
    step1: |-
