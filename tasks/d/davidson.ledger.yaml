      The basic problem that radical interpretation must address is that one cannot assign meanings to a speaker’s utterances without knowing what the speaker believes, while one cannot identify beliefs without knowing what the speaker’s utterances mean. It seems that we must provide both a theory of belief and a theory of meaning at one and the same time. Davidson claims that the way to achieve this is through the application of the so-called ‘principle of charity’ (he refers to it briefly elsewhere as the principle of ‘rational accommodation’), a version of which is also to be found in Quine. In Davidson’s work this principle, which admits of various formulations and cannot be rendered in any completely precise form, often appears in terms of the injunction to optimise agreement between ourselves and those we interpret, that is, it counsels us to interpret speakers as holding true beliefs (true by our lights at least) wherever it is plausible to do (see ‘Radical Interpretation’ [1973]). In fact the principle can be seen as combining two notions: a holistic assumption of rationality in belief (‘coherence’) and an assumption of causal relatedness between beliefs, especially perceptual beliefs, and the objects of belief (‘correspondence’) (see ‘Three Varieties of Knowledge’ [1991]). The process of interpretation turns out to depend on both aspects of the principle. Attributions of belief and assignments of meaning must be consistent with one another and with the speaker’s overall behaviour; they must also be consistent with the evidence afforded by our knowledge of the speaker’s environment, since it is the worldly causes of beliefs that must, in the ‘most basic cases’, be taken to be the objects of belief (see ‘A Coherence Theory of Truth and Knowledge’ [1983]). Inasmuch as charity is taken to generate particular attributions of belief, so those attributions are, of course, always defeasible. The principle itself is not so, however, since it remains, on the Davidsonian account, a presupposition of any interpretation whatsoever. Charity is, in this respect, both a constraint and an enabling principle in all interpretation. It is more than just a heuristic device to be employed in the opening stages of interpretative engagement.
    step1: |-
      彻底解释必须处理的基本问题是：不知道说话者相信什么，我们就无法为说话者的话语指派意义；而不知道说话者的话语是什么意思，我们就无法确认其信念。看来我们必须同时提供信念理论与意义理论。戴维森主张，做到这一点的方式是运用所谓“慈善原则”（他在别处也偶尔称之为“理性顺应”原则），蒯因那里也有此原则的一个版本。在戴维森的著作中，这一原则可以有多种表述，无法以完全精确的形式给出；它常常表现为这样一条训令：在我们自己与我们所解释的对象之间最大化一致，也就是说，只要行得通，就把说话者解释为持有真信念（至少按我们的看法为真）（见《彻底解释》[1973]）。事实上，这条原则可以被看作结合了两个观念：信念理性性的整体论假定（“融贯”），以及信念——尤其是知觉信念——与信念对象之间因果关联的假定（“符合”）（见《知识的三种类型》[1991]）。解释过程看来同时依赖于这一原则的两个方面。信念归属与意义指派必须彼此一致，也必须与说话者的总体行为一致；它们还必须与我们关于说话者环境之知识所提供的证据一致，因为在“最基本的情形”中，必须把信念的世间原因当作信念的对象（见《真理与知识的融贯论》[1983]）。既然慈善原则被用来生成特定的信念归属，这些归属当然总是可挫败的。然而这条原则本身并非如此，因为按戴维森的说明，它始终是任何解释的预设。就此而言，慈善原则在一切解释中既是约束又是使能原则。它远不止是解释交往之初所使用的一种启发手段。
    step2: |-
      彻底解释必须应对的基本难题是：不知说话者所信为何，便无从为其话语指派意义；不知说话者话语何意，便无从确认其信念。看来我们必须同时给出信念理论与意义理论。戴维森主张，达成此点之途在于运用所谓“慈善原则”（他在别处亦偶称之为“理性顺应”原则）；蒯因那里也有此原则的一个版本。在戴维森的著作中，此原则可有多种表述，无法以全然精确的形式道出；它往往表现为这样一道训令：使我们自己与所解释者之间的一致最大化——也就是说，但凡说得通处，就把说话者解释为持有真信念（至少按我们的见解为真）（见《彻底解释》[1973]）。实则此原则可视为两个观念的结合：信念理性性的整体论假定（“融贯”），以及信念——尤其知觉信念——与信念对象之间因果相关性的假定（“符合”）（见《知识的三种类型》[1991]）。解释的过程看来系于此原则的两端。信念的归属与意义的指派必须彼此一致、与说话者的总体行为一致；还须同我们关于说话者环境之知识所提供的证据一致，因为在“最基本的情形”里，必须把信念的世间原因取作信念的对象（见《真理与知识的融贯论》[1983]）。既然慈善原则被用于生成特定的信念归属，这些归属当然总可挫败。然而原则本身却不然：按戴维森的说明，它始终是一切解释的预设。就此而言，慈善原则在一切解释中既是约束又是使能原则；它远不止是解释交往开局阶段所借用的权宜手段。
