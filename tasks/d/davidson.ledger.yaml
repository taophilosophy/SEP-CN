      On the face of it, anomalous monism appears a highly attractive way to think about the relation between the mental and the physical – inasmuch as it combines ‘monism’ with ‘anomalism’ so it seems to preserve what is important about physicalism while nevertheless retaining the ordinary language of so-called ‘folk-psychology’ (the language of beliefs and desires, actions and reasons). Yet anomalous monism has proved to be a highly contentious position drawing criticism from both physicalists and non-physicalists alike. The nomological conception of causality (the second of the three principles defended in ‘Mental Events’) has often been seen as something for which Davidson fails to supply any real argument (a criticism he has attempted to address in ‘Laws and Cause’ [1995]); the Davidsonian account of supervenience has been viewed as incompatible with other aspects of his position and sometimes as simply mistaken or confused (the idea of supervenience is itself the focus for what is now a very large body of discussion); and, perhaps the most serious and widespread criticism, anomalous monism has been seen as making the mental causally inert. These criticisms have not, however, gone unanswered (see especially ‘Thinking Causes’), and although Davidson modified aspects of his position over the years, he continued to hold to, and to defend, the basic theses first made explicit in ‘Mental Events’.
