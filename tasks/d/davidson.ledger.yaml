      戴维森的策略，是把意义理论的形式结构（他在塔尔斯基式真理理论中觅得的结构）嵌入一种更一般的解释理论，其大致轮廓取自蒯因《语词与对象》（*Word and Object*，1960 年初版）中的讨论。“彻底翻译”在蒯因处是对翻译事业的理想化，意在以此项事业最纯粹的形态将它呈现出来。通常，译者的任务得先行的语言知识之助——或是关于待译语言本身的知识，或是关于某种亲缘语言的知识。蒯因设想这样一种情形：对一种语言的翻译必须在毫无先行语言知识的条件下推进，唯以对说话者行为的观察，连同对引发该行为的基本知觉刺激的观察为据。戴维森对可资利用之行为证据的构想比蒯因更宽（例如他容许我们把说话者确认为对语句持“视为真”的态度），此外他还拒绝蒯因赋予简单知觉刺激的特殊地位。再者，戴维森的兴趣比蒯因更恰当地说属于语义学（蒯因把彻底翻译视作一项以认识论为主的探究之一环），而戴维森又认为单凭翻译理论不足以确保对所译语言的理解（译文所入的语言可能是我们不懂的），故在戴维森的说明里，“翻译”概念为“解释”概念所取代。彻底解释（*radical interpretation*）是对说话者语言行为的“从零开始”的解释，因而不倚赖任何关于说话者信念或其话语意义的先行知识。它意在揭示语言理解若要可能所需的知识，却不主张这种知识在解释者心灵中有何种实现（因此，对解释理论所显明的知识是否具有底层心理实在性，戴维森不作承诺）。
