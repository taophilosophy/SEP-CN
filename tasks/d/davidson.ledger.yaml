      A Tarskian truth theory defines truth using a logical apparatus that requires little more than the resources provided within first-order quantificational logic as supplemented by set theory. Moreover, it also operates to deliver a definition of truth that is purely ‘extensional’, that is, it defines truth by specifying just those instances to which the truth-predicate properly applies without any reference to ‘meanings’, ‘thoughts’ or other ‘intensional’ entities. Both these features represent important advantages for the Davidsonian approach (Davidson’s rejection of determinate meanings as having a significant role to play in a theory of meaning already involves a commitment to an extensional approach to language). However, these features also present certain problems. Davidson wishes to apply the Tarskian model as the basis for a theory of meaning for natural languages, but such languages are far richer than the well-defined formal systems to which Tarski had directed his attention. In particular natural languages contain features that seem to require resources beyond those of first-order logic or of any purely extensional analysis. Examples of such features include indirect or reported speech (‘Galileo said that the earth moves’), adverbial expressions (‘Flora swam slowly’ where ‘slowly’ modifies ‘Flora swam’) and non-indicative sentences such as imperatives (‘Eat your eggplant!’). An important part of Davidson’s work in the philosophy of language has been to show how such apparently recalcitrant features of natural language can indeed be analysed so as to make them amenable to a Tarskian treatment. In ‘On Saying That’ (1968) and ‘Quotation’ (1979b) he addresses the question of indirect speech; in ‘Moods and Performances’ (1979a) he deals with non-indicative utterances; and in ‘Adverbs of Action’ (1985a) he takes up the problem of adverbial modification. As in Davidson’s analysis of actions and events, the notion of logical form plays an important part in his approach here – the problem of how to apply a Tarskian truth theory to natural language is shown to depend on providing an analysis of the underlying logical form of natural language expressions which renders them in such a way that they fall under the scope of a purely extensional approach employing only minimal logical resources.
