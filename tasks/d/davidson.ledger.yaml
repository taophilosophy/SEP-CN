      Although the indeterminacy thesis has sometimes been a focus for objections to Davidson’s approach, it is the more basic thesis of holism as developed in its full-blown form in the account of radical interpretation (and particularly as it relates to meaning) that has often attracted the most direct and trenchant criticism. Michael Dummett has been one of the most important critics of the Davidsonian position (see especially Dummett 1975)[^dummett-1975]. Dummett argues that Davidson’s commitment to holism not only gives rise to problems concerning, for instance, how a language can be learnt (since it seems to require that one come to understand the whole of the language at one go, whereas learning is always piecemeal), but that it also restricts Davidson from being able to give what Dummett views as a properly full-blooded account of the nature of linguistic understanding (since it means that Davidson cannot provide an account that explicates the semantic in terms of the non-semantic). Criticism has also come from Jerry Fodor, amongst others, whose opposition to holism (not only in Davidson, but in Quine, Dennett and elsewhere) is largely motivated by a desire to defend the possibility of a certain scientific approach to the mind (see especially, Fodor and Lepore 1992)[^fodor-1992].
