      Davidson treats the connection between reason and action (where the reason is indeed *the* reason for the action) as a connection that obtains between two events (the agent’s believing and desiring on the one hand and her acting on the other) that can be variously described. The connection is both rational, inasmuch as the belief-desire pair (the ‘primary reason’) specifies the reason for the action, but it is also causal, inasmuch as the one event causes the other if it is indeed the reason for it. It is precisely because the reason is causally related to the action that the action can be explained by reference to the reason. Indeed, where an agent has several reasons for acting, and yet acts on the basis of one reason in particular, there is no way to pick out just that reason on which the agent acts other than by saying that it is the reason that *caused* her action.
