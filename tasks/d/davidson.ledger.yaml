      While his first position was at Queen’s College in New York, Davidson spent much of the early part of his career (1951–1967) at Stanford University. He subsequently held positions at Princeton (1967–1970), Rockefeller (1970–1976), and the University of Chicago (1976–1981). From 1981 until his death, he worked at the University of California, Berkeley. Davidson was the recipient of several awards and fellowships and was a visitor at many universities around the world. He was married three times, to the artist Virginia Davidson, from whom he was divorced but with whom he had his only child, then to the psychologist Nancy Hirschberg, who died in 1979, and finally, in 1984, to Marcia Cavell. Davidson’s posthumously published essays are edited by Cavell, and she was also an important influence on Davidson as well as drawing on Davidson’s thinking in her own work (see esp. Cavell 1993)[^cavell-1993]. For more on Davidson’s biography, including reminiscences from those who knew him, see Baghramian 2013. The Donald Davidson papers, which include course notes, professional correspondence, administrative materials, and academic writings, are held in the Bancroft Library at the University of California, Berkeley. In the late 1990s, under the auspices of the Centre for Philosophy of the Natural and Social Sciences, at the London School of Economics, Davidson participated in a series of recorded one-on-one conversations with many of the leading figures in philosophy at the time – including, among others, Quine, Nancy Cartwright, Richard Rorty, Peter Strawson, and Michael Dummett (Davidson, 1997). These recordings, now available online and elsewhere, provide valuable additional insight into both the style and content of Davidson’s thought.
    step1: |-
      戴维森的第一个职位在纽约的皇后学院，但其职业生涯的早期大部分时间（1951–1967）是在斯坦福大学度过的。其后他先后任教于普林斯顿大学（1967–1970）、洛克菲勒大学（1970–1976）与芝加哥大学（1976–1981）。自 1981 年直到去世，他都在加利福尼亚大学伯克利分校工作。戴维森获得过多项奖励与研究员职位，并曾在世界各地多所大学访学。他结过三次婚：先是艺术家 Virginia Davidson（与其离婚，但育有他唯一的孩子），继而是心理学家 Nancy Hirschberg（1979 年去世），最后是 1984 年与 Marcia Cavell 结合。戴维森身后出版的文集由 Cavell 编辑，Cavell 对戴维森亦有重要影响，同时也在自己的著作中汲取戴维森的思想（尤其见 Cavell 1993）[^cavell-1993]。关于戴维森生平的更多信息（包括相识者的追忆），见 Baghramian 2013。唐纳德·戴维森文书档案（含课程笔记、专业通信、行政材料与学术著述）藏于加利福尼亚大学伯克利分校的班克罗夫特图书馆。二十世纪九十年代末，在伦敦政治经济学院自然与社会科学哲学中心的主持下，戴维森参与了一系列一对一的录音对谈，对象多为当时哲学界的领军人物——包括蒯因、南希·卡特赖特（Nancy Cartwright）、理查德·罗蒂、彼得·斯特劳森与 Michael Dummett 等（Davidson, 1997）。这些录音如今可在线及其他渠道获得，为了解戴维森思想的风格与内容提供了宝贵的补充洞见。
    step2: |-
      戴维森的首个教职在纽约皇后学院，但其职业生涯的前期大半（1951–1967）在斯坦福大学度过；其后又先后执教于普林斯顿大学（1967–1970）、洛克菲勒大学（1970–1976）与芝加哥大学（1976–1981）。自 1981 年直至辞世，他任教于加利福尼亚大学伯克利分校。戴维森屡获奖项与研究员职位，并曾访学于世界各地多所大学。他三度成婚：先娶艺术家 Virginia Davidson（后离异，育有其唯一子嗣），续娶心理学家 Nancy Hirschberg（1979 年故去），1984 年最终与 Marcia Cavell 结缡。戴维森身后刊行的文集即由 Cavell 编定；Cavell 既深刻影响过戴维森，其本人著述亦汲取戴维森之思（尤见 Cavell 1993）[^cavell-1993]。欲知戴维森生平的更多情形——包括知情者的追怀——可参 Baghramian 2013。唐纳德·戴维森文书（含课程讲义、专业通信、行政文书与学术手稿）今藏加利福尼亚大学伯克利分校班克罗夫特图书馆。二十世纪九十年代末，在伦敦政治经济学院自然与社会科学哲学中心安排下，戴维森与时哲俊彦进行了一系列一对一录音对谈——蒯因、卡特赖特（Nancy Cartwright）、罗蒂、斯特劳森与 Michael Dummett 皆在与谈之列（Davidson, 1997）。这批录音现可于线上及其他渠道获取，为窥探戴维森思想之风骨与内容提供了宝贵的额外门径。
