    source: |-
      Donald (Herbert) Davidson was one of the most important philosophers of the latter half of the twentieth century whose reception and influence is matched, among American philosophers, perhaps only by that of his teacher, W. V. O. Quine. Davidson’s ideas, presented in a series of essays (and one posthumous monograph) from the 1960s onwards, have had an impact in a range of areas from semantic theory through to epistemology and ethics. His work exhibits a breadth of approach, as well as a unitary and systematic character, that is unusual within twentieth century analytic philosophy. Although he acknowledged an important debt to Quine, Davidson’s thought amalgamates influences from a wide range of sources within philosophy as well as outside. And whilst often developed separately, Davidson’s ideas nevertheless combine in such a way as to provide a single integrated approach to the problems of knowledge, action, language, and mind. The breadth and unity of his thought, in combination with the sometimes terse character of his prose, means that Davidson is not an easy writer to approach. Given the demanding nature of his work, it is perhaps only to be expected that it would receive a range of interpretations and assessments, and this is especially true of much of the engagement with Davidson’s thought that has developed in the last 20 years or so. In several publications, Kirk Ludwig, for instance, has advanced readings of Davidson’s philosophy, frequently in collaboration with Ernest Lepore, that although partly exegetical also take issue with many of Davidson’s claims and arguments (see e.g. Lepore and Ludwig 2005; see also the exchange between Lepore and Ludwig and Stoutland in Baghramian, 2013). This reflects a more general tendency for Davidson’s thinking to appear as a focus more often for critique than elaboration. Despite Davidson’s pre-eminence in analytic figure during the 1970s and 1980s, his influence has waned over the last decade or more and his work is now largely taken up, not in any systematic fashion, but in relation to specific issues, especially of mind and action (although this also reflects more general shifts in the configuration of current philosophical thought and practice – see Brandom, 2020: 260). Yet neither the various critiques that have been advanced nor disciplinary shifts in philosophical direction or approach should be taken to undermine the significance of Davidson’s contribution, and his work has nonetheless continued to have an influence in the work of a range of thinkers. At the same time, the re-publication of Davidson’s essays, especially those from later in his career, has disseminated his ideas to a wider, and sometimes newly appreciative audience. In addition, Davidson’s work remains an important, if sometimes contentious, point of focus for philosophical interaction between analytic and so-called ‘continental’ thought (see e.g. Malpas, 2011), and for reflection on the history and character of analytic thought as such (see, e.g, Isaac, 2013; Braver, 2017).
    step1: |-
      唐纳德·戴维森（Donald Davidson）是二十世纪后半叶最重要的哲学家之一；就其接受与影响而言，在美国哲学家中或许唯有其师 W. V. O. 蒯因（W. V. O. Quine）可与之比肩。戴维森自二十世纪六十年代以来以一系列论文（外加一部身后出版的专著）呈现的思想，对从语义理论到认识论与伦理学的诸多领域都产生了影响。他的著作展现出一种进路之广，以及二十世纪分析哲学中罕见的一贯而系统的品格。戴维森虽承认受蒯因之惠甚巨，其思想却熔铸了哲学内外众多来源的影响。这些思想虽然往往各自分别发展，但最终结合为一个整体，为知识、行动、语言与心灵诸问题提供了单一而贯通的进路。其思想既有广度又具统一性，加之文风时而简峻，这使得戴维森的著作不易读解。鉴于其工作的困难性质，它得到种种不同的解释与评价也就不足为奇；过去二十年左右围绕戴维森思想展开的大量讨论尤其如此。例如，Kirk Ludwig 在若干论著中（常与 Ernest Lepore 合作）提出了对戴维森哲学的解读，这些解读虽部分属于疏释，却也质疑戴维森的许多论断与论证（例如见 Lepore and Ludwig 2005；另见 Lepore、Ludwig 与 Stoutland 在 Baghramian 2013 中的交锋）。这反映出一种更普遍的倾向：戴维森的思想更多成为批评而非阐发的焦点。尽管戴维森在二十世纪七八十年代是分析哲学的翘楚，其影响力近十余年来已见衰退，如今人们对其著作的讨论大多不再系统进行，而是围绕具体问题展开，尤其是心灵与行动问题（尽管这也反映出当前哲学思想与实践格局的普遍变迁——见 Brandom, 2020: 260）。然而，无论是已提出的种种批评，还是哲学方向与进路上的学科变迁，都不应被用来贬低戴维森贡献的重要性；其著作仍在众多思想者的工作中持续发挥影响。与此同时，戴维森论文集（尤其是其后期论文）的再版，使其思想传播给更广泛的读者，其中一些人对之新生欣赏。此外，戴维森的著作仍然是分析哲学与所谓“欧陆”思想之间哲学互动的一个重要（尽管有时有争议）焦点（例如见 Malpas, 2011），也是对分析思想之历史与品格本身进行反思的一个焦点（见 Isaac, 2013; Braver, 2017）。
    step2: |-
      唐纳德·（赫伯特·）戴维森（Donald (Herbert) Davidson）乃二十世纪后半叶最重要的哲学家之一；就接受度与影响力而论，在美国哲学家中或许唯有其师 W. V. O. 蒯因（W. V. O. Quine）堪与比肩。戴维森自二十世纪六十年代起以一系列论文（另有一部身后出版的专著）阐发的思想，影响遍及语义理论、认识论与伦理学等诸多领域。其著作兼有进路上的广度与二十世纪分析哲学中罕见的一贯性与系统性。他虽自认受蒯因之惠极深，其思想却熔哲学内外多方影响于一炉。这些思想虽往往各自独立发展，最终却彼此结合，为知识、行动、语言与心灵诸问题提供了一条统一而贯通的进路。其思想之广博与统一，加上文笔时而简峻，使戴维森并非易与之读的作者。其著作既如此艰深，招致种种不同的解读与评骘也就势所必然；近二十年左右兴起的戴维森思想讨论尤然。例如 Kirk Ludwig 在多部论著中——常与 Ernest Lepore 合作——提出对戴维森哲学的解读，其中虽有疏释的成分，却也针对戴维森的诸多论断与论证提出异议（例如见 Lepore and Ludwig 2005；另见 Lepore、Ludwig 与 Stoutland 在 Baghramian 2013 书中的往复争论）。这折射出一种更普遍的取向：人们更多把戴维森的思想当作批评而非阐发的焦点。戴维森虽曾在二十世纪七八十年代执分析哲学之牛耳，其影响近十余年已渐式微；如今其著作大多不再被系统研究，而是被联系于具体问题加以讨论，尤以心灵与行动问题为甚（尽管这同样反映着当下哲学思想与实践格局的整体变迁——见 Brandom, 2020: 260）。然而，无论既有的诸种批评，还是哲学方向与进路之上的学科变迁，都不应被视为有损戴维森贡献之重要性；其著作仍在众多思想者的工作中持续施加影响。与此同时，戴维森论文——尤其其后期论文——的再版，使其思想传布于更广大的读者群，其中不乏对其新加激赏者。此外，戴维森的著作依旧是分析哲学与所谓“欧陆”思想之间哲学交往的一个重要（纵使时有争议）焦点（例如见 Malpas, 2011），也是对分析思想的历史与品格本身加以反思的焦点（见 Isaac, 2013; Braver, 2017）。
