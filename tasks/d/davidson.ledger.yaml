      A Davidsonian theory of meaning explicates the meanings of expressions holistically through the interconnection that obtains among expressions within the structure of the language as a whole. Consequently, although it is indeed a theory *of* meaning, a theory of the sort Davidson proposes will have no use for a concept of meaning understood as some discrete entity (whether a determinate mental state or an abstract ‘idea’) to which meaningful expressions refer. One important implication of this is that the theorems that are generated by such a theory of meaning cannot be understood as theorems that relate expressions and ‘meanings’. Instead such theorems will relate sentences to other sentences. More particularly, they will relate sentences in the language to which the theory applies (the ‘object-language’) to sentences in the language in which the theory of meaning is itself couched (the ‘meta-language’) in such a way that the latter effectively ‘give the meanings of’ or translate the former. It might be thought that the way to arrive at theorems of this sort is to take as the general form of such theorems ‘*s* means that *p*’ where *s* names an object-language sentence and *p* is a sentence in the meta-language. But this would be already to assume that we could give a formal account of the connecting phrase ‘means that’, and not only does this seem unlikely, but it also appears to assume a concept of meaning when it is precisely that concept (at least as it applies within a particular language) that the theory aims to elucidate. It is at this point that Davidson turns to the concept of truth. Truth, he argues, is a less opaque concept than that of meaning. Moreover, to specify the conditions under which a sentence is true is also a way of specifying the meaning of a sentence. Thus, rather than ‘*s* means that *p*’, Davidson proposes, as the model for theorems of an adequate theory of meaning, ‘*s* is true if and only if *p*’ (the use of the biconditional ‘if and only if’ is crucial here as it ensures the truth-functional equivalence of the sentences *s* and *p*, that is, it ensures they will have identical truth-values). The theorems of a Davidsonian theory of meaning for German couched in English would thus take the form of sentences such as “‘Schnee ist weiss’ is true if and only if snow is white.”
    step1: |-
      戴维森式意义理论通过表达式在语言整体结构中的相互关联，以整体论的方式解释表达式的意义。因此，尽管它确实是一种关于意义（*of* meaning）的理论，戴维森所提议的那类理论却无需把意义理解为某种离散实体（无论是某种确定的心理状态还是抽象的“观念”），亦即无需假定有意义的表达式指称这种实体。由此得出的一个重要推论是：这类意义理论生成的定理不能被理解为把表达式与“意义”关联起来的定理；相反，它们把语句与其他语句关联起来。更确切地说，它们把理论所适用语言（“对象语言”）中的语句，与意义理论本身所用的语言（“元语言”）中的语句关联起来，使后者实际上“给出前者的意义”或翻译前者。有人可能认为，得到这类定理的途径是把“s means that p”（s 意谓 p）当作定理的一般形式，其中 s 指称一个对象语言语句，p 是元语言中的一个语句。但这已然假定了我们能够对连接短语“means that”（意谓）给出形式说明；这不仅显得不大可能，而且似乎预设了意义概念，而理论恰恰旨在澄清这一概念（至少就其适用于特定语言而言）。正是在这一点上，戴维森转向真理概念。他论证说，真理是比意义更不晦涩的概念。此外，指明一个语句在什么条件下为真，也是指明该语句意义的一种方式。因此，戴维森不取“s means that p”，而是提议以“s is true if and only if p”（s 为真当且仅当 p）作为充分意义理论之定理的模型（此处使用双条件式“当且仅当”至关重要，因为它保证 s 与 p 两句的真值函项等值，即保证二者有相同的真值）。这样，以英语表述的德语戴维森式意义理论，其定理将取如下语句的形式：“'Schnee ist weiss' is true if and only if snow is white”（“Schnee ist weiss”为真当且仅当雪是白的）。
