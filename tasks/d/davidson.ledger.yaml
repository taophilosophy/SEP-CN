    kind: body
    source: |-
      Part of the reason for this juxtaposition, as Davidson himself surmised, was to do with his “rejection of subjectivist theories of epistemology and meaning” and his affirmation of the view that “thought itself is essentially social” (Davidson, 160). Davidson’s work, alongside that of figures such as Dewey and Heidegger, was thus explicitly drawn upon by Richard Rorty in the elaboration of his own brand of pragmatist anti-representationalism (see Rorty, 1991, i). And although Davidson did not regard himself as a pragmatist (again reflecting his resistance to easy categorisation as well as his rejection of pragmatist theories of truth), he did acknowledge convergences between his work and that of figures within the pragmatist tradition, including C.I. Lewis and G.H. Mead. Hans-Georg Gadamer appeared to feel a sense of affinity with Davidson, recommending Davidson for the Hegel Prize in 1989, writing to him in the years after, and asking Davidson to contribute to his volume in the Library of Living Philosophers (see Davidson, 2005: 261–276; Gadamer, 1997) ­– although this did not prevent the two from misreading each other in crucial ways. Davidson’s interest in psychoanalysis, partly due to the influence of Marcia Cavell, can be seen in some of his writings on irrationality and weakness of the will, and the connections between aspects of Davidsonian and Freudian thinking are explored by Cavell herself (see Cavell, 1993). Various writers have taken up connections between the work of Davidson and that of Gadamer (see e.g. essays by Braver, Dostal, Fultner, Vessey, and Malpas, in Malpas, 2011: 147–190 & 219–279; see also Keane, 2021), as well as between Davidson and Heidegger (e.g. Malpas, 1992, 2012: 199–224; Wrathall, 1999; Nulty 2006; Okrent, in Malpas, 2011: 87–112)[^nulty-2006], and Davidson and Derrida (e.g. Dasenbrock, 1993; Wheeler, 2000; Wheeler in Malpas, 2011: 29–42). The role of a form of transcendental argumentation in Davidson has also been a focus for several discussions (see e.g. Maker, 1993; Carpenter, 2003), and has sometimes figured in broader explorations of connections between Davidson and Kant (see e.g. Goldberg 2015, also Fennell, 2010, and, in relation to the question of idealism, Haddock, 2011)[^goldberg-2015]. Davidson himself acknowledged the important influence of Wittgenstein in his work (on connections between the two see Verheggen, 2017; also Stoutland, in Malpas, 2011: 297–324) as well as exploring parallels between aspects of his thinking and that of various figures within the history of philosophy, most notably, Spinoza (Davidson, 2005: 295–313; see also Van der Burg, 2007) and Plato (2005: 223–260), as well as Aristotle (Davidson, 2005: 277–294) and Hume (Davidson, 2001: 277–290), and, if very briefly, Kant (Davidson, 2001: 207). Davidson’s early studies in the history of philosophy, undertaken, at Harvard, under the influence of A. N. Whitehead, and literature (Davidson retained an abiding interest in the work of James Joyce, see Davidson, 2005: 143–157; also Dasenbrock, 2002) provide an important if largely hidden background throughout his mature thinking.
