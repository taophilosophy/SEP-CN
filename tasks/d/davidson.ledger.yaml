    source: |-
      Davidson was born on March 6th, 1917, in Springfield, Massachusetts, USA. He died suddenly, as a consequence of cardiac arrest following knee surgery, on Aug. 30, 2003, in Berkeley, California. Remaining both physically and philosophically active up until his death, Davidson left behind several important and unfinished projects including a major book on the nature of predication. The latter volume was published posthumously (see Davidson 2005b), together with two additional volumes of collected essays (Davidson 2004, 2005a), under the guidance of Marcia Cavell.
    step1: |-
      戴维森 1917 年 3 月 6 日生于美国马萨诸塞州斯普林菲尔德，2003 年 8 月 30 日因膝部手术后心脏骤停，在加利福尼亚州伯克利猝然辞世。他直至去世前都保持身体与哲学上的活跃，身后留下数项重要而未竟的规划，其中包括一部关于谓述之性质的大部头著作。后者在其指导者 Marcia Cavell 的主持下，与另两卷文集（Davidson 2004, 2005a）一道于身后出版（见 Davidson 2005b）。
    step2: |-
      戴维森 1917 年 3 月 6 日出生于美国马萨诸塞州斯普林菲尔德；2003 年 8 月 30 日，因膝部手术后心脏骤停，在加利福尼亚州伯克利猝然离世。他直到生命尽头仍身体与哲学两皆活跃，身后留下多项重要而未竟的规划，其中有一部论谓述性质的大书。该书在其遗稿指导者 Marcia Cavell 主持下与另外两卷文集（Davidson 2004, 2005a）一同于身后刊行（见 Davidson 2005b）。
  - id: 4
