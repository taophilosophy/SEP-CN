      既然此处所求的确实是一门单一的复合理论，那么这类理论的充分性就必须以其是否确实就我们所能获得的全部行为证据（连同我们自己关于世界的信念）给出统一图景来衡量，而非以任何单项行为为准。这可以看作同一要求的一个更一般版本——就形式意义理论而言，这一要求是：语言的意义理论必须顾及该语言的全部话语；不过在彻底解释的语境里，还须把这一要求理解为紧密关联于对总体理性性之规范性考量的关注。这一整体论进路的一个直接后果是：对于任何特定的证据总体，总会有不止一种充分的解释理论——诸理论可以在特定的信念归属或意义指派上彼此不同，却同时对说话者的总体行为给出同样令人满意的说明。戴维森把这种唯一性的缺席称作解释的“非确定性”；它与蒯因处同样出现的“翻译的非确定性”互为对应（唯后者适用面较窄）。按戴维森的说明，这种非确定性常被忽视，而且在戴维森那里确乎比在蒯因那里为小（部分因为戴维森对塔尔斯基的采用，以及随之而来的必要：把一阶逻辑的结构读入被解释的语言）。尽管如此，它仍是一切解释不可消除的特征。再者，这种非确定性不应仅仅被看作反映了某种关于解释的认识论局限，而应被看作源于意义与信念的整体论品格：这类概念把我们引向说话者行为中的总体模式，而非引向解释必须设法通达的离散实体。诚然，这类整体论不仅适用于意义与信念，也适用于一般所谓的“命题态度”。命题态度最简明的刻画是：可借提及一个命题而规定的态度（相信晚饭有茄子，就是把“晚饭有茄子”这一命题视为真；想要晚饭有茄子，就是希望“晚饭有茄子”为真），故此类态度的内容总是命题性的。于是，戴维森式整体论既适用于意义，也适用于态度，从而也适用于态度之内容。的确，我们可以说戴维森的解释说明给出了关于心理内容如何被决定的相当一般的说明（此种内容被理解为信念等命题性心理状态的内容）：其决定凭借说话者与世间对象之间的因果关系，凭借说话者行为的理性整合。于是，正如戴维森的意义理论进路终究蕴含着一门更一般的解释理论，他关于意义的整体论观点也蕴含着一种关于心理、从而关于心理内容之整体的观点。
