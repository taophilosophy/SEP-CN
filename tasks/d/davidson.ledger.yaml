      Davidson’s accounts of action and of mind call upon a well-developed set of analyses concerning psychological concepts such as belief, desire and intention – concepts whose analysis is taken further in a number of papers that follow on from, and develop or modify, the ideas first set out in ‘Actions, Reasons and Causes’ (papers such as ‘Agency’ (1971) and ‘Intending’ [1978a]) as well as in Davidson’s discussions of epistemological and semantic issues (see below). But Davidson ‘s work in this area is also dependent on his account of the notions of cause, event, and law and, in particular, on his defence of the view that events are particulars and so constitute a fundamental ontological category. If events are indeed particulars, then an important question concerns the conditions of identity for events. In ‘The Individuation of Events’ [1969a] Davidson argues that events are identical if and only if they have identical causes and effects. In ‘Reply to Quine on Events’ [1985b] he abandons this criterion in favour of the Quinean suggestion that events are identical if and only if they occupy exactly the same location in space and time.
