      Davidson’s thinking about semantic theory develops on the basis of a holistic conception of linguistic understanding (see ‘Truth and Meaning’ [1967c]). Providing a theory of meaning for a language is thus a matter of developing a theory that will enable us to generate, for every actual and potential sentence of the language in question, a theorem that specifies what each sentence means. On this basis a theory of meaning for German that was given in English might be expected to generate theorems that would explicate the German sentence ‘Schnee ist weiss’ as meaning that snow is white. Since the number of potential sentences in any natural language is infinite, a theory of meaning for a language that is to be of use to creatures with finite powers such as ourselves, must be a theory that can generate an infinity of theorems (one for each sentence) on the basis of a finite set of axioms. Indeed, any language that is to be learnable by creatures such as ourselves must possess a structure that is amenable to such an approach. Consequently, the commitment to *holism* also entails a commitment to a *compositional* approach according to which the meanings of sentences are seen to depend upon the meanings of their parts, that is, upon the meanings of the words that form the finite base of the language and out of which sentences are composed. Compositionality does not compromise holism, since not only does it follow from it, but, on the Davidsonian approach, it is only as they play a role in whole sentences that individual words can be viewed as meaningful. It is sentences, and not words, that are thus the primary focus for a Davidsonian theory of meaning. Developing a theory for a language is a matter of developing a systematic account of the finite structure of the language that enables the user of the theory to understand any and every sentence of the language.
