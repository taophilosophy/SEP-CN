      The more developed argument for this latter claim, and for the more general position in the philosophy of mind, of which it forms a part, appears at several places in Davidson’s work. The first and best-known presentation is that of ‘Mental Events’ (1970b) in which Davidson argues for the compatibility of three principles (all three of which are adumbrated in various ways in the argument of ‘Actions, Reasons and Causes’): (i) that at least some mental events interact causally with physical events – *The Principle of Causal Interaction*; (ii) that events related as cause and effect fall under strict laws (that is, laws that are ‘precise, explicit and as exceptionless as possible’) – *The Principle of the Nomological Character of Causality*; and (iii) that there are no strict laws (as opposed to mere generalisations) relating mental and physical events – *The Anomalism of the Mental*. Of these principles the first two would ordinarily be held to be incompatible with the third, and to imply, not the ‘anomalism’ of the mental, but rather, in the case of mental and physical events related as cause and effect, the existence of strict laws relating those events. To argue, as does Davidson, for the compatibility of the original principles is thus also to argue for the truth of the third, that is, for the truth of anomalous monism.
    step1: |-
      对于这后一论断，以及对于心灵哲学中它所从属的那个更一般的立场，戴维森在其著作的多处给出了更为展开的论证。最早也最广为人知的表述见于《心理事件》（1970b），其中戴维森论证三条原则的相容性（这三条原则都在《行动、理由与原因》的论证中以不同方式初具轮廓）：（i）至少某些心理事件与物理事件发生因果交互——即因果交互原则；（ii）作为原因与结果而关联的事件落于严格定律之下（即“精确、明晰且尽可能无例外的”定律）——即因果性的法则性特征原则；（iii）没有任何严格定律（有别于单纯的概括）关联心理事件与物理事件——即心理的变异性。通常认为，这三条原则中前两条与第三条不相容，而且（就作为原因与结果相关联的心理事件与物理事件而言）它们所蕴含的不是心理的“变异性”，而是关联那些事件的严格定律之存在。像戴维森那样论证原有诸原则的相容性，因此也就等于论证第三条原则为真，即论证变异一元论为真。
