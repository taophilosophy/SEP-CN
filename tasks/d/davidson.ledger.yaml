      戴维森式解释理论的心脏当然是一种塔尔斯基式真理理论。但真理理论只提供语言解释所依凭的形式结构：这门理论还须嵌入一个更广的进路，后者着眼于话语、其他行为与态度之间的互联；此外，将这门理论用于实际语言行为时，还须顾及此类行为动态流变的品格。后一点易被忽视，却使戴维森得出若干重要结论。日常言语充满不合语法的结构（说话者本人甚至可能承认其不合语法）、残缺的句子或短语、隐喻、新造词、玩笑、双关，以及种种无法单凭将一门现成的语言理论应用于话语便可应付的现象。于是，语言理解不可能仅是把一门类似塔尔斯基的理论机械地付诸应用（尽管人们可能把戴维森的早期论文读成恰是如此主张）。在《墓志铭的巧妙错乱》（1986）等论文里，戴维森处理的正是这一点：他论证说，语言理解固然依赖于对语言形式结构的把握，但该结构总是需要依照实际语言行为加以修订。理解一门语言，就是不断按照有待解释的话语调整解释性预设（此类预设往往并不显明）。进而，这还须调用一些并非专属语言的技能与知识（想象力、对他人态度与行为的留意、关于世界的知识），它们属于一种更一般的能力——在世间安身立命、与他人相与的能力——之一部，而这种能力同样抗拒任何形式刻画。在《墓志铭的巧妙错乱》中，戴维森以挑衅的口吻道出此点：他声称“没有所谓语言这回事”（并立即补上限定：“倘若语言像许多哲学家与语言学家所设想的那样”）。说得缓和些，要害在于：语言约定（尤其是那种以共享句法与语义规则之使用上的合意为形式的语言约定）纵或有益于理解，却不能构成理解的基础。
