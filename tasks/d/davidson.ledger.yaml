      戴维森式意义理论以整体论的方式解释表达式的意义：它诉诸各表达式在语言整体结构中的相互关联。因此，尽管它确乎是一种关于意义的理论，戴维森所提的那类理论却用不着把意义当作某种离散实体（无论它是确定的心理状态还是抽象的“观念”），仿佛有意义的表达式指称着这种实体。由此而来的一个重要推论是：这种意义理论所生成的定理，不可理解为把表达式与“意义”系联起来的定理；毋宁说，它们把语句与其他语句系联起来。更确切地说，它们把理论所适用语言（“对象语言”）中的语句，同意义理论自身借以表述的语言（“元语言”）中的语句系联起来，使后者实际上“给出前者的意义”，亦即翻译前者。或许有人以为，要得到这类定理，可以把“s 意谓 p”（*s* means that *p*）取作其一般形式，其中 *s* 指称一个对象语言语句，*p* 为元语言中的一个语句。然而这已经预设我们能对连接短语“意谓”（means that）给出形式说明；此事看似无望，而且这般做法似乎预设了意义概念——而理论恰恰志在澄清这一概念（至少就其用于特定语言而言）。正是在此处，戴维森转向真理概念。他论证道：真理是比意义更不晦涩的概念。再者，指明一个语句在何种条件下为真，同时也是指明该语句意义的一途。故此，戴维森不取“s 意谓 p”，而以“s 为真，当且仅当 p”（*s* is true if and only if *p*）作为充分意义理论之定理的范型（双条件式“当且仅当”在此至关重要：它保证语句 *s* 与 *p* 真值函项等值，亦即保证二者真值相同）。于是，一部以英语表述的德语戴维森式意义理论，其定理将取诸如下列语句的形式：“'Schnee ist weiss' is true if and only if snow is white.”（“Schnee ist weiss”为真，当且仅当雪是白的。）
