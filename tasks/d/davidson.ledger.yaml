      One of the great advantages of this proposal is that it enables Davidson to connect his account of a theory of meaning with an already existing approach to the theory of truth, namely that developed by Alfred Tarski (in his seminal work ‘The Concept of Truth in Formalised Languages’, first published in Polish in 1933 and in English translation in 1956). Tarski’s theory of truth was originally intended, not as a general account of the nature of truth, but rather as a way of defining the truth-predicate as it applies within a formal language. Tarski suggests that we arrive at a formal definition of the predicate ‘is true’ by providing, for every sentence *s* in the object language, a matching sentence *p* in the meta-language that is a translation of *s* (here, in his use of the idea of translational synonymy, Tarski relies upon the concept of meaning in order to get at a theory of truth – Davidson reverses this approach). The resulting ‘T-sentences’ will have the form ‘*s* is true in language *L* if and only if *p*’. That an adequate theory should indeed be capable of generating a T-sentence for every sentence in the object-language is the essence of Tarski’s ‘Convention T’ – a requirement that clearly matches the holistic requirement Davidson also specifies for an adequate theory of meaning. And just as a Davidsonian theory of meaning treats the meaning of whole sentences as dependent on the components of those sentences, so a Tarskian theory of truth also operates *recursively* by means of the technical notion of *satisfaction* – a notion that stands to open sentences (expressions containing unbound variables) as does truth to closed sentences (expressions that contain no variables other than bound variables) – such that the satisfaction conditions of more complex sentences are seen to depend on the satisfaction conditions of simpler sentences.
    step1: |-
      这一提议的一大优点在于，它使戴维森能够把他的意义理论说明与一种已有的真理理论进路——即 Alfred Tarski 所发展的进路（见其开创性著作《形式化语言中的真理概念》，1933 年以波兰文初版，1956 年出英译）——联系起来。塔尔斯基的真理理论，其本意并非对真理之性质的一般说明，而是对真理谓词在形式语言中之适用的一种定义方式。塔尔斯基提出，我们通过为对象语言中的每个语句 s 提供元语言中一个与之匹配且为 s 之翻译的语句 p，来得到谓词“为真”的形式定义（在此，塔尔斯基借助翻译同义的观念，依赖意义概念来通达真理理论——戴维森则把这一进路反转过来）。由此得到的“T 句”具有“s 在语言 L 中为真当且仅当 p”的形式。一个充分的理论确实能为对象语言中的每个语句生成一条 T 句——这正是塔尔斯基“T 约定”的实质；这一要求显然与戴维森为充分意义理论同样规定的整体论要求相合。正如戴维森式意义理论把整句的意义看作依赖于语句的组成部分，塔尔斯基式真理理论也借助“满足”这一技术概念递归地运作——满足之于开语句（含未约束变元的表达式），犹如真理之于闭语句（除约束变元外不含其他变元的表达式）——从而较复杂语句的满足条件被看作依赖于较简单语句的满足条件。
