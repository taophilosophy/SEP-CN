      If we assume that the speaker’s beliefs, at least in the simplest and most basic cases, are largely in agreement with our own, and so, by our account, are largely true, then we can use our own beliefs about the world as a guide to the speaker’s beliefs. And, provided that we can identify simple assertoric utterances on the part of a speaker (that is, provided we can identify the attitude of holding true), then the interconnection between belief and meaning enables us to use our *beliefs* as a guide to the *meanings* of the speaker’s utterances, thereby providing the basis for both a rudimentary theory of belief and a rudimentary account of meaning. So, for example, when the speaker with whom we are engaged uses a certain sequence of sounds repeatedly in the presence of what we believe to be a rabbit, we can, as a preliminary hypothesis, interpret those sounds as utterances about rabbits or about some particular rabbit. Once we have arrived at a preliminary assignment of meanings for a significant body of utterances, we can test our assignments against further linguistic behaviour on the part of the speaker, modifying those assignments in accordance with the results. Using our developing theory of meaning we are then able to test the initial attributions of belief that were generated through the application of charity, and, where necessary, modify those attributions also. This enables us, in turn, to further adjust our assignments of meaning, which enables further adjustment in the attribution of beliefs, … and so the process continues until some sort of equilibrium is reached. The development of a more finely tuned theory of belief thus allows us to better adjust our theory of meaning, while the adjustment of our theory of meaning in turn enables us to better tune our theory of belief. Through balancing attributions of belief against assignments of meaning, we are able to move towards an overall theory of behaviour for a speaker or speakers that combines both a theory of meaning and of belief within a single theory of interpretation.
