      Although Davidson wrote on a wide range of topics, a great deal of his work, particularly during the late 1960s and early 1970s, is focussed on the problem of developing an approach to the theory of meaning that would be adequate to natural language. The characteristic feature of Davidson’s approach to this problem is his proposal that meaning is best understood via the concept of truth, and, more particularly, that the basic structure for any adequate theory of meaning is that given in a formal theory of truth.
