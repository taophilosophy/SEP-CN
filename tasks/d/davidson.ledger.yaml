      Whilst Davidson’s work was at the centre of many analytic discussions during the 1970s and 1980s, it was also increasingly juxtaposed, from the mid-1980s onwards, with ideas and approaches from outside of the analytic mainstream –­ often to his own bemusement. “What am I doing here?” asks Davidson in his catalogue essay for the 1992 Robert Morris exhibition. “Blind Time Drawings IV: Drawing with Davidson”, and he goes on: “Nothing has surprised me more than to discover myself anthologized in books with titles such as *Post-Analytic Philosophy* or *After Philosophy*” (Davidson, 160; see Rajchman and West, 1985; Baynes, Bohman, McCarthy, 1987; Dasenbrock, 1993).
    step1: TBD
