      The way in which the Davidsonian rejection of scepticism does indeed derive quite directly from Davidson’s adoption of a holistic, externalist approach to knowledge, and to attitudinal content in general, has sometimes been obscured by Davidson’s presentation of his argument against scepticism through the employment (for the first time in ‘Thought and Talk’[1975]) of the rather problematic notion of an ‘omniscient interpreter’ (the idea echoes one deployed by Wilfrid Sellars in an essay with which Davidson was certainly familiar [Sellars, 1948]). Such an interpreter would attribute beliefs to others and assign meanings to their utterances but would nevertheless do so on the basis of her own (true) beliefs. The omniscient interpreter would therefore have to find a large amount of agreement between her own beliefs and the beliefs of those she interprets, and what was agreed would also, by hypothesis, be true. Like the Swampman example, however, the omniscient interpreter example has given rise to a number of complications and misunderstandings (so much so that Davidson has expressed regret at ever having deployed those examples in the first place), and although the omniscient interpreter appears at several places in Davidson’s writings, the idea disappears from his later discussions, and does not play a crucial role in his thinking.
