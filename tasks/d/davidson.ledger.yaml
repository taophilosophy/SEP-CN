      Davidson’s commitment to the indeterminacy that follows from his holistic approach has led some to view his position as involving a form of anti-realism about the mind and about beliefs, desires and so forth. Davidson argues, however, that the indeterminacy of interpretation should be understood analogously with the indeterminacy that attaches to measurement. Such theories assign numerical values to objects on the basis of empirically observable phenomena and in accordance with certain formal theoretical constraints. Where there exist different theories that address the same phenomena, each theory may assign different numerical values to the objects at issue (as do Celsius and Fahrenheit in the measurement of temperature), and yet there need be no difference in the empirical adequacy of those theories, since what is significant is the overall pattern of assignments rather than the value assigned in any particular case. Similarly in interpretation, it is the overall pattern that a theory finds in behaviour that is significant and that remains invariant between different, but equally adequate, theories. An account of meaning for a language is an account of just this pattern.
