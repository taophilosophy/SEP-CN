      The normative implications of anthropological reflection about life and history also led Dilthey to address the value of worldviews. Just as the nature of universal history forces us to conceive of history as more than a human science, so worldviews are more broadly based attempts at acquiring a unified perspective on life. The sciences are by their nature partial and cannot provide a comprehensive worldview. A worldview attempts to provide not only a cognitive picture of the world, but also an estimation of what in life is valuable and worth preserving, and finally how we can strive to improve reality. Worldviews have been developed in literary, religious and philosophical works. Philosophers have produced metaphysical formulations of worldviews that attempt to give them a universal conceptual determinacy. Dilthey analyzes three recurrent types of such metaphysical formulations: naturalism, the idealism of freedom, and objective idealism. The naturalism of Democritus, Hobbes and others derives everything from what can be cognized and is pluralistic in structure; idealism of freedom as found in Plato, Kant, and others insists on the sovereignty of the will and is dualistic; objective idealism as found in Heraclitus, Leibniz and Hegel affirms reality as the embodiment of a harmonious set of values and can be considered monistic. The three types of metaphysical worldviews are incommensurable in that each sets its priorities differently. Dilthey finds naturalism too reductive; his ethical views incline him toward the idealism of freedom; aesthetically he felt attracted towards objective idealism. No metaphysical formulation can have more than relative validity because it attempts to arrive at a totalization that transcends experience. Literary and poetic expressions of worldviews tend to be more successful because they do not claim to be totalizing. All that is humanly possible is to probe reality on the basis of life-experience and to settle for more limited philosophical insights informed by historical understanding. Ultimately, our reflective understanding of life and history must remain determinate-indeterminate.
    step1: |-
      关于生命与历史的人类学反思的规范意涵，也引导狄尔泰讨论世界观的诸价值。正如普遍历史的本性迫使我们把历史构想为不止一门精神科学，世界观也是更广泛基础的、获得统一生活视角的尝试。诸科学按其本性是部分的，无法提供全面的世界观。一个世界观不仅试图提供世界的认知图景，还试图估计生活中何者有价值、值得保存，以及我们如何能努力改善实在。世界观已在文学、宗教与哲学著作中得到发展。哲学家们产出世界观的形而上学表述，试图赋予它们普遍的概念规定性。狄尔泰分析了这类形而上学表述的三种反复出现的类型：自然主义、自由的观念论与客观观念论。德谟克里特、霍布斯等人的自然主义从可认识者推导一切，在结构上是多元论的；柏拉图、康德等人的自由观念论坚持意志的主权，是二元论的；赫拉克利特、莱布尼茨与黑格尔的客观观念论肯定实在是和谐价值集合的体现，可以被视为一元论的。这三种形而上学世界观的类型不可通约，因为各自设定不同的优先次序。狄尔泰认为自然主义过于还原；他的伦理观点使他倾向于自由观念论；在美学上他感到被客观观念论吸引。没有一种形而上学表述能有超过相对的有效性，因为它试图达成一个超越经验的总体化。世界观的文学与诗的表达往往更成功，因为它们不声称总体化。人类可能的至多是在生命经验的基础上探查实在，并满足于由历史理解所启发的更有限的哲学洞见。最终，我们对生命与历史的反思性理解必须保持确定—不确定。
