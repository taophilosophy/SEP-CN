      So far Dilthey has argued for a relative independence of the human sciences *vis-à-vis* the better established natural sciences. However, from the transcendental perspective that considers the conditions our consciousness brings to experience, the human sciences must claim a reflective priority. The realization that the human sciences not only ascertain what is—as do the natural sciences—but also make value judgments, establish goals and prescribe rules, discloses that they are much more directly related to the full reality of lived experience. The Kantian I-think that is the basis of the conceptual cognition (*Erkenntnis*) of the natural sciences really derives from a direct knowing (*Wissen*) rooted in Dilthey’s more inclusive thinking-feeling-willing of lived experience (see 1883/SW.I, 228, and ca. 1880–93/SW.I, 263–68). The natural sciences merely construct a phenomenal or ideal world that abstracts from the real nexus of lived experience. The world that is formed by the human sciences is the historical-social reality in which human beings participate. It is a real world that is directly possessed or present in what Dilthey calls *Innewerden*. This term has sometimes been translated as “inner awareness,” but is is better to translate it as “reflexive awareness” to indicate how things are there-for-us. Reflexive awareness is a pre-reflective, indexical mode of consciousness that “does not place a content over against the subject of consciousness (it does not re-present it)” (ca. 1880–93/SW.I, 253). It is the direct know-how that reality is present-for-me prior to any of the reflective act-content, inner-outer, or subject-object distinctions that characterize the representational world of conceptual cognition.
    step1: 至此，狄尔泰一直论证精神科学相对于更成熟的自然科学具有相对独立性。然而，从考虑我们的意识带给经验的诸条件的先验视角来看，精神科学必须主张一种反思的优先性。认识到精神科学不仅像自然科学那样确认所是者，而且还作出价值判断、设立目标与规定规则，这就揭示出它们与体验的全部实在直接相关得多。作为自然科学概念性认识（*Erkenntnis*）之基础的康德式我思，实际上源自一种直接的知（*Wissen*），它植根于狄尔泰更包容的体验的思—感—愿之中（见 1883/SW.I, 228，以及 ca. 1880–93/SW.I, 263–68）。自然科学仅仅构造一个从体验的实在联系中抽象出来的现象或观念世界。精神科学所形成的世界则是人参与其中的历史—社会实在。它是一个在狄尔泰所谓 *Innewerden*（内觉）中被直接拥有或当下在场的实在世界。这个术语有时被译为“内在觉察”，但最好译为“反思性觉察”，以指示事物如何对我们在此在场。反思性觉察是一种前反思的、指示性的意识样式，它“不把一个内容置于意识的主体对面（它不再现它）”（ca. 1880–93/SW.I, 253）。它是实在在我面前直接在场的直接知道如何，先于概念性认识的表象世界所特有的任何反思性的行为—内容、内—外或主体—对象区分。
    step2: 至此为止，狄尔泰论证的是精神科学相对于更成熟的自然科学的相对独立性。然而，从考虑意识带给经验之诸条件的先验视角看，精神科学必须主张一种反思的优先性。精神科学不仅像自然科学那样确认所是者，还作出价值判断、设立目标、规定规则，认识到这一点即可看出：它与体验的全部实在直接相关得多。作为自然科学概念性认识（*Erkenntnis*）之基础的康德式我思，实际源自一种直接的知（*Wissen*），它植根于狄尔泰更包容的体验的思—感—愿（thinking-feeling-willing）之中（见 1883/SW.I, 228，及 ca. 1880–93/SW.I, 263–68）。自然科学只是构造一个从体验之实在联系中抽象出来的现象或观念世界；精神科学所形成的世界，则是人参与其中的历史—社会实在，一个在狄尔泰所谓 *Innewerden*（内觉）之中被直接拥有、当下在场的实在世界。这个词有时被译作“内在觉察”，但更好的译法是“反思性觉察”，以指示事物如何在我们面前到场。反思性觉察是一种前反思的、指示性的意识样式，它“不把一个内容置于意识主体的对面（它不再现它）”（ca. 1880–93/SW.I, 253）。它是“实在在我面前在场”这一直接的知道如何，先于概念性认识之表象世界所特有的种种反思性区分：行为—内容、内—外、主体—对象。
