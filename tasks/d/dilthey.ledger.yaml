      In the preface to the *Introduction to the Human Sciences*, Dilthey refers to his project as a Critique of Historical Reason. We can now see that this is first of all a critique of the metaphysical thesis that there can be an overarching “universal explanatory framework for all historical facts” (1883/SW.I, 141). If universal explanations are to be possible for history as well as for nature, then we must recognize that they are only possible for correlating partial contents of reality. The reason that the natural sciences have been so successful in discovering causal laws of nature is that they abstract from the full scope of the external world.
    step1: 在《精神科学引论》的序言中，狄尔泰把他的规划称为历史理性批判。我们现在可以看到，这首先是对这样一个形而上学论题的批判：可以有一个统摄“一切历史事实的普遍说明框架”（1883/SW.I, 141）。如果普遍说明对历史与对自然都要可能，那么我们必须认识到，它们只在关联实在的部分内容时才可能。自然科学在发现自然因果规律方面如此成功，原因在于它们从外部世界的全部范围中抽象出来。
    step2: 在《精神科学引论》序言中，狄尔泰称自己的规划为历史理性批判。如今可以看出，这首先是对如下形而上学论题的批判：能够存在一个统摄“一切历史事实的普遍说明框架”（1883/SW.I, 141）。普遍说明若要对历史与自然同样可能，就必须认识到：它只在把实在的部分内容相互关联时才可能。自然科学之所以在发现自然因果规律上如此成功，正因为它从外部世界的全部范围中抽身而出。
