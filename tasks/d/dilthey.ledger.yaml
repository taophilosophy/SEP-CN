      Carnap acknowledges the independent nature of spiritual (*geistigen*) or intersubjective objects such as political states and social customs. They differ from psychical and physical objects in that they can “survive” even as the original subjects that generated them “perish and other subjects take their place” (Carnap 1928: 23)[^carnap-1928]. It is not clear why Dilthey’s reflective analysis of the distinctive methods of the various sciences and his empirical approach to lived experience did not earn him more serious consideration by the Vienna Circle as a whole and other analytically oriented philosophers. But what is evident is that his theory of understanding (*Verstehen*) came to be widely misinterpreted as a kind of empathy. Although Dilthey had sharply differentiated between understanding as a judgmental process and empathy as a mere feeling, Carnap suggested that the understanding of others is an intuitive act that involves a measure of empathy, but which can be cognitively vetted in part through the analysis of objective manifestations ranging from gestures, linguistic expressions to practical actions (Carnap 1928: 55, 143)[^carnap-1928]. This suggestion by Carnap may have negatively influenced subsequent discussions of Dilthey’s theory of *Verstehen* by analytic philosophers, leading Theodor Abel, Ernest Nagel, and Arthur Danto to go even further by reducing it to “empathic identification.” Later Danto recognized that this is not the case and acknowledged that “*Verstehen* is a very brilliant notion, utterly misconceived heretofore by crass philosophical critics, myself included” (Danto 1970: 215)[^danto-1970]. *Verstehen* is not some immediate projection of ourselves into others, but stands for a deliberate process that finds the proper context to relate others and their objectifications to what is already familiar to us. It is a reflective mode of inquiry that provides the framework for more specific explanations, whether causal or rational.
    step1: |-
      卡尔纳普承认精神的（*geistigen*）或主体间的对象（如政治国家与社会习俗）的独立本性。它们不同于心理对象与物理对象之处在于，即便生成了它们的原初主体“消逝而其他主体取而代之”，它们也能“存续”（Carnap 1928: 23）[^carnap-1928]。为什么狄尔泰对各门科学独特方法的反思分析及其对体验的经验进路，没有为他赢得维也纳学派整体以及其他分析取向哲学家更认真的考虑，这一点并不清楚。但显而易见的是，他的理解（*Verstehen*）理论后来被广泛误解为一种共情。虽然狄尔泰曾把作为判断过程的理解与作为单纯感受的共情截然区分，卡尔纳普却暗示对他人的理解是一种直觉行为，包含一定程度的共情，但它可以通过对从姿态、语言表达到实际行动的诸客观显现的分析而在一定程度上得到认知审查（Carnap 1928: 55, 143）[^carnap-1928]。卡尔纳普的这一暗示可能对分析哲学家后来关于狄尔泰 *Verstehen* 理论的讨论产生了负面影响，导致西奥多·阿贝尔、欧内斯特·内格尔与阿瑟·丹托更进一步，把它还原为“共情性认同”。后来丹托认识到情况并非如此，并承认“*Verstehen* 是一个极为出色的概念，此前被粗糙的哲学批评家全然误解，包括我自己在内”（Danto 1970: 215）[^danto-1970]。*Verstehen* 不是把我们自己向他人的某种直接投射，而代表一个深思熟虑的过程，它找到恰当的语境，把他人及其客观化与我们已然熟悉的东西关联起来。它是一种反思性的探究样式，为更具体的说明提供框架，无论这说明是因果的还是理性的。
    step2: |-
      卡尔纳普承认精神的（*geistigen*）或主体间的对象（如政治国家与社会习俗）具有独立的本性。它们不同于心理与物理对象之处在于：即便生成它们的原初主体“消逝、其他主体取而代之”，它们也能“存续”（Carnap 1928: 23）[^carnap-1928]。狄尔泰对各门科学独特方法的反思分析、他对体验的经验进路，何以未能为他赢得维也纳学派整体以及其他分析取向哲学家更认真的对待？这并不清楚。但显而易见：他的理解（*Verstehen*）理论后来被广泛误读为一种共情。狄尔泰本已把作为判断过程的理解与作为单纯感受的共情截然两分；卡尔纳普却暗示，对他人的理解是一种直觉行为，含一定程度的共情，但可通过对姿态、语言表达乃至实际行动这类客观显现的分析，在部分上得到认知审查（Carnap 1928: 55, 143）[^carnap-1928]。卡尔纳普的这一暗示，可能对分析哲学家后来关于狄尔泰 *Verstehen* 理论的讨论产生了负面影响：西奥多·阿贝尔、欧内斯特·内格尔与阿瑟·丹托变本加厉，把它还原为“共情性认同”。后来丹托认识到实情并非如此，并承认“*Verstehen* 是一个极为出色的概念，此前被粗糙的哲学批评家全然误解，我自己也在其列”（Danto 1970: 215）[^danto-1970]。*Verstehen* 并非把我们自己直接投射到他人身上，而代表一个审慎的过程：它找到恰当的语境，把他人及其客观化与我们已然熟悉者关联起来。它是一种反思性探究样式，为更具体的说明（无论因果抑或理性）提供框架。
