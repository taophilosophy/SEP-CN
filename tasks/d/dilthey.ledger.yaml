      A further task of Dilthey’s descriptive and analytic psychology is to show how the development of the psychic nexus produces the individuation of human life. Individuality is not conceived in terms of unique qualities that we are endowed with, but as something that each of us acquires historically. It is embodied in what was referred to earlier as a subject’s acquired psychic nexus and is only gradually articulated. Even when people share the same qualities their relative intensity will differ. Sometimes qualities are present to such a small extent as to be, in effect, unnoticeable. Prominent qualities, however, tend to reinforce certain related qualities and suppress others. Each individual can thus be understood as a structural configuration of a set of dominant qualities in tension with some subordinate qualities. This tension may be unresolved for a long time until finally some articulation or *Gestalt* is reached that defines a person’s character. Dilthey gives the example of strong ambition leading someone to gradually overcome shyness in public. Once a person recognizes that low self-confidence when speaking in public stands in the way of an important goal being fulfilled, that person can begin to cultivate the requisite qualities.
