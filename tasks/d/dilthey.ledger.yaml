      These attitudinal and judgmental stances are not just cognitive, but pre-delineate something more encompassing, which can be called “reflective knowledge” to distinguish it from the direct knowing of lived experience and reflexive awareness. This judgmental reflective knowledge (*Wissen*) adds to the conceptual cognition (*Erkenntnis*) of reality a “positing of values” and “the determination of purposes and the establishment of rules.” (1904–9/SW.III, 25)
    step1: TBD
