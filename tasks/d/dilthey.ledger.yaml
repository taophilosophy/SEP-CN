      It is the task of a descriptive and analytic psychology to explicate how different processes converge in the nexus of consciousness. This nexus is lived and must be distinguished from the overall acquired psychic nexus discussed earlier. The lived nexus is available to reflexive awareness and can be described as itself an ongoing process. Analysis then shows this process to have a rather uniform cross-sectional structure. Almost every momentary state of consciousness can be seen “to simultaneously contain some kind of representing, feeling, and willing” (1894/SW.II, 173).
