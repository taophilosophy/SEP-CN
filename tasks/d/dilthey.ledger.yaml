      The human sciences cannot similarly construct an abstract phenomenal world that focuses on physical and chemical processes and appeals to hypothetical atomic or even subatomic elements. It is incumbent on the human sciences to deal with the more complex networks of the historical world and the actual givens of human beings. Explanations that are adequate for the historical world will require an analysis of the multiple partial contents that are relevant in a particular context. According to Dilthey the human sciences must replace the abstract methodology of the natural sciences with an analytic counterpart.
    step1: TBD
