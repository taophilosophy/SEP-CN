      Formally Dilthey moves even closer to Kant at the end of the lectures by acknowledging that ultimately we must make “moral judgments” that are “unconditional” and “synthetic *a priori*” (1890b/GS.X, 108). Although Dilthey had rejected the possibility of synthetic *a priori* theoretical judgments for outer experience, he is now willing to speak of synthetic *a priori* practical judgments for inner experience. Had Dilthey published his 1890 lectures himself he would probably have tempered the language that was imported from his early essay. But he clearly still thinks that morality requires judgmental assent to oughts that are unconditionally self-binding.
