      虽然康德等人建立的那类认识论（*Erkenntnistheorie*）对自然科学已然足够，精神科学却要求一种更充分的知识论（*Theorie des Wissens*）。知识应当“区别于单纯的表象、推测、问题或假定，其根据在于：一个内容在这里带着一种客观必然性感出现”（1904–9/SW.III, 27–28）。这种客观必然性应定位于明证性之中，它伴随着被恰当地执行并达到其目标的思考，无论这目标是经由体验的自身被给予的实在，还是经由“把我们与外知觉绑定在一起的被给予性”（1904–9/SW.III, 28）。
