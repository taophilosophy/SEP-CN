      Dilthey conceives religious experience as an extension of Schleiermacher’s feeling of absolute dependence. It is a total experience that interweaves a feeling of dependence with an awareness of a capacity to uplift ourselves. Religious experience is regarded as an enduring background and accompaniment of human intellectual life. Religion has manifested itself in many forms such as mythical representations, mystical ideas of revelation and human redemption, theological doctrines, and metaphysical theories. Because of its emphasis on meteorological events (1883/ SW I, 450), Dilthey saw myth as a primitive scientific theory that compromised the genuine religiosity of mystical feelings.
