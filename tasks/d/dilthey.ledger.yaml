      In attempting to convey the richness and depth of lived experience, the human sciences must also consider the contribution of the arts. Aesthetics constitutes an important cultural system in that it can provide a sense of how the arts can contribute to human understanding in general. Dilthey’s *Poetics* of 1887 represents an effort to develop certain psychological concepts to explicate the workings of the poetic imagination. Even in ordinary life, the images we extract from experience are subject to metamorphosis. With time all our images are transformed, for “the same image can no more return than the same leaf can grow back on a tree the following spring” (1887/SW.V, 102). The first law of metamorphosis involves the exclusion of those constituents of images that are not valuable to us. Not every apprehended constituent is worth remembering. According to Dilthey we do not just passively absorb every impression that comes our way. We filter out what is not worth perceiving by a process of apperception. This apperception is guided by what is called an “acquired nexus of psychic life”. Because this gradually acquired nexus differs for each subject, the process of exclusion never has the same outcome.
    step1: 在力图传达体验的丰富性与深度时，精神科学还必须考虑艺术的贡献。美学构成一个重要的文化系统，因为它能提供一种感觉，即艺术如何能一般地促进人类理解。狄尔泰 1887 年的《诗学》（*Poetics*）代表了一种努力，即发展某些心理学概念来阐明诗性想象的运作。即使在日常生活中，我们从经验中提取的意象也经受变形。随着时间推移，我们的一切意象都被转变，因为“同一片叶子不会在来年春天重新长回树上，同一意象也不会返回”（1887/SW.V, 102）。变形的第一条规律涉及排除那些对我们没有价值的意象要素。并非每个被领会的要素都值得记住。按狄尔泰的看法，我们并非被动地吸收向我们迎面而来的每个印象。我们通过统觉的过程过滤掉不值得感知的东西。这种统觉由所谓“心理生活的获得联系”引导。因为这一逐渐获得的联系因主体而异，排除的过程从不会有相同的结果。
