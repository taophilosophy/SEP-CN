      As he develops his anthropologically based approach to ethics, Dilthey leads up to three main ethical incentives. One of them is the benevolence (*Wohlwollen*) that we just related to human solidarity. The other two incentives are to strive for what is right (*Rechtschaffenheit*) and to perfect oneself in a socially legitimate manner (*Vollkommenheit*). These three ethical incentives had already been predelineated as moral principles in Dilthey’s *Habilitationsschrift* of 1864 entitled “Versuch einer Analyse des moralischen Bewußtseins” (see 1864/GS.VI, 26–27). In fact, the concluding section THREE 12 of the *System of Ethics* is taken almost exclusively from this earlier work, where the ethical incentives were formulated as three moral oughts. This raises the question how it is possible to move from anthropologically derived ethical incentives that are *a posteriori* to ultimately arrive at moral oughts that are *a priori*. There is a crucial subsection THREE 9.3 that prepares us for this transition. It is entitled “*The Feeling of Duty and Justice, the Consciousness of the Commitment that Inheres in the Duty to Do What is Right or Just* .” Here Dilthey is quite explicit that the commitment to do what is right demands a consciousness that cannot be conceived as a mere instinctive inner bond with others rooted in our sense of solidarity. The commitment to do what is right must now come from within on the basis of “respect for others as ends in themselves” (1890b/SW.VI, 128). The mere life-value of group solidarity is elevated to the spiritual value of respect for all others as individual ends-in-themselves. Having replaced Humean sympathy with benevolence, Dilthey now engages Kantian duty as part of his analysis of moral self-reflection. But instead of appealing to respect for the law to justify doing what is right, Dilthey derives moral duty from a commitment that is based on both a “fidelity to oneself and respect for the self-worth of other persons” (1890b/SW.VI,128). The sense of obligation (*Verbindlichkeit*) that comes with this commitment (*Bindung*) involves a recognition of a reciprocal human connectedness rather than a one-sided dependence on a higher law.
    step1: |-
      随着狄尔泰发展其基于人类学的伦理进路，他引出了三个主要的伦理动因。其一是我们刚才把它与人类团结联系起来的仁爱（*Wohlwollen*）。另外两个动因是追求正当者（*Rechtschaffenheit*）与以社会合法的方式完善自身（*Vollkommenheit*）。这三个伦理动因已经在狄尔泰 1864 年题为《道德意识分析尝试》（“Versuch einer Analyse des moralischen Bewußtseins”）的教授资格论文中作为道德原则被预先勾勒（见 1864/GS.VI, 26–27）。事实上，《伦理学体系》的结尾节 THREE 12 几乎完全取自这部较早著作，在其中伦理动因被表述为三个道德应当。这提出了一个问题：如何从人类学导出的、*后验的*伦理动因出发，最终达到*先验的*道德应当。有一个关键小节 THREE 9.3 为这一过渡做了准备。它题为“*义务感与正义感，行正当或公正之义务所固有的承诺意识*”。狄尔泰在此相当明确地指出，行正当的承诺要求一种意识，它不能被设想为植根于我们团结感的、与他人的一种单纯本能的内在纽带。行正当的承诺现在必须从内部出发，以“对作为目的自身的他人的尊重”为基础（1890b/SW.VI, 128）。群体团结的单纯生命价值被提升为对所有他人作为个体目的自身的尊重这一精神价值。在用仁爱取代休谟式的同情之后，狄尔泰现在把康德式义务纳入其道德自我反思的分析。但他不诉诸对法律的尊重来证成行正当，而是从一个既基于“对自身的忠诚”又基于“对他人自身价值的尊重”（1890b/SW.VI,128）的承诺导出道德义务。与这一承诺（*Bindung*）相随的义务感（*Verbindlichkeit*）包含对一种相互的人类联系性的承认，而非对更高法则的单方面依赖。
