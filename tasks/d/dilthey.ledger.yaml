      The final general attitude relevant to the structural nexus of knowledge is that of willing. In the lived experiences of willing “we possess a reflexive awareness of an intention to realize a state of affairs” (1904–9/SW.III, 82). If we call this state of affairs to be realized a “purpose” then what is expected from this purpose is a satisfaction of some kind.
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      #### 2.3.2 Reinterpreting Purposiveness and Distinguishing Elementary Understanding and Higher Understanding.
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      Dilthey’s most important work is The Formation (*Aufbau*) of the Historical World in the Human Sciences of 1910. Here Dilthey applies the same kind of structural analysis that we saw him develop for lived experience to the understanding of history. The human sciences give form to the historical world by analyzing the structural systems in terms of which human beings participate in history. In the *Introduction to the Human Sciences* Dilthey had conceived the psychic nexus, cultural systems and external organizations of society as purposive systems. Now a more neutral covering concept is used to capture all the ways the forces of life can converge. This is the concept of the “productive nexus or system” (*Wirkungszusammenhang*). Now the efficacy of life and of the historical world is to be understood in terms of productivity before any causal or teleological analysis is applied. The carriers of history, whether they be individuals, cultures, institutions, or communities, are productive systems capable of producing value, meaning, and, in some cases, realizing purposes. Each is to be considered structurally as centered in itself.
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      Individuals can be studied as psychic productive systems inherently related to each other as well as to more inclusive productive systems that are also at work in history. These larger productive systems come about because of the need for communication, interaction, and cooperation among individuals. But they can also take on a life of their own and survive the individuals that formed and shaped them. Dilthey’s category of *Wirkung* or productivity is at the root of Gadamer’s theory of the productive history (*Wirkungsgeschichte*) of works of art that grants them new meanings over time that exceed those intended by their creators. In the *Introduction to the Human Sciences*, Dilthey had been unwilling to consider purposive social systems as subjects or carriers of history. In *The Formation of the Historical World in the Human Sciences*, he qualifies his opposition to the idea of a transpersonal subject such as the soul of a people by de-reifying it as the spirit of a people that is to be considered as a logical rather than a real subject. It is possible to regard cooperative productive systems as logical subjects that transcend individuals without positing them as super-empirical real subjects.
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      Despite this increased importance granted to more encompassing cultural systems and organizations of society, Dilthey continues to insist that the individuals participating in them are never completely submerged by them. This is because any such productive system only engages some aspects of an individual. Moreover, the individuals active in a cultural system often put their stamp on its mode of productivity so that not just the rationally agreed upon function of the system is achieved. Summing up these two points, Dilthey discerns a difficulty in conceptualizing the sciences of these cultural systems in terms of the idea of purposes alone:
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      > The individuals who cooperate in such a function belong to the cultural system only through those processes by which they contribute to the realization of the function. Nevertheless, they participate in these processes with their whole being, which means that a domain based purely on the system’s functional purpose can never be constructed. Rather, other aspects of human nature are also constantly at work in this domain supplementing the energies devoted to the system’s functions. (1910/SW.III, 208)
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      Individuals give only part of themselves to these more inclusive systems, yet they can express their whole being through this part. No cultural system will embody merely the purposes it was meant to fulfill. That is why it is crucial to reconceive purposive systems as productive systems. A productive nexus or system may be purposive in a general sense without fulfilling a determinate purpose. It is to be understood more generally as producing objectifications that express human values as well as purposes—leaving open the extent to which specific goals are achieved. The important thing is how human values and purposes are expressed in productive systems and how their meaning is to be understood.
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      As in the essay “The Rise of Hermeneutics”, understanding was said to involve a process of referring back from outer sensory phenomena to a reality that involves inner processes. But now in *The Formation of the Historical World in the Human Sciences* Dilthey recognizes that this inner reality need not be psychological in nature. He uses the example of how the statutes of a state express the common will of a community. The inner content of the laws on the books is a legal meaning-formation. The expressions we read in law books articulate an inner relation among legal imperatives. What is expressed in these laws is not the mental states of individual legislators, but a general way of regulating human relations. Dilthey makes the same claim for individual poetic creations. What is expressed in a drama is
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      > not the inner processes in the poet; it is rather a nexus created in them but separable from them. The nexus of a drama consists in a distinctive relation of material, poetic mood, motif, plot, and means of presentation. (1910/SW.III, 107)
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      The interpretation of history must deal with all manifestations of life, not merely expressions that are intended to communicate a state of mind. In the section entitled “The Understanding of Other Persons and Their Manifestations of Life”, Dilthey distinguishes three classes of life-manifestations. The first class consists of concepts, judgments and larger thought-formations. They are intended to communicate states of affairs, not states of mind. Thus the proposition “two plus two equals four” means the same in all contexts and says nothing about the person uttering it. Actions form a second class of manifestations of life. Actions as such are not meant to communicate anything, but they often do reveal something about the intentions of the actor. Thus if someone picks up a hammer nearby some nails and wooden boards, it is legitimate to assume that he or she wants to assemble the boards into some artifact. If this occurs in a large workshop, it is also plausible to think the person is a carpenter. This might also tell us something about the person’s livelihood, but not much more. There is a third class of life-manifestations that Dilthey calls “expressions of lived experience” and which disclose more about the individual uttering them. Expressions of lived experience can range from emotional exclamations and gestures to personal self-descriptions and reflections to works of art. Often these expressions are more revealing than was intended:
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      > An expression of lived experience can contain more of the nexus of psychic life than any introspection can catch sight of. It draws from depths not illuminated by consciousness. But at the same time, it is characteristic of an expression of lived experience that its relation to the spiritual or human content expressed in it can only be made available to understanding within limits. Such expressions are not to be judged as true or false but as truthful or untruthful. (ca. 1910/SW.III, 227)
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      A work of art is often more disclosive of human life in general than of the specific life of the artist. It may disclose something about the state of mind or the attitude of the artist, but a work of art will only be great if its “spiritual content is liberated from its creator” (ca. 1910/SW.III, 228).
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
    source: |-
      After having analyzed these three kinds of manifestations of life, which can be called theoretical, practical and disclosive respectively, Dilthey proceeds to distinguish various modes of understanding them. Elementary understanding goes back to the associative relation that normally exists between an expression and what is expressed in it. It assimilates the meanings that are commonly attached to expressions in the community that we grow up in. Dilthey adapts Hegel’s idea of “objective spirit” to account for this commonality of meaning. Now objective spirit logically encompasses “the manifold forms in which a commonality existing among individuals has objectified itself in the world of the senses”, allowing the past to become “a continuously enduring present for us” (ca. 1910/SW.III, 229). Whereas Hegel restricted objective spirit to the legal, economic and political aspects of historical life, Dilthey expands the concept to include not only the sciences, but also the triad of art, religion and philosophy that Hegel had assigned to absolute spirit. But most of all, objective spirit embodies the everyday, mundane aspects of life that we grow up with.
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      > From earliest childhood, the self is nurtured by this world of objective spirit. It is also the medium in which the understanding of other persons and their life-manifestations takes place. For everything in which spirit has objectified itself contains something that is common to the I and the Thou. Every square planted with trees, every room in which chairs are arranged, is understandable to us from childhood because human tendencies to set goals, produce order, and define values in common have assigned a place to every square and every object in the room. (ca. 1910/SW.III, 229)
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      This common background suffices for the elementary understanding of everyday life. But whenever the common meaning of life-manifestations is called into question for some reason, higher understanding becomes necessary. This can occur because of an apparent inconsistency among various claims being made, or because an ambiguity that needs to be resolved. In each case we discern an unexpected complexity that requires us to shift our frame of reference. Higher understanding cannot continue to rely on the common meanings of an expression that derive from a shared local background between speaker and listener, writer and reader. Higher understanding must replace the sphere of commonality, where inference by analogy suffices, with that of universality, where inductive inference must take over. Here the human sciences become relevant by offering the appropriate universal disciplinary contexts that can help to deal with uncertainties of interpretation. These universal systematic contexts can be social or political, economic or cultural, secular or religious. When expressions can be determined to be functioning in a specific disciplinary context then ambiguities tend to disappear. Literary scholars may be able to clarify a puzzling poetic passage by showing it to contain a literary allusion to a classical work with a foreign vocabulary. Or they can perhaps clarify it by seeing it as a way of accommodating certain technical demands of the genre as such. These cases of higher understanding establish a larger context of reference.
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      However, higher understanding can also focus on more specific contexts related to a work or its author. The consideration of such contexts should come only at the conclusion of the interpretive process and represents a shift from exploring the relation “of expression to what is expressed” toward the relation “of what has been produced to productivity” (ca. 1910/SW.III, 233). Here we move from meaning relationships to something like a productive relationship to which knowledge about the authors becomes relevant. But the first recourse here is to consult more of the products of the author. How does a sentence fit into a paragraph, a chapter, a whole work, or a corpus as a whole? Only if these contexts fail to resolve the problem may we consider psychological claims about the author. The understanding of the individuality of an author should only bring in psychological factors as a last resort. Dilthey writes
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      > we understand individuals by means of their affinities, their commonalities. This process presupposes the connection between the universally human and individuation. On the basis of what is universal, we can see individuation extended to the manifoldness of human existence. (ca. 1910/SW.III, 233)
    step1: TBD
    step2: TBD
  - id: 92
    kind: body
    source: |-
      However, the highest form of understanding is not the reconstruction of the individuality of the author. It involves something that has been confused with reconstruction, but is distinct. What Dilthey points to is a process of re-creation or re-experiencing, which he contrasts with understanding as such:
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      > Understanding as such is an operation running inverse to the course of production. But a fully sympathetic reliving requires that understanding go forward with the line of the events themselves. (ca. 1910/SW.III, 235)
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      Re-experiencing develops understanding by completing the hermeneutical circle. If understanding goes “back” to the overall context, re-experiencing goes “forward” by following out the parts that give focus to the whole. A re-experiencing is not an actual re-construction but produces a better understanding that refines the original. This is made clear by the following example:
    step1: TBD
    step2: TBD
  - id: 95
    kind: body
    source: |-
      > A lyrical poem makes possible, through the sequence of its verses, the re-experiencing of a nexus of lived experience—not the real one that stimulated the poet, but the one that, on its basis, the poet places in the mouth of an ideal person. (ca. 1910/SW.III, 235)
    step1: TBD
    step2: TBD
  - id: 96
    kind: body
    source: |-
      Whereas the arts can expand the horizon of our lived experience by means of the ideal and imaginary means of fiction, history must do so by a process of structural articulation. The task of the human sciences is to analyze the productive nexus of history as it exhibits itself in stable formations or systematic structures. The productive nexus of history differs from the causal nexus of nature in producing values and arriving at purposes.
    step1: TBD
    step2: TBD
  - id: 97
    kind: body
    source: |-
      > The carriers of this constant creation of values and goods in the world of human spirit are individuals, communities, and the cultural systems in which individuals cooperate. This cooperation is determined by the fact that, in order to realize values, individuals subject themselves to rules and set themselves purposes. All these modes of cooperation manifest a life-concern connected to the human essence that links individuals with each other—a core, as it were, that cannot be grasped psychologically but is revealed in every such system of relations among human beings. (1910/SW.III, 175–76)
    step1: TBD
    step2: TBD
  - id: 98
    kind: body
    source: |-
      Each such socio-cultural system can be regarded as being centered within itself on the basis of some function, whether it be economic, scientific, political, artistic or religious. The structures to be analyzed here provide various cross-sections of what takes place in history. But there are also more composite and enduring socio-historical contexts that we can delineate such as nation-states and historical periods.
    step1: TBD
    step2: TBD
  - id: 99
    kind: body
    source: |-
      A nation-state is a composite institutional organization that contains and shapes many socio-cultural productive systems which then generate certain commonalities. When socio-cultural systems transcending the scope of a nation come into contact with local productive systems, they also begin to assume commonalities distinctive of that nation. In the individual members of a nation-state these commonalities can produce a sense of solidarity. But Dilthey also warns of excesses in that regard when he notes that many Germans are “placing the highest value ... not in the serene world-view of the Greeks, not in the intellectually delimited consideration of purpose of the Romans, but in the raw exertion of power without any limit” (1910/SW.III, 196).
    step1: TBD
    step2: TBD
  - id: 100
    kind: body
    source: |-
      Nation-states are regionally defined historical wholes, but we can also delineate temporal composite wholes such as historical phases. What characterizes a generation according to Dilthey is the crystallization of a movement sparked by the maturation of a certain age group. An epoch is more impersonal and large-scale. It marks a pervasive “permeating tendency” (1910/SW.III, 198). Each epoch defines a life-horizon by which people orient their life. “Such a horizon places life, life-concerns, life-experience, and thought-formation in a certain proportion” (1910/SW.III, 198), which tends to restrain the way individuals can modify their outlooks. But an epoch is only an overall tendency that encompasses opposing forces. In fact, a new epoch will often be sparked by the dissatisfactions produced by any force that becomes too dominant and complacent.
    step1: TBD
    step2: TBD
  - id: 101
    kind: body
    source: |-
      The structural analysis of history in terms of cultural systems and the external organizations of society can be guided by the various human sciences. But a reflective mode of judgment is needed when historians try to make sense of the more composite structures of nation-states and epochs. History is both a judgmental art concerned with meaning and a science concerned with objective truth. Only historical reflection can create the right balance that will transform the conceptual cognition of the human sciences into adequate historical knowledge.
    step1: TBD
    step2: TBD
  - id: 102
    kind: body
    source: |-
      #### 2.3.3 The Categories of Historical Knowledge.
    step1: TBD
    step2: TBD
  - id: 103
    kind: body
    source: |-
      This shift to historical knowledge is the main theme of the notes (ca. 1910) for a second volume of *The Formation of the Historical World in the Human Sciences* (1910) which were published posthumously in 1927 as *Drafts for a Critique of Historical Reason*. Here Dilthey analyzes the categories of life that are relevant to historical knowledge. He distinguishes between formal and real categories. Formal categories stem from elementary logical operations that are at work in all apprehension: they include the processes of comparing, noting sameness, differentiating and relating. Although such elementary operations are prediscursive, they provide the basis for discursive thought. The prediscursive noting of sameness prepares the way for the unifying concepts of discursive thought and the process of relating provides the basis for synthetic procedures. These prediscursive and discursive modes of thought account for the formal categories of unity, plurality, identity, difference, degree and relation that are shared by the natural and human sciences.
    step1: TBD
    step2: TBD
  - id: 104
    kind: body
    source: |-
      But the real categories are not the same in the natural and human sciences. Whereas time is an ideal abstract form for the natural sciences, for the human sciences it has a qualitative content. It is experienced as advancing into the future and “always contains the memory of what has just been present” (ca. 1910/SW.III, 216). The relation between the past and the present becomes the source for the category of meaning which is Dilthey’s main historical category. The present never merely *is* in the sense of being observable and it can be understood meaningfully only to the extent that the past asserts its *presence* in it. When the present is lived, “the positive or negative value of the realities that fill it are experienced through feeling. And when we face the future, the category of purpose arises through a projective attitude” (ca. 1910/SW.III, 222). Meaning, value, and purpose are the three central categories of the human sciences and each relates to time in its own way. What is valued by feeling focuses on the momentary present, but for the will everything in the present tends to be subordinated to some future purpose. Only the category of meaning can expand the present into a presence that includes the past and overcomes the mere juxtaposition or subordination of the various aspects of life to each other. The understanding of meaning involves the encompassing sense of reflective knowledge that attempts to relate cognition to evaluation and the setting of goals.
    step1: TBD
    step2: TBD
  - id: 105
    kind: body
    source: |-
      Dilthey’s distinction between the natural and human sciences is not a metaphysical distinction. For that reason he does not create a dualism between nature as the domain of causality and history as the domain of freedom. There are many determining forces at work in history because it cannot be divorced from natural conditions. But to understand how individuals participate in history we must replace the purely external relation of cause and effect with the integral relation of “agency and suffering, of action and reaction” (ca. 1910/SW.III, 219).
    step1: TBD
    step2: TBD
  - id: 106
    kind: body
    source: |-
      The doing and undergoing that characterizes human involvement in history can be brought home most forcefully in autobiography.
    step1: TBD
    step2: TBD
  - id: 107
    kind: body
    source: |-
      > Here a life-course stands as an external phenomenon from which understanding seeks to discover what produced it within a particular environment. The person who understands it is the same as the one who created it. This results in a special intimacy of understanding. (ca. 1910/SW.III, 221)
    step1: TBD
    step2: TBD
  - id: 108
    kind: body
    source: |-
      Autobiography begins with what memory has selected as significant life-moments, which reflection then gives a certain coherence. Thereby the initial tasks of “explicating a historical nexus are already half solved by life itself” (ca. 1910/SW.III, 221).
    step1: TBD
    step2: TBD
  - id: 109
    kind: body
    source: |-
      But the fact that history derives a special intimacy through the capacity for autobiography does not mean that we should be content to understand history through individuals alone. This also becomes evident in relation to Dilthey’s own work as a biographer of Schleiermacher. It became ever more clear to Dilthey that his biography could not solve its task of understanding the life of Schleiermacher without considering the intellectual life of Berlin in which he participated. A biography is likely to bring more contextual determining factors into play than an autobiography, but the biographer must remain open to the interplay of these influences and individual initiative. Dilthey writes that an individual
    step1: TBD
    step2: TBD
  - id: 110
    kind: body
    source: |-
      > does not face a limitless play of forces in the historical world: he dwells in the sphere of the state, religion, or science—in brief, in a distinctive life-system or in a constellation of them. The inner structure of such a constellation draws the individual into it, shapes him, and determines the direction of his productivity. Historical achievements stem from the possibilities inherent in the inner structure of a historical moment. (ca. 1910/SW.III, 266–67)
    step1: TBD
    step2: TBD
  - id: 111
    kind: body
    source: |-
      Individuals worthy of a biography are those who have seized those momentary possibilities.
    step1: TBD
    step2: TBD
  - id: 112
    kind: body
    source: |-
      When turning to the nexus of universal history, we move further beyond the individual life-courses focused on by autobiography and biography. Although universal-historical understanding cannot ignore the results of autobiography and biography, it will focus more on the history of nations, cultural systems, and the external organizations of society.
    step1: TBD
    step2: TBD
  - id: 113
    kind: body
    source: |-
      > Each of these histories has its own center to which the processes are related and consequently the values, purposes, and significance that result from this relationship. (ca. 1910/SW.III, 291)
    step1: TBD
    step2: TBD
  - id: 114
    kind: body
    source: |-
      Anthropological reflection expects history to teach what life is and yet history is dependent on life as lived. There is a hermeneutical circularity here that could be escaped “if unconditioned norms, purposes, or values [could] set the standard for contemplating an apprehending history” (ca. 1910/SW.III, 281). Unlike his Neo-Kantian contemporaries such as Hermann Cohen and Heinrich Rickert, Dilthey is not willing to accept unconditional values that transcend life. The spiritual nexus of history “is that of life itself insofar as life produces connectedness under the conditions of its natural environment” (ca. 1910/SW.III, 280). Life is the ultimate context behind which we cannot go. It is the horizon of productivity which encompasses the organic and the mental, but cannot be defined by either. Since “life is intimately related to temporal fulfillment” (ca. 1910/SW.III, 249), historicity is part of its essence. Consequently, the objective validity that is to be attached to any value cannot be separated from our temporal engagement with life. Values are not simply given or imposed from on high, but are produced as part of the human process of explicating the meaning of history. In light of Dilthey’s skepticism about transcendent unconditional values, it may seem surprising that he presented an ethical system that expects human beings to make unconditional commitments that are self-binding.
    step1: TBD
    step2: TBD
  - id: 115
    kind: body
    source: |-
      ## 3. Dilthey’s Reflections on Ethics and Worldviews and His Doubts about Metaphysics
    step1: TBD
    step2: TBD
  - id: 116
    kind: body
    source: |-
      In 1890 Dilthey offered a lecture course at the University of Berlin that was posthumously published with the title *System of Ethics* (1890b). Here Dilthey sets himself the task of developing a “psycho-ethical” approach that is rooted in “anthropological-historical analysis” (1890b/SW.VI,104). Whereas traditional psychology has analyzed feelings mainly as responses to sense impressions that come from without, a psycho-ethical understanding of the feelings that can motivate us to act must be rooted in anthropological analysis of our inner drives, instincts and desires. Instead of focusing on the intellectual processes whereby human beings adapt to their surroundings, Dilthey argues that most of our responses are basically emotive and volitional. The feelings that measure the effect the world has on us are not just the subjective aspect of our representations of the world. These feelings are rooted in certain drives among which a sense of group solidarity is central (1890b/SW.VI,104).
    step1: TBD
    step2: TBD
  - id: 117
    kind: body
    source: |-
      This solidarity encompasses a fellow-feeling (*Mitgefühl*)(1890b/SW.VI,104–05) that goes deeper than the sympathy of the British moralists. Dilthey regards sympathy as a feeling “transferred from one living being to another” (1890b/SW.VI,89). Sympathy, compassion, and pity are modes of “suffering with” (*Mitleid*) that are derivative because they affect us from the outside. They involve an external “conjoint movement” (*Mitbewegung*) with others (1890b/SW.VI,89). Dilthey considers these psychological forms of sympathy or empathy (*Mitempfindung*) to be superficial compared to the more basic anthropological fellow-feeling of solidarity that produces an “inner relationship” (1890b/SW.VI,104)– with others.
    step1: TBD
    step2: TBD
  - id: 118
    kind: body
    source: |-
      The extent to which we are motivated by a sense of solidarity is a function of the sphere of commonality of objective spirit that we grow up in. Our anthropological sense of solidarity and its fellow-feeling provides a more positive incentive for sociability than Hume’s sympathy and Schopenhauer’s compassion. But even the fellowship of solidarity is a mere natural incentive which does not become ethical until it is transformed into a more active or participatory incentive of benevolence (1890b/GS.X, 70).
    step1: TBD
    step2: TBD
  - id: 119
    kind: body
    source: |-
      As he develops his anthropologically based approach to ethics, Dilthey leads up to three main ethical incentives. One of them is the benevolence (*Wohlwollen*) that we just related to human solidarity. The other two incentives are to strive for what is right (*Rechtschaffenheit*) and to perfect oneself in a socially legitimate manner (*Vollkommenheit*). These three ethical incentives had already been predelineated as moral principles in Dilthey’s *Habilitationsschrift* of 1864 entitled “Versuch einer Analyse des moralischen Bewußtseins” (see 1864/GS.VI, 26–27). In fact, the concluding section THREE 12 of the *System of Ethics* is taken almost exclusively from this earlier work, where the ethical incentives were formulated as three moral oughts. This raises the question how it is possible to move from anthropologically derived ethical incentives that are *a posteriori* to ultimately arrive at moral oughts that are *a priori*. There is a crucial subsection THREE 9.3 that prepares us for this transition. It is entitled “*The Feeling of Duty and Justice, the Consciousness of the Commitment that Inheres in the Duty to Do What is Right or Just* .” Here Dilthey is quite explicit that the commitment to do what is right demands a consciousness that cannot be conceived as a mere instinctive inner bond with others rooted in our sense of solidarity. The commitment to do what is right must now come from within on the basis of “respect for others as ends in themselves” (1890b/SW.VI, 128). The mere life-value of group solidarity is elevated to the spiritual value of respect for all others as individual ends-in-themselves. Having replaced Humean sympathy with benevolence, Dilthey now engages Kantian duty as part of his analysis of moral self-reflection. But instead of appealing to respect for the law to justify doing what is right, Dilthey derives moral duty from a commitment that is based on both a “fidelity to oneself and respect for the self-worth of other persons” (1890b/SW.VI,128). The sense of obligation (*Verbindlichkeit*) that comes with this commitment (*Bindung*) involves a recognition of a reciprocal human connectedness rather than a one-sided dependence on a higher law.
    step1: TBD
    step2: TBD
  - id: 120
    kind: body
    source: |-
      Formally Dilthey moves even closer to Kant at the end of the lectures by acknowledging that ultimately we must make “moral judgments” that are “unconditional” and “synthetic *a priori*” (1890b/GS.X, 108). Although Dilthey had rejected the possibility of synthetic *a priori* theoretical judgments for outer experience, he is now willing to speak of synthetic *a priori* practical judgments for inner experience. Had Dilthey published his 1890 lectures himself he would probably have tempered the language that was imported from his early essay. But he clearly still thinks that morality requires judgmental assent to oughts that are unconditionally self-binding.
    step1: TBD
    step2: TBD
  - id: 121
    kind: body
    source: |-
      The normative implications of anthropological reflection about life and history also led Dilthey to address the value of worldviews. Just as the nature of universal history forces us to conceive of history as more than a human science, so worldviews are more broadly based attempts at acquiring a unified perspective on life. The sciences are by their nature partial and cannot provide a comprehensive worldview. A worldview attempts to provide not only a cognitive picture of the world, but also an estimation of what in life is valuable and worth preserving, and finally how we can strive to improve reality. Worldviews have been developed in literary, religious and philosophical works. Philosophers have produced metaphysical formulations of worldviews that attempt to give them a universal conceptual determinacy. Dilthey analyzes three recurrent types of such metaphysical formulations: naturalism, the idealism of freedom, and objective idealism. The naturalism of Democritus, Hobbes and others derives everything from what can be cognized and is pluralistic in structure; idealism of freedom as found in Plato, Kant, and others insists on the sovereignty of the will and is dualistic; objective idealism as found in Heraclitus, Leibniz and Hegel affirms reality as the embodiment of a harmonious set of values and can be considered monistic. The three types of metaphysical worldviews are incommensurable in that each sets its priorities differently. Dilthey finds naturalism too reductive; his ethical views incline him toward the idealism of freedom; aesthetically he felt attracted towards objective idealism. No metaphysical formulation can have more than relative validity because it attempts to arrive at a totalization that transcends experience. Literary and poetic expressions of worldviews tend to be more successful because they do not claim to be totalizing. All that is humanly possible is to probe reality on the basis of life-experience and to settle for more limited philosophical insights informed by historical understanding. Ultimately, our reflective understanding of life and history must remain determinate-indeterminate.
    step1: TBD
    step2: TBD
  - id: 122
    kind: body
    source: |-
      We can see certain parallels with Dilthey’s attempt to replace metaphysical systems with more informal life-based “meta-physical reflection” or worldviews in the young Rudolf Carnap, who studied in Jena with Dilthey’s student Herman Nohl before moving to Vienna. Carnap’s paper “The Elimination of Metaphysics Through Logical Analysis of Language” refers to Dilthey and his students as positive counterexamples to varieties of meaningless metaphysical systems as found in Fichte, Hegel and Heidegger. Another essay by Carnap entitled “Metaphysics as Expression of an Attitude to Life” acknowledges the importance of Dilthey’s notion of “*Lebensgefuehl*.” Carnap’s analogue for Dilthey’s “*Weltanschauung*” is “*Weltauffassung*.” Carnap also incorporated a more or less Diltheyan conception of the human sciences in his *Der logische Aufbau der Welt* of 1928. Carnap refers to Dilthey’s *Introduction to the Human Sciences*, but replaces its language of “facts of consciousness” with that of “elementary experiences.” He does not refer to Dilthey’s last main work *Der Aufbau der geschichtlichen Welt in den Geisteswissenschaften*, but he did read Hans Freyer’s *Theorie des objektiven Geistes*, a work heavily influenced by Dilthey’s *Aufbau* and its reinterpretation of objective spirit as the medium of intersubjective communication. Carnap writes in his own *Aufbau*:
