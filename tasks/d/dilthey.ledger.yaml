      ## 3. Dilthey’s Reflections on Ethics and Worldviews and His Doubts about Metaphysics
    step1: TBD
    step2: TBD
  - id: 116
    kind: body
    source: |-
      In 1890 Dilthey offered a lecture course at the University of Berlin that was posthumously published with the title *System of Ethics* (1890b). Here Dilthey sets himself the task of developing a “psycho-ethical” approach that is rooted in “anthropological-historical analysis” (1890b/SW.VI,104). Whereas traditional psychology has analyzed feelings mainly as responses to sense impressions that come from without, a psycho-ethical understanding of the feelings that can motivate us to act must be rooted in anthropological analysis of our inner drives, instincts and desires. Instead of focusing on the intellectual processes whereby human beings adapt to their surroundings, Dilthey argues that most of our responses are basically emotive and volitional. The feelings that measure the effect the world has on us are not just the subjective aspect of our representations of the world. These feelings are rooted in certain drives among which a sense of group solidarity is central (1890b/SW.VI,104).
    step1: TBD
    step2: TBD
  - id: 117
    kind: body
    source: |-
      This solidarity encompasses a fellow-feeling (*Mitgefühl*)(1890b/SW.VI,104–05) that goes deeper than the sympathy of the British moralists. Dilthey regards sympathy as a feeling “transferred from one living being to another” (1890b/SW.VI,89). Sympathy, compassion, and pity are modes of “suffering with” (*Mitleid*) that are derivative because they affect us from the outside. They involve an external “conjoint movement” (*Mitbewegung*) with others (1890b/SW.VI,89). Dilthey considers these psychological forms of sympathy or empathy (*Mitempfindung*) to be superficial compared to the more basic anthropological fellow-feeling of solidarity that produces an “inner relationship” (1890b/SW.VI,104)– with others.
    step1: TBD
    step2: TBD
  - id: 118
    kind: body
    source: |-
      The extent to which we are motivated by a sense of solidarity is a function of the sphere of commonality of objective spirit that we grow up in. Our anthropological sense of solidarity and its fellow-feeling provides a more positive incentive for sociability than Hume’s sympathy and Schopenhauer’s compassion. But even the fellowship of solidarity is a mere natural incentive which does not become ethical until it is transformed into a more active or participatory incentive of benevolence (1890b/GS.X, 70).
    step1: TBD
    step2: TBD
  - id: 119
    kind: body
    source: |-
      As he develops his anthropologically based approach to ethics, Dilthey leads up to three main ethical incentives. One of them is the benevolence (*Wohlwollen*) that we just related to human solidarity. The other two incentives are to strive for what is right (*Rechtschaffenheit*) and to perfect oneself in a socially legitimate manner (*Vollkommenheit*). These three ethical incentives had already been predelineated as moral principles in Dilthey’s *Habilitationsschrift* of 1864 entitled “Versuch einer Analyse des moralischen Bewußtseins” (see 1864/GS.VI, 26–27). In fact, the concluding section THREE 12 of the *System of Ethics* is taken almost exclusively from this earlier work, where the ethical incentives were formulated as three moral oughts. This raises the question how it is possible to move from anthropologically derived ethical incentives that are *a posteriori* to ultimately arrive at moral oughts that are *a priori*. There is a crucial subsection THREE 9.3 that prepares us for this transition. It is entitled “*The Feeling of Duty and Justice, the Consciousness of the Commitment that Inheres in the Duty to Do What is Right or Just* .” Here Dilthey is quite explicit that the commitment to do what is right demands a consciousness that cannot be conceived as a mere instinctive inner bond with others rooted in our sense of solidarity. The commitment to do what is right must now come from within on the basis of “respect for others as ends in themselves” (1890b/SW.VI, 128). The mere life-value of group solidarity is elevated to the spiritual value of respect for all others as individual ends-in-themselves. Having replaced Humean sympathy with benevolence, Dilthey now engages Kantian duty as part of his analysis of moral self-reflection. But instead of appealing to respect for the law to justify doing what is right, Dilthey derives moral duty from a commitment that is based on both a “fidelity to oneself and respect for the self-worth of other persons” (1890b/SW.VI,128). The sense of obligation (*Verbindlichkeit*) that comes with this commitment (*Bindung*) involves a recognition of a reciprocal human connectedness rather than a one-sided dependence on a higher law.
