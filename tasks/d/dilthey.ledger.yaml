      Anthropological reflection expects history to teach what life is and yet history is dependent on life as lived. There is a hermeneutical circularity here that could be escaped “if unconditioned norms, purposes, or values [could] set the standard for contemplating an apprehending history” (ca. 1910/SW.III, 281). Unlike his Neo-Kantian contemporaries such as Hermann Cohen and Heinrich Rickert, Dilthey is not willing to accept unconditional values that transcend life. The spiritual nexus of history “is that of life itself insofar as life produces connectedness under the conditions of its natural environment” (ca. 1910/SW.III, 280). Life is the ultimate context behind which we cannot go. It is the horizon of productivity which encompasses the organic and the mental, but cannot be defined by either. Since “life is intimately related to temporal fulfillment” (ca. 1910/SW.III, 249), historicity is part of its essence. Consequently, the objective validity that is to be attached to any value cannot be separated from our temporal engagement with life. Values are not simply given or imposed from on high, but are produced as part of the human process of explicating the meaning of history. In light of Dilthey’s skepticism about transcendent unconditional values, it may seem surprising that he presented an ethical system that expects human beings to make unconditional commitments that are self-binding.
    step1: |-
      人类学的反思期待历史教导生命是什么，然而历史却依赖于被活出的生命。这里有一种诠释学的循环性，“如果无条件的规范、目的或价值[能够]为思考和把握历史设定标准”，它本可以被逃脱（ca. 1910/SW.III, 281）。与赫尔曼·柯亨、海因里希·李凯尔特等同代新康德主义者不同，狄尔泰不愿意接受超越生命的无条件价值。历史的精神联系“就是生命本身的联系，就生命在其自然环境的条件下产生联系性而言”（ca. 1910/SW.III, 280）。生命是我们无法退到其后的终极语境。它是作用性的视野，涵盖有机者与心灵者，却不能由二者任一来定义。由于“生命与时间性的充实紧密相关”（ca. 1910/SW.III, 249），历史性是它本质的一部分。因此，要归予任何价值的客观有效性，不能与我们同生命的时间性牵连分开。价值不是单纯被给予或自上而下强加的，而是作为人类阐明历史意义过程的一部分被生产出来的。鉴于狄尔泰对超越的无条件价值的怀疑，他竟提出了一个期待人作出自我约束的无条件承诺的伦理系统，这看起来或许令人惊讶。
