      But the real categories are not the same in the natural and human sciences. Whereas time is an ideal abstract form for the natural sciences, for the human sciences it has a qualitative content. It is experienced as advancing into the future and “always contains the memory of what has just been present” (ca. 1910/SW.III, 216). The relation between the past and the present becomes the source for the category of meaning which is Dilthey’s main historical category. The present never merely *is* in the sense of being observable and it can be understood meaningfully only to the extent that the past asserts its *presence* in it. When the present is lived, “the positive or negative value of the realities that fill it are experienced through feeling. And when we face the future, the category of purpose arises through a projective attitude” (ca. 1910/SW.III, 222). Meaning, value, and purpose are the three central categories of the human sciences and each relates to time in its own way. What is valued by feeling focuses on the momentary present, but for the will everything in the present tends to be subordinated to some future purpose. Only the category of meaning can expand the present into a presence that includes the past and overcomes the mere juxtaposition or subordination of the various aspects of life to each other. The understanding of meaning involves the encompassing sense of reflective knowledge that attempts to relate cognition to evaluation and the setting of goals.
    step1: |-
      但实在范畴在自然科学与精神科学中并不相同。对自然科学而言时间是一个理想的抽象形式，对精神科学而言它则有质性的内容。它被体验为向未来的推进，并“总是包含对刚才在场者的记忆”（ca. 1910/SW.III, 216）。过去与现在之间的关系成为意义范畴的来源，意义是狄尔泰主要的历史范畴。现在绝不单纯 *是*，就其可被观察而言；它只有在过去在其中主张其 *在场* 时才能被有意义地理解。当现在被体验时，“充实它的诸实在的正面或负面价值通过感受被体验。而当我们面对未来时，目的范畴通过一种投射态度而产生”（ca. 1910/SW.III, 222）。意义、价值与目的是精神科学的三个中心范畴，每一个都以自己的方式关联于时间。被感受所评价者聚焦于瞬间的现在，但对意志而言，现在中的一切都倾向于被归入某个未来的目的。只有意义范畴能把现在扩展为一种包含过去的在场，克服生活的诸方面彼此单纯的并置或归摄。意义的理解涉及反思性知识的包容性感觉，它试图把认知与评价及目标的设定关联起来。
    step2: |-
