      Dilthey’s first major theoretical work is the *Introduction to the Human Sciences* of 1883. The human sciences (*Geisteswissenschaften*) encompass both the humanities and the social sciences. They range from disciplines like philology, literary and cultural studies, religion and psychology, to political science and economics. Dilthey insists that the human sciences be related not by some logical construct on the order of August Comte or J.S. Mill, but by means of reflective considerations that take their historical genesis into account. Dilthey writes that
    step1: |-
      狄尔泰第一部主要理论著作是 1883 年的《精神科学引论》（*Introduction to the Human Sciences*）。精神科学（*Geisteswissenschaften*）既包括人文学科，也包括社会科学，从语文学、文学与文化研究、宗教学与心理学，一直到政治学与经济学。狄尔泰坚持认为，精神科学之间的关联不应像奥古斯特·孔德或 J.S. 密尔那样依靠某种逻辑构造，而应通过考虑其历史发生的反思性思考来建立。狄尔泰写道：
    step2: |-
      狄尔泰第一部主要理论著作，是 1883 年的《精神科学引论》（*Introduction to the Human Sciences*）。精神科学（*Geisteswissenschaften*）兼括人文学科与社会科学，下起语文学、文学与文化研究、宗教学与心理学，上至政治学与经济学。狄尔泰坚持：精神科学之间不靠奥古斯特·孔德或 J.S. 密尔式的那种逻辑构造来关联，而要借助于把各学科的历史发生考虑在内的反思性思考。狄尔泰写道：
