      在力图传达体验的丰富性与深度时，精神科学还必须考虑艺术的贡献。美学构成一个重要的文化系统，因为它能提供一种感觉，即艺术如何能一般地促进人类理解。狄尔泰 1887 年的《诗学》（*Poetics*）代表了一种努力，即发展某些心理学概念来阐明诗性想象的运作。即使在日常生活中，我们从经验中提取的意象也经受变形。随着时间推移，我们的一切意象都被转变，因为“同一片叶子不会在来年春天重新长回树上，同一意象也不会返回”（1887/SW.V, 102）。变形的第一条规律涉及排除那些对我们没有价值的意象要素。并非每个被领会的要素都值得记住。按狄尔泰的看法，我们并非被动地吸收向我们迎面而来的每个印象。我们通过统觉的过程过滤掉不值得感知的东西。这种统觉由所谓“心理生活的获得联系”引导。因为这一逐渐获得的联系因主体而异，排除的过程从不会有相同的结果。
