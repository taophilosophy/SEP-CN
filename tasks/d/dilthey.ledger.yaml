      狄尔泰描述与分析心理学的又一项任务是表明心理联系的展开如何产生人类生活的个体化。个体性不是被设想为我们禀有的独特品质，而是被设想为我们每个人历史地获得的东西。它体现在前面所说的主体的获得心理联系之中，并且只是逐渐被阐明。即使人们共享同样的品质，其相对强度也会不同。有时品质在场的程度如此之小，以致实际上不可察觉。然而，突出的品质倾向于强化某些相关品质而抑制其他品质。因此，每个个体都可以被理解为一组占主导地位的品质与某些次要品质相抗衡的结构构型。这种张力可能长期得不到解决，直到最终达成某种阐明或 *Gestalt*（格式塔），它规定了一个人的性格。狄尔泰给出这样一个例子：强烈的抱负引导一个人逐渐克服在公共场合的羞怯。一旦一个人认识到当众说话时缺乏自信妨碍了重要目标的达成，他就可以开始培养所需的品质。
