    source: |-
      Wilhelm Dilthey was a German philosopher who lived from 1833–1911. Dilthey is best known for the way he distinguished between the natural and human sciences. He defined the human sciences broadly to include both the humanities and the social sciences. Whereas the main task of the natural sciences as Dilthey found them was to arrive at law-based causal explanations, he projected the core task of the human sciences to be that of providing an understanding of the organizational structures and dynamic forces of human and historical life. It will be shown that this distinction is not so sharp as to rule out causal explanations in particular human sciences such as psychology, political theory, and economics; it mostly delimits the scope of explanations in these fields. Dilthey’s aim was to expand Kant’s primarily nature-oriented *Critique of Pure Reason* into a *Critique of Historical Reason* that can also do justice to the social and cultural dimensions of human experience. Understanding the meaning of human historical events requires being able to organize them in their proper contexts and to articulate the structural uniformities that can be found in this way. Dilthey’s reflections on the human sciences, historical contextualization, and hermeneutics influenced many subsequent thinkers such as Husserl, Heidegger, Cassirer, Gadamer and Ricoeur. Recently, there has been some attention given to the ways in which Dilthey’s empirical approach to experience influenced Carnap in his early attempts to overcome metaphysics in favor of more analytical methods.
    step1: |-
      威廉·狄尔泰是德国哲学家，生活于 1833—1911 年。狄尔泰最为人熟知之处，在于他区分自然科学与精神科学的做法。他把精神科学作宽泛界定，既包括人文学科，也包括社会科学。在狄尔泰所面对的自然科学中，其主要任务是达到以法则为基础的因果说明；而他为精神科学所设定的核心任务，则是提供对人类生活与历史生活之组织结构与动态力量的理解。下文将表明，这一区分并不至于分明到排除心理学、政治理论、经济学等特定精神科学之中的因果说明；它多半只是限定了这些领域中说明的范围。狄尔泰的目标，是把康德那部主要朝向自然的《纯粹理性批判》扩展为一部《历史理性批判》，使之同样能够恰当对待人类经验的社会与文化维度。要理解人类历史事件的意义，就得能够把它们组织进各自恰当的语境，并阐明以此方式可以发现的结构齐一性。狄尔泰关于精神科学、历史语境化与诠释学的思考，影响了胡塞尔、海德格尔、卡西尔、伽达默尔与利科等许多后来的思想家。晚近以来，也有人注意到：狄尔泰那种以经验为出发点的经验性进路，如何影响了卡尔纳普早期为以更具分析性的方法克服形而上学所作的尝试。
    step2: |-
      威廉·狄尔泰（Wilhelm Dilthey，1833–1911）是德国哲学家，最为人熟知的贡献是他对自然科学与精神科学的区分。他把精神科学的范围定得很宽，兼收人文学科与社会科学。在狄尔泰看来，自然科学的根本任务是得出以法则为基础的因果说明；他则为精神科学设定的核心任务，是理解人类生活与历史生活的组织结构与动态力量。下文将表明，这一区分并没有分明到排斥心理学、政治理论、经济学等具体精神科学中的因果说明——它大致只是划定了这些领域中说明的适用范围。狄尔泰的目标，是把康德那部以自然为主要取向的《纯粹理性批判》扩展为一部《历史理性批判》，使之也能顾及人类经验的社会与文化维度。要理解人类历史事件的意义，就得能够把它们置入各自恰当的语境，并阐明由此显现的结构齐一性。狄尔泰关于精神科学、历史语境化与诠释学的思考，影响了胡塞尔、海德格尔、卡西尔、伽达默尔、利科等众多后来的思想家。晚近也有人注意到：狄尔泰那种着眼经验的经验性进路，如何影响了卡尔纳普早期以更具分析性的方法取代形而上学所作的努力。
