      Dilthey conceives of most of the human sciences as analyzing human interactions at a level that can mediate between individual initiative and communal tradition. These sciences deal with what he calls “cultural systems” and “external organizations of society”. Cultural systems are associations that individuals join voluntarily for certain purposes that they can only achieve through cooperation. These systems are cultural in the widest possible sense and include all aspects of our social life. They can be political, economic, artistic, scientific or religious in nature and are not normally bound by national or other overarching interests. External organizations of society by contrast are those more controlling institutional structures like a family and a state that we are born into. Here “enduring causes bind the wills of many into a single whole” (1883/SW.I, 94) within which relations of power, dependence and property can be established. It is important to cross-reference cultural systems and institutional organizations. Enlightenment thinkers had focused on cultural systems such as scientific academies and their potential universal scope while overlooking how most educational institutions are controlled by local authorities. Although Dilthey received his training from members of the Historical School, he recognized that many of them had been equally one-sided by stressing the distinctive institutional organizations that separate different peoples while ignoring the role of generalizations made possible through the analysis of cultural systems.
    step1: 狄尔泰把大部分精神科学设想为在能够中介个体主动性与共同体传统之间那个层面上分析人类交互。这些科学处理他所谓的“文化系统”与“社会的外部组织”。文化系统是个体为某些只有通过合作才能达到的目的而自愿加入的联合体。这些系统在最广的意义上是文化的，涵盖我们社会生活的一切方面。它们在性质上可以是政治的、经济的、艺术的、科学的或宗教的，通常不受民族或其他总体利益的约束。相比之下，社会的外部组织是那些更具控制性的制度结构，如我们生于其中的家庭与国家。在这里，“持存的诸原因把许多意志结合成一个单一整体”（1883/SW.I, 94），权力、依附与财产的关系可以在其中建立。把文化系统与制度组织相互参照是重要的。启蒙思想家曾聚焦于科学学院这类文化系统及其潜在的普遍范围，却忽视大多数教育机构如何受地方当局控制。虽然狄尔泰受训于历史学派成员，但他认识到，他们中的许多人同样片面：强调区分不同民族的独特制度组织，而忽视经由文化系统分析所可能的概括的作用。
    step2: 在狄尔泰那里，大部分精神科学是在一个能够中介个体主动性与共同体传统的层面上分析人类交互。这些科学处理的，是他所谓的“文化系统”与“社会的外部组织”。文化系统是个体出于某些唯有合作方能达成的目的而自愿加入的联合体；这些系统在尽可能最广的意义上是文化的，囊括我们社会生活的一切方面，性质上可为政治的、经济的、艺术的、科学的或宗教的，通常不受民族或其他凌驾性利益的约束。社会的外部组织则相反，是那些更具控制性的制度结构，如我们生于其中的家庭与国家。在这里，“持存的诸原因把许多意志结合成一个单一整体”（1883/SW.I, 94），权力、依附与财产的关系得以在其中确立。文化系统与制度组织必须相互参照。启蒙思想家曾聚焦于科学学院一类文化系统及其潜在的普遍性，却忽视大多数教育机构如何受地方当局控制；狄尔泰虽受训于历史学派门下，却也看出该派许多人同样片面：强调区分各民族的独特制度组织，而无视经由文化系统分析而成为可能的概括之作用。
