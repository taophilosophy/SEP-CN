      This new hermeneutic perspective that approaches the inside from the outside also alters Dilthey’s conception of psychic structure. In the first of three “Studies Toward the Foundation of the Human Sciences” dating from 1904–9, Dilthey considers what linguistic expressions can teach us about the intentionality of consciousness. No longer merely explicating the breadth of psychic life through the interweavings of acts of cognition, feeling and willing, Dilthey uses expressions such as “I am worried about something” to disclose the referential structure of a lived experience. Psychic acts have contents that are related to the objects of the world by means of what Dilthey calls attitudinal stances. These judgmental attitudes toward the world are
    step1: TBD
