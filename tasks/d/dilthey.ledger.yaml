      These are 1) descriptive and historical statements, 2) theoretical generalizations about partial contents and 3) evaluative judgments and practical rules. The human sciences are more obviously normative in nature than the natural sciences for which formal norms related to objective inquiry suffice. The fact that the human sciences are forced to confront substantive normative issues puts a limit on the kind of theoretical regularities that can be established in the human sciences. Given the core role that human beings play in the socio-historical world, the understanding of individuality is as important in the human sciences as are the explanations to be found through generalizations.
    step1: |-
      这三类是：1) 描述性与历史性的陈述，2) 关于部分内容的理论概括，3) 评价性判断与实践规则。精神科学在本性上比自然科学更明显是规范性的；对自然科学而言，与客观探究相关的形式规范就已足够。精神科学被迫直面实质性规范问题，这一事实限制了能在其中建立的那些理论规律性的种类。鉴于人类在社会—历史世界中所扮演的核心角色，对个体性的理解在精神科学中与通过概括找到的说明同样重要。
    step2: |-
      三类分别是：1) 描述性与历史性陈述；2) 关于部分内容的理论概括；3) 评价性判断与实践规则。精神科学在本性上比自然科学更明显地带有规范性：自然科学只需与客观探究相关的形式规范即可。精神科学不得不直面实质性的规范问题，这一事实限制了能在其中确立的理论规律性的种类。鉴于人在社会—历史世界中占据核心位置，对个体性的理解在精神科学中的重要性，不亚于经由概括获得的说明。
