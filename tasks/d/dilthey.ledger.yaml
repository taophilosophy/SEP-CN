      The more facts that explanations seek to correlate, the more limited their scope must be. Thus the laws to be discovered in the human sciences will apply not to history in general, but only to specific cultural systems or institutional organizations. It may be possible to arrive at causal laws of economic growth, of scientific progress or of literary development, but not at overarching historical laws of human progress.
