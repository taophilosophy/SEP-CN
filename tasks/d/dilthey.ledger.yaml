      心理生活不是由离散要素综合地构造出来的，而是一个始终已经在从内部不断分化自身的连续体。通过描述与分析这个连续体，狄尔泰展示出其范围的广度与深度，并把它阐明为一个结构关联。当他考虑这一联系的时间性展开时，他进一步规定了它的合目的性。尽管心理生活的认知与意愿子系统可以设定外在目的，情感与整体心理联系却显示出康德所谓无确定目的的合目的性。整体获得的心理联系展示出一种目的论，它不设定任何把此前诸阶段都要归摄于其下的最终 *telos*。心理生活的合目的性是内在的、适应性的，而非外在的、被预先决定的。我们生命的每个阶段都可以被理解为一个有其独特价值的时代。
