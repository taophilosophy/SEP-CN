      A nation-state is a composite institutional organization that contains and shapes many socio-cultural productive systems which then generate certain commonalities. When socio-cultural systems transcending the scope of a nation come into contact with local productive systems, they also begin to assume commonalities distinctive of that nation. In the individual members of a nation-state these commonalities can produce a sense of solidarity. But Dilthey also warns of excesses in that regard when he notes that many Germans are “placing the highest value ... not in the serene world-view of the Greeks, not in the intellectually delimited consideration of purpose of the Romans, but in the raw exertion of power without any limit” (1910/SW.III, 196).
    step1: |-
      民族国家是一个复合的制度组织，它包含并塑造许多社会文化作用系统，后者继而产生某些共同性。当超越民族范围的社会文化系统与地方作用系统接触时，它们也开始带有该民族的独特共同性。在民族国家的个别成员身上，这些共同性可以产生一种团结感。但狄尔泰也警告这方面的过度，当他注意到许多德国人“把最高价值……不放在希腊人宁静的世界观之中，不放在罗马人智识上有节制的目的考量之中，而是放在毫无节制的权力的赤裸行使之中”（1910/SW.III, 196）。
