      While the kind of epistemology (*Erkenntnistheorie*) established by Kant and others suffices for the natural sciences, the human sciences require a more full-blooded theory of knowledge (*Theorie des Wissens*). Knowledge is to be “distinguished from a mere representation, presumption, question, or assumption by the fact that a content appears here with a sense of objective necessity” (1904–9/SW.III, 27–28). This objective necessity is to be located in the evidentness that accompanies thinking that is properly executed and reaches its goal whether through the self-given reality of lived experience or the “givenness that binds us to an outer perception” (1904–9/SW.III, 28).
