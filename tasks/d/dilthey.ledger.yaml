      The same non-transcendent perspective on religion is to be found in Dilthey’s last essay, written during the final days of his life in 1911 while he was on vacation in the Dolomites. This essay on “The Problem of Religion” points to the fact that the Enlightenment has made it increasingly difficult to acknowledge the mystical aspects of religious experience. Enlightenment thinkers regarded mystical experience as irrational. But according to Dilthey, Schleiermacher was able to avoid this charge of irrationalism by relating core aspects of religious experience to the insights of transcendental philosophy. Instead of interpreting the mystical feeling of communion as an esoteric union with a transcendent God, Schleiermacher explicates it as a general awareness that is attuned to the invisible coherence of things down here (1911/SW.VI,304–05). He gives a transcendental reading of what is intuited and felt in the religious mood by transforming it into a creative life-principle. Whereas traditionally mysticism tended to devalue our life in this world, Schleiermacher’s mysticism is seen as affirming it.
    step1: |-
      对宗教的同样非超越视角，见于狄尔泰最后一篇文章，写于 1911 年他生命最后的日子、在多洛米蒂度假期间。这篇论“宗教问题”的文章指出：启蒙运动使承认宗教经验的神秘面向变得越来越困难。启蒙思想家把神秘经验视为非理性的。但按狄尔泰的看法，施莱尔马赫通过把宗教经验的核心面向与先验哲学的洞见关联起来，得以避开非理性主义之责。施莱尔马赫不是把共融的神秘感受解释为与超越上帝的秘传合一，而是把它阐发为一种对尘世万物不可见之连贯性的普遍意识（1911/SW.VI,304–05）。他对宗教心境中被直观、被感受的东西作出先验解读，将其转化为一种创造性的生命原则。传统神秘主义倾向于贬低我们在此世的生命，而施莱尔马赫的神秘主义则被视为对它的肯定。
