      To the extent that rules can guide the understanding of the objectifications of life they make possible a theory of interpretation. Hermeneutics is the theory of interpretation that relates to all human objectifications—that is, not only speech and writing, but also visual artistic expressions, more casual physical gestures as well as observable actions or deeds.
