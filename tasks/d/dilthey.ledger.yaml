      This new, more descriptive structural approach is inaugurated in the essay “The Origin of Our Belief in the Reality of the External World and Its Justification” of 1890. Here Dilthey writes that the structure of all psychic life consists of impressions “evoking purposive reactions in the system of our drives and the feelings connected with them” (1890a/SW.II, 14). Rather than basing our initial sense of an external world on theoretical inferences from effects to causes, he roots it in a felt resistance to the will. But resistance must be internalized as a restraint of a volitional intention for it to signify the existence of something independent. Thus Dilthey is not merely replacing a representational phenomenalism with a direct perceptual realism. Each perceptual process has “an inner side” that involves “an energy and affective tone deriving from inner strivings that connect it to our own life” (1890a/SW.II, 14). All aspects of our own life are brought into play as we respond to the world.
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      In 1894 Dilthey published his “Ideas for a Descriptive and Analytic Psychology” and established how it differs from traditional explanative psychologies. He admits that even a descriptive psychology will seek to explicate the causal relationships of life, but that it must differ from explanative psychology by not trying to “derive a comprehensive and transparent cognition of psychological phenomena from a limited number of univocally determined elements” (1894/SW.II, 116). Unlike the associationists, Dilthey will not posit simple, stable impressions that are then combined into more complex ideas. They introduce unnecessary hypothetical elements into the foundation of psychology.
