      The initial response to Dilthey’s descriptive psychology was mixed. Hermann Ebbinghaus wrote an extended review which claimed that Dilthey still relies on hypotheses and that the differences between explanative and descriptive psychologies are minimal. Dilthey defended his position by showing that he never meant to banish explanative hypotheses from psychology altogether, merely from its descriptive foundations. Husserl later expressed his regret that the Ebbinghaus review deflected him from reading this “genial” anticipation of phenomenology until much later.
    step1: TBD
