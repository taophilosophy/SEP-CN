    kind: body
    source: |-
      The early Dilthey conceived his goal as a broadening of the critical project that would ground the human sciences as Kant had grounded the natural sciences. His hope then was that the human sciences would be able to arrive at lawful explanations just like the natural sciences. Up until at least 1887, when he published his *Poetics*, Dilthey was confident that inner explanations of human creativity could be arrived at. He himself formulated three laws of the imaginative metamorphosis to account for the uplifting effect that poets can have on us. Dilthey summarizes them as the laws of exclusion, intensification, and completion. Even in ordinary experience images are transformed by excluding what is no longer of interest and intensifying what remains based on our present interests. But what distinguishes poetic imagery is that it is also completed by the overall life-concerns of a powerful psyche.
    step1: |-
      早期狄尔泰把自己的目标设想为扩展批判事业：像康德为自然科学奠基那样，为精神科学奠基。他当时的希望是，精神科学也能像自然科学那样达到合规律性的说明。至少到 1887 年出版《诗学》时，狄尔泰仍确信可以达到对人类创造力的内在说明。他本人提出了想象变形的三条法则，以解释诗人何以能对我们产生提升作用。狄尔泰把它们概括为排除法则、强化法则与补全法则。即便在日常经验中，意象也在被变形：排除不再令人感兴趣的东西，并基于当下的兴趣强化留存下来的东西。但诗性意象的特殊之处在于，它还被一个强大心灵的整体生命关切所补全。
    step2: |-
      早期狄尔泰把自己的目标设想为扩展批判事业：像康德为自然科学奠基那样，为精神科学奠基。他当时希望，精神科学也能像自然科学一样达到合规律性的说明。至少到 1887 年出版《诗学》时，狄尔泰仍确信可以达到对人类创造力的内在说明。他本人提出想象变形的三条法则，用来解释诗人何以能给我们带来提升作用，并概括为排除、强化与补全三条法则。即便在日常经验中，意象也在被变形：排除不再令人感兴趣的东西，并依据当下的兴趣强化留存下来的东西。诗性意象的特殊之处在于，它还被一个强大心灵的整体生命关切所补全。
  - id: 8
    kind: body
    source: |-
      Through his efforts to work out a kind of *gestaltist* psychology that could frame this third law of imaginative completion, Dilthey came to modify some of his basic assumptions. He came to realize that the overall psychic nexus of an individual was not a sufficient contextual frame to explain human experience. Our experience can only be understood by describing it as it as a continuum that is gradually acquired over time. What he calls the “acquired psychic nexus” is itself historically embedded in a social world. This means that our access to history is much more direct than our access to nature. We feel ourselves as part of history whereas nature has come to increasingly stand apart from us. Although Dilthey is still willing to accept that objects of outer experience are phenomenal, he no longer accepts the Kantian thesis that the contents of inner experience are phenomenal as well. Inner experience is reconceived as lived experience *(Erlebnis)* that is real and the time that relates us to history is not merely the ideal form that Kant had exposited for nature.
    step1: |-
      通过努力发展一种能够为想象补全这第三条法则提供框架的格式塔心理学，狄尔泰修正了自己的一些基本假定。他逐渐认识到，个体的整体心理联系并不足以充当解释人类经验的语境框架。我们的经验只能被描述为一种随时间逐渐获得的连续体，才能得到理解。他所谓的“获得的心理联系”本身历史地嵌入一个社会世界之中。这意味着，我们通向历史的通道远比通向自然的通道直接。我们感到自己是历史的一部分，而自然则越来越独立于我们而立。尽管狄尔泰仍愿意接受外经验的对象是现象性的，但他不再接受康德的下述论题：内经验的内容同样是现象性的。内经验被重新设想为真实不虚的体验（*Erlebnis*），而把我们与历史联系起来的时间，也不只是康德为自然所阐发的那种理念形式。
    step2: |-
      为了给想象补全这第三条法则提供框架，狄尔泰努力发展一种格式塔心理学，并由此修正了自己的一些基本假定。他逐渐认识到，个体的整体心理联系不足以充当解释人类经验的语境框架。我们的经验只有被描述为一种随时间逐渐获得的连续体，才能得到理解。他所谓的“获得的心理联系”，本身历史地嵌入一个社会世界之中。这意味着，我们通往历史的通道远比通往自然的通道直接：我们感到自己属于历史，而自然则越来越独立于我们而立。狄尔泰仍愿意承认外经验的对象是现象性的，但不再接受康德的下述论题——内经验的内容同样是现象性的。内经验被重新设想为真实不虚的体验（*Erlebnis*），而把我们与历史联系起来的时间，也不只是康德为自然所阐发的那种理念形式。
