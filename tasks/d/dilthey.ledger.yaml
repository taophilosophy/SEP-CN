      Dilthey followed family tradition by starting his university studies at Heidelberg in theology. There he was also introduced to the philosophical systems of the idealists by Kuno Fischer. Because Fischer was accused of being a pantheist, his right to teach was withdrawn in 1853. Dilthey then moved to the University of Berlin, where he came under the influence of two of Friedrich Schleiermacher’s students, Friedrich Adolf Trendelenburg and August Boeckh. Increasingly, Schleiermacher became the focus of Dilthey’s interests. In 1859 he was asked to complete the editing of Schleiermacher’s letters. That year the Schleiermacher Society also organized an essay competition. Dilthey’s submission entitled “Schleiermacher’s Hermeneutical System in Relation to Earlier Protestant Hermeneutics” (1860, SW.IV, 33–227), was awarded the first prize and led to a second commission, namely, to write Schleiermacher’s biography. The first volume of this biography was published in 1870. It places Schleiermacher not only in his theological setting but also in the context of the literary and philosophical movements astir in Berlin from 1796 to 1807. The work displays Dilthey’s own expanding interests in aesthetical and philosophical issues. He also wrote his dissertation on Schleiermacher’s ethics.
    step1: |-
      狄尔泰遵循家族传统，在海德堡大学以神学开始大学学业。在那里，库诺·费舍还向他介绍了观念论者们的哲学体系。由于费舍被指控为泛神论者，他于 1853 年被撤销任教权。狄尔泰于是转到柏林大学，在那里受到施莱尔马赫的两位学生（弗里德里希·阿道夫·特伦德伦堡与奥古斯特·伯克）的影响。施莱尔马赫日益成为狄尔泰兴趣的焦点。1859 年，他被邀完成施莱尔马赫书信的编辑工作。同年，施莱尔马赫学会还组织了一次征文比赛。狄尔泰的应征论文《施莱尔马赫的诠释学系统及其与早期新教诠释学的关系》（1860, SW.IV, 33–227）获得头奖，并由此获得第二项委托，即撰写施莱尔马赫的传记。这部传记的第一卷于 1870 年出版。它不仅把施莱尔马赫置于其神学语境之中，也把他置于 1796 至 1807 年间柏林涌动的文学与哲学运动的语境之中。这部著作显示出狄尔泰本人对美学与哲学问题不断扩展的兴趣。他还以施莱尔马赫的伦理学为题撰写了自己的博士论文。
