      > *The conditions* sought by the *mechanistic explanation* of nature explain only *part of the contents of external reality*. This intelligible world of atoms, ether, vibrations, is only a calculated and highly artificial abstraction from what is given in outer and lived experience. (1883/SW.I, 203)
