  - id: 4
    kind: body
    source: |-
      Wilhelm Dilthey was born in Biebrich on the Rhine in 1833, two years after Hegel had died. Dilthey’s ambivalent attitude towards Hegel can provide some initial clues about his own philosophical approach. He admired Hegel’s recognition of the historical dimension of philosophical thought, but rejected the speculative and metaphysical ways he developed this relation. Like the Neo-Kantians, Dilthey proposed a return to the more focused viewpoint of Kant, but not without also taking account of the higher emancipatory aspirations and broader perspectives of later thinkers such as Fichte, Herder, and Hegel.
    step1: |-
      威廉·狄尔泰 1833 年生于莱茵河畔的比布里希，时值黑格尔去世两年之后。狄尔泰对黑格尔的矛盾态度，可以为我们提供关于他本人哲学取径的最初线索。他钦佩黑格尔对哲学思想之历史维度的承认，但拒绝黑格尔阐发这一关系时所采取的思辨与形而上学方式。与新康德主义者一样，狄尔泰主张回到康德更为集中的视角，但并非不同时顾及费希特、赫尔德与黑格尔等后来思想家更高的解放抱负与更广的视野。
    step2: |-
      威廉·狄尔泰 1833 年生于莱茵河畔的比布里希（Biebrich），彼时黑格尔去世不过两年。狄尔泰对黑格尔的矛盾态度，为理解他本人的哲学取径提供了最初线索：他钦佩黑格尔承认哲学思想的历史维度，却拒绝其阐发这一关系时的思辨与形而上学方式。与新康德主义者一样，狄尔泰主张回到康德更为集中的视角，但也并未因此不顾费希特、赫尔德与黑格尔等后来者更高的解放抱负与更开阔的视野。
  - id: 5
    kind: body
    source: |-
      Dilthey characterized his own expansive view of philosophy as one of establishing integral relations to all the theoretical disciplines and historical practices that attempt to make sense of the world. Instead of demarcating the boundaries that set philosophy apart from other ways of engaging life, Dilthey conceives its critical task as articulating the overall structures that define the human spirit in general. Relatively early in his career, philosophy is defined as “an experiential science of spiritual phenomena” that seeks to “cognize the laws governing social, intellectual and moral phenomena” (1867/GS.V, 27). Philosophy should aim to preserve the scope that idealists such as Fichte, Schelling and Hegel had given it, but it must do so by recapturing the Kantian rigor that had been lost and by proceeding empirically.
    step1: |-
      狄尔泰把自己那种开阔的哲学观刻画为：与所有试图理解世界的理论学科和历史实践建立完整的关系。狄尔泰不去划定把哲学与其他介入生活的方式区分开来的边界，而是把哲学的批判任务设想为阐明总体上规定人类精神的诸整体结构。在职业生涯的较早阶段，哲学被界定为“精神现象的经验科学”，它试图“认识支配社会的、智识的与道德的现象的诸规律”（1867/GS.V, 27）。哲学应当力求保存费希特、谢林与黑格尔等观念论者赋予它的范围，但必须通过重获已然丧失的康德式严格性、并经验地推进来做到这一点。
    step2: |-
      狄尔泰对自己那种开阔哲学观的刻画是：哲学要与一切试图理解世界的理论学科和历史实践建立完整的关系。他不划界线、不把哲学与其他介入生活的方式隔开，而是把哲学的批判任务理解为：阐明总体上规定人类精神的诸整体结构。早在职业生涯初期，他就把哲学界定为“精神现象的经验科学”，其目标是“认识支配社会的、智识的与道德的现象的诸规律”（1867/GS.V, 27）。哲学应当保住观念论者（费希特、谢林与黑格尔）曾赋予它的广度，但要以重获已失的康德式严格、并以经验方式推进为条件。
