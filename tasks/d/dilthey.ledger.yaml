      Feelings as attitudes allow us to evaluate the world. Our values express adjudicative attitudes based on feeling. Although the setting of purposes is grounded in the lived experience of values, the life of feelings has an immanent teleology that does not require it to go over into the desire to act. The structural nexus of willing is thus different from that of feeling. There are many feelings that evoke further feelings rather than the impulse to do something in response to them. A feeling of suffering can for instance elicit a kind of self-pity that spreads the suffering and elicits a “distinctively mellow” (1904–9/SW.III, 76) mood that immobilizes.
