      Some of these refinements incorporated into Dilthey’s descriptive program were inspired by reading Husserl’s *Logical Investigations* (1900–01). Dilthey specifically follows Husserl in his account of how language contributes to “significative apprehension” (1904–9/SW.III, 60). In reading words we do not represent them as mere sets of letters but fulfill their meaning by representing their objects. There is a triadic structural relation between the intuitive content of a linguistic expression, an act that gives it meaning, and the object that embodies that meaning as what is expressed. But whereas Husserl’s phenomenology focused in the conceptual structures of objective apprehension, Dilthey gives equal attention to the felt structures of what he calls “objective having” (1904–9/SW.III, 66). In objective apprehension we progress from attitude to objects, in objective having we regress from objects to attitude. This regressive turn from the outside to the inside is brought to bear on how feelings are to be interpreted. “ Whether we feel our own state or some object, it involves only a state of being as a kind of attitude…. The way this state of being depends on outer objects or on the state of the subject is obscured through an inverse attitude that loses itself in the depth of the subject” (1904–9/SW.III, 69). Instead of regarding feelings merely as subjective states such as pleasure or displeasure, they can be interpreted as attitudes that assess what is given in consciousness as either furthering or diminishing one’s state of being in the world. Feelings can be added to our earlier list of attitudes.
    step1: |-
      纳入狄尔泰描述纲领的这些精炼，有些受到阅读胡塞尔《逻辑研究》（*Logical Investigations*，1900–01）的启发。狄尔泰特别追随胡塞尔关于语言如何促成“意指性把握”（1904–9/SW.III, 60）的说明。在阅读语词时，我们不把它们表象为纯粹的字母集合，而是通过表象它们的对象来充实它们的意义。在一个语言表达的直观内容、一个给予它意义的行为与一个体现该意义作为所表达者的对象之间，存在一种三重的结构关系。但胡塞尔的现象学聚焦于客观把握的概念结构，狄尔泰则同等地关注他所谓“客观拥有”（1904–9/SW.III, 66）的被感受的结构。在客观把握中，我们从态度进至对象；在客观拥有中，我们从对象回溯至态度。这种从外部到内部的回溯转向被用于感受应如何解释的问题。“无论我们感受的是自己的状态还是某个对象，它都只涉及作为一种态度的存在状态……这种存在状态依赖于外在对象或主体状态的方式，由于一种迷失于主体深度的逆反态度而被遮蔽”（1904–9/SW.III, 69）。感受不必被视为快乐或不快这类主观状态，而可以被解释为这样一些态度：它们把意识中被给予者评估为促进或减损我们在此世的存在状态。感受可以添加到我们前面的态度清单之中。
    step2: |-
