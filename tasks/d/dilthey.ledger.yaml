      另一种批评来自新康德主义者，他们中的大多数人想让哲学与心理学彻底分家。1894 年，巴登学派的新康德主义者威廉·文德尔班发表演讲，声称心理学与历史科学没有真正的关联，应当被视为一门自然科学而非精神科学。文德尔班认为心理学与自然科学一样寻求规律，而历史研究则关注独特的样式。于是他提出，自然科学是法则论的，历史的或文化的科学是表意论的。狄尔泰反过来拒绝文德尔班的区分，表明许多自然科学具有表意论的要素，而语言学、经济学等许多精神科学具有法则论的目标。此外，狄尔泰论证说，对单个历史数据的描述只有被理解于规律性的框架之中才变得有意义：“系统性精神科学最本质的特征是 *一般者与个别者的联系*”（1895–6/SW.II, 227）。不仅普遍的考量与表意论的特殊性同样重要，而且对个体性的理解若不参照某个更广的语境也是不可能的。
