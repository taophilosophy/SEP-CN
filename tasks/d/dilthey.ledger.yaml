      This second phase of Dilthey’s thought is characterized by a stress on the reality of lived experience and on the immediate understanding of human life that this makes possible. It is in the “Ideas for a Descriptive and Analytic Psychology” of 1894 that Dilthey works out his explanation-understanding distinction. “We explain through purely intellectual processes, but we understand through the cooperation of all the powers of the mind activated by apprehension” (1894/SW.II, 147). The human sciences will henceforth be conceived as primarily concerned with understanding the meaning of human action and interaction. Also central to this second phase of Dilthey’s thought is the essay “The Origin of Our Belief in the Reality of the External World and Its Justification” of 1890. Our initial access to the external world is not inferential, but is felt as resistance to the will. The world of lived experience is not merely a theoretical representation, but is directly present to us as embodying values that are relevant to our purposes. The stress on feeling and immediacy in this second phase amounts to a rejection of Hegel’s dialectical approach.
    step1: |-
      狄尔泰思想的这一第二阶段以强调体验的实在性以及由此变得可能的对人类生活的直接理解为特征。正是在 1894 年的《描述与分析心理学观念》中，狄尔泰形成了他的说明—理解区分。“我们通过纯智性的过程来说明，但理解则通过领会所激活的心灵全部力量的合作来进行”（1894/SW.II, 147）。从此以后，精神科学将被设想为主要关乎对人类行动与互动之意义的理解。对这一第二阶段同样核心的，是 1890 年的论文《我们对外部世界实在性的信念的起源及其证成》。我们对外部世界的最初通达不是推理性的，而是被感受为对意志的抵抗。体验的世界不只是一个理论表象，它直接当下在场，体现着与我们目的相关的价值。这一第二阶段对感受与直接性的强调，等于拒绝黑格尔的辩证进路。
    step2: |-
      狄尔泰思想第二阶段的特征，是强调体验的实在性，以及由此开启的对人类生活的直接理解。正是在 1894 年的《描述与分析心理学观念》里，狄尔泰形成了他的说明—理解之分：“说明凭借纯智性的过程；理解则依靠领会所激活的心灵全部力量的合作”（1894/SW.II, 147）。从此，精神科学将被设想为主要关乎人类行动与互动之意义的理解。对这一阶段同样核心的，是 1890 年的论文《我们对外部世界实在性的信念的起源及其证成》：我们对外部世界的最初通达并非推论，而是被感受为对意志的抵抗。体验的世界不只是一个理论表象，它直接当下在场，体现着与我们目的相关的价值。这一阶段对感受与直接性的强调，无异于对黑格尔辩证进路的拒绝。
  - id: 11
    kind: body
    source: |-
      If the first phase was characterized by a search for inner explanations and the second phase by direct understanding, the third phase can be characterized by the need for interpretation. This final phase can be said to span the last decade of Dilthey’s life until his death in 1911. It begins with the realization in the essay “The Rise of Hermeneutics” of 1900 that the inner intelligibility of lived experience does not yet constitute full understanding. Self-understanding must also be mediated from without. The way we express ourselves, whether in communication or in action, is a crucial intermediary in defining ourselves. Understanding can only be reliable if it proceeds through the interpretation of human objectifications. Thus we properly understand ourselves not through introspection but through historical contextualization. It is in this last phase of his thought that Dilthey, who now occupied the chair that Hegel had once held in Berlin, revives his predecessor’s theory of objective spirit as the medium relating us to the past. In 1906 Dilthey published a seminal work on the young Hegel – *Die Jugendgeschichte Hegels* – that made use of recently discovered theological and political fragments. These unknown early fragments disclosed Hegel’s historical geniality before it became constrained by the dialectical systematization that Dilthey had always objected to. Dilthey’s student Herman Nohl was helpful in deciphering some of these fragments and went on to publish them. Nohl also edited a volume of Dilthey’s writings on the history of German Idealism going back to Kant, Beck and Fichte and leading up to such contemporaries of Hegel as Schelling, Schleiermacher, Schopenhauer and Fries.
    step1: |-
      如果说第一阶段以寻求内在说明为特征，第二阶段以直接理解为特征，那么第三阶段可以以解释的需要为特征。这最后的阶段可以说贯穿狄尔泰生命的最后十年，直至他 1911 年去世。它始于 1900 年的论文《诠释学的兴起》中所达到的认识：体验的内在可理解性尚不构成充分的理解。自我理解还必须从外部得到中介。我们表达自身的方式，无论在交流中还是在行动中，都是界定我们自身的关键中介。只有通过解释人的各种客观化，理解才能是可靠的。因此，我们恰当地理解自己，不是通过内省，而是通过历史语境化。正是在他思想的这最后阶段，此时已居黑格尔当年在柏林的教席的狄尔泰，复兴了他前任的客观精神理论，把客观精神作为把我们与过去关联起来的媒介。1906 年，狄尔泰出版了一部关于青年黑格尔的开创性著作《黑格尔的青年史》（*Die Jugendgeschichte Hegels*），利用了新近发现的神学与政治残篇。这些未知的早期残篇揭示了黑格尔的历史天才在受到辩证体系化约束之前的面貌，而那种体系化正是狄尔泰一贯反对的。狄尔泰的学生赫尔曼·诺尔（Herman Nohl）在解读其中一些残篇上出了力，并随后将其发表。诺尔还编了一部狄尔泰论德国观念论史的文集，上溯康德、贝克与费希特，下及黑格尔的同代人谢林、施莱尔马赫、叔本华与弗里斯。
    step2: |-
