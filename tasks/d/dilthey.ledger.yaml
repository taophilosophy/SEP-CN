      The human sciences must hold on to the original presence of this directly known reality even as they proceed to use the intellectual tools of conceptual cognition in their analysis of partial contents. The way the historical world is represented and analyzed must in some way still reflect the way history has been lived. The final understanding (*Verstehen*) aimed at by Dilthey’s human sciences must draw on all our capacities and is to be distinguished from the mere intellectual and abstract understanding (*Verstand*) of Kant’s natural sciences.
    step1: TBD
    step2: TBD
  - id: 37
