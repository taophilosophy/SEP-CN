      We can see certain parallels with Dilthey’s attempt to replace metaphysical systems with more informal life-based “meta-physical reflection” or worldviews in the young Rudolf Carnap, who studied in Jena with Dilthey’s student Herman Nohl before moving to Vienna. Carnap’s paper “The Elimination of Metaphysics Through Logical Analysis of Language” refers to Dilthey and his students as positive counterexamples to varieties of meaningless metaphysical systems as found in Fichte, Hegel and Heidegger. Another essay by Carnap entitled “Metaphysics as Expression of an Attitude to Life” acknowledges the importance of Dilthey’s notion of “*Lebensgefuehl*.” Carnap’s analogue for Dilthey’s “*Weltanschauung*” is “*Weltauffassung*.” Carnap also incorporated a more or less Diltheyan conception of the human sciences in his *Der logische Aufbau der Welt* of 1928. Carnap refers to Dilthey’s *Introduction to the Human Sciences*, but replaces its language of “facts of consciousness” with that of “elementary experiences.” He does not refer to Dilthey’s last main work *Der Aufbau der geschichtlichen Welt in den Geisteswissenschaften*, but he did read Hans Freyer’s *Theorie des objektiven Geistes*, a work heavily influenced by Dilthey’s *Aufbau* and its reinterpretation of objective spirit as the medium of intersubjective communication. Carnap writes in his own *Aufbau*:
