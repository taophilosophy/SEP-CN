      All of Dai’s works can be categorized into these five areas. For example, his *Illustrated Research on Artisans’ Records* fits under the Xuelipian, his *Commentaries on the Water Classic* belong under Shuidipian, and his *Evidential Commentary on the Meaning of Terms of the Mencius* falls under *Yuanshanpian*. The relationship between these five areas can be inferred from Dai’s methodology, by which evidential learning is the means to discover the *dao*. Research in the first four areas serves as the foundation for work in the fifth (philosophy).[^note-2]
