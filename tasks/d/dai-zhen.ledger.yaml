  - id: 8
    kind: body
    source: |-
      Dai thus established his methodology for understanding the *dao* of the ancient sages before the age of 20 (or in 1742), when he met Jiang Yong 江永 (1681–1762), a renowned scholar specializing in the *Three Ritual Classics* and an expert in calendrical studies, mathematics, and phonology, who later became his teacher (Cai 2006: 3–27)[^cai-2006]. Before turning 30 (in 1752), Dai completed several original works in philology, mathematics, phonology, and classical commentary. The most notable of these were *Kaogongjitu* 考工記圖 (*Illustrated Research on Artisans’ Records*) and his initial emendations of the Shujingzhu 水經注 (*Commentaries on the Water Classic*). In the former, he created precise diagrams of the ancient tools discussed in the Kaogongji 考工記 (*Research on Artisans’ Records*) of the Zhouli 周禮 (*The Rites of Zhou*). Later archaeological discoveries confirmed the accuracy of some of Dai’s illustrations. During Dai’s lifetime, an ancient bell was discovered that matched an illustration in his work (DZQS 7, 187). In his work on the *Water Classic*, Dai attempted to distinguish the canonical text of the Shuijing from its commentaries (zhu 注). Because the two had been intermingled in transmission, the text of the *Water Classic* had become incomprehensible. Dai’s initial emendations provided new insights into reading the text. When he arrived at the capital in 1754, these early achievements earned him attention and recognition among renowned scholar-officials, such as Ji Yun 紀昀 (1724–1805), Qian Daxin 錢大昕 (1728–1804), and Zhu Yun 朱筠 (1729–1781) (DZQS 7, 144–8).
    step1: |-
      因此，戴震在二十岁之前（即 1742 年）——他遇见江永（1681–1762）之时——便确立了自己理解古代圣贤之道的方法论。江永是研究《三礼》的著名学者，兼精历算、数学与音韵之学，后来成为戴震的老师（Cai 2006: 3–27）[^cai-2006]。三十岁之前（1752 年），戴震已在训诂学、数学、音韵学与经典注释方面完成了若干原创著作。其中最著名的是《考工记图》以及对《水经注》的初步校勘。在前一部著作中，他为《周礼》之《考工记》所论的古代器物绘制了精确图示。后来的考古发现证实了戴震部分图示的精确性：戴震在世时，出土过一件与书中图示相合的古钟（DZQS 7, 187）。在《水经》研究著作中，戴震试图区分《水经》经文与其注文的界限。由于两者在流传中互相窜乱，《水经》经文已变得难以通读。戴震的初步校勘为读通此书提供了新见解。1754 年他抵京师时，这些早期成就为他赢得了纪昀（1724–1805）、钱大昕（1728–1804）、朱筠（1729–1781）等著名士大夫的注意与推重（DZQS 7, 144–8）。
