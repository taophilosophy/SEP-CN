      Given the connections Dai draws between moral norms and virtues and well-being, understood as the satisfaction of wants and feelings, some scholars have suggested that his normative ethics bears a strong similarity to indirect utilitarianism (see Hu 1963; Zheng 2015; Carleo forthcoming)[^zheng-2015]. Others have argued that Dai does not see moral virtue as determined purely by how much it maximizes well-being and so his stance is not appropriately characterized as utilitarian (Tiwald forthcoming-b). Insofar as Dai may be applying the concept of self-so patterns (*li*) as a foundational evaluative concept, his ethics may be structurally unlike any form of consequentialism (Fraser forthcoming). How best to characterize Dai’s normative ethical stance remains a disputed question.
    step1: |-
      鉴于戴震在道德规范与德和福祉——即欲与情之满足——之间建立的联系，一些学者提出其规范伦理学与间接功利主义高度相似（见 Hu 1963; Zheng 2015; Carleo forthcoming）[^zheng-2015]。另一些学者则论证：戴震并不认为道德德性纯粹由其最大化福祉的程度决定，故其立场不宜以功利主义刻画（Tiwald forthcoming-b）。鉴于戴震或许正把自然之理当作基础评价概念来运用，其伦理学在结构上可能不同于任何形式的后果主义（Fraser forthcoming）。如何最佳刻画戴震的规范伦理立场，仍是一个有争议的问题。
