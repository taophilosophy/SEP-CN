    source: |-
      The blood-and-*qi* produce *yu* 欲, or “bodily wants” (*Sz* 8, 30). Yu is often interpreted as “desire”, but for Dai it has a narrower scope. You can have a desire to be a doctor or a desire that your favorite team win the football game, but to Dai these attitudes are not “*yu.*” In his psychology, yu refers only to craving (*ai* 愛) or avoiding (*wei* 畏) sounds, colours, smells, and tastes and to cherishing life and fearing death (*huaisheng weisi* 懷生畏死, *Sz* 21, 30). Dai’s use of *yu* is thus closer to “basic wants” than to “desires”. Since such wants issue from the blood-and-*qi*, not the heart-mind’s understanding, they are roughly the same for all persons. (For further discussion, see Tiwald 2010a.)[^tiwald-2010a]
    step1: |-
      血气产生欲——即“身体之欲”（Sz 8, 30）。欲常被解读为“desire”（欲望），但在戴震那里其范围更窄。你可以有当医生的欲望，或希望自己喜欢的球队赢球的欲望，但在戴震看来这些态度都不是“欲”。在他的心理学中，欲仅指对声音、颜色、气味与味道的渴爱（ai，爱）或畏避（wei，畏），以及怀生畏死（huaisheng weisi，Sz 21, 30）。因此，戴震所用之“欲”更接近“基本之欲”而非“欲望”。既然这类欲出于血气而非心知之知，它们对所有人而言大体相同。（进一步讨论见 Tiwald 2010a。）[^tiwald-2010a]
