      This verification problem was already recognized in the Confucian tradition prior to the rise of Qing “evidential scholarship”. Yu Yingshih has influentially argued that Qing scholarship is a continuation of the demand for a “return to the source” arising from unresolved metaphysical disputes between the Cheng-Zhu and Lu-Wang schools in the Song and Ming dynasties. This demand dates back to the sixteenth century, when Luo Qinshun 羅欽順 (1465–1547) insisted that philosophy must be grounded in the Classics (Yu 1996: 21, 91). Wang Yangming 王陽明 (1472–1529) also appealed to the old text of the Great Learning (*Daxue guben* 大學古本) to defend his interpretation of the dao. The paradigm of Qing scholarship was established by Gu Yanwu 顧炎武 (1613–1682), who asserted that “the proper study of patterns (*li* 理) is the study of the classics” (*jingxue ji lixue* 經學即理學) (Yu 2016: 91, 114–6). Gu believed that understanding the Classics required knowledge of phonology. More broadly speaking, the *dao* could be known only through evidential learning, which comprises phonology, geography, astronomy, and so on. According to Gu, scholars aim to bring order to the world, which requires understanding the *dao*. This understanding is impossible without classical research (Qian 2011: 146)[^qian-2011]. By the eighteenth century, scholars were so focused on evidential learning that they neglected philosophy.
    step1: |-
      这个验证问题在清代“考证之学”兴起之前的儒家传统中就已被认识到。余英时令人信服地论证：清代学术是“回归本源”这一要求的延续，而这一要求源于宋明两代程朱与陆王两派之间悬而未决的形而上争论。这一要求可上溯至十六世纪，罗钦顺（1465–1547）当时坚称哲学必须奠基于经典（Yu 1996: 21, 91）。王阳明（1472–1529）也曾援引《大学古本》（Daxue guben）的旧本来为其对道的诠释辩护。清代学术的典范由顾炎武（1613–1682）确立，他断言“经学即理学”（jingxue ji lixue）（Yu 2016: 91, 114–6）。顾炎武认为，理解经典需要音韵学知识；更宽泛地说，道只能通过考证学——包括音韵学、地理学、天文学等等——来认识。在顾炎武看来，学者以经世为志，这需要理解道；而离开经典研究，这种理解便不可能（Qian 2011: 146）[^qian-2011]。到十八世纪，学者们如此专注考证学，以至于忽视了哲学。
