      In conducting this reflection, the indicator of whether we could or could not accept the treatment we are considering is our “feelings” (*qing* 情), specifically, according to Dai’s moral psychology, the misery or comfort we feel in response to the joy, anger, sorrow, or delight incited by our interactions with things. Again, this role of feelings is why Dai thinks many Song- and Ming-dynasty Confucians were terribly mistaken to hold that ethical cultivation requires minimizing or eliminating wants (or desires) and feelings. Only because we have wants do we have feelings, and feelings are the basic data we work from to discover pattern. Without these wants, the mechanism for sympathetic concern cannot function (see Tiwald 2010a)[^tiwald-2010a].
    step1: |-
      进行这种反思时，判断我们能否接受所考虑之对待的指标，是我们的“情”（qing）：按戴震的道德心理学，具体说，即我们与事物交接所激起的喜怒哀乐在我们身上引起的惨或舒。又是这一点——情的作用——解释了戴震为何认为许多宋明儒者错得厉害：他们主张道德修养要求把欲（或欲望）与情减至最小或消除。只因有欲，我们才有情；情是我们发现理时所依据的基本材料。没有这些欲，恻隐关切这一机制便无法运作（见 Tiwald 2010a）[^tiwald-2010a]。
