      Before his unexpected death, Dai completed what he considered his greatest work, the philosophical masterpiece *Mengzi Ziyi Shuzheng* 孟子字義疏證 (*Evidential Commentary on the Meaning of Terms in the Mencius*). He spent over a decade revising this book, possibly starting as early as 1765, and completed the first draft in 1772, when he feigned illness to take leave and write it. Various early drafts were circulated among his friends and associates, resulting in many different versions. For instance, Dai’s *Xuyan* 緒言 (*Prologue*) is believed to be one of the early drafts of the *Evidential Commentary*. Dai’s dedication to revising this work stemmed from a writing principle he adopted from Fang Muru 方楘如: “Being good at composing is not as good as being good at revising, and being good at revising is not as good as being good at deleting” (DZQS 7, 204). The *Evidential Commentary* was meant to be part of an ambitious project Dai was unable to finish, to be called Qijing Xiaoji 七經小記 (*Remarks on the Seven Classics*). The “seven classics” referred to the *Odes* (Shi 詩), *Documents* (Shu 書), *Rites* (Li 禮), *Changes* (Yi 易), *Annals* (Chunqiu 春秋), *Analects*, and *Mencius*, which Dai believed jointly conveyed the dao. The *Remarks* was to be divided into five parts, approaching the seven classics from five perspectives, namely
