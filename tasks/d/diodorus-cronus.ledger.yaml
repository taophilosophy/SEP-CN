      > For the partless body must be surrounded in a partless place, and it moves (*kinētai*) neither in that place (for it fills it, and it is necessary that a thing which will move has a place larger than it), nor a place that it is not in. For it [the body] is not yet in that place in order that it [the body] might move in it [the place]. Thus it does not move (Sextus, *M*10,86 = Döring 123 (part); my translation drawing on Bury).
    step1: TBD
    step2: TBD
