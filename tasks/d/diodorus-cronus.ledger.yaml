    source: |-
      Diodorus’ date of death is easier to establish than his date of birth. David Sedley has shown that Diodorus died in Alexandria around 284BCE (Sedley 1977, 80)[^sedley-1977], a date now generally accepted (Sorabji 1980, 106; Algra 1999, 52; Duncombe 2023)[^algra-1999][^duncombe-2023][^sorabji-1980]. Diodorus was teaching in Athens in the 310s BCE, where we know he taught Zeno of Citum, founder of Stoicism, and Philo the Logician, Diodorus’ colleague in the Dialectical school. The sceptic Arcesilaus arrived in Athens around 295BCE and was at least influenced by Diodorus, if not directly taught by him. When Ptolemy Soter (d. 282–3) began to draw Greek intellectuals to Alexandria, it seems Diodorus joined them. In Alexandria, Diodorus was sufficiently well known that Callimachus could feature him in epigrams. Callimachus himself did not arrive in Alexandria until 290–85. We know from Diogenes Laertius (DL, 2, 111–2) that Diodorus died during the reign of Ptolemy Soter, so before 283–2. If Diodorus died in Alexandria, it cannot have been before 290 and was probably after 285, but before 283–2, making 284 a reasonable conjecture.
    step1: |-
      狄奥多罗斯的卒年比生年更容易确定。戴维·塞德利已论证狄奥多罗斯于公元前 284 年左右卒于亚历山大里亚（Sedley 1977, 80）[^sedley-1977]，这一年代如今被普遍接受（Sorabji 1980, 106; Algra 1999, 52; Duncombe 2023）[^algra-1999][^duncombe-2023][^sorabji-1980]。公元前 310 年代狄奥多罗斯在雅典讲学，我们知道他在那里教过斯多亚主义创始人、基提翁的塞诺，以及辩证学派中他的同侪麦加拉的菲洛。怀疑论者阿尔凯西劳约于公元前 295 年抵达雅典，他至少受了狄奥多罗斯的影响，纵非直接受教于他。当托勒密一世·救主（Ptolemy Soter，卒于公元前 282–283 年）开始把希腊知识分子吸引到亚历山大里亚时，狄奥多罗斯似乎也加入了他们。在亚历山大里亚，狄奥多罗斯声名足以使卡利马科斯（Callimachus）能在警句诗中写到他。卡利马科斯本人直到公元前 290–285 年才抵达亚历山大里亚。我们从第欧根尼·拉尔修（DL 2, 111–2）得知狄奥多罗斯死于托勒密·救主在位期间，即公元前 283–282 年之前。若狄奥多罗斯死于亚历山大里亚，则不早于公元前 290 年，且大概在公元前 285 年之后、公元前 283–282 年之前——由此，公元前 284 年是一个合理的推测。
    step2: |-
      狄奥多罗斯的卒年比生年易于确定。戴维·塞德利（David Sedley）已论证狄奥多罗斯约于公元前 284 年卒于亚历山大里亚（Sedley 1977, 80）[^sedley-1977]；这一年代如今被普遍接受（Sorabji 1980, 106; Algra 1999, 52; Duncombe 2023）[^algra-1999][^duncombe-2023][^sorabji-1980]。公元前 310 年代狄奥多罗斯在雅典讲学：据我们所知，他在那里教过斯多亚主义创始人基提翁的塞诺，也教过辩证学派中他的同侪麦加拉的菲洛。怀疑论者阿尔凯西劳约于公元前 295 年抵达雅典；纵非直接受教于狄奥多罗斯，他至少受了其影响。当托勒密一世·救主（Ptolemy Soter，卒于公元前 282–283 年）开始把希腊知识分子吸引到亚历山大里亚时，狄奥多罗斯似乎也加入了他们。在亚历山大里亚，狄奥多罗斯声名之盛，足使卡利马科斯（Callimachus）在警句诗中写到他。卡利马科斯本人直到公元前 290–285 年才抵达亚历山大里亚。据第欧根尼·拉尔修（DL 2, 111–2），狄奥多罗斯卒于托勒密·救主在位期间，即公元前 283–282 年之前。若狄奥多罗斯死于亚历山大里亚，其卒年便不早于公元前 290 年，且大概在公元前 285 年之后、公元前 283–282 年之前——公元前 284 年由此成为一个合理的推测。
