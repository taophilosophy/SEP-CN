    source: |-
      Diodorus Cronus (died circa 284 BCE) was a figure widely known and admired in antiquity, for his dialectical skills, contributions to the study of logic and his philosophical views. Recent philosophy and scholarship have engaged with his Master Argument and his modal system, but other aspects of his thought, including a version of atomism, arguments against change, ambiguity, singular reference and past-tense statements, have been relatively neglected. Debates over his affiliation have played an important role in the historiography of post-classical Greek philosophy, in particular whether there was a Dialectical school, of which Diodorus would be a principal representative.
    step1: TBD
    step2: TBD
  - id: 2
    kind: body
    source: |-
      ## 1. Biography
    step1: TBD
    step2: TBD
  - id: 3
    kind: body
    source: |-
      Diodorus was born in Iasos, a city in ancient Caria, on the west coast of modern-day Turkey. Iasos had been part of the Delian league during the Peloponnesian war (431–404BCE) and Diodorus studied dialectic with a minor teacher Apollonius Cronus, a native of Cyrene. Diodorus inherited the nickname, ‘Cronus’, from Apollonius. ‘Cronus’ seems to have meant ‘old codger’ (Plato *Euthydemus* 287b), although it may also have implied ‘cunning’ (Döring 1972, 124; Muller 1985, 128; Iliad II 205; Odyssey XXI, 415; Hesiod *Theogony* 18)[^döring-1972][^muller-1985][^döring-1972-2][^muller-1985-2]. Apollonius had studied with Eubulides of Miletus, a student of Euclides of Megara. Euclides was a long-standing member of the Socratic circle (*Phaedo* 59b-c; *Theaetetus* 142a-143b).
    step1: TBD
    step2: TBD
  - id: 4
    kind: body
    source: |-
      Diodorus’ date of death is easier to establish than his date of birth. David Sedley has shown that Diodorus died in Alexandria around 284BCE (Sedley 1977, 80)[^sedley-1977], a date now generally accepted (Sorabji 1980, 106; Algra 1999, 52; Duncombe 2023)[^algra-1999][^duncombe-2023][^sorabji-1980]. Diodorus was teaching in Athens in the 310s BCE, where we know he taught Zeno of Citum, founder of Stoicism, and Philo the Logician, Diodorus’ colleague in the Dialectical school. The sceptic Arcesilaus arrived in Athens around 295BCE and was at least influenced by Diodorus, if not directly taught by him. When Ptolemy Soter (d. 282–3) began to draw Greek intellectuals to Alexandria, it seems Diodorus joined them. In Alexandria, Diodorus was sufficiently well known that Callimachus could feature him in epigrams. Callimachus himself did not arrive in Alexandria until 290–85. We know from Diogenes Laertius (DL, 2, 111–2) that Diodorus died during the reign of Ptolemy Soter, so before 283–2. If Diodorus died in Alexandria, it cannot have been before 290 and was probably after 285, but before 283–2, making 284 a reasonable conjecture.
    step1: TBD
    step2: TBD
  - id: 5
    kind: body
    source: |-
      Aside from the historical interest, dating Diodorus death to the mid-280s makes it extremely unlikely that Aristotle (c.384-322) was influenced by Diodorus. Even if Diodorus had an exceptionally long career of 50 years, starting, say in 334BCE, his active period barely overlaps with Aristotle’s lifetime. Diodorus did use technical language we find in Aristotle’s writings and some of his arguments follow Aristotle’s closely, so it seems possible that Didodorus had access to Aristotle’s texts, presumably while they were still in circulation before the death of Theophrastus (Falcon 2014)[^falcon-2014]. But given that Diodorus must have been relatively young, it seems that an influence would have been from Aristotle to Diodorus.
    step1: TBD
    step2: TBD
  - id: 6
    kind: body
    source: |-
      Diodorus was traditionally thought to be part of the Megaric school, founded by Euclides of Megara. However, the scholarly consensus is now that Diodorus was part of a separate Dialectical School. Diodorus is described in our most reliable sources as a ‘dialectician’ (or ‘Dialectician’), and it is only very late that we have evidence that he was called a ‘Megaric’ (Denyer 2002)[^denyer-2002], although it is possible that Chrysippus termed certain paradoxes developed by Diodorus ‘Megaric questions’ (Döring 1989, 297; Ebert 2008, 279; Allen 2018, 36–37)[^allen-2018][^döring-1989][^ebert-2008]. For detailed discussion of this issue, see the entry on the Dialectical School.
    step1: TBD
    step2: TBD
  - id: 7
    kind: body
    source: |-
      ## 2. Metaphysics
    step1: TBD
