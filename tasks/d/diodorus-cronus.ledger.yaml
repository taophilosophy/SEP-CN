      It is hard not to agree with Sedley that this is one of Diodorus’ ‘feebler efforts’ (Sedley 1977, 92)[^sedley-1977]. As Sextus points out (*M* 10, 118) the Sorites-style argument can barely start, since with the addition of one non-moving part, there are two moving and two non-moving parts and so P4 is false, and that must be because P3 is false too. What’s more, it is hard to see why predominant change precedes all-out change. One approach to this question distinguishes the transitive and intransitive senses of ‘changes’. There is a sense of ‘unchanging’ which is the opposite of the transitive ‘$a$ changes $b$’. That is, ‘$a$ is unchanging’ would mean ‘a is not changing something else (but could itself be changed). Opposite to the intransitive ‘$a$ changes’ would be ‘$a$ is not itself changing’. Diodorus could answer Sextus objection if we take the first sense of unchanging to be at stake throughout the argument. A two-part body with two parts changing something else and one not changing anything else, but open to being changed, is changing by predominance. It has, as it were, two changing parts and one ‘free rider’ not contributing to the change, but not inhibiting it either. Adding further free riders will not inhibit the change. But still, it seems absurd to say that a body composed of 9998 free riders not contributing to the change and two doing all the changing, is changing by predominance.
