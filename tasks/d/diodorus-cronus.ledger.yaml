      However, Denyer rejects this as a reconstruction of Diodorus motivation (Denyer 1981a, 35–36)[^denyer-1981a]. The atomism that results from the above argument is not Diodorean atomism, since it allows simples that are of different sizes. Suppose that you have two objects of different sizes at the last moment of time. Neither will be further divided. So, both are simples. But, by hypothesis, each has a different size. But, according to Denyer, Diodorean simples are not only small, but also all have the same size. If two simples had different sizes, one would be equal in size to a part of the other. But this is not allowed, since neither have parts. So, all simples have the same size.
    step1: TBD
    step2: TBD
