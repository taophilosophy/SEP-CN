      Even with this caveat, MA1 needs careful formulation. Martha Kneale (Kneale 1937)[^kneale-1937] introduced three classes of counterexample to MA1 into this literature, but her contribution is sometimes overlooked. These counterexamples are cases where a past truth seems to become false. But a past truth that can become false is not a necessary truth. The first class of counter examples are past negative existentials. (i) ‘There has never been a female Labour UK Prime Minister’. This is a past truth, but it could become false, if the UK elects a female Labour Prime Minister. The second class are past temporal distance. (ii) ‘Socrates died 2422 years ago’ is a past truth in 2023, but will be a past falsehood from 2024 onwards. Kneale’s third class are past definite descriptions, such as (iii) ‘The UK Prime Minister who completed a PhD was Scottish’. Should the UK elect another holder of a doctorate, this would become false.
    step1: |-
      即便有这一保留，MA1 仍需仔细表述。玛莎·尼尔（Kneale 1937）[^kneale-1937] 向这一文献引入了三类针对 MA1 的反例，但她的贡献有时被忽视。这些反例是过去真理似乎变成假的那些情形。但一个能变成假的过去真理不是必然真理。第一类反例是过去的否定存在命题。(i)“英国从未有过女性工党首相。”这是一个过去真理，但如果英国选出一位女性工党首相，它就可能变成假。第二类是过去的时间距离。(ii)“苏格拉底死于 2422 年前”在 2023 年是一个过去真理，但从 2024 年起将是一个过去假理。尼尔氏的第三类是过去的限定摹状词，如 (iii)“完成过博士学位的英国首相是苏格兰人”。若英国选出一位拥有博士学位的首相，这就会变成假。
