      Lots of sources point to intense debate in our period on the nature of conditionals. An epigram of Callimachus jokes that the debate was so widespread that even the crows on the rooftops were cawing about it (Sextus *M1* 309.4–7 = Döring 128 (part))! What remains of this rich debate is somewhat murky, but it does allow us to make some informed interpretations of Diodorus’ views on the conditional. The main source is again, Sextus (*PH* 110–112), who distinguishes four conditionals in order of strength: Philo’s, Diodorus’, Connection (which was probably Chrysippus’ on the evidence of DL 7 73) and Meaning. Sextus orders the conditionals in terms of logical strength, but it unclear which was the first to arise chronologically (*pace* (Sedley 1977, 101)[^sedley-1977]. It may be that Philo’s arose first, and was refined in response to something like the paradoxes of material implication.
    step1: |-
      大量文献指向我们这一时期关于条件句本性的激烈争论。卡利马科斯的一则警句开玩笑说，这场争论如此普遍，乃至屋顶上的乌鸦都在为此聒噪（塞克斯都 *M1* 309.4–7 = Döring 128（部分））！这场丰富争论的残存部分有些模糊，但它确实使我们能够对狄奥多罗斯的条件句观点作出一些有根据的诠释。主要文献仍是塞克斯都（*PH* 110–112），他按强度顺序区分了四种条件句：菲洛式、狄奥多罗斯式、联结式（据 DL 7 73 的证据，这大概是克吕西波的）与意义式。塞克斯都按逻辑强度排列这些条件句，但何者按年代先出现并不清楚（与 Sedley 1977, 101[^sedley-1977] 相反）。或许菲洛式先出现，并针对实质蕴涵悖论之类的东西而被改进。
