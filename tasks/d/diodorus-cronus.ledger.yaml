    source: |-
      The Master Argument is sometimes thought to be an argument for fatalism (see the relevant section of the entry on [fatalism](https://plato.stanford.edu/entries/fatalism/#LogiFataDiodCronNecePast), the discussion of the Master Argument in the entry on the Dialectical School and the entry on [Arthur Prior](https://plato.stanford.edu/entries/prior/#OrigTensLogi)). Sometimes it is thought to be an argument for Diodorus’ account of possibility. Sometimes (including by Epictetus at *Discourses*, 2.18,17) it is thought to be a paradox or sophism to be solved. These are not exclusive options. Taken as a sophism we can see the argument as a trilemma, or a demonstration that the three premises are inconsistent and so one must be rejected. Diodorus could then be seen to reject the third, to yield his account of possibility. Diodorus account of possibility was taken in antiquity to yield a form of fatalism, since only what is now or will be true is possible (Alexander *In An. Pr.* 183.34 – 184.10). That is, anything not true now or in the future is impossible. I’m not a lawyer and never will be; so, according to Diodorus definition of possibility, it is not merely false, but also impossible that I be a lawyer.
    step1: |-
      主论证有时被认为是一个为宿命论辩护的论证（见宿命论词条的相关部分、辩证学派词条中对主论证的讨论，以及阿瑟·普赖尔词条）。有时它被认为是一个为狄奥多罗斯可能性概念辩护的论证。有时（包括爱比克泰德在《论说集》2.18, 17 中）它被认为是一个有待解决的悖论或诡辩。这些选项并不互斥。作为一个诡辩，我们可以把这个论证看作一个三难，或一个表明三个前提不一致、故必须拒绝其一的证明。如此一来，狄奥多罗斯可以被看作拒绝了第三个前提，从而得出其可能性概念。狄奥多罗斯的可能性概念在古代被认为导向一种宿命论，因为只有现在为真或将为真者才是可能的（亚历山大《前分析篇注》183.34–184.10）。也就是说，凡现在不真且将来也不真者皆不可能。我不是律师，将来也永远不会是；所以按狄奥多罗斯的可能性定义，我是一名律师不仅为假，而且是不可能的。
    step2: |-
