      Diodorus is sometimes attributed a ‘Humpty Dumpty’ view of language, where ‘words mean what I take them to mean’ (Nawar 2021, 610 cites Ammonius *In De Int.* 38.17–22; Simplicius *In Cat*. 27.18–21)[^nawar-2021], but the evidence suggests that Diodorus is only committed to something weaker, namely, that no term is ambiguous, that is no term has more than one meaning (cf. Aristotle’s *Categories* 1a1–15 and Atherton 1993, 153)[^atherton-1993]. ‘Kid’ can mean an immature goat or a young human. Here we get a sketch of Diodorus’ reasoning in (Döring 111). The text distinguishes three claims:
    step1: |-
      狄奥多罗斯有时被归予一种“矮胖子”（Humpty Dumpty）式的语言观，即“词的意思就是我认为它有的意思”（Nawar 2021, 610 引阿莫尼俄斯《解释篇注》38.17–22；辛普里丘《范畴篇注》27.18–21）[^nawar-2021]，但证据只表明狄奥多罗斯承诺了某种更弱的东西，即没有词项是歧义的，也就是说没有词项具有多于一个意义（参亚里士多德《范畴篇》1a1–15 与 Atherton 1993, 153）[^atherton-1993]。“Kid”可以指一只未成年的山羊，也可以指一个年幼的人。这里我们在（Döring 111）中看到狄奥多罗斯推理的一个梗概。该文本区分了三个主张：
    step2: |-
      狄奥多罗斯有时被归予“矮胖子”（Humpty Dumpty）式语言观，即“词义就是我认定它有的意思”（Nawar 2021, 610 引阿莫尼俄斯《解释篇注》38.17–22；辛普里丘《范畴篇注》27.18–21）[^nawar-2021]；但证据只表明他承诺了更弱的主张：没有词项是歧义的，即没有词项具有多于一个意义（参亚里士多德《范畴篇》1a1–15、Atherton 1993, 153[^atherton-1993]）。“Kid”既可指未成年的山羊，也可指年幼的人。（Döring 111）给出了狄奥多罗斯推理的梗概，该文本区分三个主张：
