    kind: body
    source: |-
      These arguments against change of simples do not rule out change of complexes, since even if simples cannot change, it does not follow that wholes composed of complexes cannot change. Wholes may have properties their parts do not have. So Diodorus needs another argument against change for complexes. We have a detailed report of such an argument in Sextus (*M* 10, 114–17), known as the Predominance Argument. Diodorus did not simply argue that ‘simples cannot change; complexes are just unstructured bundles of simples; so, complexes cannot change’. He attempted a more ambitious argument that a whole cannot change because change cannot ‘transmit’ from parts to the whole. But it is difficult to make the argument intelligible and even remotely compelling (see (Hankinson 2015)[^hankinson-2015] and (Duncombe 2023)[^duncombe-2023] for differing attempts to make sense of this argument).
    step1: |-
      这些反对单纯者变化的论证并未排除复合物的变化，因为即便单纯者不能变化，也不能推出由复合物构成的整体不能变化。整体可以有部分所没有的属性。所以狄奥多罗斯需要对复合物的变化另作一个论证。我们在塞克斯都（*M* 10, 114–17）那里有一个关于此类论证的详细报道，即所谓的“优势论证”（Predominance Argument）。狄奥多罗斯并非简单地论证“单纯者不能变化；复合物只是单纯者的无结构堆束；所以复合物不能变化”。他试图作一个更有雄心的论证：整体不能变化，因为变化不能由部分“传递”到整体。但要使这一论证可理解、乃至勉强有说服力，是困难的（关于理解此论证的不同尝试，见（Hankinson 2015）[^hankinson-2015] 与（Duncombe 2023）[^duncombe-2023]）。
    step2: |-
      这些反对单纯者变化的论证并未排除复合物的变化：即便单纯者不变，也推不出由复合物构成的整体不变——整体可以有部分所无的属性。故狄奥多罗斯需另作一个针对复合物变化的论证。塞克斯都（*M* 10, 114–17）有一个关于此类论证的详细报道，即“优势论证”（Predominance Argument）。狄奥多罗斯并非简单论证“单纯者不能变化，复合物只是单纯者的无结构堆束，故复合物不能变化”；他试图作一个更有雄心的论证：整体不能变化，因为变化无法由部分“传递”到整体。然而要使该论证可理解、乃至勉强有说服力，颇为困难（理解此论证的不同尝试见 Hankinson 2015[^hankinson-2015] 与 Duncombe 2023[^duncombe-2023]）。
  - id: 144
    kind: body
    source: |-
      The overall argument says that for a whole to change, it must change all-out. But all-out change is impossible. So, a whole cannot change. Why is all-out change impossible? All out change is change of all the parts. It is impossible because all-out change entails predominant change, that is, change of most of the parts. But predominant change is impossible. Predominant change occurs when more than half of the parts are changing, but a few are resting. Diodorus subjects predominant change to a Sorites-style or little-by-little argument.
    step1: |-
      总体论证说：整体要变化，就必须全然大变（all-out change）。但全然大变是不可能的。所以整体不能变化。为什么全然大变不可能？全然大变是所有部分的变化。它之所以不可能，是因为全然大变蕴含优势变化，即大多数部分的变化。但优势变化是不可能的。优势变化发生在超过一半的部分正在变化、而少数部分静止之时。狄奥多罗斯使优势变化经受一个连锁式（Sorites）或逐步的论证。
    step2: |-
      总体论证是：整体若有变化，必是全然大变（all-out change）；而全然大变不可能，故整体不能变化。全然大变何以不可能？全然大变即一切部分皆变，它蕴含优势变化——多数部分之变化；而优势变化不可能。所谓优势变化，指过半部分在变、少数部分静止。狄奥多罗斯对优势变化施以一个连锁式（Sorites）即逐步的论证。
