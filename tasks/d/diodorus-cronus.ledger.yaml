    source: |-
      Diodorus was traditionally thought to be part of the Megaric school, founded by Euclides of Megara. However, the scholarly consensus is now that Diodorus was part of a separate Dialectical School. Diodorus is described in our most reliable sources as a ‘dialectician’ (or ‘Dialectician’), and it is only very late that we have evidence that he was called a ‘Megaric’ (Denyer 2002)[^denyer-2002], although it is possible that Chrysippus termed certain paradoxes developed by Diodorus ‘Megaric questions’ (Döring 1989, 297; Ebert 2008, 279; Allen 2018, 36–37)[^allen-2018][^döring-1989][^ebert-2008]. For detailed discussion of this issue, see the entry on the Dialectical School.
    step1: |-
      传统上人们认为狄奥多罗斯属于麦加拉的欧克里德创立的麦加拉学派。然而，学界目前的共识是：狄奥多罗斯属于一个单独的辩证学派。在我们最可靠的文献中，狄奥多罗斯被描述为“辩证家”（或“辩证家”），而称他为“麦加拉派”的证据出现得很晚（Denyer 2002）[^denyer-2002]，尽管克吕西波可能把狄奥多罗斯所发展的某些悖论称作“麦加拉问题”（Döring 1989, 297; Ebert 2008, 279; Allen 2018, 36–37）[^allen-2018][^döring-1989][^ebert-2008]。关于这一问题的详细讨论，见辩证学派词条。
    step2: |-
      传统上人们认为狄奥多罗斯属于麦加拉的欧克里德所创的麦加拉学派。然而学界目前的共识是：狄奥多罗斯属于一个单独的辩证学派。在最可靠的文献中，狄奥多罗斯被描述为“辩证家”；称他为“麦加拉派”的证据出现得很晚（Denyer 2002）[^denyer-2002]，尽管克吕西波或许把狄奥多罗斯发展的某些悖论称作“麦加拉问题”（Döring 1989, 297; Ebert 2008, 279; Allen 2018, 36–37）[^allen-2018][^döring-1989][^ebert-2008]。此问题之详论见辩证学派词条。
