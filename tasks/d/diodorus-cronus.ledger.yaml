  - id: 3
    kind: body
    source: |-
      Diodorus was born in Iasos, a city in ancient Caria, on the west coast of modern-day Turkey. Iasos had been part of the Delian league during the Peloponnesian war (431–404BCE) and Diodorus studied dialectic with a minor teacher Apollonius Cronus, a native of Cyrene. Diodorus inherited the nickname, ‘Cronus’, from Apollonius. ‘Cronus’ seems to have meant ‘old codger’ (Plato *Euthydemus* 287b), although it may also have implied ‘cunning’ (Döring 1972, 124; Muller 1985, 128; Iliad II 205; Odyssey XXI, 415; Hesiod *Theogony* 18)[^döring-1972][^muller-1985][^döring-1972-2][^muller-1985-2]. Apollonius had studied with Eubulides of Miletus, a student of Euclides of Megara. Euclides was a long-standing member of the Socratic circle (*Phaedo* 59b-c; *Theaetetus* 142a-143b).
    step1: |-
      狄奥多罗斯生于雅索斯（Iasos），古代卡里亚的一座城市，位于今土耳其西海岸。伯罗奔尼撒战争（公元前 431–404 年）期间雅索斯是提洛同盟的成员；狄奥多师从一位次要的教师阿波罗尼俄斯·克罗诺斯（Apollonius Cronus，昔兰尼人）学习论辩术。狄奥多罗斯从阿波罗尼俄斯那里继承了“克罗诺斯”这一绰号。“克罗诺斯”似乎意为“老顽固”（柏拉图《欧绪德谟篇》287b），但也可能暗示“狡黠”（Döring 1972, 124; Muller 1985, 128; Iliad II 205; Odyssey XXI, 415; Hesiod *Theogony* 18）[^döring-1972][^muller-1985][^döring-1972-2][^muller-1985-2]。阿波罗尼俄斯曾师从米利都的欧布里德，而欧布里德是麦加拉的欧克里德的学生。欧克里德是苏格拉底圈子的资深成员（《斐多篇》59b–c；《泰阿泰德篇》142a–143b）。
    step2: |-
      狄奥多罗斯生于雅索斯（Iasos）——古代卡里亚的一座城市，在今土耳其西海岸。伯罗奔尼撒战争（公元前 431–404 年）期间雅索斯属提洛同盟；狄奥多罗斯师从一位次要教师、昔兰尼人阿波罗尼俄斯·克罗诺斯（Apollonius Cronus）学习论辩术，并从阿波罗尼俄斯那里继承“克罗诺斯”这一绰号。“克罗诺斯”似乎意为“老顽固”（柏拉图《欧绪德谟篇》287b），也可能暗示“狡黠”（Döring 1972, 124; Muller 1985, 128; Iliad II 205; Odyssey XXI, 415; Hesiod *Theogony* 18）[^döring-1972][^muller-1985][^döring-1972-2][^muller-1985-2]。阿波罗尼俄斯曾师从米利都的欧布里德，欧布里德则是麦加拉的欧克里德的学生。欧克里德是苏格拉底圈子的资深成员（《斐多篇》59b–c；《泰阿泰德篇》142a–143b）。
