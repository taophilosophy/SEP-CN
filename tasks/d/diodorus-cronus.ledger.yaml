      Simples are the basic constituents of of bodies, time, and space are ‘simples’ (*amerē*) (Döring 117F, Döring 120). Diodorus used the term amerē in his ontology (Döring 116). Diodorean simples are physically indivisible and metaphysically simple, in that it is not possible to divide them. In contrast, Epicurus held that atoms are physically indivisible, but could be divided into ‘conceptual’ parts, such as a top and a bottom. Diodorus denied that simples have such conceptual parts (Sedley 1977, 87; Denyer 1981a, 36–37; Döring 119; see also Döring 117A; Döring 117C; Döring 117D; Döring 117E)[^denyer-1981a][^sedley-1977]. Diodorus holds that there are partless minima of time and minima of space (Döring 120; Sextus *M*10,119). The consensus is now that Diodorus is committed to atomism about time (Denyer 1981a, 36–37; Muller 1988, 138; and Berryman 2016)[^denyer-1981a][^muller-1988], but this is rejected by Wehrli (1960, 5:63) and McKirahan (1979, 242).
    step1: |-
      单纯者是物体、时间与空间的基本构成单位，即“单纯者”（*amerē*）（Döring 117F, Döring 120）。狄奥多罗斯在本体论中使用了 *amerē* 一词（Döring 116）。狄奥多罗斯式单纯者在物理上不可分、在形而上学上单纯，即不可能分割它们。相比之下，伊壁鸠鲁认为原子在物理上不可分，但可以被分为“概念性”的部分，例如上端与下端。狄奥多罗斯否认单纯者有这类概念性部分（Sedley 1977, 87; Denyer 1981a, 36–37; Döring 119; 另见 Döring 117A; Döring 117C; Döring 117D; Döring 117E）[^denyer-1981a][^sedley-1977]。狄奥多罗斯主张存在无部分的时间极小者与空间极小者（Döring 120; 塞克斯都 *M*10,119）。目前的共识是：狄奥多罗斯承诺了关于时间的原子论（Denyer 1981a, 36–37; Muller 1988, 138; Berryman 2016）[^denyer-1981a][^muller-1988]，但此说为 Wehrli（1960, 5:63）与 McKirahan（1979, 242）所拒。
    step2: |-
      单纯者是物体、时间与空间的基本构成单位，即“单纯者”（*amerē*）（Döring 117F, Döring 120）；狄奥多罗斯在本体论中用了 *amerē* 一词（Döring 116）。其单纯者在物理上不可分、在形而上学上单纯——不可能被分割。相比之下，伊壁鸠鲁主张原子物理上不可分，却可分为“概念性”部分（如上端与下端）；狄奥多罗斯否认单纯者有此概念性部分（Sedley 1977, 87; Denyer 1981a, 36–37; Döring 119; 另见 Döring 117A; Döring 117C; Döring 117D; Döring 117E）[^denyer-1981a][^sedley-1977]。他主张存在无部分的时间极小者与空间极小者（Döring 120; 塞克斯都 *M*10,119）。目前的共识是：狄奥多罗斯承诺了关于时间的原子论（Denyer 1981a, 36–37; Muller 1988, 138; Berryman 2016）[^denyer-1981a][^muller-1988]；但 Wehrli（1960, 5:63）与 McKirahan（1979, 242）拒此说。
