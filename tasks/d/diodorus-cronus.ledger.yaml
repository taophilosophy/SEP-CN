      The solution may be to notice – with (Denyer 2009, 38–39)[^denyer-2009] who follows (Prior 1967)[^prior-1967] – that not every sentence that involves a past tense is a past-tense sentence. All three of Kneale’s cases are not past truths in the sense that the main operator of the sentence is a past-tense operator, but rather the main connective is either a negation or an existential quantifier. For example ‘There has never been a female Labour UK Prime Minister’ can be written as ‘It is not the case that there has been a female Labour UK Prime Minister’. This is formalised as ‘$\neg \langle P\rangle p$’ where ‘$p$’ is the present-tense sentence ‘there is a female Labour UK Prime Minister’ and ‘$\langle P\rangle$’ is the past-tense operator ‘it has been the case that…’. If (i) changes its truth value when a female Labour Prime Minister is elected, that is only because (i) is a present-tense negated sentence.
    step1: |-
      解决办法或许是注意——随（Denyer 2009, 38–39）[^denyer-2009] 而追随（Prior 1967）[^prior-1967]——并非每个涉及过去时态的句子都是过去时句子。尼尔的三类情形都不是过去真理——就其句子的主要算子为过去时算子而言；毋宁说，其主要联结词或为否定、或为存在量词。例如“英国从未有过女性工党首相”可以写作“并非曾经有过一位女性工党首相”。这被形式化为“$\neg \langle P\rangle p$”，其中“$p$”是现在时句子“存在一位女性工党首相”，“$\langle P\rangle$”是过去时算子“曾经是这种情况：……”。如果 (i) 在女性工党首相当选时改变了真值，那只是因为 (i) 是一个现在时的否定句。
