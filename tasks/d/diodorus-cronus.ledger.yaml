      This test works like this. To test whether $p$ is possible, suppose *p* is actual. If nothing impossible follows this supposition, $p$ is possible. I am sitting and we want to test whether it is possible that I stand. So, suppose I stand. If nothing impossible results from this supposition, it is possible that I stand. The problem is, stated as baldly as this, the test is underdetermined. I can apply the test making no accommodations: I am sitting in a room where no one is standing. And we want to test whether it is possible that I stand. So, suppose I stand. In that case, I am standing but also no one in this room is standing. This is a contradiction and so an impossibility. So it turns out that, according to the test, I cannot stand. It seems unreasonable to apply the test with no accommodation whatsoever, but also unreasonable to allow all accommodations by changing the truth-value of any proposition. If I’m maximally accommodating, only self-contradictory propositions turn out impossible. So we can hold some propositions as a fixed background for testing some *p*, for example, the necessary truths. The advantage of understanding MA2 in light of this test is that it gives a clear way to operationalize MA2 – using this idea of supposition- and also it is a conception of possibility shared by people like Aristotle who hold that some possibilities are not and never will be realized (although cf. Makin and Denyer 2000)[^makin-2000].
    step1: |-
      这一测试是这样运作的。要检验 $p$ 是否可能，就假设 *p* 是现实的。如果没有不可能者随这一假设而来，$p$ 就是可能的。我正坐着，而我们要检验我站着是否可能。于是，假设我站着。如果没有不可能者由这一假设产生，我站着就是可能的。问题在于，如此直白地陈述，这一测试是不确定的。我可以不作任何调适地应用该测试：我坐在一个无人站着的房间里。而我们要检验我站着是否可能。于是，假设我站着。在这种情况下，我站着，但房间里无人站着。这是矛盾，因而是不可能。所以按该测试，结果是我不能站。不作任何调适地应用该测试似乎不合理，但为了改变任何命题的真值而允许一切调适也同样不合理。如果我作最大限度的调适，只有自相矛盾的命题才会显得不可能。因此，我们可以把某些命题固定为检验某个 $p$ 的背景，例如必然真理。按这一测试理解 MA2 的好处在于：它给出了使 MA2 可操作的一种清晰方式——运用假设这一想法；而且它是一种亚里士多德这类人共有的可能性概念——他们认为有些可能性未被实现、也永远不会被实现（尽管参 Makin and Denyer 2000）[^makin-2000]。
