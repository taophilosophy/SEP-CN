      Diodorus’ argument is valid, but premises 2, 3 and 4 seem false. Premise 2 seems false because it is not exhaustive: a body may move from a place it occupies to a place it does not occupy. But appealing to his atomism, Diodorus could defend the premise. Moving from one place to another implies being partly in one place and partly in another in one moment. But since neither bodies, times or places have parts according to Diodorus, nothing can be partly in another at some moment. Premise 3 seems false because it seems rotary motion can take place in a place precisely the same size as the thing rotating. But, as Diodorus could argue, rotation depends on parts because the rotating thing has a vertical axis and some point which rotates around the vertical axis. But these would be separate parts to the rotating thing, which is blocked by Diodorus atomism. Finally, premise 4 seems doubtful: why should both simple body and simple place be the same size? (Denyer 1981a, 36)[^denyer-1981a] offers an ingenious argument that all simples are the same size. Suppose for reductio that two partless simples, $a$, and $b$, differ in size. In that case one must be larger than the other, say $a$ is larger than $b$. But if $a$ is larger than $b, b$ is the same size of a part of $a$. So $a$ has parts. But this contradicts our supposition.
    step1: TBD
