      Several responses are open to this. The first is that Diodorus only relies dialectically on bodies and spaces having the same size in his anti-change argument (see below). So he does not need to commit to all simple bodies having the same size. Second, it may be plausible that all simple bodies do have the same very small size, even on the above argument. Grains of sand on a beach, through a long process of erosion, are all small and roughly of the same size and shape. Given an arbitrarily long time, erosion would create arbitrarily small grains of arbitrarily similar size and shape. On some interpretations, Diodorus’ Master Argument needs an assumption that there is no first moment of time (Denyer, 1999). Roughly, if there were a first moment, at that moment, there are no past truths, including necessary past truths. So (MA1) would be false. But if there is no first moment of time, there is an arbitrarily long time for erosion to occur. So we have an indefinitely long time for such physical processes to act on all bodies. Denyer himself holds that Diodorean atomism is established by Diodorus arguments against motion and change (Denyer 1981a, 33)[^denyer-1981a]. But, since those arguments rely extensively on atomism, it is unclear whether these arguments could motivate atomism without begging the question.
