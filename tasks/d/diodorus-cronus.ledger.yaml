      Diodorean simples have location but also extension. Diodorus’ simples are ‘very small’ (Döring 117A; Döring 117C; Döring 117D; Döring 117E). Being small implies being extended. Likewise, simple spaces lack parts, but have extension. Several of Diodorus’ arguments assume simple spaces precisely the same size as simple bodies. If simple bodies are extended, so too are simple spaces. Finally, simple times lack parts, but have duration (Sorabji 1983, 19)[^sorabji-1983]. Although they lack parts, Diodorean simples have other properties, such as being ‘imperceptible’ (Döring 119). Diodorean simples have relational properties. A simple body occupies a simple space just in case the simple body is spatially located at that simple place. Likewise, a simple body exists at a simple time just in case the simple body is temporally located at that simple time. Simple places can relate to each other. For example, places can be ordered from first to second, and the same applies to simple times. This point is stressed by (Sorabji 1983, 369–70; Sextus *M*10,119–20)[^sorabji-1983]. Finally, simples can form complexes. In fact, they are the principles (*archai*) of complexes (Döring 116; Döring 117A; Döring 117C; Döring 117D; Döring 117E; Döring 117F).
    step1: |-
      狄奥多罗斯式单纯者有位置，但也有延展。狄奥多罗斯的单纯者是“非常小的”（Döring 117A; Döring 117C; Döring 117D; Döring 117E）。小意味着有延展。同样，单纯的空间缺乏部分，但具有延展。狄奥多罗斯的若干论证恰恰假定单纯空间与单纯物体同样大小。若单纯物体有延展，单纯空间亦然。最后，单纯的时间缺乏部分，但具有绵延（Sorabji 1983, 19）[^sorabji-1983]。狄奥多罗斯式单纯者虽然缺乏部分，却具有其他属性，例如“不可知觉”（Döring 119）。狄奥多罗斯式单纯者具有关系属性。一个单纯物体占据一个单纯空间，当且仅当该单纯物体在空间上位于那个单纯位置。同样，一个单纯物体在一个单纯时间存在，当且仅当该单纯物体在时间上位于那个单纯时间。单纯的位置可以彼此关联，例如位置可以从第一到第二排序，单纯时间亦然。这一点为（Sorabji 1983, 369–70; 塞克斯都 *M*10,119–20）[^sorabji-1983] 所强调。最后，单纯者可以构成复合物。事实上，它们是复合物的本原（*archai*）（Döring 116; Döring 117A; Döring 117C; Döring 117D; Döring 117E; Döring 117F）。
    step2: |-
      狄奥多罗斯式单纯者有位置，也有延展：其单纯者是“非常小的”（Döring 117A; Döring 117C; Döring 117D; Döring 117E），而小即意味着有延展。同样，单纯空间缺乏部分却有延展；狄奥多罗斯的若干论证恰假定单纯空间与单纯物体同大——若单纯物体有延展，单纯空间亦然。最后，单纯时间缺乏部分却有绵延（Sorabji 1983, 19）[^sorabji-1983]。单纯者虽无部分，却另有属性，如“不可知觉”（Döring 119）。它们还具关系属性：一个单纯物体占据一个单纯空间，当且仅当该物体在空间上位于那个单纯位置；同样，它在某一单纯时间存在，当且仅当它在时间上位于那个单纯时间。单纯位置可彼此关联——位置可从第一到第二排序，单纯时间亦然（此点为 Sorabji 1983, 369–70 与塞克斯都 *M*10,119–20 所强调）[^sorabji-1983]。最后，单纯者能构成复合物：事实上它们是复合物的本原（*archai*）（Döring 116; Döring 117A; Döring 117C; Döring 117D; Döring 117E; Döring 117F）。
