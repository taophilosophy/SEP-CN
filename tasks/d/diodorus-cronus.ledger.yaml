    source: |-
      Aside from the historical interest, dating Diodorus death to the mid-280s makes it extremely unlikely that Aristotle (c.384-322) was influenced by Diodorus. Even if Diodorus had an exceptionally long career of 50 years, starting, say in 334BCE, his active period barely overlaps with Aristotle’s lifetime. Diodorus did use technical language we find in Aristotle’s writings and some of his arguments follow Aristotle’s closely, so it seems possible that Didodorus had access to Aristotle’s texts, presumably while they were still in circulation before the death of Theophrastus (Falcon 2014)[^falcon-2014]. But given that Diodorus must have been relatively young, it seems that an influence would have been from Aristotle to Diodorus.
    step1: |-
      除了史学趣味之外，把狄奥多罗斯之死定年在公元前 280 年代中期，使亚里士多德（约公元前 384–322 年）受狄奥多罗斯影响的可能性变得极低。即使狄奥多罗斯享有长达 50 年的异常漫长的讲学生涯，比如始于公元前 334 年，其活跃时期与亚里士多德的一生也只是勉强重叠。狄奥多罗斯确实使用了我们在亚里士多德著作中看到的术语，他的某些论证也紧密追随亚里士多德，所以狄奥多罗斯有可能接触过亚里士多德的文本——大概是在泰奥弗拉斯托斯去世之前这些文本尚在流传之时（Falcon 2014）[^falcon-2014]。但鉴于狄奥多罗斯当时必然相对年轻，影响的方向似乎应当是从亚里士多德到狄奥多罗斯。
    step2: |-
      除史学趣味之外，把狄奥多罗斯之死定年在公元前 280 年代中期，使亚里士多德（约公元前 384–322 年）受狄奥多罗斯影响的可能性变得极低。即使狄奥多罗斯享有长达 50 年的异常漫长生涯——比如始于公元前 334 年——其活跃期与亚里士多德的一生也只是勉强重叠。狄奥多罗斯确实使用了亚里士多德著作中的术语，其某些论证也紧密追随亚里士多德；因此他可能接触过亚里士多德的文本——大概是在泰奥弗拉斯托斯（Theophrastus）去世之前、这些文本尚在流传之时（Falcon 2014）[^falcon-2014]。但鉴于狄奥多罗斯彼时必然相对年轻，影响的方向似乎应当是从亚里士多德到狄奥多罗斯。
