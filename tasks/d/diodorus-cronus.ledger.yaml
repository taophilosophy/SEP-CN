      These arguments against change of simples do not rule out change of complexes, since even if simples cannot change, it does not follow that wholes composed of complexes cannot change. Wholes may have properties their parts do not have. So Diodorus needs another argument against change for complexes. We have a detailed report of such an argument in Sextus (*M* 10, 114–17), known as the Predominance Argument. Diodorus did not simply argue that ‘simples cannot change; complexes are just unstructured bundles of simples; so, complexes cannot change’. He attempted a more ambitious argument that a whole cannot change because change cannot ‘transmit’ from parts to the whole. But it is difficult to make the argument intelligible and even remotely compelling (see (Hankinson 2015)[^hankinson-2015] and (Duncombe 2023)[^duncombe-2023] for differing attempts to make sense of this argument).
