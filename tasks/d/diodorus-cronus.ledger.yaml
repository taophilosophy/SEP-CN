      Diodorus’ atomism was instrumental in his arguments about change, but Diodorus attitude towards change was sophisticated. Diodorus denied that there is change in the present, but not that there was change in the past (Döring 121; Döring 122; Döring 123). Some have thought this position is incoherent, since past change entails present change at some time, an objection we will consider below. For now, consider how Diodorus defended the claim that there is no present change.
    step1: TBD
    step2: TBD
  - id: 111
    kind: body
    source: |-
      The traditional scholarly narrative has been that Diodorus responds to Zeno of Elea’s arguments, perhaps positing simples as a response to the Dichotomy paradox, but then arguing that, even in that case, motion is impossible (Sedley 1977, 85–86; Denyer 1981a, 40, 43; Sorabji 1983, 18, 369; and Muller 1985, 137)[^muller-1985][^denyer-1981a][^muller-1985-2][^sedley-1977][^sorabji-1983]. More recent scholarship has tried to show that Diodorus rejected not only motion but also present qualitative and existential change for both simples and complexes (Duncombe 2023)[^duncombe-2023]. A few examples should give a flavour of Diodorus strategy, which involves using his atomism to support his anti-change arguments. Here is an argument against present change of simples, attributed to Diodorus by Sextus Empiricus:
    step1: TBD
    step2: TBD
  - id: 112
    kind: body
