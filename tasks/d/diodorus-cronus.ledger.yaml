      ### 3.1 Conditionals
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      Lots of sources point to intense debate in our period on the nature of conditionals. An epigram of Callimachus jokes that the debate was so widespread that even the crows on the rooftops were cawing about it (Sextus *M1* 309.4–7 = Döring 128 (part))! What remains of this rich debate is somewhat murky, but it does allow us to make some informed interpretations of Diodorus’ views on the conditional. The main source is again, Sextus (*PH* 110–112), who distinguishes four conditionals in order of strength: Philo’s, Diodorus’, Connection (which was probably Chrysippus’ on the evidence of DL 7 73) and Meaning. Sextus orders the conditionals in terms of logical strength, but it unclear which was the first to arise chronologically (*pace* (Sedley 1977, 101)[^sedley-1977]. It may be that Philo’s arose first, and was refined in response to something like the paradoxes of material implication.
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      In any case, a conditional is true, according to Philo just in case ‘it does not begin with a truth and end with a falsehood’ (Sextus *PH* II 110. Translation Annas and Barnes, modified. Cf. *M* II 114). For example, ‘if it is day, I am conversing’, is true when both it is day and I am conversing. Philo is usually interpreted as articulating the modern material conditional (Sedley 1977, 101; Mates 1949, 234; Mates 1953, 43)[^mates-1949][^mates-1953][^sedley-1977]. That is, where ‘$\to$’ is the material conditional:
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      > **(PHILO)**
      >
      > ‘if $p$ then $q$’ is a true Philo conditional iff $(p$ $\to$ $q)$.
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      Sextus then tells us that Diodorus conditional is one that ‘neither could nor can begin from truth and end in falsehood’ (*PH* 2110 Trans. Annas and Barnes, modified. Cf. *M* 2.115).
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      > **(DIODORUS)**
      >
      > ‘if $p$ then $q$’ is a true Diodorean conditional iff it (i) neither was possible nor (ii) is possible that $(p$ & not$-q)$.
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
    source: |-
      Some scholars took Diodorus to be anticipating modern notions of strict implication (e.g. Hurst, 1935, 485). That view has been discredited, since the Diodorean conditional should be stronger than the strict conditional: ‘if $p$ then $q$’ is a true Diodorean conditional iff the proposition that $p$ now strictly implies the proposition that $q$ and the proposition that $p$ has always strictly implied the proposition that $q$. Instead, it is common to follow Mates (Mates 1949)[^mates-1949] and hold that a conditional holds in the Diodorean sense iff it holds in in Philo’s sense all times. That is where ‘$\to$’ represents the material conditional:
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      > **(ALL-TIME)**
      >
      > ‘if $p$ then $q$’ is a true Diodorean conditional iff at all times, $(p$$\to$$q)$.
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      So ‘if it is day, I am conversing’ turns out false, since there are times when ‘it is day’ is true, but ‘I am conversing’ is false (Cf. $M 2 115)$. One quibble with this common way to understand Diodorus’ conditionals is that Philo’s conditional is not obviously the material conditional, since ancient propositions tend to be tensed and the material conditional both is a tenseless proposition and conjoins tenseless propositions. A more serious difficulty with Mates’ reading is that it makes clause (ii) redundant. (i) on its own, read in line with Diodorean possibility, would yield the ALL-TIME conditional (as pointed out by Mates himself (Mates 1949, 238)[^mates-1949]). So why would Diodorus formulate his conditional with the redundant clause? Third, for Diodorus, if something is true at all times, it is necessarily true. So, for Diodorus the ALL-TIME conditional will just be a strict conditional. But we saw that Diodorus’ conditional should be stronger than the strict conditional. All this has led some to suggest that Diodorus’ conditional, while intended to be stronger that Philo’s, tried to be more neutral and so compatible with a range of views of possibility, each of which would yield different accounts of the conditional (Sedley 1977, 102)[^sedley-1977].
