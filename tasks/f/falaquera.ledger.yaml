      法拉库拉力图以希伯来文呈现希腊与伊斯兰哲学家最重要的著述。耐人寻味的是，他很少径直翻译一篇文本，也很少标明确切出处。《智慧之始》便是一个好例。他写此书的用意，是简要地处理“求智慧的人在学业之初需要领会的一切”（9）。全书分三部分。第一部分论道德德性——按法拉库拉的解释，“凡愿从事科学研究、领会其真理者，必须先让自己习惯于道德德性”（10）。这一部分把《圣经》经文与拉比格言同《亚历山大提要》的短段交织起来，末尾附一封伪亚里士多德书信。第二部分是科学的枚举，主体是法拉比《科学的枚举》（*Ihsâ’ al-‘ulûm*）的节本，但也吸纳了法拉比的其他著作（如《字母之书》（*Kitâb al-hurûf*）），以及阿维森纳《论理性科学之分科》（*Fî aqsâm al-‘ulûm al-‘aqliyyah*）的零星小节。法拉库拉把这些文本编进他自己的法拉比科学枚举版本，使之融贯成一部新著，补入底本所无的重要材料。比如，《智慧之始》第二部分第 2、4 章——“论语言如何起于一个民族”与“论科学如何起于人群”——即《字母之书》的两则选段——分别引出第 3 章论语言、第 5–9 章论逻辑与诸科学，即译自《科学的枚举》的各章。又一例：阿维森纳科学分科中论政治科学的一节，紧接法拉比的平行讨论，向读者给出传统的亚里士多德实践科学三分——治城、治家、治己（即伦理）。《智慧之始》第三部分论“哲学是达致真幸福所必需”，是法拉比论柏拉图与亚里士多德哲学三部曲的节译。在这一部分，法拉库拉只专注于眼前呈现的法拉比文本，不掺入别的文本；但凭对译与不译的精明取舍，他得以把这些作品调校得适合自己的目的。于是，他从改写中删去了法拉比那些关于哲学与宗教关系的争议性论断——例如：唯哲学*独*为人类幸福与完善所必需；宗教是哲学的模仿，可用于教化与治理大众，却无助于哲学家理智的完善（见 Harvey, “Falaquera’s Alfarabi”）。法拉库拉改写文本的另一个面向，是他偶尔“犹太化”其 sources——插入《圣经》或《塔木德》引文与指涉，或添加犹太材料。后者的例子见《智慧之始》第二部分开头：他在法拉比列举科学枚举诸益处之后加了一条——科学的枚举让人看清这些科学与《托拉》并不相悖，犹太人研习它们是许可的。还可以补一句：第二、三部分中他对法拉比诸书的希伯来节译并未署作者之名；法拉库拉只解释说，所有“这些论科学的言辞，都是亚里士多德或其学派哲学家之言”（61）。法拉库拉对文本的选译与其对出处的不提，给了他回旋余地，使他能以忠实译者不可能的方式改动那些文本的内容与旨趣。
