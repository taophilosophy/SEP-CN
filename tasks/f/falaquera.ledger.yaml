      法拉库拉本人是否经历过某种中年危机，不得而知；但他告诉我们，此书是他与青年时代诗歌的一纸“休书”——据他自述，诗歌是他擅长的艺术，他写了约两万节押韵诗，约半数付诸笔录。与此同时，他又宣布自己与智慧订了婚约：言下之意，既恋诗歌、又恋智慧的“重婚”并不可取，也不可容。法拉库拉对诗歌的这一新态度，正反映古代与中世纪哲学家对这门艺术的共同忧虑：诗歌危险，因为它打动人，靠的不是内容与真理，而是美与雄辩（论法拉库拉对诗歌的态度，见 Harvey, *Falaquera’s* Epistle, 128–132）。虽然法拉库拉大体上确实搁笔不再写诗，他对诗歌这位“缪斯”却谈不上忠实——即便在青年时代。他在《求索者之书》里坦白承认自己早与智慧有过私情，并列出七部著作，称之为“我早年思想的产儿”（12；译文 7–8）。这类告白有几分当真，难以断定；不过确凿无疑的是：法拉库拉两部篇幅最长的哲学著作——百科全书式的《哲学家之意见》（*De‘ot ha-Filosofim*）与其《迈蒙尼德〈迷途指津〉评注》——都不在这份书单里。评注写成于 1280 年（5040 年）（*Moreh ha-Moreh*, 365），是他最成熟的著作之一。施泰因施奈德评此书说：“其征引之富，足以使抄录它的人显得学识渊博”（*Hebraeischen Übersetzungen*, 422）；这句话同样适用于《哲学家之意见》。法拉库拉生平中另有一处值得注意：他在《求索者之书》中（11–12；译文 7–8）诉苦说，他们生活在“战胜我们的异邦强权之手的艰难时世”。这一主题见于他的几部著作，且显然是他已佚的《记忆之卷》（*Megillat ha-Zikkaron*)的主题。今天读来，这句话是对中世纪犹太思想家（如法拉库拉）写作与治学所处背景的一个冷峻提醒。
