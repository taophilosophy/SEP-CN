      法拉库拉的百科全书（他篇幅最长的著作）意在让犹太同胞得以严肃研习诸科学。全书分两部分：一论自然存在者，一论神圣存在者。第一部分大体依亚里士多德自然哲学诸书的传统次序展开。他说“全编之中没有一句话是我自己的”，这并不算夸张。他在书中的主要来源，通常是阿威罗伊的中等评注；中等评注不可得时，便用其节述。这些文本往往逐字译出，但他毫不迟疑地删节，并与别的来源——尤其是阿威罗伊的其他评注——相糅合，以求澄清或周备；凡适合其目的之处，也插入他人他书的短段。然而除连缀短语、对本书他处的指涉与偶尔的署名之外，确实几乎没有一个词出自法拉库拉本人。故令人惊异的是：他常常仅凭文本的拼合便改进了来源，甚至有意与它们分道。例如已有研究指出，“经由对〔阿威罗伊〕论《气象学》诸评注的明智而富创造性的拼合”，法拉库拉所呈现的亚里士多德学说，比阿威罗伊两部评注中的任何一部都更清楚（Fontaine, “Why Is the Sea Salty?” 213–218）；又如，他往节改的阿威罗伊《自然诸短篇节述》里插入阿维森纳的一段短文，便回应了阿威罗伊在其中的一个论点：理论知识不可能在梦中获得（Harvey, “Falaquera’s *De‘ot ha-Filosofim*,” 232–233）。类似之例所在多有，但通常只有把百科全书与其来源仔细对勘方能察觉。法拉库拉设想中的读者不懂阿拉伯文，因而无从察觉他编织来源时的技巧与特定用意；这却不会困扰他——他心里另有更宏大的目标。《哲学家之意见》呈现给读者的是一部雄心勃勃、全面周备的亚里士多德科学与哲学论述；事实上，这是希伯来文里第一次对亚里士多德科学所作的完整深入的处理。
