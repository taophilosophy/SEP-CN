      约斯佩依据《求索者之书》中的书单等材料，对法拉库拉著作的年序作过一番有理据的推断，但尚不能完全令人信服（*Torah and Sophia*, 31–33）。比如，法拉库拉的书单本身是否依年代排次、是否完整，并不清楚。再者，一书中对另一书的提及，也可能是后人添注，未必能说明两书孰先孰后。今后凡想为法拉库拉著作定年序，都必须考虑一个重要因素：他所用的术语，以及他翻译他人著述时的措辞。正如约斯佩在其书中指出的，法拉库拉极重术语，哲学用词择取谨慎（18–29）。在一生学术历程中，他对某些翻译阿拉伯哲学关键术语的希伯来词的偏好也发生过变化。这一点，把他不同著作中对同一阿拉伯语段的不同译法对勘，最为清楚。试看《行动之完成》（*Shelemut ha-Ma‘asim*）：其头六章是《亚历山大提要》（*Summa Alexandrinorum*，亚里士多德《尼各马可伦理学》的节本）的希伯来文节译。此处的语言，与他在早年《阶梯之书》（*Sefer ha-Ma‘alot*）里征引《提要》时的语言不同；而在《迷途指津之指引》（*Moreh ha-Moreh*）里征引《提要》，看来取自他自己的《行动之完成》。故《阶梯之书》成书早于《行动之完成》，《行动之完成》又早于《迷途指津之指引》。
