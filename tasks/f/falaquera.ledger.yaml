      除著述之外，法拉库拉的生平所知不多。多数学者认为他生在西班牙、长在西班牙，但这一点也无确证（见 Jospe, *Torah and Sophia*, 2–4）。其出生年份的大致推算，依据是他在《求索者之书》（*Sefer ha-Mevaqqesh*，1263 年 10–11 月［赫舍万月 5024 年］写成）中的自述（9；译文 2）：他已过七十年的中点，正走向第四十年。其卒年则由他最后一件传世文字——为迈蒙尼德《迷途指津》辩护的书信——中的线索推得。法拉库拉在《求索者之书》里提到的那个人生“中点”，对他或许别有意味。他在书中解释道（11；译文 5）：
