      谢姆·托夫·本·约瑟·伊本·法拉库拉（Shem-Tov ben Joseph ibn Falaquera，约 1225–1295），曾经是诗人，也是犹太哲学家。犹太哲学史一般都把他略过，连本领域的学子对他也不算熟悉；然而论学问之博、论对古希腊与中世纪伊斯兰和犹太哲学家著述的通晓，中世纪犹太哲人中少有能与之比肩者。法拉库拉的首要目标，看来是让同教同胞对哲学与科学发生兴趣并受其教诲——既为哲学与科学本身，也为正确理解《圣经》。在这一过程中，他为犹太哲学史作出了重要贡献。
