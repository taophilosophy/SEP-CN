      It is noteworthy that Falaquera speaks explicitly in his own name in the commentary, but rarely in most of his other works. Shiffman characterizes Falaquera in the commentary as a “critical thinker who does not hesitate to disagree with those he cites, accepting only those opinions which he considers philosophically sound” (“Falqerah As Interpreter,” 7 [219]). On occasion Falaquera disagrees with and even criticizes Maimonides. At times the sources cited by Falaquera strengthen Maimonides’ views and at times they part from them. In one instance, in his commentary on *Guide* I, 68, Falaquera uncharacteristically adds a word (*ha-maskil*, the intellecting Subject) in his citation of the Arabic translation of *Metaphysics* Λ, perhaps in order for it to agree exactly with Maimonides’ statement with reference to God that He is Intellect, intellecting Subject, and Object of intellection [Harvey, “Notes on Maimonides’ Formulations”]. The idea to explain the *Guide* and its teachings through citations of Maimonides’ possible sources is the great innovation of the commentary. Usually these passages speak for themselves with only short comments added by Falaquera. Occasionally he is more verbose, but even when not, there is a sense that he is considering the passage at hand carefully to determine to what extent Maimonides followed its teachings and to what extent he himself should. This is one of Falaquera’s last writings and likely the most useful of his books for discerning his own views on theological-philosophical matters, such as creation from eternal matter; God’s will; the negation of corporeality, privation, and potentiality with regard to God; the nature of prophecy; the possibility of conjunction with the Active Intellect; and the ultimate and intermediate causes in nature, will, and chance.
    step1: |-
      值得注意的是，法拉库拉在评注中明确以自己的名义说话，而在他大多数其他著作中很少如此。希夫曼在评注中把法拉库拉刻画为“一个不犹豫于不同意他所引用者的批判性思想家，只接受他认为在哲学上健全的意见”（“Falqerah As Interpreter,” 7 [219]）。有时法拉库拉不同意迈蒙尼德，甚至批评他。法拉库拉所引的来源有时加强迈蒙尼德的观点，有时与它们分离。有一处，在他对《迷途指津》I, 68 的评注中，法拉库拉一反常态，在他对《形而上学》Λ 卷阿拉伯译文的引用中加了一个词（*ha-maskil*，进行理智活动的主体），也许是为了让它与迈蒙尼德关于上帝是理智、是进行理智活动的主体、是理智活动的对象的表述完全一致（Harvey, “Notes on Maimonides’ Formulations”）。通过引用迈蒙尼德的可能来源来解释《迷途指津》及其学说，是这部评注的伟大创新。通常这些段落自己说话，法拉库拉只加简短评论。偶尔他更啰嗦；但即便不是这样，也能感到他在仔细考虑手头的段落，以判定迈蒙尼德在多大程度上遵循其学说、他自己又应在多大程度上遵循。这是他最后的著作之一，而且很可能是他所有书中对辨认他自己在神学-哲学问题上的观点最有用的，例如从永恒质料创世；上帝的意志；关于上帝的身体性、缺失和潜能的否定；预言的本性；与主动理智结合的可能性；以及自然、意志和偶然中的终极因和中间因。
    step2: |-
      值得注意的是：法拉库拉在评注中明确以自己之名发言，而在其他大部分著作中则极少如此。希夫曼把评注中的法拉库拉刻画为“一位不惮与其所引者相左的批判性思想家，只接受他认为在哲学上站得住脚的意见”（“Falqerah As Interpreter,” 7 [219]）。他有时不同意迈蒙尼德，甚至加以批评。所引来源有时加强迈蒙尼德的观点，有时与之分离。有一处，在评注《迷途指津》I, 68 时，法拉库拉一改常态，在引用《形而上学》Λ 卷的阿拉伯文译本时添了一个词（*ha-maskil*，即“理解的主体”），或许为的是让它与迈蒙尼德关于上帝是理智、是理解主体、是理解对象的表述完全吻合（Harvey, “Notes on Maimonides’ Formulations”）。借征引迈蒙尼德的可能来源来解释《迷途指津》及其学说——这是本评注的伟大创举。这些段落通常自己说话，法拉库拉只添简短评语；偶尔他也多说几句。但即便不多说，也能感到他在仔细掂量手头的段落：迈蒙尼德在多大程度上遵循其学说，他自己又该在多大程度上遵循。这是他最晚的著作之一，也很可能是他诸书中辨认其本人神学-哲学观点最有用的书——涉及从永恒质料创世、上帝的意志、否定上帝的身体性以及缺失与潜能、预言的本性、与主动理智结合的可能性，以及自然、意志与偶然中的终极因与中间因。
