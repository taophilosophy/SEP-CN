      世界创生问题是一个很好的例子，说明法拉库拉似乎在不同著作中传达不同意见。在他通俗的入门著作中，法拉库拉写道，《托拉》的真意见之一是上帝“使其余存在者从不存在中产生存在”（*Iggeret ha-Halom*, 489）；“相信有一位世界的创造者……并且他从无中使一切受造者存在，相信世界是被产生的而不是永恒的，这是《托拉》的根基”（*Sefer ha-Mevaqqesh*, 65）；而虽然大多数哲学家不同意我们关于创世的信念，其中一些人实际上确实“相信〔世界的〕产生，但不是以我们所相信的方式”（*Iggeret ha-Vikkuah*, 77；译文 46）。因此他似乎提出一种从无中创世的观点，同时承认大多数哲学家相信永恒，虽然有些人相信创造，但方式与我们不同，也许是从永恒质料创造。法拉库拉在这些著作中确实说，要理解《托拉》的奥秘，需要真科学的知识（如 *Sefer ha-Mevaqqesh*, 70–72）。人们可以问：如果哲学和科学的知识对于理解《托拉》的奥秘是必需的，而创世又是这些奥秘之一，为什么哲学家们不以“我们所相信的方式”相信它？在《迷途指津之指引》中，法拉库拉明确说，神圣奥秘之一就是“上帝，愿他受颂扬，如何创造受造者”（116）。在这部评注中——也许是法拉库拉所有著作中最不可能被多数人读到的一部——他揭示了自己的意见：世界不是从无中创造的。他的确切观点有争议，但他似乎主张世界是从永恒质料创造的，这是迈蒙尼德归给柏拉图的观点。在他的导言中，他暗示柏拉图关于世界被造而不被毁灭的观点源自圣哲；而既然圣哲知道《托拉》的真解释，这似乎意味着柏拉图的观点是真的那一个（117）。在评注稍后处，他重复这一观点，并写道，在他看来，“柏拉图的意见倾向于我们神圣《托拉》的意见”（259，评《迷途指津》II, 13）。在章内稍后一点，他明确写道（261）：
