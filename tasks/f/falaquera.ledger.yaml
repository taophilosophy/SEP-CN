      The importance of Falaquera for the history of philosophy is not, however, in his personal beliefs regarding theological-philosophical subjects. It is rather in his broad and profound knowledge of the teachings of the ancient and medieval philosophers, his mastery of their science, his commitment to the ultimate accord between their true teachings and the correctly interpreted teachings of the Torah, and his life-long effort to interest his fellow Jews in science and philosophy and to make their teachings available to them. To accomplish his goals, as we have seen, Falaquera, perhaps more than any other medieval Jewish philosopher, employed a wide variety of different literary forms (see further, Hughes and Robinson 2019)[^hughes-2019].
