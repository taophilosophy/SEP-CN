      费策尔（Fetzer）（1991）提出了框架问题与归纳问题之间的另一种紧密关系。他写道：“归纳问题［在于］为关于未来的某些推断、而非另一些推断提供辩护。框架问题亦然——［同样在于］为关于未来的某些推断、而非另一些推断辩护。第二个问题是第一个的特例。”不过，这种框架问题观争议极大（Hayes 1991）[^hayes-1991]。
