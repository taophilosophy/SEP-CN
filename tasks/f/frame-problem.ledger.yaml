  source: "One philosophical legacy of the frame problem is that it has drawn attention to a cluster of issues relating to holism, or so-called informational unencapsulation. Recall that a process is informationally unencapsulated (Fodor sometimes uses the term “isotropic”) if there is no *a priori* boundary to what information is relevant to it. In recent writing, Fodor uses the term “frame problem” in the context of all informationally unencapsulated processes, and not just those to do with inferring the consequences of change (Fodor 2000, Ch.2; Fodor 2006, Ch.4)[^fodor-2000]. It's clear that idealised rationality is informationally unencapsulated, in this sense. It has also been suggested that isotropy is damaging to the so-called theory theory of folk psychology (Heal 1996)[^heal-1996]. (For Heal, this lends support to the rival simulation theory, but Wilkerson (2001) argues that informational unencapsulation is a problem for both accounts of folk psychology.) Analogical reasoning, as Fodor says, is an example of “isotropy in the purest form: a process which depends precisely upon the transfer of information among cognitive domains previously assumed to be irrelevant” (Fodor 1983, 105)[^fodor-1983]. Arguably, a capacity for analogical and metaphorical thinking—a talent for creatively transcending the boundaries between different domains of understanding—is the source of human cognitive prowess (Lakoff & Johnson 1980; Mithen 1996)[^lakoff-1980]. So the informational unencapsulation of analogical reasoning is potentially very troublesome, and especially so for modular theories of mind in which modules are viewed as (context-insensitive) specialists (Carruthers 2003; 2006)[^carruthers-2003]."
  step1: "框架问题的哲学遗产之一，是把注意力引向与整体论相关的一簇问题，即所谓信息非封装。回顾一下：若无 **先验** 界限划定什么信息与一个过程相关，该过程就是信息上不封装的（福多有时用“各向同性”一词）。在晚近的著作中，福多在一切信息上不封装的过程的语境中使用“框架问题”一词，而不限于与推断变化之后果相关的过程（Fodor 2000, Ch.2; Fodor 2006, Ch.4）[^fodor-2000]。显然，理想化的合理性在此意义上是信息上不封装的。也有人提出，各向同性会损害民俗心理学的所谓理论论（Heal 1996）[^heal-1996]。（对希尔（Heal）来说，这为与之竞争的模拟论提供了支持，但威尔克森（Wilkerson）（2001）论证，信息非封装对民俗心理学的两种说明都是问题。）如福多所言，类比推理是“最纯粹形式的各向同性：一个恰恰依赖于在先前被假定不相关的认知域之间传递信息的过程”（Fodor 1983, 105）[^fodor-1983]。可以说，类比与隐喻思维的能力——创造性地跨越不同理解域之间边界的天赋——是人类认知威力的源泉（Lakoff & Johnson 1980; Mithen 1996）[^lakoff-1980]。因此，类比推理的信息非封装潜在地非常棘手，对那些把模块视为（语境不敏感的）专家的模块化心智理论来说尤其如此（Carruthers 2003; 2006）[^carruthers-2003]。"
  step2: "框架问题的一项哲学遗产，是它把注意力引向与整体论相关的一簇问题，即所谓信息非封装（informational unencapsulation）。回顾一下：倘若对“什么信息与一个过程相关”没有 **先验** 界限，该过程就是信息上不封装的（福多有时称之“各向同性的”，isotropic）。在晚近著作中，福多把“框架问题”一词用于一切信息上不封装的过程，而不限于推断变化之后果的那些过程（Fodor 2000, Ch.2; Fodor 2006, Ch.4）[^fodor-2000]。显然，理想化的合理性在此意义上是信息上不封装的。也有人提出，各向同性会损害民俗心理学的所谓“理论论”（theory theory）（Heal 1996）[^heal-1996]。（在希尔（Heal）看来，这为与之竞争的模拟论（simulation theory）提供了支持；但威尔克森（Wilkerson）（2001）论证，信息非封装对民俗心理学的这两种说明都是麻烦。）如福多所言，类比推理是“最纯粹形式的各向同性：一个恰恰依赖于在先前被假定不相关的认知域之间传递信息的过程”（Fodor 1983, 105）[^fodor-1983]。可以说，类比与隐喻思维的能力——创造性地跨越不同理解域之边界的天赋——正是人类认知威力之源（Lakoff & Johnson 1980; Mithen 1996）[^lakoff-1980]。因此，类比推理的信息非封装潜在地相当棘手；对那些把模块视作（语境不敏感的）专门家的模块化心智理论来说，尤为如此（Carruthers 2003; 2006）[^carruthers-2003]。"
