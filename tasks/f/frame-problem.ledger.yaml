# 段落账本：frame-problem（draft 阶段）
# source 逐字取自 yuanwen/f/frame-problem.md（英文源镜像，ADR-0009）
# step1 = 忠实初译；step2 = 中文语言优化
- id: p1
  source: "To most AI researchers, the frame problem is the challenge of representing the effects of action in logic without having to represent explicitly a large number of intuitively obvious non-effects. But to many philosophers, the AI researchers' frame problem is suggestive of wider epistemological issues. Is it possible, in principle, to limit the scope of the reasoning required to derive the consequences of an action? And, more generally, how do we account for our apparent ability to make decisions on the basis only of what is relevant to an ongoing situation without having explicitly to consider all that is not relevant?"
  step1: "对大多数人工智能（AI）研究者而言，框架问题（frame problem）是这样一项挑战：如何在逻辑中表征行动的效果，而无须显式表征大量直觉上显而易见的非效果（non-effects）。但在许多哲学家看来，AI 研究者的框架问题暗示着更广泛的认识论问题。原则上，是否可能限定为推出一个行动之后果所需的推理范围？更一般地说，我们如何解释自己那种明显的能力——仅依据与当下情境相关的东西作出决定，而无须显式考虑一切不相关的东西？"
  step2: "对大多数人工智能（AI）研究者而言，框架问题（frame problem）是这样一项挑战：如何在逻辑中表征行动的效果，而无须显式表征大量直觉上显而易见的非效果（non-effects）。但在许多哲学家看来，AI 研究者的框架问题牵涉到更广泛的认识论问题。原则上，我们究竟能否把为推出一个行动之后果所需要的推理限定在一定范围内？更一般地说，我们那种显然的能力——只依据与当下情境相关的东西便作出决定，而无须显式考虑一切不相关的东西——又当如何解释？"
- id: p2
  source: "The frame problem originated as a narrowly defined technical problem in logic-based artificial intelligence (AI). But it was taken up in an embellished and modified form by philosophers of mind, and given a wider interpretation. The tension between its origin in the laboratories of AI researchers and its treatment at the hands of philosophers engendered an interesting and sometimes heated debate in the 1980s and 1990s. But since the narrow, technical problem is largely solved, recent discussion has tended to focus less on matters of interpretation and more on the implications of the wider frame problem for cognitive science. To gain an understanding of the issues, this article will begin with a look at the frame problem in its technical guise. Some of the ways in which philosophers have re-interpreted the problem will then be examined. The article will conclude with an assessment of the significance of the frame problem today."
  step1: "框架问题最初是逻辑式人工智能（AI）中一个界定狭窄的技术问题。但它被心灵哲学家以一种修饰和改造过的形式接了过去，并被赋予更宽泛的解释。它起源于 AI 研究者的实验室，又经哲学家之手处理，这一张力在 20 世纪 80 与 90 年代引发了一场有趣且时而激烈的争论。但由于狭窄的技术问题大体已获解决，晚近的讨论已较少聚焦于解释之争，而更多聚焦于更宽泛的框架问题对认知科学的意涵。为理解这些问题，本文将首先考察其技术面貌下的框架问题，继而检视哲学家重新诠释该问题的若干方式，最后评估框架问题在今天的意义。"
  step2: "框架问题最初是逻辑式人工智能（AI）中一个界定狭窄的技术问题，但它被心灵哲学家以一种加工改造过的形式接了过去，并获得更宽泛的解释。该问题既生于 AI 研究者的实验室，又被哲学家接手处理，两者之间的张力在 20 世纪 80 与 90 年代引发了一场有趣且时而激烈的争论。不过，由于狭窄的技术问题大体已获解决，晚近的讨论已较少纠缠于解释之争，而更多关注更宽泛的框架问题对认知科学的意涵。为把握这些问题，本文将首先考察技术面貌下的框架问题，继而检视哲学家重新诠释该问题的若干进路，最后评估框架问题在当今的意义。"
- id: p3
  source: "Put succinctly, the frame problem in its narrow, technical form is this (McCarthy & Hayes 1969)[^mccarthy-1969]. Using mathematical logic, how is it possible to write formulae that describe the effects of actions without having to write a large number of accompanying formulae that describe the mundane, obvious non-effects of those actions? Let's take a look at an example. The difficulty can be illustrated without the full apparatus of formal logic, but it should be borne in mind that the devil is in the mathematical details. Suppose we write two formulae, one describing the effects of painting an object and the other describing the effects of moving an object."
  step1: "简言之，狭窄而技术性的框架问题是这样的（McCarthy & Hayes 1969）[^mccarthy-1969]：运用数理逻辑，如何可能写出描述行动效果的公式，而不必写出大量描述这些行动之平凡而明显的非效果的伴随公式？让我们看一个例子。这一困难无须完整的形式逻辑装置便可说明，但应当记住，魔鬼藏在数学细节之中。假设我们写出两个公式，一个描述给物体上漆的效果，另一个描述移动物体的效果。"
  step2: "简言之，狭窄而技术性意义上的框架问题是这样的（McCarthy & Hayes 1969）[^mccarthy-1969]：运用数理逻辑，如何可能写出刻画行动效果的公式，而不必连带写出大量刻画这些行动之平凡而明显的非效果的公式？来看一个例子。这一困难无须动用完整的形式逻辑装置即可说明，但须谨记：魔鬼藏在数学细节里。假设我们写出两个公式，一个描述给物体上漆的效果，另一个描述移动物体的效果。"
- id: p4
  source: "1. *Colour*(*x*, *c*) holds after *Paint*(*x*, *c*)\n2. *Position*(*x*, *p*) holds after *Move*(*x*, *p*)"
  step1: "1. *Colour*(*x*, *c*) 在 *Paint*(*x*, *c*) 之后成立\n2. *Position*(*x*, *p*) 在 *Move*(*x*, *p*) 之后成立"
  step2: "1. *Colour*(*x*, *c*) 在 *Paint*(*x*, *c*) 之后成立\n2. *Position*(*x*, *p*) 在 *Move*(*x*, *p*) 之后成立"
- id: p5
  source: "Now, suppose we have an initial situation in which *Colour*(*A*, *Red*) and *Position*(*A*, *House*) hold. According to the machinery of deductive logic, what then holds after the action *Paint*(*A*, *Blue*) followed by the action *Move*(*A*, *Garden*)? Intuitively, we would expect *Colour*(*A*, *Blue*) and *Position*(*A*, *Garden*) to hold. Unfortunately, this is not the case. If written out more formally in classical predicate logic, using a suitable formalism for representing time and action such as the situation calculus (McCarthy & Hayes 1969)[^mccarthy-1969], the two formulae above only license the conclusion that *Position*(*A*, *Garden*) holds. This is because they don't rule out the possibility that the colour of *A* gets changed by the *Move* action."
  step1: "现在，假设有一个初始情境，其中 *Colour*(*A*, *Red*) 与 *Position*(*A*, *House*) 成立。按照演绎逻辑的机制，在行动 *Paint*(*A*, *Blue*) 之后接着行动 *Move*(*A*, *Garden*)，此时什么成立？凭直觉，我们预期 *Colour*(*A*, *Blue*) 与 *Position*(*A*, *Garden*) 成立。遗憾的是，情况并非如此。若用经典谓词逻辑更形式化地写出，采用某种表征时间与行动的合适形式系统（如情境演算（situation calculus）（McCarthy & Hayes 1969）[^mccarthy-1969]），上述两个公式只容许推出 *Position*(*A*, *Garden*) 成立这一结论。这是因为它们并未排除 *A* 的颜色被 *Move* 行动改变的可能性。"
  step2: "现在，假设有一个初始情境，其中 *Colour*(*A*, *Red*) 与 *Position*(*A*, *House*) 成立。按照演绎逻辑的机制，在行动 *Paint*(*A*, *Blue*) 之后施行行动 *Move*(*A*, *Garden*)，此时何者成立？凭直觉，我们预期 *Colour*(*A*, *Blue*) 与 *Position*(*A*, *Garden*) 成立。遗憾的是，事实并非如此。若借助情境演算（situation calculus）（McCarthy & Hayes 1969）[^mccarthy-1969] 之类合适的形式系统，用经典谓词逻辑把上述公式更形式化地写出，则由这两个公式只能得出 *Position*(*A*, *Garden*) 成立这一结论。原因在于，它们并未排除 *A* 的颜色被 *Move* 行动改变的可能性。"
- id: p6
  source: "The most obvious way to augment such a formalisation so that the right common sense conclusions fall out is to add a number of formulae that explicitly describe the non-effects of each action. These formulae are called *frame axioms*. For the example at hand, we need a pair of frame axioms."
  step1: "对这类形式化加以扩充、使正确的常识结论得以推出的最显眼办法，是添加若干显式描述每个行动之非效果的公式。这些公式称为 **框架公理**（frame axioms）。就眼下的例子而言，我们需要一对框架公理。"
  step2: "要扩充这类形式化、使正确的常识结论得以自动得出，最显白的办法是添加若干显式描述每个行动之非效果的公式。这类公式称作 **框架公理**（frame axioms）。就眼下的例子而言，我们需要一对框架公理。"
- id: p7
  source: "1. *Colour*(*x*, *c*) holds after *Move*(*x*, *p*) if *Colour*(*x*, *c*) held beforehand\n2. *Position*(*x*, *p*) holds after *Paint*(*x*, *c*) if *Position*(*x*, *p*) held beforehand"
  step1: "1. 若 *Colour*(*x*, *c*) 事先成立，则 *Colour*(*x*, *c*) 在 *Move*(*x*, *p*) 之后成立\n2. 若 *Position*(*x*, *p*) 事先成立，则 *Position*(*x*, *p*) 在 *Paint*(*x*, *c*) 之后成立"
  step2: "1. 若 *Colour*(*x*, *c*) 事先成立，则 *Colour*(*x*, *c*) 在 *Move*(*x*, *p*) 之后成立\n2. 若 *Position*(*x*, *p*) 事先成立，则 *Position*(*x*, *p*) 在 *Paint*(*x*, *c*) 之后成立"
- id: p8
  source: "In other words, painting an object will not affect its position, and moving an object will not affect its colour. With the addition of these two formulae (written more formally in predicate logic), all the desired conclusions can be drawn. However, this is not at all a satisfactory solution. Since *most* actions do not affect *most* properties of a situation, in a domain comprising *M* actions and *N* properties we will, in general, have to write out almost *MN* frame axioms. Whether these formulae are destined to be stored explicitly in a computer's memory, or are merely part of the designer's specification, this is an unwelcome burden."
  step1: "换言之，给物体上漆不会影响其位置，移动物体不会影响其颜色。添入这两个公式（以谓词逻辑更形式化地写出）后，一切想要的结论都能推出。然而，这根本不是一个令人满意的解决方案。由于 **大多数** 行动并不影响情境的 **大多数** 性质，在一个由 *M* 个行动与 *N* 个性质构成的域中，我们一般要写出几乎 *MN* 条框架公理。无论这些公式注定要显式存入计算机内存，还是只是设计者规范的一部分，这都是一桩不受欢迎的负担。"
  step2: "换言之，给物体上漆不会影响其位置，移动物体也不会影响其颜色。添入这两个公式（用谓词逻辑更形式化地写出）之后，所有想要的结论都能推出。然而，这远非令人满意的解决方案。由于 **大多数** 行动并不影响情境的 **大多数** 性质，在一个含 *M* 个行动与 *N* 个性质的论域中，我们一般不得不写出近乎 *MN* 条框架公理。无论这些公式注定要显式存储于计算机内存，抑或只是设计者规范的一部分，这都是一桩不受欢迎的负担。"
- id: p9
  source: "The challenge, then, is to find a way to capture the non-effects of actions more succinctly in formal logic. What we need, it seems, is some way of declaring the general rule-of-thumb that an action can be assumed not to change a given property of a situation *unless* there is evidence to the contrary. This default assumption is known as the *common sense law of inertia*. The (technical) frame problem can be viewed as the task of formalising this law."
  step1: "于是，挑战在于找到一种办法，在形式逻辑中更简洁地刻画行动的非效果。看起来，我们所需要的，是某种宣布如下一般经验法则的方式：**除非** 有相反证据，否则可以假定一个行动不会改变情境的给定性质。这一默认假定被称为 **常识惯性定律**（common sense law of inertia）。（技术性的）框架问题可被视为形式化这条定律的任务。"
  step2: "于是，挑战在于：如何在形式逻辑中更简洁地刻画行动的非效果。看来我们需要的是某种方式，用以宣告如下一般经验法则：**除非** 有相反的证据，否则可以假定一个行动不会改变情境的某一给定性质。这一默认假定就是所谓的 **常识惯性定律**（common sense law of inertia）。（技术性的）框架问题可以看作形式化这条定律的任务。"
- id: p10
  source: "The main obstacle to doing this is the *monotonicity* of classical logic. In classical logic, the set of conclusions that can be drawn from a set of formulae always *increases* with the addition of further formulae. This makes it impossible to express a rule that has an open-ended set of exceptions, and the common sense law of inertia is just such a rule. For example, in due course we might want to add a formula that captures the exception to Axiom 3 that arises when we move an object into a pot of paint. But our not having thought of this exception before should not prevent us from applying the common sense law of inertia and drawing a wide enough set of (defeasible) conclusions to get off the ground."
  step1: "这样做的主要障碍是经典逻辑的 **单调性**。在经典逻辑中，从一组公式可推出的结论集总是随公式的增加而 **扩大**。这使得表达一条具有开放例外集的规则成为不可能，而常识惯性定律恰是这样一条规则。例如，日后我们或许想添入一个公式，以刻画把物体移进一桶油漆时对公理 3 的例外。但我们先前没有想到这个例外，不应妨碍我们应用常识惯性定律并推出足够广泛的（可废止的）结论以着手工作。"
  step2: "这样做的主要障碍在于经典逻辑的 **单调性**（monotonicity）。在经典逻辑中，由一组公式可推出的结论集总是随公式的增添而 **扩大**。这就使得任何带有开放例外集的规则都无法得到表达，而常识惯性定律恰恰是这样一条规则。例如，日后我们或许想添入一个公式，刻画“把物体移进一桶油漆”这一情形对公理 3 构成的例外。但我们此前没有想到这个例外，这不应妨碍我们应用常识惯性定律、推出足够宽泛的（可废止的）结论以启动推理。"
- id: p11
  source: "Accordingly, researchers in logic-based AI have put a lot of effort into developing a variety of *non-monotonic* reasoning formalisms, such as *circumscription* (McCarthy 1986)[^mccarthy-1986], and investigating their application to the frame problem. None of this has turned out to be at all straightforward. One of the most troublesome barriers to progress was highlighted in the so-called *Yale shooting problem* (Hanks & McDermott 1987)[^hanks-1987][^mcdermott-1987], a simple scenario that gives rise to counter-intuitive conclusions if naively represented with a non-monotonic formalism. To make matters worse, a full solution needs to work in the presence of concurrent actions, actions with non-deterministic effects, continuous change, and actions with indirect ramifications. In spite of these subtleties, a number of solutions to the technical frame problem now exist that are adequate for logic-based AI research. Although improvements and extensions continue to be found, it is fair to say that the dust has settled, and that the frame problem, in its technical guise, is more-or-less solved (Shanahan 1997; Lifschitz 2015)[^lifschitz-2015][^shanahan-1997]."
  step1: "因此，逻辑式 AI 的研究者投入大量精力发展各种 **非单调** 推理形式系统，如 **限定**（circumscription）（McCarthy 1986）[^mccarthy-1986]，并研究其在框架问题上的应用。但这一切都远非一帆风顺。进展道路上最麻烦的障碍之一在所谓的 **耶鲁射击问题**（Yale shooting problem）（Hanks & McDermott 1987）[^hanks-1987][^mcdermott-1987]中暴露出来：一个简单情境，若用非单调形式系统天真地加以表征，便会导出反直观的结论。更糟的是，一个完整的解决方案还须能处理并发行动、具有非确定性效果的行动、连续变化以及具有间接衍生效应的行动。尽管有这些微妙之处，如今已存在若干足以应付逻辑式 AI 研究的技术框架问题解决方案。虽然改进与扩展仍在继续，但可以说尘埃已经落定：技术面貌下的框架问题已大体解决（Shanahan 1997; Lifschitz 2015）[^lifschitz-2015][^shanahan-1997]。"
  step2: "于是，基于逻辑的 AI 研究者投入大量精力，发展出各种 **非单调**（non-monotonic）推理形式系统——如 **限定理论**（circumscription）（McCarthy 1986）[^mccarthy-1986]——并考察它们在框架问题上的应用。然而这一切远非一帆风顺。前进路上最棘手的障碍之一，在所谓的 **耶鲁射击问题**（Yale shooting problem）（Hanks & McDermott 1987）[^hanks-1987][^mcdermott-1987]中暴露无遗：这个简单情境若用非单调形式系统天真地表征，便会引出反直观的结论。更麻烦的是，完整的解决方案还必须能应对并发行动、效果非确定的行动、连续变化以及具有间接衍生效应的行动。尽管有这些微妙之处，如今已有若干足以支撑基于逻辑之 AI 研究的技术性框架问题解决方案。改进与扩展固然仍在继续，但可以说尘埃已定：技术面貌下的框架问题已大体获得解决（Shanahan 1997; Lifschitz 2015）[^lifschitz-2015][^shanahan-1997]。"
- id: p12
  source: "Let's move on now to the frame problem as it has been re-interpreted by various philosophers. The first significant mention of the frame problem in the philosophical literature was made by Dennett (1978, 125). The puzzle, according to Dennett, is how “a cognitive creature … with many beliefs about the world” can update those beliefs when it performs an act so that they remain “roughly faithful to the world”? In *The Modularity of Mind*, Fodor steps into a roboticist's shoes and, with the frame problem in mind, asks much the same question: “How … does the machine's program determine which beliefs the robot ought to re-evaluate given that it has embarked upon some or other course of action?” (Fodor 1983, 114)[^fodor-1983]."
  step1: "现在转向被各路哲学家重新诠释的框架问题。哲学文献中首次对框架问题的重要提及出自丹尼特（Dennett 1978, 125）。按丹尼特的说法，谜题在于：“一个关于世界持有诸多信念的认知生物”在执行一个行动时，如何更新这些信念，使其保持“大致忠于世界”？在《心智的模块性》中，福多站到机器人设计者的立场上，心怀框架问题，提出了大致相同的问题：“机器的程序如何决定机器人应当重新评估哪些信念，假定它已踏上某种行动进程？”（Fodor 1983, 114）[^fodor-1983]。"
  step2: "现在转向经各路哲学家重新诠释的框架问题。哲学文献中第一次郑重提及框架问题，出自丹尼特（Dennett 1978, 125）。在丹尼特看来，谜题在于：“一个对世界持有诸多信念的认知生物”在执行行动时，如何更新这些信念，使之保持“大致忠于世界”？在《心智的模块性》（*The Modularity of Mind*）中，福多（Fodor）站到机器人设计者的立场上，怀着框架问题发问，所问大体相同：“机器的程序……如何判定机器人应当重新评估哪些信念——假定它已踏上这种或那种行动进程？”（Fodor 1983, 114）[^fodor-1983]。"
- id: p13
  source: "At first sight, this question is only impressionistically related to the logical problem exercising the AI researchers. In contrast to the AI researcher's problem, the philosopher's question isn't expressed in the context of formal logic, and doesn't specifically concern the non-effects of actions. In a later essay, Dennett acknowledges the appropriation of the AI researchers' term (1987). Yet he goes on to reaffirm his conviction that, in the frame problem, AI has discovered “a new, deep epistemological problem—accessible in principle but unnoticed by generations of philosophers”."
  step1: "初看之下，这个问题与困扰 AI 研究者的逻辑问题只有印象式的关联。与 AI 研究者的问题不同，哲学家的问题并非在形式逻辑的语境中提出，也不专门关乎行动的非效果。在后来的一篇文章中，丹尼特承认挪用了 AI 研究者的术语（1987）。但他随即重申自己的信念：在框架问题中，AI 发现了“一个崭新的、深刻的认识论问题——原则上可及，却为历代哲学家所忽视”。"
  step2: "初看之下，这一问题与令 AI 研究者绞尽脑汁的逻辑问题只有印象式的关联。与 AI 研究者的问题不同，哲学家的问题并非在形式逻辑的语境中提出，也不专门关乎行动的非效果。丹尼特在后来的一篇文章里承认挪用了 AI 研究者的术语（1987），但他随即重申自己的信念：借框架问题之机，AI 发现了“一个崭新的、深刻的认识论问题——原则上可以把握，却为历代哲学家所忽视”。"
- id: p14
  source: "The best way to gain an understanding of the issue is to imagine being the designer of a robot that has to carry out an everyday task, such as making a cup of tea. Moreover, for the frame problem to be neatly highlighted, we must confine our thought experiment to a certain class of robot designs, namely those using explicitly stored, sentence-like representations of the world, reflecting the methodological tenets of *classical AI*. The AI researchers who tackled the original frame problem in its narrow, technical guise were working under this constraint, since logic-based AI is a variety of classical AI. Philosophers sympathetic to the computational theory of mind—who suppose that mental states comprise sets of propositional attitudes and mental processes are forms of inference over the propositions in question—also tend to feel at home with this prescription."
  step1: "理解这一问题的最好方式，是设想自己是一个必须执行日常任务（比如泡一杯茶）的机器人的设计者。此外，为使框架问题清晰地凸显出来，我们必须把思想实验限定于某一类机器人设计，即使用显式存储的、类似句子的世界表征的那些设计，这反映了 **经典 AI** 的方法论信条。以狭窄技术面貌处理原初框架问题的 AI 研究者正是在这一约束下工作，因为逻辑式 AI 是经典 AI 的一个变种。同情心智计算理论的哲学家——他们认为心理状态由若干命题态度构成，心理过程是对相关命题的推理——也倾向于对这一规定感到自在。"
  step2: "要理解这一问题，最好的办法是设想自己是一个机器人的设计者，这个机器人必须执行泡一杯茶之类的日常任务。此外，为让框架问题干净利落地凸显出来，必须把思想实验限定在一类特定的机器人设计上，即那些采用显式存储、类似句子的世界表征的设计——这正体现 **经典 AI**（classical AI）的方法论信条。以狭窄技术面貌攻克原初框架问题的 AI 研究者，正是在这一约束下工作的，因为基于逻辑的 AI 本是经典 AI 的一个变种。同情心智计算理论的哲学家——他们认为心理状态由若干命题态度组成，而心理过程是对这些命题的推理——同样倾向于认可这一规定。"
- id: p15
  source: "Now, suppose the robot has to take a tea-cup from the cupboard. The present location of the cup is represented as a sentence in its database of facts alongside those representing innumerable other features of the ongoing situation, such as the ambient temperature, the configuration of its arms, the current date, the colour of the tea-pot, and so on. Having grasped the cup and withdrawn it from the cupboard, the robot needs to update this database. The location of the cup has clearly changed, so that's one fact that demands revision. But which other sentences require modification? The ambient temperature is unaffected. The location of the tea-pot is unaffected. But if it so happens that a spoon was resting in the cup, then the spoon's new location, inherited from its container, must also be updated."
  step1: "现在，假设机器人必须从橱柜里取出一个茶杯。杯子目前的位置作为一条句子存储于它的事实数据库中，与表征当下情境无数其他特征的句子并列，如环境温度、手臂的构型、今天的日期、茶壶的颜色等等。机器人抓住杯子并把它从橱柜取出后，需要更新这一数据库。杯子的位置显然变了，这是需要修订的一条事实。但还有哪些句子需要修改？环境温度没有受影响。茶壶的位置没有受影响。但若碰巧有一把勺子原本放在杯中，那么勺子继承自其容器的新位置也必须更新。"
  step2: "现在，假设这个机器人要从橱柜里取出一只茶杯。杯子当下的位置作为一条句子记录在它的事实数据库中，与表征当下情境无数其他特征的句子并列——环境温度、手臂的构型、今天的日期、茶壶的颜色，等等。机器人握住杯子、把它从橱柜取出之后，需要更新这个数据库。杯子的位置显然变了，这是一条必须修订的事实。可还有哪些句子需要修改？环境温度未受影响，茶壶的位置未受影响。但倘若碰巧有一把勺子原本搁在杯里，那么勺子随容器而得的新位置也必须更新。"
- id: p16
  source: "The epistemological difficulty now discerned by philosophers is this. How could the robot limit the scope of the propositions it must reconsider in the light of its actions? In a sufficiently simple robot, this doesn't seem like much of a problem. Surely the robot can simply examine its entire database of propositions one-by-one and work out which require modification. But if we imagine that our robot has near human-level intelligence, and is therefore burdened with an enormous database of facts to examine every time it so much as spins a motor, such a strategy starts to look computationally intractable."
  step1: "哲学家如今所辨识出的认识论困难是这样的：机器人如何能限定它依其行动必须重新考虑的命题的范围？在一个足够简单的机器人那里，这似乎算不上什么问题。它当然可以逐条检查其全部命题数据库，找出哪些需要修改。但如果我们设想这个机器人具有近乎人类的智能，因而背负着一个庞大的数据库，每次哪怕转动一个马达都要检查一遍，这种策略就开始显得在计算上难以处理。"
  step2: "哲学家如今察觉到的认识论困难正在于此：机器人如何能限定范围，只重新考虑其行动所要求考虑的那些命题？对一个足够简单的机器人来说，这似乎算不上什么难题：它尽可以逐条检查自己的整个命题数据库，找出需要修改的条目。可是，设想这个机器人拥有近乎人类的智能，因而背负一个庞大的数据库，哪怕只是转动一下马达也得把数据库过一遍——这样的策略在计算上就开始显得难以施行了。"
- id: p17
  source: "Thus, a related issue in AI has been dubbed the *computational aspect* of the frame problem (McDermott 1987)[^mcdermott-1987]. This is the question of how to compute the consequences of an action without the computation having to range over the action's non-effects. The solution to the computational aspect of the frame problem adopted in most symbolic AI programs is some variant of what McDermott calls the “sleeping dog” strategy (McDermott 1987)[^mcdermott-1987]. The idea here is that not every part of the data structure representing an ongoing situation needs to be examined when it is updated to reflect a change in the world. Rather, those parts that represent facets of the world that have changed are modified, and the rest is simply left as it is (following the dictum “let sleeping dogs lie”). In our example of the robot and the tea-cup, we might apply the sleeping dog strategy by having the robot update its beliefs about the location of the cup and the contents of the cupboard. But the robot would not worry about some possible spoon that may or may not be on or in the cup, since the robot's goal did not directly involve any spoon."
  step1: "因此，AI 中一个相关议题被称为框架问题的 **计算方面**（computational aspect）（McDermott 1987）[^mcdermott-1987]：如何在计算行动的后果时，无须让计算遍历该行动的非效果。大多数符号 AI 程序对框架问题计算方面的解决方案，是麦克德莫特（McDermott）所谓“睡狗”策略（sleeping dog strategy）的某种变体（McDermott 1987）[^mcdermott-1987]。其想法是：表征当下情境的数据结构在更新以反映世界变化时，并非每个部分都需要检查；毋宁说，只修改那些表征已变化的世界侧面的部分，其余照旧（遵照“让睡着的狗继续躺着”的格言）。在我们机器人与茶杯的例子中，应用睡狗策略，就是让机器人更新关于杯子位置与橱柜内容的信念。但机器人不会去操心某个可能也可能不在杯上或杯中的勺子，因为机器人的目标并不直接涉及任何勺子。"
  step2: "于是，AI 中一个相关议题被称作框架问题的 **计算方面**（computational aspect）（McDermott 1987）[^mcdermott-1987]：如何计算行动的后果，而不必让计算遍历该行动的非效果。多数符号 AI 程序处理框架问题计算方面的方案，是麦克德莫特（McDermott）所谓“睡狗”策略（sleeping dog strategy）的某种变体（McDermott 1987）[^mcdermott-1987]。其想法是：更新表征当下情境的数据结构以反映世界的变化时，并非其中每个部分都要检查；只需修改那些表征世界已变化侧面的部分，其余一概照旧（谨遵“莫惹睡狗”的格言）。在机器人与茶杯的例子里，落实睡狗策略就是让机器人更新它关于杯子位置与橱柜内容的信念，而不去操心某把可能、也未必在杯上或杯中的勺子——因为机器人的目标本来就不直接涉及任何勺子。"
- id: p18
  source: "However, the philosophical problem is not exhausted by this computational issue. The outstanding philosophical question is how the robot could ever determine that it had successfully revised all its beliefs to match the consequences of its actions. Only then would it be in a position safely to apply the “common sense law of inertia” and assume the rest of the world is untouched. Fodor suggestively likens this to “Hamlet's problem: when to stop thinking” (Fodor 1987, 140)[^fodor-1987]. The frame problem, he claims, is “Hamlet's problem viewed from an engineer's perspective”. So construed, the obvious way to try to avoid the frame problem is by appealing to the notion of *relevance*. Only certain properties of a situation are relevant in the context of any given action, so the counter-argument goes, and consideration of the action's consequences can be conveniently confined to those."
  step1: "然而，哲学问题并未被这个计算问题穷尽。悬而未决的哲学问题是：机器人如何能确定它已成功地修订了它的全部信念，使之与行动的后果相符？只有到那时，它才能放心地应用“常识惯性定律”，假定世界的其余部分原封未动。福多富有启发地把这比作“哈姆雷特问题：何时停止思考”（Fodor 1987, 140）[^fodor-1987]。他声称，框架问题就是“从工程师视角看的哈姆雷特问题”。照此理解，试图避开框架问题的显眼办法是诉诸 **相关性**（relevance）概念：反方论证说，在任一给定行动的语境中，只有情境的某些性质是相关的，于是对行动后果的考虑可以方便地限定于这些性质。"
  step2: "然而，哲学问题并没有被这个计算问题穷尽。悬而未决的哲学问题是：机器人凭什么能确定自己已成功修订了全部信念，使之与其行动的后果相符？唯有此时，它才有资格放心地应用“常识惯性定律”，假定世界的其余部分原封未动。福多发人深省地把这比作“哈姆雷特问题：何时停止思考”（Fodor 1987, 140）[^fodor-1987]，并称框架问题就是“工程师视角下的哈姆雷特问题”。照此理解，想避开框架问题，最显眼的办法是诉诸 **相关性**（relevance）概念。反驳者会说：在任一给定行动的语境中，只有情境的某些性质是相关的；于是，对行动后果的考量尽可以方便地限定在这些性质之上。"
- id: p19
  source: "However, the appeal to relevance is unhelpful. For the difficulty now is to determine what is and what isn't relevant, and this is dependent on context. Consider again the action of removing a tea-cup from the cupboard. If the robot's job is to make tea, it is relevant that this facilitates filling the cup from a tea-pot. But if the robot's task is to clean the cupboard, a more relevant consequence is the exposure of the surface the cup was resting on. An AI researcher in the classical mould could rise to this challenge by attempting to specify what propositions are relevant to what context. But philosophers such as Wheeler (2005; 2008), taking their cue from Dreyfus (1992), perceive the threat of infinite regress here. As Dreyfus puts it, “if each context can be recognized only in terms of features selected as relevant and interpreted in a broader context, the AI worker is faced with a regress of contexts” (Dreyfus 1992, 289)[^dreyfus-1992]."
  step1: "然而，诉诸相关性于事无补。因为困难现在变成：如何确定什么相关、什么不相关，而这取决于语境。再考虑从橱柜取出茶杯这一行动。若机器人的工作是泡茶，相关的在于这一行动便于从茶壶向杯中倒水。但若机器人的任务是清洁橱柜，更相关的后果则是杯子原先所依托的表面被暴露出来。经典模子的 AI 研究者可以迎接这一挑战，尝试指明什么命题与什么语境相关。但惠勒（Wheeler）（2005; 2008）等哲学家从德雷福斯（Dreyfus）（1992）获得提示，在此察觉到无穷倒退的威胁。如德雷福斯所言：“如果每个语境只能依据被选为相关的特征来识别，而这些特征又要在更宽的语境中解释，AI 从业者就面临语境的倒退”（Dreyfus 1992, 289）[^dreyfus-1992]。"
  step2: "然而，诉诸相关性于事无补：困难现在变成——如何判定什么相关、什么不相关？而这取决于语境。再看从橱柜取出茶杯这一行动。若机器人的工作是泡茶，那么这一行动便于从茶壶向杯中注水便是相关的；但若机器人的任务是清洁橱柜，更相关的后果则是杯子原先垫托的表面随之显露。经典路数的 AI 研究者可以迎难而上，尝试指明哪些命题与哪些语境相关。但惠勒（Wheeler）（2005; 2008）等哲学家从德雷福斯（Dreyfus）（1992）得到启发，在此看出无穷倒退的威胁。诚如德雷福斯所言：“如果每个语境只能凭借被选为相关的特征来识别，而这些特征又要在更宽泛的语境中得到解释，AI 从业者就面临一场语境的倒退”（Dreyfus 1992, 289）[^dreyfus-1992]。"
- id: p20
  source: "One way to mitigate the threat of infinite regress is by appeal to the fact that, while humans are more clever than today's robots, they still make mistakes (McDermott 1987)[^mcdermott-1987]. People often fail to foresee every consequence of their actions *even though* they lack none of the information required to derive those consequences, as any novice chess player can testify. Fodor asserts that “the frame problem goes very deep; it goes as deep as the analysis of rationality” (Fodor 1987)[^fodor-1987]. But the analysis of rationality can accommodate the boundedness of the computational resources available to derive relevant conclusions (Simon 1957; Russell & Wefald 1991; Sperber & Wilson 1996)[^russell-1991][^simon-1957][^sperber-1996]. Because it sometimes jumps to premature conclusions, bounded rationality is logically flawed, but no more so than human thinking. However, as Fodor points out, appealing to human limitations to justify the imposition of a heuristic boundary on the kind of information available to an inferential process does not in itself solve the epistemological frame problem (Fodor 2000, Ch.2; Fodor 2008, Ch.4; see also Chow 2013)[^chow-2013][^fodor-2000][^fodor-2008]. This is because it neglects the issue of how the heuristic boundary is to be drawn, which is to say it fails to address the original question of how to specify what is and isn't relevant to the inferential process."
  step1: "缓解无穷倒退威胁的一个办法，是诉诸这一事实：人类虽比今天的机器人聪明，仍会犯错误（McDermott 1987）[^mcdermott-1987]。人们常常未能预见其行动的每一个后果，**即便** 他们并不缺乏推出这些后果所需的任何信息，任何象棋新手都可作证。福多断言：“框架问题极其深刻；它深及对合理性的分析”（Fodor 1987）[^fodor-1987]。但对合理性的分析可以容纳可用于推出相关结论的计算资源的有限性（Simon 1957; Russell & Wefald 1991; Sperber & Wilson 1996）[^russell-1991][^simon-1957][^sperber-1996]。由于有时贸然下结论，受限理性在逻辑上是有缺陷的，但并不比人类思维更有缺陷。然而，正如福多指出的，诉诸人类的局限来证明对推理过程可得信息种类施加启发式边界的正当性，这本身并不解决认识论的框架问题（Fodor 2000, Ch.2; Fodor 2008, Ch.4; see also Chow 2013）[^chow-2013][^fodor-2000][^fodor-2008]。因为它忽视了启发式边界如何划定的问题，也就是说，它没有回答原初的问题：如何指明什么与推理过程相关、什么不相关。"
  step2: "缓解无穷倒退威胁的一条出路，是诉诸这样一个事实：人类虽比今天的机器人聪明，却照样会犯错误（McDermott 1987）[^mcdermott-1987]。人们常常预见不到自己行动的每一个后果，**即便** 他们并不缺少推出这些后果所需的任何信息——任何象棋新手都能作证。福多断言：“框架问题极深；它深及对合理性的分析”（Fodor 1987）[^fodor-1987]。不过，合理性分析本可容纳计算资源的有限性——可用于推出相关结论的资源总是有限的（Simon 1957; Russell & Wefald 1991; Sperber & Wilson 1996）[^russell-1991][^simon-1957][^sperber-1996]。受限理性由于有时仓促断言而在逻辑上并不完备，但这也并不比人类思维更糟。然而，正如福多指出的，诉诸人类自身的局限，来为推理过程可及的信息种类划定一条启发式边界，这本身并未解决认识论的框架问题（Fodor 2000, Ch.2; Fodor 2008, Ch.4; see also Chow 2013）[^chow-2013][^fodor-2000][^fodor-2008]。因为它回避了边界如何划定的问题——也就是说，它没有回答原初的问题：如何指明什么与推理过程相关、什么不相关。"
- id: p21
  source: "Nevertheless, the classical AI researcher, convinced that the regress of contexts will bottom out eventually, may still elect to pursue the research agenda of building systems based on rules for determining relevance, drawing inspiration from the past successes of classical AI. Whereupon the dissenting philosopher might point out that AI's past successes have always been confined to narrow domains, such as playing chess, or reasoning in limited microworlds where the set of potentially relevant propositions is fixed and known in advance. By contrast, human intelligence can cope with an open-ended, ever-changing set of contexts (Dreyfus 1992; Dreyfus 2008; Wheeler 2005; Wheeler 2008; Rietveld 2012)[^dreyfus-1992][^dreyfus-2008][^rietveld-2012][^wheeler-2005][^wheeler-2008]. Furthermore, the classical AI researcher is vulnerable to an argument from holism. A key claim in Fodor's work is that when it comes to circumscribing the consequences of an action, just as in the business of theory confirmation in science, anything could be relevant (Fodor 1983, 105)[^fodor-1983]. There are no *a priori* limits to the properties of the ongoing situation that might come into play. Accordingly, in his modularity thesis, Fodor uses the frame problem to bolster the view that the mind's central processes—those that are involved in fixing belief—are “informationally unencapsulated”, meaning that they can draw on information from any source (Fodor 1983; Fodor 2000; Fodor 2008; Dreyfus 1991, 115–121; Dreyfus 1992, 258)[^dreyfus-1991][^dreyfus-1992][^fodor-1983][^fodor-2000][^fodor-2008]. For Fodor, this is a fundamental barrier to the provision of a computational account of these processes."
  step1: "尽管如此，经典 AI 研究者若确信语境倒退终会见底，仍可选择追求其研究纲领，即依据确定相关性的规则来构建系统，并从经典 AI 过往的成功中汲取灵感。对此，持异议的哲学家可能指出：AI 过往的成功一向局限于狭窄领域，如下棋，或在有限微型世界中的推理——其中潜在相关命题的集合是固定且预先可知的。相比之下，人类智能能应付一个开放的、不断变化的语境集合（Dreyfus 1992; Dreyfus 2008; Wheeler 2005; Wheeler 2008; Rietveld 2012）[^dreyfus-1992][^dreyfus-2008][^rietveld-2012][^wheeler-2005][^wheeler-2008]。此外，经典 AI 研究者在整体论论证面前是脆弱的。福多著作的一个关键主张是：在圈定一个行动的后果时，正如在科学中理论确认的事业中，任何东西都可能相关（Fodor 1983, 105）[^fodor-1983]。当下情境中可能起作用的性质没有 **先验** 的界限。因此，在其模块性论题中，福多用框架问题来支持这一观点：心智的中央过程——那些涉及固定信念的过程——是“信息上不封装的”，意即它们可以从任何来源汲取信息（Fodor 1983; Fodor 2000; Fodor 2008; Dreyfus 1991, 115–121; Dreyfus 1992, 258）[^dreyfus-1991][^dreyfus-1992][^fodor-1983][^fodor-2000][^fodor-2008]。在福多看来，这是为这些过程提供计算说明的根本障碍。"
  step2: "尽管如此，经典 AI 研究者若坚信语境倒退终会见底，仍可以选定自己的研究纲领——依据判定相关性的规则来构建系统，并从经典 AI 昔日的成功中汲取灵感。持异议的哲学家对此可能回应：AI 昔日的成功从来都局限于狭窄领域，或是下棋，或是在有限微型世界中的推理——在这些世界里，潜在相关命题的集合固定且预先已知。相形之下，人类智能应付的是一个开放的、不断变化的语境集合（Dreyfus 1992; Dreyfus 2008; Wheeler 2005; Wheeler 2008; Rietveld 2012）[^dreyfus-1992][^dreyfus-2008][^rietveld-2012][^wheeler-2005][^wheeler-2008]。不仅如此，经典 AI 研究者在整体论论证面前颇为脆弱。福多著作的一个关键主张是：圈定一个行动的后果时——正如科学中为理论寻求确认时——任何东西都可能相关（Fodor 1983, 105）[^fodor-1983]；当下情境中可能登场的性质并无 **先验**（a priori）界限。因此，在模块性论题中，福多借框架问题支持这样一个观点：心智的中央过程——那些参与固定信念的过程——是“信息上不封装的”（informationally unencapsulated），意即它们可以从任何来源汲取信息（Fodor 1983; Fodor 2000; Fodor 2008; Dreyfus 1991, 115–121; Dreyfus 1992, 258）[^dreyfus-1991][^dreyfus-1992][^fodor-1983][^fodor-2000][^fodor-2008]。在福多看来，这正是为这些过程给出计算说明的根本障碍。"
- id: p22
  source: "It is tempting to see Fodor's concerns as resting on a fallacious argument to the effect that a process must be informationally encapsulated to be computationally tractable. We only need to consider the effectiveness of Internet search engines to see that, thanks to clever indexing techniques, this is not the case. Submit any pair of seemingly unrelated keywords (such as “banana” and “mandolin”) to a Web search engine, and in a fraction of a second it will identify every web page, in a database of several billion, that mentions those two keywords (now including this page, no doubt). But this is not the issue at hand. The real issue, to reiterate the point, is one of relevance. A process might indeed be able to index into everything the system knows about, say, bananas and mandolins, but the purported mystery is how it could ever work out that, of all things, bananas and mandolins were relevant to its reasoning task in the first place."
  step1: "人们很容易把福多的忧虑看作立足于一个谬误论证，大意是：一个过程必须信息上封装才能在计算上可行。只需想想互联网搜索引擎的有效性便可看出，多亏巧妙的索引技术，情况并非如此。向网络搜索引擎提交任意一对看似无关的关键词（如“香蕉”与“曼陀林”），不到一秒它就会在数十亿网页的数据库中找出提及这两个关键词的每一个网页（如今无疑也包括本页）。但这不是眼前的问题。真正的问题，再重复一遍，是相关性问题。一个过程或许确实能索引系统所知的一切，比如说关于香蕉和曼陀林的一切，但所谓的神秘之处在于：它究竟如何能首先弄明白，在万物之中，香蕉和曼陀林与它的推理任务相关。"
  step2: "人们很容易认为，福多的忧虑立足于一个谬误论证，其大意是：一个过程必须信息上封装，才可能在计算上可行。只需看看互联网搜索引擎的成效便可知道，凭着巧妙的索引技术，情况并非如此：向网络搜索引擎提交任意一对看似不相干的关键词（比如“香蕉”与“曼陀林”），不出一秒，它就能在数十亿之巨的网页数据库里找齐提及这两个关键词的每一个网页（如今无疑也包括本页）。但这并不是眼前的问题。重申要害：真正的问题是相关性。一个过程或许确实能把系统所知的一切——比如关于香蕉和曼陀林的一切——编成索引，但所谓的神秘之处在于：它究竟如何能首先弄清，芸芸万物之中偏偏是香蕉和曼陀林与它的推理任务相关？"
- id: p23
  source: "To summarize, it is possible to discern an epistemological frame problem, and to distinguish it from a computational counterpart. The epistemological problem is this: How is it possible for holistic, open-ended, context-sensitive relevance to be captured by a set of propositional, language-like representations of the sort used in classical AI? The *computational* counterpart to the epistemological problem is this. How could an inference process tractably be confined to just what is relevant, given that relevance is holistic, open-ended, and context-sensitive?"
  step1: "总而言之，可以辨识出一个认识论的框架问题，并将其与计算上的对应问题区分开来。认识论的问题是：整体性的、开放的、语境敏感的相关性，如何可能被经典 AI 所用的那类命题性的、类似语言的表征所把握？与认识论问题对应的 **计算** 问题是：既然相关性是整体性的、开放的、语境敏感的，一个推理过程如何能把自身可行地限定于恰好相关的东西？"
  step2: "总而言之，我们可以辨识出一个认识论的框架问题，并将其与计算上的对应问题区分开来。认识论的问题是：整体性的、开放的、语境敏感的相关性，如何可能被经典 AI 所用的那类命题式、类语言的表征所把握？与之对应的 **计算** 问题则是：既然相关性是整体性的、开放的、语境敏感的，一个推理过程如何能切实地把自己限定在恰好相关的东西之上？"
- id: p24
  source: "An additional dimension to the frame problem is uncovered in (Fodor 1987)[^fodor-1987], where the metaphysical justification for the common sense law of inertia is challenged. Although Fodor himself doesn't clearly distinguish this issue from other aspects of the wider frame problem, it appears on examination to be a separate philosophical conundrum. Here is the argument. As stated above, solutions to the logical frame problem developed by AI researchers typically appeal to some version of the common sense law of inertia, according to which properties of a situation are assumed by default not to change as the result of an action. This assumption is supposedly justified by the very observation that gave rise to the logical frame problem in the first place, namely that most things don't change when an action is performed or an event occurs."
  step1: "框架问题的另一个维度在（Fodor 1987）[^fodor-1987]中被揭示出来，其中常识惯性定律的形而上学辩护受到挑战。虽然福多本人没有清楚地把这个问题与更宽泛框架问题的其他方面区分开，但经考察它显出是一个单独的哲学难题。论证如下。如上所述，AI 研究者发展的逻辑框架问题解决方案典型地诉诸常识惯性定律的某个版本，据此，情境的性质被默认为不会因行动而改变。这一假定被认为恰恰由最初引发逻辑框架问题的那个观察所证成，即大多数东西在行动施行或事件发生时并不改变。"
  step2: "（Fodor 1987）[^fodor-1987]揭示了框架问题的又一个维度：常识惯性定律的形而上学辩护在那里受到了挑战。福多本人虽未把这一问题与更宽泛框架问题的其他方面清楚区分开来，但细察之下，它显出是一个独立的哲学难题。论证如下。如上所述，AI 研究者发展出的逻辑框架问题解决方案，典型地诉诸某种版本的常识惯性定律：情境的性质被默认为不因行动而改变。这一假定据说恰恰由最初引发逻辑框架问题的那个观察所证成——大多数东西在行动施行或事件发生时并不改变。"
- id: p25
  source: "According to Fodor, this metaphysical justification is unwarranted. To begin with, some actions change many, many things. Those who affirm that painting an object has little or no effect on most properties of most of the objects in the room are likely to concede that detonating a bomb actually does affect most of those properties. But a deeper difficulty presents itself when we ask what is meant by “most properties”. What predicates should be included in our ontology for any of these claims about “most properties” to fall out? To sharpen the point, Fodor introduces the concept of a “fridgeon”. Any particle is defined as a *fridgeon* at a given time if and only if Fodor's fridge is switched on at that time. Now, it seems, the simple act of turning Fodor's fridge on or off brings about an astronomical number of incidental changes. In a universe that can include fridgeons, can it really be the case that most actions leave most things unchanged?"
  step1: "按福多的说法，这一形而上学辩护站不住脚。首先，有些行动改变很多很多的东西。那些断言给物体上漆对房内大多数物体的大多数性质几乎没有影响的人，可能会承认引爆一枚炸弹确实影响其中大多数性质。但当我们追问“大多数性质”是什么意思时，一个更深的困难出现了。要使关于“大多数性质”的这些说法成立，我们的本体论应当包含哪些谓词？为使要点更尖锐，福多引入了“冰箱子”（fridgeon）概念。任一粒子在给定时刻被定义为 **冰箱子**，当且仅当福多的冰箱在那个时刻开着。这样一来，开关福多的冰箱这一简单行动，似乎就带来了天文数字的附带变化。在一个可以包含冰箱子的宇宙中，大多数行动真的能让大多数东西保持不变吗？"
  step2: "在福多看来，这一形而上学辩护站不住脚。首先，有些行动会改变很多很多东西。断言“给物体上漆对房内大多数物体的大多数性质几乎没有影响”的人，多半会承认引爆一枚炸弹确实影响其中大多数性质。可当我们追问“大多数性质”意所何指时，更深的困难就出现了：要让这些关于“大多数性质”的论断得以成立，我们的本体论里该收进哪些谓词？为把要点磨得更尖，福多引入了“冰箱子”（*fridgeon*）概念：任一粒子在给定时刻是 **冰箱子**，当且仅当福多的冰箱在那个时刻开着。如此说来，开关福多的冰箱这一简单动作，似乎就带来了天文数字的附带变化。在一个可能包含冰箱子的宇宙里，大多数行动果真能让大多数东西保持不变吗？"
- id: p26
  source: "The point here is not a logical one. The effect on fridgeons of switching Fodor's fridge on and off can concisely be represented without any difficulty (Shanahan 1997, 25)[^shanahan-1997]. Rather, the point is metaphysical. The common sense law of inertia is only justified in the context of the right ontology, the right choice of objects and predicates. But what is the right ontology to make the common sense law of inertia work? Clearly, fridgeons and the like are to be excluded. But what metaphysical principle underpins such a decision?"
  step1: "这里的要点不是逻辑的。开关福多的冰箱对冰箱子的影响可以毫无困难地简洁表征出来（Shanahan 1997, 25）[^shanahan-1997]。毋宁说，要点是形而上学的。常识惯性定律只有在正确的本体论——对对象与谓词的正确选择——的语境中才得到辩护。但什么样的本体论才能让常识惯性定律奏效？显然，冰箱子之类必须排除在外。可支撑这一决断的又是什么形而上学原则？"
  step2: "这里的要点不在逻辑。开关福多的冰箱对冰箱子的影响，尽可以毫无困难地简洁表征出来（Shanahan 1997, 25）[^shanahan-1997]。要点是形而上学的：常识惯性定律唯有在恰当的本体论——对对象与谓词的恰当选择——之下才谈得上证成。可是，什么样的本体论才能让常识惯性定律奏效？冰箱子之类显然要排除在外，那么支撑这一决断的又是哪条形而上学原则？"
- id: p27
  source: "These questions and the argument leading to them are very reminiscent of Goodman's treatment of induction (Goodman 1954)[^goodman-1954]. Goodman's “new riddle of induction”, commonly called the *grue paradox*, invites us to consider the predicate *grue*, which is true before time *t* only of objects that are green and after time *t* only of objects that are blue. The puzzle is that every instance of a green emerald examined before time *t* is also an instance of a grue emerald. So, the inductive inference that all emeralds are grue seems to be no less legitimate than the inductive inference that all emeralds are green. The problem, of course, is the choice of predicates. Goodman showed that inductive inference only works in the context of the right set of predicates, and Fodor demonstrates much the same point for the common sense law of inertia."
  step1: "这些问题及引出它们的论证令人想起古德曼（Goodman）对归纳的处理（Goodman 1954）[^goodman-1954]。古德曼的“新归纳之谜”，通称 *grue* 悖论（grue paradox），让我们考虑谓词 *grue*：它在时间 *t* 之前只对绿色的对象为真，在时间 *t* 之后只对蓝色的对象为真。谜题在于：在时间 *t* 之前检验的每一颗绿祖母绿也都是 grue 祖母绿的一个实例。于是，“所有祖母绿都是 grue 的”这一归纳推理似乎并不比“所有祖母绿都是绿色的”这一归纳推理更不合法。问题当然出在谓词的选择上。古德曼证明，归纳推理只有在正确的谓词集合的语境中才有效，而福多就常识惯性定律论证了几乎同样的观点。"
  step2: "这些问题以及引出它们的论证，令人强烈联想到古德曼（Goodman）对归纳的讨论（Goodman 1954）[^goodman-1954]。古德曼的“新归纳之谜”，通称 *grue* 悖论（grue paradox），让我们考虑谓词 *grue*：它在时间 *t* 之前恰好对绿色对象为真，在时间 *t* 之后只对蓝色对象为真。谜题在于：在时间 *t* 之前受检的每一颗绿祖母绿，同样是一颗 grue 祖母绿的实例。于是，“所有祖母绿皆 grue”这一归纳推理，看起来并不比“所有祖母绿皆绿”更不合法。症结当然在谓词的选择。古德曼证明归纳推理唯有在恰当的谓词集合之下才行得通；福多则就常识惯性定律论证了几乎同一点。"
- id: p28
  source: "An intimate relationship of a different kind between the frame problem and the problem of induction is proposed by Fetzer (1991), who writes that “The problem of induction [is] one of justifying some inferences about the future as opposed to others. The frame problem, likewise, is one of justifying some inferences about the future as opposed to others. The second problem is an instance of the first.” This view of the frame problem is highly controversial, however (Hayes 1991)[^hayes-1991]."
  step1: "费策尔（Fetzer）（1991）提出了框架问题与归纳问题之间另一种密切关系，他写道：“归纳问题［是］为某些关于未来的推理而非另一些推理辩护的问题。框架问题同样是为某些关于未来的推理而非另一些推理辩护的问题。第二个问题是第一个问题的一个实例。”不过，对框架问题的这种看法极有争议（Hayes 1991）[^hayes-1991]。"
  step2: "费策尔（Fetzer）（1991）则提出了框架问题与归纳问题之间另一种密切关联。他写道：“归纳问题［是］为某些关于未来的推理而非另一些推理辩护的问题；框架问题同样是为某些关于未来的推理而非另一些推理辩护的问题；第二个问题是第一个问题的一个实例。”不过，这种框架问题观极有争议（Hayes 1991）[^hayes-1991]。"
- id: p29
  source: "The narrow, technical frame problem generated a great deal of work in logic-based artificial intelligence in the late 1980s and early 1990s, and its wider philosophical implications came to the fore at around the same time. But the importance each thinker accords to the frame problem today will typically depend on their stance on other matters."
  step1: "狭窄而技术性的框架问题在 20 世纪 80 年代末与 90 年代初催生了逻辑式人工智能中的大量工作，其更宽泛的哲学意涵也在大约同一时期浮出水面。但今天各思想家赋予框架问题的重要性，典型地取决于他们在其他问题上的立场。"
  step2: "狭窄而技术性的框架问题，在 20 世纪 80 年代末到 90 年代初的基于逻辑的人工智能中催生了大量研究；其更宽泛的哲学意涵也大约在同一时期浮出水面。而在今天，各思想家赋予框架问题的重要性，往往取决于他们在其他问题上的立场。"
- id: p30
  source: "Within classical AI, a variety of workable solutions to the logical frame problem have been developed, and it is no longer considered a serious obstacle even for those working in a strictly logic-based paradigm (Shanahan 1997; Reiter 2001; Shanahan 2003; Lifschitz 2015)[^lifschitz-2015][^reiter-2001][^shanahan-1997][^shanahan-2003]. It's worth noting that logically-minded AI researchers can consistently retain their methodology and yet, to the extent that they view their products purely as engineering, can reject the traditional cognitive scientist's belief in the importance of computation over representations for understanding the mind. Moreover, insofar as the goal of classical AI is not computers with human-level intelligence, but is simply the design of better and more useful computer programs, it is immune to the philosophical objections of Fodor, Dreyfus, and the like. Significantly though, for AI researchers working outside the paradigm of symbolic representation altogether—those working in situated robotics, for example—the logical frame problem simply doesn't feature in day-to-day investigations."
  step1: "在经典 AI 内部，逻辑框架问题的多种可行解决方案已经发展出来，即便对在严格逻辑范式下工作的人而言，它也不再被视为严重障碍（Shanahan 1997; Reiter 2001; Shanahan 2003; Lifschitz 2015）[^lifschitz-2015][^reiter-2001][^shanahan-1997][^shanahan-2003]。值得注意的是，持逻辑思维的 AI 研究者可以一贯地保留其方法论，同时在把他们产品纯视为工程的限度内，拒绝传统认知科学家关于“对表征的计算对理解心灵十分重要”的信念。此外，只要经典 AI 的目标不是具有人类水平智能的计算机，而只是设计更好更有用的计算机程序，它就对福多、德雷福斯等人的哲学反驳免疫。不过，值得注意的是，对完全在符号表征范式之外工作的 AI 研究者——例如在情境机器人学（situated robotics）中工作的那些人——来说，逻辑框架问题根本不出现在日常研究之中。"
  step2: "在经典 AI 内部，逻辑框架问题的多种可行方案已相继发展出来；即便对严格遵循逻辑范式的研究者而言，它也不再被视为严重障碍（Shanahan 1997; Reiter 2001; Shanahan 2003; Lifschitz 2015）[^lifschitz-2015][^reiter-2001][^shanahan-1997][^shanahan-2003]。值得注意的是，倾向逻辑的 AI 研究者尽可以前后一贯地保留其方法论，同时——只要把自己的产品仅仅当作工程来看待——拒斥传统认知科学家“计算作用于表征对理解心灵至关重要”的信念。再者，经典 AI 的目标既然不是造出具有人类水平智能的计算机，而只是设计更好、更有用的计算机程序，它便对福多、德雷福斯之流的哲学反驳免疫。不过有一点意味深长：对全然置身符号表征范式之外的 AI 研究者——例如从事情境机器人学（situated robotics）的人——来说，逻辑框架问题压根不出现在其日常研究之中。"
