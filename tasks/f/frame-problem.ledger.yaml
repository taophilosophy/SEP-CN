  source: "Dreyfus claims that this “extreme version of the frame problem” is no less a consequence of the Cartesian assumptions of classical AI and cognitive science than its less demanding relatives (Dreyfus 2008, 361)[^dreyfus-2008]. He advances the view that a suitably Heideggerian account of mind is the basis for dissolving the frame problem here too, and that our “background familiarity with how things in the world behave” is sufficient, in such cases, to allow us to “step back and figure out what is relevant and how”. Dreyfus doesn't explain how, given the holistic, open-ended, context-sensitive character of relevance, this figuring-out is achieved. But Wheeler, from a similarly Heideggerian position, claims that the way to address the “inter-context” frame problem, as he calls it, is with a dynamical system in which “the causal contribution of each systemic component partially determines, and is partially determined by, the causal contributions of large numbers of other systemic components” (Wheeler 2008, 341)[^wheeler-2008]. A related proposal is put forward by Shanahan and Baars (2005; see also Shanahan 2010, Ch.6)[^shanahan-2010], based on global workspace theory (Baars 1988)[^baars-1988], according to which the brain incorporates a solution to the problem of informational unencapsulation by instantiating an architecture in which a) the responsibility for determining relevance is not centralised but is distributed among parallel specialist processes, and b) a serially unfolding global workspace state integrates relevant contributions from multiple domains."
  step1: "德雷福斯声称，这个“框架问题的极端版本”与其要求较低的亲缘问题一样，都是经典 AI 与认知科学的笛卡尔式假定的后果（Dreyfus 2008, 361）[^dreyfus-2008]。他提出，一种恰切的海德格尔式心灵说明是消解此处置身框架问题的基础，并且在这种情形下，我们“对世界中事物如何运作的背景熟悉”足以让我们“退后一步，弄清什么是相关的以及如何相关”。德雷福斯没有解释，鉴于相关性的整体性、开放性、语境敏感性，这种弄清是如何达成的。但惠勒从类似的海德格尔式立场出发，声称处理他所谓的“跨语境”框架问题的办法，是采用一个动力系统，其中“每个系统组分的因果贡献部分地决定、又部分地取决于大量其他系统组分的因果贡献”（Wheeler 2008, 341）[^wheeler-2008]。沙纳汉与巴尔斯（2005; see also Shanahan 2010, Ch.6）[^shanahan-2010]基于全局工作空间理论（Baars 1988）[^baars-1988]提出了一个相关方案：大脑通过实例化这样一种架构来解决信息非封装问题——a) 判定相关性的职责不是集中的，而是分布于并行的专门过程之中；b) 逐步展开的全局工作空间状态整合来自多个领域的相关贡献。"
  step2: "德雷福斯声称，这个“框架问题的极端版本”与其要求较低的诸亲缘问题一样，都是经典 AI 与认知科学之笛卡尔式假定的产物（Dreyfus 2008, 361）[^dreyfus-2008]。他主张，一种恰切的海德格尔式心灵说明，同样是在此处消解框架问题的基础；而且在这类情形中，我们“对世界中事物如何行事的背景熟悉”已足以让我们“退后一步，弄清何者相关、如何相关”。不过，考虑到相关性的整体性、开放性与语境敏感性，德雷福斯并未说明这种“弄清”是如何达成的。惠勒则从类似的海德格尔式立场主张，处理他所谓的“跨语境”框架问题，出路在于一种动力系统，其中“每一系统组分的因果贡献既部分地决定、又部分地取决于大量其他系统组分的因果贡献”（Wheeler 2008, 341）[^wheeler-2008]。沙纳汉（Shanahan）与巴尔斯（Baars）（2005; see also Shanahan 2010, Ch.6）[^shanahan-2010]基于全局工作空间理论（global workspace theory）（Baars 1988）[^baars-1988]提出了一个相关方案：大脑解决信息非封装问题的方式，是落实这样一种架构——a) 判定相关性的职责并不集中，而是分布于并行的专门过程之中；b) 一个逐步展开的全局工作空间状态整合来自多个领域的相关贡献。"
