      1. *Colour*(*x*, *c*) holds after *Paint*(*x*, *c*)
      2. *Position*(*x*, *p*) holds after *Move*(*x*, *p*)
    step1: |-
      1. *Colour*(*x*, *c*) 在 *Paint*(*x*, *c*) 之后成立
      2. *Position*(*x*, *p*) 在 *Move*(*x*, *p*) 之后成立
    step2: |-
      1. *Paint*(*x*, *c*) 执行后 *Colour*(*x*, *c*) 成立
      2. *Move*(*x*, *p*) 执行后 *Position*(*x*, *p*) 成立
  - id: 7
    kind: body
    source: |-
      Now, suppose we have an initial situation in which *Colour*(*A*, *Red*) and *Position*(*A*, *House*) hold. According to the machinery of deductive logic, what then holds after the action *Paint*(*A*, *Blue*) followed by the action *Move*(*A*, *Garden*)? Intuitively, we would expect *Colour*(*A*, *Blue*) and *Position*(*A*, *Garden*) to hold. Unfortunately, this is not the case. If written out more formally in classical predicate logic, using a suitable formalism for representing time and action such as the situation calculus (McCarthy & Hayes 1969)[^mccarthy-1969], the two formulae above only license the conclusion that *Position*(*A*, *Garden*) holds. This is because they don't rule out the possibility that the colour of *A* gets changed by the *Move* action.
    step1: |-
      现在，假设我们有一个初始情境，其中 *Colour*(*A*, *Red*) 与 *Position*(*A*, *House*) 成立。按照演绎逻辑的机制，在动作 *Paint*(*A*, *Blue*) 之后又执行动作 *Move*(*A*, *Garden*)，此时何者成立？直观上，我们预期 *Colour*(*A*, *Blue*) 与 *Position*(*A*, *Garden*) 成立。可惜并非如此。若用经典谓词逻辑把上述内容更正式地写出来，并采用某种适于表征时间与动作的形式系统，例如情景演算（situation calculus，McCarthy & Hayes 1969）[^mccarthy-1969]，那么上面两个公式仅足以支持 *Position*(*A*, *Garden*) 成立这一结论。原因在于，它们并未排除 *A* 的颜色会被 *Move* 动作改变的可能性。
    step2: |-
      现在设有一个初始情境，其中 *Colour*(*A*, *Red*) 与 *Position*(*A*, *House*) 成立。依照演绎逻辑的机制，在动作 *Paint*(*A*, *Blue*) 之后又执行动作 *Move*(*A*, *Garden*)，此时何者成立？直观上，我们预期 *Colour*(*A*, *Blue*) 与 *Position*(*A*, *Garden*) 成立。可惜事情并非如此。若以经典谓词逻辑把上述内容写得更严格，并采用某种适于表征时间与动作的形式系统——例如情景演算（situation calculus，McCarthy & Hayes 1969）[^mccarthy-1969]——那么这两个公式仅足以支持 *Position*(*A*, *Garden*) 成立这一结论。原因在于，它们并未排除 *A* 的颜色被 *Move* 动作改变的可能性。
