  source: "Although it can be argued that it arises even in a connectionist setting (Haselager & Van Rappard 1998; Samuels 2010)[^haselager-1998][^samuels-2010], the frame problem inherits much of its philosophical significance from the classical assumption of the explanatory value of computation over representations, an assumption that has been under vigorous attack for some time (Clark 1997; Wheeler 2005)[^clark-1997][^wheeler-2005]. Despite this, many philosophers of mind, in the company of Fodor and Pylyshyn, still subscribe to the view that human mental processes consist chiefly of inferences over a set of propositions, and that those inferences are carried out by some form of computation. To such philosophers, the epistemological frame problem and its computational counterpart remain a genuine threat."
  step1: "尽管可以论证它甚至在联结主义环境中也会出现（Haselager & Van Rappard 1998; Samuels 2010）[^haselager-1998][^samuels-2010]，框架问题的哲学重要性多半继承自经典假设——即对表征的计算具有解释价值——而这一假设一段时间以来一直受到猛烈攻击（Clark 1997; Wheeler 2005）[^clark-1997][^wheeler-2005]。尽管如此，许多心灵哲学家与福多和普利什恩（Pylyshyn）一道，仍赞成这样的观点：人类心理过程主要由对一组命题的推理构成，而这些推理由某种形式的计算执行。对这类哲学家来说，认识论的框架问题及其计算对应物仍然是真实的威胁。"
  step2: "尽管可以论证框架问题甚至在联结主义环境中也会出现（Haselager & Van Rappard 1998; Samuels 2010）[^haselager-1998][^samuels-2010]，它的哲学分量大半承自经典假设——计算作用于表征具有解释价值——而这一假设已遭受相当长时间的猛烈抨击（Clark 1997; Wheeler 2005）[^clark-1997][^wheeler-2005]。尽管如此，许多心灵哲学家——福多与普利什恩（Pylyshyn）亦在其列——依然主张：人类心理过程主要由对一组命题的推理构成，而这些推理由某种形式的计算来执行。在这样的哲学家看来，认识论的框架问题及其计算对应物仍是实实在在的威胁。"
- id: p32
  source: "For Wheeler and others, classical AI and cognitive science rest on Cartesian assumptions that need to be overthrown in favour of a more Heideggerian stance before the frame problem can be overcome (Dreyfus 2008; Wheeler 2005; 2008; Rietveld 2012)[^dreyfus-2008][^rietveld-2012][^wheeler-2005]. According to Wheeler (2005; 2008), the situated robotics movement in AI that originated with the work of Brooks (1991) exemplifies the right way to go. Dreyfus is in partial agreement, but contends that the early products of situated robotics “finesse rather than solve the frame problem” because “Brooks's robots respond only to fixed isolable features of the environment, not to context or changing significance” (Dreyfus 2008, 335)[^dreyfus-2008]. Dreyfus regards the neurodynamics work of Freeman (2000) as a better foundation for the sort of Heideggerian approach to AI in which the frame problem might be dissolved (see also Shanahan 2010, Ch.5; Rietveld 2012; Bruineberg & Rietveld 2014)[^bruineberg-2014][^rietveld-2012][^shanahan-2010]. Dreyfus is impressed by Freeman's approach because the neurodynamical record of significance is neither a representation nor an association, but (in dynamical systems terms) “a repertoire of attractors” that classify possible responses, “the attractors themselves being the product of past experience” (Dreyfus 2008, 354)[^dreyfus-2008]."
  step1: "在惠勒等人看来，经典 AI 与认知科学立足的笛卡尔式假定必须被推翻、代之以更海德格尔式的立场，然后才能克服框架问题（Dreyfus 2008; Wheeler 2005; 2008; Rietveld 2012）[^dreyfus-2008][^rietveld-2012][^wheeler-2005]。按照惠勒（2005; 2008），源于布鲁克斯（Brooks）（1991）工作的 AI 情境机器人学运动正是应当走的路的范例。德雷福斯部分同意，但坚持认为情境机器人学的早期产品“闪避而非解决框架问题”，因为“布鲁克斯的机器人只对环境中固定而可孤立的特征作出反应，而不对语境或变化的意义作出反应”（Dreyfus 2008, 335）[^dreyfus-2008]。德雷福斯认为弗里曼（Freeman）（2000）的神经动力学工作是更佳的基础，可用于那种或许能消解框架问题的海德格尔式 AI 进路（see also Shanahan 2010, Ch.5; Rietveld 2012; Bruineberg & Rietveld 2014）[^bruineberg-2014][^rietveld-2012][^shanahan-2010]。德雷福斯对弗里曼的进路印象深刻，因为意义的神经动力学记录既不是表征也不是联想，而是（用动力系统术语说）一个对可能反应加以分类的“吸引子库”，“吸引子本身是过去经验的产物”（Dreyfus 2008, 354）[^dreyfus-2008]。"
  step2: "在惠勒（Wheeler）等人看来，经典 AI 与认知科学立足的笛卡尔式假定必须先被推翻、代之以更海德格尔式的立场，框架问题才可能被克服（Dreyfus 2008; Wheeler 2005; 2008; Rietveld 2012）[^dreyfus-2008][^rietveld-2012][^wheeler-2005]。在惠勒（2005; 2008）看来，发端于布鲁克斯（Brooks）（1991）工作的 AI 情境机器人学运动正是正确道路的典范。德雷福斯部分同意，但坚称情境机器人学的早期产品“绕开了框架问题而非解决它”，因为“布鲁克斯的机器人只对环境中固定而可孤立的特征作出反应，对语境或变化着的意义则无动于衷”（Dreyfus 2008, 335）[^dreyfus-2008]。德雷福斯认为弗里曼（Freeman）（2000）的神经动力学工作才是更牢靠的基础，可供那种有望消解框架问题的海德格尔式 AI 进路立足（see also Shanahan 2010, Ch.5; Rietveld 2012; Bruineberg & Rietveld 2014）[^bruineberg-2014][^rietveld-2012][^shanahan-2010]。弗里曼的进路令德雷福斯印象深刻：意义的神经动力学记录既非表征亦非联想，而是（用动力系统的术语说）一个给可能反应分类的“吸引子（attractor）库”——“吸引子本身是过去经验的产物”（Dreyfus 2008, 354）[^dreyfus-2008]。"
