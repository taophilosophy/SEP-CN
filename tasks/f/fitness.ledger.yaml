      ## 3. 个体适合度与性状适合度
  - id: 11
    kind: body
    source: |-
      Some philosophers (notably Sober, 2013) have argued that evolutionary fitness is a property of populations and not of individual organisms, or alternatively that fitness is a property of traits and not of the individuals that possess them. Individual fitness values are, they argue, empirically inaccessible and predictively useless. If trait fitness is defined in terms of the average fitness value of individuals bearing the trait, then it will turn out that there are individual fitnesses and individual fitness differences, even if it is the case that evolutionary biologists’ interests are confined to trait fitnesses. This claim has been challenged (cf. Pence and Ramsey 2014): sometimes biologists estimate trait fitnesses by studying individual fitnesses (Endler 1986)[^endler-1986].
    step1: |-
      一些哲学家（尤其是索伯，2013）主张，进化适合度是种群的属性，而不是个体有机体的属性；或者换个说法，适合度是性状的属性，而不是拥有这些性状的个体的属性。他们论证说，个体适合度值在经验上不可及，且在预测上无用。如果性状适合度是以拥有该性状的个体的平均适合度值来定义的，那么结果将表明存在个体适合度与个体适合度差异，即使进化生物学家的兴趣仅限于性状适合度。这一主张已受到挑战（参看 Pence and Ramsey 2014）：有时生物学家通过研究个体适合度来估计性状适合度（Endler 1986）[^endler-1986]。
    step2: |-
      一些哲学家（尤以索伯 2013 为代表）主张，进化适合度是种群而非个体有机体的属性；或者换个说法，适合度是性状的属性，而非性状承载者的属性。他们认为，个体适合度值在经验上无从把握，在预测上亦无所用。可是，倘若性状适合度要以拥有该性状的个体的平均适合度值来定义，那么个体适合度与个体适合度差异便会应运而生——即便进化生物学家的兴趣只限于性状适合度。这一主张遭到了质疑（参看 Pence and Ramsey 2014）：生物学家有时正是通过研究个体适合度来估计性状适合度（Endler 1986）[^endler-1986]。
  - id: 12
    kind: body
    source: |-
      It has also been held that trait fitness and fitness difference are both something more than and different from the average of individual fitnesses and fitness differences. On this view, trait fitness is a property of populations and, in part, their population structure—that is, the ways in which traits are distributed in the population. An example (to be explored further below) is reflected in cases where the fitness of a trait depends not just on its incidence in a population, but also on its variance within. A trait’s variance in a population cannot be reflected in individual fitness any more than the entropy of a volume of gas can be reflected in the properties of any of the individual molecules that compose it and contribute to its entropy. This suggests that trait fitness is not reducible to, definable in terms of, or even entirely supervenient on the relationship between individuals (e.g., organisms) and their environments.
    step1: |-
      也有人主张，性状适合度与适合度差异都多于并有别于个体适合度与个体适合度差异的平均值。按此观点，性状适合度是种群的属性，并且部分地是其种群结构的属性——即性状在种群中分布的方式。一个例子（下文将进一步探讨）反映在如下情形中：一个性状的适合度不仅取决于它在种群中的发生率，还取决于它在种群内的方差。一个性状在种群中的方差无法反映在个体适合度中，正如一团气体的熵无法反映在组成它并对其熵有所贡献的任何单个分子的属性中。这表明，性状适合度不可还原为、不可用个体（如有机体）与其环境之间的关系来定义，甚至不完全随附于这种关系。
    step2: |-
      另有一种看法认为，性状适合度与适合度差异，既多于、也有别于个体适合度与个体适合度差异的平均值。照此看法，性状适合度是种群的属性，并且部分地取决于种群的构造——即诸性状在种群中的分布方式。一个例子（下文还会讨论）见于这样的情形：某一性状的适合度不仅取决于它在种群中的出现率，还取决于它在种群内部的方差。一个性状在种群中的方差，无法反映于个体适合度，正如一团气体的熵无法反映于组成该气体、并对其熵有所贡献的任何一个分子的属性。由此可见，性状适合度不能还原为个体（如有机体）与环境之间的关系，不能用这种关系来定义，甚至并不完全随附于这种关系。
  - id: 13
    kind: body
    source: |-
      The disagreement about whether fitness is a property of biological individuals (genes, genotypes, organisms, families, populations and other groups or even species) as opposed to a property of traits of these individuals, has made significant another debate about the explanatory role of fitness in the theory of natural selection. Among those who endorse trait fitness (differences), and not individual fitness (differences), as a fundamental explanatory factor in natural selection, there is a dispute about whether its explanatory role reflects its causal force, or whether trait fitness is a purely statistical concept employed in the theory of natural selection to make demographic predictions about future trait distributions, without entering into any causal nexus among the objects so to speak. Thus, Matthen and Ariew (2002, 56) write, “Unlike vernacular [individual] fitness, predictive [trait] fitness is not a cause of selection, or of evolution for that matter…. [P]redictive fitness is a measure of evolutionary change not a cause.” This view confers an obligation on those who embrace it to explain how the theory of natural selection can provide contingent explanations without trading in causal relations among its explanatory variables.
    step1: |-
      关于适合度究竟是生物个体（基因、基因型、有机体、家庭、种群以及其他群体甚至物种）的属性，还是这些个体的性状的属性，这一分歧使另一场关于适合度在自然选择理论中解释角色的争论变得重要起来。在那些认可性状适合度（差异）、而非个体适合度（差异）作为自然选择中基本解释因素的人中间，存在一场争论：其解释角色是否反映其因果力量，抑或性状适合度是一个纯粹统计性的概念，在自然选择理论中用于对未来性状分布作人口学预测，而并不进入所谓对象之间的任何因果联系。因此，Matthen 和 Ariew（2002, 56）写道：“与通俗的〔个体〕适合度不同，预测性的〔性状〕适合度不是选择的原因，也不是进化的原因……〔预测性〕适合度是进化变化的量度，而不是原因。”这一观点给接受它的人施加了一项义务：说明自然选择理论如何能够在不诉诸其解释变量之间的因果关系的情况下，提供偶然性解释。
    step2: |-
