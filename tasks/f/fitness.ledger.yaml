      ## 6. How the Problems of Defining Biological Individuality Affect the Notion of Fitness
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      In previous sections, we remarked on the difficulty of identifying the precise propensity that could, according to some, ground fitness ascriptions. Moreover, it is often difficult to isolate the populations where the evolutionary change is occurring. This is in part an operational problem, but for many biological systems, this difficulty may in fact reveal a deeper ontological issue. Thinking about fitness in reproductive terms depends on the possibility of identifying offspring (or successive replicators) and populations of them. For most Metazoans, this appears to be relatively straightforward. But how are we to treat the evolution of colonies, clonal organisms and symbionts (and hypothetically ecosystems)? Many philosophers have argued that our philosophy of biology’s usual bestiary does not reflect some of the complex organisation actually to be found in nature (J. Wilson 1999, D.S. Wilson and Sober 1989, Godfrey-Smith 2009, O’Malley and Dupré 2007, Bouchard and Huneman 2013)[^bouchard-2013][^godfrey-2009][^o’malley-2007][^wilson-1999][^wilson-1989] For many biological systems, organismal boundaries seem arbitrary ways to carve up the biological world. Those boundaries may merely reflect an impoverished way of thinking about biological individuality (Pradeu 2012, Haber 2013)[^haber-2013]. Many biological individuals are in fact complex arrangements of other individuals. When these individuals belong to a single species (ex. some eusocial insects) a gene selectionist view according to which fitness is understood as the differential reproductive success of alleles may be available. But in the case of multi-species communities (e.g., fungus-termite colonies), allelic success will not track evolutionary change since some of the adaptations are not fully biotic (Bouchard 2009)[^bouchard-2009]. Moreover, it has been argued (Turner 2004, Bouchard 2004, 2008)[^bouchard-2004][^bouchard-2004-2][^turner-2004] that some individuals that are adapting are not reproducing at all.
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      Biological individuality is much more varied and heterogeneous than previously believed and this additional complexity puts pressure on the notion that reproductive success can act as a ‘universal currency’ of fitness. The difficulties of establishing reproductive success for some clonal organisms, for collectives of organisms and for multi-species assemblages has led some biologists and philosophers to entertain alternative concepts of fitness. Leigh Van Valen, in his attempts to develop a theory of evolution that would allow for the evolution of whole communities (Van Valen 1975, 1989, 1991)[^van-1975], suggested that fitness as energy control could explain the evolution of a broader range of biological systems. “Rather than saying that natural selection is expected differential reproduction, we should say that it is expected differential expansion” (Van Valen 1989, 7)[^van-1989]. By ‘expansion’ Van Valen doesn’t mean expansion in physical space (although that may occur) but expansion in resource or energy space. In this approach, energy is seen as the ‘universal currency’: a fitter community is one that controls more energy than another community. For ‘simpler’ biological systems such as sexual species with discrete generations, increased reproductive success is a good proxy for increased energy success and therefore previous measurements and models of reproductive output remain useful but their explanatory exhaustiveness is relativized. Although energy can seem to be a universal measure of fitness that could apply to the all the varied types of biological individuals that can emerge, it’s not clear that Van Valen’s approach can be as universal as desired since it has difficulty explaining increases in efficiency in energy control (see Bouchard 2004 chap 3 for analysis)[^bouchard-2004][^bouchard-2004-2]. This has motivated Bouchard (2004, 2008, 2011) to argue for an account of evolution focusing on differential persistence (reminiscent of Thoday 1953)[^thoday-1953]. Bouchard (2004, 2008, 2011) argues that Persistence Through Time of a lineage is the property maximized by evolution by natural selection: maximization of relative reproductive success or maximization of energy control are only two dominant strategies for persistence increase (see Bourrat 2014 and Doolittle 2014 for related approaches)[^bourrat-2014][^doolittle-2014]. In this approach (lineage) $X$is fitter than (lineage) $Y$ if $X$has a higher propensity to persist for $Z$ amount of time than $Y$. Some of the problems of propensities remain, but we gain a way to assess ecological fitness (probability of persistence) in a way that can be independent of reproductive success. Persistence is the overarching design-problem. Increased reproductive potential is but one powerful way to increase one’s potential to persist.
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      The question of how to define biological individuality is an ontological question about what individuals can evolve in response to natural selection. Many biological systems differ in form and in function from our garden variety Metazoans. How are we to understand the evolution of symbiotic communities involving bacteria with lateral gene transfer? How are we to make sense of the complex traits of eusocial insects? Not all these emergent individuals qua individuals replicate. Whether it’s by focusing on energy or persistence (or some other account) a complete understanding of fitness should reflect that fact—or accept that it cannot alone account for some adaptive change in the biological world.
    step1: TBD
    step2: TBD
