      > $x$ is fitter than $y$ if and only if $x$’s traits enable it to solve the ‘design problems’ set by the environment more fully than $y$’s traits do.
    step1: |-
      > 当且仅当 $x$ 的性状比 $y$ 的性状更充分地解决环境所设定的“设计问题”时，$x$ 比 $y$ 更适合。
    step2: |-
      > 当且仅当 $x$ 的性状能比 $y$ 的性状更充分地解决环境所设定的那些“设计问题”，$x$ 才比 $y$ 更适合。
  - id: 8
    kind: body
    source: |-
      One may ask, What are these design problems? How many of them are there? Is there any way of measuring the degree to which $x$ exceeds $y$ in their solution? Answers to these questions simply reinforce the threat of tautology that faces the theory. To begin with the notion of “design problems” is vague and metaphorical; or, if treated literally, design problems will all be relative to the overarching objective of leaving more descendants. Thus the definition may simply hide the original problem of distinguishing fitness from reproductive rates, instead of solving it.
    step1: |-
      人们可以问：这些设计问题是什么？有多少个？有没有办法衡量 $x$ 在解决它们方面超过 $y$ 的程度？对这些问题的回答，只会加强该理论面临的同义反复威胁。首先，“设计问题”这一观念含糊而隐喻；或者，若按字面理解，设计问题将全都相对于留下更多后代这一总体目标。因此，该定义可能只是掩盖了把适合度与繁殖率区分开来的原初问题，而不是解决了它。
    step2: |-
      人们不禁要问：这些“设计问题”究竟是什么？数目有多少？能否衡量 $x$ 在解决这些问题上超出 $y$ 的程度？凡此种种，答案只会加重该理论所面临的同义反复之虞。首先，“设计问题”一语含糊而多隐喻；若照字面理解，则一切设计问题都相对于“留下更多后代”这一总目标。如此，该定义或许只是把“如何区分适合度与繁殖率”这个原初难题遮掩起来，而并未解决它。
  - id: 9
    kind: body
    source: |-
      Second, the number of design problems is equal to the number of distinct environmental features that affect survival, and of course reproduction, and this number is probably uncountable. Accordingly, prima facie, the proposed definition provides no hope of cardinal or even ordinal measurement that would enable us to predict or explain quantitatively differences in rates of reproduction, and the evolutionary processes that depend on these rates. Moreover, ecological fitness accounts may not have provided a satisfactory story about how to carve up the relevant reference environment that is supposed to have an impact on the survival of said organisms (Abrams 2009)[^abrams-2009]. It is no wonder that biologists, sensible of the importance of predictive precision and explanatory testability, have had little truck with ecological fitness and have defined ‘$x$ is fitter than $y$’ in terms of quantitatively measurable reproductive rates. This tendency of course simply adds force to the original argument. If the only way to make fitness differences scientifically tractable is to trivialize the theory, so much the worse for the theory.
    step1: |-
      其次，设计问题的数目等于影响生存——当然也影响繁殖——的不同环境特征的数目，而这个数目大概是不可数的。据此，初看之下，所提出的定义没有希望提供基数测量、甚至序数测量，从而使我们能够定量地预测或解释繁殖率的差异，以及依赖这些繁殖率的进化过程。此外，生态适合度的说明可能并未就如何划分那个据说对上述有机体的生存有影响的相关参照环境，给出令人满意的说法（Abrams 2009）[^abrams-2009]。难怪生物学家们深知预测精确性与解释可检验性的重要，对生态适合度兴趣寥寥，转而以可定量测量的繁殖率来定义“$x$ 比 $y$ 更适合”。这种倾向当然只是给原来的论证增添了力量。如果使适合度差异在科学上可处理的唯一办法是把理论琐碎化，那么对该理论就更加不利了。
    step2: |-
      其次，设计问题的数目等于影响生存（自然也影响繁殖）的不同环境特征的数目，而这个数目多半不可计数。于是初看之下，该定义便无法提供基数测量，甚至序数测量，因而无从定量地预测或解释繁殖率的差异，以及依赖这些繁殖率的进化过程。不止于此，生态适合度的说明或许还未能令人满意地交代：那个据称影响上述有机体生存的相关参照环境，究竟该如何划分（Abrams 2009）[^abrams-2009]。生物学家深知预测精确与解释可检验之重要，难怪他们对生态适合度兴趣寡淡，转而用可定量测量的繁殖率来定义“$x$ 比 $y$ 更适合”。这一倾向恰恰为原来的论证添了分量：倘若使适合度差异在科学上可处理的唯一途径，是把理论琐碎化，那么受损的只能是理论本身。
