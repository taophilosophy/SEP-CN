      In an intuitive sense, ‘fitness’ can refer to the correspondence between the shape of an object and an empty volume it is placed in: a square peg fits into a square hole. In a more abstract fashion, one might refer to the properties of an entity and how they correspond to the constraints of its context. In a biological setting one could focus on an organism’s traits and how they correspond to various aspects of the environment the organism is living in. Following biological usage, call this concept ‘ecological fitness’. (It has also been called ‘vernacular fitness,’ cf. Matthen and Ariew 2002.)[^matthen-2002] The ‘vernacular’ definition is fraught with difficulties. Suppose, following Dennett (1995) we characterize the relation ‘$x$ is fitter than $y$’ as follows:
    step1: |-
      在直觉意义上，“适合度”可以指一个物体的形状与它被置入其中的空容积之间的对应关系：方钉恰好适合方孔。以一种更抽象的方式，人们可以指一个实体的属性以及它们如何对应于其语境的约束。在生物学语境中，人们可以关注一个有机体的性状，以及它们如何对应于该有机体所生活环境的各种方面。循生物学用法，把这个概念称为“生态适合度”。（它也被称为“通俗适合度”，参看 Matthen and Ariew 2002。）[^matthen-2002] “通俗的”定义充满困难。假设我们循丹尼特（1995），把“$x$ 比 $y$ 更适合”这一关系刻画如下：
    step2: |-
      就直觉而言，“适合度”可以指物体形状与其所置入的空容积之间的吻合：方钉正合方孔。稍加抽象，它也可以指一个实体的诸属性如何契合其语境的约束。放到生物学语境里，便可聚焦于有机体的性状，看它们如何契合该有机体所居环境的各个方面。循生物学惯例，这一概念不妨称作“生态适合度”。（它另有“通俗适合度”之称，参看 Matthen and Ariew 2002。）[^matthen-2002] 然而，“通俗”定义困难重重。设若循丹尼特（1995）之例，把“$x$ 比 $y$ 更适合”这一关系刻画如下：
