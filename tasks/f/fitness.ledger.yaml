      Brandon, for example, has argued that the theory of natural selection should not be viewed as a body of general laws, but as the prescription for a research program. As such its central claims need not meet standards of testability, and fitness need not be defined in terms that assure the nontriviality, testability, and direct explanatory power of the theory of natural selection. In that sense, Brandon makes common cause with the later Popper. Popper originally argued the claim that the theory of natural selection was unfalsifiable pseudoscience. Later he came to hold that theory of natural selection was a scientifically respectable but nevertheless untestable organizing principle for biological science (Brandon 1990, 139–140)[^brandon-1990].
    step1: |-
      例如，Brandon 主张，自然选择理论不应被看作一套普遍定律，而应被看作一个研究纲领的规约。这样一来，其核心主张无须满足可检验性标准，适合度也无须以保证自然选择理论的非琐碎性、可检验性与直接解释力的方式来定义。在这个意义上，Brandon 与后期 Popper 站到了一起。Popper 最初主张自然选择理论是不可证伪的伪科学；后来他转而认为，自然选择理论是生物学中一个科学上可敬却仍不可检验的组织性原理（Brandon 1990, 139–140）[^brandon-1990]。
    step2: |-
      比如 Brandon 就主张：自然选择理论不该当作一套普遍定律来看，而该当作一个研究纲领的规约来看。照此说法，它的核心主张无须过可检验性这道关，适合度的定义也无须确保自然选择理论的非琐碎性、可检验性与直接解释力。在这个意义上，Brandon 与晚期的 Popper 殊途同归。Popper 起初断言自然选择理论是不可证伪的伪科学；后来则转而认为，它是生物学中一条科学上体面、却依然不可检验的组织原理（Brandon 1990, 139–140）[^brandon-1990]。
