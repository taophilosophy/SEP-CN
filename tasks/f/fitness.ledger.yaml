      This line of reasoning highlights the next phase of the debate. From a discussion about fitness, the debate has evolved into a general debate concerning the nature of natural selection and drift. A number of alternative views have emerged in thinking about these topics. Some (e.g., Walsh, Lewens, Ariew, and Matthen) think about natural selection solely as population wide patterns caused by non selective processes: this view deprives fitness of any causal or explanatory power. Others (e.g., Millstein and Stephens) see fitness and natural selection as a cause, operating at the population level, to bring about the differential reproduction rates. Finally others argue that, if it is to play an explanatory role in our theory, fitness has to be an individual and causal concept. As these debates suggest, far from being merely a 19ᵗʰ century slogan, understanding the meaning of the “survival of the fittest” is of philosophical and biological urgency.
    step1: |-
      这一推理路线凸显出辩论的下一阶段。从一场关于适合度的讨论，辩论已演化为一场关于自然选择与漂变之本性的一般辩论。在思考这些论题时，出现了若干不同观点。一些人（例如 Walsh, Lewens, Ariew, and Matthen）把自然选择仅仅看作由非选择过程造成的种群层面模式：这种看法剥夺了适合度的一切因果力或解释力。另一些人（例如 Millstein and Stephens）把适合度与自然选择看作在种群层面运作、带来差别繁殖率的因。最后还有一些人主张：适合度若要在我们的理论中扮演解释性角色，就必须是一个个体性、因果性的概念。正如这些辩论所显示的，理解“最适者生存”的含义远不只是 19 世纪的一句口号，而是哲学与生物学上的当务之急。
    step2: |-
      这条推理路线照出了论战的下一阶段。讨论从适合度出发，已经演成一场关于自然选择与漂变之本性的一般论战。围绕这些论题，涌现出若干不同立场。有人（如 Walsh, Lewens, Ariew, and Matthen）把自然选择仅仅当作非选择过程所致的种群层面模式：如此一来，适合度的因果力与解释力被剥得一干二净。另有人（如 Millstein and Stephens）把适合度与自然选择看作一个因：它在种群层面运作，带来差别的繁殖率。还有人主张：适合度要想在我们的理论中担任解释角色，就必须是个体性、因果性的概念。这场场辩论都表明：理解“最适者生存”的意义，绝不只是 19 世纪的一句口号，而是哲学与生物学的当务之急。
