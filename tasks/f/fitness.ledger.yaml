      Some philosophers have argued that fitnesses are precisely such objective chances. Brandon and Carson (1996) held that here, as in quantum mechanics, we find a brute unanalyzable probabilistic dispositional property of a particular item, which generates the long run relative frequencies. It is indeed the case that among philosophers of quantum mechanics some hold that probabilistic propensities can explain actual frequencies [cf. Railton 1978, 216][^railton-1978], and some hold that they do so via a detour into long run relative frequencies. But few are comfortable with such arguments and adopt them only because, at the level of the quantum mechanical probabilistic propensities are indispensable and irreducible [cf. Lewis, 1983]. Proponents of probabilistic propensities in biology may envision two possibilities here. One is that probabilistic propensities at the levels of phenomena that constitute the biological are the result of quantum probabilities “percolating up” in Sober (1984) and Brandon’s and Carson’s (1996) phrase; the second is that there are brute unexplainable probabilistic propensities at the level of fitness differences (Brandon and Carson 1996)[^brandon-1996]. No one doubts the potential biological significance of quantum percolation. It may well be an important source of mutation [cf. Stamos 1999 for a discussion]. But the claim that it has a *significant* role in most fitness differences is not supported by any independent evidence [cf. Millstein 2000 and Glymour 2001 for a discussion][^glymour-2001][^millstein-2000]. The claim that there are brute probabilistic propensities at the level of organismal fitness differences is only slightly more tenable. No one has adduced any evidence that, for instance, the probabilistic generalizations about the behaviour of animals that ethology and behavioural biology provide, are irreducibly probabilistic, instead of simply expressions of the current state of our knowledge and ignorance of the causes and conditions of the behaviour in question.
    step1: |-
      一些哲学家主张，适合度正是这样的客观机遇。Brandon 与 Carson（1996）认为，在这里如同在量子力学中一样，我们发现某一特定事项具有一种不可分析的、原始的概率倾向属性，它产生长期相对频率。的确，在量子力学哲学家中间，有些人认为概率倾向可以解释实际频率[参看 Railton 1978, 216][^railton-1978]，有些人则认为它们是通过绕道长期相对频率来解释的。但很少有人对这种论证感到安然，他们采纳它只是因为，在量子力学层面，概率倾向不可或缺且不可还原[参看 Lewis, 1983]。生物学中概率倾向的支持者在此可以设想两种可能。其一，构成生物界的种种现象层面的概率倾向，是量子概率“向上渗透”的结果——这是 Sober（1984）以及 Brandon 与 Carson（1996）的说法；其二，在适合度差异层面存在原始的、不可解释的概率倾向（Brandon and Carson 1996）[^brandon-1996]。无人怀疑量子渗透在生物学上的潜在意义。它很可能是突变的一个重要来源[参看 Stamos 1999 的讨论]。但它在大多数适合度差异中扮演“重要”角色这一主张，并无任何独立证据支持[参看 Millstein 2000 与 Glymour 2001 的讨论][^glymour-2001][^millstein-2000]。有机体适合度差异层面存在原始概率倾向的主张，也只是稍微更站得住脚。例如，动物行为学与行为生物学所提供的关于动物行为的概率概括，是否不可还原地是概率性的，而不只是我们关于所涉行为之原因与条件的当下知识及无知状况的表达——对此无人举出过任何证据。
    step2: |-
      一些哲学家认为，适合度恰恰就是这样的客观机遇。Brandon 与 Carson（1996）主张：在此，一如在量子力学中，我们看到某一特定事项具有一种原始的、不可分析的概率倾向属性，长期相对频率正由它产生。量子力学哲学家中确有人持此见：概率倾向可以解释实际频率[参看 Railton 1978, 216][^railton-1978]；也有人认为，这种解释须绕道长期相对频率。然而，对此类论证感到安适者寥寥；人们接受它，多半只是因为量子力学层面的概率倾向不可或缺、不可还原[参看 Lewis, 1983]。生物学中的概率倾向论者可设想两种可能：其一，构成生物界的各现象层面的概率倾向，源自量子概率的“向上渗透”——此语出自 Sober（1984）以及 Brandon 与 Carson（1996）；其二，适合度差异层面本就存在原始的、不可解释的概率倾向（Brandon and Carson 1996）[^brandon-1996]。量子渗透在生物学上的潜在意义，无人置疑；它很可能是突变的重要来源[参看 Stamos 1999 的讨论]。但要说它在大多数适合度差异中扮演“重要”角色，则无任何独立证据[参看 Millstein 2000 与 Glymour 2001 的讨论][^glymour-2001][^millstein-2000]。至于有机体适合度差异层面存在原始概率倾向云云，也不过稍为可信而已。动物行为学与行为生物学提供了关于动物行为的概率概括。这些概括究竟不可还原地具有概率性，还是只表达我们当下对所涉行为之原因与条件的知识和无知？对此，尚无人举出任何证据。
