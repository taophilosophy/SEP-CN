      André Bazin, though not a professional philosopher or even an academic, countered Arnheim’s assessment in a series of articles that still exert an important influence on the field. (Bazin 1967; 1971)[^bazin-1967] For Bazin, the important dichotomy is not that between the sound and the silent film but rather between films that focus on the image and those that emphasize reality. Although editing had emerged for many such as Sergei Eisenstein as the distinctive aspect of film, Bazin returns to the silent era to demonstrate the presence of an alternative means of achieving film art, namely an interest in allowing the camera to reveal the actual nature of the world. Relying on a conception of film as having a realist character because of its basis in photography, Bazin argues that the future of cinema as an artform depends on its development of this capacity to present the world to us “frozen in time.”
