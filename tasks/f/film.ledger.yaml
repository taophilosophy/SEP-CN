      One interesting example of films that develop political stances that are not merely supportive of existing modes of social domination are those that involve interracial couples. So Stanley Kramer’s 1967 film, *Guess Who’s Coming to Dinner*, investigates the plausibility of racial integration as a solution to the problems of anti-black racism in America through its portrayal of the problems facing an interracial couple. Nearly 25 years later, Spike Lee’s *Jungle Fever* argues against the earlier film’s political agenda, once again using an interracial couple that encounters racism. Only this time, the film asserts that the intransigent racism of White Americans undermines integration as a panacea to the ills of this racist society (Wartenberg 1999)[^wartenberg-1999]. And many other films employ this narrative figure to investigate other aspects of racism and possibilities for its overcoming.
