      This idea of modeling the discipline of the philosophy of film on the natural sciences has been prominent among *cognitive film theorists* (Bordwell and Carroll 1996; Currie 1995)[^bordwell-1996][^carroll-1996][^currie-1995]. This rapidly developing approach emphasizes viewers’ conscious processing of films, as opposed to the emphasis within traditional film theory on unconscious processes. In general, these theorists lean towards seeing the study of film as a scientific undertaking.
    step1: |
      这种把电影哲学这一学科比照自然科学来构建的观念，在 认知电影理论家 中很突出（Bordwell and Carroll 1996; Currie 1995）[^bordwell-1996][^carroll-1996][^currie-1995]。这一迅速发展的进路强调观看者对电影的意识加工，与电影理论传统中对无意识过程的强调相对。总体而言，这些理论家倾向于把电影研究视为一项科学事业。
    step2: |
