      There is, however, an even deeper problem in regard to film narration over what has been called the “Imagined Seeing Thesis” (Wilson 1997)[^wilson-1997]. According to this Thesis, viewers of mainstream fiction films imagine themselves to be looking into the world of the story and seeing segments of the narrative action from a series of definite visual perspectives. In its traditional version, viewers are taken to imagine the movie screen as a kind of window that allows them to watch the unfolding of the story on the “other side.” However, it is hard for this view to account for what is being imagined when, for example, the camera moves, or there is an edit to a shot that incorporates a different perspective on a scene, etc. As a result, an alternative view has been suggested, namely that viewers imagine themselves to be seeing motion picture images that have been photographically derived, in some indeterminate way, from within the fictional world itself. But this position runs into problems, since it is normally part of the film’s fiction that no camera was present in the fictional space of the narrative. The resulting debate is over whether to reject as incoherent the Imagined Seeing Thesis or whether it is possible to develop an acceptable version of this Thesis. Philosophers remain sharply divided on this fundamental issue.
    step1: |
      然而，就电影叙事而言，还有一个更深刻的问题，即人们所称的“想象性看见论题”（Imagined Seeing Thesis，Wilson 1997）[^wilson-1997]。根据这一论题，主流虚构电影的观看者想象自己正看向故事世界，并从一系列确定的视觉视角观看叙事行动的片段。在其传统版本中，观看者被认为想象电影银幕是一扇窗户，使他们得以观看故事在“另一侧”的展开。然而，当摄影机移动，或当某个镜头被剪辑以纳入对场景的不同视角等等时，这一看法难以说明所想象的内容。因此，有人提出了另一种看法：观看者想象自己看到的，是以某种不确定的方式从虚构世界自身内部摄影衍生的电影影像。但这一立场遇到问题，因为通常属于电影虚构内容之一部分的，是叙事虚构空间中并不存在摄影机。由此产生的争论，是究竟把想象性看见论题作为不连贯而拒斥，还是可能发展出这一论题的一个可接受版本。哲学家在这一根本问题上仍然严重分歧。
