      Hugo Münsterberg, the first philosopher to write a monograph about the new art form, sought to distinguish film by means of the technical devices that it employed in presenting its narratives (Münsterberg 1916)[^münsterberg-1916]. Flashbacks, close-ups, and edits are some examples of the technical means that filmmakers employ to present their narratives that theater lacks. For Münsterberg, the use of these devices distinguished film from the theater as an artform.
