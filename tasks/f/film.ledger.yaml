  - id: p1
    source: |
      The philosophy of film is now a firmly established subfield of contemporary philosophy of art. Although philosophers were among the first academics to publish studies of the new artform in the early decades of the twentieth century, the field did not experience significant growth until the 1980s when a renaissance occurred. There are many reasons for the field’s recent growth. Suffice it to say here that changes in both academic philosophy and the cultural role of the movies in general made it imperative for philosophers to take film seriously as an artform on a par with the more traditional ones like theater, dance, and painting. As a result of this surge in interest in film as a subject for philosophical reflection, the philosophy of film has become an important area of research in aesthetics.
    step1: |
      电影哲学如今已是当代艺术哲学中一个牢固确立的分支。尽管哲学家是二十世纪初最早出版这一新兴艺术形式研究著作的学者之一，但该领域直到二十世纪八十年代发生文艺复兴时才获得显著发展。该领域最近的发展有许多原因。这里只消说，学术哲学的变化和电影在文化上整体角色的变化，使得哲学家必须认真对待电影，把它当作与戏剧、舞蹈、绘画等更传统艺术形式同等的艺术形式。由于人们对电影作为哲学反思对象的兴趣激增，电影哲学已成为美学中的一个重要研究领域。
    step2: |
      电影哲学如今已是当代艺术哲学中一个牢固确立的分支。尽管在二十世纪头几十年，哲学家是率先为这一新兴艺术形式出版研究著作的学者之一，但该领域直到二十世纪八十年代一场复兴出现时才获得显著发展。这个领域近来的成长原因众多。这里只需说明一点：无论学术哲学自身的变化，还是电影在文化上整体角色的变化，都使得哲学家必须认真对待电影，把它视为与戏剧、舞蹈、绘画等更传统艺术形式同等的艺术形式。由于人们对电影作为哲学反思对象的兴趣激增，电影哲学已成为美学中的一个重要研究领域。
