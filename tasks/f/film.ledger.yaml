      安德烈·巴赞（André Bazin）虽然不是专业哲学家，甚至不是学者，却在一系列至今仍对该领域有重要影响的文章中反驳了阿恩海姆的评估。（Bazin 1967; 1971）[^bazin-1967] 对巴赞而言，重要的二分不是有声电影与无声电影之分，而是专注于影像的电影与强调现实的电影之分。尽管对谢尔盖·爱森斯坦（Sergei Eisenstein）等许多人而言，剪辑已成为电影的标志性方面，巴赞却回到无声片时代，以证明存在另一种达成电影艺术的手段，即对让摄影机揭示世界真实本性的兴趣。巴赞依据电影因基于摄影而具有现实主义特征的观念，论证电影作为一种艺术形式的未来，取决于它发展这种把世界呈现给我们、“凝固在时间中”的能力。
