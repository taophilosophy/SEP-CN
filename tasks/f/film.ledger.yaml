      电影哲学已成为哲学和美学研究的一个重要领域。哲学家既专注于电影作为一种艺术媒介的美学问题——即电影哲学——也专注于关于电影哲学内容的问题——即作为哲学的电影。这两个领域的贡献在精妙度和数量上都在持续增加，因为更多哲学家认真对待电影作为哲学研究的对象。
