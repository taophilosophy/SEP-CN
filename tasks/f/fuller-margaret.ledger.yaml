      1844 年，霍勒斯·格里利邀玛格丽特·富勒迁往纽约，入他的《纽约论坛报》，任美国第一位全职文学批评家。格里利曾盛赞《大诉讼》，并说服富勒把它扩成一本书。其妻玛丽参加过富勒的谈话会，力促丈夫延聘她（Capper 2007: 165）[^capper-2007]。《论坛报》为富勒提供了庞大的读者群。格里利与他的报纸属于辉格党；该党为反对安德鲁·杰克逊而结，批评其政策，包括把部族迁往密西西比河以西的“印第安人迁移”。富勒那年早些时候曾行经芝加哥与中西部，已公开批评白人对原住民的处置，同时也看出他们（此处指齐佩瓦人）未被允许成为密歇根州的公民。她与格里利同倡反奴，赞许弗雷德里克·道格拉斯。格里利的《论坛报》拥护当时诸多改革事业。富勒已把妇女权利视为广泛社会改革需要的一部分——她探访狱中妇女时流露的同情便是明证：她们多数因卖淫获罪，而涉事的男人却从未被起诉。
