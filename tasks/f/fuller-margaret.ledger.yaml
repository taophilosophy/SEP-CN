      Starting in 1846, at her own initiative Fuller traveled to Europe, first to England and then to the Italian peninsula (Italy was not yet a united country), where she served as a foreign correspondent for Greeley. While still in England she met an Italian who would remain prominent in her life: Giuseppe Mazzini, Italian patriot and republican leader then in exile. In Italy she met another significant man for her, Giovanni Angelo Ossoli, whom she eventually married, though it is unclear when the wedding ceremony occurred, possibly after the birth of their baby boy, Angelo Eugene Philip Ossoli, nicknamed Angelino or Nino, on 5 September 1848 (Marshall 2013: 350)[^marshall-2013].
