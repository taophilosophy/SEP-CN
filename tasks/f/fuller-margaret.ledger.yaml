      富勒随斯普林夫妇游历英格兰与苏格兰，把文章寄回格里利的《论坛报》。她在那里结识了不少有趣人物，包括年迈的诗人华兹华斯，以及曾批评她回避女权之外改革的英国女权主义者哈丽雅特·马蒂诺。如今富勒已拥抱远为宽广的改革议程，两人遂相处得来。伦敦还藏着当时一位思想怪杰托马斯·卡莱尔：他弃绝年少时的加尔文派基督教，标举德国浪漫主义，认识许多聪慧女性，其一是他的妻子简。富勒与卡莱尔相遇，彼此倾慕。但始终带着严重保留。卡莱尔的政治与富勒大相径庭：他拒斥民主，赞成反犹主义与白人种族主义，并颂扬克伦威尔、腓特烈大帝之类民粹民族主义的历史领袖。（数代之后，一些纳粹还把卡莱尔看作先驱。）富勒在伦敦遇到的另一位浪漫主义者，则唤起了她更少批判的倾慕：英雄式的意大利革命者朱塞佩·马志尼。马志尼把自由民主与个人成全视为其意大利共和民族主义的两个方面。富勒欣然获邀在一所专收意大利贫苦侨民男童的免费小学的活动上讲话；她在那里拥护马志尼的革命事业，并援引美国一位论者与辉格党改革家所乐道的“以公共教育促自我改善”之原则。马志尼大为倾心。
