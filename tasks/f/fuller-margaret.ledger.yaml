      Fuller was thoroughly conversant with Plato, but by no means his uncritical follower. In some of his writings, Plato was the first feminist. Among the guardians of his ideal Republic a perfect meritocracy prevails and women are included within the public spirit of the *polis*; they receive the same education as men and have equal opportunity to exercise political power. Elsewhere, however, Plato compromised with and even legitimated the prevailing subjugation of women. Fuller accordingly rendered a mixed verdict on Plato’s philosophy of gender (Fuller 1845: 90; also see Okin 1979: 15–70)[^fuller-1845][^fuller-1845-2][^okin-1979]. Here, as always, she used tradition as a resource without letting herself be imprisoned by it.
    step1: |-
      富勒对柏拉图烂熟于心，却绝非亦步亦趋的门徒。在柏拉图某些篇章里，他是第一位女权主义者：在其理想国的护卫者中，完美的贤能政治盛行，妇女也被纳入 *polis*（城邦）的公共精神；她们与男子受同样的教育，并有同等机会执掌政治权力。然而在其他地方，柏拉图又与当时对妇女的压制妥协，甚至为之张目。故富勒对柏拉图的性别哲学给出了褒贬参半的裁断（Fuller 1845: 90；另见 Okin 1979: 15–70）[^fuller-1845][^fuller-1845-2][^okin-1979]。在这里，一如既往，她把传统当作资源来用，却不让自己被传统囚禁。
    step2: |-
      富勒对柏拉图烂熟于心，却绝非亦步亦趋的门徒。在柏拉图某些篇章里，他堪称第一位女权主义者：其理想国的护卫者中，完美的贤能政治盛行，妇女也被纳入 *polis*（城邦）的公共精神；她们与男子受同样教育，并有同等机会执掌政治权力。可在另一些地方，柏拉图又与当时对妇女的压制妥协，甚至为之张目。故富勒对柏拉图的性别哲学给出了褒贬参半的裁断（Fuller 1845: 90；另见 Okin 1979: 15–70）[^fuller-1845][^fuller-1845-2][^okin-1979]。在此，一如她一贯的作风：把传统当作资源使用，却不让自己被它囚禁。
