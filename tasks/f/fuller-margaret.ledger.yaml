      In Congress, Timothy Fuller had strongly supported John Quincy Adams’s presidential campaign, opposed the Missouri Compromise, and defended the rights of Native Americans. His daughter and pupil invoked the sixth President’s attitude toward the female sex in *Woman in the Nineteenth Century* (Fuller 1845: 77–78)[^fuller-1845][^fuller-1845-2]. When the Whig Party took shape in the 1830s, both Adams and Margaret Fuller identified with it. Though women could not vote, Fuller saw the Whigs as her party of choice. “I attended last week”, she wrote to Emerson on 14 August 1837, “the Whig Caucus here” (meaning Providence, Rhode Island). “It is rather the best thing I have done” (Fuller, *Letters*, ed. Hudspeth 1983: I, 295; for more on her Whig politics, see *Letters*, IV, 121). Actually, the Whig Party was a bit more sympathetic to women’s rights than the Democratic Party, probably because the cause of women was a predominantly middle-class movement prior to the Nineteenth Amendment, and the Whigs were a middle-class party. The Whigs were also the party of both evangelical and Unitarian Protestantism, which in those days provided the principal base of support for many reform movements, including antislavery, temperance, public schools, higher education, international peace, prison reform (which promoted “penitentiaries” rather than simply punishment like flogging), the American Bible Society (which fostered literacy), and asylums for the insane, as well as women’s liberation. Though Unitarians did not share the theology of the evangelical denominations, they often shared common social and political aims.
