      In these Conversations Fuller sought for a while to avoid discussing social reform causes other than feminism, such as antislavery, even though some of her participants were already getting involved in them. The British feminist Harriet Martineau, who visited America, and befriended Fuller, in her *Autobiography* (written in 1855 and published in 1877) criticized her Conversations for addressing ideals and “shallow conceits.” In manuscript materials, as well as in published accounts of these meetings, it is clear that Fuller’s pedagogy aimed at encouraging participation, considering herself a facilitator rather than a leader in the discussions, thus developing a political sense of participation and equality (see Craig Simmons 1994)[^craig-1994].
    step1: |-
      在这些谈话会里，富勒一度有意回避女权之外的社会改革议题，例如废除奴隶制，尽管部分参与者已在涉足其中。曾访美并与富勒结为友人的英国女权主义者哈丽雅特·马蒂诺，在其《自传》（1855 年写成，1877 年出版）里批评这些谈话会只谈理想与“浅薄的巧智”。从手稿材料与已刊的会议记述可以看出，富勒的教学意在鼓励参与，她把自己看作讨论的促成者而非领袖，由此培养起一种参与与平等的政治意识（见 Craig Simmons 1994）[^craig-1994]。
    step2: |-
