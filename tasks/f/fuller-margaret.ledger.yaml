      In 1846 Fuller went to Europe and became a foreign correspondent for the *New York Tribune*, writing about European literature and public opinion. European travel was expensive, and it was not clear that Greeley was willing to reimburse Fuller’s costs sufficiently. Fortunately, a wealthy and politically enlightened Quaker couple, Marcus and Rebecca Spring, friends of Fuller, decided to spend some time in Europe, and offered to pay for some of her expenses if she would travel with them and tutor their young son Eddie.
