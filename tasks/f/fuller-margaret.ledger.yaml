      玛格丽特·富勒（Margaret Fuller，1810–1850），她那个时代最重要的美国女权主义者之一，是哲学家、记者兼文学批评家。她属于新英格兰那个被称为超验主义者的智识共同体，爱默生与梭罗也在其列。她最重要的著作是《十九世纪的妇女》（*Woman in the Nineteenth Century*，1845），系其文章《大诉讼：人对男人，女对女人》（“The Great Lawsuit: Man *versus* Men, Woman *versus* Women”，1843）的扩充。富勒留给后人的不只是她的文字，还有她的一生：一系列以自身行践其理想——超越当时习以为常的性别分野——的尝试。本文将概述其哲学，并记录她以哪些方式（或未以哪些方式）落实自己的哲学理想。
