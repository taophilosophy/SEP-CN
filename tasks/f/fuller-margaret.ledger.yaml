      蒂莫西·富勒在国会里曾力挺约翰·昆西·亚当斯的总统竞选，反对密苏里妥协案，并为原住民的权利辩护。他的女儿兼弟子在《十九世纪的妇女》中援引了这位第六任总统对女性的态度（Fuller 1845: 77–78）[^fuller-1845][^fuller-1845-2]。辉格党于 1830 年代成形时，亚当斯与玛格丽特·富勒都认同该党。妇女虽无投票权，富勒仍把辉格党视为自己的首选。1837 年 8 月 14 日她写信给爱默生：“上星期我参加了此地的辉格党核心会议”（指罗得岛州普罗维登斯），“这算是我做过的最好的事”（Fuller, *Letters*, ed. Hudspeth 1983: I, 295；关于其辉格党政治，另见 *Letters*, IV, 121）。其实，辉格党对妇女权利比民主党略为同情，或许因为在第十九修正案之前，妇女事业主要是一场中产阶级运动，而辉格党正是中产阶级的党。辉格党也是福音派与一位论派新教的党；当年这两派为诸多改革运动提供了主要支持基础，包括废奴、节欲、公立学校、高等教育、国际和平、监狱改革（提倡“感化院”而非鞭笞之类的单纯惩罚）、美国圣经会（推动识字）、精神病院，以及妇女解放。一位论者虽不共享福音派诸宗的神学，却常与之社会政治目标相同。
