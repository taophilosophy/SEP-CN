      1810 年 5 月 23 日，玛格丽特·富勒生于马萨诸塞州剑桥港，是蒂莫西·富勒与玛格丽特·克雷恩·富勒的长女。（剑桥港今属马萨诸塞州剑桥市；她出生的那栋玛格丽特·富勒故居至今犹存。）1817 年，蒂莫西·富勒当选马萨诸塞州联邦众议员，任职至 1825 年。他把通常只有男孩才能享有的严格的古典教育倾注到长女身上：三岁半教她识字，她也争气，成了让父亲心血不白费的神童。她的童年课业包括拉丁文散文、诗歌与作文，辅以希腊文著作——既有《新约》也有古典哲学家——再加上自然哲学（自然科学），以及当时称为道德哲学的宽泛学科，后者囊括了我们今日所谓的社会科学。九岁时，父亲又把《旁观者》、《失乐园》与塞缪尔·约翰逊博士列入她的书单。蒂莫西的严苛做派与苛刻要求，给年幼的玛格丽特留下了情感与学业的双重遗产：她变得偏执而好自我苛责。
