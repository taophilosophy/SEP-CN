      In 1844 Horace Greeley invited Margaret Fuller to move to New York and go to work for his newspaper the *New York Tribune* as America’s first fulltime literary critic. Greeley had praised “The Great Lawsuit,” and he had persuaded Fuller to expand it into a book. His wife Mary had attended Fuller’s “Conversations” and had prompted him to hire her (Capper 2007: 165)[^capper-2007]. The *Tribune* provided Fuller with a huge audience. Greeley and his paper belonged to the Whig political party, which had formed in opposition to Andrew Jackson and criticized his policies, including “Indian Removal” of tribes to west of the Mississippi. Fuller had travelled through Chicago and the Midwest earlier in the year and had become publicly critical of white treatment of the Native Americans, while at the same time recognizing that they (in this case Chippewa) had not been allowed to become citizens of Michigan. She shared Greeley’s opposition to slavery and praised Frederick Douglass. Greeley’s *Tribune* embraced many reform causes of the time. Fuller had come to view women’s rights as part of a broad need for social reform, evident in her compassion for the women in prison whom she visited. Most of them had been convicted of prostitution, though the men involved were never prosecuted.
