      Margaret Fuller was raised a Unitarian. The denomination originated in early nineteenth-century New England in an intellectual rebellion by descendants of the Puritans against Calvinist theology. The name “Unitarian” reflected their repudiation of the conventional Trinitarian Christian doctrine of a triune God of Father, Son, and Holy Spirit. The New England Unitarians ceased to regard Jesus Christ as a unique divine personification of the Godhead. Instead, they emphasized the potential divinity in everyone: every good person should seek to create their own Christlike, even Godlike, character. As Channing explained in his sermon entitled “Likeness to God”: “God becomes a real being to us in proportion as his own nature is unfolded within us” (D. Howe 1970: 120; citing Channing 1828, in *Works*, III, 229)[^channing-1828][^howe-1970].
