      1843 年 5 月，富勒随一伙友人（詹姆斯·弗里曼·克拉克及其母亲与妹妹）前往芝加哥，再向西部行进，经伊利诺伊、威斯康星与密歇根。此行的笔记、观察与思考，日后汇成《1843 年湖上夏日》（*Summer on the Lakes, in 1843*），一部半游记半社会评论、穿插诗歌与小说的文字，1844 年出版。书中她把对壮丽自然伟力与环境的爱慕、对欧洲移民的同情，以及对西部不移的扩张主义与移民殖民的笃定，熔于一炉。
