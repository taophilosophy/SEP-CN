      In the meantime, Fuller’s embrace of the feminist cause was explained more fully in the enlargement of her “Great Lawsuit” article into her book, *Woman in the Nineteenth Century*, the work for which she is chiefly remembered. She completed the book in November of 1844. Since the end of her “Conversations”, she had concluded that feminism was one of a number of worthy causes for human emancipation women should support. The book endorses freedom for Ireland and the return of Jews to Palestine, adding an emphatic warning against the annexation of Texas because that would strengthen the institution of slavery (Fuller 1845: 90–91)[^fuller-1845][^fuller-1845-2].
