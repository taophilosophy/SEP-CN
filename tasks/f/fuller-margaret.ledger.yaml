      In July 1843, *The Dial* published as its lead article the fruits of Fuller’s new position, “The Great Lawsuit: Man *versus* Men, Woman *versus* Women”. Despite its title, the article was not framed as a lawsuit, but rather as a complex tension between the ideal and the mundane versions of the human being. It postulates that *Manhood* (“Man”) and *Womanhood* (“Woman”) are transcendent ideals that individuals should strive to realize, and that each ideal contains both masculine and feminine qualities. There is no “wholly masculine man; no purely feminine woman” (1843: 14; also in Fuller 1845: 103)[^fuller-1845][^fuller-1845-2]. But because men have greater access to the means of self-development, the ideals of manhood have been more fully realized in practice than those of womanhood. This needs to be corrected for the benefit of all humanity.
    step1: |-
      1843 年 7 月，《日晷》以头条刊出富勒新岗位的成果：《大诉讼：人对男人，女对女人》。文题虽如此，文章却并非以诉讼为框架，而是铺陈理想之人与凡俗之人之间的复杂张力。文中提出：*男子气*（“Man”）与*女子气*（“Woman”）是个人应力求实现的超验理想，而每一理想都兼含男性与女性品质。“没有全然男性的男人，也没有纯粹女性的女人”（1843: 14；亦见 Fuller 1845: 103）[^fuller-1845][^fuller-1845-2]。但因男子更易获致自我发展之手段，男子气的理想在实践中实现得远比女子气充分。为全人类的福祉，此弊须纠。
