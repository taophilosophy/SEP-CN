      The American transcendentalists embraced Plato and Platonism in general. They looked back fondly on the Platonists of seventeenth-century Cambridge University in England. The Unitarian and transcendentalist intellectuals of nineteenth-century New England were aware of these Renaissance intellectuals and admired their reliance on individual freedom as the foundation for religious faith rather than intolerant coercion. The Cambridge Platonists were an assorted group of philosophers and theologians who advanced arguments for human autonomy, holding an optimistic view of human capabilities, and maintaining the compatibility of reason and faith. Some of them rejected Calvinism. They not only found Plato’s own philosophy congenial, but also that of the third-century Alexandrian Neoplatonist named Plotinus. Plotinus had developed a system for self-cultivation, seeking God within one’s own *psyche*. Plotinus privileged intuitive knowledge and this aspect of his philosophy might have been attuned to Fuller’s feminist view expressed in her claim that “[woman]’s intuitions are more rapid and more correct. […] common women […] will seize and delineate [the fine invisible links] with unerring discrimination.” (Fuller 1845: 91)[^fuller-1845][^fuller-1845-2]. All of this heritage was invoked in the nineteenth century by William Ellery Channing, Ralph Waldo Emerson, and Margaret Fuller (see the entry on Cambridge Platonistis).
    step1: |-
      美国超验主义者整体上拥戴柏拉图与柏拉图主义。他们深情回望十七世纪英国剑桥大学的柏拉图主义者。十九世纪新英格兰的一位论与超验主义知识分子知道这批文艺复兴时期的思想家，也钦佩他们以个人自由而非偏狭强制为宗教信仰之基。剑桥柏拉图主义者是一群驳杂的哲学家与神学家，他们为人的自主立论，对人类能力持乐观之见，并坚持理性与信仰相容。其中一些人拒斥加尔文主义。他们不仅觉得柏拉图本人的哲学合意，也欣赏三世纪亚历山大里亚的新柏拉图主义者普罗提诺。普罗提诺发展出一套自我修养的体系，在个人的 *psyche*（灵魂）之内寻求神。普罗提诺推尊直觉之知，而他哲学的这一面向，或许恰好呼应了富勒的女权见解——她断言：“〔女人〕的直觉更迅捷，也更准确。……寻常女人……会以不失误的辨别力抓住并勾画出〔那些精微无形的联系〕。”（Fuller 1845: 91）[^fuller-1845][^fuller-1845-2]。这一整份遗产，在十九世纪由威廉·埃勒里·钱宁、拉尔夫·沃尔多·爱默生与玛格丽特·富勒重新唤起（见剑桥柏拉图主义者词条）。
