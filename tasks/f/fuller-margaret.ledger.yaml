      Fuller went on to France, where she found Paris to be the cultural capital of the world. In Paris, she enjoyed the music and fine arts and she found more of the literature and philosophy she was accustomed to engaging. She contrived to meet George Sand (Amantine Lucile Aurore Dupin de Francueil), one of the most popular and successful writers in all Europe, along with her current lover, Frederic Chopin. More significant politically was her relationship with Adam Mickiewicz, the exiled Polish Romantic poet-turned- revolutionary, who was striving to achieve Polish independence from Russia and Austria. Fuller had admired him even before they met in France. His social democracy appealed to her and so did his Romantic religious passion. It seemed like the two of them might form a bond both sexually romantic and philosophically Romantic—but Mickiewicz was already married. Fuller moved on to the Italian peninsula.
