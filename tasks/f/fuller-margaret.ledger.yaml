      自我修养是玛格丽特·富勒人生理论与践行的核心。“自我改善”或“自我修养”的实践，在当时白人中产美国人中蔚为风气；连亚伯拉罕·林肯这样的工人阶级出身的男子，也为锤炼个人品格与才能而刻苦自修，以求安稳与发达。自觉发展自身的正直与才能，被视为把美国引以为傲的白人男性民主付诸个人实践的途径。自我修养最受推崇、最精致的倡导者，是新近兴起的一位论教派的名牧威廉·埃勒里·钱宁（William Ellery Channing，1780–1842）。钱宁开创了一种基督教人文主义。富勒视之为其自我修养理想的英雄式典范。钱宁的事业兼及两性、遍及一切种族的人类（Fuller 1845: 60）[^fuller-1845][^fuller-1845-2]。
