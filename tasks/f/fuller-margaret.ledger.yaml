      One can find fault with Fuller’s book. It does not consistently address its issue with logical development; it rambles, flowing from one thought to another. She assumes her reader possesses her own wide range of literary and classical learning, frequently making allusions that few readers will actually recognize (especially nowadays). She also mentions a wide range of women intellectuals, such as Mary Wollestonecraft and George Sand, defending their actions and arguing that “such beings as these, rich in genius, of most tender sympathies, capable of high virtue and chastened harmony, ought not to find themselves, by birth, in a place so narrow, that, in breaking bonds, they become outlaws” (Fuller 1845: 62)[^fuller-1845][^fuller-1845-2]. Fuller’s book anticipated the first women’s rights convention, which would occur in July 1848 at Seneca Falls in upstate New York and demanded women’s suffrage, though even some feminists of the time felt reluctant to endorse such a drastic measure. The book proved quite popular, not only in the U.S. but also in Britain, where it was pirated at a time before publishers were required to observe international copyright. Hers was the feminist book of its time, analogous to Simone de Beauvoir’s *The Second Sex* in the mid-twentieth century.
    step1: |-
      富勒的书自有可指摘处。它并未一贯地以逻辑推展来处置论题；它随手漫谈，思绪一处接一处地流去。她假设读者拥有与她一般广博的文学与古典修养，频频用典，而真能识出的读者寥寥（如今尤甚）。她还提到一大批女性知识分子，如玛丽·沃斯通克拉夫特与乔治·桑，为她们的行止辩护，并写道：“这等人物，天才丰赡，同情至柔，能具高德与精炼的和谐，本不该生来就处在如此狭窄之地，以致一挣断束缚，便成了法外之人”（Fuller 1845: 62）[^fuller-1845][^fuller-1845-2]。富勒的书先于第一次妇女权利大会——该会于 1848 年 7 月在纽约州北部的塞尼卡福尔斯召开，要求妇女选举权，尽管当时连一些女权主义者对这种激烈举措也踌躇不愿赞成。此书颇受欢迎，不仅在美国，在英国亦然；在出版商尚未须遵守国际版权的年代，英国版还是盗印的。它堪称那个时代的女性主义之书，与二十世纪中叶西蒙娜·德·波伏娃的《第二性》相类。
