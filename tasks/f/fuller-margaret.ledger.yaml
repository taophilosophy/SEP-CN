      Margaret Fuller’s “Conversations” in Boston became famous among early American feminists. They commenced in 1839 and continued until April 1844. Each would last thirteen weeks in a pre-announced time and place (usually the parlor or the bookstore of her friend Elizabeth Peabody). The “conversants” paid to participate—usually ten dollars for the series, about what Emerson and other transcendentalists charged for a set of their lectures. Most of the Conversations were for women only and had about twenty-five participants. Fuller herself led off each two-hour weekly session with a talk, which the audience were then encouraged to discuss and question. The women who attended were generally well-read, usually Unitarian in practice or background, often wives or relatives of male transcendentalists. Fuller conceived of her Conversations as essential supplements to the educational opportunities then available to middle- and upper-class New England women. These might include literature, classics, and fine arts, simply decorative or recreational in purpose. Fuller would start off with such subjects, but then use them to press her participants to address serious questions about women’s lives, roles, and purposes. She was applying a conversational method she had learned from Plato’s dialogues and seen exemplified by her fellow transcendentalist and Plato disciple Bronson Alcott. Her concern was not so much to teach as to provoke others to think more deeply than usual (see Capper 1987)[^capper-1987].
    step1: |-
      玛格丽特·富勒在波士顿的“谈话会”，在早期美国女权主义者中声名远播。谈话会始于 1839 年，延续至 1844 年 4 月。每期十三周，时间地点事先公布（常在挚友伊丽莎白·皮博迪的客厅或书店）。“谈话者”付费参加——通常一期十美元，与爱默生等人一套讲座的收费相当。多数谈话会只收女性，约二十五人参加。富勒亲自主持每周两小时的头一场谈话，随后鼓励听众讨论与提问。与会女性大多博于阅读，通常是一位论派的信众或出身该派，且往往是男性超验主义者的妻室或亲眷。富勒把谈话会设想为当时新英格兰中上层女性所获教育机会的必要补充——那些机会或涉文学、古典与美术，用意不过是装点或消遣。富勒会从这类题目入手，继而借之逼问参与者一些关于妇女生活、角色与目标的严肃问题。她运用的谈话法，学自柏拉图的对话，又见于她的同道、柏拉图信徒布朗森·奥尔科特的示范。她所在意的，与其说是教，不如说是激人比平常想得更深（见 Capper 1987）[^capper-1987]。
