      Margaret Fuller’s personal quest for own self-realization as well as her ardent feminist program for the self-realization of all women both took inspiration from Channing. Even though she abandoned the Unitarian church and stopped attending any religious services, Fuller never lost her admiration for Channing. Fuller set forth her mature religious principles in “A Credo” around June 1840 (preserved in the Margaret Fuller Ossoli Collection, especially pp. 97–98, in the Boston Public Library, and now available also in *The New England Quarterly*, with an Introduction by Phyllis Cole. See Cole 2024)[^cole-2024].
