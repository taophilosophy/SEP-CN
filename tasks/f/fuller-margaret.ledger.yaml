      1835 was a year when the most influential persons in Margaret Fuller’s life changed: her father Timothy died, and she made the acquaintance of Ralph Waldo Emerson, who became her friend and, for a time, mentor. Fuller’s relationship with Emerson, like that with her father, was full of tensions. The two had very discordant personalities, as Judith Thurman has observed: “Waldo’s cool, cerebral, and ironic; Margaret’s noisy, histrionic, and sincere” (Thurman 2013: 79)[^thurman-2013]. Though their interactions were often tempestuous, Emerson converted Fuller to his own version of self-improvement: the quest for spiritual self-transcendence. Followers became known as transcendentalists because they sought to transcend the material world in communion with the divine. Fuller became a member of the Transcendental Club founded by Emerson and Frederick Henry Hedge, virtually all of whose members were Unitarians or former Unitarians. The transcendentalists (including Thoreau, Theodore Parker, and Elizabeth Peabody) are remembered today for their contributions to American literature, philosophy, and social reform, the first intellectual counter-culture in American history (see the entry on transcendentalism). At Emerson’s invitation, Fuller edited the transcendental periodical *The Dial* for two years (1840–42) and continued to write for it afterwards.
    step1: |-
      1835 年是玛格丽特·富勒生命中影响最深的人事更迭之年：父亲蒂莫西去世，而她结识了拉尔夫·沃尔多·爱默生——后者成为她的朋友，并在一段时期里充当她的师长。富勒与爱默生的关系，一如她与父亲的关系，充满张弛。两人性情极不合拍，朱迪丝·瑟曼有言：“沃尔多冷静、理性而讥诮，玛格丽特喧闹、做作而真诚”（Thurman 2013: 79）[^thurman-2013]。尽管往来常起风波，爱默生仍把富勒转到了他自己那一版自我改善——求精神上的自我超越。追随者因力求在与神合一中超越物质世界，遂被称为“超验主义者”。富勒加入了爱默生与弗雷德里克·亨利·赫奇创立的超验主义俱乐部，其成员几乎全是一位论者或前一位论者。这些超验主义者（包括梭罗、西奥多·帕克与伊丽莎白·皮博迪）至今为人铭记，是因为他们于美国文学、哲学与社会改革的贡献——那是美国史上第一场智识反文化（见超验主义词条）。应爱默生之邀，富勒主编超验主义刊物《日晷》两年（1840–1842），此后仍为之撰稿。
