      In May 1843 Fuller joined a group of friends (James Freeman Clarke, his mother and his sister) who were going to visit Chicago and continue to the West, in Illinois, Wisconsin and Michigan. The notes, observations and reflections generated by that journey will become *Summer on the Lakes, in 1843*, a text part travel narrative, part social commentary, interspersed with poetry and fiction, published in 1844. In this she mixed admiration for sublime natural forces and the environment, sympathy for European immigrants, and certainy about ineluctable expansionism and settler-colonialism in the West.
