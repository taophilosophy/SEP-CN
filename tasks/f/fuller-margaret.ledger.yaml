      A greater variety of occupations would help women to realize their potential, to “rouse their latent powers”, as she put it (Fuller 1845: 95)[^fuller-1845][^fuller-1845-2]. Most often, Fuller addresses the need to transform the marriage relationship. Instead of the woman belonging to the man, marriage should enable the two partners to ally and form a whole together. Ideally, marriage would be a “pilgrimage toward a common shrine” (Fuller 1845: 42)[^fuller-1845][^fuller-1845-2].
