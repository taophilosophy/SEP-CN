    step2: |-
      然而与此同时，蒂莫西·富勒的政治抱负未见实现，律师业务也日见萎缩，以致他 1833 年决定迁往马萨诸塞州格罗顿，像当时许多美国人一样经营家庭农场。可农场尚未开始盈利，1835 年 10 月，玛格丽特的父亲死于霍乱。蒂莫西未立遗嘱，依当时偏袒男嗣的法律，农场产权转入其兄弟之手，遗孀与子女虽住在农场，却要仰赖玛格丽特几位叔伯的接济。玛格丽特心中的怨愤可想而知；她才二十出头，便不得不担起养活母亲与年幼弟妹的重担。她本已动笔写一部歌德传——她以惊人的速度习得了流利的德语——但为全职教书挣薪，只得作罢，连同那本要去的欧洲之行。
