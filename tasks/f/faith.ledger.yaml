      ## 8. Venturing faith, without belief
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      Some accounts allow that faith centrally involves practical commitment venturing beyond evidential support, yet do not require (or, even, permit) that the venturer *actually believes* the faith-proposition assumed to be true. Such accounts may be described as proposing a ‘non-doxastic’ venture model of faith. F. R. Tennant holds a view of this kind: he takes faith to be the adoption of a line of conduct not warranted by present facts, that involves experimenting with the possible or ideal, venturing into the unknown and taking the risk of disappointment and defeat. Faith is not an attempt to will something into existence but rather treating hoped for and unseen things *as if* they were real and then acting accordingly (Tennant 1943 [1989, 104])[^tennant-1943]. Swinburne refers to this as the ‘pragmatist’ model of faith (Swinburne 2005, 147–8; Swinburne 2001, 211; compare also Golding 1990, 2003 and McKaughan 2016)[^golding-1990][^mckaughan-2016][^swinburne-2001][^swinburne-2005]. The origins of Swinburne’s pragmatist model are to be found in a much earlier paper, Swinburne 1969.
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      William Alston (1996) suggests that faith may involve an active ‘acceptance’ rather than purely receptive belief. A clearly non-doxastic venture model results if acceptance is understood on Jonathan Cohen’s account under which to accept that *p* is ‘to have or adopt a policy of deeming, positing, or postulating that *p*—i.e. of including that proposition … among one’s premisses for deciding what to do or think in a particular context, *whether or not one feels it to be true that p*’ (Cohen 1992, 4, our emphasis)[^cohen-1992]. The firmness of faith-commitment is then just the firmness of one’s ‘*resolve* to use [faith-claims] as a basis for one’s thought, attitude and behaviour’ (Alston 1996, 17)[^alston-1996]: there is no firm assurance *of their truth*. Decisive commitment in the absence of such assurance may nevertheless be possible, motivated (as Swinburne suggested in the first edition of his *Faith and Reason*) by the evaluative belief that ‘unless [faith-propositions are true], that which is most worthwhile is not to be had’ (Swinburne, 1981, 117). A faith venture that lacks belief in the faith-proposition to which commitment is made need not, and probably could not, lack cognitive components altogether, as this suggestion of Swinburne’s indicates.
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      Andrei Buckareff (2005) and J. L. Schellenberg (2005, 138–9) propose non-doxastic (or, ‘sub-doxastic’) venture models of propositional faith, with Schellenberg emphasising the positive evaluation that persons of faith make of the truth-claim to which they commit themselves. In response to Daniel Howard-Snyder (2013a) Schellenberg allows that faith may in some instances involve belief while still maintaining that ‘non-doxastic religious faith … will turn out to be a particularly important way of having religious faith as we head into the future’ (2013, 262). Bishop (2005), in response to Buckareff, also agrees that authentic faith need not always be a specifically doxastic venture. There may, then, be an emerging consensus amongst proponents of venture models that faith, at its core, consists in suitably motivated persistent practical commitment ‘beyond the evidence’ to the positively evaluated truth of foundational faith-claims which may, but need not, actually be believed to be true.
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      Robert Audi (2011) has also defended a non-doxastic account of faith, contrasting ‘fiducial faith’ and ‘doxastic faith’, and arguing that authentic religious faith need only amount to the former. Audi’s account is not strictly a ‘venture’ model, however, since he does not take commitment beyond the support of adequate evidence to be essential. Audi’s account suggests that religious faith is *sui generis*, but capable of being understood through its relations with other psychological states and actions, such as beliefs, evaluations and practical commitments. Rational assessment of religious faith, Audi thinks, must avoid treating it as implying belief, while recognising that greater confidence attaches to it than to religious hope. For another version of a non-doxastic account of faith, as a person’s ‘affective orientation or stance’, see Jonathan Kvanvig (2013, 2018). The question whether faith entails belief (even if it may not consist purely in beliefs) remains a lively focus of debate. For defence of the view that faith entails belief, see Malcolm and Scott 2016 and Mugg 2021; for criticism see Howard-Snyder 2019.
    step1: TBD
    step2: TBD
