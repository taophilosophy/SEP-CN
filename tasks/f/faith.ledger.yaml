      ## 11. Faith beyond (orthodox) theism
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      What is the potential scope of faith? On some models, the kind of faith exemplified by theistic faith is found only there. On models which take faith to consist in knowledge or belief, faith is intrinsically linked to theological content—indeed, in the case of Christian faith, to *orthodox* Christian theological content, specifiable as one unified set of doctrines conveyed to receptive human minds by the operation of divine grace. The venture models, however, allow for the possibility that authentic faith may be variously realised, and be directed upon different, and mutually incompatible, intentional objects. This pluralism is an important feature of accounts of faith in the American pragmatist tradition. John Dewey strongly rejected the notion of faith as a special kind of knowledge (Dewey 1934, 20)[^dewey-1934], as did William James, whose ‘justification of faith’ rests on a *permissibility* thesis, under which varied and conflicting faith-commitments may equally have a place in the ‘intellectual republic’ (James 1896 [1956, 30])[^james-1896]. Charles S. Peirce, another influential American pragmatist, arguably held a non-doxastic view of faith (Pope 2018)[^pope-2018].
    step1: TBD
    step2: TBD
  - id: 95
    kind: body
    source: |-
      Both Dewey and James defend models of faith with a view to advancing the idea that authentic religious faith may be found outside what is generally supposed to be theological orthodoxy. Furthermore, they suggest that ‘un-orthodox’ faith may be *more* authentic than ‘orthodox’ faith. ‘The faith that is religious’, says Dewey, ‘[I should describe as] the unification of the self through allegiance to inclusive ideal ends, which imagination presents to us and to which the human will responds as worthy of controlling our desires and choices’ (1934, 33). And James: ‘Religion says essentially two things: First, she says that the best things are the more eternal things, the overlapping things, the things in the universe that throw the last stone, so to speak, and say the final word. ... [and] the second affirmation of religion is that we are better off now if we believe her first affirmation to be true’ (James 1896 [1956, 25–6])[^james-1896]. While some of what Dewey and James say about justifiable faith may appear non-realist, in fact they both preserve the idea that religious faith aspires to grasp, beyond the evidence, vital truth about reality. For example, Dewey holds that religious belief grounds hope because it takes something to be true about the real world ‘which carr[ies] one through periods of darkness and despair to such an extent that they lose their usual depressive character’ (1934, 14–5).
