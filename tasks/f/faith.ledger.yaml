      信仰的一个成分，是某种情感性心理状态——即怀有一种安稳或信任之感。有些哲学家主张信仰径直就是这样一种状态：例如 Clegg（1979, 229）提示，这或许正是维特根斯坦的理解。此意义上的信仰——作为一个人对生活的总体“默认”情感态度——为生命的兴盛提供了宝贵根基；它一旦丧失，便被承认为“失去信仰”这一心灵灾变。然而，若要让根基性的生存安稳在有神论者所例示的那类信仰模型中占一席之地，还须就所涉安稳的种类多说几句。有神论信仰的安稳本质上是一种信心：它本质上是对*上帝*的信。一般而论，有神论信仰所例示的那类信仰必须有某个*意向对象*。由此或可论证：这一类信仰的充分模型不能还原为*纯粹*情感性的东西，还须另有一个宽泛的**认知**成分。（关于把信仰视为根本上情感性、同时容许其可能带有认知面向的说明，见 Kvanvig 2013。）[^kvanvig-2013]
