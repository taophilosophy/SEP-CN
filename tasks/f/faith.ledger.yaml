      As noted at the outset, there is a usage of ‘faith’ for which ‘having/placing faith in’ is (near enough) synonymous with ‘trusting’ or ‘trusting in’. (For discussion of how faith relates to a range of contemporary theories of trust, see McKaughan and Howard-Snyder 2022b.)[^howard-snyder-2022b][^mckaughan-2022b] If, moreover, faith of the religious kind is itself a type of trust, then we may expect our understanding of religious faith to profit from an analysis of trust in general. It is therefore worth considering what follows about the nature of faith of the sort exemplified in theistic faith from holding it to be a kind of active trust.
    step1: |-
      如开篇所指出的，有一种“信仰”的用法，其中“对……怀有/寄托信仰”与“信任”或“信靠”（近乎）同义。（关于信仰与一系列当代信任理论的关系的讨论，见 McKaughan and Howard-Snyder 2022b。）[^howard-snyder-2022b][^mckaughan-2022b] 此外，如果宗教类信仰本身就是一种信任，那么我们可以期望：对信任的一般分析将增益我们对宗教信仰的理解。因此值得考虑：如果把有神论信仰所例示的那类信仰当作一种主动的信任，关于其本性会得出什么结论。
