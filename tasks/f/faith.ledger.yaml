      On the doxastic venture model, faith involves *full* practical commitment to a faith-proposition’s truth, despite the recognition that this is not ‘objectively’ justified on the evidence. Kierkegaard’s definition of faith as ‘an objective uncertainty held fast in an appropriation process of the most passionate inwardness’ in *Concluding Unscientific Postscript* (Kierkegaard 1846 [1968, 180])[^kierkegaard-1846] is an example of a doxastic venture model. So too is Paul Tillich’s account of faith as ‘the state of being ultimately concerned’, since the claim of the object of one’s ultimate concern to ‘promise total fulfilment even if all other claims have to be subjected to it or rejected in its name’ cannot in principle be established on the basis of the evidence (Tillich 1957 [2001, 1 and 21])[^tillich-1957].
    step1: |-
      在信念冒险模型上，信仰包含对一个信仰命题之真的*充分*实践承诺，尽管承认这在证据上并非“客观地”得到辩护。克尔凯郭尔在《最后的非科学性附言》中把信仰定义为“在最热烈的内在性之占有过程中被牢牢把握的客观不确定性”（Kierkegaard 1846 [1968, 180]）[^kierkegaard-1846]，便是信念冒险模型的一个例子。保罗·蒂利希把信仰说明为“终极关切的状态”亦然，因为一个人的终极关切对象所主张的“允诺完全的实现，即便所有其他主张都必须屈从于它或以其名义遭到拒斥”，在原则上不能依证据确立（Tillich 1957 [2001, 1 and 21]）[^tillich-1957]。
    step2: |-
      在信念冒险模型上，信仰包含对一个信仰命题之真的 **充分** 实践承诺——尽管当事人承认，这在证据上并未获得“客观的”辩护。克尔凯郭尔在《最后的非科学性附言》中把信仰定义为“在最热烈的内在性之占有过程中被牢牢守持的客观不确定性”（Kierkegaard 1846 [1968, 180]）[^kierkegaard-1846]，即是信念冒险模型的一例。保罗·蒂利希把信仰说明为“终极关切的状态”，亦属此类。理由是：一个人的终极关切对象主张“允诺完全的成全，即便所有其他主张都必须屈从于它、或以其名义被拒斥”，这一主张在原则上无法依证据确立（Tillich 1957 [2001, 1 and 21]）[^tillich-1957]。
