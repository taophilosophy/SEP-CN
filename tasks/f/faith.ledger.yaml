      It is not clear, however, whether Reformed epistemology’s model of faith can achieve all that is needed to show that theist faith is reasonable. From the perspective of reflective persons of faith (or would-be faith), the question of *entitlement* arises: are they rationally, epistemically—even, morally—entitled to adopt or continue in their faith? This question will be existentially important, since faith will not be of the kind exemplified by religious faith unless its commitments make a significant difference to how one lives one’s life. Reflective believers, who are aware of the many options for faith and the possibility of misguided and even harmful faith-commitments, will wish to be satisfied that they are *justified* in their faith. The theist traditions hold a deep fear of idolatry—of giving one’s ‘ultimate concern’ (Tillich 1957 [2001])[^tillich-1957] to an object unworthy of it. The desire to be assured of entitlement to faith is thus not merely externally imposed by commitment to philosophical critical values: it is a demand internal to the integrity of theistic faith itself. Arguably, believers must even take seriously the possibility that the God they have been worshipping is not, after all, the true God (Johnston 2009)[^johnston-2009]. But, for this concern to be met, there will need to be conditions sufficient for justified faith that are ‘internalist’—that is, conditions whose obtaining is, at least indirectly if not directly, accessible to believers themselves. And, as already noted, those conditions are widely assumed to include an evidentialist requirement that faith is justified only if the truth of its cognitive content is adequately supported by the available evidence.
    step1: |-
      然而，尚不清楚改革宗认识论的信仰模型能否达成表明有神论信仰合理所需要的一切。从反思性的信仰者（或准信仰者）的视角看，*权利*（entitlement）问题出现了：他们在理性上、认识上——甚至道德上——是否有权利采纳或继续其信仰？这一问题将在生存上至关重要，因为信仰除非其委身显著影响一个人的生活方式，否则就不是宗教信仰所例示的那类信仰。反思性的信仰者意识到信仰的诸多选项以及误入歧途甚至有害的信仰委身的可能性，会希望确信自己*有正当理由*持有信仰。有神论传统对偶像崇拜——把一个人的“终极关切”（Tillich 1957 [2001]）[^tillich-1957]献给一个不配的对象——怀着深深的恐惧。渴望确证信仰的权利，因此并非仅由哲学批判价值的承诺从外部强加：它是有神论信仰自身完整性内部的一项要求。可以说，信仰者甚至必须认真对待他们所崇拜的上帝毕竟不是真上帝的可能性（Johnston 2009）[^johnston-2009]。但要使这一关切得到满足，就需要有“内在主义”的、足以产生正当信仰的条件——也就是说，其成立即便不直接、至少也间接地为信仰者自身可通达。而且，如前所述，那些条件被广泛假定包含一条证据主义要求：信仰唯有当其认知内容的真理得到可得证据的充分支持时才是正当的。
    step2: |-
      然而，改革宗认识论的信仰模型能否达成“表明有神论信仰合理”所需的全部，并不清楚。从反思性的信仰者（或准信仰者）的视角看，*权利*（entitlement）问题浮现出来：他们在理性上、认识上——乃至道德上——是否有权利采纳或继续其信仰？此问在生存上攸关重大：信仰之委身若不能显著影响一个人如何度过其生，它就不是宗教信仰所例示的那种信仰。反思性的信仰者深知信仰选项繁多，也深知误入歧途乃至有害的信仰委身之可能，故会希望确信自己*有正当理由*持守信仰。有神论传统对偶像崇拜深怀戒惧——所谓把一己的“终极关切”（Tillich 1957 [2001]）[^tillich-1957]献给一个不配的对象。于是，渴望确证信仰之权利，并非仅是哲学批判价值的承诺自外部强加的结果：它本就是有神论信仰自身完整性内部的一项要求。甚至可以说，信仰者必须认真对待这一可能：他们所崇拜的上帝毕竟并非真上帝（Johnston 2009）[^johnston-2009]。但要满足这一关切，就需要有“内在主义”的条件、足以成就正当信仰——即其成立即便不直接、至少间接地为信仰者自身可通达。而且如前所述，这些条件被广泛假定包含一条证据主义要求：唯有当其认知内容的真理获得可得证据的充分支持，信仰才是正当的。
