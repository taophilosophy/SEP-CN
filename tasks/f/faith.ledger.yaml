      Some philosophers have argued, however, that one cannot (in full reflective awareness, anyway) believe that *p* while accepting that one has insufficient evidence for *p*’s truth (Adler 2002)[^adler-2002]. The counterclaim that this is possible is defended by William James, in his controversial 1896 lecture, ‘The Will to Believe’ (James 1896 [1956])[^james-1896]. James agrees that belief cannot be directly willed and must be otherwise causally evoked (he later came to wish that he had used ‘The Right to Believe’ as his lecture’s title). James observes, however, that many beliefs have causes that do not constitute or imply an evidential grounding of their truth. James labels such causes ‘passional’—again, a potentially misleading term, since its intended referents include much more than emotional causes of belief. In particular, beliefs may be caused by ‘the circumpressure of one’s caste or set,’ of which one’s inherited religious tradition is a paradigm case (James 1896 [1956, 9])[^james-1896]. James is thus able to explain the psychological possibility of doxastic venture: one already has a ‘passionally’ caused belief, which one then takes to be true in practical reasoning despite its lack of adequate evidential grounding (compare Creel 1994, who similarly describes ‘faith’ as a ‘non-evidential doxastic passion’)[^creel-1994].
    step1: |-
      然而，一些哲学家论证：一个人不能（至少在充分的反思意识中）相信 *p*，同时又接受自己对 *p* 之真缺乏充分证据（Adler 2002）[^adler-2002]。这一事不可能的反题由威廉·詹姆斯在其备受争议的 1896 年演讲“信仰的意志”（‘The Will to Believe’）中辩护（James 1896 [1956]）[^james-1896]。詹姆斯同意信念不能被直接意愿、必须以别的方式因果地唤起（他后来表示希望自己当时用的是“相信的权利”作为演讲标题）。但詹姆斯观察到，许多信念的成因并不构成或蕴含其真理的证据根基。詹姆斯把这类成因贴上“激情性”（passional）的标签——这又是一个可能误导的术语，因为它意指的对象远不止信念的情感成因。特别地，信念可能由“一个人所属阶层或圈层的环压”造成，一个人承继的宗教传统便是其典范情形（James 1896 [1956, 9]）[^james-1896]。詹姆斯由此能够解释信念冒险的心理可能性：一个人已经有一个“激情地”造成的信念，随后在实践推理中把它当作真，尽管其缺乏充分的证据根基（比较 Creel 1994，他同样把“信仰”描述为一种“非证据的信念激情”）[^creel-1994]。
    step2: |-
      然而，一些哲学家论证：人不能（至少在充分的反思意识中）相信 *p*，同时又接受自己*对 p 之真缺乏充分证据*（Adler 2002）[^adler-2002]。反题——这是可能的——由威廉·詹姆斯在其备受争议的 1896 年演讲“信仰的意志”（‘The Will to Believe’）中辩护（James 1896 [1956]）[^james-1896]。詹姆斯同意：信念无法被直接意愿，须以别的方式因果地唤起（他后来但愿自己当年用的标题是“相信的权利”）。但詹姆斯观察到：许多信念的成因并不构成、也不蕴含其真理的证据根基。詹姆斯把这类成因称作“激情性”（passional）的——此词同样可能误导，因其所指远不止信念的情感成因。尤其，信念可能由“一个人所属阶层或圈层的环压”造成，承继而来的宗教传统便是其典范情形（James 1896 [1956, 9]）[^james-1896]。詹姆斯由此解释了信念冒险的心理可能性。人先已有一个“激情地”造成的信念，随后在实践推理中把它当作真，尽管它缺乏充分的证据根基（比较 Creel 1994，他同样把“信仰”描述为一种“非证据的信念激情”）[^creel-1994]。
