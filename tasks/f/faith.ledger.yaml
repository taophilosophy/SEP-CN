      On a fiducial model, having faith in God is making a *practical commitment*—the kind involved in *trusting God*, or, *trusting in* God. (The root meaning of the Greek *pistis*, ‘faith’, is ‘trust’ (see Morgan 2015)[^morgan-2015].) On such a model, faith’s active, practical component takes central place, though a cognitive component may be presupposed by it. Swinburne calls it the ‘Lutheran’ model, and defines it thus: ‘the person of faith does not merely believe that there is a God (and believe certain propositions about him)—he trusts Him and commits himself to Him’ (2005, 142). Yet, as noted earlier, Aquinas too takes the ultimate object of faith to be God, ‘the first reality’, and, furthermore, understands ‘formed’ faith as trusting commitment to God, motivated by, and directed towards, love of God as one’s true end (see *Summa Theologiae* 2a2ae, 4, 3; Aquinas [2006], 123–7). It is true that Aquinas allows that the devils have faith in a certain sense, but this ‘faith’ amounts only to their belief that what the Church teaches is the truth, arrived at not by grace but ‘forced from them’ reluctantly by ‘the acumen of their natural intelligence’ (*Summa Theologiae* 2a2ae, 5, 2; Aquinas [2006], 155 & 157). Aquinas’s account of ‘saving’ faith is thus also a fiducial model.
    step1: |-
      在信任型模型上，对上帝有信仰便是作出一种*实践承诺*——即*信任上帝*或*信靠上帝*所涉及的那种承诺。（希腊语 *pistis*（“信仰”）的词根义是“信任”（见 Morgan 2015）[^morgan-2015]。）在这类模型上，信仰的主动、实践成分占据中心位置，尽管认知成分可能为其所预设。斯温伯恩称之为“路德宗”模型，并如此定义：“有信仰的人不只是相信存在一个上帝（并相信关于他的某些命题）——他信任他并向他委身”（2005, 142）。然而如前所述，阿奎那同样把信仰的终极对象当作上帝——“第一实在”，而且进一步把“成形”的信仰理解为对上帝的信任性委身，它以对人真正终极目的——爱上帝——为动机与方向（见 *Summa Theologiae* 2a2ae, 4, 3; Aquinas [2006], 123–7）。诚然，阿奎那容许魔鬼在某种意义上也有信仰，但这种“信仰”只相当于它们相信教会所教导的是真理，其获得不凭恩典，而是它们的“自然智力之敏锐”不情愿地“逼出来的”（*Summa Theologiae* 2a2ae, 5, 2; Aquinas [2006], 155 & 157）。因此，阿奎那对“拯救性”信仰的说明也是一个信任型模型。
    step2: |-
      在信任型模型上，对上帝怀有信仰，便意味着许下一种 **实践承诺**——**信任上帝** 或 **信靠上帝** 所涉及的那类承诺。（希腊语 *pistis*（“信仰”）的词根义即“信任”（见 Morgan 2015）[^morgan-2015]。）在此类模型上，信仰中主动的、实践的成分占据中心，尽管认知成分可能为其所预设。斯温伯恩称之为“路德宗”模型，定义如下：“有信仰的人不只是相信存在一个上帝（并相信关于他的若干命题）——他信任他并向他委身”（2005, 142）。然而如前所述，阿奎那同样把信仰的终极对象当作上帝——“第一实在”；而且他进一步把“成形”的信仰理解为对上帝的信任性委身：以爱上帝为动机，并朝向这一目的——爱上帝正是人真正的终极目的（见 *Summa Theologiae* 2a2ae, 4, 3; Aquinas [2006], 123–7）。诚然，阿奎那容许魔鬼在某种意义上也有“信仰”，但那“信仰”不过相当于它们相信教会所教导的即是真理——其获得不凭恩典，而是由“其自然智力之敏锐”勉强“逼出来的”（*Summa Theologiae* 2a2ae, 5, 2; Aquinas [2006], 155 & 157）。故阿奎那对“拯救性”信仰的说明，同样是一个信任型模型。
