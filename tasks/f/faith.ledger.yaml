      ## 7. Faith as doxastic venture
    step1: |-
      然而，有神论信仰所涉及的信任与人际信任所涉及的信任有显著差异。一方面，如果上帝确实是受托者，信任似乎不会冒任何失望的风险。鉴于不变之爱的上帝存在，人的信任处于终极的安全之中。但真正把自己托付给上帝的冒险，似乎始于一个挑战：能够相信或接受确实存在这样一位上帝。虽然有些人肯定这一主张是基本知识之事，有些人认为有充分证据为其辩护，但如前所述，另一些人主张每个人都必须面对奠基性有神论主张的证据模糊。对那些既拒绝把有神论信仰当作基本知识的模型、又认为上帝存在的问题不能凭可得证据在理智上得到解决的人来说，信靠上帝所涉及的冒险（如果真有这种冒险）似乎包含一个*信念性*冒险：信任者已经在越过可得证据而冒险——*就在他们相信或接受*上帝存在并可倚靠其得救之时。换句话说，信*靠*上帝似乎预设了相*信*上帝存在。但如果如此，问题便变得紧迫：一个人是否、以及在何种条件下，有权作出这样一种超越证据的冒险——在实践承诺中委身于关于终极实在的特定观点及其对我们应当如何生活的意涵。
    step2: |-
      然而，有神论信仰所涉及的信任，与人际信任所涉及的信任，差异显著。一则：倘若上帝确是受托者，信任似乎冒不到任何失望的风险——既有不变之爱的上帝存在，人的信任便处于终极的安稳之中。可真正把自己托付给上帝的冒险，似乎始于一个挑战：能够相信或接受——确有这样一位上帝。有人肯定这一主张属于基本知识；有人认为有充分证据足以辩护它；但如前所述，另一些人主张人人都须面对奠基性有神论主张的证据模糊。对那些既拒斥“有神论信仰即基本知识”的模型、又认为上帝存在的问题无法凭可得证据在理智上解决的人来说，信靠上帝所涉的冒险（果真有此冒险的话）似乎包含一个*信念性*的冒险：信任者已然越过了可得证据——*就在他们相信或接受*上帝存在、且可靠他得救*之际*。换言之，信*靠*上帝似乎预设了相*信*上帝存在。果如此，问题便变得紧迫：一个人是否有权、又在何种条件下有权，作出这般超越证据的冒险——在实践承诺中委身于某种关于终极实在的特定观点，及其对我们当如何生活的意涵。
