      Serious philosophical defence of a doxastic venture model of faith thus implies a moderate version of fideism, for which epistemic concern is not overridden and for which, therefore, it is a constraint on faith-commitment that it *not* accept what is known, or justifiably believed on the evidence, to be false. Rather, faith commits itself only *beyond*, and not against, the evidence—and it does so *out of* epistemic concern to grasp truth on matters of vital existential importance. The thought that one may be entitled to commit to an existentially momentous truth-claim in principle undecidable on the evidence when forced to decide either to do so or not is what motivates William James’s ‘justification of faith’ in ‘The Will to Believe’ (James 1896 [1956])[^james-1896]. If such faith is to be justified, its cognitive content will (on realist assumptions) have to cohere with our best evidence-based theories about the real world. Faith may extend our scientific grasp of the real, but may not counter it. Whether the desire to grasp more truth about the real than science can supply is a noble aspiration or a dangerous delusion is at the heart of the debate about entitlement to faith on this moderate fideist doxastic venture model.
    step1: |-
      因此，对信念冒险模型的严肃哲学辩护蕴含一种温和版本的信仰主义：在其中认识关切未被压制，因此对信仰承诺的一项约束是它*不*接受已知为假、或依证据可正当地相信为假的东西。毋宁说，信仰只*超越*证据而不违抗证据地委身——而且它这样做是*出于*把握重大生存攸关之事上真理的认识关切。当一个人被迫在“委身于一项在证据上原则上不可判定的、生存上重大的真理主张”与“不委身”之间作决断时，他可以有权利选择委身——正是这一思想推动威廉·詹姆斯在“信仰的意志”中作出“信仰的辩护”（James 1896 [1956]）[^james-1896]。如果这样的信仰要得到辩护，其认知内容将（在实在论假定下）必须与我们关于实在世界的最佳证据性理论融贯。信仰可以扩展我们对实在的科学把握，但不得与之对抗。把握多于科学所能供给的关于实在的真理，这一欲望究竟是高贵的抱负还是危险的迷妄——这正是这一温和信仰主义信念冒险模型上关于信仰权利之争的核心。
    step2: |-
      于是，对信念冒险模型的严肃哲学辩护，蕴含一种温和版的信仰主义：在其中，认识关切并未被压制；因此，信仰承诺受一条约束——它 **不得** 接受已知为假、或依证据可正当地相信为假的东西。毋宁说，信仰只 **超越** 证据而委身，绝不违抗证据——而且其委身 **出于** 认识关切：要在生死攸关之事上把握真理。当人被迫在“委身与否”之间作决断时，面对一项证据上原则上不可判定、生存上却举足轻重的真理主张，人有权选择委身。正是这一思想推动了威廉·詹姆斯在“信仰的意志”中的“信仰辩护”（James 1896 [1956]）[^james-1896]。这样的信仰若要得到辩护，其认知内容（在实在论假定下）便必须与我们关于实在世界的最佳证据性理论相融贯。信仰可以扩展我们对实在的科学把握，却不得与之作对。至于“把握多于科学所能供给的实在真理”这一欲望究竟是高贵的抱负还是危险的迷妄——正是这一温和信仰主义的信念冒险模型上信仰权利之争的核心所在。
