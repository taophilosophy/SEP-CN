      Conceptually fundamental to trust is the notion of a person (or persons)—the truster—trusting *in* some agent or agency—the trustee—*for* some (assumedly) favourable outcome (though what the trustee is trusted for is often only implicit in the context). Trust involves a *venture*; so too—it is widely agreed—does faith. So, if faith is trust, the venture of faith might be presumed to be the type of venture implicated in trust. A venture is an action that places the agent and outcomes of concern to the agent significantly beyond the agent’s own control. Trust implies venture. When we trust we commit ourselves to another’s control, accepting—and, when necessary, co-operating as ‘patient’—with the decisions of the trustee. Venturing in trust is usually assumed to be *essentially* risky, making oneself vulnerable to adverse outcomes or betrayal. Swinburne makes the point this way: ‘To trust someone is to act on the assumption that she will do for you what she knows that you want or need, when the evidence gives some reason for supposing that she may not and where there will be bad consequences if the assumption is false’ (2005, 143). Annette Baier makes no requirement for evidence that the trustee may prove untrustworthy, but nevertheless takes trust to involve ‘accepted vulnerability to another’s *possible but not expected* ill will (or lack of good will) toward one’ (Baier 1986, 235, our emphasis)[^baier-1986]. Accordingly, it seems sensible to hold that one should trust only with good reason. But if, as is plausible, good reason to trust requires sufficient evidence of the trustee’s trustworthiness, reasonable trust appears both to have its venturesomeness diminished and, at the same time, to become more difficult to achieve than we normally suppose. For we often lack adequate—or even, any—evidence of a trustee’s trustworthiness in advance of our venture, yet in many such cases we suppose that our trust is reasonable (see, for example, Adams 1987)[^adams-1987]. But, if adequate evidence of trustworthiness is *not* required for reasonable trust, how is reasonable trust different from ‘blind’ trust?
    step1: |-
      在概念上对信任至关重要的是这样的观念：一个人（或一些人）——信任者——信任*于*某个行动者或机构——受托者——*为了*某个（假定）有利的结果（尽管受托者被信任来做什么，常常只在语境中隐含）。信任包含一种*冒险*；信仰也如此——这一点得到广泛同意。所以，如果信仰是信任，信仰的冒险或许可以被假定为信任所涉及的那种冒险。冒险是一种把行动者及其关切的后果显著地置于行动者自身控制之外的行动。信任蕴含冒险。当我们信任时，我们把自己交给另一个的控制，接受受托者的决定——必要时以“承受者”身份与之合作。信任中的冒险通常被假定为*本质上*有风险的，使人容易遭受不利后果或背叛。斯温伯恩如此表述：“信任一个人，就是依据这样的假定行动：她会为你做她知道你想要或需要的事——尽管证据给出某些理由令人猜想她可能不会，而且如果假定错误将有坏的后果”（2005, 143）。安内特·拜尔不要求有受托者可能不可靠的证据，但仍然把信任看作包含“被接受的、对另一个人*可能但非预期*的恶意（或善意缺失）的脆弱性”（Baier 1986, 235，着重号为本文作者所加）[^baier-1986]。据此，主张人只应有良好理由地信任，似乎是有道理的。但如果（如貌似合理的）信任的良好理由要求有受托者可靠性的充分证据，合理的信任似乎既减损了其冒险性，同时又变得比我们通常设想的更难达成。因为我们常常在冒险之前缺乏受托者可靠性的充分——甚至任何——证据，然而在许多这类情形中我们仍认为自己的信任是合理的（例如见 Adams 1987）[^adams-1987]。但是，如果合理的信任*不*要求可靠性的充分证据，合理的信任与“盲目”信任又如何区别？
    step2: |-
      概念上对信任攸关的是这样一个观念：一个人（或一群人）——信任者——*信靠*某个行动者或机构——受托者——*以图*某个（假定的）有利结果（尽管受托者被信任来做什么，常只在语境中隐含）。信任包含一种*冒险*；信仰亦然——此点广获同意。故若信仰是信任，信仰的冒险或许便被假定为信任所含的那种冒险。冒险是一种把行动者及其所关切的后果显著置于行动者自身掌控之外的行动。信任蕴含冒险。当我们信任时，我们把自己交付于他人的掌控，接受受托者的决定——必要时以“承受方”的身份与之合作。信任中的冒险通常被假定为*本质上*有风险的：它使人容易遭受不利后果或背叛。斯温伯恩如此说：“信任一个人，就是依这样的假定行动——她会为你做她知道你想要或需要的事；尽管证据给出某些理由令人猜想她或许不会，而且假定若错，后果便坏”（2005, 143）。安内特·拜尔不要求受托者可能不可靠的证据，但仍把信任看作包含“被接受的、对他人*可能而非预期*的恶意（或善意的缺乏）的脆弱”（Baier 1986, 235，着重号为本文作者所加）[^baier-1986]。据此，主张人只应在有良好理由时信任，似乎顺理成章。可倘若（如貌似合理的）信任的良好理由要求受托者可靠性的充分证据，合理的信任便似乎既减损了其冒险性，又同时变得比我们通常所想的更难达成。因为我们常在冒险之前缺乏受托者可靠性的充分——乃至任何——证据，而在许多这类情形中，我们仍认为自己的信任是合理的（例如见 Adams 1987）[^adams-1987]。但如果合理的信任*并不*要求可靠性的充分证据，它又与“盲目”的信任有何分别？
