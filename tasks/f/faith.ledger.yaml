      于是，一种更充分的作为希望的信仰模型，或许不如把信仰当作*在希望中*或*从希望出*的行动。这样一个模型便接近信仰的非信念性冒险模型，其差异仅在于：从“上帝存在”的希望出发而行动，与在实践推理中把这一主张当作真（尽管没有信念）有所不同，但这一差异在行为结果的层面上可能无法检测（见 McKaughan 2013）[^mckaughan-2013]。作为在希望中行动的信仰模型，与信念性及非信念性冒险模型一道，拒绝“信仰需要认知确定性”的观点。但一个人可以在希望中坚定而有韧性地行动，只要他有一个强有力的情感/评价立场，即便他缺乏自己的希望将得实现的信念。然而，希望 *p* 并不包含对“p 为真”表明立场，而这一点被广泛认为对信仰是本质性的。
