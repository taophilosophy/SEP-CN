      在信任型模型上，对上帝怀有信仰，便是作出一种*实践承诺*——*信任上帝*或*信靠上帝*所涉及的那类承诺。（希腊语 *pistis*（“信仰”）的词根义即“信任”（见 Morgan 2015）[^morgan-2015]。）在此类模型上，信仰的主动的、实践的成分占据中心，尽管认知成分可能为其所预设。斯温伯恩称之为“路德宗”模型，定义如下：“有信仰的人不只是相信存在一个上帝（并相信关于他的若干命题）——他信任他并向他委身”（2005, 142）。然而如前所述，阿奎那同样把信仰的终极对象当作上帝——“第一实在”；而且他进一步把“成形”的信仰理解为对上帝的信任性委身：以爱上帝——人真正的终极目的——为动机，并朝向这一目的（见 *Summa Theologiae* 2a2ae, 4, 3; Aquinas [2006], 123–7）。诚然，阿奎那容许魔鬼在某种意义上也有“信仰”，但那“信仰”不过相当于它们相信教会所教导的即是真理——其获得不凭恩典，而是由“其自然智力之敏锐”勉强“逼出来的”（*Summa Theologiae* 2a2ae, 5, 2; Aquinas [2006], 155 & 157）。故阿奎那对“拯救性”信仰的说明，同样是一个信任型模型。
