    kind: body
    source: |-
      If faith of the religious kind is to count as valuable and/or virtuous, it seems there must be a suitable degree of resilience in the commitment made (see Howard-Snyder and McKaughan 2022b for arguments that faith requires resilience; for discussion of the value and potential virtuousness or viciousness of resilient faith see McKaughan and Howard-Snyder 2023a; on the rationality of resilient faith see Buchak 2017, Jackson 2021, and McKaughan 2016)[^buchak-2017][^howard-snyder-2022b][^jackson-2021][^mckaughan-2016][^mckaughan-2022b][^mckaughan-2023a]. Persons of religious faith and faithfulness both put their faith in and are faith*ful* to the object of their commitment, though the salient kind of faithfulness may be a matter of the continual renewal of faith rather than of maintaining it unchanged (Pace and McKaughan 2020)[^pace-2020]. (See Audi 2014 for a discussion of faith and faithfulness in relation to virtue. Audi defends faithfulness as, like courage, an ‘adjunctive’ virtue, and argues that being ‘a person of faith’ counts as a ‘virtue of personality’.)[^audi-2014]
    step1: TBD
    step2: TBD
  - id: 92
    kind: body
    source: |-
      Faith is only one of the Christian theological virtues, of course, the others being hope and charity (or love, *agapē*): St. Paul famously affirms that the greatest of these is love (I Cor. 13:13). The question thus arises how these three virtues are related. One suggestion is that faith is taking it to be true that there are grounds for the hope that love is supreme—not simply in the sense that love constitutes the ideal of the supreme good, but in the sense that living in accordance with this ideal constitutes an ultimate salvation, fulfilment or consummation that is, in reality, victorious over all that may undermine it (in a word, over evil). The supremacy of love is linked to the supremacy of the divine itself, since love is the essential nature of the divine. What is hoped for, and what faith assures us is *properly* hoped for, is a sharing in the divine itself, loving as God loves (see Brian Davies on Aquinas, 2002). On this understanding, reducing faith to a kind of hope (Section 9 above) would eradicate an important relation between the two—namely that people of faith take reality to be such that their hope (for salvation, the triumph of the good) is well founded, and not merely an attractive fantasy or inspiring ideal. (See Jeffrey 2017 for discussion of the moral permissibility of faith, particularly in connection with hope.)[^jeffrey-2017]
