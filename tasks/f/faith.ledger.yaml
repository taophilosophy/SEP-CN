      信任型信仰模型似乎更适于把信仰展示为德性，尽管可能需要为所信任的拯救者之可靠性作辩护。信念性与非信念性冒险模型可以把信仰正名为德性，只要它们提供稳固的权利条件，以确保并非任何“信仰的跳跃”都可允许。前文（第 7 节）已提到的詹姆斯式说明旨在满足这一需要。詹姆斯自己关于什么足以辩护信仰冒险的观点，或可论证需要一项伦理补充：冒险的非证据动机与其内容都必须在道德上可接受（Bishop 2007a, 163–6）[^bishop-2007a]。
