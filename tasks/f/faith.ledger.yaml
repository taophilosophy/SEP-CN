      Aquinas’s model of faith thus shares with the Reformed epistemologist model the problem that it leaves unanswered the reflective believer’s concern about entitlement. Attempting to settle that concern by meeting the evidential requirement leads to circularity: theological truths are to be accepted on divine authority, yet the truth that *there is* *such an authority* (historically mediated as the relevant tradition maintains) is amongst those very truths that are to be accepted on divine authority—indeed, it is the crucial one. As Descartes puts it in the Dedication to his *Meditations*, ‘It is of course quite true that we must believe in the existence of God because it is a doctrine of Holy Scripture, and conversely, that we must believe Holy Scripture because it comes from God. … But this argument cannot be put to unbelievers because they would judge it to be circular’ (Descartes 1641 [Cottingham et al. 1984, 3])[^descartes-1641]. Thus, although they differ on the question whether the firm beliefs of faith count as knowledge, both Aquinas and Calvin understand faith as essentially involving accepting the truth of propositions as revealed through willingly receiving God’s gracious gift of that very revelation. The question remains how accepting this gift could be epistemically rational. The externalist account of how Christian beliefs may have epistemic worth proposed in Plantinga’s model of faith (named ‘the A/C’ model because its sources are supposedly found in Aquinas as well as Calvin) offers some help with the required explanation, but (as noted in the final paragraph of Section 4 above) may arguably not by itself be sufficient.
    step1: |-
      因此，阿奎那的信仰模型与改革宗认识论者模型共有这样一个问题：它未回答反思性信仰者对权利的关切。试图通过满足证据要求来解决这一关切会导致循环：神学真理要凭神圣权威接受，然而“存在这样一个权威”之真（如相关传统所持，经由历史中介）恰恰属于要凭神圣权威接受的那些真理——事实上它正是其中关键的一条。正如笛卡尔在《沉思集》献词中所说：“我们必须相信上帝存在，因为这是圣经的教义；反过来，我们必须相信圣经，因为它来自上帝——这当然完全正确。……但这一论证不能向不信者提出，因为他们会判定它是循环的”（Descartes 1641 [Cottingham et al. 1984, 3]）[^descartes-1641]。因此，尽管在信仰的坚定信念是否算作知识这一问题上有分歧，阿奎那与加尔文都把信仰理解为本质上包含：经由甘愿领受上帝对那一启示本身的恩赐，而接受以启示方式显明的命题之真。问题依然是：接受这一恩赐如何在认识上可以是理性的。普兰丁格信仰模型（名为“A/C 模型”，因为其来源据称既见于阿奎那也见于加尔文）所提出的、关于基督教信念如何可能有认识价值的说明，为所需的解释提供了一些帮助，但（如上文第 4 节末段所述）或可论证它自身并不充分。
    step2: |-
      于是，阿奎那的信仰模型与改革宗认识论者模型同有一病：对反思性信仰者的权利关切置而不答。想靠满足证据要求来解此关切，便落入循环：神学真理要凭神圣权威接受；然而“确有这样一个权威”之真（如相关传统所主张，经历史中介）恰属于那批要凭神圣权威接受的真理——而且正是其中关键的一条。正如笛卡尔在《沉思集》献词中所言：“我们必须相信上帝存在，因为这是圣经的教义；反过来，我们必须相信圣经，因为它来自上帝——这固然全对。……但这一论证不能提给不信者，因为他们会判定它是循环的”（Descartes 1641 [Cottingham et al. 1984, 3]）[^descartes-1641]。故此，在“信仰的坚定信念是否算知识”上，二人固存分歧。但阿奎那与加尔文都把信仰理解为本质上包含这一点：人甘愿领受上帝对那一启示的恩赐，从而接受以启示显明的命题之真。问题依旧：接受这一恩赐，如何在认识上算得理性。普兰丁格的信仰模型（得名“A/C 模型”，因为其源头据称既见于阿奎那亦见于加尔文）对基督教信念如何可能有认识价值给出说明，为所需的解释提供了若干帮助；但（如上文第 4 节末段所述）或可论证，它自身并不充分。
