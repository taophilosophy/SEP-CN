      The rationality of faith on this model will rest on the rationality of the firmly held theological beliefs in which it consists. As Swinburne notes, if such beliefs are founded on evidence that renders their truth sufficiently more probable than not, then the beliefs concerned may amount to knowledge on a contemporary ‘justified true belief’ fallibilist epistemology, even though they fall short of knowledge on Aquinas’s own criteria, which require that what is known be ‘seen’ (i.e., fully and directly comprehended) (*Summa Theologiae* 2a2ae 1, 4 & 5 (Aquinas 1265–1273 [2006], 27)). In any case, the reasonableness of faith on this model of faith as (non-basic) theological belief depends on the beliefs concerned being adequately evidentially justified. The claim that this condition is satisfied is defended by John Locke in *The Reasonableness of Christianity* (1695 [1999]), and, in contemporary philosophy, by Richard Swinburne’s Bayesian approach to the epistemology of Christian belief (see, for example, Swinburne 2003)[^swinburne-2003].
    step1: |-
      这一模型上信仰的合理性将取决于构成信仰的那些坚定持有的神学信念的合理性。正如斯温伯恩所指出的，如果这类信念建基于使其真理足够大概率上为真的证据之上，那么相关信念在当代“得到辩护的真信念”可谬论认识论上可以算作知识，即便它们按阿奎那本人的判准——要求所知者被“看见”（即被完全且直接地领会）——仍够不上知识（*Summa Theologiae* 2a2ae 1, 4 & 5 (Aquinas 1265–1273 [2006], 27)）。无论如何，这一作为（非基本的）神学信念的信仰模型的合理性，取决于相关信念得到充分的证据辩护。约翰·洛克在《基督教的合理性》（1695 [1999]）中捍卫“这一条件得到满足”的主张；在当代哲学中，理查德·斯温伯恩以贝叶斯进路处理基督教信念认识论亦为其辩护（见例如 Swinburne 2003）[^swinburne-2003]。
    step2: |-
      这一模型下信仰的合理性，系于构成信仰的若干神学信念（坚定持有者）是否合理。斯温伯恩指出：若这类信念所依托的证据使其为真的概率明显高于不然，相关信念便可在当代“得到辩护的真信念”可谬论认识论下算作知识。即便按阿奎那本人的判准——要求对所知者有“看见”，即完全而直接的领会——它们仍够不上知识（*Summa Theologiae* 2a2ae 1, 4 & 5 (Aquinas 1265–1273 [2006], 27)）。无论如何，作为（非基本的）神学信念的信仰模型，其合理性取决于相关信念是否得到充分的证据辩护。“这一条件获得满足”之主张，约翰·洛克在《基督教的合理性》（1695 [1999]）中即已持论；当代哲学中，理查德·斯温伯恩以其处理基督教信念认识论的贝叶斯进路为其辩护（见例如 Swinburne 2003）[^swinburne-2003]。
