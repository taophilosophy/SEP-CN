      But the deeper assumption made by this model of faith as non-basic (justified) belief (as, too, by the model of it as basic knowledge yielded by the proper functioning of a special cognitive faculty) is that God’s self-revelation is primarily the revelation of the truth of propositions articulated in human language (compare Swinburne 1992)[^swinburne-1992]. Alternative understandings of revelation are available, however. In particular, it may be held that it is primarily *the divine itself* that is revealed—the reality, not merely a representation of it. (See Lebens 2023 for discussion of faith as knowledge by acquaintance with God from a Jewish perspective)[^lebens-2023]. Propositional articulations of what is revealed may still be essential, but they need to be accepted as at a remove from the object of revelation itself, and therefore as limited. The development of propositional articulations expressing the nature and will of the self-revealing God—the doctrines of ‘the Faith’—will, of course, be understood as a process under providential grace. It is often assumed that that process can achieve ‘closure’ in a completed set of infallibly known creedal propositions. But this assumption about how divine inspiration operates may be contested, both on the theological grounds that it reflects the all-too-human desire to gain control over God’s self-revelation (to ‘pin God down once and for all’), and on the wider epistemological grounds that any attempt to grasp independent reality in human language will be in principle limited and fallible, subject to revision in the light of future experience.
    step1: |-
      但是，这一把信仰作为非基本（得到辩护的）信念的模型（把信仰作为特殊认知官能正当运作所产生之基本知识的模型亦然）所做的更深层假定是：上帝的自我启示主要是对以人类语言表述的命题之真的启示（比较 Swinburne 1992）[^swinburne-1992]。然而，对启示的另类理解是可得的。特别是，或可主张被启示的主要是*神圣者自身*——那实在，而不仅是它的表征。（关于从犹太视角把信仰视为对上帝亲知之知的讨论，见 Lebens 2023）[^lebens-2023]。命题性的表述对所启示者而言仍可以是本质的，但它们需要被接受为与启示对象本身有距离，因而是有限的。表达自我启示的上帝之本性与其旨意的命题性表述——“那信仰”的诸教义——当然会被理解为在护佑恩典之下的过程。人们常假定这一过程可以达到“封闭”，完成一套无误认识的信条命题集合。但关于神圣默示如何运作的这一假定可以受到质疑：既可基于神学理由——它反映了太具人性的、想掌控上帝自我启示的欲望（“一劳永逸地把上帝钉住”），也可基于更宽的认识论理由：任何以人类语言把握独立实在的尝试都将在原则上有限且可谬，须依未来经验加以修订。
    step2: |-
      可是，这一把信仰视为非基本（得到辩护的）信念的模型（把信仰视为特殊认知官能正当运作所产基本知识的模型亦然）做了更深一层的假定：上帝的自我启示，首要地是对以人类语言表述的命题之真的启示（比较 Swinburne 1992）[^swinburne-1992]。然而对启示另有一类理解可取：尤其，或可主张被启示的首要乃*神圣者自身*——那实在，而不止是它的表征。（从犹太视角把信仰视为对上帝亲知之知的讨论，见 Lebens 2023）[^lebens-2023]。命题性的表述对所启示者而言仍可以是本质的，但它们须被接受为与启示对象本身隔着一段距离，因而是有限的。表达自我启示之上帝的本性与旨意的命题性表述——“那信仰”的诸教义——当然会被理解为护佑恩典之下的过程。人们常假定这一过程可达“封闭”，收束为一套无误认识的信条命题集合。但关于神圣默示如何运作的这一假定可受质疑：一则基于神学理由——它反映着太具人性的、欲掌控上帝自我启示的欲望（“一劳永逸地把上帝钉死”）；二则基于更宽的认识论理由——任何以人类语言把握独立实在的尝试，原则上皆有限而可谬，须依未来经验修订。
