      Judeo-Christian scripture envisions humans as actively engaged in a covenantal relationship with God. Their ongoing participation in, and commitment to, such a relationship paradigmatically involves both faith in God and faithfulness to God (McKaughan and Howard-Snyder 2022a and 2023a; Pace and McKaughan 2020)[^howard-snyder-2022a][^mckaughan-2022a][^mckaughan-2023a][^pace-2020]. The kind of faith of which Christian faith is a paradigm case, then, may be understood as ‘action-centred commitment’ (McKaughan 2016, 78)[^mckaughan-2016], e.g., to the Christian ‘way’. Arguably, faith understood as a combination of affective and cognitive elements would miss its essential active component. We now turn, then, to consider a *fiducial* model—a model of faith as trust, understood not simply as an affective state but as an *action*.
    step1: |-
      犹太-基督教圣经把人设想为主动卷入与上帝的圣约关系。他们对这一关系的持续参与和委身，典范地既包含对上帝的信仰，也包含对上帝的忠信（McKaughan and Howard-Snyder 2022a and 2023a; Pace and McKaughan 2020）[^howard-snyder-2022a][^mckaughan-2022a][^mckaughan-2023a][^pace-2020]。以基督教信仰为典范情形的那类信仰，因此可以被理解为“行动中心的承诺”（McKaughan 2016, 78）[^mckaughan-2016]，例如对基督教“道路”的承诺。可以说，把信仰理解为情感与认知要素的组合，会错过其本质性的主动成分。于是我们现在转而考察一个 *fiducial*（信任型）模型——把信仰视为信任的模型，此信任不止被理解为一种情感状态，更被理解为一种**行动**。
    step2: |-
      犹太-基督教圣经把人设想为主动置身于与上帝的圣约关系之中。人对这一关系的持续参与和委身，典范地既含对上帝之信，也含对上帝之忠信（McKaughan and Howard-Snyder 2022a and 2023a; Pace and McKaughan 2020）[^howard-snyder-2022a][^mckaughan-2022a][^mckaughan-2023a][^pace-2020]。故以基督教信仰为典范情形的那类信仰，可以理解为“行动中心的承诺”（McKaughan 2016, 78）[^mckaughan-2016]——例如对基督教“道路”的承诺。可以说，把信仰理解为情感与认知要素的组合，便错过了其本质性的主动成分。于是我们现在转入对一个 *fiducial*（信任型）模型的考察——把信仰视为信任的模型；此处的信任不止是一种情感状态，更是一种 **行动**。
