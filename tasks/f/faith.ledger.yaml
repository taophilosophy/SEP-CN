      一种一般的——即非神学特定的——宗教类信仰说明，或许有潜力作为批评宗教信仰内容的特定哲学表述的工具。可允许的信仰冒险的条件，在某些关于上帝是谁或什么的不充分构想下，可以*排除*对上帝的信仰。可以说，当代宗教哲学中盛行的“人格性全知上帝”正是这样一种不充分的构想（Bishop 2007b）[^bishop-2007b]。于是，对信仰是什么的理解，或许能推动对有神论传统所持上帝概念的根本性探究（Bishop 1998; Johnston 2009; Bishop and Perszyk 2014, 2023）[^bishop-1998][^bishop-2014][^johnston-2009]。
