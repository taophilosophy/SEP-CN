      Some argue, however, that the truth of theism is ‘evidentially ambiguous’—that is, that our total available evidence is equally viably interpreted from both a theist and a naturalist/atheist perspective (Hick 1966 and 1989; Davis 1978; Penelhum 1995; McKim 2001)[^davis-1978][^hick-1966][^hick-1989][^mckim-2001]. This thesis of evidential ambiguity may be supported as the best explanation of the diversity of belief on religious matters, and/or of the persistence of the debate about theism, with philosophers of equal acumen and integrity engaged on either side. Or the ambiguity may be considered systematic—for example, on the grounds that both natural theological and natural atheological arguments fail because they are deeply circular, resting on implicit assumptions acceptable only to those already thinking within the relevant perspective. (In relation to Swinburne’s Bayesian natural theology, in particular, this objection surfaces in criticism of assumptions about how to set the prior probabilities implicated in calculations of, for example, theism’s probability on the evidence of the ‘fine-tuning’ of the Universe’s basic physical constants, or of the probability, on all our evidence, of the truth of the Resurrection.) If the ambiguity thesis is correct, then—assuming evidentialism—firmly held theistic belief will fail to be reasonable.
    step1: |-
      然而，有人论证有神论的真理是“证据上模糊的”——就是说，我们全部可得证据既可以从有神论视角、也可以从自然主义/无神论视角得到同样可行的诠释（Hick 1966 and 1989; Davis 1978; Penelhum 1995; McKim 2001）[^davis-1978][^hick-1966][^hick-1989][^mckim-2001]。这一证据模糊论题可以获得支持：作为宗教事务上信念多样性的最佳解释，和/或关于有神论的辩论之所以绵延不绝——双方都有同样敏锐而正直的哲学家参战——的最佳解释。或者，这种模糊可被视为系统性的——例如，以自然神学与自然无神论论证双双失败为据，理由是它们都深陷循环，所依赖的隐含假定只有已在相应视角内思考的人才可接受。（就斯温伯恩的贝叶斯自然神学而言，这一反对意见尤其表现为对其关于如何设定先验概率的假定的批评——例如在“宇宙基本物理常数的精细调校”证据上计算有神论概率、或按我们全部证据计算复活之真的概率时所涉的先验概率。）如果模糊论题正确，那么——假定证据主义——坚定持有的有神论信念将失去合理性。
    step2: |-
      然而，有人主张有神论真理“证据上含糊”——即我们的全部可得证据，既可从有神论视角、也可从自然主义/无神论视角得到同样可行的诠释（Hick 1966 and 1989; Davis 1978; Penelhum 1995; McKim 2001）[^davis-1978][^hick-1966][^hick-1989][^mckim-2001]。这一证据模糊论题可以得到支持：或者作为宗教事务上信念多样性的最佳解释，和/或作为有神论之争绵延不绝——双方均有同样敏锐而正直的哲学家参战——的最佳解释。或者，这种含糊可被视为系统性的——例如以自然神学与自然无神论论证双双失败为据：它们深陷循环，所倚的隐含假定唯已在相应视角内运思者方可接受。（就斯温伯恩的贝叶斯自然神学而言，此一反对尤其表现为批评其设定先验概率的假定。举例来说，据“宇宙基本物理常数的精细调校”这一证据计算有神论的概率，或据我们全部证据计算复活为真之概率，都要用到先验概率。）倘若模糊论题正确，那么——在证据主义假定下——坚定持有的有神论信念将失去合理性。
