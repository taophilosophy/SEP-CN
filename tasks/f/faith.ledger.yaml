      One way to relieve this pressure is to offer a *non-realist* analysis of theological claims. Trusting God will then not entail any commitment to *reality’s* being a certain way. Rather, on arguably the most sophisticated kind of non-realist view, theological beliefs arise because living ‘trustingly’ comes to be expressed and reinforced through a culturally constructed fiction about God and his great saving acts. This existential confidence may then be described, using the language of the fiction, as ‘trusting God’ (Cupitt 1980, Geering 1994)[^cupitt-1980][^geering-1994]. On such a non-realist account, the model of faith as trust brackets the cognitive component of faith, and risks becoming, in effect, a model of faith as purely a certain kind of affective state. But, in any case, non-realist models will be rejected by those who take faith to have a cognitive component that functions as a grasping—or would-be grasping—of how things really are.
    step1: |-
      缓解这一压力的一条途径，是对神学主张提供一种*非实在论*的分析。于是信任上帝将不蕴含任何对*实在*以特定方式存在的承诺。毋宁说，在可以说最精致的一类非实在论观点上，神学信念的产生是因为“以信任的方式生活”逐渐通过一种关于上帝及其伟大拯救行动的文化建构虚构得到表达和强化。这种生存论的信心于是可以用那虚构的语言描述为“信任上帝”（Cupitt 1980, Geering 1994）[^cupitt-1980][^geering-1994]。在这样一种非实在论说明上，作为信任的信仰模型把信仰的认知成分加上括号搁置，从而冒着实际上变成“信仰纯粹是某种情感状态”的模型的风险。但无论如何，非实在论模型将被那些认为信仰具有一种认知成分的人拒绝——该成分的功能在于把握——或试图把握——事物实际如何。
