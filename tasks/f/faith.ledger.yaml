      What kind of cognitive component belongs to faith, then? One possibility is that it is a kind of *knowledge*, but there is then a question about the kind of knowledge that it is: e.g., is it knowledge ‘by acquaintance’, or ‘propositional’ knowledge ‘by description’, or both? One type of model of faith as knowledge identifies faith as propositional knowledge of specific truths, revealed by God. A model of this type has received prominent recent defence in the work of Alvin Plantinga, who proposes an account which he regards as following in the tradition of the reformers, principally John Calvin (see Plantinga 2000, 168–86)[^plantinga-2000]. Calvin defines faith thus: ‘a firm and certain knowledge of God’s benevolence towards us, founded upon the truth of the freely given promise in Christ, both revealed to our minds and sealed upon our hearts through the Holy Spirit’ (John Calvin, *Institutes* III, ii, 7, 551, quoted by Plantinga (2000, 244)).
    step1: |-
      那么，何种认知成分属于信仰？一种可能是：它是一种*知识*，但随之而来的问题是这是何种知识：例如，是“亲知”的知识，还是“通过描述”的“命题性”知识，抑或两者皆是？把信仰当作知识的一类模型把信仰等同于关于特定真理的命题性知识，这些真理由上帝启示。这类模型近来在普兰丁格（Plantinga）的著作中得到突出辩护，他提出的说明自认为承续宗教改革家的传统，主要是约翰·加尔文（John Calvin）（见 Plantinga 2000, 168–86）[^plantinga-2000]。加尔文如此定义信仰：“对上帝之仁慈待我们的坚定而确定的知识，建基于在基督里白白赐予的应许之真理，既向我们的心智启示，又由圣灵印在我们心上”（John Calvin, *Institutes* III, ii, 7, 551，转引自 Plantinga (2000, 244)）。
    step2: |-
      那么，何种认知成分属于信仰？一种可能是：它是一种 **知识**。但随之而来的问题是：这是哪一种知识——是“亲知”（by acquaintance）之知，还是“凭描述”的“命题性”之知，抑或两者兼是？将信仰视作知识的一类模型，把信仰等同于关于若干特定真理的命题性知识，而这些真理由上帝启示。这一类型近来在阿尔文·普兰丁格（Alvin Plantinga）的著作中得到显要辩护；他自认其说明承续宗教改革家的传统，主要是约翰·加尔文（John Calvin）（见 Plantinga 2000, 168–86）[^plantinga-2000]。加尔文如此定义信仰：“对上帝以仁慈待我们的坚定而确定之知识，它建基于基督里白白赐予的应许之真理，既向我们的心智显明，又由圣灵钤印于我们的心”（John Calvin, *Institutes* III, ii, 7, 551；转引自 Plantinga (2000, 244)）。
