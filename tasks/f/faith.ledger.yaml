      ## 9. Faith and hope
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      Some philosophers have suggested that the epistemological challenges faced by accounts of faith as involving belief beyond the evidence may be avoided by construing theist commitment as hope. Theist hope seems not to be mere tenacity (‘clinging to one’s hopes’) (Taylor 1961)[^taylor-1961], but a more complex attitude. James Muyskens suggests, for example, that one who hopes ‘keep[s] his life open or fluid with respect to [a faith-proposition] *p*—where (a) neither *p* nor not-*p* is certain for him, (b) he wants *p* and (c) he sees *p* as constructively connected with his own well-being and/or concept of himself as a person’ (1979, 35). Muyskens contrasts hope with faith (understood as belief), arguing that a religion of hope is both epistemically and religiously superior to a religion of faith. But faith is not generally understood as competing with hope (Creel 1993)[^creel-1993], and some philosophers *identify* faith with hoping that the claims of faith are true (Pojman 1986; 2003)[^pojman-1986]. Hope as such is an attitude rather than an active commitment, and, as Audi observes, it contrasts with the attitude of faith at least in this respect, namely, that surprise makes little sense as a response to discovering that the object of one’s faith is indeed the case, whereas there need be nothing inappropriate in surprise at the fulfilment of one’s hopes (see Audi 2011, 74)[^audi-2011].
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      A more adequate model of faith as hope, then, may rather take faith to be *acting* in, or from, hope. Such a model then comes close to a non-doxastic venture model of faith, differing only in so far as acting from hope that God exists differs from taking this claim to be true (albeit without belief) in one’s practical reasoning, but this difference may be undetectable at the level of behavioral outcomes (see McKaughan 2013)[^mckaughan-2013]. A model of faith as acting in hope shares with the doxastic and non-doxastic venture models in rejecting the view that faith requires cognitive certainty. But one can act in hope with firmness and resilience, given a strong affective/evaluative stance, even if one lacks belief that one’s hopes will be fulfilled. Hoping that *p*, however, does not involve taking a stand on its being true that *p*, which is widely thought to be essential to faith.
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      The ‘venture’ models of faith (with or without belief) and the model of faith as a venture in hope all fit the view that faith is consistent with doubt, and, indeed, impossible without doubt of some kind, though they allow that persons who have faith may give firm and sustained commitment to the truth of faith-propositions in practice (for discussion of different kinds of doubt and their compatibility or incompatibility with faith and belief see Howard-Snyder 2013b, 359)[^howard-snyder-2013b]. The ‘certainty’ of faith on these models is more a matter of the certainty that persons of faith find themselves *conferring* on the foundational claims of their faith, rather than a matter of discovering in themselves a certain knowledge or intellectual conviction of the truth of these claims. It is possible, then, on these accounts of faith, to be a committed person of faith and also an ‘agnostic’ in Thomas Huxley’s original sense of someone who does not claim as knowledge the commitments he or she nevertheless makes as a foundational practical orientation to reality. (For discussion of the compatibility of Muslim faith and doubt, see Aijaz 2023.)[^aijaz-2023]
