      It may be argued, however, that, if the Reformed epistemologist’s model is correct, those who seek to meet an evidentialist requirement will be unable to satisfy themselves of their entitlement to their faith. Theistic truths may be directly revealed, and experienced as immediately evident, yet, on reflection, one may doubt whether such experiences are genuinely revelatory since competing ‘naturalist’ interpretations of those experiences seem available. Furthermore, there are rival sources yielding contrary claims that equally claim to be authentically revelatory. It may be true, as Plantinga’s Reformed epistemology maintains, that *if* God exists then certain basic theist beliefs meet externalist criteria for knowledge, even though the truth of the propositions concerned remains open to reflective ‘internalist’ doubt. On an externalist account, that is, one might lack independent evidence sufficient to confirm that one has knowledge that God exists *while in fact possessing that very knowledge*. One may thus refute an objector who claims that without adequate evidence one cannot possess knowledge. But this consideration is still insufficient to secure entitlement to theistic faith—if, as may be argued, that entitlement requires that *one has evidence* adequate to justify commitment to the truth that God exists. For, one has such evidence *only conditionally on God’s existence*—but it is precisely entitlement to believe that God exists that is at issue (Kenny 1992, 71; Bishop and Aijaz 2004)[^bishop-2004][^kenny-1992]. For a wider discussion of the possibility of religious knowledge that, *inter alia*, endorses the present point, see Zagzebski 2010.
    step1: |-
      然而，或可论证：如果改革宗认识论者的模型正确，那么那些试图满足证据主义要求的人将无法让自己确信其信仰的权利。有神论真理可以被直接启示、被经验为直接显明，但一经反思，一个人可能怀疑这些经验是否真正是启示性的，因为对这些经验似乎存在可用的竞争性“自然主义”诠释。此外，还有产生相反主张的其他来源，它们同样宣称自己是真正启示性的。正如普兰丁格的改革宗认识论所主张的，*如果*上帝存在，某些基本的有神论信念便满足知识的外在主义判准——即便相关命题的真理仍对反思性的“内在主义”怀疑开放。就是说，在外在主义说明下，一个人可能缺乏足以确认自己拥有“上帝存在”之知的独立证据，*而事实上拥有这一知识*。一个人由此可以驳倒这样的反对者：他主张没有充分证据就不可能拥有知识。但这一考虑仍不足以确保有神论信仰的权利——如果（如可论证的）该权利要求*一个人拥有*足以正当化对“上帝存在”之真的委身的证据。因为，一个人拥有这样的证据只是*以上帝的存在为条件的*——而恰恰是对“上帝存在”的信念之权利是争论所在（Kenny 1992, 71; Bishop and Aijaz 2004）[^bishop-2004][^kenny-1992]。关于宗教知识之可能性——*其中*亦认可当前这一论点——的更宽泛讨论，见 Zagzebski 2010。
    step2: |-
      然而，或可论证：倘若改革宗认识论者的模型正确，那些力求满足证据主义要求的人，将无法让自己确信其信仰的权利。有神论真理可以被直接启示、被经验为直接显明；可是一经反思，人便可怀疑这类经验是否真为启示——因为对它们似乎总有可用的竞争性“自然主义”诠释。况且，另有竞争性的来源产出相反主张，同样自称真正启示。正如普兰丁格的改革宗认识论所力主：*如果*上帝存在，某些基本的有神论信念便满足知识的外在主义判准——即便相关命题的真理仍对反思性的“内在主义”怀疑敞开。也就是说，在外在主义说明下，一个人可能缺乏足以确认自己拥有“上帝存在”之知的独立证据，*而事实上正拥有这一知识*。据此，人可以驳倒那位主张“没有充分证据便不可能拥有知识”的反对者。但这一考虑仍不足以确保有神论信仰的权利——倘若（如可论证的）该权利要求*一个人拥有*足以正当化其对“上帝存在”这一真理之委身的证据。因为，这样的人拥有此类证据，只是*有条件地以上帝的存在为前提*——而恰是“相信上帝存在”的权利本身尚在争论之中（Kenny 1992, 71; Bishop and Aijaz 2004）[^bishop-2004][^kenny-1992]。至于宗教知识之可能性的更宽泛讨论——*其中*亦认可本文此点——见 Zagzebski 2010。
