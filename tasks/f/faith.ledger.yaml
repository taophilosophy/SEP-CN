      The reasonableness of belief that God exists is a focal issue in the Philosophy of Religion. Theist traditions typically, or some would say essentially, make a foundational claim about an authoritative source, or sources, of revealed truth. What is salient includes belief or some related sort of affirmation, not just that God exists but associated content such as that *this* God exists, the God who is revealed thus and so (in great historical acts, in prophets, in scriptures, in wisdom handed down, etc.). The reasonableness of theism is therefore as much a matter of the reasonableness of an epistemology of revelation as it is of a metaphysics of perfect being. The question of how God may be expected to make himself known has gained prominence through recent discussion of the argument for atheism from ‘divine hiddenness’ (Schellenberg 1993; Howard-Snyder and Moser 2002)[^howard-snyder-2002][^schellenberg-1993]. That argument holds that a loving God would make his existence clear to the non-resistant—but this claim is open to question. Perhaps God provides only ‘secret’ evidence of his existence, purposely overturning the expectations of our ‘cognitive idolatry’ in order to transform our egocentric self-reliance (Moser 2008)[^moser-2008]; besides, there may be significant constraints logically inherent in the very possibility of unambiguous divine revelation to finite minds (King 2008)[^king-2008].
    step1: |-
      相信上帝存在的合理性是宗教哲学的一个焦点议题。有神论传统通常——或如有些人会说，本质地——对启示真理的一个或多个权威之源作出奠基性主张。显著的内容包括这样一种信念或某种相关的肯定：不仅上帝存在，而且有与之相联的内容，如*这位*上帝存在——那在如此这般之处（重大历史行动中、先知中、圣经中、所传智慧中等等）得到启示的上帝。因此，有神论的合理性，既是关于圆满存在者的形而上学问题，也是启示认识论的合理性问题。上帝可望如何使人认识他自己，这一问题经由近来关于“神圣隐匿”无神论论证的讨论而获得突出地位（Schellenberg 1993; Howard-Snyder and Moser 2002）[^howard-snyder-2002][^schellenberg-1993]。该论证主张，一个有爱的上帝会向不抗拒者显明其存在——但这一主张可以质疑。也许上帝只提供其存在的“隐秘”证据，蓄意推翻我们“认知上的偶像崇拜”的预期，以转化我们自我中心的自我倚赖（Moser 2008）[^moser-2008]；况且，对有限心灵而言，无歧义的神圣启示这一可能性本身在逻辑上可能固有重大约束（King 2008）[^king-2008]。
