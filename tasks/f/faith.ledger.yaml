      An atheist’s faith-venture may, in any case, seem oddly so described on the grounds that it provides no basis for practical hope or trust. Providing such a basis may plausibly be thought necessary for faith—the truth to which the venturer commits must be existentially important in this way. (Note James’s requirement that faith-commitment is permissible only for resolving a ‘genuine option’, where a genuine option has *inter alia* to be ‘momentous’, that is, existentially significant and pressing (James 1896 [1956, 3–4])[^james-1896].) Truth-claims accepted by faith of the religious kind seem essentially to be ‘saving’ truths—solutions to deep problems about the human situation. And there may thus be arguments as to which religious tradition offers the best solutions to human problems (see, for example, Yandell 1990, 1999)[^yandell-1990]. J. L. Schellenberg (2009) argues that the only kind of religious faith that could be justified (if any is) is a sceptical ‘ultimism’, in which one ‘assents’ to and treats as real an imaginatively grasped conception of a metaphysically, axiologically and soteriologically ultimate reality.
    step1: TBD
    step2: TBD
