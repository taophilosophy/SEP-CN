      缓解这一压力的一条途径，是对神学主张提供一种*非实在论*的分析。于是信任上帝将不蕴含任何对*实在*以特定方式存在的承诺。毋宁说，在可以说最精致的一类非实在论观点上，神学信念的产生是因为“以信任的方式生活”逐渐通过一种关于上帝及其伟大拯救行动的文化建构虚构得到表达和强化。这种生存论的信心于是可以用那虚构的语言描述为“信任上帝”（Cupitt 1980, Geering 1994）[^cupitt-1980][^geering-1994]。在这样一种非实在论说明上，作为信任的信仰模型把信仰的认知成分加上括号搁置，从而冒着实际上变成“信仰纯粹是某种情感状态”的模型的风险。但无论如何，非实在论模型将被那些认为信仰具有一种认知成分的人拒绝——该成分的功能在于把握——或试图把握——事物实际如何。
    step2: |-
      缓解这一压力的一条途径，是对神学主张提供*非实在论*的分析。如此一来，信任上帝便不蕴含任何对*实在*以特定方式存在的承诺。毋宁说，在可称最精致的一类非实在论观点上，神学信念之生起，是因为“以信任的姿态生活”渐渐经由一种关于上帝及其伟大拯救行动的文化建构虚构而得到表达与强化。这份生存论的信心，于是可以借那虚构的语言被描述为“信任上帝”（Cupitt 1980, Geering 1994）[^cupitt-1980][^geering-1994]。在这样一种非实在论说明下，作为信任的信仰模型把信仰的认知成分加括搁置，从而冒着实则沦为“信仰纯粹是某种情感状态”之模型的风险。但无论如何，非实在论模型必为如下这些人所拒：他们认为信仰具有一种认知成分，其功能在于把握——或试图把握——事物实际之所是。
