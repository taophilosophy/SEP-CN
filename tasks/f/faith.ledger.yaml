      Doxastic venture in relation to faith-propositions can be justifiable, of course, only if there are legitimate exceptions to the evidentialist requirement to take a proposition to be true just to the extent of its evidential support—and only if the legitimate exceptions include the kind of case involved in religious, theistic, faith-commitment.
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      A possible view of theistic faith-commitment is that it is wholly independent of the epistemic concern that cares about evidential support. On this view, faith reveals its authenticity most clearly when it takes faith-propositions to be true *contrary to* the weight of the evidence. This view is widely described as ‘fideist’, but ought more fairly to be called *arational* fideism, or, where commitment contrary to the evidence is positively favoured, *irrational* or *counter-rational* fideism. Despite its popular attribution both to the church father Tertullian and to ‘the father of existentialism’, Kierkegaard, counter-rational fideism does not seem to have been espoused by any significant theist philosophers (passages in Tertullian and Kierkegaard that appear to endorse this position may be interpreted as emphasizing that Christian faith requires accepting, not logical contradiction, but ‘contradiction’ of our ‘natural’ expectations, wholly overturned in the revelation that the power of divine love is triumphant in the Crucified One).
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      Serious philosophical defence of a doxastic venture model of faith thus implies a moderate version of fideism, for which epistemic concern is not overridden and for which, therefore, it is a constraint on faith-commitment that it *not* accept what is known, or justifiably believed on the evidence, to be false. Rather, faith commits itself only *beyond*, and not against, the evidence—and it does so *out of* epistemic concern to grasp truth on matters of vital existential importance. The thought that one may be entitled to commit to an existentially momentous truth-claim in principle undecidable on the evidence when forced to decide either to do so or not is what motivates William James’s ‘justification of faith’ in ‘The Will to Believe’ (James 1896 [1956])[^james-1896]. If such faith is to be justified, its cognitive content will (on realist assumptions) have to cohere with our best evidence-based theories about the real world. Faith may extend our scientific grasp of the real, but may not counter it. Whether the desire to grasp more truth about the real than science can supply is a noble aspiration or a dangerous delusion is at the heart of the debate about entitlement to faith on this moderate fideist doxastic venture model.
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      A discussion of the debate between the moderate, Jamesian, fideist and the evidentialist is beyond this entry’s scope. Still, it is worth remarking that those who think that faith understood as doxastic venture may be justified as reasonable face the challenge of providing the tools for weeding out intuitively unreasonable forms of faith. On the other side, those evidentialists who reject doxastic venture as always impermissible have to consider whether taking a stance on the nature of reality beyond anything science can even in principle confirm may not, in the end, be unavoidable, and potentially implicated in the commitments required for science itself (see Bishop 2007a, Chapters 8 and 9; Bishop 2023)[^bishop-2007a][^bishop-2023][^bishop-2023-2]. For a useful recent collection of articles on the wider theme of the relation of religious faith to intellectual virtue, see Callahan and O’Connor 2014.
