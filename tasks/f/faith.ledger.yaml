      One component of faith is a certain kind of affective psychological state—namely, having a feeling of assurance or trust. Some philosophers hold that faith is to be identified simply with such a state: see, for example, Clegg (1979, 229) who suggests that this may have been Wittgenstein’s understanding. Faith in this sense—as one’s overall ‘default’ affective attitude on life—provides a valuable foundation for flourishing: its loss is recognised as the psychic calamity of ‘losing one’s faith’. But if foundational existential assurance is to feature in a model of faith of the kind exemplified by theists, more needs to be added about the kind of assurance involved. The assurance of theistic faith is essentially a kind of confidence: it is essentially faith *in God.* In general, faith of the kind exemplified by theistic faith must have some *intentional object*. It may thus be argued that an adequate model of this kind of faith cannot reduce to something *purely* affective: some broadly *cognitive* component is also required. (For an account that takes faith to be fundamentally affective, while allowing that it might also involve cognitive aspects, see Kvanvig 2013.)[^kvanvig-2013]
    step1: |-
      信仰的一个成分是某种情感性心理状态——即怀有安稳或信任之感。有些哲学家认为信仰就应当直接等同于这样一种状态：例如 Clegg (1979, 229)，他提示这或许就是维特根斯坦的理解。此意义上的信仰——作为一个人对生活的总体“默认”情感态度——为兴盛提供宝贵的基础：其丧失被承认为“失去信仰”这一心灵灾难。但是，如果根基性的生存安稳要在有神论者所例示的那类信仰模型中占有一席之地，那么对所涉安稳的种类还需多说几句。有神论信仰的安稳本质上是一种信心：它本质上是对*上帝*的信仰。一般而言，有神论信仰所例示的那类信仰必须有某个*意向对象*。因此或可论证：这一类信仰的充分模型不能还原为*纯然*情感性的东西；还需要某个宽泛的*认知*成分。（关于把信仰当作根本上是情感性的、同时容许它可能也涉及认知面向的说明，见 Kvanvig 2013。）[^kvanvig-2013]
