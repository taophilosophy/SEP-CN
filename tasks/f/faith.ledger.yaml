      Furthermore, in taking faith to consist in non-basic belief that theological propositions are true, this model invites the assumption that theological convictions belong in the same category of factual claims as scientific theoretical hypotheses with which they accordingly compete. That assumption will lead those who think that theological claims are *not* reasonably accepted on the evidence to regard faith as worthless and intellectually dishonourable—at best, ‘a degenerating research programme’ (Lakatos 1970)[^lakatos-1970]. (On this negative assessment of faith’s evidential support, persons of faith come perilously close to the schoolboy’s definition mentioned by William James: ‘Faith is when you believe something that you know ain’t true’ (James 1896 [1956, 29])[^james-1896]. Or, if persons who have theistic faith readily abandon theological explanations whenever competing scientific ones succeed, their God gets reduced to ‘the God of the gaps’.) These misgivings about the model of faith as firmly held factual theological belief dissolve, of course, if success attends the project of showing that particular theological claims count as factual hypotheses well supported by the total available evidence. Those who doubt that this condition is or can be met may, however, look towards a model of faith that understands faith’s cognitive content as playing some other role than that of an explanatory hypothesis of the same kind as a scientific explanatory hypothesis.
    step1: |-
      此外，把信仰当作对神学命题为真的非基本信念，这一模型引人假定：神学信念与科学理论假说同属事实主张一类，并因此与之竞争。这一假定将使那些认为神学主张*不*能合理地依证据接受的人把信仰看作毫无价值且在理智上可耻——往好里说，“一个退化的研究纲领”（Lakatos 1970）[^lakatos-1970]。（在对信仰的证据支持的这一否定性评估下，有信仰的人危险地接近威廉·詹姆斯提到的一个小学生的定义：“信仰就是相信某种你知道并不为真的东西”（James 1896 [1956, 29]）[^james-1896]。或者，如果怀有有神论信仰的人在竞争性科学解释成功时随时放弃神学解释，他们的上帝就被还原为“缝隙中的上帝”。）当然，如果“特定神学主张算作得到全部可得证据良好支持的事实假说”这一事业获得成功，这些对坚定持有的事实性神学信念模型的疑虑便告消解。然而，怀疑这一条件能够满足的人可以转向另一种信仰模型——把信仰的认知内容理解为扮演某种别的角色，而非充当与科学解释假说同类的一个解释假说。
    step2: |-
      此外，把信仰当作“神学命题为真”的非基本信念，这一模型引人假定：神学信念与科学理论假说同属事实主张一类，并因此与之竞争。此假定将令那些认为神学主张*不*能合理地依证据接受的人，把信仰视作毫无价值且在理智上可耻——往好里说，也不过是“一个退化的研究纲领”（Lakatos 1970）[^lakatos-1970]。（依这一对信仰之证据支持的否定性评估，有信仰者便危险地逼近威廉·詹姆斯提到的那则小学生定义：“信仰，就是相信某种你明知不真的东西”（James 1896 [1956, 29]）[^james-1896]。或者，倘若怀有有神论信仰者一遇竞争性科学解释成功便随时弃置神学解释，他们的上帝便被还原为“缝隙中的上帝”。）当然，倘若“把特定神学主张确证为得到全部可得证据良好支持的事实假说”这一事业取得成功，上述疑虑便随之消解。而怀疑此条件能够满足者，则可转向另一种信仰模型——把信仰的认知内容理解为扮演别样的角色，而非充当与科学解释假说同类的一个解释假说。
