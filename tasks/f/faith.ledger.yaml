      The Reformed epistemologist model of faith as ‘basic’ knowledge (outlined in Section 3) generates an epistemology under which, although ordinary cognitive faculties and sources of evidence do not yield firm and certain inferred knowledge of theistic truths, there is (if Christian theism is true) a ‘higher’ cognitive faculty that neatly makes up the deficit. This model seems thus to secure the rationality of faith: if faith consists in beliefs that have the status of knowledge, faith can hardly fail to be rational. And, once the deliverances of the special cognitive faculty are included amongst the believer’s basic experiential evidence, an evidential requirement on reasonable belief seems to be met. (Note that Plantinga originally expressed his defence of ‘properly basic’ theistic belief in terms of the rationality of believing in God ‘without any evidence or argument at all’ (Plantinga 1983, 17)[^plantinga-1983]. He does respect an evidential requirement, however, holding that it may be fully met through what is basically, non-inferentially, evident in the believer’s experience. Hence Plantinga’s insistence that his Reformed epistemology is not fideistic (Plantinga 2000, 263)[^plantinga-2000].)
    step1: |-
      改革宗认识论者“基本知识”的信仰模型（第 3 节所述）产生出这样一种认识论：虽然普通认知官能与证据来源不能给出关于有神论真理的坚定而确定的推出知识，但（如果基督教有神论为真）存在一种“更高”认知官能，恰好补足这一缺口。这一模型似乎由此确保了信仰的合理性：如果信仰在于具有知识地位的信念，信仰就很难不理性。而且，一旦特殊认知官能的报告被纳入信仰者的基本经验证据之中，合理信念的证据要求似乎便得到满足。（注意，普兰丁格最初表述他对“恰当基本的”有神论信念的辩护时，用的是“完全没有任何证据或论证”地相信上帝的合理性（Plantinga 1983, 17）[^plantinga-1983]。不过他确实尊重证据要求，主张这一要求可以通过信仰者经验中基本的、非推出地显明的东西得到充分满足。故普兰丁格坚持其改革宗认识论不是信仰主义（Plantinga 2000, 263）[^plantinga-2000]。）
    step2: |-
      改革宗认识论者“基本知识”的信仰模型（第 3 节已述）衍生出这样一幅认识论图景：普通认知官能与证据来源固然给不出关于有神论真理的坚定而确定的推出知识，但（若基督教有神论为真）有一道“更高”认知官能恰好补足缺口。这一模型似乎由此确保了信仰的合理性：信仰若在于具有知识地位的信念，便很难不理性。再者，一旦特殊认知官能之所告被纳入信仰者的基本经验证据，合理信念的证据要求便似乎得到满足。（须注意，普兰丁格最初表述其“恰当基本的”有神论信念辩护时，用的是“全然没有任何证据或论证”而相信上帝这一合理性说法（Plantinga 1983, 17）[^plantinga-1983]。不过他的确尊重证据要求，主张它可以通过信仰者经验中基本的、非推出地显明者获得充分满足。故普兰丁格坚称其改革宗认识论并非信仰主义（Plantinga 2000, 263）[^plantinga-2000]。）
