      An atheist’s faith-venture may, in any case, seem oddly so described on the grounds that it provides no basis for practical hope or trust. Providing such a basis may plausibly be thought necessary for faith—the truth to which the venturer commits must be existentially important in this way. (Note James’s requirement that faith-commitment is permissible only for resolving a ‘genuine option’, where a genuine option has *inter alia* to be ‘momentous’, that is, existentially significant and pressing (James 1896 [1956, 3–4])[^james-1896].) Truth-claims accepted by faith of the religious kind seem essentially to be ‘saving’ truths—solutions to deep problems about the human situation. And there may thus be arguments as to which religious tradition offers the best solutions to human problems (see, for example, Yandell 1990, 1999)[^yandell-1990]. J. L. Schellenberg (2009) argues that the only kind of religious faith that could be justified (if any is) is a sceptical ‘ultimism’, in which one ‘assents’ to and treats as real an imaginatively grasped conception of a metaphysically, axiologically and soteriologically ultimate reality.
    step1: |-
      无神论者的信仰冒险在任何情况下都可能显得如此描述颇为奇怪，理由是它不为实践希望或信任提供基础。提供这样一种基础可以被合理地认为是信仰所必需的——冒险者所委身的真理必须在这种方式上生存攸关。（注意詹姆斯的要求：信仰承诺只在解决一个“真正选项”时才是可允许的，而一个真正选项*其中*必须“重大”，即生存上重要而紧迫（James 1896 [1956, 3–4]）[^james-1896]。）宗教类信仰所接受的真理主张本质上似乎是“拯救性”的真理——关于人类处境的深刻问题的解答。因此可能有关于哪个宗教传统为人类问题提供最佳解答的论证（例如见 Yandell 1990, 1999）[^yandell-1990]。J. L. 谢伦伯格（2009）论证：唯一能够得到辩护（如果有任何一种能）的宗教信仰是怀疑论的“终极主义”，在其中一个人“信从”并当作实在地对待一个在形而上学、价值论与救赎论上终极的实在的、由想象力把握的构想。
    step2: |-
      无论如何，无神论者的“信仰冒险”这一说法本身或许就显得奇怪：它不为实践希望或信任提供任何根基。而提供这样一种根基，可以被合理地视为信仰之所必需——冒险者所委身的真理，必须在这一意义上生存攸关。（注意詹姆斯的要求：信仰承诺唯在解决一个“真正选项”时方可允许；而所谓真正选项，**其中** 一项要素是“重大”——即生存上重要而紧迫（James 1896 [1956, 3–4]）[^james-1896]。）宗教类信仰所接受的真理主张，本质上似乎是“拯救性”的真理——对人类处境之深刻问题的解答。由此，或可就“哪个宗教传统为人类问题提供了最佳解答”展开论证（例如见 Yandell 1990, 1999）[^yandell-1990][^yandell-1999]。J. L. 谢伦贝格（2009）则论证：唯一可能得到辩护（如果真有能得辩护者）的宗教信仰，是一种怀疑论的“终极主义”（ultimism）。在此之中，人对一个由想象力所把握的构想“信从”并待之为实在；那构想关乎一个在形而上学、价值论与救赎论上皆为终极的实在。
  - id: 100
    kind: body
    source: |-
      Some may nevertheless argue that an existentially vital faith that grounds hope can belong within a wholly secular context—that is, without counting in any recognisable sense as ‘religious’. Cantwell Smith claims, for example, that ‘the Graeco-Roman heritage … and its fecundating role in Western life [can] be seen as one of the major spiritual traditions of our world’ (1979, 139). Annette Baier suggests that ‘the secular equivalent of faith in God, which we need in morality as well as in science or knowledge acquisition, is faith in the human community and its evolving procedures – in the prospects for many-handed cognitive ambitions and moral hopes’ (Baier 1980, 133)[^baier-1980]. More broadly, some maintain that a meaningful spirituality is consistent with a non-religious atheist naturalism, and include something akin to faith as essential to spirituality. For example, Robert Solomon takes spirituality to mean ‘the grand and thoughtful passions of life’, and holds that ‘a life lived in accordance with those passions’ entails choosing to see the world as ‘benign and life [as] meaningful’, with the tragic not to be denied but accepted (Solomon 2002, 6 & 51)[^solomon-2002]. (For further discussion of faith in secular contexts, see Preston-Roedder 2018, Tsai 2017, and Ichikawa 2020; for special journal issues addressing a variety of issues in the philosophy of faith in both religious and secular contexts, see Rice et al. 2017; Malcolm 2023; McKaughan and Howard-Snyder 2023b.)
    step1: |-
      尽管如此，有人或许会论证：一种为希望提供根基、在生存上至关要紧的信仰，可以属于一个完全世俗的语境——也就是说，不在任何可辨认的意义上算作“宗教的”。例如，坎特韦尔·史密斯主张：“希腊-罗马遗产……及其在西方生活中的孕育作用〔可以〕被看作我们世界的主要精神传统之一”（1979, 139）。安内特·拜尔提示：“对上帝之信仰的世俗对应物——我们在道德中以及在科学或知识获取中都需要它——是对人类共同体及其演化程序的信仰——对多手认知抱负与道德希望之前景的信仰”（Baier 1980, 133）[^baier-1980]。更宽泛地说，一些人主张：一种有意义的灵性与非宗教的无神论自然主义相容，并把某种类似信仰的东西包含为灵性的本质要素。例如，罗伯特·所罗门把灵性理解为“生活中宏大而深思的激情”，并主张“依照那些激情而度过的生活”蕴含着选择把世界看作“良善的、生命〔是〕有意义的”，悲剧不必否认而是接受（Solomon 2002, 6 & 51）[^solomon-2002]。（关于世俗语境中信仰的进一步讨论，见 Preston-Roedder 2018, Tsai 2017 与 Ichikawa 2020；关于在宗教与世俗语境中处理信仰哲学诸问题的专刊，见 Rice et al. 2017; Malcolm 2023; McKaughan and Howard-Snyder 2023b。）
    step2: |-
      尽管如此，或有人论证：一种为希望提供根基、在生存上至关紧要的信仰，可以栖身于完全世俗的语境——也就是说，不必在任何可辨认的意义上算作“宗教的”。例如，坎特韦尔·史密斯主张：“希腊-罗马遗产……及其在西方生活中的孕育之功〔可以〕被看作我们这个世界的主要精神传统之一”（1979, 139）。安妮特·拜尔提示：“对上帝之信仰的世俗对应物——我们在道德中、乃至在科学或求知中都需要它——是对人类共同体及其演化程序的信仰，是对众多之手共同成就认知抱负与道德希望之前景的信仰”（Baier 1980, 133）[^baier-1980]。更宽泛地说，一些人主张：有意义的灵性与非宗教的无神论自然主义相容，且把某种类似信仰的东西列为灵性的本质要素。例如，罗伯特·所罗门把灵性理解为“生活中宏大而深思的诸激情”，并主张“依照那些激情而度过的生活”蕴含着选择把世界看作“良善的、生命〔是〕有意义的”。悲剧无须否认，而须接纳（Solomon 2002, 6 & 51）[^solomon-2002]。（关于世俗语境中信仰的进一步讨论，见 Preston-Roedder 2018, Tsai 2017 与 Ichikawa 2020；关于兼涉宗教与世俗语境中信仰哲学诸问题的专刊，见 Rice et al. 2017; Malcolm 2023; McKaughan and Howard-Snyder 2023b。）
