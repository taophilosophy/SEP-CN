      Most importantly, however, Aquinas says that assent is given to the propositional articles of faith *because their truth is revealed by God*, and on the authority of the putative source of this revelation. Terence Penelhum puts it like this: ‘Thomas tells us that although what one assents to in faith includes many items not ostensibly about God himself, one assents to them, in faith, because they are revealed by God … It is because they come from him and because they lead to him that the will disposes the intellect to accept them’ (Penelhum 1989, 122: see *Summa Theologiae*, 2a2ae, 1, 1 & 2 (Aquinas [2006], 5–15)). So, Aquinas’s model of faith is of believing (assenting to) propositional truth-claims *on the basis of testimony carrying divine authority*. John Locke follows the same model: ‘Faith … is the assent to any proposition … upon the credit of the proposer, as coming from God, in some extraordinary way of communication’ (Locke 1698 [1924, 355]; compare also Alston 1996, 15)[^alston-1996][^locke-1698].
    step1: |-
      然而，最重要的是，阿奎那说，信从被给予信仰的命题条款，是*因为它们的真理由上帝启示*，并且凭这一推定启示之源的权威。特伦斯·佩内勒姆如此表述：“托马斯告诉我们，虽然一个人在信仰中信从的内容包含许多表面上看与上帝自身无关的条目，但他信从它们，凭的是信仰，因为它们是上帝启示的……正因为它们来自他并通向他，意志才安排理智接受它们”（Penelhum 1989, 122: see *Summa Theologiae*, 2a2ae, 1, 1 & 2 (Aquinas [2006], 5–15)）。因此，阿奎那的信仰模型是*凭承载神圣权威的证词*而相信（信从）命题性的真理主张。约翰·洛克沿用同一模型：“信仰……是对任何命题的信从……凭提议者的信用，即它以某种非凡的传达方式来自上帝”（Locke 1698 [1924, 355]；另比较 Alston 1996, 15）[^alston-1996][^locke-1698]。
    step2: |-
      然而最紧要的是：阿奎那说，信从之所以被给予信仰的命题条款，**是因为其真理由上帝启示**，且凭这推定启示之源的权威。特伦斯·佩内勒姆如此表述：“托马斯告诉我们：一个人在信仰中信从的内容，虽含许多表面上与上帝自身无干的条目，但他信从它们，凭的是信仰，因为它们由上帝启示……正因它们来自他、通向他，意志才安排理智予以接受”（Penelhum 1989, 122: see *Summa Theologiae*, 2a2ae, 1, 1 & 2 (Aquinas [2006], 5–15)）。故阿奎那的信仰模型是 **凭承载神圣权威的证词** 而相信（信从）命题性的真理主张。约翰·洛克沿用同一模型：“信仰……是对任一命题的信从……凭提议者的信用——它以某种非凡的传达方式来自上帝”（Locke 1698 [1924, 355]；另比较 Alston 1996, 15）[^alston-1996][^locke-1698]。
