      Models of faith as knowledge may be thought lacking because they admit no actional component in faith itself. Faith seems essentially to involve some kind of *active venture* in commitment and trust, even if talk of a ‘leap of faith’ may not be wholly apt. Many have held that faith ventures beyond what is *ordinarily* known or justifiably held true, in the sense that faith involves accepting what cannot be established as true through the proper exercise of our naturally endowed human cognitive faculties. As Kant famously reports, in the Preface to the Second Edition of his *Critique of Pure Reason*: ‘I have … found it necessary to deny *knowledge*, in order to make room for *faith*’ (Kant 1787 [1933, 29])[^kant-1787]. Theist philosophers do, however, typically defend the claim that faith is not ‘contrary to reason’. On models of faith that take a cognitive component as central, and construe faith’s object as propositional, reasonable faith therefore seems subject to a general *evidentialist* principle—‘a wise man ... proportions his belief to the evidence’, as Hume puts it (Hume 1748 [2007], “Of Miracles”, 80)[^hume-1748]. And W. K. Clifford elevates evidentialism to the status of an absolute moral requirement, affirming that ‘it is wrong always, everywhere, and for anyone to believe anything upon insufficient evidence’ (Clifford 1877 [1999, 77]. Faith’s venturesomeness may thus seem in tension with its reasonableness, and models of faith differ in the way they negotiate this tension in response to evidentialist challenges. Another way to classify models of faith, then, is in terms of their associated epistemology—and, in particular, whether and according to what norms of ‘evidential support’, they accept that faith’s cognitive component needs to meet a requirement to be grounded on available evidence.
    step1: |-
      把信仰视作知识的模型或许被认为有所欠缺，因为它们不容许信仰自身中有任何行动成分。信仰似乎本质上包含某种在委身与信任中的*主动冒险*，即便“信仰的跳跃”之说未必完全贴切。许多人主张，信仰越出*通常*所知或可正当地持以为真的东西——其意义是：信仰包含着对不能通过我们天赋人类认知官能之正当运用而确立为真的东西的接受。正如康德在《纯粹理性批判》第二版序言中的名言：“我……发现必须否定*知识*，才能给*信仰*留出地盘”（Kant 1787 [1933, 29]）[^kant-1787]。不过，有神论哲学家通常确实捍卫“信仰不违背理性”这一主张。在以认知成分为中心、把信仰对象理解为命题性的信仰模型上，合理的信仰因此似乎受一条一般的*证据主义*原则约束——如休谟所言，“一个明智的人……使他的信念与证据成比例”（Hume 1748 [2007], “Of Miracles”, 80）[^hume-1748]。而 W. K. 克利福德把证据主义抬升为绝对的道德要求，断言“在任何地方、对任何人、基于不充分的证据相信任何事情，都是错的”（Clifford 1877 [1999, 77]）。信仰的冒险性因此似乎与其合理性相抵触，而各信仰模型在回应证据主义挑战时调停这一张力的方式各不相同。于是，为信仰模型分类的另一种方式，是按其配套的认识论——尤其是，它们是否以及依据何种“证据支持”规范，接受信仰的认知成分需要满足“以可得证据为根据”的要求。
    step2: |-
      把信仰视作知识的模型或许会被认为有所欠缺：它们不容信仰自身含有行动成分。信仰似乎本质上总包含某种委身与信任中的*主动冒险*——哪怕“信仰的跳跃”一说未必尽然贴切。许多人主张：信仰越出*通常*所知或可正当地持以为真者——意思是，信仰包含着对“无法经我们天赋人类认知官能之正当运用而确立为真”之物的接受。正如康德在《纯粹理性批判》第二版序言中的名言：“我……发现必须否定*知识*，以便为*信仰*留出地盘”（Kant 1787 [1933, 29]）[^kant-1787]。然而，有神论哲学家照例要捍卫“信仰不悖于理性”的主张。凡以认知成分为中心、把信仰对象理解为命题性的模型，合理的信仰便似乎受一条一般*证据主义*原则辖制——休谟之言：“明智人……使其信念与证据成比例”（Hume 1748 [2007], “Of Miracles”, 80）[^hume-1748]。W. K. 克利福德更把证据主义抬升为绝对的道德律令，断言“任何时候、任何地方、任何人，基于不充分的证据相信任何事情，都是错的”（Clifford 1877 [1999, 77]）。于是信仰的冒险性似乎与其合理性相抵牾；各模型在回应证据主义挑战时斡旋这一张力的方式互不相同。如此，为信仰模型分类的另一途径，便是按其配套认识论来分——尤其看它们是否、又依何种“证据支持”规范，承认信仰的认知成分须满足“以可得证据为根据”的要求。
