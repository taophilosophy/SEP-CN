      *The special role of faith-propositions*
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      Bayesians might argue that there is no occasion for faith as doxastic venture since, once practical commitment to the truth of propositions is recognised as a matter of degree, whatever the state of the available evidence relating to a given proposition, there will always (given initial credences) be a rational credence properly associated with that evidence, and hence there are no possible circumstances where ‘the evidence does not decide’, so that an evidentialist requirement can indeed apply universally. Note, however, Lara Buchak’s (2012, 2018) discussion of ways in which Bayesians might understand faith as going beyond the evidence, and her own proposal that faith-ventures essentially include an *additional* practical commitment, which may be rational under certain conditions, not to inquire further into evidence relevant to the truth of the propositions concerned for the sole purpose of deciding what to do. (For critical discussion of this kind of restriction on inquiry in connection with faith commitments, see Dormandy 2018 and Howard-Snyder and McKaughan 2022a. Katherine Dormandy has recently proposed a positive defence of evidentialism in considering the question of what makes it good to form positive beliefs about those you have faith in, including God (Dormandy 2022).)
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      If the domain of faith is, as Stephen Evans puts it, ‘the assumptions, convictions and attitudes which the believer *brings to* the evidence for and against religious truth’ (Evans 1985, 178)[^evans-1985], and faith’s cognitive component offers a ‘total interpretation’ of the world of our experience (Hick 1966, 154)[^hick-1966], then (foundational) faith-propositions function as ‘highest-order framing principles’ which *necessarily* cannot have their truth settled by appeal to the force of a body of independent evidence (Bishop 2007a, 139–44)[^bishop-2007a]. Taking such a faith-proposition to be true, then, is not something that comes in degrees: either one ‘buys into’ the overall worldview (foundational) faith-propositions propose, or one does not. Such a choice is existentially important, and settling it raises anxiety about exercising a responsibility that cannot—without ‘bad faith’—be transferred onto the relatively impersonal function of one’s reason, since a venture beyond any inter-subjectively rational evidential confirmation is required. The doxastic venture model may thus be regarded as capturing the spiritual challenge of faith more satisfactorily than do models that conform to evidentialism. This is because, on the doxastic venture model, faith involves a deeper surrender of self-reliant control, not only in trusting God, but in accepting at the level of practical commitment that there is a God—indeed, *this* God—who is to be trusted.
