      The ‘venture’ models of faith (with or without belief) and the model of faith as a venture in hope all fit the view that faith is consistent with doubt, and, indeed, impossible without doubt of some kind, though they allow that persons who have faith may give firm and sustained commitment to the truth of faith-propositions in practice (for discussion of different kinds of doubt and their compatibility or incompatibility with faith and belief see Howard-Snyder 2013b, 359)[^howard-snyder-2013b]. The ‘certainty’ of faith on these models is more a matter of the certainty that persons of faith find themselves *conferring* on the foundational claims of their faith, rather than a matter of discovering in themselves a certain knowledge or intellectual conviction of the truth of these claims. It is possible, then, on these accounts of faith, to be a committed person of faith and also an ‘agnostic’ in Thomas Huxley’s original sense of someone who does not claim as knowledge the commitments he or she nevertheless makes as a foundational practical orientation to reality. (For discussion of the compatibility of Muslim faith and doubt, see Aijaz 2023.)[^aijaz-2023]
    step1: |-
      信仰的“冒险”模型（有信念或无信念）与作为希望中冒险的信仰模型，都契合“信仰与怀疑相容、实际上没有某种怀疑便不可能”的观点，尽管它们容许有信仰的人在实践中对信仰命题之真给出坚定而持续的承诺（关于不同种类的怀疑及其与信仰和信念的相容或不相容的讨论，见 Howard-Snyder 2013b, 359）[^howard-snyder-2013b]。在这些模型上，信仰的“确定性”更多是关于有信仰的人发现自己*赋予*其信仰的奠基性主张的确定性，而不是关于在他们自身中发现对这些主张之真的某种确定知识或理智信念。因此，按这些信仰说明，一个人可以是一个有承诺的信仰者，同时也是一个“不可知论者”——取托马斯·赫胥黎的原义：一个并不把自己仍然作出的、作为对实在的基础性实践取向的承诺宣称为知识的人。（关于穆斯林信仰与怀疑之相容性的讨论，见 Aijaz 2023。）[^aijaz-2023]
    step2: |-
      信仰的“冒险”模型（无论带不带信念）与“作为希望中之冒险”的信仰模型，都契合如下观点：信仰与怀疑相容——实际上，没有某种怀疑，信仰便不可能——尽管它们容许有信仰者在实践中对信仰命题之真给出坚定而持续的承诺（关于不同种类的怀疑及其与信仰、信念之相容与否的讨论，见 Howard-Snyder 2013b, 359）[^howard-snyder-2013b]。在这些模型上，信仰的“确定性”更多关乎有信仰者发现自己*授予*其信仰诸奠基性主张的确定性，而非关乎在其自身之内发现对这些主张之真的某种确定知识或理智信念。于是，按这些信仰说明，一个人可以既是一位有承诺的信仰者，又是一位“不可知论者”——取托马斯·赫胥黎的原义：一个人并不把自己依然作出的、作为对实在之基础性实践取向的承诺宣称为知识。（关于穆斯林信仰与怀疑之相容性，见 Aijaz 2023。）[^aijaz-2023]
