      On models that take faith of the theist kind to consist fundamentally in an act of trust, the analogy with interpersonal trust is suggestive. When one person trusts another there seems typically (though not uniformly) to be a doxastic aspect (the truster’s belief that the trustee is trustworthy). But what’s essential is the fiducial aspect, which consists in an active commitment or ‘entrusting’ to the other. Paul Helm proposes that theist faith similarly has importantly distinct doxastic and fiducial aspects: in addition to belief about God’s existence and trustworthiness for salvation held with a degree of strength proportional to the believer’s evidence, persons of faith must also entrust themselves to the one on whom they rely (Helm 2000)[^helm-2000]. While it is widely agreed that theist faith must have a cognitive aspect, some philosophers hold that this need not be doxastic (as we shall see in Section 8).
    step1: |-
      在把有神论类信仰的根本构成视为一种信任行动的模型上，与人际信任的类比是有启发性的。当一个人信任另一个人时，似乎典型地（尽管不一律）有一个信念性的面向（信任者关于受托者可靠的信念）。但本质性的是信任性的面向——它在于对另一方的主动承诺或“托付”。保罗·黑尔姆提出，有神论信仰同样有截然不同且重要的信念性面向与信任性面向：除了以与信仰者证据相称的强度持有关于上帝存在及其拯救可靠性的信念之外，有信仰的人还必须把自己托付给其所倚靠的那一位（Helm 2000）[^helm-2000]。尽管人们广泛同意有神论信仰必须有一个认知面向，一些哲学家却主张这一面向不必是信念性的（我们将见第 8 节）。
    step2: |-
      在把有神论类信仰的根本构成看作信任行动的模型上，类比人际信任颇有启发。一个人信任另一个人时，似乎典型地（虽不一律）带有一个信念性面向——信任者相信受托者可靠。但本质性的是信任性面向：它在于对另一方的主动承诺或“托付”。保罗·黑尔姆提出：有神论信仰同样具有判然有别且各自重要的信念性面向与信任性面向。除了以与自身证据相称的强度持有两项信念——上帝存在、上帝可靠以施拯救——有信仰者还须把自己托付给其所倚靠的那一位（Helm 2000）[^helm-2000]。尽管“有神论信仰必有一个认知面向”广获同意，一些哲学家却主张：这一面向不必是信念性的（下文第 8 节将见）。
