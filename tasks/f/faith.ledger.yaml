      If faith of the religious kind is to count as valuable and/or virtuous, it seems there must be a suitable degree of resilience in the commitment made (see Howard-Snyder and McKaughan 2022b for arguments that faith requires resilience; for discussion of the value and potential virtuousness or viciousness of resilient faith see McKaughan and Howard-Snyder 2023a; on the rationality of resilient faith see Buchak 2017, Jackson 2021, and McKaughan 2016)[^buchak-2017][^howard-snyder-2022b][^jackson-2021][^mckaughan-2016][^mckaughan-2022b][^mckaughan-2023a]. Persons of religious faith and faithfulness both put their faith in and are faith*ful* to the object of their commitment, though the salient kind of faithfulness may be a matter of the continual renewal of faith rather than of maintaining it unchanged (Pace and McKaughan 2020)[^pace-2020]. (See Audi 2014 for a discussion of faith and faithfulness in relation to virtue. Audi defends faithfulness as, like courage, an ‘adjunctive’ virtue, and argues that being ‘a person of faith’ counts as a ‘virtue of personality’.)[^audi-2014]
