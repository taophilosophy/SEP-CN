      Not all models of faith, however, identify it as primarily a matter of knowing or believing a proposition or a set of them, even with the addition of some affective or evaluative component. What is most central to theistic faith may seem better expressed as believing *in* God, rather than as believing *that* God exists. The Christian Nicene creed begins ‘Credo *in* unum Deum …’ and it is arguable that in this context ‘belief in’ is neither merely an idiomatic variant on, nor reducible to, ‘belief that’ (Price 1965)[^price-1965]. It may thus be held that theists’ acceptance of propositional truths as divinely revealed rests on believing *in* God—and it is this ‘believing in’, or ‘having faith in’, which is, fundamentally, the nature of faith. Noting that, while faith is held to be a virtue, believing as such is not, Wilfred Cantwell Smith argues that ‘faith is not belief’, ‘but something of a quite different order’ (Smith 1979, 128)[^smith-1979], requiring ‘assent’ ‘in the dynamic and personal sense of rallying to [what one takes to be the truth] with delight and engagement’ (142). Arguably, to put or to maintain faith *in* God involves a readiness to act, perhaps by relying on God in relevant ways and/or grounded in a practical commitment. Our considerations now shift, then, from propositional-attitude-focussed models of faith to those focussed on action, or what J. L. Schellenberg calls ‘operational’ models (2005, 126).
    step1: |-
      然而，并非所有信仰模型都把信仰主要视为认识或相信一个（或一组）命题——即便加上某个情感或评价成分。有神论信仰中最核心的东西，用“信*上帝*”（believing *in* God）来表达，似乎好于用“相信*上帝存在*”（believing *that* God exists）。基督教尼西亚信经以“Credo *in* unum Deum …”开始，而在此语境中，“belief in”（信）既不只是“belief that”（相信）的惯用语变体，也不能还原为后者，这一点是可以论证的（Price 1965）[^price-1965]。于是或可主张：有神论者对命题性真理之为神圣启示的接受，立足于信*上帝*——而这一“信”（believing in）或“对上帝有信仰”（having faith in）才根本上是信仰的本性。威尔弗雷德·坎特韦尔·史密斯注意到：信仰被尊为一种德性，而相信本身却不是；他主张“信仰不是信念”，“而是完全不同秩序的东西”（Smith 1979, 128）[^smith-1979]，它要求的“信从”是“以喜悦和投入欢聚于〔人所认定的真理〕的动态而个人的意义”上的信从（142）。可以说，对上帝*怀有*或保持信仰，包含一种行动的准备——或以相关方式倚靠上帝，和/或立足于一种实践承诺。于是我们的考察从聚焦命题态度的信仰模型转向聚焦行动的模型，即 J. L. 谢伦伯格所谓“运作的”（operational）模型（2005, 126）。
    step2: |-
      然而，并非所有信仰模型都把信仰主要看作认识或相信一个（或一组）命题——哪怕添上某个情感或评价成分。有神论信仰中最核心者，以“信*上帝*”（believing *in* God）来表述，似乎胜于以“相信*上帝存在*”（believing *that* God exists）来表述。基督教尼西亚信经开篇便是“Credo *in* unum Deum …”；而可论证的是：在此语境中，“belief in”（信）既非“belief that”（相信）的惯用语变体，亦不可还原为后者（Price 1965）[^price-1965]。于是或可主张：有神论者接受命题性真理为神圣启示，立足于信*上帝*——而这一“信”（believing in）或“对上帝怀有信仰”（having faith in），才是信仰的根本本性。威尔弗雷德·坎特韦尔·史密斯注意到：信仰被尊为德性，相信本身却不然；他主张“信仰不是信念”，“而是全然不同秩序的东西”（Smith 1979, 128）[^smith-1979]，其所要求的“信从”，是“以喜悦与投入欢聚于〔人所认定的真理〕的动态而个人意义上的信从”（142）。可以说，对上帝*怀有*或持守信仰，包含一种行动的准备——或以相关方式倚靠上帝，和/或扎根于一项实践承诺。于是，我们的考察自此从聚焦命题态度的信仰模型，转向聚焦行动的模型——即 J. L. 谢伦伯格所谓“运作的”（operational）模型（2005, 126）。
