      If faith is not ‘firm and certain’ basic knowledge of theistic truths, then a model of faith as having a propositional object may still be retained by identifying faith with *belief* of relevant content—and the question whether a faith-belief may have sufficient justification to count (if true) as (non-basic) knowledge may remain open. To have theist faith might thus be identified with holding a belief with theological content—that God exists, is benevolent towards us, has a plan of salvation, etc.—where this belief is also held with sufficient firmness and conviction. Richard Swinburne labels this the ‘Thomist view’ of faith, and expresses it thus: ‘The person of religious faith is the person who has the theoretical conviction that there is a God’ (Swinburne 2005, 138)[^swinburne-2005]. (Aquinas’s own understanding of faith is more complex than this formulation suggests, however, as will be noted shortly.)
    step1: |-
      如果信仰不是对有神论真理“坚定而确定”的基本知识，那么通过把信仰等同于相关内容的*信念*，以命题为对象的信仰模型仍可保留——而一个信仰信念是否可能有充分正当理由算作（非基本的）知识（若为真），这一问题也可以保持开放。拥有有神论信仰因此可以被等同于持有一个有神学内容的信念——上帝存在、仁慈待我们、有一个救赎计划等等——且这一信念也以充分的坚定与信服被持有。理查德·斯温伯恩称之为信仰的“托马斯主义观点”，并如此表述：“宗教信仰者就是持有‘存在一个上帝’这一理论性信念的人”（Swinburne 2005, 138）[^swinburne-2005]。（不过，阿奎那本人对信仰的理解比这一表述所暗示的更为复杂，下文将即予说明。）
    step2: |-
      倘若信仰不是对有神论真理“坚定而确定”的基本知识，那么把信仰等同于相关内容的 **信念**，以命题为对象的信仰模型仍可保留。至于“一桩信仰信念是否可能有充分正当理由、从而（若为真）算作（非基本的）知识”，此问也可以保持开放。于是，拥有有神论信仰便可等同于持有一个有神学内容的信念——上帝存在、对我们仁慈、有一救赎之计等等——且这一信念以充分的坚定与信服被持有。理查德·斯温伯恩称之为信仰的“托马斯主义观点”，并如此表述：“宗教信仰者，就是持有‘存在一个上帝’这一理论性信念的人”（Swinburne 2005, 138）[^swinburne-2005]。（不过，阿奎那本人对信仰的理解，较此一表述所暗示者更为复杂——下文即予说明。）
