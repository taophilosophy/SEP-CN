      ## 10. Faith as a virtue
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      Faith is traditionally regarded as one of the ‘theological’ virtues. If a virtue is a ‘disposition of character which instantiates or promotes responsiveness to one or more basic goods’, then theistic faith qualifies since it is ‘a responsiveness to practical hope and truth’, provided theistic faith-claims are indeed true (Chappell 1996, 27)[^chappell-1996]. Faith will not, however, be a virtue *as such*, if it is accepted that faith can be misplaced or, even, ‘demonic’, directed upon a ‘false ultimate’ (Tillich 1957 [2001, 21])[^tillich-1957]. To be virtuous, faith must be faith in a worthy object: it is faith *in God* that is the theological virtue. More generally, faith is virtuous only when it is faith to which one is entitled. An account of the conditions under which faith is permissible is thus the key to an ethics of faith.
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      On models of faith as a (special) kind of knowledge, or as firmly held belief, it may seem puzzling how faith could be a virtue—unless some implicit practical component emerges when such models are further explicated, or, alternatively, a case may be made for the claim that what is involuntary may nevertheless be praiseworthy, with theist faith as a case in point (Adams 1987)[^adams-1987]. (For discussion of how faith might be voluntary, even if faith entails belief, or indeed is a type of belief, and belief is not under our direct voluntary control, see Rettler 2018.)[^rettler-2018] Furthermore, as already suggested (Sections 4 & 5 above), models of faith as knowledge or belief fail to provide non-circular conditions sufficient for entitlement, unless the truth of faith-propositions is established by independent argument and evidence. If faith is understood as, or as essentially including, beliefs held on insufficient evidence, it is also hard to understand why Abrahamic religious traditions have valued it so highly, let alone why God might be thought to make salvation contingent on such belief (Kvanvig 2018, 106; McKaughan and Howard-Snyder 2021)[^howard-snyder-2021][^kvanvig-2018].
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      Fiducial models of faith seem more attuned to exhibiting faith as a virtue, though a defence of the trustworthiness of the one who is trusted for salvation may be required. Doxastic and non-doxastic venture models of faith can vindicate faith as a virtue, provided they provide robust entitlement conditions, to ensure that not just any ‘leap of faith’ is permissible. The Jamesian account already mentioned (Section 7) aims to meet this need. James’s own view of what suffices to justify a faith-venture arguably needs an ethical supplement: both the non-evidential motivation for the venture and its content must be morally acceptable (Bishop 2007a, 163–6)[^bishop-2007a].
