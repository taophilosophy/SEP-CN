      A more adequate model of faith as hope, then, may rather take faith to be *acting* in, or from, hope. Such a model then comes close to a non-doxastic venture model of faith, differing only in so far as acting from hope that God exists differs from taking this claim to be true (albeit without belief) in one’s practical reasoning, but this difference may be undetectable at the level of behavioral outcomes (see McKaughan 2013)[^mckaughan-2013]. A model of faith as acting in hope shares with the doxastic and non-doxastic venture models in rejecting the view that faith requires cognitive certainty. But one can act in hope with firmness and resilience, given a strong affective/evaluative stance, even if one lacks belief that one’s hopes will be fulfilled. Hoping that *p*, however, does not involve taking a stand on its being true that *p*, which is widely thought to be essential to faith.
