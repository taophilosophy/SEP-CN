      ‘Reformed’ epistemologists have appealed to an externalist epistemology in order to maintain that theistic belief may be justified even though its truth is no more than *basically* evident to the believer—that is, its truth is not rationally inferable from other, more basic, beliefs, but is found to be immediately evident in the believer’s experience (see Plantinga and Wolterstorff 1983, Alston 1991, Plantinga 2000)[^alston-1991][^plantinga-1983][^plantinga-2000]. On Plantinga’s version, (basic) theistic beliefs count as knowledge because they are produced by the operation of a special cognitive faculty whose functional design fits it for the purpose of generating true beliefs about God. Plantinga calls this the *sensus divinitatis*, using a term of Calvin’s. (For discussion of the extent to which Plantinga’s use of this term conforms to Calvin’s own usage see Jeffreys 1997 and Helm 1998.)[^helm-1998][^jeffreys-1997] This quasi-perceptual faculty meets functional criteria as a mechanism that, when functioning in the right conditions, confers ‘warrant’ (where warrant is whatever must be added to true belief to yield knowledge) and, granted theism’s truth, it probably yields ‘basic’ knowledge because God designs it just for that purpose. In defence of specifically Christian belief, Plantinga argues that the same warrant-conferring status belongs to the operation of the Holy Spirit in making the great truths of the Gospel directly known to the believer.
    step1: |-
      “改革宗”认识论者诉诸一种外在主义认识论，以主张有神论信念即便其真理对信仰者而言至多是*基本地*显明的，也可以得到辩护——也就是说，其真理不能从其他更基本的信念推出，而是在信仰者的经验中被发现为直接显明（见 Plantinga and Wolterstorff 1983, Alston 1991, Plantinga 2000）[^alston-1991][^plantinga-1983][^plantinga-2000]。在普兰丁格的版本中，（基本的）有神论信念算作知识，因为它们由一种特殊认知官能的运作产生，该官能的功能设计正适合产生关于上帝的真信念这一目的。普兰丁格称之为 *sensus divinitatis*（神圣感知），借用加尔文的术语。（关于普兰丁格对该词的用法在多大程度上符合加尔文本人的用法，见 Jeffreys 1997 and Helm 1998。）[^helm-1998][^jeffreys-1997] 这一准知觉官能作为一种机制满足功能性标准：当在正确条件下运作时，它授予“保证”（warrant）（保证指真信念要成为知识所必须添加的东西）；而且，鉴于有神论为真，它很可能产生“基本”知识，因为上帝设计它正是为此目的。为捍卫特定的基督教信仰，普兰丁格论证：圣灵在使信仰者直接认识福音诸大真理时，其运作同样具有授予保证的地位。
    step2: |-
      “改革宗”认识论者诉诸外在主义认识论，以主张：有神论信念即便其真理对信仰者来说至多是 **基本地** 显明，也可以得到辩护。也就是说，其真并不可从其他更基本的信念推出，而是在信仰者自身的经验中直接显明（见 Plantinga and Wolterstorff 1983, Alston 1991, Plantinga 2000）[^alston-1991][^plantinga-1983][^plantinga-2000]。按普兰丁格的版本，（基本的）有神论信念算得上知识，因为它们由一种特殊认知官能的运作产生，而这官能的功能设计恰合于“产生关于上帝的真信念”这一目的。普兰丁格借用加尔文的术语，称之为 *sensus divinitatis*（神圣感知）。（至于普兰丁格对该词的用法在多大程度上合于加尔文本人用法，见 Jeffreys 1997 与 Helm 1998。）[^helm-1998][^jeffreys-1997] 这道准知觉官能作为一种机制满足功能性判准：在适当条件下运作时，它授予“保证”（warrant，即真信念要升格为知识所必须增补的东西）；而既然有神论为真，它便多半会产出“基本”知识——上帝造它正是为此用途。为捍卫特定的基督教信仰，普兰丁格进一步论证：圣灵使信仰者直接认知福音诸大真理，其运作同样具有授予保证的地位。
