      A general—i.e., non-theologically specific—account of the religious kind of faith may have potential as a tool for criticising specific philosophical formulations of the content of religious faith. The conditions for permissible faith-venture may *exclude* faith in God under certain inadequate conceptions of who or what God is. Arguably, the ‘personal omniGod’ of much contemporary philosophy of religion is just such an inadequate conception (Bishop 2007b)[^bishop-2007b]. An understanding of what faith is, then, may motivate radical explorations into the concept of God as held in the theistic traditions (Bishop 1998; Johnston 2009; Bishop and Perszyk 2014, 2023)[^bishop-1998][^bishop-2014][^johnston-2009].
    step1: TBD
    step2: TBD
