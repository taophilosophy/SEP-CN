name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 语言自检：固定分析 actions / javascript-typescript / python；
  # 仓库出现 *.rs 时自动追加 rust（CodeQL Rust 已 GA，build-mode: none）。
  detect:
    name: Detect languages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build language matrix
        id: set
        shell: bash
        run: |
          matrix='{"include":[{"language":"actions"},{"language":"javascript-typescript"},{"language":"python"}]}'
          if git ls-files '*.rs' | grep -q .; then
            matrix='{"include":[{"language":"actions"},{"language":"javascript-typescript"},{"language":"python"},{"language":"rust"}]}'
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
