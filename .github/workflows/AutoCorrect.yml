name: 🔗 AutoCorrect 空格语法检查

on: 
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    name: AutoCorrect
    runs-on: ubuntu-latest
    
    steps:
        - name: Checkout from repository
          uses: actions/checkout@v7
        
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2

        - name: Install autocorrect（--no-save 不写入 package.json/bun.lock）
          run: bun install --no-save autocorrect-node

        - name: Run autocorrect lint
          run: bun run autocorrect --config .github/.autocorrectrc --lint --no-diff-bg-color **/*.md  || true

        - name: Run autocorrect fix
          run: bun run autocorrect --config .github/.autocorrectrc --fix **/*.md

        - name: Markdown add spaces
          uses: peter-evans/create-pull-request@v8
          with:
             commit-message: "Markdown add spaces"
             labels: "Markdown"
             delete-branch: true
             title: Markdown add spaces
             body: 格式化——Markdown 自动加空格
