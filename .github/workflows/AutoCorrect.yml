name: 🔗 AutoCorrect 空格语法检查

on: 
  repository_dispatch:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: huacnlee/autocorrect-action@557ad36c0b13e22c511426174c7dbd027976dfba
        with:
          args: "--lint --fix --no-diff-bg-color **/*.md"
       
      - name: Markdown add spaces 
        if: failure()
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Markdown add spaces"
          labels: "Markdown"
          branch: test
          title: Markdown add spaces
          body: |
            格式化——Markdown 自动加空格
