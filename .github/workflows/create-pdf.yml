name: 导出本项目中文 PDF/EPUB

# 最小权限（CodeQL actions/missing-workflow-permissions）：只检出（含外部工具仓）与上传运行工件
permissions:
  contents: read

on:
  workflow_dispatch:  # 手动触发；不写任何外部仓库、不打 tag、不发 Release，产物从本次运行工件下载
    inputs:
      letters:
        description: '只导出指定首字母区的词条（逗号分隔，如 a,b,c；留空=全部）'
        required: false
        default: ''

# 大导出耗时长，防重叠运行
concurrency:
  group: pdf-export
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ================= 字体安装部分 =================
      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y ttf-wqy-microhei ttf-wqy-zenhei fonts-noto-core fonts-noto-cjk

      - name: 设置时区
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          timedatectl

      # ================= 仓库检出部分 =================
      - name: 检出本项目
        uses: actions/checkout@v7
        with:
          path: sep-cn

      - name: 检出 gitbook-pdf-export 工具（只读使用，不回写）
        uses: actions/checkout@v7
        with:
          repository: FreeBSD-Ask/gitbook-pdf-export
          path: pdf-generator

      # ================= 环境配置部分 =================
      - name: 设置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'   # 2026-11-16 用户裁定：导出线随仓基线统一 3.15（原注「暂留 3.13」作废）

      - name: 安装 Python 依赖
        run: |
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libpangocairo-1.0-0
          pip install weasyprint mistune pygments EbookLib beautifulsoup4

      # ================= 导出范围过滤（可选） =================
      # 全量约 2500+ 词条页，weasyprint 内存压力大；可按首字母分批导出。
      # SUMMARY 为扁平结构（`## A` 分节＋词条行），且占位母行/别名参见行按
      # ADR-0057/0060 已是**无链接行**：过滤须随所属小节走，否则被排除字母的
      # 参见行与空节会残留在产物里。非字母目录（qian-yan/、guan-yu/、1/ 等）
      # 与前置区一律保留。
      - name: 按首字母过滤 SUMMARY（留空则全量）
        if: ${{ inputs.letters != '' }}
        run: |
          python - <<'PY'
          import re
          letters = {c.strip().lower() for c in "${{ inputs.letters }}".split(',') if c.strip()}
          assert letters, 'letters 输入为空'
          link = re.compile(r'\]\(([^)#]+)')
          sect = re.compile(r'^##\s+([A-Za-z])\s*$')
          with open('sep-cn/SUMMARY.md', encoding='utf-8') as f:
              src = f.readlines()
          out, section = [], None  # None＝首个字母小节之前的前置区
          for line in src:
              m = sect.match(line.strip())
              if m:
                  section = m.group(1).lower()
                  if section in letters:
                      out.append(line)
                  continue
              if section is not None and section not in letters:
                  continue
              lm = link.search(line)
              if lm:
                  seg = lm.group(1).strip().split('/')[0]
                  if len(seg) == 1 and seg.isascii() and seg.isalpha() and seg not in letters:
                      continue
              out.append(line)
          with open('sep-cn/SUMMARY.md', 'w', encoding='utf-8') as f:
              f.writelines(out)
          print('过滤后保留行数：%d（原 %d）' % (len(out), len(src)))
          PY

      # ================= PDF 生成部分 =================
      - name: 生成 PDF/EPUB
        run: |
          cd pdf-generator
          python mdconv.py ../sep-cn
          mv build/final.pdf build/SEP-CN-zh-$(date +'%Y.%m.%d').pdf
          mv build/final.epub build/SEP-CN-zh-$(date +'%Y.%m.%d').epub
        env:
          PYTHONPATH: ${{ github.workspace }}/pdf-generator

      # ================= 产物上传（不创建 Tag/Release） =================
      - name: 上传运行工件
        uses: actions/upload-artifact@v7
        with:
          name: SEP-CN-zh-${{ github.run_id }}
          path: |
            pdf-generator/build/*.pdf
            pdf-generator/build/*.epub
          retention-days: 30
          if-no-files-found: error
