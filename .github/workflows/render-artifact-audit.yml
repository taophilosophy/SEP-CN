name: 渲染产物残留审计（矩阵：四片）

# 最小权限（CodeQL actions/missing-workflow-permissions）：只读检出＋构建＋上传运行工件
permissions:
  contents: read

on:
  workflow_dispatch:  # 手动触发：全量构建约 10-20 分钟，不占 push 门禁（ADR-0019 分期转硬前的审计通道）

concurrency:
  group: render-audit
  cancel-in-progress: false

# 构建与站点部署同款：SEP_SHARD 四片矩阵并行（config.mts 按片写 dist-<shard>，
# 跨片死链照常硬失败），各片自扫自报。运行时切 bun（bun --bun x，ADR-0014/0055），
# 不再用 NODE_OPTIONS 提内存。
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [ad, ek, lp, qz]

    steps:
      - name: 检出本项目（全历史，git-stamps 需要）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: latest

      - name: 取构建壳的依赖清单（ADR-0055：依赖只在壳仓声明）
        run: |
          git clone --depth 1 https://github.com/taophilosophy/taophilosophy.github.io "$RUNNER_TEMP/site"
          cp "$RUNNER_TEMP/site/package.json" .

      - name: 安装依赖（锁文件不入库、不用缓存：每次现装）
        run: bun install

      - name: 构建 ${{ matrix.shard }} 片（与壳同款前置步骤 + VitePress）
        run: |
          bun .vitepress/prepare-assets.mjs
          bun .vitepress/prepare-gitstamps.mjs
          SEP_SHARD=${{ matrix.shard }} bun --bun x vitepress build .

      - name: 扫描本片渲染残留物（裸 **、字面 [^、链接残留、数学哨兵）
        run: |
          set -o pipefail
          python3 tools/check_render_artifacts.py ".vitepress/dist-${{ matrix.shard }}" \
            | tee "$RUNNER_TEMP/render-audit-${{ matrix.shard }}.txt"

      - name: 上传审计报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-audit-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ runner.temp }}/render-audit-${{ matrix.shard }}.txt
          retention-days: 30
          if-no-files-found: error
