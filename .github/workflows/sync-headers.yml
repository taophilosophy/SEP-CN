name: 🔗 校验 SUMMARY.md 与词条 H1 一致

# 2026-11-07 裁定（ADR-0024）：本工作流改为**只读校验**，不再 commit/push 回 main。
# 原实现按 SUMMARY 改写 H1 并直推 main，会在远端造出本地没有的提交，与并行会话的
# 本地提交分叉（2026-11-07 远端提交 a05e8968 实例），迫使本地要么放弃自有提交、
# 要么被远端内容覆盖。现分工：本地 `python tools/check_summary.py --sync-headers`
# 同步 H1；本地与 CI 用同一检查器实拦；远端永不写回，main 的写入方只有本地会话。
on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify H1 titles match SUMMARY.md
        run: python tools/check_summary.py --headers
