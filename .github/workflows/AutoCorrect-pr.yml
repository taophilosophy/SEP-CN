name: 🔗 提交时检查 Markdown 空格
on: [pull_request_target]

jobs:
  build:
    name: AutoCorrect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install autocorrect 
        run: uname -r && yarn add autocorrect-node && yarn autocorrect -V

      - name: Run autocorrect lint
        uses: reviewdog/action-setup@v1
        with: 
           reviewdog_version: latest 
        
      - name: Run autocorrect lint
        env:
             REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn autocorrect --config .autocorrectrc --lint --no-diff-bg-color $(git diff --diff-filter=AM --name-only ${{ github.event.pull_request.base.sha }}) --format rdjson | reviewdog -f=rdjson -reporter=github-pr-review
     
  
              
 
        