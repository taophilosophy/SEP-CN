name: 🔗 md-padding 自动加空格

on: 
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    name: md-padding
    runs-on: ubuntu-latest
    
    steps:
        - name: Checkout from repository
          uses: actions/checkout@v7
        
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2

        - name: Run md-padding lint
          run: find "$(pwd)" -type f -name "*.md" | bunx md-padding@latest --ignore-words='-' ':' '>' '=' '<' -f --read-files -i

        - name: Markdown add spaces
          uses: peter-evans/create-pull-request@v8
          with:
             commit-message: "Markdown add spaces"
             labels: "Markdown"
             delete-branch: true
             title: Markdown add spaces
             body: 格式化——使用 md-padding 给 Markdown 自动加空格
