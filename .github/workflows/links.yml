name: 🔗 链接检查（lychee）

# 最小权限（CodeQL actions/missing-workflow-permissions）：检出后跑链接检查，报告以 issue 反馈
permissions:
  contents: read
  issues: write

# 范围由 .github/lychee.toml 的 exclude_path 单点决定（原文 en/、镜像 yuanwen/、
# 草稿 script/、构建产物、测试夹具除外），本文件不再重复路径清单。
on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "00 18 15 * *"

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        # 不硬拦，但要保留真实退出码：`fail: true` 让 lychee 如实返回 2，
        # 再由 continue-on-error 把这一步的失败吞掉——作业保持绿，下方 issue
        # 步骤仍能凭 lychee_exit_code 拿到报告。用 `fail: false` 反而不行：
        # 那会给 lychee 加 --no-fail，退出码恒 0，issue 永远不会开（2026-11-16
        # 实测一次 dispatch：2098 处死链却零 issue）。
        # 口径依据：本项目 2500 个词条的参考书目天然带大量外部死链与限流
        # （inphoproject 跳转链、philpapers 429、doi 解析），硬失败会让月度作业
        # 长期全红、把真回归淹没；本文件头注本来就写着「报告以 issue 反馈」。
        continue-on-error: true
        with:
          fail: true
          format: markdown
          output: ./lychee/out.md
          args: --config ./.github/lychee.toml './**/*.md'

      - name: Create Issue From File
        if: env.lychee_exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: report, automated issue
