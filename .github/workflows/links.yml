name: 🔗 链接检查（lychee）

# 最小权限（CodeQL actions/missing-workflow-permissions）：检出后跑链接检查，报告以 issue 反馈
permissions:
  contents: read
  issues: write

# 范围由 .github/lychee.toml 的 exclude_path 单点决定（原文 en/、镜像 yuanwen/、
# 草稿 script/、构建产物、测试夹具除外），本文件不再重复路径清单。
on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "00 18 15 * *"

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 不硬拦：本项目 2500 个词条的参考书目天然带着大量外部死链与限流
          # （inphoproject 跳转链、philpapers 429、doi 解析），硬失败只会让
          # 月度作业长期全红、把真回归淹没。按本文件头注的既定口径——「报告以
          # issue 反馈」——保留 find 结果与 issue，退出码交给下方 issue 步骤消费。
          fail: false
          format: markdown
          output: ./lychee/out.md
          args: --config ./.github/lychee.toml './**/*.md'

      - name: Create Issue From File
        if: env.lychee_exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: report, automated issue
