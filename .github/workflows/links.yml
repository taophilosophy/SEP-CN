name: 链接检查（lychee）

# 最小权限（CodeQL actions/missing-workflow-permissions）：检出后跑链接检查，报告以 issue 反馈
permissions:
  contents: read
  issues: write

# 范围由 .github/lychee.toml 的 exclude_path 单点决定（原文 en/、镜像 yuanwen/、
# 草稿 script/、构建产物、测试夹具除外），本文件不再重复路径清单。
on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "00 18 15 * *"

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2
        # 不硬拦，但要保留真实退出码：`fail: true` 让 lychee 如实返回 2，
        # 再由 continue-on-error 把这一步的失败吞掉——作业保持绿，下方 issue
        # 步骤按 `steps.lychee.outcome == 'failure'` 取报告。用 `fail: false`
        # 反而不行：那会给 lychee 加 --no-fail，退出码恒 0，issue 永远不开
        # （2026-11-16 实测一次 dispatch：2098 处死链却零 issue）。
        # 口径依据：本项目 2500 个词条的参考书目天然带大量外部死链与限流
        # （inphoproject 跳转链、philpapers 429、doi 解析），硬失败会让月度作业
        # 长期全红、把真回归淹没；本文件头注本来就写着「报告以 issue 反馈」。
        continue-on-error: true
        with:
          fail: true
          format: markdown
          output: ./lychee/out.md
          args: --config ./.github/lychee.toml './**/*.md'

      - name: 压缩报告（issue 正文有 64 KB 上限，完整报告走 artifact）
        if: steps.lychee.outcome == 'failure'
        run: |
          mkdir -p lychee
          {
            echo 'lychee 月度链接检查：完整报告见本次运行的 artifact `lychee-report`。'
            echo
            echo '**统计**'
            echo
            grep -E '^\| (🔍|🚫|✅|⏳)' lychee/out.md | head -8 || true
            echo
            echo '**报告前 260 行**（其余见 artifact）'
            echo
            echo '```'
            head -260 lychee/out.md || true
            echo '```'
          } > lychee/issue.md
          wc -c lychee/issue.md

      - name: 归档完整报告
        if: steps.lychee.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: lychee-report
          path: lychee/out.md
          retention-days: 30

      - name: Create Issue From File
        # 判定用步骤 outcome，不用 env.lychee_exit_code：该变量在本版 action 与
        # continue-on-error 的组合下不可靠（2026-11-16 实测 2099 处死链仍跳过、
        # 零 issue）；continue-on-error 只改 conclusion，outcome 仍如实为 failure
        if: steps.lychee.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710  # v6
        with:
          title: Link Checker Report
          content-filepath: ./lychee/issue.md
          labels: report, automated issue
