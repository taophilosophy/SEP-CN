name: ✅ 仓库一致性门禁（矩阵）

# 最小权限（CodeQL actions/missing-workflow-permissions）：只读检出后跑检查器，不回写
permissions:
  contents: read

# 门禁清单不抄在本文件里：plan 作业跑 `tools/check_all.py --list-gates`，
# 把同一份 GATES 列表展开成矩阵作业（ADR-0061）。新增/改名门禁只改 tools/，
# CI 自动跟随；红灯作业名即具体门禁名，日志按门禁分开，不再一锅端。
on:
  push:
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      gates: ${{ steps.matrix.outputs.gates }}
    steps:
      - name: 只取 tools/（矩阵生成无需全文检出）
        uses: actions/checkout@v7
        with:
          sparse-checkout: tools

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: 生成门禁矩阵
        id: matrix
        run: echo "gates=$(python tools/check_all.py --list-gates)" >> "$GITHUB_OUTPUT"

  gates:
    needs: plan
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false # 一项红不影响其余项出结果，一次推送看全所有红灯
      matrix: ${{ fromJSON(needs.plan.outputs.gates) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: 执行门禁
        run: |
          set -o pipefail
          # 日志写 runner 临时区：仓库根写任何散件都会被 junk 门禁判违规（rules/05 根目录白名单）
          ${{ matrix.run }} 2>&1 | tee "$RUNNER_TEMP/gate-${{ matrix.key }}.txt"

      - name: 失败时归档日志与报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-${{ matrix.key }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gate-${{ matrix.key }}.txt
            state/image-report.md
          retention-days: 14
          if-no-files-found: ignore

# baseline_audit.py / en_integrity.py 依赖本地 en/ 原始物，compare.py、drift_scan.py
# 依赖网络抓取：均只本地跑，不进 CI（rules/05）。
# 规则见 rules/05-ci-and-tools.md；变更本工作流须同步该表。
